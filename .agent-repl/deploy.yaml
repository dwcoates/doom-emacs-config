# THE PREVIOUS SCHEMA, KEPT FOR THE DAEMON BUILDS THAT PREDATE
# .agent-repl/lifecycle.yaml. No current build reads this file: a daemon
# built before lifecycle.yaml reads it to gate and land the change that
# introduces lifecycle.yaml. Delete it once no running daemon predates that
# change (org/todo.md).
# agent-repl's own deploy (repoconfig.v1.DeployConfig, documented in the
# /agent-repl-workspaces skill). A finished workspace's branch is rebased onto
# master, tested by agent-repl's suites, landed as a merge commit and tagged;
# then the running runtime is redeployed by the deploy hook.
pre_deploy:
  local_merge:
    tests:
      agent_repl_suites:
        script_path: modules/app/agent-repl/bin/test-all.sh
    version_tag: {}
deploy:
  hook:
    script:
      path: modules/app/agent-repl/bin/deploy-landing.sh
      timeout_seconds: 60
  runs_for:
    main: {}
# Once the queue fully depletes, master is pushed to origin as a release.
queue_drained:
  - path: modules/app/agent-repl/bin/push-release.sh
    timeout_seconds: 120
