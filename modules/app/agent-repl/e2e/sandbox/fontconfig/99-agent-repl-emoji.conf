<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Color emoji for the agent-repl e2e sandbox.

  WHY THIS EXISTS: a playtest photographs the running application, and two of
  the surfaces it photographs carry emoji — the metaprompt's tree glyphs
  (🎯 and friends) that the shim streams into the webapp, and the tab-bar
  glyphs the Emacs frame paints. Without a color emoji font installed AND
  reachable by fallback, both draw as tofu boxes, and a picture of tofu cannot
  be reviewed against its manifest sentence.

  Installing fonts-noto-color-emoji is not by itself enough for either
  renderer here. The image carries almost no other fonts, so the generic
  families resolve to whatever DejaVu-ish face is present first, and neither
  Emacs's pgtk font backend nor WebKit walks past a family that matched to
  find a face that actually has the codepoint unless fontconfig's own fallback
  list offers one. So Noto Color Emoji is appended to each generic family:
  it is never PREFERRED (a Latin glyph still comes from the text face that
  matched), it is only there to be found when nothing earlier has the glyph.

  99- puts this after the distro's own conf.d entries, so it appends to a
  fallback list that is already built rather than being rewritten by one.
-->
<fontconfig>
  <!-- Make the bare family name resolvable, so `fc-match emoji` answers and
       a page or a face may name it outright. -->
  <alias binding="same">
    <family>emoji</family>
    <prefer><family>Noto Color Emoji</family></prefer>
  </alias>

  <!-- The fallback itself: last resort for every generic family. -->
  <alias binding="same">
    <family>sans-serif</family>
    <accept><family>Noto Color Emoji</family></accept>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <accept><family>Noto Color Emoji</family></accept>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <accept><family>Noto Color Emoji</family></accept>
  </alias>
</fontconfig>
