<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Color emoji for the agent-repl e2e sandbox.

  WHY THIS EXISTS: a playtest photographs the running application, and two of
  the surfaces it photographs carry emoji — the metaprompt's tree glyphs
  (🎯 and friends) that the shim streams into the webapp, and the tab-bar
  glyphs the Emacs frame paints. Without a color emoji font installed AND
  reachable by fallback, both draw as tofu boxes, and a picture of tofu cannot
  be reviewed against its manifest sentence.

  Installing fonts-noto-color-emoji is not by itself enough for either
  renderer here. The image carries almost no other fonts, so the generic
  families resolve to whatever DejaVu-ish face is present first, and neither
  Emacs's pgtk font backend nor WebKit walks past a family that matched to
  find a face that actually has the codepoint unless fontconfig's own fallback
  list offers one. So Noto Color Emoji is appended to each generic family:
  it is never PREFERRED (a Latin glyph still comes from the text face that
  matched), it is only there to be found when nothing earlier has the glyph.

  99- puts this after the distro's own conf.d entries, so it appends to a
  fallback list that is already built rather than being rewritten by one.

  THE BINDING IS WEAK, AND THAT IS THE WHOLE RULE. It was `binding="same"`,
  and `same` means the appended family inherits the binding the REQUESTED
  family had — strong, for a family an application names. fontconfig ranks a
  strong family match above a weak one, and the distro's own DejaVu entries
  in these same lists are bound weakly, so Noto Color Emoji outranked DejaVu
  for every codepoint BOTH fonts carry. Measured in the image that shipped
  that rule:

      fc-match sans-serif                 -> Noto Color Emoji
      fc-match sans-serif:charset=0030    -> Noto Color Emoji   ("0")
      fc-match sans-serif:charset=006b    -> DejaVu Sans        ("k")

  Noto Color Emoji's charset is emoji plus U+0020, U+0023, U+002A and
  U+0030-U+0039 — the pieces of a keycap sequence — and nothing else Latin.
  So letters fell through to DejaVu and looked right, while every SPACE and
  every DIGIT was drawn by the emoji font: uncolorable (a color bitmap
  ignores the CSS `color` and the Emacs face) and laid out on emoji advance
  widths. Owner 10 photographed it as "3 . 2 k" — the digits byte-identical
  gray between runs whose CSS color differed, beside a "k" that followed the
  color. Every number in every playtest capture was wrong.

  With the binding weak, the emoji font joins each list weakly and AFTER the
  weak entries already in it, so a text face wins wherever it has the glyph
  and the emoji font is still reached for the codepoints no text face here
  carries. That is exactly "last resort", and it is expressible in the
  binding alone: no charset surgery on the font is needed, and none is done,
  so a keycap sequence still composes out of this font.
-->
<fontconfig>
  <!-- Make the bare family name resolvable, so `fc-match emoji` answers and
       a page or a face may name it outright. Weak, like every alias here:
       no other font in the image claims the family, so a weak bind still
       lands on it, and a strong one would let "emoji" outrank a real family
       anywhere the two are asked for together. -->
  <alias binding="weak">
    <family>emoji</family>
    <prefer><family>Noto Color Emoji</family></prefer>
  </alias>

  <!-- The fallback itself: last resort for every generic family. -->
  <alias binding="weak">
    <family>sans-serif</family>
    <accept><family>Noto Color Emoji</family></accept>
  </alias>
  <alias binding="weak">
    <family>serif</family>
    <accept><family>Noto Color Emoji</family></accept>
  </alias>
  <alias binding="weak">
    <family>monospace</family>
    <accept><family>Noto Color Emoji</family></accept>
  </alias>
</fontconfig>
