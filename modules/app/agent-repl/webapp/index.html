<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>claude-repl</title>
  </head>
  <body>
    <!-- THE SHELL.

         Every id below is a MOUNT POINT and nothing else: the page ships
         empty, and each component (src/sidebar, src/topbar, src/feed,
         src/tray, src/footer, src/composer, src/login, src/failure,
         src/lifecycle) draws its whole view into the host it is mounted on and
         redraws it whole on every push. Nothing here is markup a renderer
         reconciles against, so the shell can be read as the layout it is.

         `src/shell.ts` resolves these ids once at boot and fails loudly by
         name if one is missing; the ids and the data-component hooks are the
         contract the integration suite targets, so neither is renamed lightly. -->

    <!-- The workspaces rail: a flex sibling docked left of the main column.
         Ships hidden so a session that never receives a roster keeps the
         single-column layout; the sidebar reveals it on its first push. -->
    <nav id="ws-sidebar" data-component="sidebar" hidden></nav>

    <div id="main-col">
      <!-- The thin top strip: account and connectivity left, flexing title
           centered, model selector / context chip / warning chip right. Its
           reveals render below the strip, clamped in-viewport. -->
      <header id="topbar" data-component="topbar"></header>

      <!-- The scheduled-restart banner: standing and page-wide while the
           daemon holds a drain lease. Empty (and so collapsed) otherwise. -->
      <div id="drain-banner" data-component="drain-banner"></div>

      <!-- THE SCROLL ZONE owns the conversation's scrolling, so the feed and
           the hold tray move together: the tray is the feed's TAIL region, not
           chrome docked under it, and a reader scrolled to the bottom sees the
           held prompts sitting after the last row. -->
      <div id="feed-scroll" class="scroll-zone">
        <main id="feed" data-feed="root"></main>
        <!-- Held prompts and daemon-posed offers, whole-list-replaced. -->
        <section id="hold-tray" data-component="hold-tray"></section>
      </div>

      <!-- The status footer: docked at the window's bottom rather than
           floating under the last row, so the strip stays put as the feed
           grows. Outside the scroll zone for exactly that reason. -->
      <footer id="footer" data-component="footer"></footer>

      <!-- The composer. Production runs COMPOSER-LESS -- the root composer is
           host-native (Emacs) -- so this ships hidden and is revealed only by
           the dev-mode `&composer=1` boot. Per-bubble composers do not live
           here; the feed mounts those inside their bubbles. -->
      <div id="composer" data-component="composer" hidden></div>
    </div>

    <!-- Page-wide overlays, outside the main column because they cover it. -->
    <!-- The full-screen login terminal: the daemon owns the pty, this is where
         it is drawn. Hidden until an account action opens it. -->
    <div id="login-overlay" data-component="login-overlay" hidden></div>
    <!-- The daily Claude news digest: drawn over the FEED's own box (it
         follows #feed-scroll's rectangle) in every webview while it stands.
         Hidden until the daemon pushes a digest. -->
    <div id="news-digest" data-component="news-digest" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
