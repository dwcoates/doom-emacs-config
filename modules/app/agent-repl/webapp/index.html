<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>claude-repl</title>
  </head>
  <body>
    <!-- The workspaces rail (sidebar.ts): a flex sibling docked left of the
         main column. Hidden until Emacs pushes the first roster, so a
         bare-browser session keeps the single-column layout. -->
    <nav id="ws-sidebar" hidden></nav>
    <!-- The main column: topbar over feed over composer. -->
    <div id="main-col">
      <header id="topbar">
        <span id="conn-status">connecting…</span>
        <span id="spinner" class="spinner">●</span>
        <button id="account" title="the Claude account this session runs as — click for account actions"></button>
        <span id="remediation"></span>
        <!-- The session's one-line "current objective" (§2.14), absolute-
             centered over the topbar. Out of the flex flow so it never
             shifts the left cluster or the right pickers; empty (and so
             invisible) until the first completed turn is summarized. -->
        <span id="task-summary" class="topbar-summary" title=""></span>
        <span id="session-info" class="topbar-info"></span>
        <select id="model-select" title="model"></select>
        <!-- Only modes a RUNNING session can switch into. `delegate` is not
             here because the CLI rejects it outright, and `bypassPermissions`
             is not here because it is launch-only ("the session was not
             launched with --dangerously-skip-permissions"). Both used to be
             offered and both silently did nothing. -->
        <select id="mode-select" title="permission mode">
          <option value="default">default</option>
          <option value="acceptEdits">acceptEdits</option>
          <option value="plan">plan</option>
          <option value="auto">auto</option>
          <option value="manual">manual</option>
          <option value="dontAsk">dontAsk</option>
        </select>
      </header>
      <!-- The account chip's dropdown: one re-auth verb for the current
           account, one switch verb per other canonical root. Built on open
           from the daemon's roster, so the identities are live. -->
      <div id="account-menu" hidden></div>
      <!-- The ungated-session banner (ungated.ts): filled whenever the session
           runs under a permission mode that shadows canUseTool in the
           fail-OPEN direction (bypassPermissions), which leaves the daemon
           with NO permission gate at all. Empty (and so collapsed via :empty)
           for every gated session, and deliberately carries no dismiss
           control — it is a pure function of the live mode, re-rendered from
           state on every chrome frame. -->
      <div id="ungated-banner"></div>
      <!-- The scheduled-shutdown drain banner (drain.ts): filled whenever the
           daemon holds a drain lease, i.e. a bounce is scheduled and is
           waiting on the workspaces it enumerates. GLOBAL, not per-workspace:
           while the lease is held no new turn starts anywhere, so a reader
           whose own session is idle still needs to see it. Empty (and so
           collapsed via :empty) whenever the lease is idle, and carries no
           dismiss control — it is a pure function of the live lease. -->
      <div id="drain-banner"></div>
      <!-- The compaction-in-progress banner slot: filled with an indeterminate
           "Compacting conversation…" bar while a /compact runs, empty (and so
           collapsed) otherwise. -->
      <div id="compact-progress-slot"></div>
      <!-- RETIRED (F4): the degraded-state banner lived here. Degradation is
           now a self-resolving failure card IN the feed, because a user whose
           workspace changed color needs to find out why from the conversation
           rather than from chrome that scrolls away. -->
      <main id="feed"></main>
      <!-- The consolidated progress footer's slot (progress-footer.ts): THE
           in-flight indicator, a flex sibling wedged between the scrolling
           feed and the composer so the dock stays stuck to the window's
           bottom rather than floating just under the last bubble as the feed
           grew. It replaced the scattered tail rows (thinking / working /
           retrying) and the live turn-stats row that used to render here.
           Empty (and so collapsed via :empty) before the daemon resolves its
           first ProgressView. -->
      <div id="progress-footer"></div>
      <!-- The feed search's echo area: `C-s` in the composer starts an
           incremental search over the feed, and the query, the position among
           the matches, and any folds the search could not reach are reported
           here rather than in the composer, which keeps its draft. Empty (and
           so collapsed) whenever no search is running. -->
      <footer id="composer">
        <div id="search-status"></div>
        <!-- The merge gate's notice (merge-gate.ts): why the composer below is
             disabled while the merge coordinator owns this workspace's
             session. Empty (and so collapsed via :empty) whenever no lease is
             held. It sits INSIDE the composer, next to the control it
             explains, rather than in the topbar where the composer's own
             greyed-out state would read as a bug. -->
        <div id="merge-gate-notice"></div>
        <textarea id="composer-input" rows="3" placeholder="Message Claude… (Enter to send, Shift+Enter for newline)"></textarea>
        <button id="send-btn">send</button>
      </footer>
    </div>
    <!-- The login terminal. Hidden until the login button opens it: the
         daemon owns the pty, this is where it gets rendered, and a human
         drives it exactly as they drove the vterm it replaces. It is
         position:fixed, so it stays outside #main-col. -->
    <div id="login-overlay" hidden>
      <div id="login-panel">
        <header id="login-header">
          <span id="login-title">Claude login</span>
          <span id="login-account"></span>
          <button id="login-close" title="close the login terminal">close</button>
        </header>
        <div id="login-term"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
