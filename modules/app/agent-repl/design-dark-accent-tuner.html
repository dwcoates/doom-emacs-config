<!doctype html>
<meta charset="utf-8">
<title>agent-repl dark accent colors: before and after</title>
<script>
// Shared by the overrides below and the renderer.
const toLin = c => (c /= 255) <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
function hexToOklch(hex) {
  const [r, g, b] = [1, 3, 5].map(i => toLin(parseInt(hex.slice(i, i + 2), 16)));
  const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
  const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
  const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
  const L = 0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s;
  const A = 1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s;
  const B = 0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s;
  return [L, Math.hypot(A, B), (Math.atan2(B, A) * 180 / Math.PI + 360) % 360];
}
const hexToOklchHue = hex => hexToOklch(hex)[2];
// ===================== DEFAULTS (edited by the agent on request) =====================
// Every accent keeps its hue. "After" moves each one to a shared lightness and
// caps its chroma (color strength), which is what makes a set read pastel.
const DEFAULTS = {
  // Less muted than the first pass (0.80 / 0.085), in steps (0.11, 0.125, 0.14), then the
  // owner's own slider at 0.215 (2026-10-17), the values that shipped.
  ink: { lightness: 0.79, chroma: 0.215 },
};
// The one red status red and the cleared rule share (owner, 2026-10-17): deeper and
// stronger than the pastel set, taken slightly less intense on a second look, then a
// touch more intense with the whole set.
const RED = { hue: 24, lightness: 0.69, chroma: 0.16 };
// THE ONE PURPLE (owner, 2026-10-17): every purple wears the tool title's purple, at the
// tool title's own hue, near master's #9370db in strength (L 0.627, C 0.158) and a touch
// lighter for the dark ground.
const TOOL_PURPLE = { hue: hexToOklchHue("#9370db"), lightness: 0.66, chroma: 0.185 };
// Skill names sit on the blue prompt bubble, where the one purple blends in (1.76:1). They
// keep today's light purple, #f0c4ff (3.89:1 on #0764c2), the one purple the set leaves as
// it is (owner, 2026-10-17).
const KEEP = { keep: true };
// The current dark-theme accents: [name, hex, role, per-accent override]. An override sets
// that accent's own hue, lightness or chroma, or keeps it as it is today.
const ACCENTS = [
  ["status blue (--init)",            "#3366cc", "ink"],
  ["status purple (--blocked)",       "#e879f9", "ink", TOOL_PURPLE],
  // Status red takes the cleared rule's deeper red (owner, 2026-10-17).
  ["status red (--err)",              "#dc2626", "ink", RED],
  ["status turquoise (--turquoise)",  "#22d3ee", "ink"],
  ["status yellow (--async)",         "#fbbf24", "ink"],
  ["status green (--ok)",             "#16a34a", "ink"],
  ["--tool-title",                    "#9370db", "ink", TOOL_PURPLE],
  ["--thinking (running, thinking)",  "#fb923c", "ink"],
  ["--retry",                         "#a78bfa", "ink", TOOL_PURPLE],
  ["--accent",                        "#2563eb", "ink"],
  ["--selected-entry",                "#60a5fa", "ink"],
  ["--final-response",                "#4ade80", "ink"],
  // Compact and clear sat 22 degrees of hue apart at one lightness, so they blurred.
  // Compact moves to a light amber, clear to a deeper, stronger red.
  ["--compact-rule",                  "#f97316", "ink", { hue: 68, lightness: 0.85 }],
  ["--clear-divider",                 "#ef4444", "ink", RED],
  ["--q-border / --merge-border",     "#facc15", "ink"],
  ["--hibernated",                    "#2dd4bf", "ink"],
  ["--known-command (skill names)",   "#f0c4ff", "ink", KEEP],
  ["--info-ws",                       "#4ade80", "ink"],
  ["--info-model",                    "#22d3ee", "ink"],
  ["--info-tokens",                   "#fbbf24", "ink"],
  ["--info-time",                     "#93c5fd", "ink"],
  ["--info-agents",                   "#c4b5fd", "ink", TOOL_PURPLE],
  ["--info-tasks",                    "#fda4af", "ink"],
  ["--hl-keyword (code keywords)",    "#c084fc", "ink", TOOL_PURPLE],
];
// THE EMACS TABS WEAR THE STATUS COLORS THEMSELVES (owner, 2026-10-17): one color per
// status everywhere. "Before" shows the tab fills Emacs draws today; "after" fills each tab
// with its status's color from ACCENTS, and the tab's text picks black or white on it.
// [tab label, today's Emacs fill, index of its status color in ACCENTS]
const TABS = [
  ["daemon-fault", "#3366cc", 0], ["land-palette", "#a21caf", 1], ["footer-tiers", "#cc3333", 2],
  ["vendor-retry", "#0891b2", 3], ["async-agents", "#f59e0b", 4], ["queen-model",  "#1a7a1a", 5],
];
// =====================================================================================
</script>
<style>
  :root { --bg:#151514; --fg:#f1efe9; --muted:#898782; --border:#2c2c2b; --panel:#1a1a19; --sidebar:#111110; --card:#232322; --composer:#1a1a19; }
  body { margin:0; background:#000; color:#ddd; font:13px -apple-system,system-ui,sans-serif; }
  header { padding:14px 20px; display:flex; gap:28px; align-items:center; flex-wrap:wrap; border-bottom:1px solid #222; background:#0a0a0a; position:sticky; top:0; z-index:2; }
  header h1 { font-size:15px; font-weight:600; margin:0; }
  .ctl { display:grid; grid-template-columns:auto 160px 48px; gap:8px; align-items:center; }
  .ctl output { font:11px ui-monospace,Menlo,monospace; color:#aaa; }
  button { background:#222; color:#ddd; border:1px solid #333; border-radius:5px; padding:4px 10px; cursor:pointer; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:20px; padding:20px; }
  .col h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:#888; margin:0 0 8px; }
  .app { background:var(--bg); color:var(--fg); border-radius:10px; padding:10px; display:flex; gap:10px; }
  aside { width:210px; flex:none; background:var(--sidebar); border-radius:10px; padding:4px 0; }
  .row { display:flex; align-items:center; gap:8px; padding:5px 12px; white-space:nowrap; overflow:hidden; }
  .row .n { color:var(--muted); width:1em; }
  .dot { width:9px; height:9px; border-radius:50%; background:currentColor; flex:none; }
  .row .lbl { color:var(--muted); font-size:11px; margin-left:auto; }
  main { flex:1; min-width:0; display:flex; flex-direction:column; gap:9px; }
  .top { display:flex; gap:12px; font-size:12px; color:var(--muted); padding:4px 6px 8px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .bub { background:var(--panel); border-radius:14px; padding:8px 11px; line-height:1.45; }
  .tool { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:7px 11px; font:12px ui-monospace,Menlo,monospace; }
  .tool .name { font-weight:600; margin-right:8px; }
  .tool .cmd { color:var(--muted); }
  .tool .run { float:right; }
  .pulse { animation:pulse 1s infinite; } @keyframes pulse { 50% { opacity:.35; } }
  .rule { display:flex; align-items:center; gap:8px; font-size:11px; }
  .rule::before, .rule::after { content:""; flex:1; border-top:1px solid currentColor; }
  .gate { border:1px solid; border-radius:10px; padding:7px 11px; }
  .sel { border:2px solid; border-radius:14px; padding:7px 10px; background:var(--panel); }
  .tabs { display:flex; gap:3px; margin-top:12px; background:#1d1f21; padding:4px; border-radius:6px; flex-wrap:wrap; }
  .tab { padding:3px 10px; border-radius:3px; font:12px Menlo,monospace; }
  .sw { display:grid; grid-template-columns:1fr; gap:2px; margin-top:12px; }
  .sw div { display:flex; align-items:center; gap:8px; font:11px ui-monospace,Menlo,monospace; color:#aaa; }
  .sw span { width:14px; height:14px; border-radius:3px; flex:none; }
  textarea { width:calc(100% - 40px); margin:0 20px 20px; height:150px; background:#111; color:#ccc; border:1px solid #222; font:11px ui-monospace,Menlo,monospace; }
</style>

<header>
  <h1>Dark accents: before → after (pastel)</h1>
  <div class="ctl"><span>Lightness</span><input id="inkL" type="range" min="0.55" max="0.92" step="0.005"><output></output></div>
  <div class="ctl"><span>Chroma cap</span><input id="inkC" type="range" min="0.02" max="0.25" step="0.0025"><output></output></div>
  <button id="reset">Reset to defaults</button>
</header>

<div class="cols">
  <div class="col" id="before"><h2>Before (current)</h2></div>
  <div class="col" id="after"><h2>After</h2></div>
</div>
<textarea id="out" readonly></textarea>

<template id="mock">
  <div class="app">
    <aside>
      <div class="row" style="color:var(--a0)"><span class="n">1</span><span class="dot"></span>daemon-fault<span class="lbl">blue</span></div>
      <div class="row" style="color:var(--a1)"><span class="n">2</span><span class="dot"></span>land-palette<span class="lbl">purple</span></div>
      <div class="row" style="color:var(--a2)"><span class="n">3</span><span class="dot pulse"></span>footer-tiers<span class="lbl">red</span></div>
      <div class="row" style="color:var(--a3)"><span class="n">4</span><span class="dot"></span>vendor-retry<span class="lbl">turquoise</span></div>
      <div class="row" style="color:var(--a4)"><span class="n">5</span><span class="dot"></span>async-agents<span class="lbl">yellow</span></div>
      <div class="row" style="color:var(--a5)"><span class="n">6</span><span class="dot"></span>queen-model<span class="lbl">green</span></div>
      <div class="row" style="color:var(--muted)"><span class="n">7</span><span class="dot"></span>closed-one<span class="lbl">grey</span></div>
    </aside>
    <main>
      <div class="top">
        <span style="color:var(--a17)">doom</span><span style="color:var(--a18)">opus-5-5</span><span style="color:var(--a19)">42k tokens</span>
        <span style="color:var(--a20)">3m 12s</span><span style="color:var(--a21)">3 agents</span><span style="color:var(--a22)">2 tasks</span>
      </div>
      <div class="bub">Run <span style="color:var(--a16)">/merge-queue</span> once the <span style="color:var(--a9);text-decoration:underline">palette</span> lands: <code style="font:12px Menlo,monospace"><span style="color:var(--a29)">const</span> x = 1</code></div>
      <div class="bub" style="align-self:flex-end;background:#0764c2;color:#fff">use <span style="color:var(--a16)">/merge-queue</span> async, then <span style="color:#0a2a5e;text-decoration:underline">a link</span></div>
      <div class="tool"><span class="name" style="color:var(--a6)">Bash</span><span class="cmd">npm test -- styles.test.ts</span><span class="run pulse" style="color:var(--a7)">● running…</span></div>
      <div class="tool"><span class="name" style="color:var(--a6)">Read</span><span class="cmd">lisp/status.el</span><span class="run" style="color:var(--a8)">↻ retry 2</span></div>
      <div class="rule" style="color:var(--a12)">compacted</div>
      <div class="rule" style="color:var(--a13)">cleared</div>
      <div class="gate" style="border-color:var(--a14)"><b style="color:var(--a14)">?</b> Which option should replace F?</div>
      <div class="sel" style="border-color:var(--a10)">A selected response, <span style="color:var(--a11)">final ✓</span>, <span style="color:var(--a15)">hibernated ❄</span></div>
      <div style="font-size:12px;color:var(--muted)"><span class="pulse" style="color:var(--a7)">●</span> thinking…</div>
    </main>
  </div>
  <div class="tabs">
    <span class="tab" style="background:#c0c0c0;color:#000">selected</span>
  </div>
  <div class="sw"></div>
</template>

<script>
function oklchToLinear(L, C, H) {
  const h = H * Math.PI / 180, a = C * Math.cos(h), b = C * Math.sin(h);
  const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
  const m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
  const s = (L - 0.0894841775 * a - 1.2914855480 * b) ** 3;
  return [4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
         -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
         -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s];
}
// Lowers chroma until the color fits sRGB, so a hue never shifts when clipped.
function oklchToHex(L, C, H) {
  let rgb = oklchToLinear(L, C, H);
  while (rgb.some(c => c < -1e-4 || c > 1 + 1e-4) && C > 0) { C -= 0.002; rgb = oklchToLinear(L, Math.max(C, 0), H); }
  return "#" + rgb.map(c => { c = Math.min(1, Math.max(0, c)); const v = c <= 0.0031308 ? 12.92 * c : 1.055 * c ** (1 / 2.4) - 0.055; return Math.round(v * 255).toString(16).padStart(2, "0"); }).join("");
}
const luminance = hex => { const [r, g, b] = [1, 3, 5].map(i => toLin(parseInt(hex.slice(i, i + 2), 16))); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
const textOn = hex => (luminance(hex) + 0.05) / 0.05 >= 1.05 / (luminance(hex) + 0.05) ? "#000000" : "#ffffff";

let state = structuredClone(DEFAULTS);
// A role's chroma is a CAP on the accent's own; an override's chroma is the chroma itself,
// so accents that share an override come out as one color whatever their source.
const pastel = (hex, role, own = {}) => {
  if (own.keep) return hex;
  const [, C, H] = hexToOklch(hex);
  const t = state[role];
  return oklchToHex(own.lightness ?? t.lightness, own.chroma ?? Math.min(C, t.chroma), own.hue ?? H);
};

function paint(colId, colorOf) {
  const col = document.getElementById(colId);
  col.querySelectorAll(":scope > :not(h2)").forEach(n => n.remove());
  col.append(document.getElementById("mock").content.cloneNode(true));
  const app = col.querySelector(".app");
  const colors = ACCENTS.map(([, hex, role, own]) => colorOf(hex, role, own));
  colors.forEach((c, i) => app.style.setProperty(`--a${i}`, c));
  col.querySelector(".tabs").prepend(...TABS.map(([label, today, status]) => {
    const t = document.createElement("span");
    const fill = colId === "after" ? colors[status] : today;
    t.className = "tab"; t.textContent = label;
    t.style.background = fill; t.style.color = textOn(fill);
    return t;
  }));
  col.querySelector(".sw").innerHTML = ACCENTS.map(([name], i) => `<div><span style="background:${colors[i]}"></span>${colors[i]} ${name}</div>`).join("");
  return colors;
}

function render() {
  for (const [id, role, key] of [["inkL", "ink", "lightness"], ["inkC", "ink", "chroma"]]) {
    const el = document.getElementById(id); el.value = state[role][key]; el.nextElementSibling.textContent = state[role][key];
  }
  paint("before", hex => hex);
  const after = paint("after", pastel);
  document.getElementById("out").value =
    JSON.stringify({ ink: state.ink }) + "\n\n" +
    ACCENTS.map(([name, hex], i) => `${name}: ${hex} -> ${after[i]}`).join("\n");
}
for (const [id, role, key] of [["inkL", "ink", "lightness"], ["inkC", "ink", "chroma"]]) {
  document.getElementById(id).addEventListener("input", e => { state[role][key] = +e.target.value; render(); });
}
document.getElementById("reset").onclick = () => { state = structuredClone(DEFAULTS); render(); };
render();
</script>
