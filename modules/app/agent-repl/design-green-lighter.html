<!doctype html>
<meta charset="utf-8">
<title>agent-repl: green a touch lighter</title>
<script>
// ===================== OPTIONS (edited by the agent on request) =====================
// The shipped dark green, stepped UP in OKLCH lightness with hue and chroma kept.
const GREEN = "#1a7a1a";
const STEPS = [
  { name: "Today", dL: 0 },
  { name: "A touch lighter", dL: 0.03 },
  { name: "Lighter", dL: 0.06 },
  { name: "Lighter still", dL: 0.09 },
  { name: "Lightest", dL: 0.12 },
];
// The rest of the set, for context, as it ships today.
const OTHERS = { red: "#c44746", blue: "#7295d7", purple: "#9f74f4", turquoise: "#1cd1ec", yellow: "#eab00b" };
// =====================================================================================
</script>
<style>
  body { margin:0; background:#000; color:#ddd; font:13px -apple-system,system-ui,sans-serif; padding:20px; }
  h1 { font-size:15px; font-weight:600; margin:0 0 4px; }
  p { color:#888; margin:0 0 16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(400px,1fr)); gap:18px; }
  h2 { font-size:13px; margin:0 0 2px; }
  .hex { color:#888; font:11px ui-monospace,Menlo,monospace; margin-bottom:6px; }
  .stage { background:#151514; color:#f1efe9; padding:10px; border-radius:10px; display:flex; flex-direction:column; gap:8px; }
  aside { background:#111110; border-radius:8px; padding:4px 0; }
  .row { display:flex; align-items:center; gap:7px; padding:4px 11px; }
  .dot { width:9px; height:9px; border-radius:50%; flex:none; }
  .row .n { color:#898782; width:1em; font-size:12px; }
  .tabs { display:flex; gap:3px; background:#1d1f21; padding:4px; border-radius:6px; flex-wrap:wrap; }
  .tab { padding:3px 9px; border-radius:3px; font:12px Menlo,monospace; font-weight:bold; }
  .rule { display:flex; align-items:center; gap:8px; font-size:11px; }
  .rule::before, .rule::after { content:""; flex:1; border-top:1px solid currentColor; }
  .bub { background:#1a1a19; border-radius:12px; padding:7px 10px; }
  .badge { display:inline-block; border:1px solid currentColor; border-radius:5px; padding:0 6px; font-size:11px; margin-right:6px; }
</style>
<h1>Green, a touch lighter</h1>
<p>Each panel steps the shipped green up in lightness, keeping its hue and strength. The tab text picks black or white on each fill, as Emacs does.</p>
<div class="grid" id="grid"></div>
<script>
const toLin = c => (c /= 255) <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
function hexToOklch(hex) {
  const [r, g, b] = [1, 3, 5].map(i => toLin(parseInt(hex.slice(i, i + 2), 16)));
  const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
  const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
  const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
  return [0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s,
          Math.hypot(1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s, 0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s),
          (Math.atan2(0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s, 1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s) * 180 / Math.PI + 360) % 360];
}
function oklchToHex(L, C, H) {
  const lin = (C2) => { const h = H * Math.PI / 180, a = C2 * Math.cos(h), b = C2 * Math.sin(h);
    const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3, m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3, s = (L - 0.0894841775 * a - 1.2914855480 * b) ** 3;
    return [4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s, -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s, -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s]; };
  let rgb = lin(C);
  while (rgb.some(c => c < -1e-4 || c > 1 + 1e-4) && C > 0) { C -= 0.002; rgb = lin(Math.max(C, 0)); }
  return "#" + rgb.map(c => { c = Math.min(1, Math.max(0, c)); const v = c <= 0.0031308 ? 12.92 * c : 1.055 * c ** (1 / 2.4) - 0.055; return Math.round(v * 255).toString(16).padStart(2, "0"); }).join("");
}
const lum = hex => { const [r, g, b] = [1, 3, 5].map(i => toLin(parseInt(hex.slice(i, i + 2), 16))); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
const ratio = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
const ink = hex => ratio("#ffffff", hex) >= ratio("#000000", hex) ? "#ffffff" : "#000000";
const step = (hex, dL) => { const [L, C, H] = hexToOklch(hex); return dL === 0 ? hex : oklchToHex(L + dL, C, H); };

const grid = document.getElementById("grid");
for (const { name, dL } of STEPS) {
  const green = step(GREEN, dL);
  const tab = (label, fill) => `<span class="tab" style="background:${fill};color:${ink(fill)}">${label}</span>`;
  const cell = document.createElement("div");
  cell.innerHTML = `<h2>${name}</h2>
    <div class="hex">green ${green} (${ratio(green, "#151514").toFixed(2)}:1 on the feed)</div>
    <div class="stage">
      <aside>
        <div class="row"><span class="n">1</span><span class="dot" style="background:${green}"></span>queen-model</div>
        <div class="row"><span class="n">2</span><span class="dot" style="background:${green}"></span>metrics-o11y</div>
        <div class="row"><span class="n">3</span><span class="dot" style="background:${OTHERS.red}"></span>footer-tiers</div>
        <div class="row"><span class="n">4</span><span class="dot" style="background:${OTHERS.blue}"></span>daemon-fault</div>
        <div class="row"><span class="n">5</span><span class="dot" style="background:${OTHERS.purple}"></span>land-palette</div>
      </aside>
      <div class="tabs">${tab("[1] queen-model", green)}${tab("[2] metrics-o11y", green)}${tab("[3] footer-tiers", OTHERS.red)}${tab("[4] daemon-fault", OTHERS.blue)}${tab("[5] async", OTHERS.yellow)}</div>
      <div class="bub"><span class="badge" style="color:${green}">done</span><span style="color:${green}">✓ final response</span></div>
    </div>`;
  grid.append(cell);
}
</script>
