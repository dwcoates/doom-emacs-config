// external.proto — the half of a record that is allowed to leave the shim.
//
// THIS IS THE ONLY FILE IN THIS PACKAGE THE DAEMON MAY IMPORT, along with what
// it transitively pulls in (message.proto, bookkeeping.proto, and their
// payloads). entry.proto and unsupported.proto are shim-side files, and a
// daemon source file that imports either is a defect — see the import
// discipline note in entry.proto.
//
// The split exists because the daemon was reading shim implementation details
// (which observation plane produced a record, what key the store deduped it on)
// in order to make decisions it should have been making from the record's own
// meaning. Fields it must not act on are not filtered out of its view; they are
// in a file its build never sees, so a read of one does not compile.

syntax = "proto3";

package protocol.v1;

import "protocol/v1/bookkeeping.proto";
import "conversation/v1/message.proto";

option go_package = "agentrepl/proto/protocol/v1;protocolv1";

// Everything about a record that is eligible to cross the shim→daemon wire.
//
// IT IS A SUBTREE OF THE STORED RECORD, not a projection of it. Producing the
// daemon's view is the field access `entry.external`, so there is no mapping
// function that can forget a field, drift from the record it came from, or be
// updated on one side only.
//
// NO POSITION FIELD, deliberately. The store's `seq` rides the delivery
// envelope in protocol.v1 (entry-delivery.proto), because a position is
// the store's addressing rather than a fact about a conversation — and because
// entries that never reach the store have no position, so there must be no slot
// for one to be put in wrongly. A daemon that advanced its resume cursor past a
// position the store never assigned would resume from a seq that does not
// exist, which loses history silently.
message ExternalEntry {
  // Which conversation this belongs to. The vendor's session identity, which is
  // the only thing every producer and the store already agree on.
  string session_id = 1;

  // The producer's wall clock at observation, in unix millis. What a reader
  // DISPLAYS, and what the durable turn ledger subtracts to time a turn
  // (sessioncontroller/accounting.go builds PromptToResultMs from two of
  // these).
  //
  // ON THE ENVELOPE RATHER THAN ON MessageEntry, because a bookkeeping entry
  // happened at a moment too: a turn boundary has a time whether or not
  // anything draws it, and putting the field only on messages would leave the
  // ledger's timing block underivable rather than merely unrendered.
  int64 produced_at_ms = 2;

  // THE TEST THAT DECIDES THESE ARMS, in one question: if you PRINTED the
  // conversation to read it, would this appear?
  //
  //   yes                      -> message
  //   no, but we understand it -> bookkeeping
  //
  // Put another way: a MESSAGE is something the conversation CONSISTS OF, and
  // BOOKKEEPING is a fact ABOUT the conversation. Content versus evidence.
  //
  // The reverse readings are the useful ones. Something is NOT a message when
  // nothing in the feed would be missing had it never arrived. Something is NOT
  // bookkeeping when a reader scrolling back would notice a hole where it
  // should have been.
  //
  // THERE IS NO THIRD ARM HERE. A record we could not place is not narrowed to
  // an unrenderable arm the daemon must remember to skip — it has no external
  // half at all, so it has no path to the daemon whatsoever.
  oneof entry {
    // A record BELONGING to a conversation message — the thing the feed draws
    // and a page counts.
    //
    // It has an identity the user could point at, it accumulates over several
    // records that share that identity, and it is what "ten messages" counts.
    // A context cut and a failure card are messages by this test: a reader must
    // see WHERE the conversation was cut, and a failure card is a thing the
    // user reads and acts on.
    conversation.v1.MessageEntry message = 3;

    // A fact ABOUT the session rather than a part of the conversation. We
    // understand it completely and nothing in the feed corresponds to it.
    //
    // It is not uncounted because it is unimportant — it drives the footer, the
    // session state machine, accounting and the turn ledger. It is uncounted
    // because it is not IN the transcript: you cannot point at a turn boundary.
    //
    // Separated from `message` rather than filtered out of it, so a turn
    // boundary has no field capable of naming a message and therefore cannot
    // become a phantom page slot. Misfiling one is not a wrong value — it is an
    // unbuildable record.
    //
    // THE FRONTEND NEVER SEES THESE. Bookkeeping reaches a client only after
    // the daemon has resolved it into a view, which is what makes it evidence
    // rather than content. That is a SECOND cut, made later and by the daemon;
    // this file's cut is the shim→daemon one.
    BookkeepingEntry bookkeeping = 4;
  }
}
