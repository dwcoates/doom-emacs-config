// message.proto — records that BELONG to a conversation message.
//
// The unit a page counts is a message, not a record. Several records share one
// message_id and fold, in seq order, into the single thing the feed draws.

syntax = "proto3";

package conversation.v1;

import "conversation/v1/payloads.proto";

option go_package = "agentrepl/proto/conversation/v1;conversationv1";

// One record BELONGING to one message. Several of these share a message_id and
// fold, in seq order, into the single thing the feed draws.
//
// THE THREE IDS ARE THE SAME ON EVERY RECORD, whatever its payload does with
// the message. That is deliberate: "opens", "updates" and "composes" stop being
// three record SHAPES and become three payloads. An earlier draft split them
// into a composing shape and a message shape, which put the ids at two
// different levels and left the record that CLOSES a message sitting in the arm
// named for identity.
message MessageEntry {
  // The message this record belongs to. Records sharing it fold together, so a
  // consumer needs no correlation pass to attach an update to what it updates.
  string message_id = 1;

  // The feed row that message belongs to, and the value a page groups by.
  //
  // EQUALS message_id when the message is itself a feed row; names the
  // containing message when nested, so a subagent and everything inside it
  // share one value and therefore one page slot.
  //
  // Denormalized on purpose: it is derivable by walking parents, and storing it
  // is precisely why a page of ten messages costs one indexed pass. It MUST
  // equal the root of the parent chain; a write that disagrees is corruption,
  // not a variant.
  string top_level_message_id = 2;

  // Where this message sits: at the root of the feed, or inside another
  // message.
  //
  // A oneof rather than a string, and that is the whole point. As a string,
  // EMPTY meant two different things — "this is a feed row" and "the producer
  // could not resolve a parent" — and only the first is legal. At a context
  // compaction the vendor's physical parent chain is cut, the boundary line
  // carries no parent, and a separate logical pointer holds the only link back
  // across it. A producer that reads only the physical chain resolves nothing,
  // and with a string it would emit an empty value indistinguishable from a
  // legitimate root — so pre-compaction history becomes unreachable by any walk
  // and the boundary renders as a new top-level row, with nothing detecting it.
  //
  // Here an unresolved parent has no legal record to occupy. The producer must
  // state which case it is, or fail.
  MessageParent parent = 5;

  // Who this message is FROM, resolved by the producer rather than inferred by
  // a reader from which payload arm is set.
  MessageAuthor author = 4;

  // 3 was parent_message_id, a bare string whose empty value meant both "feed
  // row" and "unresolved". Replaced by `parent` (5), a oneof.
  reserved 3;
  reserved "parent_message_id";

  // 15 was daemon_answered_command. It was UNBUILDABLE: only the daemon can
  // observe a command it answered itself, and the daemon has no store write
  // path — so the arm named a record nothing could ever produce. It belongs on
  // the frontend surface, where frontend.v1.DaemonInterceptedCommandItem
  // already carries it as a message the daemon mints and pushes.
  reserved 15;
  reserved "daemon_answered_command";

  // What this record says about the message it belongs to. The three groups
  // below are a reading aid, not a schema distinction: every arm carries the
  // same ids, so the group an arm sits in changes nothing about the record.
  oneof payload {
    // ---- Records that OPEN the message they name ----

    // Something a person typed. The opening of a turn.
    UserSaid user_said = 10;

    // Something the agent said: its content blocks, and the usage its response
    // reported.
    AgentSaid agent_said = 11;

    // A permission the agent ASKED FOR. It is a message because the agent
    // really did ask and the user really does answer — it is a conversational
    // act, not a dialog the daemon invented.
    PermissionAsked permission_asked = 12;

    // Something went wrong, stated as a card the user reads and acts on.
    FailureRaised failure_raised = 13;

    // The conversation was CUT here. It is a message because a reader must see
    // where, rather than merely finding the history shorter than they left it.
    ContextCut context_cut = 14;

    // Work that DETACHED from the turn and now runs alongside it — a subagent,
    // a background shell, a workflow. It is a feed row naming itself, so a page
    // of ten rows is ten bounded things rather than ten trees.
    DetachedWorkStarted detached_work_started = 16;

    // ---- Records that UPDATE a message already opened ----
    // They carry the same message_id, so attaching them needs no correlation
    // and costs no additional page slot.

    // Output accumulating into detached work already open.
    DetachedWorkProgressed detached_work_progressed = 20;

    // Detached work reached an end, with the outcome it reached.
    DetachedWorkEnded detached_work_ended = 21;

    // The user answered a permission the agent asked for.
    PermissionAnswered permission_answered = 22;

    // A tool the agent called returned. It carries the message_id of the
    // message that MADE the call, so the result folds onto that tool card.
    //
    // `author` therefore stays the AGENT on this record: the field says who the
    // MESSAGE is from, and the message is the agent's response. The vendor
    // files tool results under user-role records, which is the accident this
    // arm exists to not inherit.
    ToolReturned tool_returned = 23;

    // A skill file's contents, resolved onto the skill's own message. Replaces
    // whole rather than appending.
    SkillBodyResolved skill_body_resolved = 24;

    // ---- Records that COMPOSE a message, arriving before it is whole ----

    // A fragment of content still arriving, handed straight to the daemon by
    // the stream plane. The completed message the file plane writes later
    // REPLACES the preview rather than appending beside it.
    ContentArriving content_arriving = 30;
  }
}

// Where a message sits in the feed.
//
// Two arms, no third. There is deliberately no "unknown" — a producer that
// cannot resolve a parent has nothing legal to emit and must fail loudly rather
// than pick the arm that looks harmless.
message MessageParent {
  oneof parent {
    // The message sits directly in the feed. `top_level_message_id` is its own
    // id.
    MessageParentRoot root = 1;
    // The message sits inside another one.
    MessageParentInside inside = 2;
  }
}

// A feed row: nothing contains this message.
message MessageParentRoot {}

// Contained by another message.
message MessageParentInside {
  // The message immediately containing this one — one hop, never the root.
  // Walk `top_level_message_id` for the root; it is stored precisely so no
  // reader has to walk this.
  string message_id = 1;
}

// Who a message is from.
//
// RESOLVED BY THE PRODUCER, never inferred by a reader from which payload arm
// is set. The two are not the same question: a ToolReturned record is authored
// by the agent whose message it updates, and an arm-based inference would
// attribute it to whoever the vendor happened to file it under.
message MessageAuthor {
  oneof author {
    // A person.
    AuthorUser user = 1;
    // The agent, in the main conversation.
    AuthorAgent agent = 2;
    // A detached agent — a subagent — speaking inside its own work.
    AuthorDetachedAgent detached_agent = 3;
  }

  // 4 was `daemon`, for things the daemon answered or synthesized. It went for
  // the same reason daemon_answered_command did: the daemon writes no entries,
  // so no record in this package can have it as an author. Everything it would
  // have covered is minted on the frontend surface instead.
  reserved 4;
  reserved "daemon";
}

// A person, typing into the session.
message AuthorUser {}

// The agent, speaking in the main conversation.
message AuthorAgent {}

// A subagent, speaking inside its own detached conversation.
message AuthorDetachedAgent {
  // The detached work this agent is running as, so its emissions can be routed
  // to the card without a second correlation.
  string detached_work_message_id = 1;
}
