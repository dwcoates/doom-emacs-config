// unsupported.proto — the bodies of the records we could not place.
//
// SHIM-SIDE. THE DAEMON MUST NEVER IMPORT THIS PACKAGE. These are carried by
// InternalEntry.unconverted (entry.proto) and have no external half, so nothing
// here has a path to the daemon or to a page.
//
// There is deliberately no `UnsupportedEntry` wrapper any more. It used to sit
// as a third arm beside message and bookkeeping, which put a thing nobody can
// render in the same list as the two things everybody renders; the arms now sit
// directly on InternalEntry, which is what they always meant.
//
// The payloads are deliberately thin. They exist for debugging and for a future
// schema to mine; when one is genuinely needed, its shape is expanded then
// rather than guessed at now.

syntax = "proto3";

package agentshim.conversation.internal.v1;

import "google/protobuf/struct.proto";

option go_package = "agentrepl/proto/agentshim/conversation/internal/v1;conversationinternalv1";

// Something one vendor does that no vendor-agnostic feed can show.
//
// UNDERSTOOD, unlike the other two arms. We know what it is and have decided
// not to carry it, which is a different situation from not knowing.
message VendorSpecificEntry {
  // What the vendor called it.
  string kind = 1;
  // The record entire and verbatim.
  google.protobuf.Struct raw = 2;
}

// A record we read successfully and do not model.
message UnknownEntry {
  // The discriminator we did not recognize, and where we read it from, so a
  // later schema knows what to model and where to look.
  string discriminator = 1;
  // The field the discriminator was read from. Carried because a producer that
  // looked in the wrong place and a record with a genuinely new kind produce
  // the same entry otherwise.
  string discriminator_field = 2;
  // The record entire and verbatim.
  google.protobuf.Struct raw = 3;
}

// A record we could not read at all.
//
// A FAILURE, not a gap. The other two arms mean the schema is incomplete; this
// one means a read went wrong, and the fields exist so that is investigable
// rather than merely counted.
message UnparsedEntry {
  // Where it came from — the file, the stream, the position in it.
  string source = 1;
  // The byte offset it started at, so it can be found again.
  uint64 offset = 2;
  // Why parsing failed.
  string parse_error = 3;
  // The bytes, verbatim.
  string raw = 4;
}
