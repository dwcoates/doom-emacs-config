// agentshim.core.v1 — the vendor-neutral core of the agent-shim protocol.
//
// SEMANTICS (normative):
//
// - Every UDS hop in the system carries length-prefixed binary messages from
//   this schema set (frontends receive the frontend.v1 package as protojson).
// - The store round-trip: producers (agent-shim stream plane, shim-claude-sidecar
//   file plane) write PERSISTENT Events to the shim-store via StoreWrite; the
//   store assigns Event.seq per session in arrival order, dedups on
//   Event.dedup_key, persists, and fans out to subscribers. The daemon only
//   ever consumes the store-merged stream forwarded by the shim — everything
//   the daemon sees (except EPHEMERAL class) is already durable.
// - EPHEMERAL class (ContentDelta, HeartbeatProgress) bypasses the store:
//   shim → daemon directly. Consumers reconcile per Claude message id,
//   REPLACING a streamed preview with the store-delivered final message.
//   MessageLatency is PERSISTENT because timing analysis needs it on replay.
//   Ephemeral events are never persisted and never replayed.
// - Replay handshake: the shim sends the store Subscribe{session_id,
//   from_seq}; the store replays persisted events with seq > from_seq, then
//   live-tails. The daemon does NOT send this: its resume position rides
//   DaemonHello.from_seq, inside the one bring-up gate (see ShimHello).
// - Bounded historical replay: ReplayRequest{from_seq, to_seq} asks for a
//   one-shot RANGE without moving the standing subscription. Its events come
//   back wrapped in ReplayEvent, a distinct message type so replayed history
//   can never be mistaken for live state, and the range is closed by exactly
//   one ReplayDone.
// - Correlation: any control message carries request_id; asynchronous
//   consequences echo it in Event.request_id where attributable. Ack/Nack is
//   the synchronous receipt on the connection the request arrived on.
// - Turn lifecycle authority: only the live shim's STREAM plane emits
//   TurnStarted / TurnEnded. File-plane stop-hook records remain vendor
//   evidence and never move lifecycle state. Each newly produced turn boundary
//   carries the same non-empty turn_id, equal to the accepted SubmitPrompt's
//   request_id, so an end can close only the turn it names. Historical
//   persisted boundaries produced before turn_id existed have it empty and
//   retain their original ordered-replay semantics. A vendor-session rotation
//   may emit TurnClaimBridge as persistent correlation evidence; it is not a
//   lifecycle boundary and its only consumer is the durable turn ledger.
// - Sad path: a producer that cannot reach the store hard-fails the write,
//   loud-logs every dropped event, and reports DegradedState. No spill
//   buffers, no fallbacks (metaprompt no-fallbacks rule).
//
// Evolution: proto3, field numbers never reused. Breaking changes require
// explicit user approval (AGENTS.md).

syntax = "proto3";

package agentshim.core.v1;

import "google/protobuf/any.proto";
import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

option go_package = "agentrepl/proto/agentshim/core/v1;corev1";

// ---------------------------------------------------------------------------
// Enums
// ---------------------------------------------------------------------------

// Which observation plane produced an event.
enum Plane {
  PLANE_UNSPECIFIED = 0;
  PLANE_STREAM = 1;     // the vendor SDK live stream (via the agent-shim)
  PLANE_FILE = 2;       // harness files on disk (via the shim-claude-sidecar)
  PLANE_SYNTHETIC = 3;  // producer-inferred (e.g. staleness LOST transitions)
}

// Persistence class. PERSISTENT events take the store round-trip; EPHEMERAL
// events bypass it (delta bypass) and are never persisted nor replayed.
enum EventClass {
  EVENT_CLASS_UNSPECIFIED = 0;
  EVENT_CLASS_PERSISTENT = 1;
  EVENT_CLASS_EPHEMERAL = 2;
}

// Detached-work kind, matching the harness task-id prefixes (a/b/w).
enum TaskKind {
  TASK_KIND_UNSPECIFIED = 0;
  TASK_KIND_AGENT = 1;
  TASK_KIND_SHELL = 2;
  TASK_KIND_WORKFLOW = 3;
}

// Closed terminal-status vocabulary. LOST is a shim-claude-sidecar inference
// (vanished file, silence timeout, boot sweep) and is NEVER conflated with
// DONE: a lost task stopped, but nothing says it succeeded.
enum TerminalStatus {
  TERMINAL_STATUS_UNSPECIFIED = 0;
  TERMINAL_STATUS_DONE = 1;
  TERMINAL_STATUS_ERROR = 2;
  TERMINAL_STATUS_KILLED = 3;
  TERMINAL_STATUS_STOPPED = 4;  // TaskStop/prompt-mediated stop
  TERMINAL_STATUS_LOST = 5;     // inferred; loud-logged at transition
}

// How a session came to exist.
enum SessionSource {
  SESSION_SOURCE_UNSPECIFIED = 0;
  SESSION_SOURCE_FRESH = 1;
  SESSION_SOURCE_RESUME = 2;
  SESSION_SOURCE_COMPACT_CONTINUE = 3;
}

// canUseTool decision.
enum PermissionDecision {
  PERMISSION_DECISION_UNSPECIFIED = 0;
  PERMISSION_DECISION_ALLOW = 1;
  PERMISSION_DECISION_DENY = 2;
}

// Why a prompt entered the agent-repl submit pipeline.
//
// This is a closed, durable attribution vocabulary rather than the free-form
// SubmitPrompt.origin diagnostic string. Every frontend send site and every
// daemon-generated submit site MUST choose a non-UNSPECIFIED value, and Emacs
// send sites intentionally never share a value: a stored TurnStarted can
// therefore be traced back to the exact editor situation that caused it.
enum PromptOrigin {
  PROMPT_ORIGIN_UNSPECIFIED = 0;

  // Emacs-originated sends. Each value has exactly one production send site.
  PROMPT_ORIGIN_USER_SENT = 1;
  PROMPT_ORIGIN_USER_SENT_AND_HIDE = 2;
  PROMPT_ORIGIN_USER_SENT_WITH_METAPROMPT = 3;
  PROMPT_ORIGIN_USER_SENT_WITH_POSTFIX = 4;
  PROMPT_ORIGIN_USER_SENT_WITH_PREFIX = 5;
  PROMPT_ORIGIN_METAPROMPT_READ = 6;
  PROMPT_ORIGIN_COMMAND_DIFF_ANALYSIS = 7;
  PROMPT_ORIGIN_COMMAND_EXPLAIN_CONTEXT = 8;
  PROMPT_ORIGIN_COMMAND_EXPLAIN_PROMPT = 9;
  PROMPT_ORIGIN_COMMAND_UPDATE_PR = 10;
  PROMPT_ORIGIN_COMMAND_REBASE = 11;
  PROMPT_ORIGIN_COMMAND_CREATE_OR_UPDATE_PR = 12;
  PROMPT_ORIGIN_PANEL_SELECTION = 13;
  PROMPT_ORIGIN_DEFERRED_PROMPT = 14;
  reserved 15;
  reserved "PROMPT_ORIGIN_LEGACY_PENDING_PROMPT";
  PROMPT_ORIGIN_LEGACY_HOST_PROMPT = 16;
  PROMPT_ORIGIN_GNS_SOCKETS_CLOSE = 17;
  PROMPT_ORIGIN_LEGACY_HOST_EVAL_RESULT = 18;
  PROMPT_ORIGIN_EXPLAIN_CONFIG = 19;

  // Other producers remain explicit without being mislabeled as Emacs.
  PROMPT_ORIGIN_WEBAPP_USER_SENT = 20;
  PROMPT_ORIGIN_WEBAPP_CARD_ACTION = 21;
  PROMPT_ORIGIN_WORKSPACE_CREATED = 22;
  PROMPT_ORIGIN_MERGE_CONFLICT_REPAIR = 23;
  PROMPT_ORIGIN_MERGE_TEST_REPAIR = 24;
  PROMPT_ORIGIN_MERGE_BEFORE_ACTION = 25;
  PROMPT_ORIGIN_MERGE_AFTER_ACTION = 26;
  reserved 27;
  reserved "PROMPT_ORIGIN_MERGE_PARENT_NOTIFICATION";
  PROMPT_ORIGIN_MERGE_DISPLACED_TURN_RESUME = 28;

  // Daemon-generated cache keep-alive ping: a minimal prompt ("respond with
  // only '.', no tool calls or changes") submitted after turn inactivity to
  // refresh the vendor prompt cache before its TTL expires. Turns with this
  // origin are conversation-plumbing, not conversation: every consumer
  // (frontend rendering, replay floors, transcript projection) excludes them
  // unconditionally, and the shim discards them from the vendor transcript
  // via rewind (SessionRewound) before the next real prompt is submitted, so
  // they can never contaminate the model's context either.
  PROMPT_ORIGIN_CACHE_KEEP_ALIVE = 29;

  // Daemon-generated re-drive of a turn a planned bounce interrupted.
  //
  // A restart that has to take the shim with it (the shim bundle changed, or
  // the shim is dead) interrupts whatever turn was running. The vendor SDK has
  // no resume-the-interrupted-turn primitive — `resume`, `continue` and
  // `resumeSessionAt` all restore CONTEXT and none restarts an aborted turn —
  // so the successor daemon has to submit an instruction to continue the work.
  //
  // THE SUBMIT IS INVISIBLE AND THE TURN IS NOT. Unlike CACHE_KEEP_ALIVE, whose
  // whole turn is conversation-plumbing that every consumer excludes, this
  // turn's OUTPUT is the continuation of work the user asked for and belongs in
  // the conversation at the interrupted turn's position. Only the daemon's own
  // instruction is hidden, and it is hidden at the curator rather than by
  // origin (the daemon drops the `user_message` whose request id carries the
  // internal re-drive marker), so this value never has to be consulted to
  // decide what renders.
  //
  // What it IS for: saying WHY a turn is running. A status surface reads this
  // to report "resumed after restart" instead of presenting work the user did
  // not just ask for as though they had.
  PROMPT_ORIGIN_RESUME_AFTER_RESTART = 30;
}

// ---------------------------------------------------------------------------
// The envelope
// ---------------------------------------------------------------------------

// Event is THE envelope every observation travels in.
message Event {
  string session_id = 1;
  // Store-assigned per-session sequence number. 0 before ingest (producer →
  // store); authoritative and gapless per session after ingest.
  uint64 seq = 2;
  Plane plane = 3;
  EventClass class = 4;
  // Correlates asynchronous consequences back to the control request that
  // caused them, when attributable. Empty otherwise.
  string request_id = 5;
  // Producer wall-clock, unix millis.
  int64 produced_at_ms = 6;
  // Store dedup key (see shim-store §6.4 derivation). Empty = never deduped.
  string dedup_key = 7;

  // The query instance this event BELONGS TO: the id of the SDK query()
  // invocation that was running when the producer built the event.
  //
  // This is a fact about the event's ORIGIN, never about its DELIVERY. An
  // event the store replays during a subscription's catch-up still names the
  // query that produced it, so a row written before its own subscription was
  // open — which is exactly how a session's first QueryCreated is written —
  // reads back as belonging to the query running right now.
  //
  // CONTRACT:
  //   - Written by the PRODUCER, at construction time, naming the query the
  //     producer is itself running.
  //   - NEVER set, cleared, or amended by any reader, relay, or replay path.
  //     The store round-trips it verbatim; the daemon compares it and does
  //     nothing else with it.
  //   - EMPTY means the event belongs to no query. The file plane is the
  //     standing case: its records are attributed to a vendor session, which
  //     outlives any single query() invocation, so a query instance is not a
  //     property of them. A producer that predates this field is the other.
  //
  // Consumers classify with ONE comparison against the query they are bound
  // to. Equal, or EMPTY, means live and every live check applies in full and
  // stays fatal. Non-empty and different means history: accept it, mutate no
  // live state, raise no error. Empty deliberately FAILS CLOSED so an older
  // producer keeps precisely the behavior it had before this field existed.
  string query_instance_id = 8;

  // STABLE WRITE IDENTITY. Minted ONCE by the producer when the event is first
  // handed to a store write, and NEVER regenerated — not for a retry, not for
  // a replay after the store bounced underneath the producer.
  //
  // It is what makes a store write IDEMPOTENT BY IDENTITY, which is what makes
  // replay safe. A batch that REACHED the store but whose StoreWriteAck was
  // lost — a store restart between the ingest and the ack is exactly that —
  // has to be replayed by the producer, because from the producer's side an
  // unacked batch and a never-delivered batch are indistinguishable. Without
  // an identity the store cannot tell the replay from a second, genuinely new
  // event, and writes it twice. With one, the replay is a no-op.
  //
  // DISTINCT FROM dedup_key, and neither one substitutes for the other:
  //   - dedup_key is a CROSS-PLANE identity. Two DIFFERENT producers (the
  //     stream shim and the file-plane sidecar) observing the SAME underlying
  //     fact derive the SAME key, so the store collapses the twins to one row.
  //     Events with no cross-plane twin — turn lifecycle, content deltas,
  //     degraded reports — carry no dedup_key at all, and those are precisely
  //     the events a replay duplicated.
  //   - write_id identifies ONE producer's ONE write of ONE event. It is
  //     unique per event whether or not the event has a twin, so it covers the
  //     whole envelope space rather than the deduped subset.
  //
  // EMPTY means the producer supplied no write identity, and such an event is
  // NOT replay-idempotent. The store enforces uniqueness only over non-empty
  // values, so an older producer keeps exactly the behavior it had before this
  // field existed.
  string write_id = 9;

  oneof payload {
    // Vendor-neutral lifecycle payloads:
    SessionStarted session_started = 10;
    SessionEnded session_ended = 11;
    TurnStarted turn_started = 12;
    TurnEnded turn_ended = 13;
    TaskStarted task_started = 14;
    TaskProgress task_progress = 15;
    TaskEnded task_ended = 16;
    ContentDelta content_delta = 17;
    HeartbeatProgress heartbeat_progress = 18;
    DegradedState degraded_state = 19;
    UnparsedEvent unparsed = 20;
    MessageLatency message_latency = 21;
    // Clear and compact. First-class payloads so the store's `kind` column
    // names them and the daemon can find the newest one with an envelope query.
    ContextCleared context_cleared = 22;
    ContextCompacted context_compacted = 23;
    // Canonical persistent file-plane runtime diagnostic. The store persists
    // it opaquely and the shim forwards it. The daemon resolves session_id to
    // a workspace and writes the record to that workspace's sidecar.log.
    // Consumers must never render it as conversation material or apply it to
    // SSM.
    FilePlaneDiagnostic file_plane_diagnostic = 24;
    // Durable correlation evidence for a turn whose accepted start and result
    // landed in different vendor-session seq spaces. This is deliberately NOT
    // a TurnStarted: it is consumed only by the daemon's turn-claim ledger and
    // can never create an SSM/progress/frontend lifecycle edge.
    TurnClaimBridge turn_claim_bridge = 25;
    // Records lifecycle facts for one SDK query invocation.
    QueryLifecycle query_lifecycle = 26;
    // Records a subscription-usage measurement at a turn boundary.
    AccountUsageObservation account_usage_observation = 27;
    // Durable record that the shim rewound the vendor conversation to an
    // earlier point by transcript truncation. See SessionRewound.
    SessionRewound session_rewound = 28;
    // Vendor extension payload (e.g. agentshim.data.v1.* messages). The
    // daemon treats it opaquely except for frontend translation; the store
    // treats it fully opaquely apart from dedup-key extraction.
    google.protobuf.Any vendor = 30;
  }

  // Unknown-field capture from the §5.1 validation contract: values present
  // in source data that the schema does not model. Loud-logged once per
  // distinct field name by the producing converter. Never silently dropped.
  google.protobuf.Struct extras = 40;
}

// Ordered batch of events, optionally advancing a file cursor atomically
// with the batch (shim-claude-sidecar exactly-once contract).
message EventBatch {
  repeated Event events = 1;
  CursorState cursor_advance = 2;  // unset for stream-plane producers
}

// A record that failed conversion. The §5.1 contract: missing EXPECTED
// fields hard-error into one of these; the raw evidence is preserved.
message UnparsedEvent {
  string source_path = 1;  // file plane: absolute path; stream plane: ""
  int64 byte_offset = 2;   // file plane: offset of the failed record
  bytes raw = 3;           // bounded (producers cap at 64KiB)
  string error = 4;        // the conversion error, verbatim
  string producer = 5;     // "claude-shim" | "shim-claude-sidecar"
}

// ---------------------------------------------------------------------------
// Vendor-neutral lifecycle payloads
// ---------------------------------------------------------------------------

message SessionStarted {
  SessionSource source = 1;
  string model = 2;
  string cwd = 3;
  string vendor_session_id = 4;  // e.g. the claude session uuid
}

message SessionEnded {
  string reason = 1;
}

message TurnStarted {
  string prompt_preview = 1;  // first line, bounded
  // Stable identity of this accepted prompt's turn. Equal to the
  // SubmitPrompt.request_id and Event.request_id. Non-empty on every newly
  // produced event; empty only on historical events persisted before this
  // field existed.
  string turn_id = 2;
  // Durable copy of the accepted SubmitPrompt.prompt_origin. Newly produced
  // turns must never use UNSPECIFIED; zero exists only for historical rows.
  PromptOrigin prompt_origin = 3;
}

message TurnClaimBridge {
  // Stable accepted-prompt identity shared with TurnStarted.turn_id,
  // TurnEnded.turn_id, and Event.request_id.
  string turn_id = 1;
  // Vendor session whose seq space contains the real TurnStarted. The
  // envelope session_id names the new seq space containing this proof and its
  // paired TurnEnded; the two session ids must be non-empty and different.
  string previous_session_id = 2;
}

// Records one conversation rewind. The rewind is DAEMON-ORCHESTRATED: the
// daemon stops the shim, produces a truncated copy of the vendor transcript
// under a NEW vendor session id, flips its registry to that id, and respawns
// the shim resuming the copy; the respawned shim emits this event (fed the
// lineage via argv) as its first persistent event in the new seq space. The
// truncated copy is byte-identical to the prefix already sent to the vendor,
// so the next prompt lands on the prompt cache the dropped turns kept warm.
//
// This is correlation evidence, like TurnClaimBridge — the rotation itself is
// still ANNOUNCED by the ordinary handshake bounce (ShimHello.vendor_session_id
// on the reconnect), and the daemon's cursor-reset machinery is unchanged.
// This event is the durable explanation of WHY the identity changed, so a
// vendor-session lineage can always be reconstructed from the store alone.
message SessionRewound {
  // The vendor session id whose transcript was truncated — the seq space this
  // rewind retires. Non-empty always.
  string previous_vendor_session_id = 1;
  // The vendor session id of the truncated copy the conversation continues
  // under. Non-empty, and never equal to previous_vendor_session_id.
  string new_vendor_session_id = 2;
  // Vendor uuid of the last transcript record RETAINED by the truncation: the
  // final record of the last real turn. Everything after it was dropped. The
  // cut is always at a turn boundary, never mid-turn.
  string retained_leaf_uuid = 3;
  // Why the shim rewound. A oneof (not an enum) so each cause carries its own
  // evidence, and so a future user-facing rewind is a new arm rather than a
  // schema rethink.
  oneof reason {
    // The only producer today: discarding trailing keep-alive turns before a
    // real prompt.
    KeepAliveDiscard keep_alive_discard = 10;
  }
}

// The rewind dropped trailing cache keep-alive turns so the next real prompt
// continues from the last real turn on a warm cache, with the pings leaving
// no trace in the model's context.
message KeepAliveDiscard {
  // turn_ids (= SubmitPrompt.request_id) of every dropped keep-alive turn, in
  // submission order. Store consumers use these to mark those turns
  // superseded; their history is never deleted, only excluded from replay.
  repeated string dropped_turn_ids = 1;
}

message TurnEnded {
  string stop_reason = 1;
  int64 duration_ms = 2;
  bool is_error = 3;
  // Must equal the TurnStarted.turn_id this result closes. The daemon rejects
  // a non-empty mismatch, so a delayed fact about an older turn cannot settle
  // a newer live turn.
  string turn_id = 4;
}

// Identifies one invocation of the SDK query API and every lifecycle event it
// emits.
message QueryLifecycle {
  // Uniquely identifies one query() invocation within a shim session.
  string query_instance_id = 1;

  // Gives the Unix epoch time at which the lifecycle event was observed.
  int64 observed_at_ms = 2;

  // Describes exactly one lifecycle event without relying on a state enum.
  oneof event {
    // Records creation of the query.
    QueryCreated created = 10;

    // Records the effective runtime identity reported after initialization.
    QueryRuntimeObserved runtime_observed = 11;

    // Records termination of the query.
    QueryTerminated terminated = 12;
  }
}

// Records the options used to construct one SDK query.
message QueryCreated {
  // Gives the requested model string passed to the SDK.
  string requested_model = 1;

  // Identifies whether the query starts a vendor session or resumes one.
  oneof invocation {
    // Indicates that no vendor session was supplied for resumption.
    FreshQuery fresh = 10;

    // Identifies the vendor session supplied for resumption.
    ResumedQuery resumed = 11;
  }
}

// Marks construction of a query without a vendor session to resume.
message FreshQuery {}

// Records construction of a query that resumes a vendor session.
message ResumedQuery {
  // Gives the exact vendor session identifier supplied to the SDK.
  string requested_vendor_session_id = 1;
}

// Records the effective runtime identity reported by the initialized query.
message QueryRuntimeObserved {
  // Contains the effective runtime identity used by the query.
  QueryRuntimeIdentity identity = 1;
}

// Identifies configuration capable of affecting usage, caching, or latency.
message QueryRuntimeIdentity {
  // Gives the vendor session identifier reported after initialization.
  string vendor_session_id = 1;

  // Gives the effective model reported after initialization.
  string effective_model = 2;

  // Gives the Claude Agent SDK package version.
  string sdk_version = 3;

  // Gives the Claude Code version used by the SDK.
  string claude_code_version = 4;

  // Gives the shim build commit.
  string shim_build_sha = 5;

  // Gives the non-secret authentication-source description.
  string auth_source = 6;

  // Gives the subscription type reported by the usage service.
  string subscription_type = 7;

  // Gives the reported fast-mode state.
  string fast_mode_state = 8;

  // Gives the explanation associated with the fast-mode state.
  string fast_mode_reason = 9;

  // Hashes the effective SDK options using a canonical encoding.
  EvidenceFingerprint effective_options = 10;

  // Hashes the effective settings using a canonical encoding.
  EvidenceFingerprint settings = 11;

  // Hashes the ordered tool definitions using a canonical encoding.
  EvidenceFingerprint tools = 12;

  // Hashes the ordered MCP configuration using a canonical encoding.
  EvidenceFingerprint mcp = 13;

  // Hashes the cacheable system and instruction prefix using a canonical encoding.
  EvidenceFingerprint context_prefix = 14;
}

// Represents either a known SHA-256 fingerprint or explicit unavailability.
message EvidenceFingerprint {
  // Describes whether the fingerprint could be produced.
  oneof evidence {
    // Gives a lowercase hexadecimal SHA-256 digest.
    string sha256 = 1;

    // Explains why the producer could not obtain the fingerprint.
    FingerprintUnavailable unavailable = 2;
  }
}

// Explains why an evidence fingerprint could not be produced.
message FingerprintUnavailable {
  // Gives a diagnostic suitable for logs and experiment validation.
  string cause = 1;
}

// Records termination of one SDK query.
message QueryTerminated {
  // Identifies the vendor conversation when query initialization exposed it,
  // or states explicitly that termination preceded vendor identity discovery.
  oneof vendor_identity {
    // Gives the non-empty vendor session identifier associated with the query.
    string vendor_session_id = 1;

    // Records that the query ended before the SDK exposed a vendor session.
    VendorSessionIdentityUnavailable vendor_session_identity_unavailable = 2;
  }

  // Identifies the termination condition without relying on a state enum.
  oneof reason {
    // Records termination initiated by shim shutdown or hibernation.
    IntentionalQueryTermination intentional = 10;

    // Records unexpected completion of the SDK iterator.
    UnexpectedQueryEof unexpected_eof = 11;

    // Records an error thrown by the SDK iterator.
    QueryIteratorFailure iterator_failure = 12;

    // Records failure before the query completed initialization.
    QueryStartupFailure startup_failure = 13;
  }
}

// Marks a query lifecycle boundary observed before vendor session discovery.
message VendorSessionIdentityUnavailable {}

// Records an intentional query termination.
message IntentionalQueryTermination {
  // Gives the shim lifecycle reason that required termination.
  string reason = 1;
}

// Marks unexpected completion of the SDK iterator.
message UnexpectedQueryEof {}

// Records an error thrown by the SDK iterator.
message QueryIteratorFailure {
  // Gives the complete error diagnostic.
  string cause = 1;
}

// Records failure before query initialization completed.
message QueryStartupFailure {
  // Gives the complete error diagnostic.
  string cause = 1;
}

// Records one attempt to measure subscription usage at a turn boundary.
message AccountUsageObservation {
  // Identifies the query serving the turn.
  string query_instance_id = 1;

  // Identifies the turn whose boundary was measured.
  string turn_id = 2;

  // Gives the exact turn-boundary time independently of sampling latency.
  int64 boundary_at_ms = 3;

  // Gives the time at which the usage response was received.
  int64 observed_at_ms = 4;

  // Gives the elapsed time required to obtain the usage response.
  int64 sample_latency_ms = 5;

  // Gives the subscription type reported by the usage service.
  string subscription_type = 6;

  // Identifies the measured turn boundary.
  oneof boundary {
    // Marks the boundary immediately before prompt submission.
    TurnStartUsageBoundary turn_start = 10;

    // Marks the boundary after the terminal result is received.
    TurnEndUsageBoundary turn_end = 11;
  }

  // Contains either the measurement or its explicit failure.
  oneof outcome {
    // Contains the account-usage measurement.
    AccountUsageAvailable available = 20;

    // Explains why the measurement could not be obtained.
    AccountUsageUnavailable unavailable = 21;
  }
}

// Marks an observation taken immediately before prompt submission.
message TurnStartUsageBoundary {}

// Marks an observation taken after the terminal result is received.
message TurnEndUsageBoundary {}

// Contains subscription-usage windows returned by the usage service.
message AccountUsageAvailable {
  // Contains utilization of the rolling five-hour window.
  UsageWindow five_hour = 1;
}

// Describes utilization and reset time for one account-usage window.
message UsageWindow {
  // Gives utilization as a percentage from zero through one hundred.
  double utilization_percent = 1;

  // Gives the Unix epoch time at which the window resets.
  int64 resets_at_ms = 2;
}

// Explains why an account-usage measurement could not be obtained.
message AccountUsageUnavailable {
  // Identifies the failure without collapsing distinct conditions.
  oneof reason {
    // Indicates that the account-usage API was unavailable.
    UsageServiceUnavailable service_unavailable = 1;

    // Indicates that the response omitted the five-hour window.
    FiveHourWindowUnavailable window_unavailable = 2;

    // Indicates that the response omitted utilization.
    UtilizationUnavailable utilization_unavailable = 3;

    // Records a transport, parsing, or SDK error.
    UsageSamplingFailure sampling_failure = 4;
  }
}

// Marks unavailability of the account-usage API.
message UsageServiceUnavailable {}

// Marks absence of the five-hour window.
message FiveHourWindowUnavailable {}

// Marks absence of utilization within the five-hour window.
message UtilizationUnavailable {}

// Records an error encountered while sampling account usage.
message UsageSamplingFailure {
  // Gives the complete error diagnostic.
  string cause = 1;
}

// CLEAR and COMPACT are the two ways a conversation's history stops informing
// the agent, and both are first-class Event payloads rather than vendor
// extensions for one reason: the store indexes `kind` off the envelope, so
// each has to BE a kind for the daemon to find the newest one without reading
// a payload.
//
// Finding it is the whole point. A frontend's replay floor is the newest
// clear or compact, so a reconnecting frontend is served the conversation
// from that point forward and never receives history it would only discard.
// Nesting either inside a vendor payload would make that query a full scan of
// opaque blobs.
//
// The names are `clear` and `compact` because those are the overwhelming
// convention across vendors, not one vendor's spelling.
//
// THE FILE PLANE IS THE SOLE PRODUCER of both. An earlier draft of this
// schema claimed both planes produce them and merge on a shared dedup_key;
// that was wrong on every count, and the correction is worth recording so
// nobody re-derives the broken version.
//
// The stream plane cannot see either event. The CLI handles a recognized
// slash command internally, never yielding the command envelope back on the
// stream, and it mints a fresh uuid for the transcript record — so a shim can
// neither observe a clear nor predict the name the transcript will give it.
// For a compaction the gap is content rather than identity: only the
// transcript carries the summary text, which arrives on a line of its own.
//
// dedup_key is therefore PER-PRODUCER IDENTITY, not a merge contract. It
// names a transcript line stably enough that re-reading it after a restart or
// a cursor rewind produces one event rather than two.

// The context was CLEARED: discarded outright. Nothing survives it, so there
// is no summary to carry and no trigger to record — a clear is always the
// user asking for one, and an automatic clear is not a thing any vendor does.
// The event's existence and its position are the entire fact.
message ContextCleared {}

// Why a compaction happened. Unlike a clear, a compaction can be the system
// deciding it needs one, so the distinction is real and worth carrying — even
// though nothing downstream is expected to BRANCH on it. A compaction is a
// compaction, and consumers treat the two identically by default.
enum ContextCompactTrigger {
  CONTEXT_COMPACT_TRIGGER_UNSPECIFIED = 0;
  CONTEXT_COMPACT_TRIGGER_MANUAL = 1;
  CONTEXT_COMPACT_TRIGGER_AUTO = 2;
}

// The context was COMPACTED: replaced by a summary that stands in for it.
//
// The fields are the COALESCED account of a compaction, which the vendor
// reports across as many as three separate messages (a start status, a
// boundary carrying token counts, and a summary line typed as an ordinary
// user message). Producers fill what their plane knows and the daemon merges
// the twins by uuid, so every consumer downstream reads one complete fact
// instead of correlating three partial ones.
//
// `summary` is the only field the stream plane cannot supply, because the
// vendor emits the summary text as a separate transcript line rather than on
// the boundary itself.
message ContextCompacted {
  ContextCompactTrigger trigger = 1;
  int64 pre_tokens = 2;
  int64 post_tokens = 3;
  int64 duration_ms = 4;
  string summary = 5;
}

message TaskStarted {
  string task_id = 1;
  TaskKind kind = 2;
  string tool_use_id = 3;
  string description = 4;
  string output_path = 5;  // constructed for shells; announced for agents/workflows
}

message TaskProgress {
  string task_id = 1;
  TaskKind kind = 2;
  int64 bytes_observed = 3;   // shell spool growth
  int64 records_observed = 4; // JSONL lines / journal records
}

message TaskEnded {
  string task_id = 1;
  TaskKind kind = 2;
  TerminalStatus status = 3;
  string summary = 4;
  string output_path = 5;
  // How the terminal status was determined, when it was not reported
  // directly: vanished-file | silence-timeout | boot-sweep (the LOST
  // staleness inferences) or exit-marker (a shell spool's own trailing
  // `EXIT=<code>` line). Empty when the producer observed the end directly.
  // Carried for the loud transition log and for frontend display, so "we
  // watched it exit" is distinguishable from "we stopped hearing from it".
  string inference = 6;
}

// EPHEMERAL live-typing delta (delta bypass; see file-top semantics).
message ContentDelta {
  string uuid = 1;         // the claude message uuid consumers reconcile on
  uint32 block_index = 2;
  oneof delta {
    string text = 3;
    string thinking = 4;
    string input_json = 5;  // tool-input streaming (input_json_delta)
    string signature = 6;
  }
  int64 estimated_tokens = 7;  // thinking deltas carry this (may be 0)
  // Stable tool identity for input_json deltas.  The API block index is not
  // sufficient after the durable record has already settled independently.
  optional string tool_use_id = 8;
}

// EPHEMERAL tool_progress relay.
message HeartbeatProgress {
  string tool_use_id = 1;
  string tool_name = 2;
  string parent_tool_use_id = 3;
  double elapsed_seconds = 4;
}

// Durable first-token-latency relay.
//
// The vendor stamps time-to-first-token on the frame that OPENS a streamed
// assistant message — a structural frame the delta bypass otherwise drops,
// since it carries no typing content. This message is that one fact, relayed
// on its own so a live progress display can show first-token latency DURING
// the turn instead of waiting for the turn's terminal result, which carries
// the same number far too late to be useful.
//
// It is persisted and replayed because response-time analysis requires the
// first-token measurement after a daemon restart. The store sequence assigns
// its order relative to the assistant response it describes.
message MessageLatency {
  string uuid = 1;    // the message id the stamp belongs to (ContentDelta.uuid)
  int64 ttft_ms = 2;  // time to first token, as the vendor measured it
}

// Honest sad-path report (store unreachable, converter storm, …).
message DegradedState {
  string component = 1;   // "store-client" | "converter" | ...
  string reason = 2;
  uint64 dropped_count = 3;
  bool recovered = 4;     // true on the closing report of a degraded window
  // Correlates a query-owned degradation with its exact query() invocation.
  // Absent for failures that do not belong to a query lifecycle.
  optional string query_instance_id = 5;
}

// ---------------------------------------------------------------------------
// Control plane (daemon↔shim; Subscribe/StoreWrite also shim↔store)
// ---------------------------------------------------------------------------

// Connection handshakes on the daemon↔shim hop. The DIALER (the shim) speaks
// first with its Hello.
//
// THE HANDSHAKE IS THE WHOLE BRING-UP GATE, not merely a version check. One
// gated exchange — ShimHello, DaemonHello, ShimReady — and its final ack means
// "this session is FULLY WIRED", store subscription included:
//
//   1. ShimHello    shim→daemon: identity, version, turn_in_flight, and the
//                   vendor session id this shim is filing under (the rotation
//                   announcement).
//   2. DaemonHello  daemon→shim: version PLUS the resume position (from_seq)
//                   the daemon wants this session's standing store
//                   subscription opened at.
//   3. ShimReady    shim→daemon: sent ONLY after the shim holds its session
//                   lock, has built its SDK query, has its store producer link
//                   up, and has opened the standing store subscription at that
//                   from_seq and seen it settle.
//
// WHY ONE GATE. Bring-up used to complete in stages — connect, hello, an
// inferred readiness, a separate daemon→shim Subscribe, and only then the
// shim's own store subscription — and everything racing those stages (health
// probes, first prompts) failed in the gaps between them. Each gap patched
// moved the race one link deeper. A single gate whose final ack is the LAST
// step makes the whole class unrepresentable: anything the daemon does after
// the ack is talking to a fully wired session, by construction.
//
// EVERY (RE)CONNECT RE-RUNS IT. A reattach, a daemon restart, and the shim's
// deliberate rotation bounce are all just "a new connection", so each gets its
// from_seq from the hello of the connection it opens. That is why the separate
// daemon→shim Subscribe frame no longer exists on this hop; Subscribe remains
// the shim↔store message it always was.
message ShimHello {
  string session_id = 1;
  string vendor = 2;          // "claude"
  string shim_version = 3;
  string protocol_version = 4;
  bool turn_in_flight = 5;    // true when the daemon reattaches mid-turn
  // The VENDOR session id (the CLI's uuid, and its transcript filename) this
  // shim is CURRENTLY filing events under — the key of the store seq space
  // the daemon is about to Subscribe to. Empty while the shim has not learned
  // it yet: a fresh session's uuid is knowable only from the SDK, so the very
  // first hello of a fresh session carries nothing here rather than a
  // placeholder the daemon would mistake for a real identity.
  //
  // WHY THE HANDSHAKE CARRIES IT. The vendor rotates this uuid mid-stream (a
  // `/clear` mints a new transcript identity), which retires one store seq
  // space and starts another at 1. The shim answers a rotation by re-keying
  // its store subscription and DELIBERATELY bouncing this connection, so the
  // hello opening the next one is the announcement: the daemon compares it
  // with the uuid it has persisted and, when they differ, resets its store
  // cursor to zero before subscribing. Without the announcement the daemon
  // would resume from a high-water mark belonging to a seq space that no
  // longer exists and read the new space's seq=1 as a regression.
  string vendor_session_id = 6;

  // The shim process's OWN pid.
  //
  // WHY THE DAEMON NEEDS IT. A shim outlives its daemon, so a restarted
  // daemon is talking to processes it never spawned and holds no process
  // handle for. `StopShim` is a no-op for those, which meant the daemon
  // could not stop a surviving shim at all — not to bounce a stale one onto
  // a new build, and not to honor an explicit session restart.
  //
  // Killing by pid is normally a PID-REUSE hazard. It is not one here,
  // because the daemon only ever uses this while the CONNECTION that carried
  // it is live: a live connection is proof the process on the other end is
  // the process that opened it. The pid is never persisted and never used
  // after the connection ends.
  int32 pid = 7;
  // The BUILD IDENTITY of the bundle this shim is running: the git revision
  // its `dist/main.js` was built from, injected at build time and matching
  // the `dist/.built-sha` stamp the same build writes.
  //
  // A survivor from before a deploy runs the previous bundle's code forever —
  // it has no idea a deploy happened, and the daemon had no way to tell. The
  // daemon compares this against the CURRENT stamp and gracefully bounces a
  // mismatched shim onto the new build.
  //
  // Empty means a bundle built before this field existed, or a build with no
  // resolvable revision. Neither is a bounce: an unknown identity is not a
  // mismatch, and treating it as one is how a refresh becomes a loop.
  string build_sha = 8;
  // Ordered identities of every accepted prompt still awaiting its SDK result.
  // The first id is the turn whose next result must close. This is the
  // identity-bearing source of truth; turn_in_flight remains its compatibility
  // projection for peers built before this field existed.
  repeated string active_turn_ids = 9;

  // The stable identity of the one SDK query() invocation this shim owns.
  // Every daemon attachment binds its accounting reducer to this value before
  // subscribing to the durable event stream, so a daemon restored after its
  // cursor has passed QueryLifecycle records can validate later usage evidence
  // against the same query without reconstructing or duplicating lifecycle
  // events. Empty is a protocol violation: a shim without a query identity is
  // not a session the daemon can safely drive.
  string query_instance_id = 10;

  // The runtime identity the SDK reported for query_instance_id. Presence
  // means the query reached SDK initialization, and the identity must name
  // this hello's vendor_session_id when that session identity is known. A
  // fresh query may omit this snapshot until its first SDK initialization;
  // a reconnect carries the cached observation so a restored daemon can
  // complete terminal accounting without replaying historical lifecycle rows.
  QueryRuntimeIdentity query_runtime_identity = 11;

  // Gives the QueryCreated record's sequence in vendor_session_id's durable
  // stream. The daemon uses this exact boundary to distinguish catch-up rows
  // from lifecycle contradictions after binding query_instance_id from this
  // handshake. Zero means QueryCreated belongs to a stream key that the SDK
  // replaced when it revealed or rotated the vendor session identity, so the
  // announced stream contains no pre-boundary lifecycle history for this
  // query.
  uint64 query_created_seq = 12;
}

message DaemonHello {
  string daemon_version = 1;
  string protocol_version = 2;
  // The EXCLUSIVE store seq the daemon resumes this session's standing
  // subscription from — its durable last_seen_seq, or 0 for a session it has
  // never consumed (and for the fresh seq space a rotation just minted). The
  // shim opens its store subscription at exactly this position before acking
  // with ShimReady.
  //
  // WHY IT RIDES THE HELLO. It used to travel in a separate daemon→shim
  // Subscribe frame sent after the handshake, which made the store
  // subscription a stage BEYOND the handshake — so a daemon that considered
  // itself attached could probe a shim whose store tail did not exist yet, and
  // be told store_subscribed=false about a session it had just brought up.
  // Carrying it here is what lets the shim finish that wiring INSIDE the gate.
  //
  // The daemon reads it AFTER it has reconciled the vendor session id this
  // connection's ShimHello announced, so a rotation's reset to zero is already
  // applied to the number that lands here.
  uint64 from_seq = 3;
  // The session's PERMISSION POSTURE, taken from the daemon's session record.
  //
  // The daemon resolves a record carrying no mode to "auto" before it writes
  // this field, so the field is NEVER EMPTY on the wire from a daemon that
  // speaks it. An empty value therefore means exactly one thing: the peer is
  // an OLDER daemon that predates this field, and the shim falls back to its
  // --permission-mode argv (rollout compatibility only).
  //
  // The vocabulary is the SHIM's closed set, not a second enum invented here:
  // see the shim's protocol.ts PERMISSION_MODES. A value outside it is a
  // protocol error the shim REFUSES loudly — it withholds ShimReady and
  // reports a DegradedState, exactly as it does when the store link cannot be
  // opened. It never silently falls back to "default".
  //
  // The shim applies it as the session's initial mode inside the bring-up
  // gate, before it acks, so the FIRST turn already runs under it. It TAKES
  // PRECEDENCE over the --permission-mode argv flag: argv is a spawn-time
  // snapshot, while this is read off the record at handshake time, and every
  // reattach re-reads it.
  //
  // WHY IT RIDES THE HELLO. The daemon appended --permission-mode only when
  // the record carried one, so a session created with no explicit mode (the
  // workspace-generation inbox path) spawned a shim whose parser defaulted to
  // "default" — the generated first prompt then ran in prompting mode with
  // nobody there to answer. Carrying the resolved posture in the gate makes
  // "the shim's mode is whatever the record says" true by construction rather
  // than by argv assembly getting every branch right.
  //
  // The per-prompt SubmitPrompt.permission_mode override is unaffected: this
  // sets where the session STARTS, that changes it mid-flight.
  string permission_mode = 4;
}

// The shim's FINAL ACK of the gated handshake: this session is fully wired.
//
// It is an explicit wire message rather than an inference, because everything
// a daemon could infer readiness from is true too early. A completed TCP/UDS
// connect proves only a dialer; a DaemonHello reply proves only that versions
// match; a first event proves only that the vendor said something. None of
// them says the standing store subscription exists, which is precisely the
// dependency the daemon's next act (a health probe, a prompt) needs.
//
// Sending it is the shim asserting, in order: the session lock is held, the
// SDK query is constructed, the store producer link is up, and the standing
// store subscription is open at DaemonHello.from_seq and settled. A shim that
// cannot complete any of those sends NOTHING and reports the failure loudly
// (a DegradedState plus its own log); the daemon's readiness wait then fails
// on its own deadline, which is the honest outcome — never a shim admitted as
// ready with a dependency missing.
message ShimReady {
  string session_id = 1;
  // Echo of DaemonHello.from_seq: the position the standing subscription was
  // actually opened at. An echo rather than a fresh number so the daemon can
  // see the two agree.
  uint64 from_seq = 2;
  // The store key the subscription was opened under — the VENDOR session id
  // when it is known, else the shim's own placeholder id (a fresh session
  // learns the vendor uuid only from the SDK, so its first gate necessarily
  // subscribes under the placeholder and re-keys later). Diagnostic: it is
  // what makes "subscribed to a channel nothing publishes to" visible in the
  // daemon log rather than only as silence.
  string vendor_session_id = 3;
}

message SubmitPrompt {
  string request_id = 1;
  string text = 2;
  string origin = 3;           // "human" | "coordinator" | ...
  string permission_mode = 4;  // optional override
  // Required closed attribution. The shim rejects UNSPECIFIED before touching
  // SDK state and copies this value onto the persistent TurnStarted event.
  PromptOrigin prompt_origin = 5;
}

// Carries a model marker's on-the-wire spelling on the enum value that names
// it.  An EXTENSION rather than a constant because protobuf has no constants:
// an enum value's option is the only construct that puts a literal into the
// SCHEMA itself, where every generated runtime — Go, TypeScript, anything
// added later — reads the same bytes back by reflection instead of restating
// them.
extend google.protobuf.EnumValueOptions {
  string model_marker_literal = 60001;
}

// The closed set of model names the CLI reports that are NOT model ids.
//
// The CLI answers `<synthetic>` whenever it is not running a real nameable
// model.  Treated as an id it is corrosive twice over: it poisons the live
// registry record with a value nothing can ever be spawned under, and it
// reaches the webapp picker as a selectable option that cannot be selected.
// So a marker must be RECOGNIZED before a reported model is committed, and
// recognizing it requires the literal.
//
// That literal was re-declared SIX times — in Go, in the shim, and in three
// inline webapp comparisons — kept aligned by review alone, which is exactly
// the arrangement where one corrected spelling leaves five stale ones and the
// marker silently becomes an id again on the surfaces that missed the change.
// This enum is now the one definition, and the option below is how the other
// five sites read it instead of writing it.
enum ModelMarker {
  MODEL_MARKER_UNSPECIFIED = 0;
  // Not a model: the CLI's own stand-in for "no real nameable model is in
  // play".  Never a spawnable id, never an offerable picker entry.
  MODEL_MARKER_SYNTHETIC = 1 [(model_marker_literal) = "<synthetic>"];
}

// Request a deliberate mid-session model change.  Model selection is a shim
// operation because only the shim owns the live SDK query.  The daemon forwards
// this request and commits the model the shim reports in its Ack; frontends
// never treat a requested value as selected.
message SetModel {
  string request_id = 1;
  string model = 2;
}

// Ask the shim which model the live query is CURRENTLY on.  A read, not a
// change: nothing about the session moves as a result of this message.
//
// WHY A READ IS NEEDED AT ALL.  The argument-less `/model` opens the CLI's own
// interactive picker, which the daemon cannot intercept — the selection is
// made inside the CLI and announced nowhere the daemon is listening.  Without
// this request the daemon learns the outcome only when some later submit
// re-announces a SystemInit, so until the user happens to send a prompt the
// topbar picker names the OLD model, and a hibernation landing in that window
// respawns the session on the stale one.
//
// The answer rides Ack.selected_model, and deliberately not a new field: that
// value is defined as the SHIM's own post-operation state rather than an echo
// the daemon assembled, which is exactly what is being asked for here.  A shim
// that cannot answer NACKs — a guessed model is the failure this whole path
// exists to remove.
message QuerySelectedModel {
  string request_id = 1;
}

// The shim's SDK-provided model menu.  This is published rather than inferred
// by a frontend, because the live query is the only authority on selectable
// model ids for this session/account.
message ModelOption {
  string value = 1;
  string display_name = 2;
  string description = 3;
}

message ModelCatalog {
  string session_id = 1;
  repeated ModelOption models = 2;
}

// Stop the current turn via the SDK's interrupt(). There is exactly one kind
// of interrupt: the old `hard` flag promised a soft "end after the current
// message" variant that no layer ever implemented (the shim always called the
// SDK), so the flag was deleted rather than left as a dial that did nothing.
message Interrupt {
  string request_id = 1;
}

// The three-valued outcome of an Interrupt, decided by the SHIM.
//
// The shim owns turn lifecycle (it counts prompts in and results out) and
// its event loop is single-threaded, so the liveness check inside its
// interrupt handler is naturally atomic against turn end: whichever the
// counter says at that instant IS the answer, and no later event can
// retroactively change it. The ambiguous fourth case — "the turn ended at
// about the moment the stop landed, so was that a stop or a no-op?" — is
// therefore unrepresentable rather than merely unlikely.
//
// Deriving this downstream is what made it ambiguous before: a daemon or a
// frontend watching for an `aborted` result sees the turn end and the
// interrupt arrive as two unordered events, and could not tell a stop that
// FAILED from a turn that had ALREADY ENDED. It painted the second as the
// first.
enum InterruptOutcome {
  INTERRUPT_OUTCOME_UNSPECIFIED = 0;
  // A turn was live and the stop was delivered.
  INTERRUPT_OUTCOME_INTERRUPTED = 1;
  // No turn was live. SUCCESS, not an error: the user asked for the turn to
  // be over and it already is.
  INTERRUPT_OUTCOME_ALREADY_COMPLETE = 2;
  // The stop could not be delivered at all. A route/control failure, and
  // the only outcome that reads as a failure anywhere downstream.
  INTERRUPT_OUTCOME_FAILED = 3;
}

// Stop this session's DETACHED background agents — the subagent, shell and
// workflow tasks that have outlived the turn that launched them.
//
// IT IS NOT AN INTERRUPT AND NOT A VARIANT OF ONE. An Interrupt ends the TURN.
// Detached work has by definition already outlived its turn, so a stop aimed
// at the turn reaches none of it and is answered ALREADY_COMPLETE — which is
// exactly the no-op the state that motivates this command produces. This is
// the other thing, named directly: the tasks are stopped and the turn (if one
// happens to be running) is left alone.
message CancelDetachedAgents {
  string request_id = 1;
}

// Ask the shim which background tasks are LIVE right now, changing nothing.
//
// IT IS THE READ HALF OF THE SAME AUTHORITY CancelDetachedAgents ACTS ON. The
// shim owns the live-task set: it observes every task start and every task end
// on its own SDK stream, on a single-threaded event loop, so a read taken there
// is atomic against task end and cannot be taken anywhere else.
//
// WHY THE DAEMON ASKS. The daemon's task catalog is DERIVED — folded from the
// TaskStarted/TaskEnded events it happens to have seen — and a derived set can
// outlive its driver: a TaskEnded deduped as a replay, a task that ended while
// the daemon was down, a shim roll between the start and the end. Any of those
// leaves an entry the footer renders as running forever with nothing behind it.
// Silence cannot tell that phantom from a subagent that is simply taking a long
// time; only this list can, so the discriminator is the shim's answer and never
// a timeout (daemon/internal/sessioncontroller/phantomtask.go).
message QueryLiveTasks {
  string request_id = 1;
}

// The shim's live background-task set at the instant it answered.
//
// A MESSAGE RATHER THAN A BARE repeated FIELD ON Ack, so that "the session has
// no tasks running" (a present LiveTaskSet with no ids) is distinguishable from
// "this peer does not answer the question" (no LiveTaskSet at all). Closing a
// catalog entry on the second would be closing it on silence, which is the one
// thing this whole path exists not to do.
message LiveTaskSet {
  // Live task ids under the SAME identity TaskStarted and TaskEnded carry, so
  // the daemon can join this list against its catalog directly.
  repeated string task_ids = 1;
}

// What a CancelDetachedAgents actually did, decided by the SHIM.
//
// The shim decides it for the same reason it decides InterruptOutcome: it owns
// the live-task set — it observes every task start and every task end on its
// own SDK stream, on a single-threaded event loop — so the read that answers
// "what was running when this landed?" is atomic against task end there and
// nowhere else. A daemon deriving it from the event stream would see the stop
// and the last task's end as two unordered facts.
//
// A ONEOF OF MESSAGES RATHER THAN AN ENUM, because the arms do not carry the
// same payload: a stop that happened carries the tasks it reached, and a stop
// that could not be attempted carries the sentence saying why.
message DetachedCancelOutcome {
  oneof outcome {
    DetachedAgentsCancelled cancelled = 1;
    NoDetachedAgentsRunning nothing_running = 2;
    DetachedCancelUnsupported unsupported = 3;
  }
}

// Detached work was running, and the stop was delivered to every task named
// here.
message DetachedAgentsCancelled {
  // The tasks the stop reached, under the SAME task_id TaskStarted and
  // TaskEnded carry — so a consumer can join this list against the task
  // lifecycle it already tracks.
  //
  // THE IDS, NOT A COUNT. The daemon settles exactly these tasks' async
  // bubbles the moment the stop is acked; a bare count would leave it
  // guessing which bubbles it had just been told about.
  repeated string task_ids = 1;
}

// No detached work was running when the stop landed.
//
// At the WIRE level this is an answer, not a failure: the session was asked
// what it had running and said "nothing". Whether that reads as a refusal to
// the person who pressed the key is the daemon's ruling to make, not the
// shim's.
message NoDetachedAgentsRunning {}

// The stop could not be ATTEMPTED at all — the session holds no live query to
// ask, or the running vendor CLI exposes no task-stop control.
//
// Distinct from `nothing_running`: that one is a session that answered, this
// one is a session that could not be asked. Conflating them would report a
// missing capability as an idle session.
message DetachedCancelUnsupported {
  // Why, in one sentence, for the daemon log and the frontend's failure card.
  string detail = 1;
}

message Ack {
  string request_id = 1;
  // Set only on an Interrupt's ack; UNSPECIFIED on every other command,
  // whose success is unqualified.
  InterruptOutcome interrupt_outcome = 2;
  // Set on the receipt of EITHER model command — a SetModel (the model after
  // the change) or a QuerySelectedModel (the model with nothing changed).  One
  // field for both because both answer the same question and both answer it
  // with the same authority: the shim's own post-operation selected model, not
  // an echo assembled by the daemon.  UNSET on every other command's ack.
  string selected_model = 3;
  // Set only on a CancelDetachedAgents' ack; UNSET on every other command's.
  // The whole outcome travels here rather than as an `ok` the daemon would
  // then have to qualify: a stop that reached three agents, a session with
  // nothing detached, and a session that could not be asked are three
  // different answers a frontend renders three different ways.
  DetachedCancelOutcome detached_cancel_outcome = 4;
  // Set only on a QueryLiveTasks' ack; UNSET on every other command's. Its
  // PRESENCE is the assertion — an ack carrying the message with no ids says
  // "nothing is running", while an ack without it says "this shim never
  // answered", and the daemon acts only on the first.
  LiveTaskSet live_task_set = 5;
}

message Nack {
  string request_id = 1;
  string reason = 2;
  // Set on a rejected SetModel request so the daemon can return the live
  // selection to the frontend without guessing or changing it optimistically.
  string selected_model = 3;
}

// Replay handshake (see file-top semantics). from_seq is EXCLUSIVE.
//
// A SHIM→STORE message. The daemon↔shim hop carries its resume position on
// DaemonHello.from_seq instead, so the standing subscription is opened inside
// the bring-up gate rather than as a stage after it.
message Subscribe {
  string session_id = 1;
  uint64 from_seq = 2;
}

// ---------------------------------------------------------------------------
// Bounded historical replay (daemon→shim). See design §5.4.1.
// ---------------------------------------------------------------------------
//
// Subscribe above moves the STANDING subscription: the serving side replays
// from from_seq and then live-tails there forever. That is the wrong shape for
// "a frontend mounted and needs history the daemon no longer holds", because
// it would drag the daemon's own consumption position backwards and re-deliver
// history down the live path, where the SSM, the task catalog, and the progress
// resolver would apply it a second time.
//
// ReplayRequest is the right shape: a BOUNDED, one-shot, side-channel range.
// The shim serves it from a THROWAWAY store subscription of its own and leaves
// the standing one exactly where it was.
//
// WHY THE SHIM SERVES IT rather than the daemon dialling the store directly:
// the store is an internal of the agent-shim facade. A daemon that dials it
// leaks the socket location, the connection lifecycle, and the vendor-uuid
// keying rule across the boundary — and serving history through that side door
// while the shim is down would be a FALLBACK (metaprompt no-fallbacks rule):
// the shim IS the session's transport, and an outage must surface, not be
// papered over with a second route to the same data.
message ReplayRequest {
  string request_id = 1;
  // EXCLUSIVE lower bound, matching Subscribe.from_seq.
  uint64 from_seq = 2;
  // EXCLUSIVE upper bound: the first seq the requester's own live window
  // already covers, so the replay stops on reaching it. 0 = no upper bound,
  // and the serving side then streams until its replay drains.
  uint64 to_seq = 3;
  // The requester's cap on how many events this one replay may deliver.
  // 0 = the serving side's own default. A cap that trips is reported as a
  // TRUNCATED ReplayDone, never as a quiet short answer.
  uint32 max_events = 4;
}

// One replayed historical event.
//
// This is a WRAPPER, deliberately, rather than a request_id field on Event.
// The distinction is structural and load-bearing: a replay frame is a
// DIFFERENT MESSAGE TYPE on the wire, so a receiver's frame demux cannot route
// it into the live-event path even by mistake. Tagging Event itself would have
// left both kinds arriving as the same type, with only an if-statement between
// replayed history and live state — exactly the "remember to check" discipline
// this replaces ("structurally impossible beats very improbable", metaprompt).
//
// Two lesser reasons point the same way. Event.request_id is already taken, by
// the control-request correlation described at the top of this file. And the
// replayed Event is a VERBATIM copy of the persisted record; stamping a
// transport-only id into it would both mutate that copy and push a daemon↔shim
// concern into a schema the store persists.
message ReplayEvent {
  string request_id = 1;
  Event event = 2;
}

// Closes a replay. Exactly one per ReplayRequest, whatever the outcome: a
// replay that simply stops streaming would be indistinguishable from one still
// in flight.
message ReplayDone {
  string request_id = 1;
  // True when a bound tripped before to_seq was reached (the event cap, an
  // idle store subscription, a lost connection). The requester received only
  // PART of the range it asked for and must say so rather than presenting the
  // result as complete.
  bool truncated = 2;
  // Why it was truncated, verbatim. Empty when truncated is false.
  string reason = 3;
  // How many ReplayEvents were sent for this request.
  uint64 delivered = 4;
}

// canUseTool round-trip. The shim BLOCKS the SDK callback on the response.
message PermissionRequest {
  string request_id = 1;
  string tool_name = 2;
  google.protobuf.Struct input = 3;
}

message PermissionResponse {
  string request_id = 1;
  PermissionDecision decision = 2;
  google.protobuf.Struct updated_input = 3;  // optional allow-with-edits
  string deny_message = 4;
}

// Daemon-composed permission state (the request plus its resolution
// lifecycle), pushed to frontends as a conversation item. Lives beside the
// request/response vocabulary it composes (S8/S9).
message PermissionItem {
  PermissionRequest request = 1;
  enum Resolution {
    RESOLUTION_UNSPECIFIED = 0;
    RESOLUTION_PENDING = 1;
    RESOLUTION_ALLOWED = 2;
    RESOLUTION_DENIED = 3;
    RESOLUTION_ABANDONED = 4;
  }
  Resolution resolution = 2;
  string deny_message = 3;  // set when RESOLUTION_DENIED
}

message Heartbeat {
  int64 sent_at_ms = 1;
}

// Correlated dependency health probe for every agent-shim UDS hop.
//
// A live Unix socket (or even a completed transport handshake) is not a
// health assertion: a peer can accept a connection while its dependency has
// already failed.  The requester therefore names this probe with an opaque
// request_id and accepts health only from the matching HealthStatus response.
// The store answers it directly; a per-session shim answers it only after it
// has checked the store dependency it owns.  It is deliberately control-plane
// material, not an Event: health is an observation at one instant and must
// never enter the durable conversation stream.
message HealthCheck {
  string request_id = 1;
}

// Reply to HealthCheck.  A responder MUST set healthy=true only after every
// dependency in its own responsibility boundary has passed.  healthy=false
// is an explicit failed assertion, never a soft warning; reason must explain
// the failed dependency and is surfaced by the daemon/frontend unchanged.
message HealthStatus {
  string request_id = 1;
  bool healthy = 2;
  string component = 3;
  string reason = 4;
}

// Producer→store append. The store commits events + cursor_advance in one
// transaction and acks with dedup accounting.
message StoreWrite {
  string producer = 1;  // "claude-shim:<session>" | "shim-claude-sidecar"
  EventBatch batch = 2;
}

message StoreWriteAck {
  uint64 accepted = 1;
  uint64 deduped = 2;
  uint64 last_seq = 3;  // highest seq assigned in this batch's session
  string error = 4;     // non-empty = the whole batch was rejected (loudly)
}

// shim-claude-sidecar file-cursor state, persisted by the store (§6.2 cursor table).
message CursorState {
  string file_id = 1;  // "dev:inode"
  string path = 2;
  int64 offset = 3;
  bytes carry = 4;     // bounded partial-line carry
}

// Cursor recovery over the socket (§7.3): the sidecar asks the store for its
// persisted cursors at startup. Empty file_id = all cursors.
message CursorQuery {
  string file_id = 1;
}

message OpenTaskState {
  Event started = 1;
  int64 last_activity_at_ms = 2;
}

message CursorList {
  repeated CursorState cursors = 1;
  // Authoritative persisted tasks with no TaskEnded for the same session/task
  // identity. Returned with an all-cursors startup query so the sidecar
  // restores liveness and last activity from durable state, not file presence.
  repeated OpenTaskState open_tasks = 2;
  // True only when open_tasks was computed by a store that implements the
  // authoritative lifecycle query. Distinguishes an empty set from an older
  // store that does not understand field 2.
  bool open_tasks_authoritative = 3;
}

// Runtime that originated a FilePlaneDiagnostic. File-plane diagnostics come
// from the sidecar; other runtimes use their own canonical logging paths.
enum DiagnosticSourceRuntime {
  DIAGNOSTIC_SOURCE_RUNTIME_UNSPECIFIED = 0;
  DIAGNOSTIC_SOURCE_RUNTIME_SIDECAR = 1;
}

// Canonical diagnostic record emitted by the file-plane sidecar. It is valid
// only on a PERSISTENT Event with plane = PLANE_FILE. session_id identifies
// the vendor session, produced_at_ms is the source timestamp, and request_id
// remains the dedicated control-request correlation field on Event. The
// sidecar does not know workspace identity, so this payload must not duplicate
// workspace fields. source_runtime must be
// DIAGNOSTIC_SOURCE_RUNTIME_SIDECAR.
message FilePlaneDiagnostic {
  DiagnosticSourceRuntime source_runtime = 1;
  // One of: debug, info, warn, error.
  string level = 2;
  // One of: normal, verbose. Verbosity controls live visibility, never
  // persistence.
  string verbosity = 3;
  // Stable machine-readable operation name.
  string operation = 4;
  // Concise human-readable description.
  string message = 5;
  // Structured operation-specific evidence.
  google.protobuf.Struct context = 6;
  // PID of the sidecar process that emitted the source record.
  int64 source_pid = 7;
  // Source file path when context alone cannot identify the relevant file.
  string source_path = 8;
}
