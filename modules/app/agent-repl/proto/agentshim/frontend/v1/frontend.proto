// agentshim.frontend.v1 — the daemon→frontend resolved surface.
//
// TRANSPORT: canonical proto3 JSON (protojson) frames — UDS to Emacs, WS/TCP
// to the webapp. Both frontends consume literally these messages; neither
// derives state independently (the whole point of the redesign).
//
// SEMANTICS:
// - On (re)connect the daemon sends StateSnapshot first, then deltas.
// - WorkspaceState is THE resolved render-state; frontends map .state to
//   their display vocabulary and never re-derive from raw facts.
// - TypingDelta is ephemeral (embeds core.ContentDelta); consumers reconcile
//   per uuid, replacing previews when the ConversationDelta carrying the
//   complete message arrives.
// - DegradedNotice is honest sad-path reporting (store/sidecar/shim outage);
//   frontends display it, they do not work around it.

syntax = "proto3";

package agentshim.frontend.v1;

import "agentshim/core/v1/core.proto";
import "agentshim/data/v1/stream.proto";
import "agentshim/data/v1/tools.proto";
import "agentshim/data/v1/transcript.proto";
import "google/protobuf/struct.proto";

option go_package = "agentrepl/proto/agentshim/frontend/v1;frontendv1";

// The closed render-state vocabulary (SSM-resolved).
enum RenderState {
  RENDER_STATE_UNSPECIFIED = 0;
  RENDER_STATE_INIT = 1;
  RENDER_STATE_IDLE = 2;
  RENDER_STATE_IDLE_ASYNC = 3;
  RENDER_STATE_THINKING = 4;
  RENDER_STATE_PERMISSION = 5;
  RENDER_STATE_DONE = 6;
  RENDER_STATE_STOP_FAILED = 7;
  RENDER_STATE_MERGING = 8;
  RENDER_STATE_MERGE_QUEUED = 9;
  RENDER_STATE_MERGE_CONFLICT = 10;
  RENDER_STATE_MERGE_FAILED = 11;
  RENDER_STATE_MERGED = 12;
  RENDER_STATE_DEAD = 13;
  RENDER_STATE_DEGRADED = 14;
}

message FrontendFrame {
  oneof frame {
    StateSnapshot snapshot = 1;
    WorkspaceState workspace_state = 2;
    SessionView session_view = 3;
    ConversationDelta conversation_delta = 4;
    TypingDelta typing_delta = 5;
    TaskCatalog task_catalog = 6;
    CommandAck command_ack = 7;
    DegradedNotice degraded_notice = 8;
    DaemonView daemon_view = 9;   // Additive (S7)
    SessionInitView session_init = 10;  // Additive (S9)
    HeartbeatView heartbeat = 11;       // Additive (E4)
    QueueView queue = 12;               // Additive (E4)
    ProgressView progress = 13;         // Additive (F1)
  }
}

// Additive (S7): daemon-level identity/liveness Emacs read from GET /sessions'
// envelope (boot detection, version-mismatch warnings, binary staleness).
message DaemonView {
  string boot_id = 1;
  string protocol_version = 2;
  int64 daemon_binary_mtime_ms = 3;
  string daemon_version = 4;
}

// THE resolved per-workspace state, plus the inputs snapshot that produced
// it (for debuggability: a frontend can show WHY a state was resolved).
message WorkspaceState {
  string workspace = 1;
  string session_id = 2;
  RenderState state = 3;
  // Resolution inputs (SSM):
  bool turn_active = 4;
  int64 live_task_count = 5;
  string merge_phase = 6;
  string cause_kind = 7;  // event kind that caused this transition
  uint64 cause_seq = 8;   // store seq when event-caused (0 = daemon-local)
  int64 at_ms = 9;
}

message SessionView {
  string workspace = 1;
  string session_id = 2;
  string model = 3;
  string slug = 4;
  string title = 5;
  int64 total_tokens = 6;
  double total_cost_usd = 7;
  int64 context_window = 8;
  string permission_mode = 9;
  bool shim_attached = 10;
  // Additive (S6): resume/rebind keys the webapp lost in the cutover.
  string claude_session_id = 11;
  string cwd = 12;
  // Additive (S7): GET /sessions parity so Emacs can drop HTTP entirely.
  bool terminal = 13;
  string death_reason = 14;
  bool rehydratable = 15;
  bool hibernated = 16;
  int64 pending_permissions = 17;
  // Additive (S8): account identity — the CLAUDE_CONFIG_DIR the session's
  // shim runs against (account switching is daemon-executed, webapp-initiated).
  string config_dir = 18;
}

// Complete (store-round-tripped) conversation additions, composed from the
// typed agent payloads (S9). daemon/internal/frontend/translate.go CURATES
// which payloads are pushed but never re-types them — frontends render,
// never interpret.
message ConversationDelta {
  string workspace = 1;
  string session_id = 2;
  repeated ConversationItem items = 3;
  uint64 through_seq = 4;  // frontends persist this for reconnect resync
}

// One curated conversation addition: a thin envelope around the typed
// data.v1/core.v1 payload. Consumers reconcile by uuid (permission items
// use the permission request_id as their uuid).
message ConversationItem {
  string uuid = 1;
  int64 ts_ms = 2;
  string request_id = 3;  // vendor API request correlation, "" when absent
  oneof item {
    agentshim.data.v1.ApiAssistantMessage assistant_message = 10;
    agentshim.data.v1.ApiUserMessage user_message = 11;
    agentshim.data.v1.ToolUseBlock tool_use = 12;
    agentshim.data.v1.ToolResultBlock tool_result = 13;
    agentshim.data.v1.ToolUseResult tool_use_result = 14;
    agentshim.data.v1.ResultMessage result = 15;
    agentshim.data.v1.CompactBoundary compact_boundary = 16;
    agentshim.data.v1.CompactBoundaryLine compact_boundary_line = 17;
    agentshim.data.v1.ApiErrorLine api_error = 18;
    agentshim.core.v1.PermissionItem permission = 30;
  }
}

// Ephemeral live-typing relay (never persisted, never in snapshots).
message TypingDelta {
  string workspace = 1;
  string session_id = 2;
  agentshim.core.v1.ContentDelta delta = 3;
}

// Additive (E4): EPHEMERAL long-tool liveness relay. The shim already emits
// core.v1.HeartbeatProgress over its UDS while a tool runs; before this arm
// existed the daemon had nowhere to put it and dropped it (a schema-forced
// drop). This is the arm.
//
// The embedded HeartbeatProgress is carried UNCHANGED, exactly as TypingDelta
// carries ContentDelta: the daemon relays, it does not re-type. Consumers key
// on progress.tool_use_id to find the running tool and use
// progress.elapsed_seconds to tick its liveness, so a long-running tool stops
// looking hung. Like TypingDelta it is never persisted and never appears in a
// StateSnapshot — a frontend that reconnects simply waits for the next
// heartbeat.
message HeartbeatView {
  string workspace = 1;
  string session_id = 2;
  agentshim.core.v1.HeartbeatProgress progress = 3;
}

// The session's retained SystemInit (slash commands, tools, skills, model
// list), pushed on attach and included in StateSnapshot (S9). Replaces the
// Emacs GET /commands HTTP menu source.
message SessionInitView {
  string workspace = 1;
  string session_id = 2;
  agentshim.data.v1.SystemInit init = 3;
}

message TaskEntry {
  string task_id = 1;
  string kind = 2;         // "agent" | "shell" | "workflow"
  string description = 3;
  string status = 4;       // running | done | error | killed | stopped | lost
  string output_path = 5;
  int64 started_at_ms = 6;
  int64 ended_at_ms = 7;   // 0 = still open
}

message TaskCatalog {
  string workspace = 1;
  string session_id = 2;
  repeated TaskEntry tasks = 3;
}

// Frontend→daemon commands (the ONLY inbound frame).
message FrontendCommand {
  string request_id = 1;
  string workspace = 2;
  oneof command {
    SubmitPromptCmd submit_prompt = 3;
    InterruptCmd interrupt = 4;
    PermissionAnswerCmd permission_answer = 5;
    MergeWorkspaceCmd merge_workspace = 6;
    CloseWorkspaceCmd close_workspace = 7;
    OpenWorkspaceCmd open_workspace = 8;
    ResyncCmd resync = 9;
    CreateSessionCmd create_session = 10;  // Additive (S7)
    DeleteSessionCmd delete_session = 11;  // Additive (S7)
    ShutdownCmd shutdown = 12;             // Additive (S9)
    ClientLogCmd client_log = 13;          // Additive (E4)
    QueueForceCmd queue_force = 14;        // Additive (E4)
    QueueAcceptCmd queue_accept = 15;      // Additive (E4)
    QueueCancelCmd queue_cancel = 16;      // Additive (E4)
  }
}

// ---------------------------------------------------------------------------
// The daemon-held prompt queue (E4).
//
// A prompt submitted while the session's turn is already running is NOT
// forwarded. The daemon holds it, asks a classifier whether it is the sort of
// thing the agent should hear NOW rather than after the turn, and either
// interjects it (interrupt, then submit once the turn has actually ended) or
// leaves it to be delivered FIFO when the turn ends on its own.
//
// EVERY message here is frontend surface, not shim wire. A queued prompt is an
// artifact of the DAEMON's decision to hold it back — the vendor never saw it
// and has no message for it — and the queue commands are a user-facing
// representation of an interject, whose MECHANISM (Interrupt then SubmitPrompt)
// is what actually crosses the shim UDS. See agent-shim/AGENTS.md, which uses
// this feature as its worked example of the boundary.
// ---------------------------------------------------------------------------

// What the classifier decided about a queued prompt.
enum QueueClassification {
  // Never set by the daemon. Present because proto3 reserves 0 for "the field
  // was not populated", and PENDING is a REAL verdict ("the classifier is
  // running") that must not share an encoding with "nobody said anything".
  // Every QueueEntry the daemon builds sets one of the four states below, so a
  // receiver seeing UNSPECIFIED is looking at a malformed frame and must
  // reject it loudly rather than guess which state was meant.
  QUEUE_CLASSIFICATION_UNSPECIFIED = 0;
  // Not yet classified: the entry is queued and the classifier is running.
  QUEUE_CLASSIFICATION_PENDING = 1;
  // Deliver NOW: interrupt the running turn and submit once it has ended.
  QUEUE_CLASSIFICATION_INTERJECT = 2;
  // Deliver when the turn ends on its own; do not interrupt for it.
  QUEUE_CLASSIFICATION_HOLD = 3;
  // The classifier could not be believed (it answered with neither token, or
  // both). Surfaced as its own state rather than silently defaulted to one of
  // the real verdicts: a frontend must be able to see that nothing decided
  // this. Delivery falls back to the ordinary turn-end drain, so an
  // unclassifiable prompt is delayed, never dropped.
  QUEUE_CLASSIFICATION_ERROR = 4;
}

// One prompt the daemon is holding.
message QueueEntry {
  string id = 1;
  string text = 2;
  int64 queued_at_ms = 3;
  QueueClassification classification = 4;
  // The classifier's stated reason, or the failure detail on ERROR. Free text
  // for display; never parsed.
  string rationale = 5;
  // Set by QueueAcceptCmd: the user has seen and confirmed this entry's HOLD.
  // View state only — it changes nothing about when the entry is delivered.
  bool accepted = 6;
}

// The session's queue, pushed on EVERY change and carried in StateSnapshot.
// An empty entries list is a meaningful value (the queue drained, or the
// session died), not an absent one.
message QueueView {
  string workspace = 1;
  string session_id = 2;
  repeated QueueEntry entries = 3;
}

// Deliver this entry NOW — the user overriding the classifier, or not waiting
// for it. Runs exactly the same interject sequence an INTERJECT verdict does.
message QueueForceCmd {
  string entry_id = 1;
}

// Confirm a HOLD entry. View state only: the entry is still delivered by the
// ordinary turn-end drain, on the same schedule it already had.
message QueueAcceptCmd {
  string entry_id = 1;
}

// Drop an entry. It is never delivered.
message QueueCancelCmd {
  string entry_id = 1;
}

// The severity of a ClientLogCmd. A closed vocabulary rather than a free
// string, so a frontend cannot invent a level the daemon has no policy for.
enum ClientLogLevel {
  CLIENT_LOG_LEVEL_UNSPECIFIED = 0;
  CLIENT_LOG_LEVEL_INFO = 1;
  CLIENT_LOG_LEVEL_WARN = 2;
  CLIENT_LOG_LEVEL_ERROR = 3;
}

// Additive (E4): a frontend-side diagnostic line, mirrored into the daemon's
// own on-disk log.
//
// WHY THIS EXISTS: the webapp runs inside an Emacs xwidget whose JS console
// nobody can see and nothing persists, so a delivery-path failure there (a
// seq-gap loop, a lost replay request, a stalled rAF) left no evidence
// anywhere at all. A pre-cutover HTTP route carried these; it was deleted with
// the rest of the legacy plane, and this arm restores the capability on the
// protobuf channel instead of reviving a second transport.
//
// The daemon WRITES these, it does not act on them: a client log is evidence,
// never a control signal, and is tagged in the log so a line originating in a
// frontend is never mistaken for one the daemon produced itself.
message ClientLogCmd {
  ClientLogLevel level = 1;
  string message = 2;
  // Optional structured payload (ids, counters, timings) accompanying the
  // message. Schemaless on purpose: it is diagnostic evidence whose shape is
  // the reporting call site's business, and pinning a schema here would make
  // adding a diagnostic a proto change.
  google.protobuf.Struct context = 3;
}

// Additive (S9): graceful daemon shutdown over UDS (replaces Emacs
// POST /shutdown).
message ShutdownCmd {}

// Additive (S7): session creation over UDS (replaces Emacs POST /sessions).
message CreateSessionCmd {
  string cwd = 1;
  string model = 2;
  string permission_mode = 3;
  string config_dir = 4;
  string resume_claude_session_id = 5;  // "" = fresh
  bool fake = 6;                        // test harness sessions
  // The caller's DELIBERATE consent to create a session with NO permission
  // gate. Required whenever permission_mode names a mode that shadows the
  // shim's canUseTool callback in the fail-OPEN direction
  // (bypassPermissions): under such a mode the SDK auto-approves every tool
  // before canUseTool is consulted, so the daemon's whole permission
  // round-trip never engages and no permission card can ever appear.
  //
  // The daemon REFUSES such a create without this flag. The mode is otherwise
  // one string away from every ordinary create, and "reachable by a typo" is
  // not an acceptable property for the switch that turns the gate off. It is
  // a create-time consent only: a session already registered in that mode
  // still rehydrates after a daemon restart, since refusing there would
  // silently change a live session's posture.
  bool allow_ungated = 7;
}

// Additive (S7): session teardown over UDS (replaces DELETE /sessions/{id}).
message DeleteSessionCmd {
  string session_id = 1;
}

message SubmitPromptCmd {
  string text = 1;
  string permission_mode = 2;
}

message InterruptCmd {
  bool hard = 1;
}

message PermissionAnswerCmd {
  string permission_request_id = 1;
  bool allow = 2;
  google.protobuf.Struct updated_input = 3;
  string deny_message = 4;
}

message MergeWorkspaceCmd {
  string handler = 1;  // e.g. "cherry-pick"
  bool conflict_resolved_continue = 2;  // the resolve-and-continue handoff
  // Additive (S6): the daemon has no workspace→worktree mapping of its own,
  // so the frontend supplies the merge geometry with the command.
  string source_branch = 3;
  string source_dir = 4;
  string target_dir = 5;
}

message CloseWorkspaceCmd {}

message OpenWorkspaceCmd {}

message ResyncCmd {
  uint64 from_seq = 1;
}

message CommandAck {
  string request_id = 1;
  bool ok = 2;
  string error = 3;
}

message DegradedNotice {
  string component = 1;  // "shim-store" | "shim-sidecar" | "claude-shim:<id>"
  string reason = 2;
  bool recovered = 3;
  int64 at_ms = 4;
}

// ---------------------------------------------------------------------------
// The consolidated progress footer (F1).
//
// ONE daemon-resolved frame carrying the footer's ENTIRE input: the phase
// mirror, the live tickers, the activity windows, and the ephemeral counts.
// It replaces the constellation of scattered in-flight indicators the webapp
// used to derive for itself (the thinking/working/retrying tail rows and the
// pulse machinery that orbited them).
//
// Resolved by daemon/internal/progress, a SIBLING of the SSM: it folds the
// same store event stream plus the ephemeral relays into a latest-wins
// ProgressView per workspace, pushed on change and carried in StateSnapshot.
// Frontends RENDER it; they never re-derive any of it.
//
// Deliberately NO output-token ticker. The token cell shows the CURRENT
// TURN's cumulative INPUT tokens (cached + uncached) only; the running
// output-token figure is explicitly unwanted, so the message_delta usage
// relay is out of this frame's scope entirely. Session-wide and per-model
// token figures are topbar territory (SessionView) and never appear here.
// ---------------------------------------------------------------------------

// An activity window: open until cleared. Each window is its own message so
// window-specific detail has a home rather than being flattened into a
// stringly-typed status.
message ProgressWindow {
  bool active = 1;
  int64 since_ms = 2;
  // Window-specific detail (a hook name, an auth prompt line, a retry's
  // attempt/status summary). Free text for display; never parsed.
  string detail = 3;
}

// The rate-limit window, which carries structured detail no other window
// needs (a reset deadline and a utilization fraction).
message RateLimitWindow {
  bool active = 1;
  int64 resets_at = 2;    // epoch SECONDS (the vendor event's own unit)
  double utilization = 3;
  string status = 4;      // e.g. "allowed_warning"
}

message ProgressView {
  string workspace = 1;
  string session_id = 2;

  // Phase mirror: the SSM's resolved state, repeated here so the footer has
  // one self-sufficient input. Never re-derived frontend-side.
  RenderState state = 3;

  // Turn clock: 0 = no turn in flight.
  int64 turn_started_at_ms = 4;

  // Live tickers (latest-wins), coalesced daemon-side so a high-frequency
  // source cannot drive the frame rate.
  int64 thinking_tokens = 5;   // data.ThinkingTokens.estimated_tokens
  int64 input_tokens = 6;      // THIS TURN's cumulative cached+uncached input
  int64 ttft_ms = 7;           // first-token latency of the current message

  // Activity windows: open until cleared.
  ProgressWindow compacting = 8;       // data.StatusMessage status="compacting"
  ProgressWindow retrying = 9;         // data.ApiRetry, else the ApiErrorLine
                                       // retry family (see §retry sourcing)
  ProgressWindow authenticating = 10;  // data.AuthStatus
  ProgressWindow hook = 11;            // data.HookStarted / HookResponse
  RateLimitWindow rate_limited = 12;   // data.RateLimitEvent

  // The session itself reporting it is parked on the USER
  // (data.SessionStateChanged state="requires_action").
  //
  // NOT A PHASE. `state` above remains the SSM's verdict and the SSM remains
  // the sole phase authority; this is an activity window like every other one
  // here, and it exists because it carries a fact the daemon cannot otherwise
  // see: the session can be blocked on an interaction the daemon holds no
  // count for, so `pending_permissions` alone under-reports "waiting on you".
  ProgressWindow blocked = 18;

  // Error state: persists until the next turn starts. Set from a terminal
  // ApiErrorLine (retries exhausted) or an errored turn end.
  string error_summary = 13;
  // The uuid of the conversation item the error summary came from, so a
  // frontend can scroll its feed to that item. Empty when the summary has no
  // addressable item (a turn-end error carries no ApiErrorLine of its own).
  string error_item_uuid = 17;

  // Counts (ephemeral, session-scoped):
  int64 pending_permissions = 14;
  int64 queue_depth = 15;
  int64 live_task_count = 16;
}

// Full resync on (re)connect: current state of every workspace + open tasks.
message StateSnapshot {
  repeated WorkspaceState workspaces = 1;
  repeated SessionView sessions = 2;
  repeated TaskCatalog catalogs = 3;
  DaemonView daemon = 4;  // Additive (S7)
  repeated SessionInitView inits = 5;  // Additive (S9)
  repeated QueueView queues = 6;  // Additive (E4)
  repeated ProgressView progress = 7;  // Additive (F1)
}
