// agentshim.frontend.v1 — the daemon→frontend resolved surface.
//
// TRANSPORT: canonical proto3 JSON (protojson) frames — UDS to Emacs, WS/TCP
// to the webapp. Both frontends consume literally these messages; neither
// derives state independently (the whole point of the redesign).
//
// SEMANTICS:
// - On (re)connect the daemon sends StateSnapshot first, then deltas.
// - WorkspaceState is THE resolved render-state; frontends map .state to
//   their display vocabulary and never re-derive from raw facts.
// - TypingDelta is ephemeral (embeds core.ContentDelta); a preview is replaced
//   when the ConversationDelta carrying the complete message arrives. The two
//   sides share NO id and cannot: ContentDelta.uuid is the ANTHROPIC message
//   id (stamped at the shim, the only identity a message shares with its own
//   stream), while ConversationItem.uuid is the record ENVELOPE's id, which
//   does not exist until the message has finished being emitted. Consumers
//   therefore MATCH a finished block to its preview (same message, same kind)
//   rather than looking it up, and dedup records on the envelope uuid.
//   In particular ContentDelta.block_index is the TRUE API block ordinal,
//   while an assistant record's own `content` array holds exactly one block
//   (the SDK emits one record per block) — so that array index is always 0 and
//   is NOT an identity. Deriving one from it renders a message's blocks twice.
// - A shim/store/sidecar outage is honest sad-path reporting, surfaced as a
//   self-resolving SystemFailureItem conversation card; frontends display
//   it, they do not work around it.

syntax = "proto3";

package agentshim.frontend.v1;

import "agentshim/core/v1/core.proto";
import "agentshim/data/v1/stream.proto";
import "agentshim/data/v1/tools.proto";
import "google/protobuf/struct.proto";

option go_package = "agentrepl/proto/agentshim/frontend/v1;frontendv1";

// The closed render-state vocabulary (SSM-resolved).
//
// Every state maps onto ONE of six colors, and the colors are a promise to
// the user about what they can do rather than a description of daemon
// internals. Frontends key their render tables on the color, so the tab-bar,
// the sidebar dots, and the progress footer can never disagree:
//
//   BLUE   INIT, SEVERED, DEAD, DEGRADED — the route Emacs→daemon→shim→SDK is
//          compromised on OUR side, and there is EVIDENCE of the breakage. A
//          bring-up in flight (INIT), a bring-up that failed or a session controller that
//          died on a terminal protocol error (SEVERED), a dead or unspawned
//          shim, a store outage, or a failed backfill. Blue is the honest
//          state whenever green's promise cannot be kept AND something is
//          actually wrong.
//   TEAL   HIBERNATED — nothing is wired, and nothing is wrong. We put the
//          session to sleep on purpose to reclaim its ~500MB, or nothing has
//          ever been wired to this workspace. It makes the SAME actionability
//          claim blue does (you cannot interact without a bring-up) and the
//          REASON is benign, which is exactly why it is not blue: blue's job
//          is to mean "something is broken", and a hibernation rendered blue
//          spent that meaning on the most ordinary event in the system.
//   PURPLE VENDOR_BLOCKED — the last turn ended AT THE VENDOR or on the
//          ACCOUNT. Auth, usage limit, persistent 4xx/5xx, or any other
//          abnormal turn-CONCLUDING error. It is a REPORT of that
//          conclusion, the counterpart to green's "ended normally", and
//          gates nothing: prompting stays available, and the next thing
//          the agent does replaces it.
//   RED    THINKING, CLEARING, COMPACTING — a turn is in flight. The three
//          share the color because they share the claim; only the phase WORD
//          distinguishes what the agent is busy with.
//   YELLOW IDLE_ASYNC — no foreground turn, but detached work is live.
//   GREEN  READY, IDLE, DONE, PERMISSION — the route is proven usable
//          WITHOUT requiring a first message. A pending permission is
//          GREEN: the agent is ready for the user to view the response and
//          answer.
//
// A WORKSPACE'S COLOR IS CONNECTION TRUTH. Blue and teal both mean there is
// no live backend session for this workspace; they differ only on whether
// that is a fault or a choice. Every OTHER color is a GUARANTEE that the
// session substrate is fully wired — shim live, handshake complete, store
// link settled — so selecting a green, red, yellow or purple workspace
// involves no connection bootstrapping whatsoever.
//
// Precedence is blue > purple > red > yellow > green, resolved in the SSM's
// SQL rank table (daemon/internal/ssm/resolve.go) rather than any Go or
// elisp cond-ladder.
enum RenderState {
  RENDER_STATE_UNSPECIFIED = 0;
  RENDER_STATE_INIT = 1;
  RENDER_STATE_IDLE = 2;
  RENDER_STATE_IDLE_ASYNC = 3;
  RENDER_STATE_THINKING = 4;
  RENDER_STATE_PERMISSION = 5;
  RENDER_STATE_DONE = 6;
  // DEPRECATED by RENDER_STATE_VENDOR_BLOCKED. It was never a state of its
  // own: an errored turn end is an abnormal CONCLUSION, which is exactly
  // what VENDOR_BLOCKED means, and its own color said "stopped" in a way
  // that read as neither working nor blocked. The SSM no longer resolves
  // it; the number stays reserved-by-use so no future state reuses it and
  // an old frontend decoding an old log still reads what it always did.
  RENDER_STATE_STOP_FAILED = 7 [deprecated = true];
  RENDER_STATE_MERGING = 8;
  RENDER_STATE_MERGE_QUEUED = 9;
  RENDER_STATE_MERGE_CONFLICT = 10;
  RENDER_STATE_MERGE_FAILED = 11;
  RENDER_STATE_MERGED = 12;
  RENDER_STATE_DEAD = 13;
  RENDER_STATE_DEGRADED = 14;
  // Additive (F3): the five-color remap.
  //
  // READY is the green a session reaches WITHOUT being prompted: the shim
  // asserted its own readiness and the backfill settled, with the session
  // wired. IDLE remains for a session that went quiet after
  // working; both are green, and the split is kept only because the SSM's
  // cause chain distinguishes "never ran" from "ran and finished".
  RENDER_STATE_READY = 15;
  RENDER_STATE_VENDOR_BLOCKED = 16;
  // Additive (I1): a turn OUTCOME on the session-status lifecycle, exactly as DONE and
  // VENDOR_BLOCKED are: it reports that the LAST turn ended because a stop
  // was delivered (core.InterruptOutcome INTERRUPTED), and the next
  // session-status lifecycle row supersedes it. Never a latch, never needs releasing.
  RENDER_STATE_INTERRUPTED = 17;
  // Additive: the two CONTEXT-CUT states. Both are red for the same reason
  // THINKING is — the agent is busy and the user's prompt cannot land yet —
  // and the WORD is the whole distinction, exactly as INTERRUPTED's green
  // documents. They outrank thinking in the SSM's rank table because they are
  // busy with something OTHER than the answer, which is the more specific
  // true statement about what the session is doing.
  //
  // CLEARING is user-initiated (a dispatched `/clear`) and COMPACTING can be
  // either the user's `/compact` or the vendor's automatic one; when both are
  // somehow open, clearing wins.
  RENDER_STATE_CLEARING = 18;
  RENDER_STATE_COMPACTING = 19;
  // NOT WIRED, and the SUBSTRATE IS BROKEN. A bring-up that could not be
  // completed, or a session controller whose `client.Run` returned a terminal protocol
  // error.
  //
  // It is the resting half of the connection-truth law above. INIT already
  // says "a bring-up is in flight"; this says the opposite, that nothing is
  // in flight and nothing is wired, which INIT's spinner would misreport as
  // work in progress. Both are BLUE — the claim about what the user can do
  // is identical, and so is the claim that something on our side went wrong —
  // and the WORD and the (non-spinning) glyph are the whole distinction,
  // exactly as CLEARING and COMPACTING split THINKING.
  //
  // Nothing about the agent shows through it. A severed workspace may have a
  // `thinking` row from the turn it was driving when it broke; reporting that
  // would advertise an agent nobody is connected to.
  //
  // KEEPS FIELD NUMBER 20, which it held while it was named
  // RENDER_STATE_DORMANT. The rename is deliberately wire-compatible: an
  // append-only state log written by an older daemon still carries the literal
  // text `dormant`, and the SSM resolves that alias onto this state forever.
  // What changed is only that the benign half of the old DORMANT — the
  // deliberate hibernation, the never-wired workspace — moved to HIBERNATED
  // below, so that BLUE finally means "something is actually wrong".
  RENDER_STATE_SEVERED = 20;
  // Additive: NOT WIRED, and NOTHING IS WRONG — the session was deliberately
  // put to sleep to reclaim its memory, or nothing has ever been wired to this
  // workspace.
  //
  // TEAL, and the reason it is not blue is the whole point of the split. The
  // old single DORMANT state conflated "asleep on purpose" with "the backend
  // is broken", so the most ordinary event in the system — the idle sweeper
  // reclaiming ~500MB from a workspace nobody has touched for an hour —
  // rendered identically to a dead shim. A color that fires on both cannot
  // mean either.
  //
  // Its PRECEDENCE is nonetheless the blue band's, NOT green's: it makes the
  // same actionability claim (you cannot interact without paying a bring-up),
  // and only the reason is benign. Ranking it below green would let a stale
  // `thinking` row from the turn a workspace was hibernated after mask a
  // workspace that is genuinely asleep. See the SSM's `prec` table, where it
  // sits at 15 — directly below the blue band and above purple's 20.
  RENDER_STATE_HIBERNATED = 21;
  // Additive: the FIRST half of a turn, before the shim has taken the prompt.
  //
  // RED, exactly as THINKING is, and for the identical reason: a turn is in
  // flight and the user's next prompt cannot land yet. The WORD is the whole
  // distinction, precisely as CLEARING and COMPACTING split THINKING above.
  //
  // WHAT IT SPLITS. The daemon publishes a turn's state the moment it commits
  // to submitting, which is what stops a prompt from sitting against a green
  // workspace while a busy shim gets round to acking it. That claim is
  // truthful but coarse: it says the agent is thinking during a window in
  // which the agent has not yet been handed anything. SUBMITTING names that
  // window, so THINKING can go back to meaning the shim actually holds the
  // prompt.
  //
  // ITS CLOSING EDGE IS THE SHIM ACK, and deliberately not the durable
  // TurnStarted: the shim MINTS TurnStarted in the same synchronous block that
  // acks the submit (uds-session.ts, emitTurnStarted), so the two report one
  // instant and the gap between them is store round-trip time. A state cut
  // there would move with store load rather than with the agent, lingering
  // longest exactly when the model was fastest.
  RENDER_STATE_SUBMITTING = 22;
  // Additive: the FIRST instant of a merge attempt, before the request is
  // durably on its repository's queue.
  //
  // WHAT IT SPLITS. MERGE_QUEUED and MERGING both describe a merge the
  // daemon has already accepted and recorded; neither can describe the window
  // between the frontend command arriving and the durable enqueue landing. A
  // command that died in that window — an unresolvable geometry, a queue write
  // that failed, a daemon that never got to process it — left no trace in any
  // UI at all, so the user's merge simply never appeared to happen. This is
  // the command handler's own "I have this" mark, emitted on receipt before
  // geometry resolution and before Coordinator.Enqueue.
  //
  // IT IS DELIBERATELY TRANSIENT and has NO durable queue entry behind it. It
  // is superseded within milliseconds by MERGE_QUEUED or MERGING on the happy
  // path, and by MERGE_FAILED when the enqueue is refused. A daemon that
  // bounces while a workspace sits here has by definition lost the attempt,
  // so Coordinator.Drain sweeps it to MERGE_FAILED at the next boot rather
  // than leaving a workspace pinned on a phase nothing will ever advance.
  //
  // Its PRECEDENCE is directly BELOW MERGE_QUEUED (rank 6 in the SSM's prec
  // table, beneath merge_queued's 5): it is the weakest claim the merge axis
  // can make — the attempt is not even on a queue yet — so any other merge row
  // that exists is the more specific truth.
  RENDER_STATE_MERGE_ENQUEUING = 23;
}

// SESSION CONNECTIVITY answers whether the current session-controller
// generation can operate the session reliably now. The daemon is the sole
// authority: frontends adopt this verdict unchanged and never infer it from
// SessionView.live, a socket, a historical RenderState, or a fault card.
enum SessionConnectivity {
  SESSION_CONNECTIVITY_UNSPECIFIED = 0;
  // Intentionally offline. No controller generation is current and no fault
  // is implied; the session may be brought up on demand.
  SESSION_CONNECTIVITY_HIBERNATED = 1;
  // Establishment or re-establishment of the current controller generation is
  // in progress.
  SESSION_CONNECTIVITY_CONNECTING = 2;
  // The current generation passed readiness and has no open
  // connectivity-impacting fault.
  SESSION_CONNECTIVITY_OPERATIONAL = 3;
  // The current generation remains attached, but one or more
  // connectivity-impacting fault windows are open.
  SESSION_CONNECTIVITY_DEGRADED = 4;
  // Establishment or operation failed and no operating route remains.
  SESSION_CONNECTIVITY_UNAVAILABLE = 5;
}

// SESSION STATUS answers what the session is doing independently of whether
// its current route is usable. Connectivity outranks it for primary
// presentation whenever connectivity is not OPERATIONAL.
enum SessionStatus {
  SESSION_STATUS_UNSPECIFIED = 0;
  SESSION_STATUS_READY = 1;
  SESSION_STATUS_THINKING = 2;
  SESSION_STATUS_PERMISSION = 3;
  SESSION_STATUS_DONE = 4;
  SESSION_STATUS_INTERRUPTED = 5;
  SESSION_STATUS_VENDOR_BLOCKED = 6;
  SESSION_STATUS_MONITORING = 7;
  // The session-status twin of RENDER_STATE_SUBMITTING: the daemon has
  // committed to submitting a prompt and the shim has not yet acked it.
  SESSION_STATUS_SUBMITTING = 8;
}

// A runtime fault is explanatory evidence scoped to exactly one
// session-controller generation. A close edge can close only its matching
// (component, fault_type) window, and a retired generation's faults can never
// affect its replacement.
message RuntimeFault {
  string component = 1;
  string fault_type = 2;
  string impact = 3;
  string cause_kind = 4;
  int64 opened_at_ms = 5;
}

message FrontendFrame {
  // 8 was degraded_notice (DegradedNotice): RETIRED (step 11). Stage 2
  // replaced it with a self-resolving SystemFailureItem conversation card
  // (F4); both frontends have shipped their readers.
  reserved 8;
  reserved "degraded_notice";
  oneof frame {
    StateSnapshot snapshot = 1;
    WorkspaceState workspace_state = 2;
    SessionView session_view = 3;
    ConversationDelta conversation_delta = 4;
    TypingDelta typing_delta = 5;
    TaskCatalog task_catalog = 6;
    CommandAck command_ack = 7;
    DaemonView daemon_view = 9;   // Additive (S7)
    SessionInitView session_init = 10;  // Additive (S9)
    HeartbeatView heartbeat = 11;       // Additive (E4)
    QueueView queue = 12;               // Additive (E4)
    ProgressView progress = 13;         // Additive (F1)
    // Host-only durable workspace lifecycle notification.  The daemon emits
    // this only after the worktree and waiting shim are healthy; Emacs then
    // materializes its perspective and acknowledges it.
    WorkspaceAvailable workspace_available = 14;
    // Host-only durable UI action sourced by the daemon-owned JSON inbox.
    HostAction host_action = 15;
    DaemonHealthView daemon_health = 16;
    SessionHealthView session_health = 17;
    // The workspace roster, the sidebar's entire model, previously delivered
    // by Emacs script-injection per webview. Emacs remains the single author;
    // the daemon retains the latest roster, includes it in every connect
    // snapshot, and rebroadcasts on change.
    WorkspaceRoster workspace_roster = 18;
  }
}

// Additive (S7): daemon-level identity/liveness Emacs read from GET /sessions'
// envelope (boot detection, version-mismatch warnings, binary staleness).
message DaemonView {
  string boot_id = 1;
  string protocol_version = 2;
  int64 daemon_binary_mtime_ms = 3;
  string daemon_version = 4;
}

// Correlated result of the daemon-global health command.  A command ACK alone
// is only a receipt that the daemon accepted a frame; this view is the
// assertion Emacs waits for before restoring any workspace.  healthy=false is
// always accompanied by a non-empty reason, so no client can mistake a failed
// observation for readiness.
message DaemonHealthView {
  string request_id = 1;
  bool healthy = 2;
  string reason = 3;
}

// Correlated result of the session-specific health command.  The daemon sets
// healthy=true only when the named live session controller has a handshaked
// shim and that shim has proved its own dependency health (including its store
// connection).
// WORKSPACE is the absolute CWD, matching every session-routed frontend
// command; SESSION_ID prevents an old response from satisfying a newer
// restored binding.
message SessionHealthView {
  string request_id = 1;
  string workspace = 2;
  string session_id = 3;
  bool healthy = 4;
  string reason = 5;
}

// THE resolved per-workspace state, plus the inputs snapshot that produced
// it (for debuggability: a frontend can show WHY a state was resolved).
message WorkspaceState {
  string workspace = 1;
  string session_id = 2;
  // Primary UX projection resolved by the daemon. This is retained for merge
  // and context-cut presentation; it is not the authority for connectivity or
  // session status.
  RenderState state = 3;
  // Resolution inputs (SSM):
  bool turn_active = 4;
  int64 live_task_count = 5;
  string cause_kind = 7;  // event kind that caused this transition
  uint64 cause_seq = 8;   // store seq when event-caused (0 = daemon-local)
  int64 at_ms = 9;
  SessionConnectivity connectivity = 10;
  SessionStatus status = 11;
  string controller_generation_id = 12;
  repeated RuntimeFault active_faults = 13;
  // The coarse flat merge trio: RETIRED, superseded by merge_status (18).
  //
  // `merge_phase` was one word for WHAT a merge was doing, and
  // `merge_queue_position` / `merge_queue_depth` said WHERE it sat among the
  // workspaces contending for the same repository. All three were a lossy
  // re-derivation of facts the merge run itself already publishes: MergeStatus
  // names a RUN, carries the phase as WHICH oneof arm is set, and reports the
  // queue place the run was actually ADMITTED at rather than a snapshot
  // re-read at push time. Two forms of the same fact could disagree on a
  // frame, so the weaker one is gone rather than kept in sync.
  //
  // The merge AXIS is untouched: it still drives RenderState (3) and is still
  // what MergeStatus is stamped behind.
  reserved 6, 14, 15;
  reserved "merge_phase", "merge_queue_position", "merge_queue_depth";
  // Whether merge.Coordinator holds the exclusivity lease on this workspace's
  // shim. While held, USER prompting is blocked (the merge owns the session)
  // and every conversation item the session produces carries
  // CONVERSATION_SOURCE_MERGE.
  bool merge_lease_held = 16;
  // WHEN this workspace's merge landed, in unix millis. 0 means it has never
  // reached `merged`, which is the only reading of absence: a merged
  // workspace always carries the instant it merged at.
  //
  // WRITTEN ONCE, at the `merged` transition, and never moved afterwards.
  // merge_status (18) reports whichever run is currently newest and can
  // therefore be superseded; this is the durable record that the merge
  // LANDED, so a later transition on any axis leaves it exactly where it was.
  //
  // It is its own persisted fact rather than a re-derivation over the state
  // log, so a frontend ordering a recently-merged section reads the identical
  // instant from every push, snapshot and resync.
  int64 merged_at_ms = 17;
  // THE merge run's live progress, and the ONLY merge-run surface on this
  // message. See MergeStatus. The coarse flat trio it replaced is reserved
  // above; there is no second, weaker form of these facts to disagree with.
  //
  // UNSET means this workspace has no merge to report — the merge axis has
  // never spoken for it, or its axis is cleared. It is never a zero-valued
  // status standing in for absence.
  MergeStatus merge_status = 18;
}

// Live progress of the workspace's current (or most recent) merge run.
// WHICH message is set in `phase` IS the phase — no enum to keep in sync,
// no field that is meaningless for the current phase. Every phase
// transition and every within-phase tick (a landed cherry-pick, a test
// pass) is pushed as a WorkspaceState revision to both frontends.
message MergeStatus {
  string run_id = 1;  // daemon-minted, stable across the run

  // When the CURRENT phase was entered. Set on every phase transition. For
  // the terminal phases this is when the run finished — merged's landed
  // instant, failed's failure instant.
  int64 phase_started_at_ms = 2;

  // Monotonic within the run; bumps on within-phase ticks too (a landed
  // pick advances updated_at_ms but not phase_started_at_ms).
  int64 updated_at_ms = 3;

  oneof phase {
    MergeStatusEnqueued      enqueued       = 4;
    MergeStatusBeforeAction  before_action  = 5;
    MergeStatusCherryPicking cherry_picking = 6;
    MergeStatusTesting       testing        = 7;
    MergeStatusConflict      conflict       = 8;
    MergeStatusAfterAction   after_action   = 9;
    MergeStatusMerged        merged         = 10;
    MergeStatusFailed        failed         = 11;
  }
}

message MergeStatusEnqueued {
  int32 position = 1;  // 1-based
  int32 depth    = 2;
}

message MergeStatusBeforeAction {
  string prompt = 1;  // the configured action, for display
}

message MergeStatusCherryPicking {
  int32  commits_total   = 1;
  int32  commits_landed  = 2;
  string current_sha     = 3;
  string current_subject = 4;
}

message MergeStatusTesting {
  int32  commits_total   = 1;
  int32  commits_landed  = 2;  // the commit under test is landed but ungated
  string current_sha     = 3;
  string current_subject = 4;
}

message MergeStatusConflict {
  string conflicted_sha     = 1;
  string conflicted_subject = 2;
  int32  commits_total      = 3;
  int32  commits_landed     = 4;
}

message MergeStatusAfterAction {
  string prompt = 1;
}

message MergeStatusMerged {
  int32  commits_total      = 1;
  string after_action_error = 2;  // empty when the after action succeeded or none ran
}

message MergeStatusFailed {
  string cause           = 1;
  int32  commits_total   = 2;  // 0 when planning never completed
  int32  commits_landed  = 3;
  string failing_sha     = 4;  // set only for commit-bound failures
  string failing_subject = 5;

  // THIS MESSAGE, serialized as JSON, carried verbatim so a frontend can
  // report the WHOLE failure record as one field of the error it shows.
  //
  // A failed merge is the one merge status a human has to DIAGNOSE rather
  // than watch go by, and the narration frontends echo is a single line:
  // it quotes `cause` and `failing_subject` and drops everything else. The
  // counts and the sha never reached the report at all, so a user reading
  // "merge failed — cherry-pick refused" had to leave the editor and go to
  // the daemon log for the rest of the record.
  //
  // IT IS PRODUCED BY PROTO3's OWN JSON MAPPING (protojson), never by
  // hand-assembled string building. That is what makes it exhaustive
  // WITHOUT MAINTENANCE: a field added to this message appears in the
  // reported error the moment the schema learns it, whereas a formatter
  // listing the fields it knows would report the schema as it stood when
  // the formatter was written.
  //
  // STAMPED LAST, onto a message whose other fields are already filled and
  // whose own `failed_json` is still empty, so it is the serialization of
  // this message WITHOUT this field and can never nest inside itself.
  // Empty is never valid on a published failed arm.
  string failed_json = 6;
}

message SessionView {
  // 14 was death_reason (string): RETIRED (step 11). It had two producers
  // and zero readers on either frontend; `death` below (F4) is the sole
  // reader-facing account now.
  reserved 14;
  reserved "death_reason";
  string workspace = 1;
  string session_id = 2;
  string model = 3;
  string slug = 4;
  string title = 5;
  int64 total_tokens = 6;
  double total_cost_usd = 7;
  int64 context_window = 8;
  string permission_mode = 9;
  // Whether the daemon holds a LIVE SESSION CONTROLLER for this session's
  // workspace — i.e. a shim is attached, or its client is reconnecting to one.
  //
  // IT IS THE ONE FIELD ON THIS MESSAGE THAT IS NOT DURABLE, and that is
  // exactly why it exists. Every other field here is read off the registry
  // record, which survives a daemon restart; a frontend that judges "is this
  // workspace already up?" from those sees a non-terminal, fully-backfilled
  // record and concludes YES against a daemon that has no session controller
  // for it at all. Emacs's switch-ensure did precisely that, so after a daemon
  // restart switching to an unwired workspace skipped its openWorkspace and
  // the workspace never bootstrapped.
  //
  // The field had NO producer before that bug; the name always meant this.
  bool shim_attached = 10;
  // Additive (S6): resume/rebind keys the webapp lost in the cutover.
  string claude_session_id = 11;
  string cwd = 12;
  // Additive (S7): GET /sessions parity so Emacs can drop HTTP entirely.
  bool terminal = 13;
  bool rehydratable = 15;
  bool hibernated = 16;
  int64 pending_permissions = 17;
  // Additive (S8): account identity — the CLAUDE_CONFIG_DIR the session's
  // shim runs against (account switching is daemon-executed, webapp-initiated).
  string config_dir = 18;
  // Additive (F2): whether this session's on-disk transcript has been read
  // into the store — the NEVER-BLUE completion signal (see BackfillState).
  BackfillState backfill = 19;
  // Additive (F4): the TYPED account of why this session is terminal,
  // superseding the free-string death_reason (RETIRED, step 11).
  //
  // death_reason was a free string with two producers, zero readers, and no
  // way for a frontend to know what class of failure it described. This is
  // the same fact classified once, daemon-side, so the dead-state card can
  // render it the way every other failure renders. Unset while the session
  // lives.
  SystemFailureItem death = 20;
  // The SDK-published set this session can deliberately select.  A frontend
  // only renders these choices; it never invents or owns a model selection.
  repeated ModelOption model_options = 21;
}

message ModelOption {
  string value = 1;
  string display_name = 2;
  string description = 3;
}

// Whether a session's on-disk transcript has been backfilled into the store.
//
// This is the completion signal the never-blue contract needs: a workspace
// whose session is LIVE but whose history never arrived is still blue, and
// "live" alone cannot tell those apart. DAEMON-RESOLVED, never frontend-
// derived, and carried on SessionView so it rides every connect snapshot.
//
// DERIVED, not reported. The sidecar has no channel to the daemon at all: it
// writes to the shim-store, discards the store's own StoreWriteAck, keeps its
// cursor per-FILE (dev:inode) rather than per-session, and emits no terminal
// marker for a finished file. So the daemon reads the only evidence that
// actually reaches it — the event stream — and the mapping is:
//
//   PENDING  a transcript exists on disk for this session's cwd, but no
//            file-plane event has arrived for it yet.
//   DONE     at least one data.v1.TranscriptLine event has arrived, so the
//            file plane really did deliver into the store.
//   FAILED   the sidecar could not read part of the transcript: it emitted a
//            core.v1.UnparsedEvent, which IS durable and DOES reach the
//            daemon. Surfaced loudly rather than left reading as "not yet".
//
// KNOWN LIMITATION — a sidecar read error that is NOT a malformed line (a
// permission error, an unreadable project dir) is only logged sidecar-side and
// retried every second forever, with nothing durable written. It therefore
// manifests here as a PENDING that never advances, not as FAILED. Closing that
// needs a sidecar report the wire does not carry today; the cheapest honest
// paths are the StoreWriteAck the sidecar currently throws away, or a status
// event on its store connection.
enum BackfillState {
  // No transcript on disk for this session's cwd: a genuinely fresh
  // workspace with nothing to backfill. NOT "unknown" — an empty workspace
  // is a real, correct answer, and it is what a blue workspace should be.
  BACKFILL_STATE_UNSPECIFIED = 0;
  BACKFILL_STATE_PENDING = 1;
  BACKFILL_STATE_DONE = 2;
  BACKFILL_STATE_FAILED = 3;
}

// Complete (store-round-tripped) conversation additions, composed from the
// typed agent payloads (S9). daemon/internal/frontend/translate.go CURATES
// which payloads are pushed but never re-types them — frontends render,
// never interpret.
message ConversationDelta {
  string workspace = 1;
  string session_id = 2;
  repeated ConversationItem items = 3;
  uint64 through_seq = 4;  // frontends persist this for reconnect resync
}

// WHO drove the turn that produced a conversation item.
//
// The merge coordinator borrows a workspace's own shim to resolve a merge
// conflict (the session holding the full context of the work is the one best
// equipped to resolve it), so a session can emit a full turn the user never
// prompted. That provenance is a durable FACT recorded on every item, not a
// rendering hint: frontends decide independently what to do with it, and the
// decision can change without another wire change.
enum ConversationSource {
  // Never set by the daemon. proto3 reserves 0 for "the field was not
  // populated", and every item the daemon builds sets one of the arms below,
  // so a receiver seeing UNSPECIFIED is looking at a malformed frame and must
  // reject it loudly rather than assume USER.
  CONVERSATION_SOURCE_UNSPECIFIED = 0;
  // An ordinary turn: the user prompted it, or it followed from one.
  CONVERSATION_SOURCE_USER = 1;
  // A turn merge.Coordinator drove under its lease (conflict resolution).
  CONVERSATION_SOURCE_MERGE = 2;
}

// One curated conversation addition: a thin envelope around the typed
// data.v1/core.v1 payload. Consumers reconcile by uuid (permission items
// use the permission request_id as their uuid).
message ConversationItem {
  // 18 was api_error (ApiErrorLine): RETIRED (step 11). A terminal line now
  // curates to system_failure below (F4) only; a mid-backoff line curates to
  // no item at all (the retrying window covers it).
  // 16/17 were compact_boundary/compact_boundary_line: RETIRED in favour of
  // context_compacted, which carries one coalesced compaction instead of two
  // plane-shaped halves. Reserved so the wire numbers can never be reused.
  reserved 16, 17, 18;
  reserved "api_error", "compact_boundary", "compact_boundary_line";
  string uuid = 1;
  int64 ts_ms = 2;
  string request_id = 3;  // vendor API request correlation, "" when absent
  // Provenance. ALWAYS set (see ConversationSource): persisted with the item
  // so a resync or transcript replay reproduces the same verdict instead of
  // re-deriving it from state that has since moved on.
  ConversationSource source = 4;
  oneof item {
    agentshim.data.v1.ApiAssistantMessage assistant_message = 10;
    agentshim.data.v1.ApiUserMessage user_message = 11;
    agentshim.data.v1.ToolUseBlock tool_use = 12;
    agentshim.data.v1.ToolResultBlock tool_result = 13;
    agentshim.data.v1.ToolUseResult tool_use_result = 14;
    agentshim.data.v1.ResultMessage result = 15;
    agentshim.core.v1.PermissionItem permission = 30;
    SystemFailureItem system_failure = 31;  // Additive (F3)
    // CLEAR and COMPACT, carried verbatim from core.v1 rather than re-modeled
    // here: the daemon has already coalesced and de-duplicated them, so a
    // second frontend-shaped copy would only be a chance to drift.
    //
    // These REPLACE the retired compact_boundary/compact_boundary_line arms
    // (16, 17), which made a frontend correlate two plane-shaped halves of
    // one compaction and left the summary unreachable entirely.
    //
    // A frontend renders one of these by discarding everything ABOVE it and
    // drawing the event itself. It needs no rule for FINDING the event,
    // because the daemon floors each replay at the newest one — an arriving
    // clear or compact is therefore always live, and the string-matching a
    // frontend used to do on prompt text has no successor here by design.
    agentshim.core.v1.ContextCleared context_cleared = 32;
    agentshim.core.v1.ContextCompacted context_compacted = 33;
    SkillBodyItem skill_body = 34;  // Additive (skill card)
  }
}

// Additive: the launched skill's own SKILL.md body, addressed to the Skill
// tool card that launched it.
//
// WHY THIS IS ITS OWN ARM RATHER THAN A FIELD ON tool_use (12). The daemon
// never populates arm 12: a tool call rides as a ToolUseBlock INSIDE its
// carrying assistant_message (see internal/frontend/translate.go), and its
// result as a tool_result block inside the following user_message. There is
// therefore no tool item on this wire to hang a body field on, and inventing
// one would mean emitting a second, half-populated representation of a call
// the frontend already assembled.
//
// WHAT IT CORRESPONDS TO ON DISK. The harness writes a skill's body as a
// SEPARATE transcript record — type "user", flagged isMeta, whose text is
// "Base directory for this skill: <dir>" followed by the whole SKILL.md. It
// is bookkeeping addressed to the model, not a prompt the person typed, so
// rendering it as a user turn is a defect (it draws a prompt bubble nobody
// wrote). The daemon correlates that record back to the Skill call that
// caused it and pushes THIS instead; the user record itself reaches no
// frontend at all.
//
// HOW A FRONTEND CONSUMES IT. tool_use_id is the reconciliation identity, and
// it is deliberately the SAME identity the frontend already files the Skill
// call under — so this item MERGES INTO the existing card rather than adding
// one beside it. One invocation is one card, updated in place as the call,
// the result and the body land, in whatever order they land. Replays are
// idempotent for the same reason: re-sending it replaces the body it already
// merged.
message SkillBodyItem {
  // The Skill call's tool_use id. Never empty: the daemon emits this item
  // only once it has resolved the body to a specific call.
  string tool_use_id = 1;
  // The SKILL.md body VERBATIM, markdown, including the leading "Base
  // directory for this skill:" line the harness prepends. A skill IS a
  // markdown document, so it is carried as markdown and rendered as markdown.
  string body_markdown = 2;
}

// The class of a system failure. SEMANTIC, not chromatic: the wire says what
// KIND of thing failed and each frontend decides what that looks like. A wire
// that spoke in colors would make every future frontend inherit this one's
// palette.
enum ErrorClass {
  ERROR_CLASS_UNSPECIFIED = 0;
  // agent-repl's own machinery failed: shim down, daemon unreachable, store
  // outage, backfill failed, a refused command, an undeliverable interrupt.
  // Nothing about the account is implicated and no amount of waiting or
  // re-authenticating helps. Resolves the workspace BLUE.
  ERROR_CLASS_INTERNAL = 1;
  // The SDK or the vendor backend refused or concluded the work: auth,
  // usage limit, a persistent 4xx/5xx, a user-set max-turns/budget stop, a
  // model refusal, an execution abort. Releasing it needs a human or the
  // vendor, never a retry. Resolves the workspace PURPLE.
  ERROR_CLASS_API = 2;
}

// Additive (F3): a system failure as a CONVERSATION ITEM rather than a
// banner.
//
// A user whose workspace changed color needs to find out WHY from the
// conversation itself. Before this arm there was nowhere for that account to
// live: DegradedNotice is chrome that scrolls away, a CommandAck's error
// renders nothing, and a refused command's reason died in the daemon log.
//
// Composed at the SAME point that applies the state change (see
// daemon/internal/ssm), so the card and the color can never disagree — there
// is no code path that changes one without the other.
message SystemFailureItem {
  ErrorClass error_class = 1;
  // The specific failure within the class: "shim", "command", "interrupt",
  // "rate_limit", "error_max_turns", ...
  string error_type = 2;
  // The plain-language explanation the card renders.
  string message = 3;
  // Whatever structured account the source gave, verbatim, so the card can
  // show the raw failure alongside the prose rather than replacing it.
  string source_detail = 4;
  // Wall-clock ms a WINDOW-shaped failure closed; 0 means unresolved.
  //
  // Two shapes of failure share this item. A WINDOW-shaped one (shim down,
  // store outage, a refused command) has an opening edge and a closing
  // edge: the item is re-sent under the SAME ConversationItem.uuid with
  // this field set when it closes, so the feed reconciles it in place and
  // shows a settled card rather than a permanent alarm about something
  // that ended.
  //
  // An EVENT-shaped conclusion (an auth block that killed the turn, a
  // budget stop, a refusal) has no closing edge — the turn is over and
  // stays over — so it never resolves.
  int64 resolved_at_ms = 5;
  // Additive (F4): the ConversationItem.uuid this failure was filed under,
  // carried on the failure itself so a SystemFailureItem reached OUTSIDE the
  // conversation feed (ProgressView.failure, a CommandAck) can still address
  // the card it corresponds to.
  //
  // It is the failure's own identity, not a second copy of the envelope's:
  // when the item rides ConversationItem the envelope's uuid is authoritative
  // and this repeats it; when it rides anywhere else the envelope is absent
  // and this is the only addressing there is. Empty means the failure has no
  // addressable card (a turn-end error carries no item of its own).
  string item_uuid = 6;
}

// Ephemeral live-typing relay (never persisted, never in snapshots).
message TypingDelta {
  string workspace = 1;
  string session_id = 2;
  agentshim.core.v1.ContentDelta delta = 3;
}

// Additive (E4): EPHEMERAL long-tool liveness relay. The shim already emits
// core.v1.HeartbeatProgress over its UDS while a tool runs; before this arm
// existed the daemon had nowhere to put it and dropped it (a schema-forced
// drop). This is the arm.
//
// The embedded HeartbeatProgress is carried UNCHANGED, exactly as TypingDelta
// carries ContentDelta: the daemon relays, it does not re-type. Consumers key
// on progress.tool_use_id to find the running tool and use
// progress.elapsed_seconds to tick its liveness, so a long-running tool stops
// looking hung. Like TypingDelta it is never persisted and never appears in a
// StateSnapshot — a frontend that reconnects simply waits for the next
// heartbeat.
message HeartbeatView {
  string workspace = 1;
  string session_id = 2;
  agentshim.core.v1.HeartbeatProgress progress = 3;
}

// The session's retained SystemInit (slash commands, tools, skills, model
// list), pushed on attach and included in StateSnapshot (S9). Replaces the
// Emacs GET /commands HTTP menu source.
message SessionInitView {
  string workspace = 1;
  string session_id = 2;
  agentshim.data.v1.SystemInit init = 3;
}

message TaskEntry {
  string task_id = 1;
  string kind = 2;         // "agent" | "shell" | "workflow"
  string description = 3;
  string status = 4;       // running | done | error | killed | stopped | lost
  string output_path = 5;
  int64 started_at_ms = 6;
  int64 ended_at_ms = 7;   // 0 = still open
}

message TaskCatalog {
  string workspace = 1;
  string session_id = 2;
  repeated TaskEntry tasks = 3;
}

// Frontend→daemon commands (the ONLY inbound frame).
message FrontendCommand {
  string request_id = 1;
  string workspace = 2;
  oneof command {
    SubmitPromptCmd submit_prompt = 3;
    InterruptCmd interrupt = 4;
    PermissionAnswerCmd permission_answer = 5;
    MergeWorkspaceCmd merge_workspace = 6;
    CloseWorkspaceCmd close_workspace = 7;
    OpenWorkspaceCmd open_workspace = 8;
    ResyncCmd resync = 9;
    CreateSessionCmd create_session = 10;  // Additive (S7)
    DeleteSessionCmd delete_session = 11;  // Additive (S7)
    ShutdownCmd shutdown = 12;             // Additive (S9)
    ClientLogCmd client_log = 13;          // Additive (E4)
    QueueForceCmd queue_force = 14;        // Additive (E4)
    QueueAcceptCmd queue_accept = 15;      // Additive (E4)
    QueueCancelCmd queue_cancel = 16;      // Additive (E4)
    CreateWorkspaceCmd create_workspace = 18;
    WorkspaceMaterializedCmd workspace_materialized = 19;
    HostActionCompletedCmd host_action_completed = 20;
    DaemonHealthCmd daemon_health = 21;
    SessionHealthCmd session_health = 22;
    RestartSessionCmd restart_session = 23;
    SetModelCmd set_model = 24;
    PublishWorkspaceRosterCmd publish_workspace_roster = 25;
  }
}

// Emacs→daemon publication of the whole workspace roster.
//
// Emacs is the roster's SINGLE author; this is the only way a roster enters
// the daemon. The daemon retains the published roster, folds it into every
// connect snapshot, and rebroadcasts it — it never synthesizes or amends one.
// The ack semantics are every other frontend command's: a refused publish (a
// stale, out-of-order revision WITHIN the publisher's own epoch, or a roster
// carrying no epoch at all) is a loud nack on the correlated CommandAck, never
// a silent drop, so a publisher whose revision counter has fallen behind learns
// it instead of believing it published. A publish from a NEW epoch is never
// stale — see WorkspaceRoster.boot_id — so no publisher ever needs to resync a
// counter it did not author.
message PublishWorkspaceRosterCmd {
  // The complete roster as of this publication. Always whole, never a delta:
  // the roster is small and Emacs holds the entire model, so a full replace
  // makes a partially-applied roster unrepresentable.
  WorkspaceRoster roster = 1;
}

// (The retired PaintAckCmd rode the command oneof at field 17, with its
// PaintOutcome enum beside it: a frontend's attestation that it had drawn a
// workspace's history and its render state, which the daemon required before
// it would resolve that workspace green and before it would forward the state
// to Emacs.
//
// It is GONE, and so is the whole viewer-based attestation model behind it. A
// workspace's color is CONNECTION TRUTH: blue means no live backend session,
// and every non-blue color is a guarantee that the session substrate is fully
// wired. What a viewer has or has not drawn says nothing about that, so it can
// no longer hold a workspace blue or hold a state back from Emacs.
//
// Deleted rather than reserved, following this repo's established style for
// retired frontend surface — the same treatment InterruptCmd.hard and
// ContextCompacted.result received — because no live frontend commitment
// survives the same change.)

// ---------------------------------------------------------------------------
// The daemon-held prompt queue (E4).
//
// A prompt submitted while the session's turn is already running is NOT
// forwarded. The daemon holds it, asks a classifier whether it is the sort of
// thing the agent should hear NOW rather than after the turn, and either
// interjects it (interrupt, then submit once the turn has actually ended) or
// leaves it to be delivered FIFO when the turn ends on its own.
//
// EVERY message here is frontend surface, not shim wire. A queued prompt is an
// artifact of the DAEMON's decision to hold it back — the vendor never saw it
// and has no message for it — and the queue commands are a user-facing
// representation of an interject, whose MECHANISM (Interrupt then SubmitPrompt)
// is what actually crosses the shim UDS. See agent-shim/AGENTS.md, which uses
// this feature as its worked example of the boundary.
// ---------------------------------------------------------------------------

// What the classifier decided about a queued prompt.
enum QueueClassification {
  // Never set by the daemon. Present because proto3 reserves 0 for "the field
  // was not populated", and PENDING is a REAL verdict ("the classifier is
  // running") that must not share an encoding with "nobody said anything".
  // Every QueueEntry the daemon builds sets one of the four states below, so a
  // receiver seeing UNSPECIFIED is looking at a malformed frame and must
  // reject it loudly rather than guess which state was meant.
  QUEUE_CLASSIFICATION_UNSPECIFIED = 0;
  // Not yet classified: the entry is queued and the classifier is running.
  QUEUE_CLASSIFICATION_PENDING = 1;
  // Deliver NOW: interrupt the running turn and submit once it has ended.
  QUEUE_CLASSIFICATION_INTERJECT = 2;
  // Deliver when the turn ends on its own; do not interrupt for it.
  QUEUE_CLASSIFICATION_HOLD = 3;
  // The classifier could not be believed (it answered with neither token, or
  // both). Surfaced as its own state rather than silently defaulted to one of
  // the real verdicts: a frontend must be able to see that nothing decided
  // this. Delivery falls back to the ordinary turn-end drain, so an
  // unclassifiable prompt is delayed, never dropped.
  QUEUE_CLASSIFICATION_ERROR = 4;
}

// One prompt the daemon is holding.
message QueueEntry {
  string id = 1;
  string text = 2;
  int64 queued_at_ms = 3;
  QueueClassification classification = 4;
  // The classifier's stated reason, or the failure detail on ERROR. Free text
  // for display; never parsed.
  string rationale = 5;
  // Set by QueueAcceptCmd: the user has seen and confirmed this entry's HOLD.
  // View state only — it changes nothing about when the entry is delivered.
  bool accepted = 6;
}

// The session's queue, pushed on EVERY change and carried in StateSnapshot.
// An empty entries list is a meaningful value (the queue drained, or the
// session died), not an absent one.
message QueueView {
  string workspace = 1;
  string session_id = 2;
  repeated QueueEntry entries = 3;
}

// Deliver this entry NOW — the user overriding the classifier, or not waiting
// for it. Runs exactly the same interject sequence an INTERJECT verdict does.
message QueueForceCmd {
  string entry_id = 1;
}

// Confirm a HOLD entry. View state only: the entry is still delivered by the
// ordinary turn-end drain, on the same schedule it already had.
message QueueAcceptCmd {
  string entry_id = 1;
}

// Drop an entry. It is never delivered.
message QueueCancelCmd {
  string entry_id = 1;
}

// The severity of a ClientLogCmd. A closed vocabulary rather than a free
// string, so a frontend cannot invent a level the daemon has no policy for.
enum ClientLogLevel {
  CLIENT_LOG_LEVEL_UNSPECIFIED = 0;
  CLIENT_LOG_LEVEL_INFO = 1;
  CLIENT_LOG_LEVEL_WARN = 2;
  CLIENT_LOG_LEVEL_ERROR = 3;
}

// Additive (E4): a frontend-side diagnostic line, mirrored into the daemon's
// own on-disk log.
//
// WHY THIS EXISTS: the webapp runs inside an Emacs xwidget whose JS console
// nobody can see and nothing persists, so a delivery-path failure there (a
// seq-gap loop, a lost replay request, a stalled rAF) left no evidence
// anywhere at all. A pre-cutover HTTP route carried these; it was deleted with
// the rest of the legacy plane, and this arm restores the capability on the
// protobuf channel instead of reviving a second transport.
//
// The daemon WRITES these, it does not act on them: a client log is evidence,
// never a control signal, and is tagged in the log so a line originating in a
// frontend is never mistaken for one the daemon produced itself.
message ClientLogCmd {
  ClientLogLevel level = 1;
  string message = 2;
  // Optional structured payload (ids, counters, timings) accompanying the
  // message. Schemaless on purpose: it is diagnostic evidence whose shape is
  // the reporting call site's business, and pinning a schema here would make
  // adding a diagnostic a proto change.
  google.protobuf.Struct context = 3;
}

// Additive (S9): graceful daemon shutdown over UDS (replaces Emacs
// POST /shutdown).
message ShutdownCmd {
  // stop_shims asks the daemon to SIGTERM every session shim on its way out.
  //
  // The DEFAULT (false) PRESERVES them. A shim outlives its daemon by design:
  // it redials the daemon socket forever with backoff and is auto-parked by
  // the next daemon's listener, so killing it on an orderly shutdown threw
  // away a live, mid-conversation process the very next boot could have
  // reattached to for free. Preserving is what makes a daemon bounce cheap.
  //
  // The mode exists for the one caller that genuinely needs the old behavior:
  // a deploy that changed the shim BUNDLE, whose surviving shims would
  // otherwise keep running the previous build's code (bin/deploy-all.sh
  // passes it when its stamps show the bundle moved). It is belt-and-braces
  // alongside the daemon's own version-driven stale-shim refresh, never the
  // only thing standing between a deploy and stale shims.
  bool stop_shims = 1;
}

// HARD RESTART of one workspace's session: stop whatever shim is serving it
// (including one that outlived a previous daemon, which this daemon never
// spawned), then bring it up again along the ordinary path.
//
// THE SESSION RECORD IS UNCHANGED, so the respawn resumes the same vendor
// conversation: the user loses nothing and the transcript continues. This is a
// PROCESS restart, not a new session — what to reach for when the shim is
// wedged, when it is running superseded code, or when the backend simply needs
// rebuilding under a conversation worth keeping.
//
// A workspace with no live session is a loud nack; a workspace whose session is
// merely hibernated or severed is brought up, because "restart" and "start" are
// the same request when nothing is running.
message RestartSessionCmd {}

// Ask the daemon to assert that every boot-critical global dependency is
// operational.  The matching DaemonHealthView, not socket existence, is the
// success criterion.  It is a frontend command because no vendor produces or
// consumes this daemon-local fact.
message DaemonHealthCmd {}

// Ask the daemon to prove the entire session route for one restored workspace:
// daemon registry -> current session controller -> handshaked shim -> shim dependencies.
// The command's outer workspace is authoritative and must equal the session's
// CWD; SESSION_ID makes a stale response impossible to use after a rebind.
message SessionHealthCmd {
  string session_id = 1;
}

// Additive (S7): session creation over UDS (replaces Emacs POST /sessions).
// What conversation a create should land on.
//
// This is the caller's INTENT, not a pointer. It used to be a pointer —
// `resume_claude_session_id`, a vendor uuid the frontend had remembered from a
// previous session and handed back at boot — and that made every frontend a
// second, weaker authority on a question the daemon can answer exactly.
//
// The daemon owns (config_dir, cwd) -> conversation. It keeps a session_record
// per conversation and a conversation_checkpoint keyed on precisely that
// triple, and it can check the vendor transcript on disk. A frontend has none
// of that; it has a value it wrote down earlier and hopes is still true. When
// the frontend's copy went missing, five workspaces silently started fresh
// conversations on top of intact transcripts, because a frontend saying
// nothing and a frontend saying "start fresh" were the same wire value.
//
// They are now different values, which is the whole point of this enum.
enum ResumeMode {
  // Unset. Treated as RESUME_MODE_CONTINUE so an older or simpler caller gets
  // the safe behavior: continuing an existing conversation is recoverable,
  // stranding one is not.
  RESUME_MODE_UNSPECIFIED = 0;

  // Continue this workspace's conversation, whichever one that is. The daemon
  // resolves it and starts fresh only when no viable conversation exists.
  RESUME_MODE_CONTINUE = 1;

  // Deliberately begin a NEW conversation, even though a resumable one exists.
  // The user asked for a blank slate; the daemon must not helpfully reattach.
  RESUME_MODE_FRESH = 2;

  // Land on one SPECIFIC conversation named in explicit_claude_session_id.
  // Reserved for a human choosing from among conversations (a picker, a fork)
  // — never for ordinary restore, which is what CONTINUE is for. A caller that
  // reaches for this at boot is reintroducing the pointer.
  RESUME_MODE_EXPLICIT = 3;
}

message CreateSessionCmd {
  string cwd = 1;
  string permission_mode = 3;
  string config_dir = 4;
  bool fake = 6;                        // test harness sessions
  // The caller's DELIBERATE consent to create a session with NO permission
  // gate. Required whenever permission_mode names a mode that shadows the
  // shim's canUseTool callback in the fail-OPEN direction
  // (bypassPermissions): under such a mode the SDK auto-approves every tool
  // before canUseTool is consulted, so the daemon's whole permission
  // round-trip never engages and no permission card can ever appear.
  //
  // The daemon REFUSES such a create without this flag. The mode is otherwise
  // one string away from every ordinary create, and "reachable by a typo" is
  // not an acceptable property for the switch that turns the gate off. It is
  // a create-time consent only: a session already registered in that mode
  // still rehydrates after a daemon restart, since refusing there would
  // silently change a live session's posture.
  bool allow_ungated = 7;

  // The model this session should START on, empty to accept the shim's own
  // default.  A caller that has a remembered selection would otherwise have to
  // create and then immediately SetModel, which races: the session is live and
  // driveable in between, so its first turn can run on the wrong model.
  //
  // This does NOT make the caller authoritative.  The daemon applies it through
  // the same SetModel path a later change takes, once the shim is wired, and
  // still publishes only the shim-confirmed selection.  A rejected model fails
  // the create rather than silently leaving the session on another one.
  string model = 8;

  // Which conversation to land on. See ResumeMode: this is intent, and the
  // daemon does the resolving.
  ResumeMode resume_mode = 9;

  // The conversation to land on, and ONLY meaningful under
  // RESUME_MODE_EXPLICIT. The daemon rejects a create that sets this under any
  // other mode rather than quietly ignoring it, because a caller that filled
  // this in believes it is steering and must be told it is not.
  string explicit_claude_session_id = 10;
}

// A deliberate request to change an already-live session's model.  The daemon
// forwards this to the shim and only publishes the shim-confirmed selection.
// Bootstrap and rebind intentionally have no model field: they observe session
// state rather than choosing it.  Creation is different — see
// CreateSessionCmd.model, which is a starting choice, not an observation.
message SetModelCmd {
  string model = 1;
}

// Additive (S7): session teardown over UDS (replaces DELETE /sessions/{id}).
message DeleteSessionCmd {
  string session_id = 1;
}

message SubmitPromptCmd {
  string text = 1;
  string permission_mode = 2;
}

// Stop the running turn. Interrupting a LIVE TURN never asks for
// confirmation. When no turn is live but subagent tasks are, the daemon
// refuses with CommandAck.interrupt_confirm_required and performs the
// interrupt only on a resend carrying confirm_agents=true — stopping working
// subagents is the one interrupt worth a deliberate second keystroke.
//
// (The retired `hard` flag also lived at field 1: it promised a soft variant
// no layer implemented, and was deleted rather than reserved — this repo had
// no live frontend commitments at the time.)
message InterruptCmd {
  bool confirm_agents = 1;
}

message PermissionAnswerCmd {
  string permission_request_id = 1;
  bool allow = 2;
  google.protobuf.Struct updated_input = 3;
  string deny_message = 4;
}

message MergeWorkspaceCmd {
  // 1 was handler (string, e.g. "cherry-pick"), 3/4/5 were the caller-stated
  // merge geometry (source_branch, source_dir, target_dir): RETIRED.
  //
  // THE DAEMON OWNS THE GEOMETRY MAP (internal/workspace/geometry). It records
  // a workspace's source branch, source worktree and merge target when it
  // CREATES the workspace, and derives them at boot for pre-cutover ones, so a
  // merge command has nothing left to state. Emacs already sends a bare
  // request keyed by workspace; the caller-stated path was the second owner of
  // one map, which is how a cherry-pick reached a target the daemon had never
  // heard of. `handler` went the same way: there has only ever been one merge
  // handler, and a field naming it invited a caller to select a mechanism the
  // daemon does not dispatch on.
  reserved 1, 3, 4, 5;
  reserved "handler", "source_branch", "source_dir", "target_dir";
  bool conflict_resolved_continue = 2;  // the resolve-and-continue handoff
  // Additive: the workspace's DISPLAY name, for the `merge/<name>` completion
  // tag and the daemon's merge logs.
  //
  // It exists because the envelope's `workspace` field is the daemon's
  // workspace KEY — the session cwd — exactly as it is for every other
  // command. This command used to put the bare Emacs name there instead, which
  // filed every merge state row under a workspace key nothing else used: the
  // row had no session identity, so its WorkspaceState reached Emacs with an
  // absent connectivity verdict and was refused, and the merge never tore its
  // workspace down. The two identities are now separate fields rather than one
  // slot meaning different things per command.
  string workspace_name = 6;
}

message CloseWorkspaceCmd {}

message OpenWorkspaceCmd {}

message ResyncCmd {
  uint64 from_seq = 1;
}

// Request one agent-repl workspace.  This is the sole creation ingress for
// both host UI requests (SPC TAB n/N) and skill-produced JSON dispatches.  The
// daemon owns name resolution, worktree creation, session startup, and initial
// prompt delivery; a request never asks for a promptless/no-shim workspace.
message CreateWorkspaceCmd {
  string requested_name = 1;
  string git_root = 2;
  string base_commit = 3;
  string source_workspace = 4;
  string source_dir = 5;
  optional string initial_prompt = 6;
  string priority = 7;
  string model = 8;
  string fork_from = 9;
  string fork_session_id = 10;
  string postprocessing_prompt = 11;
  string before_ws_merge = 12;
  // Explicit session account/safety posture. The daemon must not infer these
  // from its ambient process when a host asks it to create a workspace.
  string config_dir = 13;
  string permission_mode = 14;
  bool allow_ungated = 15;
}

// The daemon's authoritative account of a workspace ready for host
// materialization.  A `WorkspaceAvailable` is retained until Emacs sends
// WorkspaceMaterializedCmd, so reconnecting Emacs cannot lose it.
message WorkspaceAvailable {
  string job_id = 1;
  string final_name = 2;
  string worktree_path = 3;
  string branch = 4;
  string git_root = 5;
  string base_commit = 6;
  string source_workspace = 7;
  string source_dir = 8;
  string fork_from = 9;
  string fork_session_id = 10;
  string session_id = 11;
  string priority = 12;
  string model = 13;
  bool initial_prompt_queued = 14;
  string config_dir = 15;
  string permission_mode = 16;
  bool allow_ungated = 17;
}

// Emacs has created the perspective/local bookkeeping for the authoritative
// workspace descriptor.  The daemon uses this durable acknowledgement to
// release an initial prompt that was held until a visible host workspace
// exists.
message WorkspaceMaterializedCmd {
  string job_id = 1;
}

// A daemon-owned inbox may contain UI-only actions alongside creates.  These
// typed messages hand those actions to the Emacs host without two processes
// racing to consume the same JSON file.  They are retained until completed.
message HostAction {
  string action_id = 1;
  oneof action {
    HostSwitchWorkspace switch_workspace = 2;
    HostSetRepositoryFold set_repository_fold = 3;
    HostSetSidebarView set_sidebar_view = 4;
    HostTaskCreate task_create = 5;
    HostTaskById task_toggle_done = 6;
    HostTaskById task_open = 7;
    HostTaskById task_add_workspace = 8;
    HostLegacyCommand legacy_command = 9;
    HostWorkspaceCreateFailed workspace_create_failed = 10;
  }
}

// A durably-failed workspace-creation job. It rides the same
// retained-until-completed HostAction envelope every other host action uses,
// so a creation that died is delivered, replayed across reconnects, and
// acknowledged exactly like a creation that succeeded. A failed job is never
// silent: the daemon records it, logs it, and hands it to the host to show.
message HostWorkspaceCreateFailed {
  string job_id = 1;
  string requested_name = 2;
  string error = 3;
}

message HostSwitchWorkspace { string dir = 1; }
message HostSetRepositoryFold { string repo_key = 1; bool folded = 2; }
message HostSetSidebarView { string view = 1; }
message HostTaskCreate {}
message HostTaskById { string id = 1; }

// Deliberate structured handoff for the established workspace-command verbs
// whose payloads are not stable enough to promise a field-by-field protobuf
// schema yet. `type` MUST be exactly one of: prompt, finish, close, open,
// clipboard, send, merge, or eval. `payload` is the JSON-object command body
// after the type discriminator, represented as protobuf Struct rather than an
// opaque JSON string so the daemon can validate the verb and the host can
// inspect every supplied field. This preserves every non-create inbox command
// while creation ownership moves to the daemon.
message HostLegacyCommand {
  string type = 1;
  google.protobuf.Struct payload = 2;
}

// Completion is host-only.  `ok=false` preserves the action and records the
// supplied error in the daemon's durable inbox rather than silently dropping
// a UI request that Emacs could not perform.
message HostActionCompletedCmd {
  string action_id = 1;
  bool ok = 2;
  string error = 3;
}

message CommandAck {
  string request_id = 1;
  bool ok = 2;
  string error = 3;
  // Additive (F4): the CLASSIFIED account of a refusal, superseding the free
  // string above.
  //
  // `error` was an err.Error() funnel: every handler failure, every Nack
  // reason, every truncated replay arrived as raw Go text that Emacs echoed
  // verbatim and the webapp did not render at all. This is that same failure
  // run through the daemon's one classifier, so both frontends can show a
  // refusal as a failure card instead of as a log line or as nothing.
  // Unset when ok is true.
  SystemFailureItem failure = 4;
  // Additive (I1): the interrupt confirmation CHALLENGE. Not a failure and
  // not an error: the command was understood and deliberately not performed,
  // because no turn was live and stopping live subagents deserves an
  // explicit yes. Set with ok=false and `failure` unset; the client asks the
  // user and resends InterruptCmd{confirm_agents: true}.
  InterruptConfirmRequired interrupt_confirm_required = 5;
  // Present only for SetModelCmd.  It is the shim-confirmed current model on
  // both success and rejection, so a frontend never needs an optimistic model
  // state or a local recovery guess.
  string selected_model = 6;

  // Present only for CreateSessionCmd, and FOR OBSERVABILITY ONLY: the vendor
  // conversation uuid the created session actually landed on, so a client can
  // attribute its logs from its very first line instead of waiting for the
  // first pushed SessionView.
  //
  // A CLIENT MUST NOT PERSIST THIS OR FEED IT BACK. It is an observation of
  // daemon state at one instant, not a durable fact: the uuid ROTATES (a
  // /clear or a compact starts a new vendor conversation and resets the
  // cursors with it), so a stored copy is wrong from the next rotation
  // onward. The steady-state source is the pushed SessionView, which tracks
  // rotations; this field only covers the gap before the first push.
  //
  // Feeding it back is what this whole change removed — see ResumeMode. The
  // rule is not enforceable from here, so it is also enforced where it
  // matters: the Emacs frontend has no persistence path that can reach a
  // vendor uuid, and a test asserts its state file never contains one.
  string observed_claude_session_id = 7;
}

// The challenge payload: what the interrupt would actually stop, so the
// client can render a concrete question ("interrupt 3 running subagents?")
// rather than a bare are-you-sure.
message InterruptConfirmRequired {
  int64 live_tasks = 1;
}

// ---------------------------------------------------------------------------
// The consolidated progress footer (F1).
//
// ONE daemon-resolved frame carrying the footer's EPHEMERAL input: the live
// tickers, the activity windows, and the ephemeral counts. It replaces the
// constellation of scattered in-flight indicators the webapp used to derive
// for itself (the thinking/working/retrying tail rows and the pulse
// machinery that orbited them).
//
// The footer's PHASE is not here. It is the workspace's one authoritative
// render state, which arrives as WorkspaceState (see the deprecated `state`
// below for why the copy that used to live here was removed).
//
// Resolved by daemon/internal/progress, a SIBLING of the SSM: it folds the
// same store event stream plus the ephemeral relays into a latest-wins
// ProgressView per workspace, pushed on change and carried in StateSnapshot.
// Frontends RENDER it; they never re-derive any of it.
//
// Deliberately NO output-token ticker. The token cell shows the CURRENT
// TURN's cumulative INPUT tokens (cached + uncached) only; the running
// output-token figure is explicitly unwanted, so the message_delta usage
// relay is out of this frame's scope entirely. Session-wide and per-model
// token figures are topbar territory (SessionView) and never appear here.
// ---------------------------------------------------------------------------

// An activity window: open until cleared. Each window is its own message so
// window-specific detail has a home rather than being flattened into a
// stringly-typed status.
message ProgressWindow {
  bool active = 1;
  int64 since_ms = 2;
  // Window-specific detail (a hook name, an auth prompt line, a retry's
  // attempt/status summary). Free text for display; never parsed.
  string detail = 3;
}

// One ALLOWANCE's rate-limit window, which carries structured detail no other
// window needs (a reset deadline and a utilization fraction).
//
// PRESENT means the vendor has reported this allowance at all, and the figures
// are the last report's. `active` is the narrower claim that the report was
// NEWSWORTHY — anything other than a plain "allowed" — which is what decides
// whether the rung outranks the ordinary activity the footer would otherwise
// show. The two are deliberately separate: an allowance sitting at 12% is not
// news, but it is exactly the figure a reader needs beside the allowance that
// IS, and dropping the message for it is what left the footer unable to say
// which of the two allowances the percentage it showed belonged to.
message RateLimitWindow {
  bool active = 1;
  int64 resets_at = 2;    // epoch SECONDS (the vendor event's own unit)
  double utilization = 3;
  string status = 4;      // e.g. "allowed_warning"
}

// Additive (I1): the interrupt window. Opens the moment the shim's ack
// lands — the outcome is decided ATOMICALLY on that ack (core.proto
// InterruptOutcome: the shim's single-threaded liveness check is the
// answer), so there is no outcome-pending phase to represent. Clears when
// the next turn starts. `outcome` is carried so ALREADY_COMPLETE and FAILED
// render distinctly even though neither moves the workspace's phase.
message InterruptWindow {
  bool active = 1;
  int64 since_ms = 2;
  agentshim.core.v1.InterruptOutcome outcome = 3;
}

message ProgressView {
  // 13/17 were error_summary/error_item_uuid (string): RETIRED (step 11).
  // `failure` below (F4) is the sole reader-facing account now; its own
  // item_uuid absorbed error_item_uuid's addressing job.
  reserved 13, 17;
  reserved "error_summary", "error_item_uuid";
  string workspace = 1;
  string session_id = 2;

  // DEPRECATED (F5), and no longer populated by the resolver.
  //
  // It was a COPY of the SSM's verdict kept in a second message, refreshed
  // only on this resolver's own triggers. A workspace that acquired a
  // progress fact before the SSM's state reached this resolver got a view
  // seeded INIT, and nothing ever corrected it — which is why the footer read
  // "starting" against an already-green tab until the first prompt moved the
  // phase. A second copy of an authoritative fact has no correct refresh
  // policy; the only fix is to stop keeping one.
  //
  // The footer now reads the phase off the WorkspaceState the SSM pushes,
  // which every frontend already receives. The field stays on the wire until
  // the approval-gated removal pass (proto/AGENTS.md), so an older frontend
  // decoding an older log still reads what it always did.
  RenderState state = 3 [deprecated = true];

  // Turn clock: 0 = no turn in flight.
  int64 turn_started_at_ms = 4;

  // Live tickers (latest-wins), coalesced daemon-side so a high-frequency
  // source cannot drive the frame rate.
  int64 thinking_tokens = 5;   // data.ThinkingTokens.estimated_tokens
  int64 input_tokens = 6;      // THIS TURN's cumulative cached+uncached input
  int64 ttft_ms = 7;           // first-token latency of the current message

  // Activity windows: open until cleared.
  ProgressWindow compacting = 8;       // data.StatusMessage status="compacting"
  ProgressWindow retrying = 9;         // data.ApiRetry, else the ApiErrorLine
                                       // retry family (see §retry sourcing)
  ProgressWindow authenticating = 10;  // data.AuthStatus
  ProgressWindow hook = 11;            // data.HookStarted / HookResponse

  // The vendor bills TWO independent allowances and reports them through the
  // SAME data.RateLimitEvent, distinguished only by its `rate_limit_type`:
  // the rolling five-hour session window, and the seven-day weekly window
  // (whose per-model and overage-included variants are the same allowance
  // reported with a narrower scope).
  //
  // They get a field each because they are separate facts with separate
  // deadlines and separate severities. Folding both into one window meant the
  // last event won, so a weekly figure deep into its allowance was displayed
  // under the session's name — a reader saw "91% of your session" for a number
  // that was really the week's, and had no way to tell the two apart.
  RateLimitWindow rate_limited = 12;          // rate_limit_type "five_hour"
  RateLimitWindow rate_limited_weekly = 21;   // rate_limit_type "seven_day*"

  // The session itself reporting it is parked on the USER
  // (data.SessionStateChanged state="requires_action").
  //
  // NOT A PHASE. `state` above remains the SSM's verdict and the SSM remains
  // the sole phase authority; this is an activity window like every other one
  // here, and it exists because it carries a fact the daemon cannot otherwise
  // see: the session can be blocked on an interaction the daemon holds no
  // count for, so `pending_permissions` alone under-reports "waiting on you".
  ProgressWindow blocked = 18;

  // Additive (I1): see InterruptWindow. Ack-opened, next-turn-cleared.
  InterruptWindow interrupt = 20;

  // The CLASSIFIED error state (F4), superseding the free-string
  // error_summary/error_item_uuid (RETIRED, step 11) — this failure's own
  // item_uuid absorbed error_item_uuid's addressing job.
  //
  // The footer used to render daemon-authored prose in a hardcoded red that
  // no other surface consulted; carrying the classified failure instead lets
  // it take its color from the same table the card and the workspace do.
  // Persists until the next turn starts, when it clears; set from a terminal
  // ApiErrorLine (retries exhausted) or an errored turn end.
  SystemFailureItem failure = 19;

  // Counts (ephemeral, session-scoped):
  int64 pending_permissions = 14;
  int64 queue_depth = 15;
  int64 live_task_count = 16;
}

// Full resync on (re)connect: current state of every workspace + open tasks.
message StateSnapshot {
  repeated WorkspaceState workspaces = 1;
  repeated SessionView sessions = 2;
  repeated TaskCatalog catalogs = 3;
  DaemonView daemon = 4;  // Additive (S7)
  repeated SessionInitView inits = 5;  // Additive (S9)
  repeated QueueView queues = 6;  // Additive (E4)
  repeated ProgressView progress = 7;  // Additive (F1)
  // Host-only durable work.  frontend.Server strips both fields from every
  // GUI client, regardless of observer/painter role.
  repeated WorkspaceAvailable workspace_available = 8;
  repeated HostAction host_actions = 9;
}

// ---------------------------------------------------------------------------
// The workspace roster — the sidebar's entire model.
//
// Emacs is the single author. It knows which workspaces exist, how they group,
// what each one's lifecycle is, and where the cursor sits; the daemon knows
// none of that. The roster used to reach the webapp by script injection into
// each webview, which made it per-view state that a second view could not
// share and a reconnect could not recover. As a frame it is ordinary daemon
// surface: retained, snapshotted on connect, rebroadcast on change.
// ---------------------------------------------------------------------------

// One complete, self-contained picture of the sidebar.
//
// Always whole, never a delta — the model is small and Emacs holds all of it,
// so a full replace makes a partially-applied roster unrepresentable.
message WorkspaceRoster {
  // Monotonic revision WITHIN one publisher epoch (see boot_id), incremented on
  // every publication. The daemon refuses a same-epoch publish whose revision is
  // not newer than the one it holds, so an out-of-order delivery cannot
  // resurrect a superseded roster; clients apply the same rule and drop any
  // same-epoch frame older than what they hold.
  //
  // The monotonicity floor is keyed by boot_id, NOT global: a publish carrying a
  // different boot_id opens a new epoch and resets the floor, so a restarted
  // publisher's revision=1 is accepted even against a retained revision=500.
  // That is what makes a resync path unnecessary — there is no state a fresh
  // publisher must first learn in order to publish successfully.
  int64 revision = 1;

  // The publishing editor's per-boot identity: an opaque string minted once per
  // Emacs boot and carried unchanged on every publication of that boot.
  //
  // It is the EPOCH KEY for revision monotonicity:
  //
  //   - A publish whose boot_id EQUALS the retained roster's is same-epoch. Its
  //     revision must exceed the retained revision, or it is a loud nack — the
  //     stale-publish guarantee, unchanged.
  //   - A publish whose boot_id DIFFERS from the retained roster's is a new
  //     epoch and is ALWAYS accepted, whatever its revision, resetting the
  //     floor to it. A fresh Emacs booting against a surviving daemon that
  //     retains a high revision therefore publishes successfully on its first
  //     try, instead of being refused until its counter caught up.
  //   - An EMPTY boot_id is INVALID and is nacked. A publisher that will not
  //     identify its epoch cannot be told apart from one whose epoch ended, so
  //     it is refused rather than silently folded into whatever epoch is held.
  //
  // Opaque to every reader: nothing compares boot_ids for order, derives a time
  // from one, or parses one. Equality is the only question ever asked of it.
  string boot_id = 7;

  // The active grouping. The SET ARM IS THE GROUPING — there is no separate
  // mode enum to disagree with the payload, and the rows of the inactive
  // grouping are simply absent rather than carried and ignored.
  oneof view {
    // Group by repository: the default, one section per repo.
    RosterRepositoryView repository = 2;
    // Group by task: one section per task, workspaces filed under the task
    // they serve.
    RosterTaskView task = 3;
  }

  // Workspaces whose merge has settled, hoisted out of the grouping above and
  // rendered under BOTH views. Hoisted because a merged workspace's repo or
  // task is no longer the interesting fact about it — that it is done is.
  RosterSection recently_merged = 4;

  // Absolute worktree dir of the current workspace, empty when there is none.
  // The dir is the identity: this is compared against RosterRow.dir, never
  // against a display name, which is not unique.
  string current_dir = 5;

  // Absolute worktree dir the keyboard-navigation cursor rests on, empty when
  // there is none. Distinct from current_dir on purpose: the cursor moves
  // through the roster without switching workspaces.
  string nav_dir = 6;
}

// The repository grouping's sections, in the order they render.
message RosterRepositoryView {
  // One section per repository. Order is the author's; clients do not re-sort.
  repeated RosterRepoSection sections = 1;
}

// The task grouping's sections, in the order they render.
message RosterTaskView {
  // One section per task. Order is the author's; clients do not re-sort.
  repeated RosterTaskSection sections = 1;
}

// One repository's workspaces.
message RosterRepoSection {
  // Stable key identifying the repository, and the fold state's key. Identity,
  // not decoration: the fold a user sets must survive a roster republish.
  string repo_key = 1;

  // Whether the section renders collapsed. A folded section STILL CARRIES its
  // rows — folding is a display state, so the client hides the rows rather
  // than the author omitting them, and unfolding needs no republish.
  bool folded = 2;

  // The section's workspaces, in render order.
  repeated RosterRow rows = 3;

  // The repository's human display label, as Emacs derives it from repo_key
  // (agent-repl--repo-label: the project directory's basename, or the
  // unknown-repo sentinel spelled out). DISPLAY ONLY, and deliberately not the
  // identity — repo_key remains the fold key and the join key, so renaming
  // what a section is CALLED can never orphan the fold a user set on it.
  // Carried rather than derived client-side so the label is computed in
  // exactly one place; empty when the author has no label to offer.
  string label = 4;
}

// One task's workspaces.
message RosterTaskSection {
  // Stable task identity. The ID is the identity, NOT the title: a task can be
  // renamed without becoming a different task.
  string task_id = 1;

  // Human-readable task title, for display only.
  string title = 2;

  // Whether the task is complete. This axis exists ONLY here — a repository is
  // never "done", so RosterRepoSection has no counterpart and cannot be asked
  // a question that has no answer.
  bool done = 3;

  // The workspaces filed under this task, in render order.
  repeated RosterRow rows = 4;
}

// A bare list of rows: the shared shell for a section that has no grouping key
// of its own. Used by recently_merged, which has no done axis (it is
// definitionally settled) but does fold and does carry a display name.
message RosterSection {
  // The section's workspaces, in render order.
  repeated RosterRow rows = 1;

  // Whether the section renders collapsed, exactly as a repo section folds:
  // the rows stay in the model and the client hides them. The section has no
  // key field of its own because its fold identity is fixed and singular (the
  // roster carries exactly one such section), so the author resolves the fold
  // and reports it here rather than every client inventing the same key.
  bool folded = 2;

  // The section's human display label ("Recently Merged"). DISPLAY ONLY.
  // Carried rather than hardcoded per client so the heading has one author,
  // the same one that decides which rows belong under it; empty when the
  // author has no label to offer.
  string label = 3;
}

// One workspace in the sidebar.
message RosterRow {
  // Absolute worktree dir. THE IDENTITY, and the join key to every
  // workspace-scoped frame and command: a gesture on this row travels back to
  // the daemon as this dir. Names collide across repos; dirs do not.
  string dir = 1;

  // Display name, for rendering only. Never an identity or a join key.
  string name = 2;

  // The workspace's lifecycle, as Emacs classifies it.
  //
  // THE SET ARM IS THE STATUS. Every arm is a dedicated message rather than a
  // member of an enum, so the lifecycle is named by which field is populated
  // and nothing else — there is no numeric value to widen, and no "unset but
  // still a legal value" state the way a proto3 enum's zero is.
  //
  // AN UNSET ONEOF IS INVALID and is rejected LOUDLY. A row with no lifecycle
  // is a contract breach, not a default dot, and consumers throw rather than
  // draw one — the same no-silent-fallback stance RenderState takes. (This is
  // where the retired RosterRowStatus enum's UNSPECIFIED-rejection semantics
  // now live: absence is refused at the oneof instead of at a zero value.)
  //
  // Setting more than one arm is the same breach from the other side, and is
  // rejected just as loudly.
  //
  // The vocabulary mirrors the sidebar's existing status set exactly — the
  // webapp's WorkspaceStatus union and sidebar.el's wire table are one
  // contract, and this oneof is the third face of it. It is deliberately NOT
  // RenderState: the roster carries statuses no render state produces
  // (inactive, none), and coarsens two render states (idle and ready) onto one
  // dot. Every arm message is deliberately EMPTY: the status is the whole
  // assertion, and a payload would be a second place for it to disagree.
  oneof status {
    // A prompt is committed and not yet acked by the shim.
    RosterRowStatusSubmitting submitting = 3;
    // A turn is in flight.
    RosterRowStatusThinking thinking = 6;
    // The conversation is being cleared.
    RosterRowStatusClearing clearing = 7;
    // The context is being compacted.
    RosterRowStatusCompacting compacting = 8;
    // A tool-permission request is waiting on the user.
    RosterRowStatusPermission permission = 9;
    // The turn finished and its response is unread.
    RosterRowStatusDone done = 10;
    // The turn was interrupted by the user.
    RosterRowStatusInterrupted interrupted = 11;
    // Live, proven usable, and idle. Emacs maps BOTH its idle and ready render
    // states here — the sidebar draws them identically.
    RosterRowStatusReady ready = 12;
    // No foreground turn, but detached work is still running.
    RosterRowStatusIdleAsync idle_async = 13;
    // Blocked on the vendor or the account, not on agent-repl.
    RosterRowStatusVendorBlocked vendor_blocked = 14;
    // Starting up; the route is not yet proven.
    RosterRowStatusInit init = 15;
    // The session's backing process is gone but the workspace is recoverable.
    RosterRowStatusSevered severed = 16;
    // Deliberately parked, resumable on demand.
    RosterRowStatusHibernated hibernated = 17;
    // Startup failed outright.
    RosterRowStatusStartFailed start_failed = 18;
    // Running, but with a compromised route.
    RosterRowStatusDegraded degraded = 19;
    // Terminal: no live session backs the workspace.
    RosterRowStatusDead dead = 20;

    // The merge pipeline. These render a recycle glyph rather than a lifecycle
    // dot, except merged, which is settled and files under recently_merged.
    // The first instant of a merge, before anything durable exists for it.
    RosterRowStatusMergeEnqueuing merge_enqueuing = 21;
    // A merge is actively running.
    RosterRowStatusMerging merging = 22;
    // Enqueued behind another workspace's merge.
    RosterRowStatusMergeQueued merge_queued = 23;
    // The merge stopped on a conflict awaiting resolution.
    RosterRowStatusMergeConflict merge_conflict = 24;
    // The merge failed outright.
    RosterRowStatusMergeFailed merge_failed = 25;
    // The merge settled successfully.
    RosterRowStatusMerged merged = 26;

    // Registered and open, but Emacs holds no render status for it (tombstoned
    // or not yet born). Distinct from an unset oneof: "the author looked and
    // there is none" is an assertion, where an unset oneof is the absence of
    // one.
    RosterRowStatusNone none = 27;
    // Registered in the roster but with no open perspective, so no live session
    // whose lifecycle a dot could report. Drawn as a question mark. Dominates
    // every render state: a perspective-less workspace is inactive whatever its
    // session once was.
    RosterRowStatusInactive inactive = 28;
  }

  // Whether this row is the current workspace. Redundant with a dir comparison
  // against WorkspaceRoster.current_dir and deliberately so: the author
  // resolves it once, so no client can compute it differently.
  bool current = 4;

  // Nested workspaces (a spawned family under its parent), in render order.
  repeated RosterRow children = 5;

  // Field numbers 6-28 belong to the status oneof above. The display fields
  // below continue from 29 and are ADDITIVE: every one is optional with a
  // meaningful proto3 zero, so a publisher that has not learned them yet
  // still produces a valid row.

  // When the user last viewed this workspace, in epoch MILLISECONDS. Drives
  // the row's when-column, the relative-age text the rail renders on the
  // right ("3m", "2h"). ZERO MEANS NEVER VIEWED, and renders as no age at all
  // rather than as the epoch — a workspace nobody has opened has no age to
  // report, and 0 is that assertion rather than a missing value.
  int64 last_viewed_at_ms = 29;

  // When this workspace's merge settled, in epoch MILLISECONDS. ZERO MEANS
  // NOT MERGED. Takes precedence over last_viewed_at_ms in the when-column
  // for a merged row: once a workspace is done, how long ago it merged is the
  // fact worth showing, not when someone last looked at it.
  int64 merged_at_ms = 30;

  // The workspace's own git branch, for the expanded detail panel. Display
  // only — the join key is dir, and two workspaces may sit on branches with
  // the same name in different repos. EMPTY MEANS UNKNOWN: the row renders
  // without the branch line rather than with a blank one.
  string branch = 31;

  // The branch this workspace was cut from and merges back into, for the
  // detail panel. Display only, same emptiness rule as branch.
  string parent_branch = 32;

  // A short human summary of what the workspace is doing, shown as the detail
  // panel's prose line. Emacs sources it from the workspace's last prompt
  // summary. EMPTY MEANS NONE — no summary yet, or none worth showing — and
  // the line is omitted rather than rendered blank.
  string summary = 33;

  // Whether the workspace is closed: it still exists and is still switchable,
  // but its agent-repl panes are dismissed. Renders RECEDED (greyed), the
  // same visual treatment a merged row gets, because both are workspaces the
  // user has finished with for now. Deliberately NOT a status arm: closed is
  // orthogonal to the lifecycle — a closed workspace still has one — so it
  // rides alongside the oneof rather than displacing an arm inside it.
  bool closed = 34;
}

// The roster row statuses. Each is EMPTY BY DESIGN — being set is the entire
// assertion, and a field inside would be a second thing to keep consistent
// with the arm that carries it. See RosterRow.status for what each means.

message RosterRowStatusSubmitting {}
message RosterRowStatusThinking {}
message RosterRowStatusClearing {}
message RosterRowStatusCompacting {}
message RosterRowStatusPermission {}
message RosterRowStatusDone {}
message RosterRowStatusInterrupted {}
message RosterRowStatusReady {}
message RosterRowStatusIdleAsync {}
message RosterRowStatusVendorBlocked {}
message RosterRowStatusInit {}
message RosterRowStatusSevered {}
message RosterRowStatusHibernated {}
message RosterRowStatusStartFailed {}
message RosterRowStatusDegraded {}
message RosterRowStatusDead {}
message RosterRowStatusMergeEnqueuing {}
message RosterRowStatusMerging {}
message RosterRowStatusMergeQueued {}
message RosterRowStatusMergeConflict {}
message RosterRowStatusMergeFailed {}
message RosterRowStatusMerged {}
message RosterRowStatusNone {}
message RosterRowStatusInactive {}
