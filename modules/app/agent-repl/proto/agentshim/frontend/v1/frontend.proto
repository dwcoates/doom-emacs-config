// agentshim.frontend.v1 — the daemon→frontend resolved surface.
//
// TRANSPORT: canonical proto3 JSON (protojson) frames — UDS to Emacs, WS/TCP
// to the webapp. Both frontends consume literally these messages; neither
// derives state independently (the whole point of the redesign).
//
// SEMANTICS:
// - On (re)connect the daemon sends StateSnapshot first, then deltas.
// - WorkspaceState is THE resolved render-state; frontends map .state to
//   their display vocabulary and never re-derive from raw facts.
// - TypingDelta is ephemeral (embeds core.ContentDelta); a preview is replaced
//   when the ConversationDelta carrying the complete message arrives. The two
//   sides share NO id and cannot: ContentDelta.uuid is the ANTHROPIC message
//   id (stamped at the shim, the only identity a message shares with its own
//   stream), while ConversationItem.uuid is the record ENVELOPE's id, which
//   does not exist until the message has finished being emitted. Consumers
//   therefore MATCH a finished block to its preview (same message, same kind)
//   rather than looking it up, and dedup records on the envelope uuid.
//   In particular ContentDelta.block_index is the TRUE API block ordinal,
//   while an assistant record's own `content` array holds exactly one block
//   (the SDK emits one record per block) — so that array index is always 0 and
//   is NOT an identity. Deriving one from it renders a message's blocks twice.
// - A shim/store/sidecar outage is honest sad-path reporting, surfaced as a
//   self-resolving SystemFailureItem conversation card; frontends display
//   it, they do not work around it.

syntax = "proto3";

package agentshim.frontend.v1;

import "agentshim/core/v1/core.proto";
import "agentshim/data/v1/stream.proto";
import "agentshim/data/v1/tools.proto";
import "google/protobuf/struct.proto";

option go_package = "agentrepl/proto/agentshim/frontend/v1;frontendv1";

// The closed render-state vocabulary (SSM-resolved).
//
// Every state maps onto ONE of five colors, and the colors are a promise to
// the user about what they can do rather than a description of daemon
// internals. Frontends key their render tables on the color, so the tab-bar,
// the sidebar dots, and the progress footer can never disagree:
//
//   BLUE   INIT, DEAD, DEGRADED — the route Emacs→daemon→shim→SDK is
//          compromised on OUR side. No session yet, a dead or unspawned
//          shim, bring-up, a store outage, a failed backfill, or a webview
//          that never attested painting the history. Blue is the honest
//          state whenever green's promise cannot be kept.
//   PURPLE VENDOR_BLOCKED — the last turn ended AT THE VENDOR or on the
//          ACCOUNT. Auth, usage limit, persistent 4xx/5xx, or any other
//          abnormal turn-CONCLUDING error. It is a REPORT of that
//          conclusion, the counterpart to green's "ended normally", and
//          gates nothing: prompting stays available, and the next thing
//          the agent does replaces it.
//   RED    THINKING, CLEARING, COMPACTING — a turn is in flight. The three
//          share the color because they share the claim; only the phase WORD
//          distinguishes what the agent is busy with.
//   YELLOW IDLE_ASYNC — no foreground turn, but detached work is live.
//   GREEN  READY, IDLE, DONE, PERMISSION — the route is proven usable
//          WITHOUT requiring a first message and a frontend has attested
//          painting. A pending permission is GREEN: the agent is ready for
//          the user to view the response and answer.
//
// Precedence is blue > purple > red > yellow > green, resolved in the SSM's
// SQL rank table (daemon/internal/ssm/resolve.go) rather than any Go or
// elisp cond-ladder.
enum RenderState {
  RENDER_STATE_UNSPECIFIED = 0;
  RENDER_STATE_INIT = 1;
  RENDER_STATE_IDLE = 2;
  RENDER_STATE_IDLE_ASYNC = 3;
  RENDER_STATE_THINKING = 4;
  RENDER_STATE_PERMISSION = 5;
  RENDER_STATE_DONE = 6;
  // DEPRECATED by RENDER_STATE_VENDOR_BLOCKED. It was never a state of its
  // own: an errored turn end is an abnormal CONCLUSION, which is exactly
  // what VENDOR_BLOCKED means, and its own color said "stopped" in a way
  // that read as neither working nor blocked. The SSM no longer resolves
  // it; the number stays reserved-by-use so no future state reuses it and
  // an old frontend decoding an old log still reads what it always did.
  RENDER_STATE_STOP_FAILED = 7 [deprecated = true];
  RENDER_STATE_MERGING = 8;
  RENDER_STATE_MERGE_QUEUED = 9;
  RENDER_STATE_MERGE_CONFLICT = 10;
  RENDER_STATE_MERGE_FAILED = 11;
  RENDER_STATE_MERGED = 12;
  RENDER_STATE_DEAD = 13;
  RENDER_STATE_DEGRADED = 14;
  // Additive (F3): the five-color remap.
  //
  // READY is the green a session reaches WITHOUT being prompted: the shim
  // asserted its own readiness, the backfill settled, and a frontend
  // attested painting. IDLE remains for a session that went quiet after
  // working; both are green, and the split is kept only because the SSM's
  // cause chain distinguishes "never ran" from "ran and finished".
  RENDER_STATE_READY = 15;
  RENDER_STATE_VENDOR_BLOCKED = 16;
  // Additive (I1): a turn OUTCOME on the agent axis, exactly as DONE and
  // VENDOR_BLOCKED are: it reports that the LAST turn ended because a stop
  // was delivered (core.InterruptOutcome INTERRUPTED), and the next
  // agent-axis row supersedes it. Never a latch, never needs releasing.
  RENDER_STATE_INTERRUPTED = 17;
  // Additive: the two CONTEXT-CUT states. Both are red for the same reason
  // THINKING is — the agent is busy and the user's prompt cannot land yet —
  // and the WORD is the whole distinction, exactly as INTERRUPTED's green
  // documents. They outrank thinking in the SSM's rank table because they are
  // busy with something OTHER than the answer, which is the more specific
  // true statement about what the session is doing.
  //
  // CLEARING is user-initiated (a dispatched `/clear`) and COMPACTING can be
  // either the user's `/compact` or the vendor's automatic one; when both are
  // somehow open, clearing wins.
  RENDER_STATE_CLEARING = 18;
  RENDER_STATE_COMPACTING = 19;
}

message FrontendFrame {
  // 8 was degraded_notice (DegradedNotice): RETIRED (step 11). Stage 2
  // replaced it with a self-resolving SystemFailureItem conversation card
  // (F4); both frontends have shipped their readers.
  reserved 8;
  reserved "degraded_notice";
  oneof frame {
    StateSnapshot snapshot = 1;
    WorkspaceState workspace_state = 2;
    SessionView session_view = 3;
    ConversationDelta conversation_delta = 4;
    TypingDelta typing_delta = 5;
    TaskCatalog task_catalog = 6;
    CommandAck command_ack = 7;
    DaemonView daemon_view = 9;   // Additive (S7)
    SessionInitView session_init = 10;  // Additive (S9)
    HeartbeatView heartbeat = 11;       // Additive (E4)
    QueueView queue = 12;               // Additive (E4)
    ProgressView progress = 13;         // Additive (F1)
    // Host-only durable workspace lifecycle notification.  The daemon emits
    // this only after the worktree and waiting shim are healthy; Emacs then
    // materializes its perspective and acknowledges it.
    WorkspaceAvailable workspace_available = 14;
    // Host-only durable UI action sourced by the daemon-owned JSON inbox.
    HostAction host_action = 15;
    DaemonHealthView daemon_health = 16;
    SessionHealthView session_health = 17;
  }
}

// Additive (S7): daemon-level identity/liveness Emacs read from GET /sessions'
// envelope (boot detection, version-mismatch warnings, binary staleness).
message DaemonView {
  string boot_id = 1;
  string protocol_version = 2;
  int64 daemon_binary_mtime_ms = 3;
  string daemon_version = 4;
}

// Correlated result of the daemon-global health command.  A command ACK alone
// is only a receipt that the daemon accepted a frame; this view is the
// assertion Emacs waits for before restoring any workspace.  healthy=false is
// always accompanied by a non-empty reason, so no client can mistake a failed
// observation for readiness.
message DaemonHealthView {
  string request_id = 1;
  bool healthy = 2;
  string reason = 3;
}

// Correlated result of the session-specific health command.  The daemon sets
// healthy=true only when the named live driver has a handshaked shim and that
// shim has proved its own dependency health (including its store connection).
// WORKSPACE is the absolute CWD, matching every session-routed frontend
// command; SESSION_ID prevents an old response from satisfying a newer
// restored binding.
message SessionHealthView {
  string request_id = 1;
  string workspace = 2;
  string session_id = 3;
  bool healthy = 4;
  string reason = 5;
}

// THE resolved per-workspace state, plus the inputs snapshot that produced
// it (for debuggability: a frontend can show WHY a state was resolved).
message WorkspaceState {
  string workspace = 1;
  string session_id = 2;
  RenderState state = 3;
  // Resolution inputs (SSM):
  bool turn_active = 4;
  int64 live_task_count = 5;
  string merge_phase = 6;
  string cause_kind = 7;  // event kind that caused this transition
  uint64 cause_seq = 8;   // store seq when event-caused (0 = daemon-local)
  int64 at_ms = 9;
  // Additive (F5): the DELIVERY identity of this state for this workspace.
  //
  // Stamped by the daemon's frontend delivery layer, not by the resolver:
  // it names an EMISSION of a state rather than the resolution behind it,
  // which is what a paint acknowledgment has to be able to address. Strictly
  // increasing per workspace, so "the ack names an older emission" is a
  // comparison rather than a guess, and a stale ack can never settle a newer
  // state (see PaintAckCmd.state_generation).
  //
  // It is deliberately NOT at_ms: at_ms is the winning LOG ROW's timestamp,
  // so two different emissions can legitimately carry the same one, and an
  // identity that repeats is not an identity.
  uint64 generation = 10;
}

message SessionView {
  // 14 was death_reason (string): RETIRED (step 11). It had two producers
  // and zero readers on either frontend; `death` below (F4) is the sole
  // reader-facing account now.
  reserved 14;
  reserved "death_reason";
  string workspace = 1;
  string session_id = 2;
  string model = 3;
  string slug = 4;
  string title = 5;
  int64 total_tokens = 6;
  double total_cost_usd = 7;
  int64 context_window = 8;
  string permission_mode = 9;
  bool shim_attached = 10;
  // Additive (S6): resume/rebind keys the webapp lost in the cutover.
  string claude_session_id = 11;
  string cwd = 12;
  // Additive (S7): GET /sessions parity so Emacs can drop HTTP entirely.
  bool terminal = 13;
  bool rehydratable = 15;
  bool hibernated = 16;
  int64 pending_permissions = 17;
  // Additive (S8): account identity — the CLAUDE_CONFIG_DIR the session's
  // shim runs against (account switching is daemon-executed, webapp-initiated).
  string config_dir = 18;
  // Additive (F2): whether this session's on-disk transcript has been read
  // into the store — the NEVER-BLUE completion signal (see BackfillState).
  BackfillState backfill = 19;
  // Additive (F4): the TYPED account of why this session is terminal,
  // superseding the free-string death_reason (RETIRED, step 11).
  //
  // death_reason was a free string with two producers, zero readers, and no
  // way for a frontend to know what class of failure it described. This is
  // the same fact classified once, daemon-side, so the dead-state card can
  // render it the way every other failure renders. Unset while the session
  // lives.
  SystemFailureItem death = 20;
}

// Whether a session's on-disk transcript has been backfilled into the store.
//
// This is the completion signal the never-blue contract needs: a workspace
// whose session is LIVE but whose history never arrived is still blue, and
// "live" alone cannot tell those apart. DAEMON-RESOLVED, never frontend-
// derived, and carried on SessionView so it rides every connect snapshot.
//
// DERIVED, not reported. The sidecar has no channel to the daemon at all: it
// writes to the shim-store, discards the store's own StoreWriteAck, keeps its
// cursor per-FILE (dev:inode) rather than per-session, and emits no terminal
// marker for a finished file. So the daemon reads the only evidence that
// actually reaches it — the event stream — and the mapping is:
//
//   PENDING  a transcript exists on disk for this session's cwd, but no
//            file-plane event has arrived for it yet.
//   DONE     at least one data.v1.TranscriptLine event has arrived, so the
//            file plane really did deliver into the store.
//   FAILED   the sidecar could not read part of the transcript: it emitted a
//            core.v1.UnparsedEvent, which IS durable and DOES reach the
//            daemon. Surfaced loudly rather than left reading as "not yet".
//
// KNOWN LIMITATION — a sidecar read error that is NOT a malformed line (a
// permission error, an unreadable project dir) is only logged sidecar-side and
// retried every second forever, with nothing durable written. It therefore
// manifests here as a PENDING that never advances, not as FAILED. Closing that
// needs a sidecar report the wire does not carry today; the cheapest honest
// paths are the StoreWriteAck the sidecar currently throws away, or a status
// event on its store connection.
enum BackfillState {
  // No transcript on disk for this session's cwd: a genuinely fresh
  // workspace with nothing to backfill. NOT "unknown" — an empty workspace
  // is a real, correct answer, and it is what a blue workspace should be.
  BACKFILL_STATE_UNSPECIFIED = 0;
  BACKFILL_STATE_PENDING = 1;
  BACKFILL_STATE_DONE = 2;
  BACKFILL_STATE_FAILED = 3;
}

// Complete (store-round-tripped) conversation additions, composed from the
// typed agent payloads (S9). daemon/internal/frontend/translate.go CURATES
// which payloads are pushed but never re-types them — frontends render,
// never interpret.
message ConversationDelta {
  string workspace = 1;
  string session_id = 2;
  repeated ConversationItem items = 3;
  uint64 through_seq = 4;  // frontends persist this for reconnect resync
}

// One curated conversation addition: a thin envelope around the typed
// data.v1/core.v1 payload. Consumers reconcile by uuid (permission items
// use the permission request_id as their uuid).
message ConversationItem {
  // 18 was api_error (ApiErrorLine): RETIRED (step 11). A terminal line now
  // curates to system_failure below (F4) only; a mid-backoff line curates to
  // no item at all (the retrying window covers it).
  // 16/17 were compact_boundary/compact_boundary_line: RETIRED in favour of
  // context_compacted, which carries one coalesced compaction instead of two
  // plane-shaped halves. Reserved so the wire numbers can never be reused.
  reserved 16, 17, 18;
  reserved "api_error", "compact_boundary", "compact_boundary_line";
  string uuid = 1;
  int64 ts_ms = 2;
  string request_id = 3;  // vendor API request correlation, "" when absent
  oneof item {
    agentshim.data.v1.ApiAssistantMessage assistant_message = 10;
    agentshim.data.v1.ApiUserMessage user_message = 11;
    agentshim.data.v1.ToolUseBlock tool_use = 12;
    agentshim.data.v1.ToolResultBlock tool_result = 13;
    agentshim.data.v1.ToolUseResult tool_use_result = 14;
    agentshim.data.v1.ResultMessage result = 15;
    agentshim.core.v1.PermissionItem permission = 30;
    SystemFailureItem system_failure = 31;  // Additive (F3)
    // CLEAR and COMPACT, carried verbatim from core.v1 rather than re-modeled
    // here: the daemon has already coalesced and de-duplicated them, so a
    // second frontend-shaped copy would only be a chance to drift.
    //
    // These REPLACE the retired compact_boundary/compact_boundary_line arms
    // (16, 17), which made a frontend correlate two plane-shaped halves of
    // one compaction and left the summary unreachable entirely.
    //
    // A frontend renders one of these by discarding everything ABOVE it and
    // drawing the event itself. It needs no rule for FINDING the event,
    // because the daemon floors each replay at the newest one — an arriving
    // clear or compact is therefore always live, and the string-matching a
    // frontend used to do on prompt text has no successor here by design.
    agentshim.core.v1.ContextCleared context_cleared = 32;
    agentshim.core.v1.ContextCompacted context_compacted = 33;
  }
}

// The class of a system failure. SEMANTIC, not chromatic: the wire says what
// KIND of thing failed and each frontend decides what that looks like. A wire
// that spoke in colors would make every future frontend inherit this one's
// palette.
enum ErrorClass {
  ERROR_CLASS_UNSPECIFIED = 0;
  // agent-repl's own machinery failed: shim down, daemon unreachable, store
  // outage, backfill failed, a refused command, an undeliverable interrupt.
  // Nothing about the account is implicated and no amount of waiting or
  // re-authenticating helps. Resolves the workspace BLUE.
  ERROR_CLASS_INTERNAL = 1;
  // The SDK or the vendor backend refused or concluded the work: auth,
  // usage limit, a persistent 4xx/5xx, a user-set max-turns/budget stop, a
  // model refusal, an execution abort. Releasing it needs a human or the
  // vendor, never a retry. Resolves the workspace PURPLE.
  ERROR_CLASS_API = 2;
}

// Additive (F3): a system failure as a CONVERSATION ITEM rather than a
// banner.
//
// A user whose workspace changed color needs to find out WHY from the
// conversation itself. Before this arm there was nowhere for that account to
// live: DegradedNotice is chrome that scrolls away, a CommandAck's error
// renders nothing, and a refused command's reason died in the daemon log.
//
// Composed at the SAME point that applies the state change (see
// daemon/internal/ssm), so the card and the color can never disagree — there
// is no code path that changes one without the other.
message SystemFailureItem {
  ErrorClass error_class = 1;
  // The specific failure within the class: "shim", "command", "interrupt",
  // "rate_limit", "error_max_turns", ...
  string error_type = 2;
  // The plain-language explanation the card renders.
  string message = 3;
  // Whatever structured account the source gave, verbatim, so the card can
  // show the raw failure alongside the prose rather than replacing it.
  string source_detail = 4;
  // Wall-clock ms a WINDOW-shaped failure closed; 0 means unresolved.
  //
  // Two shapes of failure share this item. A WINDOW-shaped one (shim down,
  // store outage, a refused command) has an opening edge and a closing
  // edge: the item is re-sent under the SAME ConversationItem.uuid with
  // this field set when it closes, so the feed reconciles it in place and
  // shows a settled card rather than a permanent alarm about something
  // that ended.
  //
  // An EVENT-shaped conclusion (an auth block that killed the turn, a
  // budget stop, a refusal) has no closing edge — the turn is over and
  // stays over — so it never resolves.
  int64 resolved_at_ms = 5;
  // Additive (F4): the ConversationItem.uuid this failure was filed under,
  // carried on the failure itself so a SystemFailureItem reached OUTSIDE the
  // conversation feed (ProgressView.failure, a CommandAck) can still address
  // the card it corresponds to.
  //
  // It is the failure's own identity, not a second copy of the envelope's:
  // when the item rides ConversationItem the envelope's uuid is authoritative
  // and this repeats it; when it rides anywhere else the envelope is absent
  // and this is the only addressing there is. Empty means the failure has no
  // addressable card (a turn-end error carries no item of its own).
  string item_uuid = 6;
}

// Ephemeral live-typing relay (never persisted, never in snapshots).
message TypingDelta {
  string workspace = 1;
  string session_id = 2;
  agentshim.core.v1.ContentDelta delta = 3;
}

// Additive (E4): EPHEMERAL long-tool liveness relay. The shim already emits
// core.v1.HeartbeatProgress over its UDS while a tool runs; before this arm
// existed the daemon had nowhere to put it and dropped it (a schema-forced
// drop). This is the arm.
//
// The embedded HeartbeatProgress is carried UNCHANGED, exactly as TypingDelta
// carries ContentDelta: the daemon relays, it does not re-type. Consumers key
// on progress.tool_use_id to find the running tool and use
// progress.elapsed_seconds to tick its liveness, so a long-running tool stops
// looking hung. Like TypingDelta it is never persisted and never appears in a
// StateSnapshot — a frontend that reconnects simply waits for the next
// heartbeat.
message HeartbeatView {
  string workspace = 1;
  string session_id = 2;
  agentshim.core.v1.HeartbeatProgress progress = 3;
}

// The session's retained SystemInit (slash commands, tools, skills, model
// list), pushed on attach and included in StateSnapshot (S9). Replaces the
// Emacs GET /commands HTTP menu source.
message SessionInitView {
  string workspace = 1;
  string session_id = 2;
  agentshim.data.v1.SystemInit init = 3;
}

message TaskEntry {
  string task_id = 1;
  string kind = 2;         // "agent" | "shell" | "workflow"
  string description = 3;
  string status = 4;       // running | done | error | killed | stopped | lost
  string output_path = 5;
  int64 started_at_ms = 6;
  int64 ended_at_ms = 7;   // 0 = still open
}

message TaskCatalog {
  string workspace = 1;
  string session_id = 2;
  repeated TaskEntry tasks = 3;
}

// Frontend→daemon commands (the ONLY inbound frame).
message FrontendCommand {
  string request_id = 1;
  string workspace = 2;
  oneof command {
    SubmitPromptCmd submit_prompt = 3;
    InterruptCmd interrupt = 4;
    PermissionAnswerCmd permission_answer = 5;
    MergeWorkspaceCmd merge_workspace = 6;
    CloseWorkspaceCmd close_workspace = 7;
    OpenWorkspaceCmd open_workspace = 8;
    ResyncCmd resync = 9;
    CreateSessionCmd create_session = 10;  // Additive (S7)
    DeleteSessionCmd delete_session = 11;  // Additive (S7)
    ShutdownCmd shutdown = 12;             // Additive (S9)
    ClientLogCmd client_log = 13;          // Additive (E4)
    QueueForceCmd queue_force = 14;        // Additive (E4)
    QueueAcceptCmd queue_accept = 15;      // Additive (E4)
    QueueCancelCmd queue_cancel = 16;      // Additive (E4)
    PaintAckCmd paint_ack = 17;            // Additive (F3)
    CreateWorkspaceCmd create_workspace = 18;
    WorkspaceMaterializedCmd workspace_materialized = 19;
    HostActionCompletedCmd host_action_completed = 20;
    DaemonHealthCmd daemon_health = 21;
    SessionHealthCmd session_health = 22;
  }
}

// Additive (F3): a frontend's attestation that it PAINTED this workspace's
// conversation through `through_seq`.
//
// The daemon tracks STATE; a frontend decides when that state is
// RENDERABLE. Nothing on the daemon's side of the wire can distinguish a
// webview that received every item and drew them from one that received
// every item and drew nothing — so the daemon withholds green until a
// frontend says it drew, and an absent ack simply leaves the workspace
// blue. Silence is a meaningful, correct outcome here, not a gap to be
// papered over with a timeout.
//
// It rides the command channel rather than a side HTTP route because it IS
// a frontend→daemon statement about a workspace, which is exactly what this
// channel carries — and because it must be ordered against the resync that
// delivered the history it attests to.
//
// Emacs never sends this: it renders no conversation, so it has nothing to
// attest to. The webapp sends it from the completion of a render that
// actually drew, never from the arrival of the frames describing one.
message PaintAckCmd {
  // The ConversationDelta.through_seq the frontend has painted through.
  //
  // ZERO IS A REAL ATTESTATION, not a null: an empty history is genuinely
  // paintable, and "there was nothing to draw and I drew it" is what lets a
  // never-prompted session reach READY. The daemon versions acks by this
  // value so a stale one cannot green a newer gap.
  uint64 through_seq = 1;
  // Additive (F5): the WorkspaceState.generation this ack settles.
  //
  // The second identity dimension of one render pass. through_seq addresses
  // the CONVERSATION the frontend drew; this addresses the STATE it drew,
  // which is what the delivery sequencer withholds from Emacs until a
  // painting frontend has caught up. The daemon settles a held state only on
  // an ack whose generation is at least the held one's, so an ack minted
  // against an older emission can never release a newer one.
  uint64 state_generation = 2;
  // Additive (F5): what the render attempt actually produced.
  //
  // Required. The daemon rejects an ack that names no outcome rather than
  // assuming one: "I drew it" and "I cannot draw" are opposite claims about
  // the same generation, and only the first may attest paint to the SSM.
  PaintOutcome outcome = 3;
}

// What a frontend's render attempt produced for one WorkspaceState (F5).
//
// A mounted webview whose rendering is suspended (a hidden xwidget has no
// requestAnimationFrame, a stall of 13.6 seconds was measured directly) can
// still RECEIVE frames and still answer on its socket. So it answers
// honestly — "I have this generation and I cannot draw it" — instead of
// going silent and wedging Emacs behind a webview nobody is looking at. That
// is the structural alternative to a delivery timeout: the frontend reports
// the fact it alone knows, rather than the daemon guessing from elapsed time.
enum PaintOutcome {
  // Never sent. A paint ack that names no outcome is a malformed frame, not
  // an ack with a default: the two real outcomes are opposite claims and
  // must not share an encoding with "the field was absent".
  PAINT_OUTCOME_UNSPECIFIED = 0;
  // The frontend DREW this state. Attests paint to the SSM (through_seq) and
  // settles the state for delivery to Emacs.
  PAINT_OUTCOME_PAINTED = 1;
  // The frontend HAS this state and cannot draw it, because its rendering is
  // suspended. It settles the state for delivery to Emacs — a webview nobody
  // can see has no divergence to cause — but attests NOTHING to the SSM,
  // because nothing was painted. The frontend repaints and re-acks PAINTED
  // when it becomes visible again.
  PAINT_OUTCOME_SUSPENDED = 2;
}

// ---------------------------------------------------------------------------
// The daemon-held prompt queue (E4).
//
// A prompt submitted while the session's turn is already running is NOT
// forwarded. The daemon holds it, asks a classifier whether it is the sort of
// thing the agent should hear NOW rather than after the turn, and either
// interjects it (interrupt, then submit once the turn has actually ended) or
// leaves it to be delivered FIFO when the turn ends on its own.
//
// EVERY message here is frontend surface, not shim wire. A queued prompt is an
// artifact of the DAEMON's decision to hold it back — the vendor never saw it
// and has no message for it — and the queue commands are a user-facing
// representation of an interject, whose MECHANISM (Interrupt then SubmitPrompt)
// is what actually crosses the shim UDS. See agent-shim/AGENTS.md, which uses
// this feature as its worked example of the boundary.
// ---------------------------------------------------------------------------

// What the classifier decided about a queued prompt.
enum QueueClassification {
  // Never set by the daemon. Present because proto3 reserves 0 for "the field
  // was not populated", and PENDING is a REAL verdict ("the classifier is
  // running") that must not share an encoding with "nobody said anything".
  // Every QueueEntry the daemon builds sets one of the four states below, so a
  // receiver seeing UNSPECIFIED is looking at a malformed frame and must
  // reject it loudly rather than guess which state was meant.
  QUEUE_CLASSIFICATION_UNSPECIFIED = 0;
  // Not yet classified: the entry is queued and the classifier is running.
  QUEUE_CLASSIFICATION_PENDING = 1;
  // Deliver NOW: interrupt the running turn and submit once it has ended.
  QUEUE_CLASSIFICATION_INTERJECT = 2;
  // Deliver when the turn ends on its own; do not interrupt for it.
  QUEUE_CLASSIFICATION_HOLD = 3;
  // The classifier could not be believed (it answered with neither token, or
  // both). Surfaced as its own state rather than silently defaulted to one of
  // the real verdicts: a frontend must be able to see that nothing decided
  // this. Delivery falls back to the ordinary turn-end drain, so an
  // unclassifiable prompt is delayed, never dropped.
  QUEUE_CLASSIFICATION_ERROR = 4;
}

// One prompt the daemon is holding.
message QueueEntry {
  string id = 1;
  string text = 2;
  int64 queued_at_ms = 3;
  QueueClassification classification = 4;
  // The classifier's stated reason, or the failure detail on ERROR. Free text
  // for display; never parsed.
  string rationale = 5;
  // Set by QueueAcceptCmd: the user has seen and confirmed this entry's HOLD.
  // View state only — it changes nothing about when the entry is delivered.
  bool accepted = 6;
}

// The session's queue, pushed on EVERY change and carried in StateSnapshot.
// An empty entries list is a meaningful value (the queue drained, or the
// session died), not an absent one.
message QueueView {
  string workspace = 1;
  string session_id = 2;
  repeated QueueEntry entries = 3;
}

// Deliver this entry NOW — the user overriding the classifier, or not waiting
// for it. Runs exactly the same interject sequence an INTERJECT verdict does.
message QueueForceCmd {
  string entry_id = 1;
}

// Confirm a HOLD entry. View state only: the entry is still delivered by the
// ordinary turn-end drain, on the same schedule it already had.
message QueueAcceptCmd {
  string entry_id = 1;
}

// Drop an entry. It is never delivered.
message QueueCancelCmd {
  string entry_id = 1;
}

// The severity of a ClientLogCmd. A closed vocabulary rather than a free
// string, so a frontend cannot invent a level the daemon has no policy for.
enum ClientLogLevel {
  CLIENT_LOG_LEVEL_UNSPECIFIED = 0;
  CLIENT_LOG_LEVEL_INFO = 1;
  CLIENT_LOG_LEVEL_WARN = 2;
  CLIENT_LOG_LEVEL_ERROR = 3;
}

// Additive (E4): a frontend-side diagnostic line, mirrored into the daemon's
// own on-disk log.
//
// WHY THIS EXISTS: the webapp runs inside an Emacs xwidget whose JS console
// nobody can see and nothing persists, so a delivery-path failure there (a
// seq-gap loop, a lost replay request, a stalled rAF) left no evidence
// anywhere at all. A pre-cutover HTTP route carried these; it was deleted with
// the rest of the legacy plane, and this arm restores the capability on the
// protobuf channel instead of reviving a second transport.
//
// The daemon WRITES these, it does not act on them: a client log is evidence,
// never a control signal, and is tagged in the log so a line originating in a
// frontend is never mistaken for one the daemon produced itself.
message ClientLogCmd {
  ClientLogLevel level = 1;
  string message = 2;
  // Optional structured payload (ids, counters, timings) accompanying the
  // message. Schemaless on purpose: it is diagnostic evidence whose shape is
  // the reporting call site's business, and pinning a schema here would make
  // adding a diagnostic a proto change.
  google.protobuf.Struct context = 3;
}

// Additive (S9): graceful daemon shutdown over UDS (replaces Emacs
// POST /shutdown).
message ShutdownCmd {}

// Ask the daemon to assert that every boot-critical global dependency is
// operational.  The matching DaemonHealthView, not socket existence, is the
// success criterion.  It is a frontend command because no vendor produces or
// consumes this daemon-local fact.
message DaemonHealthCmd {}

// Ask the daemon to prove the entire session route for one restored workspace:
// daemon registry -> current driver -> handshaked shim -> shim dependencies.
// The command's outer workspace is authoritative and must equal the session's
// CWD; SESSION_ID makes a stale response impossible to use after a rebind.
message SessionHealthCmd {
  string session_id = 1;
}

// Additive (S7): session creation over UDS (replaces Emacs POST /sessions).
message CreateSessionCmd {
  string cwd = 1;
  string model = 2;
  string permission_mode = 3;
  string config_dir = 4;
  string resume_claude_session_id = 5;  // "" = fresh
  bool fake = 6;                        // test harness sessions
  // The caller's DELIBERATE consent to create a session with NO permission
  // gate. Required whenever permission_mode names a mode that shadows the
  // shim's canUseTool callback in the fail-OPEN direction
  // (bypassPermissions): under such a mode the SDK auto-approves every tool
  // before canUseTool is consulted, so the daemon's whole permission
  // round-trip never engages and no permission card can ever appear.
  //
  // The daemon REFUSES such a create without this flag. The mode is otherwise
  // one string away from every ordinary create, and "reachable by a typo" is
  // not an acceptable property for the switch that turns the gate off. It is
  // a create-time consent only: a session already registered in that mode
  // still rehydrates after a daemon restart, since refusing there would
  // silently change a live session's posture.
  bool allow_ungated = 7;
}

// Additive (S7): session teardown over UDS (replaces DELETE /sessions/{id}).
message DeleteSessionCmd {
  string session_id = 1;
}

message SubmitPromptCmd {
  string text = 1;
  string permission_mode = 2;
}

// Stop the running turn. Interrupting a LIVE TURN never asks for
// confirmation. When no turn is live but subagent tasks are, the daemon
// refuses with CommandAck.interrupt_confirm_required and performs the
// interrupt only on a resend carrying confirm_agents=true — stopping working
// subagents is the one interrupt worth a deliberate second keystroke.
//
// (The retired `hard` flag also lived at field 1: it promised a soft variant
// no layer implemented, and was deleted rather than reserved — this repo had
// no live frontend commitments at the time.)
message InterruptCmd {
  bool confirm_agents = 1;
}

message PermissionAnswerCmd {
  string permission_request_id = 1;
  bool allow = 2;
  google.protobuf.Struct updated_input = 3;
  string deny_message = 4;
}

message MergeWorkspaceCmd {
  string handler = 1;  // e.g. "cherry-pick"
  bool conflict_resolved_continue = 2;  // the resolve-and-continue handoff
  // Additive (S6): the daemon has no workspace→worktree mapping of its own,
  // so the frontend supplies the merge geometry with the command.
  string source_branch = 3;
  string source_dir = 4;
  string target_dir = 5;
}

message CloseWorkspaceCmd {}

message OpenWorkspaceCmd {}

message ResyncCmd {
  uint64 from_seq = 1;
}

// Request one agent-repl workspace.  This is the sole creation ingress for
// both host UI requests (SPC TAB n/N) and skill-produced JSON dispatches.  The
// daemon owns name resolution, worktree creation, session startup, and initial
// prompt delivery; a request never asks for a promptless/no-shim workspace.
message CreateWorkspaceCmd {
  string requested_name = 1;
  string git_root = 2;
  string base_commit = 3;
  string source_workspace = 4;
  string source_dir = 5;
  optional string initial_prompt = 6;
  string priority = 7;
  string model = 8;
  string fork_from = 9;
  string fork_session_id = 10;
  string postprocessing_prompt = 11;
  string before_ws_merge = 12;
  // Explicit session account/safety posture. The daemon must not infer these
  // from its ambient process when a host asks it to create a workspace.
  string config_dir = 13;
  string permission_mode = 14;
  bool allow_ungated = 15;
}

// The daemon's authoritative account of a workspace ready for host
// materialization.  A `WorkspaceAvailable` is retained until Emacs sends
// WorkspaceMaterializedCmd, so reconnecting Emacs cannot lose it.
message WorkspaceAvailable {
  string job_id = 1;
  string final_name = 2;
  string worktree_path = 3;
  string branch = 4;
  string git_root = 5;
  string base_commit = 6;
  string source_workspace = 7;
  string source_dir = 8;
  string fork_from = 9;
  string fork_session_id = 10;
  string session_id = 11;
  string priority = 12;
  string model = 13;
  bool initial_prompt_queued = 14;
  string config_dir = 15;
  string permission_mode = 16;
  bool allow_ungated = 17;
}

// Emacs has created the perspective/local bookkeeping for the authoritative
// workspace descriptor.  The daemon uses this durable acknowledgement to
// release an initial prompt that was held until a visible host workspace
// exists.
message WorkspaceMaterializedCmd {
  string job_id = 1;
}

// A daemon-owned inbox may contain UI-only actions alongside creates.  These
// typed messages hand those actions to the Emacs host without two processes
// racing to consume the same JSON file.  They are retained until completed.
message HostAction {
  string action_id = 1;
  oneof action {
    HostSwitchWorkspace switch_workspace = 2;
    HostSetRepositoryFold set_repository_fold = 3;
    HostSetSidebarView set_sidebar_view = 4;
    HostTaskCreate task_create = 5;
    HostTaskById task_toggle_done = 6;
    HostTaskById task_open = 7;
    HostTaskById task_add_workspace = 8;
    HostLegacyCommand legacy_command = 9;
  }
}

message HostSwitchWorkspace { string dir = 1; }
message HostSetRepositoryFold { string repo_key = 1; bool folded = 2; }
message HostSetSidebarView { string view = 1; }
message HostTaskCreate {}
message HostTaskById { string id = 1; }

// Deliberate structured handoff for the established workspace-command verbs
// whose payloads are not stable enough to promise a field-by-field protobuf
// schema yet. `type` MUST be exactly one of: prompt, finish, close, open,
// clipboard, send, merge, or eval. `payload` is the JSON-object command body
// after the type discriminator, represented as protobuf Struct rather than an
// opaque JSON string so the daemon can validate the verb and the host can
// inspect every supplied field. This preserves every non-create inbox command
// while creation ownership moves to the daemon.
message HostLegacyCommand {
  string type = 1;
  google.protobuf.Struct payload = 2;
}

// Completion is host-only.  `ok=false` preserves the action and records the
// supplied error in the daemon's durable inbox rather than silently dropping
// a UI request that Emacs could not perform.
message HostActionCompletedCmd {
  string action_id = 1;
  bool ok = 2;
  string error = 3;
}

message CommandAck {
  string request_id = 1;
  bool ok = 2;
  string error = 3;
  // Additive (F4): the CLASSIFIED account of a refusal, superseding the free
  // string above.
  //
  // `error` was an err.Error() funnel: every handler failure, every Nack
  // reason, every truncated replay arrived as raw Go text that Emacs echoed
  // verbatim and the webapp did not render at all. This is that same failure
  // run through the daemon's one classifier, so both frontends can show a
  // refusal as a failure card instead of as a log line or as nothing.
  // Unset when ok is true.
  SystemFailureItem failure = 4;
  // Additive (I1): the interrupt confirmation CHALLENGE. Not a failure and
  // not an error: the command was understood and deliberately not performed,
  // because no turn was live and stopping live subagents deserves an
  // explicit yes. Set with ok=false and `failure` unset; the client asks the
  // user and resends InterruptCmd{confirm_agents: true}.
  InterruptConfirmRequired interrupt_confirm_required = 5;
}

// The challenge payload: what the interrupt would actually stop, so the
// client can render a concrete question ("interrupt 3 running subagents?")
// rather than a bare are-you-sure.
message InterruptConfirmRequired {
  int64 live_tasks = 1;
}

// ---------------------------------------------------------------------------
// The consolidated progress footer (F1).
//
// ONE daemon-resolved frame carrying the footer's EPHEMERAL input: the live
// tickers, the activity windows, and the ephemeral counts. It replaces the
// constellation of scattered in-flight indicators the webapp used to derive
// for itself (the thinking/working/retrying tail rows and the pulse
// machinery that orbited them).
//
// The footer's PHASE is not here. It is the workspace's one authoritative
// render state, which arrives as WorkspaceState (see the deprecated `state`
// below for why the copy that used to live here was removed).
//
// Resolved by daemon/internal/progress, a SIBLING of the SSM: it folds the
// same store event stream plus the ephemeral relays into a latest-wins
// ProgressView per workspace, pushed on change and carried in StateSnapshot.
// Frontends RENDER it; they never re-derive any of it.
//
// Deliberately NO output-token ticker. The token cell shows the CURRENT
// TURN's cumulative INPUT tokens (cached + uncached) only; the running
// output-token figure is explicitly unwanted, so the message_delta usage
// relay is out of this frame's scope entirely. Session-wide and per-model
// token figures are topbar territory (SessionView) and never appear here.
// ---------------------------------------------------------------------------

// An activity window: open until cleared. Each window is its own message so
// window-specific detail has a home rather than being flattened into a
// stringly-typed status.
message ProgressWindow {
  bool active = 1;
  int64 since_ms = 2;
  // Window-specific detail (a hook name, an auth prompt line, a retry's
  // attempt/status summary). Free text for display; never parsed.
  string detail = 3;
}

// The rate-limit window, which carries structured detail no other window
// needs (a reset deadline and a utilization fraction).
message RateLimitWindow {
  bool active = 1;
  int64 resets_at = 2;    // epoch SECONDS (the vendor event's own unit)
  double utilization = 3;
  string status = 4;      // e.g. "allowed_warning"
}

// Additive (I1): the interrupt window. Opens the moment the shim's ack
// lands — the outcome is decided ATOMICALLY on that ack (core.proto
// InterruptOutcome: the shim's single-threaded liveness check is the
// answer), so there is no outcome-pending phase to represent. Clears when
// the next turn starts. `outcome` is carried so ALREADY_COMPLETE and FAILED
// render distinctly even though neither moves the workspace's phase.
message InterruptWindow {
  bool active = 1;
  int64 since_ms = 2;
  agentshim.core.v1.InterruptOutcome outcome = 3;
}

message ProgressView {
  // 13/17 were error_summary/error_item_uuid (string): RETIRED (step 11).
  // `failure` below (F4) is the sole reader-facing account now; its own
  // item_uuid absorbed error_item_uuid's addressing job.
  reserved 13, 17;
  reserved "error_summary", "error_item_uuid";
  string workspace = 1;
  string session_id = 2;

  // DEPRECATED (F5), and no longer populated by the resolver.
  //
  // It was a COPY of the SSM's verdict kept in a second message, refreshed
  // only on this resolver's own triggers. A workspace that acquired a
  // progress fact before the SSM's state reached this resolver got a view
  // seeded INIT, and nothing ever corrected it — which is why the footer read
  // "starting" against an already-green tab until the first prompt moved the
  // phase. A second copy of an authoritative fact has no correct refresh
  // policy; the only fix is to stop keeping one.
  //
  // The footer now reads the phase off the WorkspaceState the SSM pushes,
  // which every frontend already receives. The field stays on the wire until
  // the approval-gated removal pass (proto/AGENTS.md), so an older frontend
  // decoding an older log still reads what it always did.
  RenderState state = 3 [deprecated = true];

  // Turn clock: 0 = no turn in flight.
  int64 turn_started_at_ms = 4;

  // Live tickers (latest-wins), coalesced daemon-side so a high-frequency
  // source cannot drive the frame rate.
  int64 thinking_tokens = 5;   // data.ThinkingTokens.estimated_tokens
  int64 input_tokens = 6;      // THIS TURN's cumulative cached+uncached input
  int64 ttft_ms = 7;           // first-token latency of the current message

  // Activity windows: open until cleared.
  ProgressWindow compacting = 8;       // data.StatusMessage status="compacting"
  ProgressWindow retrying = 9;         // data.ApiRetry, else the ApiErrorLine
                                       // retry family (see §retry sourcing)
  ProgressWindow authenticating = 10;  // data.AuthStatus
  ProgressWindow hook = 11;            // data.HookStarted / HookResponse
  RateLimitWindow rate_limited = 12;   // data.RateLimitEvent

  // The session itself reporting it is parked on the USER
  // (data.SessionStateChanged state="requires_action").
  //
  // NOT A PHASE. `state` above remains the SSM's verdict and the SSM remains
  // the sole phase authority; this is an activity window like every other one
  // here, and it exists because it carries a fact the daemon cannot otherwise
  // see: the session can be blocked on an interaction the daemon holds no
  // count for, so `pending_permissions` alone under-reports "waiting on you".
  ProgressWindow blocked = 18;

  // Additive (I1): see InterruptWindow. Ack-opened, next-turn-cleared.
  InterruptWindow interrupt = 20;

  // The CLASSIFIED error state (F4), superseding the free-string
  // error_summary/error_item_uuid (RETIRED, step 11) — this failure's own
  // item_uuid absorbed error_item_uuid's addressing job.
  //
  // The footer used to render daemon-authored prose in a hardcoded red that
  // no other surface consulted; carrying the classified failure instead lets
  // it take its color from the same table the card and the workspace do.
  // Persists until the next turn starts, when it clears; set from a terminal
  // ApiErrorLine (retries exhausted) or an errored turn end.
  SystemFailureItem failure = 19;

  // Counts (ephemeral, session-scoped):
  int64 pending_permissions = 14;
  int64 queue_depth = 15;
  int64 live_task_count = 16;
}

// Full resync on (re)connect: current state of every workspace + open tasks.
message StateSnapshot {
  repeated WorkspaceState workspaces = 1;
  repeated SessionView sessions = 2;
  repeated TaskCatalog catalogs = 3;
  DaemonView daemon = 4;  // Additive (S7)
  repeated SessionInitView inits = 5;  // Additive (S9)
  repeated QueueView queues = 6;  // Additive (E4)
  repeated ProgressView progress = 7;  // Additive (F1)
  // Host-only durable work.  frontend.Server strips both fields from every
  // GUI client, regardless of observer/painter role.
  repeated WorkspaceAvailable workspace_available = 8;
  repeated HostAction host_actions = 9;
}
