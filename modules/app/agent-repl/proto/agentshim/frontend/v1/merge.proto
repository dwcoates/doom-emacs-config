// merge.proto — The merge run's live progress — a SHARED FACT, projected independently by
// every surface that shows a merge (the sidebar's glyph, the footer's chip,
// the workspace's color).

syntax = "proto3";

package agentshim.frontend.v1;

option go_package = "agentrepl/proto/agentshim/frontend/v1;frontendv1";

// Live progress of the workspace's current (or most recent) merge run.
// WHICH message is set in `phase` IS the phase — no enum to keep in sync,
// no field that is meaningless for the current phase. Every phase
// transition and every within-phase tick (a landed cherry-pick, a test
// pass) is pushed as a WorkspaceState revision to both frontends.
message MergeStatus {
  string run_id = 1;  // daemon-minted, stable across the run

  // When the CURRENT phase was entered. Set on every phase transition. For
  // the terminal phases this is when the run finished — merged's landed
  // instant, failed's failure instant.
  int64 phase_started_at_ms = 2;

  // Monotonic within the run; bumps on within-phase ticks too (a landed
  // pick advances updated_at_ms but not phase_started_at_ms).
  int64 updated_at_ms = 3;

  oneof phase {
    MergeStatusEnqueued      enqueued       = 4;
    MergeStatusBeforeAction  before_action  = 5;
    MergeStatusCherryPicking cherry_picking = 6;
    MergeStatusTesting       testing        = 7;
    MergeStatusConflict      conflict       = 8;
    MergeStatusAfterAction   after_action   = 9;
    MergeStatusMerged        merged         = 10;
    MergeStatusFailed        failed         = 11;
  }
}

message MergeStatusEnqueued {
  int32 position = 1;  // 1-based
  int32 depth    = 2;
}

message MergeStatusBeforeAction {
  string prompt = 1;  // the configured action, for display
}

message MergeStatusCherryPicking {
  int32  commits_total   = 1;
  int32  commits_landed  = 2;
  string current_sha     = 3;
  string current_subject = 4;
}

message MergeStatusTesting {
  int32  commits_total   = 1;
  int32  commits_landed  = 2;  // the commit under test is landed but ungated
  string current_sha     = 3;
  string current_subject = 4;
}

message MergeStatusConflict {
  string conflicted_sha     = 1;
  string conflicted_subject = 2;
  int32  commits_total      = 3;
  int32  commits_landed     = 4;
}

message MergeStatusAfterAction {
  string prompt = 1;
}

message MergeStatusMerged {
  int32  commits_total      = 1;
  string after_action_error = 2;  // empty when the after action succeeded or none ran
}

message MergeStatusFailed {
  string cause           = 1;
  int32  commits_total   = 2;  // 0 when planning never completed
  int32  commits_landed  = 3;
  string failing_sha     = 4;  // set only for commit-bound failures
  string failing_subject = 5;

  // THIS MESSAGE, serialized as JSON, carried verbatim so a frontend can
  // report the WHOLE failure record as one field of the error it shows.
  //
  // A failed merge is the one merge status a human has to DIAGNOSE rather
  // than watch go by, and the narration frontends echo is a single line:
  // it quotes `cause` and `failing_subject` and drops everything else. The
  // counts and the sha never reached the report at all, so a user reading
  // "merge failed — cherry-pick refused" had to leave the editor and go to
  // the daemon log for the rest of the record.
  //
  // IT IS PRODUCED BY PROTO3's OWN JSON MAPPING (protojson), never by
  // hand-assembled string building. That is what makes it exhaustive
  // WITHOUT MAINTENANCE: a field added to this message appears in the
  // reported error the moment the schema learns it, whereas a formatter
  // listing the fields it knows would report the schema as it stood when
  // the formatter was written.
  //
  // STAMPED LAST, onto a message whose other fields are already filled and
  // whose own `failed_json` is still empty, so it is the serialization of
  // this message WITHOUT this field and can never nest inside itself.
  // Empty is never valid on a published failed arm.
  string failed_json = 6;
}

// The WHOLE merge queue, as the daemon will actually drain it: the global
// pause bit plus every repository's outstanding entries in delivery order.
// Pushed complete on every queue mutation (admit, complete, evict, pause,
// resume, terminal-mark) and included in every connect snapshot. Assembled
// under the queue's own lock, so what it shows IS what runs next — never a
// re-derivation from per-run MergeStatus, whose enqueued positions are
// admission-time facts that go stale as heads complete.
message MergeQueueRoster {
  // The daemon-global pause bit, durable across bounces. True means the run
  // in flight (if any) finishes and nothing new starts; admission is NOT
  // paused — entries still queue durably behind the gate.
  bool paused = 1;
  // When the roster last changed, unix millis, for staleness display only.
  int64 updated_at_ms = 2;
  // One group per repository with outstanding entries; an empty repo does
  // not appear.
  repeated MergeRepoQueue repos = 3;
}

message MergeRepoQueue {
  // The queue key: the repository identity shared by every sibling worktree.
  // Opaque beyond display.
  string repo_key = 1;
  // Delivery order; entries[0] is the head. Position is index + 1 —
  // deliberately not a field, so it can never disagree with the order.
  repeated MergeQueueEntry entries = 2;
}

message MergeQueueEntry {
  // The run's identity — the SAME id every MergeStatus for this merge
  // carries, and the key EvictMergeCmd names. Stable across daemon bounces.
  string run_id = 1;
  // The workspace's key (project dir).
  string workspace = 2;
  // The workspace's display name.
  string workspace_name = 3;
  // The branch being merged.
  string source_branch = 4;
  // Set ONLY on entries[0]; WHICH message is set is what the head is doing.
  oneof head {
    // The drain goroutine holds this entry: lease taken or being taken.
    // Eviction is refused for it.
    MergeQueueHeadRunning running = 5;
    // Delivered but parked at the pause gate: nothing has started.
    MergeQueueHeadPausedWaiting paused_waiting = 6;
    // A durably marked terminal word awaits re-publication; it will be
    // answered, not re-run.
    MergeQueueHeadTerminalOwed terminal_owed = 7;
  }
}
message MergeQueueHeadRunning {}
message MergeQueueHeadPausedWaiting {}
message MergeQueueHeadTerminalOwed {}

// Pause the merge queue: the run in flight finishes, nothing new dequeues.
// Durable across bounces. Idempotent. Daemon-global (the command's
// workspace is ignored).
message PauseMergeQueueCmd {}
// Resume the merge queue. Idempotent, daemon-global.
message ResumeMergeQueueCmd {}
// Evict ONE waiting entry by run id. The evicted run receives a terminal
// failed MergeStatus with an eviction cause, so the workspace's merge axis
// resolves immediately. REFUSED when run_id names the running head (only its
// drain goroutine may retire it) or names nothing outstanding.
message EvictMergeCmd {
  // The run id the roster and every MergeStatus carry.
  string run_id = 1;
}

// THE INTERRUPT'S QUEUE HALF, ASKED RATHER THAN PERFORMED.
//
// Interrupting a workspace whose merge is on the queue used to take that merge
// off silently: the stop reached the shim, the queue entry was dropped beside
// it, and the only record of a merge the user had been waiting on was a
// terminal `failed` status that arrived without being asked for. A merge is
// minutes of someone's work and the interrupt is one keystroke, so the
// destructive half is now a QUESTION.
//
// The offer is PUSHED STATE, on WorkspaceState, rather than a rejection handed
// back to whoever sent the interrupt. The interrupt's sender is frequently not
// the surface that can draw a card — the Emacs host sends it from a keybinding
// and renders no cards at all — so an answer carried on the ack would have
// nowhere to be asked. Published on the workspace, the question reaches
// whichever frontend is showing that workspace, and both frontends see the
// same one.
//
// AT MOST ONE OFFER IS OUTSTANDING PER WORKSPACE. A second interrupt while an
// offer stands re-publishes the standing on the SAME offer_id rather than
// minting a rival question, so "which of the two cards did the user answer"
// is unrepresentable.
message MergeDequeueOffer {
  // Daemon-minted, and the ONLY thing an answer may name. It is not the run
  // id: a run id would still resolve after the offer had been answered or
  // superseded, so a stale card's click would dequeue a merge the user never
  // saw the question for. This id dies with the offer.
  string offer_id = 1;
  // The run the question is about — the same id its MergeStatus carries, so a
  // frontend can tie the card to the merge it is already rendering.
  string run_id = 2;
  // When the offer was raised, unix millis.
  int64 raised_at_ms = 3;
  // WHERE the merge stands, as arms, because the two standings are answered
  // by different machinery and read as different questions. A frontend that
  // had to ask "is position 1 the head?" would be re-deriving what the daemon
  // already knows.
  oneof standing {
    MergeDequeueWaiting waiting = 4;
    MergeDequeueRunning running = 5;
  }
}

// The merge is on the queue BEHIND another one, and nothing of it has run.
// Dequeuing it is a pure queue operation: the entry is dropped and the run
// takes a terminal `failed` status.
message MergeDequeueWaiting {
  // How many merges are in front of this one. Always >= 1 — a standing with
  // nothing ahead of it is the running arm, not this one.
  int32 ahead = 1;
  // 1-based place in the repository's queue, and its depth, so the card can
  // say "3rd of 5" as well as "2 ahead of it".
  int32 position = 2;
  int32 depth = 3;
}

// The merge IS the head and its run is in flight. Dequeuing it ABORTS that
// run: the lease is released and the entry retires with a terminal `failed`
// status.
//
// WHATEVER THE RUN ALREADY LANDED ON THE TARGET STAYS THERE, exactly as
// abandoning a conflicted merge leaves its half-resolved tree. An abort that
// also unwound the target would destroy work a human may be part-way through,
// and the daemon does not make that choice on a single keystroke's behalf.
message MergeDequeueRunning {
  // WHAT the run is doing, carried whole rather than re-stated as a stage
  // enum, so the card names the phase from the one vocabulary that defines it
  // and cannot drift from the status the same frontend is already rendering.
  MergeStatus status = 1;
}

// The user's answer to a MergeDequeueOffer. Sent by whichever frontend drew
// the card; the daemon clears the offer on either arm, so declining is a real
// answer and not merely the absence of one.
message AnswerMergeDequeueCmd {
  // The offer being answered. An id that does not match the workspace's
  // outstanding offer is REFUSED rather than resolved to the current one: a
  // click on a superseded card must not dequeue the merge the card that
  // replaced it is asking about.
  string offer_id = 1;
  // The answer is a oneof of empty messages, not a bool, for the same reason
  // ReviveSessionCmd's is: "no answer" must be unrepresentable on the wire.
  oneof answer {
    MergeDequeueConfirm dequeue = 2;
    MergeDequeueDecline keep = 3;
  }
}

// Take the merge off the queue — evict it while waiting, abort it while
// running.
message MergeDequeueConfirm {}
// Leave the merge alone. The offer is cleared and the merge proceeds.
message MergeDequeueDecline {}
