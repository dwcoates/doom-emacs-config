// cursor.proto — the sidecar's file-reader position, and what the store
// returns when it hands that position back.
//
// SHIM-SIDE, because surface membership is decided by WHO PRODUCES A MESSAGE
// AND WHERE IT IS ROUTED, never by what the message is about. These messages
// are store↔sidecar traffic: the sidecar persists a cursor with the records it
// read at that position, and recovers its cursors from the store at startup.
// None of it ever crosses the daemon↔shim boundary, so none of it belongs in
// `protocol.v1`, which describes that boundary and ONLY that boundary.
//
// They lived in `protocol/v1/core.proto` until now purely because the earlier
// restructure moved that file wholesale rather than by surface.

syntax = "proto3";

package agentshim.v1;

option go_package = "agentrepl/proto/agentshim/v1;agentshimv1";

// shim-claude-sidecar file-cursor state, persisted by the store (§6.2 cursor table).
message CursorState {
  string file_id = 1;  // "dev:inode"
  string path = 2;
  int64 offset = 3;
  bytes carry = 4;     // bounded partial-line carry
}

// Cursor recovery over the socket (§7.3): the sidecar asks the store for its
// persisted cursors at startup. Empty file_id = all cursors.
message CursorQuery {
  string file_id = 1;
}

message OpenTaskState {
  // KNOWN GAP: this message says WHEN a task was last active, but not WHICH
  // task it is. The `Event` that named the task is retired and detached work is
  // modelled on frontend.v1 now, with nothing on this message replacing it —
  // see the gap note.
  int64 last_activity_at_ms = 1;
}

message CursorList {
  repeated CursorState cursors = 1;
  // Authoritative persisted tasks with no TaskEnded for the same session/task
  // identity. Returned with an all-cursors startup query so the sidecar
  // restores liveness and last activity from durable state, not file presence.
  repeated OpenTaskState open_tasks = 2;
  // True only when open_tasks was computed by a store that implements the
  // authoritative lifecycle query. Distinguishes an empty set from an older
  // store that does not understand `open_tasks`.
  bool open_tasks_authoritative = 3;
}
