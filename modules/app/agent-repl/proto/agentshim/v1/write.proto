// write.proto — how a producer hands a record to the store.
//
// SHIM-SIDE, and that placement is the whole point. The natural home for a
// write frame is `protocol.v1` alongside the other transport plumbing — but the
// daemon imports `protocol.v1` for the delivery envelope, and every file in one
// proto package generates into ONE Go package. Putting the write frame there
// would hand the daemon `Entry`, `InternalEntry` and `Plane` for free and make
// the isolation gate worthless.
//
// So the protocol is split the way the RECORD is split. The write half is here,
// reachable only by the shim, the sidecar and the store. The read half stays in
// `protocol.v1` and speaks `ExternalEntry`, which is exactly what the daemon is
// entitled to.
//
// THIS FILE EXISTS BECAUSE ITS ABSENCE STOPPED THE FIRST IMPLEMENTATION WAVE.
// The contract specified what a record IS and never specified how one MOVES;
// four independent agents hit the same wall and correctly refused to invent a
// carrier, because every workaround available to them (wrapping `Entry` in the
// old `Event.vendor` Any) would have nested the record inside an envelope
// carrying competing copies of the very fields the record now owns.

syntax = "proto3";

package agentshim.v1;

import "agentshim/v1/cursor.proto";
import "agentshim/v1/entry.proto";

option go_package = "agentrepl/proto/agentshim/v1;agentshimv1";

// One producer's write of one batch of records.
message StoreEntryWrite {
  // Which producer is writing, for attribution in the store's own logs.
  // "claude-shim:<session>" or "shim-claude-sidecar".
  string producer = 1;

  // The records, and the cursor advance that must commit with them.
  EntryBatch batch = 2;
}

// A batch of records, and the reader position that becomes durable with them.
//
// THE CURSOR RIDES WITH THE RECORDS ON PURPOSE. The sidecar's exactly-once
// contract is that its file position advances in the SAME transaction as the
// records it read at that position. Split them and a crash between the two
// either loses records (cursor advanced first) or duplicates them (records
// first) — and the duplicate case is only survivable because of `write_id`,
// which is a recovery, not a guarantee.
message EntryBatch {
  // The records, in the order the producer observed them.
  repeated Entry entries = 1;

  // Where the producer had read to when it produced these. Unset for
  // stream-plane producers, which have no file to be positioned in.
  CursorState cursor_advance = 2;
}
