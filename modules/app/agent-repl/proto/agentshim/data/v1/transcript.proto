// agentshim.data.v1 transcript — TOTAL-FIDELITY models of the on-disk
// JSONL lines the harness writes (session transcripts, agent sidechain
// transcripts, and their metadata line types), grounded in a census of
// ~1,540 real transcripts (CLI 2.1.168–2.1.215).
//
// Casing note: disk lines are camelCase (sessionId, toolUseResult,
// compactMetadata.preTokens) where the stream is snake_case; the converter
// normalizes into these messages and records the plane on the core Event.
//
// Nullable/optional conventions: proto3 scalar "" / 0 = JSON null or absent;
// where absent-vs-false matters a *_set bool accompanies the field.

syntax = "proto3";

package agentshim.data.v1;

import "google/protobuf/struct.proto";
import "agentshim/data/v1/tools.proto";
import "agentshim/data/v1/unknown.proto";

option go_package = "agentrepl/proto/agentshim/data/v1;datav1";

// ---------------------------------------------------------------------------
// Enums (envelope vocabularies, census B2/B4)
// ---------------------------------------------------------------------------

enum Entrypoint {
  ENTRYPOINT_UNSPECIFIED = 0;  // absent on a small tail of old lines
  ENTRYPOINT_CLI = 1;
  ENTRYPOINT_SDK_CLI = 2;
}

enum PromptSource {
  PROMPT_SOURCE_UNSPECIFIED = 0;
  PROMPT_SOURCE_SDK = 1;
  PROMPT_SOURCE_TYPED = 2;
  PROMPT_SOURCE_SYSTEM = 3;
  PROMPT_SOURCE_QUEUED = 4;
}

enum ToolDenialKind {
  TOOL_DENIAL_KIND_UNSPECIFIED = 0;
  TOOL_DENIAL_KIND_AUTOMODE_BLOCKED = 1;
  TOOL_DENIAL_KIND_USER_REJECTED = 2;
  TOOL_DENIAL_KIND_PERMISSION_RULE = 3;  // [corpus]
}

enum QueueOp {
  QUEUE_OP_UNSPECIFIED = 0;
  QUEUE_OP_ENQUEUE = 1;
  QUEUE_OP_DEQUEUE = 2;
  QUEUE_OP_REMOVE = 3;
}

// origin.kind on user lines.
enum OriginKind {
  ORIGIN_KIND_UNSPECIFIED = 0;
  ORIGIN_KIND_HUMAN = 1;
  ORIGIN_KIND_TASK_NOTIFICATION = 2;
  ORIGIN_KIND_COORDINATOR = 3;
}

// ---------------------------------------------------------------------------
// The line union and envelope
// ---------------------------------------------------------------------------

// Every top-level line `type` observed on disk (census B1).
message TranscriptLine {
  oneof line {
    UserLine user = 1;
    AssistantLine assistant = 2;
    SystemLine system = 3;
    AttachmentLine attachment = 4;
    ModeLine mode = 5;
    PermissionModeLine permission_mode = 6;
    QueueOperationLine queue_operation = 7;
    LastPromptLine last_prompt = 8;
    AiTitleLine ai_title = 9;
    PrLinkLine pr_link = 10;
    FileHistorySnapshotLine file_history_snapshot = 11;
    FileHistoryDeltaLine file_history_delta = 12;
    FrameLinkLine frame_link = 13;  // [corpus] observed post-census
    AttributionSnapshotLine attribution_snapshot = 14;
    // PASSTHROUGH (unknown.proto): a top-level `type` no arm above models.
    // Captured whole rather than hard-erroring — the disk format is
    // explicitly version-unstable, so a new line type is expected, not
    // exceptional. A line of a KNOWN type that fails conversion is still a
    // core.UnparsedEvent.
    UnknownRecord unknown = 15;
  }
}

message Origin {
  OriginKind kind = 1;
}

// Common envelope on user/assistant/system/attachment lines (census B2):
// ~10 always-present fields plus every optional extra observed.
message LineEnvelope {
  // Always present:
  string parent_uuid = 1;  // "" = null (first line)
  bool is_sidechain = 2;
  string uuid = 3;
  string timestamp = 4;    // ISO-8601
  string user_type = 5;    // only "external" observed
  string cwd = 6;
  string session_id = 7;
  string version = 8;      // CC version
  string git_branch = 9;   // may be ""
  Entrypoint entrypoint = 10;

  // Optional extras (occurrence counts in the census):
  string request_id = 11;                  // assistant only
  string prompt_id = 12;                   // user only
  string agent_id = 13;                    // sidechain + some main lines
  string source_tool_assistant_uuid = 14;  // every tool_result user line
  string snake_session_id = 15;            // vestigial duplicate `session_id`
  string effort = 16;                      // "high" | "xhigh"
  string attribution_agent = 17;
  string attribution_skill = 18;
  string attribution_plugin = 19;
  string slug = 20;                        // e.g. "lucky-spinning-glacier"
  PromptSource prompt_source = 21;
  string permission_mode = 22;             // user prompt lines
  Origin origin = 23;
  bool is_meta = 24;
  string source_tool_use_id = 25;
  bool tool_ends_turn = 26;
  bool is_api_error_message = 27;
  string error = 28;                       // with is_api_error_message
  int64 api_error_status = 29;
  google.protobuf.Struct error_details = 30;
  ToolDenialKind tool_denial_kind = 31;
  google.protobuf.Struct classifier_meta_lines = 32;
  string interrupted_message_id = 33;
  int64 queue_priority = 34;
  bool is_visible_in_transcript_only = 35;
  bool is_compact_summary = 36;
  string logical_parent_uuid = 37;         // compact_boundary lines
}

message UserLine {
  LineEnvelope envelope = 1;
  ApiUserMessage message = 2;
  // Disk key `toolUseResult` (string-or-object; tools.proto union).
  ToolUseResult tool_use_result = 3;
  bool has_tool_use_result = 4;
}

message AssistantLine {
  LineEnvelope envelope = 1;
  ApiAssistantMessage message = 2;
}

// ---------------------------------------------------------------------------
// system lines — every observed subtype (census B3)
// ---------------------------------------------------------------------------

message SystemLine {
  LineEnvelope envelope = 1;
  oneof subtype {
    StopHookSummaryLine stop_hook_summary = 2;
    TurnDurationLine turn_duration = 3;
    LocalCommandLine local_command = 4;
    AgentsKilledLine agents_killed = 5;
    CompactBoundaryLine compact_boundary = 6;
    InformationalLine informational = 7;
    ScheduledTaskFireLine scheduled_task_fire = 8;
    ModelRefusalNoFallbackLine model_refusal_no_fallback = 9;
    ApiErrorLine api_error = 10;
    ModelRefusalFallbackLine model_refusal_fallback = 11;  // [corpus]
    AwaySummaryLine away_summary = 12;                     // [corpus]
    // PASSTHROUGH (unknown.proto): a system `subtype` no arm above models,
    // captured whole with parent_type = "system".
    UnknownRecord unknown = 13;
  }
}

message HookInfo {
  string command = 1;
  int64 duration_ms = 2;
}

// THE durable turn-end boundary on disk.
message StopHookSummaryLine {
  int64 hook_count = 1;
  repeated HookInfo hook_infos = 2;
  repeated string hook_errors = 3;
  repeated string hook_additional_context = 4;
  bool prevented_continuation = 5;
  string stop_reason = 6;
  bool has_output = 7;
  string level = 8;  // "suggestion" | …
  string tool_use_id = 9;  // disk key `toolUseID`
}

message TurnDurationLine {
  int64 duration_ms = 1;
  int64 message_count = 2;
  int64 pending_background_agent_count = 3;
  bool is_meta = 4;
}

message LocalCommandLine {
  string content = 1;  // "<local-command-stdout>…"
  string level = 2;
}

message AgentsKilledLine {}

message PreservedSegment {
  string head_uuid = 1;
  string anchor_uuid = 2;
  string tail_uuid = 3;
}

message PreservedMessages {
  string anchor_uuid = 1;
  repeated string uuids = 2;
  repeated string all_uuids = 3;
}

// Disk compact metadata: camelCase, RICHER than the SDK stream type
// (durationMs, preservedSegment, preservedMessages, postTokens).
message DiskCompactMetadata {
  string trigger = 1;  // "manual" | "auto"
  int64 pre_tokens = 2;
  int64 duration_ms = 3;
  PreservedSegment preserved_segment = 4;
  PreservedMessages preserved_messages = 5;
  int64 post_tokens = 6;
  // [corpus] observed on newer CC versions:
  repeated string pre_compact_discovered_tools = 7;
  int64 cumulative_dropped_tokens = 8;
}

message CompactBoundaryLine {
  string content = 1;  // "Conversation compacted"
  string level = 2;
  DiskCompactMetadata compact_metadata = 3;
}

message InformationalLine {
  string content = 1;
  string level = 2;  // "warning" | …
}

message ScheduledTaskFireLine {
  string content = 1;
}

message ModelRefusalNoFallbackLine {
  string content = 1;
  string original_model = 2;
  string request_id = 3;
  string api_refusal_category = 4;
  string api_refusal_explanation = 5;
  string refused_user_message_uuid = 6;
  string level = 7;
}

message ApiErrorDetail {
  string message = 1;
  int64 status = 2;
  string request_id = 3;
  string formatted = 4;
  google.protobuf.Struct connection = 5;  // null | object
  bool is_network_down = 6;
  google.protobuf.Struct rate_limits = 7; // null | object
}

message ApiErrorLine {
  string level = 1;  // "error"
  ApiErrorDetail error = 2;
  double retry_in_ms = 3;
  int64 retry_attempt = 4;
  int64 max_retries = 5;
}

// [corpus] system/model_refusal_fallback — the refusal-with-fallback twin of
// ModelRefusalNoFallbackLine: a safeguards refusal that switched models and
// retried rather than surfacing an error.
message ModelRefusalFallbackLine {
  string direction = 1;  // "retry"
  string content = 2;
  string level = 3;      // "warning"
  string trigger = 4;    // "refusal"
  string original_model = 5;
  string fallback_model = 6;
  string request_id = 7;
  string api_refusal_category = 8;
  string api_refusal_explanation = 9;  // nullable: "" = null
  string refused_user_message_uuid = 10;
}

// [corpus] system/away_summary — the periodic away-recap line.
message AwaySummaryLine {
  string content = 1;
}

// ---------------------------------------------------------------------------
// Metadata line types (no common envelope; census B4)
// ---------------------------------------------------------------------------

message ModeLine {
  string mode = 1;  // only "normal" observed
  string session_id = 2;
}

message PermissionModeLine {
  string permission_mode = 1;  // "auto" | "bypassPermissions" | "default"
  string session_id = 2;
}

message QueueOperationLine {
  QueueOp operation = 1;
  string timestamp = 2;
  string session_id = 3;
  string content = 4;  // dequeue/remove only
}

message LastPromptLine {
  string last_prompt = 1;  // truncated with "…"; occasionally absent
  string leaf_uuid = 2;
  string session_id = 3;
}

message AiTitleLine {
  string ai_title = 1;
  string session_id = 2;
}

message PrLinkLine {
  string session_id = 1;
  int64 pr_number = 2;
  string pr_url = 3;
  string pr_repository = 4;
  string timestamp = 5;
}

message FileHistorySnapshotLine {
  string message_id = 1;
  google.protobuf.Struct snapshot = 2;  // {messageId, timestamp, trackedFileBackups}
  bool is_snapshot_update = 3;
}

message FileBackup {
  string backup_file_name = 1;  // "hash@vN"
  int64 version = 2;
  string backup_time = 3;
}

message FileHistoryDeltaLine {
  string message_id = 1;
  string snapshot_message_id = 2;
  string tracking_path = 3;
  FileBackup backup = 4;
  string timestamp = 5;
}

// Top-level type:"attribution-snapshot" — the periodic authorship snapshot
// that pairs with the `attributionAgent` / `attributionSkill` /
// `attributionPlugin` envelope fields LineEnvelope already models: those say
// WHO produced one line, this says what the working tree and prompt counters
// looked like at a moment, so authorship can be attributed over a span.
//
// Verified as a constructor in the harness bundle; zero occurrences in the
// 463k-line local census, so every field below is grounded in the
// constructor rather than observed data. `file_states` stays a Struct for
// exactly that reason — its element shape was never seen, and inventing a
// typed model for it would be a guess the schema then asserts as fact.
message AttributionSnapshotLine {
  string message_id = 1;
  string surface = 2;  // which UI surface took the snapshot
  google.protobuf.Struct file_states = 3;
  int64 prompt_count = 4;
  int64 prompt_count_at_last_commit = 5;
  int64 permission_prompt_count = 6;
  string session_id = 7;
  string timestamp = 8;
}

// [corpus] top-level type:"frame-link" — an artifact/frame reference line.
message FrameLinkLine {
  string session_id = 1;
  string path = 2;
  string frame_url = 3;
  string timestamp = 4;
}

// ---------------------------------------------------------------------------
// attachment lines — every observed attachment.type (census B5)
// ---------------------------------------------------------------------------

message AttachmentLine {
  LineEnvelope envelope = 1;
  oneof attachment {
    HookSuccessAttachment hook_success = 2;
    HookNonBlockingErrorAttachment hook_non_blocking_error = 3;
    HookBlockingErrorAttachment hook_blocking_error = 4;
    DeferredToolsDeltaAttachment deferred_tools_delta = 5;
    SkillListingAttachment skill_listing = 6;
    AgentListingDeltaAttachment agent_listing_delta = 7;
    TaskReminderAttachment task_reminder = 8;
    AutoModeAttachment auto_mode = 9;
    EditedTextFileAttachment edited_text_file = 10;
    DiagnosticsAttachment diagnostics = 11;
    CommandPermissionsAttachment command_permissions = 12;
    QueuedCommandAttachment queued_command = 13;
    ReadTruncationNoticeAttachment read_truncation_notice = 14;
    StructuredOutputAttachment structured_output = 15;
    CompactFileReferenceAttachment compact_file_reference = 16;
    ContextTipAttachment context_tip = 17;
    DateChangeAttachment date_change = 18;
    NestedMemoryAttachment nested_memory = 19;
    FileAttachment file = 20;
    UltrathinkEffortAttachment ultrathink_effort = 21;
    DynamicSkillAttachment dynamic_skill = 22;
    UltraEffortEnterAttachment ultra_effort_enter = 23;
    UltraEffortExitAttachment ultra_effort_exit = 24;
    PlanModeExitAttachment plan_mode_exit = 25;
    HookCancelledAttachment hook_cancelled = 26;   // [corpus]
    InvokedSkillsAttachment invoked_skills = 27;   // [corpus]
    // PASSTHROUGH (unknown.proto): an attachment `type` no arm above models,
    // captured whole with parent_type = "attachment".
    UnknownRecord unknown = 28;

    // Attachment types mined from the harness's own attachment renderer and
    // `attachment.type ===` sites. NONE appears in the 463k-line local census
    // because each is feature-gated, config-gated, or newer than the capture
    // — a census-only sweep structurally cannot find them, which is exactly
    // why they were missing. Shapes are grounded in the harness constructors.
    TokenUsageAttachment token_usage = 29;
    BudgetUsdAttachment budget_usd = 30;
    TaskProgressAttachment task_progress = 31;
    TaskStatusAttachment task_status = 32;
    HookStoppedContinuationAttachment hook_stopped_continuation = 33;
    // Three notices sharing one field set; the ARM carries the distinction.
    HookNoticeAttachment hook_system_message = 34;
    HookNoticeAttachment hook_additional_context = 35;
    HookNoticeAttachment hook_error_during_execution = 36;
    HookPermissionDecisionAttachment hook_permission_decision = 37;
    AgentMentionAttachment agent_mention = 38;
    PlanModeAttachment plan_mode = 39;
    PlanModeReentryAttachment plan_mode_reentry = 40;
    DelegateModeAttachment delegate_mode = 41;
    DelegateModeExitAttachment delegate_mode_exit = 42;
    OutputStyleAttachment output_style = 43;
    OpenedFileInIdeAttachment opened_file_in_ide = 44;
    CriticalSystemReminderAttachment critical_system_reminder = 45;
    EditedImageFileAttachment edited_image_file = 46;
    MemoryAttachment memory = 47;
    MemoryAttachment ultramemory = 48;
    MemoryAttachment team_context = 49;
    PlanFileReferenceAttachment plan_file_reference = 50;
    SelectedLinesInIdeAttachment selected_lines_in_ide = 51;
    McpResourceAttachment mcp_resource = 52;
    // `already_read_file` shares the `file` renderer case, so it shares the
    // FileAttachment shape rather than getting a near-duplicate twin.
    FileAttachment already_read_file = 53;
    // `todo_reminder` is the PREDECESSOR NAME of disk's `task_reminder` with
    // an identical {content, itemCount} shape, so it reuses
    // TaskReminderAttachment. A separate message would be a copy that drifts.
    TaskReminderAttachment todo_reminder = 54;
  }
}

// hook_success / hook_non_blocking_error / hook_blocking_error share one
// field set (census).
message HookSuccessAttachment {
  string command = 1;
  string content = 2;
  int64 duration_ms = 3;
  int64 exit_code = 4;
  string hook_event = 5;
  string hook_name = 6;
  string stderr = 7;
  string stdout = 8;
  string tool_use_id = 9;  // disk key `toolUseID`
}

message HookNonBlockingErrorAttachment {
  HookSuccessAttachment fields = 1;
}

// [corpus] blocking variant carries a structured blockingError object.
message BlockingErrorDetail {
  string blocking_error = 1;
  string command = 2;
}

message HookBlockingErrorAttachment {
  HookSuccessAttachment fields = 1;
  BlockingErrorDetail blocking_error = 2;
}

message DeferredToolsDeltaAttachment {
  repeated string added_lines = 1;
  repeated string added_names = 2;
  repeated string readded_names = 3;
  repeated string removed_names = 4;
  repeated string needs_auth_mcp_servers = 5;
  repeated string pending_mcp_servers = 6;
}

message SkillListingAttachment {
  string content = 1;
  bool is_initial = 2;
  repeated string names = 3;
  int64 skill_count = 4;
}

message AgentListingDeltaAttachment {
  repeated string added_lines = 1;
  repeated string added_types = 2;
  bool is_initial = 3;
  repeated string removed_types = 4;
  bool show_concurrency_note = 5;
}

message TaskReminderAttachment {
  // Array of reminder items; corpus: attachments/task_reminder.jsonl.
  google.protobuf.ListValue content = 1;
  int64 item_count = 2;
}

message AutoModeAttachment {
  bool auto_mode_consent_flow = 1;  // corpus: attachments/auto_mode.jsonl
}

message EditedTextFileAttachment {
  string filename = 1;
  string snippet = 2;
}

message DiagnosticsAttachment {
  // Array of {uri, diagnostics:[…]}; corpus: attachments/diagnostics.jsonl.
  google.protobuf.ListValue files = 1;
  bool is_new = 2;
}

message CommandPermissionsAttachment {
  repeated string allowed_tools = 1;
}

message QueuedCommandAttachment {
  string command_mode = 1;
  string prompt = 2;
  string timestamp = 3;
  Origin origin = 4;
}

message ReadTruncationNoticeAttachment {
  google.protobuf.Struct payload = 1;  // shape sparse/variable in census
}

message StructuredOutputAttachment {
  google.protobuf.Struct data = 1;
  string tool_use_id = 2;  // disk key `toolUseID`
}

message CompactFileReferenceAttachment {
  google.protobuf.Struct payload = 1;
}

message ContextTipAttachment {
  google.protobuf.Struct payload = 1;
}

message DateChangeAttachment {
  google.protobuf.Struct payload = 1;
}

message NestedMemoryAttachment {
  google.protobuf.Struct payload = 1;
}

// The file body a FileAttachment inlines: the same read payload shape the Read
// tool returns (a window of the file, with the window's bounds and the file's
// total length). Corpus: attachments/file.jsonl.
message AttachedFileBody {
  string file_path = 1;
  string content = 2;
  int64 num_lines = 3;   // lines actually present in `content`
  int64 start_line = 4;  // 1-based first line of the window
  int64 total_lines = 5; // lines in the whole file
}

// FileAttachment.content: the harness's read of the attached file, tagged with
// the payload kind it read it as. Corpus: attachments/file.jsonl.
message AttachedFileContent {
  string type = 1;  // "text"
  AttachedFileBody file = 2;
}

message FileAttachment {
  // The inlined read of the file; corpus: attachments/file.jsonl.
  AttachedFileContent content = 1;
  string display_path = 2;
  string filename = 3;
}

message UltrathinkEffortAttachment {
  google.protobuf.Struct payload = 1;
}

message DynamicSkillAttachment {
  google.protobuf.Struct payload = 1;
}

message UltraEffortEnterAttachment {
  google.protobuf.Struct payload = 1;
}

message UltraEffortExitAttachment {
  google.protobuf.Struct payload = 1;
}

message PlanModeExitAttachment {
  google.protobuf.Struct payload = 1;
}

// [corpus] attachment.type:"hook_cancelled".
message HookCancelledAttachment {
  string hook_name = 1;
  string tool_use_id = 2;  // disk key `toolUseID`
  string hook_event = 3;
}

// [corpus] attachment.type:"invoked_skills".
message InvokedSkill {
  string name = 1;
  string path = 2;     // e.g. "userSettings:create-or-update-workspace"
  string content = 3;
}

message InvokedSkillsAttachment {
  repeated InvokedSkill skills = 1;
}

// ---------------------------------------------------------------------------
// Feature-gated / newer attachment types (none observed in the local census;
// shapes grounded in the harness's own constructors and renderer switch)
// ---------------------------------------------------------------------------

// attachment.type:"token_usage" — a literal token ticker, gated on
// CLAUDE_CODE_ENABLE_TOKEN_USAGE_ATTACHMENT. Shape parallels budget_usd, but
// the two are kept apart because their UNITS differ: tokens are integral,
// dollars are not, and folding both into one message would force token counts
// through a double.
message TokenUsageAttachment {
  int64 used = 1;
  int64 total = 2;
  int64 remaining = 3;
}

// attachment.type:"budget_usd" — the cost counterpart, emitted whenever the
// `maxBudgetUsd` option is set.
message BudgetUsdAttachment {
  double used = 1;
  double total = 2;
  double remaining = 3;
}

// attachment.type:"task_progress" — the transcript-plane note that a detached
// task made progress. Thinner than the stream's system/task_progress, which
// carries the usage counters; this is the durable breadcrumb.
message TaskProgressAttachment {
  string task_id = 1;    // disk key `taskId`
  string task_type = 2;  // disk key `taskType`
  string message = 3;
}

// attachment.type:"task_status" — the subagent lifecycle transition feed,
// carrying an INCREMENTAL summary of what changed since the last transition.
message TaskStatusAttachment {
  string task_id = 1;        // disk key `taskId`
  string task_type = 2;      // disk key `taskType`
  string status = 3;
  string description = 4;
  string delta_summary = 5;  // disk key `deltaSummary`
}

// attachment.type:"hook_stopped_continuation" — a hook halted the turn.
// Carries `message` where the notices below carry `content`, so it is its own
// message rather than sharing HookNoticeAttachment.
message HookStoppedContinuationAttachment {
  string message = 1;
  string hook_name = 2;   // disk key `hookName`
  string tool_use_id = 3; // disk key `toolUseID`
  string hook_event = 4;  // disk key `hookEvent`
}

// The shared shape of the three hook NOTICE attachments — hook_system_message,
// hook_additional_context and hook_error_during_execution — which the harness
// constructs with an identical field set. The AttachmentLine arm carries the
// distinction, so one message serves all three without three copies that
// would drift apart.
message HookNoticeAttachment {
  string content = 1;
  string hook_name = 2;   // disk key `hookName`
  string tool_use_id = 3; // disk key `toolUseID`
  string hook_event = 4;  // disk key `hookEvent`
}

// attachment.type:"hook_permission_decision" — a hook ruled on a permission.
message HookPermissionDecisionAttachment {
  string decision = 1;
  string tool_use_id = 2; // disk key `toolUseID`
  string hook_event = 3;  // disk key `hookEvent`
}

// attachment.type:"agent_mention" — the user named an agent in the prompt.
message AgentMentionAttachment {
  string agent_type = 1;  // disk key `agentType`
}

// attachment.type:"plan_mode" — the plan-mode reminder. `plan_exists`
// distinguishes "a plan file is expected here" from "one is already written",
// which is why it is carried alongside the path rather than inferred from it.
message PlanModeAttachment {
  string reminder_type = 1;  // disk key `reminderType`
  bool is_sub_agent = 2;     // disk key `isSubAgent`
  string plan_file_path = 3; // disk key `planFilePath`
  bool plan_exists = 4;      // disk key `planExists`
}

// attachment.type:"plan_mode_reentry" — plan mode was re-entered.
message PlanModeReentryAttachment {
  string plan_file_path = 1;  // disk key `planFilePath`
}

// attachment.type:"delegate_mode" — a delegated (team) run began.
message DelegateModeAttachment {
  string team_name = 1;      // disk key `teamName`
  string task_list_path = 2; // disk key `taskListPath`
}

// attachment.type:"delegate_mode_exit" — delegated mode ended. The harness
// constructs it with no payload; the arm's presence IS the signal.
message DelegateModeExitAttachment {}

// attachment.type:"output_style" — the active output style changed.
message OutputStyleAttachment {
  string style = 1;
}

// attachment.type:"opened_file_in_ide" — the user opened a file in the IDE.
message OpenedFileInIdeAttachment {
  string filename = 1;
}

// attachment.type:"critical_system_reminder" — a reminder rendered with
// higher prominence than an ordinary system reminder.
message CriticalSystemReminderAttachment {
  string content = 1;
}

// attachment.type:"edited_image_file" — an image edited in place. `content`
// is the harness's own textual description of the edit, NOT image bytes
// (contrast ImageBlock.source, which carries the bytes).
message EditedImageFileAttachment {
  string filename = 1;
  string content = 2;
}

// The shared carrier for `memory`, `ultramemory` and `team_context`.
//
// These three were confirmed as attachment-type sites in the harness, but
// none is literal-constructed anywhere reachable, so their field sets were
// never observed. `payload` therefore stays a Struct: it preserves whatever
// arrives with zero loss, and asserting a typed shape here would be a guess
// the schema then presents as fact — the same treatment the corpus-sparse
// attachments above already get. The ARM distinguishes the three.
message MemoryAttachment {
  google.protobuf.Struct payload = 1;
}

// attachment.type:"plan_file_reference" — a plan file pulled into context,
// with its body inlined.
message PlanFileReferenceAttachment {
  string plan_file_path = 1;  // disk key `planFilePath`
  string plan_content = 2;    // disk key `planContent`
}

// attachment.type:"selected_lines_in_ide" — the user's IDE selection.
message SelectedLinesInIdeAttachment {
  string ide_name = 1;   // disk key `ideName`
  int64 line_start = 2;  // disk key `lineStart`
  int64 line_end = 3;    // disk key `lineEnd`
  string filename = 4;
  string content = 5;
}

// attachment.type:"mcp_resource" — an MCP resource pulled into context.
message McpResourceAttachment {
  string server = 1;
  string uri = 2;
  string name = 3;
  string description = 4;
  string content = 5;
}

// ---------------------------------------------------------------------------
// Sidechain companion metadata (agent-<id>.meta.json)
// ---------------------------------------------------------------------------

message AgentMetaJson {
  string agent_type = 1;
  string description = 2;
  string tool_use_id = 3;
  int64 spawn_depth = 4;
  string model = 5;
}
