// agentshim.data.v1 stream — TOTAL-FIDELITY models of the Claude Agent SDK
// live stream (`query()` iterator), grounded in @anthropic-ai/claude-agent-sdk
// v0.3.220 typings (`package/sdk.d.ts`) plus empirically observed stream-only
// families (CLI 2.1.215 probes). Field comments cite the source:
// [sdk coreTypes.d.ts:NNN] for members typed as of 0.1.77, [sdk 0.3.220] for
// members the 0.3.220 typings added, [observed] for shapes absent from the
// typings, [corpus] for shapes grounded in captured fixtures.
//
// The eight families once carried as [observed] guesses (rate_limit_event,
// hook_started, thinking_tokens, notification, task_started, task_updated,
// task_notification, background_tasks_changed) are all first-class typed
// members as of 0.3.220, with field sets matching what was reverse-engineered.
//
// DELIBERATELY NOT MODELED. `system/post_turn_summary` and
// `system/task_summary` are forwarded to the query() iterator by SDK 0.3.220
// but are typed NOWHERE in it, constructed nowhere, and have no field ever
// read — their shape is genuinely unknown. Inventing fields for them would
// assert a guess as schema, so they ride the `unknown` passthrough arm, which
// preserves them whole until a real shape can be observed. This absence is a
// decision, not an oversight.
//
// Conversion contract (§5.1 of the design doc): the claude-shim converter
// hard-errors (→ core.UnparsedEvent) on missing expected fields, captures
// unknown NEW fields into the containing Event.extras, and never drops data.

syntax = "proto3";

package agentshim.data.v1;

import "google/protobuf/struct.proto";
import "agentshim/data/v1/tools.proto";
import "agentshim/data/v1/transcript.proto";
import "agentshim/data/v1/unknown.proto";

option go_package = "agentrepl/proto/agentshim/data/v1;datav1";

// The full stream union [sdk coreTypes.d.ts:553] plus observed-only members.
message ClaudeStreamMessage {
  oneof msg {
    UserMessage user = 1;
    AssistantMessage assistant = 2;
    ResultMessage result = 3;
    SystemInit system_init = 4;
    StreamEvent stream_event = 5;
    CompactBoundary compact_boundary = 6;
    StatusMessage status = 7;
    HookResponse hook_response = 8;
    ToolProgress tool_progress = 9;
    AuthStatus auth_status = 10;
    // Observed-only stream families (not in SDK typings):
    RateLimitEvent rate_limit_event = 11;
    HookStarted hook_started = 12;
    ThinkingTokens thinking_tokens = 13;
    SystemNotification notification = 14;
    TaskStartedMsg task_started = 15;
    TaskUpdatedMsg task_updated = 16;
    TaskNotificationMsg task_notification = 17;
    BackgroundTasksChanged background_tasks_changed = 18;
    // Control-channel wire types [sdk controlTypes.d.ts:86-114]:
    ControlRequest control_request = 19;
    ControlResponse control_response = 20;
    ControlCancelRequest control_cancel_request = 21;
    KeepAlive keep_alive = 22;
    // PASSTHROUGH (unknown.proto): a `type`/`subtype` no arm above models.
    // The SDK union grew 11 -> 38 members between 0.1.77 and 0.3.220, so an
    // unmodeled family is the NORMAL consequence of the vendor shipping,
    // not a defect. Captured whole; a message of a KNOWN family that fails
    // conversion is still a core.UnparsedEvent.
    UnknownRecord unknown = 23;
    // Families typed by SDK 0.3.220 that 0.1.77 did not have. All are
    // PERSISTENT (see the classification note above this file's system
    // section).
    ApiRetry api_retry = 24;
    ControlRequestProgress control_request_progress = 25;
    ModelRefusalFallback model_refusal_fallback = 26;
    ModelRefusalNoFallback model_refusal_no_fallback = 27;
    LocalCommandOutput local_command_output = 28;
    HookProgress hook_progress = 29;
    PluginInstall plugin_install = 30;
    TaskProgressMsg task_progress = 31;
    SessionStateChanged session_state_changed = 32;
    WorkerShuttingDown worker_shutting_down = 33;
    CommandsChanged commands_changed = 34;
    FilesPersisted files_persisted = 35;
    MemoryRecall memory_recall = 36;
    ElicitationComplete elicitation_complete = 37;
    PermissionDenied permission_denied = 38;
    MirrorError mirror_error = 39;
    Informational informational = 40;
    ToolUseSummary tool_use_summary = 41;
    PromptSuggestion prompt_suggestion = 42;
    ConversationReset conversation_reset = 43;
    ActiveGoal active_goal = 44;
  }
}

// --- user / assistant ------------------------------------------------------

// [sdk coreTypes.d.ts:396-426] SDKUserMessage + SDKUserMessageReplay folded
// (is_replay=true for the replay variant, whose uuid is required).
message UserMessage {
  ApiUserMessage message = 1;
  // string|null in TS; empty = null.
  string parent_tool_use_id = 2;
  bool is_synthetic = 3;
  // `tool_use_result?: unknown` — the structured result. String-or-object
  // union modeled exactly like the disk twin.
  ToolUseResult tool_use_result = 4;
  string uuid = 5;  // optional in typings, always present on disk
  string session_id = 6;
  bool is_replay = 7;
  // [observed] present on subagent-context user messages:
  string subagent_type = 8;
  string task_description = 9;
  // [sdk 0.3.220] fields beyond the folded 0.1.77 core:
  string timestamp = 10;
  // "now" | "next" | "later" — the queue-priority signal.
  string priority = 11;
  // Provenance. UNSET is UNATTRIBUTED, never "human": strict trust gates fail
  // closed on it (see Origin in transcript.proto).
  Origin origin = 12;
  bool should_query = 13;
  // REPLAY-ONLY (SDKUserMessageReplay). Typed `unknown[]` by the SDK, so
  // captured verbatim rather than guessed at.
  google.protobuf.ListValue file_attachments = 14;
}

// [sdk coreTypes.d.ts:427] SDKAssistantMessageError.
enum AssistantMessageError {
  ASSISTANT_MESSAGE_ERROR_UNSPECIFIED = 0;
  ASSISTANT_MESSAGE_ERROR_AUTHENTICATION_FAILED = 1;
  ASSISTANT_MESSAGE_ERROR_BILLING_ERROR = 2;
  ASSISTANT_MESSAGE_ERROR_RATE_LIMIT = 3;
  ASSISTANT_MESSAGE_ERROR_INVALID_REQUEST = 4;
  ASSISTANT_MESSAGE_ERROR_SERVER_ERROR = 5;
  ASSISTANT_MESSAGE_ERROR_UNKNOWN = 6;
  // [sdk 0.3.220] the rest of the 10-member vocabulary. Without these the
  // converter collapsed four distinct failures into UNSPECIFIED.
  ASSISTANT_MESSAGE_ERROR_OAUTH_ORG_NOT_ALLOWED = 7;
  ASSISTANT_MESSAGE_ERROR_OVERLOADED = 8;
  ASSISTANT_MESSAGE_ERROR_MODEL_NOT_FOUND = 9;
  ASSISTANT_MESSAGE_ERROR_MAX_OUTPUT_TOKENS = 10;
}

// [sdk coreTypes.d.ts:428-435] SDKAssistantMessage.
message AssistantMessage {
  ApiAssistantMessage message = 1;
  string parent_tool_use_id = 2;
  AssistantMessageError error = 3;  // unset when absent
  bool has_error = 4;               // disambiguates unset vs UNKNOWN
  string uuid = 5;
  string session_id = 6;
  // Vendor API request correlation when supplied by the SDK. Presence is
  // evidence: omission and a supplied identifier are distinct wire facts.
  optional string request_id = 7;
  string timestamp = 8;
  bool resumed_from_incomplete_thinking = 9;
  // The uuids this message REPLACES (a re-issued assistant turn). Consumers
  // reconciling per uuid must retract these, not render both.
  repeated string supersedes = 10;
  bool aborted = 11;
  // Subagent context, matching UserMessage's pair.
  string subagent_type = 12;
  string task_description = 13;
  // The vendor agent identifier attached to this assistant response when supplied by the SDK.
  string agent_id = 14;
  // The owning agent identifier attached to a nested subagent response when supplied by the SDK.
  string parent_agent_id = 15;
  // RETIRED: `PromptCacheRates cache_rates = 16`.
  //
  // The shim used to divide this response's three token buckets into a rate
  // partition and ship the quotients. That was TOKEN JUDGMENT taken outside the
  // daemon, and the shim is a faithful translator: it reports the vendor's
  // counters and derives nothing from them. Every rate a surface shows is now
  // derived by the daemon from the canonical
  // `agentshim.frontend.v1.TokenUsage` shape.
  //
  // Store events written before the retirement still carry field 16. They
  // decode unchanged — the bytes survive as an unknown field and re-marshal
  // byte-identically — and the daemon recomputes the same quotients from the
  // same counters, so a replayed old event produces the identical durable
  // record it always did.
  reserved 16;
  reserved "cache_rates";
}

// [sdk coreTypes.d.ts:441-474] SDKResultMessage, both variants, plus
// [observed] stream-only extras.
enum ResultSubtype {
  RESULT_SUBTYPE_UNSPECIFIED = 0;
  RESULT_SUBTYPE_SUCCESS = 1;
  RESULT_SUBTYPE_ERROR_DURING_EXECUTION = 2;
  RESULT_SUBTYPE_ERROR_MAX_TURNS = 3;
  RESULT_SUBTYPE_ERROR_MAX_BUDGET_USD = 4;
  RESULT_SUBTYPE_ERROR_MAX_STRUCTURED_OUTPUT_RETRIES = 5;
  // THE SHIM'S OWN MEMBER, not one the SDK ever sends. A turn the user
  // stopped comes back from the SDK wearing whatever error flavor the abort
  // happened to produce — usually `error_during_execution` — which reads as a
  // failure the session must recover from. It is not: the user asked for the
  // stop, and the shim is the party that acked it, so the shim names the
  // outcome here rather than letting a downstream renderer infer an interrupt
  // from an error it cannot distinguish from a real one.
  //
  // It is the same word the stdio transport's Layer-1 protocol has always
  // used for an interrupt-ended turn (`ResultSubtype = "aborted"` in
  // shim/src/protocol.ts), so both transports state the outcome identically.
  //
  // The VENDOR'S own account is not overwritten to make room for it:
  // ResultMessage.stop_reason still carries the SDK's verbatim word, so the
  // record loses nothing by being named honestly.
  RESULT_SUBTYPE_ABORTED = 6;
}

message ResultMessage {
  ResultSubtype subtype = 1;
  int64 duration_ms = 2;
  int64 duration_api_ms = 3;
  bool is_error = 4;
  int32 num_turns = 5;
  string result = 6;                       // success only
  double total_cost_usd = 7;
  Usage usage = 8;
  map<string, ModelUsage> model_usage = 9;
  repeated PermissionDenial permission_denials = 10;
  google.protobuf.Struct structured_output = 11;  // success only, optional
  repeated string errors = 12;             // error variants only
  string uuid = 13;
  string session_id = 14;
  // Fields 15-22 were reverse-engineered as [observed] against SDK 0.1.77 and
  // are TYPED as of 0.3.220 — the guesses were right. stop_reason is required
  // on both variants there; the rest ride the success variant only, except
  // terminal_reason / fast_mode_state, which ride both.
  int64 api_error_status = 15;   // number|null; 0 = null
  bool api_error_status_set = 16;
  int64 ttft_ms = 17;
  int64 ttft_stream_ms = 18;
  int64 time_to_request_ms = 19;
  string stop_reason = 20;       // e.g. "end_turn"
  // 19-value TerminalReason vocabulary, e.g. "completed", "max_turns",
  // "budget_exhausted", "hook_stopped".
  string terminal_reason = 21;
  string fast_mode_state = 22;   // "off" | "cooldown" | "on"
  // [sdk 0.3.220] spawn-to-first-request latency and turn attribution:
  string user_message_uuid = 23;
  int64 request_sent_wall_ms = 24;
  int64 time_to_request_from_spawn_ms = 25;
  bool warm_spare_claimed = 26;
  int64 time_origin_ms = 27;
  // A tool the turn ended WITHOUT running (terminal_reason "tool_deferred").
  DeferredToolUse deferred_tool_use = 28;
  // 10-value FastModeDisabledReason vocabulary, e.g. "free", "preference",
  // "network_error", "model_not_allowed".
  string fast_mode_disabled_reason = 29;
  Origin origin = 30;
}

// [sdk 0.3.220 SDKDeferredToolUse] the tool a deferred turn never ran.
message DeferredToolUse {
  string id = 1;
  string name = 2;
  google.protobuf.Struct input = 3;
}

// Anthropic API usage block (NonNullableUsage).
message Usage {
  int64 input_tokens = 1;
  int64 output_tokens = 2;
  int64 cache_read_input_tokens = 3;
  int64 cache_creation_input_tokens = 4;
  google.protobuf.Struct cache_creation = 5;   // nested breakdown when present
  google.protobuf.Struct server_tool_use = 6;  // web-search counters when present
  string service_tier = 7;
}

// [sdk coreTypes.d.ts:8-16] ModelUsage + [observed] max_output_tokens.
message ModelUsage {
  int64 input_tokens = 1;
  int64 output_tokens = 2;
  int64 cache_read_input_tokens = 3;
  int64 cache_creation_input_tokens = 4;
  int64 web_search_requests = 5;
  // Model cost when supplied by the SDK. Presence distinguishes a reported
  // zero from unavailable pricing evidence.
  optional double cost_usd = 6;
  // Context capacity when supplied by the SDK.
  optional int64 context_window = 7;
  // Maximum response capacity when supplied by the SDK.
  optional int64 max_output_tokens = 8;
  // [sdk 0.3.220] which model actually served the request, and through whom —
  // an alias resolves to a canonical id, and the provider may not be Anthropic.
  optional string canonical_model = 9;
  optional string provider = 10;
}

// [sdk coreTypes.d.ts:436-440].
message PermissionDenial {
  string tool_name = 1;
  string tool_use_id = 2;
  google.protobuf.Struct tool_input = 3;
}

// --- system: init ----------------------------------------------------------

// [sdk coreTypes.d.ts:64] MCP server status vocabulary.
enum McpServerState {
  MCP_SERVER_STATE_UNSPECIFIED = 0;
  MCP_SERVER_STATE_CONNECTED = 1;
  MCP_SERVER_STATE_FAILED = 2;
  MCP_SERVER_STATE_NEEDS_AUTH = 3;  // wire spelling is "needs-auth"
  MCP_SERVER_STATE_PENDING = 4;
  MCP_SERVER_STATE_DISABLED = 5;
}

// [sdk 0.3.220 McpServerStatus]. NOTE the asymmetry: `system:init` carries
// only the narrow {name, status} pair, while the RICH form below arrives on
// the control channel's mcp_server_status response. One message models both,
// so the extra fields are simply unset on the init path.
message McpServerStatus {
  string name = 1;
  McpServerState status = 2;
  McpServerInfo server_info = 3;
  string error = 4;
  // McpServerStatusConfig is a union of transport configs, so it stays a
  // Struct: there is no single shape to type it as.
  google.protobuf.Struct config = 5;
  string scope = 6;
  repeated McpToolRef tools = 7;
}

message McpServerInfo {
  string name = 1;
  string version = 2;
}

// One tool an MCP server advertises, with the hints a permission surface needs
// to decide how loudly to ask.
message McpToolRef {
  string name = 1;
  string description = 2;
  McpToolAnnotations annotations = 3;
}

message McpToolAnnotations {
  bool read_only = 1;
  bool destructive = 2;
  bool open_world = 3;
}

message PluginRef {
  string name = 1;
  string path = 2;
  string source = 3;   // [corpus] e.g. "gns-cowork@chesscom-gns"
  string version = 4;  // [corpus]
}

enum ApiKeySource {
  API_KEY_SOURCE_UNSPECIFIED = 0;
  API_KEY_SOURCE_USER = 1;
  API_KEY_SOURCE_PROJECT = 2;
  API_KEY_SOURCE_ORG = 3;
  API_KEY_SOURCE_TEMPORARY = 4;
  API_KEY_SOURCE_NONE = 5;  // [corpus] subscription auth reports "none"
}

// [sdk coreTypes.d.ts:475-499] SDKSystemMessage subtype "init"
// + [observed] fast_mode_state.
message SystemInit {
  repeated string agents = 1;
  ApiKeySource api_key_source = 2;
  repeated string betas = 3;
  string claude_code_version = 4;
  string cwd = 5;
  repeated string tools = 6;
  repeated McpServerStatus mcp_servers = 7;
  string model = 8;
  string permission_mode = 9;  // [sdk coreTypes.d.ts:173] vocabulary
  repeated string slash_commands = 10;
  string output_style = 11;
  repeated string skills = 12;
  repeated PluginRef plugins = 13;
  string uuid = 14;
  string session_id = 15;
  string fast_mode_state = 16;  // [observed] in 0.1.77; TYPED in 0.3.220
  // [corpus] further observed init fields:
  repeated string capabilities = 17;        // e.g. "interrupt_receipt_v1"
  bool analytics_disabled = 18;
  bool product_feedback_disabled = 19;
  map<string, string> memory_paths = 20;    // e.g. {"auto": <memory dir>}
  // [sdk 0.3.220] WHY fast mode is off, so the state is explicable and not
  // just a flag. Same 10-value vocabulary as ResultMessage's.
  string fast_mode_disabled_reason = 21;
}

// --- stream_event (partial messages) ----------------------------------------

// [sdk coreTypes.d.ts:500-506] SDKPartialAssistantMessage wrapping the raw
// Anthropic API RawMessageStreamEvent. NOTE: in live operation these become
// EPHEMERAL core.ContentDelta via the delta bypass; the full typed model
// below exists for total fidelity (probes, tests, diagnostics).
message StreamEvent {
  RawMessageStreamEvent event = 1;
  string parent_tool_use_id = 2;
  string uuid = 3;
  string session_id = 4;
  int64 ttft_ms = 5;  // [observed] time-to-first-token stamp on partials
}

message RawMessageStreamEvent {
  oneof event {
    MessageStartEvent message_start = 1;
    ContentBlockStartEvent content_block_start = 2;
    ContentBlockDeltaEvent content_block_delta = 3;
    ContentBlockStopEvent content_block_stop = 4;
    MessageDeltaEvent message_delta = 5;
    MessageStopEvent message_stop = 6;
  }
}

message MessageStartEvent {
  google.protobuf.Struct message = 1;  // the API message skeleton, verbatim
}

message ContentBlockStartEvent {
  uint32 index = 1;
  google.protobuf.Struct content_block = 2;
}

message ContentBlockDeltaEvent {
  uint32 index = 1;
  oneof delta {
    TextDelta text_delta = 2;
    ThinkingDelta thinking_delta = 3;
    InputJsonDelta input_json_delta = 4;
    SignatureDelta signature_delta = 5;
  }
}

message TextDelta {
  string text = 1;
}

// [observed] estimated_tokens: number|null on thinking deltas.
message ThinkingDelta {
  string thinking = 1;
  int64 estimated_tokens = 2;
  bool estimated_tokens_set = 3;
}

message InputJsonDelta {
  string partial_json = 1;
}

message SignatureDelta {
  string signature = 1;
}

message ContentBlockStopEvent {
  uint32 index = 1;
}

message MessageDeltaEvent {
  google.protobuf.Struct delta = 1;  // stop_reason/stop_sequence updates

  // The NARROW legacy projection of the delta's usage. Frozen exactly as it
  // is: rows carrying it are already persisted, and a replay must decode them
  // byte-identically. Read `vendor_usage` instead.
  Usage usage = 2;

  // The vendor's own cumulative usage as of this delta, relayed VERBATIM.
  //
  // WHY IT EXISTS. A turn's token ledger is reconciled from two planes: the
  // per-response stream evidence, and the terminal result's totals. Those two
  // could not be made to agree on output_tokens, because the assistant message
  // the stream plane's evidence is built from carries the `message_start`
  // usage SNAPSHOT — which already knows the final input and cache counters,
  // and only an interim output count. The final output_tokens exist on this
  // frame and nowhere else the daemon can see. On one measured live turn the
  // per-response sum was 563 against the result's 4407; the input side
  // reconciled exactly, because input is settled at message_start.
  //
  // WHY THE FULL OBJECT. The narrow `usage` above cannot carry
  // output_tokens_details (where thinking tokens are reported) or iterations,
  // so a token-utilization record built from it would be durably unfaithful to
  // what the vendor said. The evidence is relayed whole rather than projected:
  // narrowing it was the defect, not the fix.
  ApiUsage vendor_usage = 3;

  // The Anthropic message id this delta's usage belongs to.
  //
  // The vendor's own message_delta frame is ANONYMOUS — the identity arrives
  // once, on the message_start that opened the message — so a producer relaying
  // a usage correction must name what it corrects. Keyed exactly as
  // ContentDelta and MessageLatency key their own per-message facts, never the
  // envelope uuid. Empty on any row written before this field existed, which is
  // an uncorrectable record rather than a correction of an unnamed one.
  string api_message_id = 4;
}

message MessageStopEvent {}

// --- system: other typed subtypes -------------------------------------------

enum CompactTrigger {
  COMPACT_TRIGGER_UNSPECIFIED = 0;
  COMPACT_TRIGGER_MANUAL = 1;
  COMPACT_TRIGGER_AUTO = 2;
}

// [sdk coreTypes.d.ts:507-516] compact_boundary (stream variant, snake_case).
// [sdk 0.3.220] the stream type CAUGHT UP to the disk twin: post_tokens,
// duration_ms, preserved_segment and preserved_messages are all typed now, so
// compaction is a measurable operation here and not just a marker. The
// preserved_* messages are DiskCompactMetadata's (transcript.proto) — one
// model, since both planes describe the same compaction.
message CompactBoundary {
  CompactTrigger trigger = 1;
  int64 pre_tokens = 2;
  string uuid = 3;
  string session_id = 4;
  int64 post_tokens = 5;
  int64 duration_ms = 6;
  PreservedSegment preserved_segment = 7;
  PreservedMessages preserved_messages = 8;
}

// [sdk 0.3.220 SDKStatusMessage] subtype "status".
message StatusMessage {
  // SDKStatus: "compacting" | "requesting" | null. "" = null. ("requesting"
  // was corpus-observed before the typings named it.)
  string status = 1;
  string uuid = 2;
  string session_id = 3;
  // "default"|"acceptEdits"|"bypassPermissions"|"plan"|"dontAsk"|"auto".
  string permission_mode = 4;
  // Turns compaction from an in-progress marker into an outcome:
  // "success" | "failed", with the reason when it failed.
  string compact_result = 5;
  string compact_error = 6;
}

// [sdk coreTypes.d.ts:525-535] subtype "hook_response" + [observed] extras.
message HookResponse {
  string hook_name = 1;
  string hook_event = 2;
  string stdout = 3;
  string stderr = 4;
  int32 exit_code = 5;
  bool exit_code_set = 6;
  // Fields 7-9 were [observed] against 0.1.77 and are REQUIRED in 0.3.220.
  string hook_id = 7;
  string output = 8;
  // Closed vocabulary: "success" | "error" | "cancelled". "cancelled" is
  // NEVER an error — the hook was called off, it did not fail.
  string outcome = 9;
  string uuid = 10;
  string session_id = 11;
}

// [sdk 0.3.220 SDKToolProgressMessage].
message ToolProgress {
  string tool_use_id = 1;
  string tool_name = 2;
  string parent_tool_use_id = 3;
  double elapsed_time_seconds = 4;
  string uuid = 5;
  string session_id = 6;
  string task_id = 7;
  // TRUE = a liveness ping, not progress. A spinner must not advance on it.
  bool heartbeat = 8;
  string subagent_type = 9;
  SubagentRetry subagent_retry = 10;
}

// [sdk 0.3.220] a subagent's retry/backoff state, so a stalled task reads as
// "retrying" rather than "hung".
message SubagentRetry {
  string agent_id = 1;
  int32 attempt = 2;
  int32 max_retries = 3;
  int64 retry_delay_ms = 4;
  int64 error_status = 5;   // number|null; 0 = null
  bool error_status_set = 6;
  string error_category = 7;
}

// [sdk coreTypes.d.ts:545-552].
message AuthStatus {
  bool is_authenticating = 1;
  repeated string output = 2;
  string error = 3;
  string uuid = 4;
  string session_id = 5;
}

// --- observed-only stream families ------------------------------------------

// [sdk 0.3.220 SDKRateLimitInfo] type:"rate_limit_event". The base seven
// fields were [observed] against 0.1.77 and are typed now; the overage/credit
// half was entirely unmodeled, which is exactly the half that tells a user
// they are blocked and what they could do about it.
message RateLimitInfo {
  // "allowed" | "allowed_warning" | "rejected".
  string status = 1;
  int64 resets_at = 2;         // epoch seconds
  // "five_hour" | "seven_day" | "seven_day_opus" | "seven_day_sonnet" |
  // "seven_day_overage_included" | "overage".
  string rate_limit_type = 3;
  double utilization = 4;
  bool is_using_overage = 5;
  bool overage_in_use = 6;
  double surpassed_threshold = 7;
  // Same vocabulary as `status`, for the overage allowance specifically.
  string overage_status = 8;
  int64 overage_resets_at = 9;
  // 13-value vocabulary, e.g. "out_of_credits", "org_level_disabled",
  // "member_zero_credit_limit", "fetch_error".
  string overage_disabled_reason = 10;
  string error_code = 11;      // "credits_required"
  bool can_user_purchase_credits = 12;
  bool has_chargeable_saved_payment_method = 13;
}

message RateLimitEvent {
  RateLimitInfo rate_limit_info = 1;
  string uuid = 2;
  string session_id = 3;
}

// [observed] system/hook_started.
message HookStarted {
  string hook_id = 1;
  string hook_name = 2;   // e.g. "SessionStart:startup"
  string hook_event = 3;
  string uuid = 4;
  string session_id = 5;
}

// [observed] system/thinking_tokens.
message ThinkingTokens {
  int64 estimated_tokens = 1;
  int64 estimated_tokens_delta = 2;
  string uuid = 3;
  string session_id = 4;
}

// [observed] system/notification.
message SystemNotification {
  string key = 1;       // e.g. "stop-hook-error"
  string text = 2;
  string priority = 3;  // e.g. "immediate"
  string uuid = 4;
  string session_id = 5;
}

// [sdk 0.3.220 SDKTaskStartedMessage] system/task_started. task_type is
// "local_bash" | "local_agent" | "local_workflow" — 0.3.220 announces
// workflows HERE, not only via tool results as 0.1.77 did.
message TaskStartedMsg {
  string task_id = 1;
  string tool_use_id = 2;
  string description = 3;
  string task_type = 4;
  string subagent_type = 5;  // agent tasks only
  string prompt = 6;         // agent tasks only
  string uuid = 7;
  string session_id = 8;
  // meta.name of the workflow script (e.g. "spec"); local_workflow only.
  string workflow_name = 9;
  // Ambient/housekeeping work. A consumer should HIDE it from the inline
  // transcript rather than render it as a task the user started.
  bool skip_transcript = 10;
}

// [sdk 0.3.220 SDKTaskUpdatedMessage.patch] system/task_updated.
message TaskPatch {
  // "pending" | "running" | "completed" | "failed" | "killed" | "paused".
  // NOTE the first two and the last are NON-terminal: a patch is not
  // automatically a task ending.
  string status = 1;
  int64 end_time = 2;   // epoch millis
  string description = 3;
  int64 total_paused_ms = 4;
  string error = 5;
  bool is_backgrounded = 6;
}

message TaskUpdatedMsg {
  string task_id = 1;
  TaskPatch patch = 2;
  string uuid = 3;
  string session_id = 4;
}

// [observed] system/task_notification — the authoritative detached-task
// completion signal, which exists ONLY in the stream (never persisted by the
// harness; the store round-trip is what makes it durable).
message TaskUsage {
  int64 total_tokens = 1;
  int64 tool_uses = 2;
  int64 duration_ms = 3;
}

message TaskNotificationMsg {
  string task_id = 1;
  string tool_use_id = 2;
  string status = 3;       // "completed" | "failed" | "stopped"
  string output_file = 4;
  string summary = 5;
  TaskUsage usage = 6;     // agent tasks only
  string uuid = 7;
  string session_id = 8;
  // Ambient/housekeeping work; hide from the inline transcript.
  bool skip_transcript = 9;
}

// [observed] system/background_tasks_changed — full current list each time.
message BackgroundTaskRef {
  string task_id = 1;
  string task_type = 2;
  string description = 3;
}

message BackgroundTasksChanged {
  repeated BackgroundTaskRef tasks = 1;
  string uuid = 2;
  string session_id = 3;
}

// --- control-channel wire types ----------------------------------------------

// [sdk controlTypes.d.ts:86-114] Payloads kept as Struct: the control channel
// is shim-internal plumbing; total fidelity here is shape-level.
message ControlRequest {
  string request_id = 1;
  google.protobuf.Struct request = 2;
}

// [sdk 0.3.220 SDKControlResponse] STRUCTURAL NOTE — the wire is
//
//   {type:"control_response", response:{subtype, request_id, ...}}
//
// There is NO top-level `request_id` sibling. The id lives INSIDE `response`,
// beside the subtype that says whether the request succeeded. Verified against
// the shipped sdk.mjs, which constructs exactly two shapes (success/error).
// A converter reading a top-level `request_id` therefore always got "" and
// correlation was impossible.
//
// Field 1 is KEPT and now filled by LIFTING response.request_id, so every
// existing reader that correlates on it starts working rather than breaking.
// Field 2 is kept as the verbatim capture; `body` is the same object TYPED.
message ControlResponse {
  // Lifted from response.request_id (there is no top-level key to read).
  string request_id = 1;
  // The nested response object, verbatim.
  google.protobuf.Struct response = 2;
  // The nested response object, typed.
  ControlResponseBody body = 3;
}

// The nested body of a control_response, both arms folded (`subtype`
// discriminates; `response` is success-only and `error` is error-only).
message ControlResponseBody {
  string subtype = 1;   // "success" | "error"
  string request_id = 2;
  google.protobuf.Struct response = 3;  // success only
  string error = 4;                     // error only
  // Requests still awaiting an answer, echoed on BOTH arms so a reconnecting
  // client learns what it is still blocking.
  repeated google.protobuf.Struct pending_permission_requests = 5;
  repeated google.protobuf.Struct pending_user_dialog_requests = 6;
}

message ControlCancelRequest {
  string request_id = 1;
}

message KeepAlive {}

// ---------------------------------------------------------------------------
// SDK 0.3.220 families (absent from the 0.1.77 typings these protos were
// first grounded in). Grounded in `package/sdk.d.ts` of 0.3.220.
// ---------------------------------------------------------------------------
//
// PERSISTENCE CLASSIFICATION (normative, applies to EVERY message below).
//
// All of these are PERSISTENT. EPHEMERAL is not "transient telemetry" — it
// is a narrow contract defined in core.proto and implemented in the shim's
// delta bypass: an EPHEMERAL event bypasses the store, is never replayed,
// and is reconciled by REPLACING it with the store-delivered FINAL form of
// the same thing (a ContentDelta is replaced by its finished message; a
// HeartbeatProgress by the tool's result). The test for EPHEMERAL is
// therefore "does a durable final form of this same fact arrive later?"
//
// For every family below the answer is no, so marking any of them EPHEMERAL
// would not make it transient — it would make it LOST on reconnect, with
// nothing to restore it. Two were genuinely arguable and are recorded here
// as considered-and-rejected:
//
//   - `task_progress` — the live subagent ticker, and the closest thing to a
//     heartbeat here. Rejected because HeartbeatProgress is superseded by the
//     tool result that follows it, whereas a subagent's cumulative usage
//     figures have no successor: dropping them on reconnect would silently
//     empty a progress surface mid-run. This is the one classification a
//     future reader is most likely to want to revisit.
//   - `control_request_progress` — per-request retry chatter. Rejected for
//     the same reason, plus it is the only durable record that a request was
//     retried at all, which is exactly what a post-hoc latency question asks.

// [sdk 0.3.220] system/api_retry — a retryable API failure about to be
// retried. error_status is null for connection errors with no HTTP response.
message ApiRetry {
  int32 attempt = 1;
  int32 max_retries = 2;
  int64 retry_delay_ms = 3;
  int64 error_status = 4;      // 0 = null; see error_status_set
  bool error_status_set = 5;   // false = the null (connection-error) case
  AssistantMessageError error = 6;
  string uuid = 7;
  string session_id = 8;
}

// [sdk 0.3.220] system/control_request_progress — progress on an in-flight
// control request. The optional numeric fields are present only for the
// `api_retry` status, so each carries a *_set companion.
message ControlRequestProgress {
  string request_id = 1;
  string status = 2;  // "started" | "api_retry"
  int32 attempt = 3;
  bool attempt_set = 4;
  int32 max_retries = 5;
  bool max_retries_set = 6;
  int64 retry_delay_ms = 7;
  bool retry_delay_ms_set = 8;
  int64 error_status = 9;
  bool error_status_set = 10;
  string uuid = 11;
  string session_id = 12;
}

// [sdk 0.3.220] system/model_refusal_fallback — the stream twin of the disk
// ModelRefusalFallbackLine. Richer than the disk form: it also names the
// messages retracted by the fallback.
message ModelRefusalFallback {
  string trigger = 1;    // "refusal"
  string direction = 2;  // "retry" | "revert" | "sticky"
  string original_model = 3;
  string fallback_model = 4;
  string request_id = 5;              // nullable: "" = null
  string api_refusal_category = 6;    // nullable
  string api_refusal_explanation = 7; // nullable
  repeated string retracted_message_uuids = 8;
  string refused_user_message_uuid = 9;  // nullable
  string content = 10;
  string uuid = 11;
  string session_id = 12;
}

// [sdk 0.3.220] system/model_refusal_no_fallback — a refusal with no model to
// fall back to, so it surfaces rather than retrying.
message ModelRefusalNoFallback {
  string original_model = 1;
  string request_id = 2;              // nullable: "" = null
  string api_refusal_category = 3;    // nullable
  string api_refusal_explanation = 4; // nullable
  string refused_user_message_uuid = 5;  // nullable
  string content = 6;
  string uuid = 7;
  string session_id = 8;
}

// [sdk 0.3.220] system/local_command_output — stdout of a local (slash)
// command, the stream twin of the disk LocalCommandLine.
message LocalCommandOutput {
  string content = 1;
  string uuid = 2;
  string session_id = 3;
}

// [sdk 0.3.220] system/hook_progress — mid-execution output from a running
// hook. Distinct from HookResponse, which reports a FINISHED hook: this is
// the same hook_id reporting while it still runs.
message HookProgress {
  string hook_id = 1;
  string hook_name = 2;
  string hook_event = 3;
  string stdout = 4;
  string stderr = 5;
  string output = 6;
  string uuid = 7;
  string session_id = 8;
}

// [sdk 0.3.220] system/plugin_install — plugin installation lifecycle.
message PluginInstall {
  string status = 1;  // "started" | "installed" | "failed" | "completed"
  string name = 2;
  string error = 3;
  string uuid = 4;
  string session_id = 5;
}

// [sdk 0.3.220] system/task_progress — live in-flight subagent telemetry:
// cumulative usage plus the tool it is currently in. `summary` is populated
// only when the `agentProgressSummaries` option is on (the CLI forks the
// subagent every ~30s to author one).
message TaskProgressUsage {
  int64 total_tokens = 1;
  int64 tool_uses = 2;
  int64 duration_ms = 3;
}

message TaskProgressMsg {
  string task_id = 1;
  string tool_use_id = 2;
  string description = 3;
  string subagent_type = 4;
  TaskProgressUsage usage = 5;
  string last_tool_name = 6;
  string summary = 7;
  string uuid = 8;
  string session_id = 9;
}

// [sdk 0.3.220] system/session_state_changed — the explicit idle/busy/blocked
// signal. `requires_action` is precisely "waiting on the user".
message SessionStateChanged {
  string state = 1;  // "idle" | "running" | "requires_action"
  string uuid = 2;
  string session_id = 3;
}

// [sdk 0.3.220] system/worker_shutting_down — opt-in graceful teardown
// notice. Its ABSENCE is explicitly NOT a dead-host signal (handoffs,
// respawns and hard kills all emit nothing), and because it lands in the
// durable event stream a resumed session can replay a historical one, so
// consumers must treat it as a live-tail hint rather than a session fact.
message WorkerShuttingDown {
  string reason = 1;  // snake_case, e.g. "host_exit"
  string uuid = 2;
  string session_id = 3;
}

// [sdk 0.3.220] system/commands_changed — the full slash-command list after a
// mid-session change. Consumers REPLACE their cached list with this payload;
// it is not a delta.
message SlashCommandRef {
  string name = 1;
  string description = 2;
  string argument_hint = 3;
  repeated string aliases = 4;  // [sdk 0.3.220] e.g. /cost -> /usage
}

message CommandsChanged {
  repeated SlashCommandRef commands = 1;
  string uuid = 2;
  string session_id = 3;
}

// [sdk 0.3.220] system/files_persisted — outcome of persisting attached
// files, reporting successes and failures separately.
message PersistedFile {
  string filename = 1;
  string file_id = 2;
}

message FailedFile {
  string filename = 1;
  string error = 2;
}

message FilesPersisted {
  repeated PersistedFile files = 1;
  repeated FailedFile failed = 2;
  string processed_at = 3;  // ISO-8601
  string uuid = 4;
  string session_id = 5;
}

// [sdk 0.3.220] system/memory_recall — memories surfaced into the context.
// `content` is absent for file-backed `select` entries (the renderer
// lazy-loads from `path`) and always present for `synthesize` mode and
// `organization` scope, neither of which has an on-disk path.
message RecalledMemory {
  string path = 1;   // abs path, "<synthesis:DIR>" sentinel, or an https URL
  string scope = 2;  // "personal" | "team" | "organization"
  string content = 3;
  bool content_set = 4;
}

message MemoryRecall {
  string mode = 1;  // "select" | "synthesize"
  repeated RecalledMemory memories = 2;
  string uuid = 3;
  string session_id = 4;
}

// [sdk 0.3.220] system/elicitation_complete — an MCP elicitation finished.
message ElicitationComplete {
  string mcp_server_name = 1;
  string elicitation_id = 2;
  string uuid = 3;
  string session_id = 4;
}

// [sdk 0.3.220] system/permission_denied — a tool call refused. Distinct from
// ResultMessage.permission_denials, which is the end-of-turn TALLY: this is
// the live per-denial event, and carries the reason the tally does not.
message PermissionDenied {
  string tool_name = 1;
  string tool_use_id = 2;
  string agent_id = 3;
  string decision_reason_type = 4;
  string decision_reason = 5;
  string message = 6;
  string uuid = 7;
  string session_id = 8;
}

// [sdk 0.3.220] system/mirror_error — transcript mirroring failed for one
// session key.
message MirrorKey {
  string project_key = 1;
  string session_id = 2;
  string subpath = 3;
}

message MirrorError {
  string error = 1;
  MirrorKey key = 2;
  string uuid = 3;
  string session_id = 4;
}

// [sdk 0.3.220] system/informational — host-directed notice. `level` drives
// prominence ("info" is transcript-only); `prevent_continuation` marks a
// notice the agent must not simply continue past.
message Informational {
  string content = 1;
  string level = 2;  // "info" | "notice" | "suggestion" | "warning"
  string tool_use_id = 3;  // dedupes notices for the same tool use
  bool prevent_continuation = 4;
  string uuid = 5;
  string session_id = 6;
}

// [sdk 0.3.220] tool_use_summary — a natural-language summary standing in for
// a run of tool calls, naming the calls it covers.
message ToolUseSummary {
  string summary = 1;
  repeated string preceding_tool_use_ids = 2;
  string uuid = 3;
  string session_id = 4;
}

// [sdk 0.3.220] prompt_suggestion — a suggested next prompt for the user.
message PromptSuggestion {
  string suggestion = 1;
  string uuid = 2;
  string session_id = 3;
}

// [sdk 0.3.220] conversation_reset — the conversation was reset and continues
// under a NEW id. Consumers keyed by conversation id must re-key here.
message ConversationReset {
  string new_conversation_id = 1;
  string uuid = 2;
  string session_id = 3;
}

// [sdk 0.3.220] active_goal — the standing goal condition the loop is working
// toward, or its clearing. NOTE: this type is NOT a member of the SDK's
// `SDKMessage` union, but the SDK explicitly forwards it to the query()
// iterator, so it reaches this converter and needs an arm like any other.
//
// `value` is nullable on the wire and the null IS the signal (the goal was
// cleared), so `value_set` distinguishes "no goal" from "a goal with zero
// iterations" — a distinction a bare zero value would destroy.
message ActiveGoalValue {
  string condition = 1;
  int64 iterations = 2;
  int64 set_at = 3;
  int64 tokens_at_start = 4;
  string last_reason = 5;
}

message ActiveGoal {
  ActiveGoalValue value = 1;
  bool value_set = 2;
  string uuid = 3;
  string session_id = 4;
}
