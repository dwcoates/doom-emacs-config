// agentshim.data.v1 tools — content blocks, tool inputs, and per-tool
// result shapes, grounded in sdk-tools.d.ts (v0.3.220) and the on-disk
// toolUseResult census. Total fidelity: every shape found in the
// investigation is typed here.
//
// "Nothing is folded into a generic passthrough" USED to be the rule and is
// now qualified: ContentBlock carries an `unknown` arm (unknown.proto) for a
// block type no arm models. That is not a retreat from typing — every type we
// can ground is still typed — it is the fix for the one place the never-drop
// contract was violated, where the converter's only option was to SKIP an
// unrecognized block and lose it from the message body entirely.
//
// UNIVERSAL CAVEAT (verified): every tool's toolUseResult can be a plain
// string on error/rejection ("Error: …", "User rejected tool use",
// "InputValidationError: […]"). ToolUseResult models that as the raw_string
// arm — converters MUST route non-object results there, never error on them.

syntax = "proto3";

package agentshim.data.v1;

import "google/protobuf/struct.proto";
import "agentshim/data/v1/unknown.proto";

option go_package = "agentrepl/proto/agentshim/data/v1;datav1";

// ---------------------------------------------------------------------------
// Enums
// ---------------------------------------------------------------------------

// The complete raw detached-task status vocabulary (census C4).
enum RawTaskStatus {
  RAW_TASK_STATUS_UNSPECIFIED = 0;
  RAW_TASK_STATUS_ASYNC_LAUNCHED = 1;  // Agent/Workflow launch results
  RAW_TASK_STATUS_RUNNING = 2;         // TaskOutput task.status while alive
  RAW_TASK_STATUS_COMPLETED = 3;
  RAW_TASK_STATUS_FAILED = 4;
  RAW_TASK_STATUS_KILLED = 5;          // task record after stop
  RAW_TASK_STATUS_STOPPED = 6;         // task_notification after TaskStop
}

// TaskOutput retrieval_status.
enum RetrievalStatus {
  RETRIEVAL_STATUS_UNSPECIFIED = 0;
  RETRIEVAL_STATUS_SUCCESS = 1;
  RETRIEVAL_STATUS_TIMEOUT = 2;
  RETRIEVAL_STATUS_NOT_READY = 3;
}

// ---------------------------------------------------------------------------
// Content blocks (census C2)
// ---------------------------------------------------------------------------

message ContentBlock {
  oneof block {
    TextBlock text = 1;
    ThinkingBlock thinking = 2;
    ToolUseBlock tool_use = 3;
    ToolResultBlock tool_result = 4;
    ImageBlock image = 5;
    ToolReferenceBlock tool_reference = 6;
    FallbackBlock fallback = 7;  // [corpus] model-fallback marker block
    // Anthropic API block types the harness handles that never appeared on
    // local disk (0 occurrences each), so these are type-level gaps rather
    // than observed ones. The server-tool path IS live in this environment
    // though — usage.server_tool_use.web_fetch_requests is populated on
    // 103,749 disk lines — so the blocks below are reachable, not theoretical.
    RedactedThinkingBlock redacted_thinking = 8;
    ServerToolUseBlock server_tool_use = 9;
    McpToolUseBlock mcp_tool_use = 10;
    McpToolResultBlock mcp_tool_result = 11;
    WebSearchToolResultBlock web_search_tool_result = 12;
    WebFetchToolResultBlock web_fetch_tool_result = 13;
    CodeExecutionToolResultBlock code_execution_tool_result = 14;
    SearchResultBlock search_result = 15;
    ContainerUploadBlock container_upload = 16;
    // PASSTHROUGH (unknown.proto): a block `type` no arm above models.
    // Before this arm existed the converter's only option was to SKIP such a
    // block, which dropped it from the message body outright — the one place
    // the never-drop contract was actually being violated.
    UnknownRecord unknown = 17;
  }
}

// Anthropic API block type "redacted_thinking" — a thinking block the API
// withheld, carrying an opaque encrypted blob in place of the text. `data` is
// modeled as bytes, not string: it is not human-readable and must survive a
// round trip byte-for-byte so it can be replayed back to the API.
message RedactedThinkingBlock {
  bytes data = 1;
}

// Block type "server_tool_use" — a tool the SERVER ran (web search, web
// fetch, code execution) rather than the client. The harness classifies it as
// a tool-use sibling (`type==="tool_use"||"server_tool_use"||"mcp_tool_use"`),
// so it mirrors ToolUseBlock's shape.
message ServerToolUseBlock {
  string id = 1;
  string name = 2;  // e.g. "web_search", "web_fetch", "code_execution"
  google.protobuf.Struct input = 3;
}

// Block type "mcp_tool_use" — a tool call routed to an MCP server. Carries
// the server name alongside the tool name, which is what distinguishes it
// from an ordinary ToolUseBlock.
message McpToolUseBlock {
  string id = 1;
  string name = 2;
  string server_name = 3;
  google.protobuf.Struct input = 4;
}

// Block type "mcp_tool_result" — the result of an MCP tool call. `content` is
// a heterogeneous array (text blocks, images, resources), so it is a
// ListValue rather than a typed list: MCP servers define their own payloads
// and a typed model here would be a guess about third-party shapes.
message McpToolResultBlock {
  string tool_use_id = 1;
  bool is_error = 2;
  bool is_error_set = 3;
  google.protobuf.ListValue content = 4;
}

// Block type "web_search_tool_result". `content` is EITHER a result array OR
// an error object ({error_code}), which is a genuine union on the wire and is
// modeled as one — collapsing them would make an error indistinguishable from
// an empty result set.
message WebSearchToolResultBlock {
  string tool_use_id = 1;
  oneof content {
    google.protobuf.ListValue results = 2;
    ToolResultErrorCode error = 3;
  }
}

message ToolResultErrorCode {
  string error_code = 1;
}

// Block type "web_fetch_tool_result" — same result-or-error union as
// web_search_tool_result.
message WebFetchToolResultBlock {
  string tool_use_id = 1;
  oneof content {
    google.protobuf.ListValue results = 2;
    ToolResultErrorCode error = 3;
  }
}

// Block type "code_execution_tool_result" — same result-or-error union.
message CodeExecutionToolResultBlock {
  string tool_use_id = 1;
  oneof content {
    google.protobuf.ListValue results = 2;
    ToolResultErrorCode error = 3;
  }
}

// Block type "search_result" — a single citable search hit injected into the
// context, with the source it came from.
message SearchResultBlock {
  string source = 1;
  string title = 2;
  google.protobuf.ListValue content = 3;
  google.protobuf.Struct citations = 4;
}

// Block type "container_upload" — a file handed to the code-execution
// container, referenced by the id the container assigned it.
message ContainerUploadBlock {
  string file_id = 1;
}

// [corpus] content block type:"fallback" — records a mid-message model
// fallback (e.g. safeguards refusal → retry on another model).
message FallbackModelRef {
  string model = 1;
}

message FallbackBlock {
  FallbackModelRef from = 1;
  FallbackModelRef to = 2;
}

message TextBlock {
  string text = 1;
}

// signature may be "" mid-stream.
message ThinkingBlock {
  string thinking = 1;
  string signature = 2;
}

// caller: {type:"direct"} is a transcript-writer extra on 100% of disk
// tool_use blocks (not in API typings) — modeled, per total fidelity.
message Caller {
  string type = 1;
}

message ToolUseBlock {
  string id = 1;
  string name = 2;
  google.protobuf.Struct input = 3;  // typed twins in ToolInput below
  Caller caller = 4;
}

// content union: string (98% of disk occurrences) | blocks.
message ToolResultBlock {
  string tool_use_id = 1;
  oneof content {
    string content_string = 2;
    ToolResultBlockList content_blocks = 3;
  }
  bool is_error = 4;
  bool is_error_set = 5;
}

message ToolResultBlockList {
  repeated ContentBlock blocks = 1;
}

message ImageSource {
  string type = 1;        // "base64"
  string media_type = 2;
  bytes data = 3;
}

message ImageBlock {
  ImageSource source = 1;
}

// [corpus] a tool_result nesting a reference to another tool, 270
// occurrences on disk. The shape is trivially typeable, so it is typed;
// `reference` stays as the verbatim capture so nothing an untyped key carries
// is lost.
message ToolReferenceBlock {
  google.protobuf.Struct reference = 1;  // the block verbatim, incl. `type`
  string tool_name = 2;                  // disk key `tool_name`
}

// ---------------------------------------------------------------------------
// API messages (shared by stream + transcript planes)
// ---------------------------------------------------------------------------

// {role:"user", content: string | Block[]} — both forms common on disk.
message ApiUserMessage {
  oneof content {
    string content_string = 1;
    ApiContentBlocks content_blocks = 2;
  }
}

message ApiContentBlocks {
  repeated ContentBlock blocks = 1;
}

// The assistant API message envelope. stop_details/diagnostics/
// context_management are version-dependent (absent on old CC lines).
message ApiAssistantMessage {
  string id = 1;
  string model = 2;
  repeated ContentBlock content = 3;
  string stop_reason = 4;   // nullable: "" = null
  string stop_sequence = 5; // nullable: "" = null
  google.protobuf.Struct stop_details = 6;
  ApiUsage usage = 7;
  google.protobuf.Struct diagnostics = 8;
  google.protobuf.Struct context_management = 9;
  google.protobuf.Struct container = 10;
}

// The per-message API usage object (distinct from stream.proto Usage in that
// disk lines carry the raw API shape; kept Struct-free and explicit).
message ApiUsage {
  int64 input_tokens = 1;
  int64 output_tokens = 2;
  int64 cache_read_input_tokens = 3;
  int64 cache_creation_input_tokens = 4;
  google.protobuf.Struct cache_creation = 5;
  google.protobuf.Struct server_tool_use = 6;
  string service_tier = 7;
  // [corpus] observed on newer CC versions:
  google.protobuf.ListValue iterations = 8;  // per-model iteration breakdown
  string speed = 9;                          // e.g. "standard"
  string inference_geo = 10;                 // e.g. "global"
}

// ---------------------------------------------------------------------------
// toolUseResult (census C3) — string-or-object at the top, typed per tool
// ---------------------------------------------------------------------------

message ToolUseResult {
  oneof result {
    // Error/rejection strings (universal caveat above).
    string raw_string = 1;
    BashResult bash = 2;
    AgentResult agent = 3;
    AgentAsyncLaunch agent_async_launch = 4;
    TaskOutputResult task_output = 5;
    TaskStopResult task_stop = 6;
    WorkflowLaunchResult workflow_launch = 7;
    MonitorResult monitor = 8;
    ReadResult read = 9;
    EditResult edit = 10;
    WriteResult write = 11;
    SkillResult skill = 12;
    ToolSearchResult tool_search = 13;
    TaskCreateResult task_create = 14;
    TaskUpdateResult task_update = 15;
    TaskListResult task_list = 16;
    SendMessageResult send_message = 17;
    WebFetchResult web_fetch = 18;
    WebSearchResult web_search = 19;
    AskUserQuestionResult ask_user_question = 20;
    ScheduleWakeupResult schedule_wakeup = 21;
    // Previously unclassified despite being routinely used on disk.
    StructuredOutputResult structured_output = 22;
    GlobResult glob = 23;
    GrepResult grep = 24;
    ArtifactResult artifact = 25;
    TaskGetResult task_get = 26;
    // A result object whose tool could not be identified: preserved verbatim
    // and loud-logged (this is capture, not classification — an unknown
    // object NEVER silently becomes a known type).
    google.protobuf.Struct unclassified = 30;
  }
}

// Bash sync + background-launch fold. A background launch is the same base
// with empty stdout/stderr + background_task_id set.
message BashResult {
  string stdout = 1;
  string stderr = 2;
  bool interrupted = 3;
  bool is_image = 4;
  bool no_output_expected = 5;
  // Optionals (census):
  string return_code_interpretation = 6;
  string git_operation = 7;
  string persisted_output_path = 8;
  int64 persisted_output_size = 9;
  int64 timed_out_after_ms = 10;
  string stale_read_file_state_hint = 11;
  string background_task_id = 12;  // set = background launch
  string background_cwd_hint = 13;
}

message AgentToolStats {
  int64 read_count = 1;
  int64 search_count = 2;
  int64 bash_count = 3;
  int64 edit_file_count = 4;
  int64 lines_added = 5;
  int64 lines_removed = 6;
  int64 other_tool_count = 7;
}

// Agent/Task synchronous completion.
message AgentResult {
  RawTaskStatus status = 1;
  string prompt = 2;
  string agent_id = 3;
  string agent_type = 4;
  repeated ContentBlock content = 5;  // final message blocks
  string resolved_model = 6;          // optional
  int64 total_duration_ms = 7;
  int64 total_tokens = 8;
  int64 total_tool_use_count = 9;
  ApiUsage usage = 10;
  AgentToolStats tool_stats = 11;     // optional
}

// Agent/Task background launch (run_in_background).
message AgentAsyncLaunch {
  bool is_async = 1;              // always true
  RawTaskStatus status = 2;       // async_launched
  string agent_id = 3;
  string description = 4;
  string resolved_model = 5;
  string prompt = 6;
  string output_file = 7;
  bool can_read_output_file = 8;
}

message LocalBashTask {
  string task_id = 1;
  string task_type = 2;  // "local_bash"
  RawTaskStatus status = 3;
  string description = 4;
  string output = 5;
  int32 exit_code = 6;
  bool exit_code_set = 7;  // exitCode: number|null
}

message LocalAgentTask {
  string task_id = 1;
  string task_type = 2;  // "local_agent"
  RawTaskStatus status = 3;
  string description = 4;
  string output = 5;
  string prompt = 6;
  string result = 7;
  bool is_raw_transcript = 8;      // absent while running
  bool is_raw_transcript_set = 9;
}

message TaskOutputResult {
  RetrievalStatus retrieval_status = 1;
  oneof task {
    LocalBashTask local_bash = 2;
    LocalAgentTask local_agent = 3;
  }
}

message TaskStopResult {
  string message = 1;  // "Successfully stopped task: <id> (<cmd>)"
  string task_id = 2;
  string task_type = 3;
  string command = 4;
}

message WorkflowLaunchResult {
  RawTaskStatus status = 1;   // async_launched (only value observed)
  string task_id = 2;
  string task_type = 3;       // "local_workflow"
  string workflow_name = 4;
  string run_id = 5;          // "wf_…" (differs from task_id)
  string summary = 6;
  string transcript_dir = 7;  // journal at transcript_dir + "/journal.jsonl"
  string script_path = 8;
}

message MonitorResult {
  string task_id = 1;
  int64 timeout_ms = 2;
  bool persistent = 3;
}

message ReadResult {
  string type = 1;  // "text"
  google.protobuf.Struct file = 2;  // {filePath, content, numLines, …}
}

message EditResult {
  string file_path = 1;
  string old_string = 2;
  string new_string = 3;
  string original_file = 4;
  bool replace_all = 5;
  // Array of hunks: [{oldStart,oldLines,newStart,newLines,lines:[string]}].
  // Schemaless list (no fixed hunk message); corpus: tool-results/edit.jsonl.
  google.protobuf.ListValue structured_patch = 6;
  bool user_modified = 7;
  bool stale_recovered = 8;
  bool memdir_stamped = 9;
}

message WriteResult {
  string type = 1;
  string file_path = 2;
  string content = 3;
  string original_file = 4;
  // Same hunk-array shape as EditResult; corpus: tool-results/write.jsonl.
  google.protobuf.ListValue structured_patch = 5;
  bool user_modified = 6;
}

message SkillResult {
  string command_name = 1;
  bool success = 2;
  repeated string allowed_tools = 3;
}

message ToolSearchResult {
  repeated string matches = 1;
  string query = 2;
  int64 total_deferred_tools = 3;
}

message TaskCreateResult {
  google.protobuf.Struct task = 1;
}

// The status transition a TaskUpdate reports. Both ends are the harness's raw
// task-status vocabulary as free strings (NOT RawTaskStatus): the corpus shows
// "pending"/"in_progress", which are the TODO-list states, not the detached-task
// lifecycle RawTaskStatus enumerates. Corpus: tool-results/task_update.jsonl.
message TaskStatusChange {
  string from = 1;
  string to = 2;
}

message TaskUpdateResult {
  string task_id = 1;
  // The {from,to} transition; corpus: tool-results/task_update.jsonl.
  TaskStatusChange status_change = 2;
  bool success = 3;
  // Names of the task fields this update changed, e.g. ["status"]; corpus:
  // tool-results/task_update.jsonl.
  repeated string updated_fields = 4;
}

message TaskListResult {
  google.protobuf.ListValue tasks = 1;  // list payload verbatim
}

// The pin a SendMessage result hands back for the addressed agent: the handle
// the user refers to it by (`id`/`name`) plus the short display `ref`. Corpus:
// tool-results/send_message.jsonl.
message MessagePin {
  string id = 1;
  string name = 2;
  string ref = 3;
}

message SendMessageResult {
  string message = 1;
  // The addressed agent's pin; corpus: tool-results/send_message.jsonl.
  MessagePin pin = 2;
  bool success = 3;
  string resumed_agent_id = 4;
}

message WebFetchResult {
  int64 bytes = 1;
  int64 code = 2;
  string code_text = 3;
  int64 duration_ms = 4;
  string result = 5;
  string url = 6;
}

message WebSearchResult {
  double duration_seconds = 1;
  string query = 2;
  // HETEROGENEOUS array (per-search result objects interleaved with plain
  // summary strings); corpus: tool-results/web_search.jsonl.
  google.protobuf.ListValue results = 3;
  int64 search_count = 4;
}

message AskUserQuestionResult {
  // Same element shape as AskUserQuestionInput.questions; corpus:
  // tool-results/ask_user_question.jsonl.
  repeated Question questions = 1;
  google.protobuf.Struct answers = 2;
  google.protobuf.Struct annotations = 3;
}

message ScheduleWakeupResult {
  int64 clamped_delay_seconds = 1;
  int64 scheduled_for = 2;  // epoch millis; corpus: tool-results/schedule_wakeup.jsonl
  bool was_clamped = 3;
}

// [corpus] StructuredOutput — the payload is the caller's OWN schema, so it
// is genuinely schemaless and stays a Struct (same reasoning as McpInput).
message StructuredOutputResult {
  google.protobuf.Struct data = 1;
}

// [sdk GlobOutput].
message GlobResult {
  int64 duration_ms = 1;
  int64 num_files = 2;
  repeated string filenames = 3;
  bool truncated = 4;
  int64 total_matches = 5;
  bool count_is_complete = 6;
}

// [sdk GrepOutput].
message GrepResult {
  string mode = 1;  // "content" | "files_with_matches" | "count"
  int64 num_files = 2;
  repeated string filenames = 3;
  string content = 4;
  int64 num_lines = 5;
  int64 num_matches = 6;
  int64 total_files = 7;
  int64 total_lines = 8;
  int64 applied_limit = 9;
  int64 applied_offset = 10;
}

// [corpus] Artifact — the published page's identity.
message ArtifactResult {
  string url = 1;
  string title = 2;
  string description = 3;
  string label = 4;
  string version = 5;
}

// [sdk TaskGetOutput] — `task` is nullable, hence the _set companion.
message TaskGetResult {
  TaskRecord task = 1;
  bool task_set = 2;
}

message TaskRecord {
  string id = 1;
  string subject = 2;
  string description = 3;
  string status = 4;  // "pending" | "in_progress" | "completed"
  repeated string blocks = 5;
  repeated string blocked_by = 6;
}

// ---------------------------------------------------------------------------
// Tool inputs (sdk-tools.d.ts census C1) — typed twins of tool_use.input
// ---------------------------------------------------------------------------

message ToolInput {
  oneof input {
    AgentInput agent = 1;
    BashInput bash = 2;
    TaskOutputInput task_output = 3;
    KillShellInput kill_shell = 4;  // in typings; zero disk occurrences
    FileEditInput file_edit = 5;
    FileReadInput file_read = 6;
    FileWriteInput file_write = 7;
    GlobInput glob = 8;
    GrepInput grep = 9;
    NotebookEditInput notebook_edit = 10;
    TodoWriteInput todo_write = 11;
    WebFetchInput web_fetch = 12;
    WebSearchInput web_search = 13;
    AskUserQuestionInput ask_user_question = 14;
    ConfigInput config = 15;
    ExitPlanModeInput exit_plan_mode = 16;
    McpInput mcp = 17;
    ListMcpResourcesInput list_mcp_resources = 18;
    ReadMcpResourceInput read_mcp_resource = 19;
    // The 13 families used on disk with no typed input arm, while
    // ToolUseResult already typed most of their RESULTS. Nine come from
    // sdk-tools.d.ts; Skill / StructuredOutput / ToolSearch / SendMessage have
    // no interface there and are corpus-grounded, exactly as their result
    // twins already are.
    SkillInput skill = 20;
    TaskUpdateInput task_update = 21;
    StructuredOutputInput structured_output = 22;
    TaskCreateInput task_create = 23;
    ToolSearchInput tool_search = 24;
    SendMessageInput send_message = 25;
    MonitorInput monitor = 26;
    TaskStopInput task_stop = 27;
    ScheduleWakeupInput schedule_wakeup = 28;
    WorkflowInput workflow = 29;
    TaskListInput task_list = 31;
    TaskGetInput task_get = 32;
    ArtifactInput artifact = 33;
    google.protobuf.Struct unclassified = 30;
  }
}

// [sdk 0.3.220 AgentInput].
message AgentInput {
  string description = 1;
  string prompt = 2;
  string subagent_type = 3;
  string model = 4;   // "sonnet"|"opus"|"haiku"|"fable", optional
  // [corpus] proto-only: no 0.3.220 AgentInput field backs this.
  string resume = 5;
  bool run_in_background = 6;
  // "worktree" gives the agent its own git worktree; "remote" launches it in a
  // remote cloud environment. 35 uses on disk and previously unmodeled, which
  // hid the single most consequential thing about a spawned agent: whether it
  // shares this checkout.
  string isolation = 7;
  // Makes the agent addressable via SendMessage({to: name}) while running.
  string name = 8;
}

// [corpus] Skill — no sdk-tools.d.ts interface; grounded in disk usage.
message SkillInput {
  string skill = 1;
  string args = 2;
}

// [sdk TaskUpdateInput].
message TaskUpdateInput {
  string task_id = 1;  // wire key `taskId`
  string subject = 2;
  string description = 3;
  string active_form = 4;
  // "pending" | "in_progress" | "completed" | "deleted".
  string status = 5;
  repeated string add_blocks = 6;
  repeated string add_blocked_by = 7;
  string owner = 8;
  google.protobuf.Struct metadata = 9;
}

// [corpus] StructuredOutput — the caller's OWN schema, so schemaless by
// design and captured whole (same reasoning as McpInput).
message StructuredOutputInput {
  google.protobuf.Struct data = 1;
}

// [sdk TaskCreateInput].
message TaskCreateInput {
  string subject = 1;
  string description = 2;
  string active_form = 3;
  google.protobuf.Struct metadata = 4;
}

// [corpus] ToolSearch — no sdk-tools.d.ts interface.
message ToolSearchInput {
  string query = 1;
  int64 max_results = 2;
}

// [corpus] SendMessage — no sdk-tools.d.ts interface.
message SendMessageInput {
  string to = 1;
  string summary = 2;
  string message = 3;
  string type = 4;
  string recipient = 5;
  string content = 6;
}

// [sdk MonitorInput].
message MonitorInput {
  string description = 1;
  int64 timeout_ms = 2;
  bool persistent = 3;
  string command = 4;
  MonitorWebsocket ws = 5;
}

message MonitorWebsocket {
  string url = 1;
  repeated string protocols = 2;
}

// [sdk TaskStopInput] — one of the two ids identifies the target.
message TaskStopInput {
  string task_id = 1;
  string shell_id = 2;
}

// [sdk ScheduleWakeupInput].
message ScheduleWakeupInput {
  int64 delay_seconds = 1;
  string reason = 2;
  string prompt = 3;
  bool stop = 4;
}

// [sdk WorkflowInput].
message WorkflowInput {
  string script = 1;
  string name = 2;
  string description = 3;
  string title = 4;
  google.protobuf.Struct args = 5;
  string script_path = 6;
  string resume_from_run_id = 7;
}

// [sdk TaskListInput] — empty by design; the arm's PRESENCE is the signal.
message TaskListInput {}

// [sdk TaskGetInput].
message TaskGetInput {
  string task_id = 1;  // wire key `taskId`
}

// [sdk ArtifactInput].
message ArtifactInput {
  string action = 1;     // "publish" | "list"
  string file_path = 2;
  string favicon = 3;
  int64 limit = 4;
  string scope = 5;      // "mine" | "shared" | "all"
  string title = 6;
  string description = 7;
  string label = 8;
  string url = 9;
  bool force = 10;
}

// [sdk sdk-tools.d.ts:58-90].
message BashInput {
  string command = 1;
  int64 timeout = 2;
  string description = 3;
  bool run_in_background = 4;
  bool dangerously_disable_sandbox = 5;
}

// [sdk sdk-tools.d.ts:91-104] — all required.
message TaskOutputInput {
  string task_id = 1;
  bool block = 2;
  int64 timeout = 3;
}

// [sdk sdk-tools.d.ts:214].
message KillShellInput {
  string shell_id = 1;
}

message FileEditInput {
  string file_path = 1;
  string old_string = 2;
  string new_string = 3;
  bool replace_all = 4;
}

message FileReadInput {
  string file_path = 1;
  int64 offset = 2;
  int64 limit = 3;
  string pages = 4;
}

message FileWriteInput {
  string file_path = 1;
  string content = 2;
}

message GlobInput {
  string pattern = 1;
  string path = 2;
}

message GrepInput {
  string pattern = 1;
  string path = 2;
  string glob = 3;
  string type = 4;
  string output_mode = 5;
  bool case_insensitive = 6;  // -i
  bool line_numbers = 7;      // -n
  int64 after_context = 8;    // -A
  int64 before_context = 9;   // -B
  int64 context = 10;         // -C
  bool multiline = 11;
  int64 head_limit = 12;
  int64 offset = 13;
}

message NotebookEditInput {
  string notebook_path = 1;
  string cell_id = 2;
  string new_source = 3;
  string cell_type = 4;
  string edit_mode = 5;
}

message TodoItem {
  string content = 1;
  string status = 2;  // pending | in_progress | completed
  string active_form = 3;
}

message TodoWriteInput {
  repeated TodoItem todos = 1;
}

message WebFetchInput {
  string url = 1;
  string prompt = 2;
}

message WebSearchInput {
  string query = 1;
  repeated string allowed_domains = 2;
  repeated string blocked_domains = 3;
}

message QuestionOption {
  string label = 1;
  string description = 2;
  string preview = 3;
}

message Question {
  string question = 1;
  string header = 2;
  repeated QuestionOption options = 3;
  bool multi_select = 4;
}

message AskUserQuestionInput {
  repeated Question questions = 1;
  google.protobuf.Struct answers = 2;
  google.protobuf.Struct metadata = 3;
  google.protobuf.Struct annotations = 4;
}

message ConfigInput {
  string setting = 1;
  string value = 2;
}

message ExitPlanModeInput {
  string plan = 1;
  bool push_to_remote = 2;
}

message McpInput {
  google.protobuf.Struct input = 1;  // schema is per-MCP-tool by definition
}

message ListMcpResourcesInput {
  string server = 1;
}

message ReadMcpResourceInput {
  string server = 1;
  string uri = 2;
}
