// feed.proto — The conversation feed container: the Message envelope, its
// lineage, and the deltas that carry it.
//
// Message is feed packaging — identity, lineage, ordering, provenance and
// resolution stamps — wrapped around a payload. Agent-produced payloads are a
// single AgentEmission arm; everything the agent did not emit keeps an arm of
// its own.
//
// This file also carries every component rendered IN the feed: the agent
// emission vocabulary, the agent response, the tool card, the slash-command
// records, the failure card, the permission card, detached work, and the
// history-paging verbs.

syntax = "proto3";

package frontend.v1;

import "conversation/v1/content.proto";
import "conversation/v1/payloads.proto";
import "frontend/v1/shared.proto";
import "google/protobuf/struct.proto";

option go_package = "agentrepl/proto/frontend/v1;frontendv1";

// Complete (store-round-tripped) conversation additions, composed from the
// typed agent payloads (S9). daemon/internal/frontend/translate.go CURATES
// which payloads are pushed but never re-types them — frontends render,
// never interpret.
message ConversationDelta {
  // THERE IS NO SESSION ID ON THIS PUSH, deliberately, and there is none on any
  // push in this file. A frontend has no session vocabulary: the only question
  // it ever asks about a push is "is this still current", and `fence` answers
  // that without naming what rotated. A workspace is the whole address.
  //
  // THIS SURFACE TRAVELS AS PROTOJSON, so the FIELD NAME is the wire token, not
  // the number. Renaming a field here is a breaking wire change even when the
  // number is untouched, and a name once spent must never come back meaning
  // something else.
  string workspace = 1;
  // The conversation additions this push carries, oldest first. Each is a
  // complete feed envelope the frontend renders without further resolution.
  repeated Message messages = 2;
  uint64 through_seq = 3;  // frontends persist this for reconnect resync
  // The workspace's staleness FENCE at the moment the daemon produced this
  // push: an opaque token the client compares BYTE-WISE against the fence on
  // the workspace's current WorkspaceState, and never parses, splits or
  // interprets. Equal means current; different means stale, and a stale push
  // is discarded whole rather than partially adopted.
  //
  // The daemon mints it and is the only thing that can read meaning into it.
  // A client that learned to decode it would be depending on a fact this
  // contract does not offer, and the token's composition is free to change.
  string fence = 4;
}

// WHO drove the turn that produced a message.
//
// The merge coordinator borrows a workspace's own shim to resolve a merge
// conflict (the session holding the full context of the work is the one best
// equipped to resolve it), so a session can emit a full turn the user never
// prompted. That provenance is a durable FACT recorded on every message, not a
// rendering hint: frontends decide independently what to do with it, and the
// decision can change without another wire change.
enum ConversationSource {
  // Never set by the daemon. proto3 reserves 0 for "the field was not
  // populated", and every message the daemon builds sets one of the arms below,
  // so a receiver seeing UNSPECIFIED is looking at a malformed frame and must
  // reject it loudly rather than assume USER.
  CONVERSATION_SOURCE_UNSPECIFIED = 0;
  // An ordinary turn: the user prompted it, or it followed from one.
  CONVERSATION_SOURCE_USER = 1;
  // A turn merge.Coordinator drove under its lease (conflict resolution).
  CONVERSATION_SOURCE_MERGE = 2;
}

// The two containment facts every message carries, in one message so no
// producer can supply half of them and no consumer can read them from two
// different shapes.
//
// SPAWN IS NOT CONTAINMENT. A message whose work was started by another
// message's tool call is NOT thereby contained by it: provenance lives on
// origin_tool_use_id, and lineage lives here. Conflating them is what made
// "is a top-level bubble a top-level message" unanswerable.
message MessageLineage {
  // The feed row this message ultimately belongs to — the ancestor whose own
  // parent is the feed itself.
  //
  // ALWAYS SET, including on a top-level message, where it equals that
  // message's own id. It is never empty and never inferred: a reader that had
  // to walk parent pointers to find the root would be performing the unbounded
  // traversal this field exists to remove, and a page query would stop being a
  // single indexed pass.
  //
  // DENORMALIZED ON PURPOSE. It is derivable by walking parent_message_id to
  // its end, and storing it anyway is the entire reason a page of ten messages
  // costs one query. The cost is that it can drift: it MUST equal the root of
  // the parent chain, and a write that disagrees is CORRUPTION, not a variant.
  string top_level_message_id = 1;

  // The message immediately containing this one — ONE HOP, never the root.
  //
  // EMPTY means this message sits directly in the feed, in which case
  // top_level_message_id is this message's own id. Absence is the fact itself,
  // not a placeholder for an unknown: a message whose parent could not be
  // resolved is a producer fault, never an empty pointer.
  string parent_message_id = 2;
}

// The durable class: a store record exists for this message.
//
// EMPTY ON PURPOSE. The message's own uuid is the record's key, so there is
// nothing to carry that the envelope does not already say; a field here would
// be a second address for a row already addressable, and the two could
// disagree. The arm being SET is the entire claim.
//
// The claim it makes is checkable and must be checked: a durable message the
// store cannot produce is corruption, and reporting it as an ordinary miss is
// how a lost conversation looks like an empty one.
message MessageDurable {}

// The ephemeral class: no store record exists for this message, and none ever
// will — not because a write failed or has not landed yet, but because there
// was never anything to write.
//
// MEMBERSHIP IS DECIDED BY WHETHER CLAUDE EVER SAW THE THING, never by who
// minted the id. A slash command the daemon answers alone (`/model` and its
// siblings) never reaches the CLI, so the CLI writes nothing; a
// system/local_command record is ruled out of the durable set; a failure card
// the daemon synthesized describes a session that failed to start, so there is
// no transcript for it to live in. Conversely a daemon-MINTED id over a real
// TaskStarted is durable, because the record exists.
//
// THE LINEAGE RULES ARE THIS CLASS'S SHAPE, not advice about it. An ephemeral
// message is ALWAYS a feed row — empty parent_message_id, top_level_message_id
// equal to its own id — and it is NEVER at either end of a containment edge
// crossing the classes:
//
//   - It may not be a parent. A durable child naming an ephemeral root would
//     be unreachable by any store query, since a store record can only name
//     ids that exist in the store.
//   - It may not name a durable parent. Otherwise an ephemeral card attaches
//     itself into a paged conversation that it will simply vanish from,
//     leaving a hole where a reader has every reason to expect a message.
//
// Those are refused at construction, so a violating message cannot be built
// and then noticed; a check applied afterwards is a check something can skip.
message MessageEphemeral {}

// One curated conversation addition: FEED PACKAGING wrapped around a payload.
//
// The packaging is what the feed knows about a message regardless of what the
// message is — its identity, its lineage, its place in the order, who drove
// it, and the figures resolved against it. The payload is the message itself.
//
// Agent-produced payloads are ONE arm, AgentEmission, which is also the
// vocabulary a detached agent's output arrives in (DetachedWorkAgentUpdate).
// Everything the agent did not emit — the user's own prompt, the daemon's
// failure cards, session-level events — keeps an arm of its own, because
// folding those into AgentEmission would make that message's name untrue.
//
// Consumers reconcile by uuid.
message Message {
  // THERE IS NO PER-KIND AGENT ARM HERE, and there must never be one. Every
  // agent-produced payload — assistant text, tool use, tool results, skill
  // bodies, the turn's result — is an arm of AgentEmission and is reached
  // through `agent` below. An arm added here for one agent output kind would
  // give that kind two spellings on the wire, and make AgentEmission's name
  // untrue.
  //
  // THIS MESSAGE CARRIES NO PERSISTENCE RECORDS EITHER — no raw usage or
  // accounting blobs for a renderer to digest itself. The figures a frontend
  // shows are RESOLVED before they reach it: a response's stamp on
  // AgentResponse, a turn's verdict on FooterAccountingCell, session and
  // per-model economics on TokenBreakdownView. The feed renders; it does not
  // derive.
  //
  // As everywhere in this file, the FIELD NAME is the wire token (protojson),
  // so renaming an arm is a breaking change even at the same number.

  // ---- Feed packaging: identity, lineage, ordering, provenance, resolution ----

  string uuid = 1;
  int64 ts_ms = 2;
  string request_id = 3;  // vendor API request correlation, "" when absent
  // Provenance. ALWAYS set (see ConversationSource): persisted with the message
  // so a resync or transcript replay reproduces the same verdict instead of
  // re-deriving it from state that has since moved on.
  ConversationSource source = 4;
  // WHAT CONTAINS THIS MESSAGE. Always present — see MessageLineage, whose
  // top_level_message_id is never empty and is self-referential on a feed row.
  //
  // It sits in the PACKAGING half rather than inside any payload arm because
  // containment is a fact about the message regardless of what the message is,
  // and because a per-arm copy is a per-arm chance to disagree. It is a low
  // tag for the same reason uuid and source are: this is what the feed knows
  // before it knows what it is looking at.
  //
  // THIS IS THE ONLY PLACE LINEAGE LIVES on this contract. Records that are
  // not messages — turn and session boundaries, heartbeats, latency samples,
  // claim bridges, query lifecycle, usage observations, rewinds, file-plane
  // diagnostics — are protocol.v1.Envelope payloads and are NOT Messages,
  // so they have no field here to populate. That is deliberate and structural:
  // if such a record could carry a top_level_message_id it would become a
  // phantom feed row, and a page of ten "messages" would silently deliver
  // several turn boundaries and a short screen. Do not lift this field onto
  // Envelope, and do not model an unowned record as an empty MessageLineage.
  MessageLineage lineage = 5;

  // WHETHER A DURABLE RECORD FOR THIS MESSAGE EXISTS AT ALL. Always set: a
  // message with neither arm is malformed and is rejected loudly rather than
  // assumed durable, exactly as an UNSPECIFIED source is.
  //
  // WHY THIS IS AN ARM AND NOT A BOOLEAN. A `bool ephemeral` would let a
  // message that HAS a record claim it has none, and a message that has none
  // claim a record — two lies the type could tell. Here the class is the set
  // arm, so the two are mutually exclusive by construction and neither can be
  // half-stated. It is also why the arms carry no fields: the fact IS the
  // membership, and any field on either arm would be a second, weaker place
  // for the same claim to be made differently.
  //
  // WHY IT IS STATED AT ALL, rather than discovered by looking. Without it,
  // "no durable record exists for this message" is indistinguishable from "the
  // record was not found" — a page missing an ephemeral card looks exactly
  // like a page that LOST a durable one, and the second is data loss reported
  // as normal. Stating the class turns the absence into a property a reader
  // can check, so a durable message missing from the store stays a loud
  // failure while an ephemeral one missing from it is simply correct.
  //
  // IT IS PACKAGING, NOT PAYLOAD, and sits beside lineage for the same reason:
  // it is a fact about the message whatever the message is, and a per-arm copy
  // would be a per-arm chance to disagree. It also constrains lineage directly
  // — see MessageEphemeral — which only works while the two are siblings on
  // one envelope rather than facts held in two places.
  oneof durability {
    // A record for this message exists in the store, so it can be paged,
    // replayed and reloaded. Everything the CLI wrote a transcript record for
    // is this, INCLUDING the daemon-minted "detached-work:" ids, whose
    // durability comes from the TaskStarted behind them and not from who
    // chose the id.
    MessageDurable durable = 6;
    // No record for this message exists ANYWHERE, and none ever will.
    MessageEphemeral ephemeral = 7;
  }

  // ---- Payload ----

  oneof payload {
    // EVERYTHING the agent produced, in the one vocabulary that also carries
    // a detached agent's output (AsyncAgentUpdate). See AgentEmission.
    AgentEmission agent = 8;

    // ---- Non-agent payloads: things the agent did not emit ----

    // The user's own prompt.
    conversation.v1.UserContent user_message = 9;
    // The daemon's own card for a failure the agent never got to report.
    FailureCardView failure_card = 10;
    // A slash command the daemon took out of the user's input. Both
    // durability classes ride this arm; which one a given command is, is
    // stated by `durability` above and never inferred from the command.
    DaemonInterceptedCommandItem daemon_intercepted_command = 11;
    // A piece of detached work. THIS MESSAGE IS THE WORK — its uuid is the
    // work's id, and its lineage is the work's place in the feed.
    //
    // What rides here is the work's state as of this delivery; everything it
    // produces afterwards arrives as DetachedWorkUpdate addressed to THIS
    // message's uuid, on DetachedWorkDelta rather than as a stream of new feed
    // messages. A detached agent emitting a thousand lines must not insert a
    // thousand rows into the conversation it was dispatched from — those lines
    // are this message's payload, not messages of their own.
    DetachedWork detached_work = 12;
    // The purple-washed summary block a compaction leaves behind. Its own arm
    // so that the wash is a stated kind rather than an inference.
    CompactionSummaryItem compaction_summary = 13;
  }

  // KNOWN GAPS IN THIS PAYLOAD SET — things that ARE messages by this feed's
  // own test but have no arm above yet. Named here so their absence reads as an
  // open question rather than a decision. See the gap note in
  // DESIGN-protobuf-surfaces.md.
  //
  // - A PERMISSION REQUEST. The daemon-composed request-plus-resolution a
  //   client renders and answers is a message by this feed's test — it has a
  //   uuid, it costs a page slot, a reader scrolling back expects to see it —
  //   and nothing here carries one.
  // - A CONTEXT CUT (cleared or compacted). A reader scrolling back would
  //   notice where the conversation was cut, which makes it a message by
  //   conversation.v1's test, but no arm here names one. `compaction_summary`
  //   carries the block a compaction LEAVES BEHIND, not the cut itself.
}

// The detached-work push: MESSAGES that opened, and UPDATES to messages already
// open.
//
// TWO ARMS BECAUSE THERE ARE TWO KINDS OF THING, and conflating them is what
// made "how many messages is this" unanswerable. A message is a thing the feed
// CONTAINS — it has a uuid, lineage, a timestamp, and it costs a page slot. An
// update is a change to a message the feed already contains — it is addressed by
// that message's id, carries no identity of its own, and costs nothing. A byte
// append is the second kind, always: a shell producing a megabyte of output
// changes one message many times, it does not produce thousands of messages.
//
// It is a SEPARATE FRAME from ConversationDelta because detached work produces
// at its own rate: folding its updates into the conversation push would let one
// chatty agent pace the feed of the conversation that dispatched it.
message DetachedWorkDelta {
  string workspace = 1;
  // WHOLE MESSAGES: detached work opening for the first time, or restated in
  // full after a resync. Complete feed envelopes, identical in shape to the ones
  // ConversationDelta carries, so a frontend renders detached work with the same
  // code that renders everything else and reconciles it by the same uuid.
  //
  // A message the receiver already holds is REPLACED by this copy — the daemon
  // restating it in full, never a second message.
  //
  // Each carries payload arm `detached_work`; a message arriving here with any
  // other payload is a daemon bug and is rejected rather than rendered.
  repeated Message opened = 2;
  // UPDATES to messages already open, in order. Each names its target message by
  // id and mutates that message's payload; none of them is a message.
  repeated DetachedWorkUpdate updates = 3;
  // Frontends persist this for reconnect resync.
  uint64 through_seq = 4;
  // The workspace's staleness FENCE at the moment the daemon produced this
  // push: an opaque token the client compares BYTE-WISE against the fence on
  // the workspace's current WorkspaceState, and never parses, splits or
  // interprets. Equal means current; different means stale, and a stale push
  // is discarded whole rather than partially adopted.
  //
  // The daemon mints it and is the only thing that can read meaning into it.
  // A client that learned to decode it would be depending on a fact this
  // contract does not offer, and the token's composition is free to change.
  string fence = 5;
}

// The compaction summary: the summary the daemon records after a compaction.
message CompactionSummaryItem {
  // The summary text, verbatim (markdown).
  string summary = 1;
  // When the compaction completed, unix millis.
  int64 compacted_at_ms = 2;
  // The resolved expensive-input cost of producing this summary (canonical
  // derivation), so the summary can carry its own cost note; -1 when the
  // result's usage was unavailable (never fabricated as 0).
  int64 expensive_input_tokens = 3;
}

// Ephemeral live-typing relay (never persisted, never in snapshots).
message TypingDelta {
  // Addressed by workspace alone — no session id, for the reason stated on
  // ConversationDelta.
  string workspace = 1;
  // OPEN GAP: THIS MESSAGE CARRIES NO CONTENT. The live preview it exists to
  // relay has no frontend-side spelling — the content model lives in
  // conversation.v1 and arrives on EntryDelivery's `live` arm — so TypingDelta
  // is currently a workspace, a fence and a target, and nothing to draw. See
  // the gap note in DESIGN-protobuf-surfaces.md.
  // The workspace's staleness FENCE at the moment the daemon produced this
  // push: an opaque token the client compares BYTE-WISE against the fence on
  // the workspace's current WorkspaceState, and never parses, splits or
  // interprets. Equal means current; different means stale, and a stale push
  // is discarded whole rather than partially adopted.
  //
  // The daemon mints it and is the only thing that can read meaning into it.
  // A client that learned to decode it would be depending on a fact this
  // contract does not offer, and the token's composition is free to change.
  string fence = 2;
  // WHERE THIS PREVIEW BELONGS, and therefore WHAT WILL RETIRE IT.
  //
  // Empty — the ordinary case — means the top-level feed: the preview opens
  // there and is retired by the authoritative record of the same block
  // landing there.
  //
  // Set means the preview belongs INSIDE the named MESSAGE — detached work
  // whose payload is folding this record — and must never be opened on the
  // top-level feed, because the record it previews will never land there at
  // all. A top-level preview of it could therefore never be retired, and would
  // spin "streaming input…" with no body for the life of the page. It is
  // retired instead by that message's OWN authoritative record — the next
  // `DetachedWorkUpdate` addressed to this id.
  //
  // The daemon knows which of the two it is BEFORE the preview goes out (it
  // is the same fold decision, made in the same place), so no preview it
  // cannot retire is ever created. This is provenance, not a timeout.
  string parent_message_id = 3;
}

// The daemon's statement that a preview it opened will NEVER be completed.
//
// A preview is retired by the authoritative record of the block it previews.
// When that record can no longer arrive — the session died, the shim rolled,
// the query was torn down mid-block — nothing retires it, and the preview
// spins "streaming input…" for the life of the page with no body.
//
// A CUT IS A FACT THE DAEMON OWNS, NOT A TIMEOUT THE CLIENT GUESSES. The
// daemon learns the stream ended without its record; the client cannot
// distinguish that from a slow block, and any client-side deadline would be
// wrong for exactly the long tool calls users care most about watching.
message TypingCut {
  string workspace = 1;
  // The preview being retired, addressed exactly as the delta that opened it:
  // empty for the top-level feed, or the id of the MESSAGE whose detached work
  // it was folded into.
  string parent_message_id = 2;
  // The workspace's staleness FENCE, compared byte-wise and never parsed,
  // identically to every other push. A stale cut is discarded whole.
  string fence = 3;
}

// The /status panel, RESOLVED: the rows it draws, already labelled and already
// stringified.
//
// IT USED TO CARRY THE VENDOR'S INIT RECORD WHOLE, as a lenient JSON object the
// panel read field by field, and every value the user actually saw was computed
// client-side: the auth word from an enum name, the fast-mode word from a state
// string, plugin labels from name+version pairs, three of the rows from
// `.length` of an array, and the memory row from joining a map's values. That
// is five derivations in the renderer, which is five places the panel's answer
// can disagree with the daemon's.
//
// The daemon resolves them now. `SessionBegan` (conversation.v1) carries the
// neutral facts the producer observed; the daemon turns those into rows; the
// panel prints them.
message SessionInitView {
  // Addressed by workspace alone — no session id, for the reason stated on
  // ConversationDelta.
  //
  // NOTHING ON THIS MESSAGE CARRIES A VENDOR PAYLOAD. The panel gets rows, not
  // a record to read field by field; that is the whole point of the message.
  string workspace = 1;

  // The panel's rows, in render order. EMPTY means no init has landed yet,
  // which the panel draws as the rows it owns and nothing more — absence
  // rendering absence, rather than a spinner standing in for a fact.
  //
  // The panel splices its own rows (account, model, permission mode) ahead of
  // these, because those come from sources that move independently of an init
  // and are already resolved elsewhere.
  repeated SessionInitRow rows = 2;
  // The workspace's staleness FENCE at the moment the daemon produced this
  // push: an opaque token the client compares BYTE-WISE against the fence on
  // the workspace's current WorkspaceState, and never parses, splits or
  // interprets. Equal means current; different means stale, and a stale push
  // is discarded whole rather than partially adopted.
  //
  // The daemon mints it and is the only thing that can read meaning into it.
  // A client that learned to decode it would be depending on a fact this
  // contract does not offer, and the token's composition is free to change.
  string fence = 3;
}

// One row of the /status panel: a label and the value beside it.
//
// A STRING VALUE ON PURPOSE. Every row the panel draws is a word or a phrase —
// a count, a joined list, a version, a resolved auth word — so typing the value
// as anything richer would only invite a renderer to reformat it, which is the
// derivation this message exists to remove. The daemon decided what it says.
message SessionInitRow {
  // The row's label, as shown: "Version", "Working directory", "Auth".
  string label = 1;
  // The value, as shown. Never empty — the daemon OMITS a row it has no value
  // for rather than pushing a blank one, so absence renders as absence.
  string value = 2;
}

// ==========================================================================
// THE agent-output vocabulary.
//
// One closed oneof naming everything an agent can produce inside a
// conversation. It is deliberately NOT a feed message: it carries no uuid, no
// timestamp, no ordering and no provenance, because it is used in two places
// that stamp those differently —
//
//   1. the top-level feed, where Message wraps it with
//      the session's own identity/ordering/provenance stamps, and
//   2. detached work, where DetachedWorkAgentUpdate
//      wraps it with the target message's id and that message's fold accounting.
//
// The same message serves both because a detached agent is not a second,
// weaker kind of conversation — it is the same conversation happening
// somewhere else. A renderer written for the main feed therefore renders a
// detached agent unchanged.
// ==========================================================================

// One thing an agent produced.
//
// MOST ARMS ARE conversation.v1 MESSAGES IMPORTED WHOLE. This surface no longer
// keeps second spellings of what the agent said: a response carries
// conversation.v1.AgentSaid verbatim, a tool return carries
// conversation.v1.ToolReturned, a skill body carries
// conversation.v1.SkillBodyResolved. Only the arms that must carry a
// DAEMON-RESOLVED fact alongside the record — AgentResponse's usage stamp and
// detachment verdicts, AgentToolOutcome's — are frontend types at all, and each
// of those wraps the conversation record rather than restating it.
//
// It used to be the other way round: one assistant response was EXPLODED into a
// response, a thinking emission and a tool-call emission so that each fragment
// could be stamped separately. That flattening was what forced a frontend type
// to exist for every fragment, and it was losing is_error, stop_reason and model
// while re-deriving block position by hand. A response now arrives whole.
message AgentEmission {
  oneof emission {
    // The assistant's spoken turn — prose, reasoning and tool calls in the
    // order it produced them — with the resolved figures and verdicts it is
    // stamped with.
    AgentResponse response = 1;
    // A tool's return value, the conversation record whole. It carries
    // `is_error`, so a failed tool is distinguishable from a successful one:
    // the frontend type this replaced wrapped only the result content and had
    // no counterpart for that fact at all.
    conversation.v1.ToolReturned tool_result = 2;
    // A tool's TYPED outcome, and the arm that carries subagent and task chip
    // activity: agentshim.data.v1.ToolUseResult's own oneof holds
    // AgentAsyncLaunch, AgentResult, TaskOutputResult, TaskStopResult and
    // WorkflowLaunchResult, which are the launches and terminations a chip
    // draws. The typed outcome IS the chip, so there is no separate chip arm.
    AgentToolOutcome tool_outcome = 3;
    // A skill invocation's SKILL.md body, the conversation record whole. It is
    // addressed by the skill message's own message_id, which is what makes the
    // old tool_use_id correlation unnecessary.
    conversation.v1.SkillBodyResolved skill_body = 4;
    // The turn's terminal result record. It is agent output rather than feed
    // bookkeeping: a detached agent's transcript ends with exactly this
    // record, and it is where a fold learns that the agent finished and
    // whether it failed.
    //
    // A turn's ACCOUNTING VERDICT is a different thing and is not here: it is
    // the session's ledger rather than the agent's utterance, and it reaches a
    // frontend resolved, on FooterAccountingCell.
    conversation.v1.DetachedWorkEnded turn_result = 5;
  }
}

// ==========================================================================
// The assistant's spoken response, carried whole.
// ==========================================================================

// The assistant's spoken turn: the conversation record itself, plus the facts
// only the daemon can resolve about it.
//
// THE RECORD ARRIVES WHOLE AND UNMUTATED. Prose, reasoning and tool calls sit
// in `said.content` in the order the agent produced them, and nothing is
// stripped out of it on any path. There is exactly one copy of the agent's
// words on this surface, so there is nothing for an exclusivity rule to guard:
// the rule this message used to carry existed only because reasoning was lifted
// out into a second emission, and it is gone with the lifting.
//
// The daemon's resolved facts ride ALONGSIDE the record, each keyed by a value
// the content already carries, so a stamp never has to be merged INTO the
// evidence it describes.
message AgentResponse {
  // The response, exactly as the conversation surface states it: content
  // blocks in order, the usage the response reported, the model that produced
  // it, and why it stopped. Verbatim durable evidence.
  //
  // A frontend WALKS `said.content` and draws each block. That is rendering,
  // not deriving — a block's position IS its index in this array, so nothing
  // has to be re-stated for a client to know where a reasoning block or a tool
  // call sat.
  conversation.v1.AgentSaid said = 1;
  // The resolved figures this response is stamped with. Absent when the
  // response carried no usage record — never fabricated as zeros.
  //
  // It is a SEPARATE stamp from `said.usage` because these are the daemon's
  // canonical derivation (internal/tokenusage), which the client renders
  // verbatim, while `said.usage` is what the response itself reported.
  ResponseUsageStamp usage_stamp = 2;
  // The daemon's DETACHMENT VERDICTS for the tool calls in `said.content`.
  //
  // EMPTY when no call in this response detached anything, and an entry is
  // present ONLY for calls that DID detach. This list is therefore not a
  // census of the response's tool calls, and a missing entry is never a claim
  // that a call does not exist — the calls themselves are in `said.content`,
  // which is the only place that answers what the agent called. A call whose
  // detachment the daemon cannot classify is a daemon fault, surfaced as a
  // failure card, never silently omitted here and rendered as synchronous.
  repeated ToolCallVerdict verdicts = 3;
}

// THE DAEMON'S VERDICT THAT ONE TOOL CALL DETACHED WORK, addressed to a call
// inside the response it accompanies.
//
// It exists because the verdict is DAEMON-RESOLVED and the call is not. The
// call itself is a conversation.v1.ToolCallBlock — durable evidence the
// producer wrote, which cannot carry a fact the daemon decided later — so once
// the response stopped being exploded into per-call emissions, the verdict had
// nowhere left to sit. This is that place, and it is the only new type this
// consolidation adds.
//
// The daemon owns the classification and publishes only its answer, so that
// frontends MATCH an id rather than deriving one. Deriving it is not
// reproducible across frontends — the evidence is a mix of structured tool
// metadata, completion notifications and free-text result prose — and two
// frontends deriving it independently would eventually disagree about which
// message an update belongs to.
message ToolCallVerdict {
  // WHICH CALL this verdict is about: the tool_use id of a
  // conversation.v1.ToolCallBlock inside the accompanying `said.content`. A
  // verdict naming an id that is not in that array is a daemon fault, not a
  // renderable record.
  string tool_use_id = 1;
  // THE WORK THAT DETACHED: the uuid of the Message that work IS (payload arm
  // `detached_work`). Never empty — a verdict exists only because something
  // detached, so an empty value here is malformed rather than a "detached
  // nothing" claim.
  //
  // A POINTER IN ONE ID SPACE, NOT A BRIDGE BETWEEN TWO. It used to translate a
  // message id into a separate bubble id; both ends are message ids now, so it
  // states which message this call produced and nothing has to be reconciled.
  //
  // PROVENANCE, NEVER CONTAINMENT. The named message is a feed row in its own
  // right, and a frontend that read this as "that message lives inside this
  // card" would nest an unbounded thing inside a bounded one. Containment is
  // MessageLineage's alone.
  string spawned_message_id = 2;
}

// The per-response usage stamp carried by one assistant response.
// Every figure is daemon-resolved via the canonical TokenUsage derivation
// (internal/tokenusage); the client renders verbatim and computes nothing.
message ResponseUsageStamp {
  // The response's expensive input: canonical input_misses total
  // (written + unwritten). The headline figure.
  int64 expensive_input_tokens = 1;
  // Cache-served input, for the expanded stamp's breakdown row.
  int64 cache_read_tokens = 2;
  // Output tokens, as billed.
  int64 output_tokens = 3;
  // The model that produced the response, display form. Empty for synthetic
  // records (never fabricated).
  string model = 4;
}

// ==========================================================================
// The tool card's typed outcome, and the async task catalog its
// dispatched-agent rows render from.
//
// THE CALL AND ITS RESULT ARE NOT HERE. The call is a
// conversation.v1.ToolCallBlock inside AgentResponse.said.content, and the
// result is conversation.v1.ToolReturned on its own emission arm; neither has a
// frontend spelling any more. What remains on this surface is what the daemon
// RESOLVED about the call — its DETACHMENT CLASSIFICATION, which is published
// as ToolCallVerdict from the call side and restated here at the outcome.
// ==========================================================================

// A tool's TYPED outcome, and the subagent/task chip.
//
// It used to carry `data.v1.ToolUseResult`, whose oneof held AgentAsyncLaunch,
// AgentResult, TaskOutputResult, TaskStopResult and WorkflowLaunchResult —
// five vendor-named shapes for two facts: work detached, and work reached an
// end. conversation.v1 models those directly, so the chip's facts are now the
// detachment's own facts rather than a vendor union the frontend destructures.
message AgentToolOutcome {
  // The outcome, in the neutral detached-work vocabulary.
  //
  // A oneof rather than one field, because a launch and an ending are
  // different facts and a chip renders them differently. Absent when the call
  // returned ordinarily and detached nothing.
  oneof outcome {
    // Work detached and is now running alongside the turn.
    conversation.v1.DetachedWorkStarted started = 1;
    // Detached work reached an end, with the outcome it reached.
    conversation.v1.DetachedWorkEnded ended = 2;
  }
  // The tool_use id this outcome belongs to. Carried explicitly because
  // ToolUseResult has no correlation id of its own: on disk it is associated
  // with its tool_result line POSITIONALLY, and a positional association does
  // not survive being pushed as an independent emission.
  string tool_use_id = 3;
  // THE DETACHMENT VERDICT AS OBSERVED AT THE STRUCTURED OUTCOME: the uuid of
  // the Message the detached work IS (payload arm `detached_work`), empty when
  // this outcome detached nothing.
  //
  // WHY IT IS STATED HERE AND NOT ONLY ON THE CALL SIDE. The structured outcome
  // is where the detachment becomes KNOWABLE — it is the record the daemon
  // classifies from — while ToolCallVerdict, riding the response, is where a
  // frontend needs the answer FIRST, because the card is drawn before its
  // outcome lands. The daemon resolves the id once and states it in both
  // places; they are the same string whenever both are set.
  //
  // Same reading of empty as everywhere else on this contract: "this detached
  // nothing", never "the daemon could not tell". An unclassifiable detachment
  // is a daemon fault surfaced as a failure card.
  string spawned_message_id = 4;
}

// One dispatched background task, as the catalog reports it.
message TaskEntry {
  // KIND AND STATUS ARE TYPED, never free strings. A state carried as text
  // ("agent", "running", ...) renders an unrecognized word as whatever the
  // client's string comparison falls through to; a typed kind and a status
  // oneof make an unfamiliar value fail to match instead of silently drawing as
  // something else.
  //
  // THE STATUS IS THIS CATALOG'S OWN ONEOF, not conversation.v1's
  // DetachedWorkEnded, which cannot say what this surface must say: it collapses
  // a task stopped through its own affordance and one stopped from outside onto
  // a single cancelled arm, and it leaves `running` as an ABSENCE — a state
  // inferred from a missing field. Both distinctions are stated here instead.
  string task_id = 1;
  string description = 2;
  string output_path = 3;
  int64 started_at_ms = 4;
  int64 ended_at_ms = 5;   // 0 = still open
  // WHAT KIND of work the task is, in the ONE vocabulary the producer wrote it
  // in. The catalog and the detached-work message describe the same dispatched
  // work from two vantage points, so they read the same kind out of the same
  // type rather than each keeping a copy to disagree with.
  //
  // NAMED FOR THE VOCABULARY IT CARRIES, not the bare `kind`. This surface is
  // protojson on the wire, where the field NAME is the wire token, so the name
  // says which type the value is in rather than leaving a reader to guess.
  conversation.v1.DetachedWorkKind work_kind = 6;
  // The task's lifecycle; the set arm IS the status. Never unset on a wire
  // entry: an entry with no arm here is a malformed frame and is rejected
  // loudly rather than drawn as running.
  //
  // DAEMON-OWNED. "Is this task still running" is something the daemon works
  // out from whether an ending has reached it, so the RESOLVED status is
  // legitimately declared here rather than imported.
  //
  // TODO(respelling): the terminal arms nonetheless overlap
  // conversation.v1.DetachedWorkEnded's outcome — done/error/lost against
  // succeeded/failed/lost — while stopped/killed have only the single
  // DetachedCancelled to map onto and running has no counterpart at all.
  // Reconciling the resolved status with the producer's recorded outcome needs
  // a ruling; until then the distinctions stay stated here.
  oneof status {
    TaskStatusRunning running = 7;
    TaskStatusDone done = 8;
    TaskStatusError error = 9;
    TaskStatusKilled killed = 10;
    TaskStatusStopped stopped = 11;
    TaskStatusLost lost = 12;
  }
}

// The task statuses. Each is EMPTY BY DESIGN — being set is the entire
// assertion; the detail of HOW a task ended lives on its detached-work
// message's settled outcome, and the catalog does not carry a second copy to
// disagree with it.

// The task is still running. STATED, never inferred from a missing ending:
// absence renders absence on this contract.
message TaskStatusRunning {}

// The task finished successfully.
message TaskStatusDone {}

// The task finished by failing.
message TaskStatusError {}

// The task was stopped from outside before it finished.
message TaskStatusKilled {}

// The task was stopped deliberately through its own stop affordance. DISTINCT
// from killed: who stopped the work is the whole point of the distinction, and
// conversation.v1.DetachedCancelled cannot express it.
message TaskStatusStopped {}

// The daemon lost track of the task — a restart or a vanished process left
// its ending unobserved. An honest absence, distinct from every observed
// ending.
message TaskStatusLost {}

message TaskCatalog {
  // WORKSPACE-ADDRESSED, never session-addressed. A frontend has no session
  // vocabulary; the only currency question it ever asks is "is this push still
  // current", which the fence below answers without naming what rotated.
  string workspace = 1;
  repeated TaskEntry tasks = 2;
  // The workspace's staleness FENCE at the moment the daemon produced this
  // push: an opaque token the client compares BYTE-WISE against the fence on
  // the workspace's current WorkspaceState, and never parses, splits or
  // interprets. Equal means current; different means stale, and a stale push
  // is discarded whole rather than partially adopted.
  //
  // The daemon mints it and is the only thing that can read meaning into it.
  // A client that learned to decode it would be depending on a fact this
  // contract does not offer, and the token's composition is free to change.
  string fence = 3;
}

// ==========================================================================
// Slash commands: the closed session-command set, its feed record, and the
// skill body a launched skill contributes.
// ==========================================================================

// THE COMMAND SET ITSELF LIVES IN conversation.v1 (shared.proto),
// along with its SessionCommandSpec option. It moved there because a durable
// conversation record names one — DaemonAnsweredCommand — and a stored record
// cannot depend on the daemon's resolved output surface. The MENU that renders
// the set is a frontend concern; the set is not.

// Additive: ONE session command the user invoked, as the feed's record that
// they invoked it.
//
// NAMED FOR WHERE IT WAS INTERCEPTED, not for what it addresses. The former
// name (SessionCommandItem, arm `session_command`) read as a command issued TO
// the session, which is backwards: this is a command the daemon took OUT of
// the user's own input on its way to the agent, either because the daemon
// answers it itself or because the CLI does. Both readings agreed on the
// shape and disagreed on the direction, and the direction is the whole point —
// nothing downstream ever issues one of these.
//
// IT IS THE PAYLOAD OF BOTH DURABILITY CLASSES, and carries no mark of which.
// A command the CLI handled has a transcript record behind it and rides a
// DURABLE message; a command the daemon answered alone has no record anywhere
// and rides an EPHEMERAL one. That distinction is stated once, on the carrying
// Message's `durability` oneof, rather than restated here: a
// second copy of it is a second chance for the two to disagree, and the
// invariant that an ephemeral message is never anyone's parent is enforced
// where lineage lives, not where the command's name lives.
//
// WHY IT CARRIES NO TEXT, AND NEVER WILL. `/model` is not something the user
// SAID to the agent; it is something they DID to the session. Drawing it as a
// user message claims the agent was asked a question it never
// received, and every one of these commands the CLI answers locally — the
// model is not in the loop at all.
//
// The absence of a text field is the ENFORCEMENT of that, not a note about it.
// A frontend cannot render the submitted prompt from this item because the
// prompt is not in it: there is no field to put it in, so no future consumer
// can reintroduce the message by reading one, and no future producer can leak
// an argument the user typed (`/model opus`, `/compact focus on the parser`)
// onto a surface that has no business showing it. The command's IDENTITY is
// the whole fact, and an enum is the only shape that can carry an identity
// without also being able to carry a message.
//
// THIS IS THE INVOCATION, NOT THE OUTCOME. A context cut's COMPLETION is
// reported separately, minutes later and by whoever observed it; this reports
// that the user asked, at the instant they asked. The two coexist by design, and
// a frontend that truncates its feed at a cut drops the matching invocation
// along with the history it belonged to.
//
// The outcome half used to be `core.v1.ContextCleared`/`ContextCompacted`. Both
// are retired with the Event layer and have no replacement on this surface yet,
// so the completion this comment pairs with currently has nowhere to arrive.
message DaemonInterceptedCommandItem {
  // The recognized command. Never UNSPECIFIED.
  SessionCommand command = 1;
}

// A LAUNCHED SKILL'S SKILL.md BODY HAS NO FRONTEND TYPE. It is
// conversation.v1.SkillBodyResolved, carried whole on AgentEmission.skill_body.
//
// The type that used to sit here correlated a body to its card by tool_use_id.
// SkillBodyResolved's own comment identifies that as the SUPERSEDED mechanism:
// the record carries the skill message's own message_id, so the body states
// which skill it belongs to instead of a reader reconstructing it by walking a
// chain through the harness's isMeta records.

// ==========================================================================
// The feed's system-failure card.
//
// The only surface that renders a failure whole: its sentence, its evidence,
// its typed detail and its resolution. Every other surface projects a subset
// and says so in its own message.
// ==========================================================================

// A failure as a CONVERSATION ITEM rather than as chrome.
//
// A user whose workspace changed color needs to find out WHY from the
// conversation itself, at the point in it where the failure happened. Chrome
// scrolls away and carries no correlation between a report and its all-clear.
message FailureCardView {
  // WHAT failed, and its evidence. The card takes its color from the kind's
  // side of the vocabulary.
  FailureKind kind = 1;
  // The sentence the card leads with, composed daemon-side. This is what the
  // reader is meant to take away.
  string message = 2;
  // The raw account, shown beneath the sentence in a quieter register. It is
  // evidence for whoever debugs this, not the sentence itself, and it is
  // deliberately allowed to be empty.
  string detail = 3;
  // HOW this card ends, as arms, so that an open alarm and its all-clear can
  // never be the same shape with a different number in it.
  //
  // A window-shaped failure is re-sent under the SAME Message.uuid
  // with a different arm here, and the feed reconciles it in place. Appending
  // instead would leave the alarm standing beside its own all-clear.
  oneof lifecycle {
    FailureCardOpen open = 4;
    FailureCardResolved resolved = 5;
    FailureCardTerminal terminal = 6;
  }
}

// The failure is still happening. The card shows its alarm mark and its color.
message FailureCardOpen {}

// A window-shaped failure has closed. The card settles: it keeps its place in
// the conversation, drops to a muted register, and stamps when it ended.
message FailureCardResolved {
  // When it closed, unix millis.
  int64 resolved_at_ms = 1;
}

// The failure has no closing edge and never will — a turn that ended, a
// refusal, an account block. Distinct from `open`, because an open card
// invites waiting and this one does not.
message FailureCardTerminal {}

// A failure card that a surface OUTSIDE the feed needs to point at.
//
// It exists because a footer row and a command refusal both want to say "see
// the card", and the card's address is the only thing they need in order to.
message FailureCardRef {
  // The Message.uuid of the card to reveal. Empty when the failure
  // produced no card, and then the referring surface offers no way to reach
  // one rather than scrolling somewhere arbitrary.
  string card_uuid = 1;
}

// ==========================================================================
// The permission card.
//
// The request arm is protocol.v1.PermissionItem, carried on
// Message in feed.proto; the answer is this package's own command.
// ==========================================================================

message PermissionAnswerCmd {
  string permission_request_id = 1;
  bool allow = 2;
  google.protobuf.Struct updated_input = 3;
  string deny_message = 4;
}

// ==========================================================================
// Detached work as a MESSAGE PAYLOAD: its typed per-kind
// updates, and the update envelope that addresses them.
//
// Detached work is not a notice that something is happening elsewhere. A
// detached agent is a live, growing, recursively spawning conversation; a
// workflow is a live table of journal rows; a backgrounded shell command is a
// live byte spool. Each is modeled as what it is.
//
// IT IS A MESSAGE, AND ONLY A MESSAGE. Detached work has identity, provenance,
// containment, a timestamp and content that accumulates — which is the
// definition of a Message and not of a second, parallel kind of thing. So it
// carries NO id of its own (the containing Message's uuid IS its id) and NO
// parent pointer of its own (feed.proto's MessageLineage is the one containment
// relation). What lives here is the PAYLOAD: what kind of work it is, what it
// is called, whether it is still running, and what it has produced.
//
// AN UPDATE IS NOT A MESSAGE. Work that accumulates output produces bytes and
// emissions, not new feed rows: a shell writing a megabyte would otherwise mint
// thousands of top-level-eligible messages and a page of ten would count them.
// An update is therefore an UPDATE TO AN EXISTING MESSAGE, addressed by that
// message's id — it has no id of its own, no lineage, and never becomes a
// Message. See DetachedWorkUpdate, and DetachedWorkDelta in feed.proto for the
// two-armed channel that carries whole messages and updates side by side.
//
// The daemon owns the whole apparatus: it classifies a detaching tool call,
// mints the message the work is carried by, reads and folds the work's output,
// and pushes typed updates addressed to that message's id. Frontends render
// what arrives; they parse no transcripts, poll no files and derive no
// identities.
// ==========================================================================

// One piece of detached work, as the payload of the Message that IS it.
message DetachedWork {
  // THERE IS ONE ID SPACE: the containing Message's uuid. A routing handle of
  // this payload's own would be a second id space that had to be bridged to the
  // first, and the bridge is pure cost.
  //
  // THERE IS ONE CONTAINMENT TREE, and it is the message tree. A parent pointer
  // for detached work would be a second tree walking only detached work, which
  // could disagree with the real one. Containment is stated exactly once, on
  // MessageLineage.parent_message_id.
  //
  // WHAT A PRODUCER OBSERVED IS SPELLED ONCE, WHERE IT WAS OBSERVED. The
  // originating tool call and the label live inside `started`, in the producer's
  // own words; this surface restates neither, so there is nothing here to drift
  // against.
  //
  // THIS SURFACE TRAVELS AS PROTOJSON, so a field NAME is the wire token, not
  // just documentation — renaming a field breaks the wire exactly as renumbering
  // it would.

  // THE PRODUCER'S OWN RECORD of the detachment, embedded whole rather than
  // copied out field by field. Everything a producer observed about the work
  // starting — which tool call spawned it, what it is called, what kind of thing
  // it is — reaches the frontend exactly as it was recorded, so this surface has
  // no second spelling of those facts to fall out of step with.
  conversation.v1.DetachedWorkStarted started = 1;
  // When the work was launched, unix millis.
  int64 started_at_ms = 2;
  // Live or settled, and with what outcome. See DetachedWorkLiveness.
  DetachedWorkLiveness liveness = 3;
  // WHICH KIND OF WORK THIS IS, IS STATED EXACTLY ONCE: `started.kind`, a
  // conversation.v1.DetachedWorkKind. This surface carries no per-kind arm of
  // its own, because an arm set to a kind is the same word said a second time in
  // a second spelling (`journal` here against `workflow` there), which is a drift
  // opportunity for no gain. Every kind — agent, workflow, shell, unclassified,
  // merge, skill — is a DetachedWorkKind value and nothing else.
  //
  // CONTAINED CONTENT IS NOT CARRIED HERE. A detached agent's conversation, a
  // merge run's, a skill window's, a workflow's steps are reached by PAGING:
  // frontend.v1.PageScopeInside naming THIS message's id walks the records whose
  // parent is conversation.v1.MessageParentInside it, at any depth, with the same
  // command and renderer the feed uses.

  // The workspace this work runs under — the same key every workspace-scoped
  // frame carries. It exists so a snapshot can scope detached work to the
  // client's workspace exactly as it scopes every other per-workspace family;
  // deltas already carry the key on their envelope (DetachedWorkDelta.workspace),
  // and the two are always equal.
  string workspace = 4;
}

// Live-or-settled, expressed as arms so that "settled" and "settled with what
// outcome" are one indivisible fact. Settled work with no outcome is
// unrepresentable.
message DetachedWorkLiveness {
  oneof state {
    DetachedWorkLive live = 1;
    DetachedWorkSettled settled = 2;
  }
}

// The work is still running.
message DetachedWorkLive {
  // When the daemon last saw this work produce anything, unix millis. 0 means
  // it has produced nothing since launch. It supports a "quiet for a while"
  // affordance and is NOT a liveness verdict: a silent agent is still a live
  // agent.
  int64 last_activity_ms = 1;
}

// The work has finished, one way or another.
message DetachedWorkSettled {
  // THE OUTCOME IS THE PRODUCER'S WORD, and this surface does not get a second
  // one. How the work ended, and — for work that was a process — the exit status
  // it left with, are things a producer OBSERVED, so they are stated where they
  // were observed, in conversation.v1.DetachedWorkEnded. A local re-spelling
  // could only be a smaller vocabulary: it would lack `lost`, and work whose
  // ending was never observed would have to be reported as an ending that was.

  // When it finished, unix millis. Daemon bookkeeping: the moment this system
  // learned of the ending, which is not the moment the work ended.
  int64 settled_at_ms = 1;
  // THE PRODUCER'S OWN RECORD of the ending, embedded whole: which outcome it
  // reached, and — for work that was a process — the exit status it left with.
  // A consumer reads the verdict and the evidence from one place, in the
  // vocabulary the producer wrote them in.
  conversation.v1.DetachedWorkEnded ended = 2;
  // TODO(respelling): `killed` has NO counterpart in
  // conversation.v1.DetachedWorkEnded and so was not folded into `ended`. Its
  // nearest neighbour, conversation.v1.DetachedCancelled, is empty and cannot
  // carry `reason` — the attribution of WHO stopped the work. Deleting this
  // would delete that attribution off the wire silently. It is a plain field
  // rather than a oneof arm now that its siblings live in `ended`; when set, it
  // annotates the `cancelled` arm and never contradicts it.
  DetachedWorkOutcomeKilled killed = 3;
}

// Stopped from outside before it finished: an explicit stop, a cancellation,
// a session teardown. Distinct from error because the work did not fail — it
// was not allowed to conclude.
message DetachedWorkOutcomeKilled {
  // Who or what stopped it, resolved for display. Empty when unattributed.
  string reason = 1;
}

// NOTHING ON THIS SURFACE IS TAIL-CAPPED, and so nothing carries tail-cap
// accounting. Caps exist only where repeated content ships inline, whole or not
// at all — and a cap with no fetch path leaves the dropped entries in the store
// and unreachable. Contained content is paged (frontend.v1.PageScopeInside), so
// a client that wants earlier entries asks for them.

// One incremental push to ONE MESSAGE'S detached-work payload: the message id
// routes it, the arm types it.
//
// AN UPDATE, NOT A MESSAGE. It is addressed to a message that already exists
// and mutates that message's payload in place. It carries no uuid, no lineage
// and no timestamp of its own, because it is not a thing the feed contains —
// it is a change to a thing the feed already contains. Promoting each one to a
// Message would let an agent running for an hour insert a feed row per line,
// which is exactly what pagination cannot survive.
//
// Never a re-send of the whole message either: an agent running for an hour
// would otherwise re-transmit its entire transcript on every new line.
message DetachedWorkUpdate {
  // THIS SURFACE TRAVELS AS PROTOJSON, so the field NAME below is the wire
  // token: renaming it breaks every producer and consumer of this update.

  // WHICH MESSAGE this lands on — the uuid of a Message whose payload is
  // DetachedWork. Must name a message the receiver has already opened; an
  // update for an unknown id is a gap and must be rejected loudly and resynced,
  // never buffered in the hope its message shows up.
  string message_id = 1;
  // WHAT changed. The arm MUST match the work's kind — a journal update
  // addressed to shell work is a daemon bug and is rejected, not coerced. Only
  // `liveness` is kind-independent.
  //
  // `shell` and `unclassified` are distinct arms carrying the SAME message:
  // the arm names which kind the update is for, while the payload is one byte
  // append in both cases. The two kinds differ in what they ARE, not in how
  // their output arrives, so there is no axis along which a duplicated pair of
  // append messages could evolve apart.
  //
  // `merge` carries the SAME message as `agent` for exactly that reason: a
  // merge run's emissions arrive precisely as a detached agent's do, so the
  // arm names the kind while the payload has no axis to evolve apart on.
  //
  // TODO(respelling): seven arms carry only FIVE distinct types —
  // `agent`/`merge` are both DetachedWorkAgentUpdate, and `shell`/`unclassified`
  // are both DetachedWorkOutputAppend. The arms are therefore typed by the
  // work's KIND when what an update actually varies by is its SHAPE: emissions,
  // byte append, journal rows, skill body, liveness. Kind is already stated once
  // on the message (conversation.v1.DetachedWorkStarted.kind), so restating it
  // here is the same duplication the `kind` oneof was deleted for. Whether these
  // collapse to shape-typed arms needs a ruling; this oneof is NOT changed
  // meanwhile, because its arms route live traffic.
  oneof update {
    DetachedWorkAgentUpdate agent = 2;
    DetachedWorkJournalUpdate journal = 3;
    DetachedWorkOutputAppend shell = 4;
    DetachedWorkOutputAppend unclassified = 5;
    DetachedWorkLivenessUpdate liveness = 6;
    DetachedWorkAgentUpdate merge = 7;
    DetachedWorkSkillUpdate skill = 8;
  }
}

// New output from a detached agent.
message DetachedWorkAgentUpdate {
  // The emissions produced since the last update, in order. THE SAME message
  // the top-level feed carries — see AgentEmission. A frontend appends these
  // to the work's emission list and renders them with its ordinary feed
  // renderers.
  //
  // These are EMISSIONS APPENDED TO ONE MESSAGE, not messages of their own: a
  // detached agent's thousand lines are a thousand additions to one feed row.
  repeated AgentEmission emissions = 1;
}

// One incremental push to a skill message. Body resolution and emission
// appends are different events with different lifetimes, so they are arms
// rather than co-set fields.
message DetachedWorkSkillUpdate {
  oneof update {
    // The skill file's contents, resolved — the conversation record whole.
    // Replaces the message's body rather than appending; delivered once in the
    // ordinary case. WHICH message it lands on is stated once, by the
    // containing DetachedWorkUpdate.message_id.
    conversation.v1.SkillBodyResolved body = 1;
    // Emissions appended to the window, exactly as a detached agent's.
    DetachedWorkAgentUpdate emissions = 2;
  }
}

// New steps in a Workflow run's journal.
message DetachedWorkJournalUpdate {
  // Rows logged since the last update, in order.
  //
  // Rows are APPEND-ONLY and are never revised in place: a step that starts
  // running and later completes emits a running row and then a done row, and
  // the daemon does not rewrite history. A frontend that wants one row per
  // step collapses them by label; a frontend that wants the log renders them
  // all. Neither reading is imposed here.
  //
  // THE PRODUCER'S OWN STEP RECORD, carried unchanged: the daemon batches which
  // steps it forwards, it does not restate what a step said.
  repeated conversation.v1.WorkflowStep rows = 1;
}

// New bytes on a spool: an APPEND TO ONE MESSAGE'S PAYLOAD.
//
// A byte append is emphatically not a message. It has no identity, no lineage
// and no place of its own in the feed; it is addressed to the message whose
// spool it extends (DetachedWorkUpdate.message_id) and is applied to that
// message's accumulating content.
message DetachedWorkOutputAppend {
  // AN APPEND CARRIES NO OFFSET, so a lost append cannot be told from a quiet
  // one: an append that never arrives leaves a silent hole in a transcript that
  // still looks complete. The durable record is intact and a reload repairs it,
  // with no signal to the user that a reload is warranted. A per-frame `seq` on
  // frontend.v1.FrontendFrame is the cheaper way to get detection back, and would
  // cover all four delta streams — ConversationDelta, TypingDelta,
  // DetachedWorkDelta and this one — rather than this one alone, for less than a
  // per-stream cursor costs.

  // The bytes, verbatim, to append.
  string text = 1;
}

// A liveness transition: live to settled, or a settled outcome changing (a
// running agent that is then killed).
message DetachedWorkLivenessUpdate {
  // The work's liveness after the transition.
  DetachedWorkLiveness liveness = 1;
}

// ==========================================================================
// THE ONLY WAY a frontend obtains conversation it
// does not already hold, and deliberately a TWO-VERB one.
//
// Live delivery of NEW messages (ConversationDelta) is not pagination and is
// not governed here.
//
// THE CLIENT CANNOT NAME A POSITION. Not a seq, not an offset, not a cursor it
// authored or holds. "Give me everything" is not a request this contract can
// express — not because no caller sends it, but because there is no value that
// means it. The daemon owns the position, persisted in the SSM, per reader per
// workspace, and NextPageCmd carries no position at all: even an opaque cursor
// is a position the client holds.
//
// NO FENCE. A fence was daemon state the client echoed back so the daemon could
// check the client against itself — the same category error as from_seq. The
// daemon owns the reader's position, so it already knows when a generation
// change invalidates it: it DROPS the position, the next NextPageCmd arrives
// with none and is REFUSED, and a client answers a refusal with FirstPageCmd. A
// page in flight across the transition is handled by request_id, which a client
// already uses to apply only the pages it awaits.
//
// THE CLIENT-ANCHORED SURFACE IS GONE, AND THAT IS WHY THE CLAIM ABOVE IS
// TRUE. ConversationPageCmd and its page — tail/before anchors, an opaque
// cursor, and a fence the client echoed back — have been deleted outright
// rather than deprecated, because two ways to obtain history is exactly one
// way for a client's idea of where it is to diverge from the daemon's. A
// client that holds no position cannot desync; a position the client echoes
// back is only the daemon checking itself against its own state, which it
// could have read directly.
//
// WHAT WAS LOST, AND ACCEPTED: ARBITRARY ANCHORING. ConversationPageBefore
// could say "the page before THIS one"; FirstPageCmd and NextPageCmd express
// only "the most recent" and "one older". Deep-linking to an arbitrary point
// in history therefore has no verb here. That is accepted: no frontend asked
// for it, and restoring it means handing the client a position again, which is
// the whole thing this contract forbids.
//
// ON THE WEBAPP BOUNCE, EXPLICITLY ACCEPTED. A frontend that bounces calls
// FirstPageCmd and starts from the bottom. Earlier pages are re-reached by
// paging back. Scroll depth is NOT preserved across a bounce, and no
// client-side persistence is added to preserve it. This is a deliberate
// simplification, not an oversight.
// ==========================================================================

// Which container a page walks.
//
// A oneof rather than an optional container id: "the feed" and "inside message
// X" are the only two answers, and an empty string standing for the feed is
// exactly the ambiguity conversation.v1.MessageParent exists to forbid.
message PageScope {
  oneof scope {
    // Records whose parent is conversation.v1.MessageParentRoot.
    PageScopeFeed feed = 1;
    // Records whose parent is conversation.v1.MessageParentInside this message.
    PageScopeInside inside = 2;
  }
}

// The top-level conversation: everything the feed renders as a standalone row.
//
// An empty message rather than a bool, so that naming the feed and naming a
// container are the same act at the same cost, and a client never has to choose
// between two spellings of "where".
message PageScopeFeed {}

// The inside of one message: the records that message contains.
message PageScopeInside {
  // The containing message. It is itself a conversation.v1.MessageEntry, so a
  // subagent inside a subagent is named the same way at every depth — the
  // recursion lives in the DATA, not in this type.
  string container_message_id = 1;
}

// Ask for the MOST RECENT page, and reset this reader's position to it.
//
// The cold open and the whole recovery story: a client that bounced, rotated
// its seq space, or lost its place calls this and starts from the bottom.
message FirstPageCmd {
  // Which conversation. The daemon's position is per reader PER WORKSPACE, so
  // this is what selects the position being reset.
  string workspace = 1;
  // WHICH CONTAINER this page walks: the feed, or the inside of one message.
  // The daemon's position is per reader per workspace PER SCOPE, so this also
  // selects which position is being reset — opening a subagent does not throw
  // away where the reader was in the feed.
  //
  // Unset is NOT a default. A request that does not state its scope is REFUSED,
  // never read as the feed: defaulting would answer a client that forgot to
  // name its container with the whole conversation.
  PageScope scope = 2;
}

// Ask for the page IMMEDIATELY OLDER than the last one served to this reader.
//
// IT CARRIES NO POSITION, and that absence is the design. From a reader with no
// established position it is REFUSED rather than answered with the tail:
// defaulting would turn a client bug into a silent tail read, and "I have no
// position" already has its own verb.
message NextPageCmd {
  string workspace = 1;
  // WHICH CONTAINER to walk back through. It names the scope, never a position
  // within it — the daemon still owns where this reader is inside that scope,
  // so the no-position rule above is untouched.
  //
  // Unset is NOT a default and is REFUSED, exactly as on FirstPageCmd: a
  // load-more that forgot which container it belongs to must not silently walk
  // back through the feed instead.
  PageScope scope = 2;
}

// One page of messages, oldest first.
//
// THE PAGE LIMIT IS THE DAEMON'S INVARIANT, NOT THIS TYPE'S. The messages
// travel in a repeated field, which is unbounded by construction: nothing here
// stops an over-long page. The at-most-ten ceiling is enforced by the daemon
// that builds the page, and by nothing else. No `limit` field is added to
// compensate — a limit on the wire would be a second place for the ceiling to
// live and a second thing for a client to disagree with.
//
// NESTED MESSAGES ARE NOT IN THIS PAGE. A message contained by another does
// NOT travel inside its parent here: contained records are reached by PAGING,
// with a fresh request whose PageScope is PageScopeInside naming the
// container's message id. So a page of the feed carries feed rows only, and a
// client that wants a subagent's insides asks for them.
message ConversationHistoryPage {
  string workspace = 1;
  // The requesting command's request_id, echoed so a client correlates this
  // page with the request it made rather than with whichever was most recent,
  // and so it can DISCARD a page it is no longer awaiting.
  string request_id = 2;


  // Messages OLDEST FIRST, as COMPLETE feed envelopes identical in shape to
  // ConversationDelta's — so a frontend renders a paged message with the same
  // code that renders a pushed one. Fewer than the daemon's ceiling means a
  // short page, which at the top of a conversation is the normal case.
  repeated Message messages = 3;

  // WHETHER the conversation continues above this page — never WHERE.
  //
  // A oneof of MESSAGES rather than a bool or an enum: "there is more" and "we
  // reached the beginning" are the only two answers, and a shape that could
  // carry both or neither invites a client to invent a third.
  oneof continuation {
    // Older history remains. EMPTY on purpose: under this contract "there is
    // more" is a FACT the client acts on by calling NextPageCmd, not a handle
    // it stores. The cursor that used to live here is precisely the position
    // the client no longer holds.
    HistoryHasMore more = 4;
    // This page reaches the conversation's beginning; the client retires its
    // load-more affordance.
    HistoryAtStart start = 5;
  }

  // FIRST PAGES ONLY: the seq this page is current THROUGH, so the client
  // splices onto the live push stream gap-free BY CONSTRUCTION rather than by
  // timing. An OUTPUT the client never echoes back — it rides no request.
  // Zero on next pages, which are history and carry no live edge.
  uint64 live_join_seq = 6;

  // WHICH CONTAINER this page walks, STATED rather than left to be inferred,
  // so a client can never mistake a page of a subagent's insides for a page of
  // the feed.
  //
  // It is the ECHO of the requested scope, alongside `request_id`. Together
  // with the `parent` each returned record carries, it is how a client VERIFIES
  // that the page it got is the page it asked for: the echo proves what was
  // ASKED, the per-record parent proves what was RECEIVED.
  PageScope scope = 7;
  // The containers this page's scope sits inside, OUTERMOST FIRST. Empty when
  // the scope is the feed.
  //
  // STATED BY THE DAEMON BECAUSE IT ALREADY WALKED THE CHAIN while resolving
  // the scope. A cold open deep-linked into a nested container holds no message
  // map yet and needs the ancestors to render the surrounding cards; walking up
  // one `parent` hop at a time would cost a round trip per level to learn what
  // the resolver already knew. It cannot disagree with the parent chain because
  // it is derived from that chain in the same pass.
  repeated string ancestor_message_ids = 8;
}

// Older history remains; call NextPageCmd.
message HistoryHasMore {}

// There is nothing older. A FACT the daemon established by reading to the floor.
message HistoryAtStart {}
