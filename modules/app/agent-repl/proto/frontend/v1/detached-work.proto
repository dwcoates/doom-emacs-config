// detached-work.proto — Detached work as a MESSAGE PAYLOAD: its typed per-kind
// updates, and the update envelope that addresses them.
//
// Detached work is not a notice that something is happening elsewhere. A
// detached agent is a live, growing, recursively spawning conversation; a
// workflow is a live table of journal rows; a backgrounded shell command is a
// live byte spool. Each is modeled as what it is.
//
// IT IS A MESSAGE, AND ONLY A MESSAGE. Detached work has identity, provenance,
// containment, a timestamp and content that accumulates — which is the
// definition of a Message and not of a second, parallel kind of thing. So it
// carries NO id of its own (the containing Message's uuid IS its id) and NO
// parent pointer of its own (feed.proto's MessageLineage is the one containment
// relation). What lives here is the PAYLOAD: what kind of work it is, what it
// is called, whether it is still running, and what it has produced.
//
// AN UPDATE IS NOT A MESSAGE. Work that accumulates output produces bytes and
// emissions, not new feed rows: a shell writing a megabyte would otherwise mint
// thousands of top-level-eligible messages and a page of ten would count them.
// An update is therefore an UPDATE TO AN EXISTING MESSAGE, addressed by that
// message's id — it has no id of its own, no lineage, and never becomes a
// Message. See DetachedWorkUpdate, and DetachedWorkDelta in feed.proto for the
// two-armed channel that carries whole messages and updates side by side.
//
// The daemon owns the whole apparatus: it classifies a detaching tool call,
// mints the message the work is carried by, reads and folds the work's output,
// and pushes typed updates addressed to that message's id. Frontends render
// what arrives; they parse no transcripts, poll no files and derive no
// identities.
//

syntax = "proto3";

package frontend.v1;

import "frontend/v1/agent-emission.proto";

option go_package = "agentrepl/proto/frontend/v1;frontendv1";

// One piece of detached work, as the payload of the Message that IS it.
message DetachedWork {
  // 1 was `id`: the detached work's own routing handle, minted in a SECOND id
  // space that had to be bridged to the message id space. There is one id space
  // now — the containing Message's uuid — so the handle and its bridge are both
  // gone. Reserved by number and by name because this surface is protojson on
  // the wire, where the field NAME is the wire token.
  reserved 1;
  reserved "id";
  // 3 was `parent_bubble_id`: a SECOND containment tree walking only detached
  // work, alongside the implicit message tree. Two pointers that had to agree
  // was a drift opportunity for no gain. Containment is now stated exactly once,
  // on MessageLineage.parent_message_id (feed.proto).
  reserved 3;
  reserved "parent_bubble_id";

  // The tool_use id of the call that spawned this work, for a frontend that
  // draws the work attached to its originating card rather than free-standing.
  // Empty only for work that no tool call spawned.
  //
  // PROVENANCE, NEVER CONTAINMENT. It says which call STARTED this work, which
  // is a different fact from what CONTAINS it: a reader that treated it as
  // containment would place a feed row inside the card that launched it and
  // make a page of ten messages unbounded again. Containment is
  // MessageLineage's alone.
  string origin_tool_use_id = 2;
  // The face the collapsed fold shows: the agent's task description, the
  // workflow's name, or the shell's command line. Empty means the daemon had
  // no label for the work, and the client shows the message's id.
  string label = 4;
  // When the work was launched, unix millis.
  int64 started_at_ms = 5;
  // Live or settled, and with what outcome. See DetachedWorkLiveness.
  DetachedWorkLiveness liveness = 6;
  // WHAT KIND of work this is, carrying that kind's content as folded so far.
  // Newly opened work carries an empty body; work arriving in a reconnect
  // snapshot carries everything the daemon has folded to date.
  //
  // Skill invocations detach: the daemon intercepts the Skill call and opens
  // detached work, because what follows a skill is a whole conversation rather
  // than a card. `merge` is the one skill with an arm of its own, because the
  // merge run is a distinct thing to render; every other skill arrives as
  // `skill`.
  oneof kind {
    DetachedWorkAgent agent = 10;
    DetachedWorkJournal journal = 11;
    DetachedWorkShell shell = 12;
    DetachedWorkUnclassified unclassified = 13;
    DetachedWorkMerge merge = 14;
    DetachedWorkSkill skill = 15;
  }
  // The workspace this work runs under — the same key every workspace-scoped
  // frame carries. It exists so a snapshot can scope detached work to the
  // client's workspace exactly as it scopes every other per-workspace family;
  // deltas already carry the key on their envelope (DetachedWorkDelta.workspace),
  // and the two are always equal.
  string workspace = 7;
}

// A detached agent: a whole conversation happening elsewhere.
message DetachedWorkAgent {
  // The agent's conversation so far, in emission order, in EXACTLY the
  // vocabulary the top-level feed uses. A frontend's renderer for a response, a
  // thinking block or a tool card is the same code in both places.
  repeated AgentEmission emissions = 1;
  // Tail-cap accounting for `emissions`. See DetachedWorkFold.
  DetachedWorkFold fold = 2;
}

// A merge run: the conversation a merge drives through this workspace's own
// session, folded exactly like a detached agent's.
//
// DAEMON-AUTHORED. No tool spawns it: the daemon opens it when it classifies
// the Skill invocation `/create-or-update-workspace merge`, and every
// subsequent emission of the session folds here as a child until the user's
// own next prompt or an interrupt settles it. Membership is TEMPORAL — the
// window between that classification and the user taking the session back —
// not a join key.
message DetachedWorkMerge {
  // The merge conversation so far, in emission order, in EXACTLY the
  // vocabulary the top-level feed uses (the same shape as
  // DetachedWorkAgent.emissions, deliberately: a frontend's renderer for a
  // response, a thinking block or a tool card is the same code here).
  repeated AgentEmission emissions = 1;
  // Tail-cap accounting for `emissions`. See DetachedWorkFold.
  DetachedWorkFold fold = 2;
}

// A skill invocation as detached work: the invocation card the feed used to
// render flat, now work that owns its window. The daemon opens it when it
// classifies the Skill tool call, resolves the skill file's contents as the
// work's own body (they are the SKILL's content, not a response of the
// conversation — rendering the file contents as an agent response is retired
// by this arm), and folds the session's subsequent emissions here until the
// user's own next prompt or an interrupt settles it — the same temporal
// membership the merge arm uses.
message DetachedWorkSkill {
  // The skill's name as invoked, verbatim (e.g. "create-or-update-workspace").
  string skill_name = 1;
  // The invocation's arguments, verbatim; empty when none were given.
  string args = 2;
  // The skill file's contents, resolved daemon-side, rendered verbatim as the
  // work's own body. Empty until resolution delivers it (see
  // DetachedWorkSkillUpdate.body); a skill whose file cannot be read keeps an
  // empty body and the failure surfaces through the ordinary failure channel.
  string body = 3;
  // The window's conversation so far, in emission order, in EXACTLY the
  // vocabulary the top-level feed uses.
  repeated AgentEmission emissions = 4;
  // Tail-cap accounting for `emissions`. See DetachedWorkFold.
  DetachedWorkFold fold = 5;
}

// A Workflow run's journal: the step log a Workflow launch writes.
//
// ONE PRODUCER. This kind exists for the Workflow tool and nothing else — its
// rows are the entries of that run's journal.jsonl step log, one row per
// logged step. It is not a general-purpose progress table, and work of any
// other kind never arrives here.
message DetachedWorkJournal {
  // The steps logged so far, in order.
  repeated DetachedWorkJournalRow rows = 1;
  // Tail-cap accounting for `rows`. See DetachedWorkFold.
  DetachedWorkFold fold = 2;
}

// A backgrounded shell command: an opaque byte spool with a command line.
message DetachedWorkShell {
  // The command line that was backgrounded, verbatim, for the work's header.
  // Empty only when the daemon launched the process without a reconstructible
  // command line.
  string command = 1;
  // Everything the command has written so far. See DetachedWorkOutputSpool.
  DetachedWorkOutputSpool output = 2;
}

// A spawn whose tool the daemon does not recognize.
//
// AN EXPLICIT ARM, NOT A FALLBACK. Unrecognized work is a first-class kind on
// this contract: the daemon states that it could not classify the tool, names
// the tool it could not classify, and streams the work's output anyway. A
// renderer must draw this work — it is real work the user started, and
// dropping it would make a running process invisible. The one thing a
// renderer may not do is guess: an unrecognized tool is not silently treated
// as a shell, an agent or a workflow.
message DetachedWorkUnclassified {
  // The tool that spawned the work, verbatim as the agent named it. This is
  // the fact that makes the arm useful rather than merely honest: it is what
  // tells a maintainer which tool needs a classification, and what lets a
  // frontend label the work with something truer than "unknown".
  string tool_name = 1;
  // Everything the work has written so far. See DetachedWorkOutputSpool.
  DetachedWorkOutputSpool output = 2;
}

// A verbatim byte spool and its delivery cursor.
//
// Deliberately unparsed and unstructured — this output is bytes, and
// pretending otherwise is how a renderer starts guessing at ANSI, line framing
// and JSON.
//
// THE SPOOL IS PAYLOAD, NOT A STREAM OF MESSAGES. Everything appended to it is
// this one message's accumulating content; no chunk of it is ever promoted to a
// feed row of its own.
message DetachedWorkOutputSpool {
  // Everything spooled so far, verbatim.
  string text = 1;
  // Bytes delivered so far, so a reconnecting client resumes rather than
  // re-fetches. Also the sequencing check on DetachedWorkOutputAppend: an
  // append whose from_offset does not equal this value is a gap and must be
  // rejected loudly, not applied.
  uint64 through_offset = 2;
}

// One logged step of a Workflow run: a dot, a name and a detail line.
message DetachedWorkJournalRow {
  // The step's name — the phase or agent it reports on — verbatim.
  string label = 1;
  // The step's detail line, verbatim: the result on success, the error text on
  // failure, the prompt while running.
  string detail = 2;
  // The step's state, as arms rather than an enum, so that a state added later
  // is an arm a reader must handle rather than an integer it silently renders
  // as something else.
  oneof status {
    DetachedWorkStepRunning running = 10;
    DetachedWorkStepDone done = 11;
    DetachedWorkStepFailed failed = 12;
  }
}

// The step is still executing.
message DetachedWorkStepRunning {}

// The step completed successfully.
message DetachedWorkStepDone {}

// The step failed. The failure text is the row's `detail`; this arm carries no
// second copy of it.
message DetachedWorkStepFailed {}

// Live-or-settled, expressed as arms so that "settled" and "settled with what
// outcome" are one indivisible fact. Settled work with no outcome is
// unrepresentable.
message DetachedWorkLiveness {
  oneof state {
    DetachedWorkLive live = 1;
    DetachedWorkSettled settled = 2;
  }
}

// The work is still running.
message DetachedWorkLive {
  // When the daemon last saw this work produce anything, unix millis. 0 means
  // it has produced nothing since launch. It supports a "quiet for a while"
  // affordance and is NOT a liveness verdict: a silent agent is still a live
  // agent.
  int64 last_activity_ms = 1;
}

// The work has finished, one way or another.
message DetachedWorkSettled {
  // When it finished, unix millis.
  int64 settled_at_ms = 1;
  // The process exit status, for work that IS a process — shell work, and
  // unclassified work the daemon ran as one. Absent for work with no exit
  // status of its own (an agent, a workflow), and absence is the only reading
  // of "this work did not exit, it concluded".
  //
  // It sits BESIDE the outcome rather than inside an outcome arm because the
  // exit status and the verdict are two different facts about one ending. The
  // daemon resolves `outcome` FROM this code — that mapping is not a client's
  // to make — while the code itself stays on the wire so a shell's card can
  // show "exited 137" rather than an unexplained red dot. Putting the code
  // inside `done` and `error` would force every reader to check two arms for
  // one field; putting the verdict inside the exit status would leave work
  // with no exit status unable to say how it ended.
  DetachedWorkShellExit shell_exit = 2;
  // HOW it finished. Exactly one arm is always set.
  oneof outcome {
    DetachedWorkOutcomeDone done = 10;
    DetachedWorkOutcomeError error = 11;
    DetachedWorkOutcomeKilled killed = 12;
  }
}

// A process's exit status.
message DetachedWorkShellExit {
  // The exit code, as the shell reports it. A signal-terminated process
  // reports the conventional 128+N form, because that is what its exit status
  // literally is. 0 is a real zero and always means clean exit.
  int32 code = 1;
}

// Finished successfully. For a process, the daemon resolved this from an exit
// code of 0 (see DetachedWorkSettled.shell_exit).
message DetachedWorkOutcomeDone {}

// Finished by failing. For a process, the daemon resolved this from a nonzero
// exit code (see DetachedWorkSettled.shell_exit).
message DetachedWorkOutcomeError {
  // The failure, resolved for display. Empty when the source reported failure
  // without a reason — never filled with a manufactured one. A process's exit
  // code is NOT restated here; it rides DetachedWorkSettled.shell_exit.
  string message = 1;
}

// Stopped from outside before it finished: an explicit stop, a cancellation,
// a session teardown. Distinct from error because the work did not fail — it
// was not allowed to conclude. A killed process still carries its exit status
// on DetachedWorkSettled.shell_exit.
message DetachedWorkOutcomeKilled {
  // Who or what stopped it, resolved for display. Empty when unattributed.
  string reason = 1;
}

// Tail-cap accounting for detached work whose folded content is capped.
//
// The cap is a resolved daemon fact rather than per-frontend policy, so that
// two frontends cannot silently disagree about what the user is being shown:
// a fold that drops its oldest entries and says nothing is indistinguishable
// from a complete one.
//
// IT IS PAYLOAD STATE OF ONE MESSAGE, not a record about several. The cap
// describes how much of THIS message's accumulated content is being shown; the
// entries it drops were never messages and dropping them removes no feed row.
//
// It applies to the item-counted kinds (an agent's emissions, a workflow's
// rows). A byte spool has no items to count and carries its delivery cursor
// instead — see DetachedWorkOutputSpool.
message DetachedWorkFold {
  // How many entries were dropped off the FRONT to honour the cap. 0 means
  // the fold is complete and no "earlier entries" notice is drawn.
  int64 dropped_before = 1;
  // The cap the daemon applied, so a notice can name it and so a complete
  // fold is distinguishable from one capped at exactly the limit.
  int32 tail_cap = 2;
}

// One incremental push to ONE MESSAGE'S detached-work payload: the message id
// routes it, the arm types it.
//
// AN UPDATE, NOT A MESSAGE. It is addressed to a message that already exists
// and mutates that message's payload in place. It carries no uuid, no lineage
// and no timestamp of its own, because it is not a thing the feed contains —
// it is a change to a thing the feed already contains. Promoting each one to a
// Message would let an agent running for an hour insert a feed row per line,
// which is exactly what pagination cannot survive.
//
// Never a re-send of the whole message either: an agent running for an hour
// would otherwise re-transmit its entire transcript on every new line.
message DetachedWorkUpdate {
  // 1 KEPT its number but was renamed bubble_id -> message_id when detached
  // work stopped having an id space of its own. The name is reserved because
  // this surface is protojson on the wire, where the field NAME is the wire
  // token: "bubble_id" is retired and must never come back meaning something
  // else.
  reserved "bubble_id";

  // WHICH MESSAGE this lands on — the uuid of a Message whose payload is
  // DetachedWork. Must name a message the receiver has already opened; an
  // update for an unknown id is a gap and must be rejected loudly and resynced,
  // never buffered in the hope its message shows up.
  string message_id = 1;
  // WHAT changed. The arm MUST match the work's kind — a journal update
  // addressed to shell work is a daemon bug and is rejected, not coerced. Only
  // `liveness` is kind-independent.
  //
  // `shell` and `unclassified` are distinct arms carrying the SAME message:
  // the arm names which kind the update is for, while the payload is one byte
  // append at one offset in both cases. The two kinds differ in what they ARE,
  // not in how their output arrives, so there is no axis along which a
  // duplicated pair of append messages could evolve apart — only a
  // gap-detection rule that would have to be kept identical in two places.
  //
  // `merge` carries the SAME message as `agent` for exactly that reason: a
  // merge run's emissions arrive precisely as a detached agent's do, so the
  // arm names the kind while the payload has no axis to evolve apart on.
  oneof update {
    DetachedWorkAgentUpdate agent = 10;
    DetachedWorkJournalUpdate journal = 11;
    DetachedWorkOutputAppend shell = 12;
    DetachedWorkOutputAppend unclassified = 13;
    DetachedWorkLivenessUpdate liveness = 14;
    DetachedWorkAgentUpdate merge = 15;
    DetachedWorkSkillUpdate skill = 16;
  }
}

// New output from a detached agent.
message DetachedWorkAgentUpdate {
  // The emissions produced since the last update, in order. THE SAME message
  // the top-level feed carries — see AgentEmission. A frontend appends these
  // to the work's emission list and renders them with its ordinary feed
  // renderers.
  //
  // These are EMISSIONS APPENDED TO ONE MESSAGE, not messages of their own: a
  // detached agent's thousand lines are a thousand additions to one feed row.
  repeated AgentEmission emissions = 1;
  // The message's fold accounting AFTER applying this update. Restated rather
  // than deltaed: it is small, and a dropped-count that drifts is worse than
  // one that is re-sent.
  DetachedWorkFold fold = 2;
}

// One incremental push to a skill message. Body resolution and emission
// appends are different events with different lifetimes, so they are arms
// rather than co-set fields.
message DetachedWorkSkillUpdate {
  oneof update {
    // The skill file's contents, resolved. Replaces the message's `body`
    // whole; delivered once in the ordinary case.
    DetachedWorkSkillBodyResolved body = 1;
    // Emissions appended to the window, exactly as a detached agent's.
    DetachedWorkAgentUpdate emissions = 2;
  }
}

// The resolved skill file contents, whole. A message rather than a bare
// string so the arm can carry resolution-adjacent facts if the contract ever
// needs them without renumbering.
message DetachedWorkSkillBodyResolved {
  // The contents, verbatim.
  string contents = 1;
}

// New steps in a Workflow run's journal.
message DetachedWorkJournalUpdate {
  // Rows logged since the last update, in order.
  //
  // Rows are APPEND-ONLY and are never revised in place: a step that starts
  // running and later completes emits a running row and then a done row, and
  // the daemon does not rewrite history. A frontend that wants one row per
  // step collapses them by label; a frontend that wants the log renders them
  // all. Neither reading is imposed here.
  repeated DetachedWorkJournalRow rows = 1;
  // The message's fold accounting after applying this update.
  DetachedWorkFold fold = 2;
}

// New bytes on a spool: an APPEND TO ONE MESSAGE'S PAYLOAD.
//
// A byte append is emphatically not a message. It has no identity, no lineage
// and no place of its own in the feed; it is addressed to the message whose
// spool it extends (DetachedWorkUpdate.message_id) and is applied to that
// message's accumulating content.
message DetachedWorkOutputAppend {
  // The bytes, verbatim, to append.
  string text = 1;
  // The spool offset these bytes START at. MUST equal the message's current
  // DetachedWorkOutputSpool.through_offset; anything else is a gap. Carried
  // explicitly so a gap is detectable at all — a bare append cannot tell a
  // lost chunk from a quiet one.
  uint64 from_offset = 2;
}

// A liveness transition: live to settled, or a settled outcome changing (a
// running agent that is then killed).
message DetachedWorkLivenessUpdate {
  // The work's liveness after the transition.
  DetachedWorkLiveness liveness = 1;
}
