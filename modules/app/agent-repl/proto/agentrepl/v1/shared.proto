// shared.proto — The agentrepl.v1 declarations that are NOT any one UI
// component's props or events.
//
// MEMBERSHIP HERE IS "NOT A COMPONENT", NOT "SHARED BY SEVERAL COMPONENTS".
// feed.proto, topbar.proto, sidebar.proto and footer.proto each describe one
// surface's resolved props and the commands that surface sends. Nothing in
// this file does. What is here is the vocabulary and the plumbing those
// surfaces are written against: the closed session-command set, the failure
// vocabulary, the hibernation gate and its revival decision, the host-driver
// commands the Emacs host sends, session and daemon lifecycle, and the merge
// queue.
//
// Each section below keeps the header of the file it came from, verbatim.

syntax = "proto3";

package agentrepl.v1;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";
import "shim/v1/core.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// ==========================================================================
// SHARED VOCABULARY: the closed session-command set.
//
// MOVED HERE FROM frontend.v1's slash-menu.proto, unchanged, for the
// same reason tokens.proto moved: a durable record names one of these
// (DaemonAnsweredCommand), and a stored conversation record cannot depend on
// the daemon's resolved output surface. The menu that renders the set is a
// frontend concern; the set itself is not.
//
// This is one of the few enums the repo permits. The forbidden case is a STATE
// enum — a phase, status, or condition, which is always a oneof of dedicated
// messages. A command identity is not a state of anything: it is a closed set
// of names, which is exactly what an enum is for.
// ==========================================================================

// Everything about a session command that is a FACT rather than an event: how
// it is spelled, and whether text after the name belongs to it.
//
// Carried as an enum-value OPTION below rather than as traffic, because no
// frame carries these facts and every process needs the same answer to them —
// the daemon to recognize a submitted prompt, the webapp to complete and to
// label one. The three hand-written copies this replaces (the daemon's
// recognition table, the webapp's SESSION_COMMANDS list, the webapp's
// SESSION_COMMAND_LABELS table) had nothing comparing them, so they drifted:
// each was correct on its own and none of them agreed.
message SessionCommandSpec {
  // The command as the user TYPES it, leading slash included — and also the
  // form a reader is shown. One field for both so a corrected spelling cannot
  // land in the recognizer while the webapp chip keeps rendering the old one.
  string literal = 1;

  // Whether text following the name is an ARGUMENT to this command rather
  // than prose the user wrote.
  //
  // FALSE IS THE DEFAULT AND FALSE IS THE SAFE SIDE. A command that takes no
  // argument is recognized only as an ENTIRE prompt, so "/status of the build"
  // stays a prompt and keeps its user message. Marking a command that takes
  // none as taking some is the one way this table can swallow something a user
  // genuinely meant to say to the agent — an unrecoverable loss, since a
  // suppressed prompt is never recovered later.
  bool takes_args = 2;
}

// Attaches a spec to the enum value that names the command. An extension
// because the facts belong to the SCHEMA and there is no other construct that
// keeps them there: a Go map, a TypeScript array and a proto enum can be kept
// consistent only by whoever remembers all three, whereas an option is read
// back by reflection from the one definition.
extend google.protobuf.EnumValueOptions {
  SessionCommandSpec session_command_spec = 60002;
}

// A slash command the CLI answers ITSELF, rather than a prompt for the agent.
//
// THE CLOSED SET IS THE POINT. The daemon recognizes a submitted prompt as one
// of these before it forwards it (sessioncontroller/sessioncommand.go), and a
// recognized command earns NO user message — so the set of things that can
// suppress one is exactly the set of names below, fixed on the wire and
// reviewable in one place. A command that is not here is a prompt, and a
// prompt is always drawn.
//
// A custom command (a skill, a project command) is deliberately absent and
// always will be: those EXPAND into a prompt for the agent, so the text the
// user typed really is the turn's opening and really does belong in the feed.
enum SessionCommand {
  // Never set by the daemon. A receiver seeing UNSPECIFIED is looking at a
  // malformed frame and must reject it loudly rather than pick a command.
  //
  // It carries NO spec, deliberately: it names no command, so there is no
  // literal to spell and nothing a recognizer could ever match it against.
  SESSION_COMMAND_UNSPECIFIED = 0;
  SESSION_COMMAND_CLEAR = 1 [(session_command_spec) = {literal: "/clear"}];
  SESSION_COMMAND_COMPACT = 2 [(session_command_spec) = {literal: "/compact", takes_args: true}];
  SESSION_COMMAND_MODEL = 3 [(session_command_spec) = {literal: "/model", takes_args: true}];
  SESSION_COMMAND_COST = 4 [(session_command_spec) = {literal: "/cost"}];
  SESSION_COMMAND_USAGE = 5 [(session_command_spec) = {literal: "/usage"}];
  SESSION_COMMAND_STATUS = 6 [(session_command_spec) = {literal: "/status"}];
  SESSION_COMMAND_CONTEXT = 7 [(session_command_spec) = {literal: "/context"}];
  SESSION_COMMAND_CONFIG = 8 [(session_command_spec) = {literal: "/config"}];
  SESSION_COMMAND_HELP = 9 [(session_command_spec) = {literal: "/help"}];
  SESSION_COMMAND_DOCTOR = 10 [(session_command_spec) = {literal: "/doctor"}];
  SESSION_COMMAND_LOGIN = 11 [(session_command_spec) = {literal: "/login"}];
  SESSION_COMMAND_LOGOUT = 12 [(session_command_spec) = {literal: "/logout"}];
  SESSION_COMMAND_MEMORY = 13 [(session_command_spec) = {literal: "/memory"}];
  SESSION_COMMAND_PERMISSIONS = 14 [(session_command_spec) = {literal: "/permissions"}];
  SESSION_COMMAND_AGENTS = 15 [(session_command_spec) = {literal: "/agents"}];
  SESSION_COMMAND_MCP = 16 [(session_command_spec) = {literal: "/mcp"}];
  SESSION_COMMAND_HOOKS = 17 [(session_command_spec) = {literal: "/hooks"}];
  SESSION_COMMAND_OUTPUT_STYLE = 18 [(session_command_spec) = {literal: "/output-style", takes_args: true}];
  SESSION_COMMAND_RELEASE_NOTES = 19 [(session_command_spec) = {literal: "/release-notes"}];
  SESSION_COMMAND_TODOS = 20 [(session_command_spec) = {literal: "/todos"}];
  SESSION_COMMAND_EXPORT = 21 [(session_command_spec) = {literal: "/export", takes_args: true}];
  SESSION_COMMAND_ADD_DIR = 22 [(session_command_spec) = {literal: "/add-dir", takes_args: true}];
  SESSION_COMMAND_RESUME = 23 [(session_command_spec) = {literal: "/resume", takes_args: true}];
  SESSION_COMMAND_EXIT = 24 [(session_command_spec) = {literal: "/exit"}];
  SESSION_COMMAND_PRIVACY_SETTINGS = 25 [(session_command_spec) = {literal: "/privacy-settings"}];
  SESSION_COMMAND_STATUSLINE = 26 [(session_command_spec) = {literal: "/statusline"}];
  SESSION_COMMAND_TERMINAL_SETUP = 27 [(session_command_spec) = {literal: "/terminal-setup"}];
  SESSION_COMMAND_VIM = 28 [(session_command_spec) = {literal: "/vim"}];
  SESSION_COMMAND_REWIND = 29 [(session_command_spec) = {literal: "/rewind"}];
  SESSION_COMMAND_BUG = 30 [(session_command_spec) = {literal: "/bug"}];
}

// ==========================================================================
// THE FAILURE VOCABULARY.
//
// One closed oneof naming every way work can fail, plus the typed evidence
// each kind carries. It is a VOCABULARY FILE, not a component file: nothing
// here describes a card, a row or a cell. Surfaces embed FailureKind in their
// own resolved props and render it their own way — the feed's card
// (feed.proto), the footer's row (footer.proto), the roster's notice
// (sidebar.proto). One vocabulary, per-surface carriers, exactly as
// tokens.proto is one economics vocabulary behind several resolved views.
//
// WHY KINDS AND NOT A CLASS PLUS A STRING. A failure is a CONDITION, and a
// condition is what a oneof is for. Naming the kind on the wire means a
// consumer that meets an unfamiliar failure fails to match it instead of
// silently rendering it as something else, and it means each kind carries the
// evidence that kind actually has rather than a shared free-text field that
// every producer packs differently and every consumer parses differently.
//
// THE MACHINERY/VENDOR DISTINCTION IS CARRIED BY THE ARM, not by a second
// field. Every kind belongs to exactly one side — agent-repl's own machinery
// failing, or the vendor refusing or concluding the work — and each arm's
// comment states its side and the workspace color that side resolves to. A
// separate class field would be a fact derivable from the arm, which is a fact
// that can disagree with the arm.
// ==========================================================================

// The vendor conversation and request a vendor-side failure pertains to.
//
// This is CONTENT, not addressing: it is a set of facts a card may show so the
// user can find the conversation or quote the request when asking for help.
// Nothing routes on it and nothing compares it.
message VendorFailureContext {
  // The vendor conversation, verbatim. Empty when the failure happened before
  // one existed.
  string claude_session_id = 1;
  // The vendor's request correlation id, for quoting in a support report.
  // Empty when the request never got one.
  string api_request_id = 2;
  // The vendor's message id, when the failure names a specific response.
  string api_message_id = 3;
}

// WHAT failed. Exactly one arm is always set; an unset FailureKind is a
// malformed frame and must be rejected rather than rendered as a generic
// error.
//
// TWO PRODUCERS. The daemon mints every arm below 100 — it is the only thing
// that can see the shim, the store or the vendor. A frontend mints the arms
// from 100 up, and ONLY those: they are the failures of the frontend's own
// machinery, which the daemon cannot observe. The split is by number so it
// cannot drift, and neither producer may set the other's arms.
message FailureKind {
  oneof kind {

    // ---- MACHINERY failures: agent-repl's own plumbing did not work. Nothing about
    // the account is implicated and no amount of waiting or re-authenticating
    // helps. This side of the vocabulary resolves the workspace BLUE. ----
    // The agent process is not connected.
    FailureShimNotConnected shim_not_connected = 1;
    // The agent process received the request and refused it.
    FailureShimRejected shim_rejected = 2;
    // The agent process never acknowledged the request within its window.
    FailureShimAckTimeout shim_ack_timeout = 3;
    // The agent process speaks a different protocol version than the daemon.
    FailureShimVersionMismatch shim_version_mismatch = 4;
    // The agent process's event stream went backwards.
    FailureShimSeqRegression shim_seq_regression = 5;
    // No traffic is arriving from the agent process.
    FailureShimDegraded shim_degraded = 6;
    // The agent process could not write to the store, so conversation is being dropped rather than persisted.
    FailureShimStoreWriteRejected shim_store_write_rejected = 7;
    // The agent sdk query ended unexpectedly — the session is alive but the thing that drives it stopped.
    FailureQueryTermination query_termination = 8;
    // No agent process was ever started for this workspace, so there is nothing to talk to yet.
    FailureShimNotSpawned shim_not_spawned = 9;
    // The agent process connected but never finished wiring up, so it is present without being usable.
    FailureShimHandshakeIncomplete shim_handshake_incomplete = 10;
    // The agent process reported itself unhealthy — a self-diagnosis, not an inference from silence.
    FailureShimUnhealthy shim_unhealthy = 11;
    // Bring-up did not finish connecting in time.
    FailureSessionNotEstablished session_not_established = 12;
    // The command addressed something this workspace no longer runs.
    FailureWorkspaceNotLive workspace_not_live = 13;
    // The workspace's session was deleted deliberately.
    FailureSessionDeleted session_deleted = 14;
    // A new session took over this workspace, so the previous one was stopped.
    FailureSessionSuperseded session_superseded = 15;
    // This view is behind: the workspace's live connection changed under it, and the replay it asked for would have come from a generation it never saw.
    FailureReconnectSuperseded reconnect_superseded = 16;
    // The agent process exited.
    FailureSessionShimDied session_shim_died = 17;
    // The session could not be started at all.
    FailureSessionStartFailed session_start_failed = 18;
    // The vendor conversation could not be resumed without breaking continuity.
    FailureSessionResumeFailed session_resume_failed = 19;
    // This workspace has a vendor conversation that could not be reached, and a blank one will not be started in its place.
    FailureConversationUnresumable conversation_unresumable = 20;
    // The client asked for a resume mode the daemon no longer supports.
    FailureResumeModeRetired resume_mode_retired = 21;
    // The session ended for a reason the daemon could not classify.
    FailureSessionEndedUnclassified session_ended_unclassified = 22;
    // A history re-pull is already running, so a second one was refused.
    FailureHistoryRepullInFlight history_repull_in_flight = 23;
    // The history re-pull ended before it reached the live window, so what is on screen has a gap in it.
    FailureHistoryReplayTruncated history_replay_truncated = 24;
    // The stop could not be delivered, so the turn is still running.
    FailureInterruptUndelivered interrupt_undelivered = 25;
    // The queued prompt has no attached agent process yet, so it cannot run.
    FailureQueueEntryUnwired queue_entry_unwired = 26;
    // The queued prompt is waiting on a cache keep-alive response and cannot be forced ahead of it.
    FailureQueueEntryKeepAliveHeld queue_entry_keep_alive_held = 27;
    // The workspace is hibernated; a revival decision is required before prompts are accepted.
    FailureSessionHibernated session_hibernated = 28;
    // A cache keep-alive window could not be closed, so new conversation is withheld until it is repaired.
    FailureKeepAliveWindowUnclosed keep_alive_window_unclosed = 29;
    // A cache keep-alive window ended before it began, so the daemon's own keep-alive turn may appear in the conversation.
    FailureKeepAliveWindowInverted keep_alive_window_inverted = 30;
    // A compaction re-read the whole conversation at the uncached rate instead of from the prompt cache — the exact cost compaction exists to avoid.
    FailureCompactionColdRead compaction_cold_read = 31;
    // A browser log record arrived against a workspace state that had already moved on, so it was not recorded.
    FailureClientLogIdentityStale client_log_identity_stale = 32;
    // Agent-repl's own machinery failed in a way it could not classify.
    FailureInternalUnclassified internal_unclassified = 33;

    // ---- VENDOR failures: the SDK or the vendor backend refused or concluded the
    // work. Releasing it needs a human or the vendor, never a retry. This side
    // of the vocabulary resolves the workspace PURPLE. ----
    // Authentication failed.
    FailureApiAuthenticationFailed api_authentication_failed = 34;
    // A billing problem stopped the request.
    FailureApiBillingError api_billing_error = 35;
    // The account is rate limited.
    FailureApiRateLimit api_rate_limit = 36;
    // The vendor rejected the request as invalid.
    FailureApiInvalidRequest api_invalid_request = 37;
    // The vendor returned a server error.
    FailureApiServerError api_server_error = 38;
    // The vendor is overloaded.
    FailureApiOverloaded api_overloaded = 39;
    // This organization is not allowed to use the api.
    FailureApiOAuthOrgNotAllowed api_oauth_org_not_allowed = 40;
    // The requested model does not exist.
    FailureApiModelNotFound api_model_not_found = 41;
    // The network never reached the vendor.
    FailureApiNetworkDown api_network_down = 42;
    // The vendor request failed for a reason with no more specific kind.
    FailureApiRequestFailed api_request_failed = 43;
    // The vendor failed for a reason the daemon could not classify.
    FailureApiUnknown api_unknown = 44;
    // The response hit the output-token ceiling.
    FailureApiMaxOutputTokens api_max_output_tokens = 45;
    // The turn hit its maximum-turns limit.
    FailureApiMaxTurns api_max_turns = 46;
    // The turn hit its budget limit.
    FailureApiMaxBudget api_max_budget = 47;
    // The turn aborted during execution.
    FailureApiExecutionError api_execution_error = 48;
    // The model refused the request.
    FailureApiRefusal api_refusal = 49;
    // The turn ended abnormally for a reason with no more specific kind.
    FailureApiTurnFailed api_turn_failed = 50;

    // ---- MACHINERY, continued. ----
    // The daemon refused a user prompt because the workspace's merge machinery holds the session.
    FailurePromptRefusedByMergeState prompt_refused_by_merge_state = 51;
    // The queued prompt is waiting behind a context cut, which is never interrupted, so it cannot be forced ahead of it.
    FailureQueueEntryUninterruptibleTurn queue_entry_uninterruptible_turn = 52;
    // A turn stood bound with nothing driving it, so the daemon closed it rather than leaving the workspace thinking forever.
    FailureTurnUndriven turn_undriven = 53;
    // The replay mark the client asked from counts in a store seq space the vendor session retired, so no delta above it exists and the client must re-anchor from the conversation's tail.
    FailureReplayMarkRetired replay_mark_retired = 54;

    // ---- CLIENT-LOCAL failures: the one part of this vocabulary a frontend
    // mints itself. See the note on FailureKind. All resolve BLUE, because a
    // frontend can only ever observe its own machinery failing.
    // The daemon never sets one of these arms.
    FailureDaemonUnreachable daemon_unreachable = 55;
    FailureWorkspaceGone workspace_gone = 56;
    FailureBootFailed boot_failed = 57;
    FailureControlPlaneFailed control_plane_failed = 58;
    FailureFrameUndecodable frame_undecodable = 59;
    FailureStaleBundle stale_bundle = 60;
    FailureCommandUnsent command_unsent = 61;
    FailureCommandRejectionUnclassified command_rejection_unclassified = 62;
  }
}

// The agent process is not connected. Nothing was delivered and nothing was lost; the command simply had nowhere to go.
//
// Resolves the workspace BLUE.
message FailureShimNotConnected {}

// The agent process received the request and refused it.
//
// Resolves the workspace BLUE.
message FailureShimRejected {
  // The request the shim refused, so the card can name what was rejected.
  string request_id = 1;
  // The shim's own stated reason, verbatim.
  string reason = 2;
}

// The agent process never acknowledged the request within its window. Whether it ran is unknown, which is the point of saying so.
//
// Resolves the workspace BLUE.
message FailureShimAckTimeout {
  // The request that went unacknowledged.
  string request_id = 1;
  // How long the daemon waited, milliseconds.
  int64 waited_ms = 2;
}

// The agent process speaks a different protocol version than the daemon. Both versions are named because the fix is to align them and the user needs to know which way.
//
// Resolves the workspace BLUE.
message FailureShimVersionMismatch {
  string shim_version = 1;
  string daemon_version = 2;
}

// The agent process's event stream went backwards. A sequence that regresses means events were replayed or lost, so the conversation on screen may not be the conversation that happened.
//
// Resolves the workspace BLUE.
message FailureShimSeqRegression {
  // The sequence number that arrived.
  uint64 seq = 1;
  // The highest sequence already seen, which it should have exceeded.
  uint64 last_seen_seq = 2;
}

// No traffic is arriving from the agent process. WINDOW-SHAPED: it opens when the silence starts and resolves when traffic returns.
//
// Resolves the workspace BLUE.
message FailureShimDegraded {
  // Which part of the connection went quiet.
  string component = 1;
}

// The agent process could not write to the store, so conversation is being dropped rather than persisted.
//
// Resolves the workspace BLUE.
message FailureShimStoreWriteRejected {
  // Which writer was rejected.
  string component = 1;
  // The store's stated reason, verbatim.
  string reason = 2;
  // How many records were dropped while this was open. The count is the
  // severity: one is a hiccup, thousands is a lost conversation.
  int64 dropped_count = 3;
}

// The agent SDK query ended unexpectedly — the session is alive but the thing that drives it stopped.
//
// Resolves the workspace BLUE.
message FailureQueryTermination {
  // Exact query-lifecycle evidence.
  QueryTerminationFailure detail = 1;
}

// No agent process was ever started for this workspace, so there is nothing to talk to yet.
//
// Resolves the workspace BLUE.
message FailureShimNotSpawned {}

// The agent process connected but never finished wiring up, so it is present without being usable.
//
// Resolves the workspace BLUE.
message FailureShimHandshakeIncomplete {
  // The request that found it half-wired.
  string request_id = 1;
  // The transport failure underneath, verbatim.
  string cause = 2;
}

// The agent process reported ITSELF unhealthy — a self-diagnosis, not an inference from silence.
//
// Resolves the workspace BLUE.
message FailureShimUnhealthy {
  string request_id = 1;
  // The component the shim named as unhealthy.
  string component = 2;
  // The shim's stated reason, verbatim.
  string reason = 3;
}

// Bring-up did not finish connecting in time.
//
// Resolves the workspace BLUE.
message FailureSessionNotEstablished {
  // What the wait ended with, verbatim.
  string cause = 1;
}

// The command addressed something this workspace no longer runs. The staleness itself is the whole fact: the fence already says the client is behind, and naming what replaced what would hand a renderer an identity it has no use for.
//
// Resolves the workspace BLUE.
message FailureWorkspaceNotLive {}

// The workspace's session was deleted deliberately. Not a fault — an account of why the conversation stopped.
//
// Resolves the workspace BLUE.
message FailureSessionDeleted {}

// A new session took over this workspace, so the previous one was stopped. A workspace keeps exactly one live session at a time.
//
// Resolves the workspace BLUE.
message FailureSessionSuperseded {}

// This view is behind: the workspace's live connection changed under it, and the replay it asked for would have come from a generation it never saw.
//
// Resolves the workspace BLUE.
message FailureReconnectSuperseded {
  // What the user can do about it, composed daemon-side (the reload path
  // differs per host). Rendered verbatim; empty when there is no action to
  // offer.
  string remedy = 1;
}

// The agent process exited.
//
// Resolves the workspace BLUE.
message FailureSessionShimDied {}

// The session could not be started at all.
//
// Resolves the workspace BLUE.
message FailureSessionStartFailed {
  // The bring-up failure, verbatim.
  string cause = 1;
}

// The vendor conversation could not be resumed without breaking continuity.
//
// Resolves the workspace BLUE.
message FailureSessionResumeFailed {
  // Exact resume-continuity evidence.
  SessionResumeFailure detail = 1;
}

// This workspace has a vendor conversation that could not be reached, and a blank one will NOT be started in its place. Refusing is the feature: silently starting fresh is how a conversation gets lost.
//
// Resolves the workspace BLUE.
message FailureConversationUnresumable {
  // The vendor conversation that must remain authoritative. CONTENT: the
  // card shows it so the user can find the transcript themselves.
  string claude_session_id = 1;
  // Where the transcript was looked for.
  string cwd = 2;
  // The account root searched. Empty means the daemon's inherited root.
  string config_dir = 3;
  // Why it could not be reached, verbatim.
  string reason = 4;
}

// The client asked for a resume mode the daemon no longer supports. The client is out of date and needs updating.
//
// Resolves the workspace BLUE.
message FailureResumeModeRetired {}

// The session ended for a reason the daemon could not classify. Its own inability to explain is the fact, and it is stated rather than dressed as one of the known endings.
//
// Resolves the workspace BLUE.
message FailureSessionEndedUnclassified {
  // The raw reason as recorded, so the account is not lost just because it
  // was not understood.
  string raw_reason = 1;
}

// A history re-pull is already running, so a second one was refused.
//
// Resolves the workspace BLUE.
message FailureHistoryRepullInFlight {}

// The history re-pull ended before it reached the live window, so what is on screen has a gap in it.
//
// Resolves the workspace BLUE.
message FailureHistoryReplayTruncated {
  // Where the replay started.
  uint64 from_seq = 1;
  // Where it was meant to reach.
  uint64 stop_at_seq = 2;
  // How many records it actually delivered.
  int64 delivered = 3;
  // Why it stopped short, verbatim.
  string reason = 4;
}

// The client's replay mark belongs to a RETIRED store seq space, so the delta it
// asked for cannot exist and the daemon refused the read instead of replaying.
//
// WHY THIS IS A REFUSAL AND NOT A REPLAY. When the vendor rotates its session
// uuid the conversation restarts its store seq space at 1, and every mark the
// client counted in the old space becomes a number with no meaning here. The
// daemon used to floor such a mark and serve everything above the floor, which
// for a rotated conversation is the WHOLE conversation — the full replay paging
// exists to end, re-inflicted on every reconnect. The mark is unanswerable, so
// it is refused, and the client re-anchors from a tail page instead.
//
// THE CLIENT'S OBLIGATION on receiving this is to REPLACE its conversation from
// a fresh tail page, never to append to it: the history it holds is ranked in
// the retired space and the new space's items would sort above it.
//
// Resolves the workspace BLUE: nothing was lost and nothing failed — the client
// asked a question that no longer has an answer, and is told which one to ask.
message FailureReplayMarkRetired {
  // The mark the client asked from, in the retired space.
  uint64 from_seq = 1;
  // The highest seq the LIVE space has produced, which is the ceiling any
  // honest mark sits at or below. It is the evidence, not a mark to adopt: a
  // client re-anchors from a tail page, whose live_join_seq is the only mark
  // the daemon offers it.
  uint64 live_last_seq = 2;
}

// The stop could not be delivered, so the turn is still running.
//
// Resolves the workspace BLUE.
message FailureInterruptUndelivered {}

// The queued prompt has no attached agent process yet, so it cannot run.
//
// Resolves the workspace BLUE.
message FailureQueueEntryUnwired {
  // Which queued entry, so the card addresses the right row.
  string entry_id = 1;
  // Which of the unwired conditions it is, verbatim.
  string reason = 2;
}

// The queued prompt is waiting on a cache keep-alive response and cannot be forced ahead of it.
//
// Resolves the workspace BLUE.
message FailureQueueEntryKeepAliveHeld {
  string entry_id = 1;
  // The keep-alive turn whose completion releases it.
  string keep_alive_turn_id = 2;
}

// The workspace is hibernated; a revival decision is required before prompts are accepted.
//
// Resolves the workspace BLUE.
message FailureSessionHibernated {
  // When it went to sleep, unix millis.
  int64 since_ms = 1;
}

// A cache keep-alive window could not be closed, so new conversation is withheld until it is repaired.
//
// Resolves the workspace BLUE.
message FailureKeepAliveWindowUnclosed {
  // The repair-relevant detail, verbatim.
  string reason = 1;
}

// A cache keep-alive window ended before it began, so the daemon's own keep-alive turn may appear in the conversation.
//
// Resolves the workspace BLUE.
message FailureKeepAliveWindowInverted {
  string reason = 1;
}

// A compaction re-read the whole conversation at the uncached rate instead of from the prompt cache — the exact cost compaction exists to avoid.
//
// Resolves the workspace BLUE.
message FailureCompactionColdRead {
  // What it cost, so the card states the waste rather than alluding to it.
  int64 uncached_input_tokens = 1;
}

// A browser log record arrived against a workspace state that had already moved on, so it was not recorded.
//
// Resolves the workspace BLUE.
message FailureClientLogIdentityStale {}

// Agent-repl's own machinery failed in a way it could not classify. Stated as unclassified rather than filed under a neighbouring kind, because a wrong name is worse than an honest absence.
//
// Resolves the workspace BLUE.
message FailureInternalUnclassified {
  // The failure, verbatim.
  string cause = 1;
}

// Authentication failed. The account, not the machinery, is what is blocked.
//
// Resolves the workspace PURPLE.
message FailureApiAuthenticationFailed {
  // The vendor conversation and request this failure pertains to.
  VendorFailureContext vendor = 1;
  // The HTTP status the vendor returned. 0 when the request never got one.
  int32 http_status = 2;
  // How many attempts were made before giving up. 0 means it was not retried.
  int32 attempts = 3;
}

// A billing problem stopped the request.
//
// Resolves the workspace PURPLE.
