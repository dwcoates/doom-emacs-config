}

// The turn ended abnormally for a reason with no more specific kind.
//
// Resolves the workspace PURPLE.
message FailureApiTurnFailed {
  // The vendor conversation and request this failure pertains to.
  VendorFailureContext vendor = 1;
  // The vendor's own stop reason, verbatim, since this kind is exactly the
  // case where it did not map to a named one.
  string stop_reason = 2;
}

// The daemon refused a USER prompt because the workspace's merge machinery
// holds the session: it is queued for, running, or resolving a merge. The
// prompt was not lost and nothing is broken — the session answers again when
// the merge resolves, or when the user interrupts/evicts it. Machinery
// prompts (cache keep-alive, warm compaction) are exempt while the workspace
// is merely queued and never produce this failure.
//
// Resolves the workspace BLUE.
message FailurePromptRefusedByMergeState {
  // The merge phase that owned the session at refusal, as the composite
  // render-state name, verbatim (e.g. "RENDER_STATE_MERGE_QUEUED") — display
  // evidence, never parsed.
  string state = 1;
}

// A turn stood bound with nothing driving it, so the daemon closed it rather
// than leaving the workspace thinking forever.
//
// Resolves the workspace BLUE.
message FailureTurnUndriven {
  // Which turn, and how long it stood undriven, verbatim.
  string reason = 1;
}

// The queued prompt is waiting behind a context cut, which is never
// interrupted, so it cannot be forced ahead of it.
//
// Resolves the workspace BLUE.
message FailureQueueEntryUninterruptibleTurn {
  // Which queued entry, so the card addresses the right row.
  string entry_id = 1;
  // The cut that is running, so the card can name what the prompt is behind.
  SessionCommand command = 2;
}

// The connection to the daemon dropped and the frontend is reconnecting.
// WINDOW-SHAPED and RETRACTED rather than resolved: when the connection comes
// back the card is removed outright, because a settled "we were disconnected"
// notice is noise about something the user can already see ended.
//
// Resolves the workspace BLUE.
message FailureDaemonUnreachable {
  // The socket close code, so the card distinguishes a deliberate close from
  // a dropped one.
  int32 close_code = 1;
  // The close reason as the transport gave it. Empty when it gave none.
  string close_reason = 2;
}

// The workspace this page is addressed to no longer exists on the daemon.
// Never resolves: unlike a dropped connection, there is nothing to come back.
//
// Resolves the workspace BLUE.
message FailureWorkspaceGone {}

// The frontend could not start at all.
//
// It is the one failure that cannot be carried the way the others are — the
// machinery that would carry it is the machinery that failed to build. A
// frontend renders it from whatever it has, before any state exists.
//
// Resolves the workspace BLUE.
message FailureBootFailed {
  // Whatever the frontend caught, verbatim.
  string cause = 1;
}

// A control-plane request the frontend issued outside the command stream (a
// login, an account switch) failed.
//
// Resolves the workspace BLUE.
message FailureControlPlaneFailed {
  // Which request, in the frontend's own words, so repeats of DIFFERENT
  // requests do not reconcile onto one card.
  string what = 1;
  // The failure, verbatim.
  string cause = 2;
}

// A frame from the daemon could not be read and was skipped. Conversation may
// be missing as a result, which is why it is a card rather than a log line.
//
// Resolves the workspace BLUE.
message FailureFrameUndecodable {
  // The decode failure, verbatim.
  string cause = 1;
  // The head of the frame that would not decode, for whoever debugs it.
  string frame_head = 2;
}

// This page cannot read the daemon's state and reloading did not fix it.
// Deliberately loud and DELIBERATELY UNRESOLVABLE: the only exit is restarting
// the view, and offering a self-clearing version of this would hide a page
// that is silently wrong.
//
// Resolves the workspace BLUE.
message FailureStaleBundle {
  // What did not line up, verbatim.
  string detail = 1;
}

// A command was never put on the wire because the connection was down. The
// distinction from a refusal is the whole point: nothing was decided, so
// retrying is meaningful.
//
// Resolves the workspace BLUE.
message FailureCommandUnsent {
  // Which command went unsent.
  string command = 1;
}

// A command was refused and the daemon's refusal carried no classified
// account. The frontend states that it could not classify the refusal rather
// than picking a kind on the daemon's behalf.
//
// Resolves the workspace BLUE.
message FailureCommandRejectionUnclassified {
  // Which command was refused.
  string command = 1;
  // The daemon's own refusal text, verbatim. Empty when it gave none.
  string daemon_reason = 2;
}

// Machine-readable evidence that an SDK query terminated unexpectedly.
//
// This message repeats the durable lifecycle record's identity and uses the
// same typed reason messages, allowing a frontend to diagnose the termination
// without reconstructing evidence from generic failure prose.
//
// THE ONLY IDENTITIES ON THIS RECORD ARE ONES A CARD CAN SHOW: the query
// invocation that died, and the VENDOR conversation it was driving. An
// agent-repl session identity is deliberately absent — a rendering frontend
// has no vocabulary for one, so it could only carry it, never use it.
message QueryTerminationFailure {
  // The unique query() invocation that terminated.
  string query_instance_id = 1;

  // Identifies the vendor conversation when query initialization exposed it,
  // or states explicitly that termination preceded vendor identity discovery.
  oneof vendor_identity {
    // The non-empty authoritative Claude conversation UUID for the query.
    string vendor_session_id = 2;

    // Records that the query ended before the SDK exposed a vendor session.
    shim.v1.VendorSessionIdentityUnavailable vendor_session_identity_unavailable = 3;
  }

  // The Unix epoch time at which the termination was observed.
  int64 observed_at_ms = 4;

  // Identifies the unexpected termination condition without a status enum.
  oneof reason {
    // The SDK iterator ended without an intentional shim shutdown.
    shim.v1.UnexpectedQueryEof unexpected_eof = 5;

    // The SDK iterator threw an error, including its complete cause.
    shim.v1.QueryIteratorFailure iterator_failure = 6;

    // Query initialization failed, including its complete cause.
    shim.v1.QueryStartupFailure startup_failure = 7;
  }
}

// Machine-readable evidence that a requested Claude conversation could not
// be resumed without violating conversation continuity.
//
// It names the VENDOR conversation and nothing else, for the same reason
// QueryTerminationFailure does: the vendor conversation is what the card
// shows, and an agent-repl session identity is a vocabulary a rendering
// frontend does not have.
message SessionResumeFailure {
  // The exact Claude conversation UUID that must remain authoritative.
  string claude_session_id = 1;
  // The working directory used to locate the Claude transcript.
  string cwd = 2;
  // The configured Claude account root. Empty means the daemon's inherited
  // Claude configuration root supplies the value.
  string config_dir = 3;
  // The absolute Claude configuration root used for transcript lookup.
  string resolved_config_dir = 4;
  // Identifies the operation whose continuity requirement could not be met.
  oneof attempt {
    // A frontend requested a session that continues a durable conversation.
    SessionResumeFailureCreate create = 5;
    // A durable agent-repl session required shim reconstruction.
    SessionResumeFailureAutomaticRestore automatic_restore = 6;
  }
  // Identifies the concrete continuity invariant that prevented restoration.
  oneof cause {
    // No readable transcript exists for the authoritative Claude UUID.
    SessionResumeFailureTranscriptUnavailable transcript_unavailable = 7;
    // A recovery attempt proposed a different Claude UUID or a fresh session.
    SessionResumeFailureIdentityMismatch identity_mismatch = 8;
    // The exact resumed SDK query terminated before becoming driveable.
    QueryTerminationFailure query_termination = 9;
    // Bring-up failed before exact query-termination evidence was available.
    SessionResumeFailureBringUpFailure bring_up_failure = 10;
  }
}

// Marks a resume failure encountered while creating an agent-repl session.
message SessionResumeFailureCreate {}

// Marks a resume failure encountered while restoring an allocated agent-repl
// session.
message SessionResumeFailureAutomaticRestore {}

// Records every transcript location examined for the authoritative Claude
// conversation UUID.
message SessionResumeFailureTranscriptUnavailable {
  // Absolute transcript paths that were checked and found unavailable.
  repeated string searched_paths = 1;
}

// Records a rejected recovery attempt that would have resumed another Claude
// conversation.
message SessionResumeFailureIdentityMismatch {
  // The replacement Claude UUID proposed by recovery. Empty means recovery
  // would have started a fresh conversation.
  string replacement_claude_session_id = 1;
}

// Records an exact-resume bring-up failure that has no typed query lifecycle
// record. The original nonblank cause is retained without classifying the
// command as an unrelated internal failure.
message SessionResumeFailureBringUpFailure {
  // The complete cause returned by the driveability gate.
  string cause = 1;
}

// ==========================================================================
// The hibernation gate and the user's revival decision.
// ==========================================================================

// Why and since when a session is hibernated. Exists so the revival gate can
// tell the user what put the session to sleep, and so forced and automatic
// hibernation remain distinguishable facts in every snapshot.
message HibernationDetail {
  // When the session entered hibernation, unix millis.
  int64 since_ms = 1;
  oneof cause {
    // The keep-alive loop reached its configured maximum: idle time crossed
    // the cutoff, so the daemon stopped pinging and hibernated in the same
    // transition (the two are one act by construction).
    HibernationIdleCutoff idle_cutoff = 2;
    // The user forced it via HibernateWorkspaceCmd.
    HibernationForced forced = 3;
    // The keep-alive loop discovered, at a time-since check against the
    // durably recorded last turn end, that the expected cache TTL had
    // already elapsed before a ping could fire (laptop sleep, daemon
    // downtime). Pinging a cold cache would pay full re-ingest cost for
    // nothing, so the discovery IS the hibernate transition — reported
    // loudly to the user rather than silently absorbed.
    HibernationCacheExpired cache_expired = 4;
  }
}

// Automatic hibernation at the idle cutoff.
message HibernationIdleCutoff {
  // The configured cutoff that tripped, millis — carried so the gate can say
  // "asleep after Nh idle" without the frontend knowing daemon config.
  int64 cutoff_ms = 1;
}

// User-forced hibernation. Empty: the cause IS the arm.
message HibernationForced {}

// Hibernation because the cache went cold before a ping could fire.
message HibernationCacheExpired {
  // How long the session had actually been idle when the check ran, millis.
  int64 elapsed_ms = 1;
  // The expected cache TTL the elapsed time exceeded, millis.
  int64 ttl_ms = 2;
}

// The user's revival decision for a hibernated workspace. Revival is LAZY and
// GATED: the daemon nacks SubmitPromptCmd on a hibernated session, so no
// model use can precede this choice — a rendering frontend draws the gate
// from WorkspaceGateView (the host draws it from its session catalog) and
// sends exactly one of these. The daemon brings
// the session up along the ordinary create/resume path and, under either
// gated mode — compact_first or clear — drives that context cut to completion
// before accepting any prompt.
message ReviveSessionCmd {
  // The choice is a oneof of empty messages, not a bool: "no decision" must
  // be unrepresentable on the wire, and a third revival mode later is a new
  // arm rather than a second flag.
  oneof mode {
    // Compact the conversation as the first order of business; prompts are
    // accepted only after compaction lands. This pays the full-context cost
    // ONCE (compaction is a model call over the whole history) instead of on
    // every subsequent turn. Its own CompactionScope says how much of the
    // conversation the compaction may summarize away.
    ReviveCompactFirst compact_first = 1;
    // Resume the conversation as-is, full accumulated context and all. The
    // deliberate "I know it's big" path.
    ReviveDirect direct = 2;
    // Discard the conversation outright as the first order of business:
    // `/clear`, and nothing else. Prompts are accepted only after the clear
    // lands, on the same gate compact_first stays behind — a prompt answered
    // ahead of it would pay for the whole context the clear is about to throw
    // away.
    ReviveClear clear = 3;
  }
}

// The compact-first revival choice, and WHAT of the conversation the
// compaction is allowed to summarize away.
//
// The arm is no longer empty because "compact" turned out not to be one
// decision. A conversation's bulk is not evenly distributed: the assistant's
// own responses are usually the largest part of it, the user's prompts are
// usually the part they most want back verbatim, and the tool calls and their
// results are the part an agent needs intact to keep working. So the scope is
// the user's to state, and stating it is what the four arms of CompactionScope
// are for.
message ReviveCompactFirst {
  // Required; an unspecified scope is a loud nack rather than a default. The
  // daemon does not choose what to throw away.
  CompactionScope scope = 1;
}

// What a revival compaction is allowed to summarize away.
//
// EVERY ARM BUT ALL IS A STEERED COMPACTION, carried to the CLI as
// `/compact <instructions>` — the same session command the unsteered one uses,
// with the parts to preserve named in the instructions. There is no second
// compaction mechanism and no local transcript surgery: the harness owns the
// summary, and the scope is how the user aims it.
enum CompactionScope {
  // The refused zero. "No decision" must be unrepresentable, exactly as it is
  // for the mode oneof above.
  COMPACTION_SCOPE_UNSPECIFIED = 0;
  // Summarize the whole conversation, sparing nothing. The original
  // compact-first behavior, and the cheapest result.
  COMPACTION_SCOPE_ALL = 1;
  // Summarize only the assistant's own responses, and keep the user's
  // prompts, the tool calls, and the tool results verbatim.
  COMPACTION_SCOPE_RESPONSES = 2;
  // Summarize only the user's prompts and keep everything the agent produced
  // verbatim. For a conversation whose value is in what was DONE rather than
  // in how it was asked for.
  COMPACTION_SCOPE_PROMPTS = 3;
  // Summarize the user's prompts and the assistant's responses together,
  // keeping the tool calls and their results verbatim — the conversation's
  // prose goes, its work survives.
  COMPACTION_SCOPE_PROMPTS_AND_RESPONSES = 4;
}

// Marks the resume-verbatim revival choice. Empty: the choice IS the arm.
message ReviveDirect {}

// The discard-the-conversation revival choice. Empty, and deliberately WITHOUT
// a CompactionScope: a clear keeps nothing, so there is nothing to scope. A
// revival that wants to keep part of the conversation is a compact_first with
// the scope that says which part.
message ReviveClear {}

// The workspace's revival gate, resolved and fenced: whether prompts may be
// sent right now, and if not, what the user must decide first.
//
// A rendering frontend reads its gate from here rather than from a session
// catalog. The catalog answers "what is true of session X", which forces the
// reader to first work out which X is current; this answers "what is true of
// this workspace now", which is the only question a gate has.
message WorkspaceGateView {
  string workspace = 1;
  // The workspace's staleness fence at the moment the daemon produced this
  // view: an opaque token compared byte-wise against the fence on the
  // workspace's current WorkspaceState, never parsed. A stale gate view is
  // discarded whole — adopting half of one is how a composer ends up locked
  // against a workspace that is already awake.
  string fence = 2;
  // WHETHER the gate is open, as arms, so that a closed gate always arrives
  // with the account the revival card needs to render.
  oneof gate {
    WorkspaceGateOpen open = 3;
    WorkspaceGateHibernated hibernated = 4;
  }
}

// Prompts may be sent. The composer is live and no revival decision is
// pending.
message WorkspaceGateOpen {}

// The workspace's session is asleep and will not take a prompt until the user
// chooses how to wake it.
message WorkspaceGateHibernated {
  // Why and since when, so the card can say what put it to sleep.
  HibernationDetail detail = 1;
}

// ==========================================================================
// HOST surface: the Emacs-only workspace lifecycle and UI action inbox.
// ==========================================================================

// Request one agent-repl workspace.  This is the sole creation ingress for
// both host UI requests (SPC TAB n/N) and skill-produced JSON dispatches.  The
// daemon owns name resolution, worktree creation, session startup, and initial
// prompt delivery; a request never asks for a promptless/no-shim workspace.
message CreateWorkspaceCmd {
  string requested_name = 1;
  string git_root = 2;
  string base_commit = 3;
  string source_workspace = 4;
  string source_dir = 5;
  optional string initial_prompt = 6;
  string priority = 7;
  string model = 8;
  string fork_from = 9;
  string fork_session_id = 10;
  string postprocessing_prompt = 11;
  string before_ws_merge = 12;
  // Explicit session account/safety posture. The daemon must not infer these
  // from its ambient process when a host asks it to create a workspace.
  string config_dir = 13;
  string permission_mode = 14;
  bool allow_ungated = 15;
}

// The daemon's authoritative account of a workspace ready for host
// materialization.  A `WorkspaceAvailable` is retained until Emacs sends
// WorkspaceMaterializedCmd, so reconnecting Emacs cannot lose it.
message WorkspaceAvailable {
  string job_id = 1;
  string final_name = 2;
  string worktree_path = 3;
  string branch = 4;
  string git_root = 5;
  string base_commit = 6;
  string source_workspace = 7;
  string source_dir = 8;
  string fork_from = 9;
  string fork_session_id = 10;
  string session_id = 11;
  string priority = 12;
  string model = 13;
  bool initial_prompt_queued = 14;
  string config_dir = 15;
  string permission_mode = 16;
  bool allow_ungated = 17;
}

// Emacs has created the perspective/local bookkeeping for the authoritative
// workspace descriptor.  The daemon uses this durable acknowledgement to
// release an initial prompt that was held until a visible host workspace
// exists.
message WorkspaceMaterializedCmd {
  string job_id = 1;
}

// Open a workspace: reattach to the session it already has, or start one when
// it has none. The fields are the workspace's RUN PREFERENCES — the posture and
// account a session for this workspace runs under — which the editor owns
// because they are properties of the checkout, not of any session.
//
// There is deliberately NO session identity here. Which session a workspace
// owns is the daemon's ruling; a frontend that named one would be asserting an
// answer to a question it cannot hold across a daemon restart.
message OpenWorkspaceCmd {
  // The permission posture a session started by this open runs under, empty to
  // accept the daemon's default. Ignored when the workspace already has a
  // session: an open never re-postures a live one.
  string permission_mode = 1;
  // The CLAUDE_CONFIG_DIR — i.e. WHICH ACCOUNT — a session started by this open
  // runs under. One shared daemon serves every workspace, so its own
  // environment cannot encode a per-workspace account.
  //
  // Empty means the daemon's own default, NOT the absence of a config dir.
  string config_dir = 2;
  // Run a session started by this open against the offline scripted SDK.
  bool fake = 3;
  // The caller's DELIBERATE consent to start a session with NO permission gate,
  // required on exactly the same terms as CreateSessionCmd.allow_ungated and
  // enforced by the same refusal. An open that could reach an ungated posture
  // without it would be a second, quieter door to the one thing that consent
  // exists to make loud.
  bool allow_ungated = 4;
}

message CloseWorkspaceCmd {}

message MergeWorkspaceCmd {
  // THE COMMAND STATES NO MERGE GEOMETRY AND NAMES NO HANDLER. It is a bare
  // request keyed by workspace, and that is deliberate.
  //
  // THE DAEMON OWNS THE GEOMETRY MAP (internal/workspace/geometry). It records
  // a workspace's source branch, source worktree and merge target when it
  // CREATES the workspace, and derives them at boot for pre-cutover ones, so a
  // merge command has nothing left to state. A caller that stated it would be
  // a SECOND OWNER of one map, which is how a cherry-pick once reached a target
  // the daemon had never heard of. Nor does the command select a handler: there
  // has only ever been one merge handler, and naming it would invite a caller
  // to ask for a mechanism the daemon does not dispatch on.
  bool conflict_resolved_continue = 1;  // the resolve-and-continue handoff
  // The workspace's DISPLAY name, for the `merge/<name>` completion tag and the
  // daemon's merge logs.
  //
  // It exists because the envelope's `workspace` field is the daemon's
  // workspace KEY — the session cwd — exactly as it is for every other
  // command. This command used to put the bare Emacs name there instead, which
  // filed every merge state row under a workspace key nothing else used: the
  // row had no session identity, so its WorkspaceState reached Emacs with an
  // absent connectivity verdict and was refused, and the merge never tore its
  // workspace down. The two identities are now separate fields rather than one
  // slot meaning different things per command.
  string workspace_name = 2;
}

// A daemon-owned inbox may contain UI-only actions alongside creates.  These
// typed messages hand those actions to the Emacs host without two processes
// racing to consume the same JSON file.  They are retained until completed.
message HostAction {
  string action_id = 1;
  oneof action {
    HostSwitchWorkspace switch_workspace = 2;
    HostSetRepositoryFold set_repository_fold = 3;
    HostSetSidebarView set_sidebar_view = 4;
    HostTaskCreate task_create = 5;
    HostTaskById task_toggle_done = 6;
    HostTaskById task_open = 7;
    HostTaskById task_add_workspace = 8;
    HostLegacyCommand legacy_command = 9;
    HostWorkspaceCreateFailed workspace_create_failed = 10;
    HostBootSweepSessionUnwired boot_sweep_session_unwired = 11;
  }
}

// The boot sweep finished with this session left UNWIRED: its shim never
// redialed inside the recheck window, its liveness probe failed twice, or it
// was neither connected nor lock-held. The session is not torn down — the
// record stays revivable and an on-demand open still brings it up — but a
// human should know the survivor did not come back on its own. It rides the
// same retained-until-completed HostAction envelope every other host action
// uses, exactly as HostWorkspaceCreateFailed does: the daemon job it reports
// is already over, and the record is delivered, replayed across reconnects,
// and acknowledged.
message HostBootSweepSessionUnwired {
  // The workspace the session belongs to (project dir).
  string workspace = 1;
  // The session left unwired.
  string session_id = 2;
  // WHY it was left, as one display-ready sentence composed by the sweep
  // (which verdict fired, with its evidence). Rendered verbatim.
  string reason = 3;
}

// A durably-failed workspace-creation job. It rides the same
// retained-until-completed HostAction envelope every other host action uses,
// so a creation that died is delivered, replayed across reconnects, and
// acknowledged exactly like a creation that succeeded. A failed job is never
// silent: the daemon records it, logs it, and hands it to the host to show.
message HostWorkspaceCreateFailed {
  string job_id = 1;
  string requested_name = 2;
  string error = 3;
}

message HostSwitchWorkspace { string dir = 1; }

message HostSetRepositoryFold { string repo_key = 1; bool folded = 2; }

message HostSetSidebarView { string view = 1; }

message HostTaskCreate {}

message HostTaskById { string id = 1; }

// Deliberate structured handoff for the established workspace-command verbs
// whose payloads are not stable enough to promise a field-by-field protobuf
// schema yet. `type` MUST be exactly one of: prompt, finish, close, open,
// clipboard, send, merge, or eval. `payload` is the JSON-object command body
// after the type discriminator, represented as protobuf Struct rather than an
// opaque JSON string so the daemon can validate the verb and the host can
// inspect every supplied field. This preserves every non-create inbox command
// while creation ownership moves to the daemon.
message HostLegacyCommand {
  string type = 1;
  google.protobuf.Struct payload = 2;
}

// Completion is host-only.  `ok=false` preserves the action and records the
// supplied error in the daemon's durable inbox rather than silently dropping
// a UI request that Emacs could not perform.
message HostActionCompletedCmd {
  string action_id = 1;
  bool ok = 2;
  string error = 3;
}

// ==========================================================================
// Session and daemon lifecycle commands, the scheduled-shutdown drain lease,
// and the frontend diagnostic log line.
//
// HOST SURFACE. Session lifecycle belongs to Emacs, which creates, deletes,
// revives and health-checks sessions and therefore addresses them by identity.
// A rendering frontend has no session vocabulary at all: it reads fenced,
// workspace-addressed component views and compares fences.
//
// ONE CARVE-OUT: the ShutdownScheduleView family below is SHARED surface —
// the webapp renders drain progress from it — and its one session-bearing
// field is marked host-surface where it appears (see ShutdownHold).
//
// ==========================================================================

// Session creation over UDS (replaces Emacs POST /sessions).
// What conversation a create should land on.
//
// This is the caller's INTENT, not a pointer. It used to be a pointer —
// `resume_claude_session_id`, a vendor uuid the frontend had remembered from a
// previous session and handed back at boot — and that made every frontend a
// second, weaker authority on a question the daemon can answer exactly.
//
// The daemon owns (config_dir, cwd) -> conversation. It keeps a session_record
// per conversation and a conversation_checkpoint keyed on precisely that
// triple, and it can check the vendor transcript on disk. A frontend has none
// of that; it has a value it wrote down earlier and hopes is still true. When
// the frontend's copy went missing, five workspaces silently started fresh
// conversations on top of intact transcripts, because a frontend saying
// nothing and a frontend saying "start fresh" were the same wire value.
//
// They are now different values, which is the whole point of this enum.
// FRESH IS NOT CALLER-EXPRESSIBLE. The only intents on this wire are CONTINUE
// (this workspace's conversation, whichever one that is) and EXPLICIT (one
// named conversation a human chose). "Begin a NEW conversation even though a
// resumable one exists" is not among them, and never will be.
//
// A workspace's conversation is not replaceable by a caller — no
// frontend, no user command, no automatic recovery may abandon one — because
// the abandonment is silent and irreversible while every alternative (resume,
// restore from backup, or a loud refusal) is recoverable. A fresh conversation
// may now exist only for a workspace the daemon can PROVE never had one, and
// that proof is the daemon's to mint from its own durable evidence, never a
// caller's to assert. The wire therefore has no way to ask for it.
enum ResumeMode {

  // Unset. Treated as RESUME_MODE_CONTINUE so an older or simpler caller gets
  // the safe behavior: continuing an existing conversation is recoverable,
  // stranding one is not.
  RESUME_MODE_UNSPECIFIED = 0;

  // Continue this workspace's conversation, whichever one that is. The daemon
  // resolves it; when nothing resolves it consults its own evidence and either
  // proves the workspace never had a conversation (fresh) or fails loudly.
  RESUME_MODE_CONTINUE = 1;

  // Land on one SPECIFIC conversation named in explicit_claude_session_id.
  // Reserved for a human choosing from among conversations (a picker, a fork)
  // — never for ordinary restore, which is what CONTINUE is for. A caller that
  // reaches for this at boot is reintroducing the pointer.
  RESUME_MODE_EXPLICIT = 2;
}

message CreateSessionCmd {
  string cwd = 1;
  string permission_mode = 2;
  string config_dir = 3;
  bool fake = 4;                        // test harness sessions
  // The caller's DELIBERATE consent to create a session with NO permission
  // gate. Required whenever permission_mode names a mode that shadows the
  // shim's canUseTool callback in the fail-OPEN direction
  // (bypassPermissions): under such a mode the SDK auto-approves every tool
  // before canUseTool is consulted, so the daemon's whole permission
  // round-trip never engages and no permission card can ever appear.
  //
  // The daemon REFUSES such a create without this flag. The mode is otherwise
  // one string away from every ordinary create, and "reachable by a typo" is
  // not an acceptable property for the switch that turns the gate off. It is
  // a create-time consent only: a session already registered in that mode
  // still rehydrates after a daemon restart, since refusing there would
  // silently change a live session's posture.
  bool allow_ungated = 5;

  // The model this session should START on, empty to accept the shim's own
  // default.  A caller that has a remembered selection would otherwise have to
  // create and then immediately SetModel, which races: the session is live and
  // driveable in between, so its first turn can run on the wrong model.
  //
  // This does NOT make the caller authoritative.  The daemon applies it through
  // the same SetModel path a later change takes, once the shim is wired, and
  // still publishes only the shim-confirmed selection.  A rejected model fails
  // the create rather than silently leaving the session on another one.
  string model = 6;

  // Which conversation to land on. See ResumeMode: this is intent, and the
  // daemon does the resolving.
  ResumeMode resume_mode = 7;

  // The conversation to land on, and ONLY meaningful under
  // RESUME_MODE_EXPLICIT. The daemon rejects a create that sets this under any
  // other mode rather than quietly ignoring it, because a caller that filled
  // this in believes it is steering and must be told it is not.
  string explicit_claude_session_id = 8;
}

// Session teardown over UDS (replaces DELETE /sessions/{id}).
message DeleteSessionCmd {
  string session_id = 1;
}

// HARD RESTART of one workspace's session: stop whatever shim is serving it
// (including one that outlived a previous daemon, which this daemon never
// spawned), then bring it up again along the ordinary path.
//
// THE SESSION RECORD IS UNCHANGED, so the respawn resumes the same vendor
// conversation: the user loses nothing and the transcript continues. This is a
// PROCESS restart, not a new session — what to reach for when the shim is
// wedged, when it is running superseded code, or when the backend simply needs
// rebuilding under a conversation worth keeping.
//
// A workspace with no live session is a loud nack; a workspace whose session is
// merely hibernated or severed is brought up, because "restart" and "start" are
// the same request when nothing is running.
message RestartSessionCmd {}

// Deliberate, immediate hibernation of one workspace's session: the daemon
// stops the shim (IntentionalQueryTermination) and marks the session
// hibernated. Hibernated sessions are structurally outside the keep-alive
// loop — hibernation and keep-alive-stop are ONE transition, so "hibernated
// but still pinging" is unrepresentable. Refused with a loud nack while a
// turn is live or the merge lease is held: the user interrupts first, the
// daemon never discards in-flight work to satisfy a hibernate.
message HibernateWorkspaceCmd {}

// Graceful daemon shutdown over UDS (replaces Emacs
// POST /shutdown).
message ShutdownCmd {
  // stop_shims asks the daemon to SIGTERM every session shim on its way out.
  //
  // The DEFAULT (false) PRESERVES them. A shim outlives its daemon by design:
  // it redials the daemon socket forever with backoff and is auto-parked by
  // the next daemon's listener, so killing it on an orderly shutdown threw
  // away a live, mid-conversation process the very next boot could have
  // reattached to for free. Preserving is what makes a daemon bounce cheap.
  //
  // The mode exists for the one caller that genuinely needs the old behavior:
  // a deploy that changed the shim BUNDLE, whose surviving shims would
  // otherwise keep running the previous build's code (bin/deploy-all.sh
  // passes it when its stamps show the bundle moved). It is belt-and-braces
  // alongside the daemon's own version-driven stale-shim refresh, never the
  // only thing standing between a deploy and stale shims.
  bool stop_shims = 1;
}

// The daemon-global scheduled-shutdown lease. Pushed to every connected
// client on EVERY change and carried in StateSnapshot, so a client that
// connects mid-drain sees the lease without waiting for an edge. Exactly one
// arm is always set: "idle" is a real broadcast value (a cancel or a
// completed drain), never an absent field, so clearing the lease is
// representable and a client cannot confuse "no information" with "no
// lease". The draining state is durably persisted, so a daemon that crashes
// mid-drain reboots knowing a schedule existed rather than silently
// dropping it.
message ShutdownScheduleView {
  oneof state {
    // No shutdown is scheduled; prompts flow normally.
    ShutdownScheduleIdle idle = 1;
    // A shutdown is scheduled and its drain lease is held: no NEW turn may
    // start anywhere, and the daemon executes the shutdown the moment the
    // holds list becomes empty.
    ShutdownScheduleDraining draining = 2;
  }
}

// Deliberately empty: the arm being set IS the state.
message ShutdownScheduleIdle {}

// The held lease. The holds list is the complete, live answer to "what is
// the bounce waiting on", so the webapp renders drain progress from this
// frame alone without deriving it from per-workspace states.
message ShutdownScheduleDraining {
  // Identity of this schedule, minted at ScheduleShutdownCmd time.
  // Correlates CancelScheduledShutdownCmd and QueueEntryShutdownHold to one
  // schedule, so a cancel can never race a newer schedule.
  string schedule_id = 1;
  // When the lease was taken (epoch ms), for elapsed-time display.
  int64 scheduled_at_ms = 2;
  // Why the bounce was scheduled ("merge of <ws> rebuilt the daemon",
  // "manual restart"). Free text for display; never parsed.
  string cause = 3;
  // Whether the executed shutdown will also SIGTERM every session shim (the
  // ShutdownCmd.stop_shims semantics, decided at schedule time because the
  // decision is a property of WHAT was rebuilt, not of when the drain
  // finishes). False preserves shims for reattach.
  bool stop_shims = 4;
  // Every workspace still blocking quiescence. Never empty on the wire: the
  // daemon executes the shutdown instead of broadcasting a drained frame.
  repeated ShutdownHold holds = 5;
}

// One workspace the drain is waiting on, and why. At least one of turn and
// tasks is set; both may be, since a session can hold an active turn and
// live background tasks simultaneously — co-occurring facts, not mutually
// exclusive states, hence sibling messages rather than a oneof.
message ShutdownHold {
  // Absolute workspace CWD, the same key every session-routed command uses,
  // so a client can join this hold to its workspace model.
  string workspace = 1;
  // HOST SURFACE: the owning session, so the host cannot attribute a hold to
  // a successor session of the same workspace. A rendering frontend never
  // reads it — the workspace key above joins the hold to everything a
  // renderer draws.
  string session_id = 2;
  // Set when a turn is in flight in this workspace.
  ShutdownHoldTurn turn = 3;
  // Set when live background tasks are running in this workspace.
  ShutdownHoldTasks tasks = 4;
}

// An active turn blocks the drain. Carries the turn id so logs, the webapp,
// and the turn ledger all name the same turn.
message ShutdownHoldTurn { string turn_id = 1; }

// Live async tasks block the drain. The count is display-grade summary; the
// task catalog remains the authority on which tasks they are.
message ShutdownHoldTasks { int32 count = 1; }

// Schedule a graceful shutdown instead of demanding one now. Takes the
// drain lease immediately (broadcast via ShutdownScheduleView), blocks new
// turns daemon-side at the prompt queue, and executes ShutdownCmd semantics
// the moment every hold clears. Scheduling while a schedule already exists
// is a loud nack, never a silent replace: the caller must cancel first, so
// two deploy flows cannot silently merge their intents.
message ScheduleShutdownCmd {
  // Same semantics as ShutdownCmd.stop_shims, fixed at schedule time.
  bool stop_shims = 1;
  // Why (for the broadcast view and the durable log). Display only.
  string cause = 2;
}

// Cancel a scheduled shutdown and release the drain lease. schedule_id must
// match the live schedule; a stale id is a loud nack, so a cancel aimed at
// an old schedule can never kill a newer one.
message CancelScheduledShutdownCmd {
  // The schedule to cancel, from ShutdownScheduleDraining.schedule_id.
  string schedule_id = 1;
}

// The daemon's notice that it is about to go down ON PURPOSE.
//
// WHY IT EXISTS: a deploy bounce is an event the daemon knows about and its
// clients do not. Every client learned of it the only way it could — its
// socket died — and a dead socket is indistinguishable from a crash, so a
// wanted, bounded outage painted the severed banner in the webapp and a
// degraded-link segment in Emacs. This frame is the missing fact.
//
// PUSHED ONCE to every gui_stream client AND to the Emacs UDS host,
// immediately before an INTENTIONAL teardown — after the daemon has stopped
// declaring itself ready and before it closes its listeners. It is a
// courtesy notice on a socket that is about to die, so it is never retried
// and never acknowledged; a client that misses it simply falls back to
// treating the disconnect as unexplained.
//
// DELIBERATELY ABSENT FROM StateSnapshot. A connect snapshot is proof the
// daemon is UP, so carrying a pending-restart field there would let a
// freshly-connected client open a quiet window on the strength of an
// announcement whose outage has already ended. There is no "am I restarting"
// query: the announcement is an edge, not a state.
//
// A PREDICTION, NOT A PROMISE. The client owns the bound: it opens a quiet
// window of at most the stated length and must report a daemon that never
// returns. Nothing here asks a client to suppress alarms indefinitely.
message RestartPendingView {
  // Why the daemon is going down ("deploy-all rebuilt the daemon",
  // "SIGTERM"). Display-grade and NEVER parsed; a client branches on the
  // structured fields below, never on this text. Never empty on the wire:
  // the daemon refuses to compose an announcement that cannot say what it is
  // about.
  string cause = 1;

  // How long the outage is expected to last, in whole seconds. A CLAMPED
  // HINT: the daemon caps it before sending, and a client is entitled to
  // clamp it further still. Always positive on the wire — a zero or negative
  // window is not a representable request, because "stay quiet for no time"
  // and "stay quiet forever" are both things no announcement may ask for.
  int32 expected_outage_seconds = 2;

  // Whether this restart also SIGTERMs every session shim (the
  // ShutdownCmd.stop_shims semantics). A client renders a longer settle when
  // the shims roll too, since a preserved shim is reattached by the next
  // daemon for free while a rolled one must be respawned.
  bool stop_shims = 3;

  // When the daemon MINTED this announcement (epoch ms), not when the client
  // received it. The client subtracts the delivery delay from its window, so
  // late delivery SHORTENS the quiet window rather than restarting the clock
  // — otherwise a slow hop would extend the period during which a daemon
  // that never came back stays unreported.
  int64 announced_at_ms = 4;
}

// The severity of a ClientLogCmd. A closed vocabulary rather than a free
// string, so a frontend cannot invent a level the daemon has no policy for.
enum ClientLogLevel {
  CLIENT_LOG_LEVEL_UNSPECIFIED = 0;
  CLIENT_LOG_LEVEL_INFO = 1;
  CLIENT_LOG_LEVEL_WARN = 2;
  CLIENT_LOG_LEVEL_ERROR = 3;
}

// A frontend-side diagnostic line, mirrored into the daemon's
// own on-disk log.
//
// WHY THIS EXISTS: the webapp runs inside an Emacs xwidget whose JS console
// nobody can see and nothing persists, so a delivery-path failure there (a
// seq-gap loop, a lost replay request, a stalled rAF) left no evidence
// anywhere at all. A pre-cutover HTTP route carried these; it was deleted with
// the rest of the legacy plane, and this arm restores the capability on the
// protobuf channel instead of reviving a second transport.
//
// The daemon WRITES these, it does not act on them: a client log is evidence,
// never a control signal, and is tagged in the log so a line originating in a
// frontend is never mistaken for one the daemon produced itself.
message ClientLogCmd {
  ClientLogLevel level = 1;
  string message = 2;
  // Optional structured payload (ids, counters, timings) accompanying the
  // message. Schemaless on purpose: it is diagnostic evidence whose shape is
  // the reporting call site's business, and pinning a schema here would make
  // adding a diagnostic a proto change.
  google.protobuf.Struct context = 3;
}

// ==========================================================================
// The merge run's live progress — a SHARED FACT, projected independently by
// every surface that shows a merge (the sidebar's glyph, the footer's chip,
// the workspace's color).
// ==========================================================================

// Live progress of the workspace's current (or most recent) merge run.
// WHICH message is set in `phase` IS the phase — no enum to keep in sync,
// no field that is meaningless for the current phase. Every phase
// transition and every within-phase tick (a landed cherry-pick, a test
// pass) is pushed as a WorkspaceState revision to both frontends.
message MergeStatus {
  string run_id = 1;  // daemon-minted, stable across the run

  // When the CURRENT phase was entered. Set on every phase transition. For
  // the terminal phases this is when the run finished — merged's landed
  // instant, failed's failure instant.
  int64 phase_started_at_ms = 2;

  // Monotonic within the run; bumps on within-phase ticks too (a landed
  // pick advances updated_at_ms but not phase_started_at_ms).
  int64 updated_at_ms = 3;

  oneof phase {
    MergeStatusEnqueued      enqueued       = 4;
    MergeStatusBeforeAction  before_action  = 5;
    MergeStatusCherryPicking cherry_picking = 6;
    MergeStatusTesting       testing        = 7;
    MergeStatusConflict      conflict       = 8;
    MergeStatusAfterAction   after_action   = 9;
    MergeStatusMerged        merged         = 10;
    MergeStatusFailed        failed         = 11;
  }
}

message MergeStatusEnqueued {
  int32 position = 1;  // 1-based
  int32 depth    = 2;
}

message MergeStatusBeforeAction {
  string prompt = 1;  // the configured action, for display
}

message MergeStatusCherryPicking {
  int32  commits_total   = 1;
  int32  commits_landed  = 2;
  string current_sha     = 3;
  string current_subject = 4;
}

message MergeStatusTesting {
  int32  commits_total   = 1;
  int32  commits_landed  = 2;  // the commit under test is landed but ungated
  string current_sha     = 3;
  string current_subject = 4;
}

message MergeStatusConflict {
  string conflicted_sha     = 1;
  string conflicted_subject = 2;
  int32  commits_total      = 3;
  int32  commits_landed     = 4;
}

message MergeStatusAfterAction {
  string prompt = 1;
}

message MergeStatusMerged {
  int32  commits_total      = 1;
  string after_action_error = 2;  // empty when the after action succeeded or none ran
}

message MergeStatusFailed {
  string cause           = 1;
  int32  commits_total   = 2;  // 0 when planning never completed
  int32  commits_landed  = 3;
  string failing_sha     = 4;  // set only for commit-bound failures
  string failing_subject = 5;

  // THIS MESSAGE, serialized as JSON, carried verbatim so a frontend can
  // report the WHOLE failure record as one field of the error it shows.
  //
  // A failed merge is the one merge status a human has to DIAGNOSE rather
  // than watch go by, and the narration frontends echo is a single line:
  // it quotes `cause` and `failing_subject` and drops everything else. The
  // counts and the sha never reached the report at all, so a user reading
  // "merge failed — cherry-pick refused" had to leave the editor and go to
  // the daemon log for the rest of the record.
  //
  // IT IS PRODUCED BY PROTO3's OWN JSON MAPPING (protojson), never by
  // hand-assembled string building. That is what makes it exhaustive
  // WITHOUT MAINTENANCE: a field added to this message appears in the
  // reported error the moment the schema learns it, whereas a formatter
  // listing the fields it knows would report the schema as it stood when
  // the formatter was written.
  //
  // STAMPED LAST, onto a message whose other fields are already filled and
  // whose own `failed_json` is still empty, so it is the serialization of
  // this message WITHOUT this field and can never nest inside itself.
  // Empty is never valid on a published failed arm.
  string failed_json = 6;
}

// The WHOLE merge queue, as the daemon will actually drain it: the global
// pause bit plus every repository's outstanding entries in delivery order.
// Pushed complete on every queue mutation (admit, complete, evict, pause,
// resume, terminal-mark) and included in every connect snapshot. Assembled
// under the queue's own lock, so what it shows IS what runs next — never a
// re-derivation from per-run MergeStatus, whose enqueued positions are
// admission-time facts that go stale as heads complete.
message MergeQueueRoster {
  // The daemon-global pause bit, durable across bounces. True means the run
  // in flight (if any) finishes and nothing new starts; admission is NOT
  // paused — entries still queue durably behind the gate.
  bool paused = 1;
  // When the roster last changed, unix millis, for staleness display only.
  int64 updated_at_ms = 2;
  // One group per repository with outstanding entries; an empty repo does
  // not appear.
  repeated MergeRepoQueue repos = 3;
}

message MergeRepoQueue {
  // The queue key: the repository identity shared by every sibling worktree.
  // Opaque beyond display.
  string repo_key = 1;
  // Delivery order; entries[0] is the head. Position is index + 1 —
  // deliberately not a field, so it can never disagree with the order.
  repeated MergeQueueEntry entries = 2;
}

message MergeQueueEntry {
  // The run's identity — the SAME id every MergeStatus for this merge
  // carries, and the key EvictMergeCmd names. Stable across daemon bounces.
  string run_id = 1;
  // The workspace's key (project dir).
  string workspace = 2;
  // The workspace's display name.
  string workspace_name = 3;
  // The branch being merged.
  string source_branch = 4;
  // Set ONLY on entries[0]; WHICH message is set is what the head is doing.
  oneof head {
    // The drain goroutine holds this entry: lease taken or being taken.
    // Eviction is refused for it.
    MergeQueueHeadRunning running = 5;
    // Delivered but parked at the pause gate: nothing has started.
    MergeQueueHeadPausedWaiting paused_waiting = 6;
    // A durably marked terminal word awaits re-publication; it will be
    // answered, not re-run.
    MergeQueueHeadTerminalOwed terminal_owed = 7;
  }
}
message MergeQueueHeadRunning {}
message MergeQueueHeadPausedWaiting {}
message MergeQueueHeadTerminalOwed {}

// Pause the merge queue: the run in flight finishes, nothing new dequeues.
// Durable across bounces. Idempotent. Daemon-global (the command's
// workspace is ignored).
message PauseMergeQueueCmd {}
// Resume the merge queue. Idempotent, daemon-global.
message ResumeMergeQueueCmd {}
// Evict ONE waiting entry by run id. The evicted run receives a terminal
// failed MergeStatus with an eviction cause, so the workspace's merge axis
// resolves immediately. REFUSED when run_id names the running head (only its
// drain goroutine may retire it) or names nothing outstanding.
message EvictMergeCmd {
  // The run id the roster and every MergeStatus carry.
  string run_id = 1;
}

// THE INTERRUPT'S QUEUE HALF, ASKED RATHER THAN PERFORMED.
//
// Interrupting a workspace whose merge is on the queue used to take that merge
// off silently: the stop reached the shim, the queue entry was dropped beside
// it, and the only record of a merge the user had been waiting on was a
// terminal `failed` status that arrived without being asked for. A merge is
// minutes of someone's work and the interrupt is one keystroke, so the
// destructive half is now a QUESTION.
//
// The offer is PUSHED STATE, on WorkspaceState, rather than a rejection handed
// back to whoever sent the interrupt. The interrupt's sender is frequently not
// the surface that can draw a card — the Emacs host sends it from a keybinding
// and renders no cards at all — so an answer carried on the ack would have
// nowhere to be asked. Published on the workspace, the question reaches
// whichever frontend is showing that workspace, and both frontends see the
// same one.
//
// AT MOST ONE OFFER IS OUTSTANDING PER WORKSPACE. A second interrupt while an
// offer stands re-publishes the standing on the SAME offer_id rather than
// minting a rival question, so "which of the two cards did the user answer"
// is unrepresentable.
message MergeDequeueOffer {
  // Daemon-minted, and the ONLY thing an answer may name. It is not the run
  // id: a run id would still resolve after the offer had been answered or
  // superseded, so a stale card's click would dequeue a merge the user never
  // saw the question for. This id dies with the offer.
  string offer_id = 1;
  // The run the question is about — the same id its MergeStatus carries, so a
  // frontend can tie the card to the merge it is already rendering.
  string run_id = 2;
  // When the offer was raised, unix millis.
  int64 raised_at_ms = 3;
  // WHERE the merge stands, as arms, because the two standings are answered
  // by different machinery and read as different questions. A frontend that
  // had to ask "is position 1 the head?" would be re-deriving what the daemon
  // already knows.
  oneof standing {
    MergeDequeueWaiting waiting = 4;
    MergeDequeueRunning running = 5;
  }
}

// The merge is on the queue BEHIND another one, and nothing of it has run.
// Dequeuing it is a pure queue operation: the entry is dropped and the run
// takes a terminal `failed` status.
message MergeDequeueWaiting {
  // How many merges are in front of this one. Always >= 1 — a standing with
  // nothing ahead of it is the running arm, not this one.
  int32 ahead = 1;
  // 1-based place in the repository's queue, and its depth, so the card can
  // say "3rd of 5" as well as "2 ahead of it".
  int32 position = 2;
  int32 depth = 3;
}

// The merge IS the head and its run is in flight. Dequeuing it ABORTS that
// run: the lease is released and the entry retires with a terminal `failed`
// status.
//
// WHATEVER THE RUN ALREADY LANDED ON THE TARGET STAYS THERE, exactly as
// abandoning a conflicted merge leaves its half-resolved tree. An abort that
// also unwound the target would destroy work a human may be part-way through,
// and the daemon does not make that choice on a single keystroke's behalf.
message MergeDequeueRunning {
  // WHAT the run is doing, carried whole rather than re-stated as a stage
  // enum, so the card names the phase from the one vocabulary that defines it
  // and cannot drift from the status the same frontend is already rendering.
  MergeStatus status = 1;
}

// The user's answer to a MergeDequeueOffer. Sent by whichever frontend drew
// the card; the daemon clears the offer on either arm, so declining is a real
// answer and not merely the absence of one.
message AnswerMergeDequeueCmd {
  // The offer being answered. An id that does not match the workspace's
  // outstanding offer is REFUSED rather than resolved to the current one: a
  // click on a superseded card must not dequeue the merge the card that
  // replaced it is asking about.
  string offer_id = 1;
  // The answer is a oneof of empty messages, not a bool, for the same reason
  // ReviveSessionCmd's is: "no answer" must be unrepresentable on the wire.
  oneof answer {
    MergeDequeueConfirm dequeue = 2;
    MergeDequeueDecline keep = 3;
  }
}

// Take the merge off the queue — evict it while waiting, abort it while
// running.
message MergeDequeueConfirm {}
// Leave the merge alone. The offer is cleared and the merge proceeds.
message MergeDequeueDecline {}
