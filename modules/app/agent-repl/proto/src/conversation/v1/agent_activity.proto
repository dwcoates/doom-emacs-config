// agent_activity.proto — WHAT AN AGENT DOES: one vocabulary of units for every
// agent.
//
// The update model of the conversation PROTOCOL: units identified per THING and
// upserted, never per arrival — a unit holds one identity from its first
// fragment to its last, and growth is a re-send of that unit. The faithful
// per-observation log is the datalayer's shape (store.v1), and the shim maps
// between them.
//
// THIS VOCABULARY IS NOT A TURN'S. It is what an AGENT does, and a turn is
// merely the window in which the main-thread agent does it. A subagent does the
// identical set of things — reasoning, prose, tool calls, and subagents of its
// own — and its work arrives FLAT, as ordinary units carrying its own agent
// identity. That is why nothing here is named for a turn.
//
// What an agent's STREAM says — growth, success, failure — is agent.proto; what
// leaves a stream is detached_work.proto; the workflow, the one unit that
// contains other units, is workflow.proto.

syntax = "proto3";

package conversation.v1;

import "conversation/v1/api.proto";
import "conversation/v1/content_blocks.proto";
import "google/protobuf/struct.proto";

option go_package = "agentrepl/proto/conversation/v1;conversationv1";

// One unit of in-turn work, at whatever state it has reached.
message AgentActivity {
  // Tag 17 is RETIRED: the agent an activity belongs to is named by the frame
  // that carries it (AgentFrame.agent_id), never here.

  // WHAT THIS UNIT'S API RESPONSE COST, when this is the unit carrying it.
  //
  // ON THE ENVELOPE RATHER THAN IN THE ARMS, because usage is a fact about an
  // API RESPONSE and not about any one unit of work. One response frequently
  // yields SEVERAL units — an assistant message holding three tool calls
  // becomes three units — and most kinds of work have no cost of their own at
  // all, so a consumer aggregating cost would otherwise have to look for the
  // same fact in a dozen arms that can never carry it.
  //
  // EXACTLY ONE UNIT PER API RESPONSE CARRIES IT: the unit for the response's
  // FIRST content block. Every other unit of that response leaves it UNSET. A
  // producer that stamped it on each unit of a response would make any
  // consumer summing units over-count the bill by the number of blocks.
  //
  // SO ABSENCE MEANS "not the unit carrying its response's usage", NEVER "this
  // cost nothing". A consumer SUMS this across units and must not read it as a
  // per-unit price.
  optional TokenUsage usage = 19;

  // THE REASONING EFFORT THIS UNIT'S API RESPONSE RAN AT, when this is the
  // unit carrying it. On the envelope for exactly the reason `usage` is: it
  // is a fact about an API RESPONSE, and a response yields several units.
  //
  // UNSET means the producer reported no effort level for the response —
  // never that the effort was low. A consumer that draws it must draw nothing
  // when it is absent.
  optional AgentEffortLevel effort = 18;

  // WHAT THIS UNIT IS ATTRIBUTABLE TO beyond the agent that produced it: the
  // skill whose instructions were in view, the plugin the tool came from.
  //
  // UNSET when the producer attributed the unit to nothing in particular,
  // which is the ordinary case. NOT ancestry and not a container: this is a
  // label the producer stamped on the record, and a consumer that groups by
  // it is making a presentation choice.
  optional AgentActivityAttribution attribution = 20;

  // WHICH unit this concerns, so a later update reaches the same one rather
  // than appearing as a new one. A unit is identified per THING: the agent's
  // reasoning and its prose are separate units, each holding its identity
  // across every fragment that composes it.
  //
  // IT NAMES WORK, NEVER AN AGENT. Every frame is one level deep, so the unit a
  // frame upserts is never ambiguous: it is this identity, always.
  AgentActivityId activity_id = 1;

  // WHAT KIND of work it is. Each kind carries its own state and its own
  // payload, so a field is never present for a kind it means nothing to — and
  // no accounting figure rides the envelope, where it would be meaningless for
  // a file read or a search.
  oneof item {
    // The agent's reasoning on the way to an answer. May be withheld entirely,
    // in which case there is nothing to draw.
    AgentThinking thinking = 2;
    // Prose the agent addressed to the user. A turn holds several: the
    // commentary between tool calls and the answer at the end are both this.
    AgentResponse response = 3;
    // Tag 4 is RETIRED: the question lives on AgentUpdate, not here, because it
    // is not read-only work — it blocks the agent on an answer.
    // The agent invoking a skill, which arrives over several frames — the
    // invocation first, then what the skill contributed.
    AgentSkillUse skill_use = 5;
    // The agent reading a file.
    AgentRead read = 6;
    // The agent replacing a file's contents wholesale, or creating it.
    AgentWrite write = 7;
    // The agent replacing a matched string inside an existing file.
    AgentEdit edit = 8;
    // The agent searching file contents for a pattern.
    AgentGrep grep = 9;
    // The agent matching file paths against a pattern.
    AgentGlob glob = 10;
    // The agent running a shell command. The only tool here whose output
    // arrives incrementally while it runs.
    AgentBash bash = 11;
    // The agent spawning a subagent, and that spawn's own lifecycle — the
    // prompt it was given, its progress, and the report and totals it settles
    // with.
    AgentSubagent subagent = 12;
    // A tool this contract does not model — an MCP server's tool, or one added
    // after this schema was written. Present so unmodelled work is still
    // visible rather than silently absent.
    AgentUnmodeled unmodeled = 14;
    // The agent sending a message to another agent.
    AgentSendMessage send_message = 15;
    // The agent creating or altering an entry in the task tracker. Arrives in
    // whichever turn the acting agent was running in, so a task edited across
    // several turns produces several of these.
    AgentTaskAct task_act = 16;
    // A HOOK ran — the user's own configured automation firing around the
    // agent's work. The largest record class the vendor writes; a blocking
    // outcome is a refusal the user must be able to understand.
    AgentHook hook = 21;
    // Context the vendor SILENTLY pulled into the conversation — a memory
    // file, a discovered or invoked skill — with no tool call announcing
    // it. Surfaced so the user can see what shaped the agent's behavior.
    AgentContextInjected context_injected = 22;
    // The agent fetching one URL's content and reading it.
    AgentWebFetch web_fetch = 23;
    // The agent running a web search and receiving result links.
    AgentWebSearch web_search = 24;
    // The agent arming a background watcher whose events wake it later.
    // Always detached — a monitor never blocks the turn — so the frames
    // arrive via the detached-work announcement like a workflow's.
    AgentMonitor monitor = 25;
    // The agent scheduling its own future re-invocation (a self-pacing
    // loop's tick), or ending such a loop. The pending wakeup drives the
    // footer's waiting · wakeup fallback state.
    AgentScheduleWakeup schedule_wakeup = 26;
    // The agent publishing a local file as a hosted artifact page, or
    // listing existing ones. A publish draws as its own response-styled
    // feed bubble; a list is a quiet read, drawn nowhere.
    AgentArtifact artifact = 27;
    // The plan-mode pair: entering plan mode, and exiting it with the plan
    // document. TWO tool calls at this tier, faithfully — each with its own
    // unit identity, and NO pairing key on the wire (the vendor offers none;
    // its requestId is a dialog id in the vendor's own identity space). The
    // daemon COALESCES the pair into one feed bubble by the episode
    // invariant: an agent has at most ONE open plan episode at a time.
    AgentPlanMode plan_mode = 28;
    // A code review's typed findings report.
    AgentReportFindings report_findings = 29;
    // The worktree pair: the agent moving into an isolated git worktree,
    // and returning from it. TWO tool calls, faithfully; the feed draws
    // each settled act as a SEPARATION DIVIDER, never as a tool card.
    AgentWorktree worktree = 30;
    // A scheduled-jobs act: create, delete or list. FOOTER-ONLY on the
    // drawn side — the daemon folds these into its job set and pushes the
    // ⏱ chip and panel; no feed card exists for them.
    AgentCron cron = 31;
    // The agent sent the user a push notification — an outbound action
    // that would otherwise be invisible in the transcript.
    AgentPushNotification push_notification = 32;
  }
}

// What a unit of work is attributable to beyond its agent.
message AgentActivityAttribution {
  // The skill whose instructions were in view when the work happened. UNSET
  // when none was.
  optional AgentSkillName skill = 1;
  // The plugin the work came from, by the name the producer reports. UNSET
  // when the work came from no plugin.
  optional string plugin = 2;
}

// The identity of one unit of in-turn work. Opaque; equality is the only
// question asked of it.
message AgentActivityId {
  // The unit's identifier for the life of that unit — from its first frame to
  // its last — so repeated frames upsert one element rather than appending new
  // ones. For a tool call this is the call's own identity as the producer
  // reported it; for the agent's reasoning or prose it identifies the block.
  // Opaque: compare for equality, never parse.
  string value = 1;
}

// WHAT A FAILED TOOL CALL SAID, in one shape shared by every tool's failure
// arm.
//
// ONE PAYLOAD RATHER THAN TWELVE, deliberately: the vendor states a failed
// call's account in exactly one place — the error content of the tool result —
// whichever tool failed, so twelve per-tool spellings of it would be twelve
// names for one fact. Where a tool's failure has structure BEYOND that account
// (a stopped subagent, a rejected task act), the tool's own failure message
// carries that structure as arms BESIDE this payload.
//
// THIS IS THE ACCOUNT, NOT A CLASSIFICATION. Nothing here says whether the
// failure is retryable or whose fault it was; a consumer shows the text.
message AgentToolFailure {
  // What the tool said when it failed, verbatim and by block, exactly as it
  // would have said a successful result.
  //
  // UNSET when the producer observed a failed call with no error content at
  // all — which happens, and is different from an empty text block. A consumer
  // then draws the failure with no detail rather than an empty card.
  optional ToolResultContent content = 1;

  // When the call settled as failed. UNSET when the producer observed no
  // instant for the settle.
  optional AgentActivitySettledAt settled_at = 2;
}

// When a tool call reached its outcome.
//
// THE COMPANION OF AgentActivityStartedAt, and the reason a settled item can
// state a duration at all: a consumer animates a clock from the start instant
// while the call runs, and freezes it at this instant once the call settles.
// Without it a settled card either keeps ticking or loses the elapsed figure
// entirely.
message AgentActivitySettledAt {
  // Milliseconds since the Unix epoch, as the producer observed the settle.
  int64 at_ms = 1;
}

// ---- Plan mode: the pair of calls around a plan document ----

// One plan-mode tool call — an ENTER or an EXIT. Each call is its own unit
// with its own identity, exactly as the vendor makes them; the one-bubble
// treatment is the feed's coalescing, never this tier's. An EXIT WITH NO
// ENTER IS LEGAL: a session started in the plan permission mode never calls
// EnterPlanMode at all.
message AgentPlanMode {
  oneof state {
    AgentPlanModeStart start = 1;
    AgentPlanModeSuccess success = 2;
    AgentPlanModeFailure failure = 3;
  }
}

// A plan-mode call this stream has begun carrying.
message AgentPlanModeStart {
  // WHICH act this call is. The set arm is the act.
  oneof act {
    AgentPlanModeEnter enter = 1;
    AgentPlanModeExit exit = 2;
  }
  // When the call was issued.
  AgentActivityStartedAt started_at = 3;
}
// The agent asked to enter plan mode.
message AgentPlanModeEnter {}
// The agent asked to leave plan mode, presenting its plan.
message AgentPlanModeExit {}

// The call returned.
message AgentPlanModeSuccess {
  oneof act {
    AgentPlanModeEntered entered = 1;
    AgentPlanModeExited exited = 2;
  }
  // When the call settled. UNSET when the producer observed no instant.
  optional AgentActivitySettledAt settled_at = 3;
}
// Plan mode is on. The vendor's acknowledgment line rides along.
message AgentPlanModeEntered {
  // The vendor's message, verbatim. EXPECTED UNMAPPED: no UI draws it — the
  // feed's plan bubble shows its own planning treatment.
  string message = 1;
}
// Plan mode ended with the plan presented.
message AgentPlanModeExited {
  // The plan document, markdown, as the vendor returned it. UNSET when the
  // vendor stated a null plan — an exit with nothing to show.
  optional AgentResponseProse plan = 1;
  // Whether the plan was edited at the VENDOR'S approval dialog before it
  // was accepted. Carried faithfully; DORMANT in this product's UX, whose
  // edit channel is the plan file on disk, which the vendor cannot observe.
  bool plan_was_edited = 2;
  // Where the vendor wrote the plan file — the feed's edit affordance opens
  // exactly this path in the host editor. UNSET when the vendor named none,
  // and the affordance then does not draw.
  optional string file_path = 3;
  // Whether the exit came from a subagent's plan rather than the main
  // thread's. EXPECTED UNMAPPED.
  bool is_agent = 4;
  // Whether the session has the Task tool available for executing the plan.
  // EXPECTED UNMAPPED.
  bool has_task_tool = 5;
  // Whether the plan awaits a leader agent's approval. EXPECTED UNMAPPED.
  bool awaiting_leader_approval = 6;
  // The vendor's requestId is deliberately NOT carried: vendor identity
  // spaces never cross this contract.
}

// The call could not be performed.
message AgentPlanModeFailure {
  // What the call said when it failed, and when it settled.
  optional AgentToolFailure error = 1;
}

// ---- Findings: a code review's typed defect report ----

// The agent reported code-review findings as a typed list.
message AgentReportFindings {
  oneof state {
    AgentReportFindingsStart start = 1;
    AgentReportFindingsSuccess success = 2;
    AgentReportFindingsFailure failure = 3;
  }
}

// A report this stream has begun carrying.
message AgentReportFindingsStart {
  // When the call was issued.
  AgentActivityStartedAt started_at = 1;
}

// The report landed.
message AgentReportFindingsSuccess {
  // The findings, in the tool's own order — most-severe first by its
  // contract; a consumer never re-sorts. Empty is a real report: a review
  // that found nothing.
  repeated AgentFinding findings = 1;
  // The effort level the review ran at. UNSPECIFIED when the tool stated
  // none. The one canonical effort vocabulary, shared with model support.
  AgentEffortLevel level = 2;
  // When the call settled. UNSET when the producer observed no instant.
  optional AgentActivitySettledAt settled_at = 3;
}

// One finding.
message AgentFinding {
  // Repo-relative path of the file the finding is in.
  string file = 1;
  // The line it anchors to, 1-indexed. UNSET when the tool gave none.
  optional uint32 line = 2;
  // The one-sentence statement of the defect.
  string summary = 3;
  // The compressed label for narrow surfaces. UNSET when the tool gave
  // none. EXPECTED UNMAPPED: the feed bubble always has room for the full
  // summary.
  optional string short_summary = 4;
  // Concrete inputs/state → wrong output, as the tool words it.
  string failure_scenario = 5;
  // The finding type's slug ("correctness", "efficiency"), verbatim; the
  // tool's vocabulary is open and it is shown, never switched on. UNSET
  // when the tool gave none.
  optional string category = 6;

  // The verify pass's verdict. UNSET when no verify pass ran.
  oneof verdict {
    AgentFindingConfirmed confirmed = 7;
    AgentFindingPlausible plausible = 8;
  }

  // What happened to the finding, set only on a RE-REPORT after fixes were
  // applied. UNSET on an ordinary report.
  oneof outcome {
    AgentFindingFixed fixed = 9;
    AgentFindingSkipped skipped = 10;
    AgentFindingNoChangeNeeded no_change_needed = 11;
  }
}
message AgentFindingConfirmed {}
message AgentFindingPlausible {}
message AgentFindingFixed {}
message AgentFindingSkipped {}
message AgentFindingNoChangeNeeded {}

// The call could not be performed.
message AgentReportFindingsFailure {
  // What the call said when it failed, and when it settled.
  optional AgentToolFailure error = 1;
}

// ---- The worktree pair: into an isolated tree, and back ----

// One worktree tool call — an ENTER or an EXIT. Each is its own unit with
// its own identity; unlike plan mode there is no coalescing anywhere: each
// settled act is its own divider in the feed, because the two moments can
// be far apart and everything between them happened inside the tree.
message AgentWorktree {
  oneof state {
    AgentWorktreeStart start = 1;
    AgentWorktreeSuccess success = 2;
    AgentWorktreeFailure failure = 3;
  }
}

// A worktree call this stream has begun carrying.
message AgentWorktreeStart {
  // WHICH act this call is. The set arm is the act.
  oneof act {
    AgentWorktreeEnter enter = 1;
    AgentWorktreeExit exit = 2;
  }
  // When the call was issued.
  AgentActivityStartedAt started_at = 3;
}
// The agent asked to enter a worktree.
message AgentWorktreeEnter {
  // The name asked for. UNSET when the tool chooses. EXPECTED UNMAPPED.
  optional string name = 1;
  // The path asked for. UNSET when the tool chooses. EXPECTED UNMAPPED.
  optional string path = 2;
}
// The agent asked to leave the worktree.
message AgentWorktreeExit {
  // WHAT WAS ASKED FOR THE TREE. The set arm is the request; the outcome
  // restates what actually happened.
  oneof action {
    AgentWorktreeExitKeep keep = 1;
    AgentWorktreeExitRemove remove = 2;
  }
}
message AgentWorktreeExitKeep {}
// Removal was asked for.
message AgentWorktreeExitRemove {
  // Whether uncommitted changes were asked to be discarded with it.
  bool discard_changes = 1;
}

// The call returned.
message AgentWorktreeSuccess {
  oneof act {
    AgentWorktreeEntered entered = 1;
    AgentWorktreeExited exited = 2;
  }
  // When the call settled. UNSET when the producer observed no instant.
  optional AgentActivitySettledAt settled_at = 3;
}
// The session is now inside the worktree.
message AgentWorktreeEntered {
  // The worktree's path on disk.
  string path = 1;
  // The branch checked out in it. UNSET when the vendor named none.
  optional string branch = 2;
  // The vendor's message line. EXPECTED UNMAPPED: the divider composes its
  // own label.
  string message = 3;
}
// The session has returned from the worktree.
message AgentWorktreeExited {
  // WHAT BECAME OF THE TREE, as the vendor states it happened.
  oneof outcome {
    AgentWorktreeKept kept = 1;
    AgentWorktreeRemoved removed = 2;
  }
  // The directory the session returned to.
  string original_cwd = 3;
  // The worktree's path — for a kept tree, where it still is.
  string path = 4;
  // The branch that was checked out in it. UNSET when the vendor named
  // none.
  optional string branch = 5;
  // The vendor's tmux session name for the tree, when one existed.
  // EXPECTED UNMAPPED.
  optional string tmux_session_name = 6;
  // The vendor's message line. EXPECTED UNMAPPED.
  string message = 7;
}
// The tree is still on disk.
message AgentWorktreeKept {}
// The tree was removed.
message AgentWorktreeRemoved {
  // How many uncommitted files were discarded with it. UNSET when the
  // vendor stated no figure — which is not the same as zero.
  optional uint32 discarded_files = 1;
  // How many commits were discarded with it. UNSET on the same terms.
  optional uint32 discarded_commits = 2;
}

// The call could not be performed.
message AgentWorktreeFailure {
  // What the call said when it failed, and when it settled.
  optional AgentToolFailure error = 1;
}

// ---- Scheduled jobs: the cron tool family ----

// One scheduled-jobs tool call. Job ids are the VENDOR'S cron ids, carried
// OPAQUE — compared for equality, never parsed; they name JOBS, not
// transcript records, so the identity ruling permits them (the task-id
// precedent).
message AgentCron {
  oneof state {
    AgentCronStart start = 1;
    AgentCronSuccess success = 2;
    AgentCronFailure failure = 3;
  }
}

// A call this stream has begun carrying.
message AgentCronStart {
  // WHICH act. The set arm is the act.
  oneof act {
    AgentCronCreate create = 1;
    AgentCronDelete delete = 2;
    AgentCronList list = 3;
  }
  // When the call was issued.
  AgentActivityStartedAt started_at = 4;
}
// A job is being created.
message AgentCronCreate {
  // The cron expression, verbatim; its grammar belongs to the scheduler.
  string cron = 1;
  // The prompt the job fires.
  string prompt = 2;
  // Whether the job repeats rather than firing once.
  bool recurring = 3;
  // Whether the job survives the session.
  bool durable = 4;
}
// A job is being deleted.
message AgentCronDelete {
  // The vendor's id for the job. Opaque.
  string job_id = 1;
}
// The job set is being read.
message AgentCronList {}

// The call returned.
message AgentCronSuccess {
  oneof act {
    AgentCronCreated created = 1;
    AgentCronDeleted deleted = 2;
    AgentCronListed listed = 3;
  }
  // When the call settled. UNSET when the producer observed no instant.
  optional AgentActivitySettledAt settled_at = 4;
}
// The job exists.
message AgentCronCreated {
  // The vendor's id for it. Opaque.
  string job_id = 1;
  // The vendor's human wording of the schedule ("every 5 minutes").
  string human_schedule = 2;
  // Whether it repeats.
  bool recurring = 3;
  // Whether it survives the session.
  bool durable = 4;
}
// The job is gone.
message AgentCronDeleted {
  // The vendor's id for the job that was removed. Opaque.
  string job_id = 1;
}
// The job set, WHOLE — replace semantics for the reader, exactly as the
// footer panel consumes it.
message AgentCronListed {
  repeated AgentCronJob jobs = 1;
}
// One job as the list states it.
message AgentCronJob {
  // The vendor's id. Opaque.
  string job_id = 1;
  // The cron expression, verbatim.
  string cron = 2;
  // The vendor's human wording of the schedule.
  string human_schedule = 3;
  // The prompt the job fires.
  string prompt = 4;
  // Whether it repeats.
  bool recurring = 5;
  // Whether it survives the session.
  bool durable = 6;
}

// The call could not be performed.
message AgentCronFailure {
  // What the call said when it failed, and when it settled.
  optional AgentToolFailure error = 1;
}

// ---- The push notification: the agent reaching an absent user ----

// One PushNotification tool call. The VENDOR delivers its own phone push
// (via the Claude app) and/or a local notification; this family records the
// vendor's stated outcome. The LOCAL attention presentation (OS
// notification, tab blink, sidebar marker, footer line) is this system's
// own fan-out of the fact and rides the host stream and frontend views,
// never this record.
message AgentPushNotification {
  oneof state {
    AgentPushNotificationStart start = 1;
    AgentPushNotificationSuccess success = 2;
    AgentPushNotificationFailure failure = 3;
  }
}

// A send this stream has begun carrying.
message AgentPushNotificationStart {
  // The agent's message, verbatim — what the user is to be told.
  string message = 1;
  // When the call was issued.
  AgentActivityStartedAt started_at = 2;
  // The input's `status` literal ("proactive") is deliberately not carried:
  // a constant is not a fact.
}

// The call returned, with the vendor's own delivery outcome.
message AgentPushNotificationSuccess {
  // WHETHER THE VENDOR DELIVERED. The set arm is the answer, and it
  // matters: an agent that believes it notified an absent user, and did
  // not, left them waiting on nothing.
  oneof outcome {
    AgentPushNotificationSent sent = 1;
    AgentPushNotificationNotSent not_sent = 2;
  }
  // When the call settled. UNSET when the producer observed no instant.
  optional AgentActivitySettledAt settled_at = 3;
}
// The vendor delivered.
message AgentPushNotificationSent {
  // Whether a phone push went out via the vendor's app.
  bool push_sent = 1;
  // Whether a local (vendor-side desktop) notification went out.
  bool local_sent = 2;
  // When the vendor says it sent, unix millis. UNSET when it stated no
  // instant.
  optional int64 sent_at_ms = 3;
}
// The vendor declined to deliver, and said why.
message AgentPushNotificationNotSent {
  // THE VENDOR'S REASON. The set arm is the reason; the vocabulary is the
  // vendor's declared closed set.
  oneof reason {
    // Notifications are switched off in the vendor's config.
    AgentPushNotificationConfigOff config_off = 1;
    // The vendor judged the user present, so a push would be noise.
    AgentPushNotificationUserPresent user_present = 2;
    // No delivery transport was available.
    AgentPushNotificationNoTransport no_transport = 3;
  }
}
message AgentPushNotificationConfigOff {}
message AgentPushNotificationUserPresent {}
message AgentPushNotificationNoTransport {}

// The call could not be performed.
message AgentPushNotificationFailure {
  // What the call said when it failed, and when it settled.
  optional AgentToolFailure error = 1;
}

// WE STOPPED BEING ABLE TO SEE THE WORK — not known to have failed, not
// known to have finished. THE ARM IS HOW WE CONCLUDED IT, stated by the file
// reader (the sidecar) or the stream owner (the shim) loudly rather than by
// silently dropping the run. Drawn as its own word ("lost"), never as a
// failure or a cancel.
message DetachedLost {
  oneof how {
    // The spool or transcript file disappeared from disk.
    DetachedLostFileVanished file_vanished = 1;
    // The run produced nothing past the reader's silence ruling.
    DetachedLostWentSilent went_silent = 2;
    // A boot sweep found the run open with no living producer.
    DetachedLostSweptUp swept_up = 3;
  }
}
message DetachedLostFileVanished {}
message DetachedLostWentSilent {}
message DetachedLostSweptUp {}

// The vendor's per-call progress beat, relayed as observed: the call is
// alive. A RELAY of an observed fact, never a shim-invented ping — the shim
// forwards the beat and keeps the wedge RULING for itself (a stalled call
// still settles as the unit's failure when the shim's timeout trips). One
// canonical form, embedded by every tool kind's progress arm.
message AgentToolCallProgress {
  // When the vendor last reported this call alive, epoch ms, as observed.
  int64 last_progress_at_ms = 1;
}

// The identity of one agent instance: the main-thread agent, or a subagent at
// any depth.
//
// OPAQUE; equality is the only question asked of it. Deliberately its OWN space,
// distinct from the identity of the call that spawned the agent — a spawn is a
// unit of the caller's work, and the agent it produced is a different thing. A
// consumer asking "whose work is this" reads this and never the enclosing unit's
// identity.
//
// CROSS-PLANE MINTING RULE (binding on every producer, so the stream plane and
// the file plane agree on one id for one agent): the MAIN agent's id is the
// ORIGINAL vendor session id (a resume or rotation keeps it; a FORK mints a new
// one and ports the history under it, re-minting every record identity the
// file plane derives keys from, so the child's rows land in the child's own
// book and never collide with the parent's); a SUBAGENT's
// id is the `tool_use_id` of the call that SPAWNED it, as the vendor's stream
// carries it and as the file plane records it in the agent's meta.json. The
// space stays the agent's own — consumers never derive the spawning unit's
// identity from it, even though the bytes coincide.
message AgentId {
  // The producer's identifier for the agent instance, carried verbatim. Compare
  // for equality; never parse or construct one.
  string value = 1;
}

// ==========================================================================
// The task tracker. A task is inherently bound to the agent working it — there
// is no backgrounded form of it, unlike a shell call or a subagent spawn — so
// what travels is the ACT the agent performed, on whatever stream that agent is
// running on. A task created in one turn and completed from another (or from a
// detached agent that owns it) is one task, joined by its tracker identity.
// ==========================================================================

// One act the agent performed on the task tracker, drawn in the turn — or the
// detached stream — the acting agent was running on.
message AgentTaskAct {
  // Which task the act concerned. The tracker's identity, not this turn's, so a
  // task edited from several turns remains one task.
  AgentTaskId task = 1;

  // What the agent did. Stopping is not an arm here: it is a change whose
  // resulting status is `killed`, so there is one way to say it rather than two.
  // What the agent did to the tracker. The arm decides whether a consumer adds
  // an entry or updates one it already holds; what the entry now IS comes from
  // `state` either way.
  oneof act {
    // The task did not exist before this. Add it.
    AgentTaskCreated created = 2;
    // The task existed and was altered. Replace what is held for it.
    AgentTaskChanged changed = 3;
    // The tracker REFUSED the act. Nothing was added and nothing changed;
    // `state` below carries the task as it still stands, unaltered.
    AgentTaskRejected rejected = 5;
  }

  // Where the act left the task, resolved by the producer, so no consumer
  // replays a sequence of acts to learn what a task currently is.
  AgentTaskState state = 4;
}

// The task did not exist before this act. The arm carries nothing: what the
// task now IS rides `state`, and a second copy here could disagree with it.
message AgentTaskCreated {}

// The task existed and this act altered it. Carries nothing, for the same
// reason as above.
message AgentTaskChanged {}

// The tracker refused the act. The task is unchanged, so `state` describes it
// as it still stands rather than as the act would have left it.
message AgentTaskRejected {
  // What the tracker said was wrong with the act.
  optional AgentToolFailure error = 1;
}

// A task as it stands after an act.
message AgentTaskState {
  // The task's subject line. UNSET = the act did not state one (an update
  // that changes only status keeps the subject the checklist already holds);
  // SET, even to "", = the act states it. Presence is what lets a consumer
  // tell "not stated" from "empty", exactly as `owner` below already does.
  optional string subject = 1;
  // Its full description. Presence as for `subject`.
  optional string description = 2;

  // Which agent it is assigned to, when it is assigned to one. Unset for a task
  // the agent created for itself and has not handed off, which is the ordinary
  // case. Presence rather than an empty-string sentinel.
  optional string owner = 3;

  // Where it stands. Arms rather than an enum, so a status arrives with the
  // evidence it implies and one added later is a compiler-surfaced gap. THE
  // SET IS THE TRACKER'S OWN, deliberately narrower than the vendor's shared
  // background-task vocabulary: a checklist item is a plan entry, not a
  // process, so process states (killed, paused, failed) are not spelled here.
  oneof status {
    // Recorded but not begun.
    AgentTaskPending pending = 4;
    // Being worked on now — the only status carrying a phrasing to show while
    // it runs.
    AgentTaskRunning running = 5;
    // Done, having achieved what it described.
    AgentTaskCompleted completed = 6;
    // Removed from the plan. Tags 7-9 are RETIRED: the process states
    // (failed, killed, paused) never belonged to a plan entry.
    AgentTaskDeleted deleted = 10;
  }

  // THE TRACKER IS A DAG, NOT A LIST. A task may declare what it blocks and
  // what blocks it, and a surface that draws the entries in tracker order
  // without these is hiding the ordering the author actually stated.
  //
  // Tasks this one blocks — none of them may proceed until this resolves.
  // Empty when it blocks nothing.
  repeated AgentTaskId blocks = 11;
  // Tasks blocking this one. Empty when nothing blocks it, which is what a
  // task ready to be worked looks like.
  repeated AgentTaskId blocked_by = 12;
}

// Created, not started.
message AgentTaskPending {}

// Being worked on now.
message AgentTaskRunning {
  // The present-continuous phrasing to show while it runs ("running the
  // migration"), as the agent supplied it. It lives here because it means
  // nothing for a task that is not running. Unset when the agent gave none —
  // the tool's parameter is optional — and a consumer then shows the subject
  // rather than inventing a phrasing.
  optional string active_form = 1;
}

// Finished, having done what it said it would.
message AgentTaskCompleted {}




// Removed from the tracker.
message AgentTaskDeleted {}

// The tracker's identity for one task. Opaque to every reader, never parsed;
// equality is the only question asked of it.
message AgentTaskId {
  // The tracker's identifier for the task. Stable across turns and across
  // agents, so acts arriving on different streams join here. Opaque: compare
  // for equality, never parse.
  string value = 1;
}

// ==========================================================================
// The agent's own output: its reasoning, and what it says. Two kinds rather
// than one, because reasoning can be entirely absent from the transcript while
// a response never is — and because they are drawn in different places.
//
// Both are identified by AgentActivity.activity_id, never by a field of
// their own, so two blocks arriving at once cannot merge.
// ==========================================================================

// The agent's reasoning: its scratchpad on the way to an answer, not addressed
// to the user. Drawn as a disclosure that sits open while it runs and collapses
// once it settles.
message AgentThinking {
  // Where the reasoning stands. Expect exactly one start, then any number of
  // updates, then exactly one terminal arm.
  oneof result {
    // This stream is now carrying this reasoning: the block has opened and
    // nothing has arrived in it yet. A consumer opens the disclosure with its
    // live indicator and no text.
    AgentThinkingStart start = 1;
    // Still reasoning. A consumer shows a live indicator and, if there is text,
    // the reasoning so far.
    AgentThinkingUpdate update = 2;
    // Reasoning finished; collapse the disclosure and stop the indicator.
    AgentThinkingSuccess success = 3;
    // Reasoning ended without finishing.
    AgentThinkingFailure failure = 4;
  }
}

// A reasoning block this stream has begun carrying, with nothing in it yet.
//
// EMPTY ON PURPOSE, for the same reason the prose start is. No start instant
// rides here: nothing draws a clock against reasoning.
message AgentThinkingStart {}

// Reasoning is arriving. The consumer draws a live indicator; whether it can
// draw any TEXT depends on the arm.
message AgentThinkingUpdate {
  // Whether there is any reasoning text to show. Both arms mean the model is
  // reasoning; only one of them can be drawn.
  oneof reasoning {
    // A fragment of reasoning text is streaming.
    AgentThinkingTextDelta text = 1;
    // The model is reasoning and withholding the text — it emits the block and
    // a signature but no text at all. There is nothing to draw but a live
    // indicator, and nothing whatever once it settles.
    AgentThinkingWithheld withheld = 2;
  }

  // THE VENDOR'S RUNNING ESTIMATE of what this reasoning has cost so far.
  //
  // AN ESTIMATE AND NOT A CHARGE, which is why it is not TokenUsage: the
  // billed figure arrives at settle as `TokenUsage.output_thinking_tokens`,
  // and the two will differ. Drawn as a live counter under a withheld block,
  // which is otherwise the one thing in a turn that shows nothing at all
  // while it runs. UNSET when the vendor reported no estimate.
  optional AgentThinkingTokenEstimate estimated = 3;
}

// What the vendor estimates a reasoning block has cost so far.
message AgentThinkingTokenEstimate {
  // The running estimate, whole — not a delta. A consumer draws this figure.
  uint64 estimated_tokens = 1;
  // How much the estimate grew since the previous frame, as the vendor stated
  // it. Carried for a consumer pacing an animation; the figure to DRAW is the
  // whole one above.
  uint64 estimated_tokens_delta = 2;
}

// One fragment of reasoning text, on the same terms as the prose update: the
// producer accumulates nothing, the consumer concatenates, and the terminal
// frame carries the whole text regardless.
message AgentThinkingTextDelta {
  // The text added since the previous frame; may split a word or line.
  string new_text = 1;
}

// Reasoning finished; the disclosure collapses.
message AgentThinkingSuccess {
  // The reasoning, whole. The same two arms as while arriving: a withheld block
  // settles withheld, and the consumer then draws nothing rather than an empty
  // card.
  oneof reasoning {
    // The reasoning, in full.
    AgentThinkingText text = 1;
    // The reasoning was withheld throughout. A consumer draws nothing at all
    // for this block once it settles — not an empty card.
    AgentThinkingWithheld withheld = 2;
  }
}

// Reasoning ended without finishing. Arms are DERIVED from the producer's real
// sites at the implementation wave; empty until then, because an invented arm
// is worse than an absent one.
message AgentThinkingFailure {
  // What the call said when it failed, and when it settled.
  optional AgentToolFailure error = 1;
}

// The reasoning in full, as settled — carried only on the terminal arms, for
// the same reason the settled prose is.
message AgentThinkingText {
  string text = 1;
}

// The model is reasoning but says nothing about it.
message AgentThinkingWithheld {}

// What the agent says to the user. One of these per text block the agent emits,
// so a turn holds SEVERAL: the commentary between tool calls and the answer at
// the end are the same kind of thing, differing only in what followed them.
//
// WHICH of them answered the turn is deliberately not stated here. A producer
// cannot know while writing one, since it depends on nothing further arriving;
// the turn's own conclusion names it.
message AgentResponse {
  // Where this block of prose stands. Expect exactly one start, then any number
  // of updates, then exactly one terminal arm.
  oneof result {
    // This stream is now carrying this block: it has opened and no prose has
    // arrived yet. A consumer draws the empty bubble, which is what makes the
    // agent visibly begin answering before the first token lands.
    AgentResponseStart start = 4;
    // Prose is still arriving; the bubble is visibly building.
    AgentResponseUpdate update = 1;
    // The block finished. Note this says nothing about the TURN finishing —
    // several blocks settle in a turn, and which one answered it is stated by
    // the turn's own conclusion.
    AgentResponseSuccess success = 2;
    // The block ended without completing. Whatever prose had arrived is still
    // carried and still shown.
    AgentResponseFailure failure = 3;
  }
}

// A prose block this stream has begun carrying, with nothing in it yet.
//
// EMPTY ON PURPOSE: the update arm carries only what ARRIVED, so an
// opened-but-silent block would otherwise be an update carrying an empty
// fragment — a sentinel standing in for a state. The arm states it instead.
message AgentResponseStart {}

// Prose is arriving; the bubble is visibly building.
//
// A FRAGMENT, NEVER THE WHOLE TEXT. The producer forwards each fragment as
// the vendor emits it and accumulates nothing; concatenation, coalescing and
// pacing are the consumer's. A fragment lost in transit is not detected here
// and is not recovered here: the terminal frame carries the whole text, so the
// settled bubble is always right.
message AgentResponseUpdate {
  // The markdown added since the previous frame. May begin or end mid-word,
  // mid-line or mid-construct: a fragment has no structure of its own.
  string new_markdown = 1;
}

// The block finished; the bubble stops building.
message AgentResponseSuccess {
  // What was said, whole.
  AgentResponseProse prose = 1;

  // WHO ACTUALLY WROTE THIS PROSE. The set arm is the answer.
  //
  // THIS EXISTS BECAUSE THE VENDOR SYNTHESIZES ERROR NOTICES AS ASSISTANT
  // PROSE. "API Error: connection closed mid-response" and "you have hit your
  // monthly spend limit" arrive in the same shape as an answer, so a consumer
  // that trusts the shape draws an outage as something the agent said. Only
  // the producer, which sees the vendor's own markers, can tell them apart;
  // by the time the prose reaches a consumer the evidence is gone.
  //
  // UNSET means the producer did not evaluate authorship, NOT that the prose
  // is the model's — a consumer must not read absence as a guarantee.
  oneof authorship {
    // The model wrote it. The ordinary case.
    AgentResponseFromModel from_model = 2;
    // The vendor's own tooling wrote it as a notice to the user; no model
    // produced these words. Draw it as a notice, never as the agent's answer.
    AgentResponseSynthesizedNotice synthesized_notice = 3;
  }

  // When the block settled. UNSET when the producer observed no instant.
  // Carried so a consumer's "N ago" corner is the REAL settle instant and
  // stays stable across replays, exactly as every other activity terminal's
  // settled_at does — a consumer that stamped its own compose-time clock
  // would reset the corner to zero on every re-compose.
  optional AgentActivitySettledAt settled_at = 4;
}

// The model wrote the prose.
message AgentResponseFromModel {}

// The prose is a notice the vendor synthesized, not something the model said.
message AgentResponseSynthesizedNotice {
  // WHAT THE NOTICE IS ABOUT, so a surface can route it — an allowance
  // exhausted is actionable, a transient warning is not.
  oneof subject {
    // The account has run out of its allowance and cannot proceed.
    AgentNoticeUsageLimit usage_limit = 1;
    // The account moved between allowance tiers or windows.
    AgentNoticeUsageTransition usage_transition = 2;
    // The account is approaching a limit but is not yet blocked.
    AgentNoticeUsageWarning usage_warning = 3;
    // The producer recognized the prose as synthesized but matched it to no
    // known subject. The text is all a consumer has.
    AgentNoticeUnclassified unclassified = 4;
  }

  // The HTTP status the vendor attached to the notice, when it attached one.
  // UNSET when it did not — most notices carry none.
  optional int32 http_status = 5;
}

message AgentNoticeUsageLimit {}
message AgentNoticeUsageTransition {}
message AgentNoticeUsageWarning {}
message AgentNoticeUnclassified {}

// The block ended without completing.
message AgentResponseFailure {
  // What had been said when it ended, carried because a truncated or refused
  // answer is still shown rather than discarded. May be empty — a refusal can
  // precede any text at all.
  AgentResponseProse prose = 1;
  // Why it ended. Arms are DERIVED from the producer's real sites at the wave.
  AgentResponseFailureReason reason = 2;

  // When the block settled as failed. UNSET when the producer observed no
  // instant. Carried so a consumer's "N ago" corner is the REAL settle
  // instant and stays stable across replays, exactly as every other activity
  // terminal's settled_at does.
  optional AgentActivitySettledAt settled_at = 3;
}

// Why a response ended without completing. The arms are the vendor's own
// stop facts, carried so a consumer never infers the ending from the prose.
// Vendor stops deliberately WITHOUT arms here: `pause_turn` (the vendor
// resumes it itself — nothing ended) and `compaction` (the context cut is that
// fact's home).
message AgentResponseFailureReason {
  oneof reason {
    // The vendor stopped at its output ceiling; the prose is cut short.
    AgentResponseStoppedAtMaxTokens max_tokens = 1;
    // The vendor refused to continue, with its explanation when it gave one.
    AgentResponseRefused refused = 2;
    // The context window was exceeded; nothing more could be read or said.
    AgentResponseContextWindowExceeded context_window_exceeded = 3;
    // The response was cut by a user-commanded stop mid-arrival.
    AgentResponseAborted aborted = 4;
    // The model emitted one of the request's stop sequences and stopped
    // there. The prose is complete as far as the model meant it, but it ended
    // on a boundary the CALLER set rather than on the model's own ending —
    // which is why it is a stop rather than a success.
    AgentResponseStoppedAtStopSequence stop_sequence = 5;
  }
}
message AgentResponseStoppedAtStopSequence {}
message AgentResponseStoppedAtMaxTokens {}
// The refusal, with the vendor's own account.
message AgentResponseRefused {
  // The vendor's stated explanation. UNSET when it gave none.
  optional AgentResponseRefusalExplanation explanation = 1;

  // Tags 2-6 are RETIRED: the refusal's category, model pair and billing
  // credit fields are deferred.
}

// The explanation element.
message AgentResponseRefusalExplanation {
  // The vendor's wording, verbatim.
  string text = 1;
}
message AgentResponseContextWindowExceeded {}
message AgentResponseAborted {}

// What the agent said, as markdown for the consumer to render. THE WHOLE
// TEXT, as settled — carried only on the terminal arms, so a settled frame
// describes itself and a consumer that missed every fragment still has it.
message AgentResponseProse {
  string markdown = 1;
}

// ==========================================================================
// The plain file and search tools. None carries an update arm: a read, a write,
// an edit or a search either returns or fails, and nothing draws a partial one.
// ==========================================================================

// The agent read a file.
message AgentRead {
  // Where the read stands. The start arm ANNOUNCES the call so the item can be
  // drawn while it runs: without it the first frame a consumer ever receives is
  // the terminal one, and a call in progress would be undrawable because the
  // item would not yet exist.
  oneof result {
    // This stream is now carrying this read. Sent ONCE per stream, when the
    // call is issued. There is no update arm: a read has no growth — nothing
    // observes it between its issue and its return.
    AgentReadStart start = 1;
    // The vendor's liveness beat while the call runs. NOT an update — no
    // growth is reported — and consumed by the daemon into the drawn
    // last-progress facts; a frame like any other, upserting the unit.
    AgentToolCallProgress progress = 4;
    // The file was read, whole or in part.
    AgentReadSuccess success = 2;
    // The read did not happen at all — no contents, partial or otherwise.
    AgentReadFailure failure = 3;
  }
}

// A read this stream has begun carrying.
//
// SELF-DESCRIBING, like every frame of an upserted unit: it repeats the path
// rather than relying on the consumer to have kept an earlier frame, because a
// frame that only makes sense beside its predecessor cannot be the first one a
// late-joining consumer receives.
message AgentReadStart {
  // Which file is being read. Drawn as the item's headline.
  ReadPath path = 1;
  // When the read began, so a consumer can draw how long it has been waiting.
  AgentActivityStartedAt started_at = 2;
  // Tag 3 is RETIRED: the PDF page-range request is deferred with the pdf
  // read extent.
}

// The file was read.
message AgentReadSuccess {
  // Which file. One fact in one form, embedded by whoever draws it rather than
  // restated, and the value a highlighter's grammar is chosen from.
  ReadPath path = 1;

  // How much of the file came back. The set arm IS whether more exists, so a
  // whole read carries no truncation vocabulary and a short one cannot omit the
  // figure that makes it legible.
  oneof extent {
    // The file came back entire. Nothing further can be fetched.
    AgentReadWhole whole = 2;
    // The file was long, so only its leading portion came back. More exists,
    // and a consumer may offer to fetch it.
    AgentReadHead head = 3;
    // The caller asked for a MIDDLE SLICE (an offset read) and that slice came
    // back. The common shape for a large file a caller already knows its way
    // around.
    AgentReadRange range = 10;
    // Tags 4-8 are RETIRED: the image, pdf, notebook, split-to-directory
    // and unchanged extents are deferred — see the deferred-work
    // metadocument ("non-text read extents").
  }

  // When the read settled. UNSET when the producer observed no instant.
  optional AgentActivitySettledAt settled_at = 9;
}

// The file came back entire.
message AgentReadWhole {
  // Everything the file holds.
  string contents = 1;
}

// A middle slice of the file: the caller named a starting line and got a
// bounded run of lines from there. The daemon highlights exactly this text —
// what a consumer draws is what was actually read, never a re-fetch.
message AgentReadRange {
  // The slice, cut on line boundaries.
  string contents = 1;
  // The 1-based line the slice begins at.
  uint32 first_line = 2;
  // How many lines the slice holds.
  uint32 line_count = 3;
  // What the whole file holds, so a consumer states "lines 400-499 of 4,312"
  // without arithmetic and without a second request.
  uint32 total_lines = 4;
}

// The file was long, so only its leading portion came back.
message AgentReadHead {
  // The leading portion, cut on a line boundary. A HEAD rather than a slice from
  // the middle, deliberately: a highlighter reading from offset zero has correct
  // context, while text beginning mid-string or mid-comment is mis-highlighted
  // until it happens to resync.
  string contents = 1;
  // What the whole file holds, so a consumer states "showing 200 of 4,312"
  // without arithmetic and without a second request.
  uint32 total_lines = 2;

  // WHAT CUT IT. The set arm matters because the two cuts have different
  // guarantees: a line cap always lands on a line boundary, and a token cap
  // does not — a consumer that assumes whole lines will draw a truncated one
  // as if it were complete.
  oneof cut {
    // Cut at a line budget, on a line boundary.
    AgentReadCutAtLineCap line_cap = 3;
    // Cut at a TOKEN budget. The last line carried may be incomplete, and the
    // line count above is therefore a count of lines STARTED, not finished.
    AgentReadCutAtTokenCap token_cap = 4;
  }
}

// The read was cut at a line budget.
message AgentReadCutAtLineCap {}

// The read was cut at a token budget, possibly mid-line.
message AgentReadCutAtTokenCap {}

// The read did not happen. Arms are DERIVED from the producer's real sites at
// the implementation wave; empty until then.
message AgentReadFailure {
  // What the call said when it failed, and when it settled.
  optional AgentToolFailure error = 1;

  // What was to be read, restated from the start so the settled frame stands
  // alone: a call's start and its settle upsert ONE unit, so once the call
  // settles its start is gone from any store that keeps the latest frame, and
  // a replay drawing this frame alone must still name the file.
  ReadPath path = 2;
}

// A path a file tool acted on.
message ReadPath {
  // The path as the tool resolved it.
  string path = 1;
}

// When a tool call was handed to whatever performs it.
//
// A consumer ANIMATES ITS OWN CLOCK from this instant and the producer never
// restates an elapsed figure. Two reasons, and the second is the load-bearing
// one: an elapsed count on the wire would be a second authority for a value
// derivable from one instant, and it would arrive at the producer's heartbeat
// cadence, so a drawn clock would jump to network timing instead of ticking.
message AgentActivityStartedAt {
  // Milliseconds since the Unix epoch. A wall-clock instant rather than a
  // duration, because a duration is stale the moment it is serialized.
  int64 at_ms = 1;
}

// One hunk of a unified diff, as the producer's structured patch states it.
// Stated rather than computed: the producer diffs at the moment of the change,
// so context lines and line numbers describe the file as it actually was, and no
// consumer re-reads a file that a later change has already moved on from.
message FilePatchHunk {
  // Where the hunk sits in the file as it was.
  FilePatchHunkRange old_range = 1;
  // Where it sits in the file as it now is.
  FilePatchHunkRange new_range = 2;
  // The hunk's lines in unified-diff form, each carrying its own leading marker,
  // so context, additions and removals are ONE ordered sequence rather than
  // three lists a consumer has to interleave correctly to draw.
  repeated string lines = 3;
}

// A span of lines in one version of a file.
message FilePatchHunkRange {
  // First line of the span, one-based, so a card numbers its lines the way the
  // file does.
  uint32 start = 1;
  // How many lines the span covers.
  uint32 lines = 2;
}

// The agent wrote a file: handed over its whole new contents, creating it or
// replacing what was there. Distinct from an edit, which matches and replaces a
// string inside a file that must already contain it.
message AgentWrite {
  // Where the write stands. The start arm announces the call so the item is
  // drawable before the write returns.
  oneof result {
    // This stream is now carrying this write. Sent ONCE per stream, at issue.
    // There is no update arm: a write has no growth.
    AgentWriteStart start = 1;
    // The vendor's liveness beat while the call runs. NOT an update — no
    // growth is reported — and consumed by the daemon into the drawn
    // last-progress facts; a frame like any other, upserting the unit.
    AgentToolCallProgress progress = 4;
    // The file was written, and the change is described as hunks.
    AgentWriteSuccess success = 2;
    // The write did not happen; the file is as it was.
    AgentWriteFailure failure = 3;
    // Diagnostics the connected IDE's language server raised against this
    // change, injected by the vendor AFTER the result (new findings only,
    // never the file's standing lint state). Arrives as a frame of this
    // same unit following the terminal — a consequence, not a state: the
    // consumer applies it to the settled card. No frame ever says "none
    // are coming"; absence is simply no such frame.
    AgentDiagnosticsReport diagnostics = 5;
  }
}

// A write this stream has begun carrying.
message AgentWriteStart {
  // Which file is being written. Drawn as the item's headline. NOTHING is said
  // here about whether it will be created or overwritten: that is the outcome's
  // to state, and claiming it now would be a guess the success arm could
  // contradict.
  ReadPath path = 1;
  // When the write began.
  AgentActivityStartedAt started_at = 2;
}

// The file was written.
message AgentWriteSuccess {
  // Which file.
  ReadPath path = 1;

  // Whether the file existed beforehand. The producer's own distinction, so a
  // creation is never drawn as a rewrite of nothing.
  oneof outcome {
    // The file did not exist before. Every hunk line is an addition.
    AgentWriteCreated created = 2;
    // The file existed and its contents were replaced. The hunks describe what
    // changed rather than the whole new file.
    AgentWriteUpdated updated = 3;
  }

  // What changed, as hunks. For a creation every line is an addition. The
  // producer diffs after the fact precisely so a card can show the CHANGE
  // rather than the whole file it was handed.
  repeated FilePatchHunk patch = 4;

  // Whether the user altered the proposed content at the permission gate before
  // accepting it. Carried because it is the only signal that what landed is not
  // what the agent proposed — a card drawing the agent's version when the user
  // changed it would be showing something that never happened.
  bool user_modified = 5;

  // When the write settled. UNSET when the producer observed no instant.
  optional AgentActivitySettledAt settled_at = 6;
}

// The file did not exist before this write.
message AgentWriteCreated {}

// The file existed and its contents were replaced.
message AgentWriteUpdated {}

// The write did not happen. Arms are DERIVED from the producer's real sites at
// the implementation wave; empty until then.
message AgentWriteFailure {
  // What the call said when it failed, and when it settled.
  optional AgentToolFailure error = 1;

  // What was to be written, restated from the start so the settled frame
  // stands alone: a call's start and its settle upsert ONE unit, so once the
  // call settles its start is gone from any store that keeps the latest frame,
  // and a replay drawing this frame alone must still name the file.
  ReadPath path = 2;
}

// The agent edited a file: replaced a matched string, which must have been
// present and (unless every occurrence was requested) unique.
message AgentEdit {
  // Where the edit stands. The start arm announces the call so the item is
  // drawable before the edit returns.
  oneof result {
    // This stream is now carrying this edit. Sent ONCE per stream, at issue.
    // There is no update arm: a edit has no growth.
    AgentEditStart start = 1;
    // The vendor's liveness beat while the call runs. NOT an update — no
    // growth is reported — and consumed by the daemon into the drawn
    // last-progress facts; a frame like any other, upserting the unit.
    AgentToolCallProgress progress = 4;
    // The edit applied to at least one occurrence.
    AgentEditSuccess success = 2;
    // The edit did not apply — commonly because the matched text was absent, or was not unique when only one occurrence was requested.
    AgentEditFailure failure = 3;
    // Diagnostics the connected IDE's language server raised against this
    // change, injected by the vendor AFTER the result (new findings only,
    // never the file's standing lint state). Arrives as a frame of this
    // same unit following the terminal — a consequence, not a state: the
    // consumer applies it to the settled card. No frame ever says "none
    // are coming"; absence is simply no such frame.
    AgentDiagnosticsReport diagnostics = 5;
  }
}

// An edit this stream has begun carrying.
message AgentEditStart {
  // Which file is being edited. Drawn as the item's headline. The matched and
  // replacement text are deliberately absent: a consumer draws the CHANGE from
  // the success arm's hunks, and the raw strings would be a second, unresolved
  // description of the same thing.
  ReadPath path = 1;
  // When the edit began.
  AgentActivityStartedAt started_at = 2;
}

// The edit applied.
message AgentEditSuccess {
  // Which file.
  ReadPath path = 1;

  // What changed, as hunks — SEVERAL when every occurrence was replaced, so the
  // occurrence count is an observable rather than a flag the consumer must
  // reconcile against the hunks it was given.
  repeated FilePatchHunk patch = 2;

  // Whether the user altered the proposed edit at the permission gate before it
  // applied.
  bool user_modified = 3;

  // When the edit settled. UNSET when the producer observed no instant.
  optional AgentActivitySettledAt settled_at = 4;
}

// The edit did not apply — the string was absent, or was not unique and every
// occurrence was not requested. Arms are DERIVED from the producer's real sites
// at the wave; empty until then.
message AgentEditFailure {
  // What the call said when it failed, and when it settled.
  optional AgentToolFailure error = 1;

  // What was to be edited, restated from the start so the settled frame stands
  // alone: a call's start and its settle upsert ONE unit, so once the call
  // settles its start is gone from any store that keeps the latest frame, and
  // a replay drawing this frame alone must still name the file.
  ReadPath path = 2;
}

// ==========================================================================
// The search tools. Both answer with a list that may stop short of every match,
// and both state that fact as an arm rather than as two counts a consumer
// compares — so "was this truncated?" is read off the schema instead of derived.
// ==========================================================================

// The agent searched file CONTENTS for a pattern.
message AgentGrep {
  // Where the search stands. The start arm announces the call: a search over a
  // large tree is not instant, and without an announcement the item would not
  // exist until it finished.
  oneof result {
    // This stream is now carrying this search. Sent ONCE per stream, at issue.
    // There is no update arm: a search reports nothing until it is done.
    AgentGrepStart start = 1;
    // The vendor's liveness beat while the call runs. NOT an update — no
    // growth is reported — and consumed by the daemon into the drawn
    // last-progress facts; a frame like any other, upserting the unit.
    AgentToolCallProgress progress = 4;
    // The search ran. Matching nothing is a success with an empty answer, not a failure — the caller asked a question and got one.
    AgentGrepSuccess success = 2;
    // The search could not run at all.
    AgentGrepFailure failure = 3;
  }
}

// What was searched for. Carried on EVERY frame of the search, not only the
// announcement, because each frame of an upserted unit stands alone.
message AgentGrepQuery {
  // The pattern, as the caller wrote it. Drawn verbatim and never interpreted:
  // the regex dialect belongs to whatever performs the search.
  string pattern = 1;
  // Where the search was rooted. UNSET means the caller named no root and the
  // performer chose one, so a consumer draws no scope rather than inventing a
  // default it cannot know.
  optional string path = 2;
  // A filename filter narrowing which files were searched. UNSET means every
  // file under the root was eligible.
  optional string glob = 3;
  // A language or file-type filter, as the search names its types ("go",
  // "rust"). UNSET means no type filter was applied — which is different from
  // a filter that matched every type.
  optional string file_type = 4;
  // Whether the pattern was matched without regard to case. Carried because
  // case-insensitivity is invisible in the rendered result: the same output
  // could have come from either mode, and only this says which.
  bool case_insensitive = 5;
  // Whether the pattern was allowed to match across line boundaries.
  bool multiline = 6;
}

// A search this stream has begun carrying.
message AgentGrepStart {
  // What is being searched for. Drawn as the item's headline.
  AgentGrepQuery query = 1;
  // When the search began.
  AgentActivityStartedAt started_at = 2;
}

// The search ran. A search that matched nothing is a success with an empty
// answer, never a failure: the caller asked a question and got one.
message AgentGrepSuccess {
  // What was searched for, repeated here so a settled search frame describes
  // itself without the announcement beside it.
  AgentGrepQuery query = 4;

  // WHICH SHAPE of answer this is, matching the shape the call asked for. The
  // three are genuinely different answers rather than three views of one, which
  // is why each carries only what applies to it: a count-mode search knows no
  // filenames, and a filenames-mode search knows no matching lines.
  oneof matches {
    // The matching lines themselves. Expect this when the call asked for
    // content.
    AgentGrepContent content = 1;
    // Only the files that contained a match — no lines. Expect this when the
    // call asked for filenames.
    AgentGrepFiles files = 2;
    // Only how many matches there were. Expect this when the call asked for a
    // count.
    AgentGrepCount count = 3;
  }

  // When the search settled. UNSET when the producer observed no instant.
  optional AgentActivitySettledAt settled_at = 5;
}

// The matching lines themselves.
message AgentGrepContent {
  // The matching lines as the search rendered them, including whatever
  // line-number and context decoration the call requested. Rendered by the
  // search rather than reassembled here, so what a reader sees is what the
  // agent saw.
  string content = 1;

  // Whether these are ALL the matching lines. A search caps its own output on a
  // large tree, so a short answer is ordinary rather than exceptional; the set
  // arm says which case this is.
  oneof extent {
    // Every matching line is here.
    AgentGrepContentAll all = 2;
    // The answer stops short. A consumer should say so rather than presenting
    // it as the full result.
    AgentGrepContentPartial partial = 3;
  }
}

// Every matching line is present.
message AgentGrepContentAll {
  // How many matching lines there were — all of them shown.
  uint32 lines_returned = 1;
}

// The answer stops short of every matching line.
message AgentGrepContentPartial {
  // How many matching lines are present here.
  uint32 lines_returned = 1;
  // How many matching lines were left out. The OMITTED figure rather than a
  // total, because that is what a reader is shown ("42 more not shown") and
  // because a total invites every consumer to subtract; the total is recoverable
  // by addition where anything needs it.
  uint32 lines_omitted = 2;
}

// Only the files that contained a match, without the matching lines.
message AgentGrepFiles {
  // The matching paths, in the order the search returned them. That order is
  // the search's own and carries no ranking; a consumer that wants another
  // order sorts, and does not read meaning into this one.
  repeated string paths = 1;

  // Whether these are all the matching files.
  oneof extent {
    // Every matching file is listed.
    AgentGrepFilesAll all = 2;
    // The list stops short of every matching file.
    AgentGrepFilesPartial partial = 3;
  }
}

// Every matching file is present.
message AgentGrepFilesAll {
  // How many files matched — all of them listed.
  uint32 files_returned = 1;
}

// The list stops short of every matching file.
message AgentGrepFilesPartial {
  // How many files are listed here.
  uint32 files_returned = 1;
  // How many matching files were left out.
  uint32 files_omitted = 2;
}

// Only how many matches there were. No completeness arm: a count is either
// produced or the search failed, and a partial count would be a number with no
// stated meaning.
message AgentGrepCount {
  // Total matches across every file searched.
  uint32 matches = 1;
}

// The search could not run. Arms are DERIVED from the producer's real sites at
// the implementation wave; empty until then.
message AgentGrepFailure {
  // What the call said when it failed, and when it settled.
  optional AgentToolFailure error = 1;

  // What was searched for, restated from the start so the settled frame stands
  // alone: a call's start and its settle upsert ONE unit, so once the call
  // settles its start is gone from any store that keeps the latest frame, and
  // a replay drawing this frame alone must still state the query.
  AgentGrepQuery query = 2;
}

// The agent matched file PATHS against a pattern.
message AgentGlob {
  // Where the match stands. The start arm announces the call, for the same
  // reason the search's does: a walk over a large tree is not instant.
  oneof result {
    // This stream is now carrying this match. Sent ONCE per stream, at issue.
    // There is no update arm: a match reports nothing until it is done.
    AgentGlobStart start = 1;
    // The vendor's liveness beat while the call runs. NOT an update — no
    // growth is reported — and consumed by the daemon into the drawn
    // last-progress facts; a frame like any other, upserting the unit.
    AgentToolCallProgress progress = 4;
    // The match ran. Matching nothing is a success with an empty list.
    AgentGlobSuccess success = 2;
    // The match could not run at all.
    AgentGlobFailure failure = 3;
  }
}

// What was matched against. Carried on every frame, so each stands alone.
message AgentGlobQuery {
  // The pattern, as the caller wrote it. Drawn verbatim; the glob dialect
  // belongs to whatever performs the walk.
  string pattern = 1;
  // Where the walk was rooted. UNSET means the caller named no root and the
  // performer chose one.
  optional string path = 2;
}

// A match this stream has begun carrying.
message AgentGlobStart {
  // What is being matched. Drawn as the item's headline.
  AgentGlobQuery query = 1;
  // When the walk began.
  AgentActivityStartedAt started_at = 2;
}

// The match ran. Matching nothing is a success with an empty list.
message AgentGlobSuccess {
  // What was matched against, repeated here so a settled match frame describes
  // itself without the announcement beside it.
  AgentGlobQuery query = 4;

  // The matching paths, in the order the search returned them.
  repeated string paths = 1;

  // Whether these are all the matching paths.
  oneof extent {
    // Every matching path is listed.
    AgentGlobAll all = 2;
    // The list stops short. How much was left out may itself be approximate.
    AgentGlobPartial partial = 3;
  }

  // When the walk settled. UNSET when the producer observed no instant.
  optional AgentActivitySettledAt settled_at = 5;
}

// Every matching path is present.
message AgentGlobAll {
  // How many paths matched — all of them listed.
  uint32 files_returned = 1;
}

// The list stops short of every matching path.
message AgentGlobPartial {
  // How many paths are listed here.
  uint32 files_returned = 1;

  // How many were left out — and whether that figure can be trusted as exact.
  // The underlying search can cap its OWN counting, in which case the producer
  // knows only a floor. Stated as arms so a consumer never draws a floor as a
  // total: "42 more" and "at least 42 more" are different claims, and only one
  // of them is safe to make.
  oneof omitted {
    // The omitted figure is exact and may be drawn as such.
    AgentGlobOmittedExact exact = 2;
    // The omitted figure is a floor. Draw it as "at least N", never as a
    // total — the real number may be larger and is unknown.
    AgentGlobOmittedAtLeast at_least = 3;
  }
}

// The omitted figure is exact.
message AgentGlobOmittedExact {
  // How many matching paths were left out.
  uint32 files_omitted = 1;
}

// The omitted figure is a lower bound, because the search stopped counting.
message AgentGlobOmittedAtLeast {
  // At least this many matching paths were left out; there may be more.
  uint32 files_omitted_at_least = 1;
}

// The match could not run. Arms are DERIVED from the producer's real sites at
// the implementation wave; empty until then.
message AgentGlobFailure {
  // What the call said when it failed, and when it settled.
  optional AgentToolFailure error = 1;

  // What was matched against, restated from the start so the settled frame
  // stands alone: a call's start and its settle upsert ONE unit, so once the
  // call settles its start is gone from any store that keeps the latest frame,
  // and a replay drawing this frame alone must still state the pattern.
  AgentGlobQuery query = 2;
}

// ---- The shell: a command, what it said, and where it went ----

// The agent running a shell command.
//
// A FOREGROUND SHELL CALL HAS NO OUTPUT UNTIL IT RETURNS. Nothing observes a
// running command's output on this surface: the producer's per-call progress
// signal carries elapsed time and a liveness flag and no bytes, and the output
// arrives once, whole, at the return. Incremental output exists only for a
// BACKGROUNDED command, and a backgrounded command is detached work travelling
// on its own stream — so a growing spool is that stream's business, never this
// item's.
//
// THIS ITEM'S RESULT IS LEGITIMATELY NEVER RESOLVED FOR A COMMAND THAT
// BACKGROUNDS. Such a command did not CONCLUDE, it MOVED: the detached-work
// frame naming this item is what says so, and a consumer that has seen it stops
// expecting a terminal frame here and follows the work's own stream instead. An
// arm here saying "backgrounded" would be a second announcement of one fact,
// and the two could disagree about whether the work left.
message AgentBash {
  // Where the call stands. The update arm announces it, which matters more here
  // than for any other tool: a shell command routinely runs for minutes, and
  // without an announcement the item would not exist for the whole of that.
  oneof result {
    // This stream is now carrying this command. Sent ONCE per stream, at issue —
    // and AGAIN on the work's own stream if the command detaches, because a
    // stream's first frame can never presume a frame delivered on another one.
    AgentBashStart start = 1;
    // The run's RENDERED OUTPUT so far: the most recent bytes, bounded by
    // AgentBashTailCap, and how much came before them. A SNAPSHOT that
    // supersedes the previous one whole, never a delta.
    AgentBashTail tail = 6;
    // The vendor's liveness beat while the call runs. NOT an update — no
    // growth is reported — and consumed by the daemon into the drawn
    // last-progress facts; a frame like any other, upserting the unit.
    AgentToolCallProgress progress = 5;
    // The command reached the shell and the shell reported on it.
    AgentBashSuccess success = 3;
    // The call could not be performed at all.
    AgentBashFailure failure = 4;
  }
  // RETIRED 2026-09-23 (owner ruling: output beyond what is rendered is not
  // stored): `update` carried the contiguous-delta model, one AgentBashUpdate
  // per chunk with a `from_offset` gap detector, which stored a spool's whole
  // file. `tail` replaces it. A row stored under it decodes to NO arm and is
  // outmoded; the number and name are never reused.
  reserved 2;
  reserved "update";
}

// The command the agent ran.
message AgentBashCommand {
  // The command line, verbatim and unparsed. A consumer draws it and never
  // interprets it: a shell line's meaning belongs to the shell.
  string line = 1;

  // The agent's own one-line account of what the command does, written for a
  // reader rather than for the shell. UNSET when the agent supplied none, in
  // which case a consumer draws the line above and nothing finer.
  optional string description = 2;

  // WHETHER THE COMMAND RAN INSIDE THE SANDBOX. The set arm is the answer.
  //
  // CONSENT-RELEVANT, which is why it is stated rather than assumed: a command
  // that ran with the sandbox deliberately disabled reached the host directly,
  // and is otherwise indistinguishable from one that did not. UNSET means the
  // producer reported nothing either way — a consumer must NOT read absence as
  // "sandboxed".
  oneof sandbox {
    // The command ran inside the sandbox. The ordinary path.
    AgentBashSandboxed sandboxed = 3;
    // The sandbox was deliberately disabled for this command.
    AgentBashSandboxDisabled sandbox_disabled = 4;
  }
}

// The command ran inside the sandbox.
message AgentBashSandboxed {}

// The sandbox was deliberately disabled for this command.
message AgentBashSandboxDisabled {}

// A command this stream has begun carrying.
//
// `start` MEANS "THIS STREAM NOW CARRIES THIS WORK", NOT "THIS WORK BEGAN". A
// command issued in a turn and then detached is announced twice — once on the
// turn's stream, once on its own — under ONE identity, so the second is an
// upsert rather than a new unit. The second announcement repeats the ORIGINAL
// instant below, so a drawn clock does not reset when the work moves.
message AgentBashStart {
  // What is running. Drawn as the item's headline.
  AgentBashCommand command = 1;
  // When the shell was handed the command, so a consumer can draw how long it
  // has been running.
  AgentActivityStartedAt started_at = 2;
}

// How much of a detached run's output is ever stored or carried: THE
// RENDERER'S CAP, stated once here so the producer that writes the tail and the
// consumer that draws it read one number.
//
// It is an enum because protobuf has no constants, and the value is the fact:
// `AGENT_BASH_TAIL_CAP_BYTES` is the number of bytes, never an index.
enum AgentBashTailCap {
  AGENT_BASH_TAIL_CAP_UNSPECIFIED = 0;
  // 16 KiB. Owner ruling 2026-09-23: output beyond what is rendered is not
  // stored, so the renderer's cap IS the storage bound.
  AGENT_BASH_TAIL_CAP_BYTES = 16384;
}

// A detached run's output as it is DRAWN: its most recent bytes and an account
// of the bytes before them.
//
// EXPECT THIS ARM ONLY ONCE THE COMMAND HAS DETACHED. A foreground command's
// output is observable NOWHERE while it runs, so an in-turn shell item goes
// straight from `start` to a terminal arm. Incremental output exists only for a
// command that became background work, whose output is read from the file
// written for it.
//
// A SNAPSHOT, NOT A DELTA (owner ruling 2026-09-23: output beyond what is
// rendered is not stored). Each frame supersedes the last WHOLE, so a consumer
// draws the newest frame it holds and never concatenates two. There is no
// offset and NO GAP DETECTOR: contiguity was the delta model's requirement,
// and a snapshot that states its own omitted count cannot have a hole.
//
// THE PRODUCER CUTS, THE CONSUMER DRAWS VERBATIM. Once anything is omitted the
// text begins on a LINE START (the bytes before the first line break of the
// window are omitted too), so a drawn tail never opens mid-line; a window that
// holds no line break at all is kept whole from its first complete character.
message AgentBashTail {
  // The most recent output, at most AGENT_BASH_TAIL_CAP_BYTES bytes.
  // Deliberately UNPARSED: a consumer draws it and never interprets it.
  string text = 1;

  // How many bytes of output came BEFORE `text` and are not carried. Zero when
  // `text` is the whole output so far. `bytes_omitted + len(text)` is every
  // byte the run has written.
  uint64 bytes_omitted = 2;

  // How many LINES those omitted bytes held, counting a line the cut split as
  // one — the count a reader is told was not shown. Zero exactly when
  // `bytes_omitted` is.
  uint64 lines_omitted = 3;
}

// A command that reached the shell, and what became of it.
//
// A NONZERO EXIT IS STILL THIS ARM. The failure arm is for a call that could not
// be performed; a command that ran and failed ran, and what it printed is the
// answer the caller wanted.
message AgentBashSuccess {
  // What was run, repeated here so a settled frame describes itself.
  AgentBashCommand command = 1;

  // How it ended. Both arms carry output and differ only in treatment, but the
  // difference is worth drawing: an interrupted command's last lines are usually
  // the reason it was cut.
  oneof outcome {
    // The command ran to completion. The ordinary path.
    AgentBashCompleted completed = 2;
    // The command was cut short before finishing.
    AgentBashInterrupted interrupted = 3;
  }

  // When the call settled. UNSET when the producer observed no instant.
  optional AgentActivitySettledAt settled_at = 4;
}

// A command that ran to completion.
message AgentBashCompleted {
  // Everything the command said. ALWAYS SET, even for a command that said
  // nothing: an empty output still draws its header, so a reader can tell "ran
  // and was silent" from "has not run".
  AgentBashOutput output = 1;

  // HOW THE SHELL SAID IT ENDED.
  //
  // UNSET FOR A FOREGROUND COMMAND, where no producer states a termination and
  // the command's own output is the only account of how it went. SET FOR A
  // DETACHED SHELL, whose spool is terminated by the shell itself — so the
  // fact exists for exactly one of the two paths, and stating it as absent for
  // the other is the honest shape.
  optional AgentBashTermination termination = 2;
}

// How a shell said a command ended. The set arm is the answer, because an exit
// code and a kill are different endings and only one of them has a number.
message AgentBashTermination {
  oneof how {
    // The command exited and the shell reported its status.
    AgentBashExited exited = 1;
    // The command was killed by a signal and never reported a status.
    AgentBashKilled killed = 2;
  }
}

// The command exited on its own.
message AgentBashExited {
  // The exit status the shell reported. Zero means success; anything else is
  // the command's own verdict on itself, NOT a failure of the call.
  int32 code = 1;
}

// The command was killed and never reported a status.
message AgentBashKilled {}

// A command cut short before it finished.
message AgentBashInterrupted {
  // What the command had said by the time it was cut. Drawn as a completed
  // command's output is, under an interrupted treatment.
  AgentBashOutput output = 1;

  // WHY it was cut. UNSET when the producer stated no cause. Worth
  // distinguishing: a command a person stopped is a decision, and one its own
  // timeout cut is a limit a reader may want to raise.
  //
  // A command a person BACKGROUNDED is deliberately not an arm here: it did
  // not end, it moved, and the detached-work frame naming this unit is what
  // says so.
  oneof cause {
    // A person stopped it.
    AgentBashInterruptedByUser by_user = 2;
    // It outlived its own timeout.
    AgentBashInterruptedByTimeout timed_out = 3;
    // We stopped being able to see it — the spool vanished or went silent;
    // not known to have failed. Draws as "lost", never as a cancel.
    DetachedLost lost = 4;
  }
}

// A person stopped the command.
message AgentBashInterruptedByUser {}

// The command outlived its own timeout.
message AgentBashInterruptedByTimeout {
  // The timeout that was exceeded, in milliseconds. THE CONFIGURED LIMIT, not
  // the command's runtime.
  uint64 timeout_ms = 1;
}

// What a command said, in the form it said it.
message AgentBashOutput {
  // Which form the output takes. A command whose output is image data is not
  // text with a flag beside it — the two are drawn by different renderers
  // entirely, so the set arm IS the form.
  oneof form {
    // Ordinary character output. Expect this for all but a handful of
    // image-producing commands.
    AgentBashOutputText text = 1;
    // The output is image data rather than characters. Draw it as an image;
    // there is no text to show.
    AgentBashOutputImage image = 2;
    // NO OUTPUT WAS OBSERVED — the run was lost or reconciled after a restart
    // and nothing on disk or on the stream said what it printed. Distinct from
    // empty text (a command that printed nothing) and from `partial`
    // omission: the producer states that it does not know.
    AgentBashOutputNotObserved not_observed = 3;
  }
}

// No output was observed for this run. Empty: the arm is the whole fact.
message AgentBashOutputNotObserved {}

// Character output, with the two streams kept apart.
message AgentBashOutputText {
  // Standard output, verbatim and unparsed.
  string stdout = 1;

  // Standard error, verbatim and unparsed.
  //
  // KEPT SEPARATE FROM STDOUT RATHER THAN INTERLEAVED. A consumer that wants
  // them woven can concatenate, while one handed a single blob can never pull
  // them apart again — and no producer here states an interleaving order worth
  // preserving, so weaving them would fabricate one.
  string stderr = 2;

  // Whether this is everything the command said. The set arm states it, so no
  // consumer compares a length against a total to find out.
  oneof extent {
    // Everything the command said is carried above.
    AgentBashOutputWhole whole = 3;
    // The output was too large to carry inline and was cut.
    AgentBashOutputPartial partial = 4;
  }
}

// Everything the command said is carried above.
message AgentBashOutputWhole {}

// The output was cut because it was too large to carry inline.
message AgentBashOutputPartial {
  // How many bytes were left out. The vendor declares totals, so the shim
  // derives this figure once by subtraction; consumers never re-derive it from a
  // total. This is the figure a consumer draws ("1.2 MB more not shown"), and
  // the full size stays recoverable by addition if anything needs it.
  uint64 bytes_omitted = 1;

  // Where the WHOLE output was spilled, when the producer kept it. UNSET when
  // it kept nothing, in which case the omitted bytes are gone.
  //
  // WITHOUT THIS A TRUNCATION IS A DEAD END: a consumer offered "1.2 MB more
  // not shown" has nothing to offer the user next.
  optional AgentBashSpilledOutput spilled = 2;
}

// The file the whole of a command's output was written to.
message AgentBashSpilledOutput {
  // Its path on the host the producer runs on. Meaningful only to a reader on
  // that host.
  string path = 1;
  // How large the whole output is, in bytes — the figure a consumer shows
  // before offering to open it.
  uint64 size_bytes = 2;
}

// Image data the command produced instead of text.
message AgentBashOutputImage {
  // The image bytes as the command emitted them.
  bytes data = 1;
  // The IANA media type of `data`, so a consumer need not sniff the bytes to
  // decide how to decode them.
  string media_type = 2;
}

// The call could not be performed. Arms are DERIVED from the producer's real
// sites at the implementation wave; empty until then.
message AgentBashFailure {
  // What the call said when it failed, and when it settled.
  optional AgentToolFailure error = 1;

  // What was run, restated from the start so the settled frame stands alone,
  // exactly as the success arm restates it: a call's start and its settle
  // upsert ONE unit, so once the call settles its start is gone from any store
  // that keeps the latest frame, and a replay drawing this frame alone must
  // still state the command.
  AgentBashCommand command = 2;
}

// ---- The subagent: a spawn, its progress, and its report ----

// The agent spawning a subagent.
//
// ONE UNIT, ONE LIFECYCLE, WHICHEVER STREAM CARRIES IT. Detachment moves which
// stream this unit's frames arrive on and changes nothing about the unit. An
// awaited spawn concludes on its caller's stream; a detached one concludes on
// its own. Detachment is stated ONLY by the detached-work frame naming this
// unit, never by an arm here.
//
// THE PRODUCER'S OWN SPLIT IS NOT REFLECTED HERE, DELIBERATELY. The underlying
// tool returns a full report when the spawn is awaited and a bare launch
// acknowledgement when it is backgrounded, and the shim maps BOTH onto this one
// lifecycle. Likewise an awaited spawn may report no progress while a detached
// one does. A consumer that had to know which of those the producer used would
// be learning a calling convention in order to draw a bubble.
//
// WHAT THE SUBAGENT ACTUALLY DID IS NOT HERE. Its reasoning, prose and tool
// calls are AgentActivity of their own — nested under this unit's caller on the
// `subagent_activity` arm when awaited, or arriving on the work's own stream
// when detached. This unit carries the spawn's own lifecycle and nothing else,
// so the two never disagree about what the subagent said.
message AgentSubagent {
  // Where the spawn stands. Expect exactly one start per stream, then any number
  // of updates, then exactly one terminal arm.
  oneof result {
    // This stream is now carrying this spawn. Sent ONCE per stream, at issue —
    // and AGAIN on the work's own stream if the spawn detaches.
    AgentSubagentStart start = 1;
    // The subagent is working, and here is where it has got to.
    AgentSubagentUpdate update = 2;
    // The subagent finished and reported. The ORDINARY conclusion, on whichever
    // stream is carrying the unit.
    AgentSubagentSuccess success = 3;
    // The spawn could not be performed, or the subagent ended without
    // reporting. Arms are DERIVED from the producer's real sites at the
    // implementation wave; empty until then.
    AgentSubagentFailure failure = 4;
  }
}

// A spawn this stream has begun carrying.
message AgentSubagentStart {
  // THE AGENT THIS SPAWN CREATED — the join key the whole flat model rests on.
  //
  // A consumer draws a container for this agent on seeing this frame and keys it
  // by this identity; every later frame carrying the same identity routes into
  // that container, and a request for this agent's items names it. Without it a
  // subagent's work could not be placed at all, since frames carry no ancestry.
  //
  // DISTINCT FROM THIS UNIT'S OWN identity, which names the SPAWN — a unit of
  // the calling agent's work — rather than the agent that resulted from it.
  AgentId created_agent_id = 4;

  // What the subagent was asked to do, and how it was configured.
  AgentSubagentPrompt prompt = 1;
  // When the spawn was issued, so a consumer can draw how long it has run.
  AgentActivityStartedAt started_at = 2;

  // How deep this spawn sits below the main-thread agent — zero for a subagent
  // the main agent spawned, one for a subagent of that, and so on.
  //
  // NOT ANCESTRY AND NOT A PARENT LINK: it is a single number the SHIM
  // derives by walking the vendor's parent_agent_id chain (no depth scalar is
  // declared — vetting item 1), and it names no other agent. A surface uses it to
  // decide how much nesting to draw, never to reconstruct a tree. UNSET when
  // the producer reported no depth.
  optional uint32 spawn_depth = 5;

  // The directory the subagent was started in. UNSET when the producer
  // reported none, in which case it started where its caller was.
  optional string working_dir = 6;

  // WHETHER THE VENDOR ASKED THAT THIS SUBAGENT'S TRANSCRIPT NOT BE SHOWN.
  //
  // A RENDERING REQUEST, NOT A PERMISSION. The work still happened and its
  // frames still arrive; the vendor is saying its transcript is noise for this
  // spawn. A surface may honor it by collapsing the container by default. It
  // must NOT be read as a reason to discard the frames or to hide that the
  // subagent ran.
  bool transcript_suppressed = 7;
}

// WHAT A SUBAGENT WAS ASKED TO DO, and how it was configured. Carried on every
// frame of the spawn, so each frame stands alone rather than making sense only
// beside its predecessor.
message AgentSubagentPrompt {
  // A few words naming the task, written by the caller for a reader. This is
  // the label a bubble or a footer row draws; it is NOT the instruction.
  //
  // UNSET FOR AN AGENT A WORKFLOW SCRIPT SPAWNED. The producer records no
  // description for those — the script may label a step, but that label reaches
  // no artifact a reader can recover — so a consumer falls back to the subagent
  // type, or to the instruction's opening, rather than drawing an empty label.
  optional string description = 1;

  // The full instruction the subagent was given. Drawn only where there is room
  // for it — a bubble's body, not its head — since it is frequently long.
  string text = 2;

  // Which specialized agent was asked for. UNSET means the caller named none
  // and the default was used, so a consumer draws no type rather than inventing
  // a name it cannot know.
  optional string subagent_type = 3;

  // A name making the subagent addressable while it runs, so other work can
  // send it messages. UNSET means it was spawned unnamed and is addressable
  // only by its identity.
  optional string requested_name = 4;

  // The model the caller asked for, overriding whatever the agent's own
  // definition would have chosen. UNSET means no override was requested and the
  // definition or the parent decided — a consumer must NOT draw the parent's
  // model here, because it cannot know the definition did not override it.
  optional AgentModel requested_model = 5;

  // Whether the subagent was FORKED from the caller — started holding the
  // caller's conversation rather than only the instruction above.
  //
  // Worth drawing: a fork's answer may rest on context that appears nowhere in
  // its own prompt, so a reader judging its report from the instruction alone
  // would be judging it on a fraction of what it saw.
  bool forked_from_caller = 9;

  // Where the subagent was asked to run. The set arm IS the isolation, so a
  // spawn in the caller's own tree carries no isolation vocabulary at all.
  oneof isolation {
    // In the caller's own working tree, sharing its files. The default.
    AgentSubagentIsolationNone none = 6;
    // In a temporary git worktree, so its edits cannot collide with the
    // caller's or another subagent's.
    AgentSubagentIsolationWorktree worktree = 7;
    // In a remote cloud environment. Such a spawn ALWAYS runs detached, and its
    // work is NOT observable through the streams this contract carries — expect
    // a start and then nothing further on this unit.
    AgentSubagentIsolationRemote remote = 8;
  }
}

// The subagent shares the caller's working tree.
message AgentSubagentIsolationNone {}

// The subagent was given a temporary git worktree of its own.
//
// EMPTY ON PURPOSE: which worktree it got is not known until it reports, so the
// location rides the success arm rather than being claimed at issue.
message AgentSubagentIsolationWorktree {}

// The subagent was launched into a remote cloud environment.
//
// THE HANDLES ARRIVE WITH THE LAUNCH, NOT WITH THE REQUEST, so both are unset
// on the frame that announces the intent and set once the remote answered.
message AgentSubagentIsolationRemote {
  // Where the remote session can be opened. THE ONLY WAY TO SEE THIS
  // SUBAGENT'S WORK — a remote spawn's frames do not travel on the streams
  // this contract carries. UNSET until the launch reported it.
  optional string session_url = 1;
  // The remote's own handle for the run, quotable to it. UNSET until the
  // launch reported it. Opaque: compare for equality, never parse.
  optional string remote_task_id = 2;
}

// The subagent is working. Carries a WHOLE-STATE snapshot, never a delta: each
// frame states where the run has got to, so a consumer that missed a frame is
// not wrong, only briefly behind.
message AgentSubagentUpdate {
  // What it was asked to do, repeated so this frame stands alone.
  AgentSubagentPrompt prompt = 1;

  // What the run has spent so far.
  AgentSubagentProgress progress = 2;

  // What the subagent says it is doing, in its own words. UNSET when it has
  // offered none, in which case a consumer draws the description and nothing
  // finer rather than an empty line.
  optional AgentSubagentNote note = 3;

  // The tool it is running right now. UNSET between calls, which is a real and
  // common state rather than a gap in reporting.
  optional AgentSubagentActivityLabel activity = 4;

  // THE RUN FAILED AND IS BEING TRIED AGAIN. UNSET on an ordinary update,
  // which is what a first attempt looks like.
  //
  // Carried because a retried run costs what its attempts cost together, and
  // because a subagent that has silently burned three attempts looks identical
  // to one making slow progress.
  optional AgentSubagentRetry retry = 5;
}

// A subagent attempt that failed and is being made again.
message AgentSubagentRetry {
  // Which attempt is about to run, one-based — so `2` means the first attempt
  // failed.
  uint32 attempt = 1;
  // How many attempts will be made in total before the spawn is failed.
  uint32 max_retries = 2;
  // How long the producer will wait before the next attempt, in milliseconds.
  // UNSET when it stated no delay.
  optional uint64 retry_delay_ms = 3;
  // The status the failed attempt returned, as the producer worded it. UNSET
  // when it stated none.
  optional string error_status = 4;
  // The producer's own classification of the failure, verbatim; its vocabulary
  // is not settled and it is shown rather than switched on. UNSET when it
  // classified nothing.
  optional string error_category = 5;
}

// What a run has spent, while it is still running.
//
// COARSER THAN THE SETTLED TOTALS ON PURPOSE — this is what the producer states
// mid-run, and it is superseded by the full accounting at conclusion. A consumer
// draws these as live figures and must NOT treat the token figure as an
// accounting fact: it is a running sum, not a reconciled charge.
message AgentSubagentProgress {
  // Wall-clock milliseconds since the spawn began, as the producer counts it.
  uint64 duration_ms = 1;
  // How many tool calls it has made so far.
  uint32 tool_use_count = 2;
  // Tokens consumed so far, as one figure. The full breakdown is not available
  // until the run settles.
  uint64 total_tokens = 3;
}

// What the subagent says it is doing.
message AgentSubagentNote {
  // Its own one-line account of current progress, drawn verbatim.
  string text = 1;
}

// The tool a subagent is running right now.
message AgentSubagentActivityLabel {
  // The tool's name as the producer reports it, drawn as an activity label.
  //
  // A BARE NAME AND NOT A TYPED CALL, because no arguments accompany it — this
  // says WHAT IS RUNNING, not what was asked of it. It is therefore not a second
  // spelling of the typed tool vocabulary: there is no typed call here for it to
  // disagree with.
  string tool_name = 1;
}

// A subagent's report and what its run cost.
message AgentSubagentSuccess {
  // What it was asked to do, repeated so a settled frame describes itself.
  AgentSubagentPrompt prompt = 1;

  // The subagent's own final report.
  AgentSubagentReport report = 2;

  // What the run cost and what it did.
  AgentSubagentTotals totals = 3;

  // Which models actually ran it, in the order they were used. MORE THAN ONE
  // ENTRY MEANS THE MODEL CHANGED MID-RUN, which is worth drawing: the report
  // was not written by a single model. One entry is the ordinary case.
  repeated AgentModel models_used = 4;

  // Where it worked, when it was given a worktree of its own. UNSET for a
  // subagent that shared its caller's tree.
  //
  // NOT INSIDE THE PROMPT'S ISOLATION ARM, deliberately: that arm states what
  // was ASKED FOR at issue, and this states what was ACTUALLY USED, which is
  // only knowable now.
  optional AgentSubagentWorktree worktree = 5;

  // The agent type that ACTUALLY ran, when the producer resolved the requested
  // one to something else — a name that no longer exists, a default standing
  // in. UNSET when the producer named none.
  //
  // BESIDE `AgentSubagentPrompt.subagent_type` RATHER THAN REPLACING IT, for
  // the same reason the worktree is beside the isolation: the prompt states
  // what was ASKED FOR, and a spawn that quietly resolved to a different type
  // is only visible when both are present.
  optional string resolved_subagent_type = 6;

  // When the spawn settled. UNSET when the producer observed no instant.
  optional AgentActivitySettledAt settled_at = 7;

  // THE AGENT THIS SPAWN CREATED, restated on the conclusion.
  //
  // THE SAME JOIN KEY `AgentSubagentStart.created_agent_id` states, and it is
  // here because THE SUCCESS ARM IS THE ONLY FRAME SOME DELIVERIES EVER CARRY.
  // A history replay, or a transcript-only session read after the fact with no
  // live producer watching, hands a consumer a settled frame and no start; the
  // consumer must still be able to name the agent in order to address that
  // spawn's own items. Without this it cannot, and the bubble it draws leads
  // nowhere.
  //
  // NOT A SECOND SPELLING AND NOT A DERIVATION. Deriving the created agent
  // from another identity — this unit's own id, the calling agent's, a spool's
  // file name — is forbidden (see the detached-work frame's identity rule),
  // and this field exists so that no consumer ever needs to: it makes the
  // derivation UNNECESSARY rather than permitted. A producer that states it
  // must state the SAME identity the start states; a producer that does not
  // know it leaves this UNSET and the consumer keeps whatever the start told
  // it.
  //
  // UNSET is therefore not an error. It means this producer could not name the
  // agent on this frame, and a consumer that already saw the start is
  // unaffected.
  AgentId created_agent_id = 8;
}

// A subagent's final report, as it wrote it.
message AgentSubagentReport {
  // The report itself. THE SUBAGENT'S OWN WORDS, RENDERED AND NEVER PARSED: the
  // producer hands over a structured report rather than the text it sent its
  // caller, so nothing needs to strip a trailer or recover fields out of prose.
  AgentResponseProse prose = 1;

  // A structured result the subagent wrote ALONGSIDE its prose, when it wrote
  // one. UNSET is the ordinary case: most subagents report in prose alone.
  //
  // UNTYPED BY NECESSITY, and this is the one reason that qualifies: the shape
  // is AUTHORED BY THE SUBAGENT ITSELF for whatever asked for it, so no schema
  // can exist here — one run reports findings, another reports a refutation
  // and a file path. Carried structured rather than flattened into the prose
  // by string concatenation, which is what happened before and lost the shape
  // for good. NOTHING BRANCHES ON A KEY INSIDE IT.
  optional google.protobuf.Struct structured_result = 2;
}

// What a subagent's run cost and what it did with it.
//
// DRAWN AS A SUMMARY LINE under a settled bubble — "18 tool uses · 2m 14s · 340
// lines added". The counts are CARRIED rather than derived by counting the
// nested activity, so a consumer that has paged the nested units away still
// draws the summary.
message AgentSubagentTotals {
  // How long the run took, wall-clock, in milliseconds. A settled figure, unlike
  // the clock a consumer animates from a start instant.
  uint64 duration_ms = 1;
  // What the run charged — the subagent's OWN consumption, never including
  // its caller's. THE SET ARM IS THE SPAWN PATH'S HONESTY: the vendor's SYNC
  // completion carries the full billed breakdown, while an ASYNC completion
  // carries at most one optional total-tokens scalar, so a full breakdown on
  // an async run is unproducible and is unrepresentable here.
  oneof usage {
    // A sync (awaited) run's settled bill, the full breakdown.
    TokenUsage full = 2;
    // An async (backgrounded) run's settled figure, as thin as the vendor
    // reports it.
    AgentSubagentAsyncUsage total_only = 6;
  }
  // How many tool calls it made in total, including kinds not broken out below.
  uint32 tool_use_count = 3;
  // What kinds of work it did. UNSET when the producer reported no breakdown, in
  // which case a consumer draws the count above and nothing finer.
  optional AgentSubagentToolStats tool_stats = 4;
}

// An async run's settled usage: the vendor's task-notification figure.
message AgentSubagentAsyncUsage {
  // The run's total token consumption. UNSET when the vendor's notification
  // carried no usage at all — absence means unreported, never zero.
  optional uint64 total_tokens = 1;
}

// A breakdown of what a subagent spent its tool calls on.
message AgentSubagentToolStats {
  // How many files it read.
  uint32 read_count = 1;
  // How many searches it ran.
  uint32 search_count = 2;
  // How many shell commands it ran.
  uint32 bash_count = 3;
  // How many files it changed.
  uint32 edit_file_count = 4;
  // Lines added across every change it made.
  uint32 lines_added = 5;
  // Lines removed across every change it made.
  uint32 lines_removed = 6;
  // Tool calls of every other kind, so the broken-out counts plus this one
  // account for the total entirely and a reader can tell nothing was silently
  // dropped.
  uint32 other_tool_count = 7;

  // How many frames the run consumed — the producer's own count of model
  // round-trips inside the subagent. NOT a tool count and never summed with
  // the counters above: it is the denominator a per-frame cost is read
  // against.
  uint32 frame_count = 8;
}

// The temporary worktree a subagent was given.
message AgentSubagentWorktree {
  // Its path on disk, so a reader can find the work after the fact.
  string path = 1;
  // The branch created for it.
  string branch = 2;

  // WHERE THE WORKTREE CAME FROM. UNSET when the producer stated nothing. The
  // two are different for a reader chasing the work: one tree was made for
  // this spawn and is expected to disappear, the other belongs to something
  // else and will still be there.
  oneof provenance {
    // Created for this spawn.
    AgentSubagentWorktreeCreated created = 3;
    // Inherited from whatever spawned it, and shared with it.
    AgentSubagentWorktreeInherited inherited = 4;
  }

  // WHAT BECAME OF IT once the run ended. UNSET while the run is live and when
  // the producer reported nothing. A tree left behind is a real consequence a
  // reader must be able to see — it holds uncommitted work and it holds disk.
  oneof cleanup {
    // Removed cleanly; nothing is left on disk.
    AgentSubagentWorktreeRemoved removed = 5;
    // Still on disk after the run ended.
    AgentSubagentWorktreeRetained retained = 6;
  }
}

// The worktree was created for this spawn.
message AgentSubagentWorktreeCreated {}

// The worktree was inherited from whatever spawned this subagent.
message AgentSubagentWorktreeInherited {}

// The worktree was removed cleanly.
message AgentSubagentWorktreeRemoved {}

// The worktree is still on disk.
message AgentSubagentWorktreeRetained {}

// The spawn could not be performed, or the subagent ended without reporting.
message AgentSubagentFailure {
  // What the spawn said when it failed, and when it settled.
  optional AgentToolFailure error = 1;

  // WHY the run ended without a report, when the producer distinguished it
  // from an ordinary failure. UNSET means the account above is all there is.
  oneof cause {
    // A person stopped the subagent by hand. Not a fault: the run did what it
    // was told, and a consumer must not draw it as an error.
    AgentSubagentStoppedByUser stopped_by_user = 2;
    // We stopped being able to see it — its transcript vanished or went
    // silent; not known to have failed. Draws as "lost".
    DetachedLost lost = 3;
  }
}

// A person stopped the subagent by hand.
message AgentSubagentStoppedByUser {}

// ---- The skill: an invocation, and the document it loaded ----

// The agent invoking a skill.
//
// A SKILL IS INSTRUCTIONS LOADED INTO THIS AGENT'S CONTEXT, not another agent
// and not a subprocess. Invoking one puts a markdown document in front of the
// same agent, which then carries on working with it in view.
//
// THE INVOCATION'S OWN RETURN IS WORTHLESS TO DRAW: the producer answers the
// call with a bare acknowledgement that restates the skill's name. What is worth
// carrying is the DOCUMENT, which arrives afterwards as a separate injected
// context record linked back to this call — so this unit settles when the
// document lands, not when the acknowledgement returns.
//
// NOTHING DELIMITS A SKILL'S SCOPE, and this unit therefore contains no nested
// work. There is no skill-ended record, no boundary marker, and no producer
// statement about where a skill's influence stops; work the agent does after
// loading a skill is its own ordinary activity. A surface that wishes to draw
// subsequent work under a skill heading is making a PRESENTATION choice, which
// belongs to whatever resolves that surface — a nested arm here would oblige a
// producer to invent an end that nothing observes.
message AgentSkillUse {
  // Where the invocation stands. No update arm: there are two frames, the
  // invocation and the document, and nothing arrives in between.
  oneof result {
    // This stream is now carrying this invocation. Sent ONCE per stream, at
    // issue.
    AgentSkillUseStart start = 1;
    // The vendor's liveness beat while the call runs. NOT an update — no
    // growth is reported — and consumed by the daemon into the drawn
    // last-progress facts; a frame like any other, upserting the unit.
    AgentToolCallProgress progress = 4;
    // The skill loaded, and here is what it put in front of the agent.
    AgentSkillUseSuccess success = 2;
    // The skill could not be loaded — commonly an unknown name, or one filtered
    // out of the session's enabled set. Arms are DERIVED from the producer's
    // real refusal sites at the implementation wave; empty until then.
    AgentSkillUseFailure failure = 3;
  }
}

// An invocation this stream has begun carrying.
message AgentSkillUseStart {
  // Which skill is being loaded.
  AgentSkillName skill = 1;
  // The arguments the invocation carried. UNSET when the skill was invoked bare,
  // which is common — presence rather than an empty string, so "no arguments"
  // and "an empty argument" stay distinguishable.
  optional string args = 2;
  // When the invocation was issued.
  AgentActivityStartedAt started_at = 3;
}

// A skill's name, as invoked.
message AgentSkillName {
  // The name the agent named, verbatim. Matches the skill's own declared name or
  // its directory name, and may be plugin-qualified.
  string name = 1;
}

// The skill loaded, and what it contributed.
message AgentSkillUseSuccess {
  // Which skill loaded, repeated so a settled frame describes itself.
  AgentSkillName skill = 1;

  // The document the skill put in front of the agent.
  AgentSkillDocument document = 2;

  // What invoking it permits. UNSET when the skill declared no allowances, which
  // is distinct from declaring an empty set.
  optional AgentSkillAllowedTools allowed_tools = 3;

  // When the invocation settled. UNSET when the producer observed no instant.
  optional AgentActivitySettledAt settled_at = 4;
}

// A skill's contents, as the agent received them.
message AgentSkillDocument {
  // The document verbatim, as markdown. A skill IS a markdown document, so it is
  // carried and rendered as one rather than parsed into fields — its structure
  // is the author's prose, not a schema.
  string markdown = 1;
}

// The tool allowances a skill brings with it.
//
// WORTH DRAWING because it states what invoking the skill PERMITS, which is a
// fact about consent rather than about the document's content: a reader deciding
// whether a skill should have run wants to know it was allowed to write files.
message AgentSkillAllowedTools {
  // The tools the skill is permitted, by name, as the producer lists them.
  //
  // BARE NAMES rather than the typed tool vocabulary, deliberately: these are
  // ALLOWANCES, not calls — no arguments accompany them — so there is no typed
  // call here for a name to be a second spelling of. A name may also cover a
  // tool this contract does not model at all.
  repeated string tool_names = 1;
}

// The skill could not be loaded. Arms are DERIVED from the producer's real
// refusal sites at the implementation wave; empty until then.
message AgentSkillUseFailure {
  // What the call said when it failed, and when it settled.
  optional AgentToolFailure error = 1;

  // Which skill was invoked, restated so the settled frame stands alone,
  // exactly as the success arm restates it: a call's start and its settle
  // upsert ONE unit, so once the call settles its start is gone from any store
  // that keeps the latest frame, and a replay drawing this frame alone must
  // still name the skill.
  AgentSkillName skill = 2;
}

// ---- The message to another agent ----

// The agent sending a message to another agent.
//
// WHY THIS IS VISIBLE AT ALL: without it, cross-agent communication happens
// unseen and its effects appear without causes — a subagent's bubble resumes
// activity with nothing to explain why. This unit is that explanation.
//
// THE BODY IS NEVER DRAWN. A relayed message is frequently long, so the caller
// supplies a one-line summary for display and the body rides along for the
// recipient. A surface draws the recipient and the summary; it must not fall
// back to the body when no summary was given, since dumping a relay into a feed
// is the outcome the summary exists to prevent.
message AgentSendMessage {
  // Where the send stands. No update arm: a message is sent once and either
  // reaches the recipient's queue or does not.
  oneof result {
    // This stream is now carrying this send. Sent ONCE per stream, at issue.
    AgentSendMessageStart start = 1;
    // The vendor's liveness beat while the call runs. NOT an update — no
    // growth is reported — and consumed by the daemon into the drawn
    // last-progress facts; a frame like any other, upserting the unit.
    AgentToolCallProgress progress = 4;
    // The message reached the recipient, or the recipient was woken to receive
    // it.
    AgentSendMessageSuccess success = 2;
    // The message could not be delivered. Arms are DERIVED from the producer's
    // real refusal sites at the implementation wave; empty until then.
    AgentSendMessageFailure failure = 3;
  }
}

// A send this stream has begun carrying.
message AgentSendMessageStart {
  // WHO THE CALLER ADDRESSED, exactly as written — which may be an agent's
  // identity OR a human-readable name a spawn was given.
  //
  // DELIBERATELY NOT A TYPED AgentId: at the moment of the call the recipient is
  // unresolved, and typing it as an identity would claim a resolution nobody has
  // performed yet. The resolved identity appears on the success arm.
  string addressed_to = 1;

  // The one-line preview a surface draws in place of the body. UNSET when the
  // caller supplied none, in which case a surface draws the recipient alone —
  // never the body.
  optional AgentSendMessageSummary summary = 2;

  // The message itself, carried for the record and for the recipient. NOT FOR
  // DISPLAY; see the summary above.
  AgentSendMessageBody body = 3;

  // When the send was issued.
  AgentActivityStartedAt started_at = 4;
}

// The one-line preview of a message.
message AgentSendMessageSummary {
  // The summary as the caller wrote it, drawn verbatim.
  string text = 1;
}

// A message's full text.
message AgentSendMessageBody {
  // The body verbatim. Retained so history is complete and the record can be
  // read back, not so a feed can render it.
  string text = 1;
}

// The message reached its recipient.
message AgentSendMessageSuccess {
  // WHICH AGENT it reached, resolved. This is the identity the addressed string
  // above turned out to name, and it is what joins this send to the recipient's
  // own activity — so a reader can follow a message to the work it caused.
  AgentId recipient_agent_id = 1;

  // How it got there. The two differ in a way a reader cares about: one costs
  // nothing beyond the message, the other RESTARTED A DORMANT AGENT, which
  // begins consuming tokens again.
  oneof delivery {
    // The recipient was already running; the message waits for it to reach its
    // next tool round. Nothing was started.
    AgentSendMessageQueuedToLive queued_to_live = 2;
    // The recipient was not running and WAS RESUMED in order to receive this
    // message. A reader treats this as the cause of that agent's renewed
    // activity and its renewed cost.
    AgentSendMessageResumedRecipient resumed_recipient = 3;
  }

  // When the send settled. UNSET when the producer observed no instant.
  optional AgentActivitySettledAt settled_at = 4;

  // WHO THE CALLER ADDRESSED, restated from the start so the settled frame
  // stands alone. A send's start and its settle upsert ONE unit, so once the
  // send settles the start is gone from any store that keeps the latest frame,
  // and a replay drawing this frame alone must still name the recipient as the
  // caller wrote it. Same value, same meaning, as AgentSendMessageStart's.
  string addressed_to = 5;

  // The one-line preview, restated from the start so the settled frame stands
  // alone, for the same reason as the address above. UNSET exactly when the
  // start's was: the caller supplied none, and a surface draws the recipient
  // alone — never the body.
  optional AgentSendMessageSummary summary = 6;
}

// The recipient was already running and the message is queued for it.
message AgentSendMessageQueuedToLive {}

// The recipient was dormant and was restarted to receive the message.
//
// EMPTY DESPITE THE PRODUCER SAYING MORE. Its answer distinguishes a recipient
// that had no active task from one that had already stopped, but that
// distinction exists ONLY inside a prose sentence written for the model to read.
// Recovering it would mean parsing that sentence, so this arm states the fact
// that is structurally available and no more.
message AgentSendMessageResumedRecipient {}

// The message could not be delivered. Arms are DERIVED from the producer's real
// refusal sites at the implementation wave; empty until then.
message AgentSendMessageFailure {
  // What the call said when it failed, and when it settled.
  optional AgentToolFailure error = 1;

  // WHO THE CALLER ADDRESSED, restated from the start so the settled frame
  // stands alone: a refused send is still drawn, and once it settles its start
  // is gone from any store that keeps the latest frame of the unit. Same
  // value, same meaning, as AgentSendMessageStart's.
  string addressed_to = 2;

  // The one-line preview, restated from the start so the settled frame stands
  // alone. UNSET exactly when the start's was: the caller supplied none, and a
  // surface draws the recipient alone — never the body.
  optional AgentSendMessageSummary summary = 3;
}

// ---- The web fetch: one URL's content, read by the agent ----

// The agent fetching one URL and reading its content. Standard family shape:
// start announces, progress is the vendor's beat, success/failure settle.
message AgentWebFetch {
  // Where the fetch stands.
  oneof result {
    // This stream is now carrying this fetch. Sent ONCE per stream, at issue.
    // There is no update arm: a fetch reports nothing until it is done.
    AgentWebFetchStart start = 1;
    // The vendor's liveness beat while the fetch runs. NOT an update — no
    // growth is reported — a frame like any other, upserting the unit.
    AgentToolCallProgress progress = 2;
    // The fetch ran and answered. An HTTP error page is still this arm —
    // the status says how the server answered.
    AgentWebFetchSuccess success = 3;
    // The fetch could not run at all (network refused, blocked domain).
    AgentWebFetchFailure failure = 4;
  }
}

// The fetch as issued.
message AgentWebFetchStart {
  // What is being fetched, carried on every frame.
  AgentWebFetchTarget target = 1;
  // When the call was issued; a drawn clock ticks from this.
  int64 started_at_ms = 2;
}

// What was fetched. Carried on EVERY frame of the fetch, not only the
// announcement, because each frame of an upserted unit stands alone.
message AgentWebFetchTarget {
  // The URL, as the caller gave it. Consumers draw it as a hyperlink.
  string url = 1;
}

// The fetch's answer.
message AgentWebFetchSuccess {
  // What was fetched, restated so the settled frame stands alone.
  AgentWebFetchTarget target = 1;
  // How the server answered. A 404 is a served answer, not a tool failure;
  // consumers badge this beside the verdict.
  AgentWebFetchHttpStatus status = 2;
  // The fetched content as the vendor rendered it for the model — markdown
  // prose, never raw HTML.
  string result = 3;
  // The response size in bytes, as the vendor measured it. EXPECTED UNMAPPED:
  // no UI surface draws it today; carried for fidelity.
  uint64 bytes = 4;
  // How long the fetch took, in milliseconds, as the vendor measured it.
  // EXPECTED UNMAPPED: drawn clocks tick from the start instant instead.
  uint64 duration_ms = 5;
  // TRUE when the URL resolved to a Claude Artifact and was read through the
  // artifact route rather than a plain HTTP fetch. EXPECTED UNMAPPED: no UI
  // surface distinguishes it today; declared-only at the vendor type surface.
  bool artifact_read = 6;
}

// The HTTP status the fetch got.
message AgentWebFetchHttpStatus {
  // The numeric status code (200, 404, ...).
  uint32 code = 1;
  // The vendor's status text ("OK", "Not Found").
  string text = 2;
}

// The fetch never ran.
message AgentWebFetchFailure {
  // What was asked for, restated so the settled frame stands alone.
  AgentWebFetchTarget target = 1;
  // Why it could not run, in the shared tool-failure vocabulary.
  AgentToolFailure failure = 2;
}

// ---- The web search: a query, and the links it found ----

// The agent running a web search. Standard family shape.
message AgentWebSearch {
  // Where the search stands.
  oneof result {
    // This stream is now carrying this search. Sent ONCE per stream, at issue.
    AgentWebSearchStart start = 1;
    // The vendor's liveness beat while the search runs.
    AgentToolCallProgress progress = 2;
    // The search ran. Finding nothing is a success with an empty answer.
    AgentWebSearchSuccess success = 3;
    // The search could not run at all.
    AgentWebSearchFailure failure = 4;
  }
}

// The search as issued.
message AgentWebSearchStart {
  // What was searched for, carried on every frame.
  AgentWebSearchQuery query = 1;
  // When the call was issued; a drawn clock ticks from this.
  int64 started_at_ms = 2;
}

// What was searched for.
message AgentWebSearchQuery {
  // The search terms as the caller wrote them, drawn verbatim.
  string terms = 1;
}

// The search's answer.
message AgentWebSearchSuccess {
  // What was searched for, restated so the settled frame stands alone.
  AgentWebSearchQuery query = 1;
  // The results in the order the engine served them. The producer's array is
  // heterogeneous — link objects mixed with bare narration strings — so each
  // entry is one of the two, and order is preserved across both kinds.
  repeated AgentWebSearchResult results = 2;
  // How many searches the engine ran to produce this answer. EXPECTED
  // UNMAPPED: no UI surface draws it today; carried for fidelity.
  uint32 search_count = 3;
  // How long the search took, in seconds, in the vendor's own unit. EXPECTED
  // UNMAPPED: drawn clocks tick from the start instant instead.
  double duration_seconds = 4;
}

// One entry of the engine's answer.
message AgentWebSearchResult {
  // Which kind of entry this is.
  oneof entry {
    // A found page — the product of the call.
    AgentWebSearchLink link = 1;
    // The engine's own narration line between links, kept in order.
    AgentWebSearchNote note = 2;
  }
}

// A found page.
message AgentWebSearchLink {
  // The page's title, the row's drawn text.
  string title = 1;
  // The page's URL. Consumers draw it as a hyperlink.
  string url = 2;
}

// A narration line the engine interleaved with the links.
message AgentWebSearchNote {
  // The line, drawn verbatim.
  string text = 1;
}

// The search never ran.
message AgentWebSearchFailure {
  // What was asked for, restated so the settled frame stands alone.
  AgentWebSearchQuery query = 1;
  // Why it could not run, in the shared tool-failure vocabulary.
  AgentToolFailure failure = 2;
}

// ---- The monitor: a background watcher whose events wake the agent ----

// The agent's background watcher: a shell command or WebSocket whose lines
// wake the agent as ordinary turn input while it runs. FOOTER-ONLY: no feed
// bubble exists — the daemon tracks liveness for the footer's monitors chip
// and panel, and the events themselves are drawn nowhere special.
message AgentMonitor {
  // Where the watch stands.
  oneof result {
    // The watch is armed. Sent once per stream, at issue.
    AgentMonitorStart start = 1;
    // The watch ended on its own — its source closed, or its deadline passed.
    AgentMonitorEnded ended = 2;
    // The watch could not be armed at all.
    AgentMonitorFailure failure = 3;
  }
}

// The watch as armed.
message AgentMonitorStart {
  // The agent's own one-line account of what it is watching, drawn verbatim
  // as the footer row's text.
  string description = 1;
  // How long the watch may live; the arms are exclusive by the vendor's own
  // rule (the timeout is ignored when persistent).
  oneof lifetime {
    // Killed at a deadline: the configured ceiling in milliseconds.
    AgentMonitorDeadline deadline = 2;
    // Runs until stopped or the session ends; the footer row marks it.
    AgentMonitorPersistent persistent = 3;
  }
  // What is being watched. EXPECTED UNMAPPED: no surface draws the source —
  // the description is the drawn account; carried for fidelity.
  oneof source {
    // A shell command whose stdout lines are the events.
    AgentMonitorCommand command = 4;
    // A WebSocket whose text frames are the events.
    AgentMonitorWebsocket websocket = 5;
  }
  // When the watch was armed; the footer row's clock ticks from this.
  int64 started_at_ms = 6;
}

// The deadline lifetime: the configured ceiling.
message AgentMonitorDeadline {
  // The ceiling, in milliseconds, as configured.
  uint64 timeout_ms = 1;
}

// The persistent lifetime. Empty: the arm is the whole fact.
message AgentMonitorPersistent {}

// A command source.
message AgentMonitorCommand {
  // The shell command, verbatim.
  string command = 1;
}

// A WebSocket source.
message AgentMonitorWebsocket {
  // The socket URL, verbatim.
  string url = 1;
}

// The watch ended. No cause taxonomy is claimed: the vendor reports only
// that the watch left the live set. Its events reached the agent as
// ordinary turn input while it ran; nothing here restates them.
message AgentMonitorEnded {}

// The watch never armed.
message AgentMonitorFailure {
  // Why it could not be armed, in the shared vocabulary.
  AgentToolFailure failure = 1;
}

// ---- The self-wakeup: the agent scheduling its own next tick ----

// The agent scheduling its own future re-invocation, or ending such a loop.
message AgentScheduleWakeup {
  // Where the call stands.
  oneof result {
    // The call as issued. Sent once per stream, at issue.
    AgentScheduleWakeupStart start = 1;
    // The runtime answered.
    AgentScheduleWakeupSuccess success = 2;
    // The call could not be performed at all.
    AgentScheduleWakeupFailure failure = 3;
  }
}

// The call as issued.
message AgentScheduleWakeupStart {
  // What was asked: the arms are exclusive by the vendor's own rule (every
  // schedule field is ignored when stop is set).
  oneof act {
    // Schedule the next wakeup.
    AgentScheduleWakeupSchedule schedule = 1;
    // End the loop; no further wakeups fire.
    AgentScheduleWakeupStop stop = 2;
  }
  // When the call was issued.
  int64 started_at_ms = 3;
}

// The schedule act's request.
message AgentScheduleWakeupSchedule {
  // The requested delay, in seconds, before clamping.
  uint32 delay_seconds = 1;
  // The agent's one-sentence account of why this delay — the vendor states
  // it is shown to the user; the footer's wakeup activity draws it.
  string reason = 2;
  // The /loop input that fires on wake. EXPECTED UNMAPPED: no surface draws
  // it; carried for fidelity.
  string prompt = 3;
}

// The stop act. Empty: the arm is the whole fact.
message AgentScheduleWakeupStop {}

// The runtime's answer.
message AgentScheduleWakeupSuccess {
  // Which act was answered.
  oneof outcome {
    // A wakeup is pending.
    AgentScheduleWakeupScheduled scheduled = 1;
    // The loop ended.
    AgentScheduleWakeupStopped stopped = 2;
  }
}

// A wakeup is pending.
message AgentScheduleWakeupScheduled {
  // When the wakeup fires, epoch ms — THE fact the footer ticks its
  // countdown from.
  int64 wake_at_ms = 1;
  // The delay actually used after the runtime clamped it, in seconds.
  // EXPECTED UNMAPPED: nothing draws it; wake_at_ms is the drawn fact.
  uint32 clamped_delay_seconds = 2;
  // TRUE when the requested delay was outside the runtime's bounds.
  // EXPECTED UNMAPPED: nothing draws it; carried for fidelity.
  bool was_clamped = 3;
}

// The loop ended.
message AgentScheduleWakeupStopped {
  // How many pending wakeups the stop cancelled. EXPECTED UNMAPPED: nothing
  // draws it; carried for fidelity.
  uint32 cancelled_wakeups = 1;
}

// The call never ran.
message AgentScheduleWakeupFailure {
  // Why, in the shared vocabulary.
  AgentToolFailure failure = 1;
}

// ---- The artifact: a local file published as a hosted page ----

// The agent publishing a local HTML/markdown file as an artifact — a hosted
// page on claude.ai the user can open and share — or listing existing ones.
message AgentArtifact {
  // Where the call stands.
  oneof result {
    // The call as issued. Sent once per stream, at issue.
    AgentArtifactStart start = 1;
    // The service answered.
    AgentArtifactSuccess success = 2;
    // The call could not be performed at all.
    AgentArtifactFailure failure = 3;
  }
}

// The call as issued.
message AgentArtifactStart {
  // Which action was asked; the arms are exclusive by the vendor's own rule
  // (each action reads its own fields and ignores the other's).
  oneof act {
    // Publish (or redeploy) a page.
    AgentArtifactPublish publish = 1;
    // List existing artifacts — a quiet read.
    AgentArtifactList list = 2;
  }
  // When the call was issued.
  int64 started_at_ms = 3;
}

// A publish as asked.
message AgentArtifactPublish {
  // The local file being rendered to the page.
  string file_path = 1;
  // The browser-tab emoji, drawn as the bubble's leading glyph. UNSET when
  // the call gave none.
  optional string favicon = 2;
  // The page title, when supplied at the call (the page's own <title> tag
  // wins at the vendor). UNSET when the call gave none.
  optional string title = 3;
  // An existing artifact URL being updated in place — presence means this
  // publish is a REDEPLOY, not a new page. UNSET on a fresh publish.
  optional string updates_url = 4;
  // The version label. EXPECTED UNMAPPED: nothing draws it.
  optional string label = 5;
  // The gallery-card subtitle. EXPECTED UNMAPPED: nothing draws it.
  optional string description = 6;
  // TRUE when a concurrent-write conflict is deliberately overwritten.
  // EXPECTED UNMAPPED: nothing draws it; carried for fidelity.
  bool force = 7;
}

// A listing as asked. Every field EXPECTED UNMAPPED; carried for fidelity.
message AgentArtifactList {
  // The row cap asked for.
  optional uint32 limit = 1;
  // Whose artifacts ("mine", "shared", "all"), verbatim.
  optional string scope = 2;
}

// The service's answer.
message AgentArtifactSuccess {
  // Which act was answered.
  oneof outcome {
    AgentArtifactPublished published = 1;
    AgentArtifactListed listed = 2;
  }
}

// The page is live.
message AgentArtifactPublished {
  // The published page's URL — the bubble's clickable line. PRODUCER NOTE:
  // the vendor's ArtifactOutput is TYPED (url, title, version) — read the
  // fields, never parse prose (corrected at vetting item 1).
  string url = 1;
  // The page's resolved title, as the result reports it. UNSET when the
  // result names none; the bubble then draws the call's title or filename.
  optional string title = 2;
}

// The listing answered. Empty ON PURPOSE even though the vendor's
// ArtifactOutput types the list rows (title, url, updatedAt) — nothing in
// this product draws a listing; the arm records that the read happened, and
// the typed rows are there if that changes (vetting item 1).
message AgentArtifactListed {}

// The call never ran.
message AgentArtifactFailure {
  // Why, in the shared vocabulary.
  AgentToolFailure failure = 1;
}

// ---- The unmodeled tool: work this contract does not describe ----

// ---- Tool result content: what any tool returned, by block ----

// What a TOOL returned.
//
// Narrow like UserContent and separate from it on purpose: the vendor delivers
// tool results inside user-role records, and reusing the user's own union here
// would preserve that accident in a schema built to erase it. A tool result is
// not something a person said.
message ToolResultContent {
  // In the order the tool produced them.
  repeated ToolResultContentBlock blocks = 1;
}

// One block of a tool's output.
message ToolResultContentBlock {
  oneof block {
    // The tool's textual output.
    TextBlock text = 1;
    // An image the tool produced — a screenshot, a rendered chart.
    ImageBlock image = 2;
    // A block whose kind we do not model.
    UnsupportedBlock unsupported = 3;
  }
}

// A tool call this contract does not model — an MCP server's tool, or one the
// vendor added after this schema was written.
//
// NOT A FALLBACK. This arm is for a tool whose schema genuinely cannot be known
// to the producer, never for one whose modelling was merely inconvenient or
// deferred. A recognizable built-in arriving here is a PRODUCER DEFECT, not a
// legitimate use of the arm.
//
// SURFACE IT QUIETLY, BUT DO SURFACE IT. A consumer is expected to make the
// user aware that unmodeled work occurred — silence would let a growing blind
// spot go unnoticed — while NOT treating it as an error: the tool very likely
// ran correctly, and the only thing wrong is that this contract cannot describe
// it. What a consumer must not do is dump the raw arguments into a view: an
// unstructured blob is unreadable and does not help anyone decide whether the
// tool deserves an arm of its own.
message AgentUnmodeled {
  // Where the call stands. No update arm: this contract holds no knowledge of
  // any unmodeled tool's streaming behavior, and an arm with no producer would
  // be an invitation to invent one.
  oneof result {
    // This stream is now carrying this call. Sent ONCE per stream, at issue.
    AgentUnmodeledStart start = 1;
    // The vendor's liveness beat while the call runs. NOT an update — no
    // growth is reported — and consumed by the daemon into the drawn
    // last-progress facts; a frame like any other, upserting the unit.
    AgentToolCallProgress progress = 4;
    // The tool returned.
    AgentUnmodeledSuccess success = 2;
    // The tool failed. Arms are DERIVED from the producer's real sites at the
    // implementation wave; empty until then.
    AgentUnmodeledFailure failure = 3;
  }
}

// A call this stream has begun carrying.
message AgentUnmodeledStart {
  // The tool as the agent named it — an MCP tool's qualified name, or a built-in
  // this schema has not caught up with.
  //
  // A PLAIN STRING BECAUSE THE SET IS GENUINELY OPEN: servers register tools at
  // runtime, so no closed vocabulary can exist. This is the value a consumer
  // groups by when deciding whether a tool is seen often enough to deserve
  // modelling.
  string tool_name = 1;

  // The arguments as the agent supplied them.
  //
  // UNTYPED BY NECESSITY, and this is the one reason that qualifies: the
  // producer holds no schema for a tool it did not define. Structured rather
  // than a string so a generic view can list fields without re-parsing, but
  // NOTHING BRANCHES ON A KEY INSIDE IT — a tool that needs that gets an arm of
  // its own instead.
  google.protobuf.Struct arguments = 2;

  // When the call was issued.
  AgentActivityStartedAt started_at = 3;

  // WHICH MCP SERVER SERVED THE TOOL, when one did.
  //
  // The tool name above is qualified and a consumer COULD split it — but the
  // qualification grammar is the vendor's and a server whose own name contains
  // the separator would be split wrongly. Stated rather than parsed. UNSET for
  // a built-in this schema has not caught up with, which is the other reason a
  // call lands here.
  optional string mcp_server = 4;
}

// The tool returned.
message AgentUnmodeledSuccess {
  // The tool as the agent named it, repeated so a settled frame describes
  // itself.
  string tool_name = 1;

  // What it returned. TYPED, unlike the arguments above: a tool result is text
  // and image blocks whichever tool produced it, so no untyped escape is needed
  // on this side.
  ToolResultContent content = 2;

  // Which MCP server served the tool, when one did. UNSET for a built-in.
  optional string mcp_server = 3;

  // When the call settled. UNSET when the producer observed no instant.
  optional AgentActivitySettledAt settled_at = 4;
}

// The tool failed.
//
// Arms are DERIVED from the producer's real sites at the implementation wave.
// The content is carried now because an unmodeled tool's own error text is the
// only account of what went wrong that anyone has.
message AgentUnmodeledFailure {
  // The tool as the agent named it.
  string tool_name = 1;
  // What it said when it failed, verbatim.
  ToolResultContent content = 2;
  // Which MCP server served the tool, when one did. UNSET for a built-in this
  // schema has not caught up with.
  optional string mcp_server = 3;
  // When the call settled as failed. UNSET when no instant was observed.
  optional AgentActivitySettledAt settled_at = 4;
}

// ==========================================================================
// Hooks: the user's own configured automation, firing around the agent's
// work. Quiet by default in the UI — a succeeded hook draws nothing; a
// failing one draws a card, and a blocking one is a refusal the user must
// be able to understand. Stop hooks fire AFTER a turn's stop and never
// determine how the turn ended — the turn's own terminal is authoritative.
// ==========================================================================

// One hook execution, an activity unit like any other (identified,
// upserted by its frames).
message AgentHook {
  // Where the execution stands. THE ARM IS THE OUTCOME once settled.
  oneof result {
    // The hook fired: which hook, on which event, gating which call.
    AgentHookStart start = 1;
    // Ran and succeeded, with its output.
    AgentHookSucceeded succeeded = 2;
    // BLOCKED the gated action — the refusal text is the whole point.
    AgentHookBlockingError blocking_error = 3;
    // Failed without blocking anything.
    AgentHookNonBlockingError non_blocking_error = 4;
    // Cancelled before it finished.
    AgentHookCancelled cancelled = 5;
  }
}
// The announcement.
message AgentHookStart {
  // The hook's configured name, verbatim.
  string hook_name = 1;
  // Which lifecycle event fired it — the vendor's closed literal set, a
  // genuine non-state scalar vocabulary.
  AgentHookEvent event = 2;
  // The tool call this firing gates or follows. UNSET for events with no
  // call (a session start, a stop, a prompt submission).
  optional AgentActivityId gated_call = 3;
  // When it fired.
  AgentActivityStartedAt started_at = 4;
}
// Ran and succeeded.
message AgentHookSucceeded {
  // The command that ran, verbatim.
  string command = 1;
  // Its exit code.
  int32 exit_code = 2;
  // How long it ran, millis. PRODUCER NOTE: the vendor's hook response
  // carries no duration — the shim spans its own started→response instants
  // (vetting item 1).
  int64 duration_ms = 3;
  // What it printed. UNSET when it printed nothing.
  optional AgentHookOutput output = 4;
}
// A hook's printed output.
message AgentHookOutput {
  // stdout, verbatim.
  string stdout = 1;
  // stderr, verbatim.
  string stderr = 2;
}
// The hook refused the gated action; the agent proceeds without it.
message AgentHookBlockingError {
  // The command that ran, verbatim.
  string command = 1;
  // The hook's stated reason — what the user reads to understand the
  // refusal.
  string blocking_text = 2;
}
// The hook itself failed; nothing was blocked.
message AgentHookNonBlockingError {
  // The command that ran, verbatim.
  string command = 1;
  // Its exit code.
  int32 exit_code = 2;
  // How long it ran, millis.
  int64 duration_ms = 3;
  // What it printed. UNSET when it printed nothing.
  optional AgentHookOutput output = 4;
}
// Cancelled before finishing. Empty: the arm is the whole fact.
message AgentHookCancelled {}

// The vendor's hook-event vocabulary, verbatim from its HOOK_EVENTS list.
// A closed set of scalar literals — which event fired a hook — never a
// state of anything, so an enum by the convention's own carve-out.
enum AgentHookEvent {
  AGENT_HOOK_EVENT_UNSPECIFIED = 0;
  AGENT_HOOK_EVENT_PRE_TOOL_USE = 1;
  AGENT_HOOK_EVENT_POST_TOOL_USE = 2;
  AGENT_HOOK_EVENT_POST_TOOL_USE_FAILURE = 3;
  AGENT_HOOK_EVENT_POST_TOOL_BATCH = 4;
  AGENT_HOOK_EVENT_NOTIFICATION = 5;
  AGENT_HOOK_EVENT_USER_PROMPT_SUBMIT = 6;
  AGENT_HOOK_EVENT_USER_PROMPT_EXPANSION = 7;
  AGENT_HOOK_EVENT_SESSION_START = 8;
  AGENT_HOOK_EVENT_SESSION_END = 9;
  AGENT_HOOK_EVENT_STOP = 10;
  AGENT_HOOK_EVENT_STOP_FAILURE = 11;
  AGENT_HOOK_EVENT_SUBAGENT_START = 12;
  AGENT_HOOK_EVENT_SUBAGENT_STOP = 13;
  AGENT_HOOK_EVENT_PRE_COMPACT = 14;
  AGENT_HOOK_EVENT_POST_COMPACT = 15;
  AGENT_HOOK_EVENT_PERMISSION_REQUEST = 16;
  AGENT_HOOK_EVENT_PERMISSION_DENIED = 17;
  AGENT_HOOK_EVENT_SETUP = 18;
  AGENT_HOOK_EVENT_TEAMMATE_IDLE = 19;
  AGENT_HOOK_EVENT_TASK_CREATED = 20;
  AGENT_HOOK_EVENT_TASK_COMPLETED = 21;
  AGENT_HOOK_EVENT_ELICITATION = 22;
  AGENT_HOOK_EVENT_ELICITATION_RESULT = 23;
  AGENT_HOOK_EVENT_CONFIG_CHANGE = 24;
  AGENT_HOOK_EVENT_WORKTREE_CREATE = 25;
  AGENT_HOOK_EVENT_WORKTREE_REMOVE = 26;
  AGENT_HOOK_EVENT_INSTRUCTIONS_LOADED = 27;
  AGENT_HOOK_EVENT_CWD_CHANGED = 28;
  AGENT_HOOK_EVENT_FILE_CHANGED = 29;
  AGENT_HOOK_EVENT_DIRECTORY_ADDED = 30;
  AGENT_HOOK_EVENT_MESSAGE_DISPLAY = 31;
}

// ==========================================================================
// IDE diagnostics: the connected editor's language server reporting what a
// write or edit BROKE, injected by the vendor after the change's result.
// Rides the write/edit unit's own oneof as a post-terminal consequence arm.
// PRODUCER NOTE, load-bearing: the vendor's record carries no tool-call id;
// the join to its change is by ADJACENCY (the record follows the result),
// so the shim holds one remembered "last write/edit unit" value — constant,
// and stated here because nothing in the schema implies it.
// ==========================================================================

// One injected diagnostics report.
message AgentDiagnosticsReport {
  // Per-file findings, in the vendor's order.
  repeated AgentDiagnosticsFile files = 1;
}
// One file's findings.
message AgentDiagnosticsFile {
  // The file, as the vendor names it.
  string path = 1;
  // The findings, in order.
  repeated AgentDiagnostic diagnostics = 2;
}
// One finding.
message AgentDiagnostic {
  // The severity — the LSP's closed scalar set.
  AgentDiagnosticSeverity severity = 1;
  // The message, verbatim.
  string message = 2;
  // The producing tool ("eslint", "gopls"). UNSET when unstated.
  optional string source = 3;
  // The rule or code ("no-unused-vars"). UNSET when unstated.
  optional string code = 4;
  // Where the finding starts, zero-based line. Character precision is
  // deliberately dropped — nothing draws columns.
  int32 start_line = 5;
  // Where it ends, zero-based line.
  int32 end_line = 6;
}
// The LSP severity vocabulary — a closed set of scalar literals, never a
// state of anything.
enum AgentDiagnosticSeverity {
  AGENT_DIAGNOSTIC_SEVERITY_UNSPECIFIED = 0;
  AGENT_DIAGNOSTIC_SEVERITY_ERROR = 1;
  AGENT_DIAGNOSTIC_SEVERITY_WARNING = 2;
  AGENT_DIAGNOSTIC_SEVERITY_INFORMATION = 3;
  AGENT_DIAGNOSTIC_SEVERITY_HINT = 4;
}

// ==========================================================================
// Injected context: what the vendor silently pulled into the conversation.
// An injection is INSTANTANEOUS — one record, no lifecycle — so the unit
// arrives whole. Multiple injections per turn are routine; everything
// injected stays resident until a clear or compaction drops it.
// ==========================================================================

// One silent injection.
message AgentContextInjected {
  // What was injected. THE ARM IS THE SOURCE KIND.
  oneof injected {
    // A memory file (CLAUDE.md-family) pulled in by path discovery — the
    // session-start tree, or a mid-turn directory touch.
    AgentInjectedMemory memory = 1;
    // Skills discovered or invoked WITHOUT a tool call.
    AgentInjectedSkills skills = 2;
  }
}
// The injected memory file.
message AgentInjectedMemory {
  // The file's path, as the vendor names it.
  string path = 1;
  // Its content as injected, verbatim.
  string content = 2;
}
// The injected skills.
message AgentInjectedSkills {
  // One entry per skill, in the vendor's order.
  repeated AgentInjectedSkill skills = 1;
}
// One injected skill.
message AgentInjectedSkill {
  // The skill's name, verbatim.
  string name = 1;
  // Its path. UNSET when the vendor gave none (a dynamic-discovery delta
  // names the directory, not each file).
  optional string path = 2;
  // Its content as injected. UNSET when only the listing was injected.
  optional string content = 3;
}
