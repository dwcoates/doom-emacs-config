// session.proto — THE SESSION'S START: what a session is once it can accept
// a prompt, what a cold context costs, and what can be done about it.
//
// Declared here rather than in the shim's endpoint because these facts cross
// every surface: a cold context is something the USER decides about — a
// warning that resuming is expensive, and a choice of remediation the daemon
// then carries into its next open — so the shapes are conversation vocabulary,
// not the wire between two processes.

syntax = "proto3";

package conversation.v1;

import "conversation/v1/api.proto";
import "conversation/v1/detached_work.proto";
import "conversation/v1/permission.proto";
import "conversation/v1/turn.proto";

option go_package = "agentrepl/proto/conversation/v1;conversationv1";

// A session that can accept a prompt. Everything here is a FACT AT START;
// anything that changes later arrives as session updates, never here twice.
message SessionStarted {
  // The vendor's identity for this session — what a later resume names and
  // what the store scopes by. May differ from the one asked for when the
  // vendor rotated it; the vendor's answer wins.
  string vendor_session_id = 1;
  // Who is driving: the shim's build and the SDK it embeds.
  SessionRuntime runtime = 2;
  // The model actually in effect: the one asked for on a fresh start, or the
  // one recovered from the transcript on a resume (the SDK records it per
  // response but does NOT restore it; the shim reads it back and passes it).
  AgentModel effective_model = 3;
  // The permission mode in effect: asked for on a fresh start, recovered
  // from the transcript on a resume (recorded per prompt, not restored).
  AgentPermissionMode permission_mode = 7;
  // The models this session may switch to, each an echo token a model change
  // accepts.
  repeated ModelOption model_catalog = 4;

  // WHAT IS ALREADY RUNNING — why an opening states it at all: a daemon that
  // restarted was not there for the announcements, so it is told the
  // membership once, here. A fresh session has nothing live.
  //
  // The turn in flight, if one is. UNSET when the main thread is idle.
  optional TurnId turn_in_flight = 5;
  // Every detached item live now, each exactly as its spawning stream would
  // have announced it, so a consumer opens the matching stream for each.
  repeated AgentDetachedWork live_work = 6;
}

// The shim and the SDK it drives. Fixed for the process; stated once.
message SessionRuntime {
  // The shim's build commit.
  string shim_build_sha = 1;
  // The vendor SDK package version the shim embeds.
  string sdk_version = 2;
}

// A context whose prompt cache would not serve the next request: the cache
// LAPSED (a resume after the TTL), or the MODEL IS CHANGING (a cache is per
// model, so a switch re-reads everything whatever the TTL). Either way the
// next request would re-read the whole context at full price. The facts a
// decision needs, read from the transcript WITHOUT a model call.
message SessionCold {
  // Tokens the context held at the last request — what a cold read re-reads.
  uint64 context_tokens = 1;
  // When the last request was made, in unix millis.
  int64 last_request_at_ms = 2;
  // The model the request asked for, echoed so the choice is made against
  // the price of THAT model's reads.
  AgentModel requested_model = 3;
  // WHY the cache would not serve. The set arm is the reason; only a lapse
  // has a lifetime to report.
  oneof reason {
    // The cache lifetime passed since the last request.
    SessionColdLapsed lapsed = 4;
    // The model is changing, and a cache is per model. Fires ONLY when the
    // model asked for DIFFERS from the transcript's last; a same-model resume
    // is judged by the lifetime alone, and within it nothing fires.
    SessionColdModelSwitch model_switch = 5;
  }
}

// The cache lapsed.
message SessionColdLapsed {
  // The lifetime that lapsed, in millis (the vendor's 5-minute or 1-hour
  // tier, whichever the last request used).
  int64 cache_ttl_ms = 1;
}

// The model is changing.
message SessionColdModelSwitch {}

// What to do with a cold context. The set arm is the remediation; each costs
// something different, and the choice is the user's or the daemon's policy,
// never the shim's.
message SessionColdRemediation {
  oneof remediation {
    // Resume as-is and accept the cold read.
    SessionColdPay pay = 1;
    // Discard the context; keep the session identity. The cheapest, and it
    // forgets everything.
    SessionColdClear clear = 2;
    // Summarize the context into a fresh one. NOT CHEAP: the summary is a
    // cold read plus output; its payoff is every turn after it.
    SessionColdCompact compact = 3;
  }
}

// Accept the cold read.
message SessionColdPay {}

// Discard the context.
message SessionColdClear {}

// Compact the context. IMPLEMENTED BY THE SHIM, not by the vendor's own
// compaction: a throwaway session reads the transcript and writes the
// summary, then the real session is initialized from the compacted
// transcript. No consumer ever sees the throwaway.
message SessionColdCompact {
  // The model that writes the summary — chosen for this job, not the
  // session's model; a cheaper model often suffices.
  AgentModel model = 1;
  // WHAT is summarized. The set arm is the scope; each is a different trade
  // between fidelity and size.
  oneof scope {
    // The whole transcript: prompts, responses, tool calls and their results.
    SessionCompactFull full = 2;
    // The user's prompts alone.
    SessionCompactPromptsOnly prompts_only = 3;
    // The agent's responses alone.
    SessionCompactResponsesOnly responses_only = 4;
    // Prompts and responses, without tool traffic.
    SessionCompactPromptsAndResponses prompts_and_responses = 5;
  }
}

// The whole transcript.
message SessionCompactFull {}
// The user's prompts alone.
message SessionCompactPromptsOnly {}
// The agent's responses alone.
message SessionCompactResponsesOnly {}
// Prompts and responses, without tool traffic.
message SessionCompactPromptsAndResponses {}

// ---- The session's LIVE facts: what changes after opening ----

// One frame of the session's standing stream: a session-level fact that
// changed, AS IT MANIFESTS upstream. No terminal arm — the stream ends only
// with the session. Every arm is a fact ABOUT the session; nothing about any
// turn or unit rides here, because each of those has a stream of its own, and
// nothing synthetic rides here either — the shim's own health is PULLED, not
// pushed.
message SessionUpdate {
  oneof update {
    // The vendor gave the session a new identity mid-session.
    SessionIdentityRotated identity_rotated = 1;
    // The query died. DUPLICATED ON PURPOSE: every open stream — a turn's, a
    // subagent's, a run's — also concludes with its own failure, but a
    // consumer with no stream open still needs to know the session is over.
    SessionQueryDied query_died = 2;
    // The effective model changed — by SetSessionModel, or by the vendor. Stated here
    // even when the consumer asked for it, so one place is authoritative.
    SessionModelChanged model_changed = 3;
    // The vendor's fast mode switched.
    SessionFastMode fast_mode = 4;
    // One MCP server's health changed.
    SessionMcpServer mcp_server = 5;
    // The account's usage allowance was observed.
    SessionAccountUsage account_usage = 6;
    // The session's permission mode changed — by SetSessionPermissionMode, or by a
    // standing permission grant that set it. Stated here even when the
    // consumer asked for it, so one place is authoritative.
    SessionPermissionModeChanged permission_mode_changed = 7;
  }
}

// The vendor rotated the session's identity. The store scopes by this id, so
// a consumer re-keys; the previous id is carried so the two halves join.
message SessionIdentityRotated {
  // The identity before the rotation.
  string previous_vendor_session_id = 1;
  // The identity from now on.
  string vendor_session_id = 2;
  // The vendor's stated reason, verbatim; its vocabulary is not in evidence.
  string reason = 3;
}

// The query ended on its own. THE ARM IS HOW; an orderly close is
// KillSession's success, and a failure to start is StartSession's failure.
message SessionQueryDied {
  oneof cause {
    // The agent binary's stream ended without a close.
    SessionQueryUnexpectedEof unexpected_eof = 1;
    // The SDK's iterator threw.
    SessionQueryIteratorFailure iterator_failure = 2;
  }
}

// The agent binary's stream ended without a close.
message SessionQueryUnexpectedEof {}

// The SDK's iterator threw.
message SessionQueryIteratorFailure {
  // The thrown cause, verbatim.
  string cause = 1;
}

// The permission mode now in effect for the session.
message SessionPermissionModeChanged {
  // The mode now in effect.
  AgentPermissionMode permission_mode = 1;
}

// The model in effect for subsequent responses.
message SessionModelChanged {
  // The model now in effect.
  AgentModel effective_model = 1;
}

// Fast mode. THE ARM IS THE STATE; off carries the vendor's reason.
message SessionFastMode {
  oneof state {
    SessionFastModeOn on = 1;
    SessionFastModeOff off = 2;
  }
}

// Fast mode is in effect.
message SessionFastModeOn {}

// Fast mode is not in effect.
message SessionFastModeOff {
  // The vendor's reason, verbatim.
  string reason = 1;
}

// One MCP server, by name, and its health now.
message SessionMcpServer {
  // The server's configured name.
  string name = 1;
  // THE ARM IS THE HEALTH.
  oneof health {
    SessionMcpServerConnected connected = 2;
    SessionMcpServerFailed failed = 3;
  }
}

// The server is connected.
message SessionMcpServerConnected {}

// The server failed to connect or dropped.
message SessionMcpServerFailed {
  // The error, verbatim.
  string error = 1;
}

// What the account's allowance looked like when sampled. LIVE, whenever the
// shim observes it — not pinned to a turn boundary.
message SessionAccountUsage {
  // When it was sampled, in unix millis.
  int64 observed_at_ms = 1;
  // The vendor's subscription word, verbatim; its vocabulary is not in
  // evidence.
  string subscription_type = 2;
  // THE ARM IS WHETHER A FIGURE WAS READ.
  oneof outcome {
    SessionAccountUsageAvailable available = 3;
    SessionAccountUsageUnavailable unavailable = 4;
  }
}

// A figure was read.
message SessionAccountUsageAvailable {
  // The rolling five-hour window.
  SessionUsageWindow five_hour = 1;
}

// One allowance window's figures.
message SessionUsageWindow {
  // How much of the window is used, 0–100.
  double utilization_percent = 1;
  // When the window resets, in unix millis.
  int64 resets_at_ms = 2;
}

// Why no figure could be read. THE ARM IS THE REASON.
message SessionAccountUsageUnavailable {
  oneof reason {
    // The usage service did not answer.
    SessionUsageServiceUnavailable service_unavailable = 1;
    // The service answered without a five-hour window.
    SessionUsageWindowUnavailable window_unavailable = 2;
    // The window carried no utilization figure.
    SessionUsageUtilizationUnavailable utilization_unavailable = 3;
    // The shim's own sampling failed.
    SessionUsageSamplingFailure sampling_failure = 4;
  }
}

// The usage service did not answer.
message SessionUsageServiceUnavailable {}
// The service answered without a five-hour window.
message SessionUsageWindowUnavailable {}
// The window carried no utilization figure.
message SessionUsageUtilizationUnavailable {}
// The shim's own sampling failed.
message SessionUsageSamplingFailure {
  // The cause, verbatim.
  string cause = 1;
}

// ---- The shim's own health: PULLED by the daemon, never pushed ----

// The shim's account of its own health at the instant it was asked. A
// SYNTHETIC fact — the shim reporting on itself at the daemon's cadence —
// which is why it is pulled rather than mixed into the standing stream of
// upstream happenings.
message SessionDiagnostics {
  // THE ARM IS THE VERDICT. Unhealthy is an ANSWER, never a failure of the
  // call that asked.
  oneof health {
    SessionHealthy healthy = 1;
    SessionUnhealthy unhealthy = 2;
  }
  // Every degraded window the shim has recorded since it started, open or
  // closed, oldest first. Kept so a daemon that asks after the fact still
  // learns what was lost.
  repeated SessionDegradedWindow degraded_windows = 3;
}

// Nothing is wrong with the shim itself.
message SessionHealthy {}

// Something is wrong with the shim itself.
message SessionUnhealthy {
  // Each fault standing now.
  repeated SessionFault faults = 1;
}

// One fault of the shim's own.
message SessionFault {
  // Which part of the shim (its store client, its converter, its sidecar
  // link, …).
  string component = 1;
  // The fault, for a human and for logs. A `kind` oneof is added WITH its
  // first derived arms at the wave, from the shim's real fault sites.
  string detail = 2;
}

// A window during which one component of the shim was degraded. THE ARM IS
// WHETHER IT HAS CLOSED, and only a closed window knows what was lost.
message SessionDegradedWindow {
  // Which part of the shim.
  string component = 1;
  // Why it degraded, as the shim stated when the window opened.
  string reason = 2;
  // When the window opened, in unix millis.
  int64 began_at_ms = 3;
  oneof extent {
    // Still degraded.
    SessionDegradedOpen open = 4;
    // Recovered.
    SessionDegradedClosed closed = 5;
  }
}

// The window is still open.
message SessionDegradedOpen {}

// The window closed.
message SessionDegradedClosed {
  // When it closed, in unix millis.
  int64 ended_at_ms = 1;
  // How many observations the component dropped while degraded — records
  // that never reached the store, frames never sent.
  uint64 dropped_count = 2;
}

// ---- Killing ----

// The session was killed. THE ARM IS HOW: idle, or by force over live work.
message SessionKilled {
  oneof how {
    // Nothing was live; the query ended cleanly.
    SessionKilledIdle idle = 1;
    // Live work was killed with it — the turn if one was open, and EVERY
    // live task, whichever turn spawned it. Names what died, so the consumer
    // can conclude the elements it was drawing for them.
    SessionKilledForced forced = 2;
  }
}

// Killed with nothing live.
message SessionKilledIdle {}

// Killed by force.
message SessionKilledForced {
  // The turn that was interrupted, if one was in flight.
  optional TurnId interrupted_turn = 1;
  // Every detached item that was stopped.
  repeated DetachedWorkId stopped_work = 2;
}

// The session could not be killed because work is live and force was not
// asked. Names the work, so the consumer can stop it itself or ask for force.
message SessionLive {
  // The turn in flight, if one is.
  optional TurnId turn_in_flight = 1;
  // Every detached item live now.
  repeated DetachedWorkId live_work = 2;
}
