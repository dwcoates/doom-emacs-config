// session.proto — THE SESSION'S START: what a session is once it can accept
// a prompt, what a cold context costs, and what can be done about it.
//
// Declared here rather than in the shim's endpoint because these facts cross
// every surface: a cold context is something the USER decides about — a
// warning that resuming is expensive, and a choice of remediation the daemon
// then carries into its next open — so the shapes are conversation vocabulary,
// not the wire between two processes.

syntax = "proto3";

package conversation.v1;

import "conversation/v1/api.proto";
import "conversation/v1/detached_work.proto";
import "conversation/v1/permission.proto";
import "conversation/v1/agent_activity.proto";
import "conversation/v1/turn.proto";

option go_package = "agentrepl/proto/conversation/v1;conversationv1";

// A session that can accept a prompt. Everything here is a FACT AT START;
// anything that changes later arrives as session updates, never here twice.
message SessionStarted {
  // The vendor's identity for this session — what a later resume names and
  // what the store scopes by. May differ from the one asked for when the
  // vendor rotated it; the vendor's answer wins.
  string vendor_session_id = 1;
  // Who is driving: the shim's build and the SDK it embeds.
  SessionRuntime runtime = 2;
  // The model actually in effect: the one asked for on a fresh start, or the
  // one recovered from the transcript on a resume (the SDK records it per
  // response but does NOT restore it; the shim reads it back and passes it).
  AgentModel effective_model = 3;
  // The permission mode in effect: asked for on a fresh start, recovered
  // from the transcript on a resume (recorded per prompt, not restored).
  AgentPermissionMode permission_mode = 7;
  // The models this session may switch to, each an echo token a model change
  // accepts.
  repeated ModelOption model_catalog = 4;

  // WHAT IS ALREADY RUNNING — why an opening states it at all: a daemon that
  // restarted was not there for the announcements, so it is told the
  // membership once, here. A fresh session has nothing live.
  //
  // The turn in flight, if one is. UNSET when the main thread is idle.
  optional TurnId turn_in_flight = 5;
  // Every detached item live now, each exactly as its spawning stream would
  // have announced it, so a consumer opens the matching stream for each.
  repeated AgentDetachedWork live_work = 6;

  // WHAT THE VENDOR SAID ABOUT ITSELF AND ABOUT THIS SESSION'S ENVIRONMENT
  // when it opened. UNSET when the producer observed no handshake, which is
  // what a session recovered from a transcript rather than started looks like.
  optional SessionVendorHandshake handshake = 8;
}

// THE VENDOR'S OWN OPENING STATEMENT: what this build is, where it is running,
// and what it has available.
//
// EVERY FIELD IS A FACT AT START. Anything that later changes has a
// SessionUpdate arm of its own and is never restated here — this is the
// baseline those updates move away from.
//
// WHY IT IS A BLOCK RATHER THAN FIELDS ON SessionStarted: the fields above are
// what this system decided about the session (its model, its permission mode,
// the catalog it will offer), and these are what the vendor reported. Keeping
// them apart means a consumer never has to wonder which authority a value came
// from, and a session opened without a handshake is one absent field rather
// than fourteen.
message SessionVendorHandshake {
  // ---- What the binary is ----

  // Which entrypoint produced this session — how a record made outside this
  // system is told apart from one made inside it.
  SessionEntrypoint entrypoint = 1;

  // The producer class the vendor attributes the session to, verbatim; its
  // vocabulary is the vendor's and it is shown rather than switched on.
  string user_type = 2;

  // The beta features this session runs with, by the vendor's own flag names.
  // Empty when none are on.
  //
  // WORTH CARRYING because a beta flag changes what the session IS — the
  // long-context beta changes the model's window size, so a context-fill
  // surface computing against the ordinary window would be wrong by a
  // multiple.
  repeated string betas = 3;

  // What this binary reports itself capable of, by the vendor's own capability
  // names. Empty when it reported none.
  //
  // A CONSUMER MUST CONSULT THIS BEFORE USING A CAPABILITY-GATED PATH. The
  // alternative is inferring capability from the version string, which is what
  // this list exists to replace.
  repeated string capabilities = 4;

  // ---- Where it is running ----

  // The directory the session was started in, as the vendor reports it. THE
  // VENDOR'S NOTION, which is not necessarily the workspace directory this
  // system opened the session for; when they differ, this is what the agent
  // actually sees.
  string cwd = 5;

  // The git branch checked out at start. UNSET when the directory is not a git
  // repository, or the vendor reported no branch — never an empty string
  // standing in for either.
  optional string git_branch = 6;

  // ---- What it has available ----

  // Every tool this session has, by name. Empty when the vendor listed none.
  //
  // THE SET UNMODELED WORK IS MEASURED AGAINST: a tool arriving as
  // AgentUnmodeled is a gap in this contract, and this list is what says
  // whether the tool was even available to be called.
  repeated string tools = 7;

  // Every skill this session may invoke, by name. Empty when the vendor listed
  // none. A skill invocation that fails on an unknown name is only explicable
  // against this list.
  repeated string skills = 8;

  // Every subagent definition this session may spawn.
  repeated SessionSubagentDefinition subagents = 9;

  // Every plugin loaded into this session.
  repeated SessionPlugin plugins = 10;

  // The output style in effect. UNSET when the vendor named none, in which
  // case its default applies and this system does not know what that is.
  optional string output_style = 11;

  // ---- Who it bills ----

  // Where the credential came from.
  SessionApiKeySource api_key_source = 12;

  // Which provider serves this session's requests, as the vendor words it; its
  // vocabulary is the vendor's and it is shown rather than switched on.
  //
  // LOAD-BEARING FOR ACCOUNT USAGE: allowance figures exist only for some
  // providers, so a session reporting usage as unavailable is EXPLAINED by
  // this rather than merely failing.
  string api_provider = 13;

  // ---- What it is called ----

  // The conversation's own names. UNSET when the vendor gave it none.
  optional SessionConversationName conversation_name = 14;
}

// Which entrypoint produced a session. A closed set of scalar choices with no
// per-value payload and no exclusive sibling — an enum by the convention's own
// carve-out.
enum SessionEntrypoint {
  SESSION_ENTRYPOINT_UNSPECIFIED = 0;
  // An interactive command-line session a person is driving directly.
  SESSION_ENTRYPOINT_CLI = 1;
  // A command-line session driven by a program through the SDK — which is
  // what this system's own sessions are.
  SESSION_ENTRYPOINT_SDK_CLI = 2;
}

// Where a session's credential came from. A closed set of scalar choices, so
// an enum by the same carve-out. It says WHOSE key is paying, which is a
// question a user asks of a session and cannot otherwise answer.
enum SessionApiKeySource {
  SESSION_API_KEY_SOURCE_UNSPECIFIED = 0;
  // The user's own key.
  SESSION_API_KEY_SOURCE_USER = 1;
  // A key configured for the project.
  SESSION_API_KEY_SOURCE_PROJECT = 2;
  // A key issued by the organization.
  SESSION_API_KEY_SOURCE_ORG = 3;
  // A short-lived key that will not outlive the session.
  SESSION_API_KEY_SOURCE_TEMPORARY = 4;
  // An OAuth login rather than a key at all.
  SESSION_API_KEY_SOURCE_OAUTH = 5;
}

// One subagent this session may spawn.
//
// WITHOUT THE CATALOG, a subagent type is a bare string nothing can validate
// and no surface can offer for selection — a spawn misnaming its type fails at
// the vendor with no earlier chance to catch it.
message SessionSubagentDefinition {
  // The name a spawn asks for.
  string name = 1;
  // What the definition says the agent is for, as a selector shows it.
  string description = 2;
  // The model the definition runs it under. UNSET when the definition names
  // none and the caller's or the session's model decides.
  optional AgentModel model = 3;
}

// One plugin loaded into this session.
message SessionPlugin {
  // The plugin's name, as work attributable to it names it.
  string name = 1;
  // Its version, when it declares one. UNSET otherwise.
  optional string version = 2;
}

// What a conversation is CALLED, in the several senses the vendor keeps.
//
// EVERY FIELD IS OPTIONAL AND THEY ARE NOT ALTERNATIVES: a conversation may
// carry a generated slug, a model-written title and a user-set title at once,
// and a surface picks by its own precedence rather than being handed one
// resolved string it cannot override.
message SessionConversationName {
  // A short generated handle, stable for the conversation's life ("tingly-
  // rolling-river"). UNSET when the vendor generated none.
  optional string slug = 1;
  // A title the model wrote for the conversation from its content. UNSET when
  // none was written — which is what a conversation too short to summarize
  // looks like.
  optional string generated_title = 2;
  // A title the USER set by hand, which outranks the generated one wherever
  // both exist. UNSET when the user set none.
  optional string user_title = 3;
  // The name of the agent this conversation belongs to, when it belongs to a
  // named one. UNSET for the main-thread conversation.
  optional string agent_name = 4;
}

// The shim and the SDK it drives. Fixed for the process; stated once.
message SessionRuntime {
  // The shim's build commit.
  string shim_build_sha = 1;
  // The vendor SDK package version the shim embeds.
  string sdk_version = 2;
  // The AGENT BINARY's own version, which is a third thing again: the SDK is
  // an npm package the shim links, and the binary is the CLI that package
  // drives. They version independently, and a defect reproducible on one build
  // of the binary cannot be reported without this.
  string agent_binary_version = 3;
}

// A context whose prompt cache would not serve the next request: the cache
// LAPSED (a resume after the TTL), or the MODEL IS CHANGING (a cache is per
// model, so a switch re-reads everything whatever the TTL). Either way the
// next request would re-read the whole context at full price. The facts a
// decision needs, read from the transcript WITHOUT a model call.
message SessionCold {
  // Tokens the context held at the last request — what a cold read re-reads.
  uint64 context_tokens = 1;
  // When the last request was made, in unix millis.
  int64 last_request_at_ms = 2;
  // The model the request asked for, echoed so the choice is made against
  // the price of THAT model's reads.
  AgentModel requested_model = 3;
  // WHY the cache would not serve. The set arm is the reason; only a lapse
  // has a lifetime to report.
  oneof reason {
    // The cache lifetime passed since the last request.
    SessionColdLapsed lapsed = 4;
    // The model is changing, and a cache is per model. Fires ONLY when the
    // model asked for DIFFERS from the transcript's last; a same-model resume
    // is judged by the lifetime alone, and within it nothing fires.
    SessionColdModelSwitch model_switch = 5;
  }
}

// The cache lapsed.
message SessionColdLapsed {
  // The lifetime that lapsed, in millis (the vendor's 5-minute or 1-hour
  // tier, whichever the last request used).
  int64 cache_ttl_ms = 1;
}

// The model is changing.
message SessionColdModelSwitch {}

// What to do with a cold context. The set arm is the remediation; each costs
// something different, and the choice is the user's or the daemon's policy,
// never the shim's.
message SessionColdRemediation {
  oneof remediation {
    // Resume as-is and accept the cold read.
    SessionColdPay pay = 1;
    // Discard the context; keep the session identity. The cheapest, and it
    // forgets everything.
    SessionColdClear clear = 2;
    // Summarize the context into a fresh one. NOT CHEAP: the summary is a
    // cold read plus output; its payoff is every turn after it.
    SessionColdCompact compact = 3;
  }
}

// Accept the cold read.
message SessionColdPay {}

// Discard the context.
message SessionColdClear {}

// Compact the context. IMPLEMENTED BY THE SHIM, not by the vendor's own
// compaction: a throwaway session reads the transcript and writes the
// summary, then the real session is initialized from the compacted
// transcript. No consumer ever sees the throwaway.
message SessionColdCompact {
  // The model that writes the summary — chosen for this job, not the
  // session's model; a cheaper model often suffices.
  AgentModel model = 1;
  // WHAT is summarized — each value a different trade between fidelity and
  // size. Never UNSPECIFIED in a valid request.
  SessionCompactScope scope = 2;
}

// The compaction scopes: a closed set of scalar choices (no state, no
// per-value exclusive siblings), so an enum by the convention's own
// carve-out. One canonical vocabulary — the frontend's cold-gate menu and
// the answer verb import it, never respell it.
enum SessionCompactScope {
  SESSION_COMPACT_SCOPE_UNSPECIFIED = 0;
  // The whole transcript: prompts, responses, tool calls and their results.
  SESSION_COMPACT_SCOPE_ALL = 1;
  // The user's prompts alone.
  SESSION_COMPACT_SCOPE_PROMPTS = 2;
  // The agent's responses alone.
  SESSION_COMPACT_SCOPE_RESPONSES = 3;
}

// ---- The session's LIVE facts: what changes after opening ----

// One frame of the session's standing stream: a session-level fact that
// changed, AS IT MANIFESTS upstream. No terminal arm — the stream ends only
// with the session. Every arm is a fact ABOUT the session; nothing about any
// turn or unit rides here, because each of those has a stream of its own, and
// nothing synthetic rides here either — the shim's own health is PULLED, not
// pushed.
message SessionUpdate {
  oneof update {
    // The vendor gave the session a new identity mid-session.
    SessionIdentityRotated identity_rotated = 1;
    // The query died. DUPLICATED ON PURPOSE: every open stream — a turn's, a
    // subagent's, a run's — also concludes with its own failure, but a
    // consumer with no stream open still needs to know the session is over.
    SessionQueryDied query_died = 2;
    // The effective model changed — by SetSessionModel, or by the vendor. Stated here
    // even when the consumer asked for it, so one place is authoritative.
    SessionModelChanged model_changed = 3;
    // The vendor's fast mode switched.
    SessionFastMode fast_mode = 4;
    // One MCP server's health changed.
    SessionMcpServer mcp_server = 5;
    // The account's usage allowance was observed.
    SessionAccountUsage account_usage = 6;
    // The session's permission mode changed — by SetSessionPermissionMode, or by a
    // standing permission grant that set it. Stated here even when the
    // consumer asked for it, so one place is authoritative.
    SessionPermissionModeChanged permission_mode_changed = 7;

    // The vendor is RETRYING a request it could not complete. Neither a
    // failure nor activity: the request has not concluded, and a surface that
    // draws nothing here shows a session frozen for no stated reason.
    SessionApiRetrying api_retrying = 8;
    // The session's authentication state moved — a login prompt is up, or it
    // resolved.
    SessionAuthStatus auth_status = 9;
    // WHAT THE SESSION IS DOING RIGHT NOW, when it is doing something with no
    // unit of its own to draw. Compacting and waiting on a request are both
    // periods where nothing else is on the wire.
    SessionBusy busy = 10;
    // The worker is going down, and said why. Distinct from the query dying:
    // this was ANNOUNCED, and drawing an announced shutdown as an unexpected
    // end accuses the vendor of a fault it did not commit.
    SessionWorkerShuttingDown worker_shutting_down = 11;
    // A notice the vendor addressed to the USER, not to the model.
    SessionNotification notification = 12;
    // The vendor failed to write its OWN transcript. Silent upstream data
    // loss, which everything read back from the transcript depends on.
    SessionTranscriptWriteFailed transcript_write_failed = 13;
    // The session's standing goal and loop state changed.
    SessionActiveGoal active_goal = 14;
    // The vendor offered the user a prompt to run next.
    SessionPromptSuggestion prompt_suggestion = 15;
    // Files were uploaded to the API, and some may have failed.
    SessionFilesPersisted files_persisted = 16;
    // An interrupt did not cancel everything it was aimed at.
    SessionInterruptIncomplete interrupt_incomplete = 17;
    // The vendor's own context-budget warning, injected into the prompt as
    // the window fills. Session-scoped; the footer's activity line draws it.
    SessionContextBudgetWarning context_budget_warning = 24;
    // One MCP server's permission policy — including a ceiling the user
    // cannot raise.
    SessionMcpPermissionPolicy mcp_permission_policy = 18;
    // The set of background tasks the vendor is holding, whole.
    SessionBackgroundTasks background_tasks = 19;
    // THE VENDOR REFUSED AND SWITCHED MODELS. The answer the user is about to
    // read came from a model the session does not say is effective.
    SessionModelFallback model_fallback = 20;
    // The session moved directory, or entered or left a git worktree.
    SessionLocationChanged location_changed = 21;
    // The tool set changed mid-session — tools deferred out, or back in.
    SessionToolsChanged tools_changed = 22;
    // A settings file could not be read, so some configuration is not in
    // effect.
    SessionSettingsFault settings_fault = 23;
  }
}

// The vendor is retrying a request. NOT a conclusion: the request may still
// succeed, and nothing about it has failed for good yet.
message SessionApiRetrying {
  // Which attempt is about to run, one-based — so `2` means the first failed.
  uint32 attempt = 1;
  // How many attempts will be made before the request is failed for good.
  uint32 max_retries = 2;
  // How long the vendor will wait before the next attempt, in milliseconds.
  // UNSET when it stated no delay.
  //
  // THE VENDOR'S ONLY RETRY HINT rides the RETRY, never the failure — so a
  // consumer that waits for a failure to learn a delay never learns one.
  optional uint64 retry_delay_ms = 3;
  // The status the failed attempt returned, as the vendor worded it. UNSET
  // when it stated none.
  optional string error_status = 4;
  // The error itself, verbatim.
  string error = 5;
}

// Where the session's authentication stands.
message SessionAuthStatus {
  // THE ARM IS THE STATE. A session waiting on a login is BLOCKED and looks
  // idle without this.
  oneof state {
    // A login is in progress and the session cannot proceed until it settles.
    SessionAuthenticating authenticating = 1;
    // No login is in progress.
    SessionAuthenticated settled = 2;
  }
  // What the login printed for the user to act on — a device code, a URL — in
  // the order it was printed. Empty when it printed nothing.
  repeated string output = 3;
  // What went wrong with the login, verbatim. UNSET when nothing did.
  optional string error = 4;
}

// A login is in progress.
message SessionAuthenticating {}

// No login is in progress.
message SessionAuthenticated {}

// What the session is doing during a period with no unit of its own.
message SessionBusy {
  // THE ARM IS THE ACTIVITY. No idle arm: idleness is the absence of a
  // session-busy frame, and an explicit one would be a second authority on a
  // fact the stream already states by saying nothing.
  oneof activity {
    // Waiting on the API to answer a request.
    SessionBusyRequesting requesting = 1;
    // Compacting the context. Frequently the longest silence in a session.
    SessionBusyCompacting compacting = 2;
  }
}

message SessionBusyRequesting {}
message SessionBusyCompacting {}

// The worker announced that it is going down.
message SessionWorkerShuttingDown {
  // The vendor's stated reason, verbatim; its vocabulary is not in evidence.
  string reason = 1;
}

// A notice the vendor addressed to the user.
message SessionNotification {
  // The vendor's own key for the notice, so a consumer can coalesce repeats of
  // one notice rather than stacking them. Opaque: compare for equality.
  string key = 1;
  // The notice, verbatim, to be shown to the user.
  string text = 2;
  // How urgently it should be shown.
  SessionNotificationPriority priority = 3;
  // A color the vendor asks it be drawn in, as the vendor spells it. UNSET
  // when it asked for none. A REQUEST, not a requirement.
  optional string color = 4;
  // How long the vendor asks it be shown for, in milliseconds. UNSET when it
  // asked for no timeout, which means it stays until dismissed.
  optional uint64 timeout_ms = 5;
}

// How urgently a notice should be shown. A closed, ORDERED set of scalar
// choices with no per-value payload — an enum by the convention's own
// carve-out, and ordered so a consumer can threshold on it.
enum SessionNotificationPriority {
  SESSION_NOTIFICATION_PRIORITY_UNSPECIFIED = 0;
  SESSION_NOTIFICATION_PRIORITY_LOW = 1;
  SESSION_NOTIFICATION_PRIORITY_MEDIUM = 2;
  SESSION_NOTIFICATION_PRIORITY_HIGH = 3;
  // Must be shown now, interrupting whatever is drawn.
  SESSION_NOTIFICATION_PRIORITY_IMMEDIATE = 4;
}

// The vendor could not write its own transcript.
//
// UPSTREAM DATA LOSS, and it is silent without this: everything replayed from
// the transcript — history, resumes, the file plane a sidecar reads — depends
// on that file existing and being complete.
message SessionTranscriptWriteFailed {
  // What went wrong, verbatim.
  string error = 1;
  // The vendor's key for the project the transcript belongs to. UNSET when it
  // named none. Opaque: compare for equality, never parse.
  optional string project_key = 2;
  // The path within the project it failed to write. UNSET when it named none.
  optional string subpath = 3;
}

// The session's standing goal: a condition it is looping toward.
message SessionActiveGoal {
  // The condition the loop runs until, as the user or the tooling stated it.
  string condition = 1;
  // How many iterations have run.
  uint32 iterations = 2;
  // When the goal was set, in unix millis.
  int64 set_at_ms = 3;
  // How many tokens the context held when the goal was set — the baseline a
  // loop's growth is measured against.
  uint64 tokens_at_start = 4;
  // Why the last iteration ended, as the producer worded it. UNSET before the
  // first iteration ends.
  optional string last_reason = 5;
}

// A prompt the vendor offers the user to run next.
message SessionPromptSuggestion {
  // The suggested prompt, verbatim, for the composer to be filled with.
  string text = 1;
}

// Files were uploaded to the API for this session.
message SessionFilesPersisted {
  // The files that uploaded. Empty when none did.
  repeated SessionPersistedFile files = 1;
  // The files that FAILED to upload, each with its reason. Empty when none
  // did. Carried because a request built on a file that never arrived fails
  // for a reason nothing else explains.
  repeated SessionFileUploadFailure failed = 2;
  // When the upload pass finished, in unix millis.
  int64 processed_at_ms = 3;
}

// One file that uploaded.
message SessionPersistedFile {
  // The file's name as it was uploaded.
  string filename = 1;
  // The API's handle for the uploaded file — what a later request names to
  // reference it. Opaque: compare for equality, never parse or construct one.
  string file_id = 2;
}

// One file that did not upload.
message SessionFileUploadFailure {
  // The file's name.
  string filename = 1;
  // Why it failed, verbatim.
  string error = 2;
}

// An interrupt did not cancel everything it was aimed at.
//
// A FAULT TO SURFACE rather than an outcome: the user asked for a stop and
// something kept running, so the session is not in the state they believe.
message SessionInterruptIncomplete {
  // How many queued items survived the interrupt.
  //
  // A COUNT AND NOT A LIST: the vendor names the survivors in its own record
  // identity space, which nothing on this contract addresses, so a list of
  // them would be unusable. The count is what a consumer can act on — it says
  // the stop was incomplete and by how much.
  uint32 still_queued_count = 1;
  // How many queued items the interrupt did cancel.
  uint32 cancelled_count = 2;
}

// The vendor's context-budget warning: its own signal that the context
// window is filling, injected into the prompt as an attachment record.
message SessionContextBudgetWarning {
  // The vendor's warning text, verbatim — the producer composes it and no
  // structured figure rides the record.
  string text = 1;
}

// The permission policy in force for one MCP server.
message SessionMcpPermissionPolicy {
  // Which server.
  string server_name = 1;

  // The policy in effect for this server's tools.
  oneof policy {
    // Its tools run without asking.
    SessionMcpPolicyAlwaysAllow always_allow = 2;
    // Its tools ask every time.
    SessionMcpPolicyAlwaysAsk always_ask = 3;
    // Its tools never run.
    SessionMcpPolicyAlwaysDeny always_deny = 4;
  }

  // THE CEILING THE ORGANIZATION IMPOSES, which the user cannot raise. UNSET
  // when the organization imposes none.
  //
  // WORTH DRAWING SEPARATELY FROM THE POLICY: a permission surface that offers
  // a choice the ceiling forbids is offering something that will not take
  // effect, and the user has no way to learn why.
  oneof org_ceiling {
    // The organization permits up to allowing this server's tools.
    SessionMcpCeilingAllow ceiling_allow = 5;
    // The organization permits at most asking; never standing allowance.
    SessionMcpCeilingAsk ceiling_ask = 6;
    // The organization forbids this server outright.
    SessionMcpCeilingBlocked ceiling_blocked = 7;
  }
}

message SessionMcpPolicyAlwaysAllow {}
message SessionMcpPolicyAlwaysAsk {}
message SessionMcpPolicyAlwaysDeny {}
message SessionMcpCeilingAllow {}
message SessionMcpCeilingAsk {}
message SessionMcpCeilingBlocked {}

// The background tasks the vendor is holding, WHOLE.
//
// REPLACE SEMANTICS: every frame carries the entire set and a consumer swaps
// its picture for it. A late or restarted consumer is correct after one frame,
// which per-task add and remove frames could not promise.
message SessionBackgroundTasks {
  // Every background task live now. Empty means none are.
  repeated SessionBackgroundTask tasks = 1;
}

// One background task the vendor is holding.
message SessionBackgroundTask {
  // The vendor's handle for it. Opaque: compare for equality, never parse.
  string task_id = 1;
  // What kind of task it is, as the vendor names the kind.
  string task_type = 2;
  // A line describing it, for a reader.
  string description = 3;
}

// THE VENDOR REFUSED ON ONE MODEL AND ANSWERED ON ANOTHER.
//
// NOT SessionModelChanged, which names a DELIBERATE change: nobody chose this,
// it may revert without notice, and the session's effective model may be
// unchanged even though this answer did not come from it. A reader told only
// that a model is effective would attribute the answer to the wrong model.
message SessionModelFallback {
  // The model that refused.
  AgentModel original_model = 1;
  // The model that answered instead.
  AgentModel fallback_model = 2;

  // WHAT THE FALLBACK DOES TO SUBSEQUENT REQUESTS. The set arm is the answer,
  // and the three are genuinely different futures for the session.
  oneof direction {
    // This request alone was retried on the fallback; the session's model is
    // unchanged.
    SessionModelFallbackRetry retry = 3;
    // The session reverted to the original model after this request.
    SessionModelFallbackRevert revert = 4;
    // The fallback STICKS: subsequent requests run on it until something
    // changes it back.
    SessionModelFallbackSticky sticky = 5;
  }

  // What triggered the fallback, as the vendor words it; its vocabulary is not
  // settled and it is shown rather than switched on.
  string trigger = 6;
  // Which safety category the original model's refusal fell under. UNSET when
  // the vendor classified it into none.
  optional AgentRefusalCategory refusal_category = 7;
  // The original model's stated explanation for refusing. UNSET when it gave
  // none.
  optional string refusal_explanation = 8;
}

message SessionModelFallbackRetry {}
message SessionModelFallbackRevert {}
message SessionModelFallbackSticky {}

// The session moved.
message SessionLocationChanged {
  // WHAT KIND OF MOVE. The two are different facts: one is a directory change
  // within the same checkout, the other is a whole separate working tree with
  // its own branch — so what a reader must be told differs entirely.
  oneof location {
    // The session's working directory changed.
    SessionRelocated relocated = 1;
    // The session entered a git worktree, or returned from one.
    SessionWorktreeState worktree_state = 2;
  }
}

// The session's working directory changed.
message SessionRelocated {
  // The directory it is now in.
  string cwd = 1;
}

// The session's git worktree changed.
message SessionWorktreeState {
  // WHETHER IT IS IN A WORKTREE NOW. The arm carries what applies: a session
  // that left one has only the place it returned to.
  oneof state {
    // The session is now working inside a worktree.
    SessionInWorktree entered = 1;
    // The session has left the worktree and returned.
    SessionLeftWorktree left = 2;
  }

  // The directory the session was in before it entered, so a reader can see
  // where it will return to. UNSET when the producer stated none.
  optional string original_cwd = 3;
  // The branch that was checked out before it entered. UNSET when the
  // producer stated none.
  optional string original_branch = 4;
  // The commit that was checked out before it entered. UNSET when the producer
  // stated none — and the one fact that survives the worktree being deleted.
  optional string original_head_commit = 5;
}

// The session is working inside a worktree.
message SessionInWorktree {
  // The worktree's path on disk.
  string path = 1;
  // The worktree's name, as it was created.
  string name = 2;
  // The branch checked out in it.
  string branch = 3;
}

// The session has left the worktree.
message SessionLeftWorktree {}

// THE SESSION'S TOOL SET CHANGED while it was running.
//
// A DELTA AND NOT A REPLACEMENT, because that is what the producer states: it
// names what moved rather than restating the whole set. The baseline is
// SessionVendorHandshake.tools, and a consumer applies these in arrival order.
message SessionToolsChanged {
  // Tools that became available and were not available before. Empty when none
  // did.
  repeated string added = 1;
  // Tools that stopped being available. Empty when none did. A call to one of
  // these after this frame fails for a reason nothing else explains.
  repeated string removed = 2;
  // Tools that had been removed and are available again. Kept apart from
  // `added` because the two mean different things to a reader watching a set
  // churn.
  repeated string readded = 3;
}

// A settings file could not be read, so what it configures is not in effect.
//
// A CONFIGURATION FACT AND NOT A SHIM FAULT, which is why it is not
// SessionFault: nothing about this system is broken, and the user's own file
// is what needs fixing.
message SessionSettingsFault {
  // The file that could not be read.
  string file = 1;
  // The path within it the problem is at, when the producer located one. UNSET
  // when it could not — a file that failed to parse at all has no path.
  optional string path = 2;
  // What was wrong with it, verbatim. The only account the user has, and what
  // their next action depends on.
  string message = 3;
}

// The vendor rotated the session's identity. The store scopes by this id, so
// a consumer re-keys; the previous id is carried so the two halves join.
message SessionIdentityRotated {
  // The identity before the rotation.
  string previous_vendor_session_id = 1;
  // The identity from now on.
  string vendor_session_id = 2;
  // The vendor's stated reason, verbatim; its vocabulary is not in evidence.
  string reason = 3;
}

// The query ended on its own. THE ARM IS HOW; an orderly close is
// KillSession's success, and a failure to start is StartSession's failure.
message SessionQueryDied {
  oneof cause {
    // The agent binary's stream ended without a close.
    SessionQueryUnexpectedEof unexpected_eof = 1;
    // The SDK's iterator threw.
    SessionQueryIteratorFailure iterator_failure = 2;
  }
}

// The agent binary's stream ended without a close.
message SessionQueryUnexpectedEof {}

// The SDK's iterator threw.
message SessionQueryIteratorFailure {
  // The thrown cause, verbatim.
  string cause = 1;
}

// The permission mode now in effect for the session.
message SessionPermissionModeChanged {
  // The mode now in effect.
  AgentPermissionMode permission_mode = 1;
}

// The model in effect for subsequent responses.
message SessionModelChanged {
  // The model now in effect.
  AgentModel effective_model = 1;
}

// Fast mode. THE ARM IS THE STATE; off carries the vendor's reason.
message SessionFastMode {
  oneof state {
    SessionFastModeOn on = 1;
    SessionFastModeOff off = 2;
    // Fast mode is unavailable for now and will return on its own. NOT the
    // same as off: nothing needs doing and offering the user a way to turn it
    // on would offer something that cannot take effect.
    SessionFastModeCooldown cooldown = 3;
  }
}

// Fast mode is temporarily unavailable and will return on its own.
message SessionFastModeCooldown {}

// Fast mode is in effect.
message SessionFastModeOn {}

// Fast mode is not in effect.
message SessionFastModeOff {
  // The vendor's reason, verbatim.
  string reason = 1;
}

// One MCP server, by name, and its health now.
message SessionMcpServer {
  // The server's configured name.
  string name = 1;
  // THE ARM IS THE HEALTH.
  oneof health {
    SessionMcpServerConnected connected = 2;
    SessionMcpServerFailed failed = 3;
    // The server is reachable but REFUSES TO SERVE UNTIL SOMEONE
    // AUTHENTICATES. User-actionable, and the only health here that is: drawn
    // as a failure it looks like nothing can be done, when in fact one thing
    // can.
    SessionMcpServerNeedsAuth needs_auth = 4;
    // The server has not finished connecting. Neither healthy nor broken —
    // drawing it as either is a claim the producer has not made.
    SessionMcpServerPending pending = 5;
    // The server is configured but switched off, so it was never attempted.
    SessionMcpServerDisabled disabled = 6;
  }
}

// The server needs someone to authenticate before it will serve.
message SessionMcpServerNeedsAuth {}

// The server has not finished connecting.
message SessionMcpServerPending {}

// The server is configured but switched off.
message SessionMcpServerDisabled {}

// The server is connected.
message SessionMcpServerConnected {}

// The server failed to connect or dropped.
message SessionMcpServerFailed {
  // The error, verbatim.
  string error = 1;
}

// What the account's allowance looked like when sampled. LIVE, whenever the
// shim observes it — not pinned to a turn boundary.
message SessionAccountUsage {
  // When it was sampled, in unix millis.
  int64 observed_at_ms = 1;
  // The vendor's subscription word, verbatim; its vocabulary is not in
  // evidence.
  string subscription_type = 2;
  // THE ARM IS WHETHER A FIGURE WAS READ.
  oneof outcome {
    SessionAccountUsageAvailable available = 3;
    SessionAccountUsageUnavailable unavailable = 4;
  }
}

// A figure was read.
message SessionAccountUsageAvailable {
  // The rolling five-hour window.
  SessionUsageWindow five_hour = 1;

  // THE LONGER WINDOWS, each UNSET when the account has no such allowance or
  // the vendor reported none for it.
  //
  // SEPARATE FIELDS RATHER THAN A LIST, because a consumer draws a NAMED
  // window ("weekly", "weekly on Opus") and a list keyed by a vendor string
  // would put the naming back in the consumer's hands. A window the vendor
  // adds later is a compiler-surfaced gap rather than an entry silently
  // dropped.
  //
  // The rolling seven-day allowance across everything.
  optional SessionUsageWindow seven_day = 2;
  // The rolling seven-day allowance for OAuth-app traffic, which is metered
  // apart from the account's own.
  optional SessionUsageWindow seven_day_oauth_apps = 3;
  // The rolling seven-day allowance for the Opus model family. EXHAUSTIBLE ON
  // ITS OWN: this can run out while the overall weekly window has room, which
  // is otherwise a refusal with no visible cause.
  optional SessionUsageWindow seven_day_opus = 4;
  // The rolling seven-day allowance for the Sonnet model family.
  optional SessionUsageWindow seven_day_sonnet = 5;

  // Allowances scoped to one model each, for models the vendor meters
  // individually. Empty when it meters none that way.
  repeated SessionModelUsageWindow model_scoped = 6;
}

// One allowance window that applies to a single model.
message SessionModelUsageWindow {
  // Which model the window meters.
  AgentModel model = 1;
  // The window's figures.
  SessionUsageWindow window = 2;
}

// One allowance window's figures.
message SessionUsageWindow {
  // How much of the window is used, 0–100.
  double utilization_percent = 1;
  // When the window resets, in unix millis.
  int64 resets_at_ms = 2;
}

// Why no figure could be read. THE ARM IS THE REASON.
message SessionAccountUsageUnavailable {
  oneof reason {
    // The usage service did not answer.
    SessionUsageServiceUnavailable service_unavailable = 1;
    // The service answered without a five-hour window.
    SessionUsageWindowUnavailable window_unavailable = 2;
    // The window carried no utilization figure.
    SessionUsageUtilizationUnavailable utilization_unavailable = 3;
    // The shim's own sampling failed.
    SessionUsageSamplingFailure sampling_failure = 4;
  }
}

// The usage service did not answer.
message SessionUsageServiceUnavailable {}
// The service answered without a five-hour window.
message SessionUsageWindowUnavailable {}
// The window carried no utilization figure.
message SessionUsageUtilizationUnavailable {}
// The shim's own sampling failed.
message SessionUsageSamplingFailure {
  // The cause, verbatim.
  string cause = 1;
}

// ---- The shim's own health: PULLED by the daemon, never pushed ----

// The shim's account of its own health at the instant it was asked. A
// SYNTHETIC fact — the shim reporting on itself at the daemon's cadence —
// which is why it is pulled rather than mixed into the standing stream of
// upstream happenings.
message SessionDiagnostics {
  // THE ARM IS THE VERDICT. Unhealthy is an ANSWER, never a failure of the
  // call that asked.
  oneof health {
    SessionHealthy healthy = 1;
    SessionUnhealthy unhealthy = 2;
  }
  // Every degraded window the shim has recorded since it started, open or
  // closed, oldest first. Kept so a daemon that asks after the fact still
  // learns what was lost.
  repeated SessionDegradedWindow degraded_windows = 3;
}

// Nothing is wrong with the shim itself.
message SessionHealthy {}

// Something is wrong with the shim itself.
message SessionUnhealthy {
  // Each fault standing now.
  repeated SessionFault faults = 1;
}

// One fault of the shim's own.
message SessionFault {
  // Which part of the shim (its store client, its converter, its sidecar
  // link, …).
  string component = 1;
  // The fault, for a human and for logs. A `kind` oneof is added WITH its
  // first derived arms at the wave, from the shim's real fault sites.
  string detail = 2;
}

// A window during which one component of the shim was degraded. THE ARM IS
// WHETHER IT HAS CLOSED, and only a closed window knows what was lost.
message SessionDegradedWindow {
  // Which part of the shim.
  string component = 1;
  // Why it degraded, as the shim stated when the window opened.
  string reason = 2;
  // When the window opened, in unix millis.
  int64 began_at_ms = 3;
  oneof extent {
    // Still degraded.
    SessionDegradedOpen open = 4;
    // Recovered.
    SessionDegradedClosed closed = 5;
  }
}

// The window is still open.
message SessionDegradedOpen {}

// The window closed.
message SessionDegradedClosed {
  // When it closed, in unix millis.
  int64 ended_at_ms = 1;
  // How many observations the component dropped while degraded — records
  // that never reached the store, frames never sent.
  uint64 dropped_count = 2;
}

// ---- Killing ----

// The session was killed. THE ARM IS HOW: idle, or by force over live work.
message SessionKilled {
  oneof how {
    // Nothing was live; the query ended cleanly.
    SessionKilledIdle idle = 1;
    // Live work was killed with it — the turn if one was open, and EVERY
    // live task, whichever turn spawned it. Names what died, so the consumer
    // can conclude the elements it was drawing for them.
    SessionKilledForced forced = 2;
  }
}

// Killed with nothing live.
message SessionKilledIdle {}

// Killed by force.
message SessionKilledForced {
  // The turn that was interrupted, if one was in flight.
  optional TurnId interrupted_turn = 1;
  // Every detached item that was stopped.
  repeated DetachedWorkId stopped_work = 2;
}

// The session could not be killed because work is live and force was not
// asked. Names the work, so the consumer can stop it itself or ask for force.
message SessionLive {
  // The turn in flight, if one is.
  optional TurnId turn_in_flight = 1;
  // Every detached item live now.
  repeated DetachedWorkId live_work = 2;
}
