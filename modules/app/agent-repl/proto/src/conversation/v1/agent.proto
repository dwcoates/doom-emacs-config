// agent.proto — WHAT AN AGENT'S STREAM SAYS: growth, or one of the two ways it
// ends. Agnostic between the main agent (whose stream is the turn) and a
// detached subagent (whose stream is its own): one vocabulary, one handler.
// AgentFrame is the frame itself, wrapped whole by every stream that carries an
// agent; AgentAnswer is what a consumer writes back when the agent is blocked.

syntax = "proto3";

package conversation.v1;

import "conversation/v1/agent_activity.proto";
import "conversation/v1/api.proto";
import "conversation/v1/detached_work.proto";
import "conversation/v1/permission.proto";
import "conversation/v1/question.proto";
import "conversation/v1/user.proto";
import "conversation/v1/workflow.proto";

option go_package = "agentrepl/proto/conversation/v1;conversationv1";

// One frame of an agent's bounded stream. THE ARM IS WHAT THE STREAM IS
// SAYING: growth, or one of the two ways it ends. A stream that ends WITHOUT a
// terminal arm is a TRANSPORT FAILURE and is read as one — never as the agent
// concluding. Declared once so the turn's stream and a detached subagent's
// stream are one shape and one handler.
message AgentFrame {
  // WHICH AGENT this frame is about: the main-thread agent, or a subagent at
  // any depth. FRAMES ARE FLAT AND THIS IS THE WHOLE OF THEIR ATTRIBUTION — a
  // subagent's work is never nested inside its spawn; it arrives as frames
  // carrying its own identity, on whichever stream carries it (the spawning
  // turn's for an awaited spawn, its own for a detached one, the run's for a
  // workflow's agent). A consumer routes by this value alone, into whatever it
  // drew when it saw the agent's creation; nothing on the wire carries
  // ancestry, because placement comes from the request when history is read
  // and from the consumer's own drawn structure when frames arrive live.
  AgentId agent_id = 4;
  // THE ARM IS BOTH the consumer's obligation and the datalayer's route.
  oneof result {
    // Conversation content: the agent did something, or is blocked on the
    // user. The consumer reads or writes back; the store lands it as a page
    // line of this agent's book.
    AgentUpdate update = 1;
    // The agent ended on terms the consumer asked for. Lands BOTH as a page
    // line (the feed's stop notice has no other source) and as the agent's
    // terminal state.
    AgentSuccess success = 2;
    // The agent ended because something broke. Lands as success does.
    AgentFailure failure = 3;
    // Work left this agent's stream for a life of its own. The consumer opens
    // the connection its handle names; the store lands it in the lifecycle
    // record for its kind, never as a page line — the spawning CALL is
    // already one.
    AgentDetachedWork detached_work = 5;
  }
}

// What a consumer can SAY to a live agent. ONE type for the main agent and a
// detached subagent alike: the requests that carry it differ only in the
// address. How each arm is DELIVERED is the producer's business per kind —
// a prompt to a busy agent may be injected at its next tool round, a prompt
// to a finished agent resumes it as a new run — and the consumer never
// learns which mechanism was used.
message AgentInput {
  oneof input {
    // Stop it. Its stream then concludes with AgentSuccess.interrupted once
    // the agent binary acknowledges; the carrying call returns before that.
    AgentStop stop = 1;
    // Answer a question or decide a permission it is blocked on.
    AgentAnswer answer = 2;
    // A prompt addressed to an EXISTING agent — a subagent, a workflow's
    // agent. The producer decides HOW it lands per kind (a steer to a live
    // one, a resume to a finished one), and the caller never learns which.
    // The session's own turns are never spoken this way: they are StartTurn.
    UserSaid prompt = 3;
  }
}

// A user-commanded stop. Carries nothing: the target is the addressed agent
// and the reason is always the user.
message AgentStop {}

// What a consumer WRITES BACK to an agent that is blocked: the counterpart of
// AgentUpdate's two blocking arms, one answer each. Declared once so every
// write rpc — to the turn, to a detached subagent, to a workflow's agent —
// carries the same shape.
message AgentAnswer {
  oneof answer {
    // The user's choices for an open question.
    AgentQuestionAnswer question_answer = 1;
    // The user's decision on an open permission.
    AgentPermissionDecision permission_decision = 2;
  }
}

// Something a running agent has to say. The arm states WHAT THE CONSUMER MUST
// DO with it: pipe it back on this agent's own stream, or open a stream of its
// own for it.
message AgentUpdate {
  // THE ARM IS THE CONSUMER'S OBLIGATION. Activity is read-only — it happened
  // and nothing is owed. A question and a permission both BLOCK the agent
  // until the user writes back on the update channel, and differ in what is
  // written: a choice, or consent. Every arm is conversation content and
  // lands as a page line. Tag 2 (detached_work) is RETIRED: leaving the
  // stream is a frame-level fact, stated on AgentFrame beside the terminal
  // arms.
  oneof update {
    // Work happening on this agent's stream. Everything about it arrives here,
    // and it cannot outlive the stream.
    AgentActivity activity = 1;
    // The agent is blocked on the user's CHOICE among options it posed.
    AgentQuestion question = 3;
    // The agent is blocked on the user's CONSENT to run a tool it called.
    AgentPermission permission = 4;
  }
}

// The agent's stream ended on terms the consumer asked for. THE ARM IS HOW —
// both are answers, never failures. For the main agent this is the instant
// the main thread can accept a prompt again.
message AgentSuccess {
  oneof outcome {
    // The agent finished on its own.
    AgentCompleted completed = 1;
    // A user-commanded stop was acknowledged by the agent binary and the agent
    // ended because of it. An ACCUSATION the producer must have evidence for:
    // only an acknowledged stop sets it.
    AgentInterrupted interrupted = 2;
  }
}

// The agent ran to its own end.
message AgentCompleted {
  // The response unit that is the agent's ANSWER — the last top-level prose it
  // produced — so a consumer marks it final without deriving finality from
  // position. UNSET when no prose was produced at all (a refusal with empty
  // content, a token ceiling hit before anything was said); absence is not an
  // error.
  optional AgentActivityId answer = 1;
}

// The agent was stopped at the user's command. Units open when the stop landed
// have ALREADY received their own failure frames on this stream; nothing about
// them is restated here.
message AgentInterrupted {}

// The agent's stream ended because something broke. Every arm is a fact the
// producer OBSERVED; a stream that merely stops sending is a transport failure
// and is never reported as one of these.
message AgentFailure {
  oneof failure {
    // The vendor API refused or failed a request and RECORDED that it did, so
    // the agent could not continue. The vendor's own error taxonomy, imported
    // whole from api.proto.
    ApiRequestFailed api_request_failed = 1;
    // Further arms DERIVED from the shim's real failure sites at the wave (the
    // vendor ending the query on its own terms, the agent binary dying).
  }
}

// ---- The workflow run's frame: the one unit that contains agents ----

// ALWAYS DETACHED. The producer's launch answer reports only that a run started,
// never that one finished, and there is no option asking for a blocking run — so
// a workflow's frames arrive on the run's OWN stream and never on the stream of
// the turn that launched it.
//
// THIS UNIT IS THE ONLY ONE THAT CONTAINS OTHER UNITS, and that is deliberate
// rather than a leak: a workflow is the only kind of work that is a PROGRAM
// rather than an action, so its progress simply IS the work of the agents its
// script spawned. Those agents arrive inside the update arm below, each carrying
// its own identity, at any depth and flat — a workflow agent that spawns an agent
// of its own arrives the same way, so nothing anywhere maintains a lineage.
message AgentWorkflow {
  // Where the run stands. Expect one start, then any number of updates, then one
  // terminal arm.
  oneof result {
    // This stream is now carrying this run.
    AgentWorkflowStart start = 1;
    // Work its agents have done since the last frame.
    AgentWorkflowUpdate update = 2;
    // The run finished.
    AgentWorkflowSuccess success = 3;
    // The run could not be launched, or ended without finishing.
    AgentWorkflowFailure failure = 4;
  }
}

// A STATELESS LEVEL, replace semantics: every frame carries ALL of the run's
// top-level subagents, and a consumer swaps its picture for the payload. A
// late or restarted watcher is whole after one frame; nothing is paged,
// because a run is small by nature and this contract deliberately supports
// no workflow history. The run's stream says nothing about what its agents
// DO — the daemon opens an ordinary per-agent connection for each, exactly
// as for any subagent.
message AgentWorkflowUpdate {
  // Every top-level agent the script has spawned, in spawn order.
  repeated AgentWorkflowSubagent all_subagents = 1;
}

// One of the run's agents: its spawn description, and whether it is live.
message AgentWorkflowSubagent {
  // The spawn as announced — carries the created agent's identity, which is
  // what the daemon watches.
  AgentSubagentStart agent_start = 1;
  // Whether the agent is still running. THE ARM IS THE LIVENESS.
  oneof liveness {
    AgentWorkflowSubagentLive live = 2;
    AgentWorkflowSubagentEnded ended = 3;
  }
}

// The agent is running; its own stream is live.
message AgentWorkflowSubagentLive {}

// The agent has ended; its own stream carried how.
message AgentWorkflowSubagentEnded {}

// The run ended on terms the consumer asked for. THE ARM IS HOW — both are
// answers, never failures.
message AgentWorkflowSuccess {
  oneof outcome {
    // The run finished on its own.
    AgentWorkflowCompleted completed = 1;
    // A user-commanded stop was acknowledged and the run ended because of it.
    // Agents live when the stop landed have already received their own
    // terminal frames in this stream.
    AgentWorkflowInterrupted interrupted = 2;
  }
}

// The run finished on its own.
message AgentWorkflowCompleted {
  // What the run reported at the end, when it reported anything. UNSET when it
  // finished without a summary, which is not a failure.
  optional AgentWorkflowSummary summary = 1;
}

// The run was stopped at the user's command.
message AgentWorkflowInterrupted {}

// The run could not be launched, or ended without finishing.
message AgentWorkflowFailure {
  // Why it failed. Two arms because the first is structurally distinguishable
  // rather than inferred: the producer reports a rejected script separately from
  // anything that can happen once a run has begun.
  oneof cause {
    // The script did not compile and the run never started. The message is
    // carried because the author's next action is to fix the script and this is
    // the only account of what was wrong with it.
    AgentWorkflowScriptRejected script_rejected = 1;
    // The run started and ended without finishing. Arms are DERIVED from the
    // producer's real sites at the implementation wave; empty until then.
    AgentWorkflowRunEnded run_ended = 2;
  }
}

// The script did not compile and the run never started.
message AgentWorkflowScriptRejected {
  // What the producer said was wrong with it, verbatim.
  string error = 1;
}

// The run started and ended without finishing. Arms are DERIVED from the
// producer's real sites at the implementation wave; empty until then.
message AgentWorkflowRunEnded {}
