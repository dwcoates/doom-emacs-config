// message.proto — records that BELONG to a conversation message: the record,
// its identity, and what a record can say. The BODIES of what it says live one
// file per concern — tool_call.proto, agent.proto, user.proto,
// context_cut.proto, api.proto, detached_work.proto — and the blocks those
// bodies are made of in content_blocks.proto.
//
// The unit a page counts is a message, not a record. Several records share one
// message_id and fold, in seq order, into the single thing the feed draws.

syntax = "proto3";

package conversation.v1;

import "conversation/v1/agent.proto";
import "conversation/v1/context_cut.proto";
import "conversation/v1/detached_work.proto";
import "conversation/v1/api.proto";
import "conversation/v1/tool_call.proto";
import "conversation/v1/user.proto";

option go_package = "agentrepl/proto/conversation/v1;conversationv1";

// The identity of a message, minted by the producing plane.
//
// A TYPE, not a bare string, so that every field on every surface that holds
// a message identity is typed as one: a `string message_id` can be assigned
// any string at all, a MessageId can only be assigned a MessageId. This is the
// canonical form; no surface re-spells it as a scalar (the "identity" form of
// re-spelling).
message MessageId {
  // The producer-minted identity, opaque to every reader. Never empty. Both
  // planes (stream and file) derive it from the same vendor value, which is
  // what lets a preview be replaced by the settled message it previewed.
  string value = 1;
}

// One record BELONGING to one message. Several of these share a message_id
// and fold, in the seq order their carrying envelope states, into the single
// thing the feed draws. THE IDS ARE THE SAME ON EVERY RECORD, whatever its
// payload does with the message: "opens", "updates" and "composes" are three
// payloads, not three record shapes.
message MessageEntry {
  // The message this record belongs to. Records sharing it fold together, so a
  // consumer needs no correlation pass to attach an update to what it updates.
  MessageId message_id = 1;

  // The message immediately containing this one.
  //
  // UNSET means this message sits directly in the feed. Absence is the fact
  // itself: a message whose parent could not be resolved is a producer fault,
  // never an unset pointer. Message-typed, so presence is native and an empty
  // identity is unrepresentable rather than merely invalid.
  //
  // ONE HOP, NEVER THE ROOT. The feed row a nested message ultimately belongs
  // to is not on the wire: the store derives it by walking this pointer once at
  // ingest and indexes it itself. See shim/v1/message-page.proto.
  MessageId parent_message_id = 2;

  // What this record says about the message it belongs to.
  MessagePayload payload = 3;
}

// WHAT A RECORD CAN SAY, as a type rather than as a oneof buried in
// MessageEntry.
//
// A `oneof` IS NOT A TYPE and cannot be imported: proto3 offers no way to name
// `MessageEntry.payload` from another file. That left any surface needing the
// same payload vocabulary with different stamps exactly two options — import
// MessageEntry whole, inheriting identity and ordering stamps it wanted to set
// itself, or write the arms out again. Writing them out again is the mechanical
// origin of every agent-output re-spelling on frontend.v1, and this extraction
// is what removes the pressure that produced them.
//
// It is PURE ENABLEMENT. MessageEntry embeds this and keeps exactly the
// semantics it had; nothing about a durable record's meaning moves with the
// arms, and the extraction commits to nothing about what any other surface
// chooses to carry.
message MessagePayload {
  // The three groups below are a reading aid, not a schema distinction: every
  // arm is carried by a record with the same ids, so the group an arm sits in
  // changes nothing about the record.
  oneof payload {
    // ---- Records that OPEN the message they name ----

    // Something a person typed. The opening of a turn.
    UserSaid user_said = 1;

    // Something the agent said: its content blocks, and the usage its response
    // reported.
    AgentSaid agent_said = 2;

    // A permission the agent ASKED FOR. It is a message because the agent
    // really did ask and the user really does answer — it is a conversational
    // act, not a dialog the daemon invented.
    PermissionAsked permission_asked = 3;

    // Something went wrong, stated as a card the user reads and acts on.
    FailureRaised failure_raised = 4;

    // The conversation was CUT here. It is a message because a reader must see
    // where, rather than merely finding the history shorter than they left it.
    ContextCut context_cut = 5;

    // Work that DETACHED from the turn and now runs alongside it — a subagent,
    // a background shell, a workflow. It is a feed row naming itself, so a page
    // of ten rows is ten bounded things rather than ten trees.
    DetachedWorkStarted detached_work_started = 6;

    // ---- Records that UPDATE a message already opened ----
    // They carry the same message_id, so attaching them needs no correlation
    // and costs no additional page slot.

    // Output accumulating into detached work already open.
    DetachedWorkProgressed detached_work_progressed = 7;

    // A journal step observed in detached workflow work already open. It
    // carries the message_id of the detached work it belongs to, exactly as
    // detached_work_progressed does, so it folds onto that card without
    // correlation. Structured rather than folded into the progress string,
    // because the producer read it structured.
    WorkflowStepObserved workflow_step_observed = 8;

    // Detached work reached an end, with the outcome it reached.
    DetachedWorkEnded detached_work_ended = 9;

    // The user answered a permission the agent asked for.
    PermissionAnswered permission_answered = 10;

    // A tool the agent called returned. It carries the message_id of the
    // message that MADE the call, so the result folds onto that tool card.
    //
    // The vendor files tool results under user-role records, which is the
    // accident this arm exists to not inherit: the message this record updates
    // is the agent's response, whoever the vendor filed the result under.
    ToolReturned tool_returned = 11;

    // A skill file's contents, resolved onto the skill's own message. Replaces
    // whole rather than appending.
    SkillBodyResolved skill_body_resolved = 12;

    // ---- Records that COMPOSE a message, arriving before it is whole ----

    // A fragment of content still arriving, handed straight to the daemon by
    // the stream plane. The completed message the file plane writes later
    // REPLACES the preview rather than appending beside it.
    ContentArriving content_arriving = 13;
  }
}
