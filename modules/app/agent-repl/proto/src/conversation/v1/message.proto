// There's work the agent streams back in real time (responses and whatnot),
// there's detached work (background bash call, subagent, etc) that requires
// subsequent connections along which to stream the responses OUTSIDE of the
// context of the turn, and there's NOT detached work, that inherently happens
// exclusively during the course of the turn, but ALSO to which we want to
// stream the results of to the corresponding bullet. An example: Skill *always*
// and *inherently* corresponds to the given turn -- it cannot be detached --
// BUT, we want to stream back various messages that correspond tot he skill
// invokation (one fo the invocation itself, one afterwards that contains the
// read contents of the skill, and potentially more i'm not aware of, and the
// former should result in the rendering of the teal-background bubble, and the
// latter should be used to populate the bubble when it arrives. So, it's
// happening IN that turn, but across MULTIPLE updates along the connection).
// And this is true for a lot of stuff (Bash calls will also stream back
// results, as will read calls potentially. so i'm wondering how these are being
// ORGANIZED in the protobuf (those messages that have the potential to have
// updates subsequently streamed along the connection that are SPECIFIC to them
// should be grouped into a single message along which the idenficiation for
// that element should be attached. This is the reason for TurnProgress.progress_item_id)


messgge TurnResponse { // eh, whatever the correct name for this is
    oneof response {
        TurnUpdate update = 1;
        TurnSuccess success = 2;
        TurnFailure failure = 2;
    }
}

message TurnUpdate {
    oneof update {
        TurnProgress update = 1; // no new connection is needed with the shim, just pipe the data back
        TurnDetachedWork detached_work = 1; // new connection is needed with the shim, don't pipe any data back, make the connection, and let it handle the data piping back to frontend
    }
}

message TurnProgress {
    TurnUpdateId progress_item_id = 1; // if an item has more progress in the future, it neesd to have its corresponding UI element updated, and thus an id is needed
    TokenUsage token_usage_update = 2;
    oneof progress_item {
        // note below the distinction between thinking and resopnse. let's verify that this jives with the actual data being used to render in the UI. I might be getting mixed up on thinking vs response
        TurnAgentThinking thinking = 3;   // the NON-GREEN-BORDER purbple bubbles
        TurnAgentResponse response = 4;   // the GREEN-BORDER purple bubble
        TurnAgentQuestion question = 5; // when the agent wants to ask a question via AskUserQuestion toolcall
        TurnAgentSkillUse skill_use = 6; // also inherently confined to a turn -- a subagent doing a skill call would have it confined to THEIR turn
        TurnAgentRead read = 4;
        TurnAgentWrite write = 5;
        TurnAgentEdit edit = 6;
        TurnAgentGrep grep = 7;
        TurnAgentBash bash = 1;        
        TurnAgentAgentCreate agent = 2;
    }
}

message TurnDetachedWork {
    // both of these are the sole things in TurnProgress.agent_update that can be realisitically detached (let's see if we can thing of more)
    // we probably need to work out what the UI reflection is of this (e.g., detached agent is subagent in the expanded footer, but wahat about detached bash? That should probably be a row in the expanded footer too, but we probably also dont want to intermix agent and bash, so many a tab selection scheme for the extended footer is worthwhile, such that the user can view bash and agent as separate tabs to list the memebers in the expanded footer)
    oneof detached_work {
        TurnAgentBash bash = 1;        
        TurnAgentAgentCreate agent = 2;
    }
}

message TurnId {
    string id = 1;
}
