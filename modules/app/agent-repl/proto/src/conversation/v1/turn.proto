// turn.proto — THE IDENTITY OF A TURN, shared vocabulary.
//
// A vocabulary every surface reads: an agentrepl.v1 submission is answered
// with one, the daemon holds a prompt under one, the shim's turn bookkeeping
// names one, EVERY history entry produced within a turn carries it
// (HistoryEntryAt.turn), and the daemon stamps the feed rows a turn produced
// with one. A vocabulary every
// surface reads lives in the leaf every surface may import (the same argument
// that put SessionCommand here).

syntax = "proto3";

package conversation.v1;

import "conversation/v1/agent_activity.proto";
import "conversation/v1/prompt_origin.proto";
import "conversation/v1/detached_work.proto";
import "conversation/v1/user.proto";

option go_package = "agentrepl/proto/conversation/v1;conversationv1";

// The identity of a turn.
//
// MINTED BY THE DAEMON, never by a client: the daemon decides when a
// submission becomes a turn, drives turns of its own (a cache keep-alive ping,
// a merge), and forwards the id to the shim as its turn id. A client learns a
// turn's id from the response to the request that opened it and from the
// views the daemon pushes; it never invents one. Opaque to every reader,
// never parsed; equality is the only question asked of it.
message TurnId {
  // The daemon-minted identifier. Treat as an opaque token: compare it for
  // equality, echo it back unchanged, and never parse or construct one.
  string value = 1;
}

// A prompt AS DELIVERED to an agent — the one canonical form of "the user
// said this to that agent", returned by the rpc that delivered it, persisted
// by the store, and replayed by history. The same message in all three places
// so nothing is reconciled: the client draws the row under `id` at
// submission, the shim adopts `id` on delivery, and the record that comes back
// is this.
message AgentPrompt {
  // The prompt's identity, daemon-minted at submission and adopted by the shim.
  TurnId id = 1;
  // The agent the prompt was delivered to — the main agent for a turn, a
  // subagent or a workflow agent when addressed directly. Never unset: a
  // prompt always has exactly one recipient.
  AgentId agent = 2;
  // What was said.
  UserSaid said = 3;
  // Why this turn exists — the closed attribution vocabulary, persisted
  // with the prompt so REPLAY can route merge-born rows and label
  // restart re-drives instead of drawing them as fresh user turns.
  PromptOrigin origin = 4;
  // THE TURN THIS PROMPT JOINED, when the vendor folded it into a running
  // turn at a tool boundary (shim.v1.StartTurnRequest.join_running_turn).
  // Such a prompt opens no turn of its own and never gets a terminal: what
  // the agent does about it is the named turn's. UNSET for every prompt that
  // opened its own turn.
  optional TurnId folded_into = 5;
}

// The turn was killed. THE ARM IS HOW.
message TurnKilled {
  oneof how {
    // Only the main agent was interrupted: nothing it spawned was live, or
    // the kill was not forced and what it spawned runs on.
    TurnKilledAgentOnly agent_only = 1;
    // Work this turn spawned was killed with it. Names what died.
    TurnKilledForced forced = 2;
  }
}

// Only the main agent was interrupted.
message TurnKilledAgentOnly {}

// Spawned work was killed with the turn.
message TurnKilledForced {
  // Every detached item this turn spawned, transitively, that was stopped.
  // PRODUCER NOTE: named from the shim's own live-work tracking at the moment
  // of the kill; the vendor's kill record carries no ids.
  repeated DetachedWorkId stopped_work = 1;
}

// The turn could not be killed without force: work it spawned is live.
// NOT PRODUCED since 2026-09-23 (see shim.v1 KillTurnFailure.live).
message TurnLive {
  // Every detached item this turn spawned, transitively, that is live now.
  // PRODUCER NOTE: filled from the shim's OWN live-work tracking — the set of
  // open detached-work streams — never from any vendor record (the vendor's
  // signals carry counts, not ids).
  repeated DetachedWorkId live_work = 1;
}
