// turn.proto — THE IDENTITY OF A TURN, shared vocabulary.
//
// Not a record fact — no MessageEntry carries it — but a vocabulary every
// surface reads: an agentrepl.v1 submission is answered with one, the daemon
// holds a prompt under one, the shim's turn bookkeeping names one, and the
// daemon stamps the feed rows a turn produced with one. A vocabulary every
// surface reads lives in the leaf every surface may import (the same argument
// that put SessionCommand here).

syntax = "proto3";

package conversation.v1;

import "conversation/v1/api.proto";

option go_package = "agentrepl/proto/conversation/v1;conversationv1";

// The identity of a turn.
//
// MINTED BY THE DAEMON, never by a client: the daemon decides when a
// submission becomes a turn, drives turns of its own (a cache keep-alive ping,
// a merge), and forwards the id to the shim as its turn id. A client learns a
// turn's id from the response to the request that opened it and from the
// views the daemon pushes; it never invents one. Opaque to every reader,
// never parsed; equality is the only question asked of it.
message TurnId {
  string value = 1;
}

// ==========================================================================
// WHAT A RUNNING TURN SAYS. The update model of the conversation PROTOCOL:
// units identified per THING and upserted, never per arrival — a unit holds one
// identity from its first fragment to its last, and growth is a re-send of that
// unit. The faithful per-observation log is the datalayer's shape (store.v1),
// and the shim maps between them.
//
// The turn's TERMINAL frames are not here: a turn concludes on the stream that
// carries it, so its success and failure arms belong to that rpc's response in
// shim.v1, alongside the `update` arm that wraps this model.
// ==========================================================================

// Something a running turn has to say. The arm states WHAT THE CONSUMER MUST DO
// with it, which is the only distinction that matters at this level: pipe it
// back on the turn's own stream, or go open a stream of its own for it.
message TurnUpdate {
  oneof update {
    // Work happening WITHIN the turn. Everything about it arrives on the turn's
    // stream, and it cannot outlive the turn.
    TurnProgress progress = 1;
    // Work that now has a life of its own OUTSIDE the turn. Nothing further
    // about it arrives here; the consumer opens the stream named by its handle.
    TurnDetachedWork detached_work = 2;
  }
}

// One unit of in-turn work, at whatever state it has reached.
message TurnProgress {
  // WHICH unit this concerns, so a later update reaches the same one rather
  // than appearing as a new one. A unit is identified per THING: the agent's
  // reasoning and its prose are separate units, each holding its identity
  // across every fragment that composes it.
  TurnProgressItemId progress_item_id = 1;

  // WHAT KIND of work it is. Each kind carries its own state and its own
  // payload, so a field is never present for a kind it means nothing to — and
  // no accounting figure rides the envelope, where it would be meaningless for
  // a file read or a search.
  oneof progress_item {
    TurnAgentThinking thinking = 2;
    TurnAgentResponse response = 3;
    TurnAgentQuestion question = 4;
    TurnAgentSkillUse skill_use = 5;
    TurnAgentRead read = 6;
    TurnAgentWrite write = 7;
    TurnAgentEdit edit = 8;
    TurnAgentGrep grep = 9;
    TurnAgentGlob glob = 10;
    TurnAgentBash bash = 11;
    TurnAgentAgentCreate agent = 12;
    TurnAgentWorkflow workflow = 13;
    TurnAgentUnmodeled unmodeled = 14;
    TurnAgentSendMessage send_message = 15;
    TurnAgentTaskAct task_act = 16;
  }
}

// The identity of one unit of in-turn work. Opaque; equality is the only
// question asked of it.
message TurnProgressItemId {
  string value = 1;
}

// Work that has left the turn. It is announced HERE and nowhere else after
// this: the consumer opens the stream named by `work`, and everything the work
// produces from then on arrives there.
message TurnDetachedWork {
  // The handle the work is addressed by: the stream is opened under it, and a
  // stop is aimed at it. On the envelope rather than in either arm below,
  // because both arms have one and it is the same fact either way.
  DetachedWorkId work = 1;

  // HOW it came to be detached. The two are genuinely different situations for
  // a consumer: one continues an element it is already drawing, the other has
  // no element yet and must be told what the work IS.
  oneof origin {
    // It was already streaming progress in this turn and was then backgrounded.
    TurnDetachableWorkDetached detached = 2;
    // It never had an in-turn progress update: either it was created detached
    // outright, or the agent announced it with no originating call at all.
    TurnDetachableWorkCreated created = 3;
  }
}

// Work that was drawn as in-turn progress and has now left the turn. One
// identity spans the move, so the element already on screen continues rather
// than being replaced by a second one describing the same work.
message TurnDetachableWorkDetached {
  // The in-turn unit this work was, before it left.
  //
  // NO PAYLOAD BESIDE IT, deliberately: the consumer already received this
  // work's description as the progress unit named here, and restating it would
  // be a second copy able to disagree with the first.
  TurnProgressItemId detached_from_id = 1;
}

// Work that is detached from the moment the consumer hears of it, so nothing
// has described it yet.
message TurnDetachableWorkCreated {
  // What was created, since there is no earlier frame that says.
  TurnDetachableWork work_created = 1;
}

// The kinds of work that can exist detached from a turn. Deliberately a SMALL
// set, and deliberately its own type rather than a reuse of the in-turn kinds:
// a kind absent here cannot claim to be detached, which is what makes
// "reasoning ran in the background" unbuildable rather than merely wrong.
message TurnDetachableWork {
  oneof work {
    TurnAgentAgentCreate agent = 1;
    TurnAgentBash bash = 2;
  }
}

// The identity of one unit of detached work, and the handle a stop is aimed at.
// Opaque; equality is the only question asked of it.
message DetachedWorkId {
  string value = 1;
}

// ==========================================================================
// The task tracker. A task is inherently bound to the agent working it — there
// is no backgrounded form of it, unlike a shell call or a subagent spawn — so
// what travels is the ACT the agent performed, on whatever stream that agent is
// running on. A task created in one turn and completed from another (or from a
// detached agent that owns it) is one task, joined by its tracker identity.
// ==========================================================================

// One act the agent performed on the task tracker, drawn in the turn — or the
// detached stream — the acting agent was running on.
message TurnAgentTaskAct {
  // Which task the act concerned. The tracker's identity, not this turn's, so a
  // task edited from several turns remains one task.
  TurnAgentTaskId task = 1;

  // What the agent did. Stopping is not an arm here: it is a change whose
  // resulting status is `killed`, so there is one way to say it rather than two.
  oneof act {
    TurnAgentTaskCreated created = 2;
    TurnAgentTaskChanged changed = 3;
  }

  // Where the act left the task, resolved by the producer, so no consumer
  // replays a sequence of acts to learn what a task currently is.
  TurnAgentTaskState state = 4;
}

// The task did not exist before this act. The arm carries nothing: what the
// task now IS rides `state`, and a second copy here could disagree with it.
message TurnAgentTaskCreated {}

// The task existed and this act altered it. Carries nothing, for the same
// reason as above.
message TurnAgentTaskChanged {}

// A task as it stands after an act.
message TurnAgentTaskState {
  // The task's subject line.
  string subject = 1;
  // Its full description.
  string description = 2;

  // Which agent it is assigned to, when it is assigned to one. Unset for a task
  // the agent created for itself and has not handed off, which is the ordinary
  // case. Presence rather than an empty-string sentinel.
  optional string owner = 3;

  // Where it stands. Arms rather than an enum, so a status arrives with the
  // evidence it implies and a status the vendor adds later is a
  // compiler-surfaced gap rather than an unhandled value. The set is the
  // vendor's own rather than invented here.
  oneof status {
    TurnAgentTaskPending pending = 4;
    TurnAgentTaskRunning running = 5;
    TurnAgentTaskCompleted completed = 6;
    TurnAgentTaskFailed failed = 7;
    TurnAgentTaskKilled killed = 8;
    TurnAgentTaskPaused paused = 9;
  }
}

// Created, not started.
message TurnAgentTaskPending {}

// Being worked on now.
message TurnAgentTaskRunning {
  // The present-continuous phrasing to show while it runs ("running the
  // migration"), as the agent supplied it. It lives here because it means
  // nothing for a task that is not running. Unset when the agent gave none —
  // the tool's parameter is optional — and a consumer then shows the subject
  // rather than inventing a phrasing.
  optional string active_form = 1;
}

// Finished, having done what it said it would.
message TurnAgentTaskCompleted {}

// Finished, having failed to do it.
message TurnAgentTaskFailed {}

// Ended because something stopped it, rather than because it resolved either
// way.
message TurnAgentTaskKilled {}

// Started and suspended, expected to resume.
message TurnAgentTaskPaused {}

// The tracker's identity for one task. Opaque to every reader, never parsed;
// equality is the only question asked of it.
message TurnAgentTaskId {
  string value = 1;
}

// ==========================================================================
// The agent's own output: its reasoning, and what it says. Two kinds rather
// than one, because reasoning can be entirely absent from the transcript while
// a response never is — and because they are drawn in different places.
//
// Both are identified by TurnProgress.progress_item_id, never by a field of
// their own, so two blocks arriving at once cannot merge.
// ==========================================================================

// The agent's reasoning: its scratchpad on the way to an answer, not addressed
// to the user. Drawn as a disclosure that sits open while it runs and collapses
// once it settles.
message TurnAgentThinking {
  oneof result {
    TurnAgentThinkingUpdate update = 1;
    TurnAgentThinkingSuccess success = 2;
    TurnAgentThinkingFailure failure = 3;
  }
}

// Reasoning is arriving. The consumer draws a live indicator; whether it can
// draw any TEXT depends on the arm.
message TurnAgentThinkingUpdate {
  oneof reasoning {
    // Text is streaming, and is drawn as it arrives.
    TurnAgentThinkingText text = 1;
    // The model is reasoning and withholding the text — it emits the block and
    // a signature but no text at all. There is nothing to draw but a live
    // indicator, and nothing whatever once it settles.
    TurnAgentThinkingWithheld withheld = 2;
  }
}

// Reasoning finished; the disclosure collapses.
message TurnAgentThinkingSuccess {
  // The reasoning, whole. The same two arms as while arriving: a withheld block
  // settles withheld, and the consumer then draws nothing rather than an empty
  // card.
  oneof reasoning {
    TurnAgentThinkingText text = 1;
    TurnAgentThinkingWithheld withheld = 2;
  }
  // What the reasoning cost. Charged separately from the answer, which is why a
  // footer draws a thinking figure beside the input one.
  conversation.v1.TokenUsage token_usage = 3;
}

// Reasoning ended without finishing. Arms are DERIVED from the producer's real
// sites at the implementation wave; empty until then, because an invented arm
// is worse than an absent one.
message TurnAgentThinkingFailure {}

// The reasoning text as it stands. Plain text rather than markdown: it is drawn
// verbatim and monospace, as a scratchpad rather than as prose.
message TurnAgentThinkingText {
  string text = 1;
}

// The model is reasoning but says nothing about it.
message TurnAgentThinkingWithheld {}

// What the agent says to the user. One of these per text block the agent emits,
// so a turn holds SEVERAL: the commentary between tool calls and the answer at
// the end are the same kind of thing, differing only in what followed them.
//
// WHICH of them answered the turn is deliberately not stated here. A producer
// cannot know while writing one, since it depends on nothing further arriving;
// the turn's own conclusion names it.
message TurnAgentResponse {
  oneof result {
    TurnAgentResponseUpdate update = 1;
    TurnAgentResponseSuccess success = 2;
    TurnAgentResponseFailure failure = 3;
  }
}

// Prose is arriving; the bubble is visibly building.
message TurnAgentResponseUpdate {
  // Everything said SO FAR, not a delta. A consumer that missed a frame is
  // correct again after the next one, and nothing is accumulated client-side.
  TurnAgentResponseProse prose = 1;
  // The accounting as it stands. Input and cache figures are final from the
  // moment the message opens; the output figure is interim and is restated
  // later. Carried on the update because a footer draws a live token figure
  // during a turn rather than only after it.
  conversation.v1.TokenUsage token_usage = 2;
}

// The block finished; the bubble stops building.
message TurnAgentResponseSuccess {
  // What was said, whole.
  TurnAgentResponseProse prose = 1;
  // The settled accounting, replacing every interim figure this unit reported.
  // Per response rather than per turn, because a turn holds several and each is
  // its own request.
  conversation.v1.TokenUsage token_usage = 2;
}

// The block ended without completing.
message TurnAgentResponseFailure {
  // What had been said when it ended, carried because a truncated or refused
  // answer is still shown rather than discarded. May be empty — a refusal can
  // precede any text at all.
  TurnAgentResponseProse prose = 1;
  // What the attempt cost, since a response that failed was still charged.
  conversation.v1.TokenUsage token_usage = 2;
  // Why it ended. Arms are DERIVED from the producer's real sites at the wave.
  TurnAgentResponseFailureReason reason = 3;
}

// Why a response ended without completing. Empty until its arms are derived.
message TurnAgentResponseFailureReason {}

// Prose the agent said, as markdown for the consumer to render.
message TurnAgentResponseProse {
  string markdown = 1;
}

// ==========================================================================
// The plain file and search tools. None carries an update arm: a read, a write,
// an edit or a search either returns or fails, and nothing draws a partial one.
// ==========================================================================

// The agent read a file.
message TurnAgentRead {
  oneof result {
    TurnAgentReadSuccess success = 1;
    TurnAgentReadFailure failure = 2;
  }
}

// The file was read.
message TurnAgentReadSuccess {
  // Which file. One fact in one form, embedded by whoever draws it rather than
  // restated, and the value a highlighter's grammar is chosen from.
  ReadPath path = 1;

  // How much of the file came back. The set arm IS whether more exists, so a
  // whole read carries no truncation vocabulary and a short one cannot omit the
  // figure that makes it legible.
  oneof extent {
    TurnAgentReadWhole whole = 2;
    TurnAgentReadHead head = 3;
  }
}

// The file came back entire.
message TurnAgentReadWhole {
  // Everything the file holds.
  string contents = 1;
}

// The file was long, so only its leading portion came back.
message TurnAgentReadHead {
  // The leading portion, cut on a line boundary. A HEAD rather than a slice from
  // the middle, deliberately: a highlighter reading from offset zero has correct
  // context, while text beginning mid-string or mid-comment is mis-highlighted
  // until it happens to resync.
  string contents = 1;
  // What the whole file holds, so a consumer states "showing 200 of 4,312"
  // without arithmetic and without a second request.
  uint32 total_lines = 2;
}

// The read did not happen. Arms are DERIVED from the producer's real sites at
// the implementation wave; empty until then.
message TurnAgentReadFailure {}

// A path a file tool acted on.
message ReadPath {
  // The path as the tool resolved it.
  string path = 1;
}

// One hunk of a unified diff, as the producer's structured patch states it.
// Stated rather than computed: the producer diffs at the moment of the change,
// so context lines and line numbers describe the file as it actually was, and no
// consumer re-reads a file that a later change has already moved on from.
message FilePatchHunk {
  // Where the hunk sits in the file as it was.
  FilePatchHunkRange old_range = 1;
  // Where it sits in the file as it now is.
  FilePatchHunkRange new_range = 2;
  // The hunk's lines in unified-diff form, each carrying its own leading marker,
  // so context, additions and removals are ONE ordered sequence rather than
  // three lists a consumer has to interleave correctly to draw.
  repeated string lines = 3;
}

// A span of lines in one version of a file.
message FilePatchHunkRange {
  // First line of the span, one-based, so a card numbers its lines the way the
  // file does.
  uint32 start = 1;
  // How many lines the span covers.
  uint32 lines = 2;
}

// The agent wrote a file: handed over its whole new contents, creating it or
// replacing what was there. Distinct from an edit, which matches and replaces a
// string inside a file that must already contain it.
message TurnAgentWrite {
  oneof result {
    TurnAgentWriteSuccess success = 1;
    TurnAgentWriteFailure failure = 2;
  }
}

// The file was written.
message TurnAgentWriteSuccess {
  // Which file.
  ReadPath path = 1;

  // Whether the file existed beforehand. The producer's own distinction, so a
  // creation is never drawn as a rewrite of nothing.
  oneof outcome {
    TurnAgentWriteCreated created = 2;
    TurnAgentWriteUpdated updated = 3;
  }

  // What changed, as hunks. For a creation every line is an addition. The
  // producer diffs after the fact precisely so a card can show the CHANGE
  // rather than the whole file it was handed.
  repeated FilePatchHunk patch = 4;

  // Whether the user altered the proposed content at the permission gate before
  // accepting it. Carried because it is the only signal that what landed is not
  // what the agent proposed — a card drawing the agent's version when the user
  // changed it would be showing something that never happened.
  bool user_modified = 5;
}

// The file did not exist before this write.
message TurnAgentWriteCreated {}

// The file existed and its contents were replaced.
message TurnAgentWriteUpdated {}

// The write did not happen. Arms are DERIVED from the producer's real sites at
// the implementation wave; empty until then.
message TurnAgentWriteFailure {}

// The agent edited a file: replaced a matched string, which must have been
// present and (unless every occurrence was requested) unique.
message TurnAgentEdit {
  oneof result {
    TurnAgentEditSuccess success = 1;
    TurnAgentEditFailure failure = 2;
  }
}

// The edit applied.
message TurnAgentEditSuccess {
  // Which file.
  ReadPath path = 1;

  // What changed, as hunks — SEVERAL when every occurrence was replaced, so the
  // occurrence count is an observable rather than a flag the consumer must
  // reconcile against the hunks it was given.
  repeated FilePatchHunk patch = 2;

  // Whether the user altered the proposed edit at the permission gate before it
  // applied.
  bool user_modified = 3;
}

// The edit did not apply — the string was absent, or was not unique and every
// occurrence was not requested. Arms are DERIVED from the producer's real sites
// at the wave; empty until then.
message TurnAgentEditFailure {}

// ==========================================================================
// The search tools. Both answer with a list that may stop short of every match,
// and both state that fact as an arm rather than as two counts a consumer
// compares — so "was this truncated?" is read off the schema instead of derived.
// ==========================================================================

// The agent searched file CONTENTS for a pattern.
message TurnAgentGrep {
  oneof result {
    TurnAgentGrepSuccess success = 1;
    TurnAgentGrepFailure failure = 2;
  }
}

// The search ran. A search that matched nothing is a success with an empty
// answer, never a failure: the caller asked a question and got one.
message TurnAgentGrepSuccess {
  // WHICH SHAPE of answer this is, matching the shape the call asked for. The
  // three are genuinely different answers rather than three views of one, which
  // is why each carries only what applies to it: a count-mode search knows no
  // filenames, and a filenames-mode search knows no matching lines.
  oneof matches {
    TurnAgentGrepContent content = 1;
    TurnAgentGrepFiles files = 2;
    TurnAgentGrepCount count = 3;
  }
}

// The matching lines themselves.
message TurnAgentGrepContent {
  // The matching lines as the search rendered them, including whatever
  // line-number and context decoration the call requested. Rendered by the
  // search rather than reassembled here, so what a reader sees is what the
  // agent saw.
  string content = 1;

  // Whether these are ALL the matching lines. A search caps its own output on a
  // large tree, so a short answer is ordinary rather than exceptional; the set
  // arm says which case this is.
  oneof extent {
    TurnAgentGrepContentAll all = 2;
    TurnAgentGrepContentPartial partial = 3;
  }
}

// Every matching line is present.
message TurnAgentGrepContentAll {
  // How many matching lines there were — all of them shown.
  uint32 lines_returned = 1;
}

// The answer stops short of every matching line.
message TurnAgentGrepContentPartial {
  // How many matching lines are present here.
  uint32 lines_returned = 1;
  // How many matching lines were left out. The OMITTED figure rather than a
  // total, because that is what a reader is shown ("42 more not shown") and
  // because a total invites every consumer to subtract; the total is recoverable
  // by addition where anything needs it.
  uint32 lines_omitted = 2;
}

// Only the files that contained a match, without the matching lines.
message TurnAgentGrepFiles {
  // The matching paths, in the order the search returned them. That order is
  // the search's own and carries no ranking; a consumer that wants another
  // order sorts, and does not read meaning into this one.
  repeated string paths = 1;

  // Whether these are all the matching files.
  oneof extent {
    TurnAgentGrepFilesAll all = 2;
    TurnAgentGrepFilesPartial partial = 3;
  }
}

// Every matching file is present.
message TurnAgentGrepFilesAll {
  // How many files matched — all of them listed.
  uint32 files_returned = 1;
}

// The list stops short of every matching file.
message TurnAgentGrepFilesPartial {
  // How many files are listed here.
  uint32 files_returned = 1;
  // How many matching files were left out.
  uint32 files_omitted = 2;
}

// Only how many matches there were. No completeness arm: a count is either
// produced or the search failed, and a partial count would be a number with no
// stated meaning.
message TurnAgentGrepCount {
  // Total matches across every file searched.
  uint32 matches = 1;
}

// The search could not run. Arms are DERIVED from the producer's real sites at
// the implementation wave; empty until then.
message TurnAgentGrepFailure {}

// The agent matched file PATHS against a pattern.
message TurnAgentGlob {
  oneof result {
    TurnAgentGlobSuccess success = 1;
    TurnAgentGlobFailure failure = 2;
  }
}

// The match ran. Matching nothing is a success with an empty list.
message TurnAgentGlobSuccess {
  // The matching paths, in the order the search returned them.
  repeated string paths = 1;

  // Whether these are all the matching paths.
  oneof extent {
    TurnAgentGlobAll all = 2;
    TurnAgentGlobPartial partial = 3;
  }
}

// Every matching path is present.
message TurnAgentGlobAll {
  // How many paths matched — all of them listed.
  uint32 files_returned = 1;
}

// The list stops short of every matching path.
message TurnAgentGlobPartial {
  // How many paths are listed here.
  uint32 files_returned = 1;

  // How many were left out — and whether that figure can be trusted as exact.
  // The underlying search can cap its OWN counting, in which case the producer
  // knows only a floor. Stated as arms so a consumer never draws a floor as a
  // total: "42 more" and "at least 42 more" are different claims, and only one
  // of them is safe to make.
  oneof omitted {
    TurnAgentGlobOmittedExact exact = 2;
    TurnAgentGlobOmittedAtLeast at_least = 3;
  }
}

// The omitted figure is exact.
message TurnAgentGlobOmittedExact {
  // How many matching paths were left out.
  uint32 files_omitted = 1;
}

// The omitted figure is a lower bound, because the search stopped counting.
message TurnAgentGlobOmittedAtLeast {
  // At least this many matching paths were left out; there may be more.
  uint32 files_omitted_at_least = 1;
}

// The match could not run. Arms are DERIVED from the producer's real sites at
// the implementation wave; empty until then.
message TurnAgentGlobFailure {}
