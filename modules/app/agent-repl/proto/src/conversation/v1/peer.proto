// peer.proto — A MESSAGE FROM ANOTHER CLAUDE: an inter-session peer message or
// a subagent hand-back, delivered into this agent's conversation as a
// user-role record but authored by another agent rather than by a person.
//
// WHY IT IS NOT AN AgentPrompt. The vendor injects these as user-role records
// (`origin.kind == "peer"`, `handback` set for a subagent's return), so before
// this type they either drove a turn drawn as a person's "You" prompt (live)
// or vanished under the isMeta withhold (adopted). Neither is what they are:
// they are a low-priority, abbreviated aside from another agent, and this is
// the one canonical record of one — produced by the shim (live stream plane)
// and the sidecar (adopted file plane), persisted by the store, replayed by
// history, and drawn by the daemon as its own feed row.

syntax = "proto3";

package conversation.v1;

import "conversation/v1/agent_activity.proto";

option go_package = "agentrepl/proto/conversation/v1;conversationv1";

// A message another Claude session (a peer, or a returning subagent) sent into
// this agent's conversation.
message PeerMessage {
  // The agent whose conversation this message appears in — the recipient's
  // book. The main agent for a session; never unset, because the store routes
  // a record to a book by it exactly as it routes an AgentPrompt by its
  // recipient.
  AgentId agent = 1;
  // The display label naming the SENDER — the vendor's `origin.from`, or
  // `origin.senderTaskId` when `from` is absent. Drawn verbatim as the
  // collapsed bubble's label (e.g. "agent Explore"); it is the sender's own id
  // or name, not a person's.
  string sender = 2;
  // The message body, as markdown. Drawn only when the abbreviated bubble is
  // EXPANDED (the collapsed form shows the sender label and nothing else).
  // Preferred source is the vendor's `origin.body`; failing that, the record's
  // own text content (envelope and all).
  string body = 3;
  // A stable, opaque identity for this message: the vendor RECORD UUID, which
  // BOTH planes spell identically (the SDK streams the record and writes it to
  // the transcript under one uuid). The daemon mints the feed row's id from it,
  // so the live row and the adopted row for one message supersede each other on
  // ONE bubble rather than drawing two. Echoed, never parsed.
  string id = 4;
  // WHAT KIND OF MESSAGE this is, from the vendor's own marking of the record
  // (`origin.handback`). A consumer draws the two differently: an inter-session
  // message is an aside worth reading in place, while a hand-back's report is
  // the returning subagent's result and belongs with that subagent. UNSET when
  // the producer did not state the kind; a consumer treats it as an
  // inter-session message.
  oneof kind {
    // Another Claude session sent this agent a message.
    PeerMessageInterSession inter_session = 5;
    // A subagent this agent started handed its final report back.
    PeerMessageSubagentHandback subagent_handback = 6;
  }
}

// Another Claude session sent this agent a message.
//
// WHO SENT IT is stated as the vendor states it, never resolved: which of the
// host's sessions a pid belongs to is the consumer's fact (it holds every
// session's SessionVendorProcess level), not this conversation's.
message PeerMessageInterSession {
  // THE PROCESS THAT SENT IT, verified by the kernel. The vendor's own
  // contract is to key sender identity on this and never on the sender-written
  // `from` address. UNSET when the vendor could not verify a pid (a non-socket
  // ingress), never a wrong value. For relayed traffic the pid is the relay's.
  optional PeerMessageSenderProcess sender_process = 1;
  // The sending session's display name, as the sender asserted it (the
  // vendor's `origin.name`, e.g. "fix-flaky-3a"). It is what names a sender
  // that is none of the consumer's own sessions. UNSET when the vendor states
  // none (an older sender, or a wire that is not exactly one envelope).
  optional PeerMessageSenderSessionName sender_session_name = 2;
  // The vendor's id for this one delivery (its `origin.msg_id`), the same value
  // the sender's SendMessage result carries
  // (AgentSendMessagePeerSession.delivery_id). UNSET when the vendor states
  // none.
  optional PeerDeliveryId delivery_id = 3;
}

// The kernel-verified process a peer message came from.
message PeerMessageSenderProcess {
  // The pid of the process that connected to this session's messaging socket
  // (the vendor's `origin.verifiedPeerPid`). Never zero.
  uint32 verified_pid = 1;
  // When the message arrived, in Unix milliseconds on the host clock: the
  // record's own timestamp on the transcript, or the shim's receipt instant
  // on the live stream. A pid is recycled, so it names a process only for an
  // event at or after that process started (SessionVendorProcessRunning
  // .started_at_ms); this is the instant a consumer checks against.
  int64 received_at_ms = 2;
}

// The sender's asserted display name.
message PeerMessageSenderSessionName {
  // The name verbatim, as the vendor sanitized it. Never empty.
  string text = 1;
}

// A subagent this agent started handed its final report back. The report is
// this record's `body`; the same text is the subagent's own
// AgentSubagentHandback on its stream.
message PeerMessageSubagentHandback {}
