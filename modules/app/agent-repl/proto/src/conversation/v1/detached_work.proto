// detached_work.proto — DETACHED WORK: what detached, what it produced, and
// how it ended.

syntax = "proto3";

package conversation.v1;

import "conversation/v1/tool_call.proto";

option go_package = "agentrepl/proto/conversation/v1;conversationv1";

// Work that DETACHED from the turn and now runs alongside it — a subagent, a
// background shell, a workflow, a skill's own window.
//
// THE ORIGINATING CALL IS EMBEDDED WHOLE, and it is the whole description of
// what detached. Which KIND of work this is, is which `call` arm the origin
// carries — `bash` with run_in_background is a shell, `agent` a subagent,
// `workflow` a workflow, `skill` a skill, `unmodeled` a tool we do not model
// that nonetheless detached. There is no separate kind field: it would be a
// second spelling of the origin's arm, and the fields a kind used to carry
// (the shell's command, the skill's name and args, the unmodeled tool's name)
// are the origin's own fields, once. A card's label is resolved from the
// origin by the daemon (the agent's description, the shell's command, the
// skill's name), not stated here — a producer stating a label would be a
// third spelling.
//
// A WORKSPACE MERGE IS NOT DETACHED WORK. The daemon orchestrates a merge
// exclusively; the vendor has no knowledge of it and no agent detaches it. It
// is a daemon-synthesized feed item on frontend.v1 that COALESCES the vendor
// records produced while the merge ran, and the daemon decides which records
// those are. An earlier `merge` kind here was a leak of that synthesis into
// the record model, and it is gone.
message DetachedWorkStarted {
  // The tool call that spawned it, entire. Every detachment originates from
  // exactly one, and this is what draws the line from the card back to the
  // call — and what says what kind of work it is.
  ToolCallBlock origin = 1;
}

// Output accumulating into detached work already open. Shell output; a
// subagent's emissions arrive as MessageEntry records nested under the
// detached message on the parent chain, and a workflow's as
// WorkflowStepObserved.
message DetachedWorkProgressed {
  // Output since the last record, appended in seq order. A DELTA rather than
  // the whole spool, because the whole spool re-sent on every update is how a
  // long-running shell costs more to watch than to run.
  string output = 1;
}

// A journal step was OBSERVED in detached workflow work already open.
//
// ONE STEP AT A TIME, not a repeated field: the journal file grows and the
// producer reads the new step, exactly as DetachedWorkProgressed reads new
// output. A whole list re-sent per step is how watching a long workflow costs
// more than running it. It carries the message_id of the detached work it
// belongs to, so it folds onto that card without correlation.
message WorkflowStepObserved {
  // The step, as read out of the journal.
  WorkflowStep step = 1;
}

// One step of a workflow's journal, as the producer read it.
//
// STRUCTURED AT THE SOURCE. A journal file states a step's label, its detail
// and its status separately, so they are carried separately. The alternative
// — flattening them into DetachedWorkProgressed.output — forces every consumer
// to parse the structure back out of prose, and two consumers parsing the
// same prose is two chances to disagree about what a step said.
message WorkflowStep {
  // The step's name — the phase or agent it reports on — verbatim.
  string label = 1;
  // The step's detail line, verbatim: the result on success, the error text
  // on failure, the prompt while running.
  string detail = 2;
  // THE SET ARM IS THE STATE; there is no separate status value to fall out
  // of step with it.
  oneof status {
    WorkflowStepRunning running = 3;
    WorkflowStepDone done = 4;
    WorkflowStepFailed failed = 5;
  }
}

// The step is still executing.
message WorkflowStepRunning {}

// The step completed successfully.
message WorkflowStepDone {}

// The step failed. The failure text is the step's `detail`; this arm carries
// no second copy of it.
message WorkflowStepFailed {}

// A skill file's contents, delivered as the SKILL's own body.
//
// AN UPDATE, not part of DetachedWorkStarted, because the harness writes the
// body as a SEPARATE transcript record — a `user` line flagged isMeta — which
// the producer reads after the call that opened the work.
//
// IT REPLACES WHOLE rather than appending, unlike DetachedWorkProgressed. The
// body is delivered once, and a re-read overwrites with the same bytes
// instead of doubling them. It carries the SKILL MESSAGE's own message_id.
message SkillBodyResolved {
  // The skill file's contents, verbatim markdown. A skill IS a markdown
  // document, so it is carried and rendered as one.
  string body = 1;
}

// Detached work reached an end.
message DetachedWorkEnded {
  oneof outcome {
    DetachedSucceeded succeeded = 1;
    DetachedFailed failed = 2;
    // It was stopped on purpose.
    DetachedCancelled cancelled = 3;
    // We stopped hearing from it. DISTINCT from failure: we do not know that
    // it failed, only that we cannot see it any more.
    DetachedLost lost = 4;
  }
  // The exit status of the underlying process, for work that IS one — a
  // backgrounded shell, or unmodeled work the producer ran as a process.
  // UNSET for work that never had an exit status of its own (an agent, a
  // workflow), and that absence is the only reading of "this work did not
  // exit, it concluded".
  //
  // EVIDENCE, NEVER THE VERDICT. A killed process also exits nonzero, so the
  // exit status cannot decide the `outcome` arm and the `outcome` arm cannot
  // reconstruct the exit status. The two must never be derived from each
  // other. This field exists so a shell's card can show "exited 137" beside
  // the verdict rather than an unexplained red dot.
  DetachedProcessExit process_exit = 5;
}

// A process's exit status, exactly as the operating system reported it.
//
// A record of an OBSERVATION, which is why it lives here rather than with the
// consumer: a producer watched a process leave and read its status.
message DetachedProcessExit {
  // The exit code as the shell reports it. A signal-terminated process reports
  // the conventional 128+N form, because that is literally what its exit
  // status is. 0 is a real zero and always means clean exit.
  int32 code = 1;
}

// It finished and did what it was asked.
message DetachedSucceeded {
  // What it reported on the way out, for the card's collapsed line.
  string summary = 1;
}

// It finished and did not.
message DetachedFailed {
  // What went wrong, for the card's collapsed line.
  string summary = 1;
}

// Someone stopped it deliberately.
message DetachedCancelled {}

// We lost sight of it.
//
// A SEPARATE OUTCOME FROM FAILURE, deliberately. Folding it into failure would
// have this system assert something it did not observe: that the work died.
//
// HOW we concluded it is an arm, not a string: the three ways are a closed
// set, and "we watched it exit" must stay distinguishable from "we stopped
// hearing from it".
message DetachedLost {
  oneof how {
    // The file we were reading vanished.
    DetachedLostFileVanished file_vanished = 1;
    // It stopped producing anything for longer than we tolerate.
    DetachedLostWentSilent went_silent = 2;
    // A sweep found it gone with no end record.
    DetachedLostSweptUp swept_up = 3;
  }
}

// The file being read for this work vanished.
message DetachedLostFileVanished {}

// The work stopped producing anything for longer than tolerated.
message DetachedLostWentSilent {}

// A sweep found the work gone with no end record.
message DetachedLostSweptUp {}
