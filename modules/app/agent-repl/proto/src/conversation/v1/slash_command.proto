// slash_command.proto — SLASH COMMANDS: the closed set the agent binary answers
// ITSELF, the schema-carried facts about each one, and the DAEMON-SYNTHESIZED
// outcomes of the command family that reshapes context (/clear, /compact — and
// the binary's own automatic compaction, which is the same cut by another
// trigger).
//
// IT IS conversation.v1 BECAUSE EVERY OTHER SURFACE NEEDS IT AND IT NEEDS
// NONE OF THEM. It arrived in this tree in frontend.v1's slash-menu.proto,
// moved to agentrepl.v1 because a durable record names one of these and a
// stored conversation record cannot depend on the daemon's resolved output
// surface, and moves here for the same argument carried one step further: the
// feed draws one of these, the footer's composer completes one, an agentrepl
// refusal names the cut a queued prompt is stuck behind, and the daemon
// recognizes one before it forwards a prompt. A vocabulary four surfaces read
// belongs in the leaf every surface may import, which is this one. Anywhere
// else, one of those four reaches ACROSS the ownership scheme to get it — and
// that is precisely the import `frontend/v1/feed.proto` used to carry.
//
// The menu that RENDERS the set is a frontend concern; the set itself is not.

syntax = "proto3";

package conversation.v1;

import "conversation/v1/agent_activity.proto";
import "google/protobuf/descriptor.proto";

option go_package = "agentrepl/proto/conversation/v1;conversationv1";

// Everything about a session command that is a FACT rather than an event: how
// it is spelled, and whether text after the name belongs to it.
//
// Carried as an enum-value OPTION below rather than as traffic, because no
// frame carries these facts and every process needs the same answer to them —
// the daemon to recognize a submitted prompt, the webapp to complete and to
// label one. The three hand-written copies this replaces (the daemon's
// recognition table, the webapp's SESSION_COMMANDS list, the webapp's
// SESSION_COMMAND_LABELS table) had nothing comparing them, so they drifted:
// each was correct on its own and none of them agreed.
message SessionCommandSpec {
  // The command as the user TYPES it, leading slash included — and also the
  // form a reader is shown. One field for both so a corrected spelling cannot
  // land in the recognizer while the webapp chip keeps rendering the old one.
  string literal = 1;

  // Whether text following the name is an ARGUMENT to this command rather
  // than prose the user wrote.
  //
  // FALSE IS THE DEFAULT AND FALSE IS THE SAFE SIDE. A command that takes no
  // argument is recognized only as an ENTIRE prompt, so "/status of the build"
  // stays a prompt and keeps its user message. Marking a command that takes
  // none as taking some is the one way this table can swallow something a user
  // genuinely meant to say to the agent — an unrecoverable loss, since a
  // suppressed prompt is never recovered later.
  bool takes_args = 2;

  // Other spellings the vendor's CLI reads as this SAME command, leading slash
  // included — the CLI's own `aliases` (it answers `/reset` and `/new` as
  // `/clear`). A recognizer matches an alias exactly as it matches `literal`
  // and takes the same `takes_args`; the command is always SENT and SHOWN as
  // `literal`. Carried here so the aliases have one definition, like the
  // literal they stand for.
  repeated string aliases = 3;
}

// Attaches a spec to the enum value that names the command. An extension
// because the facts belong to the SCHEMA and there is no other construct that
// keeps them there: a Go map, a TypeScript array and a proto enum can be kept
// consistent only by whoever remembers all three, whereas an option is read
// back by reflection from the one definition.
extend google.protobuf.EnumValueOptions {
  SessionCommandSpec session_command_spec = 60002;
}

// A slash command the CLI answers ITSELF, rather than a prompt for the agent.
//
// THE CLOSED SET IS THE POINT. The daemon recognizes a submitted prompt as one
// of these before it forwards it (sessioncontroller/sessioncommand.go), and a
// recognized command earns NO user message — so the set of things that can
// suppress one is exactly the set of names below, fixed on the wire and
// reviewable in one place. A command that is not here is a prompt, and a
// prompt is always drawn.
//
// A custom command (a skill, a project command) is deliberately absent and
// always will be: those EXPAND into a prompt for the agent, so the text the
// user typed really is the turn's opening and really does belong in the feed.
//
// This is one of the few enums the repo permits. The forbidden case is a STATE
// enum — a phase, status, or condition, which is always a oneof of dedicated
// messages. A command identity is not a state of anything: it is a closed set
// of names, which is exactly what an enum is for.
enum SessionCommand {
  // Never set by the daemon. A receiver seeing UNSPECIFIED is looking at a
  // malformed frame and must reject it loudly rather than pick a command.
  //
  // It carries NO spec, deliberately: it names no command, so there is no
  // literal to spell and nothing a recognizer could ever match it against.
  SESSION_COMMAND_UNSPECIFIED = 0;
  SESSION_COMMAND_CLEAR = 1 [(session_command_spec) = {literal: "/clear", aliases: ["/reset", "/new"]}];
  SESSION_COMMAND_COMPACT = 2 [(session_command_spec) = {literal: "/compact", takes_args: true}];
  SESSION_COMMAND_MODEL = 3 [(session_command_spec) = {literal: "/model", takes_args: true}];
  SESSION_COMMAND_COST = 4 [(session_command_spec) = {literal: "/cost"}];
  SESSION_COMMAND_USAGE = 5 [(session_command_spec) = {literal: "/usage"}];
  SESSION_COMMAND_STATUS = 6 [(session_command_spec) = {literal: "/status"}];
  SESSION_COMMAND_CONTEXT = 7 [(session_command_spec) = {literal: "/context"}];
  SESSION_COMMAND_CONFIG = 8 [(session_command_spec) = {literal: "/config"}];
  SESSION_COMMAND_HELP = 9 [(session_command_spec) = {literal: "/help"}];
  SESSION_COMMAND_DOCTOR = 10 [(session_command_spec) = {literal: "/doctor"}];
  SESSION_COMMAND_LOGIN = 11 [(session_command_spec) = {literal: "/login"}];
  SESSION_COMMAND_LOGOUT = 12 [(session_command_spec) = {literal: "/logout"}];
  SESSION_COMMAND_MEMORY = 13 [(session_command_spec) = {literal: "/memory"}];
  SESSION_COMMAND_PERMISSIONS = 14 [(session_command_spec) = {literal: "/permissions"}];
  SESSION_COMMAND_AGENTS = 15 [(session_command_spec) = {literal: "/agents"}];
  SESSION_COMMAND_MCP = 16 [(session_command_spec) = {literal: "/mcp"}];
  SESSION_COMMAND_HOOKS = 17 [(session_command_spec) = {literal: "/hooks"}];
  SESSION_COMMAND_OUTPUT_STYLE = 18 [(session_command_spec) = {literal: "/output-style", takes_args: true}];
  SESSION_COMMAND_RELEASE_NOTES = 19 [(session_command_spec) = {literal: "/release-notes"}];
  SESSION_COMMAND_TODOS = 20 [(session_command_spec) = {literal: "/todos"}];
  SESSION_COMMAND_EXPORT = 21 [(session_command_spec) = {literal: "/export", takes_args: true}];
  SESSION_COMMAND_ADD_DIR = 22 [(session_command_spec) = {literal: "/add-dir", takes_args: true}];
  SESSION_COMMAND_RESUME = 23 [(session_command_spec) = {literal: "/resume", takes_args: true}];
  SESSION_COMMAND_EXIT = 24 [(session_command_spec) = {literal: "/exit"}];
  SESSION_COMMAND_PRIVACY_SETTINGS = 25 [(session_command_spec) = {literal: "/privacy-settings"}];
  SESSION_COMMAND_STATUSLINE = 26 [(session_command_spec) = {literal: "/statusline"}];
  SESSION_COMMAND_TERMINAL_SETUP = 27 [(session_command_spec) = {literal: "/terminal-setup"}];
  SESSION_COMMAND_VIM = 28 [(session_command_spec) = {literal: "/vim"}];
  SESSION_COMMAND_REWIND = 29 [(session_command_spec) = {literal: "/rewind"}];
  SESSION_COMMAND_BUG = 30 [(session_command_spec) = {literal: "/bug"}];
  SESSION_COMMAND_EFFORT = 31 [(session_command_spec) = {literal: "/effort", takes_args: true}];
  SESSION_COMMAND_PLUGIN = 32 [(session_command_spec) = {literal: "/plugin", takes_args: true}];
  SESSION_COMMAND_LOW_PRIORITY = 33 [(session_command_spec) = {literal: "/low-priority"}];
}

// ---- Context cuts: what /clear, /compact and auto-compaction leave behind ----

// The conversation was cut here, and the reader must see where.
message ContextCut {
  oneof cut {
    // Everything before this was discarded outright.
    ContextCleared cleared = 1;
    // Everything before this was summarized into what follows.
    ContextCompacted compacted = 2;
    // A compaction was attempted and FAILED, so nothing was cut. The context
    // is as it was — and still too large, which is why this is not silence.
    ContextCompactionFailed compaction_failed = 3;
    // Tag 4 is RETIRED: the server-side context edit is deferred.
  }
}

// A compaction that did not happen. The context is unchanged and still needs
// cutting; a consumer must not draw the conversation as compacted.
message ContextCompactionFailed {
  // What the producer said went wrong, verbatim. The only account anyone has,
  // and the thing the user's next action depends on.
  string error = 1;
}

// What the cut did to the context's size: how many tokens it held before,
// and how many after. NAMED FOR WHAT IT DESCRIBES — the change a cut made —
// though it carries the two endpoints rather than a difference, because a
// reader wants to see "180k → 12k", and a difference alone cannot show that.
//
// Every cut has one, INCLUDING a clear: clearing does not empty the context.
// The system prompt, loaded skills, memory files and the like are reloaded,
// so `tokens_after` is small, not zero — and stating it is what lets a reader
// see that rather than assume it.
message ContextTokenDelta {
  // Tokens in context immediately before the cut.
  int64 tokens_before = 1;
  // Tokens in context immediately after the cut, once whatever survives or
  // is reloaded is counted.
  int64 tokens_after = 2;
}

// History was discarded with nothing left in its place.
message ContextCleared {
  // Tag 1 is RETIRED: the vendor's conversation-reset record carries no token
  // delta (vetting item 1), so no producer could fill one.
}

// History was replaced by a summary of itself.
message ContextCompacted {
  // The summary that replaced the history, which the feed shows in its place
  // so the cut is not a hole. AgentResponseProse because the summary is the agent's
  // own prose — a compression of the prior conversation, rendered as markdown.
  AgentResponseProse summary = 1;
  // What the compaction did to the context's size, so a reader can see what
  // it bought rather than being told it happened.
  ContextTokenDelta tokens = 2;

  // WHO ASKED FOR IT. UNSET when the producer stated no trigger.
  //
  // THE TWO ARE DIFFERENT EVENTS FOR THE USER: a manual compaction is
  // something they did, and an automatic one is something that HAPPENED to
  // them — their conversation was silently rewritten while they watched.
  // Drawing them identically is the single most misleading thing this message
  // can do.
  oneof trigger {
    // The user or the daemon asked for the cut.
    ContextCompactionRequested requested = 3;
    // The producer performed it on its own, because the context was filling.
    ContextCompactionAutomatic automatic = 4;
  }

  // How long the compaction took, in milliseconds. Carried because it is the
  // slowest thing a session does, and a reader who watched a minute pass with
  // nothing drawn deserves to be told what it was spent on.
  uint64 duration_ms = 5;

  // Tags 6-7 are RETIRED: the cumulative-drop figure and the pre-cut tool
  // list have no declared producer (vetting item 1).
}

// The cut was asked for.
message ContextCompactionRequested {}

// The producer cut on its own because the context was filling.
message ContextCompactionAutomatic {}
