// prompt_origin.proto — WHY A PROMPT WAS SUBMITTED: closed attribution
// shared by the turn's request (shim.v1 StartTurn) and the turn's DURABLE
// record (AgentPrompt) — moved into conversation.v1 (2026-08-29) so replay
// resolvers can read it: merge-born rows route by it, restart re-drives
// label by it.

syntax = "proto3";

package conversation.v1;

option go_package = "agentrepl/proto/conversation/v1;conversationv1";

// Why a prompt entered the agent-repl submit pipeline.
//
// This is a closed, durable attribution vocabulary . Every frontend send site and every
// daemon-generated submit site MUST choose a non-UNSPECIFIED value, and Emacs
// send sites intentionally never share a value: a stored TurnStarted can
// therefore be traced back to the exact editor situation that caused it.
enum PromptOrigin {
  PROMPT_ORIGIN_UNSPECIFIED = 0;

  // Emacs-originated sends. Each value has exactly one production send site.
  PROMPT_ORIGIN_USER_SENT = 1;
  PROMPT_ORIGIN_USER_SENT_AND_HIDE = 2;
  PROMPT_ORIGIN_USER_SENT_WITH_METAPROMPT = 3;
  PROMPT_ORIGIN_USER_SENT_WITH_POSTFIX = 4;
  PROMPT_ORIGIN_USER_SENT_WITH_PREFIX = 5;
  PROMPT_ORIGIN_METAPROMPT_READ = 6;
  PROMPT_ORIGIN_COMMAND_DIFF_ANALYSIS = 7;
  PROMPT_ORIGIN_COMMAND_EXPLAIN_CONTEXT = 8;
  PROMPT_ORIGIN_COMMAND_EXPLAIN_PROMPT = 9;
  PROMPT_ORIGIN_COMMAND_UPDATE_PR = 10;
  PROMPT_ORIGIN_COMMAND_REBASE = 11;
  PROMPT_ORIGIN_COMMAND_CREATE_OR_UPDATE_PR = 12;
  PROMPT_ORIGIN_PANEL_SELECTION = 13;
  PROMPT_ORIGIN_DEFERRED_PROMPT = 14;
  PROMPT_ORIGIN_LEGACY_HOST_PROMPT = 15;
  PROMPT_ORIGIN_GNS_SOCKETS_CLOSE = 16;
  PROMPT_ORIGIN_LEGACY_HOST_EVAL_RESULT = 17;
  PROMPT_ORIGIN_EXPLAIN_CONFIG = 18;

  // Other producers remain explicit without being mislabeled as Emacs.
  PROMPT_ORIGIN_WEBAPP_USER_SENT = 19;
  PROMPT_ORIGIN_WEBAPP_CARD_ACTION = 20;
  PROMPT_ORIGIN_WORKSPACE_CREATED = 21;
  PROMPT_ORIGIN_MERGE_CONFLICT_REPAIR = 22;
  PROMPT_ORIGIN_MERGE_TEST_REPAIR = 23;
  PROMPT_ORIGIN_MERGE_BEFORE_ACTION = 24;
  PROMPT_ORIGIN_MERGE_AFTER_ACTION = 25;
  PROMPT_ORIGIN_MERGE_DISPLACED_TURN_RESUME = 26;

  // Tag 27 is RETIRED. The cache keep-alive is not a prompt the daemon
  // submits: it is the shim's own mechanism and never appears on this wire.


  // Daemon-generated re-drive of a turn a planned bounce interrupted.
  //
  // A restart that has to take the shim with it (the shim bundle changed, or
  // the shim is dead) interrupts whatever turn was running. The vendor SDK has
  // no resume-the-interrupted-turn primitive — `resume`, `continue` and
  // `resumeSessionAt` all restore CONTEXT and none restarts an aborted turn —
  // so the successor daemon has to submit an instruction to continue the work.
  //
  // THE SUBMIT IS INVISIBLE AND THE TURN IS NOT. This
  // turn's OUTPUT is the continuation of work the user asked for and belongs in
  // the conversation at the interrupted turn's position. Only the daemon's own
  // instruction is hidden, and it is hidden at the curator rather than by
  // origin (the daemon drops the `user_message` whose request id carries the
  // internal re-drive marker), so this value never has to be consulted to
  // decide what renders.
  //
  // What it IS for: saying WHY a turn is running. A status surface reads this
  // to report "resumed after restart" instead of presenting work the user did
  // not just ask for as though they had.
  PROMPT_ORIGIN_RESUME_AFTER_RESTART = 28;

  // A turn the VENDOR started on its own, with no StartTurn behind it.
  //
  // The vendor runs turns nobody submitted: a background subagent's hand-back
  // report arriving makes the main agent reply, and so does a background
  // task's notification. The shim ADOPTS every such turn as a real turn: it
  // mints the turn id itself and writes a prompt row of this origin as the
  // turn's FIRST row, on the same ordered plane as everything the turn goes on
  // to produce, so no frame and no terminal of the turn is ever without a turn
  // id, and a consumer learns the turn opened before it sees any of its rows.
  //
  // THE ROW IS AN EDGE, NOT WORDS. `said` is empty: nobody said anything, and
  // what drove the turn (a peer message, a task notification) is its own row.
  // A feed draws no prompt bubble for it; a consumer that tracks the running
  // turn opens the turn on it, once.
  //
  // Never submitted by a client: only the shim produces it.
  PROMPT_ORIGIN_VENDOR_STARTED = 29;
}
