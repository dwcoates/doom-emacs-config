// endpoint_complete_exchange.proto — CompleteExchange: an exchange's answer
// finished, so it becomes a node.

syntax = "proto3";

package zettel.v1;

import "zettel/v1/zettel.proto";

option go_package = "agentrepl/proto/zettel/v1;zettelv1";

// Turns an exchange in flight into a node, with the finished answer as its
// first revision. The exchange is consumed in the same transaction.
message CompleteExchangeRequest {
  // The exchange whose answer finished.
  ExchangeId exchange = 1;
  // The final answer, as markdown, verbatim from the turn's final response.
  string answer_markdown = 2;
}

// The outcome of CompleteExchange.
message CompleteExchangeResponse {
  // Success carries the new node; failure says why none was created.
  oneof result {
    CompleteExchangeSuccess success = 1;
    CompleteExchangeFailure failure = 2;
  }
}

// The node was created and the exchange consumed.
message CompleteExchangeSuccess {
  // The new node.
  Node node = 1;
}

// No node was created, and the exchange is unchanged.
message CompleteExchangeFailure {
  // A one-line human-readable account of the failure, for the log.
  string detail = 1;
  // Which failure it was.
  oneof kind {
    CompleteExchangeStorageFailure storage_failure = 2;
    CompleteExchangeInvalidRequest invalid_request = 3;
    CompleteExchangeUnknownExchange unknown_exchange = 4;
  }
}

// The database could not be written.
message CompleteExchangeStorageFailure {}

// A required field was missing or empty.
message CompleteExchangeInvalidRequest {
  // The field at fault, by its proto name.
  string field = 1;
}

// No exchange in flight has this id: it was never begun, or it was already
// completed or abandoned.
message CompleteExchangeUnknownExchange {}
