// endpoint_abandon_exchange.proto — AbandonExchange: an exchange's turn ended
// without an answer, so it never becomes a node.

syntax = "proto3";

package zettel.v1;

import "zettel/v1/zettel.proto";

option go_package = "agentrepl/proto/zettel/v1;zettelv1";

// Removes an exchange whose turn ended with no final response (interrupted,
// failed or rolled back). The question leaves the graph with it.
message AbandonExchangeRequest {
  // The exchange to remove.
  ExchangeId exchange = 1;
}

// The outcome of AbandonExchange.
message AbandonExchangeResponse {
  // Success means the exchange is gone; failure says why it is not.
  oneof result {
    AbandonExchangeSuccess success = 1;
    AbandonExchangeFailure failure = 2;
  }
}

// The exchange was removed.
message AbandonExchangeSuccess {}

// Nothing was removed.
message AbandonExchangeFailure {
  // A one-line human-readable account of the failure, for the log.
  string detail = 1;
  // Which failure it was.
  oneof kind {
    AbandonExchangeStorageFailure storage_failure = 2;
    AbandonExchangeInvalidRequest invalid_request = 3;
    AbandonExchangeUnknownExchange unknown_exchange = 4;
  }
}

// The database could not be written.
message AbandonExchangeStorageFailure {}

// A required field was missing or empty.
message AbandonExchangeInvalidRequest {
  // The field at fault, by its proto name.
  string field = 1;
}

// No exchange in flight has this id.
message AbandonExchangeUnknownExchange {}
