// endpoint_list_pending_exchanges.proto — ListPendingExchanges: every exchange
// in flight, across all threads.

syntax = "proto3";

package zettel.v1;

import "zettel/v1/zettel.proto";

option go_package = "agentrepl/proto/zettel/v1;zettelv1";

// Lists every exchange still in flight, so the daemon can settle the ones
// whose turns ended while the two were apart (a daemon restart, a zettel
// restart). Settling is CompleteExchange or AbandonExchange per turn.
message ListPendingExchangesRequest {}

// The outcome of ListPendingExchanges.
message ListPendingExchangesResponse {
  // Success carries the exchanges; failure says why they could not be read.
  oneof result {
    ListPendingExchangesSuccess success = 1;
    ListPendingExchangesFailure failure = 2;
  }
}

// Every exchange in flight.
message ListPendingExchangesSuccess {
  // The exchanges, oldest first.
  repeated PendingExchange pending = 1;
}

// The exchanges could not be read.
message ListPendingExchangesFailure {
  // A one-line human-readable account of the failure, for the log.
  string detail = 1;
  // Which failure it was.
  oneof kind {
    ListPendingExchangesStorageFailure storage_failure = 2;
  }
}

// The database could not be read.
message ListPendingExchangesStorageFailure {}
