// sidebar.proto — THE WORKSPACES RAIL: the sidebar's entire model, RESOLVED
// BY THE DAEMON and rendered verbatim by every webview.
//
// The daemon owns this view. It joins its own registry (which workspaces are
// registered, their dir and lineage), its own per-session lifecycle
// (RenderState, coarsened onto the dot vocabulary below), merge state and git
// facts, and the two things only Emacs can tell it — that a workspace exists
// (RegisterWorkspace) and which one is selected (SelectWorkspace), both
// agentrepl.v1 verbs. Emacs never builds, sends, or reads this message.
//
// GLOBAL, NOT PER-WORKSPACE. This is the one component whose stream carries
// no workspace: every webview (one per workspace) watches the same roster,
// and the daemon's stream order is the only order — there is no publisher
// epoch to reconcile, because there is no outside publisher.
//
// VIEW ONLY. The sidebar's clicks (open, close, create, merge,
// navigate) are agentrepl.v1 requests with plain fields — a request type is
// agentrepl, never frontend (the drawn/called test, which stands).
//
// THE MESSAGE TREE IS THE UI TREE. Every drawn box is one message and every
// message is one drawn box, nesting equal, and no value rides bare:
//
//   ┌─ WORKSPACES ──────────────────────────┐  WorkspaceRoster
//   │ ▾ OPEN (4)                            │  RosterOpenSection + the view's open_count
//   │ ▾ repo-name                           │  RosterRepoSection → header
//   │   ● row-name                    3m    │  RosterRow: status · name · when
//   │ ▌ ● current-row                 now   │  RosterRowCurrent highlight
//   │   ┌ branch  …  ┐                      │  RosterRowDetail (expanded)
//   │   │ from    …  │                      │    three independently-omitted lines
//   │   │ summary …  │                      │
//   │   └────────────┘                      │
//   │   ● closed-row  (grey dot)      5d    │  inactive arm · RosterRowClosed
//   │ ▾ Merge Queue                (2)      │  RosterMergedSection
//   │     repo-name                         │    RosterMergeQueueRepoGroup
//   │       ⟳ head-row  rebasing 3/7        │      RosterMergeQueueHead
//   │       2 waiting-row                   │      RosterMergeQueueWaiting
//   │     Recently Merged                   │    RosterMergedSection.merged_label
//   │     repo-name                         │    RosterMergedRepoGroup
//   └───────────────────────────────────────┘
//
// A repo section and the merge-queue section share one header shape
// (label + fold).



syntax = "proto3";

package frontend.v1;

import "frontend/v1/feed.proto";
import "workspace/v1/workspace.proto";
import "zettel/v1/zettel.proto";

option go_package = "agentrepl/proto/frontend/v1;frontendv1";

// One complete, self-contained picture of the sidebar.
//
// Always whole, never a delta — the model is small, so a full replace makes a
// partially-applied roster unrepresentable.
//
// `viewed` (field 12) is RETIRED and reserved: a band that hoisted every
// workspace whose result was read out of the groupings. It split the
// workspaces the editor steps through left and right into two runs, so a
// viewed workspace stays in its grouping and only its row's dot is drawn
// grey (RosterRowViewed) (2026-10-12).
message WorkspaceRoster {
  reserved 12;
  reserved "viewed";
  // `task` (2), `maturity` (7) and the `shown` choice between groupings (5,
  // 6, 8) are RETIRED and reserved: the rail draws ONE grouping, by
  // repository, and nothing else (owner ruling, 2026-10-15).
  reserved 2, 5, 6, 7, 8;
  reserved "task", "maturity", "shown_repository", "shown_task", "shown_maturity";
  // THE LISTS ARE THE STATES. Every workspace the roster carries is in
  // exactly one of `repository` (OPEN), `hidden` (HIDDEN), `recently_merged`
  // (MERGED) and `closed` (CLOSED), and each list's row type (RosterOpenRow,
  // RosterHiddenRow, RosterMergedRow, RosterClosedRow) is that state, so no
  // row also carries a state that could disagree with its list. OPEN BEATS
  // MERGED: a merged workspace that was reopened is open, and listed with the
  // open ones.
  //
  // The OPEN workspaces, one section per repository: the rail's one grouping
  // AND THE EMACS TAB BAR. The tab bar is this tree's depth-first walk --
  // repository by repository, each one's own rows and then each
  // subsection's, every family under its parent -- and each open row states
  // its own tab (RosterOpenRow.tab), so a workspace is in the Open section
  // exactly when it has a tab, its repository's fold aside, and tab N is
  // always the row drawn immediately before tab N+1.
  RosterRepositoryView repository = 1;
  // THE MERGE QUEUE SECTION, drawn below the other sections: every
  // repository's merge queue, and below it the workspaces whose merge has
  // settled and that are CLOSED, since that they are done is the interesting
  // fact. Its merged rows are never open.
  RosterMergedSection recently_merged = 3;
  // Workspaces the user has hidden (agentrepl.v1.SetWorkspaceHidden). A
  // hidden workspace may keep its session until it is gated, but it has NO
  // TAB: the Emacs tab bar never draws, numbers or steps to it. Always set.
  RosterHiddenSection hidden = 9;
  // Workspaces that are CLOSED and not in `recently_merged`: they have no tab
  // and no sidebar section draws them. Carried so the editor can offer them
  // again (its workspace switcher, reopening) and route their records.
  // Always set.
  RosterClosedRows closed = 14;
  // THE OPEN-WORKSPACES SECTION's heading and fold: the box the repository
  // sections are drawn in, under one "Open" header, above the hidden
  // section. Its count is RosterRepositoryView.open_count. Always set.
  RosterOpenSection open = 13;
  // `tab_bar` (field 10) is RETIRED and reserved: a second list of the open
  // workspaces in tab order, joined to the rows by id, could disagree with
  // them. Each open row states its own tab (RosterOpenRow.tab), and the tab
  // bar is the Open section's walk.
  reserved 10;
  reserved "tab_bar";
  // THE ROSTER'S REVISION: the daemon raises it for every roster it
  // resolves, so of two rosters (or a roster and an OpenTabs answer's row,
  // OpenTabsOpenedReady.roster_revision) the higher revision is the newer
  // state. It orders what arrives over separate streams; nothing else is
  // read off it.
  uint64 revision = 11;
  // The selected workspace — the last SelectWorkspace the daemon received.
  // UNSET when there is none.
  optional RosterCurrentWorkspace current = 4;
  // THE AGENT-REPL VERSION the daemon deploys from, drawn small and receded
  // at the right of the rail's header. UNSET until the daemon has resolved
  // it, and while it cannot (the failure is the daemon's to log).
  optional RosterVersion version = 15;
  // THE RAIL'S TITLE, which is also its app switcher: the name of the app
  // shown, and the dropdown of apps it opens. Which app is shown FOLLOWS
  // WHAT IS ON SCREEN: a selected chat thread shows Chat, any other
  // selection shows Workspaces. Always set.
  RosterAppSwitcher app_switcher = 16;
  // THE CHAT APP'S BODY: every chat thread, every open one first and then
  // every archived one, each the one last asked a question first, and the
  // new-thread button. Drawn in place of the open,
  // hidden and recently-merged sections while Chat is shown. Threads appear
  // nowhere else in the roster: no repository section, band or tab holds
  // one. Always set, whichever app is shown, because Emacs reads it to pick
  // threads by name.
  RosterThreadSection threads = 17;
}

// ---- The app switcher ----

// The apps the sidebar can show. Used as an echo token: the switcher serves
// one per option, and agentrepl.v1.ShowSidebarApp hands it back.
message SidebarApp {
  // Which app. The set arm IS the app.
  oneof app {
    SidebarAppWorkspaces workspaces = 1;
    SidebarAppChat chat = 2;
  }
}

// agent-repl's workspaces: the repository sections and their bands.
message SidebarAppWorkspaces {}

// zettel's chat threads.
message SidebarAppChat {}

// The rail's title and the dropdown it opens.
message RosterAppSwitcher {
  // The title: the shown app's name, drawn as the clickable rail title.
  RosterAppSwitcherTitle title = 1;
  // Which app is shown, deciding which body the rail draws below its head.
  SidebarApp shown = 2;
  // The dropdown's options, in drawn order.
  repeated RosterAppSwitcherOption options = 3;
}

// The rail title's text.
message RosterAppSwitcherTitle {
  // The text, verbatim ("Workspaces", "Chats").
  string text = 1;
}

// One app in the switcher's dropdown.
//
// `hint` (field 2) is RETIRED and reserved: the dim line naming the app's
// system beside its name was dropped (owner request, 2026-10-25), so an
// option draws its name alone.
message RosterAppSwitcherOption {
  reserved 2;
  reserved "hint";
  // The app's name, drawn as the option.
  RosterAppSwitcherOptionLabel label = 1;
  // The app, handed back by agentrepl.v1.ShowSidebarApp when picked.
  SidebarApp app = 3;
  // Drawn with a check mark: this is the app shown.
  optional RosterAppSwitcherOptionShown shown = 4;
}

// An option's name.
message RosterAppSwitcherOptionLabel {
  // The name, verbatim.
  string text = 1;
}

// The option is the app shown. Empty: presence is the fact.
message RosterAppSwitcherOptionShown {}

// ---- The chat app's body ----

// Every chat thread, and the button that starts one.
message RosterThreadSection {
  // The new-thread button, drawn above the list.
  RosterThreadNewButton new_thread = 1;
  // The threads, the one last asked a question first (or created, until
  // asked one): viewing a thread never moves it. Empty when there are none.
  repeated RosterThreadRow rows = 2;
}

// The new-thread button. A click is agentrepl.v1.RequestNewThread.
message RosterThreadNewButton {
  // The button's label, verbatim.
  string label = 1;
}

// One thread in the list. A click is agentrepl.v1.SelectWorkspace with the
// row's thread.
message RosterThreadRow {
  // The thread's workspace, handed back on a click.
  workspace.v1.WorkspaceRef thread = 1;
  // The thread's name, generated once when it was created.
  RosterThreadName name = 2;
  // The thread's summary, drawn under its name. UNSET until one has been
  // generated.
  optional RosterThreadSummary summary = 3;
  // Drawn highlighted: this thread is the one selected.
  optional RosterThreadCurrent current = 4;
  // Whether the thread is open or archived. Always set: the set arm decides
  // where the row is drawn and which verbs its menu offers.
  RosterThreadStanding standing = 5;
  // The thread's branches, drawn under its row. Set on the CURRENT thread's
  // row once the daemon holds its graph; UNSET on every other row.
  optional RosterThreadOutline outline = 6;
}

// A THREAD'S BRANCHES AROUND ITS SHOWN PATH (owner ruling, 2026-10-25:
// chain collapsing with re-rooting). A run of questions each followed by
// exactly one more is ONE row; the rows start a few levels above the run
// holding the shown question, every level above them folds into the
// breadcrumb, and no row is deeper than RosterThreadOutlineRow.depth's
// ceiling, so a thread of any depth fits the rail.
message RosterThreadOutline {
  // The levels above the rows, oldest first. UNSET when the rows start at
  // the thread's first question.
  optional RosterThreadOutlineBreadcrumb breadcrumb = 1;
  // The rows in reading order: depth first, each branch's children oldest
  // first. Never empty.
  repeated RosterThreadOutlineRow rows = 2;
}

// The folded levels above the rows. The set arm is whether all are named.
message RosterThreadOutlineBreadcrumb {
  oneof extent {
    // Few enough to name them all.
    RosterThreadOutlineBreadcrumbWhole whole = 1;
    // Too many: the oldest and the newest are named, the rest counted.
    RosterThreadOutlineBreadcrumbElided elided = 2;
  }
}

// Every folded level, oldest first. Never empty.
message RosterThreadOutlineBreadcrumbWhole {
  repeated RosterThreadOutlineCrumb crumbs = 1;
}

// The oldest and newest folded levels, and how many lie between.
message RosterThreadOutlineBreadcrumbElided {
  // The thread's first run.
  RosterThreadOutlineCrumb first = 1;
  // How many runs lie between `first` and `last`. Never zero.
  uint32 omitted = 2;
  // The run just above the rows.
  RosterThreadOutlineCrumb last = 3;
}

// One folded level: a run above the rows. A click shows its first question.
message RosterThreadOutlineCrumb {
  // The run's first question, handed back to agentrepl.v1.ShowChatNode.
  zettel.v1.NodeId node = 1;
  // The run's first question's text.
  RosterThreadOutlineLabel label = 2;
}

// A run's label: its first question, abbreviated where the daemon has
// minted an abbreviation (zettel.v1.NodeQuestion.abbreviation).
message RosterThreadOutlineLabel {
  // What the row draws: the question's abbreviation, or the question
  // verbatim while it has none.
  string text = 1;
  // The question verbatim, for the row's tooltip.
  string question = 2;
}

// One run of the outline. A click shows its first question.
message RosterThreadOutlineRow {
  // The run's first question, handed back to agentrepl.v1.ShowChatNode.
  zettel.v1.NodeId node = 1;
  // The run's first question's text.
  RosterThreadOutlineLabel label = 2;
  // How many levels below the first row's this run sits: 0 to 3.
  uint32 depth = 3;
  // How many questions the run holds. Never zero.
  uint32 turns = 4;
  // The runs below this one that are folded away, set on a row at the
  // deepest level whose run has branches below it.
  optional RosterThreadOutlineFolded folded = 5;
  // Where the run stands against the shown path. Always set.
  RosterThreadOutlinePlace place = 6;
}

// The runs folded below a row.
message RosterThreadOutlineFolded {
  // How many. Never zero.
  uint32 runs = 1;
}

// Where a run stands against the shown path. The set arm IS the place.
message RosterThreadOutlinePlace {
  oneof place {
    // Off the shown path.
    RosterThreadOutlineOff off = 1;
    // On the shown path, above the shown question.
    RosterThreadOutlineOnPath on_path = 2;
    // Holds the shown path's last question: the one on screen at its end.
    RosterThreadOutlineShown shown = 3;
  }
}

// Off the shown path. Empty: the arm is the fact.
message RosterThreadOutlineOff {}

// On the shown path. Empty: the arm is the fact.
message RosterThreadOutlineOnPath {}

// Holds the shown path's end. Empty: the arm is the fact.
message RosterThreadOutlineShown {}

// Where a thread stands. The set arm IS the standing.
message RosterThreadStanding {
  oneof standing {
    // Open: listed with the threads, its session kept.
    RosterThreadOpen open = 1;
    // Archived (the thread's workspace is closed): listed after every open
    // thread, under "Archived". Restoring it opens the workspace again.
    RosterThreadArchived archived = 2;
  }
}

// The thread is open. Empty: the arm is the fact.
message RosterThreadOpen {}

// The thread is archived. Empty: the arm is the fact.
message RosterThreadArchived {}

// A thread's name.
message RosterThreadName {
  // The name, verbatim.
  string text = 1;
}

// A thread's summary.
message RosterThreadSummary {
  // The summary, verbatim.
  string text = 1;
}

// The thread is the selected one. Empty: presence is the fact.
message RosterThreadCurrent {}

// The agent-repl release the daemon's checkout is at: the highest version tag
// reachable from its HEAD, so a commit between landings states the last
// landing's version. A bare semver (`0.129.0`), never carrying build metadata.
message RosterVersion {
  string text = 1;
}

// ---- The three lists' rows -------------------------------------------------

// The top-level open rows of one region of the Open section (a repository's
// own rows, or one subsection's), in drawn order.
message RosterOpenRows {
  // Each top-level open row, carrying its open family nested.
  repeated RosterOpenRow rows = 1;
}

// ONE OPEN WORKSPACE: drawn in the Open section and, unless its repository is
// folded, on the Emacs tab bar with the same number. Its children are open
// rows too, so a family is one run of rows and tabs: a child sits right after
// its parent, its siblings in their order, and no child can leave its
// parent's run. A workspace whose parent is not open (a closed or hidden
// parent of a family that predates the rule against one) takes its parent's
// place instead.
message RosterOpenRow {
  // Everything every list draws the same way: identity, name, status,
  // markers, the when-column and the detail panel.
  RosterRow row = 1;
  // The row's tab, as the daemon numbers it. Always set.
  RosterOpenRowTab tab = 2;
  // The workspace's open children, in drawn order, each followed by its own.
  repeated RosterOpenRow children = 3;
}

// An open row's tab. THE DAEMON NUMBERS EVERY TAB, so the number the sidebar
// paints beside a row and the number on the Emacs tab bar are one fact.
message RosterOpenRowTab {
  // Whether the tab is drawn now. Exactly one arm is set; unset is malformed.
  oneof tab {
    // Drawn on the tab bar and numbered in the sidebar.
    RosterOpenRowTabNumbered numbered = 1;
    // The workspace's repository is folded: it stays open, but neither the
    // sidebar nor the tab bar draws it, and it takes no number. It returns
    // when the repository unfolds.
    RosterOpenRowTabFolded folded = 2;
  }
}

// A drawn tab's number: its position among drawn tabs, counting from 1 in
// the Open section's walk. Numbers run 1 to N with no gap, so `M-1`... reach
// exactly these and the sidebar's numbers read top to bottom in order.
message RosterOpenRowTabNumbered {
  // The tab's number, from 1.
  uint32 number = 1;
}

// The tab is folded away with its repository. DELIBERATELY EMPTY: the arm is
// the fact.
message RosterOpenRowTabFolded {}

// The top-level hidden rows, in the hidden section's order.
message RosterHiddenRows {
  // Each top-level hidden row, carrying its hidden family nested.
  repeated RosterHiddenRow rows = 1;
}

// ONE HIDDEN WORKSPACE: listed only in the hidden section, with NO TAB. It may
// keep its session until it is gated. A workspace with open children cannot
// be hidden, so a hidden row's children are hidden too.
message RosterHiddenRow {
  // The row as every list draws it.
  RosterRow row = 1;
  // The workspace's hidden children, in drawn order.
  repeated RosterHiddenRow children = 2;
}

// The rows of one repository's recently-merged group, newest merge first.
message RosterMergedRows {
  // Each merged row. FLAT: a settled merge has no family left to draw.
  repeated RosterMergedRow rows = 1;
}

// The closed workspaces the roster carries outside recently_merged, in the
// registry's order.
message RosterClosedRows {
  // Each closed row. FLAT: a closed workspace is drawn in no family.
  repeated RosterClosedRow rows = 1;
}

// ONE CLOSED WORKSPACE that is not listed as merged. No tab; drawn by no
// sidebar section. Reopening it moves it back to the Open section.
message RosterClosedRow {
  // The row as every list draws it.
  RosterRow row = 1;
}

// ONE MERGED WORKSPACE: its merge landed and it is closed. Never open: a
// merged workspace that is reopened leaves this list for the Open section.
message RosterMergedRow {
  // The row as every list draws it.
  RosterRow row = 1;
}


// The priority badge's drawn label.
message RosterRowPriorityBadge {
  string label = 1;
}

// The attention marker. Empty: presence is the fact.
//
// THE CANONICAL BLINK CADENCE lives HERE, ONCE: TWO blinks — 500 ms on,
// 500 ms off, twice — then a steady marker until cleared. The webapp
// sidebar AND the Emacs tab-bar both implement exactly this spec and cite
// this message in their implementations; consistency is CODE-LEVEL, not
// coincidental, and a divergent cadence is a defect.
message RosterRowAttention {}

// The VIEWED marker: the row's display mode. Empty: presence is the fact.
//
// ABSENT is FULL and PRESENT is PARTIAL — the two words the Emacs tab-bar
// already uses for the same distinction, and deliberately the same words here,
// because the tab-bar entry and this row are two drawings of ONE mode and may
// never disagree.
//
// PARTIAL means "you have already read this workspace's last turn result".
// Emacs reports a dwell (MarkWorkspaceViewed) once the user has dwelt on the
// workspace's panels, and the marker changes nothing about the lifecycle: the
// status dot keeps its colour in either mode, and only the row's NAME text
// recedes to the muted colour while the marker stands.
//
// TURN-END-ONLY. The marker is PRESENT only on a row whose `status` is a turn
// end, `done`, `interrupted` or `turn_failed`, never on any other arm, however long the user
// has looked at it: every other arm is live work (thinking, a permission ask,
// detached work, a merge running) or an exceptional state (severed, dead,
// vendor_blocked, a merge conflict), and neither may ever be drawn
// deprioritized. The daemon decides this: a dwell reported while the row is
// not on a turn-end arm is DROPPED, not held for later, so a row that goes on
// to finish is FULL until the user dwells on the finished turn. A row carrying
// this marker with any other arm is a contract breach.
//
// ONE EXCEPTION READS WITHOUT DRAWING (owner ruling, 2026-09-28): a dwell on a
// `vendor_blocked` row READS the result of the turn whose failure raised the
// block, so the row is PARTIAL once the block lifts and it falls back to that
// turn's end. The marker itself is still never drawn on `vendor_blocked`.
//
// THE MARKER IS DERIVED FROM A READ FACT, and the daemon resolves it in the
// same render as the row's `status`, so every push states the two in
// agreement and a client draws the marker as it arrives, with no rule of its
// own. A turn that completes, is interrupted or fails leaves its result UNREAD; a
// dwell on the turn-end row READS it, and so does a completed /clear or
// compaction, at once (see MarkWorkspaceViewed); the next turn resets it. Live
// detached work draws `idle_async` over an unread result at once, FULL (see the
// `status` oneof's `idle_async`), and a dwell on that `idle_async` row READS the
// result too. Once read, the marker stands whenever the row is on its turn-end
// arm, including when it returns there from `idle_async`: a read result is
// never drawn as unread, and an unread one never as read.
message RosterRowViewed {}

// The UNREAD-TURN-END marker of an `idle_async` row: the background outranks a
// turn end whose result the user has NOT read yet. PRESENT exactly while the
// row's `status` is `idle_async` and the last turn's result is unread; absent
// on every other arm, and on an `idle_async` row whose result is read or which
// has no turn end beneath it at all.
//
// WHY A MARKER AND NOT A STATUS ARM: the workspace IS in the background, so
// its arm stays `idle_async` (yellow) and every rule keyed on the arm holds.
// The marker is the one extra fact a surface draws beside it, the unread
// result standing under the background:
//
//   - the sidebar keeps the row's status dot on the `idle_async` yellow, and
//     inks the row's NAME in the color of the turn end beneath (green for
//     `done` and `interrupted`, turquoise for `turn_failed`);
//   - the Emacs tab bar keeps the tab's `[N]` bracket on the `idle_async`
//     yellow, and paints the space after it and the workspace name in that
//     turn end's color.
//
// A DWELL READS IT. A dwell on the `idle_async` row (MarkWorkspaceViewed)
// reads the result, as RosterRowViewed states, and the next push omits this
// marker, so the whole row draws the background's yellow. A new turn resets
// the result and the marker with it. The daemon resolves the marker in the
// same render as `status`, so a client draws it as it arrives, with no rule
// of its own; a row carrying it on any arm but `idle_async` is a contract
// breach.
message RosterRowIdleAsyncUnread {
  // Which TURN END the unread result is, named by the status arm that turn
  // end draws once the background ends. The producer always sets an arm: a
  // turn end this schema revision does not name is never sent, so a client
  // refuses an unset oneof as malformed rather than guessing a color.
  oneof turn_end {
    // The turn completed (or stopped as expected): green.
    RosterRowStatusDone done = 1;
    // The turn was interrupted by the user: green.
    RosterRowStatusInterrupted interrupted = 2;
    // The turn failed: turquoise.
    RosterRowStatusTurnFailed turn_failed = 3;
  }
}

// The REVIVING marker: this workspace's parked (hibernated) session is being
// brought back up right now. Empty: presence is the fact.
//
// PRESENT from the instant the daemon decides to revive a parked workspace —
// a SelectWorkspace naming it, which has ALREADY made the selection current
// and pushed it — until that revival ends, whether it succeeded or failed.
// Every push after the revival ends omits it. A failed revival is reported to
// the caller that asked for it as that rpc's error; the marker only ever says
// "underway", never how it went.
//
// ONE REVIVAL PER WORKSPACE AT A TIME: a second select arriving while one is
// in flight joins it rather than starting another, so the marker has exactly
// one start and one end per bring-up.
//
// It is NOT a status arm and says nothing the `status` oneof says: the dot
// keeps whatever the lifecycle resolves to, the viewed marker is not cleared
// by it, and the webapp draws it as a subtle shimmer across the row's NAME
// text while it stands.
message RosterRowReviving {}

// DETACHED WORK RUNS in this workspace: a subagent, a background shell, or
// any other work that outlives the main thread's turn. PRESENT exactly while
// the daemon counts such work as live, on ANY status arm, and absent
// otherwise; presence is the whole fact.
//
// WHY THE ROW STATES IT SEPARATELY: `idle_async` is only the idle rung's arm,
// so a row on any arm above it (thinking, a permission ask) cannot say
// through its status that background work runs beside it.
message RosterRowDetachedLive {}

// The ONE-SHOT mark: the workspace was created as a one-shot, given one
// prompt and expected to finish by asking for its own merge. Empty: presence
// is the fact.
//
// THE DAEMON DECIDES IT. The workspace is a one-shot when its creation asked
// for the one-shot form; that never changes, so the mark stands for the
// workspace's whole life.
//
// DRAWN ONLY WHILE THE ONE-SHOT WORKS (owner ruling, 2026-10-13): both
// surfaces draw the one-shot glyph in place of the status mark exactly while
// the row's status is `submitting`, `thinking` or `clearing`, and draw the
// row's own status mark on every other arm, `compacting` included. The glyph
// is static. Tags 1 (`armed`) and 2 (`failed`) are RETIRED with the outcome
// they carried: nothing draws a one-shot's outcome any more.
message RosterRowOneShot {
  reserved 1, 2;
  reserved "armed", "failed";
}

// The ASYNC-MERGING marker: the workspace's OWN BRANCH is merging async, in a
// hidden merge workspace forked from it. Empty: presence is the fact.
//
// PRESENT from the moment the async request is recorded on the repository's
// merge queue until it leaves the queue -- landed, failed or taken off -- and
// absent otherwise, whatever the row's status arm says. A SYNC merge, which
// runs in the workspace itself, never raises it: that merge is the row's own
// `merge_queued` or `merging` arm.
//
// WHY A MARKER AND NOT A STATUS ARM: the workspace itself is free while its
// branch merges elsewhere. It takes prompts, runs turns and raises gates, so
// its status arm keeps resolving exactly as for any other workspace (the
// footer's projection), and the row's NAME keeps that status's color. The
// marker is the one extra fact both surfaces draw beside it:
//
//   - the sidebar inks the row's PLAIN status dot purple, breathing, in place
//     of the arm's own color. Any other mark the row draws in the dot's place
//     outranks it: a gate's glyph, the one-shot glyph, a merge glyph, or a
//     dot with an ink of its own (`render-colors.json#glyph_inks`, e.g. the
//     compacting orange). Which marks are plain is the shared vocabulary's
//     `async_merge_mark` section.
//   - the Emacs tab bar paints the tab's `[N]` bracket with the merge purple
//     background, and the space after it and the workspace name keep the
//     status background.
message RosterRowAsyncMerging {}

// The MERGE-PAUSED marker: the merge queue holding this row's merge is
// PAUSED, so the merge the row draws is not progressing. Empty: presence is
// the fact.
//
// PRESENT exactly while BOTH hold, and absent otherwise:
//
//   - the row draws a MERGE INDICATOR: its status is `merging` or
//     `merge_queued`, or it carries the `async_merging` marker;
//   - the merge queue of the repository THAT merge is on is paused.
//
// A paused repository's rows with no merge on its queue never carry it, and a
// row whose merge is on another repository's queue never carries it for this
// one. The daemon resolves that join, because only it knows which queue each
// row's merge is on. The marker drops on the roster push that follows the
// queue's resume, so the normal indicators return with no reload.
//
// WHY A MARKER AND NOT A STATUS ARM: a paused queue changes nothing about the
// workspace's own state, so its status arm and its name's color stand as they
// are. A paused queue admits nothing, and it keeps a merge it suspended
// suspended, so a purple, breathing merge indicator would claim progress that
// is not happening. The marker changes only how the merge indicator is drawn.
// The sidebar draws it per `render-colors.json#paused_merge_mark` (owner
// ruling, 2026-10-14):
//
//   - every merge indicator's INK is that section's ink: the merge glyph of
//     a `merging` or `merge_queued` row, and the async-merge mark;
//   - the breath the merge gave the row's NAME stops, and the name keeps its
//     color. A `merging` row's name holds still. A row breathing only for its
//     async-merge mark holds still. A row whose own status arm breathes (a turn
//     in flight while its branch merges async) keeps that breath, which is the
//     turn's, not the merge's.
//
// The Emacs tab bar draws nothing for it.
message RosterRowMergePaused {}

// The OPENING marker: the editor is opening this workspace right now. Empty:
// presence is the fact.
//
// PRESENT exactly while an OpenTabs names the workspace and has not answered
// it `opened` yet, and only then; the row's status is `inactive` for as long
// as it stands. NOT SELECTABLE: a click on a row carrying the marker does
// nothing until the workspace is open, when the marker drops and the row
// draws its real status. A daemon that restarted under open tabs never draws
// it for them.
message RosterRowOpening {}

// The workspace's AVAILABILITY: whether the daemon has this workspace's
// session to offer an editor. An editor OPENS a workspace — its tab, its
// panels, its webapp — only once the row says the daemon has finished
// bringing it up, either way; before that there is nothing behind the
// workspace to draw. At startup an editor opens the registry's rows strictly
// IN ROSTER ORDER, each one waiting until its row leaves `pending`, so a row
// that is `available` before an earlier one stays unopened until that earlier
// one resolves.
//
// THE DAEMON DECIDES IT FROM ITS BRING-UPS AND THE SHIM LINK. `pending` is a
// bring-up of the workspace's session being under way: the boot's bring-up of
// the workspaces it reconciled (named before the daemon serves, so no editor
// sees such a row any other way first), or any start in flight. `available`
// is the shim link having CONNECTED at least once under this daemon — STICKY
// for the daemon's lifetime: a session parked by the idle sweep, severed or
// killed later is still a workspace the editor has opened, and its status arm
// reports what became of it — and it is equally a workspace with no bring-up
// under way and no failed one, such as a freshly registered workspace whose
// session starts only when it is first used: there is nothing to wait for.
// `unavailable` is the link going dead before it ever connected, with no
// bring-up under way: the start failed, or the boot could not tell whether a
// surviving shim owns the workspace and so served none.
//
// A hibernated workspace is never `available` merely by being registered:
// the boot wakes it, and it is `pending` until the woken shim connects.
message RosterRowAvailability {
  // The availability. The set arm IS the availability; an unset oneof is
  // invalid.
  oneof availability {
    // A bring-up of the session is under way and no shim link has connected
    // yet. The editor does not open the workspace yet.
    RosterRowAvailabilityPending pending = 1;
    // A shim link to this workspace's session has connected under this
    // daemon, or no bring-up is under way and none failed. The editor opens
    // the workspace.
    RosterRowAvailabilityAvailable available = 2;
    // The bring-up ended without a session: the link went dead before it
    // ever connected, and no bring-up is under way. The editor still opens the workspace, and the row's
    // status arm (`start_failed`) is what it draws.
    RosterRowAvailabilityUnavailable unavailable = 3;
  }
}

// The session is still being brought up; the workspace is not opened yet.
message RosterRowAvailabilityPending {}

// The workspace has nothing more to wait for; the workspace is opened.
message RosterRowAvailabilityAvailable {}

// The bring-up ended without a session; the workspace is opened and draws
// its start failure.
message RosterRowAvailabilityUnavailable {}

// The selected workspace, by identity. Compared against RosterRowWorkspace,
// never against a display name, which is not unique.
message RosterCurrentWorkspace {
  // The selected workspace's identity, imported — the join key, never a
  // display path (the row's own elements carry what is drawn).
  workspace.v1.WorkspaceRef workspace = 1;
}


// The rail's one grouping: the open workspaces, one section per repository,
// in the order they render.
message RosterRepositoryView {
  // One section per repository, in the repositories' stored order
  // (agentrepl.v1.ArrangeSidebar). Clients do not re-sort.
  repeated RosterRepoSection sections = 1;
  // How many rows the open-workspaces section lists (RosterOpenCount).
  // Always set.
  RosterOpenCount open_count = 2;
}

// The open-workspaces section: the heading over the repository sections,
// drawn like the hidden and recently-merged sections' (fold toggle and label),
// with RosterRepositoryView.open_count beside the label whether the section
// is folded or not (owner request, 2026-10-13).
message RosterOpenSection {
  RosterLabel label = 1;
  // WHETHER THE SECTION IS FOLDED. DAEMON-HELD (UpdateSidebarView), so every
  // page draws the same fold. It folds the SIDEBAR's rows only: the Emacs
  // tab bar draws an open workspace whichever arm is set. Never folded or
  // unfolded by anyone, it is EXPANDED. Never unset on the wire.
  oneof fold {
    // The repository sections are shown.
    RosterOpenSectionExpanded expanded = 2;
    // The repository sections are folded away; the header and its count stay.
    RosterOpenSectionCollapsed collapsed = 3;
  }
  // `workspaces` (4) and `merge_queues` (5), the `shows` oneof, and
  // `merge_queue_paused` (6) are RETIRED and reserved: they drew a toggle on
  // the section's header line between the repository sections' workspaces
  // and their merge queues, and colored it while a queue was paused. The
  // merge queues are drawn in the merge queue section instead
  // (RosterMergedSection.queues, owner request 2026-10-26), whose header
  // carries the pause (RosterMergedSection.merge_queue_paused).
  reserved 4, 5, 6;
  reserved "workspaces", "merge_queues", "merge_queue_paused";
}

// An expanded open-workspaces section. DELIBERATELY EMPTY: the arm is the fact.
message RosterOpenSectionExpanded {}

// A collapsed open-workspaces section. DELIBERATELY EMPTY: the arm is the fact.
message RosterOpenSectionCollapsed {}

// How many rows the open-workspaces section lists: every open row of every
// repository section, nested family rows included. It is
// the sum of the repository sections' counts
// (RosterSectionCount), so it is the number a person arrives at by counting
// every entry, a folded section's included.
message RosterOpenCount {
  uint32 workspaces = 1;
}

// One repository's section: identity, header, rows.
message RosterRepoSection {
  // The repository's stable identity — the fold key and the join key; a
  // section can be relabelled without becoming a different section.
  RosterRepoKey key = 1;
  // The header box: label and fold toggle.
  RosterSectionHeader header = 2;
  // `rows` (field 3) is RETIRED and reserved: rows of every state shared one
  // type. `open_rows` (field 8) and `subsections` (field 7) are RETIRED and
  // reserved: they carried the unsectioned rows and the subsections as two
  // lists, which could only say "the rows, then the subsections". The
  // section's body is `entries`, one list in drawn order.
  reserved 3, 7, 8;
  reserved "rows", "open_rows", "subsections";
  // THE SECTION'S BODY, IN DRAWN ORDER, below the header: the repository's
  // top-level open rows in no subsection and its subsections, INTERLEAVED as
  // the user arranged them (agentrepl.v1.ArrangeSidebar), so a subsection may
  // sit between two unsectioned rows. Every subsection is listed, one with no
  // rows included, so a workspace can be dragged into it. The Emacs tab bar
  // walks the same order: entry by entry, a subsection's rows where the
  // subsection stands. The section's header count covers every entry's rows,
  // and its fold folds them all.
  repeated RosterRepoEntry entries = 9;
  // `workspaces` (10) and `merge_queue` (11), the `shows` oneof, are RETIRED
  // and reserved: the section's body was its entries or, while the retired
  // toggle stood (RosterOpenSection), its merge queue. The body is always
  // its entries, and the queue is drawn in the merge queue section
  // (RosterMergedSection.queues, owner request 2026-10-26).
  reserved 10, 11;
  reserved "workspaces", "merge_queue";
  // WHETHER THE SECTION IS FOLDED. DAEMON-HELD (UpdateSidebarView), because two
  // surfaces draw it: the sidebar hides a collapsed section's rows, and the
  // Emacs tab bar hides that repository's workspaces from its tabs, numbering
  // and navigation. Never unset on a wire section.
  oneof fold {
    // The rows are shown, and the repository's workspaces have tabs.
    RosterRepoSectionExpanded expanded = 4;
    // The rows are hidden, and the repository's workspaces have no tabs on
    // the bar (their sessions are untouched).
    RosterRepoSectionCollapsed collapsed = 5;
  }
  // How far the repository's primary branch stands from its upstream, drawn
  // as the hover text over the header's label. The daemon measures it in the
  // background (a fetch of the upstream's remote, then a count), once at
  // startup and every five minutes after, so it may be up to that old. Always
  // set: a repository not yet measured carries the pending arm.
  RosterRepoDivergence divergence = 6;
}

// ONE REPOSITORY'S MERGE QUEUE as the merge queue section draws it (owner
// requests, 2026-10-25 and 2026-10-26): a small merge bubble for the merge at
// the head of the line,
// then every merge waiting behind it, in the order it will run -- the same
// line agentrepl.v1.MergeQueueStatus.entries reads. A merge only REQUESTED,
// its asking turn still running, is in no line and is not listed.
//
// EVERY MERGE IS CREDITED AS THE REST OF THE ROSTER CREDITS IT: to the
// workspace landing its own branch, or, for an async merge, to the workspace
// that asked for it, which carries the `async_merging` marker in the
// workspaces view (RosterRow.async_merging). A hidden merge workspace is never
// named, drawn or selected here.
//
// A queue whose line holds no merge is not drawn
// (RosterMergedSection.queues), paused or not.
message RosterRepoMergeQueue {
  // Tag 1 (`rows`, every merge in line drawn as a workspace row) is RETIRED:
  // the queue is drawn as its head and its waiting merges.
  reserved 1;
  reserved "rows";
  // The merge at the head: the merge at the front of the line. A queue is
  // listed only while its line holds a merge, so a listed queue ALWAYS
  // carries its head; an unset head there is malformed. (A failed merge no
  // longer stands at the head of an empty line, owner request 2026-10-27:
  // a repository leaves the section as soon as its line empties.)
  optional RosterMergeQueueHead head = 2;
  // Every merge waiting behind the head, in the order it will run.
  repeated RosterMergeQueueWaiting waiting = 3;
  // PRESENT while the queue is paused: merges still join it, but nothing
  // runs until it is resumed.
  optional RosterMergeQueuePaused paused = 4;
}

// The queue is paused: when, by whom, and whether the pause was a hard stop.
// The sidebar draws the repository's label in the error red and the queue's
// merge glyphs in `render-colors.json#paused_merge_mark`'s ink while it
// stands, says who paused it and when on the label's hover, and resumes the
// queue on a click of the label (owner request, 2026-10-27).
message RosterMergeQueuePaused {
  // When the queue was paused, epoch ms. A paused head's clock stops here.
  // UNSET for a pause recorded before the daemon kept its instant
  // (2026-10-27); the head's clock is then not drawn.
  optional int64 paused_at_ms = 1;
  // Who paused the queue. UNSET for a pause recorded before the daemon kept
  // who asked (2026-10-27).
  optional RosterMergeQueuePauser by = 2;
  // TRUE for a hard stop (agentrepl.v1.UpdateMergeQueuePause.hard): the work
  // the queue's merges were doing was stopped too.
  bool hard = 3;
}

// WHO PAUSED A QUEUE. THE ARM IS THE ASKER. Never unset.
message RosterMergeQueuePauser {
  oneof asker {
    // The user, from the editor or the webapp.
    RosterMergeQueuePauserUser user = 1;
    // A workspace's agent, from `agent-repld`'s command line.
    RosterMergeQueuePauserWorkspace workspace = 2;
  }
}
// The user paused the queue. DELIBERATELY EMPTY: the arm is the fact.
message RosterMergeQueuePauserUser {}
// A workspace's agent paused the queue.
message RosterMergeQueuePauserWorkspace {
  // The workspace's name as it stood when it paused the queue, drawn
  // verbatim.
  string name = 1;
}

// Which workspace a merge in the queue is credited to, and where a click on
// it goes.
message RosterMergeQueueSubject {
  // The workspace the merge is credited to (see RosterRepoMergeQueue). A
  // click selects it.
  workspace.v1.WorkspaceRef workspace = 1;
  // That workspace's name, drawn verbatim.
  string name = 2;
  // The merge bubble's head row on that workspace's root feed, which a click
  // brings on screen and opens once the workspace is selected
  // (agentrepl.v1.SelectWorkspaceRequest.reveal). UNSET for a merge this
  // daemon holds no bubble identity for; a click then only selects.
  optional FeedId reveal = 3;
  // How the merge runs: in place, or in a hidden merge workspace.
  RosterMergeQueueMode mode = 4;
}

// How a merge in the queue runs. THE ARM IS THE MODE.
message RosterMergeQueueMode {
  oneof mode {
    // The workspace landing its own branch in place.
    RosterMergeQueueModeSync sync = 1;
    // An async merge, run in a hidden merge workspace.
    RosterMergeQueueModeAsync async = 2;
  }
}
// In place. No fields.
message RosterMergeQueueModeSync {}
// Async. No fields.
message RosterMergeQueueModeAsync {}

// THE HEAD OF THE QUEUE, drawn as a small merge bubble: who it is, the stages
// it has been through, and where it stands.
message RosterMergeQueueHead {
  RosterMergeQueueSubject subject = 1;
  // The merge's stages so far, in the order each began, read from the
  // merge's ledger: one per top-level tab of its bubble, the rebasing and
  // the tests tab each drawn once over all its rounds (a conflict resolution
  // is part of the rebasing stage and a fixing attempt part of the tests
  // stage). Empty while the merge has not been admitted.
  repeated RosterMergeQueueStage stages = 2;
  // WHERE THE HEAD STANDS. THE ARM IS THE STANDING. Never unset.
  oneof standing {
    // At the front of the line, not yet admitted: the queue is paused, or
    // its admission has not run yet.
    RosterMergeQueueHeadWaiting waiting = 3;
    // Being worked on.
    RosterMergeQueueHeadMerging merging = 4;
  }
  // Tag 5 (`failed`, the failed merge standing at the head of an empty line)
  // is RETIRED (2026-10-27): a queue whose line is empty is not listed.
  reserved 5;
  reserved "failed";
}

// The head waits at the front of the line.
message RosterMergeQueueHeadWaiting {
  // When the merge was put in line, epoch ms. The client ticks how long it
  // has waited from it.
  int64 queued_at_ms = 1;
}

// The head is being worked on.
message RosterMergeQueueHeadMerging {
  // The step the merge stands on and its figure, in plain words, composed by
  // the daemon from the merge's own facts ("rebasing 3/7", "fixing attempt
  // 2/3") and drawn verbatim. UNSET while the merge's facts have not named a
  // step yet.
  optional string step = 1;
  // PRESENT while NOTHING of the merge's work runs: its queue is paused and
  // no turn of the step it stands on is running. A pause suspends a merge's
  // own steps but leaves a step's agent turn running until it ends or a hard
  // stop interrupts it (agentrepl.v1.UpdateMergeQueuePause.hard), so a
  // paused merge whose turn still runs is not suspended. The sidebar draws a
  // suspended merge's live stage as a still grey dot rather than the
  // breathing purple one (owner request, 2026-10-27).
  optional RosterMergeQueueHeadSuspended suspended = 2;
}

// Nothing of the head's work runs. DELIBERATELY EMPTY: presence is the fact.
message RosterMergeQueueHeadSuspended {}

// ONE STAGE of the head's merge.
message RosterMergeQueueStage {
  // The stage's words ("queue", "rebasing", "tests", "committing"), drawn
  // verbatim.
  string label = 1;
  // The 1-based round of a stage drawn once per round (a second committing
  // is "committing (2)"); the client decorates rounds beyond the first and
  // draws nothing for round 1. Always 1 for the rebasing and the tests stage.
  uint32 round = 2;
  // THE ARM IS THE STAGE'S STATE. Never unset.
  oneof state {
    RosterMergeQueueStageLive live = 3;
    RosterMergeQueueStageSucceeded succeeded = 4;
    RosterMergeQueueStageFailed failed = 5;
  }
}
// The stage is running.
message RosterMergeQueueStageLive {
  // When it began, epoch ms. The client ticks its elapsed time from it.
  int64 started_at_ms = 1;
}
// The stage ended and succeeded.
message RosterMergeQueueStageSucceeded {
  int64 started_at_ms = 1;
  int64 ended_at_ms = 2;
}
// The stage ended and did not succeed: it failed, the merge started over from
// it because its target moved, or the merge was abandoned during it.
message RosterMergeQueueStageFailed {
  int64 started_at_ms = 1;
  int64 ended_at_ms = 2;
}

// ONE MERGE WAITING behind the head.
message RosterMergeQueueWaiting {
  RosterMergeQueueSubject subject = 1;
  // When it was put in line, epoch ms.
  int64 queued_at_ms = 2;
  // TRUE when it was put in line at the front
  // (agentrepl.v1.MergeQueuePlacementFront).
  bool placed_at_front = 3;
}

// One entry of a repository section's body: a top-level row in no
// subsection, or a subsection with its own rows below its header.
message RosterRepoEntry {
  // THE ARM IS WHAT STANDS AT THIS POINT OF THE SECTION. Unset is malformed.
  oneof entry {
    // One top-level open workspace in no subsection, its family nested
    // under it.
    RosterOpenRow row = 1;
    // One subsection.
    RosterSubsection subsection = 2;
  }
}

// One subsection of a repository's section: what kind it is, header, rows.
// Its rows nest by lineage among the subsection's own workspaces, as a
// section's rows do among its own.
message RosterSubsection {
  // `key` (field 1) is RETIRED and reserved: only a named subsection has a
  // stored identity, so the key lives on that arm (kind.named).
  reserved 1;
  reserved "key";
  // WHAT KIND OF SUBSECTION THIS IS. THE ARM IS THE KIND; unset is malformed.
  // The kinds differ in everything identity-bound: only a named subsection
  // can be named in agentrepl.v1.ArrangeSidebar (renamed, moved, deleted, a
  // destination or an anchor) and folded through
  // agentrepl.v1.UpdateSidebarView.
  oneof kind {
    // A subsection the user created and named (ArrangeSidebar), with its
    // stored identity.
    RosterSubsectionNamed named = 7;
    // The repository's one-shot subsection, derived from the one-shot mark.
    RosterSubsectionOneShot one_shot = 8;
  }
  // The header box: the user's name for it, and the count of the rows it
  // shows (RosterSectionCount, counted as a repository section's is).
  RosterSectionHeader header = 2;
  // `rows` (field 3) is RETIRED and reserved, as RosterRepoSection's is.
  reserved 3;
  reserved "rows";
  // The subsection's open workspaces below the header, in drawn order. A
  // collapsed subsection still lists them, each with a folded tab.
  RosterOpenRows open_rows = 4;
  // WHETHER THE SUBSECTION IS FOLDED. DAEMON-HELD (UpdateSidebarView), for
  // the same two readers as a repository section's fold: the sidebar hides a
  // collapsed subsection's rows, and the Emacs tab bar hides its workspaces
  // from its tabs, numbering and navigation (each open row's tab is folded).
  // A collapsed repository folds its subsections' rows whatever each
  // subsection's own fold says. Never unset on a wire subsection.
  oneof fold {
    // The rows are shown, and the subsection's workspaces have tabs (unless
    // the repository is collapsed).
    RosterSubsectionExpanded expanded = 5;
    // The rows are hidden, and the subsection's workspaces have no tabs on
    // the bar.
    RosterSubsectionCollapsed collapsed = 6;
  }
}

// An expanded subsection, and whether its header's fold gesture may collapse
// it.
message RosterSubsectionExpanded {
  // WHETHER A COLLAPSE MAY BE ASKED FOR. A collapse stands down the sessions
  // of the workspaces the subsection holds and hides their tabs, so the
  // subsection holding the CURRENT workspace never collapses: the daemon
  // refuses the ask (agentrepl.v1.UpdateSidebarViewError.holds_current), and
  // the sidebar's fold gesture asks nothing while this arm says so. The
  // daemon resolves the arm on every push from its own selection, so it
  // follows every switch. Never unset on a wire subsection.
  oneof collapse {
    // No current workspace sits in the subsection: the gesture collapses it.
    RosterSubsectionCollapsible collapsible = 1;
    // The current workspace sits in the subsection: the gesture does nothing.
    RosterSubsectionHoldsCurrent holds_current = 2;
    // The subsection is one that never collapses, the one-shot subsection
    // (RosterSubsectionOneShot): the gesture does nothing.
    RosterSubsectionNeverCollapses never_collapses = 3;
  }
}

// An expanded subsection the fold gesture may collapse. DELIBERATELY EMPTY:
// the arm is the fact.
message RosterSubsectionCollapsible {}

// An expanded subsection holding the current workspace, which the fold
// gesture leaves expanded. DELIBERATELY EMPTY: the arm is the fact.
message RosterSubsectionHoldsCurrent {}

// An expanded subsection that is never collapsed, which the fold gesture
// leaves expanded. A collapse stands down the sessions of the workspaces it
// folds, and the one-shot subsection's workspaces are working unattended, so
// folding it would stop the work it exists to show. DELIBERATELY EMPTY: the
// arm is the fact.
message RosterSubsectionNeverCollapses {}

// A collapsed subsection. DELIBERATELY EMPTY: the arm is the fact.
message RosterSubsectionCollapsed {}

// A named subsection: one the user created through
// agentrepl.v1.ArrangeSidebar and can rename, move, fold and delete.
message RosterSubsectionNamed {
  // The subsection's stable identity: the id, never the name, so a rename
  // keeps the subsection.
  RosterSubsectionKey key = 1;
}

// A repository's ONE-SHOT SUBSECTION: its open workspaces whose family holds
// a one-shot (agentrepl.v1.SetWorkspaceOneShot, or a create with one_shot).
//
// IT IS DERIVED, NEVER STORED. Its members are exactly the open families of
// the repository in which some open member is marked one-shot, so setting or
// clearing a mark moves the row with nothing else to keep in step, a daemon
// boot draws it from the marks alone, and a family never splits across
// subsections. The subsection is present exactly while it has rows, and it is
// ALWAYS the last entry of its repository's section, after every named
// subsection and every unsectioned row.
//
// A member keeps the place it was arranged in underneath: once its family
// holds no mark, it is drawn there again, or among the repository's
// unsectioned rows when that subsection was deleted meanwhile.
//
// It has no stored identity, so ArrangeSidebar cannot name it: it is never
// renamed, moved, deleted, a destination or an anchor. A workspace enters it
// by its mark (SetWorkspaceOneShot), and leaves it by its family's marks
// being cleared, which an ArrangeSidebar placement of the family elsewhere
// does. It never collapses (RosterSubsectionNeverCollapses).
message RosterSubsectionOneShot {}

// A subsection's stable identity, echoed back as agentrepl.v1.SubsectionRef.
message RosterSubsectionKey {
  string subsection_id = 1;
}

// An expanded repository section, and whether its header's fold gesture may
// collapse it.
message RosterRepoSectionExpanded {
  // WHETHER A COLLAPSE MAY BE ASKED FOR. A collapse stands down the sessions
  // of the repository's open workspaces and hides their tabs, so the
  // repository holding the CURRENT workspace never collapses: the daemon
  // refuses the ask (agentrepl.v1.UpdateSidebarViewError.holds_current), and
  // the sidebar's fold gesture asks nothing while this arm says so. The
  // daemon resolves the arm on every push from its own selection, so it
  // follows every switch. Never unset on a wire section.
  oneof collapse {
    // No current workspace sits in the repository: the gesture collapses it.
    RosterRepoSectionCollapsible collapsible = 1;
    // The current workspace sits in the repository, in a subsection or not:
    // the gesture does nothing.
    RosterRepoSectionHoldsCurrent holds_current = 2;
  }
}

// An expanded repository section the fold gesture may collapse. DELIBERATELY
// EMPTY: the arm is the fact.
message RosterRepoSectionCollapsible {}

// An expanded repository section holding the current workspace, which the
// fold gesture leaves expanded. DELIBERATELY EMPTY: the arm is the fact.
message RosterRepoSectionHoldsCurrent {}

// A collapsed repository section. DELIBERATELY EMPTY: the arm is the fact.
message RosterRepoSectionCollapsed {}

// ---- Repository divergence: the label hover's ahead/behind count ----

// Where the repository's primary branch (workspace.v1.RepositoryRef's
// repository's default branch, the one top-level merges land on) stands
// against the remote branch it tracks. The client draws the set arm as the
// label's hover text and derives nothing from it.
message RosterRepoDivergence {
  // THE ARM IS THE MEASUREMENT'S OUTCOME. Unset is malformed.
  oneof state {
    // No measurement has finished since this daemon started.
    RosterRepoDivergencePending pending = 1;
    // The branch and its upstream were counted against each other.
    RosterRepoDivergenceCounted counted = 2;
    // The primary branch tracks no remote branch, so there is nothing to
    // count against. An ordinary answer, not a failure.
    RosterRepoDivergenceNoUpstream no_upstream = 3;
    // The last measurement could not be made; the counts it would have
    // replaced are not shown, because they could be arbitrarily stale.
    RosterRepoDivergenceFailed failed = 4;
  }
}

// No measurement has finished yet. DELIBERATELY EMPTY: the arm is the fact.
message RosterRepoDivergencePending {}

// The primary branch counted against its upstream after a fresh fetch.
message RosterRepoDivergenceCounted {
  // The primary branch's short name, e.g. "master".
  string branch = 1;
  // The upstream's short name, e.g. "origin/master".
  string upstream = 2;
  // Commits on the primary branch that its upstream does not have.
  uint32 ahead = 3;
  // Commits on the upstream that the primary branch does not have.
  uint32 behind = 4;
}

// The primary branch tracks no upstream.
message RosterRepoDivergenceNoUpstream {
  // The primary branch's short name, e.g. "master".
  string branch = 1;
}

// The last measurement failed.
message RosterRepoDivergenceFailed {
  // What failed, in words fit for the hover (the daemon's log carries the
  // full evidence under daemon.repodivergence.*).
  string reason = 1;
}

// A repository's stable identity — the imported join key (and the echo
// token CreateWorkspace takes back).
message RosterRepoKey {
  workspace.v1.RepositoryRef repository = 1;
}

// The recently-merged section: header and one group per repository. It has
// no key of its own — the roster carries exactly one, so its fold identity is
// fixed. It holds the 100 MOST RECENT merges (owner ruling, 2026-10-15): an
// older merge is drawn in no section, and leaves the band in the push that
// carries the newer merge displacing it.
//
//   ▾ Recently Merged            (2)        RosterMergedSection
//     repo-a                                  RosterMergedRepoGroup → header
//       ✓ merged-row               3m           RosterRow
//     repo-b                                  RosterMergedRepoGroup → header
//       ✓ merged-row               1d           RosterRow
//
// THE REPOSITORY FOLD IS THE ONLY FOLD A GROUP HAS. A group draws no fold
// toggle of its own: collapsing a repository's section
// (RosterRepoSection.fold) takes that repository's group out of this band,
// and expanding it puts the group back. The band's own fold still folds the
// whole band.
message RosterMergedSection {
  // The section's label, "Merge Queue", drawn in the purple of a merge in
  // progress whatever its queues stand at. It carries NO COUNT (its `count`
  // is unset): each queue group counts its own line
  // (RosterMergeQueueRepoGroup.count, owner request 2026-10-27).
  RosterSectionHeader header = 1;
  reserved 2;
  reserved "rows";
  // One group per repository that has at least one merged workspace, in the
  // repository sections' order (by repository name, then id). A repository
  // with no merged workspace has no group. Rows are FLAT within a group, most
  // recently merged first: a settled merge has no family left to draw.
  //
  // A COLLAPSED REPOSITORY'S GROUP STILL RIDES THE WIRE, on the
  // RosterMergedRepoGroupRepositoryCollapsed arm, so every reader that walks
  // the roster's rows (the merge-queue verb's lookups, the editor's
  // workspace switcher) still sees every merged workspace; only the sidebar
  // leaves the group undrawn.
  repeated RosterMergedRepoGroup groups = 5;
  // THE MERGE QUEUES, drawn at the top of the section above the merged
  // groups (owner request, 2026-10-26): one group per repository whose line
  // holds a merge, in the repository sections' order. A repository whose
  // line is empty is not listed, paused or not. A queue group does NOT
  // follow its repository's fold: a merge in flight is drawn whichever way
  // its repository is folded.
  repeated RosterMergeQueueRepoGroup queues = 6;
  // The heading drawn over the merged groups, below the queues, while any
  // group is drawn: "Recently Merged". Always set.
  RosterLabel merged_label = 7;
  // Tag 8 (`merge_queue_paused`, the section-wide pause marker) is RETIRED
  // (2026-10-27): each queue carries its own pause
  // (RosterRepoMergeQueue.paused), drawn on its own group.
  reserved 8;
  reserved "merge_queue_paused";
  // WHETHER THE BAND IS FOLDED. DAEMON-HELD (UpdateSidebarView), because a
  // fold is no page's own: opening it in one workspace's page opens it in
  // every page (owner ruling, 2026-10-06). Never folded or unfolded by
  // anyone, it is COLLAPSED: settled history spends no rail height until it
  // is asked for. Never unset on the wire.
  oneof fold {
    // The merged rows are shown.
    RosterMergedSectionExpanded expanded = 3;
    // The merged rows are hidden; the header and its count stay.
    RosterMergedSectionCollapsed collapsed = 4;
  }
}

// ONE REPOSITORY'S MERGE QUEUE inside the merge queue section: the
// repository's label over its queue.
message RosterMergeQueueRepoGroup {
  // The repository's stable identity, the same key its RosterRepoSection
  // carries.
  RosterRepoKey key = 1;
  // The group's header box: the repository's label, with no fold toggle.
  RosterMergedRepoGroupHeader header = 2;
  // The repository's queue.
  RosterRepoMergeQueue queue = 3;
  // THE MERGES IN LINE on this queue, the head and every merge waiting
  // behind it, drawn as "(N)" beside the repository's label (owner request,
  // 2026-10-27). Always set.
  RosterSectionCount count = 4;
}

// An expanded recently-merged band. DELIBERATELY EMPTY: the arm is the fact.
message RosterMergedSectionExpanded {}

// A collapsed recently-merged band. DELIBERATELY EMPTY: the arm is the fact.
message RosterMergedSectionCollapsed {}

// One repository's merged workspaces inside the recently-merged band.
message RosterMergedRepoGroup {
  // The repository's stable identity, the same key its RosterRepoSection
  // carries. A client holding an in-flight fold of that repository section
  // applies it to this group too, so the group leaves or returns with the
  // section on the gesture, not a push later.
  RosterRepoKey key = 1;
  // The group's header box: the repository's label, with no fold toggle.
  RosterMergedRepoGroupHeader header = 2;
  // `rows` (field 3) is RETIRED and reserved, as RosterRepoSection's is.
  reserved 3;
  reserved "rows";
  // The repository's merged workspaces, most recently merged first.
  RosterMergedRows merged_rows = 6;
  // WHETHER THE SIDEBAR DRAWS THE GROUP, resolved from the repository's own
  // fold (the same daemon-held fact as RosterRepoSection.fold, resolved in the
  // same render, so the two never disagree). Never unset on the wire.
  oneof drawn {
    // The repository is expanded: the group is drawn under the band.
    RosterMergedRepoGroupShown shown = 4;
    // The repository is collapsed: the group is not drawn, and its rows are
    // neither counted by the band's header nor drawn by the band. Its
    // workspaces are off the Emacs tab bar, as every workspace of a collapsed
    // repository is.
    RosterMergedRepoGroupRepositoryCollapsed repository_collapsed = 5;
  }
}

// A merged or queue group's header: the repository's label, and nothing to
// toggle.
message RosterMergedRepoGroupHeader {
  // The repository's display name, as its RosterRepoSection's header draws it.
  RosterLabel label = 1;
}

// A shown merged group: its repository is expanded. DELIBERATELY EMPTY: the
// arm is the fact.
message RosterMergedRepoGroupShown {}

// An undrawn merged group: its repository's section is collapsed.
// DELIBERATELY EMPTY: the arm is the fact.
message RosterMergedRepoGroupRepositoryCollapsed {}

// The hidden-workspaces section: header and rows. It has no key of its own --
// the roster carries exactly one, so its fold identity is fixed.
//
// A SECTION WITH NO ROWS IS NOT DRAWN: the wire always carries it, and the
// client leaves it out of the rail until a workspace is hidden.
//
// Its rows are nested by branch lineage among the hidden workspaces alone,
// as a repository section's are among its own, so a hidden family keeps its
// shape. Clicking a row here asks SetWorkspaceHidden to show it again.
message RosterHiddenSection {
  // The label and the count a folded section draws beside it.
  RosterSectionHeader header = 1;
  // `rows` (field 2) is RETIRED and reserved, as RosterRepoSection's is.
  reserved 2;
  reserved "rows";
  // The hidden workspaces, the latest hide first.
  RosterHiddenRows hidden_rows = 5;
  // WHETHER THE SECTION IS FOLDED. DAEMON-HELD (UpdateSidebarView), so every
  // page draws the same fold. It folds the SIDEBAR's rows only: a hidden
  // workspace is off the Emacs tab bar whichever arm is set. Never folded or
  // unfolded by anyone, it is EXPANDED, so a hidden workspace stays in reach
  // of the click that shows it again. Never unset on the wire.
  oneof fold {
    // The hidden rows are shown in the sidebar.
    RosterHiddenSectionExpanded expanded = 3;
    // The hidden rows are folded away; the header and its count stay.
    RosterHiddenSectionCollapsed collapsed = 4;
  }
}

// An expanded hidden-workspaces section. DELIBERATELY EMPTY: the arm is the fact.
message RosterHiddenSectionExpanded {}

// A collapsed hidden-workspaces section. DELIBERATELY EMPTY: the arm is the fact.
message RosterHiddenSectionCollapsed {}

// A section header as repos and the merged section draw it.
// The fold it toggles is the SECTION's (RosterRepoSection.fold,
// RosterMergedSection.fold), never an element of the header.
message RosterSectionHeader {
  RosterLabel label = 1;
  // How many workspaces the section SHOWS UNFOLDED, drawn as "(N)" beside the
  // label while the section is FOLDED (owner request, 2026-10-08: the folded
  // count equals the rows the unfolded section shows). The client shows or
  // hides this resolved value by the section's fold; it never counts a
  // repository's rows itself. Set on every header but the Merge Queue
  // section's, which carries none (RosterMergedSection.header).
  RosterSectionCount count = 2;
}

// A section's workspace count. A repository section's is every open row of
// its rows regions, nested family rows included. A merge queue group's is the
// merges in its line. Drawn smaller than the label, in the label's own color.
message RosterSectionCount {
  uint32 workspaces = 1;
}

// A section's display label. DISPLAY ONLY, never the identity: the repo key
// beside the header is. Carried so the heading has one author.
message RosterLabel {
  string text = 1;
}


// One workspace as every list draws it: a row line (status dot, name,
// when-column, current highlight, receded styling) and its detail panel. Its
// family and its state are its list's own row type's (RosterOpenRow,
// RosterHiddenRow, RosterMergedRow).
message RosterRow {
  // The workspace this row IS — its identity, and the join key every gesture
  // on the row travels back with. Names collide across repos; dirs do not.
  RosterRowWorkspace workspace = 1;

  // The ATTENTION marker: present iff the workspace has an unseen
  // notification. The daemon sets it when an agent notification fires, and
  // clears it on EITHER of the two ways that notification becomes seen,
  // re-pushing the roster each time:
  //
  //   - SelectWorkspace names this workspace — the user looked at it;
  //   - the LAST open ask settles — a permission or a question answered by the
  //     user, or decided without them. Answering a card IS looking at the
  //     workspace, and a workspace the user never selects would otherwise wear
  //     the marker forever. While any ask is still open the marker STANDS:
  //     unseen is unseen.
  //
  // UNSEEN IS THE WHOLE MEANING. A settled ask is not an unseen notification,
  // so a row that still carries the marker after every ask has resolved is a
  // defect rather than a stale view.
  optional RosterRowAttention attention = 32;

  // The workspace's PRIORITY BADGE, resolver-composed ("P0.5", "P1", …).
  // UNSET = unprioritized (no badge). Ordering is already the resolver's;
  // this is only the drawn label.
  optional RosterRowPriorityBadge priority = 33;

  // The row's DISPLAY MODE: present = PARTIAL (the name recedes), absent =
  // FULL. See RosterRowViewed, which carries the mode's whole contract.
  optional RosterRowViewed viewed = 34;

  // The row's UNREAD-TURN-END marker: present while the row is `idle_async`
  // over a turn end whose result is unread, naming that turn end, and absent
  // otherwise. See RosterRowIdleAsyncUnread, which carries the marker's whole
  // contract.
  optional RosterRowIdleAsyncUnread idle_async_unread = 69;

  // The row's REVIVING marker: present while the daemon brings this parked
  // workspace's session back up, absent otherwise. See RosterRowReviving,
  // which carries the marker's whole contract.
  optional RosterRowReviving reviving = 35;

  // When the user LAST SELECTED this workspace: the durable selection history
  // the daemon keeps across restarts of every client. UNSET = never selected.
  // See RosterRowLastSelected, which carries the field's whole contract.
  optional RosterRowLastSelected last_selected = 37;

  // When this workspace's most recent turn ENDED: the durable turn record the
  // daemon keeps across restarts of every client. UNSET = no turn of the
  // workspace has ended yet. See RosterRowLastTurnEnded, which carries the
  // field's whole contract.
  optional RosterRowLastTurnEnded last_turn_ended = 65;

  // When this workspace was CLOSED, and by whom: the durable close record the
  // daemon keeps across restarts of every client. UNSET while the workspace
  // is open. See RosterRowClosure, which carries the field's whole contract.
  optional RosterRowClosure closure = 66;

  // When this workspace was LAST UPDATED: the latest of its durable lifecycle
  // instants and of its last status change, resolved by the daemon. ALWAYS
  // SET, because every workspace has at least its creation instant. See
  // RosterRowLastUpdated, which carries the field's whole contract.
  RosterRowLastUpdated last_updated = 67;

  // Whether this workspace may be OPENED by an editor yet: its session is
  // being brought up, is up, or could not be brought up. See
  // RosterRowAvailability, which carries the field's whole contract. ALWAYS
  // SET; a row without it is a contract breach and is rejected loudly.
  RosterRowAvailability availability = 38;

  // The row's DETACHED-WORK marker: present while detached (background) work
  // runs in this workspace, absent otherwise. See RosterRowDetachedLive,
  // which carries the marker's whole contract.
  optional RosterRowDetachedLive detached_live = 40;

  // The row's ONE-SHOT mark: present exactly when the workspace was created
  // as a one-shot, for the workspace's whole life, absent for every other
  // workspace. See RosterRowOneShot, which carries the mark's whole contract.
  optional RosterRowOneShot one_shot = 59;

  // The row's OPENING marker: present while the editor is opening this
  // workspace. See RosterRowOpening, which carries the marker's whole
  // contract.
  optional RosterRowOpening opening = 62;

  // The row's ASYNC-MERGING marker: present while the workspace's own branch
  // merges async in a hidden merge workspace, on ANY status arm. See
  // RosterRowAsyncMerging, which carries the marker's whole contract.
  optional RosterRowAsyncMerging async_merging = 64;

  // The row's MERGE-PAUSED marker: present while the row draws a merge
  // indicator and the merge queue that merge is on is paused. See
  // RosterRowMergePaused, which carries the marker's whole contract.
  optional RosterRowMergePaused merge_paused = 68;

  // The row's display name.
  RosterRowName name = 2;

  // The workspace's lifecycle AS THE DAEMON RESOLVES IT: its own RenderState
  // coarsened onto the dot vocabulary (idle and ready draw as one dot), plus
  // the two states no session drives (`none`, `inactive`). ONE RESOLVER — this
  // is no longer a second spelling kept aligned by hand with an editor-side
  // table.
  //
  // THE SET ARM IS THE STATUS. Every arm is a dedicated EMPTY message: being
  // set is the whole assertion, and a payload would be a second place for it
  // to disagree. AN UNSET ONEOF IS INVALID and is rejected LOUDLY: a row with
  // no lifecycle is a contract breach, not a default dot, and consumers throw
  // rather than draw one. Setting more than one arm is the same breach from
  // the other side.
  oneof status {
    // A prompt is committed and not yet acked by the shim.
    RosterRowStatusSubmitting submitting = 3;
    // A turn is in flight.
    RosterRowStatusThinking thinking = 4;
    // The conversation is being cleared.
    RosterRowStatusClearing clearing = 5;
    // The context is being compacted.
    RosterRowStatusCompacting compacting = 6;
    // A PERMISSION GATE: a tool call waits on the user's consent. GREEN, the
    // workspace is ready for the user: the same coarse claim as the footer's
    // `permission` status.
    RosterRowStatusPermission permission = 7;
    // A QUESTION GATE: a question batch waits on the user's answers. GREEN,
    // as `permission` is: the same coarse claim as the footer's `question`
    // status.
    RosterRowStatusQuestion question = 56;
    // The turn finished. Live detached work draws `idle_async` in its place;
    // once read it is drawn with `viewed` (see RosterRowViewed).
    RosterRowStatusDone done = 8;
    // The turn was interrupted by the user. The same read rule as `done`.
    RosterRowStatusInterrupted interrupted = 9;
    // The last turn ended by FAILING. It is a TURN END like `done` and
    // `interrupted`, with the same read rule: live detached work draws
    // `idle_async` in its place; once read it is drawn with `viewed` (see
    // RosterRowViewed). TURQUOISE (owner ruling, 2026-09-28), where the
    // other two turn ends are green. While the failed turn's FAULT stands
    // (until the next turn starts, owner ruling 2026-10-06) the row draws the
    // fault's arm instead — `vendor_blocked` or `turn_died` — so this arm is
    // drawn only for a failed turn whose fault this daemon did not see (a
    // result restored from the durable record).
    RosterRowStatusTurnFailed turn_failed = 36;
    // Live, proven usable, and idle. BOTH the idle and ready render states
    // resolve here — the sidebar draws them identically.
    RosterRowStatusReady ready = 10;
    // No foreground turn, but detached work is still running. It outranks the
    // last turn's end, read or not: a turn that ends with detached work live
    // draws this arm at once, and the turn end returns when the work ends.
    RosterRowStatusIdleAsync idle_async = 11;
    // Blocked on the vendor or the account, not on agent-repl — and ONLY
    // that (owner ruling, 2026-09-28): an api request the vendor refused or
    // failed, an account blocking limit, a rapid-refill breaker, a model
    // error, or a rejected rate limit. It is ALSO the row while a TURN the
    // vendor ended or refused stands as a fault, until the next turn starts
    // (owner ruling, 2026-10-06; the footer's `vendor_fault · vendor_error`).
    // A VENDOR FAULT: TURQUOISE, the workspace stays usable.
    RosterRowStatusVendorBlocked vendor_blocked = 12;
    // The vendor will not START: its start is being retried, was rejected,
    // or kept failing for the whole retry window, while agent-repl's own
    // services are up. A VENDOR FAULT: TURQUOISE, the workspace is usable and
    // prompts are held until the vendor starts. The footer's `vendor_fault`
    // substatus says which of the three.
    RosterRowStatusVendorFault vendor_fault = 50;
    // This machine cannot reach the network, though agent-repl's own services
    // are up. A NETWORK FAULT: BLUE, the workspace is unusable until the
    // network returns. The same coarse claim as the footer's `network_fault`.
    RosterRowStatusNetworkFault network_fault = 51;
    // The session is booting; the route is not yet proven. An EXPECTED
    // step, never a fault (owner ruling, 2026-10-13): GREY, the same mark as
    // `inactive`, and the same coarse claim as the footer's `starting`.
    RosterRowStatusInit init = 13;
    // The session's backing process is gone but the workspace is recoverable.
    RosterRowStatusSevered severed = 14;
    // Startup failed outright.
    RosterRowStatusStartFailed start_failed = 16;
    // Running and USABLE, but the daemon's view of it is compromised: a shim
    // component dropping or delaying what it observes, or a shim taken back
    // after a failed handover that never re-reported its session state.
    // TURQUOISE (owner ruling, 2026-09-28). The same coarse claim as the
    // footer's `degraded` arm.
    RosterRowStatusDegraded degraded = 17;
    // Terminal: no live session backs the workspace.
    RosterRowStatusDead dead = 18;
    // THE LAST TURN DIED WITH AGENT-REPL'S OWN MACHINERY: its vendor query
    // died, or the agent process died under it (owner ruling, 2026-10-06). An
    // AGENT-REPL FAULT: BLUE, the same coarse claim as the footer's
    // `agent_repl_fault · turn_died`. It stands until the next turn starts,
    // and like that substatus it leaves the composer open: the next prompt is
    // what ends it.
    RosterRowStatusTurnDied turn_died = 52;

    // The merge pipeline. Every merge arm draws ONE merge glyph in place of
    // the lifecycle dot (owner ruling, 2026-10-13); its ink and its motion
    // say which arm it is. No merge fact reaches the roster before the turn
    // that asked for the merge has ended, so a row goes straight to
    // merge_queued or merging.
    // A merge is actively running in this workspace. PURPLE, the glyph
    // breathes.
    RosterRowStatusMerging merging = 20;
    // The merge was asked for and holds the workspace (prompts are held), but
    // has NOT STARTED: it is enqueued behind another workspace's merge, or
    // waits for this workspace (or the one whose worktree it rebases in) to
    // fall free of its turn in flight and its detached work. PURPLE, still.
    // The footer's `merging` substatus says which.
    RosterRowStatusMergeQueued merge_queued = 21;
    // The merge failed and the workspace is back with the user. GREEN, the
    // workspace is ready to be looked at; the glyph's ink is RED, because
    // what there is to look at is a failed merge (owner ruling, 2026-10-13).
    RosterRowStatusMergeFailed merge_failed = 23;
    // The merge settled successfully. GREEN, glyph and workspace alike.
    RosterRowStatusMerged merged = 24;

    // Registered, but no session was ever created for it: there is no
    // lifecycle to report. Distinct from an unset oneof: "the resolver looked
    // and there is none" is an assertion, where an unset oneof is the absence
    // of one.
    RosterRowStatusNone none = 25;
    // INCIDENTALLY INACTIVE, never by a fault (owner ruling, 2026-10-13):
    // registered with no open perspective in Emacs and nothing live behind
    // it, or being opened by the editor right now (the row's `opening`
    // marker). GREY. Dominates every session state: a perspective-less or
    // opening workspace is inactive whatever its session is doing.
    RosterRowStatusInactive inactive = 26;
    // The vendor is retrying a call that failed mid-turn, so the session
    // cannot advance. It is a VENDOR fault, the same rung as the footer's
    // `vendor_fault.api_retrying` substatus, and draws the same turquoise
    // (usable but wrong; owner, 2026-10-02). It stands from the
    // reported failure until the retried agent's first successful response,
    // the turn's end, or a new turn opening.
    RosterRowStatusApiRetrying api_retrying = 39;

    // A close of this workspace was refused because the workspace is not
    // quiet: a turn in flight, live detached work, held prompts or a queued
    // merge. BLUE, the same coarse claim as the footer's `closing` status;
    // the footer's activity line names what blocked the close. It stands
    // until the refusal is cleared.
    RosterRowStatusClosing closing = 53;
    // The DAEMON is impaired: a fault in agent-repl's own process (its
    // state store read-only, its log sink poisoned, its state unreadable, a
    // successor that would not start) leaves it unable to serve this
    // workspace however healthy the session is. BLUE, an agent-repl fault:
    // the same coarse claim as the footer's
    // `agent_repl_fault · daemon_impaired`.
    RosterRowStatusDaemonImpaired daemon_impaired = 54;
    // The session waits on an interrupt the user sent that has not yet
    // landed. GREEN, the same coarse claim as the footer's `waiting ·
    // interrupting`; a permission, a question or a cold gate has its own arm.
    RosterRowStatusWaiting waiting = 55;
    // A COLD GATE stands between the session and its next turn: the session
    // is parked on the user's remediation choice (pay / clear / compact).
    // GREEN, the same coarse claim as the footer's `waiting · cold_gate`. The
    // row's NAME is struck through while it stands, in every sidebar section.
    //
    // A HIDDEN workspace wears it too once its cache has LAPSED with a gated
    // verdict (conversation.v1.SessionCacheLapse): its session was stood down
    // at the lapse, and showing it again will raise this gate (2026-10-13).
    RosterRowStatusColdGate cold_gate = 61;
  }
  // Tags 19 (`merge_enqueuing`) and 22 (`merge_conflict`) are RETIRED: no
  // merge fact is shown before the requesting turn ends, and nothing parks.
  // Tags 57 (`merge_waiting`) and 60 (`opening`) are RETIRED (owner ruling,
  // 2026-10-13): a merge that waits to start is `merge_queued`, and a
  // workspace being opened is `inactive` with the row's `opening` marker.
  // Tag 63 is RETIRED: an async merge of the workspace's own branch is the
  // row's `async_merging` marker beside its real status, never a status.
  reserved 19, 22, 57, 60, 63;
  reserved "merge_enqueuing", "merge_conflict", "merge_waiting";

  // Whether this row is the selected workspace — the row's highlight bar.
  // Redundant with a comparison against WorkspaceRoster.current and
  // deliberately so: the resolver states it once, so no client can compute
  // it differently.
  RosterRowCurrent current = 27;

  // `children` (field 28) is RETIRED and reserved: a family nests in its
  // list's own row type (RosterOpenRow.children, RosterHiddenRow.children),
  // so every member of a family is in the same list.
  reserved 28;
  reserved "children";

  // The when-column at the row's right edge.
  RosterRowWhen when = 29;

  // The expanded detail panel under the row.
  RosterRowDetail detail = 30;

  // Whether the row renders RECEDED (greyed): the workspace exists and is
  // switchable, but its agent-repl panes are dismissed. Deliberately NOT a
  // status arm: closed is orthogonal to the lifecycle — a closed workspace
  // still has one.
  RosterRowClosed closed = 31;

  // Tag 58 (`merge_workspace`) is RETIRED: a merge workspace's row no longer
  // wears a "merge → <target>" marker between its name and its when-column
  // (owner request, 2026-10-11).
  reserved 58;
  reserved "merge_workspace";
}

// The workspace a row is — the imported join key every workspace-addressed
// call echoes back.
//
// `repository` (field 2) is RETIRED and reserved: it existed for the retired
// viewed band (WorkspaceRoster), whose rows sat in no repository section
// (2026-10-12).
message RosterRowWorkspace {
  reserved 2;
  reserved "repository";
  workspace.v1.WorkspaceRef workspace = 1;
}

// A row's display name. Never an identity or a join key.
message RosterRowName {
  string text = 1;
}

// When the user last selected the workspace, in epoch MILLISECONDS: the
// instant the daemon stamped on the most recent SelectWorkspace naming it,
// read from the durable workspace record, so it survives a restart of the
// daemon and of every client.
//
// It is SELECTION RECENCY, and it exists so a client can order workspaces
// most-recently-selected first -- which workspace to select when the selected
// one closes, and the editor's jump to the most recent workspace. Clients
// order by it and never derive it, and never draw it: the when-column is
// RosterRowWhen, which deliberately shows activity, not viewing.
//
// A selection moves it (SelectWorkspace re-pushes the roster); re-selecting
// the current workspace does not. It is set on closed rows too, so a client
// that must skip closed workspaces does so by RosterRowClosed, not by absence.
message RosterRowLastSelected {
  // The selection instant, epoch milliseconds.
  int64 at_ms = 1;
}

// When the workspace's most recent turn ended, in epoch MILLISECONDS: the
// close instant of its latest turn, of any close kind (finished, interrupted
// or failed), read from the durable turn record, so it survives a restart of
// the daemon and of every client.
//
// It is FINISH RECENCY, and it exists so a client can find the workspace that
// most recently finished work -- the editor's jump to the workspace that most
// recently went from working to done. A client pairs it with the row's
// status arm: the instant says WHEN the last turn ended, the arm says how the
// workspace stands NOW, so a workspace whose next turn is already running is
// excluded by its arm, not by this field. Clients order by it and never
// derive it, and never draw it: the when-column is RosterRowWhen.
//
// A turn START does not move it, and selecting the workspace does not move
// it; only a turn closing does. The status arm is resolved from the daemon's
// live view of the close while this instant is read from the durable turn
// record, so a client must not treat a turn-end arm as proof the field is
// set: a row without it has no recorded close to rank by. It is set on
// closed rows too, so a client that must skip closed workspaces does so by
// RosterRowClosed, not by absence.
message RosterRowLastTurnEnded {
  // The instant the workspace's most recent turn closed, epoch milliseconds.
  int64 at_ms = 1;
}

// When the workspace was closed, in epoch MILLISECONDS, and WHO closed it:
// read from the durable workspace record, so it survives a restart of the
// daemon and of every client.
//
// It exists so a client can tell the workspaces the USER put away from the
// ones the daemon or an agent closed on its own -- the editor's workspace
// switcher offers the most recently user-closed ones beside the open ones.
// Clients order and filter by it and never draw it.
//
// THE FIRST CLOSE IS THE ONE RECORDED: closing a workspace that is already
// closed moves nothing, except that a USER close takes over a close the user
// did not make (the user killing a workspace the daemon had closed). A
// re-open clears it. UNSET on an open workspace, and on a closed one whose
// close predates the record (the daemon cannot vouch for when, or by whom).
message RosterRowClosure {
  // The close instant, epoch milliseconds.
  int64 at_ms = 1;
  // Who closed it. THE SET ARM IS THE CAUSE; an unset oneof is a contract
  // breach and is rejected loudly.
  oneof by {
    // The user's own gesture: CloseWorkspace or KillWorkspace.
    RosterRowClosureByUser user = 2;
    // An agent's request, through a workspace command file.
    RosterRowClosureByAgent agent = 3;
    // The merge that landed the workspace closed it.
    RosterRowClosureByMerge merge = 4;
    // The daemon itself, unasked: the workspace's directory was gone.
    RosterRowClosureByDaemon daemon = 5;
  }
}

// When the workspace was LAST UPDATED, in epoch MILLISECONDS: the LATEST of
// every instant at which something happened to it, resolved by the daemon so
// every client ranks by the same value. The instants it covers:
//
//   - its creation;
//   - its latest turn start or turn close (any close kind: a turn resolving);
//   - its close, kill, hide and merge landing (the durable close record, the
//     hidden instant, the merge's landing);
//   - its latest STATUS CHANGE: the instant the row's status arm last moved
//     (an open, a re-open, a permission ask, a fault), kept durable by the
//     daemon so it survives a restart of the daemon and of every client.
//
// It is UPDATE RECENCY, and it exists so a client can order workspaces
// most-recently-updated first -- the editor's workspace switcher (owner
// request, 2026-10-14). Clients order by it and never derive it, and never
// draw it: the when-column is RosterRowWhen.
//
// SELECTING the workspace does not move it: viewing is not an update, and
// selection recency is RosterRow.last_selected. It only ever moves forward.
message RosterRowLastUpdated {
  // The instant of the workspace's latest update, epoch milliseconds.
  int64 at_ms = 1;
}

// The user closed the workspace. DELIBERATELY EMPTY: the arm is the fact.
message RosterRowClosureByUser {}

// An agent closed the workspace. DELIBERATELY EMPTY: the arm is the fact.
message RosterRowClosureByAgent {}

// The workspace's merge closed it. DELIBERATELY EMPTY: the arm is the fact.
message RosterRowClosureByMerge {}

// The daemon closed the workspace unasked. DELIBERATELY EMPTY: the arm is the
// fact.
message RosterRowClosureByDaemon {}

// The row's selected-workspace highlight.
message RosterRowCurrent {
  bool current = 1;
}

// The when-column: ONE value, chosen by the daemon. The daemon's precedence
// is: MERGED wins ("the workspace is done" is the more interesting fact);
// else HIDDEN (a workspace in the hidden section counts from when it was
// hidden, owner request 2026-10-13); else, for every row of the open
// workspaces section, the WORK CLOCK: SYNC_MERGING while a sync merge stands
// in the workspace (owner request, 2026-10-14), counting from when the merge
// joined its repository's queue, and covering the turns the merge itself runs
// (its configured prompts, conflict resolution, fixing); else TURN_RUNNING
// while a turn runs (owner request, 2026-10-13), counting from the very
// instant the footer's turn clock counts from
// (frontend.v1.FooterClock.turn_started_at_ms), so the two read the same
// number; NO_TURN_RUNNING otherwise, drawn "0s". The client renders whichever
// arm arrives and applies no precedence of its own. Never unset.
//
// `turn_ended` (field 5) and `created` (field 4) are RETIRED and reserved:
// the open workspaces section counted the time since the last turn ended, or
// since the workspace was created before its first turn ended; it now shows
// the running turn's duration (2026-10-13).
//
// `active` (field 3) is RETIRED and reserved: it carried the most recent turn
// START or close, so the age reset to zero the moment a turn began and read
// as time-since-work-began rather than time-since-work-ended (2026-10-11).
//
// `last_selected` (field 1) is RETIRED and reserved: the column showed
// viewing-recency, which reset on every SelectWorkspace and read as a broken
// clock (2026-09-14). The selection instant the roster orders by is
// RosterRow.last_selected.
//
// `viewed` (field 6) is RETIRED and reserved: the retired viewed band's
// time-since-last-viewed arm (2026-10-12).
message RosterRowWhen {
  reserved 1, 3, 4, 5, 6;
  reserved "last_selected", "active", "created", "turn_ended", "viewed";
  oneof shown {
    RosterRowWhenMerged merged = 2;
    RosterRowWhenHidden hidden = 7;
    RosterRowWhenTurnRunning turn_running = 8;
    RosterRowWhenNoTurnRunning no_turn_running = 9;
    RosterRowWhenSyncMerging sync_merging = 10;
  }
}

// When the workspace was moved into the hidden section, in epoch
// MILLISECONDS. Set for exactly the rows the hidden section draws.
//
// A HIDDEN WORKSPACE'S KEEP-ALIVES ARE HELD, so its prompt cache lapses on its
// own clock (the daemon sends them no more, 2026-10-13). When the daemon knows that
// moment, `cache` carries it and the column COUNTS DOWN to it ("12m 34s"),
// reading "cold cache" once it is reached, on a continuous green-to-red
// gradient: green an hour or more out, the deepest red at the lapse. Unset,
// the daemon knows no lapse (the session was stood down before it stated one,
// or never ran), and the column counts up from `at_ms` as before.
message RosterRowWhenHidden {
  int64 at_ms = 1;
  optional RosterRowWhenHiddenCache cache = 2;
}

// The hidden workspace's prompt cache lapse.
message RosterRowWhenHiddenCache {
  // When the cache lapses, in epoch MILLISECONDS. At or before now, the cache
  // is cold.
  int64 lapses_at_ms = 1;
}

// When the workspace's merge settled, in epoch MILLISECONDS.
message RosterRowWhenMerged {
  int64 at_ms = 1;
}

// A turn is running: when it started, in epoch MILLISECONDS on the daemon's
// clock, exactly the workspace's frontend.v1.FooterClock.turn_started_at_ms.
// The client ticks the elapsed time from it with the footer clock's own
// formatter, so the row and the strip read the same duration.
message RosterRowWhenTurnRunning {
  int64 started_at_ms = 1;
}

// No turn is running: the open workspaces section draws "0s". DELIBERATELY
// EMPTY: the arm is the fact.
message RosterRowWhenNoTurnRunning {}

// A SYNC merge stands in the workspace -- waiting in its repository's queue or
// being worked on -- and the row counts how long: from when the merge joined
// the queue, in epoch MILLISECONDS on the daemon's clock. The instant is the
// queue's durable record, so a daemon restart does not reset the count. The
// client ticks the elapsed time from it with the footer clock's own
// formatter, exactly as for TURN_RUNNING.
//
// SYNC ONLY: a workspace whose branch merges ASYNC is free while it merges
// (frontend.v1.RosterRowAsyncMerging), so its row keeps its turn clock.
message RosterRowWhenSyncMerging {
  int64 started_at_ms = 1;
}

// The expanded detail panel: three lines, each its own sub-element, each
// PRESENT or ABSENT by message presence rather than by an empty string. An
// absent line is omitted, not rendered blank.
message RosterRowDetail {
  RosterRowDetailBranch branch = 1;
  RosterRowDetailParentBranch parent_branch = 2;
  RosterRowDetailSummary summary = 3;

  // How many commits the workspace's branch holds beyond its merge-base with
  // the branch it was cut from. For a merged workspace, the commits its merge
  // brought into that branch, fixed when the merge landed. UNSET when the
  // daemon has no count to state.
  optional RosterRowDetailCommits commits = 4;

  // Every workspace whose recorded parent is this one, in roster order,
  // whichever section draws it (or none, for a merge past the band). A hidden
  // merge workspace is drawn nowhere and is not listed here either. EMPTY when
  // the workspace has no children: the panel then draws no children block at
  // all.
  repeated RosterRowDetailChild children = 5;
}

// One child workspace in the detail panel's children block.
message RosterRowDetailChild {
  workspace.v1.WorkspaceRef workspace = 1;
  string name = 2;

  // PRESENCE IS THE FACT: set exactly when the child's own row recedes (it is
  // closed, merged, or its session was killed), as frontend.v1.RosterRowClosed
  // states it for the row; the panel recedes the child's name the same way.
  RosterRowDetailChildReceded receded = 3;
}

// The receded marker of a detail panel child. DELIBERATELY EMPTY: presence is
// the fact.
message RosterRowDetailChildReceded {}

// The workspace's own git branch. Display only — the join key is the dir.
message RosterRowDetailBranch {
  string name = 1;
}

// The branch this workspace was cut from and merges back into. Display only.
message RosterRowDetailParentBranch {
  string name = 1;
}

// A short human summary of what the workspace is doing — the workspace's
// last prompt summary.
message RosterRowDetailSummary {
  string text = 1;
}

// The detail panel's commit-count line.
message RosterRowDetailCommits {
  // The number of commits. Zero is a real count: the branch has nothing
  // of its own yet.
  uint32 count = 1;
}

// The row's receded styling.
message RosterRowClosed {
  bool closed = 1;
}

// The roster row statuses. Each is EMPTY BY DESIGN — being set is the entire
// assertion. See RosterRow.status for what each means.

message RosterRowStatusSubmitting {}

message RosterRowStatusThinking {}

message RosterRowStatusClearing {}

message RosterRowStatusCompacting {}

// The row's status while a tool call waits on the user's consent.
message RosterRowStatusPermission {}

// The row's status while a question batch waits on the user's answers.
message RosterRowStatusQuestion {}

message RosterRowStatusDone {}

message RosterRowStatusInterrupted {}

message RosterRowStatusTurnFailed {}

message RosterRowStatusReady {}

message RosterRowStatusIdleAsync {}

message RosterRowStatusVendorBlocked {}

// The last turn died with agent-repl's own machinery.
message RosterRowStatusTurnDied {}

// The vendor is retrying a failed mid-turn call.
message RosterRowStatusApiRetrying {}

// The row's status while a close of the workspace stands refused.
message RosterRowStatusClosing {}
// The row's status while the daemon itself cannot serve the workspace.
message RosterRowStatusDaemonImpaired {}
// The row's status while the session waits on an interrupt landing.
message RosterRowStatusWaiting {}
// The row's status while the session is parked on its cold gate's answer.
message RosterRowStatusColdGate {}

message RosterRowStatusInit {}

message RosterRowStatusSevered {}


message RosterRowStatusStartFailed {}

message RosterRowStatusDegraded {}

// The vendor will not start; agent-repl is up.
message RosterRowStatusVendorFault {}

// The machine is offline; agent-repl is up.
message RosterRowStatusNetworkFault {}

message RosterRowStatusDead {}

message RosterRowStatusMerging {}

message RosterRowStatusMergeQueued {}

message RosterRowStatusMergeFailed {}

message RosterRowStatusMerged {}

message RosterRowStatusNone {}

message RosterRowStatusInactive {}
