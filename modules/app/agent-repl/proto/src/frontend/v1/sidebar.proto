// sidebar.proto — THE WORKSPACES RAIL: the sidebar's entire model, RESOLVED
// BY THE DAEMON and rendered verbatim by every webview.
//
// The daemon owns this view. It joins its own registry (which workspaces are
// registered, their dir and lineage), its own per-session lifecycle
// (RenderState, coarsened onto the dot vocabulary below), merge state and git
// facts, and the two things only Emacs can tell it — that a workspace exists
// (RegisterWorkspace) and which one is selected (SelectWorkspace), both
// agentrepl.v1 verbs. Emacs never builds, sends, or reads this message.
//
// GLOBAL, NOT PER-WORKSPACE. This is the one component whose stream carries
// no workspace: every webview (one per workspace) watches the same roster,
// and the daemon's stream order is the only order — there is no publisher
// epoch to reconcile, because there is no outside publisher.
//
// VIEW ONLY. The sidebar's clicks (open, close, create, merge, hibernate,
// navigate) are agentrepl.v1 requests with plain fields — a request type is
// agentrepl, never frontend (the drawn/called test, which stands).

syntax = "proto3";

package frontend.v1;

option go_package = "agentrepl/proto/frontend/v1;frontendv1";

// One complete, self-contained picture of the sidebar.
//
// Always whole, never a delta — the model is small, so a full replace makes a
// partially-applied roster unrepresentable.
message WorkspaceRoster {
  // The active grouping. THE SET ARM IS THE GROUPING — there is no separate
  // mode value to disagree with the payload, and the rows of the inactive
  // grouping are simply absent rather than carried and ignored.
  oneof view {
    // Group by repository: the default, one section per repo.
    RosterRepositoryView repository = 1;
    // Group by task: one section per task, workspaces filed under the task
    // they serve.
    RosterTaskView task = 2;
  }

  // Workspaces whose merge has settled, hoisted out of the grouping above and
  // rendered under BOTH views. Hoisted because a merged workspace's repo or
  // task is no longer the interesting fact about it — that it is done is.
  RosterSection recently_merged = 3;

  // Absolute worktree dir of the selected workspace — the last
  // SelectWorkspace the daemon received — empty when there is none. The dir
  // is the identity: compared against RosterRow.dir, never against a display
  // name, which is not unique.
  string current_dir = 4;

  // Absolute worktree dir the keyboard-navigation cursor rests on, empty when
  // there is none. Distinct from current_dir on purpose: the cursor moves
  // through the roster without switching workspaces.
  //
  // SUPPLIED BY A STAGE-3a RPC OR DELETED THERE: the daemon does not observe
  // Emacs's cursor unless an agentrepl.v1 verb tells it.
  string nav_dir = 5;
}

// The repository grouping's sections, in the order they render.
message RosterRepositoryView {
  // One section per repository. Order is the resolver's; clients do not
  // re-sort.
  repeated RosterRepoSection sections = 1;
}

// The task grouping's sections, in the order they render.
message RosterTaskView {
  // One section per task. Order is the resolver's; clients do not re-sort.
  repeated RosterTaskSection sections = 1;
}

// One repository's workspaces: the shared section shell, keyed by repository.
message RosterRepoSection {
  // Stable key identifying the repository, and the fold state's key. Identity,
  // not decoration: the fold a user sets must survive a roster republish, so
  // renaming what a section is CALLED can never orphan it.
  string repo_key = 1;
  // The rows, the fold, and the display label (the daemon derives the label
  // from repo_key: the project directory's basename, or the unknown-repo
  // sentinel spelled out).
  RosterSection section = 2;
}

// One task's workspaces: the shared section shell, keyed by task.
message RosterTaskSection {
  // Stable task identity. The ID is the identity, NOT the title: a task can
  // be renamed without becoming a different task.
  string task_id = 1;
  // Whether the task is complete. This axis exists ONLY here — a repository
  // is never "done", so RosterRepoSection has no counterpart and cannot be
  // asked a question that has no answer.
  bool done = 2;
  // The rows, the fold, and the display label (the task's title).
  RosterSection section = 3;
}

// The section shell every grouping shares: rows, fold, label. Used bare by
// recently_merged, which has no key of its own (the roster carries exactly
// one such section), and wrapped by the repo and task sections, which add
// theirs.
message RosterSection {
  // The section's workspaces, in render order.
  repeated RosterRow rows = 1;

  // Whether the section renders collapsed. A folded section STILL CARRIES its
  // rows — folding is a display state, so the client hides the rows rather
  // than the resolver omitting them, and unfolding needs no republish.
  //
  // FOLD STATE IS UI PREFERENCE. Carried here so the resolver, not each
  // client, decides; supplied by a stage-3a RPC or made webview-local there.
  bool folded = 2;

  // The section's human display label. DISPLAY ONLY, and never the identity:
  // the repo key or task id beside this shell is. Carried rather than derived
  // client-side so the heading has one author; empty when the resolver has
  // no label to offer.
  string label = 3;
}

// One workspace in the sidebar.
message RosterRow {
  // Absolute worktree dir. THE IDENTITY, and the join key to every
  // workspace-scoped stream and command: a gesture on this row travels back to
  // the daemon as this dir. Names collide across repos; dirs do not.
  string dir = 1;

  // Display name, for rendering only. Never an identity or a join key.
  string name = 2;

  // The workspace's lifecycle AS THE DAEMON RESOLVES IT: its own RenderState
  // coarsened onto the dot vocabulary (idle and ready draw as one dot), plus
  // the two states no session has (`none`, `inactive`). ONE RESOLVER — this
  // is no longer a second spelling kept aligned by hand with an editor-side
  // table.
  //
  // THE SET ARM IS THE STATUS. Every arm is a dedicated EMPTY message: being
  // set is the whole assertion, and a payload would be a second place for it
  // to disagree. AN UNSET ONEOF IS INVALID and is rejected LOUDLY: a row with
  // no lifecycle is a contract breach, not a default dot, and consumers throw
  // rather than draw one. Setting more than one arm is the same breach from
  // the other side.
  oneof status {
    // A prompt is committed and not yet acked by the shim.
    RosterRowStatusSubmitting submitting = 3;
    // A turn is in flight.
    RosterRowStatusThinking thinking = 4;
    // The conversation is being cleared.
    RosterRowStatusClearing clearing = 5;
    // The context is being compacted.
    RosterRowStatusCompacting compacting = 6;
    // A tool-permission request is waiting on the user.
    RosterRowStatusPermission permission = 7;
    // The turn finished and its response is unread.
    RosterRowStatusDone done = 8;
    // The turn was interrupted by the user.
    RosterRowStatusInterrupted interrupted = 9;
    // Live, proven usable, and idle. BOTH the idle and ready render states
    // resolve here — the sidebar draws them identically.
    RosterRowStatusReady ready = 10;
    // No foreground turn, but detached work is still running.
    RosterRowStatusIdleAsync idle_async = 11;
    // Blocked on the vendor or the account, not on agent-repl.
    RosterRowStatusVendorBlocked vendor_blocked = 12;
    // Starting up; the route is not yet proven.
    RosterRowStatusInit init = 13;
    // The session's backing process is gone but the workspace is recoverable.
    RosterRowStatusSevered severed = 14;
    // Deliberately parked, resumable on demand.
    RosterRowStatusHibernated hibernated = 15;
    // Startup failed outright.
    RosterRowStatusStartFailed start_failed = 16;
    // Running, but with a compromised route.
    RosterRowStatusDegraded degraded = 17;
    // Terminal: no live session backs the workspace.
    RosterRowStatusDead dead = 18;

    // The merge pipeline. These render a recycle glyph rather than a lifecycle
    // dot, except merged, which is settled and files under recently_merged.
    // The first instant of a merge, before anything durable exists for it.
    RosterRowStatusMergeEnqueuing merge_enqueuing = 19;
    // A merge is actively running.
    RosterRowStatusMerging merging = 20;
    // Enqueued behind another workspace's merge.
    RosterRowStatusMergeQueued merge_queued = 21;
    // The merge stopped on a conflict awaiting resolution.
    RosterRowStatusMergeConflict merge_conflict = 22;
    // The merge failed outright.
    RosterRowStatusMergeFailed merge_failed = 23;
    // The merge settled successfully.
    RosterRowStatusMerged merged = 24;

    // Registered, but no session was ever created for it: there is no
    // lifecycle to report. Distinct from an unset oneof: "the resolver looked
    // and there is none" is an assertion, where an unset oneof is the absence
    // of one.
    RosterRowStatusNone none = 25;
    // Registered but with no open perspective in Emacs, so no live session
    // whose lifecycle a dot could report. Drawn as a question mark. Dominates
    // every session state: a perspective-less workspace is inactive whatever
    // its session once was.
    RosterRowStatusInactive inactive = 26;
  }

  // Whether this row is the selected workspace. Redundant with a dir
  // comparison against WorkspaceRoster.current_dir and deliberately so: the
  // resolver states it once, so no client can compute it differently.
  bool current = 27;

  // Nested workspaces (a spawned family under its parent), in render order.
  repeated RosterRow children = 28;

  // When the user last selected this workspace, in epoch MILLISECONDS —
  // stamped by the daemon on SelectWorkspace. Drives the row's when-column,
  // the relative-age text the rail renders on the right ("3m", "2h"). UNSET
  // MEANS NEVER SELECTED and renders as no age at all; presence, not a zero
  // sentinel.
  optional int64 last_viewed_at_ms = 29;

  // When this workspace's merge settled, in epoch MILLISECONDS. UNSET MEANS
  // NOT MERGED. Takes precedence over last_viewed_at_ms in the when-column
  // for a merged row: once a workspace is done, how long ago it merged is the
  // fact worth showing.
  optional int64 merged_at_ms = 30;

  // The workspace's own git branch, for the expanded detail panel. Display
  // only — the join key is dir. EMPTY MEANS UNKNOWN: the row renders without
  // the branch line rather than with a blank one.
  string branch = 31;

  // The branch this workspace was cut from and merges back into, for the
  // detail panel. Display only, same emptiness rule as branch.
  string parent_branch = 32;

  // A short human summary of what the workspace is doing, shown as the detail
  // panel's prose line — the workspace's last prompt summary. EMPTY MEANS
  // NONE and the line is omitted rather than rendered blank.
  string summary = 33;

  // Whether the workspace is closed: it still exists and is still switchable,
  // but its agent-repl panes are dismissed. Renders RECEDED (greyed), the
  // same treatment a merged row gets. Deliberately NOT a status arm: closed
  // is orthogonal to the lifecycle — a closed workspace still has one — so
  // it rides alongside the oneof rather than displacing an arm inside it.
  bool closed = 34;
}

// The roster row statuses. Each is EMPTY BY DESIGN — being set is the entire
// assertion. See RosterRow.status for what each means.

message RosterRowStatusSubmitting {}

message RosterRowStatusThinking {}

message RosterRowStatusClearing {}

message RosterRowStatusCompacting {}

message RosterRowStatusPermission {}

message RosterRowStatusDone {}

message RosterRowStatusInterrupted {}

message RosterRowStatusReady {}

message RosterRowStatusIdleAsync {}

message RosterRowStatusVendorBlocked {}

message RosterRowStatusInit {}

message RosterRowStatusSevered {}

message RosterRowStatusHibernated {}

message RosterRowStatusStartFailed {}

message RosterRowStatusDegraded {}

message RosterRowStatusDead {}

message RosterRowStatusMergeEnqueuing {}

message RosterRowStatusMerging {}

message RosterRowStatusMergeQueued {}

message RosterRowStatusMergeConflict {}

message RosterRowStatusMergeFailed {}

message RosterRowStatusMerged {}

message RosterRowStatusNone {}

message RosterRowStatusInactive {}
