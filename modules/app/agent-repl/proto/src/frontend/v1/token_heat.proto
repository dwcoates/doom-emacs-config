// token_heat.proto — how HOT a token figure is: the one color rule every
// surface that draws a fresh-input figure shares (the footer's tokens cell, a
// response bubble's corner figure), so a figure reads the same color wherever
// it is drawn.

syntax = "proto3";

package frontend.v1;

option go_package = "agentrepl/proto/frontend/v1;frontendv1";

// A token figure's color, as a position on ONE continuous gradient running
// green → yellow → orange → red. The DAEMON owns the thresholds: it maps the
// fresh input to the position piecewise-linearly, with green at 0 tokens,
// yellow at 30k, orange at 50k and red at 100k, and every larger figure held
// at red. The four colors sit evenly spaced along the gradient (positions 0,
// 1/3, 2/3 and 1), so 30k is exactly 1/3 and 50k exactly 2/3. The CLIENT owns
// only the four colors, so the theme picks the palette while the daemon picks
// where on it a figure falls; the client interpolates between the two colors
// bracketing the position and never re-derives a threshold.
message TokenHeat {
  // The position along the gradient, in [0, 1]: 0 is green, 1 is red. Never
  // outside that range; the daemon clamps.
  double position = 1;
}
