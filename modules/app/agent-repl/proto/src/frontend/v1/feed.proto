// feed.proto — THE FEED: a scrolling list of ROWS, paged into the past,
// appended and updated live. Per-workspace; resolved by the daemon.
//
// UNLIKE EVERY OTHER COMPONENT, THE FEED IS NOT WHOLE-REPLACED. A ROW is the
// unit: each row is a whole element keyed by its message id, and a live update
// re-pushes the WHOLE ROW (upsert by id), never a partial. How rows travel —
// a page on request, upserts on the stream — is stage 3's; what a row IS is
// this file's.
//
//   ┌─ feed ──────────────────────────────────────────────────────────────┐
//   │ ▴ load earlier…                                                     │  edge
//   │  You  ▏fix the flaky reconnect test                                 │  ① user
//   │  ● Claude  I'll look at the reconnect path first.                   │  ② agent (prose · ▸thinking · tool cards)
//   │    ┌ Read  lisp/frontend.el                     ✓ ┐                  │     tool card
//   │  ⚙ Explore  "find the roster resolver"    0:31  ▸ 3 msgs            │  ③ detached bubble (nested rows inside)
//   │  ? Permission  Bash: git push …  [allow] [always] [deny]            │  ④ permission
//   │  ✕ API Error 529 — retries exhausted        resolved 14:03          │  ⑤ failure card (synthesized)
//   │  ✕ API 429 rate limited — retry in 20s                              │  ⑥ api-failure row (record)
//   │  ── context compacted · 180k → 12k ── ▸ summary                     │  ⑦ context-cut divider
//   │  ↻ merge · branch → master   cherry-picking 3/7  ▸ 12 msgs          │  ⑧ merge bubble (coalesces the run)
//   │  ● Claude  typing▍                                                  │  ⑨ live preview
//   └─────────────────────────────────────────────────────────────────────┘
//
// EVERY ROW KIND IS ITS OWN MESSAGE, and every row's element is a message the
// daemon RESOLVED for drawing — figma→idl takes precedence over embedding a
// conversation.v1 record verbatim (the record keeps its one canonical form;
// the row is its projection). Typed identities (MessageId, TurnId,
// ToolCallId) are imported, never restated.
//
// NO WORKSPACE, NO FENCE, NO SCOPE ON THE PAGE: the stream is per-workspace
// and ordered; the last breadcrumb IS the container a page is of.

syntax = "proto3";

package frontend.v1;

import "conversation/v1/agent.proto";
import "conversation/v1/detached_work.proto";
import "conversation/v1/message.proto";
import "conversation/v1/tool_call.proto";
import "conversation/v1/turn.proto";
import "frontend/v1/failure.proto";

option go_package = "agentrepl/proto/frontend/v1;frontendv1";

// ==========================================================================
// THE CONTAINER: a row, and a page of rows.
// ==========================================================================

// One row of the feed. THE ARM IS THE KIND.
message FeedRow {
  // The row's identity — the record's MessageId, or a daemon-minted one for a
  // synthesized row (failure card, merge bubble, preview). The upsert key: a
  // later push with the same id REPLACES this row whole.
  conversation.v1.MessageId id = 1;
  // The containing bubble's id, when nested (inside a detached bubble or the
  // merge bubble). UNSET for a top-level row.
  conversation.v1.MessageId parent = 2;
  // The turn this row belongs to — the daemon's stamp; what a client matches
  // its SubmitPromptSuccess.turn against to find its own prompt. Unset for a
  // row that belongs to no turn (a context-cut divider, a boot failure).
  conversation.v1.TurnId turn = 3;
  oneof row {
    FeedUserRow user = 4;
    FeedAgentRow agent = 5;
    FeedDetachedBubble detached = 6;
    FeedPermissionCard permission = 7;
    FeedFailureCard failure = 8;
    FeedApiFailureRow api_failure = 9;
    FeedContextCutDivider context_cut = 10;
    FeedMergeBubble merge = 11;
    FeedTypingPreview preview = 12;
  }
}

// A page of rows, as the daemon serves it for a container.
message FeedPage {
  // Oldest → newest.
  repeated FeedRow rows = 1;
  // Whether older rows exist beyond this page. THE ARM IS THE EDGE.
  oneof edge {
    FeedPageHasMore has_more = 2;
    FeedPageAtStart at_start = 3;
  }
  // The chain of containers ABOVE these rows, outermost first — what a cold
  // open deep inside nesting draws for context, and how a client knows which
  // container this page is OF (the last crumb). EMPTY = the top-level feed.
  FeedBreadcrumbs breadcrumbs = 4;
}

// Older rows exist; ask again with this cursor.
message FeedPageHasMore {
  // Opaque continuation, minted by the daemon; never parsed.
  string cursor = 1;
}

// This page reaches the beginning of the container.
message FeedPageAtStart {}

// The breadcrumb trail above a nested page.
message FeedBreadcrumbs {
  // Outermost first; each is a jump target.
  repeated FeedBreadcrumb crumbs = 1;
}

// One crumb: the container it names, and the label the daemon resolved for
// it (the subagent's description, the merge's branch line).
message FeedBreadcrumb {
  conversation.v1.MessageId target = 1;
  string label = 2;
}

// ==========================================================================
// THE ROW KINDS — each FILLED AT ITS OWN INCREMENT, one at a time. Empty here
// on purpose: not a guess at their elements. The old bodies they replace are
// kept VERBATIM below the line under "PENDING", to be judged as each kind is
// walked, and deleted then.
// ==========================================================================

// ① What a person typed — or, nested inside a detached bubble, the prompt
// that work was given. The daemon resolves the row: the author label, and the
// blocks the person composed, in order.
//
//   │  You  ▏fix the flaky reconnect test      │
//   │       ▏[image: screenshot.png]           │
//         author  body (blocks: text · image · unsupported)
message FeedUserRow {
  // The author label ("You" — or the spawning agent's name under a bubble).
  FeedUserAuthor author = 1;
  // The blocks the person composed.
  FeedUserBody body = 2;
}

// The author label of a user row.
message FeedUserAuthor {
  string label = 1;
}

// The blocks the person composed, in order, resolved for drawing.
message FeedUserBody {
  repeated FeedUserBlock blocks = 1;
}

// One drawn block of a user row.
message FeedUserBlock {
  oneof block {
    FeedTextBlock text = 1;
    FeedImageBlock image = 2;
    FeedUnsupportedBlock unsupported = 3;
  }
}

// ---- the feed's drawn block vocabulary, shared by every row kind in this
// ---- file that draws content blocks --------------------------------------

// Text, drawn as markdown.
message FeedTextBlock {
  string text = 1;
}

// An image the webview can fetch. The daemon RESOLVES the record's reference
// (a host path, or a URL) into a `src` a browser can load — that resolution
// is the daemon's, never the client's.
message FeedImageBlock {
  string src = 1;
  // Alt text, resolved (a filename, a caption); may be empty.
  string alt = 2;
}

// A block the schema does not model, drawn as "unsupported block: <kind>".
// The raw stays in the record; the row never carries it.
message FeedUnsupportedBlock {
  string kind = 1;
}
// ② One agent response: its head, then its blocks in production order, then a
// stop notice when the stop is worth drawing.
//
//   │  ● Claude                              opus-5 · 1.2k in · 340 out │  head
//   │    I'll look at the reconnect path first.                         │  prose
//   │    ▸ thinking · 412 tokens                                        │  thinking (collapsed)
//   │    ┌ Read  lisp/frontend.el:840-880                       ✓ ┐     │  tool card
//   │    │  ▸ result (42 lines)                                    │     │
//   │    └────────────────────────────────────────────────────────┘     │
//   │    ⚠ stopped: hit the output limit                                │  stop notice
//
// A RESOLVED ELEMENT, not an embedded AgentSaid: the record keeps its one
// canonical form; this row is the daemon's projection of it for drawing —
// including each tool card's per-tool presentation, which the daemon derives
// from ToolCallBlock.call ONCE, so no client knows that Bash has a `command`.
message FeedAgentRow {
  FeedAgentHead head = 1;
  // In production order.
  repeated FeedAgentBlock blocks = 2;
  // Unset for end_turn and tool_call — the ordinary endings draw nothing.
  FeedAgentStopNotice stop = 3;
}

// The row's head: who, and what it cost.
message FeedAgentHead {
  FeedAgentAuthor author = 1;
  FeedAgentUsageStamp usage = 2;
}

// The author label ("Claude", or the subagent's name inside a bubble).
message FeedAgentAuthor {
  string label = 1;
}

// The response's cost, resolved into the figures the head shows.
message FeedAgentUsageStamp {
  string model = 1;
  int64 input_tokens = 2;
  int64 output_tokens = 3;
  // A composed cache line ("91% cached"), may be empty.
  string cache_summary = 4;
}

// One drawn block of an agent row.
message FeedAgentBlock {
  oneof block {
    FeedTextBlock prose = 1;
    FeedAgentThinking thinking = 2;
    FeedToolCard tool = 3;
  }
}

// Reasoning the agent showed, drawn collapsed. THE ARM IS THE FACT.
message FeedAgentThinking {
  oneof thinking {
    FeedAgentThinkingShown shown = 1;
    FeedAgentThinkingRedacted redacted = 2;
  }
}
message FeedAgentThinkingShown {
  string text = 1;
  // Resolved for the collapsed line ("▸ thinking · 412 tokens").
  int64 tokens = 2;
}
message FeedAgentThinkingRedacted {}

// A tool card: what was called, its arguments (folded), and how it went.
message FeedToolCard {
  // The join key to the permission card, the detached bubble and the record.
  conversation.v1.ToolCallId call = 1;
  FeedToolCardHeadline headline = 2;
  FeedToolCardArguments arguments = 3;
  // THE ARM IS THE OUTCOME.
  oneof outcome {
    FeedToolCardRunning running = 4;
    FeedToolCardReturned returned = 5;
    FeedToolCardDetached detached = 6;
    FeedToolCardDenied denied = 7;
  }
}

// The card's headline: per-tool presentation the DAEMON resolves ("Read ·
// lisp/frontend.el:840-880", "Bash · $ go test ./...").
message FeedToolCardHeadline {
  // A glyph name from the shared vocabulary ("read", "bash", "agent", …).
  string icon = 1;
  string title = 2;
  // May be empty.
  string subtitle = 3;
}

// The arguments, folded open on demand: label/value lines the daemon composed
// from the call's arm; a value may be long (a Write's content, a Bash command).
message FeedToolCardArguments {
  repeated FeedToolCardArgument lines = 1;
}
message FeedToolCardArgument {
  string label = 1;
  string value = 2;
}

// The tool has not returned yet.
message FeedToolCardRunning {}

// The tool returned. THE ARM IS WHETHER IT SUCCEEDED; each carries its own
// drawn result blocks.
message FeedToolCardReturned {
  oneof result {
    FeedToolResultSucceeded succeeded = 1;
    FeedToolResultFailed failed = 2;
  }
}
message FeedToolResultSucceeded {
  repeated FeedToolResultBlock blocks = 1;
}
message FeedToolResultFailed {
  repeated FeedToolResultBlock blocks = 1;
}
// One drawn block of a tool result.
message FeedToolResultBlock {
  oneof block {
    FeedTextBlock text = 1;
    FeedImageBlock image = 2;
    FeedUnsupportedBlock unsupported = 3;
  }
}

// The call detached into work of its own; the card links to its bubble.
message FeedToolCardDetached {
  conversation.v1.MessageId bubble = 1;
}

// The call was denied by the user.
message FeedToolCardDenied {
  // What the user said, when they said anything.
  string reason = 1;
}

// A stop worth drawing. Unset for end_turn / tool_call.
message FeedAgentStopNotice {
  oneof reason {
    FeedAgentStopMaxTokens max_tokens = 1;
    FeedAgentStopInterrupted interrupted = 2;
    FeedAgentStopRefusal refusal = 3;
    FeedAgentStopUnsupported unsupported = 4;
  }
}
message FeedAgentStopMaxTokens {}
message FeedAgentStopInterrupted {}
message FeedAgentStopRefusal {}
message FeedAgentStopUnsupported {
  string reason = 1;
}
message FeedDetachedBubble {}
message FeedPermissionCard {}
message FeedFailureCard {}
message FeedApiFailureRow {}
message FeedContextCutDivider {}
message FeedMergeBubble {}
message FeedTypingPreview {}

// ==========================================================================
// PENDING — old bodies, verbatim, judged one kind at a time.
// ==========================================================================

// A failure as a CONVERSATION ITEM rather than as chrome.
//
// A user whose workspace changed color needs to find out WHY from the
// conversation itself, at the point in it where the failure happened. Chrome
// scrolls away and carries no correlation between a report and its all-clear.
message FailureCardView {
  // WHAT failed, and its evidence. The card takes its color from the kind's
  // side of the vocabulary.
  FailureKind kind = 1;
  // The sentence the card leads with, composed daemon-side. This is what the
  // reader is meant to take away.
  string message = 2;
  // The raw account, shown beneath the sentence in a quieter register. It is
  // evidence for whoever debugs this, not the sentence itself, and it is
  // deliberately allowed to be empty.
  string detail = 3;
  // HOW this card ends, as arms, so that an open alarm and its all-clear can
  // never be the same shape with a different number in it.
  //
  // A window-shaped failure is re-sent under the SAME Message.uuid
  // with a different arm here, and the feed reconciles it in place. Appending
  // instead would leave the alarm standing beside its own all-clear.
  oneof lifecycle {
    FailureCardOpen open = 4;
    FailureCardResolved resolved = 5;
    FailureCardTerminal terminal = 6;
  }
}

// A window-shaped failure has closed. The card settles: it keeps its place in
// the conversation, drops to a muted register, and stamps when it ended.
message FailureCardResolved {
  // When it closed, unix millis.
  int64 resolved_at_ms = 1;
}

// One piece of detached work, as the payload of the Message that IS it.
message DetachedWork {
  // THERE IS ONE ID SPACE: the containing Message's uuid. A routing handle of
  // this payload's own would be a second id space that had to be bridged to the
  // first, and the bridge is pure cost.
  //
  // THERE IS ONE CONTAINMENT TREE, and it is the message tree. A parent pointer
  // for detached work would be a second tree walking only detached work, which
  // could disagree with the real one. Containment is stated exactly once, on
  // frontend.v1.Message.parent_message_id.
  //
  // WHAT A PRODUCER OBSERVED IS SPELLED ONCE, WHERE IT WAS OBSERVED. The
  // originating tool call and the label live inside `started`, in the producer's
  // own words; this surface restates neither, so there is nothing here to drift
  // against.
  //
  // THIS SURFACE TRAVELS AS PROTOJSON, so a field NAME is the wire token, not
  // just documentation — renaming a field breaks the wire exactly as renumbering
  // it would.

  // THE PRODUCER'S OWN RECORD of the detachment, embedded whole rather than
  // copied out field by field. Everything a producer observed about the work
  // starting — which tool call spawned it, what it is called, what kind of thing
  // it is — reaches the frontend exactly as it was recorded, so this surface has
  // no second spelling of those facts to fall out of step with.
  conversation.v1.DetachedWorkStarted started = 1;
  // When the work was launched, unix millis.
  int64 started_at_ms = 2;
  // Live or settled, and with what outcome. See DetachedWorkLiveness.
  DetachedWorkLiveness liveness = 3;
  // WHICH KIND OF WORK THIS IS, IS STATED EXACTLY ONCE: `started.kind`, a
  // conversation.v1.DetachedWorkKind. This surface carries no per-kind arm of
  // its own, because an arm set to a kind is the same word said a second time in
  // a second spelling (`journal` here against `workflow` there), which is a drift
  // opportunity for no gain. Every kind — agent, workflow, shell, unclassified,
  // merge, skill — is a DetachedWorkKind value and nothing else.
  //
  // CONTAINED CONTENT IS NOT CARRIED HERE. A detached agent's conversation, a
  // merge run's, a skill window's, a workflow's steps are reached by PAGING:
  // frontend.v1.PageScopeInside naming THIS message's id walks the records whose
  // parent chain reaches THIS message's id, at any depth, with the same
  // command and renderer the feed uses.

  // The workspace this work runs under — the same key every workspace-scoped
  // frame carries. It exists so a snapshot can scope detached work to the
  // client's workspace exactly as it scopes every other per-workspace family;
  // deltas already carry the key on their envelope (DetachedWorkDelta.workspace),
  // and the two are always equal.
  string workspace = 4;
}

// Live-or-settled, expressed as arms so that "settled" and "settled with what
// outcome" are one indivisible fact. Settled work with no outcome is
// unrepresentable.
message DetachedWorkLiveness {
  oneof state {
    DetachedWorkLive live = 1;
    DetachedWorkSettled settled = 2;
  }
}

// The work is still running.
message DetachedWorkLive {
  // When the daemon last saw this work produce anything, unix millis. 0 means
  // it has produced nothing since launch. It supports a "quiet for a while"
  // affordance and is NOT a liveness verdict: a silent agent is still a live
  // agent.
  int64 last_activity_ms = 1;
}

// The work has finished, one way or another.
message DetachedWorkSettled {
  // THE OUTCOME IS THE PRODUCER'S WORD, and this surface does not get a second
  // one. How the work ended, and — for work that was a process — the exit status
  // it left with, are things a producer OBSERVED, so they are stated where they
  // were observed, in conversation.v1.DetachedWorkEnded. A local re-spelling
  // could only be a smaller vocabulary: it would lack `lost`, and work whose
  // ending was never observed would have to be reported as an ending that was.

  // When it finished, unix millis. Daemon bookkeeping: the moment this system
  // learned of the ending, which is not the moment the work ended.
  int64 settled_at_ms = 1;
  // THE PRODUCER'S OWN RECORD of the ending, embedded whole: which outcome it
  // reached, and — for work that was a process — the exit status it left with.
  // A consumer reads the verdict and the evidence from one place, in the
  // vocabulary the producer wrote them in.
  conversation.v1.DetachedWorkEnded ended = 2;
  // TODO(respelling): `killed` has NO counterpart in
  // conversation.v1.DetachedWorkEnded and so was not folded into `ended`. Its
  // nearest neighbour, conversation.v1.DetachedCancelled, is empty and cannot
  // carry `reason` — the attribution of WHO stopped the work. Deleting this
  // would delete that attribution off the wire silently. It is a plain field
  // rather than a oneof arm now that its siblings live in `ended`; when set, it
  // annotates the `cancelled` arm and never contradicts it.
  DetachedWorkOutcomeKilled killed = 3;
}

// Stopped from outside before it finished: an explicit stop, a cancellation,
// a session teardown. Distinct from error because the work did not fail — it
// was not allowed to conclude.
message DetachedWorkOutcomeKilled {
  // Who or what stopped it, resolved for display. Empty when unattributed.
  string reason = 1;
}

// One incremental push to ONE MESSAGE'S detached-work payload: the message id
// routes it, the arm types it.
//
// AN UPDATE, NOT A MESSAGE. It is addressed to a message that already exists
// and mutates that message's payload in place. It carries no uuid, no lineage
// and no timestamp of its own, because it is not a thing the feed contains —
// it is a change to a thing the feed already contains. Promoting each one to a
// Message would let an agent running for an hour insert a feed row per line,
// which is exactly what pagination cannot survive.
//
// Never a re-send of the whole message either: an agent running for an hour
// would otherwise re-transmit its entire transcript on every new line.
message DetachedWorkUpdate {
  // THIS SURFACE TRAVELS AS PROTOJSON, so the field NAME below is the wire
  // token: renaming it breaks every producer and consumer of this update.

  // WHICH MESSAGE this lands on — the uuid of a Message whose payload is
  // DetachedWork. Must name a message the receiver has already opened; an
  // update for an unknown id is a gap and must be rejected loudly and resynced,
  // never buffered in the hope its message shows up.
  string message_id = 1;
  // WHAT changed. The arm MUST match the work's kind — a journal update
  // addressed to shell work is a daemon bug and is rejected, not coerced. Only
  // `liveness` is kind-independent.
  //
  // `shell` and `unclassified` are distinct arms carrying the SAME message:
  // the arm names which kind the update is for, while the payload is one byte
  // append in both cases. The two kinds differ in what they ARE, not in how
  // their output arrives, so there is no axis along which a duplicated pair of
  // append messages could evolve apart.
  //
  // `merge` carries the SAME message as `agent` for exactly that reason: a
  // merge run's emissions arrive precisely as a detached agent's do, so the
  // arm names the kind while the payload has no axis to evolve apart on.
  //
  // TODO(respelling): seven arms carry only FIVE distinct types —
  // `agent`/`merge` are both DetachedWorkAgentUpdate, and `shell`/`unclassified`
  // are both DetachedWorkOutputAppend. The arms are therefore typed by the
  // work's KIND when what an update actually varies by is its SHAPE: emissions,
  // byte append, journal rows, skill body, liveness. Kind is already stated once
  // on the message (conversation.v1.DetachedWorkStarted.kind), so restating it
  // here is the same duplication the `kind` oneof was deleted for. Whether these
  // collapse to shape-typed arms needs a ruling; this oneof is NOT changed
  // meanwhile, because its arms route live traffic.
  oneof update {
    DetachedWorkAgentUpdate agent = 2;
    DetachedWorkJournalUpdate journal = 3;
    DetachedWorkOutputAppend shell = 4;
    DetachedWorkOutputAppend unclassified = 5;
    DetachedWorkLivenessUpdate liveness = 6;
    DetachedWorkAgentUpdate merge = 7;
    DetachedWorkSkillUpdate skill = 8;
  }
}

// New output from a detached agent.
message DetachedWorkAgentUpdate {
  // The emissions produced since the last update, in order. THE SAME message
  // the top-level feed carries — see AgentEmission. A frontend appends these
  // to the work's emission list and renders them with its ordinary feed
  // renderers.
  //
  // These are EMISSIONS APPENDED TO ONE MESSAGE, not messages of their own: a
  // detached agent's thousand lines are a thousand additions to one feed row.
  repeated AgentEmission emissions = 1;
}

// One incremental push to a skill message. Body resolution and emission
// appends are different events with different lifetimes, so they are arms
// rather than co-set fields.
message DetachedWorkSkillUpdate {
  oneof update {
    // The skill file's contents, resolved — the conversation record whole.
    // Replaces the message's body rather than appending; delivered once in the
    // ordinary case. WHICH message it lands on is stated once, by the
    // containing DetachedWorkUpdate.message_id.
    conversation.v1.SkillBodyResolved body = 1;
    // Emissions appended to the window, exactly as a detached agent's.
    DetachedWorkAgentUpdate emissions = 2;
  }
}

// New steps in a Workflow run's journal.
message DetachedWorkJournalUpdate {
  // Rows logged since the last update, in order.
  //
  // Rows are APPEND-ONLY and are never revised in place: a step that starts
  // running and later completes emits a running row and then a done row, and
  // the daemon does not rewrite history. A frontend that wants one row per
  // step collapses them by label; a frontend that wants the log renders them
  // all. Neither reading is imposed here.
  //
  // THE PRODUCER'S OWN STEP RECORD, carried unchanged: the daemon batches which
  // steps it forwards, it does not restate what a step said.
  repeated conversation.v1.WorkflowStep rows = 1;
}

// New bytes on a spool: an APPEND TO ONE MESSAGE'S PAYLOAD.
//
// A byte append is emphatically not a message. It has no identity, no lineage
// and no place of its own in the feed; it is addressed to the message whose
// spool it extends (DetachedWorkUpdate.message_id) and is applied to that
// message's accumulating content.
message DetachedWorkOutputAppend {
  // AN APPEND CARRIES NO OFFSET, so a lost append cannot be told from a quiet
  // one: an append that never arrives leaves a silent hole in a transcript that
  // still looks complete. The durable record is intact and a reload repairs it,
  // with no signal to the user that a reload is warranted. A per-frame `seq` on
  // agentrepl.v1.FrontendFrame is the cheaper way to get detection back, and would
  // cover all three delta streams — ConversationDelta, DetachedWorkDelta and
  // this one — rather than this one alone, for less than a per-stream cursor
  // costs.

  // The bytes, verbatim, to append.
  string text = 1;
}

// A liveness transition: live to settled, or a settled outcome changing (a
// running agent that is then killed).
message DetachedWorkLivenessUpdate {
  // The work's liveness after the transition.
  DetachedWorkLiveness liveness = 1;
}

// The failure is still happening. The card shows its alarm mark and its color.
message FailureCardOpen {}

// The failure has no closing edge and never will — a turn that ended, a
// refusal, an account block. Distinct from `open`, because an open card
// invites waiting and this one does not.
message FailureCardTerminal {}

