// feed.proto — THE FEED: a scrolling list of ROWS, paged into the past,
// appended and updated live. Per-workspace; resolved by the daemon.
//
// UNLIKE EVERY OTHER COMPONENT, THE FEED IS NOT WHOLE-REPLACED. A ROW is the
// unit: each row is a whole element keyed by its message id, and a live update
// re-pushes the WHOLE ROW (upsert by id), never a partial. How rows travel —
// a page on request, upserts on the stream — is stage 3's; what a row IS is
// this file's.
//
//   ┌─ feed ──────────────────────────────────────────────────────────────┐
//   │ ▴ load earlier…                                                     │  edge
//   │  You  ▏fix the flaky reconnect test                                 │  ① user
//   │  ● Claude  I'll look at the reconnect path first.                   │  ② agent (prose · ▸thinking · tool cards)
//   │    ┌ Read  lisp/frontend.el                     ✓ ┐                  │     tool card
//   │  ⚙ Explore  "find the roster resolver"    0:31  ▸ 3 msgs            │  ③ detached bubble (nested rows inside)
//   │  ? Permission  Bash: git push …  [allow] [always] [deny]            │  ④ permission
//   │  ● Claude  ✕ API 429 rate limited — retry in 20s                    │  ② agent, FAILED (error arm)
//   │  ── context compacted · 180k → 12k ── ▸ summary                     │  ⑤ context-cut divider
//   │  ⇄ merge · branch → master   queue ✓ │ tests ● 8/12   ▸ 12 msgs     │  ⑥ merge bubble (tabbed phases)
//   │  ● Claude  Let me look at the roster resolv▍                        │  ② agent, still ARRIVING (update arm)
//   └─────────────────────────────────────────────────────────────────────┘
//
// EVERY ROW KIND CARRIES `oneof result { update | success | error }` — the
// same shape every agentrepl.v1 response has, applied to a drawn row. `update`
// (where a kind has one) is the row while its fact is still in flight — a
// response arriving, a tool running, a bubble live, a permission open, a
// merge queued or merging. `success` is the settled fact. `error` is the
// kind's OWN failure, modeled IN the kind: a response that never settled, a
// tool that failed or was denied, a bubble that failed / was cancelled / was
// lost, a merge that failed. Kinds that cannot fail or update carry a
// ONE-ARM oneof, deliberately, so every row switches the same way. There is
// NO general "failure row": a failure that correlates to no entry — a
// session dying, the shim degrading, the client's own machinery — is not a
// conversation fact; it is footer/topbar/gate state (see failure.proto).
//
// EVERY ROW KIND IS ITS OWN MESSAGE, and every row's element is a message the
// daemon RESOLVED for drawing — figma→idl takes precedence over embedding a
// conversation.v1 record verbatim (the record keeps its one canonical form;
// the row is its projection). Typed identities (MessageId, TurnId,
// ToolCallId) are imported, never restated.
//
// NO WORKSPACE, NO FENCE, NO SCOPE ON THE PAGE: the stream is per-workspace
// and ordered; the last breadcrumb IS the container a page is of.

syntax = "proto3";

package frontend.v1;

import "conversation/v1/agent.proto";
import "conversation/v1/detached_work.proto";
import "conversation/v1/message.proto";
import "conversation/v1/tool_call.proto";
import "conversation/v1/turn.proto";
import "frontend/v1/failure.proto";

option go_package = "agentrepl/proto/frontend/v1;frontendv1";

// ==========================================================================
// THE CONTAINER: a row, and a page of rows.
// ==========================================================================

// One row of the feed. THE ARM IS THE KIND.
message FeedRow {
  // The row's identity — the record's MessageId, or a daemon-minted one for a
  // synthesized row (a merge). The upsert key: a
  // later push with the same id REPLACES this row whole.
  conversation.v1.MessageId id = 1;
  // The containing bubble's id, when nested (inside a detached bubble or the
  // merge bubble). UNSET for a top-level row.
  conversation.v1.MessageId parent = 2;
  // The turn this row belongs to — the daemon's stamp; what a client matches
  // its SubmitPromptSuccess.turn against to find its own prompt. Unset for a
  // row that belongs to no turn (a context-cut divider, a boot failure).
  conversation.v1.TurnId turn = 3;
  oneof row {
    FeedUser user = 4;
    FeedAgent agent = 5;
    FeedDetached detached = 6;
    FeedPermission permission = 7;
    FeedContextCut context_cut = 8;
    FeedMerge merge = 9;
  }
}

// A page of rows, as the daemon serves it for a container. THE ARM IS THE
// RESULT: the page, or why it could not be completed.
message FeedPage {
  oneof result {
    FeedPageSuccess success = 1;
    FeedPageError error = 2;
  }
}

// The page.
message FeedPageSuccess {
  // Oldest → newest.
  repeated FeedRow rows = 1;
  // Whether older rows exist beyond this page. THE ARM IS THE EDGE.
  oneof edge {
    FeedPageHasMore has_more = 2;
    FeedPageAtStart at_start = 3;
  }
  // The chain of containers ABOVE these rows, outermost first — what a cold
  // open deep inside nesting draws for context, and how a client knows which
  // container this page is OF (the last crumb). EMPTY = the top-level feed.
  FeedBreadcrumbs breadcrumbs = 4;
}

// The page could not be completed. Drawn where the rows would be, with the
// daemon's sentence and the typed evidence.
message FeedPageError {
  FeedPageErrorHeadline headline = 1;
  oneof kind {
    // The history re-pull ended before it reached the live window, so what
    // is on screen has a gap in it.
    FailureHistoryReplayTruncated history_replay_truncated = 2;
  }
}
message FeedPageErrorHeadline {
  string text = 1;
  string tone = 2;
}

// Older rows exist — ask for the next page. NO CURSOR: the daemon holds each
// container's walk position (stage-3 ruling); this arm is purely the fact
// that the walk has not reached the start.
message FeedPageHasMore {}

// This page reaches the beginning of the container.
message FeedPageAtStart {}

// The breadcrumb trail above a nested page.
message FeedBreadcrumbs {
  // Outermost first; each is a jump target.
  repeated FeedBreadcrumb crumbs = 1;
}

// One crumb: the container it names, and the label the daemon resolved for
// it (the subagent's description, the merge's branch line).
message FeedBreadcrumb {
  conversation.v1.MessageId target = 1;
  string label = 2;
}

// ==========================================================================
// THE ROW KINDS — each FILLED AT ITS OWN INCREMENT, one at a time. Empty here
// on purpose: not a guess at their elements. The old bodies they replace are
// kept VERBATIM below the line under "PENDING", to be judged as each kind is
// walked, and deleted then.
// ==========================================================================

// ① What a person typed — or, nested inside a detached bubble, the prompt
// that work was given. The daemon resolves the row: the author label, and the
// blocks the person composed, in order.
//
//   │  You  ▏fix the flaky reconnect test      │
//   │       ▏[image: screenshot.png]           │
//         author  body (blocks: text · image · unsupported)
message FeedUser {
  // The author label ("You" — or the spawning agent's name under a bubble).
  FeedUserAuthor author = 1;
  // ONE ARM: a user row is never in flight and never fails.
  oneof result {
    FeedUserSuccess success = 2;
  }
}

// The row's content.
message FeedUserSuccess {
  // The blocks the person composed.
  FeedUserBody body = 1;
}

// The author label of a user row.
message FeedUserAuthor {
  string label = 1;
}

// The blocks the person composed, in order, resolved for drawing.
message FeedUserBody {
  repeated FeedUserBlock blocks = 1;
}

// One drawn block of a user row.
message FeedUserBlock {
  oneof block {
    FeedTextBlock text = 1;
    FeedImageBlock image = 2;
    FeedUnsupportedBlock unsupported = 3;
  }
}

// ---- the feed's drawn block vocabulary, shared by every row kind in this
// ---- file that draws content blocks --------------------------------------

// Text, drawn as markdown.
message FeedTextBlock {
  string text = 1;
}

// An image the webview can fetch. The daemon RESOLVES the record's reference
// (a host path, or a URL) into a `src` a browser can load — that resolution
// is the daemon's, never the client's.
message FeedImageBlock {
  string src = 1;
  // Alt text, resolved (a filename, a caption); may be empty.
  string alt = 2;
}

// A block the schema does not model, drawn as "unsupported block: <kind>".
// The raw stays in the record; the row never carries it.
message FeedUnsupportedBlock {
  string kind = 1;
}
// ② One agent response: its head, then its blocks in production order, then a
// stop notice when the stop is worth drawing.
//
//   │  ● Claude                              opus-5 · 1.2k in · 340 out │  head
//   │    I'll look at the reconnect path first.                         │  prose
//   │    ▸ thinking · 412 tokens                                        │  thinking (collapsed)
//   │    ┌ Read  lisp/frontend.el:840-880                       ✓ ┐     │  tool card
//   │    │  ▸ result (42 lines)                                    │     │
//   │    └────────────────────────────────────────────────────────┘     │
//   │    ⚠ stopped: hit the output limit                                │  stop notice
//
// A RESOLVED ELEMENT, not an embedded AgentSaid: the record keeps its one
// canonical form; this row is the daemon's projection of it for drawing —
// including each tool card's per-tool presentation, which the daemon derives
// from ToolCallBlock.call ONCE, so no client knows that Bash has a `command`.
message FeedAgent {
  FeedAgentHead head = 1;
  // In production order.
  repeated FeedAgentBlock blocks = 2;
  // Unset for end_turn and tool_call — the ordinary endings draw nothing.
  FeedAgentStopNotice stop = 3;
}

// The row's head: who, and what it cost.
message FeedAgentHead {
  FeedAgentAuthor author = 1;
  FeedAgentUsageStamp usage = 2;
}

// The author label ("Claude", or the subagent's name inside a bubble).
message FeedAgentAuthor {
  string label = 1;
}

// The response's cost, resolved into the figures the head shows.
message FeedAgentUsageStamp {
  string model = 1;
  int64 input_tokens = 2;
  int64 output_tokens = 3;
  // A composed cache line ("91% cached"), may be empty.
  string cache_summary = 4;
}

// One drawn block of an agent row.
message FeedAgentBlock {
  oneof block {
    FeedTextBlock prose = 1;
    FeedAgentThinking thinking = 2;
    FeedTool tool = 3;
  }
}

// Reasoning the agent showed, drawn collapsed. THE ARM IS THE FACT.
message FeedAgentThinking {
  oneof thinking {
    FeedAgentThinkingShown shown = 1;
    FeedAgentThinkingRedacted redacted = 2;
  }
}
message FeedAgentThinkingShown {
  string text = 1;
  // Resolved for the collapsed line ("▸ thinking · 412 tokens").
  int64 tokens = 2;
}
message FeedAgentThinkingRedacted {}

// A tool card: what was called, its arguments (folded), and how it went.
message FeedTool {
  // The join key to the permission card, the detached bubble and the record.
  conversation.v1.ToolCallId call = 1;
  FeedToolHeadline headline = 2;
  FeedToolArguments arguments = 3;
  // THE ARM IS THE STATE.
  oneof result {
    FeedToolUpdate update = 4;
    FeedToolSuccess success = 5;
    FeedToolError error = 6;
  }
}

// The card's headline: per-tool presentation the DAEMON resolves ("Read ·
// lisp/frontend.el:840-880", "Bash · $ go test ./...").
message FeedToolHeadline {
  // A glyph name from the shared vocabulary ("read", "bash", "agent", …).
  string icon = 1;
  string title = 2;
  // May be empty.
  string subtitle = 3;
}

// The arguments, folded open on demand: label/value lines the daemon composed
// from the call's arm; a value may be long (a Write's content, a Bash command).
message FeedToolArguments {
  repeated FeedToolArgument lines = 1;
}
message FeedToolArgument {
  string label = 1;
  string value = 2;
}

// The tool has not returned yet.
message FeedToolUpdate {}

// The call went well. THE ARM IS HOW: it returned, or it detached into work
// of its own.
message FeedToolSuccess {
  oneof outcome {
    FeedToolReturned returned = 1;
    FeedToolDetached detached = 2;
  }
}
// The tool returned; its result, drawn.
message FeedToolReturned {
  repeated FeedToolResultBlock blocks = 1;
}
// The call detached into work of its own; the card links to its bubble.
message FeedToolDetached {
  conversation.v1.MessageId bubble = 1;
}

// The call did not go well. THE ARM IS WHY: the tool returned an error, or
// the user denied it.
message FeedToolError {
  oneof reason {
    FeedToolFailed failed = 1;
    FeedToolDenied denied = 2;
  }
}
// The tool returned an error; its account, drawn.
message FeedToolFailed {
  repeated FeedToolResultBlock blocks = 1;
}
// The call was denied by the user.
message FeedToolDenied {
  // What the user said, when they said anything.
  string reason = 1;
}
// One drawn block of a tool result.
message FeedToolResultBlock {
  oneof block {
    FeedTextBlock text = 1;
    FeedImageBlock image = 2;
    FeedUnsupportedBlock unsupported = 3;
  }
}

// A stop worth drawing. Unset for end_turn / tool_call.
message FeedAgentStopNotice {
  oneof reason {
    FeedAgentStopMaxTokens max_tokens = 1;
    FeedAgentStopInterrupted interrupted = 2;
    FeedAgentStopRefusal refusal = 3;
    FeedAgentStopUnsupported unsupported = 4;
  }
}
message FeedAgentStopMaxTokens {}
message FeedAgentStopInterrupted {}
message FeedAgentStopRefusal {}
message FeedAgentStopUnsupported {
  string reason = 1;
}
// ③ Work that detached — a subagent, a background shell, a workflow, a skill's
// own window — as a collapsible BUBBLE: a head, and a body by kind. Its
// nested rows are ordinary FeedRows whose `parent` is this bubble, paged
// through the same page and breadcrumbs as the feed; the bubble carries only
// their count.
//
//   │  ⚙ Explore  "find the roster resolver"      0:31 ● live  ▸ 3 msgs │  head
//   │    │  You  ▏find the roster resolver…                              │  nested rows
//   │  $ bash  go test ./...                      1:04 ● live  ▸ output │  shell: the spool
//   │  ⛓ workflow  review-changes                 2:10 ● live  ▸ 5 steps│  workflow: journal steps
//   │  ✎ skill  create-or-update-pr                     ✓ done  ▸ body  │  skill: SKILL.md + nested rows
//   │  ⚙ Explore  "…"                        1:12 ✕ failed: timed out    │  error: outcome replaces liveness
message FeedDetached {
  FeedDetachedHead head = 1;
  // THE ARM IS THE STATE — drawn as the head's badge.
  oneof result {
    FeedDetachedUpdate update = 2;
    FeedDetachedSuccess success = 3;
    FeedDetachedError error = 4;
  }
  // THE ARM IS THE KIND — what the bubble contains and how it is drawn.
  oneof body {
    FeedDetachedAgentBody agent = 5;
    FeedDetachedShellBody shell = 6;
    FeedDetachedWorkflowBody workflow = 7;
    FeedDetachedSkillBody skill = 8;
    FeedDetachedUnmodeledBody unmodeled = 9;
  }
}

// The bubble's head line: the constant props. The state badge is the
// bubble's `result`.
message FeedDetachedHead {
  FeedDetachedGlyph glyph = 1;
  FeedDetachedLabel label = 2;
  FeedDetachedRuntime runtime = 3;
  FeedDetachedFold fold = 4;
}

// The kind glyph, a name from the shared vocabulary ("agent", "bash",
// "workflow", "skill", "tool").
message FeedDetachedGlyph {
  string icon = 1;
}

// The label, resolved by the daemon from the origin call (the agent's
// description, the shell's command, the workflow's name, the skill's name).
message FeedDetachedLabel {
  string text = 1;
}

// When it started — the head's running clock while live.
message FeedDetachedRuntime {
  int64 started_at_ms = 1;
}

// Still running.
message FeedDetachedUpdate {}

// Ended well: when, the collapsed line's summary, and the process exit when
// it was a process. `ended_at_ms` lives on the terminal arms, not on the
// runtime, because it means nothing while live (adjacent-exclusivity).
message FeedDetachedSuccess {
  // Epoch ms; the head's clock stops here.
  int64 ended_at_ms = 1;
  // The collapsed line's summary, resolved.
  string summary = 2;
  // Unset for work that never had an exit status of its own.
  FeedDetachedExit exit = 3;
}

// Ended badly: when, why, and the process exit when it was a process. THE
// ARM IS WHY.
message FeedDetachedError {
  int64 ended_at_ms = 1;
  oneof reason {
    FeedDetachedFailed failed = 2;
    FeedDetachedCancelled cancelled = 3;
    FeedDetachedLost lost = 4;
  }
  FeedDetachedExit exit = 5;
}
message FeedDetachedFailed {
  string summary = 1;
}
message FeedDetachedCancelled {}
// We lost sight of it — a resolved sentence for the collapsed line ("the
// transcript vanished", "went silent for 10m").
message FeedDetachedLost {
  string how = 1;
}
// The process's exit code, exactly as reported ("exited 137").
message FeedDetachedExit {
  int32 code = 1;
}

// The ▸/▾ state. UI preference the daemon holds; see the roster's fold.
message FeedDetachedFold {
  bool folded = 1;
}

// A subagent: its rows are nested FeedRows; the bubble carries their count.
message FeedDetachedAgentBody {
  FeedDetachedRowCount rows = 1;
}
// A background shell: its output spool, resolved whole (a row upsert
// replaces it; there are no append deltas — the row is the unit).
message FeedDetachedShellBody {
  FeedDetachedSpool output = 1;
}
// A workflow: its journal steps.
message FeedDetachedWorkflowBody {
  repeated FeedDetachedStep steps = 1;
}
// A skill's window: its SKILL.md body, and its nested rows' count.
message FeedDetachedSkillBody {
  FeedDetachedSkillDoc body = 1;
  FeedDetachedRowCount rows = 2;
}
// An unmodeled tool that detached: rows only.
message FeedDetachedUnmodeledBody {
  FeedDetachedRowCount rows = 1;
}

// How many nested rows the bubble holds ("▸ 3 msgs").
message FeedDetachedRowCount {
  int64 count = 1;
}
// A shell's output spool. `truncated` when the daemon capped what it sends
// and the rest is reachable by paging inside the bubble.
message FeedDetachedSpool {
  string text = 1;
  bool truncated = 2;
}
// One journal step. THE ARM IS THE STATE.
message FeedDetachedStep {
  string label = 1;
  string detail = 2;
  oneof result {
    FeedDetachedStepUpdate update = 3;
    FeedDetachedStepSuccess success = 4;
    FeedDetachedStepError error = 5;
  }
}
message FeedDetachedStepUpdate {}
message FeedDetachedStepSuccess {}
message FeedDetachedStepError {}
// The skill file's body, markdown, drawn as a document.
message FeedDetachedSkillDoc {
  string markdown = 1;
}
// ④ A permission the agent asked for, and how it was answered. Joined to its
// tool card by the call id; draws the same tool-call presentation with ITS
// OWN wrappers (two components, one origin, per-component copies).
//
//   │  ? Permission   Bash  $ git push --force origin main         │  headline
//   │    ▸ arguments                                               │  arguments fold
//   │    [allow once] [allow for session] [deny…]                  │  answer bar (open)
//   │  ✓ allowed for session · 14:02                               │  success: verdict line replaces the bar
//   │  – went unanswered · 14:05                                   │  error: the question went away
message FeedPermission {
  conversation.v1.ToolCallId call = 1;
  FeedPermissionHeadline headline = 2;
  FeedPermissionArguments arguments = 3;
  // THE ARM IS THE STATE.
  oneof result {
    FeedPermissionUpdate update = 4;
    FeedPermissionSuccess success = 5;
    FeedPermissionError error = 6;
  }
}

// The call's headline, resolved by the daemon (icon · title · subtitle).
message FeedPermissionHeadline {
  string icon = 1;
  string title = 2;
  string subtitle = 3;
}

// The call's arguments, folded: label/value lines the daemon composed.
message FeedPermissionArguments {
  repeated FeedPermissionArgument lines = 1;
}
message FeedPermissionArgument {
  string label = 1;
  string value = 2;
}

// Awaiting the user: the answer bar is drawn. Its buttons send agentrepl.v1
// requests; nothing about them is a field here.
message FeedPermissionUpdate {}

// Answered. THE ARM IS THE ANSWER. A denial is an ANSWER — the user was asked
// and said no — which is why it is here and not under error.
message FeedPermissionSuccess {
  oneof answer {
    FeedPermissionAllowedOnce allowed_once = 1;
    FeedPermissionAllowedForSession allowed_for_session = 2;
    FeedPermissionDenied denied = 3;
  }
  // When it was answered, epoch ms.
  int64 at_ms = 4;
}
message FeedPermissionAllowedOnce {}
message FeedPermissionAllowedForSession {}
message FeedPermissionDenied {
  // What the user said, when they said anything.
  string reason = 1;
}

// The question went away without an answer — the turn ended, the session
// stopped. THE ARM IS HOW.
message FeedPermissionError {
  oneof reason {
    FeedPermissionAbandoned abandoned = 1;
  }
  // When it went away, epoch ms.
  int64 at_ms = 2;
}
message FeedPermissionAbandoned {}
// ⑤ THE CONTEXT-CUT DIVIDER — the conversation was cut here, and a reader
// scrolling back must see where. Drawn from conversation.v1.ContextCut.
message FeedContextCut {
  // The divider's label ("context compacted", "context cleared").
  FeedContextCutLabel label = 1;
  // ONE ARM: a cut is a recorded fact; it is never in flight and it does not
  // fail (a compaction that read cold still compacted — see the cold-read
  // notice on the compacted arm).
  oneof result {
    FeedContextCutSuccess success = 2;
  }
}
// The cut, drawn.
message FeedContextCutSuccess {
  // What the cut did to the context's size, drawn on the divider. EVERY cut
  // has one, including a clear: clearing reloads the system prompt, skills
  // and memory, so the after side is small rather than zero, and showing it
  // is what lets a reader see that.
  FeedContextCutTokens tokens = 1;
  // THE ARM IS THE KIND OF CUT.
  oneof cut {
    FeedContextCutCleared cleared = 2;
    FeedContextCutCompacted compacted = 3;
  }
}

// The divider's label, verbatim.
message FeedContextCutLabel {
  string text = 1;
}

// The size change the divider draws, as "180k → 12k". Both sides are already
// formatted by the daemon; the client renders them verbatim and does no
// arithmetic and no unit rounding of its own.
message FeedContextCutTokens {
  // Tokens in context immediately before the cut, formatted for display.
  string before_text = 1;
  // Tokens in context immediately after the cut, formatted for display.
  string after_text = 2;
}

// The history was discarded outright, with nothing left in its place — the
// divider has nothing to expand.
message FeedContextCutCleared {}

// The history was COMPRESSED: what came before was replaced by the agent's
// own condensed rendering of it, which the divider draws folded so the cut is
// not a hole in the conversation.
message FeedContextCutCompacted {
  FeedContextCutSummary summary = 1;
  FeedContextCutFold fold = 2;
  // Set when the compaction re-read the whole conversation at the uncached
  // rate — the cost compaction exists to avoid. A NOTICE on a compaction
  // that happened, not a failure of it; drawn as a warning on the divider.
  FeedContextCutColdRead cold_read = 3;
}
// The compaction read cold; the evidence, imported whole from failure.proto.
message FeedContextCutColdRead {
  FailureCompactionColdRead evidence = 1;
}

// The compression of the preceding conversation, drawn as markdown.
message FeedContextCutSummary {
  string markdown = 1;
}

// Whether the compression is drawn folded.
message FeedContextCutFold {
  bool folded = 1;
}
// ⑥ A WORKSPACE MERGE, coalesced into ONE bubble. The daemon orchestrates the
// merge (a skill run under the hood) and DECIDES which records belong to it;
// the vendor knows nothing about any of it. The bubble's body is a TAB STRIP:
// one tab per phase the run actually entered, in entry order.
//
//   │ ⇄ merge  DWC/fix-flaky → master           6:31  ● merging  ▾      │
//   │ ┌───────────────────────────────────────────────────────────────┐ │
//   │ │ queue ✓ │ rebase ✓ │ conflicts ✓ 3 │ tests ● 8/12            │ │
//   │ ├───────────────────────────────────────────────────────────────┤ │
//   │ │  │ ⚙ agent ▏fixing TestReconnect…                            │ │
//   │ └───────────────────────────────────────────────────────────────┘ │
message FeedMerge {
  FeedMergeHead head = 1;
  // THE ARM IS THE STATE of the merge as a whole — the head's badge. WHAT it
  // is doing right now is the last tab, not a field here.
  oneof result {
    FeedMergeUpdate update = 2;
    FeedMergeSuccess success = 3;
    FeedMergeError error = 4;
  }
  // The phases entered so far, in entry order — the tab strip. APPEND-ONLY:
  // a tab appears BECAUSE that work began, so there is no pending tab, and a
  // phase never reopens. A second round of a phase is a SECOND TAB
  // ("conflicts (2)"), deliberately, so an abnormal second pass looks
  // abnormal without any badge saying so.
  repeated FeedMergePhase phases = 5;
}

// The bubble's head line: the constant props.
message FeedMergeHead {
  FeedMergeGlyph glyph = 1;
  FeedMergeLabel label = 2;
  FeedMergeRuntime runtime = 3;
  FeedMergeFold fold = 4;
}

// The kind glyph, a name from the shared vocabulary ("merge").
message FeedMergeGlyph {
  string icon = 1;
}

// The branch line, resolved ("DWC/fix-flaky-test → master").
message FeedMergeLabel {
  string text = 1;
}

// When the merge was enqueued — the head's running clock while live.
message FeedMergeRuntime {
  int64 started_at_ms = 1;
}

// Still in the queue or still merging.
message FeedMergeUpdate {}

// It landed: when, and the commit it produced. `ended_at_ms` lives on the
// terminal arms because it means nothing while live.
message FeedMergeSuccess {
  int64 ended_at_ms = 1;
  string commit = 2;
}

// It did not land: when, and why. THE ARM IS WHY.
message FeedMergeError {
  int64 ended_at_ms = 1;
  oneof reason {
    FeedMergeFailed failed = 2;
    FeedMergeAbandoned abandoned = 3;
  }
}
// The run gave up; a resolved sentence for the collapsed line.
message FeedMergeFailed {
  string summary = 1;
}
// Taken off the queue before it ever reached the front.
message FeedMergeAbandoned {}

// The ▸/▾ state. UI preference the daemon holds; see the roster's fold.
message FeedMergeFold {
  bool folded = 1;
}

// ONE TAB of the merge bubble. A tab draws from exactly two things and
// derives nothing: its label, and its state (which picks the badge's
// treatment). Whatever DETAIL the badge shows comes from the kind arm, which
// is already resolved.
message FeedMergePhase {
  // The tab's label, resolved by the daemon, round number included
  // ("conflicts (2)"). The client counts nothing.
  FeedMergePhaseLabel label = 1;
  // THE ARM IS THE BADGE. Monotonic: update once, then success or error, never
  // reopened — a repeat of this work is a new tab, not this one going live
  // again.
  oneof result {
    FeedMergePhaseUpdate update = 2;
    FeedMergePhaseSuccess success = 3;
    FeedMergePhaseError error = 4;
  }
  // THE ARM IS WHAT THIS PHASE IS, and carries the evidence that phase has.
  oneof kind {
    FeedMergePhaseQueue queue = 5;
    FeedMergePhaseRebasing rebasing = 6;
    FeedMergePhaseResolving resolving = 7;
    FeedMergePhaseBuilding building = 8;
    FeedMergePhaseTesting testing = 9;
    FeedMergePhaseLanding landing = 10;
  }
}

// The tab's label.
message FeedMergePhaseLabel {
  string text = 1;
}

// This phase is the one running.
message FeedMergePhaseUpdate {}

// Finished cleanly: when, and the badge's summary when there is one ("3
// files", "0844824").
message FeedMergePhaseSuccess {
  int64 ended_at_ms = 1;
  string summary = 2;
}

// Finished badly: when, and a resolved sentence ("3 tests still failing").
message FeedMergePhaseError {
  int64 ended_at_ms = 1;
  string summary = 2;
}

// ==========================================================================
// The merge phases. Each carries its own evidence, and the working phases
// each carry their nested rows' count — the records the agent produced doing
// that phase's work, parented to the PHASE rather than to the merge, so
// "which pass produced this fix" is answerable by structure.
// ==========================================================================

// WAITING IN THE QUEUE. Its content is a SNAPSHOT, replacing the previous one
// whole — there are no deltas and no ordering to reconcile, exactly as a
// background shell's spool is replaced whole. The daemon republishes on any
// queue change AND on any phase change at the front, which is what makes a
// waiting user see motion rather than a static "3 ahead".
//
// It has no records of its own: nothing is being done here.
//
// WHEN THIS WORKSPACE REACHES THE FRONT the tab SETTLES, frozen on its last
// snapshot ("you were #1 of 4"), and the phase tabs take over. It does not
// keep updating — the front workspace is shown nothing about the queue,
// because a merging user cares about the merge, not about who is behind
// them.
message FeedMergePhaseQueue {
  FeedMergeQueue queue = 1;
}

// The queue, as this workspace sees it. Every workspace appears exactly once,
// and WHICH ENTRY THE READER IS is `current` — structurally, never by
// comparing ids.
message FeedMergeQueue {
  // Ahead of us, front-first.
  repeated FeedMergeQueueEntry ahead = 1;
  // Us. The "you are here" row.
  FeedMergeQueueEntry current = 2;
  // Behind us, front-first.
  repeated FeedMergeQueueEntry behind = 3;
}

// One workspace in the queue — the same drawn row wherever it sits.
message FeedMergeQueueEntry {
  FeedMergeQueueWorkspace workspace = 1;
  FeedMergeQueueLabel label = 2;
  // THE ARM IS WHAT THIS WORKSPACE IS DOING. Only the front entry is ever
  // `merging`, and only `merging` has a phase to report.
  oneof status {
    FeedMergeQueueMerging merging = 3;
    FeedMergeQueueWaiting waiting = 4;
  }
}

// Which workspace this row names, so the row is a jump target.
message FeedMergeQueueWorkspace {
  string value = 1;
}

// The row's label, resolved ("DWC/roster-resolver").
message FeedMergeQueueLabel {
  string text = 1;
}

// At the front and running. This MIRRORS that workspace's own merge bubble:
// the SAME phase messages its tab strip uses, imported rather than respelled,
// so the two never drift.
message FeedMergeQueueMerging {
  oneof phase {
    FeedMergePhaseRebasing rebasing = 1;
    FeedMergePhaseResolving resolving = 2;
    FeedMergePhaseBuilding building = 3;
    FeedMergePhaseTesting testing = 4;
    FeedMergePhaseLanding landing = 5;
  }
}

// Waiting its turn; nothing to report beyond who it is.
message FeedMergeQueueWaiting {}

// Bringing the branch up to date on its base.
message FeedMergePhaseRebasing {
  // The base, resolved ("master @ 0844824").
  string base = 1;
  FeedMergePhaseRowCount rows = 2;
}

// The agent is resolving conflicts. This is the phase that makes the bubble
// read as an agent bubble at all.
message FeedMergePhaseResolving {
  // The conflicted paths, in display order.
  repeated string paths = 1;
  // The one being worked right now, when the daemon can name it.
  string current_path = 2;
  FeedMergePhaseRowCount rows = 3;
}

// Building after the resolution.
message FeedMergePhaseBuilding {
  // The build's live line, resolved ("compiling daemon").
  string detail = 1;
  FeedMergePhaseRowCount rows = 2;
}

// Running the suite; the agent fixes what it breaks, which is more records.
message FeedMergePhaseTesting {
  // Which suite ("elisp", "webapp", "e2e"), resolved.
  string suite = 1;
  // Progress, composed by the daemon ("8/12"); the client counts nothing.
  string progress = 2;
  FeedMergePhaseRowCount rows = 3;
}

// Landing the result: the push, the queue interaction, the commit produced.
// The merge's own narration — the skill's initiating prompt, the closing
// message — is THIS phase's records, which is why the body is uniformly tabs
// and carries no loose rows.
message FeedMergePhaseLanding {
  FeedMergePhaseRowCount rows = 1;
}

// How many nested rows this phase has. The rows themselves are ordinary
// FeedRows whose `parent` is the phase, paged through the same page and
// breadcrumbs as the feed.
message FeedMergePhaseRowCount {
  int32 count = 1;
}

// ==========================================================================
// PENDING — old bodies, verbatim, judged one kind at a time.
// ==========================================================================

