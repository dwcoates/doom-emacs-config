    // A condition that blocks the close stands.
    FooterStatusClosingSalient salient = 1;
    // Nothing salient stands: the newest transient (if any) over the
    // enduring line.
    FooterActivityTransientOverEnduring unpinned = 2;
  }
}
// The salient kinds legal while closing. The refusal ranks first, because it
// explains the `vendor_fault` step; then a deploy's progress and the push
// notification, in that order.
message FooterStatusClosingSalient {
