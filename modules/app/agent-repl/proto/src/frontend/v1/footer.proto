// footer.proto — THE FOOTER: the workspace's status strip, its selectable
// cells and chips, and the expanded section their selection opens.
// Per-workspace; resolved by the daemon.
//
// THE MAIN STRIP, left to right — resolution INCREASES left to right across
// the three status sections, each TYPED, each "less" typed than the last by
// carrying more of its information in text fields; then the turn's figures;
// then the live-work chips, right-aligned:
//
//   ┌───────────┬─────────────────────┬──────────────────────────────┬───────┬───────────────┬─────────────┐
//   │ merging   │ cherry-picking 3/7  │ 4f2a1c: fold tokens into api │ 0:42  │ 18.2k in ⚠ ✓ │ ⚙3 ☑3/7 $2 │
//   └───────────┴─────────────────────┴──────────────────────────────┴───────┴───────────────┴─────────────┘
//     Status      SubStatus             StatusActivity                 Clock   Tokens cell     LiveWork chips
//     coarsest ──────────── resolution increases ────────────► finest
//
//   Status         the coarsest state, one word + color, a small closed set;
//                  `interrupted` is a status like any other, cleared by the
//                  next status update.
//   SubStatus      the step WITHIN the status, typed per status family, with
//                  the small facts a step has (queue position, commit counts).
//   StatusActivity the finest, DYNAMIC line: typed KINDS whose payload is
//                  mostly text the daemon composed.
//   Clock          how long the current turn has been running.
//   Tokens cell    how much the in-flight turn has added to the MAIN agent's
//                  context window (`--` with no turn in flight), with two
//                  glyphs; a click target opening the token panel.
//   LiveWork chips ⚙ live subagents · ☑ the task tracker · $ live shells —
//                  each a click target opening its panel.
//
// THE EXPANDED SECTION opens above the strip when a selectable element (the
// tokens cell or a chip) is selected. The selection is WEBVIEW-LOCAL, so the
// daemon ships EVERY panel fully resolved on every push and the client draws
// whichever one the local selection picks — opening a panel needs no
// round-trip (the folded-menu convention).
//
// EVERY FIELD IS AN ELEMENT MESSAGE, nested as the UI nests. The daemon
// resolves every level; the client renders and derives nothing — there is no
// client-side precedence between windows, no phase→word table, no mapping of
// any state to a color, and no counting of panel rows to label a chip.

syntax = "proto3";

package frontend.v1;

import "frontend/v1/feed.proto";
import "frontend/v1/token_heat.proto";

option go_package = "agentrepl/proto/frontend/v1;frontendv1";

// ==========================================================================
// THE FOOTER VIEW
// ==========================================================================

// The footer: the always-drawn strip plus the expanded section's panels.
// EVERY panel is always resolved on every push: which panel is open is a
// webview-local selection the daemon never learns.
// PUSH CADENCE, the convention for this view and every frontend.v1 view:
// EVENT-DRIVEN, WHOLE-VIEW, NO TICKS. The daemon pushes the view WHOLE
// whenever ANY resolved fact changes — never a partial, never a delta —
// and pushes NOTHING when nothing changed: there is no keepalive, no
// periodic re-push, and an identical consecutive push is waste, not
// protocol. Continuous motion (clocks, countdowns, relative ages) is
// CLIENT-side ticking from shipped instants. Bursts of upstream frames may
// coalesce into one push, because the wire carries STATES, not events.
message FooterView {
  // The one-line strip at the bottom of the workspace view. Always drawn.
  FooterStrip strip = 1;
  // The expanded section's content, one panel per selectable strip element.
  // Drawn only while a strip element is selected; the selection picks which.
  FooterExpanded expanded = 2;
  // WHICH EXPANDED PANEL THE DAEMON WANTS IN FRONT OF THE USER, when detached
  // work has just started. Unset until the first such launch. See
  // FooterExpandedFocus.
  optional FooterExpandedFocus focus = 3;
}

// ==========================================================================
// THE MAIN STRIP
// ==========================================================================

// The strip's elements, left to right. Status, sub-status and activity are
// the three typed resolution levels (coarsest → finest); clock and tokens
// are the turn's figures; the live-work chips sit right-aligned.
message FooterStrip {
  // The whole status family — coarse status, its step, and its activity
  // line — as ONE tree: each status arm declares exactly the sub-status
  // steps and activity kinds legal while it stands. Colors the strip.
  FooterStatus status = 1;
  // Tags 2-3 are RETIRED: the sub-status and activity cells are no longer
  // siblings of the status — each lives INSIDE the status arm that makes it
  // legal, so an illegal pairing is unrepresentable.
  // The turn clock. The client ticks from the carried instant.
  FooterClock clock = 4;
  // The tokens CELL: the in-flight turn's FRESH INPUT for the MAIN agent,
  // colored by its size, plus two glyphs, and the click target that opens
  // FooterExpandedTokens. The full breakdown lives in that panel, never here.
  FooterTokensCell tokens = 5;
  // The live-work chips, right-aligned. Each chip is a click target opening
  // its panel.
  FooterLiveWorkChips live_work = 6;
}

// ---- The status family — one hierarchy, legality by construction ---------

// The strip's coarse status, its finer step, and its finest activity line
// are ONE tree: the set arm IS the status, and each status arm declares
// exactly the sub-status steps and activity kinds that are legal while it
// stands, so an illegal pairing (a wakeup countdown under merging, a
// cherry-pick step under idle) is unrepresentable rather than forbidden by
// comment. Each arm's color is the shared render-colors vocabulary's, one
// per arm, resolved by the daemon into the CSS class the client applies;
// the client holds no table.
//
// RENDERING RULES, stated once:
// - The strip draws | status | substatus | activity |. A status arm with NO
//   substatus oneof merges the substatus cell into the status cell, and the
//   activity cell always absorbs the free width.
// - STATUS AND SUBSTATUS TEXT is rendered lowercase ASCII with spaces,
//   NEVER underscores — the arm name is a schema spelling, not the label.
// - ACTIVITY is the rich cell: colorized, formatted, and ALWAYS EXACTLY ONE
//   LINE, truncated with an ellipsis when it would overflow; it never grows
//   the strip's height. The status and substatus cells may wrap. A
//   STATICALLY TYPED datum in an activity message (a count, an instant, a
//   sha) is a strong indicator that datum deserves color in the rendered
//   line.
// - EVERY ACTIVITY LINE BELONGS TO ONE OF THREE TIERS, defined by WHAT ENDS
//   the line (the owner's rulings of 2026-09-28, 2026-09-30 and 2026-10-01;
//   agent-repl AGENTS.md "Footer activity lines are salient, transient, or
//   enduring"). A fourth, QUIET tier (the line composed from the feed item
//   that landed last, standing until the next one surfaced) is RETIRED
//   (owner ruling, 2026-10-01): it was too chatty and added next to nothing.
//     SALIENT    ends when the condition it describes stops being true, never
//                on a timer. STATUS-BOUND: each status arm declares its own
//                salient kinds, so a salient line illegal under a status is
//                unrepresentable. A deploy's progress and the agent's push
//                notification ride every arm's salient oneof. A vendor
//                rate-limit event draws no salient line: it feeds the
//                enduring usage figures (owner ruling, 2026-10-01). No line
//                warns that the context is nearly full (owner ruling,
//                2026-10-06): a failed compaction is the feed's outcome
//                marker alone.
//     TRANSIENT  ends when a newer transient replaces it or its expiry
//                instant passes. STATUS-INDEPENDENT (FooterActivityTransient):
//                an event can land under any status, and the last event may
//                outlive the status it landed under by its display window.
//     ENDURING   never ends: always true, so the cell is never empty
//                (FooterActivityEnduring). ONE line, chosen by the daemon.
//                STATUS-INDEPENDENT.
// - PRECEDENCE IS BY TIER, ALWAYS: salient, then transient, then enduring. A standing salient line outranks every other tier, so a push
//   carries EITHER the salient line OR the unpinned tiers beneath it, never
//   both. Within the salient tier a kind that explains the standing substatus
//   ranks first, then a fault, then a deploy's progress (`update`), then the
//   push notification. Within the transient tier the NEWEST wins, so a push
//   carries at most one transient.
// - THE DAEMON DECIDES A TRANSIENT'S EXPIRY; THE CLIENT APPLIES IT. The
//   transient ships with its expiry instant beside the lines beneath it, and
//   the client draws the transient until its clock passes the expiry, then
//   the enduring line. The
//   daemon runs no expiry timer and pushes nothing when a transient lapses:
//   what is drawn is a pure function of the last push and the client's clock,
//   the same client-side ticking the turn clock does.
//
// THE FAULT PARTITION — where every daemon fault kind lands on the strip.
//
// The owner's ruling of 2026-09-13: EVERY daemon fault kind reaches the
// footer. Three rules shape the mapping and are worked out here once.
//
//  1. STATUS IS THE FAULT'S DOMAIN. `agent_repl_fault` (BLUE, composer
//     closed) carries the faults that mean one of agent-repl's own services
//     cannot serve the workspace; `network_fault` (BLUE) carries this
//     machine being offline; `vendor_fault` (TURQUOISE, composer open,
//     prompts held) carries everything the vendor (Claude, the Agent SDK)
//     cannot do while agent-repl itself is fine. Precedence:
//     agent_repl_fault > network_fault > vendor_fault.
//  2. SUBSTATUS IS A BUCKET, onto the activity values: several fault kinds
//     land in one substatus, and no substatus was minted to match a kind
//     one-for-one.
//  3. ACTIVITY IS THE LEAST GENERAL: the kind's own name and its detail line,
//     carried by FooterStatusActivityFault (or, for `shim_start_failed`
//     alone, by the richer FooterStatusActivityStartFailed, and for the three
//     vendor-start kinds by FooterStatusActivityVendorStart).
//
// ESCALATING FAULTS — the fault DECIDES the status, because the session
// cannot serve while it stands:
//
//   | status           | substatus        | fault kinds                        |
//   |------------------|------------------|------------------------------------|
//   | agent_repl_fault | start_failed     | shim_start_failed, resume_failed,  |
//   |                  |                  | relaunch_resume_failed,            |
//   |                  |                  | adoption_window_expired (session), |
//   |                  |                  | cold_gate_reopen_failed            |
//   | agent_repl_fault | dead             | shim_died, bounce_died,            |
//   |                  |                  | session_absent                     |
//   | agent_repl_fault | severed          | link_severed, watch_open_refused   |
//   | agent_repl_fault | daemon_impaired  | prompts_dir_missing, wsm_read_only,|
//   |                  |                  | log_sink_poisoned,                 |
//   |                  |                  | successor_spawn_failed,            |
//   |                  |                  | daemon_state_unreadable,           |
//   |                  |                  | adoption_window_expired (daemon)   |
//   | network_fault    | offline          | network_unreachable                |
//   | vendor_fault     | vendor_retry     | vendor_start_retrying              |
//   | vendor_fault     | vendor_rejection | vendor_start_rejected              |
//   | vendor_fault     | vendor_failed    | vendor_start_failed                |
//
// ESCALATING FAULTS ARE SALIENT: their line is the `fault` kind of the
// fault arms' salient oneofs, standing until the fault is
// retracted.
//
// NON-ESCALATING FAULTS — the session IS serving, so the status is left
// exactly as it was and the fault is announced as a TRANSIENT line (the
// transient tier's `fault` kind): a condition that blocks neither the turn
// nor the user is transient by definition, and pinning it would hide the
// session's live feedback for as long as the fault stands:
//
//   | status     | substatus | fault kinds                                  |
//   |------------|-----------|----------------------------------------------|
//   | (whatever  | (whatever | shim_reported, classifier_failed,            |
//   |  stands)   |  stands)  | bounce_unknown, conversation_abandoned,      |
//   |            |           | final_answer_unresolved,                     |
//   |            |           | deploy_failed (daemon)                       |
//
// WHY THOSE FOUR DO NOT ESCALATE, since the ruling's worked example put them
// under `disconnected · degraded`: the shim answered in every one of them. A
// shim that PUSHED a diagnostic is alive; a classifier run is a headless side
// errand; an undetermined bounce disposition is an accounting question for a
// human; an abandoned conversation is the record of what a SUCCESSFUL fresh
// bring-up left behind. Saying `agent_repl_fault` of any of them would be false,
// and it is not only a wording question: `agent_repl_fault` CLOSES THE COMPOSER
// (webapp/src/main.ts), so escalating them would lock the user out of a
// session that is serving perfectly. The fault still reaches the footer —
// which is what the ruling asked for — as a transient activity line.
//
// `final_answer_unresolved` joins them for the same reason and one more. It is
// the turn that concluded with no green answer standing (the terminal named
// none while prose was drawn, the named answer resolved to no row, or an open
// response went silent) — the session is healthy and the prose is on screen,
// so nothing about it means the session cannot be used. Its three cases are
// told apart by the `why` value SessionFaultFinalAnswerUnresolved carries,
// never by a substatus, because a substatus is only legal under a status the
// fault claims and neither claimable status would be true here.
//
// `deploy_failed` is daemon-scoped and joins them because the daemon that ran
// the deploy KEEPS SERVING on the build it already runs: a build that failed
// installed nothing, an install that failed restarted nothing, and a service
// that did not come back has its own faults. `agent_repl_fault` would close no
// composer, but it would still say the daemon cannot serve a session it is
// serving. The fault line names the step and its last line of output.
//
// `bounce_disposition` is the one recorded kind with no footer cell, for the
// same reason it has no wire arm: it is opened and closed in one breath as
// per-session accounting, and never stands.
//
// TURN FAULTS — the workspace status takes the fault a failed turn ended on
// (owner ruling, 2026-10-06; the feed draws the event as an outcome marker,
// FeedOutcomeMarker, never as a bubble). The cause decides the domain:
//
//   | cause                                   | status · substatus           |
//   |-----------------------------------------|------------------------------|
//   | every cause the vendor ended or refused | vendor_fault · vendor_error  |
//   |  (every api error, an account cause,    |  (a standing account block   |
//   |  the token ceiling, max turns, max      |  keeps its own `auth`,       |
//   |  budget, a refusal, an execution error, |  `usage_limit` or `billing`) |
//   |  every turn_failed stop reason)         |                              |
//   | the vendor query died, or the agent     | agent_repl_fault · turn_died |
//   |  process died, with the turn            |                              |
//   | an interrupt, a Stop hook that ended    | no fault                     |
//   |  the run, a deferred tool               |                              |
//
// The activity cell carries the daemon's per-cause sentence, the same one
// the feed's turn-end row carries as its headline (`turn_ended`), with the
// vendor's wait counted down for a rate limit or an overload. A turn fault
// stands until the next turn starts.
message FooterStatus {
  // What the session is doing now, at the coarsest resolution. Exactly one
  // arm is set; a frame with none is malformed and rejected loudly.
  oneof status {
    // Nothing in flight; the session serves on demand.
    FooterStatusIdle idle = 1;
    // A turn is in flight. Its step names what the main agent is doing now.
    FooterStatusWorking working = 2;
    // The session is parked on something — a self-scheduled wakeup, a
    // consent card, or a question batch.
    FooterStatusWaiting waiting = 3;
    // MOMENTARY: the last turn was stopped; cleared by the next status push.
    FooterStatusInterrupted interrupted = 4;
    // A daemon-orchestrated merge is IN FLIGHT for this workspace: being
    // enqueued, queued, or running one of its phases. A merge that has
    // STOPPED — on a conflict, parked, failed or landed — is never this arm;
    // each of those is its own arm below (owner ruling, 2026-09-28).
    FooterStatusMerging merging = 5;
    // Detached work runs while the main thread is free.
    FooterStatusBackground background = 6;
    // A VENDOR FAULT: agent-repl's own services serve this workspace, but
    // the vendor (Claude, the Agent SDK) cannot: an auth prompt, an exhausted
    // usage limit, a billing refusal, a vendor error, a retried API call, a
    // dead vendor query, or a vendor start being retried, rejected or given
    // up on. TURQUOISE: the workspace is USABLE — the composer stays OPEN and
    // a prompt sent meanwhile is held until the vendor serves again. Outranked
    // by `agent_repl_fault` and `network_fault`.
    FooterStatusVendorFault vendor_fault = 7;
    // Tag 8 is RETIRED: the asleep status died with hibernation leaving
    // the contract.
    // AN AGENT-REPL FAULT: one of agent-repl's own services for this
    // workspace is not serving — the shim is starting, severed, dead or
    // failed to start, or the daemon itself is impaired. BLUE: the workspace
    // is unusable and the composer is CLOSED. It outranks every other fault.
    FooterStatusAgentReplFault agent_repl_fault = 9;
    // A close was requested and has not completed.
    FooterStatusClosing closing = 10;
    // MOMENTARY: context is being injected (memory, skills); falls back on
    // the next frame.
    FooterStatusLoading loading = 11;
    // Tag 12 (`merge_conflict`, a merge stopped awaiting the user) is
    // RETIRED: nothing parks; a merge whose conflict resolution gives up is
    // `merge_failed` with substatus "conflicts".
    // The merge FAILED and the workspace is handed back to the user: it left
    // the queue at once, so the merges behind it go on. It is the same coarse
    // claim as the roster's `merge_failed` arm. TURQUOISE: something went
    // wrong, and the workspace is still usable. TERMINAL: the merge no longer
    // holds the session, so the composer is OPEN, and the user's next prompt
    // is an ordinary turn.
    FooterStatusMergeFailed merge_failed = 13;
    // The merge LANDED. It is the same coarse claim as the roster's `merged`
    // arm. GREEN. TERMINAL: the merge no longer holds the session, so the
    // composer is OPEN.
    FooterStatusMerged merged = 14;
    // NO LONGER EMITTED: a failed turn's status is the fault its cause
    // names (owner ruling, 2026-10-06): `vendor_fault · vendor_error` or
    // `agent_repl_fault · turn_died`. Kept so an older frame still decodes.
    FooterStatusTurnFailed turn_failed = 15;
    // The session SERVES, but the daemon's view of it is compromised: a shim
    // component is dropping or delaying what it observes, or a shim taken
    // back after a failed handover never re-reported its session state. The
    // same coarse claim as the roster's `degraded` arm. TURQUOISE (owner
    // ruling, 2026-09-28): the workspace is USABLE, so the composer is OPEN.
    // It replaces `disconnected · degraded`, which is no longer emitted.
    FooterStatusDegraded degraded = 16;
    // A NETWORK FAULT: this machine cannot reach the network, so nothing
    // that needs it (the vendor above all) can work, though agent-repl's own
    // services are up. Told apart from a vendor fault by the shim, which
    // separates an unreachable network from an answer the vendor gave. BLUE:
    // the composer is CLOSED. Outranked only by `agent_repl_fault`.
    FooterStatusNetworkFault network_fault = 17;
  }
  // Tag 12 (`merge_conflict`) is retired; see the note in the oneof.
  reserved 12;
  reserved "merge_conflict";
}

// Nothing in flight; the session serves on demand.
message FooterStatusIdle {
  // The finer idle step. UNSET when the daemon knows no finer step.
  oneof substatus {
    // Never ran a turn this session.
    FooterSubStatusIdleReady ready = 1;
    // The last turn concluded normally, or stopped where it was configured
    // or asked to (a Stop hook, a deferred tool): an expected stop awaiting
    // the user (owner ruling, 2026-09-28).
    FooterSubStatusIdleDone done = 2;
    // NO LONGER EMITTED: a failed turn is the `turn_failed` status arm
    // (owner ruling, 2026-09-28: a failed turn is turquoise, not idle's
    // green). Kept so an older frame still decodes.
    FooterSubStatusIdleTurnFailed turn_failed = 4;
  }
  // The activity cell. ALWAYS SET: the enduring tier guarantees the cell has
  // something to draw under every status.
  FooterStatusIdleActivity activity = 3;
}
// The activity cell while idle: the salient line, or the transient over the
// enduring line.
message FooterStatusIdleActivity {
  // WHICH TIER the daemon resolved. A salient line outranks every transient,
  // so the two branches are exclusive; exactly one is set, and a push with
  // neither is malformed.
  oneof tier {
    // A condition that blocks the turn or the user stands.
    FooterStatusIdleSalient salient = 1;
    // Nothing salient stands: the newest transient (if any) over the
    // enduring line.
    FooterActivityTransientOverEnduring unpinned = 2;
  }
}
// The salient kinds legal while idle, and under the `turn_failed` and
// `degraded` statuses, which share this cell. The dead-query line ranks
// first, because it explains a `turn_failed` status; then a deploy's
// progress; then the push notification, in that order.
message FooterStatusIdleSalient {
  // When this line began standing; the client ticks the relative age per the
  // clock convention. A push without it is a loud daemon fault.
  FooterStatusActivityAt at = 1;
  // The one salient line.
  oneof kind {
    // A DEPLOY'S PROGRESS, standing until the deploy is done for this
    // workspace. STATUS-INDEPENDENT: every status arm's salient oneof carries
    // it, because a deploy moves what serves every workspace. See
    // FooterStatusActivityUpdate.
    FooterStatusActivityUpdate update = 2;
    // The dead-query line ("vendor query died — the next prompt restarts
    // it"), standing under `turn_failed` until the next turn opens. SALIENT:
    // the prompt the failed turn carried was never answered, which blocks the
    // user until they prompt again.
    FooterStatusActivityQueryDied query_died = 3;
    // THE AGENT'S PUSH NOTIFICATION, standing until the next prompt is
    // submitted. STATUS-INDEPENDENT: every status arm's salient oneof carries
    // it.
    FooterStatusActivityNotification notification = 5;
  }
  // Tag 6 (`context_budget`) is RETIRED: no footer line warns that the
  // context is nearly full (owner ruling, 2026-10-06). A failed compaction
  // is the feed's outcome marker alone.
  reserved 6;
  reserved "context_budget";
  // Tag 4 (`rate_limit`) is RETIRED: the enduring usage line carries
  // the vendor's allowance figures (owner ruling, 2026-10-01).
  reserved 4;
  reserved "rate_limit";
}

// Never ran a turn this session.
message FooterSubStatusIdleReady {}
// The last turn concluded normally.
message FooterSubStatusIdleDone {}
// The last turn failed for a reason that is not the vendor's or the account's.
message FooterSubStatusIdleTurnFailed {}

// NO LONGER EMITTED (owner ruling, 2026-10-06): a failed turn's status is
// the fault its cause names, and the footer carries the cause. Kept so an
// older frame still decodes.
message FooterStatusTurnFailed {
  // No substatus: the substatus cell merges into the status cell.
  // The activity cell. ALWAYS SET, the same cell an idle session carries.
  // When the turn failed because the vendor query died, the cell is the
  // salient dead-query line.
  FooterStatusIdleActivity activity = 1;
}

// The session serves, but the daemon's view of it is compromised.
message FooterStatusDegraded {
  // Which part of the view is compromised. Exactly one is set.
  oneof substatus {
    // A shim component is dropping or delaying what it observes: what is on
    // screen may have holes from the degraded window.
    FooterSubStatusDegradedObservation observation = 1;
    // A shim this daemon took back after a failed handover never re-reported
    // its session state, so the daemon cannot see whether a turn is in
    // flight. A prompt is still delivered, and matched to its reply by id.
    // It clears when the shim re-reports.
    FooterSubStatusDegradedStateUnreported state_unreported = 2;
  }
  // The activity cell. ALWAYS SET, the same cell an idle session carries.
  FooterStatusIdleActivity activity = 3;
}
// A shim component is dropping or delaying what it observes.
message FooterSubStatusDegradedObservation {}
// A taken-back shim has not re-reported its session state.
message FooterSubStatusDegradedStateUnreported {}

// A turn is in flight.
message FooterStatusWorking {
  // WHAT THE MAIN AGENT IS DOING NOW, one step at a time and SYNC ONLY: work
  // that has left the turn (a detached shell, a detached subagent) is never a
  // step. UNSET when the daemon knows no finer step.
  oneof substatus {
    // The prompt is being delivered.
    FooterSubStatusWorkingSubmitting submitting = 1;
    // An inference call is running and no tool call of the main agent is: the
    // model is reasoning or writing its response.
    FooterSubStatusWorkingThinking thinking = 2;
    // A /clear is being applied.
    FooterSubStatusWorkingClearing clearing = 3;
    // A compaction is running.
    FooterSubStatusWorkingCompacting compacting = 4;
    // A tool call runs that has no step of its own: a shell command, an MCP
    // server's tool, a skill, and every other tool not named below.
    FooterSubStatusWorkingExecuting executing = 6;
    // A file is being read.
    FooterSubStatusWorkingReading reading = 7;
    // A file is being written or edited.
    FooterSubStatusWorkingWriting writing = 8;
    // A search runs: file contents (grep), file paths (glob), or the web.
    FooterSubStatusWorkingSearching searching = 9;
    // A URL's content is being fetched.
    FooterSubStatusWorkingFetching fetching = 10;
    // A subagent runs that the main agent waits on.
    FooterSubStatusWorkingDelegating delegating = 11;
  }
  // The activity cell. ALWAYS SET: the enduring tier guarantees the cell has
  // something to draw under every status.
  FooterStatusWorkingActivity activity = 5;
  // Tag 12 (`quiet_stretch_ending`) is RETIRED with the quiet tier (owner
  // ruling, 2026-10-01: the quiet-stretch lines were too chatty and added
  // next to nothing).
  reserved 12;
  reserved "quiet_stretch_ending";
}
// The activity cell while a turn runs: the salient line, or the transient
// over the enduring line. Most of a turn is unpinned: the transient tier keeps
// the cell moving with the turn's task moves.
message FooterStatusWorkingActivity {
  // WHICH TIER the daemon resolved. A salient line outranks every transient,
  // so the two branches are exclusive; exactly one is set, and a push with
  // neither is malformed.
  oneof tier {
    // A condition that blocks the turn stands.
    FooterStatusWorkingSalient salient = 1;
    // Nothing salient stands: the newest transient (if any) over the
    // enduring line.
    FooterActivityTransientOverEnduring unpinned = 2;
  }
}
// The salient kinds legal while a turn runs: the acts that hold the turn
// until their own end signal arrives.
message FooterStatusWorkingSalient {
  // When this line began standing; the client ticks the relative age.
  FooterStatusActivityAt at = 1;
  // The one salient line. A compaction ranks first, because it explains the
  // `compacting` step; a retry next; then a deploy's progress and the push
  // notification, in that order.
  oneof kind {
    // A COMPACTION'S OWN PROGRESS, phase by phase, standing while the
    // compaction RUNS and ending with the cut (or the turn's terminal) that
    // ends it. Both compactions speak through it — the vendor's
    // auto-compaction and the cold gate's `compact and resume` remediation —
    // so the two read the same under the same `working · compacting` step.
    // A CONCLUDED compaction is never this line: its outcome is the transient
    // `compaction_concluded`, or the feed's outcome marker alone when it
    // failed, because a finished compaction blocks nothing.
    FooterStatusActivityCompaction compaction = 2;
    // The vendor call is being retried, standing until a response lands or
    // the turn ends. The turn cannot advance while the call fails.
    FooterStatusActivityRetrying retrying = 3;
    // A DEPLOY'S PROGRESS. STATUS-INDEPENDENT: every status arm's salient
    // oneof carries it. See FooterStatusActivityUpdate.
    FooterStatusActivityUpdate update = 4;
    // THE AGENT'S PUSH NOTIFICATION, standing until the next prompt is
    // submitted. STATUS-INDEPENDENT: every status arm's salient oneof carries
    // it.
    FooterStatusActivityNotification notification = 6;
  }
  // Tag 7 (`context_budget`) is RETIRED: no footer line warns that the
  // context is nearly full (owner ruling, 2026-10-06). A failed compaction
  // is the feed's outcome marker alone.
  reserved 7;
  reserved "context_budget";
  // Tag 5 (`rate_limit`) is RETIRED: the enduring usage line carries
  // the vendor's allowance figures (owner ruling, 2026-10-01).
  reserved 5;
  reserved "rate_limit";
}
// The running compaction's progress line, composed by the daemon out of the
// phase the producer last stated ("summarizing the conversation…"). Drawn
// verbatim; a client words nothing.
message FooterStatusActivityCompaction {
  // The composed line, drawn verbatim.
  string text = 1;
}
// The prompt is being delivered.
message FooterSubStatusWorkingSubmitting {}
// An inference call is running and no tool call of the main agent is.
message FooterSubStatusWorkingThinking {}
// A /clear is being applied.
message FooterSubStatusWorkingClearing {}
// A compaction is running.
message FooterSubStatusWorkingCompacting {}
// A tool call with no step of its own is running.
message FooterSubStatusWorkingExecuting {}
// A file is being read.
message FooterSubStatusWorkingReading {}
// A file is being written or edited.
message FooterSubStatusWorkingWriting {}
// A search is running.
message FooterSubStatusWorkingSearching {}
// A URL's content is being fetched.
message FooterSubStatusWorkingFetching {}
// A subagent the main agent waits on is running.
message FooterSubStatusWorkingDelegating {}

// Parked on a wakeup, a consent card, or a question batch.
message FooterStatusWaiting {
  // WHAT the session waits on. Exactly one; a waiting status with no step
  // is malformed.
  oneof substatus {
    // The self-scheduled wakeup fallback: shown only when the footer would
    // otherwise read idle/done — any real status wins, resolved daemon-side.
    FooterSubStatusWaitingWakeup wakeup = 1;
    // A permission card is open; the agent is blocked on consent.
    FooterSubStatusWaitingPermission permission = 2;
    // A question batch is open; the agent is blocked on answers.
    FooterSubStatusWaitingQuestion question = 3;
    // The cold-context gate stands: the session is parked on the user's
    // remediation choice (pay / clear / compact). The feed's gate row is the
    // answering surface; the footer only says the session is parked on it.
    FooterSubStatusWaitingColdGate cold_gate = 5;
    // An interrupt was registered and the running turn's teardown has
    // begun; the next delivery will be the interrupting prompt. Pushed
    // the MOMENT the interrupt registers, before the turn's real end —
    // the user must see their stop acknowledged immediately.
    FooterSubStatusWaitingInterrupting interrupting = 6;
  }
  // The activity cell. ALWAYS SET, and ALWAYS SALIENT: every waiting step is
  // the session parked on something, and that something is the salient line
  // by construction — the countdown, the gated call, the question lead. A
  // producer that cannot compose it has a bug, not a missing fact.
  FooterStatusWaitingActivity activity = 4;
}
// The self-scheduled wakeup fallback state.
message FooterSubStatusWaitingWakeup {}
// A permission card is open; the agent is blocked on consent.
message FooterSubStatusWaitingPermission {}
// A question batch is open; the agent is blocked on answers.
message FooterSubStatusWaitingQuestion {}
// The cold-context gate stands; the session is parked on its answer.
message FooterSubStatusWaitingColdGate {}
// The turn is being stopped on the user's behalf.
message FooterSubStatusWaitingInterrupting {}
// The activity cell while waiting. It has NO unpinned branch: a waiting
// session is by definition parked on a condition that blocks the turn or the
// user, so the salient line always stands and every transient is outranked.
message FooterStatusWaitingActivity {
  // The standing salient line.
  FooterStatusWaitingSalient salient = 1;
}
// The salient kinds legal while waiting. The kind that explains the standing
// substatus ranks first (the interrupt, the gated call, the question lead,
// the cold gate, the countdown), then a deploy's progress, then the push
// notification, in that order.
message FooterStatusWaitingSalient {
  // When this line began standing; the client ticks the relative age.
  FooterStatusActivityAt at = 1;
  // The one salient line.
  oneof kind {
    // The wakeup countdown, standing until the wakeup fires or is stopped;
    // the client ticks from the deadline instant.
    FooterStatusActivityWakeup wakeup = 2;
    // The gated call, composed ("Bash: rm -rf …"), standing until the
    // permission is answered.
    FooterStatusActivityGatedCall gated_call = 3;
    // The open batch's lead, composed ("2 questions · Which approach?"),
    // standing until the batch is answered.
    FooterStatusActivityQuestionLead question_lead = 4;
    // The session reports it is parked on the user (requires_action) — a
    // vendor fact the daemon cannot decompose further.
    FooterStatusActivityBlockedOnUser blocked_on_user = 5;
    // The cold gate's cost line, composed by the daemon ("context cold —
    // 182k tokens to re-read"), standing until the gate is answered.
    FooterStatusActivityColdGateCost cold_gate_cost = 6;
    // The interrupting line, composed by the daemon ("stopping the
    // current turn…"), standing until the teardown resolves.
    FooterStatusActivityInterrupting interrupting = 7;
    // A DEPLOY'S PROGRESS. STATUS-INDEPENDENT: every status arm's salient
    // oneof carries it. See FooterStatusActivityUpdate.
    FooterStatusActivityUpdate update = 8;
    // THE AGENT'S PUSH NOTIFICATION, standing until the next prompt is
    // submitted. STATUS-INDEPENDENT: every status arm's salient oneof carries
    // it.
    FooterStatusActivityNotification notification = 10;
  }
  // Tag 11 (`context_budget`) is RETIRED: no footer line warns that the
  // context is nearly full (owner ruling, 2026-10-06). A failed compaction
  // is the feed's outcome marker alone.
  reserved 11;
  reserved "context_budget";
  // Tag 9 (`rate_limit`) is RETIRED: the enduring usage line carries
  // the vendor's allowance figures (owner ruling, 2026-10-01).
  reserved 9;
  reserved "rate_limit";
}
// The composed interrupting line.
message FooterStatusActivityInterrupting {
  // Drawn verbatim.
  string text = 1;
}
// The cold gate's composed cost line.
message FooterStatusActivityColdGateCost {
  // The composed line, drawn verbatim. It is exactly `lead` + `figure.text`
  // + `tail`, which a client draws instead so the figure takes its color.
  string text = 1;
  // The words before the token figure ("the conversation is cold at ").
  string lead = 2;
  // The token figure, formatted and colored.
  FooterColdGateFigure figure = 3;
  // The words after it (" context tokens").
  string tail = 4;
}
// The cold gate's token figure on the footer line.
message FooterColdGateFigure {
  // As drawn ("409,051").
  string text = 1;
  // How full the model's context window the figure is, in [0, 1] (clamped):
  // its color, through the same cold-gate gradient as the gate's own figure
  // (FeedColdGateContextTokens.window_fill).
  double window_fill = 2;
}
// The gated call's composed line.
message FooterStatusActivityGatedCall {
  // Drawn verbatim.
  string text = 1;
}
// The open question batch's composed lead line.
message FooterStatusActivityQuestionLead {
  // Drawn verbatim.
  string text = 1;
}

// MOMENTARY: the last turn was stopped; cleared by the next status push.
message FooterStatusInterrupted {
  // Who stopped it.
  oneof substatus {
    // The user commanded the stop.
    FooterSubStatusInterruptedByUser by_user = 1;
    // The host shut the session down mid-turn.
    FooterSubStatusInterruptedByHostShutdown host_shutdown = 2;
  }
  // The activity cell. ALWAYS SET: the enduring tier guarantees the cell has
  // something to draw under every status.
  FooterStatusInterruptedActivity activity = 3;
}
// The user commanded the stop.
message FooterSubStatusInterruptedByUser {}
// The host shut the session down mid-turn.
message FooterSubStatusInterruptedByHostShutdown {}
// The activity cell while interrupted: the salient line, or the transient
// over the enduring line.
message FooterStatusInterruptedActivity {
  // WHICH TIER the daemon resolved. Exactly one is set, and a push with
  // neither is malformed.
  oneof tier {
    // A condition that blocks the user stands.
    FooterStatusInterruptedSalient salient = 1;
    // Nothing salient stands: the newest transient (if any) over the
    // enduring line.
    FooterActivityTransientOverEnduring unpinned = 2;
  }
}
// The salient kinds legal while interrupted. A stopped turn has no line of
// its own, so only the status-independent kinds can stand: a deploy's
// progress and the push notification, in that order.
message FooterStatusInterruptedSalient {
  // When this line began standing; the client ticks the relative age.
  FooterStatusActivityAt at = 1;
  // The one salient line.
  oneof kind {
    // A DEPLOY'S PROGRESS. STATUS-INDEPENDENT: every status arm's salient
    // oneof carries it. See FooterStatusActivityUpdate.
    FooterStatusActivityUpdate update = 2;
    // THE AGENT'S PUSH NOTIFICATION, standing until the next prompt is
    // submitted. STATUS-INDEPENDENT: every status arm's salient oneof carries
    // it.
    FooterStatusActivityNotification notification = 4;
  }
  // Tag 5 (`context_budget`) is RETIRED: no footer line warns that the
  // context is nearly full (owner ruling, 2026-10-06). A failed compaction
  // is the feed's outcome marker alone.
  reserved 5;
  reserved "context_budget";
  // Tag 3 (`rate_limit`) is RETIRED: the enduring usage line carries
  // the vendor's allowance figures (owner ruling, 2026-10-01).
  reserved 3;
  reserved "rate_limit";
}

// A daemon-orchestrated merge is in flight in this workspace: the workspace
// asked for it, and runs it. Nothing about a merge reaches this footer until
// the turn that asked for it has ended, so the first step shown is already
// "enqueued" or later.
message FooterStatusMerging {
  // The merge's step, in the order a merge goes through them. A merge that
  // starts over because the target moved returns to "rebasing"; conflict
  // resolution returns to "rebasing" and fixing returns to "testing".
  oneof substatus {
    // Waiting in the repository's queue behind the merge being worked on.
    FooterSubStatusMergingEnqueued enqueued = 13;
    // The configured before-merge prompt is running.
    FooterSubStatusMergingPreprocessing preprocessing = 14;
    // The branch is being replayed onto the target's tip.
    FooterSubStatusMergingRebasing rebasing = 15;
    // This workspace's session is resolving a rebase conflict.
    FooterSubStatusMergingConflictResolution conflict_resolution = 16;
    // The test gate is running on the rebased branch.
    FooterSubStatusMergingTesting testing = 5;
    // This workspace's session is fixing failed suites.
    FooterSubStatusMergingFixing fixing = 17;
    // The merge commit into the target is being made.
    FooterSubStatusMergingCommitting committing = 18;
    // A branch already merged upstream: the default branch in the
    // repository's main worktree is being updated from upstream.
    FooterSubStatusMergingUpdatingMain updating_main = 19;
    // The configured after-merge prompt is running.
    FooterSubStatusMergingPostprocessing postprocessing = 20;
  }
  // Tags 1-4, 6-9, 11 and 12 (enqueuing, queued, pre_prompt, merge, parked,
  // post_prompt, failed, merged, fixes, conflicts) are RETIRED: the steps
  // above replace them, nothing parks, and a failed or landed merge is its
  // own status arm.
  reserved 1, 2, 3, 4, 6, 7, 8, 9, 11, 12;
  reserved "enqueuing", "queued", "pre_prompt", "merge", "parked", "post_prompt", "failed", "merged", "fixes", "conflicts";
  // The activity cell. ALWAYS SET: the enduring tier guarantees the cell has
  // something to draw under every status.
  FooterStatusMergingActivity activity = 10;
}
// Waiting in the queue, drawn "enqueued 2/5".
message FooterSubStatusMergingEnqueued {
  // This merge's 1-based place among the merges WAITING in the repository's
  // queue: 1 means next to be taken. The merge being worked on is not
  // counted, so there is never a 0.
  uint32 place = 1;
  // How many merges are waiting, this one included. At least `place`.
  uint32 waiting = 2;
}
// The before-merge prompt is running, drawn "preprocessing".
message FooterSubStatusMergingPreprocessing {}
// The replay, drawn "rebasing 3/7".
message FooterSubStatusMergingRebasing {
  // How many of the branch's commits have been replayed onto the tip.
  uint32 replayed = 1;
  // How many commits the branch replays in all. At least 1.
  uint32 total = 2;
}
// Conflict resolution, drawn "conflict resolution".
message FooterSubStatusMergingConflictResolution {}
// The test gate, drawn "testing"; the suites stream through the activity
// line and the merge bubble's tests tab.
message FooterSubStatusMergingTesting {}
// Fixing, drawn "fixing attempt 2/3".
message FooterSubStatusMergingFixing {
  // This attempt, 1-based.
  uint32 attempt = 1;
  // The most attempts the merge makes before it fails: the same bound that
  // decides failure.
  uint32 max_attempts = 2;
}
// The merge commit, drawn "committing".
message FooterSubStatusMergingCommitting {}
// Updating the default branch from upstream, drawn "updating main".
message FooterSubStatusMergingUpdatingMain {}
// The after-merge prompt is running, drawn "postprocessing".
message FooterSubStatusMergingPostprocessing {}

// The merge failed and the workspace is back with the user.
message FooterStatusMergeFailed {
  // WHERE it failed, drawn as the substatus. Exactly one is set.
  oneof substatus {
    // Conflict resolution gave up. The rebase is left in progress where it
    // stopped, for the user to carry on.
    FooterSubStatusMergeFailedConflicts conflicts = 2;
    // The last fixing attempt left suites failing.
    FooterSubStatusMergeFailedTests tests = 3;
    // Any other step failed (the rebase itself, the before-merge prompt, the
    // merge commit, updating main); the merge bubble carries the account.
    FooterSubStatusMergeFailedOther other = 4;
  }
  // The activity cell. ALWAYS SET, the same cell a merge in flight carries.
  FooterStatusMergingActivity activity = 1;
}
// Drawn "conflicts".
message FooterSubStatusMergeFailedConflicts {}
// Drawn "tests".
message FooterSubStatusMergeFailedTests {}
// Drawn "merge"; the account is the bubble's.
message FooterSubStatusMergeFailedOther {}

// The merge landed.
message FooterStatusMerged {
  // No substatus: the substatus cell merges into the status cell.
  // The activity cell. ALWAYS SET, the same cell a merge in flight carries.
  FooterStatusMergingActivity activity = 1;
}

// The activity cell while merging: the salient line, or the transient over
// the enduring line.
message FooterStatusMergingActivity {
  // WHICH TIER the daemon resolved. Exactly one is set, and a push with
  // neither is malformed.
  oneof tier {
    // A condition that blocks the merge stands.
    FooterStatusMergingSalient salient = 1;
    // Nothing salient stands: the newest transient (if any) over the
    // enduring line.
    FooterActivityTransientOverEnduring unpinned = 2;
  }
}
// The salient kinds legal while merging.
message FooterStatusMergingSalient {
  // When this line began standing; the client ticks the relative age.
  FooterStatusActivityAt at = 1;
  // The one salient line. The merge step's own line ranks first, because it
  // explains the step; then a deploy's progress and the push notification,
  // in that order.
  oneof kind {
    // The current step's own line, standing until the step ends.
    FooterStatusActivityMergeStep merge_step = 7;
    // A DEPLOY'S PROGRESS. STATUS-INDEPENDENT: every status arm's salient
    // oneof carries it. See FooterStatusActivityUpdate.
    FooterStatusActivityUpdate update = 3;
    // THE AGENT'S PUSH NOTIFICATION, standing until the next prompt is
    // submitted. STATUS-INDEPENDENT: every status arm's salient oneof carries
    // it.
    FooterStatusActivityNotification notification = 5;
  }
  // Tag 6 (`context_budget`) is RETIRED: no footer line warns that the
  // context is nearly full (owner ruling, 2026-10-06). A failed compaction
  // is the feed's outcome marker alone.
  reserved 6;
  reserved "context_budget";
  // Tag 4 (`rate_limit`) is RETIRED: the enduring usage line carries
  // the vendor's allowance figures (owner ruling, 2026-10-01).
  reserved 4;
  reserved "rate_limit";
  // Tag 2 (`merging_commit`) is RETIRED: the committing step's line is the
  // merge step's `committing` arm.
  reserved 2;
  reserved "merging_commit";
}

// The merge step's own activity line. THE ARM IS THE STEP it narrates, so a
// line can only stand under the step it belongs to.
message FooterStatusActivityMergeStep {
  oneof step {
    // Enqueued: the merge being worked on and its step, "fix-reconnect:
    // testing", replaced only when that merge changes step.
    FooterMergeStepEnqueued enqueued = 1;
    // Preprocessing: the before-merge prompt's text.
    FooterMergeStepPrompt preprocessing = 2;
    // Rebasing: the command running for the current commit, or its failure.
    FooterMergeStepRebasing rebasing = 3;
    // Conflict resolution: the commit that conflicted and how many files.
    FooterMergeStepConflict conflict_resolution = 4;
    // Testing: a suite starting, passing or failing.
    FooterMergeStepSuite testing = 5;
    // Fixing: the suites being fixed.
    FooterMergeStepFixing fixing = 6;
    // Committing: the merge commit's first line.
    FooterMergeStepCommitting committing = 7;
    // Updating main: fetching, then fast-forwarding.
    FooterMergeStepUpdatingMain updating_main = 8;
    // Postprocessing: the after-merge prompt's text.
    FooterMergeStepPrompt postprocessing = 9;
  }
}
// The merge ahead in the queue.
message FooterMergeStepEnqueued {
  // The workspace being merged, as the roster names it.
  string workspace_name = 1;
  // Its step, in the footer's plain words ("testing").
  string step = 2;
}
// A configured prompt's text, drawn verbatim.
message FooterMergeStepPrompt {
  string text = 1;
}
// The rebase's line for the current commit.
message FooterMergeStepRebasing {
  // THE ARM IS WHETHER THE COMMAND IS RUNNING OR FAILED.
  oneof line {
    // The command replaying the current commit, drawn verbatim.
    FooterMergeStepRebaseCommand running = 1;
    // The command failed; its first error line, drawn verbatim.
    FooterMergeStepRebaseFailure failed = 2;
  }
}
// A rebase command line.
message FooterMergeStepRebaseCommand {
  string text = 1;
}
// A rebase failure line.
message FooterMergeStepRebaseFailure {
  string text = 1;
}
// The conflicting commit, "fix the reconnect loop: 3 files".
message FooterMergeStepConflict {
  // The conflicting commit's subject.
  string commit_subject = 1;
  // How many files conflict. At least 1.
  uint32 files = 2;
}
// One suite's edge.
message FooterMergeStepSuite {
  // The suite's name, verbatim.
  string name = 1;
  // THE ARM IS THE EDGE, drawn "▶ name", "✓ name" or "✗ name".
  oneof edge {
    FooterMergeStepSuiteStarted started = 2;
    FooterMergeStepSuitePassed passed = 3;
    FooterMergeStepSuiteFailed failed = 4;
  }
}
// The suite started.
message FooterMergeStepSuiteStarted {}
// The suite passed.
message FooterMergeStepSuitePassed {}
// The suite failed.
message FooterMergeStepSuiteFailed {}
// The suites a fixing attempt is repairing.
message FooterMergeStepFixing {
  // Their names, in the gate's order. At least one.
  repeated string suites = 1;
}
// The merge commit being made.
message FooterMergeStepCommitting {
  // Its first line, drawn verbatim.
  string subject = 1;
}
// The update of the default branch from upstream.
message FooterMergeStepUpdatingMain {
  oneof step {
    // Fetching from upstream.
    FooterMergeStepUpdatingMainFetching fetching = 1;
    // Fast-forwarding to a commit.
    FooterMergeStepUpdatingMainFastForwarding fast_forwarding = 2;
  }
}
// Fetching.
message FooterMergeStepUpdatingMainFetching {}
// Fast-forwarding.
message FooterMergeStepUpdatingMainFastForwarding {
  // The short hash fast-forwarded to.
  string commit = 1;
}

// Detached work runs while the main thread is free.
message FooterStatusBackground {
  // No substatus: the chips and expanded panels carry the detail, so the
  // substatus cell merges into the status cell.
  // The activity cell. ALWAYS SET: the enduring tier guarantees the cell has
  // something to draw under every status.
  FooterStatusBackgroundActivity activity = 1;
  // Tag 2 (`quiet_stretch_ending`) is RETIRED with the quiet tier (owner
  // ruling, 2026-10-01: the quiet-stretch lines were too chatty and added
  // next to nothing).
  reserved 2;
  reserved "quiet_stretch_ending";
}
// The activity cell while background: the salient line, or the transient
// over the enduring line.
message FooterStatusBackgroundActivity {
  // WHICH TIER the daemon resolved. Exactly one is set, and a push with
  // neither is malformed.
  oneof tier {
    // A condition that blocks the user stands.
    FooterStatusBackgroundSalient salient = 1;
    // Nothing salient stands: the newest transient (if any) over the
    // enduring line.
    FooterActivityTransientOverEnduring unpinned = 2;
  }
}
// The salient kinds legal while background. Detached work has no line of
// its own here (its landings are the feed's), so only the
// status-independent kinds can stand: a deploy's progress and the push
// notification, in that order.
message FooterStatusBackgroundSalient {
  // When this line began standing; the client ticks the relative age.
  FooterStatusActivityAt at = 1;
  // The one salient line.
  oneof kind {
    // A DEPLOY'S PROGRESS. STATUS-INDEPENDENT: every status arm's salient
    // oneof carries it. See FooterStatusActivityUpdate.
    FooterStatusActivityUpdate update = 2;
    // THE AGENT'S PUSH NOTIFICATION, standing until the next prompt is
    // submitted. STATUS-INDEPENDENT: every status arm's salient oneof carries
    // it.
    FooterStatusActivityNotification notification = 4;
  }
  // Tag 5 (`context_budget`) is RETIRED: no footer line warns that the
  // context is nearly full (owner ruling, 2026-10-06). A failed compaction
  // is the feed's outcome marker alone.
  reserved 5;
  reserved "context_budget";
  // Tag 3 (`rate_limit`) is RETIRED: the enduring usage line carries
  // the vendor's allowance figures (owner ruling, 2026-10-01).
  reserved 3;
  reserved "rate_limit";
}

// The session cannot proceed until something outside it changes.
message FooterStatusVendorFault {
  // WHY it is blocked.
  oneof substatus {
    // An auth prompt is up.
    FooterSubStatusVendorFaultAuth auth = 1;
    // The usage allowance is exhausted.
    FooterSubStatusVendorFaultUsageLimit usage_limit = 2;
    // The vendor is refusing requests, or the vendor ended or refused the
    // last turn (a TURN FAULT, standing until the next turn starts; the
    // activity cell's `turn_ended` line names the cause).
    FooterSubStatusVendorFaultVendorError vendor_error = 3;
    // The account's billing state refuses requests.
    FooterSubStatusVendorFaultBilling billing = 4;
    // NO LONGER EMITTED: a dead vendor query is a FAILED TURN, not a block
    // (owner ruling, 2026-09-28: `blocked` is only for the vendor or the
    // account), so it resolves to `idle · turn_failed` with the dead-query
    // line. Kept only because removing an arm is a breaking change.
    FooterSubStatusVendorFaultQueryDied query_died = 6;
    // The vendor did not start and the daemon is retrying it: from the first
    // failed attempt until the last. The activity line names the latest
    // attempt's failure.
    FooterSubStatusVendorFaultVendorRetry vendor_retry = 9;
    // The vendor refused the start for a reason retrying cannot fix; nothing
    // retries until the user restarts the workspace.
    FooterSubStatusVendorFaultVendorRejection vendor_rejection = 10;
    // The vendor kept failing to start for the whole retry window, so the
    // daemon stopped retrying; prompts stay held until a restart brings the
    // session up.
    FooterSubStatusVendorFaultVendorFailed vendor_failed = 11;
    // The vendor is retrying a call that failed mid-turn — the API is
    // unreachable, timing out, or answering with a retryable error — so the
    // turn cannot advance until a retried call is answered. Distinct from
    // `vendor_error`, which is the vendor REFUSING requests: a retry is the
    // vendor still trying. It stands from the failure the vendor reports
    // until the first successful response of the retried agent, the turn's
    // end, or a new turn opening (a prompt sent during the retry opens one,
    // which resolves `working`). The activity cell carries the retry line.
    FooterSubStatusVendorFaultApiRetrying api_retrying = 8;
  }
  // Tag 7 (`daemon_impaired`) moved to `agent_repl_fault`: an impaired
  // daemon is agent-repl's fault, never the vendor's.
  reserved 7;
  reserved "daemon_impaired";
  // The activity cell. ALWAYS SET: the enduring tier guarantees the cell has
  // something to draw under every status.
  FooterStatusVendorFaultActivity activity = 5;
}
// An auth prompt is up.
message FooterSubStatusVendorFaultAuth {}
// The usage allowance is exhausted.
message FooterSubStatusVendorFaultUsageLimit {}
// The vendor is refusing requests.
message FooterSubStatusVendorFaultVendorError {}
// The account's billing state refuses requests.
message FooterSubStatusVendorFaultBilling {}
// The vendor query died and is not yet restarted.
message FooterSubStatusVendorFaultQueryDied {}
// The vendor is retrying a failed mid-turn call; the salient `retrying` line
// says which attempt is next and when it starts.
message FooterSubStatusVendorFaultApiRetrying {}
// The activity cell while blocked: the salient line, or the transient over
// the enduring line. A blocked step with no line of its own (usage limit,
// billing, a vendor error) draws unpinned, where the enduring usage figures
// are exactly what explains a usage-limit block.
message FooterStatusVendorFaultActivity {
  // WHICH TIER the daemon resolved. Exactly one is set, and a push with
  // neither is malformed.
  oneof tier {
    // A condition that blocks the turn or the user stands.
    FooterStatusVendorFaultSalient salient = 1;
    // Nothing salient stands: the newest transient (if any) over the
    // enduring line.
    FooterActivityTransientOverEnduring unpinned = 2;
  }
}
// The salient kinds legal while blocked. The kind that explains the standing
// substatus ranks first (the auth prompt; `usage_limit` has no line of its
// own, since the enduring usage line carries the allowance figures), then a
// standing fault, then a deploy's progress, then the push notification, in
// that order.
message FooterStatusVendorFaultSalient {
  // When this line began standing; the client ticks the relative age.
  FooterStatusActivityAt at = 1;
  // The one salient line.
  oneof kind {
    // The auth prompt line, verbatim, standing while the prompt is up.
    FooterStatusActivityAuthenticating authenticating = 2;
    // Tag 3 is RETIRED: a dead vendor query is a failed turn, never a
    // block, and its line stands in the idle cell under `turn_failed`.
    // An ESCALATING daemon fault that claims `vendor_fault`, standing until it is
    // retracted. Only faults the partition above maps to `vendor_fault` land here;
    // a non-escalating fault is a transient, never this arm.
    FooterStatusActivityFault fault = 4;
    // A DEPLOY'S PROGRESS. STATUS-INDEPENDENT: every status arm's salient
    // oneof carries it. See FooterStatusActivityUpdate.
    FooterStatusActivityUpdate update = 5;
    // THE AGENT'S PUSH NOTIFICATION, standing until the next prompt is
    // submitted. STATUS-INDEPENDENT: every status arm's salient oneof carries
    // it.
    FooterStatusActivityNotification notification = 7;
    // THE RETRY LINE while `api_retrying` stands: the next attempt's number,
    // the vendor's status verbatim, and — when the vendor stated a schedule —
    // the countdown to the next attempt and the last attempt it will make.
    // Set exactly when the substatus is `api_retrying`.
    FooterStatusActivityRetrying retrying = 9;
    // WHY THE VENDOR IS NOT UP, standing while one of the three vendor-start
    // substatuses stands: the latest retried failure, the rejection, or the
    // exhausted window with the way out. It ranks first, because it explains
    // the step.
    FooterStatusActivityVendorStart vendor_start = 10;
    // HOW THE VENDOR ENDED THE LAST TURN, standing with the turn fault until
    // the next turn starts. It explains `vendor_error`, so it ranks with the
    // lines that explain the step, after the auth prompt.
    FooterStatusActivityTurnEnded turn_ended = 11;
  }
  // Tag 8 (`context_budget`) is RETIRED: no footer line warns that the
  // context is nearly full (owner ruling, 2026-10-06). A failed compaction
  // is the feed's outcome marker alone.
  reserved 8;
  reserved "context_budget";
  // Tag 6 (`rate_limit`) is RETIRED: the enduring usage line carries
  // the vendor's allowance figures (owner ruling, 2026-10-01).
  reserved 6;
  reserved "rate_limit";
  reserved 3;
}
// The daemon itself is impaired; the fault line says how.
message FooterSubStatusAgentReplFaultDaemonImpaired {}
// A TURN FAULT'S LINE: the daemon's per-cause sentence for how the last turn
// ended, the same sentence the feed's turn-end row carries as its headline
// ("rate limited by the vendor", "the agent process died, and the turn it was
// running ended with it"). Drawn verbatim.
message FooterStatusActivityTurnEnded {
  // The sentence, drawn verbatim. Never empty.
  string text = 1;
  // WHEN THE VENDOR'S WAIT ENDS, for a turn ended by a rate limit or an
  // overload that stated one: the client counts down to it beside the
  // sentence. UNSET for every other cause, and when the vendor stated no wait.
  optional FooterStatusActivityAt retry_at = 2;
}

// The dead-query line.
message FooterStatusActivityQueryDied {
  // The composed line, drawn verbatim.
  string text = 1;
}

// The bring-up failure line.
message FooterStatusActivityStartFailed {
  // WHY the bring-up failed, in the shim's own words: the cause the
  // `shim_start_failed` fault carries, composed by the daemon from the exit
  // code and the last line of the stderr tail, or the adoption refusal's own
  // text. Drawn verbatim.
  string detail = 1;
  // Tag 2 (`dropped_prompts`) is RETIRED: a failed bring-up no longer drops
  // the prompts held for it. They stay held, under the reconnect hold, until a
  // session comes up.
  reserved 2;
  reserved "dropped_prompts";
}

// A STANDING DAEMON FAULT, as one drawn line.
//
// ONE LEAF FOR EVERY FAULT FAMILY BUT ONE. Rule 3 of the owner's ruling makes
// activity the LEAST general cell — one activity kind per fault family — and
// then admits that a single kind serves several families where their payloads
// do not differ. Every fault kind but `shim_start_failed` carries exactly a
// kind and a detail line, so they share this leaf and name themselves in
// `kind`; `shim_start_failed` keeps FooterStatusActivityStartFailed, whose
// payload genuinely differs (it also counts the held prompts the failure
// dropped).
message FooterStatusActivityFault {
  // The fault kind, spelled exactly as the daemon's fault vocabulary spells
  // it (`resume_failed`, `bounce_unknown`, `prompts_dir_missing`, ...). The
  // client renders it lowercase with spaces, never underscores — the same
  // rule the status and substatus cells follow — and holds no table keyed on
  // it: the status and substatus cells beside it are already resolved.
  string kind = 1;
  // WHAT the fault says, composed by the daemon out of the fault's own
  // evidence. Drawn verbatim. EMPTY IS LEGAL: some kinds are wholly said by
  // their name, and an empty detail draws the kind alone rather than an
  // invented sentence.
  string detail = 2;
}

// A DEPLOY'S PROGRESS, as one drawn line (owner request, 2026-09-27: deploy
// feedback moves out of the webapp's restarting banner and into this cell).
//
// THE DAEMON PUBLISHES IT ON EVERY WORKSPACE'S STRIP while a deploy runs,
// because a deploy moves what serves every workspace. It is SALIENT: it
// stands while the deploy is still moving under this workspace, and each
// phase replaces the last. The daemon that ran the deploy says every phase up
// to the handover; its streams end at the transfer, so the SUCCESSOR
// announces the finished deploy as a TRANSIENT (FooterActivityTransientUpdated)
// — the deploy no longer blocks anything once it is done, so its completion
// is an event, not a standing condition. A deploy that FAILS says so through
// the transient fault line, never through this one.
//
// EVERYTHING HERE IS TYPED. The client renders a phase's arm name lowercase
// with spaces, the same rule the status cells follow, and the typed data
// beside it (the components, the counts) is what colors the line; the daemon
// composes no sentence for it.
message FooterStatusActivityUpdate {
  // Where the deploy has got to. Exactly one; unset is malformed.
  oneof phase {
    // The components are being built into staging.
    FooterStatusActivityUpdateBuilding building = 1;
    // The fresh build is being installed over the running one.
    FooterStatusActivityUpdateInstalling installing = 2;
    // Out-of-date services are being restarted onto the fresh build.
    FooterStatusActivityUpdateRestartingServices restarting_services = 3;
    // The daemon is handing this workspace to its successor.
    FooterStatusActivityUpdateHandingOver handing_over = 4;
    // THIS workspace's move waits on its own in-flight work: nothing is
    // interrupted to hurry it, and the counts fall as the work drains.
    FooterStatusActivityUpdateWaiting waiting = 5;
  }
  // Tag 6 is RETIRED: a finished deploy is the transient
  // FooterActivityTransientUpdated, never a phase of this standing line.
  reserved 6;
  // What the deploy left for later on THIS workspace. Empty when nothing was
  // deferred.
  repeated FooterStatusActivityUpdateNote notes = 7;
}
// The components being built.
message FooterStatusActivityUpdateBuilding {
  // Every component the build stages, in build order.
  repeated FooterStatusActivityUpdateComponent components = 1;
}
// The fresh build is being installed.
message FooterStatusActivityUpdateInstalling {}
// Out-of-date services are being restarted.
message FooterStatusActivityUpdateRestartingServices {
  // The services being restarted, in restart order.
  repeated FooterStatusActivityUpdateComponent services = 1;
}
// The daemon is handing the workspace to its successor.
message FooterStatusActivityUpdateHandingOver {}
// The workspace's move waits on its own work.
message FooterStatusActivityUpdateWaiting {
  // The turns in flight, zero or one.
  uint32 turns = 1;
  // The detached items still running: background subagents, background
  // shells and monitors.
  uint32 background = 2;
}
// One deployable component, by name. The client renders the arm name
// lowercase with spaces.
message FooterStatusActivityUpdateComponent {
  oneof component {
    // The record store service.
    FooterStatusActivityUpdateComponentStore store = 1;
    // The transcript sidecar service.
    FooterStatusActivityUpdateComponentSidecar sidecar = 2;
    // The daemon.
    FooterStatusActivityUpdateComponentDaemon daemon = 3;
    // The session shim.
    FooterStatusActivityUpdateComponentShim shim = 4;
    // This webapp.
    FooterStatusActivityUpdateComponentWebapp webapp = 5;
  }
}
// The record store service.
message FooterStatusActivityUpdateComponentStore {}
// The transcript sidecar service.
message FooterStatusActivityUpdateComponentSidecar {}
// The daemon.
message FooterStatusActivityUpdateComponentDaemon {}
// The session shim.
message FooterStatusActivityUpdateComponentShim {}
// This webapp.
message FooterStatusActivityUpdateComponentWebapp {}
// One thing the deploy deferred on this workspace.
message FooterStatusActivityUpdateNote {
  oneof note {
    // The session's shim is replaced once its work has ended: it has a turn
    // or detached work in flight, and a deploy never ends a turn unless it
    // is forced.
    FooterStatusActivityUpdateNoteShimWhenIdle shim_when_idle = 1;
  }
}
// The shim updates when the session is idle.
message FooterStatusActivityUpdateNoteShimWhenIdle {}

// The daemon's link to the session's shim is not serving.
message FooterStatusAgentReplFault {
  // The link's step.
  oneof substatus {
    // The shim is starting.
    FooterSubStatusAgentReplFaultStarting starting = 1;
    // NO LONGER EMITTED: a link that serves with degradation is USABLE, so
    // it is the `degraded` status arm (owner ruling, 2026-09-28), never
    // `agent_repl_fault`. Kept so an older frame still decodes.
    FooterSubStatusAgentReplFaultDegraded degraded = 2;
    // The link was severed and reconnection is being attempted.
    FooterSubStatusAgentReplFaultSevered severed = 3;
    // The shim process is gone.
    FooterSubStatusAgentReplFaultDead dead = 4;
    // The shim PROCESS failed to start, or a bring-up failed for a reason
    // that is not the vendor's. A vendor that did not start inside a healthy
    // shim is a `vendor_fault`, never this one.
    FooterSubStatusAgentReplFaultStartFailed start_failed = 5;
    // The DAEMON itself is impaired: a fault stands that costs this session
    // something it needs from the daemon — its prompts directory, its state
    // client, its durable log sink, its own redeploy.
    FooterSubStatusAgentReplFaultDaemonImpaired daemon_impaired = 10;
    // THE LAST TURN DIED WITH AGENT-REPL'S OWN MACHINERY: its vendor query
    // died, or the agent process died under it (a TURN FAULT, owner ruling,
    // 2026-10-06). It stands until the next turn starts, and the activity
    // cell's `turn_ended` line names which. The composer stays OPEN under it
    // (render-colors.json#composer_open_substatuses): the next prompt is what
    // ends it, so a closed composer would make the fault permanent.
    FooterSubStatusAgentReplFaultTurnDied turn_died = 11;
  }
  // Tags 7–9 (`vendor_retry`, `vendor_rejection`, `vendor_failed`) moved to
  // `vendor_fault`: a vendor that will not start is the vendor's fault.
  reserved 7, 8, 9;
  reserved "vendor_retry", "vendor_rejection", "vendor_failed";

  // The activity cell. ALWAYS SET: the enduring tier guarantees the cell has
  // something to draw under every status.
  FooterStatusAgentReplFaultActivity activity = 6;
}
// The shim is starting.
message FooterSubStatusAgentReplFaultStarting {}
// The link serves with degradation.
message FooterSubStatusAgentReplFaultDegraded {}
// The link was severed and reconnection is being attempted.
message FooterSubStatusAgentReplFaultSevered {}
// The shim process is gone.
message FooterSubStatusAgentReplFaultDead {}
// The shim failed to start.
message FooterSubStatusAgentReplFaultStartFailed {}
// The last turn died with agent-repl's own machinery.
message FooterSubStatusAgentReplFaultTurnDied {}
// The vendor did not start and is being retried.
message FooterSubStatusVendorFaultVendorRetry {}
// The vendor refused the start; nothing retries.
message FooterSubStatusVendorFaultVendorRejection {}
// The vendor failed to start for the whole retry window.
message FooterSubStatusVendorFaultVendorFailed {}
// The activity cell while disconnected: the salient line, or the transient
// over the enduring line. A step with no line of its own (starting, a
// severed link being retried with no fault yet) draws unpinned.
message FooterStatusAgentReplFaultActivity {
  // WHICH TIER the daemon resolved. Exactly one is set, and a push with
  // neither is malformed.
  oneof tier {
    // A condition that blocks the turn or the user stands.
    FooterStatusAgentReplFaultSalient salient = 1;
    // Nothing salient stands: the newest transient (if any) over the
    // enduring line.
    FooterActivityTransientOverEnduring unpinned = 2;
  }
}
// The salient kinds legal while disconnected. The bring-up failure ranks
// first, because it explains the `start_failed` step; then a standing fault;
// then a deploy's progress; then the push notification, in that order.
message FooterStatusAgentReplFaultSalient {
  // When this line began standing; the client ticks the relative age.
  FooterStatusActivityAt at = 1;
  // The one salient line.
  oneof kind {
    // WHY the session's bring-up failed, and what the failure cost, standing
    // until the next successful link edge clears it.
    FooterStatusActivityStartFailed start_failed = 2;
    // HOW AGENT-REPL'S MACHINERY ENDED THE LAST TURN (the query died, the
    // agent process died), standing with the `turn_died` fault until the next
    // turn starts. It explains `turn_died`, so it ranks first beside
    // `start_failed`.
    FooterStatusActivityTurnEnded turn_ended = 9;
    // An ESCALATING daemon fault that claims `agent_repl_fault`, standing until
    // it is retracted. Only faults the partition above maps to
    // `agent_repl_fault` land here; a non-escalating fault is a transient, never
    // this arm.
    FooterStatusActivityFault fault = 3;
    // A DEPLOY'S PROGRESS. STATUS-INDEPENDENT: every status arm's salient
    // oneof carries it. See FooterStatusActivityUpdate.
    FooterStatusActivityUpdate update = 4;
    // THE AGENT'S PUSH NOTIFICATION, standing until the next prompt is
    // submitted. STATUS-INDEPENDENT: every status arm's salient oneof carries
    // it.
    FooterStatusActivityNotification notification = 6;
  }
  // Tag 7 (`context_budget`) is RETIRED: no footer line warns that the
  // context is nearly full (owner ruling, 2026-10-06). A failed compaction
  // is the feed's outcome marker alone.
  reserved 7;
  reserved "context_budget";
  // Tag 5 (`rate_limit`) is RETIRED: the enduring usage line carries
  // the vendor's allowance figures (owner ruling, 2026-10-01).
  reserved 5;
  reserved "rate_limit";
  // Tag 8 (`vendor_start`) moved to the vendor fault's salient line.
  reserved 8;
  reserved "vendor_start";
}

// The vendor-start line, composed by the daemon out of the standing
// vendor-start fault and drawn verbatim. One leaf serves all three vendor
// substatuses because each is one sentence the substatus beside it already
// classifies:
//   vendor_retry      "Claude SDK did not start (attempt 3): <cause> · retrying"
//   vendor_rejection  "Claude SDK refused to start: <cause> · restart: SPC o C-c"
//   vendor_failed     "Claude SDK failed to start · restart: SPC o C-c"
message FooterStatusActivityVendorStart {
  // The composed line. Never empty.
  string text = 1;
}

// A close was requested and has not completed.
message FooterStatusClosing {
  // The close's step. UNSET while the close proceeds unremarkably; the
  // family anticipates a graceful-drain step if one is ever wanted.
  oneof substatus {
    // The close is refused while work is live; the activity line carries
    // the daemon's composed reasons.
    FooterSubStatusCloseBlocked blocked = 1;
  }
  // The activity cell. ALWAYS SET: the enduring tier guarantees the cell has
  // something to draw under every status.
  FooterStatusClosingActivity activity = 2;
}
// The close is refused while work is live.
message FooterSubStatusCloseBlocked {}
// The activity cell while closing: the salient line, or the transient over
// the enduring line.
