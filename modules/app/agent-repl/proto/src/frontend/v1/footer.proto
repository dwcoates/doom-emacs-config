  FooterStatusActivityAt at = 1;
  // The one salient line.
  oneof kind {
    // WHY the close is blocked, in concise plain English resolved by the
    // daemon ("a turn is in flight; 2 subagents and a shell are running"),
    // standing until the close is retried or withdrawn.
    FooterStatusActivityCloseBlocked close_blocked = 2;
    // A DEPLOY'S PROGRESS. STATUS-INDEPENDENT: every status arm's salient
    // oneof carries it. See FooterStatusActivityUpdate.
    FooterStatusActivityUpdate update = 3;
    // THE AGENT'S PUSH NOTIFICATION, standing until the next prompt is
    // submitted. STATUS-INDEPENDENT: every status arm's salient oneof carries
    // it.
    FooterStatusActivityNotification notification = 5;
  }
  // Tag 6 (`context_budget`) is RETIRED: no footer line warns that the
  // context is nearly full (owner ruling, 2026-10-06). A failed compaction
  // is the feed's outcome marker alone.
  reserved 6;
  reserved "context_budget";
  // Tag 4 (`rate_limit`) is RETIRED: the enduring usage line carries
  // the vendor's allowance figures (owner ruling, 2026-10-01).
  reserved 4;
  reserved "rate_limit";
}

// MOMENTARY: context is being injected (memory, skills).
message FooterStatusLoading {
  // WHAT kind of injection.
  oneof substatus {
    // A memory file is being injected.
    FooterSubStatusLoadingMemory memory = 1;
    // An invoked skill's document is loading.
    FooterSubStatusLoadingInvoked invoked = 2;
    // Discovered skills are being injected.
