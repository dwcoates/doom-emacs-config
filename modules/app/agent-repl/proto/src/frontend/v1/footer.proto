// footer.proto — THE FOOTER: the workspace's status strip, its selectable
// cells and chips, and the expanded section their selection opens.
// Per-workspace; resolved by the daemon.
//
// THE MAIN STRIP, left to right — resolution INCREASES left to right across
// the three status sections, each TYPED, each "less" typed than the last by
// carrying more of its information in text fields; then the turn's figures;
// then the live-work chips, right-aligned:
//
//   ┌───────────┬─────────────────────┬──────────────────────────────┬───────┬───────────────┬─────────────┐
//   │ merging   │ cherry-picking 3/7  │ 4f2a1c: fold tokens into api │ 0:42  │ 18.2k in ⚠ ✓ │ ⚙3 ☑3/7 $2 │
//   └───────────┴─────────────────────┴──────────────────────────────┴───────┴───────────────┴─────────────┘
//     Status      SubStatus             StatusActivity                 Clock   Tokens cell     LiveWork chips
//     coarsest ──────────── resolution increases ────────────► finest
//
//   Status         the coarsest state, one word + color, a small closed set;
//                  `interrupted` is a status like any other, cleared by the
//                  next status update.
//   SubStatus      the step WITHIN the status, typed per status family, with
//                  the small facts a step has (queue position, commit counts).
//   StatusActivity the finest, DYNAMIC line: typed KINDS whose payload is
//                  mostly text the daemon composed.
//   Clock          how long the current turn has been running.
//   Tokens cell    the turn's uncached-input figure with two glyphs; a click
//                  target opening the token panel.
//   LiveWork chips ⚙ live subagents · ☑ the task tracker · $ live shells —
//                  each a click target opening its panel.
//
// THE EXPANDED SECTION opens above the strip when a selectable element (the
// tokens cell or a chip) is selected. The selection is WEBVIEW-LOCAL, so the
// daemon ships EVERY panel fully resolved on every push and the client draws
// whichever one the local selection picks — opening a panel needs no
// round-trip (the folded-menu convention).
//
// EVERY FIELD IS AN ELEMENT MESSAGE, nested as the UI nests. The daemon
// resolves every level; the client renders and derives nothing — there is no
// client-side precedence between windows, no phase→word table, no mapping of
// any state to a color, and no counting of panel rows to label a chip.

syntax = "proto3";

package frontend.v1;

import "conversation/v1/agent_activity.proto";

option go_package = "agentrepl/proto/frontend/v1;frontendv1";

// ==========================================================================
// THE FOOTER VIEW
// ==========================================================================

// The footer: the always-drawn strip plus the expanded section's panels.
// EVERY panel is always resolved on every push: which panel is open is a
// webview-local selection the daemon never learns.
message FooterView {
  // The one-line strip at the bottom of the workspace view. Always drawn.
  FooterStrip strip = 1;
  // The expanded section's content, one panel per selectable strip element.
  // Drawn only while a strip element is selected; the selection picks which.
  FooterExpanded expanded = 2;
}

// ==========================================================================
// THE MAIN STRIP
// ==========================================================================

// The strip's elements, left to right. Status, sub-status and activity are
// the three typed resolution levels (coarsest → finest); clock and tokens
// are the turn's figures; the live-work chips sit right-aligned.
message FooterStrip {
  // Coarsest state of the workspace. Colors the strip; one arm always set.
  FooterStatus status = 1;
  // The step within the status. Unset when the status has no substructure
  // (waiting, interrupted, background, asleep).
  FooterSubStatus sub_status = 2;
  // The finest, dynamic line. Unset when the daemon has nothing finer to say.
  FooterStatusActivity activity = 3;
  // The turn clock. The client ticks from the carried instant.
  FooterClock clock = 4;
  // The tokens CELL: the turn's uncached-input figure plus two glyphs, and
  // the click target that opens FooterExpandedTokens. The full breakdown
  // lives in that panel, never here.
  FooterTokensCell tokens = 5;
  // The live-work chips, right-aligned. Each chip is a click target opening
  // its panel.
  FooterLiveWorkChips live_work = 6;
}

// ---- 1. Status — coarsest -------------------------------------------------

// The coarsest state. THE SET ARM IS THE STATUS; every arm is EMPTY, being
// set is the whole assertion. Each arm's color is the shared render-colors
// vocabulary's, one per arm, resolved by the daemon into the CSS class the
// client applies; the client holds no table.
message FooterStatus {
  oneof status {
    // Nothing running, route proven usable (ready, or a response unread).
    FooterStatusIdle idle = 1;
    // A turn is in flight (submitting, thinking, clearing, compacting).
    FooterStatusThinking thinking = 2;
    // Parked on YOU — a permission, a question.
    FooterStatusWaiting waiting = 3;
    // The last turn was interrupted; cleared by the next status update.
    FooterStatusInterrupted interrupted = 4;
    // A merge run owns the session.
    FooterStatusMerging merging = 5;
    // No foreground turn, but detached work is live.
    FooterStatusBackground background = 6;
    // The vendor or the account said no (auth, usage limit, persistent
    // 4xx/5xx). A REPORT of the last turn's conclusion; gates nothing.
    FooterStatusBlocked blocked = 7;
    // Hibernated on purpose; nothing is wrong.
    FooterStatusAsleep asleep = 8;
    // The route Emacs→daemon→shim is compromised on OUR side (starting,
    // degraded, severed, dead, start failed).
    FooterStatusDisconnected disconnected = 9;
  }
}
message FooterStatusIdle {}
message FooterStatusThinking {}
message FooterStatusWaiting {}
message FooterStatusInterrupted {}
message FooterStatusMerging {}
message FooterStatusBackground {}
message FooterStatusBlocked {}
message FooterStatusAsleep {}
message FooterStatusDisconnected {}

// ---- 2. SubStatus — the step within the status ----------------------------

// The step WITHIN the status, typed per status family. The family arm set
// here MUST agree with FooterStatus's arm: a `merging` sub-status under an
// `idle` status is a daemon fault, rejected loudly.
message FooterSubStatus {
  oneof sub_status {
    FooterSubStatusThinking thinking = 1;
    FooterSubStatusMerging merging = 2;
    FooterSubStatusDisconnected disconnected = 3;
    FooterSubStatusIdle idle = 4;
    FooterSubStatusBlocked blocked = 5;
  }
}

// The steps of a turn in flight.
message FooterSubStatusThinking {
  oneof step {
    // A prompt is committed and not yet acked by the shim.
    FooterSubStatusThinkingSubmitting submitting = 1;
    // The agent is working.
    FooterSubStatusThinkingThinking thinking = 2;
    // The conversation is being cleared.
    FooterSubStatusThinkingClearing clearing = 3;
    // The context is being compacted.
    FooterSubStatusThinkingCompacting compacting = 4;
  }
}
message FooterSubStatusThinkingSubmitting {}
message FooterSubStatusThinkingThinking {}
message FooterSubStatusThinkingClearing {}
message FooterSubStatusThinkingCompacting {}

// The steps of a merge run — the run's own phase vocabulary, projected.
message FooterSubStatusMerging {
  oneof step {
    // The first instant of a merge, before anything durable exists for it.
    FooterSubStatusMergingEnqueuing enqueuing = 1;
    // Waiting behind other workspaces' merges.
    FooterSubStatusMergingQueued queued = 2;
    // The configured before-action is running.
    FooterSubStatusMergingBeforeAction before_action = 3;
    // Commits are landing one at a time.
    FooterSubStatusMergingCherryPicking cherry_picking = 4;
    // The landed commit is under test.
    FooterSubStatusMergingTesting testing = 5;
    // Stopped on a conflict awaiting resolution.
    FooterSubStatusMergingConflict conflict = 6;
    // The configured after-action is running.
    FooterSubStatusMergingAfterAction after_action = 7;
    // The run failed.
    FooterSubStatusMergingFailed failed = 8;
    // The run settled successfully.
    FooterSubStatusMergingMerged merged = 9;
  }
}
message FooterSubStatusMergingEnqueuing {}
// The queue place the run was admitted at.
message FooterSubStatusMergingQueued {
  // 1-based position in its repo's queue.
  int32 position = 1;
  // How many are queued in that repo.
  int32 depth = 2;
}
message FooterSubStatusMergingBeforeAction {
  // The configured action, for display.
  string action = 1;
}
message FooterSubStatusMergingCherryPicking {
  int32 commits_total = 1;
  int32 commits_landed = 2;
}
message FooterSubStatusMergingTesting {
  int32 commits_total = 1;
  // The commit under test is landed but ungated.
  int32 commits_landed = 2;
}
message FooterSubStatusMergingConflict {}
message FooterSubStatusMergingAfterAction {
  // The configured action, for display.
  string action = 1;
}
message FooterSubStatusMergingFailed {}
message FooterSubStatusMergingMerged {}

// The ways the route can be compromised.
message FooterSubStatusDisconnected {
  oneof step {
    // A bring-up is in flight; the route is not yet proven.
    FooterSubStatusDisconnectedStarting starting = 1;
    // Running, but with an open fault on the route.
    FooterSubStatusDisconnectedDegraded degraded = 2;
    // The backing process is gone; the workspace is recoverable.
    FooterSubStatusDisconnectedSevered severed = 3;
    // Terminal: no live session backs the workspace.
    FooterSubStatusDisconnectedDead dead = 4;
    // The bring-up failed outright.
    FooterSubStatusDisconnectedStartFailed start_failed = 5;
  }
}
message FooterSubStatusDisconnectedStarting {}
message FooterSubStatusDisconnectedDegraded {}
message FooterSubStatusDisconnectedSevered {}
message FooterSubStatusDisconnectedDead {}
message FooterSubStatusDisconnectedStartFailed {}

// The two flavors of idle.
message FooterSubStatusIdle {
  oneof step {
    // Live, proven usable, nothing to read.
    FooterSubStatusIdleReady ready = 1;
    // The turn finished and its response is unread.
    FooterSubStatusIdleDone done = 2;
  }
}
message FooterSubStatusIdleReady {}
message FooterSubStatusIdleDone {}

// What the vendor/account said no about.
message FooterSubStatusBlocked {
  oneof step {
    FooterSubStatusBlockedAuth auth = 1;
    FooterSubStatusBlockedUsageLimit usage_limit = 2;
    FooterSubStatusBlockedVendorError vendor_error = 3;
  }
}
message FooterSubStatusBlockedAuth {}
message FooterSubStatusBlockedUsageLimit {}
message FooterSubStatusBlockedVendorError {}

// ---- 3. StatusActivity — finest, dynamic ----------------------------------

// The finest line: typed KINDS whose payload is mostly text the daemon
// composed. A new thing to say is a new arm — THERE IS NO FREE-TEXT ESCAPE
// HERE. A line with no kind belongs only where the daemon genuinely cannot
// classify, and that place is the error route's unclassified funnel on the
// failure card; an activity the daemon can name but has no arm for is a
// modeling gap, and the fix is the arm, not a note.
message FooterStatusActivity {
  oneof activity {
    FooterStatusActivityMergingCommit merging_commit = 1;
    FooterStatusActivityHook hook = 2;
    FooterStatusActivityRetrying retrying = 3;
    FooterStatusActivityAuthenticating authenticating = 4;
    FooterStatusActivityBlockedOnUser blocked_on_user = 5;
    FooterStatusActivityRateLimited rate_limited = 6;
  }
}
// The commit a merge is landing right now.
message FooterStatusActivityMergingCommit {
  string sha = 1;
  string subject = 2;
}
// A hook is running.
message FooterStatusActivityHook {
  string name = 1;
}
// The vendor call is being retried.
message FooterStatusActivityRetrying {
  int32 attempt = 1;
  // The retry's status summary, verbatim.
  string status = 2;
}
// An auth prompt is up.
message FooterStatusActivityAuthenticating {
  // The auth prompt line, verbatim.
  string line = 1;
}
// The session reports it is parked on the user (requires_action) — a fact the
// daemon cannot otherwise see, so a permission count alone under-reports it.
message FooterStatusActivityBlockedOnUser {
  string detail = 1;
}
// The rate-limit rung. The vendor bills TWO independent allowances (rolling
// five-hour session, seven-day weekly) reported through one event; both
// figures are shown so a reader can tell WHICH allowance the newsworthy
// percentage belongs to.
message FooterStatusActivityRateLimited {
  FooterAllowance session = 1;
  FooterAllowance weekly = 2;
}
// One allowance's last report. PRESENT means the vendor has reported it at
// all; `newsworthy` is the narrower claim that the report was anything other
// than a plain "allowed", which is what put the rung up.
message FooterAllowance {
  bool newsworthy = 1;
  // Epoch SECONDS, the vendor event's own unit.
  int64 resets_at_s = 2;
  // 0..1.
  double utilization = 3;
  // The vendor's status word, verbatim (e.g. "allowed_warning"). Kept
  // verbatim because the vendor's full vocabulary is not in evidence; typed
  // arms when it is.
  string status = 4;
}
// ---- 4. Clock ------------------------------------------------------------

// The turn clock. UNSET = no turn in flight; the cell renders idle.
message FooterClock {
  optional int64 turn_started_at_ms = 1;
}

// ---- 5. Tokens cell -------------------------------------------------------

// The strip's tokens cell. Deliberately ONE figure: the turn's uncached
// input tokens — the number that costs money at full price — with the alarm
// and accounting verdict reduced to glyphs. Everything else (thinking,
// cache figures, first-token latency, alarm detail, verdict evidence) is
// FooterExpandedTokens' content, reached by clicking this cell. Figures
// accumulate while the turn runs; a new turn resets the cell.
message FooterTokensCell {
  // The turn's uncached input figure, daemon-formatted ("18.2k in") from the
  // canonical TokenUsage input_misses total (written + unwritten; cache
  // READS excluded, which is the whole point). The client draws it verbatim
  // — no arithmetic, no unit rounding.
  FooterTokensCellInput input = 1;
  // The expensive-turn alarm glyph (⚠). PRESENT iff the alarm tripped this
  // turn; presence IS the glyph, and the composed sentence is the panel's
  // alarm line. Kept until the next turn starts.
  FooterTokensCellAlarm alarm = 2;
  // The accounting verdict badge. UNSET while the turn runs (no verdict
  // yet); set once the settled turn is reconciled.
  FooterTokensCellVerdict verdict = 3;
}

// The cell's figure. Wrapped so the cell's one number is its own element and
// a later prop (a tone, a tooltip) lands here without touching the cell.
message FooterTokensCellInput {
  // The formatted figure, exactly as drawn ("18.2k in").
  string text = 1;
}

// The tripped-alarm glyph. Empty on purpose: being set is the whole fact —
// "this turn crossed the cost threshold" — and the evidence is the panel's
// alarm line, never a second copy here.
message FooterTokensCellAlarm {}

// The accounting badge. The set arm picks the glyph treatment; the evidence
// behind it is the panel's verdict line, never this badge.
message FooterTokensCellVerdict {
  // Which verdict the settled turn's reconciliation reached. Exactly one arm
  // is set; the arms are mutually exclusive readings of one reconciliation.
  oneof verdict {
    // Every response's usage was observed and the sums reconcile (✓).
    FooterTokensCellVerdictComplete complete = 1;
    // Some responses carried no usage, so the figures are a floor (✗).
    FooterTokensCellVerdictIncomplete incomplete = 2;
    // The observed usage contradicts itself (✗) — a producer defect.
    FooterTokensCellVerdictInvalid invalid = 3;
  }
}
// Reconciliation succeeded. Empty: the arm is the whole fact.
message FooterTokensCellVerdictComplete {}
// Usage is missing for part of the turn. Empty here — the missing-evidence
// prose is the panel line's.
message FooterTokensCellVerdictIncomplete {}
// Usage is self-contradictory. Empty here — the problem list is the panel
// line's.
message FooterTokensCellVerdictInvalid {}

// ---- 6. Live-work chips ----------------------------------------------------

// The live-work chips. An UNSET chip is NOT DRAWN — nothing of that kind
// exists right now — so a quiet workspace shows no chips at all. A set chip
// carries its count, daemon-resolved: the client never counts panel rows to
// label a chip, even though the rows arrive in the same push (duplicate,
// don't share). Detached UNMODELED work has no chip: its surfacing home is
// the topbar's warning dropdown.
message FooterLiveWorkChips {
  // ⚙ — live agent-spawned subagents (the ones with feed bubbles). Set iff
  // at least one is live.
  FooterChipAgents agents = 1;
  // ☑ — the task tracker's progress. Set iff the tracker is non-empty; a
  // task chip is about the LIST existing, not about anything running.
  FooterChipTasks tasks = 2;
  // $ — live detached shells. Set iff at least one is running.
  FooterChipShells shells = 3;
}
// The agents chip's props.
message FooterChipAgents {
  // How many agent rows the agents panel holds. At least 1 when this chip
  // is set (a zero-count chip is expressed by leaving the chip unset).
  uint32 count = 1;
}
// The tasks chip's props, drawn as "☑ 3/7". A progress fraction, both
// figures always drawn — NOT a completeness pair: neither count qualifies
// the other, so no oneof factoring applies.
message FooterChipTasks {
  // How many tracker tasks are completed.
  uint32 done = 1;
  // How many tracker tasks exist in total. At least 1 when the chip is set.
  uint32 total = 2;
}
// The shells chip's props.
message FooterChipShells {
  // How many detached shells are live. At least 1 when the chip is set.
  uint32 count = 1;
}

// ==========================================================================
// THE EXPANDED SECTION
// ==========================================================================

// One panel per selectable strip element. ALL panels arrive populated on
// every push; the webview-local selection picks which one is drawn. A panel
// whose subject is empty (no live shells, say) still arrives — as an empty
// row list — because its chip is then unset and nothing can select it.
message FooterExpanded {
  // The turn's token breakdown — the tokens cell's expansion.
  FooterExpandedTokens tokens = 1;
  // The live agent-spawned subagents — the ⚙ chip's expansion.
  FooterExpandedAgents agents = 2;
  // The task tracker's checklist — the ☑ chip's expansion.
  FooterExpandedTasks tasks = 3;
  // The live detached shells — the $ chip's expansion.
  FooterExpandedShells shells = 4;
}

// ---- The tokens panel ------------------------------------------------------

// The TURN's token accounting (distinct from the topbar's SESSION breakdown
// — a different fact and a different component), one line per figure, name
// dim and value bright. NOT a list: these are heterogeneous facts, so each
// line is its own dedicated field. Every line message is ALWAYS SET so the
// panel's shape is stable while the turn runs; a line whose figure is not
// yet known carries no value and draws its name with an empty slot. Values
// are daemon-formatted strings — the client does no arithmetic and no unit
// rounding.
message FooterExpandedTokens {
  // "input (uncached)" — the same figure the strip's cell shows, repeated
  // here as a line (the cell and the line are two drawn elements of one
  // resolved value).
  FooterTokensLineInput input = 1;
  // "input (cache read)" — input tokens served from cache.
  FooterTokensLineCacheRead cache_read = 2;
  // "input (cache write)" — input tokens written to cache this turn.
  FooterTokensLineCacheWrite cache_write = 3;
  // "output" — all output tokens, thinking included.
  FooterTokensLineOutput output = 4;
  // "thinking" — the output subclass, drawn indented under output. A
  // consumer must NOT add it to output: it is already inside it.
  FooterTokensLineThinking thinking = 5;
  // "first token" — latency to the current response's first token. A
  // duration, not a token count; same line layout, different unit.
  FooterTokensLineFirstToken first_token = 6;
  // The alarm's detail line. PRESENT iff the alarm tripped (mirrors the
  // cell's glyph); carries the composed sentence.
  FooterTokensLineAlarm alarm = 7;
  // The verdict's detail line. UNSET while the turn runs (mirrors the
  // cell's badge); set once reconciled.
  FooterTokensLineVerdict verdict = 8;
}

// The uncached-input line.
message FooterTokensLineInput {
  // The formatted figure ("18.2k"). UNSET = figure not yet known this turn;
  // the line still draws, with an empty slot.
  optional string value = 1;
}
// The cache-read line.
message FooterTokensLineCacheRead {
  // The formatted figure. UNSET = draw the empty slot.
  optional string value = 1;
}
// The cache-write line.
message FooterTokensLineCacheWrite {
  // The formatted figure. UNSET = draw the empty slot.
  optional string value = 1;
}
// The output line.
message FooterTokensLineOutput {
  // The formatted figure. UNSET = draw the empty slot.
  optional string value = 1;
}
// The thinking line (output subclass; drawn indented).
message FooterTokensLineThinking {
  // The formatted figure. UNSET = draw the empty slot.
  optional string value = 1;
}
// The first-token latency line.
message FooterTokensLineFirstToken {
  // The formatted duration ("412ms"). UNSET until the current response's
  // first token lands; held afterwards for the rest of the turn.
  optional string value = 1;
}
// The tripped alarm's line. Exists only while the cell's glyph does.
message FooterTokensLineAlarm {
  // The daemon-composed sentence ("expensive turn — 41k over 20k"). Drawn
  // verbatim; the sentence also states WHY the turn ran when that changes
  // the reading (an ordinary prompt vs a cache keep-alive that came back
  // cold — its own alarm, phrased as such by the daemon).
  string text = 1;
}
// The verdict's line. The set arm picks the treatment; the text is the
// composed evidence the badge alone could not carry.
message FooterTokensLineVerdict {
  // Which verdict the reconciliation reached — always the same arm as the
  // cell's badge, with the evidence attached where an arm has any.
  oneof verdict {
    // Reconciled cleanly. No evidence to show; the line draws its ✓ alone.
    FooterTokensLineVerdictComplete complete = 1;
    // Figures are a floor; the text says what is missing.
    FooterTokensLineVerdictIncomplete incomplete = 2;
    // Figures contradict; the text names the problems.
    FooterTokensLineVerdictInvalid invalid = 3;
  }
}
// The clean-reconciliation line. Empty: the arm is the whole fact.
message FooterTokensLineVerdictComplete {}
// The floor verdict's evidence.
message FooterTokensLineVerdictIncomplete {
  // Daemon-composed ("2 responses missing usage"). Drawn verbatim.
  string text = 1;
}
// The contradiction verdict's evidence.
message FooterTokensLineVerdictInvalid {
  // Daemon-composed problem summary. Drawn verbatim.
  string text = 1;
}

// ---- The agents panel ------------------------------------------------------

// The live agent-spawned subagents — the subagents that ALSO have feed
// bubbles. One row per live subagent; each row is a jump target to its
// bubble. Rows leave the list when the subagent's run ends. A TRUE LIST:
// every row is the same kind of thing.
message FooterExpandedAgents {
  // The rows, in the daemon's order (spawn order). Empty when nothing is
  // live — the chip is then unset and the panel unreachable.
  repeated FooterAgentRow rows = 1;
}

// One live subagent's line: glyph · type · description · tokens · clock · ▸.
message FooterAgentRow {
  // Jump target: the subagent's identity, which keys its feed bubble.
  // Echoed into navigation, never parsed.
  conversation.v1.AgentId target = 1;
  // The subagent type ("Explore") — the row's leading label.
  FooterAgentRowLabel label = 2;
  // The commission's description. UNSET when the spawn carried none; the
  // row then draws the label alone, never a synthesized description.
  FooterAgentRowDescription description = 3;
  // The subagent's running token sum, daemon-formatted.
  FooterAgentRowTokens tokens = 4;
  // The row's clock. The client ticks from the instant.
  FooterAgentRowRuntime runtime = 5;
}
// The row's type label.
message FooterAgentRowLabel {
  // The label text, drawn verbatim ("Explore").
  string text = 1;
}
// The row's description element.
message FooterAgentRowDescription {
  // The description, drawn verbatim (the spawn's short commission).
  string text = 1;
}
// The row's token element.
message FooterAgentRowTokens {
  // The formatted running sum ("12.4k tok"). Re-pushed as it grows.
  string text = 1;
}
// The row's clock element. Carries only the start instant: the client draws
// its own ticking elapsed time, so the clock never jumps to push cadence.
message FooterAgentRowRuntime {
  // When the subagent's run began, epoch ms. The ORIGINAL instant — it does
  // not reset if the work re-announces on another stream.
  int64 started_at_ms = 1;
}

// ---- The tasks panel -------------------------------------------------------

// The task tracker's checklist — the CURRENT list, resolved by the daemon,
// so no consumer replays tracker acts to learn what the tasks are. One row
// per task, in the tracker's order; done and open tasks alike stay listed
// (the chip's fraction is this list's summary).
message FooterExpandedTasks {
  // The rows, in the daemon's order. Empty when the tracker is empty — the
  // chip is then unset and the panel unreachable.
  repeated FooterTaskRow rows = 1;
}

// One task's line: status glyph · subject · (active form while running).
message FooterTaskRow {
  // The glyph element; the set arm picks the treatment.
  FooterTaskRowStatus status = 1;
  // The task's subject line, drawn verbatim.
  FooterTaskRowSubject subject = 2;
}
// The row's subject element.
message FooterTaskRowSubject {
  // The subject text, drawn verbatim.
  string text = 1;
}
// The row's status element. The DRAWN PROJECTION of the tracker's status —
// the arm picks the glyph, so a bool checkbox (which would collapse
// running, failed, killed and paused into "unchecked") is unrepresentable.
message FooterTaskRowStatus {
  // The tracker status, projected to what the checklist draws distinctly.
  oneof status {
    // ☐ — not started.
    FooterTaskRowPending pending = 1;
    // Spinner — in progress, with the in-progress phrasing when given.
    FooterTaskRowRunning running = 2;
    // ☑ — done.
    FooterTaskRowCompleted completed = 3;
    // ✗ — the task failed.
    FooterTaskRowFailed failed = 4;
    // ✗ — the task was stopped by hand.
    FooterTaskRowKilled killed = 5;
    // ⏸ — deliberately on hold.
    FooterTaskRowPaused paused = 6;
  }
}
// Not started. Empty: the arm is the whole fact.
message FooterTaskRowPending {}
// In progress.
message FooterTaskRowRunning {
  // The in-progress phrasing ("Running the migration…"). UNSET when the
  // agent gave none; the row then draws the subject alone.
  FooterTaskRowActiveForm active_form = 1;
}
// The running row's phrasing element.
message FooterTaskRowActiveForm {
  // The phrasing, drawn verbatim in place of the subject while running.
  string text = 1;
}
// Done. Empty: the arm is the whole fact.
message FooterTaskRowCompleted {}
// Failed. Empty: the arm is the whole fact.
message FooterTaskRowFailed {}
// Stopped by hand. Empty: the arm is the whole fact.
message FooterTaskRowKilled {}
// On hold. Empty: the arm is the whole fact.
message FooterTaskRowPaused {}

// ---- The shells panel ------------------------------------------------------

// The live detached shells. One row per running background command; each
// row jumps to the shell's feed bubble. No token element — a shell has no
// token cost. A TRUE LIST, like the agents panel.
message FooterExpandedShells {
  // One row per live shell, in the daemon's order. Empty when none.
  repeated FooterShellRow rows = 1;
}

// One live shell's line: $ · command · clock · ▸.
message FooterShellRow {
  // Jump target: the shell unit's identity, which keys its feed bubble.
  conversation.v1.AgentActivityId target = 1;
  // The command line being run.
  FooterShellRowCommand command = 2;
  // The row's clock. The client ticks from the instant.
  FooterShellRowRuntime runtime = 3;
}
// The row's command element.
message FooterShellRowCommand {
  // The command text, drawn verbatim (the daemon may truncate for width —
  // what arrives is what is drawn).
  string text = 1;
}
// The row's clock element.
message FooterShellRowRuntime {
  // When the command began, epoch ms. The ORIGINAL instant — detaching from
  // the turn does not reset it.
  int64 started_at_ms = 1;
}
