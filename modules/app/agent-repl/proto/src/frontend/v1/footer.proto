// footer.proto — THE FOOTER: the workspace's status strip, and (increment 2)
// its expanded section. Per-workspace; resolved by the daemon.
//
// THE MAIN STRIP, left to right — resolution INCREASES left to right, and all
// three status sections are TYPED, each "less" typed than the last by carrying
// more of its information in text fields:
//
//   ┌───────────┬─────────────────────┬──────────────────────────────┬───────┬─────────────────────────┐
//   │ merging   │ cherry-picking 3/7  │ 4f2a1c: fold tokens into api │ 0:42  │ 18.2k in · 3.1k thought │
//   └───────────┴─────────────────────┴──────────────────────────────┴───────┴─────────────────────────┘
//     Status      SubStatus             StatusActivity                 Clock   Tokens
//     coarsest ──────────── resolution increases ────────────► finest
//
//   Status         the coarsest state, one word + color, a small closed set;
//                  `interrupted` is a status like any other, cleared by the
//                  next status update.
//   SubStatus      the step WITHIN the status, typed per status family, with
//                  the small facts a step has (queue position, commit counts).
//   StatusActivity the finest, DYNAMIC line: typed KINDS whose payload is
//                  mostly text the daemon composed.
//   Clock          how long the current turn has been running.
//   Tokens         this turn's cost so far; opens the token-breakdown menu.
//
// Gone from the strip: the interrupt chip (an `interrupted` status now), and
// the counters (held → the daemon-hold tray's heading; permissions → the
// feed's cards; tasks → the tray/sheet).
//
// EVERY FIELD IS AN ELEMENT MESSAGE, nested as the UI nests. The daemon
// resolves every level; the client renders and derives nothing — there is no
// client-side precedence between windows, no phase→word table, no mapping of
// any state to a color.

syntax = "proto3";

package frontend.v1;

import "conversation/v1/api.proto";
import "frontend/v1/failure.proto";
import "frontend/v1/feed.proto";
import "agentrepl/v1/shared.proto";
import "shim/v1/core.proto";

option go_package = "agentrepl/proto/frontend/v1;frontendv1";

// ==========================================================================
// THE FOOTER VIEW
// ==========================================================================

// The footer, resolved completely by the daemon.
message FooterView {
  // The workspace this footer belongs to. STAGE-3b decides whether a
  // per-workspace stream's element still carries it.
  FooterWorkspace workspace = 1;
  // The staleness fence for this push. STAGE-3b decides whether cross-stream
  // fencing survives per-component streams.
  FooterFence fence = 2;
  // The main strip.
  FooterStrip strip = 3;
  // The expanded section (rows below the strip, and the sheet). Declared
  // empty here; filled by the next increment.
  FooterExpanded expanded = 4;
}

// The workspace the footer belongs to.
message FooterWorkspace {
  // Absolute worktree dir.
  string dir = 1;
}

// The staleness fence for this push: opaque, compared byte-wise, never parsed.
message FooterFence {
  string token = 1;
}

// The expanded section. FILLED BY THE NEXT INCREMENT — empty here on purpose,
// not a guess at its elements.
message FooterExpanded {}

// ==========================================================================
// THE MAIN STRIP
// ==========================================================================

// The main strip: five slots, left to right.
message FooterStrip {
  FooterStatus status = 1;
  // Unset when the status has no substructure (waiting, interrupted,
  // background, asleep).
  FooterSubStatus sub_status = 2;
  // Unset when the daemon has nothing finer to say.
  FooterStatusActivity activity = 3;
  FooterClock clock = 4;
  FooterTokens tokens = 5;
}

// ---- 1. Status — coarsest -------------------------------------------------

// The coarsest state. THE SET ARM IS THE STATUS; every arm is EMPTY, being
// set is the whole assertion. Each arm's color is the shared render-colors
// vocabulary's, one per arm, resolved by the daemon into the CSS class the
// client applies; the client holds no table.
message FooterStatus {
  oneof status {
    // Nothing running, route proven usable (ready, or a response unread).
    FooterStatusIdle idle = 1;
    // A turn is in flight (submitting, thinking, clearing, compacting).
    FooterStatusThinking thinking = 2;
    // Parked on YOU — a permission, a question.
    FooterStatusWaiting waiting = 3;
    // The last turn was interrupted; cleared by the next status update.
    FooterStatusInterrupted interrupted = 4;
    // A merge run owns the session.
    FooterStatusMerging merging = 5;
    // No foreground turn, but detached work is live.
    FooterStatusBackground background = 6;
    // The vendor or the account said no (auth, usage limit, persistent
    // 4xx/5xx). A REPORT of the last turn's conclusion; gates nothing.
    FooterStatusBlocked blocked = 7;
    // Hibernated on purpose; nothing is wrong.
    FooterStatusAsleep asleep = 8;
    // The route Emacs→daemon→shim is compromised on OUR side (starting,
    // degraded, severed, dead, start failed).
    FooterStatusDisconnected disconnected = 9;
  }
}
message FooterStatusIdle {}
message FooterStatusThinking {}
message FooterStatusWaiting {}
message FooterStatusInterrupted {}
message FooterStatusMerging {}
message FooterStatusBackground {}
message FooterStatusBlocked {}
message FooterStatusAsleep {}
message FooterStatusDisconnected {}

// ---- 2. SubStatus — the step within the status ----------------------------

// The step WITHIN the status, typed per status family. The family arm set
// here MUST agree with FooterStatus's arm: a `merging` sub-status under an
// `idle` status is a daemon fault, rejected loudly.
message FooterSubStatus {
  oneof sub_status {
    FooterSubStatusThinking thinking = 1;
    FooterSubStatusMerging merging = 2;
    FooterSubStatusDisconnected disconnected = 3;
    FooterSubStatusIdle idle = 4;
    FooterSubStatusBlocked blocked = 5;
  }
}

// The steps of a turn in flight.
message FooterSubStatusThinking {
  oneof step {
    // A prompt is committed and not yet acked by the shim.
    FooterSubStatusThinkingSubmitting submitting = 1;
    // The agent is working.
    FooterSubStatusThinkingThinking thinking = 2;
    // The conversation is being cleared.
    FooterSubStatusThinkingClearing clearing = 3;
    // The context is being compacted.
    FooterSubStatusThinkingCompacting compacting = 4;
  }
}
message FooterSubStatusThinkingSubmitting {}
message FooterSubStatusThinkingThinking {}
message FooterSubStatusThinkingClearing {}
message FooterSubStatusThinkingCompacting {}

// The steps of a merge run — the run's own phase vocabulary, projected.
message FooterSubStatusMerging {
  oneof step {
    // The first instant of a merge, before anything durable exists for it.
    FooterSubStatusMergingEnqueuing enqueuing = 1;
    // Waiting behind other workspaces' merges.
    FooterSubStatusMergingQueued queued = 2;
    // The configured before-action is running.
    FooterSubStatusMergingBeforeAction before_action = 3;
    // Commits are landing one at a time.
    FooterSubStatusMergingCherryPicking cherry_picking = 4;
    // The landed commit is under test.
    FooterSubStatusMergingTesting testing = 5;
    // Stopped on a conflict awaiting resolution.
    FooterSubStatusMergingConflict conflict = 6;
    // The configured after-action is running.
    FooterSubStatusMergingAfterAction after_action = 7;
    // The run failed.
    FooterSubStatusMergingFailed failed = 8;
    // The run settled successfully.
    FooterSubStatusMergingMerged merged = 9;
  }
}
message FooterSubStatusMergingEnqueuing {}
// The queue place the run was admitted at.
message FooterSubStatusMergingQueued {
  // 1-based position in its repo's queue.
  int32 position = 1;
  // How many are queued in that repo.
  int32 depth = 2;
}
message FooterSubStatusMergingBeforeAction {
  // The configured action, for display.
  string action = 1;
}
message FooterSubStatusMergingCherryPicking {
  int32 commits_total = 1;
  int32 commits_landed = 2;
}
message FooterSubStatusMergingTesting {
  int32 commits_total = 1;
  // The commit under test is landed but ungated.
  int32 commits_landed = 2;
}
message FooterSubStatusMergingConflict {}
message FooterSubStatusMergingAfterAction {
  // The configured action, for display.
  string action = 1;
}
message FooterSubStatusMergingFailed {}
message FooterSubStatusMergingMerged {}

// The ways the route can be compromised.
message FooterSubStatusDisconnected {
  oneof step {
    // A bring-up is in flight; the route is not yet proven.
    FooterSubStatusDisconnectedStarting starting = 1;
    // Running, but with an open fault on the route.
    FooterSubStatusDisconnectedDegraded degraded = 2;
    // The backing process is gone; the workspace is recoverable.
    FooterSubStatusDisconnectedSevered severed = 3;
    // Terminal: no live session backs the workspace.
    FooterSubStatusDisconnectedDead dead = 4;
    // The bring-up failed outright.
    FooterSubStatusDisconnectedStartFailed start_failed = 5;
  }
}
message FooterSubStatusDisconnectedStarting {}
message FooterSubStatusDisconnectedDegraded {}
message FooterSubStatusDisconnectedSevered {}
message FooterSubStatusDisconnectedDead {}
message FooterSubStatusDisconnectedStartFailed {}

// The two flavors of idle.
message FooterSubStatusIdle {
  oneof step {
    // Live, proven usable, nothing to read.
    FooterSubStatusIdleReady ready = 1;
    // The turn finished and its response is unread.
    FooterSubStatusIdleDone done = 2;
  }
}
message FooterSubStatusIdleReady {}
message FooterSubStatusIdleDone {}

// What the vendor/account said no about.
message FooterSubStatusBlocked {
  oneof step {
    FooterSubStatusBlockedAuth auth = 1;
    FooterSubStatusBlockedUsageLimit usage_limit = 2;
    FooterSubStatusBlockedVendorError vendor_error = 3;
  }
}
message FooterSubStatusBlockedAuth {}
message FooterSubStatusBlockedUsageLimit {}
message FooterSubStatusBlockedVendorError {}

// ---- 3. StatusActivity — finest, dynamic ----------------------------------

// The finest line: typed KINDS whose payload is mostly text the daemon
// composed. A new thing to say is a new arm; `note` is the daemon's free line
// for a thing that has no kind yet.
message FooterStatusActivity {
  oneof activity {
    FooterStatusActivityMergingCommit merging_commit = 1;
    FooterStatusActivityHook hook = 2;
    FooterStatusActivityRetrying retrying = 3;
    FooterStatusActivityAuthenticating authenticating = 4;
    FooterStatusActivityBlockedOnUser blocked_on_user = 5;
    FooterStatusActivityRateLimited rate_limited = 6;
    FooterStatusActivityNote note = 7;
  }
}
// The commit a merge is landing right now.
message FooterStatusActivityMergingCommit {
  string sha = 1;
  string subject = 2;
}
// A hook is running.
message FooterStatusActivityHook {
  string name = 1;
}
// The vendor call is being retried.
message FooterStatusActivityRetrying {
  int32 attempt = 1;
  // The retry's status summary, verbatim.
  string status = 2;
}
// An auth prompt is up.
message FooterStatusActivityAuthenticating {
  // The auth prompt line, verbatim.
  string line = 1;
}
// The session reports it is parked on the user (requires_action) — a fact the
// daemon cannot otherwise see, so a permission count alone under-reports it.
message FooterStatusActivityBlockedOnUser {
  string detail = 1;
}
// The rate-limit rung. The vendor bills TWO independent allowances (rolling
// five-hour session, seven-day weekly) reported through one event; both
// figures are shown so a reader can tell WHICH allowance the newsworthy
// percentage belongs to.
message FooterStatusActivityRateLimited {
  FooterAllowance session = 1;
  FooterAllowance weekly = 2;
}
// One allowance's last report. PRESENT means the vendor has reported it at
// all; `newsworthy` is the narrower claim that the report was anything other
// than a plain "allowed", which is what put the rung up.
message FooterAllowance {
  bool newsworthy = 1;
  // Epoch SECONDS, the vendor event's own unit.
  int64 resets_at_s = 2;
  // 0..1.
  double utilization = 3;
  // The vendor's status word, verbatim (e.g. "allowed_warning"). Kept
  // verbatim because the vendor's full vocabulary is not in evidence; typed
  // arms when it is.
  string status = 4;
}
// The daemon's free line for a thing that has no kind yet.
message FooterStatusActivityNote {
  string text = 1;
}

// ---- 4. Clock ------------------------------------------------------------

// The turn clock. UNSET = no turn in flight; the cell renders idle.
message FooterClock {
  optional int64 turn_started_at_ms = 1;
}

// ---- 5. Tokens -----------------------------------------------------------

// This turn's cost so far. Click opens the token-breakdown menu (its own
// component). Deliberately NO output-token ticker: the running output figure
// is unwanted; session-wide and per-model figures are the breakdown's.
message FooterTokens {
  // THIS TURN's cumulative EXPENSIVE input — the canonical TokenUsage
  // input_misses total (written + unwritten), summed across the turn's
  // responses; cache READS excluded, which is the whole point. Resolved once
  // by the daemon; rendered verbatim.
  int64 input_tokens = 1;
  // Estimated thinking tokens so far this turn (latest-wins ticker).
  int64 thinking_tokens = 2;
  // First-token latency of the current message; unset until known.
  optional int64 ttft_ms = 3;
}

// ==========================================================================
// PENDING INCREMENT 2 — the expanded section's messages, kept VERBATIM until
// their increment: the rows below the strip and the sheet.
// ==========================================================================

// One turn's excessive expensive-input observation. Computed daemon-side from
// the turn's result usage as the canonical TokenUsage.input_misses total —
// both misses together — because the vendor marks nearly all input cacheable:
// a cold prompt surfaces as `written` while `unwritten` stays near zero even on
// a full re-ingest.
message ContextCostAlert {
  // The turn that crossed the threshold.
  string turn_id = 1;
  // The observed expensive cost: the canonical TokenUsage.input_misses total
  // (written + unwritten), resolved by internal/tokenusage.ExpensiveInput.
  int64 uncached_input_tokens = 2;
  // The configured threshold that tripped (default 20000), carried so the
  // rendering can say "N over M" without knowing daemon config.
  int64 threshold_tokens = 3;
  // When the result carrying the usage arrived, unix millis.
  int64 at_ms = 4;
  // The turn's attribution, verbatim. A CACHE_KEEP_ALIVE origin here is the
  // "keep-alive came back cold" alarm — the ping paid full freight, meaning
  // the cache had already expired — and frontends render it as its own
  // message rather than a generic expensive-turn note.
  shim.v1.PromptOrigin prompt_origin = 5;
}
// The footer's failure row: the daemon's classified failure as one line.
//
// Deliberately a PROJECTION and not the card. The row is one ellipsised line
// in a fixed-height strip; it shows the sentence, takes its color from the
// failure's side of the vocabulary, and offers to reveal the card that has the
// rest. It carries no evidence and no resolution stamp because it renders
// neither: the row stands until the next turn starts, which is a different
// lifetime from the card's window.
message FooterFailureRow {
  // The sentence, verbatim — the same one the card leads with.
  string message = 1;
  // Which side of the failure vocabulary this is, resolved to a color-class
  // name from the shared render-colors table. The row does not carry the kind
  // itself: it renders one line and has no use for typed evidence.
  string tone = 2;
  // The card to reveal when the row is activated. An empty ref means the row
  // is not clickable — it never scrolls somewhere arbitrary to look useful.
  FailureCardRef card = 3;
}
// The footer's turn-accounting cell, fully resolved.
//
// A turn's accounting is a RECONCILIATION: the daemon compares the usage each
// response reported against the totals the terminal result claimed, and the
// cell reports whether that reconciliation held. The comparison, the verdict
// and the prose are all the daemon's — the client renders a string and picks a
// class from the verdict arm.
message FooterAccountingCell {
  // The cell's text and tooltip, composed daemon-side and rendered verbatim
  // (the figures a healthy turn shows: quota, duration, token dimensions,
  // cache hit rate, subagent count, throughput).
  string summary = 1;
  // WHETHER the accounting reconciled, as arms rather than a flag, so that a
  // verdict and the evidence it implies arrive together and a client cannot
  // render "invalid" with nothing to say about why.
  oneof verdict {
    AccountingComplete complete = 2;
    AccountingIncomplete incomplete = 3;
    AccountingInvalid invalid = 4;
  }
}

// The turn reconciled: every figure in `summary` is backed by evidence.
message AccountingComplete {}

// The turn's accounting arrived without all of its evidence, so the figures
// shown are partial. Not a contradiction — an absence.
message AccountingIncomplete {
  // What was missing, one display-ready phrase per gap, in display order
  // (e.g. "usage at turn start was never sampled"). The daemon composes the
  // prose; the client concatenates and renders, and parses nothing. Never
  // empty when this arm is set — an incompleteness with nothing to name is a
  // daemon fault, not a renderable state.
  repeated string missing = 1;
}

// The turn's accounting CONTRADICTS itself: the responses and the result
// disagree about what was spent. Distinct from incomplete, because the
// evidence is present and does not add up.
message AccountingInvalid {
  // What contradicts what, one display-ready phrase per problem, in display
  // order (e.g. "per-model totals disagree between responses and result").
  // The daemon composes the prose from its own reconciliation records; the
  // client renders the strings and parses nothing. Never empty when this arm
  // is set.
  repeated string problems = 1;
}

// ==========================================================================
// PENDING — an ack payload that is called, not drawn; its fate is stage 3.
// ==========================================================================


// What a CancelDetachedAgentsRequest did, carried on the command's ack.
//
// It is the SHIM's verdict relayed, not a daemon re-derivation — see
// shim.v1.DetachedCancelOutcome for why only the shim can answer
// "what was running when this landed?" without racing task end.
//
// A ONEOF OF MESSAGES, never a bool: "did it work" cannot distinguish a stop
// that reached three agents from a session that had nothing to stop from a
// session that could not be asked, and a frontend renders those three
// differently.
message DetachedCancelOutcome {
  oneof outcome {
    DetachedAgentsCancelled cancelled = 1;
    shim.v1.NoDetachedAgentsRunning nothing_running = 2;
    shim.v1.DetachedCancelUnsupported unsupported = 3;
  }
}

// Detached work was running and the stop reached every agent counted here.
//
// TODO(respelling): this shares a name with shim.v1.DetachedAgentsCancelled
// but NOT its contents — that one carries `repeated string task_ids`, this one
// carries `count`, which has no counterpart there. It was therefore not
// collapsed into shim.v1's, and DetachedCancelOutcome above stays declared
// here for the same reason: its `cancelled` arm must reference this message.
message DetachedAgentsCancelled {
  // How many detached agents were stopped. A COUNT rather than the shim's
  // task ids: a task id is daemon-internal bookkeeping a frontend has no
  // vocabulary for, and what a frontend renders is "cancelled 3 agents". The
  // ids stay on the shim-wire arm, where the daemon uses them to settle
  // exactly those agents' detached-work messages.
  int64 count = 1;
}

// TWO OF THE THREE ARMS ABOVE NAME shim.v1's MESSAGES DIRECTLY. "Nothing
// was running" and "this shim cannot be asked" are shim-wire facts the daemon
// forwards unchanged, so this package keeps no second copy of them to drift
// against the originals.
//
// THE DAEMON STILL REFUSES ON THE `nothing_running` ARM (the ack carries
// ok=false alongside it): a cancel that stopped nothing is a keystroke that did
// nothing, and reporting it as success is how a stop that silently missed looks
// exactly like a stop that worked.

// ==========================================================================
// PLUMBING: the resolved per-workspace state and the per-session catalog
// entry, plus the closed vocabularies they resolve onto.
// ==========================================================================

// The closed render-state vocabulary (SSM-resolved).
//
// Every state maps onto ONE of six colors, and the colors are a promise to
// the user about what they can do rather than a description of daemon
// internals. Frontends key their render tables on the color, so the tab-bar,
// the sidebar dots, and the progress footer can never disagree:
//
//   BLUE   INIT, SEVERED, DEAD, DEGRADED — the route Emacs→daemon→shim→SDK is
//          compromised on OUR side, and there is EVIDENCE of the breakage. A
//          bring-up in flight (INIT), a bring-up that failed or a session controller that
//          died on a terminal protocol error (SEVERED), a dead or unspawned
//          shim, a store outage, or a failed backfill. Blue is the honest
//          state whenever green's promise cannot be kept AND something is
//          actually wrong.
//   TEAL   HIBERNATED — nothing is wired, and nothing is wrong. We put the
//          session to sleep on purpose to reclaim its ~500MB, or nothing has
//          ever been wired to this workspace. It makes the SAME actionability
//          claim blue does (you cannot interact without a bring-up) and the
//          REASON is benign, which is exactly why it is not blue: blue's job
//          is to mean "something is broken", and a hibernation rendered blue
//          spent that meaning on the most ordinary event in the system.
//   PURPLE VENDOR_BLOCKED — the last turn ended AT THE VENDOR or on the
//          ACCOUNT. Auth, usage limit, persistent 4xx/5xx, or any other
//          abnormal turn-CONCLUDING error. It is a REPORT of that
//          conclusion, the counterpart to green's "ended normally", and
//          gates nothing: prompting stays available, and the next thing
//          the agent does replaces it.
//   RED    THINKING, CLEARING, COMPACTING — a turn is in flight. The three
//          share the color because they share the claim; only the phase WORD
//          distinguishes what the agent is busy with.
//   YELLOW IDLE_ASYNC — no foreground turn, but detached work is live.
//   GREEN  READY, IDLE, DONE, PERMISSION — the route is proven usable
//          WITHOUT requiring a first message. A pending permission is
//          GREEN: the agent is ready for the user to view the response and
//          answer.
//
// A WORKSPACE'S COLOR IS CONNECTION TRUTH. Blue and teal both mean there is
// no live backend session for this workspace; they differ only on whether
// that is a fault or a choice. Every OTHER color is a GUARANTEE that the
// session substrate is fully wired — shim live, handshake complete, store
// link settled — so selecting a green, red, yellow or purple workspace
// involves no connection bootstrapping whatsoever.
//
// Precedence is blue > purple > red > yellow > green, resolved in the SSM's
// SQL rank table (daemon/internal/ssm/resolve.go) rather than any Go or
// elisp cond-ladder.
enum RenderState {
  RENDER_STATE_UNSPECIFIED = 0;
  RENDER_STATE_INIT = 1;
  RENDER_STATE_IDLE = 2;
  RENDER_STATE_IDLE_ASYNC = 3;
  RENDER_STATE_THINKING = 4;
  RENDER_STATE_PERMISSION = 5;
  RENDER_STATE_DONE = 6;
  // DEPRECATED by RENDER_STATE_VENDOR_BLOCKED. It was never a state of its
  // own: an errored turn end is an abnormal CONCLUSION, which is exactly
  // what VENDOR_BLOCKED means, and its own color said "stopped" in a way
  // that read as neither working nor blocked. The SSM no longer resolves it,
  // and it stays in the vocabulary so an old frontend decoding an old log
  // still reads what it always did.
  RENDER_STATE_STOP_FAILED = 7 [deprecated = true];
  RENDER_STATE_MERGING = 8;
  RENDER_STATE_MERGE_QUEUED = 9;
  RENDER_STATE_MERGE_CONFLICT = 10;
  RENDER_STATE_MERGE_FAILED = 11;
  RENDER_STATE_MERGED = 12;
  RENDER_STATE_DEAD = 13;
  RENDER_STATE_DEGRADED = 14;
  // The five-color remap.
  //
  // READY is the green a session reaches WITHOUT being prompted: the shim
  // asserted its own readiness and the backfill settled, with the session
  // wired. IDLE remains for a session that went quiet after
  // working; both are green, and the split is kept only because the SSM's
  // cause chain distinguishes "never ran" from "ran and finished".
  RENDER_STATE_READY = 15;
  RENDER_STATE_VENDOR_BLOCKED = 16;
  // A turn OUTCOME on the session-status lifecycle, exactly as DONE and
  // VENDOR_BLOCKED are: it reports that the LAST turn ended because a stop
  // was delivered (core.InterruptOutcome INTERRUPTED), and the next
  // session-status lifecycle row supersedes it. Never a latch, never needs releasing.
  RENDER_STATE_INTERRUPTED = 17;
  // Additive: the two CONTEXT-CUT states. Both are red for the same reason
  // THINKING is — the agent is busy and the user's prompt cannot land yet —
  // and the WORD is the whole distinction, exactly as INTERRUPTED's green
  // documents. They outrank thinking in the SSM's rank table because they are
  // busy with something OTHER than the answer, which is the more specific
  // true statement about what the session is doing.
  //
  // CLEARING is user-initiated (a dispatched `/clear`) and COMPACTING can be
  // either the user's `/compact` or the vendor's automatic one; when both are
  // somehow open, clearing wins.
  RENDER_STATE_CLEARING = 18;
  RENDER_STATE_COMPACTING = 19;
  // NOT WIRED, and the SUBSTRATE IS BROKEN. A bring-up that could not be
  // completed, or a session controller whose `client.Run` returned a terminal protocol
  // error.
  //
  // It is the resting half of the connection-truth law above. INIT already
  // says "a bring-up is in flight"; this says the opposite, that nothing is
  // in flight and nothing is wired, which INIT's spinner would misreport as
  // work in progress. Both are BLUE — the claim about what the user can do
  // is identical, and so is the claim that something on our side went wrong —
  // and the WORD and the (non-spinning) glyph are the whole distinction,
  // exactly as CLEARING and COMPACTING split THINKING.
  //
  // Nothing about the agent shows through it. A severed workspace may have a
  // `thinking` row from the turn it was driving when it broke; reporting that
  // would advertise an agent nobody is connected to.
  //
  // THE SSM RESOLVES THE LITERAL TEXT `dormant` ONTO THIS STATE, FOREVER. The
  // state log is append-only, so rows written before this state carried its
  // present name still have to resolve to something, and this is the state
  // they mean: not wired, and broken. The benign half of that older reading —
  // the deliberate hibernation, the never-wired workspace — is HIBERNATED
  // below, which is what lets BLUE mean "something is actually wrong".
  RENDER_STATE_SEVERED = 20;
  // Additive: NOT WIRED, and NOTHING IS WRONG — the session was deliberately
  // put to sleep to reclaim its memory, or nothing has ever been wired to this
  // workspace.
  //
  // TEAL, and the reason it is not blue is the whole point of the split. The
  // old single DORMANT state conflated "asleep on purpose" with "the backend
  // is broken", so the most ordinary event in the system — the idle sweeper
  // reclaiming ~500MB from a workspace nobody has touched for an hour —
  // rendered identically to a dead shim. A color that fires on both cannot
  // mean either.
  //
  // Its PRECEDENCE is nonetheless the blue band's, NOT green's: it makes the
  // same actionability claim (you cannot interact without paying a bring-up),
  // and only the reason is benign. Ranking it below green would let a stale
  // `thinking` row from the turn a workspace was hibernated after mask a
  // workspace that is genuinely asleep. See the SSM's `prec` table, where it
  // sits at 15 — directly below the blue band and above purple's 20.
  RENDER_STATE_HIBERNATED = 21;
  // Additive: the FIRST half of a turn, before the shim has taken the prompt.
  //
  // RED, exactly as THINKING is, and for the identical reason: a turn is in
  // flight and the user's next prompt cannot land yet. The WORD is the whole
  // distinction, precisely as CLEARING and COMPACTING split THINKING above.
  //
  // WHAT IT SPLITS. The daemon publishes a turn's state the moment it commits
  // to submitting, which is what stops a prompt from sitting against a green
  // workspace while a busy shim gets round to acking it. That claim is
  // truthful but coarse: it says the agent is thinking during a window in
  // which the agent has not yet been handed anything. SUBMITTING names that
  // window, so THINKING can go back to meaning the shim actually holds the
  // prompt.
  //
  // ITS CLOSING EDGE IS THE SHIM ACK, and deliberately not the durable
  // TurnStarted: the shim MINTS TurnStarted in the same synchronous block that
  // acks the submit (uds-session.ts, emitTurnStarted), so the two report one
  // instant and the gap between them is store round-trip time. A state cut
  // there would move with store load rather than with the agent, lingering
  // longest exactly when the model was fastest.
  RENDER_STATE_SUBMITTING = 22;
  // Additive: the FIRST instant of a merge attempt, before the request is
  // durably on its repository's queue.
  //
  // WHAT IT SPLITS. MERGE_QUEUED and MERGING both describe a merge the
  // daemon has already accepted and recorded; neither can describe the window
  // between the frontend command arriving and the durable enqueue landing. A
  // command that died in that window — an unresolvable geometry, a queue write
  // that failed, a daemon that never got to process it — left no trace in any
  // UI at all, so the user's merge simply never appeared to happen. This is
  // the command handler's own "I have this" mark, emitted on receipt before
  // geometry resolution and before Coordinator.Enqueue.
  //
  // IT IS DELIBERATELY TRANSIENT and has NO durable queue entry behind it. It
  // is superseded within milliseconds by MERGE_QUEUED or MERGING on the happy
  // path, and by MERGE_FAILED when the enqueue is refused. A daemon that
  // bounces while a workspace sits here has by definition lost the attempt,
  // so Coordinator.Drain sweeps it to MERGE_FAILED at the next boot rather
  // than leaving a workspace pinned on a phase nothing will ever advance.
  //
  // Its PRECEDENCE is directly BELOW MERGE_QUEUED (rank 6 in the SSM's prec
  // table, beneath merge_queued's 5): it is the weakest claim the merge axis
  // can make — the attempt is not even on a queue yet — so any other merge row
  // that exists is the more specific truth.
  RENDER_STATE_MERGE_ENQUEUING = 23;
}

// SESSION CONNECTIVITY answers whether the current session-controller
// generation can operate the session reliably now. The daemon is the sole
// authority: frontends adopt this verdict unchanged and never infer it from
// SessionView.live, a socket, a historical RenderState, or a fault card.
enum SessionConnectivity {
  SESSION_CONNECTIVITY_UNSPECIFIED = 0;
  // Intentionally offline. No controller generation is current and no fault
  // is implied; the session may be brought up on demand.
  SESSION_CONNECTIVITY_HIBERNATED = 1;
  // Establishment or re-establishment of the current controller generation is
  // in progress.
  SESSION_CONNECTIVITY_CONNECTING = 2;
  // The current generation passed readiness and has no open
  // connectivity-impacting fault.
  SESSION_CONNECTIVITY_OPERATIONAL = 3;
  // The current generation remains attached, but one or more
  // connectivity-impacting fault windows are open.
  SESSION_CONNECTIVITY_DEGRADED = 4;
  // Establishment or operation failed and no operating route remains.
  SESSION_CONNECTIVITY_UNAVAILABLE = 5;
}

// SESSION STATUS answers what the session is doing independently of whether
// its current route is usable. Connectivity outranks it for primary
// presentation whenever connectivity is not OPERATIONAL.
enum SessionStatus {
  SESSION_STATUS_UNSPECIFIED = 0;
  SESSION_STATUS_READY = 1;
  SESSION_STATUS_THINKING = 2;
  SESSION_STATUS_PERMISSION = 3;
  SESSION_STATUS_DONE = 4;
  SESSION_STATUS_INTERRUPTED = 5;
  SESSION_STATUS_VENDOR_BLOCKED = 6;
  SESSION_STATUS_MONITORING = 7;
  // The session-status twin of RENDER_STATE_SUBMITTING: the daemon has
  // committed to submitting a prompt and the shim has not yet acked it.
  SESSION_STATUS_SUBMITTING = 8;
}

// A runtime fault is explanatory evidence scoped to exactly one
// session-controller generation. A close edge can close only its matching
// (component, fault_type) window, and a retired generation's faults can never
// affect its replacement.
message RuntimeFault {
  string component = 1;
  string fault_type = 2;
  string impact = 3;
  string cause_kind = 4;
  int64 opened_at_ms = 5;
}

// THE resolved per-workspace state, plus the inputs snapshot that produced
// it (for debuggability: a frontend can show WHY a state was resolved).
//
// IDENTITY AUTHORITY: this message is the SOLE authority for which session
// owns a workspace. `session_id` below is the daemon session-state machine's
// ruling, revisioned like every other field here, and a rotation to a new
// owning session arrives as a new revision of this message. No consumer may
// take a workspace's live session identity from any other frame.
message WorkspaceState {
  string workspace = 1;
  // THE workspace's owning session, and the only field on this protocol that
  // may bind it. A consumer adopts this value and nothing else as "which
  // session am I talking to for this workspace".
  //
  // HOST SURFACE. Emacs manages sessions — it creates, deletes and revives
  // them — so it needs the identity itself. No webapp-facing message carries
  // this field or anything derived from it; a rendering frontend reads
  // `fence` below instead, which answers the only question it ever had.
  string session_id = 2;
  // THE workspace's authoritative staleness fence, and the value every fenced
  // push is compared against.
  //
  // It is this message's own projection of the identity above: the daemon
  // mints a new fence whenever the workspace's owning session or its
  // controller generation rotates, so "the fence changed" and "what I was
  // talking to was replaced" are the same event. Publishing the projection
  // rather than the identity is what lets a rendering frontend answer
  // current-vs-stale without ever holding a session vocabulary.
  //
  // OPAQUE. Compared byte-wise, never parsed. Its composition is the daemon's
  // and is free to change without a wire change, which is only true for as
  // long as nothing reads structure into it.
  string fence = 3;
  // Primary UX projection resolved by the daemon. This is retained for merge
  // and context-cut presentation; it is not the authority for connectivity or
  // session status.
  RenderState state = 4;
  // Resolution inputs (SSM):
  bool turn_active = 5;
  int64 live_task_count = 6;
  string cause_kind = 7;  // event kind that caused this transition
  uint64 cause_seq = 8;   // store seq when event-caused (0 = daemon-local)
  int64 at_ms = 9;
  SessionConnectivity connectivity = 10;
  SessionStatus status = 11;
  // HOST SURFACE, like session_id above: the identity of the session
  // controller generation currently operating the session, which Emacs uses to
  // scope health probes and fault windows. A rendering frontend never reads
  // it — the fence is this identity's projection, re-minted on every rotation,
  // and answers the only question a renderer has.
  string controller_generation_id = 12;
  repeated RuntimeFault active_faults = 13;
  // Whether merge.Coordinator holds the exclusivity lease on this workspace's
  // shim. While held, USER prompting is blocked (the merge owns the session)
  // and every message the session produces carries
  // CONVERSATION_SOURCE_MERGE.
  bool merge_lease_held = 14;
  // WHEN this workspace's merge landed, in unix millis. 0 means it has never
  // reached `merged`, which is the only reading of absence: a merged
  // workspace always carries the instant it merged at.
  //
  // WRITTEN ONCE, at the `merged` transition, and never moved afterwards.
  // `merge_status` reports whichever run is currently newest and can
  // therefore be superseded; this is the durable record that the merge
  // LANDED, so a later transition on any axis leaves it exactly where it was.
  //
  // It is its own persisted fact rather than a re-derivation over the state
  // log, so a frontend ordering a recently-merged section reads the identical
  // instant from every push, snapshot and resync.
  int64 merged_at_ms = 15;
  // THE merge run's live progress, and the ONLY merge-run surface on this
  // message. See MergeStatus. IT NAMES A RUN, carries the phase as WHICH oneof
  // arm is set, and reports the queue place the run was actually ADMITTED at.
  // There is deliberately no second, flatter form of these facts on this
  // message: two forms of one fact can disagree on a single frame, so the
  // resolved run is the only one that exists.
  //
  // UNSET means this workspace has no merge to report — the merge axis has
  // never spoken for it, or its axis is cleared. It is never a zero-valued
  // status standing in for absence.
  agentrepl.v1.MergeStatus merge_status = 16;
  // THE OUTSTANDING QUESTION about taking this workspace's merge off the
  // queue. See MergeDequeueOffer: an interrupt no longer performs the queue
  // half, it asks, and this is where the asking lives.
  //
  // UNSET means there is nothing to answer — no offer was ever raised, or the
  // one that was has been answered, superseded by the merge reaching its own
  // terminal, or dropped because the merge left the queue on its own. A
  // frontend draws the card if and only if this field is set, so clearing it
  // IS how the card comes down; there is no second dismissal channel.
  agentrepl.v1.MergeDequeueOffer merge_dequeue_offer = 17;
}

// A PER-SESSION CATALOG ENTRY, not a statement about who owns a workspace.
//
// This message is published for retired, superseded, terminal and hibernated
// sessions exactly as it is for the live one — `terminal` and `death` below
// exist precisely so a dead session still has a view. A connect snapshot
// therefore carries several of these for the same `workspace`, in no
// authority order.
//
// SO: NO CONSUMER MAY ADOPT `session_id` BELOW AS A WORKSPACE'S LIVE SESSION
// IDENTITY. WorkspaceState is the sole authority for that (see its comment).
// A consumer that binds identity from this message under last-writer-wins
// will rebind to whichever entry happened to arrive last — including a dead
// one — and then address the daemon with a stale session under the current
// controller generation, which the daemon refuses as an identity mismatch.
// That is a real, observed outage, not a hypothetical.
message SessionView {
  // HOST SURFACE. Emacs creates, deletes, revives and catalogs sessions, so
  // it reads sessions as sessions. A rendering frontend does not: the facts it
  // used to take from here reach it as fenced component views instead —
  // WorkspaceGateView for the hibernation gate, TopbarView for the identity
  // line, TokenBreakdownView for economics, and a resolved failure card for a
  // terminal session's account.
  string workspace = 1;
  // WHICH session this catalog entry describes — a correlation key, never a
  // binding. It says "the facts below belong to this session"; it does not
  // say "this session owns `workspace`". Only WorkspaceState.session_id says
  // that.
  string session_id = 2;
  string model = 3;
  string slug = 4;
  string title = 5;
  int64 total_tokens = 6;
  double total_cost_usd = 7;
  int64 context_window = 8;
  string permission_mode = 9;
  // Whether the daemon holds a LIVE SESSION CONTROLLER for this session's
  // workspace — i.e. a shim is attached, or its client is reconnecting to one.
  //
  // IT IS THE ONE FIELD ON THIS MESSAGE THAT IS NOT DURABLE, and that is
  // exactly why it exists. Every other field here is read off the registry
  // record, which survives a daemon restart; a frontend that judges "is this
  // workspace already up?" from those sees a non-terminal, fully-backfilled
  // record and concludes YES against a daemon that has no session controller
  // for it at all. Emacs's switch-ensure did precisely that, so after a daemon
  // restart switching to an unwired workspace skipped its openWorkspace and
  // the workspace never bootstrapped.
  //
  // The field had NO producer before that bug; the name always meant this.
  bool shim_attached = 10;
  // Resume/rebind keys the webapp lost in the cutover.
  string claude_session_id = 11;
  string cwd = 12;
  // GET /sessions parity so Emacs can drop HTTP entirely.
  bool terminal = 13;
  bool rehydratable = 14;
  bool hibernated = 15;
  int64 pending_permissions = 16;
  // Account identity — the CLAUDE_CONFIG_DIR the session's
  // shim runs against (account switching is daemon-executed, webapp-initiated).
  string config_dir = 17;
  // Whether this session's on-disk transcript has been read
  // into the store — the NEVER-BLUE completion signal (see BackfillState).
  BackfillState backfill = 18;
  // The TYPED account of why this session is terminal, and the ONLY
  // reader-facing account of it.
  //
  // CLASSIFIED ONCE, DAEMON-SIDE, never a free string: a frontend that is
  // handed prose cannot know what class of failure it describes, so it cannot
  // color it, group it, or offer the right remedy. Typed, the dead-state card
  // renders it the way every other failure renders. Unset while the session
  // lives.
  FailureCardView death = 19;
  // The SDK-published set this session can deliberately select.  A frontend
  // only renders these choices; it never invents or owns a model selection.
  repeated conversation.v1.ModelOption model_options = 20;
  // NO PERSISTENCE AGGREGATE RIDES THIS MESSAGE. Token economics is durable
  // evidence with its own home, and what a frontend needs of it arrives
  // already digested as TokenBreakdownView's resolved rows — never as a whole
  // aggregate a renderer is expected to re-derive rows from itself.
  //
  // Present iff the session is hibernated; the typed account behind the
  // `hibernated` bool, which stays as its coarse projection.
  // A frontend renders the revival gate from this.
  agentrepl.v1.HibernationDetail hibernation = 21;
}

// Whether a session's on-disk transcript has been backfilled into the store.
//
// This is the completion signal the never-blue contract needs: a workspace
// whose session is LIVE but whose history never arrived is still blue, and
// "live" alone cannot tell those apart. DAEMON-RESOLVED, never frontend-
// derived, and carried on SessionView so it rides every connect snapshot.
//
// DERIVED, not reported. The sidecar has no channel to the daemon at all: it
// writes to the shim-store, discards the store's own StoreWriteAck, keeps its
// cursor per-FILE (dev:inode) rather than per-session, and emits no terminal
// marker for a finished file. So the daemon reads the only evidence that
// actually reaches it — the event stream — and the mapping is:
//
//   PENDING  a transcript exists on disk for this session's cwd, but no
//            file-plane event has arrived for it yet.
//   DONE     at least one file-plane record has arrived, so the file plane
//            really did deliver into the store.
//   FAILED   the sidecar could not read part of the transcript. It used to say
//            so with a core.v1.UnparsedEvent, which was durable and DID reach
//            the daemon; that arm is now store.v1's unsupported half, which
//            deliberately never leaves the shim — so this state currently has no
//            evidence to resolve from. Surfaced loudly rather than left reading
//            as "not yet".
//
// KNOWN LIMITATION — a sidecar read error that is NOT a malformed line (a
// permission error, an unreadable project dir) is only logged sidecar-side and
// retried every second forever, with nothing durable written. It therefore
// manifests here as a PENDING that never advances, not as FAILED. Closing that
// needs a sidecar report the wire does not carry today; the cheapest honest
// paths are the StoreWriteAck the sidecar currently throws away, or a status
// event on its store connection.
enum BackfillState {
  // No transcript on disk for this session's cwd: a genuinely fresh
  // workspace with nothing to backfill. NOT "unknown" — an empty workspace
  // is a real, correct answer, and it is what a blue workspace should be.
  BACKFILL_STATE_UNSPECIFIED = 0;
  BACKFILL_STATE_PENDING = 1;
  BACKFILL_STATE_DONE = 2;
  BACKFILL_STATE_FAILED = 3;
}

// Daemon-level identity/liveness Emacs read from GET /sessions'
// envelope (boot detection, version-mismatch warnings, binary staleness).
message DaemonView {
  string boot_id = 1;
  string protocol_version = 2;
  int64 daemon_binary_mtime_ms = 3;
  string daemon_version = 4;
}

// EPHEMERAL long-tool liveness relay: the arm the daemon puts a running tool's
// liveness on, so a long-running tool stops looking hung. It is never
// persisted and never appears in a StateSnapshot — a frontend that reconnects
// simply waits for the next heartbeat.
//
// KNOWN GAP: THIS VIEW CURRENTLY HAS NOTHING TO TICK WITH. The per-tool
// progress a renderer would need (which tool, how long it has been running) is
// a fact ABOUT a turn, so BookkeepingEntry is its home — and bookkeeping never
// reaches a client, and no resolved frontend spelling of it exists yet. So the
// view carries a workspace and a fence and no payload. Stated loudly rather
// than left to be discovered by a frontend looking for a field to render.
message HeartbeatView {
  // WHICH WORKSPACE this liveness belongs to, and the only addressing this
  // view carries. A rendering frontend holds no session vocabulary; the one
  // question it has beyond "which workspace" is "is this push still current",
  // and the fence below answers that without naming what rotated.
  string workspace = 1;
  // The workspace's staleness FENCE at the moment the daemon produced this
  // push: an opaque token the client compares BYTE-WISE against the fence on
  // the workspace's current WorkspaceState, and never parses, splits or
  // interprets. Equal means current; different means stale, and a stale push
  // is discarded whole rather than partially adopted.
  //
  // The daemon mints it and is the only thing that can read meaning into it.
  // A client that learned to decode it would be depending on a fact this
  // contract does not offer, and the token's composition is free to change.
  string fence = 2;
}

