// ---- Shared activity leaf payloads ----------------------------------------
// One drawn cell, one payload vocabulary: these leaves are shared across the
// per-status salient oneofs above — the per-status ONEOF types are what
// confine legality, and a leaf carries only the line's content.

// The activity's standing instant.
message FooterStatusActivityAt {
  // Epoch ms. The client derives and ticks the RELATIVE age ("· 2m ago")
  // per the clock convention — an instant is shipped, a duration is drawn.
  int64 at_ms = 1;
}

// The pending wakeup's countdown line.
message FooterStatusActivityWakeup {
  // When the wakeup fires, epoch ms; the client derives the remaining
  // duration and re-renders it at a one-second tick. A FUTURE deadline
  // counting down, distinct from the envelope instant counting up.
  int64 wake_at_ms = 1;
  // The agent's one-sentence reason, drawn after the countdown. UNSET when
  // the agent gave none.
  optional FooterStatusActivityWakeupReason reason = 2;
}
// The reason element.
message FooterStatusActivityWakeupReason {
  // The sentence, drawn verbatim.
  string text = 1;
}

// The API answered again after one or more failed attempts.
message FooterActivityTransientApiRestored {
  // How many attempts had failed before it answered.
  int32 failed_attempts = 1;
}

// The vendor call is being retried.
message FooterStatusActivityRetrying {
  // Which attempt is next: 2 for the first retry, counting up.
  int32 attempt = 1;
  // The retry's status summary, verbatim.
  string status = 2;
  // When the vendor said the next attempt starts, so the line counts down to
  // it and shows an attempt that is overdue. Unset when the vendor stated no
  // schedule.
  optional FooterStatusActivityAt next_attempt = 3;
  // The last attempt the vendor will make before it gives up. Unset when the
  // vendor stated no schedule.
  optional int32 max_attempt = 4;
}

// An auth prompt is up.
message FooterStatusActivityAuthenticating {
  // The auth prompt line, verbatim.
  string line = 1;
}

// The session reports it is parked on the user (requires_action) — a fact
// the daemon cannot otherwise see, so a permission count alone
// under-reports it.
message FooterStatusActivityBlockedOnUser {
  // The vendor's detail, verbatim.
  string detail = 1;
}

// The close-blocked reasons line.
message FooterStatusActivityCloseBlocked {
  // The composed reasons, drawn verbatim.
  string text = 1;
}

// The agent's push notification.
message FooterStatusActivityNotification {
  // The agent's message, drawn verbatim.
  string text = 1;
}

// ---- The transient tier ------------------------------------------------------
// Events that give the reader continual feedback that the session is doing
// something. A transient ends when a newer one replaces it or its expiry
// instant passes; it never stands on a condition.

// The activity cell when no salient line stands, under EVERY status: the
// newest transient drawn over the enduring line,
// with the choice between them made by the client's clock against the
// transient's expiry.
//
// THE CLIENT DRAWS `transient` WHILE ITS CLOCK IS BEFORE
// `transient.expiry.expires_at_ms`, AND `enduring` OTHERWISE. That comparison
// is the ONLY decision the client takes in this cell, and it is a clock tick
// against a shipped instant, the same convention the turn clock follows. The
// daemon runs no expiry timer and pushes nothing when a transient lapses, so
// there is no race between a lapse and a newer event: the newer event is
// simply the next push.
message FooterActivityTransientOverEnduring {
  // The newest transient. UNSET when none has been raised since the daemon
  // began resolving this workspace. The daemon MAY omit a transient whose
  // expiry has already passed when it composes the view; carrying one is
  // harmless, because the client's clock check draws the enduring line.
  optional FooterActivityTransient transient = 1;
  // The line beneath every transient. ALWAYS SET, so the cell always has
  // something to draw once a transient lapses.
  FooterActivityEnduring enduring = 2;
}

// One transient line: an event, when it happened, when it stops being drawn,
// and whose work it came from.
message FooterActivityTransient {
  // When the event happened; the client may tick the relative age.
  FooterStatusActivityAt at = 1;
  // When the line stops being drawn.
  FooterActivityTransientExpiry expiry = 2;
  // WHICH AGENT's work raised the event. UNSET for the main agent; SET for a
  // subagent, so a foreground subagent's work keeps the cell moving without
  // being mistaken for the main agent's.
  optional FooterActivityTransientAgent agent = 3;
  // Tags 4 and 5 (the streamed reasoning and response tails) and 11 and 12
  // (the push notification and the context-budget warning) are RETIRED: the
  // tails are the feed's to draw, and the notification stands on a
  // condition, so it is a salient kind. The budget warning draws no footer
  // line at all (owner ruling, 2026-10-06).
  reserved 4, 5, 11, 12;
  // Tags 6 (`tool_call`, a tool call started) and 8 (`submitting`, a prompt's
  // delivery moved) are RETIRED (owner ruling, 2026-10-06): the substatus
  // cell already states the step (`executing`, `submitting`), so the
  // activity line repeating it added nothing.
  reserved 6, 8;
  reserved "tool_call", "submitting";
  // What happened. Exactly one is set; a transient with none is malformed.
  oneof kind {
    // The task tracker moved.
    FooterActivityTransientTask task = 7;
    // A hook started running.
    FooterActivityTransientHook hook = 9;
    // A context item was injected (memory, skills).
    FooterActivityTransientContextInjected context_injected = 10;
    // A NON-ESCALATING daemon fault opened: the session is serving, so the
    // fault is announced rather than pinned. See THE FAULT PARTITION above.
    // An escalating fault is never this arm; it is its status arm's salient
    // `fault`.
    FooterStatusActivityFault fault = 13;
    // The daemon recorded a WARNING about this workspace.
    FooterActivityTransientDaemonWarning daemon_warning = 14;
    // The daemon recorded an ERROR about this workspace that does not block
    // the turn or the user.
    FooterActivityTransientDaemonError daemon_error = 15;
    // A session setting changed (model, permission mode, an MCP server).
    FooterActivityTransientSessionChange session_change = 16;
    // A deploy finished for this workspace.
    FooterActivityTransientUpdated updated = 17;
    // A background subagent's wait for the API opened or ended. The
    // transient's `agent` names the subagent. The STANDING wait is the agents
    // chip's glyph and the agents panel's row, never a salient line: a
    // background agent's wait blocks neither the turn nor the user.
    FooterActivityTransientNetworkResume network_resume = 18;
    // A compaction CONCLUDED and the session resumed. Announced, never
    // pinned: the compaction no longer blocks the turn once it is done. A
    // compaction that FAILED raises no footer line at all: it is the feed's
    // outcome marker alone (owner ruling, 2026-10-06).
    FooterActivityTransientCompactionConcluded compaction_concluded = 19;
    // The API answered again after failed attempts: the retrying line ended
    // because a response landed.
    FooterActivityTransientApiRestored api_restored = 20;
  }
}

// A compaction concluded.
message FooterActivityTransientCompactionConcluded {
  // The daemon's composed outcome line ("compacted and resumed (101.6k →
  // 12.4k)"), drawn verbatim.
  string text = 1;
}

// A background subagent's wait for the API opened or ended.
message FooterActivityTransientNetworkResume {
  // WHICH EDGE of the wait this is. Exactly one is set.
  oneof edge {
    // The wait opened: the vendor ended the agent's run because the API was
    // unreachable, and the shim will resume it when the API answers.
    FooterActivityTransientNetworkResumeWaiting waiting = 1;
    // The API answered and the agent was resumed.
    FooterActivityTransientNetworkResumeResumed resumed = 2;
    // The shim gave up waiting; the agent keeps its failure.
    FooterActivityTransientNetworkResumeGaveUp gave_up = 3;
    // The shim stood down while the agent waited; the agent keeps its
    // failure.
    FooterActivityTransientNetworkResumeAbandoned abandoned = 4;
  }
}
// The wait opened.
message FooterActivityTransientNetworkResumeWaiting {
  // When the shim gives up waiting, epoch ms; the client may draw the
  // remaining time ("resuming when the API is back · gives up in 30m").
  int64 gives_up_at_ms = 1;
}
// The agent was resumed.
message FooterActivityTransientNetworkResumeResumed {}
// The shim gave up waiting.
message FooterActivityTransientNetworkResumeGaveUp {}
// The shim stood down while the agent waited.
message FooterActivityTransientNetworkResumeAbandoned {
  // Why the shim stood down, verbatim from the shim.
  string reason = 1;
}

// When a transient line stops being drawn.
message FooterActivityTransientExpiry {
  // Epoch ms, on the daemon's clock. The daemon and the client run on the
  // same host, so the client compares it to its own clock directly. The
  // daemon sets it to the event instant plus its transient window (10 s by
  // default); a newer transient replaces the line before then.
  int64 expires_at_ms = 1;
}

// The subagent whose work raised a transient.
message FooterActivityTransientAgent {
  // The subagent's label as the agents panel names it (its description),
  // drawn as a prefix to the line.
  string label = 1;
}

// The task tracker moved.
message FooterActivityTransientTask {
  // The subject of the task that moved, verbatim.
  string subject = 1;
  // How many of the tracker's tasks are complete after the move.
  uint32 completed = 2;
  // How many tasks the tracker holds after the move.
  uint32 total = 3;
}

// A hook started running.
message FooterActivityTransientHook {
  // The hook's name.
  string name = 1;
}

// A context item was injected.
message FooterActivityTransientContextInjected {
  // The specific item taken on, composed by the daemon ("webapp/CLAUDE.md",
  // "graphify", "3 skills from ~/.claude/skills"). Drawn verbatim.
  string text = 1;
}

// A daemon warning about this workspace.
message FooterActivityTransientDaemonWarning {
  // The operation the daemon's record names, verbatim from its log.
  string operation = 1;
  // The record's message, verbatim from its log.
  string message = 2;
}

// A daemon error about this workspace that blocks neither the turn nor the
// user. An error that does block is a fault, raised through the fault
// record, never this arm.
message FooterActivityTransientDaemonError {
  // The operation the daemon's record names, verbatim from its log.
  string operation = 1;
  // The record's message, verbatim from its log.
  string message = 2;
}

// A session setting changed.
message FooterActivityTransientSessionChange {
  // The daemon's composed line ("model → opus", "permission mode → plan",
  // "mcp github connected"). Drawn verbatim.
  string text = 1;
}

// A deploy finished for this workspace, announced by the successor daemon.
message FooterActivityTransientUpdated {
  // What the deploy left for later on THIS workspace. Empty when nothing was
  // deferred.
  repeated FooterStatusActivityUpdateNote notes = 1;
}

// ---- The enduring tier -------------------------------------------------------
// Facts that are always true, drawn whenever nothing salient stands and no
// transient is live.

// The enduring line: the account's usage. It is ENDURING, always true while
// it stands, so it carries no age: when it was drawn says nothing a reader
// needs.
//
// THE USAGE IS THE ACCOUNT'S, NOT THE WORKSPACE'S (owner ruling, 2026-10-06).
// Every workspace whose session spends from one account root (its Claude
// config dir) draws that account's newest figures the moment any of them
// learns them, and the daemon keeps the last figures per account durably, so
// a restarted daemon draws them before any session has spoken.
//
// THE LINE IS CHOSEN BY THE ACCOUNT'S BILLING MODE (owner ruling,
// 2026-10-06), never by which account it is: a subscription draws its
// allowance windows, a per-seat account its month's spend; never both.
//
// THE LINE IS NEVER EMPTY (owner ruling, 2026-10-06): every arm draws words.
//
// The client draws the line it is given and decides nothing.
message FooterActivityEnduring {
  // What is known about the account's usage. Exactly one is set.
  oneof line {
    // A subscription's usage allowances.
    FooterActivityEnduringUsage usage = 1;
    // No account-usage figure has ever been observed for this account.
    // Drawn "usage not yet seen for this account".
    FooterActivityEnduringUnobserved unobserved = 3;
    // A per-seat account's spend this month against its allotment. Drawn
    // "$223.88 of $12,000 this month".
    FooterActivityEnduringSeatSpend seat_spend = 5;
  }
  // Tag 2 (`context_window`, the main agent's context fill) is RETIRED: the
  // enduring line is the account's usage alone.
  reserved 2;
  reserved "context_window";
  // Tag 4 (`no_allowance`, "no session or weekly allowance on this
  // account") is RETIRED: an account billed by spend draws its spend
  // (`seat_spend`), owner ruling 2026-10-06.
  reserved 4;
  reserved "no_allowance";
}
// No usage figure has ever been observed for the account.
message FooterActivityEnduringUnobserved {}

// A per-seat account's month-to-date spend against the seat's monthly
// allotment. The vendor states no billing-period reset, so none is drawn.
message FooterActivityEnduringSeatSpend {
  // The seat's monthly allotment.
  FooterMoney allotment = 1;
  // What has been spent this month, in the allotment's currency. UNSET
  // while the vendor has reported no spend figure; drawn "spend not yet seen
  // of $12,000 this month".
  optional FooterMoney spent = 2;
  // spent / allotment, 0..1 (above 1 when the allotment is overrun). SET
  // EXACTLY WHEN `spent` IS. The drawn spend wears the same percent gradient
  // as the subscription line's percentages, driven by this figure.
  optional double utilization = 3;
}

// An amount of money for the footer to draw.
message FooterMoney {
  // The amount in minor units of the currency (cents for USD).
  int64 amount_minor = 1;
  // The ISO 4217 currency code (e.g. "USD").
  string currency = 2;
}

// The account's usage allowances. The vendor bills independent allowances
// (rolling five-hour session, seven-day weekly, and an overage window beyond
// them); every figure it reports is shown, WHETHER OR NOT any is near its
// limit, so the reader always knows how close the account is.
message FooterActivityEnduringUsage {
  // The rolling five-hour session allowance. UNSET until a figure for it has
  // been observed.
  optional FooterAllowance session = 1;
  // The seven-day weekly allowance. UNSET when the account has no weekly
  // allowance or none has been reported; a figure nobody reported is never
  // drawn.
  optional FooterAllowance weekly = 2;
  // What the newest account-usage SAMPLE managed to read. UNSET means no
  // sample has been observed and the figures came from a rate-limit event
  // alone.
  //
  // The figures are the last ones READ; this states whether the last
  // ATTEMPT read anything. Without it a sample that failed is
  // indistinguishable from one that never happened, and the strip draws an
  // old percentage as though it were current. It is carried ALONGSIDE the
  // figures and never instead of them: an unreadable sample leaves the
  // figures on hand standing, and this cell is what lets the client say the
  // figures are stale.
  optional FooterAllowanceSample sample = 3;
  // The overage allowance — the window the vendor bills BEYOND the two
  // above, reported through the same rate-limit event. UNSET until the
  // vendor has reported the overage window, which most accounts never do.
  optional FooterAllowance overage = 4;
  // Tag 5 (`figures_read_at_ms`, the reading's age) is RETIRED: the enduring
  // line carries no age.
  reserved 5;
  reserved "figures_read_at_ms";
}

// The newest account-usage sample's outcome, BY NAME. THE ARM IS WHETHER A
// FIGURE WAS READ, mirroring conversation.v1 SessionAccountUsage's own
// outcome oneof arm for arm, so no consumer has to reconstruct the reason
// from an absence.
message FooterAllowanceSample {
  oneof outcome {
    // A figure was read; the allowances are as fresh as this sample.
    FooterAllowanceSampleAvailable available = 1;
    // The usage service did not answer.
    FooterAllowanceSampleServiceUnavailable service_unavailable = 2;
    // The service answered without a five-hour window.
    FooterAllowanceSampleWindowUnavailable window_unavailable = 3;
    // The window carried no utilization figure.
    FooterAllowanceSampleUtilizationUnavailable utilization_unavailable = 4;
    // The shim's own sampling failed; it states the cause.
    FooterAllowanceSampleSamplingFailure sampling_failure = 5;
  }
}
// A figure was read.
message FooterAllowanceSampleAvailable {}
// The usage service did not answer.
message FooterAllowanceSampleServiceUnavailable {}
// The service answered without a five-hour window.
message FooterAllowanceSampleWindowUnavailable {}
// The window carried no utilization figure.
message FooterAllowanceSampleUtilizationUnavailable {}
// The shim's own sampling failed.
message FooterAllowanceSampleSamplingFailure {
  // The cause, verbatim from the shim. Empty when it stated none.
  string cause = 1;
}

// One usage allowance: how much of it is used, when it resets, and the
// vendor's verdict on it.
message FooterAllowance {
  // TRUE when the utilization has reached the daemon's newsworthy threshold
  // (80% by default). The client colors a newsworthy allowance as a warning;
  // an allowance that is not newsworthy is still drawn.
  bool newsworthy = 1;
  // When the allowance resets, epoch SECONDS, the vendor event's own unit.
  //
  // A FIGURE IS TRUE ONLY UNTIL ITS RESET. The figures are the last ones
  // READ (they may have been read before a daemon restart), so once the
  // client's clock passes this instant the utilization above describes a
  // window that no longer exists: the client draws the allowance as
  // "<label> reset since last seen", with NO percentage, until a newer figure
  // arrives. The daemon ships the instant and pushes nothing when it passes
  // (the transient expiry's rule).
  int64 resets_at_s = 2;
  // How much of the allowance is used, 0..1.
  double utilization = 3;
  // Tag 4 (status, verbatim string) is RETIRED: the vocabulary is now in
  // evidence (SessionRateLimitStatus), so the arm is typed.
  // The vendor's VERDICT, copied from SessionRateLimitStatus.status for this
  // window. UNSET IS LEGAL: no rate-limit event has been observed for the
  // window yet — the figures above (from the sampled account usage) draw
  // without a verdict class, and the arm joins when the vendor speaks.
  oneof status {
    // The vendor allows requests against this allowance.
    FooterAllowanceAllowed allowed = 5;
    // The vendor allows requests and warns the allowance is nearly spent.
    FooterAllowanceAllowedWarning allowed_warning = 6;
    // The vendor refuses requests against this allowance.
    FooterAllowanceRejected rejected = 7;
  }
}
// The vendor allows requests.
message FooterAllowanceAllowed {}
// The vendor allows requests and warns.
message FooterAllowanceAllowedWarning {}
// The vendor refuses requests.
message FooterAllowanceRejected {}

// ---- 4. Clock ------------------------------------------------------------

// The turn clock. UNSET = no turn in flight; the cell renders idle.
message FooterClock {
  optional int64 turn_started_at_ms = 1;
}

// ---- 5. Tokens cell -------------------------------------------------------

// The strip's tokens cell. Deliberately ONE figure: the in-flight turn's
// FRESH INPUT for the MAIN AGENT — with its heat, the alarm and the accounting
// verdict reduced to glyphs. Everything else (the per-agent spend, subagents
// and detached agents included, the cache figures, first-token latency, alarm
// detail, verdict evidence) is FooterExpandedTokens' content, reached by
// clicking this cell. The figure moves while the turn runs; a new turn starts
// it again from zero.
//
// FRESH INPUT is every input token that was NOT a cache hit: the vendor's
// `input_tokens` plus `cache_creation_input_tokens`, i.e. the
// `conversation.v1.TokenCacheMisses` of each API response (written plus
// unwritten), summed over the main agent's API responses of the turn. Cache
// READS are excluded: they are cheap context reuse. Cache WRITES are
// included: they are the expensive part of a turn, so a cold cache that
// re-writes the whole prefix shows up here as a large figure — which is the
// point of the cell. Output tokens are excluded: a response's output is sent
// back as input on the next request, where it is counted once as fresh.
//
// THE MAIN AGENT ONLY. Subagent and detached-agent spend is NOT in it; each
// subagent's own fresh input is its bubble's figure (FeedSubagentTokens).
//
// IT IS THE SUM OF THE TURN'S RESPONSE-BUBBLE STAMPS. Each intermediate
// response bubble freezes the fresh input added since the previous one landed
// (FeedResponseUsageStamp), so the bubbles of a turn partition this figure,
// and the turn's final-answer bubble carries this figure's final value.
//
// NOT THE CONTEXT WINDOW. The topbar's context chip is the window's size;
// this cell is spend. With a warm cache the cell stays below the chip; a
// cold cache can push it above, because re-written context counts as fresh
// without growing the window.
//
// WITH NO TURN IN FLIGHT the figure is `--`, stated by the daemon, and the
// cell stays a click target: the panel still opens, on the most recent
// turn's breakdown. The glyphs keep their own lifetimes (below).
message FooterTokensCell {
  // The figure, daemon-formatted ("18.2k in") from the fresh input described
  // above, or "--" with no turn in flight, with its heat. The client draws the
  // text verbatim — no arithmetic, no unit rounding, no idle inference of its
  // own.
  FooterTokensCellInput input = 1;
  // The expensive-turn alarm glyph (⚠). PRESENT iff the alarm tripped this
  // turn; presence IS the glyph, and the composed sentence is the panel's
  // alarm line. Kept until the next turn starts. The alarm keys on the
  // WHOLE turn's spend — the uncached input summed across every agent in the
  // panel's accounting — never on the context growth, because a cold cache
  // re-bills the whole prefix without growing the context at all.
  optional FooterTokensCellAlarm alarm = 2;
  // The accounting verdict badge. UNSET while the turn runs (no verdict
  // yet); set once the settled turn is reconciled.
  optional FooterTokensCellVerdict verdict = 3;
}

// The cell's figure. Wrapped so the cell's one number is its own element and
// a later prop (a tone, a tooltip) lands here without touching the cell.
message FooterTokensCellInput {
  // The formatted figure, exactly as drawn ("18.2k in", or "--" with no turn
  // in flight).
  string text = 1;
  // How hot the figure is, which colors it. UNSET with no turn in flight
  // (the `--` figure is drawn uncolored).
  optional TokenHeat heat = 2;
}

// The tripped-alarm glyph. Empty on purpose: being set is the whole fact —
// "this turn crossed the cost threshold" — and the evidence is the panel's
// alarm line, never a second copy here.
message FooterTokensCellAlarm {}

// The accounting badge. The set arm picks the glyph treatment; the evidence
// behind it is the panel's verdict line, never this badge.
message FooterTokensCellVerdict {
  // Which verdict the settled turn's reconciliation reached. Exactly one arm
  // is set; the arms are mutually exclusive readings of one reconciliation.
  oneof verdict {
    // Every response's usage was observed and the sums reconcile (✓).
    FooterTokensCellVerdictComplete complete = 1;
    // Some responses carried no usage, so the figures are a floor (✗).
    FooterTokensCellVerdictIncomplete incomplete = 2;
    // The observed usage contradicts itself (✗) — a producer defect.
    FooterTokensCellVerdictInvalid invalid = 3;
  }
}
// Reconciliation succeeded. Empty: the arm is the whole fact.
message FooterTokensCellVerdictComplete {}
// Usage is missing for part of the turn. Empty here — the missing-evidence
// prose is the panel line's.
message FooterTokensCellVerdictIncomplete {}
// Usage is self-contradictory. Empty here — the problem list is the panel
// line's.
message FooterTokensCellVerdictInvalid {}

// ---- 6. Live-work chips ----------------------------------------------------

// The live-work chips. An UNSET chip is NOT DRAWN — nothing of that kind
// exists right now — so a quiet workspace shows no chips at all. A set chip
// carries its count, daemon-resolved: the client never counts panel rows to
// label a chip, even though the rows arrive in the same push (duplicate,
// don't share). Detached UNMODELED work has no chip: its surfacing home is
// the topbar's warning dropdown.
message FooterLiveWorkChips {
  // ⚙ — agent-spawned subagents with work ahead of them (the ones with feed
  // bubbles): live, or waiting for the API to be resumed. Set iff the agents
  // panel holds at least one row.
  optional FooterChipAgents agents = 1;
  // ☑ — the task tracker's progress. Set iff the tracker is non-empty; a
  // task chip is about the LIST existing, not about anything running.
  optional FooterChipTasks tasks = 2;
  // $ — live detached shells. Set iff at least one is running.
  optional FooterChipShells shells = 3;
  // 👁 — live background monitors. Set iff at least one is live.
  optional FooterChipMonitors monitors = 4;
  // ⏱ — live scheduled jobs (cron/wakeup schedules). Set iff at least one
  // job is scheduled.
  optional FooterChipCrons crons = 5;
  // Tag 6 (`merge_tests`, the 🧪 chip) is RETIRED: a merge has no
  // expanded-footer panel, so it has no chip to open one. The merge bubble's
  // tests tab carries the test gate's suites.
  reserved 6;
  reserved "merge_tests";
}
// The crons chip's props.
message FooterChipCrons {
  // How many rows the scheduled-jobs panel holds. At least 1 when this chip
  // is set (a zero-count chip is expressed by leaving the chip unset).
  uint32 count = 1;
}
// The monitors chip's props.
message FooterChipMonitors {
  // How many monitor rows the monitors panel holds. At least 1 when this
  // chip is set (a zero-count chip is expressed by leaving the chip unset).
  uint32 count = 1;
}
// The agents chip's props.
message FooterChipAgents {
  // How many agent rows the agents panel holds, rows waiting for the API
  // included. At least 1 when this chip is set (a zero-count chip is
  // expressed by leaving the chip unset).
  uint32 count = 1;
  // The waiting-for-the-API glyph, drawn beside the count. SET iff at least
  // one agents-panel row is waiting for the API, so an outage stalling
  // background work is visible on the strip for as long as it lasts without
  // opening the panel.
  optional FooterChipAgentsWaitingForApi waiting_for_api = 2;
}
// The agents chip's waiting-for-the-API glyph.
message FooterChipAgentsWaitingForApi {
  // How many of the panel's rows are waiting for the API. At least 1 when
  // the glyph is set.
  uint32 count = 1;
}
// The tasks chip's props, drawn as "☑ 3/7". A progress fraction, both
// figures always drawn — NOT a completeness pair: neither count qualifies
// the other, so no oneof factoring applies.
message FooterChipTasks {
  // How many tracker tasks are completed.
  uint32 done = 1;
  // How many tracker tasks exist in total. At least 1 when the chip is set.
  uint32 total = 2;
}
// The shells chip's props.
message FooterChipShells {
  // How many detached shells are live. At least 1 when the chip is set.
  uint32 count = 1;
}

// ==========================================================================
// THE EXPANDED SECTION
// ==========================================================================

// One panel per selectable strip element. ALL panels arrive populated on
// every push; the webview-local selection picks which one is drawn. A panel
// whose subject is empty (no live shells, say) still arrives — as an empty
// row list — because its chip is then unset and nothing can select it.
message FooterExpanded {
  // The turn's token breakdown — the tokens cell's expansion.
  FooterExpandedTokens tokens = 1;
  // The live agent-spawned subagents — the ⚙ chip's expansion.
  FooterExpandedAgents agents = 2;
  // The task tracker's checklist — the ☑ chip's expansion.
  FooterExpandedTasks tasks = 3;
  // The live detached shells — the $ chip's expansion.
  FooterExpandedShells shells = 4;
  // The live background monitors — the 👁 chip's expansion.
  FooterExpandedMonitors monitors = 5;
  // The scheduled jobs — the ⏱ chip's expansion.
  FooterExpandedCrons crons = 6;
  // Tag 7 (`merge_tests`, the merge tests panel) is RETIRED: a merge draws
  // nothing in the expanded footer. Its test gate's suites are the merge
  // bubble's tests tab, and the strip's merging status, substatus and
  // activity line are unchanged.
  reserved 7;
  reserved "merge_tests";
}

// ---- The daemon's focus ----------------------------------------------------

// The panel the expanded section is opened on when DETACHED WORK STARTS.
//
// THE DAEMON DECIDES IT, the webapp draws it (no business logic in the
// webapp). Each time a unit of detached work starts — a subagent, a detached
// shell, a monitor — the daemon picks the HIGHEST-PRIORITY kind that is live
// right now, AGENTS then SHELLS then MONITORS, and publishes it here with a new
// `generation`. So a subagent launched while a shell runs focuses agents; a
// shell launched while no subagent is live focuses shells; a monitor launched
// while neither is live focuses monitors; and a shell launched while a
// subagent is live re-focuses agents.
//
// AN EDGE, NOT A LEVEL. A client applies a focus ONCE, when it sees a
// `generation` it has not applied: it opens the expanded section (if closed)
// and selects the named panel. Between focuses the user's own chip clicks
// stand — collapsing the section or picking another panel is theirs until the
// next launch. A client that attaches later applies the standing focus once,
// as it would any unapplied generation.
//
// Nothing here closes the section: when the detached work ends, the panel's
// chip goes unset exactly as before, and the existing rules for an emptied
// panel apply.
message FooterExpandedFocus {
  // THE ARM IS THE PANEL.
  oneof panel {
    FooterFocusAgents agents = 1;
    FooterFocusShells shells = 2;
    FooterFocusMonitors monitors = 3;
  }
  // Tag 5 (`merge_tests`) is RETIRED with the merge tests panel: a merge
  // never opens the expanded footer.
  reserved 5;
  reserved "merge_tests";
  // Strictly increasing per workspace, minted by the daemon at each launch
  // that sets a focus. Starts at 1. A client compares for equality with the
  // last generation it applied; it never does arithmetic on it.
  uint64 generation = 4;
}
// The agents panel (the ⚙ chip's expansion) is the focus.
message FooterFocusAgents {}
// The shells panel (the $ chip's expansion) is the focus.
message FooterFocusShells {}
// The monitors panel (the 👁 chip's expansion) is the focus.
message FooterFocusMonitors {}

// ---- The scheduled-jobs panel ----------------------------------------------

// The ⏱ panel: one row per live scheduled job. A TRUE LIST, like the agents
// panel. NOT jump targets: jobs have no feed bubble.
message FooterExpandedCrons {
  // The rows, in the daemon's order. Empty when nothing is scheduled — the
  // chip is then unset and the panel unreachable.
  repeated FooterCronRow rows = 1;
}

// One job's line: ⏱ · schedule · prompt · countdown · markers.
message FooterCronRow {
  // The human schedule ("every 5 min"), vendor-composed, drawn verbatim.
  FooterCronRowSchedule schedule = 1;
  // The job's prompt, daemon-truncated for width (the shell-row precedent —
  // what arrives is what is drawn).
  FooterCronRowPrompt prompt = 2;
  // The next fire. The DAEMON resolves the instant from the job's cron
  // expression; the client derives and ticks the remaining duration
  // ("5m 12s") per the clock convention — an instant is shipped, a duration
  // is drawn. UNSET when the daemon could not resolve one; the row then
  // draws the schedule alone.
  optional FooterCronRowNextFire next_fire = 3;
  // The recurring marker. Present iff the job repeats.
  optional FooterCronRowRecurring recurring = 4;
  // The durable marker. Present iff the job survives the session — worth
  // distinguishing, since everything else in this footer dies with it.
  optional FooterCronRowDurable durable = 5;
}
// The schedule element.
message FooterCronRowSchedule {
  // The line, drawn verbatim.
  string text = 1;
}
// The prompt element.
message FooterCronRowPrompt {
  // The prompt text, drawn verbatim.
  string text = 1;
}
// The countdown element.
message FooterCronRowNextFire {
  // When the job fires, epoch ms; the client ticks the countdown from it.
  int64 fire_at_ms = 1;
}
// The recurring marker. Empty: presence is the fact.
message FooterCronRowRecurring {}
// The durable marker. Empty: presence is the fact.
message FooterCronRowDurable {}

// ---- The monitors panel ----------------------------------------------------

// The 👁 panel: one row per live monitor.
message FooterExpandedMonitors {
  // The rows, in the daemon's order. Empty when nothing is live — the chip
  // is then unset and the panel unreachable.
  repeated FooterMonitorRow rows = 1;
}

// One live monitor's line: 👁 · description · (persistent) · clock · ▸. A
// monitor's feed entry is its Monitor call's tool-call card, drawn in its
// owner's feed at the call's position (owner ruling, 2026-09-23), so its jump
// names that card exactly as a shell row's names its head.
message FooterMonitorRow {
  // What is being watched, drawn verbatim (the agent's description).
  FooterMonitorRowDescription description = 1;
  // The runtime clock; the client ticks from the start instant.
  FooterMonitorRowRuntime runtime = 2;
  // Present iff the watch is persistent; draws the "persistent" marker.
  optional FooterMonitorRowPersistent persistent = 3;
  // Which work this row is. NOT DRAWN in the footer; see FooterWorkId.
  FooterWorkId work = 4;
  // Where a click on the row lands. See FooterJump.
  FooterJump jump = 5;
}
// The row's description element.
message FooterMonitorRowDescription {
  // The text, drawn verbatim.
  string text = 1;
}
// The row's clock element.
message FooterMonitorRowRuntime {
  // When the watch was armed; the client ticks the duration from it.
  int64 started_at_ms = 1;
}
// The persistent marker element. Empty: presence is the marker.
message FooterMonitorRowPersistent {}

// ---- The tokens panel ------------------------------------------------------

// The TURN's token accounting (distinct from the topbar's SESSION breakdown
// — a different fact and a different component), one line per figure, name
// dim and value bright. NOT a list: these are heterogeneous facts, so each
// line is its own dedicated field. Every line message is ALWAYS SET so the
// panel's shape is stable while the turn runs; a line whose figure is not
// yet known carries no value and draws its name with an empty slot. Values
// are daemon-formatted strings — the client does no arithmetic and no unit
// rounding.
//
// THREE FACTS, ONE PANEL:
// - context_growth — the strip cell's figure, the main agent's context
//   growth this turn;
// - agents — the per-agent spend, the main agent and every subagent or
//   detached agent that reported usage, each with its own lines;
// - input … thinking — the SUM of that spend across every agent.
// WITH NO TURN IN FLIGHT the panel still arrives, holding the most recent
// turn's breakdown plus the live usage of every detached agent still
// running, so background spend stays visible here while the cell reads `--`.
// A detached agent still running when a turn opens is carried into the new
// turn's accounting; one that has ended leaves it.
message FooterExpandedTokens {
  // "input (uncached)" — input_misses (written + unwritten) summed across
  // every agent in `agents`.
  FooterTokensLineInput input = 1;
  // "input (cache read)" — input tokens served from cache.
  FooterTokensLineCacheRead cache_read = 2;
  // "input (cache write)" — input tokens written to cache this turn.
  FooterTokensLineCacheWrite cache_write = 3;
  // "output" — all output tokens, thinking included.
  FooterTokensLineOutput output = 4;
  // "thinking" — the output subclass, drawn indented under output. A
  // consumer must NOT add it to output: it is already inside it.
  FooterTokensLineThinking thinking = 5;
  // "first token" — latency to the current response's first token. A
  // duration, not a token count; same line layout, different unit.
  FooterTokensLineFirstToken first_token = 6;
  // The alarm's detail line. PRESENT iff the alarm tripped (mirrors the
  // cell's glyph); carries the composed sentence.
  optional FooterTokensLineAlarm alarm = 7;
  // The verdict's detail line. UNSET while the turn runs (mirrors the
  // cell's badge); set once reconciled.
  optional FooterTokensLineVerdict verdict = 8;
  // "context growth" — the main agent's context growth: the SAME resolved
  // value the strip's cell shows while a turn runs, and the most recent
  // turn's growth once it has ended.
  FooterTokensLineContextGrowth context_growth = 9;
  // One entry per agent that reported usage in this accounting, the MAIN
  // agent first and then every subagent or detached agent in the order its
  // usage first arrived. A TRUE LIST: every entry is the same kind of thing.
  // Empty until any usage is known. The sum across it is lines 1–5.
  repeated FooterTokensAgent agents = 10;
}

// The context-growth line.
message FooterTokensLineContextGrowth {
  // The formatted growth ("18.2k"). UNSET = no context reading has arrived
  // since a turn opened; the line still draws, with an empty slot.
  optional string value = 1;
  // PRESENT iff a context cut re-took the baseline during the turn, so the
  // figure is the growth SINCE THE CUT rather than since the turn opened.
  // Empty: presence is the whole fact.
  optional FooterTokensLineContextGrowthSinceCut since_cut = 2;
}
// The since-a-cut marker. Empty: presence is the whole fact.
message FooterTokensLineContextGrowthSinceCut {}

// One agent's share of the accounting: its daemon-composed name, then the
// same four figure lines the panel's sum carries, for this agent alone.
// Every line is SET: an agent is listed only once it has reported usage.
message FooterTokensAgent {
  // The agent's name, daemon-composed and drawn verbatim: "main" for the
  // main agent, the subagent type (and its description) for any other.
  string label = 1;
  // input_misses (written + unwritten) — this agent's uncached input.
  FooterTokensLineInput input = 2;
  // input_hits.read — what the prompt cache served this agent.
  FooterTokensLineCacheRead cache_read = 3;
  // input_misses.written — what this agent wrote into the cache.
  FooterTokensLineCacheWrite cache_write = 4;
  // Every output token this agent generated, thinking included.
  FooterTokensLineOutput output = 5;
}

// The uncached-input line.
message FooterTokensLineInput {
  // The formatted figure ("18.2k"). UNSET = figure not yet known this turn;
  // the line still draws, with an empty slot.
  optional string value = 1;
}
// The cache-read line.
message FooterTokensLineCacheRead {
  // The formatted figure. UNSET = draw the empty slot.
  optional string value = 1;
}
// The cache-write line.
message FooterTokensLineCacheWrite {
  // The formatted figure. UNSET = draw the empty slot.
  optional string value = 1;
}
// The output line.
message FooterTokensLineOutput {
  // The formatted figure. UNSET = draw the empty slot.
  optional string value = 1;
}
// The thinking line (output subclass; drawn indented).
message FooterTokensLineThinking {
  // The formatted figure. UNSET = draw the empty slot.
  optional string value = 1;
}
// The first-token latency line.
message FooterTokensLineFirstToken {
  // The formatted duration ("412ms"). UNSET until the current response's
  // first token lands; held afterwards for the rest of the turn.
  optional string value = 1;
}
// The tripped alarm's line. Exists only while the cell's glyph does.
message FooterTokensLineAlarm {
  // The daemon-composed sentence ("expensive turn — 41k over 20k"). Drawn
  // verbatim.
  string text = 1;
}
// The verdict's line. The set arm picks the treatment; the text is the
// composed evidence the badge alone could not carry.
message FooterTokensLineVerdict {
  // Which verdict the reconciliation reached — always the same arm as the
  // cell's badge, with the evidence attached where an arm has any.
  oneof verdict {
    // Reconciled cleanly. No evidence to show; the line draws its ✓ alone.
    FooterTokensLineVerdictComplete complete = 1;
    // Figures are a floor; the text says what is missing.
    FooterTokensLineVerdictIncomplete incomplete = 2;
    // Figures contradict; the text names the problems.
    FooterTokensLineVerdictInvalid invalid = 3;
  }
}
// The clean-reconciliation line. Empty: the arm is the whole fact.
message FooterTokensLineVerdictComplete {}
// The floor verdict's evidence.
message FooterTokensLineVerdictIncomplete {
  // Daemon-composed ("2 responses missing usage"). Drawn verbatim.
  string text = 1;
}
// The contradiction verdict's evidence.
message FooterTokensLineVerdictInvalid {
  // Daemon-composed problem summary. Drawn verbatim.
  string text = 1;
}

// ---- The agents panel ------------------------------------------------------

// The live agent-spawned subagents — the subagents that ALSO have feed
// bubbles. One row per live subagent; each row is a jump row (`FooterJump`). Rows leave the list when the subagent's run ends. A TRUE LIST:
// every row is the same kind of thing.
message FooterExpandedAgents {
  // The rows, in the daemon's order (spawn order): every live subagent and
  // every subagent waiting for the API. Empty when there are none — the chip
  // is then unset and the panel unreachable.
  repeated FooterAgentRow rows = 1;
}

// One live subagent's line: glyph · type · description · tokens · clock · ▸.
message FooterAgentRow {
  // Tag 1 (`FeedId target`) is RETIRED: a bare target could not say that the
  // daemon did not know the entry, and a row whose click reached nothing then
  // did nothing at all. `jump` states it either way.
  reserved 1;
  reserved "target";
  // The subagent type ("Explore") — the row's leading label.
  FooterAgentRowLabel label = 2;
  // The commission's description. UNSET when the spawn carried none; the
  // row then draws the label alone, never a synthesized description.
  optional FooterAgentRowDescription description = 3;
  // The subagent's running token sum, daemon-formatted.
  FooterAgentRowTokens tokens = 4;
  // The row's clock. The client ticks from the instant.
  FooterAgentRowRuntime runtime = 5;
  // Which work this row is. NOT DRAWN in the footer; see FooterWorkId.
  FooterWorkId work = 6;
  // Where a click on the row lands. See FooterJump.
  FooterJump jump = 7;
  // WHAT THE AGENT IS DOING. Exactly one is set; a row with none is
  // malformed. A row waiting for the API stays in the panel although its
  // failed run has ended, because the shim will resume it: the panel lists
  // the agents that still have work ahead of them, and the row leaves only
  // when the wait ends.
  oneof state {
    // The agent's run is live.
    FooterAgentRowRunning running = 8;
    // The vendor ended the agent's run because the API was unreachable, and
    // the shim is waiting to resume it once the API answers again.
    FooterAgentRowWaitingForApi waiting_for_api = 9;
  }
}
// The agent's run is live; the row's clock and tokens are moving.
message FooterAgentRowRunning {}
// The agent is waiting for the API, drawn as "waiting for the API · gives up
// in 24m".
message FooterAgentRowWaitingForApi {
  // When the network failure that opened the wait was reported, epoch ms;
  // the client may tick how long the agent has waited.
  int64 failed_at_ms = 1;
  // When the shim gives up waiting, epoch ms; the client ticks the remaining
  // time from it. It moves later only when a resumed run made progress before
  // failing again. Past it the agent keeps its failure and the row leaves.
  int64 gives_up_at_ms = 2;
  // How many resumes the shim has already delivered for this agent. Zero on
  // the first wait; a positive figure says the outage outlasted a resume.
  uint32 resumes_delivered = 3;
}
// The row's type label.
message FooterAgentRowLabel {
  // The label text, drawn verbatim ("Explore").
  string text = 1;
}
// The row's description element.
message FooterAgentRowDescription {
  // The description, drawn verbatim (the spawn's short commission).
  string text = 1;
}
// The row's token element.
message FooterAgentRowTokens {
  // The formatted running sum ("12.4k"; the panel's "tokens" column header names the unit). Re-pushed as it grows.
  string text = 1;
}
// The row's clock element. Carries only the start instant: the client draws
// its own ticking elapsed time, so the clock never jumps to push cadence.
message FooterAgentRowRuntime {
  // When the subagent's run began, epoch ms. The ORIGINAL instant — it does
  // not reset if the work re-announces on another stream.
  int64 started_at_ms = 1;
}

// ---- The tasks panel -------------------------------------------------------

// The task tracker's checklist — the CURRENT list, resolved by the daemon,
// so no consumer replays tracker acts to learn what the tasks are. One row
// per task, in the tracker's order; done and open tasks alike stay listed
// (the chip's fraction is this list's summary).
message FooterExpandedTasks {
  // The rows, in the daemon's order. Empty when the tracker is empty — the
  // chip is then unset and the panel unreachable.
  repeated FooterTaskRow rows = 1;
}

// One task's line: status glyph · subject · (active form while running).
message FooterTaskRow {
  // Tag 1 is RETIRED: tracker tasks have no feed bubble, so the row is not a
  // jump target (unlike the agent and shell rows).
  // The glyph element; the set arm picks the treatment.
  FooterTaskRowStatus status = 2;
  // The task's subject line, drawn verbatim.
  FooterTaskRowSubject subject = 3;
}
// The row's subject element.
message FooterTaskRowSubject {
  // The subject text, drawn verbatim.
  string text = 1;
}
// The row's status element. The DRAWN PROJECTION of the tracker's status —
// the arm picks the glyph, so a bool checkbox (which would collapse
// running, failed, killed and paused into "unchecked") is unrepresentable.
message FooterTaskRowStatus {
  // The tracker status, projected to what the checklist draws distinctly.
  oneof status {
    // ☐ — not started.
    FooterTaskRowPending pending = 1;
    // Spinner — in progress, with the in-progress phrasing when given.
    FooterTaskRowRunning running = 2;
    // ☑ — done. Tags 4-6 are RETIRED: the tracker's vocabulary carries no
    // process states, so the checklist draws none.
    FooterTaskRowCompleted completed = 3;
  }
}
// Not started. Empty: the arm is the whole fact.
message FooterTaskRowPending {}
// In progress.
message FooterTaskRowRunning {
  // The in-progress phrasing ("Running the migration…"). UNSET when the
  // agent gave none; the row then draws the subject alone.
  optional FooterTaskRowActiveForm active_form = 1;
}
// The running row's phrasing element.
message FooterTaskRowActiveForm {
  // The phrasing, drawn verbatim in place of the subject while running.
  string text = 1;
}
// Done. Empty: the arm is the whole fact.
message FooterTaskRowCompleted {}

// ---- The shells panel ------------------------------------------------------

// The live detached shells. One row per running background command; each
// row is a jump row (`FooterJump`) to the shell's feed bubble. No token element — a shell has no
// token cost. A TRUE LIST, like the agents panel.
message FooterExpandedShells {
  // One row per live shell, in the daemon's order. Empty when none.
  repeated FooterShellRow rows = 1;
}

// One live shell's line: $ · command · clock · ▸.
message FooterShellRow {
  // Tag 1 (`FeedId target`) is RETIRED for the reason FooterAgentRow's is.
  reserved 1;
  reserved "target";
  // The command line being run.
  FooterShellRowCommand command = 2;
  // The row's clock. The client ticks from the instant.
  FooterShellRowRuntime runtime = 3;
  // Which work this row is. NOT DRAWN in the footer; see FooterWorkId.
  FooterWorkId work = 4;
  // Where a click on the row lands. See FooterJump.
  FooterJump jump = 5;
}

// ---- The detached-work rows' identity and jump ------------------------------

// WHICH WORK A ROW IS: the run's `conversation.v1.DetachedWorkId` value — the
// same string the daemon keys it by and the feed bubble's head draws
// (`FeedDetachedWorkId`). For an IN-TURN subagent, which is not detached work
// yet, it is the spawn unit's `AgentActivityId` value: the contract makes the
// two one value (`DetachedWorkId.value == AgentActivityId.value`), so the row
// keeps this identity if the spawn detaches.
//
// NOT DRAWN (owner ruling, 2026-09-23: no visual change to the footer). The
// client carries it only into the record a click writes, and as the key its
// per-row click outcome is held under across whole-view pushes.
message FooterWorkId {
  // The id, exactly as the daemon holds it. Never parsed.
  string value = 1;
}

// WHERE A CLICK ON A DETACHED-WORK ROW LANDS, stated by the daemon for every
// row (owner ruling, 2026-09-23). EXACTLY ONE ARM, so a row whose click
// reaches nothing and says nothing is unrepresentable:
//
//   entry        the feed entry that draws this work is KNOWN: the client
//                selects that entry and scrolls to it (the scroll module's
//                `detachedWorkSelected` cause). If the client then cannot
//                bring it onto the page, it says so at the row — never silence.
//   unresolved   the daemon does NOT know the entry, and says why: the client
//                shows the "not on screen" notice at the row and records the
//                reason, with the row's work id, kind and this arm.
//
// An UNSET arm is malformed.
message FooterJump {
  oneof target {
    // The entry's FeedId, exactly as the feed served it — ON THE FEED THAT
    // DRAWS IT, which for a subagent of a subagent is its parent's sub-feed,
    // not the root. Echoed into navigation, never parsed.
    FeedId entry = 1;
    // The daemon cannot name the entry.
    FooterJumpUnresolved unresolved = 2;
  }
}
// Why the daemon cannot name a row's feed entry. THE ARM IS THE REASON.
message FooterJumpUnresolved {
  oneof reason {
    // The feed has drawn no entry for this work (yet): no placement for its
    // unit has reached the footer. Resolves on its own the moment the feed
    // draws it.
    FooterJumpNotDrawn not_drawn = 1;
    // Tag 2 is RETIRED: `no_feed_entry` said a kind drew no feed entry at
    // all, and only a monitor did. A monitor's entry is now its tool-call
    // card (owner ruling, 2026-09-23), so every detached-work kind draws one.
  }
  reserved 2;
  reserved "no_feed_entry";
}
// The entry is not drawn. Empty: the arm is the whole fact.
message FooterJumpNotDrawn {}
// The row's command element.
message FooterShellRowCommand {
  // The command text, drawn verbatim (the daemon may truncate for width —
  // what arrives is what is drawn).
  string text = 1;
}
// The row's clock element.
message FooterShellRowRuntime {
  // When the command began, epoch ms. The ORIGINAL instant — detaching from
  // the turn does not reset it.
  int64 started_at_ms = 1;
}

// ---- Network fault ----

// This machine cannot reach the network.
message FooterStatusNetworkFault {
  // What about the network is wrong.
  oneof substatus {
    // No route to the network at all: offline.
    FooterSubStatusNetworkFaultOffline offline = 1;
  }
  // The activity cell. ALWAYS SET.
  FooterStatusNetworkFaultActivity activity = 2;
}
// The machine is offline.
message FooterSubStatusNetworkFaultOffline {}
// The activity cell while the network is down: the salient line, or the
// transient over the enduring line.
message FooterStatusNetworkFaultActivity {
  // WHICH TIER the daemon resolved. Exactly one is set.
  oneof tier {
    // A line that explains the fault stands.
    FooterStatusNetworkFaultSalient salient = 1;
    // Nothing salient stands.
    FooterActivityTransientOverEnduring unpinned = 2;
  }
}
// The salient kinds legal while the network is down. The offline line ranks
// first because it explains the step.
message FooterStatusNetworkFaultSalient {
  // When this line began standing; the client ticks the relative age.
  FooterStatusActivityAt at = 1;
  // The one salient line.
  oneof kind {
    // WHAT is unreachable, as the shim observed it, drawn verbatim
    // ("cannot reach api.anthropic.com: no route to host").
    FooterStatusActivityNetworkOffline offline = 2;
    // A DEPLOY'S PROGRESS. STATUS-INDEPENDENT.
    FooterStatusActivityUpdate update = 3;
    // THE AGENT'S PUSH NOTIFICATION. STATUS-INDEPENDENT.
    FooterStatusActivityNotification notification = 4;
  }
  // Tag 5 (`context_budget`) is RETIRED: no footer line warns that the
  // context is nearly full (owner ruling, 2026-10-06). A failed compaction
  // is the feed's outcome marker alone.
  reserved 5;
  reserved "context_budget";
}
// The offline line, composed by the daemon from the shim's observation.
message FooterStatusActivityNetworkOffline {
  // Drawn verbatim. Never empty.
  string text = 1;
}
