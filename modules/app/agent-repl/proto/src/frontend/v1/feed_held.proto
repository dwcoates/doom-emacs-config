// feed_held.proto — THE HELD SECTION: the part of a workspace's ROOT feed
// that holds what has not yet settled into the conversation's history — a
// prompt the daemon is holding for delivery. It is drawn at the root feed's tail, after every row, with no
// heading and no divider, so a held item reads exactly as the feed's newest
// row does.
//
//   … settled rows, in order-key order …
//   ┌ merge bubble ─────────────────────────────────────────┐   FeedRowOrder.pinned
//   │ ● merging ABC/fix-flaky-test → master          3m 12s │   (a row, not held)
//   └───────────────────────────────────────────────────────┘
//   "also fix the footer"        ⏳ held · merge running       FeedHeldItem.prompt
//
// A RUNNING MERGE IS NOT HELD. Its bubble is a row of the feed pinned below
// every settled row (FeedRowOrder.pinned), updated in place while it runs.
//
// HELD, THEN SETTLED. A prompt that settles — the daemon accepts it for
// delivery — leaves this section and becomes an ordinary row of the feed,
// keyed at the moment it settles: the bottom. Its row carries
// the SAME FeedId its held item carried, so a client keeps one element across
// the move, and the move reaches the client as ONE change (the root feed's
// held-section frame carries the section and the rows that settled out of it
// together), so no client ever draws an item in both places or in neither.
//
// The section rides the ROOT feed's own connection — OpenFeed's answer for the
// root feed and WatchFeed's held-section frames — and no sub-feed has one.
//
// NOT here: gates. A hibernated session REFUSES input, it holds nothing —
// that is the footer's and the refusal arms'. A merge HOLDS what is submitted
// while it runs (the prompt's `merge` hold arm). A context cut makes the
// running turn uninterruptible — that is a classification below, not a hold.
//
// EVERY MESSAGE HERE IS FRONTEND SURFACE, not shim wire. A held prompt is an
// artifact of the DAEMON's decision to hold it back, and its actions (force,
// cancel, answer) are agentrepl.v1 requests whose MECHANISM (Interrupt
// then SubmitPrompt) is what actually crosses the shim UDS.

syntax = "proto3";

package frontend.v1;

import "conversation/v1/slash_command.proto";
import "conversation/v1/turn.proto";
import "conversation/v1/user.proto";
import "frontend/v1/feed.proto";

option go_package = "agentrepl/proto/frontend/v1;frontendv1";

// The held section of one workspace's root feed, resolved by the daemon and
// carried WHOLE on every change. An empty items list is a meaningful value —
// the daemon is holding nothing for the user — not an absent one.
message FeedHeld {
  // The held items, in display order: the held prompts in queue order, then
  // the ingress prompts the queue has not yet accepted, oldest first. The
  // prompt that settles first sits nearest the settled rows.
  repeated FeedHeldItem items = 1;
}

// One held item: its identity, and what it is.
message FeedHeldItem {
  // The item's identity, and the reconciliation key a client keeps its element
  // under. For a prompt it is the FeedId its prompt row will carry once it
  // settles, so the settled row and the held item are one element to the
  // client. Opaque and daemon-minted, like every FeedId.
  FeedId id = 1;
  // What is held. THE ARM IS THE KIND, so a consumer routes on the arm rather
  // than on anything inside it.
  oneof item {
    // A prompt the daemon is holding for delivery.
    HeldPrompt prompt = 3;
    // A prompt waiting in the held-prompt ingress that the daemon has read
    // and not yet accepted into its queue.
    HeldIngressPrompt ingress = 5;
  }
  // Tag 2 and the name `merge` are RETIRED: a running merge's bubble is the
  // row pinned to the feed's bottom (FeedRowOrder.pinned), never held. Tag 4
  // and the name `offer` are RETIRED: the one offer there was, the merge
  // dequeue question an interrupt raises, is drawn inside the merge bubble
  // it is about (frontend.v1.FeedMerge.queue_offer).
  reserved 2, 4;
  reserved "merge", "offer";
}

// A prompt the daemon is holding for delivery.
//
// A prompt submitted while the session's turn is already running is NOT
// forwarded. The daemon holds it, asks a classifier whether it is the sort of
// thing the agent should hear NOW rather than after the turn, and either
// interjects it (interrupt, then submit once the turn has actually ended) or
// leaves it to be delivered FIFO when the turn ends on its own.
message HeldPrompt {
  // The turn this prompt will run as — DAEMON-MINTED, the one identity a
  // force or cancel names, and the same TurnId the submission's
  // response returned. There is no second, daemon-internal entry id.
  conversation.v1.TurnId turn = 1;
  // What the user said, WHOLE — the very payload the daemon will forward, and
  // what an edit or a drop hands back to the composer. A UserSaid that carries
  // images (or anything UserContent grows) is held intact. The card DRAWS
  // `body`, never this.
  conversation.v1.UserSaid said = 2;
  // What the card draws: `said` resolved by the daemon exactly as the prompt's
  // feed row will be (frontend.v1.FeedUserPromptBody) -- sentinel spans
  // stripped, each image a source the webview loads, a reply's quote taken
  // apart -- so the held card shows what will land in the feed, drawn the way
  // the feed draws it.
  FeedUserPromptBody body = 26;
  // When it was queued.
  HeldPromptQueuedAt queued_at = 3;
  // What the classifier decided about ORDER. THE ARM IS THE VERDICT. Never
  // unset on a wire entry: an entry with no arm here is a malformed frame and
  // is rejected loudly rather than rendered as pending. Each verdict's own
  // facts — a rationale — live on the arm that owns them, so a rationale
  // cannot arrive with no verdict to explain.
  oneof classification {
    // A classifier is still deciding. Expect this arm to be replaced by one of
    // the verdicts below. Set ONLY while a classifier call is in flight; an
    // entry nothing is classifying is `awaiting_delivery` or `daemon_held`.
    HeldPromptClassifying classifying = 4;
    // The verdict is that this prompt should interrupt the running turn rather
    // than wait for it.
    HeldPromptInterject interject = 5;
    // The verdict is that this prompt waits for the running turn to end.
    HeldPromptHoldForTurnEnd hold_for_turn_end = 6;
    // The verdict is that this prompt adds to the running turn's work: it is
    // sent at once to join that turn after its current tool call, with no
    // interrupt, and settles the moment the session takes it.
    HeldPromptAfterToolCall after_tool_call = 17;
    // No classifier ran and none will: the turn in front of this entry is a
    // context cut, which is never interrupted. Delivery is the ordinary
    // turn-end drain's, so this arm changes WHO decided rather than WHEN the
    // prompt runs.
    HeldPromptUninterruptibleTurn uninterruptible_turn = 7;
    // The classifier itself failed, so no verdict exists. The prompt is still
    // held and still deliverable; what is missing is the advice, not the
    // prompt.
    //
    // NO PRODUCER. The daemon no longer emits this arm: every failure on the
    // way to a verdict (a running turn with no open record, a failed
    // classifier call, a refused interrupt) resolves to the prompt's true
    // state, hold_for_turn_end, and is logged by the daemon. A frontend still
    // draws it, because removing error coverage needs the owner's sign-off;
    // seeing it means a producer has regressed.
    HeldPromptClassificationError classification_error = 8;
    // NOTHING CLASSIFIED THIS ENTRY AND NOTHING WILL: the daemon condition
    // the `hold` arm names is what holds it, and the classifier never runs on
    // an entry a daemon condition holds. Set exactly when a hold arm is set
    // and no verdict was reached before the hold was stamped, so a held card
    // never claims a decision is being made when none is.
    HeldPromptDaemonHeld daemon_held = 19;
    // NOTHING IS CLASSIFYING THIS ENTRY AND NO DAEMON CONDITION HOLDS IT: it
    // waits its place in the queue, and the next drain -- a turn's end, the
    // session coming up -- delivers it in order. Set when no verdict was
    // recorded and no classifier is running, so a held card never claims a
    // decision is being made when none is: `classifying` is drawn ONLY while
    // a classifier call is in flight (owner, 2026-10-10).
    HeldPromptAwaitingDelivery awaiting_delivery = 23;
  }
  // WHAT is holding this entry, when something other than a running turn is.
  //
  // An entry is held by at most one thing at a time: a drain lease, a
  // pending reconnect, a standing cold gate, a cold gate already answered, a
  // build refresh and a merge are mutually exclusive
  // session conditions, and an entry held by two of them at once
  // would have two different sets of exits and two different states to
  // render. Stating them as arms makes that impossible to express rather than
  // merely unlikely. No arm set means the entry is held by the ordinary case
  // — a turn is running — and the classifier decides when it is delivered.
  //
  // THESE SIX ARE THE WHOLE SET, and they are entry-scoped.
  oneof hold {
    // The daemon is draining toward a scheduled shutdown and is not admitting
    // new work.
    HeldPromptShutdownHold shutdown = 9;
    // The workspace's shim DIED and is being relaunched, or the vendor
    // refuses the session mid-session, and the prompt waits for it to
    // reconnect or for the vendor to serve again ("after reconnect").
    HeldPromptReconnectHold reconnect = 11;
    // The workspace's shim is LOADING (owner ruling, 2026-10-28): a prompt, a
    // keep-alive, a cold gate's answer, a boot or a restart is bringing it
    // up, and the prompt is sent once it is ("after loading"). A shim that
    // died is `reconnect` instead.
    HeldPromptLoadingHold loading = 27;
    // The session's build is being refreshed onto a newer one before it takes
    // more work.
    HeldPromptBuildRefreshHold build_refresh = 12;
    // A merge of this workspace is in flight and drives its session.
    HeldPromptMergeHold merge = 20;
    // The workspace's session is parked at its cold gate, and the prompt
    // waits for the user's answer to the gate.
    HeldPromptColdGateHold cold_gate = 24;
    // The workspace's cold gate was answered with pay or compact, and the
    // prompt waits for the user to send it: no answer but compact-and-resume
    // sends a prompt held at the gate.
    HeldPromptColdGateAnsweredHold cold_gate_answered = 25;
  }
  // Tag 10 and the name `keep_alive` are RETIRED and must not be revived. A
  // cache keep-alive is the shim's own mechanism: a real prompt that arrives
  // while one runs waits INSIDE the shim, so the daemon never holds a prompt
  // behind one and never learns that one ran.
  reserved 10;
  reserved "keep_alive";
  // Tag 14 and the name `badges` are RETIRED: a card shows one badge
  // (`badge`), never a list.
  reserved 14;
  reserved "badges";
  // PRESENT WHILE THIS PROMPT IS BEING EDITED (EditHeldPrompt.begin), absent
  // otherwise. Daemon-stated: the card draws its editing badge off this
  // field alone. While it stands, this prompt and every prompt queued after
  // it stay held.
  HeldPromptEditing editing = 13;
  // THE CARD'S ONE STATUS BADGE, DAEMON-COMPOSED. A held card shows exactly
  // one badge, whatever stands: the strongest standing fact claims it, in
  // this order —
  //
  //   1. the edit, while `editing` is present (the user is acting on the
  //      prompt now);
  //   2. the hold arm, while one is set (it decides whether the prompt can
  //      move at all);
  //   3. the classification arm (when the prompt runs relative to the turn in
  //      front of it). `daemon_held` never claims it: that arm is set only
  //      beside a hold arm, which outranks it.
  //
  // Every other standing fact — a fact that lost the badge, the verdict's
  // confirmation, a coalescence — is said in `notes` instead. ALWAYS SET: an
  // entry with no badge is a malformed frame and is rejected loudly.
  HeldPromptBadge badge = 21;
  // THE STANDING FACTS THE BADGE DOES NOT SHOW, each one sentence, drawn
  // verbatim in the card's expand-only details in this order: the facts
  // ranked below the badge's, strongest first, then the verdict's
  // confirmation, then the coalescence. Empty when the badge is the only
  // standing fact.
  repeated HeldPromptStatusNote notes = 22;
  // PRESENT WHEN LATER PROMPTS WERE FOLDED INTO THIS ONE while it was still
  // queued: a prompt the classifier ruled should interrupt a prompt that had
  // not started yet is merged into it rather than queued behind it, and a
  // prompt the user folded into it with its "fold above" button
  // (FoldHeldPrompt) is merged the same way. `said` already carries the
  // merged text; this says the merge happened.
  HeldPromptCoalesced coalesced = 15;
  // PRESENT WHEN THIS ENTRY IS A SESSION ACT rather than a prompt: a model or
  // permission-mode change queued in order with the prompts around it, never
  // classified, applied when what is ahead of it ends. `said` is what the act
  // is shown as; this is what it does. A context cut is not here: /compact and
  // /clear are prompts whose text is the command.
  HeldSessionAct act = 16;
  // THE CARD'S "fold above" BUTTON. PRESENT EXACTLY WHEN this entry can be
  // folded into the entry directly ahead of it (FoldHeldPrompt), absent
  // otherwise. Daemon-decided: the card draws the button off this field alone
  // and derives nothing from the entries around it.
  //
  // It is present only when ALL of these hold: this entry is a prompt (not a
  // session act); an entry stands directly ahead of it in the queue (so never
  // on the first entry); that entry is a prompt too (never a model or
  // permission-mode change, /compact or /clear); and neither of the two is
  // being edited. The running turn is never "ahead" here: a turn that has
  // started is joined by the classifier's after_tool_call verdict, not folded.
  optional HeldPromptFoldAbove fold_above = 18;
}

// The "fold above" button: folds this prompt into the entry directly ahead of
// it, so the two are delivered together as that one entry.
message HeldPromptFoldAbove {
  // The entry directly ahead of this one, as the daemon resolved this section.
  // A TYPED ECHO TOKEN: the click sends it back verbatim as
  // FoldHeldPromptRequest.above, and the daemon refuses the fold when it is
  // no longer the entry directly ahead, so a prompt is only ever folded into
  // the entry the user saw above it.
  conversation.v1.TurnId above = 1;
}

// Later prompts were folded into this one while it was queued. DELIBERATELY
// EMPTY: the field's presence is the whole fact.
message HeldPromptCoalesced {}

// A session act held in the queue. THE ARM IS THE ACT.
message HeldSessionAct {
  oneof act {
    // The session's model changes to this one.
    HeldSessionActModel model = 1;
    // The session's permission mode changes to this one.
    HeldSessionActPermissionMode permission_mode = 2;
  }
}

// A model change.
message HeldSessionActModel {
  // The model the session changes to, as the served catalog names it.
  string model = 1;
}

// A permission-mode change.
message HeldSessionActPermissionMode {
  // The permission mode the session changes to, as the vendor names it.
  string mode = 1;
}

// The one status badge on a held prompt's card, composed daemon-side.
message HeldPromptBadge {
  // The badge's words: a short label of one to three words ("after this
  // turn", "restart hold"), drawn verbatim. REQUIRED AND NEVER EMPTY: an empty
  // label is a malformed frame, rejected rather than drawn as a blank badge.
  string label = 1;
  // The status said in full ("held for the scheduled restart (s-1)"), drawn
  // verbatim in the card's expand-only details. Absent when the full sentence
  // would only repeat the label.
  optional string detail = 2;
  // WHICH STANDING FACT THE BADGE SHOWS. A frontend keys the badge's color by
  // this arm and never by the words, and never re-ranks the entry's facts to
  // find it: the ranking is the daemon's, stated once on HeldPrompt.badge.
  // ALWAYS SET; an unset arm is a malformed frame.
  oneof stands_for {
    // The classifier is still deciding.
    HeldPromptBadgeClassifying classifying = 3;
    // The verdict: the prompt interrupts the running turn.
    HeldPromptBadgeInterject interject = 4;
    // The verdict: the prompt joins the running turn after its tool call.
    HeldPromptBadgeAfterToolCall after_tool_call = 5;
    // The verdict: the prompt waits for the running turn to end.
    HeldPromptBadgeHoldForTurnEnd hold_for_turn_end = 6;
    // The prompt waits behind a context cut, which is never interrupted.
    HeldPromptBadgeUninterruptibleTurn uninterruptible_turn = 7;
    // The classifier failed and no verdict exists.
    HeldPromptBadgeClassificationError classification_error = 8;
    // The prompt is being edited in the editor's input.
    HeldPromptBadgeEditing editing = 9;
    // Held for the daemon's scheduled shutdown.
    HeldPromptBadgeShutdown shutdown = 10;
    // Held while the session's build is refreshed.
    HeldPromptBadgeBuildRefresh build_refresh = 11;
    // Held until the session reconnects or the vendor serves again.
    HeldPromptBadgeReconnect reconnect = 12;
    // Held until the session finishes loading.
    HeldPromptBadgeLoading loading = 17;
    // Held while a merge of the workspace drives its session.
    HeldPromptBadgeMerge merge = 13;
    // Held until the user answers the session's cold gate.
    HeldPromptBadgeColdGate cold_gate = 14;
    // Waits its place in the queue; nothing is classifying it.
    HeldPromptBadgeAwaitingDelivery awaiting_delivery = 15;
    // Held after the cold gate's answer, until the user sends it.
    HeldPromptBadgeColdGateAnswered cold_gate_answered = 16;
  }
}
// The badge shows the classifier still deciding.
message HeldPromptBadgeClassifying {}
// The badge shows the interject verdict.
message HeldPromptBadgeInterject {}
// The badge shows the after-tool-call verdict.
message HeldPromptBadgeAfterToolCall {}
// The badge shows the hold-for-turn-end verdict.
message HeldPromptBadgeHoldForTurnEnd {}
// The badge shows the wait behind a context cut.
message HeldPromptBadgeUninterruptibleTurn {}
// The badge shows the classifier's failure.
message HeldPromptBadgeClassificationError {}
// The badge shows the edit in progress.
message HeldPromptBadgeEditing {}
// The badge shows the shutdown hold.
message HeldPromptBadgeShutdown {}
// The badge shows the build-refresh hold.
message HeldPromptBadgeBuildRefresh {}
// The badge shows the reconnect hold.
message HeldPromptBadgeReconnect {}
// The badge shows the loading hold.
message HeldPromptBadgeLoading {}
// The badge shows the merge hold.
message HeldPromptBadgeMerge {}
// The badge shows the cold-gate hold.
message HeldPromptBadgeColdGate {}
// The badge shows an entry waiting its place in the queue, unclassified.
message HeldPromptBadgeAwaitingDelivery {}
// The badge shows the hold that keeps a prompt after the cold gate's answer.
message HeldPromptBadgeColdGateAnswered {}
// One standing fact the card's badge does not show, said in full.
message HeldPromptStatusNote {
  // The fact as one sentence ("held until the merge ends"), drawn verbatim
  // in the card's expand-only details. REQUIRED AND NEVER EMPTY.
  string sentence = 1;
}
// The prompt is being edited in the editor's input. DELIBERATELY EMPTY: the
// field's presence is the whole fact.
message HeldPromptEditing {}

// When a held prompt was queued.
message HeldPromptQueuedAt {
  // Epoch milliseconds.
  int64 at_ms = 1;
}

// The classifier is still running: the entry is queued and undecided.
message HeldPromptClassifying {}

// Deliver NOW: interrupt the running turn and submit once it has ended.
message HeldPromptInterject {
  // The classifier's stated reason. Free text for display; never parsed.
  string rationale = 1;
}

// Deliver NOW into the running turn, which takes it after its current tool
// call; nothing is interrupted.
message HeldPromptAfterToolCall {
  // The classifier's stated reason. Free text for display; never parsed.
  string rationale = 1;
}

// Deliver when the turn ends on its own; do not interrupt for it.
message HeldPromptHoldForTurnEnd {
  // The classifier's stated reason. Free text for display; never parsed.
  string rationale = 1;
  // Tag 2 and the name `accepted` are RETIRED: a hold carries no
  // confirmation, because confirming one changed nothing about delivery.
  reserved 2;
  reserved "accepted";
}

// NOTHING CLASSIFIED THIS ENTRY, because the turn in front of it is a CONTEXT
// CUT — `/compact` or `/clear` — and a context cut is never interrupted for a
// queued prompt.
//
// It is a verdict rather than a `hold` arm because the entry is NOT held by
// anything other than the running turn: it is delivered by the ordinary
// turn-end drain, in order, exactly as a hold-for-turn-end verdict is. What it
// does not have is a classifier behind it. A compaction reads the whole
// conversation and a clear discards it; interrupting either one spends that
// cost for nothing and leaves the context in the state the cut was supposed
// to change, so there is no question left for a model to answer.
//
// THERE IS NO FORCE-THROUGH. A force is refused on one of these for the reason
// the revival hold refuses it: the force's mechanism is an
// interrupt, and the interrupt is precisely what must not happen. A user who
// genuinely wants the cut stopped still has the interrupt command itself.
message HeldPromptUninterruptibleTurn {
  // Which cut is running, so the card can name it. Never UNSPECIFIED: the arm
  // is set only when the daemon recognized the running prompt as one of the
  // two, and an arm that could not say which would explain nothing.
  conversation.v1.SessionCommand command = 1;
}

// The classifier could not be believed (it answered with neither token, or
// both). Surfaced as its own arm rather than silently defaulted to one of the
// real verdicts: a frontend must be able to see that nothing decided this.
// Delivery falls back to the ordinary turn-end drain, so an unclassifiable
// prompt is delayed, never dropped.
message HeldPromptClassificationError {
  // The failure detail. Free text for display; never parsed.
  string detail = 1;
}

// Held by a scheduled shutdown's drain lease. The classifier NEVER runs on
// such an entry: the only exits are the user's explicit force (deliver now,
// further delaying the bounce), cancel, or delivery after the bounce
// completes. Held entries are durable and survive the daemon swap, so such a
// prompt is delayed, never lost.
message HeldPromptShutdownHold {
  // The schedule holding this entry, joining the entry to the shutdown
  // schedule it should explain.
  string schedule_id = 1;
}

// `HeldPromptKeepAliveHold` is RETIRED with the `keep_alive` arm above, and
// its name must not be reused for a new message.

// Held because the workspace's session is NOT UP and the prompt waits for it to
// reconnect: a revival or cold resume in progress, a compaction the user chose
// at the cold gate still landing, a vendor start being retried, or a session
// whose start failed outright and waits for the user's restart. The card's
// badge reads "after reconnect". A session parked at a STANDING cold gate is
// not this arm but `cold_gate` (HeldPromptColdGateHold): what it waits on is
// the user's answer, not the machinery.
//
// ALSO A SESSION THAT IS UP BUT REFUSED MID-SESSION (owner, 2026-10-06): while
// the vendor refuses the session (usage limit, auth, billing, vendor error, an
// API retry), a prompt is held here at once, unclassified, and nothing reaches
// the vendor.
//
// A FAILED BRING-UP NEVER DROPS THESE ENTRIES. The exits are release the
// moment the vendor serves again or a session comes up on the workspace
// (however it comes up — a retry that succeeds, a restart, a revival), or the
// user's cancel. The classifier NEVER runs while an entry is held; it runs
// when the entry is RELEASED, against what is then ahead of it. There is NO
// force-through.
//
// A prompt that reaches a shim holding no session — the daemon believed the
// session was up and the shim answered `no_session` — lands here too, rather
// than being drawn and lost.
//
// DELIBERATELY EMPTY: the arm's presence is the whole fact it carries. The
// reconnect is a WORKSPACE-level event and the entry already rides its
// workspace's held section, so naming a session here would join the entry to nothing
// the client could not already reach.
message HeldPromptReconnectHold {}

// Held because the workspace's shim is loading: no session is up yet, and the
// prompt is sent once one is. DELIBERATELY EMPTY, as the reconnect hold is.
message HeldPromptLoadingHold {}

// Held because a merge of this workspace is in flight: the merge drives the
// session, so nothing the user submits reaches it until the merge ends. The
// classifier NEVER runs on such an entry and there is NO force-through. The
// exit is delivery once the merge ends, or cancel.
//
// A PROMPT HELD HERE KEEPS THE WORKSPACE OPEN: a merge that would close its
// requester once it lands leaves it open instead, so the prompt has a session
// to run in. DELIBERATELY EMPTY: the arm's presence is the whole fact.
message HeldPromptMergeHold {}

// No classifier ran and none will: a daemon condition holds the entry (the
// `hold` arm). DELIBERATELY EMPTY: the hold arm says what holds it.
message HeldPromptDaemonHeld {}

// Held because the workspace's session is PARKED AT ITS COLD GATE: the shim
// is up, no session is started on it, and the gate asks the user to pay,
// clear or compact before the cold conversation is re-read.
//
// A PROMPT NEVER ANSWERS THE GATE. Answering it spends the user's money, and
// only the gate's own answer (AnswerColdGate) may do that
// (REALTEST-JUDGEMENT-CALLS.md "The cold gate's feedback", call 11; owner
// ruling 2, 2026-09-13, re-affirmed 2026-10-10). A prompt that was already
// held when a revival parked at the gate waits here instead of being sent
// into a session that does not exist.
//
// THE ANSWER DECIDES THE ENTRY'S FATE, and only the compact-and-resume answer
// sends it:
//   - clear DISCARDS it the moment the daemon takes the answer;
//   - pay and compact KEEP it, moving it to `cold_gate_answered`, so it is
//     never sent until the user sends it;
//   - compact-and-resume leaves it here, and the compacted session coming up
//     (the same session-up edge that releases `reconnect`) delivers it.
// The user's cancel is the other exit. The classifier NEVER runs while an
// entry is held here, and there is NO force-through. DELIBERATELY EMPTY: the
// gate's own sentence is the feed's gate card and the footer's, never
// restated here.
message HeldPromptColdGateHold {}

// Held because the workspace's cold gate was ANSWERED WITH PAY OR COMPACT
// while this prompt waited at it. Those answers re-open the session and send
// nothing: when the held prompts go out is the user's call, never a side
// effect of paying for the cold read or of compacting.
//
// The exits are the user's release (send now), which delivers it as any
// release does once the session serves, and the user's cancel. Nothing else
// delivers it: not the session coming up, not a turn's end, not a later
// submission (a prompt submitted after it is neither queued behind it nor
// folded into it). While a cold gate stands again, the release is refused, and
// that gate counts this entry as held at it: its clear discards the entry and
// its compact-and-resume sends it. The classifier NEVER runs while an entry is
// held here. DELIBERATELY EMPTY: the arm's presence is the whole fact.
message HeldPromptColdGateAnsweredHold {}

// No classifier is running on this entry and no daemon condition holds it: it
// waits its place in the queue and is delivered in order by the next drain.
// DELIBERATELY EMPTY: the arm's presence is the whole fact.
message HeldPromptAwaitingDelivery {}

// Held because the session's shim is being restarted onto the current build
// at the turn boundary (automatic stale-shim refresh). The classifier never
// runs on such an entry; the exit is delivery the moment the restarted shim
// reports ready.
message HeldPromptBuildRefreshHold {}

// ---- Ingress prompt: a prompt written to the held-prompt ingress, read by
// the daemon and not yet accepted into its queue ----

// A prompt the editor wrote to the durable held-prompt ingress
// (`$AGENT_REPL_STATE_DIR/held-prompts/`) because no daemon answered its
// submission, which this daemon has read and not yet accepted into its
// queue.
//
// WHY IT IS DRAWN. A prompt in the ingress is the user's, taken and kept,
// but it is in no queue yet: without this card a prompt sent during an outage
// is drawn nowhere until it is accepted, and a person who sees nothing sends
// it again. While the daemon is down the page draws the editor's own list of
// these entries; once this daemon serves the root feed it is the one source,
// through this arm.
//
// ONE PROMPT, ONE PLACE. The item leaves the section in the SAME publication
// that draws the prompt as a held prompt (the `prompt` arm) or as a settled
// prompt row, so no reader sees it in both places or in neither. Its FeedId is
// the ingress entry's own (its idempotency key), not the prompt row's: the
// turn the prompt will run as does not exist until it is accepted.
//
// NO ACTIONS. Nothing can force, cancel, edit or fold an entry the queue has
// not accepted; the card draws the prompt and why it waits, and nothing else.
message HeldIngressPrompt {
  // What the user said, WHOLE: the very payload the daemon will submit once
  // the queue accepts it. The card DRAWS `body`, never this.
  conversation.v1.UserSaid said = 1;
  // What the card draws: `said` resolved exactly as the prompt's feed row will
  // be (frontend.v1.FeedUserPromptBody), so the card shows what will land,
  // drawn the way the feed draws it.
  FeedUserPromptBody body = 4;
  // When the editor wrote the entry.
  HeldIngressPromptQueuedAt queued_at = 2;
  // Why the entry still waits. ALWAYS SET: an entry with no badge is a
  // malformed frame and is rejected loudly.
  HeldIngressPromptBadge badge = 3;
}

// When an ingress entry was written, as the editor stamped it.
message HeldIngressPromptQueuedAt {
  // Epoch milliseconds.
  int64 at_ms = 1;
}

// The one status badge on an ingress prompt's card, composed daemon-side from
// what the daemon's last attempt to accept the entry met.
message HeldIngressPromptBadge {
  // The badge's words, one to three ("waiting for the session"), drawn
  // verbatim. REQUIRED AND NEVER EMPTY.
  string label = 1;
  // The reason said in full, drawn verbatim in the card's expand-only
  // details. Absent when the full sentence would only repeat the label.
  optional string detail = 2;
  // WHAT THE ENTRY WAITS ON. A frontend keys the badge's color by this arm
  // and never by the words. ALWAYS SET; an unset arm is a malformed frame.
  oneof stands_for {
    // Nothing refused the entry: it has not been offered to the queue yet,
    // waits behind an earlier entry of the same workspace, or waits for its
    // next attempt.
    HeldIngressPromptBadgeAwaitingIntake awaiting_intake = 3;
    // The queue refused it because the workspace has no session to submit to.
    HeldIngressPromptBadgeNoSession no_session = 4;
    // The queue refused it because a merge of the workspace is in flight.
    HeldIngressPromptBadgeMerge merge = 5;
    // The queue refused it because the session is parked at its cold gate.
    HeldIngressPromptBadgeColdGate cold_gate = 6;
    // The queue refused it because the workspace is moving to another daemon.
    HeldIngressPromptBadgeMovedAway moved_away = 7;
    // The queue refused it for a reason that is a fault, not a standing
    // condition; the daemon has logged it and keeps retrying.
    HeldIngressPromptBadgeRefused refused = 8;
  }
}
// The badge shows an entry not yet offered to the queue, or waiting its turn.
message HeldIngressPromptBadgeAwaitingIntake {}
// The badge shows the workspace has no session to take the entry.
message HeldIngressPromptBadgeNoSession {}
// The badge shows a merge of the workspace holds the entry back.
message HeldIngressPromptBadgeMerge {}
// The badge shows the session's cold gate holds the entry back.
message HeldIngressPromptBadgeColdGate {}
// The badge shows the workspace moving to another daemon holds it back.
message HeldIngressPromptBadgeMovedAway {}
// The badge shows the queue refused the entry by a fault.
message HeldIngressPromptBadgeRefused {}
