// sidebar_memory.proto — THE RAIL'S TWO MEMORY POPUPS, resolved by the daemon
// and drawn verbatim (owner request, 2026-10-29).
//
// THE VERSION'S POPUP says what agent-repl holds in memory taken as a whole,
// naming no workspace. A WORKSPACE ROW'S HOVER (Open section rows only) adds
// what that one workspace holds. Every figure is MEASURED: the daemon's
// process collector (procmetrics) samples each process's physical footprint,
// and a workspace's page is loaded exactly while Emacs's web view holds it, as
// Emacs reports it (agentrepl.v1 ReportPageState): visibility only makes a
// page eligible, so a visible workspace whose page is unloaded counts as not
// loaded. Each count is read from the one fact the matching metric reads
// (agentrepl_workspaces_visible, agentrepl_sessions_up,
// agentrepl_pages_loaded), so the popups and the metrics never disagree.
// Nothing here is estimated: the workspace pages share one WebKit web content
// process, which reports one footprint for all of them, so no per-page byte
// figure exists to draw and none is served.
//
// FETCHED WHILE OPEN, NOT PUSHED. The figures move every sample, so they ride no
// roster push (a whole-roster push per sample would redraw every row and
// decode in Emacs every two seconds); the page asks for them when the popup
// opens (agentrepl.v1 GetMemoryOverview, GetWorkspaceMemory) and again while it
// stays open.

syntax = "proto3";

package frontend.v1;

option go_package = "agentrepl/proto/frontend/v1;frontendv1";

// ---- The version's popup: agent-repl as a whole ----------------------------

// The version's popup: one line per element, top to bottom. Fields 1
// (`pages`) and 3 (`agents`) are RETIRED: their counts and footprints are the
// `workspaces` entry's lines.
message SidebarMemoryOverview {
  reserved 1, 3;
  reserved "pages", "agents";
  // The workspaces entry, drawn first, whose hover opens a child popup of its
  // three counts.
  SidebarMemoryWorkspaces workspaces = 6;
  // How hard the workspace-page process is struggling: its main-thread stalls
  // of late.
  SidebarMemoryStrain strain = 2;
  // Each other agent-repl process the daemon measures, in the daemon's drawn
  // order: the daemon, Emacs, the store, the sidecar. A process not running
  // is still listed, drawn as not running.
  repeated SidebarMemoryProcess processes = 4;
  // Every measured agent-repl process together.
  SidebarMemoryTotal total = 5;
}

// The workspaces entry and its child popup: how many workspaces the user can
// see, how many have a shim up, and how many have a page in the web view.
message SidebarMemoryWorkspaces {
  // The child popup's first line: the visible workspaces, out of the open
  // ones.
  SidebarMemoryWorkspacesVisible visible = 1;
  // Its second line: the workspaces with a shim up.
  SidebarMemoryWorkspacesShims shims = 2;
  // Its third line: the workspaces whose page the web view holds.
  SidebarMemoryWorkspacesPages pages = 3;
}

// The visible workspaces: those whose visibility is selected or
// unselected_visible (wsm.Workspace.Visibility), out of the open ones.
message SidebarMemoryWorkspacesVisible {
  // How many open workspaces are visible.
  uint32 visible = 1;
  // How many workspaces are open (not backlogged, not closed).
  uint32 open = 2;
}

// The workspaces with a shim up (not parked), the sessions
// agentrepl_sessions_up counts, whether or not they are visible.
message SidebarMemoryWorkspacesShims {
  // How many shims are up.
  uint32 up = 1;
  // Their physical footprints, their vendor children included, summed. UNSET
  // when the collector measured none.
  optional uint64 footprint_bytes = 2;
  // That sum over the shims measured, rounded down: resolved here so no
  // client divides. Set exactly when `footprint_bytes` is.
  optional uint64 average_bytes = 3;
}

// The workspaces whose page the web view holds now (agentrepl_pages_loaded),
// never the ones whose visibility only makes a page eligible.
message SidebarMemoryWorkspacesPages {
  // How many pages the web view holds.
  uint32 loaded = 1;
  // The physical footprint of the one WebKit web content process every page
  // shares, compressed and swapped memory included. UNSET when the collector
  // found no such process (no web view is open).
  optional uint64 footprint_bytes = 2;
}

// The page process's main-thread stalls in the daemon's stall window: the lag
// a switch can land in. A stall is the webhost's own report (webhost.stall).
message SidebarMemoryStrain {
  // Stalls reported within the window.
  uint32 stalls = 1;
  // Their blocked time, summed, in milliseconds.
  uint64 blocked_ms = 2;
  // The window they were counted over, in seconds (the stall detector's
  // window), so the line can say "in the last 10 min".
  uint32 window_seconds = 3;
}

// One other agent-repl process.
message SidebarMemoryProcess {
  // Which process, as the line names it ("daemon", "Emacs", "store",
  // "sidecar").
  string label = 1;
  // Its physical footprint. UNSET when it is not running, or the collector
  // has not measured it.
  optional uint64 footprint_bytes = 2;
}

// Every measured agent-repl process together: the pages' process, the shims
// and every listed process.
message SidebarMemoryTotal {
  // The sum of every footprint above.
  uint64 footprint_bytes = 1;
}

// ---- A workspace row's hover: what that workspace holds --------------------

// The memory lines a workspace row's hover adds.
message SidebarWorkspaceMemory {
  // The workspace's shim.
  SidebarWorkspaceMemoryAgent agent = 1;
  // The workspace's page, as Emacs's web view holds it (agentrepl.v1
  // ReportPageState). Always set.
  SidebarWorkspaceMemoryPage page = 2;
}

// The workspace's shim.
message SidebarWorkspaceMemoryAgent {
  // Whether it runs.
  oneof state {
    // It runs.
    SidebarWorkspaceMemoryAgentRunning running = 1;
    // It does not (stood down, never started, or at its cold gate).
    SidebarWorkspaceMemoryAgentNotRunning not_running = 2;
  }
}

// The shim runs.
message SidebarWorkspaceMemoryAgentRunning {
  // Its physical footprint, its vendor child included. UNSET until the
  // collector has measured it.
  optional uint64 footprint_bytes = 1;
}

// The shim does not run. Empty: presence is the fact.
message SidebarWorkspaceMemoryAgentNotRunning {}

// The workspace's page.
message SidebarWorkspaceMemoryPage {
  // Whether the web view holds the page. Visibility makes a page eligible;
  // Emacs loads it when the workspace is shown, its session comes up for
  // work, or its slot is made while it is wanted, and unloads it when its
  // session goes dormant off screen or it stops being visible.
  oneof state {
    // The web view holds it.
    SidebarWorkspaceMemoryPageLoaded loaded = 1;
    // The web view does not hold it, visible or not.
    SidebarWorkspaceMemoryPageNotLoaded not_loaded = 2;
  }
}

// The web view holds the page. Empty: presence is the fact. Field 1
// (`release`) is RETIRED.
message SidebarWorkspaceMemoryPageLoaded {
  reserved 1;
  reserved "release";
}

// The page is not loaded. Empty: presence is the fact.
message SidebarWorkspaceMemoryPageNotLoaded {}
