// topbar.proto — THE TOPBAR: one THIN strip, edge to edge. Left, tight: the
// connectivity dot and, right beside it, the account label it qualifies —
// one cell — then the status chips in order: remote-control chip,
// persistent-wifi chip, and, in a repository that checks its production, the
// production-checks chip. Center: the heading — the workspace's short
// summary, and on a line beneath it the workspace's name — centered
// on the strip between the flank groups, which never spread and never push
// it. Right, tight, in order: model selector, effort selector,
// permission-mode picker, context chip at the far edge. The status chips ride
// the left so the two flanks balance (owner request, 2026-11-09). The strip
// stands off the window's edges exactly as far as its cells
// stand off each other. The flanks and the summary share the strip's top
// band; the name line is a band below it, and is centered under the summary
// text rather than under the strip. A workspace with no summary draws its
// name in the summary's place on the top band. A hover on the summary shows
// the workspace's long summary beneath it; a click on the name, underlined
// while the workspace shows links, opens them.
//
//   │● work@…com  ☎  ᯤ        Fix the flaky reconnect backoff    haiku 4.5 ▾  142.3k│
//   │                              fix-flaky-reconnect                              │
//
// REVEAL CONVENTION: every strip element's detail (session line, model
// options, the context chip's usage breakdown, the summary's long summary and
// the name's link menu) renders BELOW the strip and CLAMPS within the viewport —
// never off-screen left or right.
//
// EVERY FIELD OF THE VIEW IS AN ELEMENT MESSAGE. Reading TopbarView
// enumerates the topbar's subcomponents; each element's props are its own
// message, so the UI's partition is a fact of the schema and no value rides
// bare where it could be conflated with a neighbor. Where the same fact also
// appears in another component's view, THAT component wraps it in ITS OWN
// message — two dedicated wrappers of one fact imply two separate
// subcomponents, which is exactly the information a shared wrapper would lose.
//
// NO WORKSPACE, NO FENCE: the topbar's stream is per-workspace, so the
// workspace is the stream's, and one ordered stream per component needs no
// staleness token — a push cannot overtake a newer one on its own stream.
//
// FIXED SCHEMA AND ORGANIZATION (owner ruling, 2026-09-13). THE STRIP HAS ONE
// SHAPE AND ONLY ONE. Every cell named by TopbarView is present in the strip
// at all times and in the same slot; there is NO whole-view state that
// replaces, suppresses or rearranges the strip, and none may ever be added.
// A cell whose SESSION fact is unknown — the workspace is standing at the
// cold gate, or its session has simply not stated the fact yet — draws its OWN "no session" content in its OWN slot: the model
// selector and the permission-mode picker are ABSENT (presence is
// how "unknown" is said) and the client draws a dash in the slot rather than
// omitting it, while the context chip is ALWAYS SET and always drawn. The
// session-less FACTS are not lost: the chip carries the cold context size (0
// when none is known) with the reason in its hover content. Two whole-view
// states, `hibernated` (tag 11) and `cold_gate` (tag
// 12), were landed and then RETIRED the same day under this ruling; their
// tags are reserved below and must not be revived.
//

syntax = "proto3";

package frontend.v1;

import "conversation/v1/api.proto";
import "frontend/v1/workspace_name_prefix.proto";
import "workspace/v1/workspace.proto";

option go_package = "agentrepl/proto/frontend/v1;frontendv1";

// One workspace's topbar, resolved completely by the daemon. The client
// renders each element verbatim and derives nothing.
message TopbarView {
  // The title line: the workspace's generated summary, drawn in the heading's
  // top line. OPTIONAL BY PRESENCE: UNSET while no summary exists for the
  // workspace, and the client then draws the workspace's name in the
  // summary's place. The title's TEXT is never anything but a summary.
  optional TopbarTitle title = 1;
  // The session identity line (hover/expanded state).
  TopbarSessionLine session_line = 2;
  // The model selector: current selection and the selectable list. OPTIONAL
  // BY PRESENCE: absent means no session has stated a model for this
  // workspace (cold-gated, or not yet started), and the client
  // draws the cell's no-session dash IN ITS SLOT rather than omitting it.
  optional TopbarModelSelector model_selector = 3;
  // The connectivity glyph.
  TopbarConnectivity connectivity = 4;
  // Tag 5 RETIRED (TopbarWarningStrip warnings): the topbar draws no
  // warnings. A condition the daemon meets is recorded in its log, and a
  // session's health is the footer's to state.
  reserved 5;
  reserved "warnings";
  // Tag 6 RETIRED (TokenBreakdownView token_breakdown): the breakdown now
  // rides the context chip's hover content.
  reserved 6;
  // The context chip — a NUMBER, not an icon. ALWAYS SET. A session-less
  // workspace's chip states the context the session HELD (what a cold read
  // would re-read), 0 when none is
  // known, and the reason it is not live rides the chip's hover content.
  TopbarContextChip context = 7;
  // Which account the session spends as.
  TopbarAccount account = 8;
  // The permission-mode picker, the model selector's sibling. OPTIONAL BY
  // PRESENCE, for the same reason and with the same no-session drawing.
  optional TopbarPermissionModePicker permission_mode_picker = 9;
  // Tag 10 (`fast_mode`) is RETIRED: the strip no longer draws the vendor's
  // fast mode.
  reserved 10;
  reserved "fast_mode";
  // Tag 11 RETIRED (TopbarHibernated hibernated): the whole-view hibernated
  // state, landed and reversed on 2026-09-13 by the FIXED SCHEMA AND
  // ORGANIZATION ruling above. The park now rides the context chip's hover
  // reason.
  reserved 11;
  // Tag 12 RETIRED (TopbarColdGate cold_gate): the whole-view cold-gate
  // state, landed and reversed the same day and for the same reason. The
  // gate's figure is the context chip's, and its reason the chip's hover.
  reserved 12;
  // The persistent-wifi chip, last in the left group's status run, after the
  // remote-control chip.
  // ALWAYS SET: the machine's standing is a daemon fact that every workspace's
  // strip draws alike, session or no session, and a fact the daemon could not
  // read is stated INSIDE the chip rather than by its absence.
  TopbarPersistentWifi persistent_wifi = 13;
  // The effort selector, drawn between the model selector and the
  // permission-mode picker, in the same form as both. OPTIONAL BY PRESENCE,
  // for the same reason and with the same no-session drawing as the model
  // selector.
  optional TopbarEffortSelector effort_selector = 14;
  // The workspace's name, drawn on the heading's second line, beneath the
  // title and centered under the title's text, or in the title's place when
  // the title is unset. ALWAYS SET: every workspace has a name, summarized or
  // not.
  TopbarWorkspaceName workspace_name = 15;
  // The queue-bypass chip, first in the left group, left of the remote-control
  // chip. OPTIONAL BY PRESENCE: SET only when the workspace's session spends
  // as a PERSONAL account, the one kind of login that may land on its
  // repository's main branch without the merge queue; UNSET on a work
  // account's workspace, and the client then draws nothing in its place.
  optional TopbarQueueBypass queue_bypass = 17;
  // The remote-control chip, first in the left group's status run,
  // immediately left of the persistent-wifi chip.
  // ALWAYS SET: every workspace has a remote-control mode, on or off.
  TopbarRemoteControl remote_control = 16;
  // The production-checks chip, last in the left group's status run,
  // immediately right of the persistent-wifi chip. OPTIONAL BY PRESENCE: SET
  // only when the workspace's repository turns production checks on
  // (repoconfig.v1.LifecycleConfig.production_checks); UNSET otherwise, and
  // the client then draws nothing in its place.
  optional TopbarProductionChecks production_checks = 18;
}

// THE REMOTE-CONTROL CHIP: one phone glyph stating whether this workspace's
// session is reachable from claude.ai (and its mobile app) through the
// vendor's Remote Control bridge. Drawn as the persistent-wifi chip is: the
// glyph is always black, and the mode arm paints the disc it sits on.
//   mode:  on → a green disc; off → a white one.
//
// A STATUS AND A CONTROL: clicking the chip turns the mode over through
// UpdateRemoteControlMode's `toggle` arm, the same endpoint and arm the
// editor's toggle command sends. The chip draws nothing on success; it
// redraws from the next push.
//
// THE MODE IS THE WORKSPACE'S, kept by the daemon: on by default for a
// repository's main worktree, off by default for every other workspace, and
// whatever the user last set otherwise. A workspace whose mode is on keeps its
// shim up between keep-alives, until the idle sweep parks it past its cutoff.
// THE QUEUE-BYPASS CHIP: whether this workspace lands its changes straight on
// its repository's main branch, with the repository's merge queue paused while
// it works and let through at the end of each of its turns.
// While it is on, the workspace runs its BYPASS conversation, whose system
// prompt carries the bypass directive in place of the merge-queue rules; while
// it is off, its ordinary conversation. Each keeps its own transcript and its
// own warm cache, and the one not running is kept for the next switch.
//
// A STATUS AND A CONTROL. In the off arm a click opens the chip's menu, drawn
// as the topbar's other menus are: one row per served option, and a pick
// sends UpdateQueueBypassMode's `on` arm echoing the option's context. In the
// on arm a click sends `toggle`, which releases the mode. In the
// held_elsewhere arm the chip is a status only. The chip draws nothing on
// success; it redraws from the next push.
message TopbarQueueBypass {
  // The workspace's standing toward the mode. Exactly one repository workspace
  // may hold the mode at a time, so the third arm is a mode this workspace
  // cannot take until the holder lets go.
  oneof mode {
    TopbarQueueBypassOn on = 1;
    TopbarQueueBypassOff off = 2;
    TopbarQueueBypassHeldElsewhere held_elsewhere = 3;
  }
  // The hover text, composed by the daemon.
  TopbarQueueBypassTooltip tooltip = 4;
}
// This workspace holds the mode: its repository's queue is paused while the
// workspace works and runs between its turns, and the chip is drawn lit.
message TopbarQueueBypassOn {}
// The mode is free and this workspace does not hold it: the chip is drawn
// unlit, and a click opens the menu of how the bypass session gets its
// context.
message TopbarQueueBypassOff {
  // The menu's rows, in display order; the menu renders exactly this list.
  // ALWAYS the two main-context options (full, then compacted), followed by
  // the two existing-context options only while the workspace has a parked
  // bypass conversation to resume. The daemon decides which are offered; the
  // client never infers it.
  repeated TopbarQueueBypassContextOption options = 1;
}
// One way the bypass session may get its context.
message TopbarQueueBypassContextOption {
  // The choice, the typed echo token UpdateQueueBypassModeOn.context takes
  // back unchanged.
  TopbarQueueBypassContext context = 1;
  // The row's label, a few words, composed by the daemon ("Full main
  // context").
  string display_name = 2;
}
// HOW THE BYPASS SESSION GETS ITS CONTEXT when the workspace takes the mode.
// Served on each menu row and echoed back by the pick. The set arm IS the
// choice; exactly one is set.
message TopbarQueueBypassContext {
  oneof context {
    // A full fork of the main (queue) conversation as it stands now. Replaces
    // any parked bypass conversation, whose transcript stays on disk.
    TopbarQueueBypassContextFullMain full_main = 1;
    // A fork of the main conversation, compacted by the shim's summarizer
    // before its first turn. Replaces any parked bypass conversation.
    TopbarQueueBypassContextCompactedMain compacted_main = 2;
    // The parked bypass conversation, resumed as it was left. Offered only
    // while one is parked.
    TopbarQueueBypassContextExisting existing = 3;
    // The parked bypass conversation, resumed, with a compacted summary of
    // the main conversation carried into its context before the user's next
    // prompt. Offered only while one is parked.
    TopbarQueueBypassContextExistingPlusCompactedMain existing_plus_compacted_main = 4;
  }
}
// A full fork of the main conversation.
message TopbarQueueBypassContextFullMain {}
// A compacted fork of the main conversation.
message TopbarQueueBypassContextCompactedMain {}
// The parked bypass conversation as it was left.
message TopbarQueueBypassContextExisting {}
// The parked bypass conversation plus a compacted summary of the main one.
message TopbarQueueBypassContextExistingPlusCompactedMain {}
// Another workspace of the same repository holds the mode: the chip is drawn
// muted and does not respond to a click.
message TopbarQueueBypassHeldElsewhere {
  // The holding workspace's name, as the roster spells it.
  string workspace_name = 1;
}
// The chip's hover text.
message TopbarQueueBypassTooltip {
  // Drawn verbatim.
  string text = 1;
}

message TopbarRemoteControl {
  // Whether remote control is on for the workspace.
  oneof mode {
    TopbarRemoteControlModeOn on = 1;
    TopbarRemoteControlModeOff off = 2;
  }
  // The hover text, composed by the daemon.
  TopbarRemoteControlTooltip tooltip = 3;
}
// Remote control is on: the glyph sits on a green disc.
message TopbarRemoteControlModeOn {}
// Remote control is off: the glyph sits on a white disc.
message TopbarRemoteControlModeOff {}
// The chip's hover text.
message TopbarRemoteControlTooltip {
  // Drawn verbatim.
  string text = 1;
}

// THE PERSISTENT-WIFI CHIP: one wifi glyph stating two facts about the
// MACHINE the daemon runs on — whether it is on a Wi-Fi network, and whether
// persistent wifi mode keeps it awake (and that network up) with the lid
// closed. It is the same standing in every workspace's strip; the daemon
// resolves it once and states it on each.
//
// THE TWO ONEOFS ARE DRAWN INDEPENDENTLY, and the client maps each arm to
// exactly one paint, deciding nothing else:
//   wifi:  joined → the glyph is green; not_joined → the glyph is red;
//          unassigned → the glyph is muted (the daemon could not read it).
//   mode:  on → the glyph sits on a black disc it is just inscribed in;
//          off, or unassigned → no disc.
// So a green glyph on the disc is "on a network, and closing the lid keeps
// it", and a red glyph on the disc is "no network, but closing the lid would
// keep one".
//
// A STATUS AND A CONTROL: clicking the chip toggles the mode through
// UpdatePersistentWifiMode's `toggle` arm, the same endpoint and arm the
// editor's toggle command sends (owner ruling, 2026-10-01). The chip draws
// nothing on success; it redraws from the next push.
message TopbarPersistentWifi {
  // Whether the machine is joined to a Wi-Fi network. UNASSIGNED = the daemon
  // could not read it, and the tooltip says so.
  oneof wifi {
    TopbarPersistentWifiJoined joined = 1;
    TopbarPersistentWifiNotJoined not_joined = 2;
  }
  // Whether persistent wifi mode is in force. UNASSIGNED = the daemon could
  // not read it, and the tooltip says so.
  oneof mode {
    TopbarPersistentWifiModeOn on = 3;
    TopbarPersistentWifiModeOff off = 4;
  }
  // The hover text, composed by the daemon from every fact.
  TopbarPersistentWifiTooltip tooltip = 5;
  // The built-in display's lid. Rides as a data attribute and paints nothing:
  // the tooltip states it, with the lid-close dim in force and the cause of
  // an unwatched lid. UNASSIGNED = the daemon has not heard the lid yet.
  oneof lid {
    TopbarPersistentWifiLidOpen lid_open = 6;
    TopbarPersistentWifiLidClosed lid_closed = 7;
    TopbarPersistentWifiNoLid no_lid = 8;
    TopbarPersistentWifiLidUnwatched lid_unwatched = 9;
  }
}
// On a Wi-Fi network: the glyph is green.
message TopbarPersistentWifiJoined {}
// On no Wi-Fi network: the glyph is red.
message TopbarPersistentWifiNotJoined {}
// Persistent wifi mode is on — the lid can close without sleeping the machine
// or dropping its network: the glyph sits on the blue disc.
message TopbarPersistentWifiModeOn {}
// Persistent wifi mode is off — closing the lid sleeps the machine: no disc.
message TopbarPersistentWifiModeOff {}
// The lid is open.
message TopbarPersistentWifiLidOpen {}
// The lid is closed.
message TopbarPersistentWifiLidClosed {}
// The machine has no lid.
message TopbarPersistentWifiNoLid {}
// The daemon is not hearing the lid; the tooltip names why.
message TopbarPersistentWifiLidUnwatched {}
// The chip's hover text.
message TopbarPersistentWifiTooltip {
  // Drawn verbatim ("Wi-Fi: joined (network name withheld by macOS) ·
  // persistent wifi on: the lid can close").
  string text = 1;
}

// THE PRODUCTION-CHECKS CHIP: one glyph stating whether the workspace's
// repository's production checks are running or paused
// (agentrepl.v1.UpdateProductionPause). It is the REPOSITORY'S standing, so
// every workspace of the repository draws the same chip, and a pause or a
// resume restates it on each. Drawn as the persistent-wifi chip is: the glyph
// is always black, and the standing arm paints the disc it sits on.
//   standing:  running → a green disc; paused → a white one.
//
// A STATUS AND A CONTROL: clicking the chip sends UpdateProductionPause for
// `repository`, `pause` while running and `resume` while paused. The chip
// draws nothing on success; it redraws from the push the change causes, and a
// refusal is stated at the chip.
message TopbarProductionChecks {
  // Whether the repository's production checks are running or paused.
  oneof standing {
    TopbarProductionChecksRunning running = 1;
    TopbarProductionChecksPaused paused = 2;
  }
  // The repository a click pauses or resumes, echoed verbatim in
  // UpdateProductionPauseRequest.repository.
  workspace.v1.RepositoryRef repository = 3;
  // The hover text, composed by the daemon: the standing, the production
  // mediator it acts on by name, and what a click does.
  TopbarProductionChecksTooltip tooltip = 4;
}
// The checks run: each landing's span is told to the production mediator.
message TopbarProductionChecksRunning {}
// The checks are paused: the production mediator is told no span.
message TopbarProductionChecksPaused {}
// The chip's hover text.
message TopbarProductionChecksTooltip {
  // Drawn verbatim ("Production checks are running, reviewed by
  // prod-mediator · click to pause them").
  string text = 1;
}


// The permission-mode picker: the mode in force and the modes this session
// may switch to (the daemon serves exactly the set SetPermissionMode will
// accept — an ungated mode only where creation consented to it). Modes are
// spelled as the session facts spell them (the shim's mode vocabulary);
// SetPermissionMode echoes an option's `mode` unchanged.
message TopbarPermissionModePicker {
  // The mode in force, WHOLE — the button shows its display_name.
  TopbarPermissionModeOption current = 1;
  // The switchable modes, in display order. The picker renders exactly this
  // list.
  repeated TopbarPermissionModeOption options = 2;
}

// One mode the picker offers.
message TopbarPermissionModeOption {
  // The mode's wire spelling — what SetPermissionMode echoes.
  string mode = 1;
  // The name the picker shows for it.
  string display_name = 2;
}

// THE CHIP IS THE CURRENT CONTEXT SIZE, rendered YELLOW: the one figure
// that must stay visible, because "how full is my context" is what the
// topbar's token presence exists to answer. It SHRINKS on a compaction or
// clear, and can never exceed the model's context window — a PRODUCER
// fact, never a client clamp. Hover reveals the session's usage breakdown.
message TopbarContextChip {
  // The current context size, daemon-formatted ("142.3k").
  string text = 1;
  // The hover content: the SESSION's token usage. ALWAYS POPULATED so the
  // hover needs no round-trip.
  TokenBreakdownView breakdown = 2;
  // How full the model's context window is, 0..1: the context size `text`
  // states over the window's size. The window's size is the vendor's figure
  // for the session's model when the vendor states one, and 1,000,000 tokens
  // when it does not (owner ruling, 2026-10-01 — the one sanctioned assumed
  // figure). The client colors `text` by this fraction with EXACTLY the rule
  // the footer's allowance percentages use, so a chip at 40% of its window
  // wears the color a 40% allowance wears. Never outside [0, 1]; the daemon
  // clamps.
  double window_fill = 3;
  // TOTAL SESSION CONTEXT, daemon-formatted ("1.3m"): the chip's own figure
  // summed across every context cut the session has made. Each /clear or
  // completed compaction BANKS the context it discards, so a session that
  // held 800k, was cleared, and then held 500k states 1.3m here while `text`
  // states the 500k. It never shrinks on a cut, is kept in wsm so a restart
  // does not lose it, and is the first row of the dropdown the chip opens.
  // ALWAYS SET: a workspace that has held no context states "0".
  string session_total_text = 4;
}

// Which Claude account the session spends as, resolved by the daemon from
// the session's own config root (its .claude.json login). Far left of the
// strip. THE ARM IS THE STATE: a logged-out root is a DRAWN WARNING —
// a session whose root is logged out cannot run a turn, so the label is
// the warning, never a blank (blank reads as "loading", the one thing it
// is not).
message TopbarAccount {
  oneof state {
    TopbarAccountLoggedIn logged_in = 1;
    TopbarAccountLoggedOut logged_out = 2;
  }
  // EVERY ACCOUNT ROOT THE DAEMON KNOWS, in the account package's own order,
  // and the cell's click presents them as a dropdown: choosing one makes this
  // workspace's session spend as that account (SelectAccount). The arm above
  // stays the CELL's label — which account is spent as right now — and this
  // list is the CHOICE behind it; the option carrying `current` is the one the
  // arm above describes.
  //
  // ALWAYS THE WHOLE SET, never the alternatives alone. A one-root machine
  // draws a one-row dropdown, which states what the choice is; a list that
  // omitted the current root would leave the reader with an empty menu and no
  // way to tell it apart from a menu that failed to load.
  repeated TopbarAccountOption options = 3;
  // THE DAEMON ASKS FOR THE LOGIN. SET from the moment the daemon determines
  // that the account this workspace spends as must sign in again -- the vendor
  // rejected its credential, on a turn or on a session's start -- until a
  // login flow for that account ends (signed in, or closed by the user). The
  // page OPENS THE LOGIN BY ITSELF on a request it has not opened for yet:
  // the same overlay the cell's own click opens (OpenLogin), with nothing for
  // the reader to click first. Every strip spending as the account carries
  // the same request, so whichever workspace the reader is looking at opens
  // it. UNSET when no sign-in is needed.
  optional TopbarAccountSignInRequest sign_in_request = 4;
}
// One determination that the account must sign in again.
message TopbarAccountSignInRequest {
  // Names this determination, so a page opens the login ONCE for it: the same
  // id republished (any later push of the strip) opens nothing again, and a
  // later determination is a new id. Opaque to the client; compared for
  // equality only.
  string request_id = 1;
}
message TopbarAccountLoggedIn {
  // The logged-in email, verbatim.
  string email = 1;
}
message TopbarAccountLoggedOut {}

// One account root the session may spend as. THE ARM IS THE STATE here for
// the same reason it is on the cell: a logged-out root is an answer the reader
// acts on (choosing it switches the workspace and then opens that root's login
// flow), never a blank row.
message TopbarAccountOption {
  // The root's absolute path — the echo token SelectAccount takes back.
  string config_dir = 1;
  oneof state {
    TopbarAccountLoggedIn logged_in = 2;
    TopbarAccountLoggedOut logged_out = 3;
  }
  // This is the root the workspace's session spends as right now.
  bool current = 4;
}

// The title line the topbar shows: the workspace's short summary, one
// imperative sentence stating the workspace's task, drawn in the summary's
// purple whatever else the topbar states, never underlined and never a
// control. It is a summary ONLY — the one the workspace's own agent set
// (agentrepl.v1.SetWorkspaceSummary), or the vendor's own conversation title
// while none stands — and never carries the workspace's name or its branch,
// as a suffix or as a stand-in; the name is TopbarWorkspaceName's, drawn on
// its own line.
message TopbarTitle {
  // The short summary sentence, verbatim. Never empty when the title is set.
  string text = 1;
  reserved 2, 3;
  reserved "link", "links";
  // The popup a hover on the summary shows: the workspace's long summary.
  // UNSET when no long summary stands (the title is the vendor's own
  // conversation title), and a hover then shows nothing.
  optional TopbarTitleDescription description = 4;
}

// The popup a hover on the summary shows beneath it: the long summary the
// workspace's agent set (agentrepl.v1.SetWorkspaceSummaryRequest.long_summary),
// two to four sentences describing the workspace's task in more detail than
// the one-sentence title can.
message TopbarTitleDescription {
  // The long summary, verbatim: one paragraph of two to four sentences.
  string text = 1;
}

// The workspace's shown links: the workspace's name is drawn underlined, and
// a click on it opens what the arm names, never the heading's own
// session-line reveal.
// THE ARM IS WHAT THE CLICK DOES, resolved by the daemon from how many links
// the menu shows, so the client never counts them to decide.
message TopbarWorkspaceNameLinks {
  oneof opens {
    // Exactly one link is shown: the click opens it directly.
    TopbarWorkspaceNameLink single = 1;
    // Two or more links are shown: the click drops their menu.
    TopbarWorkspaceNameLinkMenu menu = 2;
  }
}

// The one shown link a click opens directly, through OpenExternal (the Chrome
// profile of the account the workspace's session spends as). Its tooltip
// names the label and the url beneath the workspace's name.
message TopbarWorkspaceNameLink {
  // The agent's label for the link, two to eight words, verbatim.
  string label = 1;
  // The absolute http or https url, verbatim as the agent set it. The daemon
  // refused any url the external browser would not open, so the client
  // renders and opens it without inspecting it.
  string url = 2;
}

// The menu a click on the workspace's name drops beneath the heading: one row per
// shown link, at most five.
message TopbarWorkspaceNameLinkMenu {
  // The shown links, MOST RECENTLY SET FIRST, in the order drawn. At least
  // two.
  repeated TopbarWorkspaceNameLinkMenuItem items = 1;
}

// One row of the name's link menu: the label drawn as a link, which a pick
// opens through OpenExternal, closing the menu.
message TopbarWorkspaceNameLinkMenuItem {
  // The agent's label for the link, two to eight words, drawn verbatim as the
  // row's text.
  string label = 1;
  // The absolute http or https url, verbatim as the agent set it, named in
  // the row's tooltip.
  string url = 2;
  // Whether the workspace's work made what the link points at (a pull request
  // it opened, a doc it wrote). Owned rows are served BEFORE every reference
  // row and drawn on a slightly lighter ground than the reference rows, with
  // an "owned" badge beside the label, so the client draws the flag and never
  // reorders.
  bool owned = 3;
  // The service the url's host names, drawn as an icon on the row's left.
  TopbarWorkspaceNameLinkIcon icon = 4;
  // How the GitHub pull request the url names stands, drawn as a small
  // colored badge in the row's right margin. UNSET for a url that names no
  // pull request, and for a pull request the daemon has not yet read; the row
  // then draws no badge. The daemon reads every linked pull request on its
  // pull-request cadence, so the badge follows a merge or a close without the
  // link being set again.
  optional TopbarWorkspaceNameLinkBadge badge = 5;
  // Whether the workspace is subscribed to the link's updates through
  // agent-repl: a GitHub pull request it follows and has not stopped
  // following (agentrepl.v1.WorkspaceLinkOwnedFollowFollowing), or a Slack
  // thread it subscribes to (agentrepl.v1.SlackThreadSubscription). Drawn as
  // a green "subscribed" badge beside the label, present if and only if the
  // flag is set.
  bool subscribed = 6;
}

// A menu row's pull request badge. THE ARM IS THE STATE the badge draws, in
// the menu's own words: the client draws the arm's word and color and never
// reads the pull request itself. A set badge with no arm set is a state this
// schema revision does not name, and draws no badge.
message TopbarWorkspaceNameLinkBadge {
  // How the pull request stands, as the daemon's latest read of it found.
  oneof state {
    // Open for review: "open", in the foreground white.
    TopbarWorkspaceNameLinkBadgeOpen open = 1;
    // Open and still a draft: "draft", in the muted grey.
    TopbarWorkspaceNameLinkBadgeDraft draft = 2;
    // Merged: "merged", in green.
    TopbarWorkspaceNameLinkBadgeMerged merged = 3;
    // Closed without merging: "closed", in red. A reopened pull request
    // draws open again at the next read.
    TopbarWorkspaceNameLinkBadgeClosed closed = 4;
  }
}

// The pull request is open. DELIBERATELY EMPTY: the arm is the state.
message TopbarWorkspaceNameLinkBadgeOpen {}

// The pull request is a draft. DELIBERATELY EMPTY: the arm is the state.
message TopbarWorkspaceNameLinkBadgeDraft {}

// The pull request merged. DELIBERATELY EMPTY: the arm is the state.
message TopbarWorkspaceNameLinkBadgeMerged {}

// The pull request closed unmerged. DELIBERATELY EMPTY: the arm is the state.
message TopbarWorkspaceNameLinkBadgeClosed {}

// The service icon a menu row draws before its label, decided by the daemon
// from the url's host so the client never inspects a url.
enum TopbarWorkspaceNameLinkIcon {
  // No known service: the row draws no icon.
  TOPBAR_WORKSPACE_NAME_LINK_ICON_UNSPECIFIED = 0;
  // A GitHub pull request: the GitHub mark.
  TOPBAR_WORKSPACE_NAME_LINK_ICON_GITHUB = 1;
  // A Slack workspace link: the Slack mark.
  TOPBAR_WORKSPACE_NAME_LINK_ICON_SLACK = 2;
  // A GNS link: the GNS mark.
  TOPBAR_WORKSPACE_NAME_LINK_ICON_GNS = 3;
  // A Notion link: the Notion mark.
  TOPBAR_WORKSPACE_NAME_LINK_ICON_NOTION = 4;
}

// The workspace's name as the registry holds it: drawn on the heading's
// second line, centered under the title's text, or in the title's place when
// there is no title. Its own element because it is drawn in its own place and
// styled its own way (bold, larger than the summary, and always in the
// foreground white), apart from the summary above it.
message TopbarWorkspaceName {
  // The workspace's registry name, verbatim: always a slug, never carrying a
  // mark drawn before it.
  string text = 1;
  // The marks drawn immediately before the name, the same prefix the
  // workspace's sidebar row wears (frontend.v1.RosterRowName.prefix), at the
  // name's own size. UNSET for a name that wears no mark.
  optional WorkspaceNamePrefix prefix = 2;
  // What a click on the name opens: the workspace's shown links
  // (agentrepl.v1.ChangeWorkspaceLinks), and the name is then drawn
  // underlined. UNSET while the menu shows none, and the name is then plain
  // text.
  optional TopbarWorkspaceNameLinks links = 3;
}

// The session identity line, shown in the hover/expanded state.
message TopbarSessionLine {
  // Verbatim.
  string text = 1;
}

// The model selector: what is selected, and what may be.
message TopbarModelSelector {
  // The current selection, WHOLE — the button shows its display_name. UNSET
  // means no selection and the button renders its placeholder; presence, not
  // an empty display string.
  optional conversation.v1.ModelOption selected = 1;
  // The selectable models, in display order. The selector renders exactly
  // this list.
  repeated conversation.v1.ModelOption options = 2;
  // The model a NEW session on this workspace's login (its account root)
  // starts under when nobody names one: the default the reader made with
  // SetDefaultModel, else the daemon's built-in default for that login.
  // ALWAYS SET: every login has a default, so the row that is it is marked
  // and every other row offers "Make default". Compared to an option by
  // AgentModel.name, the same echo token the selection is named by.
  conversation.v1.AgentModel default_model = 3;
}

// THE EFFORT SELECTOR: the reasoning effort the workspace's session runs at,
// and the levels it may be switched to. A pick is SetEffort and holds for the
// rest of the session. THE ARM IS WHETHER THE SELECTED MODEL TAKES AN EFFORT
// LEVEL AT ALL (conversation.v1.ModelCapabilities.effort_support).
//
// THE CURRENT LEVEL IS ALWAYS KNOWN while a session stands: before any pick,
// it is the default the daemon read from the session's own Claude settings
// when it initialized the workspace (owner ruling, 2026-10-01), and after a
// pick it is the level the shim reported in effect.
message TopbarEffortSelector {
  oneof support {
    // The selected model takes an effort level.
    TopbarEffortSelectorSupported supported = 1;
    // The selected model takes no effort level: the cell draws its dash and
    // offers no dropdown.
    TopbarEffortSelectorUnsupported unsupported = 2;
  }
}
// The effort in effect and the levels the selected model accepts.
message TopbarEffortSelectorSupported {
  // The level in effect — the button shows its display_name. ALWAYS one of
  // `options`; the daemon never serves a current level the model refuses.
  TopbarEffortOption current = 1;
  // The levels the selected model accepts, in the vendor's own order. The
  // dropdown renders exactly this list.
  repeated TopbarEffortOption options = 2;
}
// The selected model takes no effort level.
message TopbarEffortSelectorUnsupported {}
// One effort level the selector offers.
message TopbarEffortOption {
  // The level — the typed echo token SetEffort takes back. Never UNSPECIFIED.
  conversation.v1.AgentEffortLevel level = 1;
  // The name the selector shows for it ("medium").
  string display_name = 2;
}

// The connectivity indicator, fully resolved: a literal glyph, a literal
// tooltip, and a tone naming a color class from the shared render-colors
// vocabulary (proto/vocab/render-colors.json — the one deliberate shared
// authority, so the topbar and the footer paint one condition one color).
// The STATE it derives from is the session's connectivity, resolved by the
// daemon; the client never maps that state itself.
message TopbarConnectivity {
  // Vocabulary color-class name: one of proto/vocab/render-colors.json's
  // `topbar_tones` ("none" plus the five live colors; teal died with the
  // hibernated state, which is now the one park, drawn as the live idle
  // session it stands in for).
  string tone = 1;
  // The literal glyph character(s) the indicator draws.
  string glyph = 2;
  // Tooltip text, verbatim.
  string title = 3;
  // THE SESSION, shown in the dropdown clicking the indicator opens (owner,
  // 2026-10-06). ABSENT before any session has begun (no agent-repl login and
  // no editor start this daemon has seen).
  optional TopbarAgentReplSession session = 4;
}

// agent-repl's session: since the LATER of the last login made through
// agent-repl and the start of this Emacs. The dropdown draws how long it has
// run, labeled by what began it.
//
// IT CARRIES NO NETWORK TRAFFIC. Fields 4 and 5 once counted the vendor
// processes' bytes received and sent; they are reserved because measuring
// them took one kernel network-statistics control socket per vendor process,
// and those sockets are the inferred cause of the kernel's network buffer
// (mbuf) exhaustion. No producer measures traffic, so none is stated.
message TopbarAgentReplSession {
  // When the session began, epoch milliseconds. The client ticks the
  // duration ("1h 12m") from it locally; the daemon never pushes a tick.
  int64 started_at_ms = 1;
  // What began it. THE ARM IS THE CAUSE.
  oneof began {
    TopbarSessionBeganLogin login = 2;
    TopbarSessionBeganEditorStart editor_start = 3;
  }
  reserved 4, 5;
  reserved "bytes_received", "bytes_sent";
}
// A login made through agent-repl began the session.
message TopbarSessionBeganLogin {}
// This Emacs starting began the session.
message TopbarSessionBeganEditorStart {}

// ==========================================================================
// THE TOKEN-BREAKDOWN MENU the topbar opens: titled sections of rows. The
// SESSION's accounting — the footer's turn-level tokens are a different fact
// and a different component (footer.proto), deliberately uncoupled.
// ==========================================================================

// The token-breakdown menu, fully resolved. Sections and rows arrive in
// display order; the client renders exactly this tree.
// SESSION-SCOPED ONLY: input/output, cached/uncached, thinking, per-model.
// NO turn-scoped section may ever appear here — turn figures are the
// FOOTER's domain exclusively (the topbar is turn-nonspecific by nature).
message TokenBreakdownView {
  // Menu sections, in display order (e.g. "session", per-model).
  repeated TokenBreakdownSection sections = 1;
}

// One titled section of the breakdown menu.
message TokenBreakdownSection {
  // The section heading.
  TokenBreakdownHeading heading = 1;
  // Rows, in display order.
  repeated TokenBreakdownRow rows = 2;
}

// A section's heading.
message TokenBreakdownHeading {
  // Verbatim.
  string text = 1;
}

// One row of the breakdown menu — the row IS the element, and these are its
// props. All numbers are resolved; the share is precomputed so the client
// does no arithmetic.
message TokenBreakdownRow {
  // Row label, verbatim (e.g. "uncached input", "fresh input", "cache read").
  string label = 1;
  // The row's token count.
  int64 tokens = 2;
  // The row's share of its section's basis, in permille (0-1000), already
  // rounded. UNSET means no share applies to this row and the client omits
  // the percentage; 0 is a real zero percent. Presence, not a -1 sentinel.
  optional int32 share_permille = 3;
  // True when the row is a headline (rendered unindented/emphasized), false
  // for detail rows. Layout fact resolved daemon-side.
  bool emphasized = 4;
  // Indent depth for nested detail rows; 0 = top level.
  int32 depth = 5;
}
