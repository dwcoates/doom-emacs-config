// context_panel.proto — THE /context PANEL: what occupies the context
// window, resolved from the vendor's FULL structured breakdown
// (conversation.v1 SessionContextUsage, the get_context_usage answer).
// Daemon-resolved; the WEBAPP renders the panel CUSTOM as a COLLAPSIBLE
// SECTION TREE — each top-level category is a chevron row (closed by default)
// whose detail (leaf items and nested sub-folds like the tool-call list under
// Messages) unfolds beneath it. The presentation — the per-section palette
// color, the header's percent gradient, the chevrons — is the webapp's; the
// facts, order and figures are the daemon's. Distinct from the topbar's
// session token breakdown — a different fact and a different component.

syntax = "proto3";

package frontend.v1;

option go_package = "agentrepl/proto/frontend/v1;frontendv1";

message ContextPanelView {
  // The structured header. The client composes the one-line summary from the
  // parts and colors only the percent — it never does the arithmetic, the
  // daemon states used/total/percent.
  ContextPanelHeader header = 1;
  // The top-level section rows, in served (vendor category) order. Each is a
  // collapsible fold in the webapp; a section with no detail is a bare row.
  repeated ContextPanelSection sections = 2;
  // The auto-compaction line ("auto-compact at 160k" / "auto-compact off"),
  // resolver-composed.
  string auto_compact_line = 3;
}

// The header parts. The daemon states them; the client composes
// "57.8k of 1M (6%) · claude-opus-5" and colors ONLY the percent by proximity
// to 100.
message ContextPanelHeader {
  // Tokens currently in context, formatted ("57.8k").
  string used = 1;
  // The usable window, formatted ("1M").
  string total = 2;
  // The vendor's own percent-used figure, verbatim (never re-derived).
  uint32 percent = 3;
  // The model the window belongs to, the vendor's spelling.
  string model = 4;
}

// One node of the /context section tree. RECURSIVE: `items` are the leaf detail
// rows drawn directly under this section, and `sections` are nested sub-folds
// (e.g. the tool-call list under Messages). A leaf section has empty `items`
// and empty `sections` and draws as a bare row with no chevron.
message ContextPanelSection {
  // The section label, composed by the daemon (the vendor's category label at
  // the top level).
  string label = 1;
  // The composed figure ("38.1k · 19%", or a roll-up sentence like
  // "8 of 19 skills · 6.4k"). May be empty.
  string figure = 2;
  // Leaf detail rows shown when the section is unfolded.
  repeated ContextPanelItem items = 3;
  // Nested sub-fold sections (themselves collapsible).
  repeated ContextPanelSection sections = 4;
}

// One breakdown row: a composed label and a composed figure. The daemon
// composes both; the client draws them.
message ContextPanelItem {
  string label = 1;
  // The composed token figure ("2.1k").
  string figure = 2;
}
