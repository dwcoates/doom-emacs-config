// endpoint_list_creation_models.proto — ListCreationModels: which models may a
// new workspace in this repository be created under? SIDEBAR section, beside
// CreateWorkspace.
//
// THE MODELS ARE THE LOGIN'S. A new workspace's session spends as the account
// root (the login: personal, work, ...) its worktree's path routes to, and
// what that login may run is the catalog the vendor last served a session on
// it (conversation.v1.ModelCatalog, kept by the daemon per login). This rpc
// answers that catalog for the login a create in the named repository would
// spend as, so a creation picker offers exactly those models and nothing else.
//
// THE ANSWER IS THE CREATE'S OWN CHECK. CreateWorkspace refuses a model this
// rpc would not offer (CreateWorkspaceError.model_not_in_catalog and
// .model_catalog_unknown), from the same login and the same stored catalog,
// so no client holds a copy of the list that could drift from the refusal.
//
// A READ. It records nothing and starts no session.

syntax = "proto3";

package agentrepl.v1;

import "workspace/v1/workspace.proto";
import "conversation/v1/api.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// The repository a create would be made in.
message ListCreationModelsRequest {
  // The repository, as the roster's repository section serves it. The login
  // is resolved from where this repository's new worktrees are made.
  workspace.v1.RepositoryRef repository = 1;
}

// THE ARM IS THE OUTCOME. error = the question could not be answered; a login
// that has no catalog yet is an ANSWER, carried in the success arm.
message ListCreationModelsResponse {
  // Whether the daemon answered the question at all.
  oneof result {
    // The daemon resolved the login and read what it knows of its models.
    ListCreationModelsSuccess success = 1;
    // The daemon could not resolve the repository.
    ListCreationModelsError error = 2;
  }
}

// What the daemon knows of the models the creating login may run.
message ListCreationModelsSuccess {
  // The account root (login) a create in the repository spends as, e.g.
  // "~/.claude" or "~/.claude-chesscom", so a picker can say whose models it
  // offers.
  string config_dir = 1;
  // THE ARM IS WHAT IS KNOWN: the login's catalog, or that no session on the
  // login has served one yet. The two are exclusive, and the options only
  // mean anything when a catalog is known.
  oneof catalog {
    // The catalog the last session on this login served.
    ListCreationModelsKnown known = 2;
    // No session on this login has ever served a catalog, so no model may be
    // named for a create on it; a create naming none still runs under the
    // daemon's default.
    ListCreationModelsUnknown unknown = 3;
  }
}

// The login's catalog.
message ListCreationModelsKnown {
  // The selectable models, in the vendor's order. A create's `model` is one
  // of these options' `model.name`, verbatim.
  repeated conversation.v1.ModelOption options = 1;
}

// No catalog has been recorded for the login.
message ListCreationModelsUnknown {}

// Validation failures (unset field, blank string) are Connect InvalidArgument,
// never an arm.
message ListCreationModelsError {
  // Why the question could not be answered.
  oneof cause {
    // No registered repository matches the ref.
    ListCreationModelsUnknownRepository unknown_repository = 1;
  }
}

// The repository ref matched no registered repository.
message ListCreationModelsUnknownRepository {}
