// endpoint_merge_workspace.proto — MergeWorkspace. SIDEBAR section. A
// workspace LANDS ITS OWN BRANCH: rebased, gated and landed in its own
// worktree by its own session, its feed held and the merge bubble pinned until
// the merge ends, and the workspace closed once the branch lands. Success means
// ENQUEUED; everything after rides the streams.
//
// THE REQUEST NAMES NO TARGET. Where a workspace lands was fixed when it was
// created (agentrepl.v1.WorkspaceTopology): the primary branch, or the
// workspace that owns the branch it was cut from. The daemon reads it from the
// workspace's own record, so no request can land work anywhere else.
//
// WHO MAY ASK. The workspace itself, the user, or -- for a child -- the
// workspace that owns its branch. A child whose context was not forked from its
// owner never lands itself: its owner arbitrates its work and lands it
// (`owner_lands`).
//
// Landing work that is not a workspace's own branch -- a subagent's branch, or
// one an agent cut by hand -- is an async merge
// (agentrepl.v1.CreateWorkspaceAsyncMerge), not this rpc.

syntax = "proto3";

package agentrepl.v1;

import "agentrepl/v1/family.proto";
import "agentrepl/v1/merge_version_increment.proto";
import "agentrepl/v1/workspace_topology.proto";
import "workspace/v1/workspace.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

message MergeWorkspaceRequest {
  // The workspace whose own branch lands.
  workspace.v1.WorkspaceRef workspace = 1;
  // Who asked: the workspace itself, its owner, or the user. Any other
  // workspace is refused (`requester_may_not_land`). REQUIRED.
  WorkspaceRequester requester = 5;
  // What concludes the workspace. REQUIRED: a request with no arm set is
  // refused as invalid.
  oneof mode {
    MergeWorkspaceOneShot one_shot = 2;
  }
  // A merge of a branch that is not the workspace's own is an async merge
  // (CreateWorkspaceAsyncMerge), so tag 3 holds nothing.
  reserved 3;
  reserved "async";
  // How this merge moves agent-repl's version, and its changelog line; see
  // merge_version_increment.proto for which merges must, may, and must not
  // carry one. Applied when the merge LANDS: the queue reads the highest
  // `MAJOR.MINOR.PATCH` tag reachable from the target's tip as it was before
  // the landing, so merges reordered in the queue still produce consecutive
  // versions.
  optional MergeWorkspaceVersionIncrement version_increment = 4;
  // Where the merge joins its queue. REQUIRED.
  MergeQueuePlacement placement = 6;
}

// SYNC, IN PLACE: the workspace's own branch, rebased, gated and landed in
// its own worktree by its own session, its feed held and the bubble pinned
// until the merge ends. The workspace CLOSES once the branch lands. A merge
// that fails never closes it: the feed is released and the failure is handed
// back to the workspace's conversation
// (conversation.v1.PromptOrigin.PROMPT_ORIGIN_MERGE_HANDBACK), and also to the
// requesting owner's when its owner asked.
message MergeWorkspaceOneShot {
  // What concludes the workspace. Exactly one is set.
  oneof landing {
    // The workspace's own branch, merged by the queue.
    MergeWorkspaceOneShotOwnBranch own_branch = 1;
    // The workspace's own branch, ALREADY MERGED UPSTREAM through its pull
    // request: the daemon updates the repository's default branch in its
    // main worktree from upstream and closes the workspace, merging nothing
    // itself. The caller asserts the upstream merge; the daemon does not
    // re-check it.
    MergeWorkspaceOneShotMergedUpstream merged_upstream = 2;
  }
}
// The workspace's own branch is merged. No fields: the branch is the
// workspace's own.
message MergeWorkspaceOneShotOwnBranch {}
// The workspace's own branch already landed upstream. No fields.
message MergeWorkspaceOneShotMergedUpstream {}

// THE ARM IS THE OUTCOME.
message MergeWorkspaceResponse {
  oneof result {
    MergeWorkspaceSuccess success = 1;
    MergeWorkspaceError error = 2;
  }
}

// Done; every visible effect arrives on the streams.
message MergeWorkspaceSuccess {}

// Arms derived from the daemon's refusal sites (landing 4, 2026-08-29).
// Validation failures (unset field, UNSPECIFIED enum, blank string) are Connect InvalidArgument, never an arm.
message MergeWorkspaceError {
  reserved 9, 10, 11, 12;
  reserved "unknown_one_shot_workspace", "unknown_branch", "name_taken", "branch_checked_out_in_requester";
  oneof cause {
    // The workspace id is not in the daemon's registry.
    MergeWorkspaceUnknownWorkspace unknown_workspace = 1;
    // The echoed dir disagrees with the registry's dir for this id.
    MergeWorkspaceWorkspaceRefMismatch workspace_ref_mismatch = 2;
    // This daemon released the workspace to a successor; dial `address`.
    MergeWorkspaceTransferringAway transferring_away = 3;
    // A joining daemon has not finished adopting this workspace yet.
    MergeWorkspaceNotYetAdopted not_yet_adopted = 4;
    // The daemon holds no layout facts for this workspace to merge with.
    MergeWorkspaceNoLayoutFacts no_layout_facts = 5;
    // The workspace's session has been deleted.
    MergeWorkspaceSessionDeleted session_deleted = 6;
    // This workspace's merge is already in the queue.
    MergeWorkspaceAlreadyQueued already_queued = 7;
    // This workspace's merge is already in flight.
    MergeWorkspaceAlreadyMerging already_merging = 8;
    // Tags 9-12 are RETIRED: a merge of a branch other than the workspace's
    // own is an async merge, and CreateWorkspaceError carries its refusals.
    // The merge lands on agent-repl's master, was asked for by an agent, and
    // carries no version increment. Nothing was recorded; the caller
    // re-sends with one.
    MergeWorkspaceVersionIncrementRequired version_increment_required = 13;
    // The merge carries a version increment but does not land on
    // agent-repl's master. Nothing was recorded; the caller re-sends
    // without one.
    MergeWorkspaceVersionIncrementUnexpected version_increment_unexpected = 14;
    // The workspace this merge would close (a one-shot's requester, or the
    // workspace an async merge's one-shot names) has open children, hidden
    // ones included. Every open child must be resolved and closed before a
    // merge that closes their parent is asked for.
    WorkspaceHasOpenChildren has_open_children = 15;
    // The workspace is a child whose context was not forked from its owner,
    // and only its owner (or the user) lands it. Nothing was recorded.
    MergeWorkspaceOwnerLands owner_lands = 16;
    // The requester is neither the workspace, nor its owner, nor the user.
    // Nothing was recorded.
    MergeWorkspaceRequesterMayNotLand requester_may_not_land = 17;
  }
}
message MergeWorkspaceUnknownWorkspace {}
message MergeWorkspaceWorkspaceRefMismatch {
  // The dir the registry holds for this id.
  string registry_dir = 1;
}
message MergeWorkspaceTransferringAway {
  // The successor's `127.0.0.1:<port>`, so a lagging client dials it.
  string address = 1;
}
message MergeWorkspaceNotYetAdopted {}
message MergeWorkspaceNoLayoutFacts {}
message MergeWorkspaceSessionDeleted {}
message MergeWorkspaceAlreadyQueued {}
message MergeWorkspaceAlreadyMerging {}
// Names the owner that lands this workspace.
message MergeWorkspaceOwnerLands {
  // The workspace whose branch this child was cut from, which arbitrates its
  // work and lands it.
  workspace.v1.WorkspaceRef owner = 1;
}
// The requester may not land this workspace. Empty: the request's own refs are
// the identities involved.
message MergeWorkspaceRequesterMayNotLand {}
