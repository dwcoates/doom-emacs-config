// endpoint_merge_workspace.proto — MergeWorkspace. SIDEBAR section.
// Enqueue a merge that RUNS IN the requesting workspace. Success means
// ENQUEUED — the merge's whole life from the queue onward is the requesting
// workspace's own: its feed's merge bubble, its footer's merging status, and
// its own session doing any conflict resolution and test fixing. No
// workspace is ever created for a merge. The merge targets the merged
// branch's parent by definition, and the daemon decides everything else.

syntax = "proto3";

package agentrepl.v1;

import "workspace/v1/workspace.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

message MergeWorkspaceRequest {
  // The REQUESTING workspace: the one the merge runs in, whose feed, footer
  // and session carry it from the queue to its end.
  workspace.v1.WorkspaceRef workspace = 1;
  // WHAT the requesting workspace merges. REQUIRED: a request with no arm
  // set is refused as invalid.
  MergeWorkspaceSource source = 2;
}

// What a merge lands. THE ARM IS THE SOURCE, and each arm decides where the
// rebase runs and what closes once the branch lands.
message MergeWorkspaceSource {
  // Exactly one is set.
  oneof source {
    // The requesting workspace's own branch, rebased and gated in its own
    // worktree.
    MergeWorkspaceSourceOwnBranch own_branch = 1;
    // Another open workspace's branch, rebased in THAT workspace's worktree
    // by the REQUESTING workspace's session. The other workspace is closed
    // once its branch lands; the requester is never closed by it.
    MergeWorkspaceSourceWorkspace workspace = 2;
    // A branch that is no workspace (a subagent's branch), rebased in the
    // branch's own worktree when one exists, else in a worktree the daemon
    // makes for it and removes afterwards. The requester is never closed by
    // it.
    MergeWorkspaceSourceBranch branch = 3;
    // The requesting workspace's own branch, ALREADY MERGED UPSTREAM through
    // its pull request: the daemon updates the repository's default branch
    // in its main worktree from upstream and closes the workspace, merging
    // nothing itself. The caller asserts the upstream merge; the daemon does
    // not re-check it.
    MergeWorkspaceSourceMergedUpstream merged_upstream = 4;
  }
}
// The requesting workspace's own branch.
message MergeWorkspaceSourceOwnBranch {
  // TRUE keeps the requesting workspace open once its branch lands, so it
  // can go on to further work and further merges; FALSE closes it on
  // landing. A failed merge never closes it either way.
  bool keep_open = 1;
}
// Another open workspace, named by its ref.
message MergeWorkspaceSourceWorkspace {
  // The workspace whose branch is merged. It must be open, in the same
  // repository as the requester, and not the requester itself.
  workspace.v1.WorkspaceRef ref = 1;
}
// A branch that is no workspace.
message MergeWorkspaceSourceBranch {
  // The branch's name in the requesting workspace's repository, as git
  // spells it ("agent-1a2b/fix-reconnect").
  string name = 1;
}
// The requesting workspace's own branch, already merged upstream. No
// fields: the branch and the repository are the requester's own.
message MergeWorkspaceSourceMergedUpstream {}

// THE ARM IS THE OUTCOME.
message MergeWorkspaceResponse {
  oneof result {
    MergeWorkspaceSuccess success = 1;
    MergeWorkspaceError error = 2;
  }
}

// Done; every visible effect arrives on the streams.
message MergeWorkspaceSuccess {}

// Arms derived from the daemon's refusal sites (landing 4, 2026-08-29).
// Validation failures (unset field, UNSPECIFIED enum, blank string) are Connect InvalidArgument, never an arm.
message MergeWorkspaceError {
  oneof cause {
    // The workspace id is not in the daemon's registry.
    MergeWorkspaceUnknownWorkspace unknown_workspace = 1;
    // The echoed dir disagrees with the registry's dir for this id.
    MergeWorkspaceWorkspaceRefMismatch workspace_ref_mismatch = 2;
    // This daemon released the workspace to a successor; dial `address`.
    MergeWorkspaceTransferringAway transferring_away = 3;
    // A joining daemon has not finished adopting this workspace yet.
    MergeWorkspaceNotYetAdopted not_yet_adopted = 4;
    // The daemon holds no layout facts for this workspace to merge with.
    MergeWorkspaceNoLayoutFacts no_layout_facts = 5;
    // The workspace's session has been deleted.
    MergeWorkspaceSessionDeleted session_deleted = 6;
    // This workspace's merge is already in the queue.
    MergeWorkspaceAlreadyQueued already_queued = 7;
    // This workspace's merge is already in flight.
    MergeWorkspaceAlreadyMerging already_merging = 8;
    // The source workspace is not open, is in another repository, or is the
    // requester itself.
    MergeWorkspaceUnknownSourceWorkspace unknown_source_workspace = 9;
    // The named branch does not exist in the requester's repository.
    MergeWorkspaceUnknownBranch unknown_branch = 10;
  }
}
message MergeWorkspaceUnknownWorkspace {}
message MergeWorkspaceWorkspaceRefMismatch {
  // The dir the registry holds for this id.
  string registry_dir = 1;
}
message MergeWorkspaceTransferringAway {
  // The successor's `127.0.0.1:<port>`, so a lagging client dials it.
  string address = 1;
}
message MergeWorkspaceNotYetAdopted {}
message MergeWorkspaceNoLayoutFacts {}
message MergeWorkspaceSessionDeleted {}
message MergeWorkspaceAlreadyQueued {}
message MergeWorkspaceAlreadyMerging {}
message MergeWorkspaceUnknownSourceWorkspace {}
message MergeWorkspaceUnknownBranch {}
