// endpoint_merge_workspace.proto — MergeWorkspace. SIDEBAR section.
// Enqueue a merge. Success means ENQUEUED. The merge's bubble is drawn in the
// requesting workspace's feed either way; WHERE its agentic work runs depends
// on the request:
//
//   - SYNC, the ONE-SHOT (`one_shot`): the merge's whole life is the
//     requesting workspace's own — its footer's merging status, its session
//     doing any conflict resolution and test fixing, and every prompt the
//     user sends held until the merge ends — and the workspace closes once
//     its branch lands. One workspace and one session are involved.
//   - ASYNC (`async`): the daemon forks the requesting workspace into a
//     HIDDEN MERGE WORKSPACE when the requesting turn ends — the conversation
//     forked, a worktree of its own on the named branch — and the merge runs
//     there. The requesting workspace is never held and never closed by it;
//     the merge workspace's turns stream into the bubble's agentic tabs in
//     the requester's feed; and the merge's outcome comes back into the
//     requester's conversation as a handback.
//
// The merge targets the merged branch's parent by definition, and the daemon
// decides everything else.

syntax = "proto3";

package agentrepl.v1;

import "workspace/v1/workspace.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

message MergeWorkspaceRequest {
  // The REQUESTING workspace: the one whose feed carries the merge's bubble
  // and whose conversation is told how the merge ended.
  workspace.v1.WorkspaceRef workspace = 1;
  // The merge's mode. REQUIRED: a request with no arm set is refused as
  // invalid. A sync merge exists only as a one-shot, because the only reason
  // to hold the requester's feed is to conclude the workspace once its branch
  // lands; every merge that leaves the requester working is async.
  oneof mode {
    MergeWorkspaceOneShot one_shot = 2;
    MergeWorkspaceAsync async = 3;
  }
  // How this merge moves agent-repl's version, and the changelog line it
  // lands with. A merge that lands on the default branch of the daemon's own
  // repository (agent-repl's master) and was asked for by an AGENT -- the
  // merge queue's command-file path the merge-queue skill uses -- must carry
  // it, and is refused as `version_increment_required` without it; a merge
  // the user asks for over this rpc may carry it, and lands untagged without
  // it. A request anywhere else WITH it -- another repository, a child
  // workspace merging into its parent, or a one-shot whose branch already
  // merged upstream -- is refused as `version_increment_unexpected`. The
  // increment is applied when the merge LANDS, not when it is requested: the
  // queue reads the highest `MAJOR.MINOR.PATCH` tag reachable from the
  // target's tip as it was before the landing, so merges reordered in the
  // queue still produce consecutive versions.
  optional MergeWorkspaceVersionIncrement version_increment = 4;
}

// One merge's move of agent-repl's version. The queue creates the version's
// annotated tag on the merge commit as part of the landing step itself, right
// after the target moves to it; a restart that finds the target already on
// the merge commit finishes that step, tag included, so a landed merge never
// stays without the tag it asked for. The tag is bare `MAJOR.MINOR.PATCH`,
// with no `v` prefix. A MAJOR increment is not offered: the major version
// moves only by a human tagging master by hand, as a judgment of the
// product's maturity rather than a marker of breaking change. A breaking
// change landed through the queue is a minor increment.
message MergeWorkspaceVersionIncrement {
  // Which part of the version moves. REQUIRED: unset is refused as invalid.
  oneof increment {
    MergeWorkspaceVersionIncrementMinor minor = 1;
    MergeWorkspaceVersionIncrementPatch patch = 2;
  }
  // One line for the changelog, in the voice of a release note ("Merges
  // record a version tag"). It becomes the annotation message of the
  // version's tag, which is where the changelog is read from. REQUIRED:
  // blank, or containing a newline, is refused as invalid.
  string changelog_line = 3;
}
// A new capability or a changed behavior, breaking or not: MINOR goes up by
// one and PATCH resets to zero.
message MergeWorkspaceVersionIncrementMinor {}
// A fix or internal change with no new capability: PATCH goes up by one.
message MergeWorkspaceVersionIncrementPatch {}

// SYNC, IN PLACE: the requester's own branch, rebased, gated and landed in
// its own worktree by its own session, its feed held and the bubble pinned
// until the merge ends. The requester CLOSES once the branch lands. A merge
// that fails never closes it: the feed is released and the failure is
// handed back to the requester's conversation
// (conversation.v1.PromptOrigin.PROMPT_ORIGIN_MERGE_HANDBACK).
message MergeWorkspaceOneShot {
  // What concludes the workspace. Exactly one is set.
  oneof landing {
    // The requester's own branch, merged by the queue.
    MergeWorkspaceOneShotOwnBranch own_branch = 1;
    // The requester's own branch, ALREADY MERGED UPSTREAM through its pull
    // request: the daemon updates the repository's default branch in its
    // main worktree from upstream and closes the workspace, merging nothing
    // itself. The caller asserts the upstream merge; the daemon does not
    // re-check it.
    MergeWorkspaceOneShotMergedUpstream merged_upstream = 2;
  }
}
// The requester's own branch is merged. No fields: the branch is the
// requester's own.
message MergeWorkspaceOneShotOwnBranch {}
// The requester's own branch already landed upstream. No fields.
message MergeWorkspaceOneShotMergedUpstream {}

// ASYNC: the merge runs in a hidden MERGE WORKSPACE the daemon forks from
// the requester's conversation when the requesting turn ends, so its agent
// knows the work. The requester is never held and never closed; the bubble
// is PLACED in its feed rather than pinned, the merge workspace's turns
// stream into the bubble's agentic tabs, and how the merge ended -- landed
// or failed -- is handed back to the requester's conversation
// (conversation.v1.PromptOrigin.PROMPT_ORIGIN_MERGE_HANDBACK). The merge
// workspace stays hidden until it needs the user: revealed when its merge
// fails, when its agent asks a permission or a question, when the user
// interrupts it from the bubble, or when the user selects it.
message MergeWorkspaceAsync {
  // The merge workspace's name, chosen by the calling agent: a short slug
  // naming what is merged ("reconnect-fix"). Prefixed and validated as a
  // supplied workspace name is, and RESERVED from acceptance until the
  // merge workspace exists; a taken name is refused as `name_taken` while
  // the calling turn still runs. REQUIRED: blank is refused as invalid.
  string name = 1;
  // The branch this merge lands, as git spells it in the requester's
  // repository. The merge workspace's worktree starts at its tip. REQUIRED:
  // blank is refused as invalid; a branch that does not exist is refused as
  // `unknown_branch`; a branch checked out in the requester's own worktree is
  // refused as `branch_checked_out_in_requester`, because the requester keeps
  // working on it while the merge rebases it. It names the merge, so several
  // async merges a requester sends in quick succession stay apart.
  string branch = 2;
  // How the merge workspace prepares `branch` before it joins the queue, in
  // free text written by the requesting agent: anything from "rebase onto the
  // target, dropping every commit the requester's branch shares with it" to
  // "fail the merge if you cannot tell which commits are the fix". The daemon
  // hands it to the merge workspace as its first turn, drawn as the bubble's
  // resolving tab (frontend.v1.FeedMergeTabResolving); the merge joins the
  // queue once that turn settles succeeded, and a failed turn fails the
  // merge. UNSET: `branch` lands as it is, with no resolving turn.
  optional string instruction = 3;
  // Another workspace to CLOSE once this merge lands -- typically the
  // workspace a child or subagent did the work in. An async merge never
  // closes its requester, which is still working. A merge that fails closes
  // nothing. UNSET: no workspace is closed.
  optional MergeWorkspaceAsyncOneShot one_shot = 4;
  // TRUE removes worktrees once the merge lands, to keep disk use bounded:
  // the merge workspace's own worktree, and the worktree that had `branch`
  // checked out when the request was accepted. Never removed: the requester's
  // worktree, the repository's main worktree, any registered workspace's
  // worktree, or a worktree with uncommitted changes (git's own refusal
  // stands and is logged). Branches are never deleted. A merge that fails
  // removes nothing.
  bool cleanup_worktree = 5;
  // TRUE compacts the REQUESTER's conversation once the branch lands, right
  // after the landed handback, through the prompt queue
  // (conversation.v1.PromptOrigin.PROMPT_ORIGIN_MERGE_COMPACT_AFTER). A merge
  // that fails compacts nothing.
  bool compact_after = 6;
}
// The workspace an async merge closes once it lands. It must be open, in the
// requester's repository, and not the requester itself; otherwise the request
// is refused as `unknown_one_shot_workspace`.
message MergeWorkspaceAsyncOneShot {
  // The workspace to close.
  workspace.v1.WorkspaceRef workspace = 1;
}

// THE ARM IS THE OUTCOME.
message MergeWorkspaceResponse {
  oneof result {
    MergeWorkspaceSuccess success = 1;
    MergeWorkspaceError error = 2;
  }
}

// Done; every visible effect arrives on the streams.
message MergeWorkspaceSuccess {}

// Arms derived from the daemon's refusal sites (landing 4, 2026-08-29).
// Validation failures (unset field, UNSPECIFIED enum, blank string) are Connect InvalidArgument, never an arm.
message MergeWorkspaceError {
  oneof cause {
    // The workspace id is not in the daemon's registry.
    MergeWorkspaceUnknownWorkspace unknown_workspace = 1;
    // The echoed dir disagrees with the registry's dir for this id.
    MergeWorkspaceWorkspaceRefMismatch workspace_ref_mismatch = 2;
    // This daemon released the workspace to a successor; dial `address`.
    MergeWorkspaceTransferringAway transferring_away = 3;
    // A joining daemon has not finished adopting this workspace yet.
    MergeWorkspaceNotYetAdopted not_yet_adopted = 4;
    // The daemon holds no layout facts for this workspace to merge with.
    MergeWorkspaceNoLayoutFacts no_layout_facts = 5;
    // The workspace's session has been deleted.
    MergeWorkspaceSessionDeleted session_deleted = 6;
    // This workspace's merge is already in the queue.
    MergeWorkspaceAlreadyQueued already_queued = 7;
    // This workspace's merge is already in flight.
    MergeWorkspaceAlreadyMerging already_merging = 8;
    // The async one-shot's workspace is not open, is in another repository,
    // or is the requester itself.
    MergeWorkspaceUnknownOneShotWorkspace unknown_one_shot_workspace = 9;
    // The named branch does not exist in the requester's repository.
    MergeWorkspaceUnknownBranch unknown_branch = 10;
    // The async merge's name is already a workspace, a branch, or another
    // pending async merge's reservation. Nothing was recorded; the caller
    // retries with another name.
    MergeWorkspaceNameTaken name_taken = 11;
    // The async merge's branch is checked out in the requester's own
    // worktree. Nothing was recorded; the caller names a branch the requester
    // is not working on.
    MergeWorkspaceBranchCheckedOutInRequester branch_checked_out_in_requester = 12;
    // The merge lands on agent-repl's master, was asked for by an agent, and
    // carries no version increment. Nothing was recorded; the caller
    // re-sends with one.
    MergeWorkspaceVersionIncrementRequired version_increment_required = 13;
    // The merge carries a version increment but does not land on
    // agent-repl's master. Nothing was recorded; the caller re-sends
    // without one.
    MergeWorkspaceVersionIncrementUnexpected version_increment_unexpected = 14;
  }
}
message MergeWorkspaceUnknownWorkspace {}
message MergeWorkspaceWorkspaceRefMismatch {
  // The dir the registry holds for this id.
  string registry_dir = 1;
}
message MergeWorkspaceTransferringAway {
  // The successor's `127.0.0.1:<port>`, so a lagging client dials it.
  string address = 1;
}
message MergeWorkspaceNotYetAdopted {}
message MergeWorkspaceNoLayoutFacts {}
message MergeWorkspaceSessionDeleted {}
message MergeWorkspaceAlreadyQueued {}
message MergeWorkspaceAlreadyMerging {}
// The async one-shot's workspace cannot be closed by this merge.
message MergeWorkspaceUnknownOneShotWorkspace {}
// The async merge's branch is the one the requester has checked out.
message MergeWorkspaceBranchCheckedOutInRequester {}
message MergeWorkspaceUnknownBranch {}
// The refused name, as the branch it resolves to once prefixed.
message MergeWorkspaceNameTaken {
  // The branch the name resolves to ("agent-1a2b/reconnect-fix").
  string branch = 1;
}
// The increment a merge onto agent-repl's master must carry is missing.
message MergeWorkspaceVersionIncrementRequired {}
// Why a supplied increment does not belong on this merge. Exactly one is set.
message MergeWorkspaceVersionIncrementUnexpected {
  oneof reason {
    // The merge's target is another repository than the daemon's own.
    MergeWorkspaceVersionIncrementUnexpectedForeignRepository foreign_repository = 1;
    // The merge's target is a parent workspace's checkout, not the default
    // branch.
    MergeWorkspaceVersionIncrementUnexpectedNotDefaultBranch not_default_branch = 2;
    // The one-shot's branch already merged upstream, so the queue lands
    // nothing and tags nothing.
    MergeWorkspaceVersionIncrementUnexpectedMergedUpstream merged_upstream = 3;
  }
}
// The target repository is not agent-repl's.
message MergeWorkspaceVersionIncrementUnexpectedForeignRepository {}
// The target is a parent workspace's checkout.
message MergeWorkspaceVersionIncrementUnexpectedNotDefaultBranch {}
// Nothing lands, so nothing is versioned.
message MergeWorkspaceVersionIncrementUnexpectedMergedUpstream {}
