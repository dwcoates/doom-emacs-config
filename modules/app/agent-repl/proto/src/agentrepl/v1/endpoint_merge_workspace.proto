// endpoint_merge_workspace.proto — the MergeWorkspace endpoint's request,
// success and error.
//
// ONE ENDPOINT PER FILE: MergeWorkspaceRequest, MergeWorkspaceResponse and the
// two answers it wraps, and nothing else, so the whole of what one method takes
// and returns is readable in one place. The `endpoint_` prefix is the grouping,
// not a directory — see DESIGN-protobuf-surfaces.md for why a directory is not
// available here, and for why a request type belongs to agentrepl.v1 rather
// than frontend.v1.

syntax = "proto3";

package agentrepl.v1;

import "agentrepl/v1/shared.proto";
import "frontend/v1/failure.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// Merge the workspace's branch into the target the daemon recorded when it
// created that workspace.
message MergeWorkspaceRequest {
  // Correlation. See agentrepl.v1.AgentRepl.
  string request_id = 1;
  // The workspace being merged, as its KEY — the session cwd. Its DISPLAY name
  // is `workspace_name` below, and the two are deliberately separate fields.
  // See agentrepl.v1.AgentRepl.
  string workspace = 2;
  // The workspace's DISPLAY name, for the `merge/<name>` completion tag and the
  // daemon's merge logs.
  //
  // It exists because the `workspace` field above is the daemon's workspace
  // KEY — the session cwd — exactly as it is for every other command. This
  // command used to put the bare Emacs name there instead, which
  // filed every merge state row under a workspace key nothing else used: the
  // row had no session identity, so its WorkspaceState reached Emacs with an
  // absent connectivity verdict and was refused, and the merge never tore its
  // workspace down. The two identities are now separate fields rather than one
  // slot meaning different things per command.
  string workspace_name = 3;

  // WHICH MERGE THIS IS, as arms rather than as a flag.
  //
  // It was `bool conflict_resolved_continue`, and the two values are not one
  // command with a switch: a START enqueues a new run and marks the workspace
  // enqueuing, while a RESUME continues a run that is ALREADY on the queue and
  // already holds its lease. The daemon branches on it before anything else it
  // does, because marking a live merge_conflict "enqueuing" walks it backwards
  // to the weakest phase on its own axis.
  //
  // An unset intent is refused rather than read as a start: a resume that
  // arrived without its arm would be enqueued a second time on top of the run
  // it was meant to continue.
  //
  // THE COMMAND STATES NO MERGE GEOMETRY AND NAMES NO HANDLER on either arm,
  // and that is deliberate. THE DAEMON OWNS THE GEOMETRY MAP
  // (internal/workspace/geometry). It records a workspace's source branch,
  // source worktree and merge target when it CREATES the workspace, and derives
  // them at boot for pre-cutover ones, so a merge command has nothing left to
  // state. A caller that stated it would be a SECOND OWNER of one map, which is
  // how a cherry-pick once reached a target the daemon had never heard of. Nor
  // does the command select a handler: there has only ever been one merge
  // handler, and naming it would invite a caller to ask for a mechanism the
  // daemon does not dispatch on.
  oneof intent {
    // Enqueue a new merge run for this workspace.
    MergeWorkspaceStart start = 4;
    // Continue the run that is parked on a conflict the user has now resolved.
    MergeWorkspaceResumeAfterConflict resume_after_conflict = 5;
  }
}

// Start a merge. Being set asserts that this workspace has no run of its own in
// flight to continue, which is what lets the daemon mark it enqueuing.
message MergeWorkspaceStart {}

// The resolve-and-continue handoff. Being set asserts that a run of this
// workspace's is parked on a conflict and holds its lease, so the daemon
// resumes it rather than enqueuing beside it.
message MergeWorkspaceResumeAfterConflict {}

// MergeWorkspace's answer: exactly one of a success and an error.
//
// TWO ARMS, NOT AN `ok` BIT PLUS AN OPTIONAL FAILURE — see
// AcceptQueueEntryResponse for the whole of that argument.
message MergeWorkspaceResponse {
  // Echoed from the request that produced this answer. See
  // AcceptQueueEntryResponse.request_id.
  string request_id = 1;
  oneof response {
    MergeWorkspaceSuccess success = 2;
    MergeWorkspaceError error = 3;
  }
}

// The merge is on the queue, or its parked run is resuming.
//
// NO ARMS, AND NO POSITION. The merge's own progress — including where it sits
// in the queue and how that changes as heads complete — is pushed as
// MergeStatus and MergeQueueRoster. An admission-time position stated here
// would be stale before the caller rendered it, which is exactly why
// MergeQueueRoster is assembled under the queue's own lock rather than derived
// from per-run enqueued positions.
message MergeWorkspaceSuccess {}

// Why the merge was refused.
//
// EVERY ARM BELOW IS ALSO ON THE WORKSPACE'S MERGE AXIS. The first thing a
// merge attempt does is BECOME VISIBLE — the enqueuing mark is written before
// the geometry is resolved and before the coordinator is asked for anything —
// so a refusal here is accompanied by a durable failed phase rather than
// leaving the user with a command that vanished from every UI.
message MergeWorkspaceError {
  oneof error {
    // The request states no intent, so the daemon cannot tell a start from a
    // resume.
    RefusalRequiredFieldMissing required_field_missing = 1;
    // The daemon's merge-geometry record is not wired.
    RefusalDependencyUnwired merge_geometry_unwired = 2;
    // The geometry record could not be read.
    RefusalMergeGeometryUnreadable geometry_unreadable = 3;
    // The workspace has no recorded merge geometry, and it is never guessed at.
    RefusalMergeGeometryUnrecorded geometry_unrecorded = 4;
    // The daemon's merge state sink is not wired, so the attempt cannot be made
    // visible before it runs.
    RefusalDependencyUnwired merge_states_unwired = 5;
    // A merge phase could not be written to the daemon's durable merge state.
    RefusalMergeStateUnrecordable state_unrecordable = 6;
    // The merge coordinator refused to enqueue the run.
    RefusalMergeEnqueueRejected enqueue_rejected = 7;
    // The merge was refused for a reason the daemon's classifier could not
    // name.
    frontend.v1.FailureInternalUnclassified unclassified = 8;
  }
  // The feed card this refusal was filed under, when it produced one. See
  // AcceptQueueEntryError.failure_card.
  frontend.v1.FailureCardRef failure_card = 9;
}
