// feed_token.proto — the feed watch token: shared by OpenFeed (which mints
// it) and WatchFeed (which echoes it). A shared-package file because more
// than one endpoint needs it, per the service file model.

syntax = "proto3";

package agentrepl.v1;

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// The address of ONE feed's tail, minted by OpenFeed and echoed verbatim by
// WatchFeed. Opaque: a hash-like value naming the opened feed AND pinning
// the tail to begin exactly after the page the open answered with, so a
// client cannot watch a feed it never opened and the page/tail seam cannot
// gap or overlap. Daemon-owned; never parsed, never constructed.
message FeedWatchToken {
  // The opaque value.
  string value = 1;
}
