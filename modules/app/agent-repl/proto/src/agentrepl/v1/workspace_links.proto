// workspace_links.proto — A WORKSPACE'S LINKS AS AN AGENT READS THEM: every
// link an agent stored for the workspace's task, each with its short label,
// and which of them the topbar's summary menu shows. Shared by
// ChangeWorkspaceLinks's answer and WorkspaceStatus, so the answer to a change
// and a later read describe the links identically.
//
// UNLIMITED STORAGE, A CAPPED MENU. A workspace holds any number of links, but
// the summary's menu shows at most five of them. While the menu has room, a newly set link is shown; once it is full,
// a new link is stored unshown, the answer's `menu` is `full`, and the agent
// chooses which links the menu shows (ChangeWorkspaceLinksShow), most relevant
// first to the developer working with the agent and to the stakeholders the
// developer reports the work to.
//
// OWNED OR REFERENCED. Every link says whether the workspace's work MADE the
// thing it points at (a pull request it opened, a doc it wrote) or only
// points at something that exists apart from it (the thread it was asked in,
// a ticket, a dashboard). The daemon follows an owned pull request for the
// workspace.
//
// AN OWNED LINK MAY ANNOUNCE ANOTHER. A post the workspace's work made (a
// Slack message telling its originating thread a pull request was created)
// names the link it announces (WorkspaceLinkAnnouncement), so a hook finds the
// announcing post from the stored links alone: the built-in post-deploy hook
// of an emoji-ack workspace reacts `:merged:` on every post announcing a pull
// request that merged (repoconfig.v1.LifecycleConfig).

syntax = "proto3";

package agentrepl.v1;

import "agentrepl/v1/pull_request.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// Every link a workspace holds, and the standing of its summary menu.
message WorkspaceLinks {
  // Every stored link, MOST RECENTLY SET FIRST: setting a link that is
  // already stored (a relabel) moves it to the front. Shown and unshown links
  // alike; each one's `placement` says which. Empty while the workspace has
  // no links.
  repeated WorkspaceLink links = 1;
  // Whether the menu can take another link, which is how an agent learns the
  // cap was reached.
  WorkspaceLinksMenu menu = 2;
}

// One stored link.
message WorkspaceLink {
  // The absolute http or https url, verbatim as the agent set it; the key a
  // relabel, a removal or a show names it by.
  string url = 1;
  // The agent's label for it, two to eight words in one sentence, which the
  // menu draws as the link's text.
  string label = 2;
  // Whether the summary's menu shows this link.
  WorkspaceLinkPlacement placement = 3;
  // Whether the workspace's work made what the link points at.
  WorkspaceLinkOwnership ownership = 4;
}

// Whether a workspace's work made what a link points at. THE ARM IS THE
// OWNERSHIP. A link stored before links carried ownership reads `reference`.
message WorkspaceLinkOwnership {
  oneof ownership {
    // The workspace's work made it: a pull request it opened, a branch it
    // pushed, a doc or a ticket it wrote, a Slack post it made. The daemon
    // follows an owned pull request for the workspace.
    WorkspaceLinkOwned owned = 1;
    // It exists apart from the workspace's work, which only points at it: the
    // thread or ticket the task came from, a design doc it read, a dashboard.
    WorkspaceLinkReference reference = 2;
  }
}

// The workspace's work made it.
message WorkspaceLinkOwned {
  // Whether the daemon follows what the link points at: an owned GitHub pull
  // request is followed for every activity kind (SubscribePullRequest's
  // notices). Set on every answer; ignored on a request, where only the arm
  // is read.
  optional WorkspaceLinkOwnedFollow follow = 1;
  // The stored link this one announces: a Slack post saying a pull request
  // was created names that pull request's link. UNSET for a link that
  // announces nothing. On a request, the url must be a link the workspace
  // already holds (ChangeWorkspaceLinksError.unknown_announced_link
  // otherwise); a relabel sets it anew, and removing the announced link
  // leaves the announcement naming the url it was set with.
  optional WorkspaceLinkAnnouncement announces = 2;
}

// The link an owned link announces.
message WorkspaceLinkAnnouncement {
  // The announced link's url, exactly as it was stored.
  string url = 1;
}

// The workspace's work only points at it. DELIBERATELY EMPTY: the arm is the
// ownership.
message WorkspaceLinkReference {}

// Whether the summary's menu shows a link. THE ARM IS THE PLACEMENT.
message WorkspaceLinkPlacement {
  oneof placement {
    // The menu shows the link.
    WorkspaceLinkPlacementShown shown = 1;
    // The link is stored, and the menu leaves it out: the menu was full when
    // it was set, or the agent's last show named other links.
    WorkspaceLinkPlacementUnshown unshown = 2;
  }
}

// The menu shows the link. DELIBERATELY EMPTY: the arm is the placement.
message WorkspaceLinkPlacementShown {}

// The menu leaves the link out. DELIBERATELY EMPTY: the arm is the placement.
message WorkspaceLinkPlacementUnshown {}

// The summary menu's standing against its cap. THE ARM IS THE STANDING.
message WorkspaceLinksMenu {
  oneof standing {
    // The menu shows fewer links than the cap, so the next new link is shown.
    WorkspaceLinksMenuRoom room = 1;
    // The menu shows as many links as the cap allows, so the next new link is
    // stored unshown. While any link is unshown, the agent chooses which
    // links the menu shows (ChangeWorkspaceLinksShow).
    WorkspaceLinksMenuFull full = 2;
  }
}

// The menu has room.
message WorkspaceLinksMenuRoom {
  // How many more links the menu can show; at least one.
  uint32 free = 1;
}

// The menu is full.
message WorkspaceLinksMenuFull {
  // How many links the menu shows: the cap, five.
  uint32 limit = 1;
  // How many stored links the menu leaves out; zero when every stored link is
  // shown.
  uint32 unshown = 2;
}

// ---- Follow: how the daemon follows an owned link ----

// Whether the daemon follows an owned link. THE ARM IS THE STANDING.
message WorkspaceLinkOwnedFollow {
  oneof standing {
    // The link is a GitHub pull request the workspace is subscribed to
    // (PullRequestSubscriptionOriginOwnedLink).
    WorkspaceLinkOwnedFollowFollowing following = 1;
    // The pull request merged or closed, and its subscription ended.
    WorkspaceLinkOwnedFollowEnded ended = 2;
    // The subscription was ended by UnsubscribePullRequest while the link
    // stayed owned. Setting the link owned again re-subscribes it.
    WorkspaceLinkOwnedFollowUnsubscribed unsubscribed = 3;
    // The url is no resource the daemon follows (not a github.com pull
    // request), so owning it changes nothing the daemon does.
    WorkspaceLinkOwnedFollowNotFollowable not_followable = 4;
  }
}

// Followed.
message WorkspaceLinkOwnedFollowFollowing {
  // The subscription, with its health.
  PullRequestSubscription subscription = 1;
}

// Ended with its pull request.
message WorkspaceLinkOwnedFollowEnded {
  // How the pull request ended: its merged or closed state.
  PullRequestState state = 1;
}

// Unsubscribed by request. DELIBERATELY EMPTY: the arm is the standing.
message WorkspaceLinkOwnedFollowUnsubscribed {}

// Nothing to follow. DELIBERATELY EMPTY: the arm is the standing.
message WorkspaceLinkOwnedFollowNotFollowable {}
