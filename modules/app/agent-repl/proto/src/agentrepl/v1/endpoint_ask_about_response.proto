// endpoint_ask_about_response.proto — AskAboutResponse: toggle a question
// about one card of the feed. FEED section.
//
// THE DAEMON IS THE ONLY HOLDER of a workspace's question. Every card the
// feed draws carries a question-mark control (a final response's sits beside
// its copy control; owner request, 2026-11-09, extended it from final
// responses to every card); a click on it asks the daemon to toggle the
// question about that card. While a question is held, the next prompt the
// user sends is NOT a turn of this workspace: the daemon sends the card,
// quoted, followed by the user's words, to the home repository's MAIN
// workspace as an agent-to-agent prompt from this one, answers the submission
// `question_sent`, and ends the question. The main workspace acknowledges this
// workspace, then answers the question or dispatches the change it asks for.
//
// A CARD IS QUOTED BY ONE RULE: a bubble with text (a prompt, a landed
// response) by its markdown, and every other card by the daemon-resolved row
// the feed drew it from, as JSON. So a card kind added later is quotable with
// no rule of its own.
//
// The question's state is pushed to the webapp on the root feed's watch
// (frontend.v1.FeedResponseQuestion), which draws the asked card's
// control pressed, and to Emacs on the host workspace watch
// (HostWorkspaceResponseQuestion), which sets the composer's draft aside
// while the question stands and puts it back when the question is withdrawn.

syntax = "proto3";

package agentrepl.v1;

import "frontend/v1/feed.proto";
import "workspace/v1/workspace.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// Toggle the workspace's question about one card.
//
// THE DAEMON COMPUTES THE TOGGLE, never the client: naming the card the
// question is already about withdraws it, and naming any other card asks
// about that one instead (the question moves). A client therefore sends
// the row it clicked and draws whatever the push says, so two clients clicking
// at once can never leave the drawn state and the held state disagreeing.
message AskAboutResponseRequest {
  // The workspace the card is in.
  workspace.v1.WorkspaceRef workspace = 1;
  // The card's row, on the workspace's root feed or on any of its sub-feeds
  // (a subagent's, a merge's, a shell's), as the card the reader clicked
  // carries it.
  frontend.v1.FeedId row = 2;
}

// THE ARM IS THE OUTCOME.
message AskAboutResponseResponse {
  // Success or the refusal; exactly one is set.
  oneof result {
    AskAboutResponseSuccess success = 1;
    AskAboutResponseError error = 2;
  }
}

// The toggle was applied; the set arm says which way it went.
message AskAboutResponseSuccess {
  // What the workspace's question is now. The same fact is pushed to every
  // client on its own channel, so a caller needs this answer only for its log.
  oneof state {
    // A question about the named card now stands: none stood before, or
    // one about another card moved here.
    AskAboutResponseAsking asking = 1;
    // The question about the named card was withdrawn; none stands now.
    AskAboutResponseWithdrawn withdrawn = 2;
  }
}

// A question about this card stands.
message AskAboutResponseAsking {
  // The card the question is about, echoed from the request.
  frontend.v1.FeedId row = 1;
}

// No question stands: the click named the card the question was about.
message AskAboutResponseWithdrawn {}

// Why the request was refused. Validation failures (an unset field) are
// Connect InvalidArgument, never an arm.
message AskAboutResponseError {
  // The cause of the refusal.
  oneof cause {
    // The workspace id is not in the daemon's registry.
    AskAboutResponseUnknownWorkspace unknown_workspace = 1;
    // The echoed dir disagrees with the registry's dir for this id.
    AskAboutResponseWorkspaceRefMismatch workspace_ref_mismatch = 2;
    // This daemon released the workspace to a successor; dial `address`.
    AskAboutResponseTransferringAway transferring_away = 3;
    // A joining daemon has not finished adopting this workspace yet.
    AskAboutResponseNotYetAdopted not_yet_adopted = 4;
    // The row is no card on any of the workspace's feeds, so there is
    // nothing to ask about. The question held before the request, if any, is
    // left as it was.
    AskAboutResponseNotACard not_a_card = 5;
  }
}

// The workspace id is not in the daemon's registry.
message AskAboutResponseUnknownWorkspace {}

// The echoed dir disagrees with the registry's dir for this id.
message AskAboutResponseWorkspaceRefMismatch {
  // The dir the registry holds for this id.
  string registry_dir = 1;
}

// This daemon released the workspace to a successor; dial `address`.
message AskAboutResponseTransferringAway {
  // The successor's `127.0.0.1:<port>`, so a lagging client dials it.
  string address = 1;
}

// A joining daemon has not finished adopting this workspace yet.
message AskAboutResponseNotYetAdopted {
  // The `127.0.0.1:<port>` of the daemon that serves this workspace until the
  // joining daemon adopts it: the handover's incumbent. A client views and
  // acts on the workspace there in the meantime, and the incumbent's later
  // `transferred` push re-homes it. UNSET when no live daemon serves the
  // workspace (a takeover after the incumbent died), in which case the client
  // waits for the adoption.
  optional string address = 1;
}

// The row is no card on any of the workspace's feeds.
message AskAboutResponseNotACard {}
