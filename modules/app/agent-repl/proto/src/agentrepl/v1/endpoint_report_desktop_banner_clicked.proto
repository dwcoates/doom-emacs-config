// endpoint_report_desktop_banner_clicked.proto — ReportDesktopBannerClicked:
// the user clicked a desktop banner the notifier app posted. DESKTOP NOTIFIER
// section.
//
// The app calls it from the click, having already brought Emacs forward (the
// click is the one moment macOS lets one application activate another). The
// daemon then does what any banner click does: it lets go of every banner it
// holds and tells Emacs, on its host stream, to select the clicked workspace
// (WatchHostWorkspaceResponse.notification_clicked).
//
// A click may land long after its banner was posted, and on a daemon that
// never posted it: the token names a workspace, not a post, so it is served by
// whichever daemon is advertised when the click happens.

syntax = "proto3";

package agentrepl.v1;

import "agentrepl/v1/desktop_banner.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

message ReportDesktopBannerClickedRequest {
  // The clicked banner's token, exactly as WatchDesktopBanners handed it.
  // REQUIRED.
  DesktopBannerClickToken click = 1;
}

// THE ARM IS THE OUTCOME.
message ReportDesktopBannerClickedResponse {
  oneof result {
    ReportDesktopBannerClickedSuccess success = 1;
    ReportDesktopBannerClickedError error = 2;
  }
}

// Emacs was told to select the clicked workspace.
message ReportDesktopBannerClickedSuccess {}

// Validation failures (an unset field) are Connect InvalidArgument, never an
// arm.
message ReportDesktopBannerClickedError {
  // Why the click selected nothing.
  oneof cause {
    // The token's workspace is not in the daemon's registry (it was
    // forgotten since the banner was posted).
    ReportDesktopBannerClickedUnknownWorkspace unknown_workspace = 1;
  }
}

// The clicked banner's workspace is not in the daemon's registry.
message ReportDesktopBannerClickedUnknownWorkspace {}
