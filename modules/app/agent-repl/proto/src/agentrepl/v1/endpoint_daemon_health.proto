// endpoint_daemon_health.proto — the DaemonHealth endpoint's request, success
// and error.
//
// ONE ENDPOINT PER FILE: DaemonHealthRequest, DaemonHealthResponse and the two
// answers it wraps, and nothing else, so the whole of what one method takes and
// returns is readable in one place. The `endpoint_` prefix is the grouping, not
// a directory — see DESIGN-protobuf-surfaces.md for why a directory is not
// available here, and for why a request type belongs to agentrepl.v1 rather
// than frontend.v1.

syntax = "proto3";

package agentrepl.v1;

import "agentrepl/v1/shared.proto";
import "frontend/v1/failure.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// Ask the daemon to assert that every boot-critical global dependency is
// operational.  The matching DaemonHealthView, not socket existence, is the
// success criterion.  It is a frontend command because no vendor produces or
// consumes this daemon-local fact.
message DaemonHealthRequest {
  // Correlation. The DaemonHealthView pushed in answer echoes this id, which is
  // how Emacs knows the verdict is the one it asked for.
  string request_id = 1;
  // WHICH SUBSCRIBE STREAM the DaemonHealthView should be pushed down. See
  // agentrepl.v1.SubscribeRequest.client_id. Daemon-global otherwise: no
  // workspace.
  string client_id = 2;
}

// DaemonHealth's answer: exactly one of a success and an error.
//
// TWO ARMS, NOT AN `ok` BIT PLUS AN OPTIONAL FAILURE — see
// AcceptQueueEntryResponse for the whole of that argument.
message DaemonHealthResponse {
  // Echoed from the request that produced this answer. See
  // AcceptQueueEntryResponse.request_id.
  string request_id = 1;
  oneof response {
    DaemonHealthSuccess success = 2;
    DaemonHealthError error = 3;
  }
}

// The check ran.
//
// NO ARMS, AND NO VERDICT — AND THAT IS THE WHOLE POINT. This answer is ONLY a
// receipt. A false health answer is a COMPLETED CHECK, not a command failure:
// the assertion Emacs actually waits on is the DaemonHealthView pushed to the
// caller's stream, which is why the request names its client_id. Putting the
// verdict here as well would give a caller two places to read it from and one
// chance to read the stale one.
message DaemonHealthSuccess {}

// Why the check could not be run.
//
// TWO DERIVED ARMS. An unhealthy daemon is NOT among them — that is a verdict,
// and it travels on the view.
message DaemonHealthError {
  oneof error {
    // The request carries no request_id, so the pushed view could not be
    // correlated to it and the caller could never recognize its own answer.
    RefusalRequiredFieldMissing required_field_missing = 1;
    // No daemon health checker is wired, so nothing can make the assertion.
    RefusalDependencyUnwired daemon_health_unwired = 2;
    // The check failed for a reason the daemon's classifier could not name.
    frontend.v1.FailureInternalUnclassified unclassified = 3;
  }
  // The feed card this refusal was filed under, when it produced one. See
  // AcceptQueueEntryError.failure_card.
  frontend.v1.FailureCardRef failure_card = 4;
}
