// endpoint_get_feed_page.proto — GetFeedPage: the older-pages walk of ONE
// feed. FEED section. The first page of a feed is OpenFeed's answer; this
// verb walks the pages beyond it into the past.
//
// THE WALK IS NAMED, ITS POSITION IS THE DAEMON'S. Every opening (OpenFeed,
// GetFeedPage `first`) mints a walk and answers its identity on the page's
// `has_more`; `next` echoes that identity and continues older from where the
// walk stands. A `next` naming a walk the daemon does not hold is a refusal,
// not an empty page. The walk was once keyed by the CONNECTION, but a webview
// spreads its requests over several connections, so an `older` click often
// arrived on a connection with no walk and was refused (owner's report,
// 2026-10-03).
//
// A PAGE IS THE STORE'S PAGE (50 entries, the one size for the whole stack),
// drawn as however many rows those entries make. The daemon holds only the
// pages some reader asked for: a `next` past what it holds is fetched on the
// spot (daemon → shim ReadHistory → store), never preloaded. A row whose
// starting entry lies on a page not yet loaded is not drawn until that page
// is.

syntax = "proto3";

package agentrepl.v1;

import "workspace/v1/workspace.proto";
import "frontend/v1/feed.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

message GetFeedPageRequest {
  workspace.v1.WorkspaceRef workspace = 1;
  // WHICH feed. UNSET = the workspace's root feed; SET = a sub-feed's
  // address (a subagent bubble row's own FeedId), echoed as served.
  optional frontend.v1.FeedId feed = 2;
  // WHICH page of the walk. THE ARM IS THE ASK.
  oneof page {
    // The newest page; the walk resets to it.
    GetFeedPageFirst first = 3;
    // The next-older page from where this feed's walk stands.
    GetFeedPageNext next = 4;
  }
}
message GetFeedPageFirst {}
message GetFeedPageNext {
  // The walk to continue: the `has_more.walk` of the page it last served.
  // REQUIRED; unset or unknown is `no_walk_standing`.
  frontend.v1.FeedWalkId walk = 1;
}

// THE ARM IS THE OUTCOME. Two error layers exist ON PURPOSE: this response's
// error = the request could not be served (unknown workspace or container, a
// next with no walk); the page's own error (frontend.v1.FeedPageError) = the
// page was served but the history has a hole. Distinct facts.
message GetFeedPageResponse {
  oneof result {
    // The page — FeedPage carries its own success/error split, so the
    // response's success IS the page.
    frontend.v1.FeedPage success = 1;
    GetFeedPageError error = 2;
  }
}

// Arms derived from the daemon's refusal sites (landing 4, 2026-08-29).
// Validation failures (unset field, UNSPECIFIED enum, blank string) are Connect InvalidArgument, never an arm.
message GetFeedPageError {
  oneof cause {
    // The workspace id is not in the daemon's registry.
    GetFeedPageUnknownWorkspace unknown_workspace = 1;
    // The echoed dir disagrees with the registry's dir for this id.
    GetFeedPageWorkspaceRefMismatch workspace_ref_mismatch = 2;
    // This daemon released the workspace to a successor; dial `address`.
    GetFeedPageTransferringAway transferring_away = 3;
    // A joining daemon has not finished adopting this workspace yet.
    GetFeedPageNotYetAdopted not_yet_adopted = 4;
    // A next page named a walk the daemon does not hold (never minted, or
    // dropped as one of the feed's least recently used walks).
    GetFeedPageNoWalkStanding no_walk_standing = 5;
    // The FeedId does not decode.
    GetFeedPageFeedUndecodable feed_undecodable = 6;
    // The FeedId decodes to another workspace.
    GetFeedPageFeedNotInWorkspace feed_not_in_workspace = 7;
  }
}
message GetFeedPageUnknownWorkspace {}
message GetFeedPageWorkspaceRefMismatch {
  // The dir the registry holds for this id.
  string registry_dir = 1;
}
message GetFeedPageTransferringAway {
  // The successor's `127.0.0.1:<port>`, so a lagging client dials it.
  string address = 1;
}
message GetFeedPageNotYetAdopted {}
message GetFeedPageNoWalkStanding {}
message GetFeedPageFeedUndecodable {}
message GetFeedPageFeedNotInWorkspace {}
