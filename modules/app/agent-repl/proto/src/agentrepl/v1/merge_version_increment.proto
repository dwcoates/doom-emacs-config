// merge_version_increment.proto — how a deploy into a VERSIONED repository
// moves its version, and the refusals about it. Shared by every way a deploy is
// asked for: a workspace finishing (FinishWorkspace) and an async merge
// (CreateWorkspaceAsyncMerge).
//
// WHICH DEPLOYS CARRY ONE. A repository is versioned when its deploy config
// (repoconfig.v1.DeployLocalMerge.version_tag) says so. A deploy that lands on
// such a repository's main branch, in its main worktree, and was asked for by a
// workspace's agent must carry an increment, and is refused as
// `version_increment_required` without it; one the user asks for may carry it
// and lands untagged without it. A deploy anywhere else WITH one -- an
// unversioned repository, or a child landing into its parent's worktree -- is
// refused as `version_increment_unexpected`.

syntax = "proto3";

package agentrepl.v1;

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// One merge's move of agent-repl's version. The queue creates the version's
// annotated tag on the merge commit as part of the landing step itself, right
// after the target moves to it; a restart that finds the target already on
// the merge commit finishes that step, tag included, so a landed merge never
// stays without the tag it asked for. The tag is bare `MAJOR.MINOR.PATCH`,
// with no `v` prefix. A MAJOR increment is not offered: the major version
// moves only by a human tagging master by hand, as a judgment of the
// product's maturity rather than a marker of breaking change. A breaking
// change landed through the queue is a minor increment.
message MergeWorkspaceVersionIncrement {
  // Which part of the version moves. REQUIRED: unset is refused as invalid.
  oneof increment {
    MergeWorkspaceVersionIncrementMinor minor = 1;
    MergeWorkspaceVersionIncrementPatch patch = 2;
  }
  // One line for the changelog, in the voice of a release note ("Merges
  // record a version tag"). It becomes the annotation message of the
  // version's tag, which is where the changelog is read from. REQUIRED:
  // blank, or containing a newline, is refused as invalid.
  string changelog_line = 3;
}
// A new capability or a changed behavior, breaking or not: MINOR goes up by
// one and PATCH resets to zero.
message MergeWorkspaceVersionIncrementMinor {}
// A fix or internal change with no new capability: PATCH goes up by one.
message MergeWorkspaceVersionIncrementPatch {}

// The increment a merge onto agent-repl's master must carry is missing.
message MergeWorkspaceVersionIncrementRequired {}
// Why a supplied increment does not belong on this merge. Exactly one is set.
message MergeWorkspaceVersionIncrementUnexpected {
  oneof reason {
    // The target repository's deploy config versions nothing: it has no local
    // merge, or its local merge has no `version_tag`.
    MergeWorkspaceVersionIncrementUnexpectedUnversionedRepository unversioned_repository = 1;
    // The deploy's target is a parent workspace's checkout, not the
    // repository's main branch.
    MergeWorkspaceVersionIncrementUnexpectedNotDefaultBranch not_default_branch = 2;
  }
  // Tag 3 (`merged_upstream`, a one-shot whose branch already merged upstream)
  // is RETIRED: finishing a workspace always runs its repository's deploy.
  reserved 3;
  reserved "merged_upstream";
}
// The target repository's deploy config versions nothing.
message MergeWorkspaceVersionIncrementUnexpectedUnversionedRepository {}
// The target is a parent workspace's checkout.
message MergeWorkspaceVersionIncrementUnexpectedNotDefaultBranch {}
