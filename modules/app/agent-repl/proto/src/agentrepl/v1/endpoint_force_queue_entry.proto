// endpoint_force_queue_entry.proto — the ForceQueueEntry endpoint's request,
// success and error.
//
// ONE ENDPOINT PER FILE: ForceQueueEntryRequest, ForceQueueEntryResponse and
// the two answers it wraps, and nothing else, so the whole of what one method
// takes and returns is readable in one place. The `endpoint_` prefix is the
// grouping, not a directory — see DESIGN-protobuf-surfaces.md for why a
// directory is not available here, and for why a request type belongs to
// agentrepl.v1 rather than frontend.v1.

syntax = "proto3";

package agentrepl.v1;

import "agentrepl/v1/shared.proto";
import "frontend/v1/failure.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// Deliver this entry NOW — the user overriding the classifier, or not waiting
// for it. Runs exactly the same interject sequence an INTERJECT verdict does.
message ForceQueueEntryRequest {
  // Correlation. See agentrepl.v1.AgentRepl.
  string request_id = 1;
  // The workspace whose queue holds the entry. The queue is per-workspace, so
  // an entry id alone does not address one. See agentrepl.v1.AgentRepl.
  string workspace = 2;
  // Which held entry is being forced through.
  string entry_id = 3;
}

// ForceQueueEntry's answer: exactly one of a success and an error.
//
// TWO ARMS, NOT AN `ok` BIT PLUS AN OPTIONAL FAILURE — see
// AcceptQueueEntryResponse for the whole of that argument.
message ForceQueueEntryResponse {
  // Echoed from the request that produced this answer. See
  // AcceptQueueEntryResponse.request_id.
  string request_id = 1;
  oneof response {
    ForceQueueEntrySuccess success = 2;
    ForceQueueEntryError error = 3;
  }
}

// The interject sequence ran for this entry.
//
// NO ARMS, AND NO FIELDS. The forced entry's delivery is observed as the queue
// view changing on the stream, not as a value here.
message ForceQueueEntrySuccess {}

// Why the force was refused.
//
// THE THREE QUEUE-HOLD REFUSALS BELOW ARE THE POINT OF THIS ARM SET. A force is
// exactly the command whose refusal a user needs an account of — they pressed a
// control that says "now" and it did not happen — and each of the three names
// something specific the entry is stuck behind rather than a generic decline.
message ForceQueueEntryError {
  oneof error {
    // This daemon has no prompt queue wired.
    RefusalDependencyUnwired queue_unwired = 1;
    // No entry with this id is on the workspace's queue.
    RefusalQueueEntryUnknown entry_unknown = 2;
    // The entry has no attached agent process yet, so it cannot run.
    FailureQueueEntryUnwired entry_session_unwired = 3;
    // The entry is waiting on a cache keep-alive response and cannot be forced
    // ahead of it.
    FailureQueueEntryKeepAliveHeld keep_alive_held = 4;
    // The entry is waiting behind a context cut, which is never interrupted —
    // and the force's own mechanism IS an interrupt, so there is nothing this
    // command could do that would not be the one thing that must not happen.
    FailureQueueEntryUninterruptibleTurn uninterruptible_turn = 5;
    // The queue refused for a reason the daemon's classifier could not name.
    frontend.v1.FailureInternalUnclassified unclassified = 6;
  }
  // The feed card this refusal was filed under, when it produced one. See
  // AcceptQueueEntryError.failure_card.
  frontend.v1.FailureCardRef failure_card = 7;
}
