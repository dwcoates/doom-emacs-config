// endpoint_revive_session.proto — the ReviveSession endpoint's request, success
// and error.
//
// ONE ENDPOINT PER FILE: ReviveSessionRequest, ReviveSessionResponse and the
// two answers it wraps, and nothing else, so the whole of what one method takes
// and returns is readable in one place. The `endpoint_` prefix is the grouping,
// not a directory — see DESIGN-protobuf-surfaces.md for why a directory is not
// available here, and for why a request type belongs to agentrepl.v1 rather
// than frontend.v1.

syntax = "proto3";

package agentrepl.v1;

import "agentrepl/v1/shared.proto";
import "frontend/v1/failure.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// The user's revival decision for a hibernated workspace. Revival is LAZY and
// GATED: the daemon nacks SubmitPromptRequest on a hibernated session, so no
// model use can precede this choice — a rendering frontend draws the gate
// from WorkspaceGateView (the host draws it from its session catalog) and
// sends exactly one of these. The daemon brings
// the session up along the ordinary create/resume path and, under either
// gated mode — compact_first or clear — drives that context cut to completion
// before accepting any prompt.
message ReviveSessionRequest {
  // Correlation. See agentrepl.v1.AgentRepl.
  string request_id = 1;
  // The workspace being revived. See agentrepl.v1.AgentRepl.
  string workspace = 2;
  // The choice is a oneof of empty messages, not a bool: "no decision" must
  // be unrepresentable on the wire, and a third revival mode later is a new
  // arm rather than a second flag. This request needed no conversion when the
  // mode-flag rule was applied across the surface — it is the shape the rule
  // generalizes from.
  oneof mode {
    // Compact the conversation as the first order of business; prompts are
    // accepted only after compaction lands. This pays the full-context cost
    // ONCE (compaction is a model call over the whole history) instead of on
    // every subsequent turn. Its own CompactionScope says how much of the
    // conversation the compaction may summarize away.
    ReviveCompactFirst compact_first = 3;
    // Resume the conversation as-is, full accumulated context and all. The
    // deliberate "I know it's big" path.
    ReviveDirect direct = 4;
    // Discard the conversation outright as the first order of business:
    // `/clear`, and nothing else. Prompts are accepted only after the clear
    // lands, on the same gate compact_first stays behind — a prompt answered
    // ahead of it would pay for the whole context the clear is about to throw
    // away.
    ReviveClear clear = 5;
  }
}

// ReviveSession's answer: exactly one of a success and an error.
//
// TWO ARMS, NOT AN `ok` BIT PLUS AN OPTIONAL FAILURE — see
// AcceptQueueEntryResponse for the whole of that argument.
message ReviveSessionResponse {
  // Echoed from the request that produced this answer. See
  // AcceptQueueEntryResponse.request_id.
  string request_id = 1;
  oneof response {
    ReviveSessionSuccess success = 2;
    ReviveSessionError error = 3;
  }
}

// The revival decision was accepted and the session is coming up under it.
//
// AN ACCEPTANCE, NOT A COMPLETION, and there are no arms distinguishing the
// two because only one of them is knowable here. Under compact_first the
// session is up and `/compact` is submitted when this returns, and the
// compaction runs on inside the daemon with the session still gated until it
// lands. Whether the gated context cut has completed is pushed state — the
// workspace's WorkspaceGateView — not a value this call can hold.
message ReviveSessionSuccess {}

// Why the revival was refused.
message ReviveSessionError {
  oneof error {
    // This daemon does not support session revival.
    RefusalDependencyUnwired hibernations_unwired = 1;
    // No mode, or a compact-first arm with no compaction scope. The choice —
    // and, when compacting, of what the summary may swallow — is the user's,
    // and the daemon has no default for either.
    RefusalRevivalModeUnstated revival_mode_unstated = 2;
    // The session could not be brought back up under the chosen mode.
    RefusalRevivalFailed revival_failed = 3;
    // The session could not be started at all.
    frontend.v1.FailureSessionStartFailed session_start_failed = 4;
    // The workspace's conversation could not be reached, and a blank one will
    // NOT be started in its place.
    FailureConversationUnresumable conversation_unresumable = 5;
    // The revival failed for a reason the daemon's classifier could not name.
    frontend.v1.FailureInternalUnclassified unclassified = 6;
  }
  // The feed card this refusal was filed under, when it produced one. See
  // AcceptQueueEntryError.failure_card.
  frontend.v1.FailureCardRef failure_card = 7;
}
