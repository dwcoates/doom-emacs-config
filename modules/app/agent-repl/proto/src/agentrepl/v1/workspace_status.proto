// workspace_status.proto — A WORKSPACE'S STATUS AS AN AGENT READS IT: what
// the workspace is, where its work lands, and what it is doing. Shared by the
// one-time read (GetWorkspaceStatus), a subscription's opening answer
// (SubscribeWorkspace), and every subscription notice, so a notice can never
// describe a workspace differently from a read.
//
// NOT A VIEW. The roster row (frontend.v1.RosterRow) is what the sidebar
// DRAWS; this is what an agent DECIDES on, in the daemon's own terms, and the
// two are resolved separately from the same records.

syntax = "proto3";

package agentrepl.v1;

import "frontend/v1/feed.proto";
import "workspace/v1/workspace.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// One workspace's status.
message WorkspaceStatus {
  // The workspace, as the roster serves it.
  workspace.v1.WorkspaceRef workspace = 1;
  // The workspace's name, as the roster draws it.
  string name = 2;
  // The workspace's branch, as git spells it.
  string branch = 3;
  // Where the workspace's branch lands, fixed at its creation.
  WorkspaceStatusMergeTarget merge_target = 4;
  // TRUE while the workspace is in the hidden section (off the Emacs tab bar);
  // SetWorkspaceHidden moves it in and out.
  bool hidden = 5;
  // Whether the workspace is open, and what it is doing if so.
  WorkspaceStatusStanding standing = 6;
  // TRUE while the workspace is a one-shot: created as one, or marked one
  // since (SetWorkspaceOneShot). A one-shot lands itself when its work is
  // done.
  bool one_shot = 7;
  // The workspace this one awaits correspondence from (SetWorkspaceCorrespondence),
  // UNSET while it awaits none.
  optional workspace.v1.WorkspaceRef awaiting = 8;
  // The repository the workspace belongs to, by its registry id: what a
  // create from inside this workspace names to be cut in the same
  // repository (CreateWorkspaceRequest.repository).
  workspace.v1.RepositoryRef repository = 9;
  // The workspace's principal link (SetWorkspacePrincipalLink), the url the
  // topbar's summary opens, verbatim. UNSET while the workspace has none. An
  // agent reads it to judge whether a link it was just given fits the task
  // better than the one standing.
  optional string principal_link = 10;
}

// Where a workspace's branch lands.
message WorkspaceStatusMergeTarget {
  // THE ARM IS THE TARGET.
  oneof target {
    // The primary branch, in the repository's main worktree.
    WorkspaceStatusMergeTargetPrimary primary = 1;
    // The owner's branch, in the owner's worktree.
    WorkspaceStatusMergeTargetOwner owner = 2;
  }
}
// Onto the primary branch. No fields.
message WorkspaceStatusMergeTargetPrimary {}
// Into an owning workspace.
message WorkspaceStatusMergeTargetOwner {
  // The owning workspace.
  workspace.v1.WorkspaceRef owner = 1;
  // TRUE when the owner arbitrates and lands this workspace's work, because
  // its context was not forked from the owner; FALSE when it lands itself.
  bool owner_lands = 2;
}

// Whether a workspace is open.
message WorkspaceStatusStanding {
  // THE ARM IS THE STANDING.
  oneof standing {
    // Open, with what its session is doing.
    WorkspaceStatusOpen open = 1;
    // Closed: no session runs, and nothing it was asked to do proceeds until
    // it is opened.
    WorkspaceStatusClosed closed = 2;
  }
}
// An open workspace.
message WorkspaceStatusOpen {
  // What the open workspace's session is doing.
  WorkspaceStatusActivity activity = 1;
}
// A closed workspace. No fields.
message WorkspaceStatusClosed {}

// What an open workspace's session is doing, as the footer would say it.
message WorkspaceStatusActivity {
  // THE ARM IS THE ACTIVITY.
  oneof activity {
    // The session is being brought up and takes no prompt yet.
    WorkspaceStatusActivityStarting starting = 1;
    // No turn runs; a prompt starts one.
    WorkspaceStatusActivityIdle idle = 2;
    // A turn is running.
    WorkspaceStatusActivityTurnRunning turn_running = 3;
    // A turn waits on the user: a question or a permission is open.
    WorkspaceStatusActivityNeedsInput needs_input = 4;
    // The workspace's own merge is in its queue or running.
    WorkspaceStatusActivityMerging merging = 5;
    // The session is parked at its COLD GATE: resuming its large, uncached
    // conversation would cost more than the gate allows, so nothing runs until
    // the gate is answered (AnswerColdGate: pay and resume, clear, compact, or
    // compact and resume).
    WorkspaceStatusActivityColdGate cold_gate = 6;
    // A fault stands in the way of the session: the vendor's (an outage, a
    // usage limit, a retried call), agent-repl's own, the network's, or a
    // degraded link. Whether a turn is mid-flight beneath it is not said: the
    // fault is what decides what the workspace can do next.
    WorkspaceStatusActivityFault fault = 7;
  }
}
// Being brought up. No fields.
message WorkspaceStatusActivityStarting {}
// Idle. No fields.
message WorkspaceStatusActivityIdle {}
// A turn is running. No fields.
message WorkspaceStatusActivityTurnRunning {}
// Waiting on the user.
message WorkspaceStatusActivityNeedsInput {
  // THE ARM IS WHAT IS ASKED.
  oneof ask {
    // A question the agent asked.
    WorkspaceStatusActivityNeedsInputQuestion question = 1;
    // A tool call awaiting permission.
    WorkspaceStatusActivityNeedsInputPermission permission = 2;
  }
}
// A question is open. No fields.
message WorkspaceStatusActivityNeedsInputQuestion {}
// A permission is open. No fields.
message WorkspaceStatusActivityNeedsInputPermission {}
// Parked at the cold gate.
message WorkspaceStatusActivityColdGate {
  // The gate, as AnswerColdGate names it (AnswerColdGateRequest.gate),
  // echoed back unchanged.
  frontend.v1.FeedId gate = 1;
}
// A standing fault.
message WorkspaceStatusActivityFault {
  // The fault in the footer's own words ("vendor fault · usage limit"), for
  // an agent to report. Prose to be read, not a vocabulary to switch on.
  string description = 1;
}
// The workspace's own merge is queued or running. No fields: the queue's
// status (GetMergeQueueStatus) says where it stands.
message WorkspaceStatusActivityMerging {}
