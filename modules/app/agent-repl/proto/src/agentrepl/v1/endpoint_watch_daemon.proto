// endpoint_watch_daemon.proto — WatchDaemon: THE daemon-level host stream.
// HOST section. Emacs — the daemon's singular client multiplexer — opens
// exactly one, alongside its per-workspace WatchHostWorkspace streams; it
// carries facts about the DAEMON ITSELF, never any workspace's state (the
// channel-separation ruling: workspace-dependent and workspace-independent
// channels are distinct types). Its pushed facts: the graceful-rollout
// shutdown announcement, the standing drain schedule, and a deploy's elisp
// reload.

syntax = "proto3";

package agentrepl.v1;

import "agentrepl/v1/daemon_stream_ending.proto";
import "agentrepl/v1/drain_reason.proto";
import "agentrepl/v1/workspace_mutation_progress.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// The stream is daemon-scoped, so there is nothing to address. It is held by
// Emacs AND by every webview (ruling R3), and what the request carries is WHO
// IS CONNECTING — because every process reports its build when it connects,
// and a deploy's elisp reload goes to Emacs's streams alone.
message WatchDaemonRequest {
  // THE ARM IS THE CLIENT. REQUIRED — a watch naming no client is refused.
  oneof client {
    WatchDaemonEmacs emacs = 1;
    WatchDaemonWebview webview = 2;
  }
}

// Emacs is connecting, and states the elisp it has loaded.
message WatchDaemonEmacs {
  // THE ELISP THIS EMACS HAS LOADED, as a content hash. REQUIRED — a watch
  // without it is refused, because a deploy could not tell whether this Emacs
  // runs the checkout's elisp.
  //
  // THE ALGORITHM IS THE CONTRACT, computed identically by Emacs (from the
  // bytes it loaded) and by the daemon (from the checkout): the lowercase hex
  // SHA-256 of the concatenated lines `<module>\t<sha256>\n`, one per module
  // `config.el` loads through `agent-repl--load-module`, IN THAT LOAD ORDER,
  // where <module> is the name the loader is given (`core`, not
  // `lisp/core.el`) and <sha256> is the lowercase hex SHA-256 of that
  // module's `lisp/<module>.el` bytes. A module the loader names but whose
  // file is absent contributes no line. `proto/vocab/elisp-build.json` holds
  // both implementations to one answer.
  string elisp_build = 1;
}

// A webview is connecting. Presence is the fact: a webview reports its build
// per workspace, on WatchWebWorkspace, where a reload is addressed.
message WatchDaemonWebview {}

message WatchDaemonResponse {
  oneof push {
    // This daemon is retiring — a handover (address set) or a plain
    // bounce (address unset). See the message.
    DaemonShutdownAnnounced shutdown_announced = 1;
    // A drain is scheduled and standing: clients draw the page-wide
    // restart banner from it until cancelled or the shutdown fires.
    DaemonDrainScheduled drain_scheduled = 2;
    // The standing drain schedule was cancelled; take the banner down.
    DaemonDrainCancelled drain_cancelled = 3;
    // Staged progress for an in-flight workspace mutation, keyed on the
    // client-minted op_id it echoes. Unlike the drain and shutdown arms —
    // standing daemon STATE re-pushed to late subscribers — this is a
    // transient EVENT: it rides a separate event topic merged onto this
    // stream, exactly as the per-workspace web stream merges its transfer
    // event beside its session-identity state, so a late subscriber replaying
    // the state arms is never handed a stale progress event in their place.
    WorkspaceMutationProgress mutation_progress = 4;
    // A DEPLOY FOUND THIS EMACS ON OLDER ELISP: hot-load the module set, in
    // config.el's load order, from the named root. Sent ONLY on an Emacs
    // stream whose elisp_build is not the checkout's — never on a webview's —
    // and never replayed to a late subscriber: a stream opened later states
    // its own elisp_build, and a deploy that runs after it compares that.
    DaemonReloadElisp reload_elisp = 5;
    // The daemon is standing down in a planned exit and this is the stream's
    // last frame; the client reattaches to the live daemon without treating
    // the end as a fault. See the message.
    DaemonStreamEnding ending = 6;
  }
}

// Hot-load the checkout's elisp. EMACS OWNS THE LOAD: the daemon has no route
// into the editor's runtime beyond this push.
//
// The WHOLE module set is loaded, in config.el's `agent-repl--load-module`
// order — never a partial set: core.el cancels every module timer at load and
// only their owner files re-arm them, so a partial set once left a live Emacs
// with a dead heartbeat. After the load Emacs asserts every required timer is
// armed (`agent-repl--assert-heartbeat-armed`), re-arms anything stranded, and
// reports a timer it could not re-arm loudly.
message DaemonReloadElisp {
  // The module root the elisp is loaded from — the checkout this daemon built.
  // Emacs REFUSES, loudly, a reload naming any root but the one it runs: a
  // reload from another checkout would leave the editor on one checkout's
  // elisp and the daemon on another's. REQUIRED.
  string module_root = 1;
  // The content hash of the module set being loaded (the WatchDaemonRequest
  // algorithm). What this Emacs reports as its elisp_build from then on.
  // REQUIRED.
  string build = 2;
}

message DaemonShutdownAnnounced {
  // The new daemon's socket address, verbatim — what Emacs dials for the
  // second connection. UNSET = a PLAIN BOUNCE: no successor is up; the
  // client waits out the outage instead of dual-attaching.
  optional string address = 1;
  // THE ARM IS THE CAUSE — why this daemon is going away.
  DaemonShutdownCause cause = 2;
  // The bounded expected outage — clients size their quiet window from
  // it instead of treating the link death as unexplained.
  int64 expected_outage_ms = 3;
  // When the announcement was minted. A late receiver SHORTENS its quiet
  // window by the time already elapsed rather than restarting it.
  int64 minted_at_ms = 4;
}

// THE ARM IS THE CAUSE.
message DaemonShutdownCause {
  oneof kind {
    DaemonShutdownSelfMergeRollout self_merge_rollout = 1;
    DaemonShutdownScheduledDrain scheduled_drain = 2;
    DaemonShutdownImmediate immediate = 3;
  }
}

// A new build is being rolled out blue-green. A deploy starts one
// (endpoint_deploy.proto) — asked for, or run by the daemon after a self-merge
// landed (the arm's name). Either way the announcement carries the
// successor's address, and an unforced one ends no turn.
message DaemonShutdownSelfMergeRollout {
}

// A scheduled drain reached its instant.
message DaemonShutdownScheduledDrain {
  DrainReason reason = 1;
}

// UpdateShutdownSchedule{now}: an immediate operator shutdown.
message DaemonShutdownImmediate {
  DrainReason reason = 1;
}

// The standing drain schedule, pushed when armed (and re-pushed to late
// subscribers per the subscription invariant).
message DaemonDrainScheduled {
  // The drain-then-exit instant.
  int64 at_ms = 1;
  // Why — what every client's banner names.
  DrainReason reason = 2;
}

// Presence is the fact: the schedule was cancelled.
message DaemonDrainCancelled {
}
