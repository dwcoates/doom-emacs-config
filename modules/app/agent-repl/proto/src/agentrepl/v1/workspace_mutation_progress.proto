// workspace_mutation_progress.proto — the staged progress a workspace
// MUTATION pushes while it runs. HOST section, carried on WatchDaemon
// (endpoint_watch_daemon.proto) because a mutation's progress is
// WORKSPACE-INDEPENDENT: a create's stages PRECEDE the workspace's existence,
// so they cannot ride the per-workspace WatchHostWorkspace stream (which is
// keyed on a WorkspaceRef that does not exist yet). The daemon-level stream
// Emacs always holds is the one channel open before any specific workspace.
//
// CORRELATION IS THE OP ID. The mutation rpc carries a client-minted op_id
// (CreateWorkspaceRequest.op_id); every progress push echoes it, and a client
// matches a push to the operation it issued by that id alone. The stream is a
// broadcast — Emacs and every webview receive every push — so the id is what
// lets a client ignore progress for an operation it did not start.

syntax = "proto3";

package agentrepl.v1;

import "agentrepl/v1/endpoint_create_workspace.proto";
import "workspace/v1/workspace.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// One staged-progress push for one in-flight workspace mutation.
message WorkspaceMutationProgress {
  // The op_id the mutation request supplied. THE CORRELATION KEY: a client
  // matches this push to the operation it issued by this id, and drops any it
  // does not recognize.
  string op_id = 1;

  // THE ARM IS THE MUTATION. Each mutation kind owns its own progress shape;
  // create is the first. Open, close and kill extend this oneof with their
  // own arms, so a new mutation's stages never disturb create's.
  oneof event {
    WorkspaceCreateProgress create = 2;
    WorkspaceOpenProgress open = 3;
  }
}

// The progress of one OpenWorkspace — a workspace being RESTORED rather than
// made. THE TERMINAL OUTCOME IS NOT HERE: unlike a create, an open is answered
// SYNCHRONOUSLY on its own rpc (OpenWorkspaceResponse), so the success and
// every typed refusal already reach the caller there. Duplicating them on this
// stream would give one operation two terminal reports that could disagree.
// What the rpc cannot carry is the WAIT inside it, which is what these stages
// are.
message WorkspaceOpenProgress {
  // The stage the open has just entered.
  WorkspaceOpenStage stage = 1;
}

// The stages an open passes through while its rpc is in flight. Emitted only
// for the stages the open actually reaches: a workspace that was not
// hibernated never emits `REVIVING`, and one that was not closed never emits
// `CLEARING_CLOSED`.
enum WorkspaceOpenStage {
  WORKSPACE_OPEN_STAGE_UNSPECIFIED = 0;
  // The daemon is confirming the workspace's worktree is still on disk. An
  // open whose directory is gone is refused here.
  WORKSPACE_OPEN_STAGE_CHECKING_WORKTREE = 1;
  // The daemon is bringing the session up — spawning the shim and resuming
  // the vendor conversation. THE SLOW STAGE, and the reason this enum exists.
  WORKSPACE_OPEN_STAGE_STARTING_SESSION = 2;
  // The daemon is lifting a hibernation park off the workspace.
  WORKSPACE_OPEN_STAGE_REVIVING = 3;
  // The daemon is clearing the workspace's closed flag, which is what puts
  // its row back among the open ones.
  WORKSPACE_OPEN_STAGE_CLEARING_CLOSED = 4;
  // The daemon is checking the shim against the deployed build and bouncing
  // it when stale.
  WORKSPACE_OPEN_STAGE_CHECKING_BUILD = 5;
}

// The progress of one CreateWorkspace, from just after the ack to the terminal
// outcome. THE ARM IS THE STEP: a stage while the work runs, or exactly one of
// the two terminal steps.
message WorkspaceCreateProgress {
  // Field 1 carried the stage as an enum; the stage is now a message on its own
  // field, so a reader built against either shape never misreads the other.
  reserved 1;
  reserved "stage";

  // Which step the create is on. Exactly one arm is set per progress push.
  oneof step {
    // An intermediate stage the create has just entered. Emitted only for the
    // stages the create actually reaches, in order: a create with a supplied
    // name never enters `deriving_name`, because the daemon mints no name for
    // it.
    WorkspaceCreateStage entered_stage = 4;
    // TERMINAL: the workspace was created. Carries the minted identity (the
    // ref the legacy synchronous form returned in `CreateWorkspaceSuccess`)
    // and its name, for the completion message.
    WorkspaceCreateSucceeded succeeded = 2;
    // TERMINAL: the create failed. Mirrors the two ways the synchronous form
    // fails — a typed refusal or an internal error — so a client surfaces the
    // failure identically whichever form it used. Only the failures that can
    // arrive after the ack ride here — naming, worktree, spawn, the initial
    // prompt's submission; the pre-detach refusals stay on the rpc's own
    // `error` arm.
    WorkspaceCreateFailed failed = 3;
  }
}

// The terminal failure of a background create. THE ARM IS THE KIND OF FAILURE,
// mirroring the synchronous form: a typed refusal it would have answered on its
// `error` arm, or an internal error it would have failed the rpc with.
message WorkspaceCreateFailed {
  oneof cause {
    // A TYPED REFUSAL — the SAME `CreateWorkspaceError` the synchronous form
    // answers, so a client words it identically (naming_failed and the rest).
    CreateWorkspaceError refusal = 1;
    // AN INTERNAL ERROR the create could not express as a typed refusal — the
    // synchronous form fails the rpc with it. The full cause is in the
    // daemon's own log (every such failure is recorded there at ERROR before
    // this is raised); this message is the human sentence a client shows.
    string internal = 2;
  }
}

// A stage a create passes through between the ack and its terminal outcome.
// THE SET ARM IS THE STAGE. The "creating workspace" phase is the ack itself
// (CreateWorkspaceAccepted), and "created" is the `succeeded` step, so neither
// is a stage here. A client words each arm as one minibuffer line; a stage
// that is entered replaces the line of the one before it.
message WorkspaceCreateStage {
  // The stage just entered. Stages arrive in the order declared here, and a
  // create skips only the stages its form does not need.
  oneof stage {
    // The daemon is deriving the workspace's name with a headless naming call —
    // from the initial prompt, plus the parent conversation's digest for a
    // fork. Entered only when the create supplied no name.
    WorkspaceCreateStageDerivingName deriving_name = 1;
    // The daemon is materializing the workspace's git worktree
    // (`worktree add`).
    WorkspaceCreateStageCreatingWorktree creating_worktree = 2;
    // The daemon is starting the workspace's session: registering the
    // workspace, spawning its shim and bringing the vendor session up — for a
    // fork, after copying the parent's transcript — then submitting the
    // initial prompt when there is one. Entered by every create that gets past
    // the worktree, and usually the longest stage. It ends at the create's
    // terminal step: `succeeded` once the session is up and any initial prompt
    // is accepted by the queue, or `failed` naming what went wrong.
    WorkspaceCreateStageStartingSession starting_session = 3;
  }
}

// The naming stage. It carries nothing: the arm being set is the whole fact.
message WorkspaceCreateStageDerivingName {}

// The worktree stage. It carries nothing: the arm being set is the whole fact.
message WorkspaceCreateStageCreatingWorktree {}

// The session bring-up stage. It carries nothing: the arm being set is the
// whole fact, and a failure inside it arrives as the create's `failed` step.
message WorkspaceCreateStageStartingSession {}

// The terminal success of a create, on the progress channel.
message WorkspaceCreateSucceeded {
  // The created workspace's identity — the SAME ref the synchronous form
  // returns in CreateWorkspaceSuccess. A client selects the new workspace and
  // notes its arrival from this.
  workspace.v1.WorkspaceRef workspace = 1;
  // The workspace's minted name (its branch), for the "workspace created:
  // <name>" completion message. Carried explicitly because WorkspaceRef holds
  // only the id and dir — never a name a client is meant to parse from a path.
  string name = 2;
}
