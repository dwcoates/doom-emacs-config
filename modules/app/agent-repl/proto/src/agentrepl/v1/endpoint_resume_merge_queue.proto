// endpoint_resume_merge_queue.proto — the ResumeMergeQueue endpoint's request,
// success and error.
//
// ONE ENDPOINT PER FILE: ResumeMergeQueueRequest, ResumeMergeQueueResponse and
// the two answers it wraps, and nothing else, so the whole of what one method
// takes and returns is readable in one place. The `endpoint_` prefix is the
// grouping, not a directory — see DESIGN-protobuf-surfaces.md for why a
// directory is not available here, and for why a request type belongs to
// agentrepl.v1 rather than frontend.v1.

syntax = "proto3";

package agentrepl.v1;

import "frontend/v1/failure.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// Resume the merge queue. Idempotent and daemon-global, like its pause.
message ResumeMergeQueueRequest {
  // Correlation. See agentrepl.v1.AgentRepl.
  string request_id = 1;
}

// ResumeMergeQueue's answer: exactly one of a success and an error.
//
// TWO ARMS, NOT AN `ok` BIT PLUS AN OPTIONAL FAILURE — see
// AcceptQueueEntryResponse for the whole of that argument.
message ResumeMergeQueueResponse {
  // Echoed from the request that produced this answer. See
  // AcceptQueueEntryResponse.request_id.
  string request_id = 1;
  oneof response {
    ResumeMergeQueueSuccess success = 2;
    ResumeMergeQueueError error = 3;
  }
}

// The pause bit is clear and the queue drains again.
//
// NO ARMS. Idempotent like its pause, and with as little to distinguish; the
// state after the call is pushed on MergeQueueRoster.paused.
message ResumeMergeQueueSuccess {}

// Why the resume was refused.
//
// ONLY THE FUNNEL, for PauseMergeQueueError's reason and with its caveat: this
// daemon has no ResumeMergeQueue handler, so there is no refusal path to derive
// arms from and none are invented.
message ResumeMergeQueueError {
  oneof error {
    // The resume failed for a reason the daemon's classifier could not name.
    frontend.v1.FailureInternalUnclassified unclassified = 1;
  }
  // The feed card this refusal was filed under, when it produced one. See
  // AcceptQueueEntryError.failure_card.
  frontend.v1.FailureCardRef failure_card = 2;
}
