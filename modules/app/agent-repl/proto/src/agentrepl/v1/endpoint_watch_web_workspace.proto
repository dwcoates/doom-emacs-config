// endpoint_watch_web_workspace.proto — WatchWebWorkspace: the webview's
// standing daemon-link stream for ONE workspace. WEB LINK section — the
// webview analog of WatchHostWorkspace: "Web" qualifies the VIEW (the
// workspace's web-client-facing link state), exactly as "Host" qualifies
// Emacs's. NOT DRAWN: the webview uses it to follow its connection's
// lifecycle, never to render.
//
// STATE AND EVENTS, EXACTLY AS THE HOST STREAM CARRIES THEM. `transferred` is
// an EVENT and `session_identity` is STATE, so they are published on two
// topics and merged onto this one wire (see daemon internal/server/host.go for
// the rule: a Topic replays only its latest value, so a subscriber arriving
// after an event would be handed that event and never the state).

syntax = "proto3";

package agentrepl.v1;

import "workspace/v1/workspace.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

message WatchWebWorkspaceRequest {
  // The workspace this webview is bound to.
  workspace.v1.WorkspaceRef workspace = 1;
  // THE WEBAPP BUILD THIS PAGE IS RUNNING, because every process reports its
  // build when it connects: a deploy pushes `reload_webapp` to exactly the
  // webviews whose build is not the one it just built. REQUIRED — a watch
  // without it is refused.
  //
  // It is the CONTENT HASH Vite gives the entry bundle: the `<hash>` in the
  // page's own `assets/index-<hash>.js`, read from the running module's URL.
  // The daemon reads the fresh build's from the `index.html` it serves.
  string webapp_build = 2;
}

message WatchWebWorkspaceResponse {
  oneof push {
    // DAEMON HANDOVER: this workspace has been released by this (old)
    // daemon at freeness. The webview's obligation (ruled 2026-08-29): draw
    // "moved to `address`", cancel this connection's streams and go quiet —
    // it NEVER dials the successor itself (a different loopback port is a
    // different origin). The HOST reloads the webview at the successor's
    // address, and the FRESH page calls AdoptWebWorkspace once at boot before
    // opening any view stream (`no_transfer_announced` is the ordinary
    // answer for a non-handover boot; `not_yet_adopted` is retried with
    // backoff). The address rides HERE so the notice can name it.
    WebWorkspaceTransferred transferred = 1;
    // THE SESSION THIS PAGE'S RECORDS BELONG TO. Landing 15: the webapp was
    // the one runtime with no frame carrying a correlation identity, so a
    // browser-side ClientLog record could not be joined to the daemon session
    // it was logged against. It rides the webview's NON-DRAWN link stream
    // rather than a frontend/v1 view because an agent-repl session identity is
    // a vocabulary a rendering frontend does not have (failure.proto states
    // that rule), and nothing here is drawn.
    //
    // STATE, so it is republished on every edge that can move it: the page
    // rebinds its log context each time, and a restart or a handover that
    // mints a new identity is followed rather than remembered from boot.
    WebWorkspaceSessionIdentity session_identity = 2;
  }
}

message WebWorkspaceTransferred {
  // The new daemon's socket address, verbatim.
  string address = 1;
}

// The identities the page stamps on the diagnostic records it forwards
// through ClientLog, so one grep joins its log to the other four runtimes'.
// NOT ADDRESSING and NOT DRAWN: nothing routes on these and no view shows
// them.
message WebWorkspaceSessionIdentity {
  // The daemon-minted host session identity (AGENT_REPL_SESSION_ID), the key
  // the daemon and the shim already stamp their own records with. Empty when
  // the workspace has no session yet — absence is a legitimate state, and the
  // page then attributes its records to the workspace alone.
  string agent_repl_session_id = 1;
  // The vendor conversation, verbatim. Empty until one exists.
  string claude_session_id = 2;
}
