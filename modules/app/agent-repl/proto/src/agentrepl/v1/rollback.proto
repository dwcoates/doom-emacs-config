// rollback.proto — what the rollback endpoints share: the plan's token, and
// why a rollback did not happen (RollBack's refusal, which Interrupt also
// relays when a stop asked to roll its prompt back and could not).
syntax = "proto3";
package agentrepl.v1;
option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// THE PLAN THE USER CONFIRMED, as the daemon minted it (PlanRollback) and
// the client hands back unchanged (RollBack). Opaque to the client. It names
// the prompt, whether files are restored, and every side effect the plan
// stated; the daemon refuses a RollBack whose plan no longer describes what
// would happen, so a rollback never does anything the confirmation did not
// say.
message RollbackToken {
  // Opaque, daemon-minted; never parsed or constructed by a client.
  string value = 1;
}

// Not rolled back. THE ARM IS WHY. Every arm leaves the conversation, the
// feed, the held prompts and the files as they were, except that a running
// turn may already have been interrupted.
message RollBackError {
  reserved 10;
  reserved "vendor_refused";
  oneof cause {
    // The workspace id is not in the daemon's registry.
    RollBackUnknownWorkspace unknown_workspace = 1;
    // The echoed dir disagrees with the registry's dir for this id.
    RollBackWorkspaceRefMismatch workspace_ref_mismatch = 2;
    // This daemon released the workspace to a successor; dial `address`.
    RollBackTransferringAway transferring_away = 3;
    // A joining daemon has not finished adopting this workspace yet.
    RollBackNotYetAdopted not_yet_adopted = 4;
    // The plan no longer describes what would happen (a prompt was sent or
    // queued, a turn started or ended, the prompt became unreachable, or
    // the daemon restarted since it was planned). Nothing was done; plan
    // again.
    RollBackPlanStale plan_stale = 5;
    // The workspace has no running session to roll back.
    RollBackNoSession no_session = 6;
    // The vendor transcript holds no record of the prompt.
    RollBackPromptNotRecorded prompt_not_recorded = 7;
    // The prompt is the first of its vendor conversation; `/clear` starts a
    // conversation over.
    RollBackFirstPrompt first_prompt = 8;
    // The vendor conversation holds a prompt after this one that the feed
    // never drew, so rolling back would drop something unseen.
    RollBackUnseenPrompt unseen_prompt = 9;
    // 10 (vendor_refused) is reserved: the vendor judges the cut after the
    // answer (conversation.v1.SessionRollbackSettled), and a cut it refuses
    // draws the dropped prompts back into the feed with a note saying so.
    // The files cannot be restored to that prompt (it was sent before file
    // checkpointing was on, or its checkpoint is gone). Nothing was changed.
    RollBackFilesNotRestorable files_not_restorable = 11;
  }
}
// The workspace id is not in the daemon's registry.
message RollBackUnknownWorkspace {}
// The echoed dir disagrees with the registry's dir for this id.
message RollBackWorkspaceRefMismatch {
  // The dir the registry holds for this id.
  string registry_dir = 1;
}
// This daemon released the workspace to a successor.
message RollBackTransferringAway {
  // The successor's `127.0.0.1:<port>`, so a lagging client dials it.
  string address = 1;
}
// A joining daemon has not finished adopting this workspace yet.
message RollBackNotYetAdopted {}
// The plan no longer describes what would happen.
message RollBackPlanStale {}
// No running session.
message RollBackNoSession {}
// The prompt has no record in the vendor transcript.
message RollBackPromptNotRecorded {}
// The prompt is its conversation's first.
message RollBackFirstPrompt {}
// An unseen prompt follows the cut point.
message RollBackUnseenPrompt {}
// The files cannot be restored.
message RollBackFilesNotRestorable {
  // The vendor's reason, verbatim.
  string vendor_message = 1;
}
