// endpoint_submit_prompt.proto — SubmitPrompt: the composer's submission,
// verbatim. FEED section. The client does NOT recognize slash commands —
// recognition is the daemon's, transparently: the success oneof is where the
// answer forks (a prompt's minted turn, or a programmatically handled
// command's panel).

syntax = "proto3";

package agentrepl.v1;

import "conversation/v1/turn.proto";
import "conversation/v1/user.proto";
import "conversation/v1/prompt_origin.proto";
import "workspace/v1/workspace.proto";
import "frontend/v1/status_panel.proto";
import "frontend/v1/todos_panel.proto";
import "frontend/v1/agents_panel.proto";
import "frontend/v1/mcp_panel.proto";
import "frontend/v1/context_panel.proto";
import "frontend/v1/help_panel.proto";
import "frontend/v1/feed.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// HOW a submitted prompt is delivered, when it asks for something other than
// the ordinary delivery. The ordinary delivery is the field's ABSENCE: a prompt
// goes to the session at once when nothing runs, and while a turn runs it is
// held and classified against that turn, which may interject it.
enum SubmitPromptDelivery {
  // Never sent: a request carrying it is refused as InvalidArgument. The
  // ordinary delivery is an ABSENT `delivery`, never this value.
  SUBMIT_PROMPT_DELIVERY_UNSPECIFIED = 0;
  // DEFERRED: run as ITS OWN turn after the current one, never interjected.
  // It goes to the session at once when nothing runs. While a turn runs it is
  // held until that turn ends and is then delivered as a turn of its own:
  // it is never classified, so it can never earn an interject. It is held
  // like any other held prompt -- it shows in the held tray, a merge or a cold
  // gate keeps it held, and it survives a restart of the daemon, the shim and
  // the client -- and a turn end delivers held prompts one at a time, oldest
  // first, so several deferred prompts run as that many turns in order.
  SUBMIT_PROMPT_DELIVERY_DEFERRED = 1;
}

// What the user typed, submitted whole.
message SubmitPromptRequest {
  // The workspace this submission belongs to — the daemon-minted ref,
  // echoed verbatim like every per-workspace request. Names the workspace
  // even when `feed` is unset (the root feed has no id of its own); when
  // `feed` is set it must belong to this workspace, else the submission is
  // refused.
  workspace.v1.WorkspaceRef workspace = 5;
  // The composed prompt — one canonical form client → daemon → tray → shim →
  // record (a held prompt IS a UserSaid).
  conversation.v1.UserSaid said = 1;
  // Client-minted; the daemon refuses duplicates by it, so a retried request
  // is not a second turn (3b: SubmitPrompt is the one verb where a duplicate
  // is costly and undetectable).
  string idempotency_key = 2;
  // WHICH view's composer this came from. UNSET = the workspace's root feed
  // — the session's own prompt thread, held/classified/delivered by the
  // daemon as always. SET = a subagent bubble's feed, echoed as served: the
  // prompt is addressed to THAT agent, and the daemon delivers it through
  // the same hold-and-deliver machinery (the shim's UpdateAgent.prompt
  // underneath). Command recognition is unchanged either way.
  optional frontend.v1.FeedId feed = 3;
  // WHICH SEND SITE caused this prompt — the closed attribution vocabulary
  // every Emacs send site chooses its own value from; the daemon persists
  // it onto the turn's durable record (StartTurn.origin → AgentPrompt).
  // Never UNSPECIFIED: a submission carrying it is refused at once.
  conversation.v1.PromptOrigin origin = 4;
  // A REPLY TO A PAST RESPONSE is not named here: when the workspace's feed
  // has a final response selected (frontend.v1.FeedSelectionResponse) as the
  // daemon accepts this prompt, the daemon prepends a copy of that response
  // plus a note before delivering, and clears the selection. The daemon is the
  // only holder of the selection, so the reply a prompt carries is always the
  // one the webapp was drawing.
  reserved 6;
  reserved "reference_response_feedid";
  // OPTIONAL delivery mode. ABSENT is the ordinary delivery; set, it names the
  // one other delivery the daemon honors (SubmitPromptDelivery). Additive and
  // mutually compatible with every existing field. Set to UNSPECIFIED, the
  // request is refused as InvalidArgument.
  optional SubmitPromptDelivery delivery = 7;
}

// THE ARM IS THE OUTCOME.
message SubmitPromptResponse {
  oneof result {
    SubmitPromptSuccess success = 1;
    SubmitPromptError error = 2;
  }
}

// The submission was accepted. THE ARM IS WHAT THE SUBMISSION WAS — both are
// ANSWERS, never failures.
message SubmitPromptSuccess {
  oneof outcome {
    // It is a prompt: the daemon minted the turn (delivered now or held — a
    // hold is visible in the tray, not an error here).
    SubmitPromptTurn turn = 1;
    // It is a programmatically handled command: here is its panel, resolved.
    SubmitPromptCommandPanel command_panel = 2;
    // It is a command the daemon RECOGNIZES but neither answers nor forwards
    // (/agents, /help, …): refused with the add-support offer. The card is
    // the feed's `command_refused` row; the caller learns only that no turn
    // was minted.
    SubmitPromptCommandRefused command_refused = 3;
    // It is a session-acting command the daemon RECOGNIZED and queued as an
    // act that mints no turn (/model <arg>; the topbar picker's path meets it
    // here too). Empty: the set arm is the whole assertion — the visible
    // effect (the model change, restated authoritatively) arrives on the
    // component streams, never in this answer. (Landing 6, 2026-09-01.)
    SubmitPromptCommandActed command_acted = 4;
  }
}

// The acted-without-a-turn answer. Empty on purpose (see the arm).
message SubmitPromptCommandActed {}

// The recognized-but-unsupported answer.
message SubmitPromptCommandRefused {
  // The command as typed ("/agents").
  string command = 1;
}

// The minted turn — what a client matches against FeedRow.turn to find its
// own prompt. Nothing else returns here: every visible effect arrives on the
// component streams.
message SubmitPromptTurn {
  conversation.v1.TurnId turn = 1;
}

// The recognized command's panel. THE ARM IS WHICH COMMAND was recognized; a
// new programmatically handled command is a new arm, deployed daemon-side —
// clients render the arm and know no command names.
message SubmitPromptCommandPanel {
  oneof panel {
    // The /status panel.
    frontend.v1.StatusPanelView status = 1;
    // Tags 2-3 are RETIRED: /cost and /usage left the daemon-handled set —
    // their only structured sources are an explicitly EXPERIMENTAL control
    // method and an undeclared-shape one (vetting item 11), not worth the
    // complication; the commands fall through to the vendor like any
    // unrecognized command.
    // The /todos panel: the tracker's checklist, printed from the daemon's
    // own state.
    frontend.v1.TodosPanelView todos = 4;
    // The /agents panel: the configured agent types.
    frontend.v1.AgentsPanelView agents = 5;
    // The /mcp panel: each MCP server and where it stands.
    frontend.v1.McpPanelView mcp = 6;
    // The /context panel: the context-fill tree.
    frontend.v1.ContextPanelView context = 7;
    // The /help panel: the command list.
    frontend.v1.HelpPanelView help = 8;
  }
}

// The submission was refused. Arms derived from the daemon's refusal sites (landing 4, 2026-08-29).
// Validation failures (unset field, UNSPECIFIED enum, blank string) are Connect InvalidArgument, never an arm.
message SubmitPromptError {
  // Tag 8 / `turn_already_open` retired at landing 6 (see the oneof comment).
  reserved 8;
  reserved "turn_already_open";
  // WHY the submission was refused.
  oneof reason {
    // A merge lease that REFUSES stands on this workspace. Since
    // 2026-10-01 a merge HOLDS what is submitted while it runs
    // (frontend.v1.HeldPrompt's `merge` hold arm), and a held prompt keeps
    // the workspace open past the landing, so the daemon's own merges never
    // answer with this arm. Only a refusing merge lease an older build
    // wrote still produces it. The composer keeps the text; the user
    // resubmits after the merge resolves.
    SubmitPromptRefusedMerging merging = 1;
    // The workspace id is not in the daemon's registry.
    SubmitPromptUnknownWorkspace unknown_workspace = 2;
    // The echoed dir disagrees with the registry's dir for this id.
    SubmitPromptWorkspaceRefMismatch workspace_ref_mismatch = 3;
    // This daemon released the workspace to a successor; dial `address`.
    SubmitPromptTransferringAway transferring_away = 4;
    // A joining daemon has not finished adopting this workspace yet.
    SubmitPromptNotYetAdopted not_yet_adopted = 5;
    // The FeedId decodes to another workspace.
    SubmitPromptFeedNotInWorkspace feed_not_in_workspace = 6;
    // The FeedId does not decode.
    SubmitPromptFeedUndecodable feed_undecodable = 7;
    // Tag 8 is RETIRED (landing 6, 2026-09-01): `turn_already_open` had no
    // producer — a bubble-addressed submit while that agent runs is refused
    // by the SHIM (UpdateAgentFailure), and the daemon relays that, so the
    // daemon never judges a subagent's turn itself.
    // The workspace has no session to submit to.
    SubmitPromptNoSession no_session = 9;
    // The client-minted `idempotency_key` was already accepted for this
    // workspace: the earlier submission stands (its turn, hold or panel is
    // already visible); nothing is submitted twice. Empty: the key the
    // client sent is the only identity involved. (Landing 6, 2026-09-01.)
    SubmitPromptDuplicateSubmission duplicate_submission = 10;
    // The SHIM refused a bubble-addressed (subagent) prompt and the daemon
    // relays that refusal by kind — the daemon never judges a subagent's
    // turn itself (why tag 8 retired). (Landing 7, 2026-09-02.)
    SubmitPromptBubbleRefused bubble_refused = 11;
    // The workspace's session is PARKED AT ITS COLD GATE. A session EXISTS
    // — the shim is up and serving, which is exactly why the gate could be
    // raised — and it takes no prompt until the gate is answered. It is a
    // different answer from `no_session`, which is a workspace with no
    // session at all, and the two are acted on differently: a cold gate is
    // answered in the panel (clear / compact / resume), while a missing
    // session is the daemon's own to bring up. Before this arm existed the
    // gate answered `no_session` and every client said the wrong thing
    // about a session that was up (owner's report, 2026-09-14).
    SubmitPromptColdGate cold_gate = 12;
    // A `/model` act named a model the session's own catalog does not hold.
    // The act was NOT applied and the prompt was not submitted; the session
    // runs on as before. Before this arm the refusal left the daemon as a
    // bare failed_precondition, which every client read as a daemon it could
    // not reach and HELD the prompt as an outage (owner's report, 2026-09-23).
    SubmitPromptModelNotInCatalog model_not_in_catalog = 13;
    // A `/model` act the vendor itself refused. Same disposition as above.
    SubmitPromptModelRefused model_refused = 14;
  }
}

// The model a `/model` act named is not in this session's catalog.
message SubmitPromptModelNotInCatalog {
  // The shim's own account, verbatim, naming the model that was asked for.
  // A client shows it; it never switches on it.
  string detail = 1;
}

// The vendor refused the model change a `/model` act asked for.
message SubmitPromptModelRefused {
  // The vendor's own sentence, verbatim.
  string detail = 1;
}

// The cold-gate refusal: the session is parked on the user's remediation
// choice and nothing may be submitted to it until the gate is answered.
message SubmitPromptColdGate {
  // THE GATE'S OWN ACCOUNT of what was refused cold, verbatim — the same
  // sentence the gate card and the footer's `cold_gate_cost` line carry, so
  // a client with no feed open still tells the user WHY, in the words the
  // rest of the surfaces use. Never switched on.
  string detail = 1;
}

// The shim's refusal of a bubble-addressed prompt, relayed. ONE arm, the
// kind inside: both kinds are the same user act meeting the same answer
// ("not this agent, not now"), and the feed's bubble draws them alike.
message SubmitPromptBubbleRefused {
  // The shim's account, for a human and for logs; never switched on.
  string detail = 1;
  oneof kind {
    // The shim's UpdateAgentFailure.not_deliverable: the vendor offers no
    // route to this agent kind.
    SubmitPromptBubbleNotDeliverable not_deliverable = 2;
    // The shim's UpdateAgentFailure.agent_busy: the addressed subagent's own
    // turn is already running.
    SubmitPromptBubbleAgentBusy agent_busy = 3;
  }
}
message SubmitPromptBubbleNotDeliverable {}
message SubmitPromptBubbleAgentBusy {}

// The duplicate-key refusal. Empty on purpose (see the arm).
message SubmitPromptDuplicateSubmission {}
// The merge-in-flight refusal. Empty: the set arm is the whole assertion —
// the footer's merging status and the feed's merge bubble already show
// which merge, so the refusal carries no duplicate account of it.
message SubmitPromptRefusedMerging {}
message SubmitPromptUnknownWorkspace {}
message SubmitPromptWorkspaceRefMismatch {
  // The dir the registry holds for this id.
  string registry_dir = 1;
}
message SubmitPromptTransferringAway {
  // The successor's `127.0.0.1:<port>`, so a lagging client dials it.
  string address = 1;
}
message SubmitPromptNotYetAdopted {}
message SubmitPromptFeedNotInWorkspace {}
message SubmitPromptFeedUndecodable {}
message SubmitPromptNoSession {}
