// endpoint_submit_prompt.proto — SubmitPrompt: the composer's submission,
// verbatim. FEED section. The client does NOT recognize slash commands —
// recognition is the daemon's, transparently: the success oneof is where the
// answer forks (a prompt's minted turn, or a programmatically handled
// command's panel).

syntax = "proto3";

package agentrepl.v1;

import "conversation/v1/turn.proto";
import "conversation/v1/user.proto";
import "frontend/v1/status_panel.proto";
import "frontend/v1/cost_panel.proto";
import "frontend/v1/usage_panel.proto";
import "frontend/v1/todos_panel.proto";
import "frontend/v1/agents_panel.proto";
import "frontend/v1/mcp_panel.proto";
import "frontend/v1/context_panel.proto";
import "frontend/v1/help_panel.proto";
import "frontend/v1/feed.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// What the user typed, submitted whole.
message SubmitPromptRequest {
  // The composed prompt — one canonical form client → daemon → tray → shim →
  // record (a held prompt IS a UserSaid).
  conversation.v1.UserSaid said = 1;
  // Client-minted; the daemon refuses duplicates by it, so a retried request
  // is not a second turn (3b: SubmitPrompt is the one verb where a duplicate
  // is costly and undetectable).
  string idempotency_key = 2;
  // WHICH view's composer this came from. UNSET = the workspace's root feed
  // — the session's own prompt thread, held/classified/delivered by the
  // daemon as always. SET = a subagent bubble's feed, echoed as served: the
  // prompt is addressed to THAT agent, and the daemon delivers it through
  // the same hold-and-deliver machinery (the shim's UpdateAgent.prompt
  // underneath). Command recognition is unchanged either way.
  optional frontend.v1.FeedId feed = 3;
}

// THE ARM IS THE OUTCOME.
message SubmitPromptResponse {
  oneof result {
    SubmitPromptSuccess success = 1;
    SubmitPromptError error = 2;
  }
}

// The submission was accepted. THE ARM IS WHAT THE SUBMISSION WAS — both are
// ANSWERS, never failures.
message SubmitPromptSuccess {
  oneof outcome {
    // It is a prompt: the daemon minted the turn (delivered now or held — a
    // hold is visible in the tray, not an error here).
    SubmitPromptTurn turn = 1;
    // It is a programmatically handled command: here is its panel, resolved.
    SubmitPromptCommandPanel command_panel = 2;
  }
}

// The minted turn — what a client matches against FeedRow.turn to find its
// own prompt. Nothing else returns here: every visible effect arrives on the
// component streams.
message SubmitPromptTurn {
  conversation.v1.TurnId turn = 1;
}

// The recognized command's panel. THE ARM IS WHICH COMMAND was recognized; a
// new programmatically handled command is a new arm, deployed daemon-side —
// clients render the arm and know no command names.
message SubmitPromptCommandPanel {
  oneof panel {
    // The /status panel.
    frontend.v1.StatusPanelView status = 1;
    // The /cost panel: what the session cost, label/value rows.
    frontend.v1.CostPanelView cost = 2;
    // The /usage panel: allowance utilization rows.
    frontend.v1.UsagePanelView usage = 3;
    // The /todos panel: the tracker's checklist, printed from the daemon's
    // own state.
    frontend.v1.TodosPanelView todos = 4;
    // The /agents panel: the configured agent types.
    frontend.v1.AgentsPanelView agents = 5;
    // The /mcp panel: each MCP server and where it stands.
    frontend.v1.McpPanelView mcp = 6;
    // The /context panel: the context-fill tree.
    frontend.v1.ContextPanelView context = 7;
    // The /help panel: the command list.
    frontend.v1.HelpPanelView help = 8;
  }
}

// The submission was refused. EMPTY ON PURPOSE — an empty oneof is not legal
// proto, so the `reason` oneof is added WITH its first arms at this
// endpoint's 3c turn, DERIVED from the daemon's real refusal sites (e.g. no
// session, merge lease held, drain refusing) and spelled per the 3b
// conventions.
message SubmitPromptError {
}
