// endpoint_swap_workspace_places.proto — SwapWorkspacePlaces: exchange the
// stored roster places of two sibling workspaces. SIDEBAR section. The
// sidebar and the tab bar (which walks the sidebar) both draw from the one
// stored place, so one exchange swaps the pair on both; the new order
// arrives on the roster stream.

syntax = "proto3";

package agentrepl.v1;

import "workspace/v1/workspace.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// Exchange the stored roster places of two sibling workspaces, so the
// sidebar and the tab bar (which walks the sidebar) draw them swapped.
message SwapWorkspacePlacesRequest {
  // The workspace the user is in. Must differ from `other` by id
  // (InvalidArgument otherwise).
  workspace.v1.WorkspaceRef workspace = 1;
  // The workspace whose place `workspace` takes, as the roster served it.
  workspace.v1.WorkspaceRef other = 2;
}

// The set arm is the outcome.
message SwapWorkspacePlacesResponse {
  oneof result {
    SwapWorkspacePlacesSuccess success = 1;
    SwapWorkspacePlacesError error = 2;
  }
}

// The two places were exchanged; the roster push carries the new order.
message SwapWorkspacePlacesSuccess {}

// Why the swap was not made. No place changes on any arm.
message SwapWorkspacePlacesError {
  oneof cause {
    // A ref's id is not in the daemon's registry.
    SwapWorkspacePlacesUnknownWorkspace unknown_workspace = 1;
    // A ref's dir disagrees with the registry's dir for its id.
    SwapWorkspacePlacesWorkspaceRefMismatch workspace_ref_mismatch = 2;
    // This daemon released a workspace to a successor; dial `address`.
    SwapWorkspacePlacesTransferringAway transferring_away = 3;
    // A joining daemon has not finished adopting a workspace yet.
    SwapWorkspacePlacesNotYetAdopted not_yet_adopted = 4;
    // The two rows have different parents in the repository view (or
    // different repositories, or one sits in the recently-merged
    // section), so no single place exchange can swap them on both the
    // sidebar and the tab bar.
    SwapWorkspacePlacesNotSiblings not_siblings = 5;
  }
}
// Names the ref the registry does not hold.
message SwapWorkspacePlacesUnknownWorkspace { workspace.v1.WorkspaceRef workspace = 1; }
// Names the mismatched ref and the dir the registry holds for its id.
message SwapWorkspacePlacesWorkspaceRefMismatch {
  workspace.v1.WorkspaceRef workspace = 1;
  string registry_dir = 2;
}
// The successor's `127.0.0.1:<port>`.
message SwapWorkspacePlacesTransferringAway { string address = 1; }
// Adoption of a named workspace is still in progress.
message SwapWorkspacePlacesNotYetAdopted {}
// The pair is not one parent's children; the command explains this.
message SwapWorkspacePlacesNotSiblings {}
