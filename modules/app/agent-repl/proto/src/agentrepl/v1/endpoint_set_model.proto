// endpoint_set_model.proto — the SetModel endpoint's request, success and
// error.
//
// ONE ENDPOINT PER FILE: SetModelRequest, SetModelResponse and the two answers
// it wraps, and nothing else, so the whole of what one method takes and returns
// is readable in one place. The `endpoint_` prefix is the grouping, not a
// directory — see DESIGN-protobuf-surfaces.md for why a directory is not
// available here, and for why a request type belongs to agentrepl.v1 rather
// than frontend.v1.

syntax = "proto3";

package agentrepl.v1;

import "agentrepl/v1/shared.proto";
import "frontend/v1/failure.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// A deliberate request to change an already-live session's model.  The daemon
// forwards this to the shim and only publishes the shim-confirmed selection.
// Bootstrap and rebind intentionally have no model field: they observe session
// state rather than choosing it.  Creation is different — see
// CreateSessionRequest.model, which is a starting choice, not an observation.
message SetModelRequest {
  // Correlation. See agentrepl.v1.AgentRepl.
  string request_id = 1;
  // The workspace whose live session is being re-modelled. See
  // agentrepl.v1.AgentRepl.
  string workspace = 2;
  // The model to change to. Empty is refused rather than read as "the default":
  // a change to nothing in particular is not a change anyone asked for.
  string model = 3;
}

// SetModel's answer: exactly one of a success and an error.
//
// THE SHIM-CONFIRMED SELECTION IS ON BOTH ARMS, and that is this method's one
// departure from the plain two-arm shape. A frontend must never hold an
// optimistic model state, so a REJECTED change still has to say what the
// session is actually on — otherwise the client's only options are to keep
// showing the model it failed to set or to guess.
message SetModelResponse {
  // Echoed from the request that produced this answer. See
  // AcceptQueueEntryResponse.request_id.
  string request_id = 1;
  oneof response {
    SetModelSuccess success = 2;
    SetModelError error = 3;
  }
}

// The shim confirmed the change.
message SetModelSuccess {
  // The shim-confirmed selection, which is what the session is now on. Never
  // empty: a shim that confirmed nothing takes the error arm rather than
  // letting an empty string pass for a selection.
  string selected_model = 1;
}

// Why the model was not changed.
message SetModelError {
  oneof error {
    // The workspace key is not an absolute path.
    RefusalWorkspaceKeyNotAbsolute workspace_key_not_absolute = 1;
    // The request carries an empty model.
    RefusalRequiredFieldMissing required_field_missing = 2;
    // The agent process received the change and refused it.
    FailureShimRejected shim_rejected = 3;
    // The agent process is not connected, so the change had nowhere to go.
    FailureShimNotConnected shim_not_connected = 4;
    // The shim accepted the change but named no selection, so the daemon has
    // nothing confirmed to publish.
    RefusalModelUnconfirmed model_unconfirmed = 5;
    // The change failed for a reason the daemon's classifier could not name.
    frontend.v1.FailureInternalUnclassified unclassified = 6;
  }
  // The shim-confirmed selection the session REMAINS on, so the frontend
  // renders state rather than an optimistic guess after its failed request.
  // Empty when the daemon could not learn one — which is itself a fact worth
  // seeing, and is exactly the model_unconfirmed arm above.
  string selected_model = 7;
  // The feed card this refusal was filed under, when it produced one. See
  // AcceptQueueEntryError.failure_card.
  frontend.v1.FailureCardRef failure_card = 8;
}
