// endpoint_adopt_host_workspace.proto — AdoptHostWorkspace: Emacs's half of
// the per-workspace handover rendezvous. HOST section, called on the NEW
// daemon's connection after the OLD daemon pushed `transferred` for this
// workspace. The VERB identifies the participant — Emacs and the webview
// have sibling adopt verbs, so no request field self-declares the caller's
// kind.
//
// RENDEZVOUS SEMANTICS: the expected participants are the holders of the
// workspace's WatchHostWorkspace and WatchWebWorkspace streams at the moment
// the old daemon announced the transfer. The new daemon completes adoption
// — claim the workspace's kernel lock, adopt the running shim, drain held
// intake — only when EVERY expected participant has called; all calls then
// succeed together. A workspace with no streams (headless) transfers with
// no rendezvous at all, via WSM facts and the lock alone.

syntax = "proto3";

package agentrepl.v1;

import "workspace/v1/workspace.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

message AdoptHostWorkspaceRequest {
  // The workspace being adopted — echoed from the old daemon's registration.
  workspace.v1.WorkspaceRef workspace = 1;
}

message AdoptHostWorkspaceResponse {
  oneof result {
    AdoptHostWorkspaceSuccess success = 1;
    AdoptHostWorkspaceError error = 2;
  }
}

// Adoption is COMPLETE: this daemon owns the workspace, the shim is
// adopted, and held intake has drained. Re-subscribe the workspace's
// streams here now.
message AdoptHostWorkspaceSuccess {}

// Arms derived from the daemon's refusal sites (landing 4, 2026-08-29).
// Validation failures (unset field, UNSPECIFIED enum, blank string) are Connect InvalidArgument, never an arm.
message AdoptHostWorkspaceError {
  oneof cause {
    // The workspace id is not in the daemon's registry.
    AdoptHostWorkspaceUnknownWorkspace unknown_workspace = 1;
    // The echoed dir disagrees with the registry's dir for this id.
    AdoptHostWorkspaceWorkspaceRefMismatch workspace_ref_mismatch = 2;
    // This daemon released the workspace to a successor; dial `address`.
    AdoptHostWorkspaceTransferringAway transferring_away = 3;
    // A joining daemon has not finished adopting this workspace yet.
    AdoptHostWorkspaceNotYetAdopted not_yet_adopted = 4;
    // No transfer was announced for this workspace.
    AdoptHostWorkspaceNoTransferAnnounced no_transfer_announced = 5;
    // The caller's stream was not open at announcement.
    AdoptHostWorkspaceParticipantNotExpected participant_not_expected = 6;
  }
}
message AdoptHostWorkspaceUnknownWorkspace {}
message AdoptHostWorkspaceWorkspaceRefMismatch {
  // The dir the registry holds for this id.
  string registry_dir = 1;
}
message AdoptHostWorkspaceTransferringAway {
  // The successor's `127.0.0.1:<port>`, so a lagging client dials it.
  string address = 1;
}
message AdoptHostWorkspaceNotYetAdopted {}
message AdoptHostWorkspaceNoTransferAnnounced {}
message AdoptHostWorkspaceParticipantNotExpected {}
