// endpoint_report_page_state.proto — ReportPageState: Emacs tells the daemon
// whether it holds a workspace's page in its web view, and why. HOST section.
//
// WHETHER A PAGE IS LOADED IS THE DAEMON'S VERDICT, CARRIED OUT BY EMACS
// (frontend.v1.RosterRowPage; page-unload.el): a page loads when the user
// shows its workspace or when the verdict turns `loaded`, and unloads when the
// verdict turns `unloaded` while the host does not show it, or when the
// workspace stops being visible. The cold gate's hold-back is Emacs's own. This report is how the
// daemon's metrics (agentrepl_pages_loaded, agentrepl_page_loads_total,
// agentrepl_page_unloads_total) and the sidebar's count of loaded pages learn
// why each page was loaded and what Emacs asked the web view to hold.
//
// THE WEB HOST'S FRAMES ARE THE TRUTH OF WHICH PAGES ARE HELD. Emacs records a
// page held before the host has it (a call made while no host stands waits for
// the host's replay, and a host reload retires every frame until it), and a
// host call that failed leaves the host short of what Emacs asked. So the
// counts read the frames the web host's census names (webapp/src/host/
// load-census.ts, `webhost.census` `frames`), each labelled with the reason
// this report gave, and the daemon records any disagreement between the two
// that stands (daemon/internal/pageheld).
//
// THE STATE IS SCOPED TO THE WORKSPACE'S HOST STREAM. The daemon holds what
// this report says only while a WatchHostWorkspace stream of the workspace
// stands, and forgets it when the last one ends, so an editor that exits or a
// daemon that hands its workspaces on can never leave a page counted that no
// web view holds. A report that reaches the daemon while no such stream
// stands (one sent before a release that closed the stream, landing after
// it) sets nothing. So Emacs RESTATES what it holds (the `held` or `not_held`
// arm) each time a workspace's host stream is subscribed, and a daemon that
// has just taken a workspace over learns its page from that restatement.
//
// A CHANGE IS COUNTED ONCE; A RESTATEMENT IS NEVER COUNTED. The `loaded` and
// `unloaded` arms report a load or an unload that just happened and are each
// counted; `held` and `not_held` state what stands, change no counter, and
// set the state alone.
//
// FIRE AND FORGET. The report changes no behavior: a call that fails is
// recorded by Emacs and leaves the daemon's view stale only until the next
// report or the next restatement.
//
// ONE REPORT OF A WORKSPACE IS IN FLIGHT AT A TIME. Emacs sends a workspace's
// next report only once the last has been answered or has failed
// (page-report.el), so the daemon applies them in the order they were made.

syntax = "proto3";

package agentrepl.v1;

import "workspace/v1/workspace.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

message ReportPageStateRequest {
  // The workspace whose page this reports.
  workspace.v1.WorkspaceRef workspace = 1;
  // What the report says of the page: a change that just happened, or a
  // restatement of what stands. The set arm IS the report; an unset oneof is
  // a malformed request (Connect InvalidArgument).
  oneof report {
    // The web view just loaded the page, for the reason given. Counted as a
    // load (agentrepl_page_loads_total).
    ReportPageStateLoaded loaded = 2;
    // The web view just dropped the page, for the reason given. Counted as
    // an unload (agentrepl_page_unloads_total).
    ReportPageStateUnloaded unloaded = 3;
    // A restatement: the web view holds the page, loaded for the reason
    // given. Counted as nothing.
    ReportPageStateHeld held = 4;
    // A restatement: the web view holds no page for the workspace, whose
    // slot may stand. Counted as nothing.
    ReportPageStateNotHeld not_held = 5;
  }
}

// A load that just happened.
message ReportPageStateLoaded {
  // Why the page was loaded.
  ReportPageStateLoadReason reason = 1;
}

// An unload that just happened.
message ReportPageStateUnloaded {
  // Why the page was dropped.
  ReportPageStateUnloadReason reason = 1;
}

// A restatement of a page the web view holds.
message ReportPageStateHeld {
  // Why the page the web view holds was loaded: the reason of its last load.
  ReportPageStateLoadReason reason = 1;
}

// A restatement that the web view holds no page for the workspace.
message ReportPageStateNotHeld {}

// Why a page was loaded: the moment page-unload.el's one load path took. The
// set arm IS the reason; its arm name is the metrics' `reason` label.
message ReportPageStateLoadReason {
  // `awake` (field 2) is RETIRED: a page loads off screen only when the
  // daemon's page verdict wants it (`allocated`).
  reserved 2;
  reserved "awake";
  // The moment that loaded the page; Emacs always sets one. A reason whose
  // arm this daemon's revision does not name (an editor on another build,
  // such as one a deploy has not reloaded yet) is recorded with its reason
  // unnamed, never refused: the load itself is known.
  oneof reason {
    // The user showed the workspace and its page was not held.
    ReportPageStateLoadShown shown = 1;
    // The workspace's slot was made while its page was wanted (the daemon's
    // page verdict `loaded`, not cold-gated).
    ReportPageStateLoadSlot slot = 3;
    // The user clicked the load button the host draws for a cold-gated page.
    ReportPageStateLoadRequested load_requested = 4;
    // The cold gate that held the shown page back was answered or retracted.
    ReportPageStateLoadUngated ungated = 5;
    // The page was held before Emacs recorded why pages are loaded, and no
    // load rule explains it now: neither shown nor wanted. Only the one
    // conversion of a running Emacs's held pages, when it first loads the
    // code that keeps a reason with each page, names it.
    ReportPageStateLoadHeldBeforeReasons held_before_reasons = 6;
    // The daemon's page verdict (frontend.v1.RosterRowPage) turned `loaded`
    // while the workspace's slot stood with no page.
    ReportPageStateLoadAllocated allocated = 7;
  }
}

// The user showed the workspace.
message ReportPageStateLoadShown {}
// The slot was made while the page was wanted.
message ReportPageStateLoadSlot {}
// The user asked for the held-back page.
message ReportPageStateLoadRequested {}
// The gate holding the page back ended.
message ReportPageStateLoadUngated {}
// The page predates the recorded reasons, and no rule explains it now.
message ReportPageStateLoadHeldBeforeReasons {}
// The daemon's page verdict wanted the page.
message ReportPageStateLoadAllocated {}

// Why a page was dropped. The set arm IS the reason; its arm name is the
// metrics' `reason` label.
message ReportPageStateUnloadReason {
  // `dormant` (field 1) is RETIRED: a page an open workspace keeps a slot for
  // unloads when the daemon's page verdict lets it go (`deallocated`).
  reserved 1;
  reserved "dormant";
  // The moment that dropped the page; Emacs always sets one. An arm this
  // daemon's revision does not name is recorded with its reason unnamed,
  // as for a load.
  oneof reason {
    // Its webview slot was taken down while the workspace stays open: the
    // panel closed, a bundle remount, the restart verb's bounce.
    ReportPageStateUnloadDetached detached = 2;
    // The workspace was released from the editor: it stopped being visible,
    // or was closed, killed or merged.
    ReportPageStateUnloadReleased released = 3;
    // The daemon's page verdict (frontend.v1.RosterRowPage) turned `unloaded`
    // while the host did not show the workspace. Its slot stays.
    ReportPageStateUnloadDeallocated deallocated = 4;
  }
}

// The slot was taken down while the workspace stays open.
message ReportPageStateUnloadDetached {}
// The workspace was released from the editor.
message ReportPageStateUnloadReleased {}
// The daemon's page verdict let the page go off screen.
message ReportPageStateUnloadDeallocated {}

// THE ARM IS THE OUTCOME.
message ReportPageStateResponse {
  oneof result {
    ReportPageStateSuccess success = 1;
    ReportPageStateError error = 2;
  }
}
// Recorded.
message ReportPageStateSuccess {}
// Arms derived from the daemon's refusal sites, exactly
// ReportPageUnloading's: this verb resolves the same subject through the
// same guard. Validation failures (unset field, blank string, unset report
// or reason) are Connect InvalidArgument, never an arm.
message ReportPageStateError {
  oneof cause {
    // The workspace id is not in the daemon's registry.
    ReportPageStateUnknownWorkspace unknown_workspace = 1;
    // The echoed dir disagrees with the registry's dir for this id.
    ReportPageStateWorkspaceRefMismatch workspace_ref_mismatch = 2;
    // This daemon released the workspace to a successor; dial `address`.
    ReportPageStateTransferringAway transferring_away = 3;
    // A joining daemon has not finished adopting this workspace yet.
    ReportPageStateNotYetAdopted not_yet_adopted = 4;
  }
}
// The workspace id is not in the daemon's registry.
message ReportPageStateUnknownWorkspace {}
// The echoed dir disagrees with the registry's.
message ReportPageStateWorkspaceRefMismatch {
  // The dir the registry holds for this id.
  string registry_dir = 1;
}
// The workspace moved to a successor daemon.
message ReportPageStateTransferringAway {
  // The successor's `127.0.0.1:<port>`, so a lagging client dials it.
  string address = 1;
}
// A joining daemon has not adopted the workspace yet.
message ReportPageStateNotYetAdopted {
  // The `127.0.0.1:<port>` of the daemon that serves this workspace until the
  // joining daemon adopts it: the handover's incumbent. UNSET when no live
  // daemon serves the workspace (a takeover after the incumbent died), in
  // which case the client waits for the adoption; its restatement on the next
  // host subscribe carries the state.
  optional string address = 1;
}
