// workspace_priority.proto — the workspace priority vocabulary, shared by
// CreateWorkspace (creation-time priority) and SetWorkspacePriority (the
// post-creation setter). A workspace lands second-to-last among the open
// workspaces of its priority (or second-to-last overall when none share it),
// both when it is created with a priority and when one is set later; the user
// may move it anywhere afterwards. The roster row carries it for the badge
// treatment.

syntax = "proto3";

package agentrepl.v1;

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// THE ARM IS THE PRIORITY LEVEL — highest first.
message WorkspacePriority {
  oneof level {
    WorkspacePriorityP05 p05 = 1;
    WorkspacePriorityP1 p1 = 2;
    WorkspacePriorityP2 p2 = 3;
    WorkspacePriorityP3 p3 = 4;
  }
}

message WorkspacePriorityP05 {
}

message WorkspacePriorityP1 {
}

message WorkspacePriorityP2 {
}

message WorkspacePriorityP3 {
}
