// endpoint_nuke_workspace.proto — NukeWorkspace: DATA DESTRUCTION. SIDEBAR
// section. The worktree and branch are DELETED — "nuke" is reserved for
// exactly this, the one verb that destroys data. A live session is killed
// first (KillWorkspace's semantics, implied); then the filesystem goes.
// Unrecoverable by design. The host command is a thin wrapper: send, await
// the ack, then tear the tab down.

syntax = "proto3";

package agentrepl.v1;

import "workspace/v1/workspace.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

message NukeWorkspaceRequest {
  workspace.v1.WorkspaceRef workspace = 1;
  // A CLIENT-MINTED OPERATION ID, as CreateWorkspaceRequest.op_id is: PRESENCE
  // IS OPT-IN TO THE IMMEDIATE ACK (owner ruling, 2026-09-29: the tab closes
  // the moment the daemon acks, never after the teardown). A request that
  // carries one is answered `accepted` as soon as the daemon has refused
  // nothing and marked the workspace CLOSED (so the roster says so
  // everywhere); the teardown then KILLS THE SESSION AND DESTROYS THE WORKTREE AND BRANCH in the background, detached from
  // this request's context, and its end rides WatchDaemon's
  // `mutation_progress` keyed on this id (WorkspaceMutationProgress.nuke).
  // UNSET = the synchronous form: the rpc answers `success` once the teardown
  // is done. The ownership refusals are answered on `error` in both forms.
  optional string op_id = 2;
}

// THE ARM IS THE OUTCOME.
message NukeWorkspaceResponse {
  oneof result {
    // Gone — session dead, worktree and branch deleted; the roster's new
    // state arrives on its stream.
    NukeWorkspaceSuccess success = 1;
    NukeWorkspaceError error = 2;
    // THE IMMEDIATE ACK. Answered, instead of `success`, precisely when the
    // request carried an `op_id`: the workspace is closed and its teardown is
    // running; its end arrives on `mutation_progress` under the same id.
    NukeWorkspaceAccepted accepted = 3;
  }
}
// The immediate ack: the workspace is closed and its teardown detached.
message NukeWorkspaceAccepted {
  // The op_id the request supplied, echoed back.
  string op_id = 1;
}
message NukeWorkspaceSuccess {}
// Arms derived from the daemon's refusal sites (landing 4, 2026-08-29).
// Validation failures (unset field, UNSPECIFIED enum, blank string) are Connect InvalidArgument, never an arm.
message NukeWorkspaceError {
  oneof cause {
    // The workspace id is not in the daemon's registry.
    NukeWorkspaceUnknownWorkspace unknown_workspace = 1;
    // The echoed dir disagrees with the registry's dir for this id.
    NukeWorkspaceWorkspaceRefMismatch workspace_ref_mismatch = 2;
    // This daemon released the workspace to a successor; dial `address`.
    NukeWorkspaceTransferringAway transferring_away = 3;
    // A joining daemon has not finished adopting this workspace yet.
    NukeWorkspaceNotYetAdopted not_yet_adopted = 4;
    // A git operation failed mid-delete.
    NukeWorkspaceGitFailed git_failed = 5;
  }
}
message NukeWorkspaceUnknownWorkspace {}
message NukeWorkspaceWorkspaceRefMismatch {
  // The dir the registry holds for this id.
  string registry_dir = 1;
}
message NukeWorkspaceTransferringAway {
  // The successor's `127.0.0.1:<port>`, so a lagging client dials it.
  string address = 1;
}
message NukeWorkspaceNotYetAdopted {}
message NukeWorkspaceGitFailed {
  // Git's own account of the failure.
  string detail = 1;
}
