// endpoint_roll_out_build.proto — RollOutBuild: the deploy tooling's way to
// put a build it has ALREADY PRODUCED into service. DAEMON ADMIN section.
//
// THIS IS HOW A DEPLOY REACHES A RUNNING STACK. The deploy chain builds with
// its bounce turned off and then calls this verb; the daemon rolls the build
// out the way it rolls out a self-merge — a blue-green handover for a daemon
// change, a per-workspace shim relaunch for a shim change, a webview reload
// for a webapp change — and every one of those waits for the workspace's
// FREENESS (no turn in flight, no live detached work). NOTHING A ROLLOUT DOES
// ENDS A TURN. That is the whole difference from UpdateShutdownSchedule{now},
// which forces every session down and is an operator's emergency stop, never
// a deploy step.
//
// THE CALLER STATES WHAT IT REBUILT, and the daemon does not work it out. A
// self-merge has a landed commit range to classify; a deploy has none that
// can be trusted — the chain fingerprints ARTIFACTS, so it sees a dirty tree
// and a forced rebuild that no commit range describes. Only the chain knows
// which artifacts moved, so the chain says so.
//
// THE ANSWER IS THE ROLLOUT'S ACCEPTANCE, NOT ITS COMPLETION. A rollout waits
// on freeness for as long as freeness takes — a workspace mid-turn is waited
// on, never interrupted — so completion has no bound this call could hold
// open. What follows arrives on the surfaces that already carry it: a
// handover on WatchDaemon's shutdown_announced (with the successor's
// address), a relaunch on the host stream's shim_attached, a reload on the
// host stream's reload_webapp.

syntax = "proto3";

package agentrepl.v1;

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

message RollOutBuildRequest {
  // WHAT THE DEPLOY CHAIN REBUILT. At least one is set; a request naming
  // nothing is malformed (there is nothing to roll out, and saying so is the
  // chain's job before it calls). Presence is the fact — each marker is
  // empty.
  //
  // STORE AND SIDECAR HAVE NO MARKER, deliberately: they are launchd
  // services the chain restarts itself, and the daemon has no part in it.
  optional RollOutBuildDaemon daemon = 1;
  optional RollOutBuildShim shim = 2;
  optional RollOutBuildWebapp webapp = 3;
}
// The daemon binary moved. It wins over the other two: the successor's fresh
// attach pulls the new webapp assets as a side effect, and the shims it
// adopts are bounced onto a new bundle by the ordinary build-staleness check,
// each at its own session's quiet moment.
message RollOutBuildDaemon {}
// The shim bundle moved.
message RollOutBuildShim {}
// The served webapp assets moved.
message RollOutBuildWebapp {}

message RollOutBuildResponse {
  oneof result {
    RollOutBuildSuccess success = 1;
    RollOutBuildError error = 2;
  }
}

// The rollout was ACCEPTED and is under way. THE ARM IS THE ACTION TAKEN —
// exactly one, chosen for the whole request (daemon, else shim, else webapp).
message RollOutBuildSuccess {
  oneof action {
    RollOutBuildHandover handover = 1;
    RollOutBuildShimRelaunch shim_relaunch = 2;
    RollOutBuildWebappReload webapp_reload = 3;
  }
}
// A blue-green handover began. Workspaces transfer to the successor one by
// one as each becomes free, and this daemon exits after the last.
message RollOutBuildHandover {
  // How many workspaces this daemon serves and will transfer.
  uint32 workspaces = 1;
  // How many of them are NOT free right now — the ones the handover is
  // waiting on. Zero means the handover completes without waiting on anyone.
  uint32 busy = 2;
}
// Every live workspace's shim is being relaunched, each at its own freeness.
// A parked workspace needs nothing: its next revival spawns the new bundle.
message RollOutBuildShimRelaunch {
  uint32 workspaces = 1;
  uint32 busy = 2;
}
// Every open webview was told to reload against this same daemon.
message RollOutBuildWebappReload {
  uint32 webviews = 1;
}

message RollOutBuildError {
  oneof cause {
    RollOutBuildAlreadyRollingOut already_rolling_out = 1;
    RollOutBuildJoining joining = 2;
  }
}
// A ROLLOUT IN FLIGHT IS NEVER STARTED AGAIN. A handover is already under
// way — typically waiting on a busy workspace — and its successor was spawned
// from the build that was on disk THEN. Starting a second would stand a
// second successor beside the first. The caller waits for the one in flight
// to finish and calls again.
message RollOutBuildAlreadyRollingOut {
  // The workspaces the rollout in flight is still waiting on, by id.
  repeated string waiting_on = 1;
}
// This daemon is itself a successor still JOINING — it serves nothing yet, so
// it has nothing to roll out. The caller is talking to the wrong daemon or
// too early, and retries once the handover it is part of completes.
message RollOutBuildJoining {}
