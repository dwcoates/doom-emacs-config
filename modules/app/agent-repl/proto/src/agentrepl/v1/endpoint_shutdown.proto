// endpoint_shutdown.proto — the Shutdown endpoint's request and response.
//
// ONE ENDPOINT PER FILE: ShutdownRequest and ShutdownResponse and nothing else,
// so the whole of what one method takes and returns is readable in one place.
// The `endpoint_` prefix is the grouping, not a directory — see
// DESIGN-protobuf-surfaces.md for why a directory is not available here, and for
// why a request type belongs to agentrepl.v1 rather than frontend.v1.

syntax = "proto3";

package agentrepl.v1;

import "agentrepl/v1/frame.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// Graceful daemon shutdown over UDS (replaces Emacs
// POST /shutdown).
message ShutdownRequest {
  // Correlation. See AgentRepl in frame.proto. Daemon-global: no workspace.
  string request_id = 1;
  // stop_shims asks the daemon to SIGTERM every session shim on its way out.
  //
  // The DEFAULT (false) PRESERVES them. A shim outlives its daemon by design:
  // it redials the daemon socket forever with backoff and is auto-parked by
  // the next daemon's listener, so killing it on an orderly shutdown threw
  // away a live, mid-conversation process the very next boot could have
  // reattached to for free. Preserving is what makes a daemon bounce cheap.
  //
  // The mode exists for the one caller that genuinely needs the old behavior:
  // a deploy that changed the shim BUNDLE, whose surviving shims would
  // otherwise keep running the previous build's code (bin/deploy-all.sh
  // passes it when its stamps show the bundle moved). It is belt-and-braces
  // alongside the daemon's own version-driven stale-shim refresh, never the
  // only thing standing between a deploy and stale shims.
  bool stop_shims = 2;
}

// Shutdown's answer: accepted, or the classified account of the refusal.
//
// IT WRAPS CommandAck RATHER THAN BEING CommandAck. Returning the shared ack
// directly gave 33 methods one response type, so no method could gain an answer
// of its own without offering that answer to every other method as well. A
// daemon on its way out has nothing further to report, and the caller's next
// evidence is the connection closing.
message ShutdownResponse {
  // Whether the daemon accepted this call, and when it did not, the classified
  // failure a frontend renders as a card. See CommandAck.
  CommandAck ack = 1;
}
