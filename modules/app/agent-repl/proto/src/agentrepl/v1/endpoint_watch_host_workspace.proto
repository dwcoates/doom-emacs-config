// endpoint_watch_host_workspace.proto — WatchHostWorkspace: the host-facing
// view of ONE workspace. HOST section. Emacs opens one subscription per
// workspace it has open; the daemon streams that workspace's host state,
// whole-replaced per push. NOT DRAWN (the exempt non-GUI residue): Emacs
// uses it to correlate processes, gate its composer, and manage buffers —
// rendering fixed treatments per arm, never mapping values.

syntax = "proto3";

package agentrepl.v1;

import "workspace/v1/workspace.proto";
import "agentrepl/v1/daemon_stream_ending.proto";
import "agentrepl/v1/endpoint_session_health.proto";
import "conversation/v1/turn.proto";
import "conversation/v1/user.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

message WatchHostWorkspaceRequest {
  // The workspace whose host state to watch — the daemon-minted identity,
  // echoed from registration or the roster.
  workspace.v1.WorkspaceRef workspace = 1;
}

message WatchHostWorkspaceResponse {
  oneof push {
    // The workspace's host state, whole-replaced per push.
    HostWorkspace host = 1;
    // DAEMON HANDOVER: this workspace has been released by this (old)
    // daemon at freeness — from this push on, this daemon does NO work for
    // the workspace. Emacs's obligation: call AdoptHostWorkspace on the NEW
    // daemon's connection (address from WatchDaemon's shutdown
    // announcement), then CANCEL this stream and re-subscribe there. The
    // stream stays standing until the client cancels — this arm is a push,
    // never a terminal frame.
    HostWorkspaceTransferred transferred = 3;
    // WEBAPP-ONLY ROLLOUT: rebuilt webapp assets are deployed and Emacs
    // must reload this workspace's xwidget against the SAME daemon. Empty
    // by design: no address rides it (the daemon is not changing), and a
    // combined daemon+webapp rollout never sends it — the handover's fresh
    // attach pulls the new assets as a side effect. The reloaded webview's
    // default first-page load is the whole of the recovery.
    HostWorkspaceReloadWebapp reload_webapp = 4;
    // A HOST-RAISED CLICK relayed from the webview (OpenInEditor): open the
    // path — at the line when given, dired for a directory — through the ONE
    // shared editor-popup subroutine (right side, half width). A fact, not a
    // command: nothing acks it.
    HostOpenInEditor open_in_editor = 5;
    // The daemon is standing down in a planned exit and this is the stream's
    // last frame; the client reattaches to the live daemon without treating
    // the end as a fault. See the message.
    DaemonStreamEnding ending = 6;
    // THE USER CLICKED THIS WORKSPACE'S DESKTOP BANNER: raise Emacs's frame
    // and select this workspace's tab. The daemon posts every desktop
    // notification and reads the click back from the banner itself, so the
    // selection it asks for is the only part of a notification Emacs acts on.
    // An event, not state: never replayed to a late subscriber, because a
    // click belongs to the moment it was made.
    HostWorkspaceNotificationClicked notification_clicked = 7;
    // THE FEED'S SELECTION, whole-replaced on every change: Emacs's copy of
    // what the webapp draws as selected, for the composer's escape handling.
    // State, not an event: a late subscriber is sent the selection in force
    // first. Emacs never acts on its copy beyond that; a sent prompt and a
    // rollback read the daemon's own selection.
    HostWorkspaceSelection selection = 8;
  }
  // Retired: desktop notifications are posted by the daemon and never cross
  // this stream, and the tab blink is drawn from the roster's attention
  // marker (frontend.v1.RosterRowAttention).
  reserved 2;
  reserved "notification";
}

// The relayed click's target, verbatim from the request.
message HostOpenInEditor {
  // The path on this host.
  string path = 1;
  // The 1-indexed line. UNSET = the file's top (or a directory).
  optional uint32 line = 2;
}

message HostWorkspaceTransferred {}
message HostWorkspaceReloadWebapp {}

// The user clicked this workspace's desktop banner. Empty: the stream it
// rides names the workspace, and selecting that workspace's tab is the whole
// of Emacs's obligation.
message HostWorkspaceNotificationClicked {}

// The host-facing state of one workspace: what Emacs needs to correlate
// processes, gate its composer, and manage buffers — nothing a webview draws.
message HostWorkspace {
  // The session axis. THE ARM IS WHETHER A SESSION EXISTS; the existing
  // arm's own oneof is its standing. Everything that only means anything in
  // one standing lives INSIDE that standing's arm.
  oneof session {
    // Registered, but no session was ever created for it.
    HostSessionNone none = 1;
    // A session exists (current: live or ended).
    HostSessionExisting existing = 2;
  }
  // What Emacs names the workspace's buffers from — a sibling of the
  // lifecycle because a buffer needs a name in every standing.
  HostWorkspaceNaming naming = 3;
  // The held prompt this workspace's editor is EDITING (EditHeldPrompt),
  // absent when no edit stands. It is STATE, not an event, so a subscriber
  // always reads the edit that stands now: the editor puts `said` into its
  // input when an edit it has not yet taken appears, and leaves its edit mode
  // when the field goes absent (a commit, a cancel, the prompt dropped).
  HostHeldPromptEdit held_prompt_edit = 4;
}

// One standing held-prompt edit.
message HostHeldPromptEdit {
  // The held prompt being edited — the turn a commit or cancel names.
  conversation.v1.TurnId turn = 1;
  // The prompt's content as the edit began, WHOLE.
  conversation.v1.UserSaid said = 2;
  // Which edit this is: daemon-minted, distinct for every begin, so a second
  // edit of the same prompt with the same content is still a new edit.
  uint64 edit = 3;
}

message HostSessionNone {}

// A session that exists: its identity, and its standing.
message HostSessionExisting {
  // The session's identity — common to every standing, which is why it
  // lives here rather than repeated per arm. Sessions rotate under one
  // workspace; this is what distinguishes them, and what Emacs correlates
  // transcripts, health probes and fault windows against.
  HostSessionId id = 1;
  // THE ARM IS THE STANDING.
  oneof standing {
    HostSessionLive live = 2;
    HostSessionTerminal terminal = 3;
  }
}

message HostSessionLive {
  // The controller generation operating the session. Rotates on restart
  // without the session id changing; fault windows are scoped to it.
  HostGenerationId generation = 1;
  // Whether the session's shim process is attached right now. False while
  // the daemon is between shim starts (crash, restart under way) — what
  // distinguishes "live but momentarily unwired" from "up".
  bool shim_attached = 2;
  // The vendor's own identifiers for the session's conversation. THE ARM IS
  // THE VENDOR. Unset while no vendor conversation exists yet.
  oneof vendor_info {
    HostVendorClaude claude = 3;
  }
  // Whether the on-disk transcript has reached the store — the never-blue
  // signal: a live session whose history never arrived is not ready to show.
  HostBackfill backfill = 4;
  // Whether prompting is allowed right now. THE ARM IS THE GATE — only a
  // LIVE session has an open question here; the other lifecycle arms are
  // blocked by their own nature, which the arm itself states. Emacs renders
  // the arm verbatim.
  oneof composer {
    HostComposerOpen open = 5;
    // A merge owns the session under a lease that REFUSES prompts, which
    // only an older build writes. A merge lease that HOLDS (every merge
    // since 2026-10-01) answers `open`: what is submitted is held until the
    // merge ends.
    HostComposerMerging merging = 6;
    // The daemon is draining toward a scheduled shutdown.
    HostComposerDraining draining = 7;
    // The workspace's shim is being restarted (graceful RestartWorkspace).
    HostComposerRestarting restarting = 8;
  }
  // Tag 10 (`merge_parked`) is RETIRED: a merge never parks. A merge that
  // gives up fails and hands the workspace back, and the composer is then
  // simply open.
  reserved 10;
  reserved "merge_parked";
  // Standing faults scoped to `generation`, for doctor output; a fault
  // window dies with its generation, which is why these live on the LIVE
  // arm and nowhere else.
  repeated HostFault faults = 9;
}

message HostSessionTerminal {
  // Whether a new session can resume this one's vendor conversation. False
  // means reopening starts a fresh conversation.
  bool rehydratable = 1;
}


// A daemon-minted session identity — the echo token Emacs correlates by.
message HostSessionId {
  string value = 1;
}

// A daemon-minted controller-generation identity; rotates on restart within
// one session. Scopes fault windows and health probes.
message HostGenerationId {
  string value = 1;
}

// The vendor conversation's identifiers, for transcripts and support reports.
message HostVendorClaude {
  // The vendor conversation id.
  string session_id = 1;
  // The account the session runs against (its CLAUDE_CONFIG_DIR) — which
  // login this conversation belongs to.
  string config_dir = 2;
}

// What Emacs names buffers from. Facts only — their DRAWN home is the
// topbar's title elements.
message HostWorkspaceNaming {
  // The short machine-friendly name ("fix-flaky-reconnect"). UNSET until the
  // daemon has derived one.
  optional string slug = 1;
  // The human title. UNSET until the vendor supplies one.
  optional string title = 2;
}

// Whether the on-disk transcript has been backfilled into the store. THE ARM
// IS THE STATE.
message HostBackfill {
  oneof state {
    // No transcript exists on disk: a genuinely fresh workspace.
    HostBackfillNone none = 1;
    // A transcript exists, but no file-plane event has arrived yet.
    HostBackfillPending pending = 2;
    // The file plane delivered into the store.
    HostBackfillDone done = 3;
    // Part of the transcript could not be read.
    HostBackfillFailed failed = 4;
  }
}
message HostBackfillNone {}
message HostBackfillPending {}
message HostBackfillDone {}
message HostBackfillFailed {
  // The sidecar's account, verbatim. (Known evidence gap: a non-parse read
  // error today manifests as pending-forever, not failed — carried from the
  // old BackfillState comment, owed to the wave.)
  string detail = 1;
}

message HostComposerOpen {}
message HostComposerMerging {}
message HostComposerDraining {}
message HostComposerRestarting {}
// One standing fault — the same kinds SessionHealth's SessionFault carries,
// the same messages: a session's fault classes do not change because the
// host stream is what reports them. Kinds derived from the controller's real
// fault sites (landing 4, 2026-08-29).
message HostFault {
  // The dynamic account, verbatim — supplements the kind, never replaces it.
  string detail = 1;
  // When the fault window opened, epoch ms.
  int64 opened_at_ms = 2;
  oneof kind {
    // Starting the session's shim failed.
    SessionFaultShimStartFailed shim_start_failed = 3;
    // The shim exited while the session was live.
    SessionFaultShimDied shim_died = 4;
    // The daemon-shim link was severed.
    SessionFaultLinkSevered link_severed = 5;
    // Resuming the vendor session failed.
    SessionFaultResumeFailed resume_failed = 6;
    // A bounce's replacement shim died before it came up.
    SessionFaultBounceDied bounce_died = 7;
    // A bounce ended in a state the controller cannot name.
    SessionFaultBounceUnknown bounce_unknown = 8;
    // The turn classifier failed.
    SessionFaultClassifierFailed classifier_failed = 9;
    // A shim-side SessionFault, relayed.
    SessionFaultShimReported shim_reported = 10;
    // A recorded conversation whose transcript was gone at bring-up.
    SessionFaultConversationAbandoned conversation_abandoned = 11;
    // The liveness probe's own answer: there is no session here at all.
    SessionFaultSessionAbsent session_absent = 12;
    // The shim refused a watch open for a handle nothing announced.
    SessionFaultWatchOpenRefused watch_open_refused = 13;
    // The daemon's own state client would not answer the fault read.
    SessionFaultDaemonStateUnreadable daemon_state_unreadable = 14;
    // A handover whose adoption window ran out with this workspace unclaimed.
    SessionFaultAdoptionWindowExpired adoption_window_expired = 15;
    // A concluded turn whose answering response the feed could not stand
    // behind, or an open response that went silent.
    SessionFaultFinalAnswerUnresolved final_answer_unresolved = 16;
  }
}


// What the workspace's feed has selected, as Emacs needs it: only which kind of
// row, never the row, because Emacs never names it back.
message HostWorkspaceSelection {
  // Exactly one is set on every push.
  oneof selection {
    // Nothing is selected.
    HostWorkspaceSelectionNone none = 1;
    // A final response is selected; the next prompt replies to it.
    HostWorkspaceSelectionResponse response = 2;
    // A prompt is selected; the rollback keys roll back to just before it.
    HostWorkspaceSelectionPrompt prompt = 3;
  }
}
// Nothing is selected.
message HostWorkspaceSelectionNone {}
// A final response is selected.
message HostWorkspaceSelectionResponse {}
// A prompt is selected.
message HostWorkspaceSelectionPrompt {}
