// endpoint_select_workspace.proto — SelectWorkspace: the user switched to
// this workspace in the editor. HOST section. The daemon stamps `current`
// and the row's last-selected instant; the roster stream reflects it.
// IDEMPOTENT: re-selecting the already-current workspace is a success.

syntax = "proto3";

package agentrepl.v1;

import "frontend/v1/feed.proto";
import "workspace/v1/workspace.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

message SelectWorkspaceRequest {
  workspace.v1.WorkspaceRef workspace = 1;
  // A ROW OF THE SELECTED WORKSPACE'S ROOT FEED TO REVEAL once it is
  // selected: its page brings the row on screen, opens it and marks it
  // (WebWorkspaceRevealRow). Unset selects and reveals nothing. A merge queue
  // entry for an async merge sets it to the merge's bubble in its requester's
  // feed (FeedMergeQueueBubble), so the click opens that bubble rather than
  // the hidden merge workspace (owner ruling, 2026-10-17).
  optional frontend.v1.FeedId reveal = 2;
  // A STEP OF A WALK THROUGH THE SELECTION HISTORY, not a choice: the daemon
  // stamps `current` but leaves the row's last-selected instant as it stands.
  // Emacs's recency walk (`s-[` / `s-]`) sets it, so the walk never reorders
  // the history it walks: each press lands one place further along the same
  // order (owner request, 2026-10-20).
  bool keep_selection_history = 3;
}

// THE ARM IS THE OUTCOME.
message SelectWorkspaceResponse {
  oneof result {
    SelectWorkspaceSuccess success = 1;
    SelectWorkspaceError error = 2;
  }
}
// Selected; the roster stream carries the new `current`.
message SelectWorkspaceSuccess {
  // THE ROSTER REVISION THE SELECTION IS IN (frontend.v1
  // WorkspaceRoster.revision): every roster at this revision or later carries
  // it. The answer and the roster ride separate streams, so a roster resolved
  // before the selection can arrive after the answer; a client that moved on
  // the selection judges the roster's `current` only once it holds a roster at
  // this revision, and is never moved back by one from before it.
  uint64 roster_revision = 1;
}
// Arms derived from the daemon's refusal sites (landing 4, 2026-08-29).
// Validation failures (unset field, UNSPECIFIED enum, blank string) are Connect InvalidArgument, never an arm.
message SelectWorkspaceError {
  oneof cause {
    // The workspace id is not in the daemon's registry.
    SelectWorkspaceUnknownWorkspace unknown_workspace = 1;
    // The echoed dir disagrees with the registry's dir for this id.
    SelectWorkspaceWorkspaceRefMismatch workspace_ref_mismatch = 2;
    // This daemon released the workspace to a successor; dial `address`.
    SelectWorkspaceTransferringAway transferring_away = 3;
    // A joining daemon has not finished adopting this workspace yet.
    SelectWorkspaceNotYetAdopted not_yet_adopted = 4;
    // This daemon is standing down (a stop, a restart, a drain at its end)
    // and starts no session. The SELECTION IS RECORDED; only the revival is
    // not attempted here. The client re-asserts the selection on the daemon
    // that serves next (a successor, or a fresh boot), which revives it.
    SelectWorkspaceStandingDown standing_down = 5;
  }
}
message SelectWorkspaceUnknownWorkspace {}
message SelectWorkspaceWorkspaceRefMismatch {
  // The dir the registry holds for this id.
  string registry_dir = 1;
}
message SelectWorkspaceTransferringAway {
  // The successor's `127.0.0.1:<port>`, so a lagging client dials it.
  string address = 1;
}
message SelectWorkspaceNotYetAdopted {}
// The answer of a daemon that is leaving: the selection stands in the state
// it shares with whatever serves next, and no session is started for a
// workspace this daemon is about to stop serving. It carries no address,
// because a plain stand-down has no successor to name; a handover's departing
// daemon answers `transferring_away` instead.
message SelectWorkspaceStandingDown {}
