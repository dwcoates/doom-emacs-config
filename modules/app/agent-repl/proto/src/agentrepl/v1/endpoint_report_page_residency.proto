// endpoint_report_page_residency.proto — ReportPageResidency: what Emacs holds
// of a workspace's page, and when it lets go. HOST section.
//
// PAGE RESIDENCY IS EMACS'S. page-unload.el loads and unloads each workspace's
// page by the workspace's status (owner ruling, 2026-10-29), and the daemon
// serves that fact back on the rail's workspace hover
// (frontend.v1.SidebarWorkspaceMemory.page), so Emacs states it here whenever
// it changes: a load, an unload, or a change in when the page will be
// unloaded. The daemon keeps the latest report per workspace in memory; a
// daemon that took the workspace over holds none until Emacs reports again,
// which it does for every workspace on every link-up.
//
// IDEMPOTENT: reporting the same residency again changes nothing.

syntax = "proto3";

package agentrepl.v1;

import "workspace/v1/workspace.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

message ReportPageResidencyRequest {
  // The workspace whose page this is.
  workspace.v1.WorkspaceRef workspace = 1;
  // What Emacs holds of it now.
  PageResidency residency = 2;
}

// What Emacs holds of one workspace's page.
message PageResidency {
  // Whether the page is held in the host web view.
  oneof state {
    // The page is loaded, and is let go as `release` says.
    PageResidencyLoaded loaded = 1;
    // The page is not loaded: the workspace's slot stands with no page, and
    // the switch to it loads one.
    PageResidencyNotLoaded not_loaded = 2;
  }
}

// The page is loaded.
message PageResidencyLoaded {
  // When it is unloaded.
  PageResidencyRelease release = 1;
}

// When a loaded page is unloaded: the one rule of page-unload.el that applies
// to the workspace's status now.
message PageResidencyRelease {
  // Which rule.
  oneof when {
    // Held: the workspace works, or has no status yet, so no unload is due.
    PageResidencyReleaseHeld held = 1;
    // Unloaded the moment the user switches away from it: a page loaded only
    // for a visit, or one whose status holds it only while shown.
    PageResidencyReleaseOnLeave on_leave = 2;
    // Unloaded at an instant: an idle page, an hour past its last prompt.
    PageResidencyReleaseAt at = 3;
  }
}

// Held. Empty: presence is the fact.
message PageResidencyReleaseHeld {}

// Unloaded on the switch away. Empty: presence is the fact.
message PageResidencyReleaseOnLeave {}

// Unloaded at an instant.
message PageResidencyReleaseAt {
  // The instant, in Unix milliseconds of Emacs's clock.
  int64 unix_ms = 1;
}

// Not loaded. Empty: presence is the fact.
message PageResidencyNotLoaded {}

// THE ARM IS THE OUTCOME.
message ReportPageResidencyResponse {
  oneof result {
    ReportPageResidencySuccess success = 1;
    ReportPageResidencyError error = 2;
  }
}
// Recorded.
message ReportPageResidencySuccess {}
// Arms derived from the daemon's refusal sites, exactly ReportPageUnloading's:
// this verb resolves the same subject through the same guard.
// Validation failures (unset field, blank string) are Connect InvalidArgument, never an arm.
message ReportPageResidencyError {
  oneof cause {
    // The workspace id is not in the daemon's registry.
    ReportPageResidencyUnknownWorkspace unknown_workspace = 1;
    // The echoed dir disagrees with the registry's dir for this id.
    ReportPageResidencyWorkspaceRefMismatch workspace_ref_mismatch = 2;
    // This daemon released the workspace to a successor; dial `address`.
    ReportPageResidencyTransferringAway transferring_away = 3;
    // A joining daemon has not finished adopting this workspace yet.
    ReportPageResidencyNotYetAdopted not_yet_adopted = 4;
  }
}
// The workspace id is not registered. Empty: the echoed ref is the identity.
message ReportPageResidencyUnknownWorkspace {}
// The echoed dir disagrees with the registry.
message ReportPageResidencyWorkspaceRefMismatch {
  // The dir the registry holds for this id.
  string registry_dir = 1;
}
// The workspace moved to a successor daemon.
message ReportPageResidencyTransferringAway {
  // The successor's `127.0.0.1:<port>`, so a lagging client dials it.
  string address = 1;
}
// The joining daemon has not adopted the workspace yet. Empty: presence is the fact.
message ReportPageResidencyNotYetAdopted {
  // The `127.0.0.1:<port>` of the daemon that serves this workspace until the
  // joining daemon adopts it: the handover's incumbent. A client views and
  // acts on the workspace there in the meantime, and the incumbent's later
  // `transferred` push re-homes it. UNSET when no live daemon serves the
  // workspace (a takeover after the incumbent died), in which case the client
  // waits for the adoption.
  optional string address = 1;
}
