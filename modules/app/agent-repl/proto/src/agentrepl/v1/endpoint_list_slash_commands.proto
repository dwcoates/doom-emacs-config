// endpoint_list_slash_commands.proto — ListSlashCommands: every slash command
// one workspace's agent runtime answers, for the host-native composer to
// complete as the user types `/`. HOST section. The daemon answers from the
// catalog the workspace's session last stated
// (conversation.v1.SessionUpdate.command_catalog); it never asks the shim, so
// the answer is immediate and is available while the session is parked.

syntax = "proto3";

package agentrepl.v1;

import "conversation/v1/slash_command.proto";
import "workspace/v1/workspace.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

message ListSlashCommandsRequest {
  // The workspace whose composer is completing.
  workspace.v1.WorkspaceRef workspace = 1;
}

// THE ARM IS THE OUTCOME.
message ListSlashCommandsResponse {
  oneof result {
    ListSlashCommandsSuccess success = 1;
    ListSlashCommandsError error = 2;
  }
}

// The daemon's answer about the workspace's catalog. Whether a catalog has
// been stated at all is an ANSWER, never an error: a workspace whose session
// has not yet read its runtime's commands is an ordinary state.
message ListSlashCommandsSuccess {
  // Whether the workspace's session has stated its catalog. Exactly one arm.
  oneof catalog {
    // The catalog the workspace's session last stated.
    ListSlashCommandsStated stated = 1;
    // No session of this workspace has stated a catalog since this daemon
    // took the workspace on.
    ListSlashCommandsUnstated unstated = 2;
  }
}

// The workspace's standing catalog. It outlives the session that stated it:
// a parked or restarting session keeps offering the commands its runtime last
// answered, until a new statement replaces them.
message ListSlashCommandsStated {
  // The catalog, exactly as the session stated it.
  conversation.v1.SessionCommandCatalog catalog = 1;
}

// No catalog is known for the workspace yet. A composer offers nothing and
// asks again later; the session states its catalog once it is up.
message ListSlashCommandsUnstated {}

// Arms derived from the daemon's refusal sites.
// Validation failures (unset field, UNSPECIFIED enum, blank string) are Connect InvalidArgument, never an arm.
message ListSlashCommandsError {
  oneof cause {
    // The workspace id is not in the daemon's registry.
    ListSlashCommandsUnknownWorkspace unknown_workspace = 1;
    // The echoed dir disagrees with the registry's dir for this id.
    ListSlashCommandsWorkspaceRefMismatch workspace_ref_mismatch = 2;
    // This daemon released the workspace to a successor; dial `address`.
    ListSlashCommandsTransferringAway transferring_away = 3;
    // A joining daemon has not finished adopting this workspace yet.
    ListSlashCommandsNotYetAdopted not_yet_adopted = 4;
  }
}
// The workspace id is not in the daemon's registry.
message ListSlashCommandsUnknownWorkspace {}
// The echoed dir disagrees with the registry's dir for this id.
message ListSlashCommandsWorkspaceRefMismatch {
  // The dir the registry holds for this id.
  string registry_dir = 1;
}
// This daemon released the workspace to a successor.
message ListSlashCommandsTransferringAway {
  // The successor's `127.0.0.1:<port>`, so a lagging client dials it.
  string address = 1;
}
// A joining daemon has not finished adopting this workspace yet.
message ListSlashCommandsNotYetAdopted {
  // The `127.0.0.1:<port>` of the daemon that serves this workspace until the
  // joining daemon adopts it: the handover's incumbent. A client views and
  // acts on the workspace there in the meantime, and the incumbent's later
  // `transferred` push re-homes it. UNSET when no live daemon serves the
  // workspace (a takeover after the incumbent died), in which case the client
  // waits for the adoption.
  optional string address = 1;
}
