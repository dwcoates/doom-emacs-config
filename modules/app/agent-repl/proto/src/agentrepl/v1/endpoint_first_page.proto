// endpoint_first_page.proto — the FirstPage endpoint's request, success and
// error.
//
// ONE ENDPOINT PER FILE: FirstPageRequest, FirstPageResponse and the two
// answers it wraps, and nothing else, so the whole of what one method takes and
// returns is readable in one place. The `endpoint_` prefix is the grouping, not
// a directory — see DESIGN-protobuf-surfaces.md for why a directory is not
// available here, and for why a request type belongs to agentrepl.v1 rather
// than frontend.v1.

syntax = "proto3";

package agentrepl.v1;

import "agentrepl/v1/shared.proto";
import "frontend/v1/failure.proto";
import "frontend/v1/feed.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// Ask for the MOST RECENT page, and reset this reader's position to it.
//
// The cold open and the whole recovery story: a client that bounced, rotated
// its seq space, or lost its place calls this and starts from the bottom.
message FirstPageRequest {
  // Correlation. The ConversationHistoryPage pushed in answer echoes this id,
  // so a client can DISCARD a page it is no longer awaiting.
  string request_id = 1;
  // WHICH READER, and therefore which Subscribe stream the page is pushed down.
  // The daemon's position is per READER per workspace per scope, and under a
  // service a paging call no longer shares a socket with the stream that
  // answers it — so the reader has to name itself. See
  // agentrepl.v1.SubscribeRequest.client_id.
  string client_id = 2;
  // Which conversation. The daemon's position is per reader PER WORKSPACE, so
  // this is what selects the position being reset.
  string workspace = 3;
  // WHICH CONTAINER this page walks: the feed, or the inside of one message.
  // The daemon's position is per reader per workspace PER SCOPE, so this also
  // selects which position is being reset — opening a subagent does not throw
  // away where the reader was in the feed.
  //
  // Unset is NOT a default. A request that does not state its scope is REFUSED,
  // never read as the feed: defaulting would answer a client that forgot to
  // name its container with the whole conversation.
  frontend.v1.PageScope scope = 4;
}

// FirstPage's answer: exactly one of a success and an error.
//
// TWO ARMS, NOT AN `ok` BIT PLUS AN OPTIONAL FAILURE — see
// AcceptQueueEntryResponse for the whole of that argument.
message FirstPageResponse {
  // Echoed from the request that produced this answer. See
  // AcceptQueueEntryResponse.request_id.
  string request_id = 1;
  oneof response {
    FirstPageSuccess success = 2;
    FirstPageError error = 3;
  }
}

// The page is served and this reader's position is reset to it.
//
// NO ARMS, AND NO PAGE. The page itself arrives on the caller's Subscribe
// stream as a ConversationHistoryPage — feed content has exactly one delivery
// shape here, and it is not this one. Carrying it in both places would give a
// client two copies to reconcile and one ordering guarantee fewer.
message FirstPageSuccess {}

// Why no page was served.
message FirstPageError {
  oneof error {
    // The call carries no reader identity.
    RefusalReaderIdentityMissing reader_identity_missing = 1;
    // The request does not state its scope.
    RefusalRequiredFieldMissing required_field_missing = 2;
    // No resyncer is wired, so the conversation history page cannot be served
    // at all.
    RefusalDependencyUnwired resyncer_unwired = 3;
    // The workspace's live connection changed under this view.
    FailureReconnectSuperseded reconnect_superseded = 4;
    // The page could not be read.
    RefusalReplayFailed page_failed = 5;
    // The daemon produced neither a page nor a failure. Never silently absent:
    // a client cannot tell an absent page from an empty conversation.
    RefusalPageAbsent page_absent = 6;
    // The read failed for a reason the daemon's classifier could not name.
    frontend.v1.FailureInternalUnclassified unclassified = 7;
  }
  // The feed card this refusal was filed under, when it produced one. See
  // AcceptQueueEntryError.failure_card.
  frontend.v1.FailureCardRef failure_card = 8;
}
