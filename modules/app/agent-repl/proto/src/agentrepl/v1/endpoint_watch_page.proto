// endpoint_watch_page.proto — WatchPage / SubscribePage / UnsubscribePage: the
// ONE standing stream a browser page holds, and the two verbs that populate it.
//
// WHY THIS EXISTS: A BROWSER CANNOT HOLD MANY STANDING STREAMS AT ONCE. The
// daemon serves h2c, but no browser negotiates cleartext HTTP/2, so a webview
// talks HTTP/1.1 — which caps a page at about SIX connections per host, and a
// server-streaming Connect call pins one for its whole life. The webapp held
// six (`WatchWorkspaceRoster`, `WatchWebWorkspace`, `WatchDaemon`,
// `WatchTopbar`, `WatchFooter`, and a held-prompt tray's own) before its feed
// tail was even opened, and every stream after those SILENTLY QUEUED FOREVER: no
// request on the wire, no error, no frame. The root feed's tail was the
// seventh, so no row a workspace produced after the page loaded was ever
// drawn. Every expanded subagent bubble opens another feed tail, so the count
// grew with the conversation and no fixed budget could contain it.
//
// THE COUNT IS THE FIX, NOT THE ORDER. A page multiplexes EVERY standing
// subscription onto this one stream, so the number of connections a page holds
// is ONE no matter how many views it watches. That is a structural property of
// the protocol rather than a budget anyone has to respect: there is no second
// stream to open.
//
// THE ATTACHMENT IS A LATCH, NOT A RACE. `SubscribePage` names a page that must
// already be attached, so its first frame — `PageAttached` — is sent the moment
// the daemon has registered the page and BEFORE any subscription can exist. A
// client subscribes only after reading it.
//
// A PAGE CALL NAMES THE DAEMON THAT HOLDS THE PAGE. Two daemons run side by
// side at a deploy's handover, the page's stream lives in exactly one of them,
// and a unary call is a new connection that either may accept. So
// `PageAttached` hands the page a `PageAttachment`, every `SubscribePage` and
// `UnsubscribePage` echoes it, and whichever daemon receives the call sends it
// to the daemon the attachment names. A call is therefore only ever evaluated
// by the daemon that issued its attachment; when that daemon no longer holds
// the page, the answer is `page_gone`, which ends that attachment and is not a
// failure.
//
// A WORKSPACE'S VIEW COMES FROM THE DAEMON THAT SERVES THE WORKSPACE, which
// need not be the one holding the page. The page's daemon then runs the
// subscription as a relay of the dedicated rpc on the serving daemon and
// writes its pushes into the page's stream, in either direction: a page on the
// departing daemon watching a workspace already handed on, or a page on the
// successor watching a workspace the departing daemon still serves.
//
// AN ENDING NAMES ITSELF. `PageSubscriptionEnded` carries a `how` arm, so a
// client the daemon unsubscribed, a source that simply finished, and a watch
// that failed are three distinguishable facts rather than one silent one.
//
// A SUBSCRIPTION IS EXACTLY THE STREAM IT REPLACES. Its request is the same
// `Watch*Request` the dedicated rpc takes and its pushes are the same
// `Watch*Response`, so every per-stream semantic — the subscription invariant,
// `WatchFeed`'s token pin, a refused open — is unchanged. What changed is which
// socket carries it.

syntax = "proto3";

package agentrepl.v1;

import "agentrepl/v1/daemon_stream_ending.proto";
import "agentrepl/v1/endpoint_watch_workspace_roster.proto";
import "agentrepl/v1/endpoint_watch_web_workspace.proto";
import "agentrepl/v1/endpoint_watch_daemon.proto";
import "agentrepl/v1/endpoint_watch_topbar.proto";
import "agentrepl/v1/endpoint_watch_footer.proto";
import "agentrepl/v1/endpoint_watch_feed.proto";
import "agentrepl/v1/endpoint_watch_login_terminal.proto";
import "agentrepl/v1/endpoint_watch_chat.proto";
import "agentrepl/v1/endpoint_watch_workspace_mentions.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// Opens the page's one stream.
message WatchPageRequest {
  // The page's own identity, minted by the client and unique for the life of
  // the loaded document. `SubscribePage` and `UnsubscribePage` name it.
  //
  // A SECOND STREAM FOR ONE PAGE ID REPLACES THE FIRST. A page holds exactly
  // one, so a second can only be the page reopening after an end the daemon
  // has not finished unwinding. The first stream and every subscription on it
  // end, and the second is issued its own `PageAttachment`, so a call still
  // carrying the first's is answered `page_gone`.
  string page = 1;
  // PRESENT ONLY ON THE PAGE STREAMS OF EMACS'S OWN WEB VIEWS: the web view
  // host's and the sidebar's (webapp/src/host/document.ts). They are the
  // documents a handover no longer reloads, so each states the webapp build it
  // was loaded from, and a deploy that built another reloads them
  // (WatchDaemonResponse.reload_webhost: Emacs reloads the host, and the
  // sidebar with it). Absent on every workspace page, which states its build on
  // WatchWebWorkspace.
  optional WebhostPage webhost = 2;
}

// The web view host's page stream: what it was loaded from, and which of the
// host's loads it is.
message WebhostPage {
  // The webapp build the host was loaded from (webapp/src/webapp-build.ts).
  // REQUIRED and not empty.
  string webapp_build = 1;
  // THE HOST'S RELOAD GENERATION: how many times the Emacs that owns the web
  // view host has reloaded it since it created it, 0 for the host's first
  // load. The sidebar's document reloads with the host and states the same
  // generation. Emacs counts the reloads (lisp/webhost.el) and hands each
  // document its generation in its URL (`reload=<n>`), which the document
  // states here unchanged.
  //
  // WHY: a host's two documents attach together, often in the same
  // millisecond, and a reload pushed on the first one's attach finds the
  // second still on the old build. A stale build alone cannot tell "has not
  // reloaded yet" from "reloaded and ignored the push", so the daemon records,
  // with each reload it pushes (WatchDaemonResponse.reload_webhost), the
  // highest generation a stale host stood at. A stale host that attaches at
  // that generation or below has not reloaded yet; one above it reloaded and
  // still runs another build, and only that is an error.
  //
  // UNSET when the document's loader states no generation (an Emacs that
  // predates this field loads it with no `reload` parameter): such a host's
  // reload cannot be judged, and the daemon treats it as not reloaded yet.
  optional uint32 reload_generation = 2;
}

// One frame on the page's stream.
message WatchPageResponse {
  oneof frame {
    // The page is registered and `SubscribePage` will find it. ALWAYS FIRST,
    // and sent exactly once.
    PageAttached attached = 1;
    // One subscription's push, exactly as its own rpc would have sent it.
    PageFrame push = 2;
    // One subscription is over and will push nothing further.
    PageSubscriptionEnded ended = 3;
    // The daemon is standing down in a PLANNED EXIT and this is the page
    // stream's last frame, sent once every subscription on it has sent its
    // own last frame (each kind's planned `ending`, where its rpc has one).
    // A page reading it reopens on the daemon that serves next WITHOUT
    // filing the unreachable failure: the end is the daemon's own decision,
    // never a cut link. No `ended` frame is sent for a subscription the exit
    // ends; this frame is its end.
    DaemonStreamEnding ending = 4;
  }
}

// The latch: the daemon has registered this page.
message PageAttached {
  // The webapp build this daemon serves (the installed dist's entry bundle
  // hash, as webapp/src/webapp-build.ts reads a page's own). REQUIRED and not
  // empty.
  //
  // A PAGE ON ANOTHER BUILD SUBSCRIBES NOTHING until it is reloaded onto this
  // one: the frames a daemon of another build pushes carry fields the page has
  // no descriptor for, and on 2026-11-15 the pages still on 0.442's webapp
  // failed to decode 24 frames of the 0.443 daemon in the minute before their
  // reload was pushed. The reload itself is the deploy's
  // (WatchWebWorkspaceResponse.reload_webapp, WatchDaemonResponse.reload_webhost).
  string webapp_build = 1;
  // This attachment's identity, echoed on every page call made under it.
  // REQUIRED.
  PageAttachment attachment = 2;
}

// One attachment of one page to one daemon: which daemon holds the page's
// stream, and which of that page's attachments to it this is.
//
// MINTED BY THE DAEMON AND ECHOED UNCHANGED. A page never builds or alters
// one. It exists so a page call states which stream it belongs to, instead of
// being matched to a stream by whichever daemon happened to accept the call.
message PageAttachment {
  // The daemon process that holds the page's stream (its instance id). A
  // daemon that receives a page call naming another instance sends the call
  // there, or answers `page_gone` when that process no longer runs. REQUIRED
  // and not empty.
  string instance = 1;
  // Which attachment this is among the ones that daemon has issued: a value
  // it never issues twice. A page that reattaches to the same daemon is
  // issued a new one, so a call left over from its earlier attachment cannot
  // be mistaken for one of the current attachment's.
  uint64 sequence = 2;
}

// One push, addressed to the subscription that asked for it.
message PageFrame {
  // The subscription id `SubscribePage` was given.
  string subscription = 1;

  // The push itself. Each arm is the response type of the rpc the
  // subscription stands in for, unchanged.
  oneof payload {
    WatchWorkspaceRosterResponse roster = 2;
    WatchWebWorkspaceResponse web_workspace = 3;
    WatchDaemonResponse daemon = 4;
    WatchTopbarResponse topbar = 5;
    WatchFooterResponse footer = 6;
    WatchFeedResponse feed = 8;
    LoginTerminalOutput login_terminal = 9;
    // A thread page's chat view (WatchChat).
    WatchChatResponse chat = 10;
    // A workspace page's mention targets (WatchWorkspaceMentions).
    WatchWorkspaceMentionsResponse workspace_mentions = 11;
  }
  // Tag 7 is RETIRED: the held section rides the root feed's own frames
  // (WatchFeedResponse.held), not a stream of its own.
  reserved 7;
  reserved "holds";
}

// A subscription that has ended, AND WHY.
//
// THE WHY IS AN ARM, NOT AN INFERENCE. A subscription ends for three reasons
// that mean three different things to a page — the client asked, the view's own
// source finished, or the watch failed — and a frame carrying only the id
// collapses them into one. A page that meant to unsubscribe and a page whose
// feed tail broke would then be told the same thing, and the second one would
// silently draw a view that had stopped updating. Every ending path fills
// exactly one arm; an unset `how` is a malformed frame.
message PageSubscriptionEnded {
  string subscription = 1;

  oneof how {
    // The client's own `UnsubscribePage`. It is announced rather than
    // suppressed so the END is one fact on one wire, whoever asked for it: a
    // client is otherwise left inferring the difference between the end it
    // asked for and an end that raced it.
    PageSubscriptionUnsubscribed unsubscribed = 2;
    // The view's own source finished — a login pty that exited, a topic that
    // closed. Nothing failed; there is simply nothing further to push.
    PageSubscriptionSourceEnded source_ended = 3;
    // The watch failed. Carries the SAME error the dedicated rpc would have
    // ended its own stream with.
    PageSubscriptionFailed failed = 4;
    // The daemon that served this subscription's workspace ended the view
    // without an error: it stood down, or stopped serving the workspace.
    // Nothing failed, and the view is still wanted, so the page subscribes
    // again at once and is served by whichever daemon serves the workspace
    // now. Sent only for a subscription the page's daemon relayed from
    // another daemon.
    PageSubscriptionMoved moved = 5;
  }
}

// Presence is the fact: the client asked for this end.
message PageSubscriptionUnsubscribed {}

// Presence is the fact: the source finished of its own accord.
message PageSubscriptionSourceEnded {}

// Presence is the fact: the serving daemon ended the view cleanly, and the
// page subscribes again.
message PageSubscriptionMoved {}

// A subscription that ended in FAILURE, carrying the error verbatim.
//
// WHY THESE TWO FIELDS AND NOT A `<Rpc>Error` ARM. A dedicated `Watch*` rpc has
// no error message at all: by ruling (landing 6) a failed or refused stream is
// a CONNECT ERROR — a code and a sentence — and never a frame. There is
// therefore no existing message to reuse, and this is that same Connect error
// carried as data because a multiplexed subscription has no status of its own
// to fail with: the page's stream is still healthy and must stay open for its
// other subscriptions.
message PageSubscriptionFailed {
  // The Connect code's own name, lower_snake_case as connect-go spells it —
  // "not_found", "failed_precondition", "internal". The code the dedicated
  // rpc's stream would have carried, unchanged.
  string code = 1;
  // The error's message, verbatim.
  string message = 2;
  // SET WHEN THE DEDICATED RPC REFUSED BECAUSE THE WORKSPACE WAS HANDED TO A
  // SUCCESSOR DAEMON (its `transferring_away` refusal), naming that daemon. A
  // handover is planned, not a fault: the page raises its move notice and
  // files no failure. UNSET for every other refusal.
  optional PageSubscriptionHandedAway handed_away = 3;
}

// The successor daemon a handed-away workspace now belongs to.
message PageSubscriptionHandedAway {
  // The successor's address, as the refusal named it: what the page's move
  // notice points at. Opaque to the page.
  string address = 1;
}

// Starts one subscription on an already-attached page.
//
// A REFUSAL IS A CONNECT ERROR, exactly as a refused `Watch*` open is. This
// verb IS the open, and a `SubscribePage` that answers `subscribed` is a
// subscription that exists: the daemon registers it with its publisher BEFORE
// replying, so a view published after the reply cannot be missed.
message SubscribePageRequest {
  // The page whose stream carries the pushes.
  string page = 1;
  // The attachment the page was issued on the stream that is to carry the
  // pushes (`PageAttached.attachment`), echoed unchanged. REQUIRED: a call
  // without one is malformed (Connect InvalidArgument).
  PageAttachment attachment = 13;
  // The subscription's own id, minted by the client. It addresses every
  // `PageFrame` this subscription produces and is what `UnsubscribePage` names.
  // Reusing a live one is a refusal.
  string subscription = 2;

  // What to watch. Each arm is the request of the rpc this subscription stands
  // in for, unchanged.
  oneof request {
    WatchWorkspaceRosterRequest roster = 3;
    WatchWebWorkspaceRequest web_workspace = 4;
    WatchDaemonRequest daemon = 5;
    WatchTopbarRequest topbar = 6;
    WatchFooterRequest footer = 7;
    WatchFeedRequest feed = 9;
    WatchLoginTerminalRequest login_terminal = 10;
    // A thread page's chat view (WatchChat).
    WatchChatRequest chat = 11;
    // A workspace page's mention targets (WatchWorkspaceMentions).
    WatchWorkspaceMentionsRequest workspace_mentions = 12;
  }
  // Tag 8 is RETIRED: the held section rides the root feed's own
  // subscription (`feed`), not a stream of its own.
  reserved 8;
  reserved "holds";
}

// THE ARM IS THE OUTCOME. There is no error arm: a refused subscription is a
// Connect error, as a refused `Watch*` open is.
message SubscribePageResponse {
  oneof result {
    SubscribePageSuccess success = 1;
  }
}

// The call was served by the daemon its attachment names, which answers one
// of two things about that attachment.
message SubscribePageSuccess {
  oneof outcome {
    // The subscription exists.
    SubscribePageSubscribed subscribed = 1;
    // The attachment the call carried is over: the daemon that issued it no
    // longer runs, or no longer holds the page under it (the page's stream
    // ended there, or the page reattached and was issued another). NOT A
    // FAILURE: nothing was subscribed, the page ends that attachment and
    // subscribes again under its next one, and files nothing.
    SubscribePagePageGone page_gone = 2;
  }
}

// Presence is the fact: the subscription exists. The acceptance IS the answer.
message SubscribePageSubscribed {}

// Presence is the fact: the attachment the call carried is over.
message SubscribePagePageGone {}

// Ends one subscription without disturbing the page's other ones.
message UnsubscribePageRequest {
  string page = 1;
  string subscription = 2;
  // The attachment the subscription was made under, echoed unchanged.
  // REQUIRED: a call without one is malformed (Connect InvalidArgument).
  PageAttachment attachment = 3;
}

// The subscription is over. Unsubscribing one that does not exist is NOT a
// refusal — the end is the state the caller asked for, and a subscription the
// daemon already ended, or one under an attachment that is itself over, is
// exactly that state.
message UnsubscribePageResponse {}
