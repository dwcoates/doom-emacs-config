// endpoint_cancel_detached_agents.proto — the CancelDetachedAgents endpoint's
// request, success and error.
//
// ONE ENDPOINT PER FILE: CancelDetachedAgentsRequest,
// CancelDetachedAgentsResponse and the two answers it wraps, and nothing else,
// so the whole of what one method takes and returns is readable in one place.
// The `endpoint_` prefix is the grouping, not a directory — see
// DESIGN-protobuf-surfaces.md for why a directory is not available here, and
// for why a request type belongs to agentrepl.v1 rather than frontend.v1.

syntax = "proto3";

package agentrepl.v1;

import "agentrepl/v1/shared.proto";
import "frontend/v1/failure.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// Cancel the workspace session's DETACHED background agents: the subagent,
// shell and workflow tasks still working after the turn that launched them
// has ended.
//
// WHY IT IS ITS OWN COMMAND RATHER THAN AN ARM ON InterruptRequest. An
// interrupt stops the TURN. The state this command exists for — main turn over,
// detached agents still running — is precisely the state in which there is no
// turn to stop, so an interrupt sent into it is a guaranteed no-op that the
// shim answers ALREADY_COMPLETE. The one state that raised the interrupt's
// "cancel the running subagents?" question was the one state its answer could
// not act on; this command is what that yes now sends.
//
// IT CARRIES NO CONFIRMATION ARM, unlike InterruptRequest's intent oneof. There
// is nothing here to confirm: the command's ONLY effect is stopping detached
// agents, so sending it IS the deliberate second keystroke the interrupt gate
// exists to require. A frontend asks its user before it sends, never after.
//
// The session is named by `workspace` below, and the command has nothing else
// to say.
message CancelDetachedAgentsRequest {
  // Correlation. See agentrepl.v1.AgentRepl.
  string request_id = 1;
  // The workspace whose detached agents are being cancelled. See
  // agentrepl.v1.AgentRepl.
  string workspace = 2;
}

// CancelDetachedAgents' answer: exactly one of a success and an error.
//
// THE SHIM'S VERDICT IS THE ANSWER, and the split between the arms IS that
// verdict. Under the shared ack the outcome rode BESIDE the ack on both sides,
// so "cancelled 3" and "nothing was running" were the same field with a
// different arm and an ok bit that had to be read separately to tell them
// apart. Here the outcome and the verdict are one thing.
message CancelDetachedAgentsResponse {
  // Echoed from the request that produced this answer. See
  // AcceptQueueEntryResponse.request_id.
  string request_id = 1;
  oneof response {
    CancelDetachedAgentsSuccess success = 2;
    CancelDetachedAgentsError error = 3;
  }
}

// Detached work was found and stopped.
message CancelDetachedAgentsSuccess {
  // How many agents were cancelled. Always at least one: a stop that reached
  // nothing takes the error arm.
  //
  // THE TASK IDS DO NOT CROSS. They are the daemon's own handle on the work —
  // what it settles work by — and a frontend has no vocabulary for them; what a
  // frontend renders is "cancelled 3 agents". So the count crosses and the ids
  // stay, which is the same split every other resolved view on this boundary
  // makes.
  int64 count = 1;
}

// Why nothing was cancelled.
//
// A SESSION WITH NOTHING DETACHED IS A LOUD REFUSAL, not a quiet success. A
// cancel that stopped nothing is a keystroke that did nothing, and acking it ok
// is how a stop control comes to look like it works when it reaches nothing.
message CancelDetachedAgentsError {
  oneof error {
    // The workspace key is not an absolute path.
    RefusalWorkspaceKeyNotAbsolute workspace_key_not_absolute = 1;
    // Nothing detached was running.
    RefusalNoDetachedAgentsRunning nothing_running = 2;
    // The shim could not attempt the stop.
    RefusalDetachedCancelUnsupported unsupported = 3;
    // The shim answered with an outcome that set no arm.
    RefusalDetachedCancelOutcomeUnset outcome_unset = 4;
    // The agent process is not connected, so the cancel had nowhere to go.
    FailureShimNotConnected shim_not_connected = 5;
    // The cancel failed for a reason the daemon's classifier could not name.
    frontend.v1.FailureInternalUnclassified unclassified = 6;
  }
  // The feed card this refusal was filed under, when it produced one. See
  // AcceptQueueEntryError.failure_card.
  frontend.v1.FailureCardRef failure_card = 7;
}
