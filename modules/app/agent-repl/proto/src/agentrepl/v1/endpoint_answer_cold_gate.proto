// endpoint_answer_cold_gate.proto — AnswerColdGate: the cold-context gate's
// buttons. FEED section. Success is "the daemon took the choice": the gate
// row is retired from the feed at once (owner ruling, 2026-09-29: the gate
// disappears as soon as the daemon acknowledges the choice), and the
// remediation runs AFTER the answer. Its progress and its outcome are the
// footer's, and the reopened session's facts arrive on the sibling streams,
// never restated here.

syntax = "proto3";

package agentrepl.v1;

import "workspace/v1/workspace.proto";
import "frontend/v1/feed.proto";
import "conversation/v1/api.proto";
import "conversation/v1/session.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

message AnswerColdGateRequest {
  // The workspace whose gate this answers.
  workspace.v1.WorkspaceRef workspace = 1;
  // The gate row, exactly as the feed served it.
  frontend.v1.FeedId gate = 2;
  // Which button. THE ARM IS THE REMEDIATION, mirroring
  // conversation.v1.SessionColdRemediation's three forms.
  oneof choice {
    // Pay & resume: take the cold read now, in the background.
    AnswerColdGatePay pay = 3;
    // Clear context and resume fresh.
    AnswerColdGateClear clear = 4;
    // Compact first, then resume from the compacted transcript.
    AnswerColdGateCompact compact = 5;
  }
}
message AnswerColdGatePay {}
message AnswerColdGateClear {}
// The compact button's payload.
message AnswerColdGateCompact {
  // The summarizer, echoed from the gate's menu.
  conversation.v1.AgentModel model = 1;
  // The chosen type — one of the menu's served values; never UNSPECIFIED.
  conversation.v1.SessionCompactScope scope = 2;
}

// THE ARM IS THE OUTCOME.
message AnswerColdGateResponse {
  oneof result {
    AnswerColdGateSuccess success = 1;
    AnswerColdGateError error = 2;
  }
}
// Taken: the gate is spent and its row retired. Empty on purpose — the
// remediation's progress and outcome are the footer's.
message AnswerColdGateSuccess {}
// Arms derived from the daemon's refusal sites (landing 4, 2026-08-29).
// Validation failures (unset field, UNSPECIFIED enum, blank string) are Connect InvalidArgument, never an arm.
message AnswerColdGateError {
  oneof cause {
    // The workspace id is not in the daemon's registry.
    AnswerColdGateUnknownWorkspace unknown_workspace = 1;
    // The echoed dir disagrees with the registry's dir for this id.
    AnswerColdGateWorkspaceRefMismatch workspace_ref_mismatch = 2;
    // This daemon released the workspace to a successor; dial `address`.
    AnswerColdGateTransferringAway transferring_away = 3;
    // A joining daemon has not finished adopting this workspace yet.
    AnswerColdGateNotYetAdopted not_yet_adopted = 4;
    // No cold gate is standing for this workspace.
    AnswerColdGateNoColdGate no_cold_gate = 5;
    // A remediation the gate never served.
    AnswerColdGateUnservedRemediation unserved_remediation = 6;
    // NOT PRODUCED since 2026-09-29. The re-open runs after the answer, so a
    // workspace with no session to re-open is the footer's
    // `cold_gate_reopen_failed` fault, with the gate stood again.
    AnswerColdGateNoSession no_session = 7;
    // NOT PRODUCED since 2026-09-29: the re-open runs after the answer, and
    // its failure is the footer's `cold_gate_reopen_failed` fault, with the
    // gate stood again so the choice is the user's once more. The history:
    // THE RE-OPEN THE ANSWER ASKED FOR FAILED. The gate was standing, the
    // remediation was served, the daemon carried it out — and the session did
    // not come back. Before this arm existed the whole branch answered a bare
    // Connect internal, which the webapp words as "the daemon could not be
    // reached" about a daemon that answered; the gate then stood on, unmoved,
    // and the user's click did nothing twice in one afternoon
    // (docs/FOOTER-TOPOLOGY-AUDIT.md section 4). It is a REFUSAL, not a
    // transport failure, so it is an arm.
    AnswerColdGateReopenFailed reopen_failed = 8;
  }
}
message AnswerColdGateUnknownWorkspace {}
message AnswerColdGateWorkspaceRefMismatch {
  // The dir the registry holds for this id.
  string registry_dir = 1;
}
message AnswerColdGateTransferringAway {
  // The successor's `127.0.0.1:<port>`, so a lagging client dials it.
  string address = 1;
}
message AnswerColdGateNotYetAdopted {}
message AnswerColdGateNoColdGate {}
message AnswerColdGateUnservedRemediation {}
message AnswerColdGateNoSession {}
// The re-open failed.
message AnswerColdGateReopenFailed {
  // WHY it failed, in the words of whatever refused it — the shim's own
  // account of a refused StartSession, or the daemon's of a bring-up death.
  // The SAME line the `cold_gate_reopen_failed` fault carries onto the
  // footer, read from one place so the two surfaces cannot disagree.
  string detail = 1;
}
