// endpoint_report_latencies.proto — ReportLatencies. DIAGNOSTICS section.
//
// A CLIENT REPORTS HOW LONG ITS INTERACTIONS TOOK, AND EMACS HOW LONG ITS
// STARTUP TOOK. Emacs and the webapp each see the end of some user-facing
// interaction (a workspace switch shown, a page booted) and measure its
// duration themselves, from a start instant handed to them through the
// channel that already carried the interaction.
// They send finished durations here in batches; the daemon records them in
// the always-on metrics it exposes for VictoriaMetrics to scrape.
//
// A REPORT CARRIES FINISHED DURATIONS, NEVER EDGES. The daemon pairs nothing:
// the runtime that saw the interaction end is the one that measured it, so a
// start can never be paired with the wrong end.
//
// A CLIENT KEEPS A BATCH UNTIL IT IS ACKNOWLEDGED. The success arm is the
// acknowledgment; a client whose call failed (transport error, daemon
// restarting) sends the same latencies again with its next batch, so a
// measurement survives a daemon handover.
syntax = "proto3";

package agentrepl.v1;

import "workspace/v1/workspace.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// Which interaction a reported latency measured. Each value names one entry
// of proto/vocab/latencies.json, which states where the interaction starts
// and ends, which runtime measures it, its perceptibility threshold and its
// histogram buckets; the daemon refuses to start if the two disagree.
enum ReportedLatencyKind {
  // Never sent: a request carrying it is refused as InvalidArgument.
  REPORTED_LATENCY_KIND_UNSPECIFIED = 0;
  // A switch to a workspace already shown in this Emacs, from the keystroke
  // to the page's first frame shown. Measured by the webapp from the
  // keystroke instant Emacs hands the page when it shows it.
  REPORTED_LATENCY_KIND_SWITCH_REPEAT = 1;
  // The first switch to a workspace never shown in this Emacs, from the
  // keystroke to the page painted. Measured like SWITCH_REPEAT.
  REPORTED_LATENCY_KIND_SWITCH_FIRST = 2;
  // A page's boot, from the page starting to its feed first painted.
  // Measured by the webapp alone.
  REPORTED_LATENCY_KIND_PAGE_BOOT = 3;
  // A prompt's echo, from the person submitting it to its row drawn on the
  // page. Measured by the webapp from the submit instant the daemon hands it
  // (WatchWebWorkspaceResponse.prompt_echo), on the host's wall clock.
  REPORTED_LATENCY_KIND_PROMPT_ECHO = 4;
  // A stall of the page's main thread while the page was shown: how late the
  // page's steady sampling timer ran, when it ran at least the vocabulary's
  // detection floor late. Measured by the webapp alone. A page that is not
  // shown samples nothing, because WebKit slows a hidden frame's timers and
  // nobody is looking at it.
  REPORTED_LATENCY_KIND_PAGE_STALL = 5;
  // A reload's blank page: from Emacs starting a reload of the page (the
  // host's reload, which reloads every page, or the page's own) to the
  // reloaded page's first frame shown. Measured by the webapp from the
  // instant Emacs writes into the URL it loads the page at. A reloaded page
  // that is not shown when it first paints reports nothing: nobody saw it
  // blank.
  REPORTED_LATENCY_KIND_RELOAD_BLANK = 6;
}

// One finished interaction.
message ReportedLatency {
  // Which interaction this measured. Required; UNSPECIFIED is
  // InvalidArgument.
  ReportedLatencyKind kind = 1;
  // The workspace the interaction happened in. Required; an unset ref is
  // InvalidArgument.
  workspace.v1.WorkspaceRef workspace = 2;
  // How long it took, in seconds. Finite and not negative; anything else is
  // InvalidArgument.
  double seconds = 3;
}

message ReportLatenciesRequest {
  // The finished interactions since the client's last acknowledged report,
  // oldest first. An empty batch is valid and records nothing.
  repeated ReportedLatency latencies = 1;
  // The milestones of the reporting editor's own startup reached since its
  // last acknowledged report, oldest first. Sent by Emacs only; each
  // milestone is reported once per editor process, and kept and sent again
  // with the next batch until a report is acknowledged, so a daemon handover
  // during the startup does not lose it.
  repeated ReportedEditorStartup editor_startup = 2;
  // The editor's own latencies since its last acknowledged report, oldest
  // first: interactions that belong to the editor as a whole rather than to
  // one workspace. Sent by Emacs only, and kept and sent again with the next
  // batch until a report is acknowledged, as `latencies' are.
  repeated ReportedEditorLatency editor_latencies = 3;
}

// ---- Editor latencies: the editor as a whole, no workspace ----

// Which editor-wide interaction a reported editor latency measured. Each
// value names one entry of proto/vocab/latencies.json, as a
// ReportedLatencyKind does.
enum EditorLatencyKind {
  // Never sent: a request carrying it is refused as InvalidArgument.
  EDITOR_LATENCY_KIND_UNSPECIFIED = 0;
  // A stall of the editor's command loop: how late the editor's steady
  // sampling timer ran, when it ran at least the vocabulary's detection floor
  // late. Every keystroke and every redisplay waits on the loop meanwhile.
  EDITOR_LATENCY_KIND_STALL = 1;
  // A deploy's pushed elisp reload (DaemonReloadElisp), from its first module
  // load to its heartbeat assertion done. The editor runs nothing else
  // meanwhile.
  EDITOR_LATENCY_KIND_ELISP_RELOAD = 2;
}

// One finished editor-wide interaction.
message ReportedEditorLatency {
  // Which interaction this measured. Required; UNSPECIFIED is
  // InvalidArgument.
  EditorLatencyKind kind = 1;
  // How long it took, in seconds. Finite and not negative; anything else is
  // InvalidArgument.
  double seconds = 2;
}

// ---- Editor startup: how long the editor took to come up ----

// Which milestone of the editor's startup was reached. A closed set of
// moments in one startup, not a state of anything: each is reached at most
// once per editor process, in this order, though a startup that fails before
// one never reaches it.
enum EditorStartupMilestone {
  // Never sent: a request carrying it is refused as InvalidArgument.
  EDITOR_STARTUP_MILESTONE_UNSPECIFIED = 0;
  // The editor's own initialization finished (Emacs's init files loaded).
  EDITOR_STARTUP_MILESTONE_INIT = 1;
  // The editor is linked to a serving daemon: its first connection answered.
  EDITOR_STARTUP_MILESTONE_DAEMON_LINKED = 2;
  // The editor's first workspace tab opened. A startup that opens no tab
  // never reaches it.
  EDITOR_STARTUP_MILESTONE_FIRST_TAB = 3;
  // Every workspace tab the startup opens has opened or failed: the startup
  // is over and the editor is ready. Reached at once by a startup with no
  // tabs to open.
  EDITOR_STARTUP_MILESTONE_ALL_TABS = 4;
}

// One milestone of the editor's startup, timed by the editor from its own
// process start, so each milestone is a cumulative time since launch rather
// than the length of a step. The daemon records it in its restart metrics as
// the `editor_start` restart, the milestone its phase and the daemon arm its
// cause.
message ReportedEditorStartup {
  // Which milestone was reached. Required; UNSPECIFIED is InvalidArgument.
  EditorStartupMilestone milestone = 1;
  // How this editor came to a daemon, which separates a startup that paid for
  // a daemon's boot from one that linked to a daemon already serving. Every
  // milestone of one startup carries the same arm. Required: an unset arm is
  // InvalidArgument.
  oneof daemon {
    EditorStartupDaemonSpawned spawned = 2;
    EditorStartupDaemonRunning running = 3;
  }
  // Seconds from the editor process's start to the milestone, on the
  // editor's own clock. Finite and not negative; anything else is
  // InvalidArgument.
  double seconds_since_process_start = 4;
}

// The editor found no daemon serving and started one, so its startup
// includes the daemon's boot. DELIBERATELY EMPTY: the arm is the fact.
message EditorStartupDaemonSpawned {}

// The editor linked to a daemon that was already serving. DELIBERATELY
// EMPTY: the arm is the fact.
message EditorStartupDaemonRunning {}

// THE ARM IS THE OUTCOME.
message ReportLatenciesResponse {
  oneof result {
    ReportLatenciesSuccess success = 1;
    ReportLatenciesError error = 2;
  }
}

// The report was received: the client drops the batch. Which of the arms is
// set says what the daemon did with it; every one is an answer to a valid
// report, so none is an error.
message ReportLatenciesSuccess {
  // What the daemon did with the batch.
  oneof outcome {
    // Every latency was recorded.
    ReportLatenciesRecorded recorded = 1;
    // Some latencies named a workspace the daemon no longer knows and were
    // dropped; the rest were recorded.
    ReportLatenciesPartlyRecorded partly_recorded = 2;
    // The daemon runs without a metrics surface, so nothing was recorded.
    ReportLatenciesMetricsOff metrics_off = 3;
  }
}

// Every latency in the batch was recorded.
message ReportLatenciesRecorded {
  // How many latencies were recorded: the length of the batch's
  // `latencies`. Every editor startup milestone and editor latency in the
  // batch is recorded too and is not counted here, since neither names a
  // workspace, so neither is ever dropped.
  uint32 recorded = 1;
}

// Part of the batch named workspaces the daemon's registry no longer holds:
// a workspace closed between the interaction and its report, which is an
// ordinary schedule. Those latencies are dropped rather than recreating the
// series the daemon deleted when the workspace closed.
message ReportLatenciesPartlyRecorded {
  // How many were recorded.
  uint32 recorded = 1;
  // How many were dropped because their workspace is unknown.
  uint32 dropped_unknown_workspace = 2;
}

// The daemon was started without a metrics root, so it records no metrics.
// The client keeps reporting as usual: a later daemon may record them.
// DELIBERATELY EMPTY.
message ReportLatenciesMetricsOff {}

// The daemon's refusals. Validation failures (an unspecified kind, an unset
// ref, a negative or non-finite duration) are Connect InvalidArgument, never
// an arm. A refused batch is not recorded at all, and the client drops it:
// sending it again would be refused again.
message ReportLatenciesError {
  // Why the batch was refused.
  oneof cause {
    // A ref's dir disagrees with the registry's dir for its id: the client
    // holds a stale or wrong address for a workspace.
    ReportLatenciesWorkspaceRefMismatch workspace_ref_mismatch = 1;
  }
}

// A ref in the batch named a known workspace id with the wrong dir.
message ReportLatenciesWorkspaceRefMismatch {
  // The id the client sent.
  string workspace_id = 1;
  // The dir the client sent for it.
  string reported_dir = 2;
  // The dir the registry holds for that id.
  string registry_dir = 3;
}
