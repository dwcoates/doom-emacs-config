// endpoint_restart_session.proto — the RestartSession endpoint's request and
// response.
//
// ONE ENDPOINT PER FILE: RestartSessionRequest and RestartSessionResponse and
// nothing else, so the whole of what one method takes and returns is readable in
// one place. The `endpoint_` prefix is the grouping, not a directory — see
// DESIGN-protobuf-surfaces.md for why a directory is not available here, and for
// why a request type belongs to agentrepl.v1 rather than frontend.v1.

syntax = "proto3";

package agentrepl.v1;

import "agentrepl/v1/frame.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// HARD RESTART of one workspace's session: stop whatever shim is serving it
// (including one that outlived a previous daemon, which this daemon never
// spawned), then bring it up again along the ordinary path.
//
// THE SESSION RECORD IS UNCHANGED, so the respawn resumes the same vendor
// conversation: the user loses nothing and the transcript continues. This is a
// PROCESS restart, not a new session — what to reach for when the shim is
// wedged, when it is running superseded code, or when the backend simply needs
// rebuilding under a conversation worth keeping.
//
// A workspace with no live session is a loud nack; a workspace whose session is
// merely hibernated or severed is brought up, because "restart" and "start" are
// the same request when nothing is running.
message RestartSessionRequest {
  // Correlation. See AgentRepl in frame.proto.
  string request_id = 1;
  // The workspace whose session is being restarted. See AgentRepl in
  // frame.proto.
  string workspace = 2;
}

// RestartSession's answer: accepted, or the classified account of the refusal.
//
// IT WRAPS CommandAck RATHER THAN BEING CommandAck. Returning the shared ack
// directly gave 33 methods one response type, so no method could gain an answer
// of its own without offering that answer to every other method as well. The
// respawned session's identity and readiness reach the client as a pushed
// SessionView.
message RestartSessionResponse {
  // Whether the daemon accepted this call, and when it did not, the classified
  // failure a frontend renders as a card. See CommandAck.
  CommandAck ack = 1;
}
