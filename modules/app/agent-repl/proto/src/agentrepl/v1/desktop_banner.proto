// desktop_banner.proto — the desktop banner the daemon hands the launcher
// (Zettel.app, launcher/) to post, what the platform did with it, and the
// token its click echoes back. DESKTOP BANNERS section. Shared by
// launcher.v1.PostBanner (the daemon hands the launcher a banner and reads
// back its outcome) and ReportDesktopBannerClicked (the launcher reports a
// banner's click).
//
// THE DAEMON OWNS EVERY BANNER. It decides whether a banner is wanted (Emacs
// unfocused), composes its text, and resolves what its click selects; the
// launcher only posts what it is handed through the platform's notification
// center and relays the two things only it can observe: whether the platform
// took the banner, and the user's click on it.

syntax = "proto3";

package agentrepl.v1;

import "workspace/v1/workspace.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// One banner for the launcher to post, as the user sees it, plus what the
// launcher needs to replace an earlier one and to report its click.
message DesktopBanner {
  // The banner's first, bold line. REQUIRED, never empty.
  DesktopBannerTitle title = 1;
  // The banner's text below its title. REQUIRED, never empty.
  DesktopBannerBody body = 2;
  // The replacement group: a banner REPLACES the banner already shown with
  // the same group, so one workspace never stacks a pile of stale banners.
  // The launcher uses it as the platform notification's identifier.
  // REQUIRED.
  DesktopBannerGroup group = 3;
  // What the banner's click selects, stored on the platform notification and
  // echoed verbatim on ReportDesktopBannerClicked. REQUIRED.
  DesktopBannerClickToken click = 4;
}

// The banner's title line, as macOS draws it in bold.
message DesktopBannerTitle {
  // The resolved title: a status mark and the workspace's name, or the
  // workspace's name alone.
  string text = 1;
}

// The banner's body text, as macOS draws it below the title.
message DesktopBannerBody {
  // The resolved body, plain text; macOS truncates it to the banner's lines.
  string text = 1;
}

// The group banners of one subject share. Two banners with the same group
// replace each other on the desktop and in Notification Center.
message DesktopBannerGroup {
  // Opaque to the launcher; the daemon keys it by workspace.
  string id = 1;
}

// A TYPED ECHO TOKEN: what a banner's click selects. Minted by the daemon,
// stored by the launcher on the platform notification as serialized bytes,
// and
// returned unchanged when the user clicks the banner, however long after the
// post and whichever daemon serves by then. It names the workspace rather
// than a post, so a click on a banner a previous daemon posted still selects
// its workspace on the daemon serving at the click.
message DesktopBannerClickToken {
  // The workspace the click selects.
  workspace.v1.WorkspaceRef workspace = 1;
}

// What the platform's notification center did with one banner.
message DesktopBannerPostOutcome {
  // THE ARM IS THE OUTCOME. REQUIRED.
  oneof outcome {
    // The notification center accepted the banner, and Zettel's settings
    // draw it on screen: notifications are allowed, alerts are on, and their
    // style is banners or alerts. The daemon rings the banner's chime on this
    // answer alone, so a sound always means a banner on screen. No Focus on
    // now silences Zettel (`silenced` otherwise).
    DesktopBannerPostOutcomePosted posted = 1;
    // Zettel's notification settings keep the banner off the screen, so it was
    // not posted. Remedied only in System Settings → Notifications → Zettel.
    DesktopBannerPostOutcomeNotAllowed not_allowed = 2;
    // The notification center refused the banner for another reason.
    DesktopBannerPostOutcomeFailed failed = 3;
    // The notification center took the banner, but it is not known to be on
    // screen: a Focus silences Zettel, so macOS files it in Notification
    // Center without drawing it, or the Focus state could not be read. The
    // daemon rings no chime for it.
    DesktopBannerPostOutcomeSilenced silenced = 4;
  }
}

// The notification center accepted the banner.
message DesktopBannerPostOutcomePosted {}

// Zettel's notification settings keep the banner off the screen.
message DesktopBannerPostOutcomeNotAllowed {
  // The setting that keeps it off, as a line for the record (e.g.
  // "notifications are denied", "the alert style is None"). REQUIRED.
  string setting = 1;
}

// A banner the notification center took but did not draw on screen.
message DesktopBannerPostOutcomeSilenced {
  // THE ARM IS WHY. REQUIRED.
  oneof cause {
    // The name of the Focus on now that silences Zettel ("Work"), as System
    // Settings shows it.
    string focus = 1;
    // Why the Focus state could not be read, for the record: whether a Focus
    // silences the banner is unknown, so it is not taken to be drawn.
    string focus_unreadable = 2;
  }
}

// The notification center refused the banner for a reason other than
// permission.
message DesktopBannerPostOutcomeFailed {
  // The platform's own description of the error, verbatim, for the record.
  string platform_error = 1;
}
