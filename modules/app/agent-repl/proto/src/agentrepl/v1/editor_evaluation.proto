// editor_evaluation.proto — WHAT EVALUATING ELISP IN THE RUNNING EDITOR
// ANSWERED. Shared by the agent's call (EvaluateInEditor), the daemon's push
// to the editor (agentrepl.v1.WatchHostWorkspaceResponse.evaluate), and the editor's answer
// (AnswerEditorEvaluation), so the answer the agent reads is exactly the one
// the editor gave.
//
// ERRORS ARE CAUGHT IN THE EDITOR'S ONE HANDLER: the text is read and
// evaluated inside a single `condition-case` there, never wrapped by the
// caller, so no request bypasses it and text that does not even read is
// answered as a read error rather than breaking the wrapper.

syntax = "proto3";

package agentrepl.v1;

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// The token that ties an editor's answer to the evaluation it answers.
// Minted by the daemon per evaluation, carried to the editor in the push, and
// echoed back unchanged in AnswerEditorEvaluation.
message EditorEvaluationToken {
  // Opaque to the editor.
  string value = 1;
}

// How one evaluation went. A legitimate answer either way: elisp that signals
// an error is still an evaluation the editor performed.
message EditorEvaluationOutcome {
  // THE ARM IS HOW IT WENT.
  oneof outcome {
    // The text read and evaluated to a value.
    EditorEvaluationValue value = 1;
    // The text did not read as elisp (unbalanced parentheses, a bad token).
    EditorEvaluationReadError read_error = 2;
    // Evaluation signaled an error.
    EditorEvaluationEvalError eval_error = 3;
  }
  // The `*Messages*` lines the evaluation added, oldest first, whatever its
  // outcome.
  repeated string messages = 4;
}
// The value of the last form.
message EditorEvaluationValue {
  // The value as `prin1` prints it.
  string printed = 1;
  // TRUE when `printed` reads back as an equal value; FALSE for an
  // unreadable object (a buffer, a window, a process), whose print is
  // `#<...>`.
  bool readable = 2;
}
// Why the text did not read.
message EditorEvaluationReadError {
  // The reader's message, as `error-message-string` gives it.
  string message = 1;
}
// The error evaluation signaled.
message EditorEvaluationEvalError {
  // The error symbol, as `prin1` prints it (`wrong-type-argument`).
  string error_symbol = 1;
  // The error data, as `prin1` prints it.
  string data_printed = 2;
  // The error, as `error-message-string` gives it.
  string message = 3;
}
