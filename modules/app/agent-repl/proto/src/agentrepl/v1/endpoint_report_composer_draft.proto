// endpoint_report_composer_draft.proto — ReportComposerDraft: the text a
// workspace's composer held when the editor closed the workspace. FEED
// section.
//
// THE EDITOR CLOSES WHAT IT DOES NOT HOLD (frontend.v1.RosterRowHeld): a
// workspace folded, hidden or left kills its composer in the editor, while the
// daemon keeps the workspace. The composer's text would die with it, so the
// editor reports the text as it closes the workspace, and the daemon keeps it
// durably, across a restart and a handover alike. The next host snapshot after
// the editor opens the workspace again carries it
// (agentrepl.v1.HostWorkspace.composer_draft); the editor puts it into the
// composer, then reports it cleared.
//
// THE REPORT REPLACES the draft the daemon kept, whole. IDEMPOTENT: restating
// the draft the daemon keeps changes nothing.

syntax = "proto3";

package agentrepl.v1;

import "workspace/v1/workspace.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

message ReportComposerDraftRequest {
  // The workspace whose composer this is.
  workspace.v1.WorkspaceRef workspace = 1;
  // THE ARM IS WHAT THE DAEMON KEEPS. Unset is a malformed request (Connect
  // InvalidArgument).
  oneof draft {
    // The composer held text: the daemon keeps it until it is replaced or
    // cleared.
    ReportComposerDraftKept kept = 2;
    // The composer held nothing, or the editor has restored the kept draft:
    // the daemon keeps none.
    ReportComposerDraftCleared cleared = 3;
  }
}

// A draft to keep.
message ReportComposerDraftKept {
  // The composer's whole text, verbatim. Never empty: an empty composer is
  // reported `cleared`.
  string text = 1;
}

// No draft to keep. Empty: the arm is the fact.
message ReportComposerDraftCleared {}

// THE ARM IS THE OUTCOME.
message ReportComposerDraftResponse {
  oneof result {
    ReportComposerDraftSuccess success = 1;
    ReportComposerDraftError error = 2;
  }
}

// The daemon keeps what the request stated, durably.
message ReportComposerDraftSuccess {}

message ReportComposerDraftError {
  oneof cause {
    // The workspace id is not in the daemon's registry.
    ReportComposerDraftUnknownWorkspace unknown_workspace = 1;
    // The echoed dir disagrees with the registry's dir for this id.
    ReportComposerDraftWorkspaceRefMismatch workspace_ref_mismatch = 2;
    // This daemon released the workspace to a successor; dial `address`.
    ReportComposerDraftTransferringAway transferring_away = 3;
    // A joining daemon has not finished adopting this workspace yet.
    ReportComposerDraftNotYetAdopted not_yet_adopted = 4;
    // The daemon could not write the draft to its store, so it keeps the one
    // it kept before, if any.
    ReportComposerDraftStoreFailed store_failed = 5;
  }
}

// The workspace id is not in the daemon's registry.
message ReportComposerDraftUnknownWorkspace {}
// The echoed dir disagrees with the registry's dir for this id.
message ReportComposerDraftWorkspaceRefMismatch {
  // The dir the registry holds for this id.
  string registry_dir = 1;
}
// This daemon released the workspace to a successor.
message ReportComposerDraftTransferringAway {
  // The successor's `127.0.0.1:<port>`, so a lagging client dials it.
  string address = 1;
}
// A joining daemon has not finished adopting this workspace yet.
message ReportComposerDraftNotYetAdopted {
  // The `127.0.0.1:<port>` of the daemon that serves this workspace until the
  // joining daemon adopts it: the handover's incumbent. UNSET when no live
  // daemon serves the workspace.
  optional string address = 1;
}
// The store refused the write.
message ReportComposerDraftStoreFailed {
  // The store's error, verbatim, for the record.
  string reason = 1;
}
