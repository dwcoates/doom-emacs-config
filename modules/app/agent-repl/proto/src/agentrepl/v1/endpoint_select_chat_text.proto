// endpoint_select_chat_text.proto — SelectChatText: hold or clear a thread's highlight. CHAT section.

syntax = "proto3";

package agentrepl.v1;

import "workspace/v1/workspace.proto";
import "zettel/v1/zettel.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// SelectChatText: the user highlighted text in an answer, or cleared the
// highlight. THE DAEMON IS THE ONLY HOLDER of a thread's highlight: the next
// prompt sent to the thread is asked of the highlighted answer, carries the
// highlighted words as its quote, and clears the highlight.
message SelectChatTextRequest {
  // The thread the answer is in.
  workspace.v1.WorkspaceRef thread = 1;
  // The new highlight, or its absence.
  SelectChatTextSelection selection = 2;
}

// A thread's highlight. The set arm IS the state.
message SelectChatTextSelection {
  // Some text highlighted, or none.
  oneof state {
    SelectChatTextHighlighted highlighted = 1;
    SelectChatTextCleared cleared = 2;
  }
}

// Text is highlighted in one answer.
message SelectChatTextHighlighted {
  // The node whose answer holds the highlight, echoed from the chat view.
  zettel.v1.NodeId node = 1;
  // The highlighted words, verbatim, and the paragraph around them.
  zettel.v1.NodeQuote quote = 2;
}

// Nothing is highlighted.
message SelectChatTextCleared {}

// THE ARM IS THE OUTCOME.
message SelectChatTextResponse {
  // Success or the refusal; exactly one is set.
  oneof result {
    SelectChatTextSuccess success = 1;
    SelectChatTextError error = 2;
  }
}

// The highlight is held; the chat view draws it.
message SelectChatTextSuccess {}

// Why the request was refused. Validation failures (an unset field, a blank string) are Connect InvalidArgument, never an arm.
message SelectChatTextError {
  // The cause of the refusal.
  oneof cause {
    // The workspace id is not in the daemon's registry.
    SelectChatTextUnknownWorkspace unknown_workspace = 1;
    // The echoed dir disagrees with the registry's dir for this id.
    SelectChatTextWorkspaceRefMismatch workspace_ref_mismatch = 2;
    // This daemon released the workspace to a successor; dial `address`.
    SelectChatTextTransferringAway transferring_away = 3;
    // A joining daemon has not finished adopting this workspace yet.
    SelectChatTextNotYetAdopted not_yet_adopted = 4;
    // The workspace is an agent workspace, not a chat thread.
    SelectChatTextNotAThread not_a_thread = 5;
    // The node is not in this thread.
    SelectChatTextUnknownNode unknown_node = 6;
  }
}

// The workspace id is not in the daemon's registry.
message SelectChatTextUnknownWorkspace {}

// The echoed dir disagrees with the registry's dir for this id.
message SelectChatTextWorkspaceRefMismatch {
  // The dir the registry holds for this id.
  string registry_dir = 1;
}

// This daemon released the workspace to a successor; dial `address`.
message SelectChatTextTransferringAway {
  // The successor's `127.0.0.1:<port>`, so a lagging client dials it.
  string address = 1;
}

// A joining daemon has not finished adopting this workspace yet.
message SelectChatTextNotYetAdopted {
  // The `127.0.0.1:<port>` of the daemon that serves this workspace until the
  // joining daemon adopts it: the handover's incumbent. A client views and
  // acts on the workspace there in the meantime, and the incumbent's later
  // `transferred` push re-homes it. UNSET when no live daemon serves the
  // workspace (a takeover after the incumbent died), in which case the client
  // waits for the adoption.
  optional string address = 1;
}

// The workspace is an agent workspace, not a chat thread.
message SelectChatTextNotAThread {}

// The node is not in this thread.
message SelectChatTextUnknownNode {}
