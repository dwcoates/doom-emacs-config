// endpoint_set_workspace_parent.proto — SetWorkspaceParent: RETARGET a
// workspace: change its relationship (child of a parent, or peer), where its
// merge lands, or both. SIDEBAR section.
//
// THE RELATIONSHIP AND THE LANDING TARGET ARE TWO FACTS, set together here
// because the landing target's default follows the relationship
// (WorkspaceLandingTarget): a child lands into its parent when the parent is of
// the same repository, and on its own repository's primary branch otherwise; a
// peer lands on the primary branch. A request that names no landing target
// re-applies that default for the relationship it leaves; one that names one
// lands there, whatever the relationship. Creation records both choices
// (CreateWorkspaceStandard.relationship, .landing_target); this rpc is the one
// way to change either afterwards. The roster nests the workspace under its
// parent, or at the top level, on its next push.
//
// THE RETARGET AND ITS NOTICE ARE ONE OPERATION. On success the daemon has
// also queued a prompt into the retargeted workspace's session, through the
// same submission path every prompt takes, stating the new merge target and
// that its own-branch merge now lands there; a successful answer therefore
// means the workspace's agent WILL be told. A notice that cannot be queued
// undoes the retarget and the rpc fails, so no workspace is ever retargeted
// without being told.
//
// A queued or running merge is not rewritten: a merge reads its target when
// it is admitted, so one still waiting in line lands at the new target and
// one already running lands where it began.

syntax = "proto3";

package agentrepl.v1;

import "agentrepl/v1/family.proto";
import "agentrepl/v1/workspace_topology.proto";
import "workspace/v1/workspace.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

message SetWorkspaceParentRequest {
  // The workspace being retargeted, echoed from its roster row.
  workspace.v1.WorkspaceRef workspace = 1;
  // THE ARM IS THE NEW RELATIONSHIP: a child of another workspace (of any
  // repository), a top-level peer, or the relationship it already has. Unset is
  // a malformed request (Connect InvalidArgument), never "top-level": clearing
  // a parent changes who coordinates the workspace, so it is asked for by name.
  // Asking for the parent a workspace already has is NOT refused; it re-sends
  // the notice.
  oneof parent {
    SetWorkspaceParentChild child_of = 2;
    SetWorkspaceParentTopLevel top_level = 3;
    SetWorkspaceParentUnchanged unchanged = 4;
  }
  // Where the workspace's merge lands from now on. UNSET = the default for
  // the relationship the request leaves the workspace in. A workspace landing
  // target must be an open workspace of the retargeted workspace's own
  // repository (`unknown_landing_target`), neither the workspace itself nor one
  // landing into it.
  optional WorkspaceLandingTarget landing_target = 5;
}

// Make the workspace a CHILD of another workspace: the roster nests it there
// and the parent coordinates it (WorkspaceRelationship.child). Its merge lands
// as `landing_target` says, by default in the parent's checkout when the two
// are of one repository, or in its own repository's main checkout when they
// are not.
message SetWorkspaceParentChild {
  // The new parent, echoed from its roster row. It must be a registered
  // workspace of any repository, and neither the retargeted workspace itself
  // nor one of its descendants.
  workspace.v1.WorkspaceRef parent = 1;
}

// Make the workspace a TOP-LEVEL PEER: the roster draws it at the top of its
// section and nobody coordinates it. Its merge lands as `landing_target` says,
// by default in its repository's main checkout, on the default branch.
// DELIBERATELY EMPTY: the arm is the request.
message SetWorkspaceParentTopLevel {}

// Keep the workspace's relationship as it stands: the request changes only
// where its merge lands, so `landing_target` is REQUIRED beside it (Connect
// InvalidArgument otherwise). DELIBERATELY EMPTY: the arm is the request.
message SetWorkspaceParentUnchanged {}

// THE ARM IS THE OUTCOME.
message SetWorkspaceParentResponse {
  oneof result {
    SetWorkspaceParentSuccess success = 1;
    SetWorkspaceParentError error = 2;
  }
}

// Retargeted, and the notice is queued in the workspace's session. The new
// nesting arrives on the roster stream. DELIBERATELY EMPTY: the request named
// the target, so there is nothing new to say about it.
message SetWorkspaceParentSuccess {}

// The daemon's refusals. Validation failures (an unset field or arm, a blank
// id) are Connect InvalidArgument, never an arm. Nothing is changed and no
// notice is sent on any of them.
message SetWorkspaceParentError {
  // `parent_in_other_repository` (field 7) is RETIRED: a parent of another
  // repository is its child's owner and nesting, never refused.
  reserved 7;
  reserved "parent_in_other_repository";
  oneof cause {
    // The retargeted workspace's id is not in the daemon's registry.
    SetWorkspaceParentUnknownWorkspace unknown_workspace = 1;
    // The retargeted workspace's echoed dir disagrees with the registry's dir
    // for its id.
    SetWorkspaceParentWorkspaceRefMismatch workspace_ref_mismatch = 2;
    // This daemon released the workspace to a successor; dial `address`.
    SetWorkspaceParentTransferringAway transferring_away = 3;
    // A joining daemon has not finished adopting this workspace yet.
    SetWorkspaceParentNotYetAdopted not_yet_adopted = 4;
    // The new parent's id is not in the daemon's registry.
    SetWorkspaceParentUnknownParent unknown_parent = 5;
    // The new parent's echoed dir disagrees with the registry's dir for its
    // id.
    SetWorkspaceParentParentRefMismatch parent_ref_mismatch = 6;
    // The new parent is the workspace itself or one of its descendants, so
    // the family would become a cycle and no merge would ever reach the main
    // branch.
    SetWorkspaceParentCycle cycle = 8;
    // The workspace has no merge geometry: it was registered by the editor
    // rather than created by the daemon, so it has no merge to retarget.
    SetWorkspaceParentNoMergeLayout no_merge_layout = 9;
    // The workspace's session is parked at its cold gate, which takes no
    // prompt until the gate is answered, so the notice cannot be queued and
    // the retarget is not made. Answer the gate, then retarget.
    SetWorkspaceParentColdGate cold_gate = 10;
    // The named parent, or the workspace to land into, is hidden or closed,
    // and moving the workspace would make an open child of, or an open branch
    // landing into, a workspace outside the Open section.
    WorkspaceParentNotOpen parent_not_open = 11;
    // The workspace to land into is not in the daemon's registry, is of
    // another repository, or is the retargeted workspace or one landing into
    // it.
    SetWorkspaceParentUnknownLandingTarget unknown_landing_target = 12;
  }
}

// The workspace id is not in the daemon's registry. DELIBERATELY EMPTY.
message SetWorkspaceParentUnknownWorkspace {}

// The workspace's echoed dir disagrees with the registry's dir for its id.
message SetWorkspaceParentWorkspaceRefMismatch {
  // The dir the registry holds for this id.
  string registry_dir = 1;
}

// This daemon released the workspace to a successor.
message SetWorkspaceParentTransferringAway {
  // The successor's `127.0.0.1:<port>`, so a lagging client dials it.
  string address = 1;
}

// A joining daemon has not finished adopting this workspace yet.
// DELIBERATELY EMPTY.
message SetWorkspaceParentNotYetAdopted {}

// The new parent's id is not in the daemon's registry. DELIBERATELY EMPTY.
message SetWorkspaceParentUnknownParent {}

// The new parent's echoed dir disagrees with the registry's dir for its id.
message SetWorkspaceParentParentRefMismatch {
  // The dir the registry holds for the parent's id.
  string registry_dir = 1;
}


// The workspace to land into cannot take the retargeted workspace's merge.
message SetWorkspaceParentUnknownLandingTarget {
  // The workspace as the request named it.
  workspace.v1.WorkspaceRef workspace = 1;
}

// The new parent is the retargeted workspace or one of its descendants.
// DELIBERATELY EMPTY: the request named both ends of the would-be cycle.
message SetWorkspaceParentCycle {}

// The workspace has no merge geometry to retarget. DELIBERATELY EMPTY.
message SetWorkspaceParentNoMergeLayout {}

// The workspace's session is parked at its cold gate. DELIBERATELY EMPTY: the
// gate itself is drawn in the workspace's feed.
message SetWorkspaceParentColdGate {}
