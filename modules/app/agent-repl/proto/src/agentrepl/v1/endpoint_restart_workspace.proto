// endpoint_restart_workspace.proto — RestartWorkspace. SIDEBAR section.
// Bounces the workspace-specific pieces of the stack — the workspace's shim
// (rebuilt first when out of date) and the workspace's webapp page — to
// unstick ONE workspace without rebooting everything. Never the daemon, the
// store or the sidecar.
//
// A RESTART IS IMMEDIATE, ALWAYS. It exists for a workspace that is stuck — a
// turn that never ends, a vendor that will not answer or will not start — so
// it never waits for anything to finish: waiting on a stuck workspace is
// waiting forever. Whatever stands in the way is stopped first: the running
// turn is interrupted and every piece of detached work is stopped; because
// the vendor is usually unreachable when a restart is wanted, those stops are
// bounded and the shim's own teardown hard-kills whatever did not stop. Then
// the shim is relaunched, the SAME session is resumed on it (a fresh vendor
// start run, with the full retry window), every hold waiting on the session
// is delivered once it is up, and the workspace's webapp page reloads.
//
// NOT A ROUTINE ACTION. A relaunched shim or reloaded page runs the build on
// disk, which may speak a newer API than the daemon that keeps running.

syntax = "proto3";

package agentrepl.v1;

import "workspace/v1/workspace.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

message RestartWorkspaceRequest {
  workspace.v1.WorkspaceRef workspace = 1;
  // Tag 2 (`force`) is RETIRED: every restart is immediate and stops what is
  // in the way, so there is no second mode to select.
  reserved 2;
  reserved "force";
}

// THE ARM IS THE OUTCOME.
message RestartWorkspaceResponse {
  oneof result {
    RestartWorkspaceSuccess success = 1;
    RestartWorkspaceError error = 2;
  }
}

// The restart is under way: what stood in the way has been told to stop and
// the bounce has begun. Every visible effect — the stopped work, the
// relaunch, the reconnect, the page reload — arrives on the streams.
message RestartWorkspaceSuccess {}

// Arms derived from the daemon's refusal sites (landing 4, 2026-08-29).
// Validation failures (unset field, UNSPECIFIED enum, blank string) are Connect InvalidArgument, never an arm.
message RestartWorkspaceError {
  oneof cause {
    // The workspace id is not in the daemon's registry.
    RestartWorkspaceUnknownWorkspace unknown_workspace = 1;
    // The echoed dir disagrees with the registry's dir for this id.
    RestartWorkspaceWorkspaceRefMismatch workspace_ref_mismatch = 2;
    // This daemon released the workspace to a successor; dial `address`.
    RestartWorkspaceTransferringAway transferring_away = 3;
    // A joining daemon has not finished adopting this workspace yet.
    RestartWorkspaceNotYetAdopted not_yet_adopted = 4;
  }
  // Tag 5 (`no_session`) is RETIRED: a workspace with no session is
  // restarted by bringing one up, never refused.
  reserved 5;
  reserved "no_session";
}
message RestartWorkspaceUnknownWorkspace {}
message RestartWorkspaceWorkspaceRefMismatch {
  // The dir the registry holds for this id.
  string registry_dir = 1;
}
message RestartWorkspaceTransferringAway {
  // The successor's `127.0.0.1:<port>`, so a lagging client dials it.
  string address = 1;
}
message RestartWorkspaceNotYetAdopted {}
