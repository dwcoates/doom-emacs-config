// merge_queue_status.proto — A MERGE QUEUE'S STATUS AS AN AGENT READS IT:
// whether it advances, and every merge in line, front first. Shared by the
// one-time read (GetMergeQueueStatus), a subscription's opening answer
// (SubscribeMergeQueue), and every merge-queue notice, so a notice can never
// describe a queue differently from a read.
//
// A merge only REQUESTED -- its asking turn still running, so not yet put in
// line -- is not in any queue and never appears here.

syntax = "proto3";

package agentrepl.v1;

import "workspace/v1/workspace.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// One repository's merge queue. A queue has THREE ACTIVE SLOTS, each held by
// at most one merge: the head (the one merge running its test gate and
// landing), fixing tests, and resolving conflicts (both out of line). So at
// most one entry is running, at most one is fixing_tests and at most one is
// resolving_conflicts; every other merge out of line awaits its repair's slot.
message MergeQueueStatus {
  // The repository whose queue this is.
  workspace.v1.RepositoryRef repository = 1;
  // Whether the queue advances.
  MergeQueueStatusAdvance advance = 2;
  // Every merge of the queue: those in line, front first -- the running
  // merge (when one runs), then every waiting merge in the order it will run
  // -- then every merge out of line: the holder of each repair slot, then the
  // merges awaiting each slot, in the order each will be granted it.
  repeated MergeQueueStatusEntry entries = 3;
}

// Whether a queue advances.
message MergeQueueStatusAdvance {
  // THE ARM IS THE STATE.
  oneof state {
    // The queue admits, promotes and runs merges.
    MergeQueueStatusAdvanceRunning running = 1;
    // The queue is paused: merges still join it, but nothing runs until it
    // is resumed.
    MergeQueueStatusAdvancePaused paused = 2;
  }
}
// Advancing. No fields.
message MergeQueueStatusAdvanceRunning {}
// Paused. No fields.
message MergeQueueStatusAdvancePaused {}

// One merge in line.
message MergeQueueStatusEntry {
  // The workspace whose merge this is: the one landing its own branch, or an
  // async merge's merge workspace once it exists. For an async merge waiting
  // to start, the REQUESTER (whose feed carries its bubble).
  workspace.v1.WorkspaceRef workspace = 1;
  // That workspace's name, or, for an async merge waiting to start, the name
  // its merge workspace will carry.
  string name = 2;
  // The branch that lands.
  string branch = 3;
  // What kind of merge this is.
  MergeQueueStatusEntryKind kind = 4;
  // Whether it runs or waits.
  MergeQueueStatusEntryStage stage = 5;
  // TRUE when it was put in line at the front (agentrepl.v1
  // .MergeQueuePlacementFront).
  bool placed_at_front = 6;
}

// What kind of merge an entry is.
message MergeQueueStatusEntryKind {
  // THE ARM IS THE KIND.
  oneof kind {
    // A workspace landing its own branch (MergeWorkspace).
    MergeQueueStatusEntryKindOwnBranch own_branch = 1;
    // An async merge (CreateWorkspaceAsyncMerge).
    MergeQueueStatusEntryKindAsyncMerge async_merge = 2;
  }
}
// A workspace landing its own branch. No fields.
message MergeQueueStatusEntryKindOwnBranch {}
// An async merge.
message MergeQueueStatusEntryKindAsyncMerge {
  // The workspace that asked for it, which is told how it ended.
  workspace.v1.WorkspaceRef requester = 1;
}

// Whether an entry runs or waits.
message MergeQueueStatusEntryStage {
  // THE ARM IS THE STAGE.
  oneof stage {
    // Waiting its turn.
    MergeQueueStatusEntryStageWaiting waiting = 1;
    // Running.
    MergeQueueStatusEntryStageRunning running = 2;
    // Out of line, holding the queue's FIXING-TESTS slot: its whole test
    // suite finished with failures at the head, its session fixes them, and
    // it returns to the line at the first waiting place once that turn ends,
    // running its suite again (one of its fixing attempts).
    MergeQueueStatusEntryStageFixingTests fixing_tests = 4;
    // Out of line, holding the queue's RESOLVING-CONFLICTS slot: its rebase
    // met conflicts -- at the head, or in the background while it waited --
    // and its session resolves them; it returns to the line at the first
    // waiting place once the resolution ends. Spends no fixing attempt.
    MergeQueueStatusEntryStageResolvingConflicts resolving_conflicts = 5;
    // Out of line, waiting for a repair slot another merge holds. Nothing is
    // handed its session until it is granted the slot, which the holder's
    // return to the line grants to the first merge awaiting it.
    MergeQueueStatusEntryStageAwaitingRepair awaiting_repair = 6;
  }
  // Tag 3 (`remediating`, every merge out of line with no slot) is RETIRED
  // (2026-11-11): a merge out of line holds a repair slot or awaits one.
  reserved 3;
  reserved "remediating";
}
// Holding the fixing-tests slot. No fields: the arm is the fact.
message MergeQueueStatusEntryStageFixingTests {}
// Holding the resolving-conflicts slot. No fields: the arm is the fact.
message MergeQueueStatusEntryStageResolvingConflicts {}
// Awaiting a repair slot, and where in its line for it.
message MergeQueueStatusEntryStageAwaitingRepair {
  // The slot it waits for.
  MergeQueueStatusEntryStageAwaitingRepairSlot slot = 1;
  // Its 1-based place among the merges awaiting that slot: 1 is granted the
  // slot next.
  uint32 place = 2;
}
// WHICH REPAIR SLOT A MERGE AWAITS. THE ARM IS THE SLOT.
message MergeQueueStatusEntryStageAwaitingRepairSlot {
  // The fixing-tests slot, or the resolving-conflicts slot.
  oneof slot {
    // Its whole suite failed at the head; it fixes its tests once granted.
    MergeQueueStatusEntryStageFixingTests fixing_tests = 1;
    // Its rebase conflicted; it resolves the conflicts once granted.
    MergeQueueStatusEntryStageResolvingConflicts resolving_conflicts = 2;
  }
}
// Waiting. No fields.
message MergeQueueStatusEntryStageWaiting {}
// Running, at a step.
message MergeQueueStatusEntryStageRunning {
  // The step the merge stands on, in the queue's own words ("rebasing onto
  // master", "running the integration suite"), for an agent to report. Prose
  // to be read, not a vocabulary to switch on: the queue's steps change with
  // its gates, and no consumer acts on which one runs.
  string step_description = 1;
}
