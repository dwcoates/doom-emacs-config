// merge_queue_status.proto — A MERGE QUEUE'S STATUS AS AN AGENT READS IT:
// whether it advances, and every merge in line, front first. Shared by the
// one-time read (GetMergeQueueStatus), a subscription's opening answer
// (SubscribeMergeQueue), and every merge-queue notice, so a notice can never
// describe a queue differently from a read.
//
// A merge only REQUESTED -- its asking turn still running, so not yet put in
// line -- is not in any queue and never appears here. A merge that LEFT its
// queue without landing is listed apart from the queue's entries, off the
// queue (MergeQueueStatus.off_queue), until it is put back in line
// (RequeueMerge) or discarded (DiscardMerge).

syntax = "proto3";

package agentrepl.v1;

import "workspace/v1/workspace.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// One repository's merge queue. A queue has THREE ACTIVE SLOTS, each held by
// at most one merge: the head (the one merge running its test gate and
// landing), fixing tests, and resolving conflicts (both out of line). So at
// most one entry is running, at most one is fixing_tests and at most one is
// resolving_conflicts; every other merge out of line awaits its repair's slot.
message MergeQueueStatus {
  // The repository whose queue this is.
  workspace.v1.RepositoryRef repository = 1;
  // Whether the queue advances.
  MergeQueueStatusAdvance advance = 2;
  // Every merge of the queue: those in line, front first -- the running
  // merge (when one runs), then every waiting merge in the order it will run
  // -- then every merge out of line: the holder of each repair slot, then the
  // merges awaiting each slot, in the order each will be granted it.
  repeated MergeQueueStatusEntry entries = 3;
  // Every merge that left this queue without landing and whose request still
  // stands, oldest departure first. None of them is in line, so none runs:
  // each waits for `merge-queue requeue` to put it back in line as itself, or
  // `merge-queue discard` to end it.
  repeated MergeQueueStatusOffQueue off_queue = 4;
}

// ONE MERGE OFF ITS QUEUE: it left without landing, and its request -- its
// branch, its version increment and changelog line, its deploy hooks and its
// cleanup flags -- stands until it is requeued or discarded. An async merge's
// merge workspace stays open, hidden, under the merge's name while it stands
// here, so the name is never free for a new request: a new async merge asked
// for under it is refused, naming this merge, so the caller requeues it.
message MergeQueueStatusOffQueue {
  // The workspace whose merge this is: the workspace landing its own branch,
  // or an async merge's merge workspace. RequeueMerge and DiscardMerge take
  // this ref.
  workspace.v1.WorkspaceRef workspace = 1;
  // The merge's name, as the queue listed it while it stood in line: the
  // landing workspace's name, or an async merge's own name (its merge
  // workspace's). `merge-queue requeue` and `merge-queue discard` take it.
  string name = 2;
  // The branch the request lands.
  string branch = 3;
  // What kind of merge this is, exactly as an entry in line says it.
  MergeQueueStatusEntryKind kind = 4;
  // Why it left the queue.
  MergeQueueStatusOffQueueCause cause = 5;
  // When it left the queue, epoch ms. Never zero.
  int64 left_at_ms = 6;
}

// WHY A MERGE LEFT ITS QUEUE WITHOUT LANDING. THE ARM IS THE CAUSE. A set
// message with no arm assigned is a cause this schema revision does not name.
message MergeQueueStatusOffQueueCause {
  oneof cause {
    // Taken off the queue by the user or an agent (`merge-queue dequeue`,
    // the sidebar's evict).
    MergeQueueStatusOffQueueCauseEvicted evicted = 1;
    // The user released its slot in answer to an interrupt's dequeue offer.
    MergeQueueStatusOffQueueCauseDequeued dequeued = 2;
    // It ran and gave up: a failing suite past its last fixing attempt, a
    // conflict resolution that gave up, a landing step that failed.
    MergeQueueStatusOffQueueCauseFailed failed = 3;
    // A restart left it unfinished and it could not run again.
    MergeQueueStatusOffQueueCauseRestartFailed restart_failed = 4;
    // The daemon went away under it and the restart could not put it back.
    MergeQueueStatusOffQueueCauseDaemonShutdown daemon_shutdown = 5;
    // An async merge whose preparing instruction failed.
    MergeQueueStatusOffQueueCausePickFailed pick_failed = 6;
    // A deploy whose finish stage failed before it was put in line.
    MergeQueueStatusOffQueueCauseFinishFailed finish_failed = 7;
    // The merge it was placed behind left the queue without landing.
    MergeQueueStatusOffQueueCauseAheadDidNotLand ahead_did_not_land = 8;
    // Its workspace was hidden while it stood at its cold gate.
    MergeQueueStatusOffQueueCauseHiddenAtColdGate hidden_at_cold_gate = 9;
    // ADOPTED: an async merge's merge workspace found open with no request
    // standing, left by an exit from before requests outlived their place in
    // line. Its request's values were never kept, so it records no version
    // increment, changelog line or deploy hooks: a requeue onto a versioned
    // main branch must supply the increment (RequeueMergeRequest.version).
    MergeQueueStatusOffQueueCauseAdopted adopted = 10;
  }
}
// Evicted. No fields: the arm is the fact.
message MergeQueueStatusOffQueueCauseEvicted {}
// Dequeued. No fields: the arm is the fact.
message MergeQueueStatusOffQueueCauseDequeued {}
// Failed. No fields: the merge's bubble carries the failure's account.
message MergeQueueStatusOffQueueCauseFailed {}
// Restart failed. No fields: the arm is the fact.
message MergeQueueStatusOffQueueCauseRestartFailed {}
// Daemon shutdown. No fields: the arm is the fact.
message MergeQueueStatusOffQueueCauseDaemonShutdown {}
// Pick failed. No fields: the merge's bubble carries the failure's account.
message MergeQueueStatusOffQueueCausePickFailed {}
// Finish failed. No fields: the merge's bubble carries the failure's account.
message MergeQueueStatusOffQueueCauseFinishFailed {}
// The merge ahead did not land. No fields: the arm is the fact.
message MergeQueueStatusOffQueueCauseAheadDidNotLand {}
// Hidden at its cold gate. No fields: the arm is the fact.
message MergeQueueStatusOffQueueCauseHiddenAtColdGate {}
// Adopted with no request values. No fields: the arm is the fact.
message MergeQueueStatusOffQueueCauseAdopted {}

// Whether a queue advances.
message MergeQueueStatusAdvance {
  // THE ARM IS THE STATE.
  oneof state {
    // The queue admits, promotes and runs merges.
    MergeQueueStatusAdvanceRunning running = 1;
    // The queue is paused: merges still join it, but nothing runs until it
    // is resumed.
    MergeQueueStatusAdvancePaused paused = 2;
    // The queue's head waits on the check of the last deploy
    // (repoconfig.v1.LifecycleConfig.deploy_checks): merges still join it
    // and keep their work in flight, but none lands until the chain's intake
    // approves or escalates. A paused queue answers `paused` even while a
    // check is owed.
    MergeQueueStatusAdvanceMediating mediating = 3;
  }
}
// Advancing. No fields.
message MergeQueueStatusAdvanceRunning {}
// Paused. No fields.
message MergeQueueStatusAdvancePaused {}
// Held for a deploy check. Tags 1 (`mediator`) and 2 (`name`) named the
// standing mediator workspace, which per-chain workspaces replace.
message MergeQueueStatusAdvanceMediating {
  reserved 1, 2;
  reserved "mediator", "name";
  // REQUIRED. Where the check stands; the arm IS the stage.
  oneof stage {
    // The deploy is still rolling out, so nobody is checking it yet.
    MergeQueueStatusAdvanceMediatingRollingOut rolling_out = 3;
    // The chain's intake is checking the deploy.
    MergeQueueStatusAdvanceMediatingAssessing assessing = 4;
    // A remediation workspace is fixing what the intake dispatched; no new
    // speculative work starts in the queue until its fix lands.
    MergeQueueStatusAdvanceMediatingFixing fixing = 5;
  }
  // How many remediations the chain has deployed in a row so far, 0 for a
  // chain's first deploy.
  uint32 remediations_in_a_row = 6;
}
// Rolling out.
message MergeQueueStatusAdvanceMediatingRollingOut {
  // The chain's intake, which checks the deploy once it has rolled out.
  // UNSET for a chain's first deploy, whose intake is made when the rollout
  // ends.
  optional workspace.v1.WorkspaceRef intake = 1;
}
// Assessing.
message MergeQueueStatusAdvanceMediatingAssessing {
  // REQUIRED. The chain's intake, a hidden workspace.
  workspace.v1.WorkspaceRef intake = 1;
}
// Fixing.
message MergeQueueStatusAdvanceMediatingFixing {
  // REQUIRED. The remediation workspace doing the fix, visible in the
  // sidebar like any workspace.
  workspace.v1.WorkspaceRef remediation = 1;
  // REQUIRED. The chain's intake, which checks the fix's deploy.
  workspace.v1.WorkspaceRef intake = 2;
}

// One merge in line.
message MergeQueueStatusEntry {
  // The workspace whose merge this is: the one landing its own branch, or an
  // async merge's merge workspace once it exists. For an async merge waiting
  // to start, the REQUESTER (whose feed carries its bubble).
  workspace.v1.WorkspaceRef workspace = 1;
  // That workspace's name, or, for an async merge waiting to start, the name
  // its merge workspace will carry.
  string name = 2;
  // The branch that lands.
  string branch = 3;
  // What kind of merge this is.
  MergeQueueStatusEntryKind kind = 4;
  // Whether it runs or waits.
  MergeQueueStatusEntryStage stage = 5;
  // TRUE when it was put in line at the front (agentrepl.v1
  // .MergeQueuePlacementFront).
  bool placed_at_front = 6;
}

// What kind of merge an entry is.
message MergeQueueStatusEntryKind {
  // THE ARM IS THE KIND.
  oneof kind {
    // A workspace landing its own branch (MergeWorkspace).
    MergeQueueStatusEntryKindOwnBranch own_branch = 1;
    // An async merge (CreateWorkspaceAsyncMerge).
    MergeQueueStatusEntryKindAsyncMerge async_merge = 2;
  }
}
// A workspace landing its own branch. No fields.
message MergeQueueStatusEntryKindOwnBranch {}
// An async merge.
message MergeQueueStatusEntryKindAsyncMerge {
  // The workspace that asked for it, which is told how it ended.
  workspace.v1.WorkspaceRef requester = 1;
}

// Whether an entry runs or waits.
message MergeQueueStatusEntryStage {
  // THE ARM IS THE STAGE.
  oneof stage {
    // Waiting its turn.
    MergeQueueStatusEntryStageWaiting waiting = 1;
    // Running.
    MergeQueueStatusEntryStageRunning running = 2;
    // Out of line, holding the queue's FIXING-TESTS slot: its whole test
    // suite finished with failures at the head, its session fixes them, and
    // it returns to the line at the first waiting place once that turn ends,
    // running its suite again (one of its fixing attempts).
    MergeQueueStatusEntryStageFixingTests fixing_tests = 4;
    // Out of line, holding the queue's RESOLVING-CONFLICTS slot: its rebase
    // met conflicts -- at the head, or in the background while it waited --
    // and its session resolves them; it returns to the line at the first
    // waiting place once the resolution ends. Spends no fixing attempt.
    MergeQueueStatusEntryStageResolvingConflicts resolving_conflicts = 5;
    // Out of line, waiting for a repair slot another merge holds. Nothing is
    // handed its session until it is granted the slot, which the holder's
    // return to the line grants to the first merge awaiting it.
    MergeQueueStatusEntryStageAwaitingRepair awaiting_repair = 6;
  }
  // Tag 3 (`remediating`, every merge out of line with no slot) is RETIRED
  // (2026-11-11): a merge out of line holds a repair slot or awaits one.
  reserved 3;
  reserved "remediating";
}
// Holding the fixing-tests slot. No fields: the arm is the fact.
message MergeQueueStatusEntryStageFixingTests {}
// Holding the resolving-conflicts slot. No fields: the arm is the fact.
message MergeQueueStatusEntryStageResolvingConflicts {}
// Awaiting a repair slot, and where in its line for it.
message MergeQueueStatusEntryStageAwaitingRepair {
  // The slot it waits for.
  MergeQueueStatusEntryStageAwaitingRepairSlot slot = 1;
  // Its 1-based place among the merges awaiting that slot: 1 is granted the
  // slot next.
  uint32 place = 2;
}
// WHICH REPAIR SLOT A MERGE AWAITS. THE ARM IS THE SLOT.
message MergeQueueStatusEntryStageAwaitingRepairSlot {
  // The fixing-tests slot, the one repair slot a merge waits for. Tag 2
  // (`resolving_conflicts`) is RETIRED (owner ruling, 2026-11-14):
  // resolving conflicts takes no slot, so no merge waits for it.
  oneof slot {
    // Its whole suite failed at the head; it fixes its tests once granted.
    MergeQueueStatusEntryStageFixingTests fixing_tests = 1;
  }
  reserved 2;
  reserved "resolving_conflicts";
}
// Waiting. No fields.
message MergeQueueStatusEntryStageWaiting {}
// Running, at a step.
message MergeQueueStatusEntryStageRunning {
  // The step the merge stands on, in the queue's own words ("rebasing onto
  // master", "running the integration suite"), for an agent to report. Prose
  // to be read, not a vocabulary to switch on: the queue's steps change with
  // its gates, and no consumer acts on which one runs.
  string step_description = 1;
}
