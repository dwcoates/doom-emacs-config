// endpoint_set_workspace_name.proto — SetWorkspaceName: rename a workspace.
// AGENT API section.
//
// A RENAME CHANGES THE NAME AND NOTHING ELSE. The name is what the sidebar,
// the Emacs tab bar, the topbar and every agent CLI verb call the workspace.
// The workspace's branch and its worktree directory keep the names they were
// created with: moving the directory would pull the live session's working
// directory and its vendor transcript out from under it, and the branch is a
// fact about the repository that merges and deploys name. So after a rename
// the name and the branch may differ, and every reader that needs the branch
// reads WorkspaceStatus.branch, never the name.
//
// EVERYTHING KEYED BY THE WORKSPACE'S ID SURVIVES IT: its subscriptions, what
// it awaits and who awaits it, its held prompts, its principal link, its
// queue entry and its place in the sidebar. The daemon republishes the roster
// in the same operation, so the sidebar, the tab bar and the topbar show the
// new name with no reload, and the old name stops resolving at once.
//
// AN AGENT RENAMES ITS OWN WORKSPACE WITHOUT ASKING when its task has clearly
// moved away from the name it has (the /agent-repl-workspaces skill).

syntax = "proto3";

package agentrepl.v1;

import "workspace/v1/workspace.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

message SetWorkspaceNameRequest {
  // The workspace being renamed.
  workspace.v1.WorkspaceRef workspace = 1;
  // The new name, under the naming rule a supplied create name follows
  // (CreateWorkspaceInvalidName states it): `/`-separated components, the
  // last a slug and every earlier one a prefix. A bare slug takes the
  // daemon's workspace-name prefix when one is configured, exactly as a
  // supplied create name does, so the name stored is the one
  // SetWorkspaceNameSuccess.name answers. Surrounding whitespace is trimmed.
  // A blank name is a malformed request (Connect InvalidArgument).
  string name = 2;
}

// THE ARM IS THE OUTCOME.
message SetWorkspaceNameResponse {
  oneof result {
    SetWorkspaceNameSuccess success = 1;
    SetWorkspaceNameError error = 2;
  }
}

// Recorded, and the roster republished with the new name. Renaming a
// workspace to the name it already has is no change and succeeds.
message SetWorkspaceNameSuccess {
  // The name the workspace now has, with the prefix applied: what the
  // sidebar draws and what every later CLI call names the workspace by.
  string name = 1;
}

// The daemon's refusals; nothing was recorded and the workspace keeps its
// name. Validation failures (an unset workspace, a blank name) are Connect
// InvalidArgument, never an arm.
message SetWorkspaceNameError {
  oneof cause {
    // The workspace id is not in the daemon's registry.
    SetWorkspaceNameUnknownWorkspace unknown_workspace = 1;
    // The echoed dir disagrees with the registry's dir for this id.
    SetWorkspaceNameWorkspaceRefMismatch workspace_ref_mismatch = 2;
    // This daemon released the workspace to a successor; dial `address`.
    SetWorkspaceNameTransferringAway transferring_away = 3;
    // A joining daemon has not finished adopting this workspace yet.
    SetWorkspaceNameNotYetAdopted not_yet_adopted = 4;
    // The name breaks the naming rule.
    SetWorkspaceNameInvalidName invalid_name = 5;
    // Another workspace, or a merge or create in flight, already holds the
    // name.
    SetWorkspaceNameTaken name_taken = 6;
  }
}

// The workspace id is not in the daemon's registry. DELIBERATELY EMPTY.
message SetWorkspaceNameUnknownWorkspace {}

// The echoed dir disagrees with the registry's dir for this id.
message SetWorkspaceNameWorkspaceRefMismatch {
  // The dir the registry holds for this id.
  string registry_dir = 1;
}

// This daemon released the workspace to a successor.
message SetWorkspaceNameTransferringAway {
  // The successor's `127.0.0.1:<port>`, so a lagging client dials it.
  string address = 1;
}

// A joining daemon has not finished adopting this workspace yet.
// DELIBERATELY EMPTY.
message SetWorkspaceNameNotYetAdopted {}

// A name that breaks the naming rule, refused before anything is recorded.
// The rule and its two component kinds are the ones a supplied create name
// is held to (CreateWorkspaceInvalidName), so one name is legal for both.
message SetWorkspaceNameInvalidName {
  // The name as requested, with surrounding whitespace trimmed.
  string name = 1;
  // The `/`-separated component of `name` that broke its rule, exactly as it
  // appears in `name`. Empty when that component is empty (a leading,
  // trailing or doubled `/`), which is itself the breach.
  string component = 2;
  // Which rule `component` broke, set from where the component sits in the
  // name, so a client words the refusal from the arm alone.
  oneof rule {
    // The last component is not a slug.
    SetWorkspaceNameInvalidNameSlug slug = 3;
    // A component before the last is not a prefix.
    SetWorkspaceNameInvalidNamePrefix prefix = 4;
  }
}

// The name's last component, its slug, is not lowercase hyphen-separated
// ASCII alphanumeric words. DELIBERATELY EMPTY.
message SetWorkspaceNameInvalidNameSlug {}

// A prefix component of the name is empty, or is not ASCII letters and digits
// joined by single `.`, `_` or `-`. DELIBERATELY EMPTY.
message SetWorkspaceNameInvalidNamePrefix {}

// The name is already held. Names and branches are one namespace: a
// workspace's name is refused when any OTHER registered workspace, open or
// closed, of any repository, has it as its name or as its branch, because a
// create or an async merge given that name would make it a branch. The
// renamed workspace's own name and branch are never held against it, so a
// workspace can always be renamed back to its branch.
message SetWorkspaceNameTaken {
  // The name as it resolves, with the prefix applied.
  string name = 1;
  // What holds the name.
  oneof holder {
    // A registered workspace holds it as its name or its branch.
    workspace.v1.WorkspaceRef workspace = 2;
    // No workspace holds it yet, but one is about to: a pending async merge
    // has reserved it for the merge workspace it will create, or a create
    // in flight has claimed it.
    SetWorkspaceNameTakenPending pending = 3;
  }
}

// The name is reserved by a pending async merge or claimed by a create in
// flight, so a workspace will be registered under it. DELIBERATELY EMPTY.
message SetWorkspaceNameTakenPending {}
