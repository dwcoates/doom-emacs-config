// endpoint_cancel_scheduled_shutdown.proto — the CancelScheduledShutdown
// endpoint's request, success and error.
//
// ONE ENDPOINT PER FILE: CancelScheduledShutdownRequest,
// CancelScheduledShutdownResponse and the two answers it wraps, and nothing
// else, so the whole of what one method takes and returns is readable in one
// place. The `endpoint_` prefix is the grouping, not a directory — see
// DESIGN-protobuf-surfaces.md for why a directory is not available here, and
// for why a request type belongs to agentrepl.v1 rather than frontend.v1.

syntax = "proto3";

package agentrepl.v1;

import "agentrepl/v1/shared.proto";
import "frontend/v1/failure.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// Cancel a scheduled shutdown and release the drain lease. schedule_id must
// match the live schedule; a stale id is a loud nack, so a cancel aimed at
// an old schedule can never kill a newer one.
message CancelScheduledShutdownRequest {
  // Correlation. See agentrepl.v1.AgentRepl. Daemon-global: no workspace.
  string request_id = 1;
  // The schedule to cancel, from ShutdownScheduleDraining.schedule_id.
  string schedule_id = 2;
}

// CancelScheduledShutdown's answer: exactly one of a success and an error.
//
// TWO ARMS, NOT AN `ok` BIT PLUS AN OPTIONAL FAILURE — see
// AcceptQueueEntryResponse for the whole of that argument.
message CancelScheduledShutdownResponse {
  // Echoed from the request that produced this answer. See
  // AcceptQueueEntryResponse.request_id.
  string request_id = 1;
  oneof response {
    CancelScheduledShutdownSuccess success = 2;
    CancelScheduledShutdownError error = 3;
  }
}

// The lease is released and turns flow again.
//
// NO ARMS, AND NO FIELDS. The cleared lease is broadcast as a
// ShutdownScheduleView carrying its `idle` arm, so every client learns it —
// including the ones that never sent a cancel.
message CancelScheduledShutdownSuccess {}

// Why the cancel was refused.
message CancelScheduledShutdownError {
  oneof error {
    // This daemon does not support scheduled shutdown.
    RefusalDependencyUnwired schedules_unwired = 1;
    // The named schedule is not the live one. THE ARM THAT KEEPS THE PROMISE:
    // a cancel aimed at an old schedule can never kill a newer one.
    RefusalScheduleIdStale schedule_id_stale = 2;
    // The cancel failed for a reason the daemon's classifier could not name.
    frontend.v1.FailureInternalUnclassified unclassified = 3;
  }
  // The feed card this refusal was filed under, when it produced one. See
  // AcceptQueueEntryError.failure_card.
  frontend.v1.FailureCardRef failure_card = 4;
}
