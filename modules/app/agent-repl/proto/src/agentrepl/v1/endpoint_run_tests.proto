// endpoint_run_tests.proto — RunTests: run the named tests from one
// workspace's worktree, and stream what the run reports.
//
// THE DAEMON IS THE ONE RUNNER OF TESTS. Every test run on the host goes
// through it — an agent's, through this endpoint, and the merge queue's — so
// every run shares the host's one test-CPU budget, in priority order, and none
// can start outside it. An agent names exactly the tests its change touches
// (testrun.v1.TestSelection reaches a single subtest); the whole roster is
// the merge queue's to run.
//
// THE WORKSPACE'S OWN CODE RUNS. The run builds and runs the runner from the
// workspace's worktree, against that worktree, at background priority.
syntax = "proto3";

package agentrepl.v1;

import "agentrepl/v1/workspace_topology.proto";
import "testrun/v1/run_event.proto";
import "testrun/v1/selection.proto";
import "workspace/v1/workspace.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// Run the selected tests from one workspace's worktree.
message RunTestsRequest {
  // REQUIRED. The workspace whose worktree the tests run in.
  workspace.v1.WorkspaceRef workspace = 1;
  // REQUIRED, naming at least one test. The tests to run, exactly as the
  // runner takes them.
  testrun.v1.TestRunRequest run = 2;
  // How many times the run repeats, one run after another, each a whole run
  // with its own log: every frame names the run it belongs to, so a flaky
  // test's one failing run keeps its own evidence. 0 and 1 run once. Refused
  // with a recording run.
  uint32 runs = 3;
  // Stop repeating after the first run that does not pass.
  bool stop_at_first_failure = 4;
  // Hold the host under CPU load for the whole run (bin/with-cpu-load.sh), to
  // reproduce a load-sensitive failure. ONLY THE USER ASKS FOR LOAD (owner
  // ruling, 2026-10-06): refused unless `requester` is the user.
  RunTestsCpuLoad cpu_load = 5;
  // REQUIRED. Who asks: the user, or the workspace whose agent runs the
  // command line.
  WorkspaceRequester requester = 6;
}

// The CPU load a run is held under.
message RunTestsCpuLoad {
  // REQUIRED, at least 1. How many busy loops run beside the tests.
  uint32 loops = 1;
}

// One frame of the run's stream.
message RunTestsResponse {
  // Exactly one arm is set. A run that starts streams its runner's events,
  // ending with `ended` or `refused`; a run the daemon cannot start, or whose
  // runner dies before it reports its end, streams one `error` and closes.
  oneof frame {
    // What the runner reported, relayed verbatim.
    testrun.v1.TestRunEvent event = 1;
    // The daemon could not run the tests, or the runner ended without saying
    // how its run ended.
    RunTestsError error = 2;
  }
  // Which run of the request the frame belongs to, from 1. Every frame of a
  // run that repeats carries it; a request that runs once carries 1.
  uint32 run = 3;
}

// Why the run could not start or did not finish.
message RunTestsError {
  // Which failure it was.
  oneof cause {
    // No workspace the daemon serves is the one named.
    RunTestsUnknownWorkspace unknown_workspace = 1;
    // The request named no test.
    RunTestsNoSelection no_selection = 2;
    // The runner could not be started, or ended without reporting its end.
    RunTestsRunnerFailed runner_failed = 3;
    // CPU load was asked for by someone other than the user.
    RunTestsCpuLoadRefused cpu_load_refused = 4;
    // The request's options contradict each other.
    RunTestsInvalid invalid = 5;
  }
}

// CPU load was asked for by someone other than the user.
message RunTestsCpuLoadRefused {}

// The request's options contradict each other.
message RunTestsInvalid {
  // Which options, and why they cannot go together.
  string detail = 1;
}

// No workspace the daemon serves is the one named.
message RunTestsUnknownWorkspace {}

// The request named no test.
message RunTestsNoSelection {}

// The runner could not be started, or ended without reporting its end.
message RunTestsRunnerFailed {
  // The runner's exit status; -1 when it never started.
  int32 exit_code = 1;
  // What went wrong, and where the runner's log is when it got that far.
  string detail = 2;
}
