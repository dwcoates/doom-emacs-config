// endpoint_register_repository.proto — RegisterRepository: a repository joins
// the roster from ANY path inside it, together with its MAIN WORKTREE as an
// open workspace. SIDEBAR section.
//
// It exists because a repository had exactly one way in: as a SIDE EFFECT of
// RegisterWorkspace, which mints the repository record for the worktree it is
// announcing. So the only way to make a repository pickable — for the static
// create, which is the one mode that names a repository by hand — was to
// register a workspace in it first, and there was no way at all to say "this
// repository exists" about a checkout nobody is working in yet.
//
// THE PATH IS ANY PATH INSIDE THE REPOSITORY, a file as readily as a
// directory, because that is what the caller HAS: the editor's gesture is
// "pick a file", and the repository is derived from it. The daemon resolves
// the repository's MAIN WORKTREE from that path through git — which is what
// workspace.v1's RepositoryRef.dir means — and normalizes it exactly as
// RegisterWorkspace normalizes a worktree dir.
//
// IDEMPOTENT BY THE RESOLVED DIR, and the answer SAYS SO rather than hiding
// it: `already_known` distinguishes "this is new" from "you already had it",
// which is the whole difference the caller reports to the user. Neither is an
// error.
//
// IT ALSO REGISTERS THE MAIN WORKTREE AS A WORKSPACE (owner ruling,
// 2026-09-14). The first landing registered the repository ALONE, and a
// repository with no workspace is not selectable: `SPC p p' completes over
// live workspaces, so a user who registered the repository they were standing
// in still could not switch to it. The main worktree is a git worktree like
// any other, so it is registered through the SAME registration
// RegisterWorkspace runs — never a second, nearly-identical one.
//
// NOT PER-WORKSPACE. The REQUEST carries no ref to key on, so none of the
// ownership or handover arms applies — the same reason RegisterWorkspace
// carries none. The workspace the response returns is minted here, exactly as
// RegisterWorkspace mints the one it answers with.

syntax = "proto3";

package agentrepl.v1;

import "workspace/v1/workspace.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

message RegisterRepositoryRequest {
  // ANY path inside the repository, in whatever spelling the caller has: a
  // file, a directory, a linked worktree's checkout. A PATH, not an identity:
  // the daemon resolves the repository from it and MINTS the identity, which
  // the response returns.
  string path = 1;
}

// THE ARM IS THE OUTCOME.
message RegisterRepositoryResponse {
  oneof result {
    RegisterRepositorySuccess success = 1;
    RegisterRepositoryError error = 2;
  }
}
// Registered (or already was — idempotence makes the two one answer, and
// `already_known` is which of them it was).
message RegisterRepositorySuccess {
  // The repository's daemon-minted identity and its normalized main-worktree
  // directory — what the roster's repository section carries and what
  // CreateWorkspace is handed back.
  workspace.v1.RepositoryRef repository = 1;
  // True when the registry already held this repository, so nothing was
  // minted. It is an ANSWER, never a refusal: a caller re-registering the
  // repository it already registered gets its ref back and says so.
  bool already_known = 2;
  // The repository's MAIN WORKTREE, registered as an open workspace by this
  // same call (owner ruling, 2026-09-14). A repository that joined the roster
  // with no workspace at all could not be switched to: `SPC p p' completes
  // over LIVE WORKSPACES, so the directory the caller pointed at was still
  // not available for selection, which is the whole thing the gesture was
  // asked for.
  //
  // IT IS REGISTERED EXACTLY AS RegisterWorkspace WOULD REGISTER IT -- the
  // same mint, the same derived naming, the same roster row, the same
  // session bring-up, the same refusals -- because one directory must not
  // have two registration behaviors depending on which rpc announced it. The
  // two endpoints run ONE registration.
  //
  // ALWAYS SET on success: this call registers the workspace or finds the one
  // already registered for that directory, and never answers without one.
  workspace.v1.WorkspaceRef workspace = 3;
  // True when the registry already held a workspace for that main-worktree
  // directory, so this call adopted it rather than minting one. It is the
  // workspace's own answer to the question `already_known' answers for the
  // repository, and the two are INDEPENDENT: a repository minted by an
  // earlier RegisterWorkspace is already known while its workspace is too,
  // and a repository registered before this ruling landed is already known
  // while its workspace is fresh.
  bool workspace_already_known = 4;
}
// THE ARM IS THE REFUSAL.
// Validation failures (unset field, UNSPECIFIED enum, blank string) are Connect InvalidArgument, never an arm.
message RegisterRepositoryError {
  oneof cause {
    // The path is readable but lies inside no git work tree — or inside a
    // bare repository, which has no main worktree to name.
    RegisterRepositoryNotInARepository not_in_a_repository = 1;
    // The path cannot be read at all: it is not there, or its directory
    // cannot be stat'ed.
    RegisterRepositoryUnreadablePath unreadable_path = 2;
    // The repository's main worktree lies inside a temporary directory.
    RegisterRepositoryInsideTemporaryDirectory inside_temporary_directory = 3;
  }
}
message RegisterRepositoryNotInARepository {}
message RegisterRepositoryUnreadablePath {}
// The directory lies inside a temporary directory (owner ruling,
// 2026-10-06): agent-repl does not register temporary folders. A temporary
// folder is scratch space the OS or a test run purges, so a roster row for
// it names a directory about to vanish.
message RegisterRepositoryInsideTemporaryDirectory {
  // The refused directory, canonical (symlinks resolved, on-disk case).
  string dir = 1;
  // The canonical temporary root `dir` lies inside: the process's own
  // temporary directory, `/tmp`, `/var/tmp` or `/var/folders`.
  string temporary_root = 2;
}
