// endpoint_select_response.proto — SelectResponse: move or clear the
// response-selection cursor for one workspace. FEED section.
//
// Reply-to-a-past-response mode. The user, in the input window's command
// mode, walks the ordered final-response rows (`C-p` = PREV, `C-n` = NEXT)
// and clears the selection (double-escape). The DAEMON owns the selection
// state per workspace — it knows the ordered final-response rows, so it
// COMPUTES the newly selected feedid (both directions start at the most
// recent and wrap at each end) rather than the client naming one. The
// resulting selection is PUSHED to the webapp on the feed watch
// (frontend.v1.FeedSelection) so the bubble recolors and center-scrolls, and
// is also ACKED here so the caller (Emacs) can track selection state.
//
// The client sends only a DIRECTION, never a feedid: the daemon is the
// shared source of truth, exactly as it is for the footer and the feed.

syntax = "proto3";

package agentrepl.v1;

import "workspace/v1/workspace.proto";
import "frontend/v1/feed.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// Which way to move the response-selection cursor.
enum SelectResponseDirection {
  // Never sent: a request carrying it is refused as InvalidArgument.
  SELECT_RESPONSE_DIRECTION_UNSPECIFIED = 0;
  // The PREVIOUS (older) final-response row. From no selection, starts at the
  // most recent; past the oldest, wraps to the newest.
  SELECT_RESPONSE_DIRECTION_PREV = 1;
  // The NEXT (newer) final-response row. From no selection, starts at the
  // most recent; past the newest, wraps to the oldest.
  SELECT_RESPONSE_DIRECTION_NEXT = 2;
  // Clear the selection outright (double-escape). The daemon drops the
  // selection state and the webapp returns to the feed bottom.
  SELECT_RESPONSE_DIRECTION_CLEAR = 3;
}

message SelectResponseRequest {
  // The workspace whose selection cursor to move — the daemon-minted ref,
  // echoed verbatim like every per-workspace request.
  workspace.v1.WorkspaceRef workspace = 1;
  // Which way to move the cursor, or to clear it.
  SelectResponseDirection direction = 2;
}

// THE ARM IS THE OUTCOME.
message SelectResponseResponse {
  oneof result {
    SelectResponseSuccess success = 1;
    SelectResponseError error = 2;
  }
}

// The cursor moved (or cleared). The webapp learns the same result on the
// feed watch's FeedSelection push; this ack is for the caller's own state.
message SelectResponseSuccess {
  // The row now selected after applying the direction, or UNSET for "none" —
  // a CLEAR, or a workspace with no selectable final-response rows.
  optional frontend.v1.FeedId selected = 1;
}

// Arms derived from the daemon's refusal sites, mirroring SelectWorkspace.
// Validation failures (unset field, UNSPECIFIED enum) are Connect
// InvalidArgument, never an arm.
message SelectResponseError {
  oneof cause {
    // The workspace id is not in the daemon's registry.
    SelectResponseUnknownWorkspace unknown_workspace = 1;
    // The echoed dir disagrees with the registry's dir for this id.
    SelectResponseWorkspaceRefMismatch workspace_ref_mismatch = 2;
    // This daemon released the workspace to a successor; dial `address`.
    SelectResponseTransferringAway transferring_away = 3;
    // A joining daemon has not finished adopting this workspace yet.
    SelectResponseNotYetAdopted not_yet_adopted = 4;
  }
}
message SelectResponseUnknownWorkspace {}
message SelectResponseWorkspaceRefMismatch {
  // The dir the registry holds for this id.
  string registry_dir = 1;
}
message SelectResponseTransferringAway {
  // The successor's `127.0.0.1:<port>`, so a lagging client dials it.
  string address = 1;
}
message SelectResponseNotYetAdopted {}
