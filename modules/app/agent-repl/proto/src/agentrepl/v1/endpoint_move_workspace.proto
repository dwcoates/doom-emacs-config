// endpoint_move_workspace.proto — MoveWorkspace: move one workspace onto
// another's place in the registry order. SIDEBAR section. The sidebar and the
// editor's tab bar are both views of the registry order, so one move shows on
// both; the new order arrives on the roster stream.

syntax = "proto3";

package agentrepl.v1;

import "workspace/v1/workspace.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// Move one workspace onto another's place in the registry order. Every
// workspace between the two shifts one place toward the place the moved
// workspace left, so the moved workspace ends exactly where the target was
// and the target ends beside it, on the side the mover came from. The
// sidebar and the tab bar both redraw from the registry, so the move shows
// on both.
message MoveWorkspaceRequest {
  // The workspace to move. Must differ from `target` by id
  // (InvalidArgument otherwise).
  workspace.v1.WorkspaceRef workspace = 1;
  // The workspace whose place `workspace` takes, as the roster served it.
  workspace.v1.WorkspaceRef target = 2;
}

// The set arm is the outcome.
message MoveWorkspaceResponse {
  oneof result {
    MoveWorkspaceSuccess success = 1;
    MoveWorkspaceError error = 2;
  }
}

// The workspace moved; the roster push carries the new order.
message MoveWorkspaceSuccess {}

// Why the move was not made. No place changes on any arm.
message MoveWorkspaceError {
  oneof cause {
    // A ref's id is not in the daemon's registry.
    MoveWorkspaceUnknownWorkspace unknown_workspace = 1;
    // A ref's dir disagrees with the registry's dir for its id.
    MoveWorkspaceWorkspaceRefMismatch workspace_ref_mismatch = 2;
    // This daemon released a workspace to a successor; dial `address`.
    MoveWorkspaceTransferringAway transferring_away = 3;
    // A joining daemon has not finished adopting a workspace yet.
    MoveWorkspaceNotYetAdopted not_yet_adopted = 4;
  }
}
// Names the ref the registry does not hold.
message MoveWorkspaceUnknownWorkspace { workspace.v1.WorkspaceRef workspace = 1; }
// Names the mismatched ref and the dir the registry holds for its id.
message MoveWorkspaceWorkspaceRefMismatch {
  workspace.v1.WorkspaceRef workspace = 1;
  string registry_dir = 2;
}
// The successor's `127.0.0.1:<port>`.
message MoveWorkspaceTransferringAway { string address = 1; }
// Adoption of a named workspace is still in progress.
message MoveWorkspaceNotYetAdopted {}
