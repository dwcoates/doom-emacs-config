// endpoint_subscribe.proto — the Subscribe endpoint's request and response.
//
// ONE ENDPOINT PER FILE: SubscribeRequest and SubscribeResponse and nothing
// else, so the whole of what one method takes and returns is readable in one
// place. The `endpoint_` prefix is the grouping, not a directory — see
// DESIGN-protobuf-surfaces.md for why a directory is not available here, and for
// why a request type belongs to agentrepl.v1 rather than frontend.v1.

syntax = "proto3";

package agentrepl.v1;

import "agentrepl/v1/frame.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// What Subscribe is called with.
//
// IT NAMES THE READER AND NOTHING ELSE. Under the WebSocket this protocol grew
// up on, one socket carried both the commands and the pushes, so "which reader
// is this" was the socket itself and no field had to say it. A service splits
// them: a NextPage call is its own HTTP request and arrives with no inherent
// relationship to any stream. `client_id` is what restores the association the
// socket used to provide for free.
//
// IT DOES NOT STATE A ROLE, AND MUST NOT. Several fields on StateSnapshot and
// several arms on FrontendFrame are HOST SURFACE, stripped from every GUI
// client. That distinction stays in the LISTENER — the host reaches the daemon
// over its private UDS, a GUI client over the TCP listener — because a role a
// client declares is a role a client can claim. A field here would convert an
// unreachable socket into a string anyone may send.
message SubscribeRequest {
  // The reader's OWN identity, minted by the client and stable for the life of
  // this stream. Every command whose effect arrives on this stream rather than
  // in its own ack (Resync, FirstPage, NextPage, DaemonHealth, SessionHealth)
  // repeats it, so the daemon knows which stream to push the answer down.
  //
  // CLIENT-MINTED, exactly as request_id is, and for the same reason: a client
  // that generates its own id can correlate a push that beats the ack it was
  // waiting for. An id the daemon assigned would not exist yet at the moment
  // the client needs it.
  string client_id = 1;
}

// One element of the Subscribe stream: exactly one FrontendFrame.
//
// IT IS A WRAPPER, AND THE WRAPPER COSTS SOMETHING. Every method on this
// service names its own response type, so the stream element is spelled
// SubscribeResponse like every other answer, and a reader that knows the
// method knows the type without a special case. The alternative was renaming
// FrontendFrame itself to SubscribeResponse, which would have retired a name
// the daemon, the webapp and the elisp frontend all use as their central
// vocabulary word for "a thing pushed at a client".
//
// THE COST IS PAID PER FRAME, ON THE HOT PATH. This is the channel every
// delta, every typing preview and every conversation record travels on, and
// each one now carries one extra length-delimited nesting level: a tag, a
// length, and one more allocation in every generated decoder. Nothing else on
// this surface pays a per-message price for a naming rule. If that price is
// ever measured and disliked, the remedy is the rename, not a second
// unwrapped stream.
message SubscribeResponse {
  // The pushed frame, unchanged. Its arms, its ordering guarantees and its
  // snapshot-then-deltas contract are FrontendFrame's and are documented
  // there; this field adds nothing to them but a name for the stream element.
  FrontendFrame frame = 1;
}
