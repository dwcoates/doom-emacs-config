// endpoint_interrupt.proto — Interrupt: "stop that". FEED section. One user
// intent, four targets; THE ARM IS THE TARGET. (CancelDetachedAgents does
// not return as a verb; the all_agents target is its fan-wide successor.)

syntax = "proto3";

package agentrepl.v1;

import "workspace/v1/workspace.proto";
import "frontend/v1/feed.proto";
import "agentrepl/v1/rollback.proto";
import "conversation/v1/user.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

message InterruptRequest {
  workspace.v1.WorkspaceRef workspace = 1;
  oneof target {
    // The running turn (the vendor query interrupt).
    InterruptTurn turn = 2;
    // A detached bubble's work, by the bubble row's FeedId exactly as the
    // feed served it (the daemon decodes it and issues the task stop).
    frontend.v1.FeedId detached = 3;
    // EVERY live detached agent at once — the fan-wide stop.
    InterruptAllAgents all_agents = 4;
    // An AGENTIC merge tab's work (pick, pre-prompt, conflicts, fixes,
    // post-prompt), by the tab row's FeedId exactly as the feed served it. It
    // stops the turn that tab draws: for an ASYNC merge the merge workspace's
    // turn, which also reveals the merge workspace in the tab bar and the
    // sidebar; for a SYNC merge the requesting workspace's own turn. The
    // merge then goes on as its step decides, exactly as if the agent's turn
    // had ended on its own.
    frontend.v1.FeedId merge_tab = 6;
  }
  // Answers the confirm_required challenge: interrupting a TURN while
  // detached agents are live is refused once, naming the count; resending
  // with this set also stops those agents. Meaningless on the other
  // targets. Default false.
  bool confirm_agents = 5;
}
// The running turn, as the target of a stop.
message InterruptTurn {
  // Asks the stop to roll the running turn's prompt back as well, when
  // nothing the agent produced follows that prompt in the root feed yet: the
  // turn is then stopped BY the rollback, its prompt and every row of it leave
  // the feed without an "interrupted" marker, and the answer is
  // `rolled_back_unanswered` carrying the prompt's words. Set by a client that
  // holds a composer to put those words back into (Emacs's stop key); a
  // client with no composer leaves it UNSET, because a rolled-back prompt's
  // words would have nowhere to go. UNSET: the turn is only stopped. The
  // rollback is skipped, and the turn only stopped, when output already
  // follows the prompt, when no prompt can be rolled back, or when detached
  // agents are live (the confirm_required challenge governs that stop).
  //
  // A HELD PROMPT IS TAKEN BACK FIRST. When the newest prompt the user sent
  // stands held behind the running turn, and nothing the agent produced has
  // been drawn in the root feed since it was queued, the stop takes that held
  // prompt out of the queue INSTEAD of stopping anything: the running turn
  // runs on, and the answer is `rolled_back_unanswered` carrying the held
  // prompt's words. Once output has been drawn after it was queued, the stop
  // stops the turn as above and the held prompt stays queued.
  optional InterruptTurnRollBackUnanswered roll_back_unanswered = 1;
}
// Presence asks a turn stop to roll back an unanswered prompt. DELIBERATELY
// EMPTY: the prompt is the latest one a rollback can reach, and files are
// always kept, so there is nothing for the client to choose.
message InterruptTurnRollBackUnanswered {}
message InterruptAllAgents {}

// THE ARM IS THE OUTCOME.
message InterruptResponse {
  oneof result {
    InterruptSuccess success = 1;
    InterruptError error = 2;
  }
}

// THE ARM IS WHAT THE STOP DID — a frontend renders these differently, so a
// bool cannot carry it. `nothing_running` is an ANSWER, never a failure: the
// stop found the session already quiet, which is a legitimate reply to a
// legitimate ask ("a stop that missed" is distinguishable BY THE ARM, not by
// mis-classing it as an error).
message InterruptSuccess {
  oneof outcome {
    // The turn was interrupted.
    InterruptedTurn interrupted_turn = 1;
    // The detached work was stopped.
    InterruptedDetached interrupted_detached = 2;
    // Nothing was running.
    InterruptNothingRunning nothing_running = 3;
    // Nothing was running, and the workspace's own SYNC merge is in the
    // queue: the interrupt is about that merge, so it raised the merge-queue
    // question in the merge's pinned bubble
    // (frontend.v1.FeedMerge.queue_offer) and did NOTHING ELSE. The queue is
    // untouched until the question is answered, and no rollback is offered:
    // the stop key's second press means the merge here, never the prompt.
    InterruptMergeQueueOffered merge_queue_offered = 4;
    // The stop asked for an unanswered prompt's rollback
    // (InterruptTurn.roll_back_unanswered) and took one back: either the
    // running turn's prompt had nothing after it, and the turn was stopped
    // by rolling that prompt back, or a held prompt nothing had answered
    // since it was queued was taken out of the queue, and the turn runs on.
    InterruptRolledBackUnanswered rolled_back_unanswered = 5;
  }
}
// The turn was interrupted.
message InterruptedTurn {
  // Why the prompt was not rolled back, when the stop asked for an unanswered
  // prompt's rollback (InterruptTurn.roll_back_unanswered), nothing followed
  // that prompt, and the rollback was refused: the turn was stopped anyway, as
  // the stop the user asked for, and the prompt stays in the feed. UNSET when
  // no rollback was attempted.
  optional InterruptedTurnNotRolledBack not_rolled_back = 1;
}
// A stop's rollback that did not happen. The conversation, the feed, the held
// prompts and the files are as they were, and the turn was stopped.
message InterruptedTurnNotRolledBack {
  // Why, exactly as RollBack refuses: the first prompt of a vendor
  // conversation cannot be cut away, the vendor may not yet hold the prompt's
  // record, the vendor may refuse the cut.
  RollBackError cause = 1;
}
// THE STOP ROLLED THE UNANSWERED PROMPT BACK. For the running turn's prompt,
// the conversation ends just before the prompt, held prompts queued after it
// are dropped, files are kept, and the feed draws neither the prompt nor its
// turn's end, so no "interrupted" marker appears. For a held prompt, it
// leaves the held section and nothing else changes. Either way Emacs saves
// the composer's contents to its history and fills it with the prompt,
// exactly as after RollBack.
message InterruptRolledBackUnanswered {
  // The prompt rolled back, as the user said it: its text and attachments,
  // for the composer to hold again. A quote the prompt replied with
  // (conversation.v1.UserQuoteBlock) is left out: a resend replies to
  // whatever is selected when it is sent.
  conversation.v1.UserSaid prompt = 1;
}
// The frontend focuses the merge bubble's question. DELIBERATELY EMPTY: the
// question itself rides the bubble's row.
message InterruptMergeQueueOffered {}
message InterruptedDetached {
  // How many detached agents the stop reached ("cancelled 3 agents"). The
  // shim's task ids stay on the shim wire — daemon bookkeeping a frontend
  // has no vocabulary for.
  int64 count = 1;
}
// The stop found the session quiet. A turn stop that finds nothing running is
// the SECOND PRESS of the stop key: the turn it would stop already ended (the
// first press stopped it, or it concluded on its own), so the key moves on to
// rolling the latest prompt back. A first press whose prompt had nothing after
// it already rolled the prompt back (rolled_back_unanswered), so a second
// press reaches the prompt before it.
message InterruptNothingRunning {
  // What rolling back offers now, for a turn stop. UNSET when no prompt can be
  // rolled back (none since the last clear or compaction), and always UNSET on
  // the detached and all_agents targets, which roll nothing back.
  optional InterruptNothingRunningRollback rollback = 1;
}

// How the latest prompt can be rolled back, decided by whether anything the
// agent produced has landed in the root feed after it.
message InterruptNothingRunningRollback {
  // The set arm IS the way: a prompt nothing has answered yet is cancelled
  // outright, while a prompt with output after it is one a reader must choose
  // to give up, so the frontend offers every reachable prompt instead.
  oneof offer {
    // Nothing the agent produced follows the latest prompt.
    InterruptNothingRunningRollbackImmediate immediate = 1;
    // Agent output follows the latest prompt.
    InterruptNothingRunningRollbackChoose choose = 2;
  }
}

// THE LATEST PROMPT HAS NOTHING AFTER IT: no response bubble, tool card,
// subagent or shell bubble, permission or question card has landed in the root
// feed since it was sent. Rolling it back drops nothing a reader has seen
// besides the prompt itself, so the frontend rolls back at once, with no
// confirmation, by handing `token` to RollBack. The daemon refuses that
// RollBack as `plan_stale` if agent output has landed after the prompt since,
// so a token minted here never drops a bubble the reader did not have in front
// of them when they pressed the key.
message InterruptNothingRunningRollbackImmediate {
  // A rollback plan to just before the latest prompt, keeping files, minted
  // exactly as PlanRollback mints one.
  RollbackToken token = 1;
}

// AGENT OUTPUT FOLLOWS THE LATEST PROMPT, so rolling back is a choice with a
// cost. The frontend lists the reachable prompts (ListRollbackPrompts), lets
// the reader pick one, and plans that rollback by naming it
// (PlanRollbackRequest.prompt), confirming as for any other rollback.
message InterruptNothingRunningRollbackChoose {}

// Arms derived from the daemon's refusal sites (landing 4, 2026-08-29).
// Validation failures (unset field, UNSPECIFIED enum, blank string) are Connect InvalidArgument, never an arm.
message InterruptError {
  oneof kind {
    // A turn interrupt while detached agents are live: the challenge.
    // Resend with confirm_agents to also stop them, or stop them first
    // via the all_agents target.
    InterruptConfirmRequired confirm_required = 1;
    // The workspace id is not in the daemon's registry.
    InterruptUnknownWorkspace unknown_workspace = 2;
    // The echoed dir disagrees with the registry's dir for this id.
    InterruptWorkspaceRefMismatch workspace_ref_mismatch = 3;
    // This daemon released the workspace to a successor; dial `address`.
    InterruptTransferringAway transferring_away = 4;
    // A joining daemon has not finished adopting this workspace yet.
    InterruptNotYetAdopted not_yet_adopted = 5;
    // The FeedId names no detached item.
    InterruptNotDetachedWork not_detached_work = 6;
    // The workspace has no session to interrupt.
    InterruptNoSession no_session = 7;
    // A typed shim refusal relayed (e.g. UpdateAgent nothing_running).
    InterruptShimRefused shim_refused = 8;
    // The FeedId names no agentic tab of a merge this workspace's feed draws.
    InterruptNotMergeTab not_merge_tab = 9;
  }
}

// The are-you-sure challenge for a turn stop with live agents.
message InterruptConfirmRequired {
  // How many live detached agents the stop would also end.
  int64 live_agent_count = 1;
}
message InterruptUnknownWorkspace {}
message InterruptWorkspaceRefMismatch {
  // The dir the registry holds for this id.
  string registry_dir = 1;
}
message InterruptTransferringAway {
  // The successor's `127.0.0.1:<port>`, so a lagging client dials it.
  string address = 1;
}
message InterruptNotYetAdopted {}
message InterruptNotDetachedWork {}
message InterruptNoSession {}
// The merge_tab target named a row that is not a live agentic merge tab:
// another kind of row, a resolved tab, or a tab of a merge that has ended.
message InterruptNotMergeTab {}
message InterruptShimRefused {
  // The shim's own account of the refusal.
  string detail = 1;
}
