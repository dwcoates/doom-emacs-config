// endpoint_prune_storage.proto — PruneStorage: run the daemon's storage sweep
// now, or judge one without deleting anything. RUNTIME section.
//
// The sweep deletes agent-repl's own stored data once nothing will read it
// again (daemon/internal/storagesweep): each workspace's shim state directory
// (<state root>/shim/<key>), judged by the workspace's close record, and the
// dated entries of the host's cache directories no record points at
// (profiling sessions, the test runner's reuse records), judged by age. It
// also runs on its own once a day; this asks for one now.
//
// A DRY RUN JUDGES EXACTLY AS A SWEEP DOES and deletes nothing, so what it
// answers is what a sweep at that instant would delete.

syntax = "proto3";

package agentrepl.v1;

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

message PruneStorageRequest {
  // Judge only: delete nothing and answer what a sweep would delete.
  bool dry_run = 1;
}

// THE ARM IS THE OUTCOME.
message PruneStorageResponse {
  oneof result {
    PruneStorageSuccess success = 1;
    PruneStorageError error = 2;
  }
}

// The sweep ran to its end. Entries it failed on are counted in `failures`
// and recorded in the daemon's log; the sweep goes on past each.
message PruneStorageSuccess {
  // Nothing was deleted: `removed` is what a sweep would delete.
  bool dry_run = 1;
  // Every deletion, in the order made.
  repeated PruneStorageRemoval removed = 2;
  // What every removal held together, in bytes.
  uint64 bytes = 3;
  // The entries left alone, one count per reason.
  repeated PruneStorageKept kept = 4;
  // How many steps failed.
  uint32 failures = 5;
}

// One deleted entry.
message PruneStorageRemoval {
  // The absolute path deleted: a directory with everything under it, or a file.
  string path = 1;
  // The rule that deleted it. Never UNSPECIFIED.
  PruneStorageReason reason = 2;
  // What it held, in bytes.
  uint64 bytes = 3;
}

// Why an entry was deleted.
enum PruneStorageReason {
  PRUNE_STORAGE_REASON_UNSPECIFIED = 0;
  // A shim state directory no workspace the registry knows keys to: its
  // workspace was forgotten.
  PRUNE_STORAGE_REASON_NO_WORKSPACE = 1;
  // A shim state directory whose every workspace closed by its own merge
  // more than three days ago: the whole directory.
  PRUNE_STORAGE_REASON_LANDED = 2;
  // A shim state directory whose every workspace closed more than thirty
  // days ago, one by something other than its merge: only its transcript
  // backups, so a reopened workspace keeps its identity.
  PRUNE_STORAGE_REASON_CLOSED_BACKUPS = 3;
  // A cache directory's entry older than thirty days.
  PRUNE_STORAGE_REASON_AGED = 4;
}

// How many entries were left alone for one reason.
message PruneStorageKept {
  // Never UNSPECIFIED.
  PruneStorageKeepReason reason = 1;
  uint32 count = 2;
}

// Why an entry was left alone.
enum PruneStorageKeepReason {
  PRUNE_STORAGE_KEEP_REASON_UNSPECIFIED = 0;
  // A workspace keyed to the shim directory is open.
  PRUNE_STORAGE_KEEP_REASON_OPEN_WORKSPACE = 1;
  // Its workspaces closed too recently.
  PRUNE_STORAGE_KEEP_REASON_RECENTLY_CLOSED = 2;
  // A file where the shim keeps only directories.
  PRUNE_STORAGE_KEEP_REASON_NOT_A_DIRECTORY = 3;
  // Its backups are already gone.
  PRUNE_STORAGE_KEEP_REASON_NO_BACKUPS = 4;
  // A cache entry younger than its directory's age.
  PRUNE_STORAGE_KEEP_REASON_YOUNG = 5;
  // A cache entry its directory keeps whatever its age (the open profiling
  // session).
  PRUNE_STORAGE_KEEP_REASON_KEPT_BY_DIRECTORY = 6;
}

message PruneStorageError {
  oneof cause {
    // A sweep is already running in this daemon.
    PruneStorageAlreadyRunning already_running = 1;
    // Another daemon (a handover's other half) holds the sweep's lock.
    PruneStorageHeldElsewhere held_elsewhere = 2;
    // The sweep could not run or ended early.
    PruneStorageFailed failed = 3;
  }
}
// Empty: nothing more is known.
message PruneStorageAlreadyRunning {}
// Empty: nothing more is known.
message PruneStorageHeldElsewhere {}
message PruneStorageFailed {
  // What ended the sweep.
  string detail = 1;
}
