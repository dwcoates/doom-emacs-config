// endpoint_evict_merge.proto — the EvictMerge endpoint's request, success and
// error.
//
// ONE ENDPOINT PER FILE: EvictMergeRequest, EvictMergeResponse and the two
// answers it wraps, and nothing else, so the whole of what one method takes and
// returns is readable in one place. The `endpoint_` prefix is the grouping, not
// a directory — see DESIGN-protobuf-surfaces.md for why a directory is not
// available here, and for why a request type belongs to agentrepl.v1 rather
// than frontend.v1.

syntax = "proto3";

package agentrepl.v1;

import "agentrepl/v1/shared.proto";
import "frontend/v1/failure.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// Evict ONE waiting entry by run id. The evicted run receives a terminal
// failed MergeStatus with an eviction cause, so the workspace's merge axis
// resolves immediately. REFUSED when run_id names the running head (only its
// drain goroutine may retire it) or names nothing outstanding.
message EvictMergeRequest {
  // Correlation. See agentrepl.v1.AgentRepl. The merge queue is
  // daemon-global and a run id names one entry in it, so there is no workspace.
  string request_id = 1;
  // The run id the roster and every MergeStatus carry.
  string run_id = 2;
}

// EvictMerge's answer: exactly one of a success and an error.
//
// TWO ARMS, NOT AN `ok` BIT PLUS AN OPTIONAL FAILURE — see
// AcceptQueueEntryResponse for the whole of that argument.
message EvictMergeResponse {
  // Echoed from the request that produced this answer. See
  // AcceptQueueEntryResponse.request_id.
  string request_id = 1;
  oneof response {
    EvictMergeSuccess success = 2;
    EvictMergeError error = 3;
  }
}

// The entry is off the queue and its run is retired.
//
// NO ARMS, AND NO STATUS. The evicted run's terminal MergeStatus is pushed, and
// restating it here would give a client two copies of one verdict.
message EvictMergeSuccess {}

// Why the eviction was refused.
//
// THE TWO ARMS BELOW ARE THE CONTRACT'S OWN, NOT THE DAEMON'S. This daemon has
// no EvictMerge handler to derive from — the method is declared on the service
// and nothing implements it — so the arms are exactly the two refusals this
// endpoint's own normative text has always promised, and no more. Anything
// further is left unstated rather than guessed: when the handler exists, its
// real refusal paths are what add arms here.
message EvictMergeError {
  oneof error {
    // The run id names the RUNNING head. Only its own drain goroutine may
    // retire that: evicting it from underneath the goroutine would retire a run
    // that is still writing to the target.
    RefusalMergeRunIsRunningHead run_is_running_head = 1;
    // The run id names nothing outstanding on the queue.
    RefusalMergeRunNotOutstanding run_not_outstanding = 2;
    // The eviction failed for a reason the daemon's classifier could not name.
    frontend.v1.FailureInternalUnclassified unclassified = 3;
  }
  // The feed card this refusal was filed under, when it produced one. See
  // AcceptQueueEntryError.failure_card.
  frontend.v1.FailureCardRef failure_card = 4;
}
