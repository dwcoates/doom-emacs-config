// endpoint_update_merge_queue.proto — UpdateMergeQueue: operator control of
// the daemon's merge queue. DAEMON ADMIN section. Purely inbound; the
// queue's visible state rides the merge bubbles' queue tabs and the roster's
// status arms, and a workspace's agent learns of its changes through a
// subscription's notices. Consolidates the old PauseMergeQueue / ResumeMergeQueue /
// EvictMerge trio.

syntax = "proto3";

package agentrepl.v1;

import "workspace/v1/workspace.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

message UpdateMergeQueueRequest {
  // THE ARM IS THE ACTION.
  oneof action {
    // Stop admitting merges to the front; queued merges hold in place.
    UpdateMergeQueuePause pause = 1;
    // Resume admitting.
    UpdateMergeQueueResume resume = 2;
    // Take ONE workspace's merge off the queue.
    UpdateMergeQueueEvict evict = 3;
    // HOLD THE ROLLOUTS, daemon-wide: merges keep running and landing exactly
    // as they do, but a landing in the daemon's own checkout no longer tells
    // the deploy, so nothing redeploys, hot-reloads or bounces the running
    // runtime. For an operator running a hand-deployed build (a profiling
    // build) that a landing would otherwise replace. DURABLE: it survives a
    // daemon restart and a handover until released. (Added 2026-10-12.)
    UpdateMergeQueueHoldRollouts hold_rollouts = 5;
    // End the hold. Nothing is deployed retroactively: the next landing, or a
    // deploy by hand, rolls out everything that landed meanwhile.
    UpdateMergeQueueReleaseRollouts release_rollouts = 6;
    // Move ONE workspace's waiting merge one place UP its queue, swapping it
    // with the waiting merge directly ahead of it.
    UpdateMergeQueueMoveUp move_up = 7;
    // Move ONE workspace's waiting merge one place DOWN its queue, swapping it
    // with the waiting merge directly behind it.
    UpdateMergeQueueMoveDown move_down = 8;
    // DISABLE THE RACE, daemon-wide: every queue works its head alone, as on
    // battery, whatever the host's power source. On AC power a queue otherwise
    // works its top two merges, which race to land and take turns at the
    // tests; a merge racing behind its head is suspended at the step it
    // stands on and resumes there once it heads its queue. DURABLE: it
    // survives a daemon restart and a handover until enabled. (Added
    // 2026-10-14.)
    UpdateMergeQueueDisableRacing disable_racing = 9;
    // Enable the race again: on AC power the merge behind each head starts
    // racing it at once.
    UpdateMergeQueueEnableRacing enable_racing = 10;
    // SUBSCRIBE one workspace's agent to a merge queue's changes, at a level
    // of detail; replaces the detail of the subscription it already holds in
    // the same scope.
    UpdateMergeQueueSubscribe subscribe = 11;
    // End one workspace's subscription in one scope.
    UpdateMergeQueueUnsubscribe unsubscribe = 12;
  }
  // The retired move-to-front action (2026-10-12): one-place moves replaced it.
  reserved 4;
  reserved "front";
}
message UpdateMergeQueuePause {
  // WHICH repository's queue. UNSET = every repository that has a queue
  // (the daemon-wide switch). The queue is per repository, so a caller that
  // means one names it (added 2026-08-29; the request carried no scope).
  optional workspace.v1.RepositoryRef repository = 1;
}
message UpdateMergeQueueResume {
  // WHICH repository's queue. UNSET = every repository that has a queue
  // (the daemon-wide switch). The queue is per repository, so a caller that
  // means one names it (added 2026-08-29; the request carried no scope).
  optional workspace.v1.RepositoryRef repository = 1;
}
message UpdateMergeQueueEvict {
  // Whose merge to evict.
  workspace.v1.WorkspaceRef workspace = 1;
}
// Daemon-wide: one hold covers every repository's queue, since the deploy it
// stops is the daemon's own.
message UpdateMergeQueueHoldRollouts {}
message UpdateMergeQueueReleaseRollouts {}
// Daemon-wide: one switch covers every repository's queue, since the window
// it narrows is the gate governor's, which every queue shares.
message UpdateMergeQueueDisableRacing {}
message UpdateMergeQueueEnableRacing {}
// A ONE-PLACE MOVE passes exactly one WAITING merge: never the merge running,
// and never a merge only requested (in nobody's line yet). The moved merge
// takes the passed merge's front mark, so every merge put at the front still
// stands ahead of every ordinary merge waiting. A merge with no waiting merge
// on that side of it, or a merge not waiting (running, or only requested), is
// answered with success and left where it is. A workspace with no merge on
// any queue is `no_such_queued_merge`.
message UpdateMergeQueueMoveUp {
  // Whose merge to move one place toward the front.
  workspace.v1.WorkspaceRef workspace = 1;
}
// One place toward the back; see UpdateMergeQueueMoveUp.
message UpdateMergeQueueMoveDown {
  // Whose merge to move one place toward the back.
  workspace.v1.WorkspaceRef workspace = 1;
}

// ---- Subscriptions: telling a workspace's agent how a queue changes ----

// A SUBSCRIPTION tells ONE workspace's agent about a merge queue's changes as
// they happen, so an agent can wait on the queue (land after the queue
// drains, report a landing to the user) without polling it.
//
// DELIVERY: each notice is submitted to the subscriber's session as a
// deferred prompt of origin
// conversation.v1.PromptOrigin.PROMPT_ORIGIN_MERGE_QUEUE_NOTICE, the same
// path an async merge's handback takes: it waits behind a running turn, wakes
// an idle agent, and the feed draws no row for it. Every notice names the
// changes it reports and carries the queue AS IT STANDS AFTER THEM: every
// merge in line, front first, each with its workspace's name, its branch, its
// mode (one-shot, async or in place), whether it has started and the step it
// is on, and whether the queue is paused. A merge only requested (its asking
// turn still running) is not in line and is never a member.
//
// SCOPE: a workspace holds AT MOST ONE subscription per scope -- one
// repository's queue, or every repository's -- and subscribing again in a
// scope it holds replaces that subscription's detail. A scoped and an
// unscoped subscription may stand together; a change both admit is delivered
// once, as one notice.
//
// LIFETIME: a subscription ends when its workspace unsubscribes in its scope,
// and when the workspace closes, however it closes (closed, killed, nuked, or
// closed by its own landing); re-opening the workspace does not restore it.
// It is DURABLE across a daemon restart and a handover: a landing's own deploy
// restarts the daemon, so a subscription that a restart dropped would end at
// the very change it exists to report. A change made while no daemon serves
// is never reported; the next notice's snapshot carries its effect.
message UpdateMergeQueueSubscribe {
  // The workspace whose agent receives the notices: the caller's own
  // workspace when an agent subscribes itself.
  workspace.v1.WorkspaceRef subscriber = 1;
  // WHICH repository's queue. UNSET = every repository's queue, including a
  // repository whose queue is empty or does not exist yet.
  optional workspace.v1.RepositoryRef repository = 2;
  // Which changes the subscriber is told about.
  UpdateMergeQueueSubscribeDetail detail = 3;
}
// How much of a queue's change a subscription reports.
message UpdateMergeQueueSubscribeDetail {
  // THE ARM IS THE LEVEL. The levels nest -- every depletion is an advance,
  // and every advance is a change -- so a subscriber picks the coarsest one
  // that still wakes it for what it waits on.
  oneof level {
    // Every change of the queue.
    UpdateMergeQueueSubscribeEveryChange every_change = 1;
    // Only a merge leaving the queue.
    UpdateMergeQueueSubscribeAdvances advances = 2;
    // Only the queue running out of merges.
    UpdateMergeQueueSubscribeDepletes depletes = 3;
  }
}
// EVERY CHANGE: a merge put in line, started, moved to a new step, landed,
// failed, or taken off the queue (evicted, dequeued, or abandoned under its
// closing workspace or a restart); the queue's order changed by a move; and
// the queue paused or resumed. Several changes made at once arrive as one
// notice per change, each carrying the queue as it stood after its own.
message UpdateMergeQueueSubscribeEveryChange {}
// ADVANCES: a merge leaves the queue -- landed, failed, or taken off it. A
// merge's start, its steps, a reorder and a pause are not reported.
message UpdateMergeQueueSubscribeAdvances {}
// DEPLETES: a merge leaves the queue and no merge is left in line, reported
// once per emptying. A queue that empties by a removal of a merge never put
// in line is not reported, since nothing left the line.
message UpdateMergeQueueSubscribeDepletes {}
// Ends one subscription. A workspace with no subscription in that scope is
// `not_subscribed`. An unscoped unsubscribe ends ONLY the unscoped
// subscription, never the workspace's repository-scoped ones, so each scope
// is ended exactly as it was begun.
message UpdateMergeQueueUnsubscribe {
  // The workspace whose subscription ends.
  workspace.v1.WorkspaceRef subscriber = 1;
  // The scope of the subscription that ends: UNSET is the every-repository
  // subscription, set is the named repository's.
  optional workspace.v1.RepositoryRef repository = 2;
}

// THE ARM IS THE OUTCOME.
message UpdateMergeQueueResponse {
  oneof result {
    UpdateMergeQueueSuccess success = 1;
    UpdateMergeQueueError error = 2;
  }
}
// Done; the bubbles and roster reflect it.
message UpdateMergeQueueSuccess {}
// Arms derived from the daemon's refusal sites (landing 4, 2026-08-29).
// Validation failures (unset field, UNSPECIFIED enum, blank string) are Connect InvalidArgument, never an arm.
message UpdateMergeQueueError {
  oneof cause {
    // The workspace id is not in the daemon's registry.
    UpdateMergeQueueUnknownWorkspace unknown_workspace = 1;
    // The echoed dir disagrees with the registry's dir for this id.
    UpdateMergeQueueWorkspaceRefMismatch workspace_ref_mismatch = 2;
    // This daemon released the workspace to a successor; dial `address`.
    UpdateMergeQueueTransferringAway transferring_away = 3;
    // A joining daemon has not finished adopting this workspace yet.
    UpdateMergeQueueNotYetAdopted not_yet_adopted = 4;
    // The queue is already paused.
    UpdateMergeQueueAlreadyPaused already_paused = 5;
    // The queue is not paused.
    UpdateMergeQueueNotPaused not_paused = 6;
    // No queued merge for that workspace.
    UpdateMergeQueueNoSuchQueuedMerge no_such_queued_merge = 7;
    // `repository` named a RepositoryRef the daemon's registry does not hold
    // (pause/resume are per-repository when the ref is set). Empty: the
    // echoed ref is the only identity involved. (Landing 6, 2026-09-01.)
    UpdateMergeQueueUnknownRepository unknown_repository = 8;
    // `hold_rollouts` while the rollouts are already held. (2026-10-12.)
    UpdateMergeQueueRolloutsAlreadyHeld rollouts_already_held = 9;
    // `release_rollouts` while the rollouts are not held. (2026-10-12.)
    UpdateMergeQueueRolloutsNotHeld rollouts_not_held = 10;
    // `disable_racing` while racing is already disabled. (2026-10-14.)
    UpdateMergeQueueRacingAlreadyDisabled racing_already_disabled = 11;
    // `enable_racing` while racing is not disabled. (2026-10-14.)
    UpdateMergeQueueRacingNotDisabled racing_not_disabled = 12;
    // `unsubscribe` naming a workspace and scope with no subscription.
    UpdateMergeQueueNotSubscribed not_subscribed = 13;
  }
}
message UpdateMergeQueueUnknownWorkspace {}
message UpdateMergeQueueWorkspaceRefMismatch {
  // The dir the registry holds for this id.
  string registry_dir = 1;
}
message UpdateMergeQueueTransferringAway {
  // The successor's `127.0.0.1:<port>`, so a lagging client dials it.
  string address = 1;
}
message UpdateMergeQueueNotYetAdopted {}
message UpdateMergeQueueAlreadyPaused {}
message UpdateMergeQueueNotPaused {}
message UpdateMergeQueueNoSuchQueuedMerge {}
// The unknown-repository refusal. Empty on purpose (see the arm).
message UpdateMergeQueueUnknownRepository {}
message UpdateMergeQueueRolloutsAlreadyHeld {}
message UpdateMergeQueueRolloutsNotHeld {}
message UpdateMergeQueueRacingAlreadyDisabled {}
message UpdateMergeQueueRacingNotDisabled {}
// The not-subscribed refusal: the subscriber holds no subscription in the
// scope the unsubscribe named (and may hold one in another scope).
message UpdateMergeQueueNotSubscribed {}
