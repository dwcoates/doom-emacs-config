// endpoint_update_merge_queue.proto — UpdateMergeQueue: operator control of
// the daemon's merge queue. DAEMON ADMIN section. Purely inbound; the
// queue's visible state rides the merge bubbles' queue tabs and the roster's
// status arms; an agent reads it with GetMergeQueueStatus and follows it with
// SubscribeMergeQueue.

syntax = "proto3";

package agentrepl.v1;

import "agentrepl/v1/workspace_topology.proto";
import "workspace/v1/workspace.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

message UpdateMergeQueueRequest {
  // THE ARM IS THE ACTION.
  oneof action {
    // Stop admitting merges to the front; queued merges hold in place, and a
    // merge running is suspended at the step it stands on. With `hard`, the
    // work those merges are doing is stopped too.
    UpdateMergeQueuePause pause = 1;
    // Resume admitting.
    UpdateMergeQueueResume resume = 2;
    // Take ONE workspace's merge off the queue.
    UpdateMergeQueueEvict evict = 3;
    // Move ONE workspace's waiting merge one place UP its queue, swapping it
    // with the waiting merge directly ahead of it.
    UpdateMergeQueueMoveUp move_up = 7;
    // Move ONE workspace's waiting merge one place DOWN its queue, swapping it
    // with the waiting merge directly behind it.
    UpdateMergeQueueMoveDown move_down = 8;
    // Move ONE workspace's waiting merge to a place in its queue directly
    // ahead of or behind another waiting merge on the same queue: the
    // sidebar's drag of a waiting merge. (Added 2026-10-27.)
    UpdateMergeQueueMoveTo move_to = 14;
    // The deploy intake's decision on the deploy its chain owes a check of
    // (repoconfig.v1.LifecycleConfig.deploy_checks). Only the chain's intake
    // may decide, and only while a check is owed. (Added 2026-11-13.)
    UpdateMergeQueueMediation mediation = 15;
    // Release the hold a repository's escalation puts on its queue: the
    // user's own gesture on the standing escalation workspace's row, or
    // `agent-repld`'s command line. The escalation workspace stays open, and
    // the check it held is released. (Added 2026-11-17.)
    UpdateMergeQueueReleaseEscalation release_escalation = 16;
    // A merge's own agent gives its merge up from a repair turn the queue
    // gave it -- a conflict resolution or a fixing attempt -- when it cannot
    // finish the repair: the merge leaves the queue at once, as an eviction
    // does (agentrepl.v1.MergeQueueStatusOffQueueCause.gave_up), and no test
    // run starts on its account. The ONE way an agent ends its own merge: a
    // repair is never left broken on purpose to fail it (owner ruling,
    // 2026-11-17). The requester must be the workspace whose merge it is.
    // (Added 2026-11-17.)
    UpdateMergeQueueGiveUp give_up = 17;
    // The deploy mediator records, or withdraws, a kind of log record the
    // deploy checks leave out: a fault of something outside agent-repl that
    // passes on its own, or a one-off the user's own action causes. The
    // daemon drops every record that matches one before it judges whether a
    // deploy's window holds anything, and before it writes the window's
    // digest, so a window holding only such records runs no mediator. Only a
    // repository's deploy mediator may change them. (Added 2026-11-19.)
    UpdateMergeQueueIgnoredRecords ignored_records = 18;
  }
  // WHO ASKED. REQUIRED: the user (the editor, the webapp) or a workspace's
  // agent (`agent-repld`'s command line). Every action on a queue is recorded
  // with it, so a merge that leaves the queue is never unaccounted for: an
  // eviction recorded only as "the operator" could not be told from a loss
  // (2026-10-24). (Added 2026-10-24.)
  WorkspaceRequester requester = 13;
  // The retired move-to-front action (2026-10-12): one-place moves replaced it.
  reserved 4;
  reserved "front";
  // Tags 5-6 are RETIRED: holding a repository's deploy stage is
  // UpdateDeployHold. Tags 11-12 are RETIRED: subscriptions
  // are SubscribeMergeQueue and UnsubscribeMergeQueue. Tags 9-10 are RETIRED:
  // the queue races no more (owner ruling, 2026-11-11), so it has no racing
  // switch to disable or enable.
  reserved 5, 6, 9, 10, 11, 12;
  reserved "hold_rollouts", "release_rollouts", "subscribe", "unsubscribe", "disable_racing", "enable_racing";
}
// One change to the log records the deploy checks leave out.
message UpdateMergeQueueIgnoredRecords {
  // THE ARM IS THE CHANGE.
  oneof change {
    // Leave a kind of record out from now on.
    UpdateMergeQueueIgnoredRecordsAdd add = 1;
    // Stop leaving a kind of record out.
    UpdateMergeQueueIgnoredRecordsRemove remove = 2;
  }
}
// Leave every record of one kind out of the deploy checks.
message UpdateMergeQueueIgnoredRecordsAdd {
  // REQUIRED. Which records.
  IgnoredRecordKind kind = 1;
  // REQUIRED, never blank. Why a record of this kind is no problem a deploy
  // caused, in a sentence. Recorded with the kind and shown in each digest.
  string why = 2;
}
// Stop leaving every record of one kind out. Withdrawing a kind that was
// never recorded is the state the caller asked for, and is no refusal.
message UpdateMergeQueueIgnoredRecordsRemove {
  // REQUIRED. Which records, exactly as they were recorded.
  IgnoredRecordKind kind = 1;
}
// A kind of log record: every record one operation logs, or only those of
// its records whose message holds a given text.
message IgnoredRecordKind {
  // REQUIRED, never blank. The record's `operation`, exactly.
  string operation = 1;
  // Text the record's `message` must hold for the record to match. UNSET
  // matches every record of the operation. An operation that logs both a
  // fault of its own and one that passes names the passing one here, so its
  // real faults still reach the mediator.
  optional string message_contains = 2;
}

message UpdateMergeQueuePause {
  // WHICH repository's queue. UNSET = every repository that has a queue
  // (the daemon-wide switch). The queue is per repository, so a caller that
  // means one names it (added 2026-08-29; the request carried no scope).
  optional workspace.v1.RepositoryRef repository = 1;
  // A HARD STOP. The queue is paused as an ordinary pause pauses it, and the
  // work its merges are doing NOW is stopped as well: a pause suspends a
  // merge's own steps (its git, its test gate's run) but leaves the agent
  // turn a step drives running in its session -- a fixing attempt's own test
  // runs went on for minutes after a pause (2026-10-26). A hard stop
  // interrupts the turn of every merge suspended at a fixing attempt or a
  // conflict resolution, and of every waiting merge's background rebase. The
  // turn of any other step (a pick, a deploy-stage prompt) is left to finish.
  // On resume each merge goes on at the step it recorded, and a turn the
  // hard stop interrupted is prompted again without spending an attempt.
  // A hard stop of a queue already paused is not refused as already_paused:
  // it stops the work the earlier pause left running. (Added 2026-10-26.)
  bool hard = 2;
  // TRUE for a pause made TO LAND A CHANGE: the queue bypass holder pausing
  // the queue while it lands directly. Only such a pause is let through by
  // the holder's end-of-turn resume. A pause without it -- one the owner
  // asked for, to save power or to look at the queue -- stands until it is
  // resumed explicitly, whoever made it (2026-11-14: the let-through resumed
  // a pause the owner had asked for, and the queue ran overnight). (Added
  // 2026-11-15.)
  bool to_land = 3;
}
// The release of an escalation's hold.
message UpdateMergeQueueReleaseEscalation {
  // REQUIRED. The repository whose queue the escalation holds.
  workspace.v1.RepositoryRef repository = 1;
}
message UpdateMergeQueueGiveUp {
  // REQUIRED. Whose merge: the workspace the repair turn runs in, which is
  // also the requester.
  workspace.v1.WorkspaceRef workspace = 1;
  // REQUIRED, never blank. Why the repair cannot be finished, in a sentence
  // or two, for the user who takes the work back.
  string reason = 2;
}
message UpdateMergeQueueResume {
  // WHICH repository's queue. UNSET = every repository that has a queue
  // (the daemon-wide switch). The queue is per repository, so a caller that
  // means one names it (added 2026-08-29; the request carried no scope).
  optional workspace.v1.RepositoryRef repository = 1;
}
message UpdateMergeQueueEvict {
  // Whose merge to evict.
  workspace.v1.WorkspaceRef workspace = 1;
}
// Daemon-wide: one switch covers every repository's queue, since the window
// it narrows is the gate governor's, which every queue shares.
message UpdateMergeQueueDisableRacing {}
message UpdateMergeQueueEnableRacing {}
// A ONE-PLACE MOVE passes exactly one WAITING merge: never the merge running,
// and never a merge only requested (in nobody's line yet). The moved merge
// takes the passed merge's front mark, so every merge put at the front still
// stands ahead of every ordinary merge waiting. A merge with no waiting merge
// on that side of it, or a merge not waiting (running, or only requested), is
// answered with success and left where it is. A workspace with no merge on
// any queue is `no_such_queued_merge`.
message UpdateMergeQueueMoveUp {
  // Whose merge to move one place toward the front.
  workspace.v1.WorkspaceRef workspace = 1;
}
// One place toward the back; see UpdateMergeQueueMoveUp.
message UpdateMergeQueueMoveDown {
  // Whose merge to move one place toward the back.
  workspace.v1.WorkspaceRef workspace = 1;
}
// A MOVE TO A PLACE passes only WAITING merges, as a one-place move does: the
// merge running and a merge only requested are never passed, and never the
// anchor. The moved merge takes the ANCHOR's front mark, so every merge put
// at the front still stands ahead of every ordinary merge waiting: directly
// ahead of a front merge or behind one is a front place, and directly ahead
// of or behind an ordinary merge an ordinary one. A merge already standing
// in that place is answered with success and left where it is. A moved
// merge or an anchor that is no waiting merge, or two merges on different
// queues, is `no_such_queued_merge`.
message UpdateMergeQueueMoveTo {
  // Whose merge to move.
  workspace.v1.WorkspaceRef workspace = 1;
  // WHERE IT GOES. THE ARM IS THE SIDE OF THE ANCHOR. Never unset.
  oneof place {
    // Directly ahead of this workspace's waiting merge.
    workspace.v1.WorkspaceRef ahead_of = 2;
    // Directly behind this workspace's waiting merge.
    workspace.v1.WorkspaceRef behind = 3;
  }
}

// A deploy intake's decision on the deploy its chain owes a check of. The
// intake judges only what THIS deploy caused: a problem the deploy did not
// cause never holds the queue, and the intake files it elsewhere (a one-shot
// through the queue, or a todo row) before deciding on what remains.
message UpdateMergeQueueMediation {
  // REQUIRED. What it decided; the arm IS the decision.
  oneof decision {
    // Nothing this deploy caused is wrong. The hold is released, the queue
    // advances, and the chain ends.
    UpdateMergeQueueMediationApprove approve = 1;
    // The deploy is put before the user: something is wrong that should be
    // the user's to settle. The hold is released, the user is notified, and
    // the chain ends.
    UpdateMergeQueueMediationEscalate escalate = 2;
    // Problems this deploy caused, handed to a remediation workspace to fix.
    // The hold stays, owned by that workspace until its fix's deploy is
    // checked in turn.
    UpdateMergeQueueMediationDispatch dispatch = 4;
  }
  // REQUIRED, never blank. What it found, in a sentence or two: an
  // escalation's banner reads it, and every decision is recorded with it.
  string summary = 3;
}
// The approval. The summary says what was checked.
message UpdateMergeQueueMediationApprove {
  // The groups the mediator judged ignorable and approves past, each quoting
  // at least one of its records: a one-off user-driven error, or a record of
  // the mediator's probably-transient table. They do not count against the
  // approval and are not taken on, so a group that keeps coming back is put
  // to the mediator again. EMPTY when the window holds only groups taken on.
  repeated DeployProblem ignored = 1;
}
// The escalation. The intake never talks to the user itself (owner ruling,
// 2026-11-15): the daemon makes a visible escalation workspace whose prompt
// is the summary and these findings with their evidence, and a desktop
// notification whose click opens it.
message UpdateMergeQueueMediationEscalate {
  // The problems the intake found, most serious first, each with its
  // verbatim evidence. Empty for an escalation that rests on the summary
  // alone (the chain's bound reached with nothing new to state).
  repeated DeployProblem problems = 1;
}
// A dispatch: what to fix. The repository's one standing remediation
// workspace takes it (owner ruling, 2026-11-17). The intake states problems
// and their evidence only; it never researches a cause or prescribes a fix,
// which is the remediation workspace's work.
message UpdateMergeQueueMediationDispatch {
  // Tags 2-3 are RETIRED with the choice between restoring the chain's last
  // remediation workspace and making a fresh one (2026-11-17): a repository
  // has one standing remediation workspace, which takes every dispatch.
  reserved 2, 3;
  reserved "restore", "fresh";
  // REQUIRED, at least one. Each problem this deploy caused, in the order
  // the intake judged them most serious first.
  repeated DeployProblem problems = 1;
}

// One problem a deploy caused, as the intake states it to the remediation
// workspace.
message DeployProblem {
  // REQUIRED, never blank. What is wrong, in a sentence: the symptom as the
  // evidence shows it, never a guess at its cause or its fix.
  string statement = 1;
  // REQUIRED, at least one. The records that show the problem, each quoted
  // verbatim as the log, the doctor or the metrics store printed it, so the
  // remediation workspace starts from the evidence rather than from the
  // intake's reading of it.
  repeated string evidence = 2;
}

message UpdateMergeQueueResponse {
  oneof result {
    UpdateMergeQueueSuccess success = 1;
    UpdateMergeQueueError error = 2;
  }
}
// Done; the bubbles and roster reflect it.
message UpdateMergeQueueSuccess {}
// Arms derived from the daemon's refusal sites (landing 4, 2026-08-29).
// Validation failures (unset field, UNSPECIFIED enum, blank string) are Connect InvalidArgument, never an arm.
message UpdateMergeQueueError {
  // Tags 9-10 and 13-14 are RETIRED with the rollout and subscription arms.
  // Tags 11-12 are RETIRED with the racing switch (2026-11-11).
  reserved 9, 10, 11, 12, 13, 14;
  reserved "rollouts_already_held", "rollouts_not_held", "not_subscribed", "subscriber_closed", "racing_already_disabled", "racing_not_disabled";
  // Tag 17 is RETIRED with the restore of the chain's last remediation
  // workspace (2026-11-17): the standing remediation takes every dispatch.
  reserved 17;
  reserved "no_remediation_to_restore";
  oneof cause {
    // The workspace id is not in the daemon's registry.
    UpdateMergeQueueUnknownWorkspace unknown_workspace = 1;
    // The echoed dir disagrees with the registry's dir for this id.
    UpdateMergeQueueWorkspaceRefMismatch workspace_ref_mismatch = 2;
    // This daemon released the workspace to a successor; dial `address`.
    UpdateMergeQueueTransferringAway transferring_away = 3;
    // A joining daemon has not finished adopting this workspace yet.
    UpdateMergeQueueNotYetAdopted not_yet_adopted = 4;
    // The queue is already paused.
    UpdateMergeQueueAlreadyPaused already_paused = 5;
    // The queue is not paused.
    UpdateMergeQueueNotPaused not_paused = 6;
    // No queued merge for that workspace.
    UpdateMergeQueueNoSuchQueuedMerge no_such_queued_merge = 7;
    // `repository` named a RepositoryRef the daemon's registry does not hold
    // (pause/resume are per-repository when the ref is set). Empty: the
    // echoed ref is the only identity involved. (Landing 6, 2026-09-01.)
    UpdateMergeQueueUnknownRepository unknown_repository = 8;
    // A mediation decision from a workspace that is not the intake of a
    // chain of its repository's deploys.
    UpdateMergeQueueNotMediator not_mediator = 15;
    // A mediation decision while the intake's repository owes no check.
    UpdateMergeQueueNoMediationOwed no_mediation_owed = 16;
    // DEPRECATED (2026-11-20): never answered. It refused a dispatch once the
    // chain had deployed as many remediations in a row as its repository
    // allowed. The deploy mediator alone now decides what it fixes, so no
    // dispatch is refused for what its deploy holds. The arm stays declared
    // so a client built before the change still decodes it.
    UpdateMergeQueueRemediationBoundReached remediation_bound_reached = 18;
    // DEPRECATED (2026-11-19): never answered. It refused an approval while
    // the check's window held a warning or error no one owned. The deploy
    // mediator alone now decides whether a deploy is approved, so no approval
    // is refused on what its window holds. The arm stays declared so a
    // client built before the change still decodes it.
    UpdateMergeQueueProblemsUnowned problems_unowned = 19;
    // DEPRECATED (2026-11-20): never answered. It refused a dispatch while
    // the check's window held a problem that came back after more than five
    // of its fixes deployed, whether or not the dispatch cited that problem.
    // The arm stays declared for the reason remediation_bound_reached does.
    UpdateMergeQueueProblemsRecurring problems_recurring = 20;
    // A release of an escalation's hold while no escalation holds the
    // repository's queue. (Added 2026-11-17.)
    UpdateMergeQueueNoEscalationHeld no_escalation_held = 21;
    // A give-up from a workspace running no repair turn of its merge (a
    // conflict resolution or a fixing attempt). (Added 2026-11-17.)
    UpdateMergeQueueNoRepairTurn no_repair_turn = 22;
  }
}
message UpdateMergeQueueUnknownWorkspace {}
message UpdateMergeQueueWorkspaceRefMismatch {
  // The dir the registry holds for this id.
  string registry_dir = 1;
}
message UpdateMergeQueueTransferringAway {
  // The successor's `127.0.0.1:<port>`, so a lagging client dials it.
  string address = 1;
}
message UpdateMergeQueueNotYetAdopted {
  // The `127.0.0.1:<port>` of the daemon that serves this workspace until the
  // joining daemon adopts it: the handover's incumbent. A client views and
  // acts on the workspace there in the meantime, and the incumbent's later
  // `transferred` push re-homes it. UNSET when no live daemon serves the
  // workspace (a takeover after the incumbent died), in which case the client
  // waits for the adoption.
  optional string address = 1;
}
message UpdateMergeQueueAlreadyPaused {}
message UpdateMergeQueueNotPaused {}
message UpdateMergeQueueNoSuchQueuedMerge {}
// The unknown-repository refusal. Empty on purpose (see the arm).
message UpdateMergeQueueUnknownRepository {}
// The not-the-intake refusal. No fields: the caller knows who it is.
message UpdateMergeQueueNotMediator {}
// The no-check-owed refusal. No fields.
message UpdateMergeQueueNoMediationOwed {}
// The no-escalation-held refusal. No fields: nothing holds the queue for the user.
message UpdateMergeQueueNoEscalationHeld {}
// The no-repair-turn refusal. No fields: the caller knows its own turn.
message UpdateMergeQueueNoRepairTurn {}
// The unowned-problems refusal. DEPRECATED (2026-11-19): never answered; see
// UpdateMergeQueueError.problems_unowned.
message UpdateMergeQueueProblemsUnowned {
  // Each unowned group, as "OPERATION: MESSAGE (CLASS)", in the window's
  // order.
  repeated string groups = 1;
}
// The recurring-problems refusal. DEPRECATED (2026-11-20): never answered;
// see UpdateMergeQueueError.problems_recurring.
message UpdateMergeQueueProblemsRecurring {
  // Each group that came back after more than five of its fixes deployed, as
  // "OPERATION: MESSAGE (FIXES fixes)", in the window's order.
  repeated string groups = 1;
}
// The bound refusal. DEPRECATED (2026-11-20): never answered; see
// UpdateMergeQueueError.remediation_bound_reached.
message UpdateMergeQueueRemediationBoundReached {
  // The repository's bound, which the chain had reached
  // (repoconfig.v1.DeployChecks.remediations_before_escalation).
  uint32 remediations_before_escalation = 1;
}
