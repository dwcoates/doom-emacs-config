// endpoint_update_merge_queue.proto — UpdateMergeQueue: operator control of
// the daemon's merge queue. DAEMON ADMIN section. Purely inbound; the
// queue's visible state rides the merge bubbles' queue tabs and the roster's
// status arms; an agent reads it with GetMergeQueueStatus and follows it with
// SubscribeMergeQueue.

syntax = "proto3";

package agentrepl.v1;

import "workspace/v1/workspace.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

message UpdateMergeQueueRequest {
  // THE ARM IS THE ACTION.
  oneof action {
    // Stop admitting merges to the front; queued merges hold in place.
    UpdateMergeQueuePause pause = 1;
    // Resume admitting.
    UpdateMergeQueueResume resume = 2;
    // Take ONE workspace's merge off the queue.
    UpdateMergeQueueEvict evict = 3;
    // Move ONE workspace's waiting merge one place UP its queue, swapping it
    // with the waiting merge directly ahead of it.
    UpdateMergeQueueMoveUp move_up = 7;
    // Move ONE workspace's waiting merge one place DOWN its queue, swapping it
    // with the waiting merge directly behind it.
    UpdateMergeQueueMoveDown move_down = 8;
    // DISABLE THE RACE, daemon-wide: every queue works its head alone, as on
    // battery, whatever the host's power source. On AC power a queue otherwise
    // works its top two merges, which race to land and take turns at the
    // tests; a merge racing behind its head is suspended at the step it
    // stands on and resumes there once it heads its queue. DURABLE: it
    // survives a daemon restart and a handover until enabled. (Added
    // 2026-10-14.)
    UpdateMergeQueueDisableRacing disable_racing = 9;
    // Enable the race again: on AC power the merge behind each head starts
    // racing it at once.
    UpdateMergeQueueEnableRacing enable_racing = 10;
  }
  // The retired move-to-front action (2026-10-12): one-place moves replaced it.
  reserved 4;
  reserved "front";
  // Tags 5-6 are RETIRED: holding rollouts controls the runtime's deploy,
  // not the queue (UpdateRollouts). Tags 11-12 are RETIRED: subscriptions
  // are SubscribeMergeQueue and UnsubscribeMergeQueue.
  reserved 5, 6, 11, 12;
  reserved "hold_rollouts", "release_rollouts", "subscribe", "unsubscribe";
}
message UpdateMergeQueuePause {
  // WHICH repository's queue. UNSET = every repository that has a queue
  // (the daemon-wide switch). The queue is per repository, so a caller that
  // means one names it (added 2026-08-29; the request carried no scope).
  optional workspace.v1.RepositoryRef repository = 1;
}
message UpdateMergeQueueResume {
  // WHICH repository's queue. UNSET = every repository that has a queue
  // (the daemon-wide switch). The queue is per repository, so a caller that
  // means one names it (added 2026-08-29; the request carried no scope).
  optional workspace.v1.RepositoryRef repository = 1;
}
message UpdateMergeQueueEvict {
  // Whose merge to evict.
  workspace.v1.WorkspaceRef workspace = 1;
}
// Daemon-wide: one switch covers every repository's queue, since the window
// it narrows is the gate governor's, which every queue shares.
message UpdateMergeQueueDisableRacing {}
message UpdateMergeQueueEnableRacing {}
// A ONE-PLACE MOVE passes exactly one WAITING merge: never the merge running,
// and never a merge only requested (in nobody's line yet). The moved merge
// takes the passed merge's front mark, so every merge put at the front still
// stands ahead of every ordinary merge waiting. A merge with no waiting merge
// on that side of it, or a merge not waiting (running, or only requested), is
// answered with success and left where it is. A workspace with no merge on
// any queue is `no_such_queued_merge`.
message UpdateMergeQueueMoveUp {
  // Whose merge to move one place toward the front.
  workspace.v1.WorkspaceRef workspace = 1;
}
// One place toward the back; see UpdateMergeQueueMoveUp.
message UpdateMergeQueueMoveDown {
  // Whose merge to move one place toward the back.
  workspace.v1.WorkspaceRef workspace = 1;
}

// THE ARM IS THE OUTCOME.
message UpdateMergeQueueResponse {
  oneof result {
    UpdateMergeQueueSuccess success = 1;
    UpdateMergeQueueError error = 2;
  }
}
// Done; the bubbles and roster reflect it.
message UpdateMergeQueueSuccess {}
// Arms derived from the daemon's refusal sites (landing 4, 2026-08-29).
// Validation failures (unset field, UNSPECIFIED enum, blank string) are Connect InvalidArgument, never an arm.
message UpdateMergeQueueError {
  // Tags 9-10 and 13-14 are RETIRED with the rollout and subscription arms.
  reserved 9, 10, 13, 14;
  reserved "rollouts_already_held", "rollouts_not_held", "not_subscribed", "subscriber_closed";
  oneof cause {
    // The workspace id is not in the daemon's registry.
    UpdateMergeQueueUnknownWorkspace unknown_workspace = 1;
    // The echoed dir disagrees with the registry's dir for this id.
    UpdateMergeQueueWorkspaceRefMismatch workspace_ref_mismatch = 2;
    // This daemon released the workspace to a successor; dial `address`.
    UpdateMergeQueueTransferringAway transferring_away = 3;
    // A joining daemon has not finished adopting this workspace yet.
    UpdateMergeQueueNotYetAdopted not_yet_adopted = 4;
    // The queue is already paused.
    UpdateMergeQueueAlreadyPaused already_paused = 5;
    // The queue is not paused.
    UpdateMergeQueueNotPaused not_paused = 6;
    // No queued merge for that workspace.
    UpdateMergeQueueNoSuchQueuedMerge no_such_queued_merge = 7;
    // `repository` named a RepositoryRef the daemon's registry does not hold
    // (pause/resume are per-repository when the ref is set). Empty: the
    // echoed ref is the only identity involved. (Landing 6, 2026-09-01.)
    UpdateMergeQueueUnknownRepository unknown_repository = 8;
    // `disable_racing` while racing is already disabled. (2026-10-14.)
    UpdateMergeQueueRacingAlreadyDisabled racing_already_disabled = 11;
    // `enable_racing` while racing is not disabled. (2026-10-14.)
    UpdateMergeQueueRacingNotDisabled racing_not_disabled = 12;
  }
}
message UpdateMergeQueueUnknownWorkspace {}
message UpdateMergeQueueWorkspaceRefMismatch {
  // The dir the registry holds for this id.
  string registry_dir = 1;
}
message UpdateMergeQueueTransferringAway {
  // The successor's `127.0.0.1:<port>`, so a lagging client dials it.
  string address = 1;
}
message UpdateMergeQueueNotYetAdopted {}
message UpdateMergeQueueAlreadyPaused {}
message UpdateMergeQueueNotPaused {}
message UpdateMergeQueueNoSuchQueuedMerge {}
// The unknown-repository refusal. Empty on purpose (see the arm).
message UpdateMergeQueueUnknownRepository {}
message UpdateMergeQueueRacingAlreadyDisabled {}
message UpdateMergeQueueRacingNotDisabled {}
