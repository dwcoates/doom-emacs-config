// endpoint_resync.proto — the Resync endpoint's request, success and error.
//
// ONE ENDPOINT PER FILE: ResyncRequest, ResyncResponse and the two answers it
// wraps, and nothing else, so the whole of what one method takes and returns is
// readable in one place. The `endpoint_` prefix is the grouping, not a directory
// — see DESIGN-protobuf-surfaces.md for why a directory is not available here,
// and for why a request type belongs to agentrepl.v1 rather than frontend.v1.

syntax = "proto3";

package agentrepl.v1;

import "agentrepl/v1/shared.proto";
import "frontend/v1/failure.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// A replay request carries ONE token of identity, not several.
//
// The client says where it had read up to and which fence it held when it
// decided to ask. It never copies, holds or agrees a session identity or a
// controller generation: several identities a client must send back in
// agreement is several ways for a client to send back a disagreement, and the
// fence already answers the only question they were ever asked together.
message ResyncRequest {
  // Correlation with the replay this call provokes. See
  // AcceptQueueEntryResponse.request_id.
  string request_id = 1;
  // WHICH WORKSPACE to replay. It was the command envelope's field before the
  // service existed; a method call has no envelope, so it is stated here.
  string workspace = 2;
  // WHICH SUBSCRIBE STREAM to replay onto. The replay is a push, and a unary
  // call no longer shares a socket with the stream that will carry it. See
  // SubscribeRequest.client_id.
  string client_id = 3;
  // The mark to replay from, inclusive.
  uint64 from_seq = 4;
  // The fence ECHO: the exact fence the client held when it decided to ask
  // for this replay, copied byte-for-byte from the WorkspaceState it was
  // reading at that moment.
  //
  // It must be captured AT DECISION TIME, not read from current state when
  // the transport sends, or a delayed request silently rebinds itself to a
  // newer generation and asks for a replay nobody wanted. The daemon compares
  // it against the workspace's live fence and REFUSES the command before
  // replaying anything when they differ.
  string fence = 5;
}

// Resync's answer: exactly one of a success and an error.
//
// TWO ARMS, NOT AN `ok` BIT PLUS AN OPTIONAL FAILURE — see
// AcceptQueueEntryResponse for the whole of that argument.
message ResyncResponse {
  // Echoed from the request that produced this answer. See
  // AcceptQueueEntryResponse.request_id.
  string request_id = 1;
  oneof response {
    ResyncSuccess success = 2;
    ResyncError error = 3;
  }
}

// The replay was accepted.
//
// NO ARMS, AND NO RECORDS. The replayed records themselves arrive on the
// caller's Subscribe stream, which is why the request names its client_id: feed
// content has exactly one delivery shape on this protocol, and it is not a
// unary response.
message ResyncSuccess {}

// Why the replay was refused.
//
// EVERY FAILURE OF THE REPLAY NACKS, and that is the rule this arm set encodes:
// a frontend cannot tell silence from an empty conversation, so a quiet skip
// here is what once left a webview showing a correct footer over an empty feed.
message ResyncError {
  oneof error {
    // The echoed fence is not one this daemon ever minted, so the identity the
    // client decided to ask against cannot be recovered. It classifies as a
    // superseded reconnect rather than as a dead workspace because that is the
    // more specific true statement: the view's replay would have come from a
    // generation it never saw. The arm's `remedy` is the reload to offer.
    FailureReconnectSuperseded reconnect_superseded = 1;
    // No resyncer is wired, so the conversation replay cannot be served at all.
    // A construction error, not a degraded mode: the command exists, so
    // something must answer it.
    RefusalDependencyUnwired resyncer_unwired = 2;
    // The mark counts in a store seq space the vendor session retired, so no
    // delta above it exists and the client must re-anchor from a tail page.
    FailureReplayMarkRetired replay_mark_retired = 3;
    // A history re-pull is already running, so a second one was refused.
    FailureHistoryRepullInFlight repull_in_flight = 4;
    // The replay could not be served for a reason with no more specific arm.
    RefusalReplayFailed replay_failed = 5;
    // The resync failed for a reason the daemon's classifier could not name.
    frontend.v1.FailureInternalUnclassified unclassified = 6;
  }
  // The feed card this refusal was filed under, when it produced one. See
  // AcceptQueueEntryError.failure_card.
  frontend.v1.FailureCardRef failure_card = 7;
}
