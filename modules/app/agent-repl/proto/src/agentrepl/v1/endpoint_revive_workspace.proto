// endpoint_revive_workspace.proto — ReviveWorkspace. SIDEBAR section.
// Wake a hibernated workspace: the daemon brings its session back up.

syntax = "proto3";

package agentrepl.v1;

import "agentrepl/v1/workspace.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

message ReviveWorkspaceRequest {
  WorkspaceRef workspace = 1;
}

// THE ARM IS THE OUTCOME.
message ReviveWorkspaceResponse {
  oneof result {
    ReviveWorkspaceSuccess success = 1;
    ReviveWorkspaceError error = 2;
  }
}

// Done; every visible effect arrives on the streams.
message ReviveWorkspaceSuccess {}

// EMPTY ON PURPOSE: refusal arms DERIVED at the wave, spelled per 3b.
message ReviveWorkspaceError {
}
