// endpoint_open_workspace.proto — OpenWorkspace. SIDEBAR section.
// Open a registered-but-closed workspace: the daemon brings its session up; the roster row moves accordingly.

syntax = "proto3";

package agentrepl.v1;

import "conversation/v1/session.proto";
import "workspace/v1/workspace.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

message OpenWorkspaceRequest {
  workspace.v1.WorkspaceRef workspace = 1;
  // A client-minted correlation id. OPTIONAL, and it changes nothing about
  // how this rpc answers: supplying one asks the daemon to also push the
  // open's stages onto WatchDaemon keyed on it
  // (workspace_mutation_progress.proto), so a client can report the wait
  // rather than only its outcome. An open with no op_id emits no stages.
  string op_id = 2;
}

// THE ARM IS THE OUTCOME.
message OpenWorkspaceResponse {
  oneof result {
    OpenWorkspaceSuccess success = 1;
    OpenWorkspaceError error = 2;
  }
}

// Done; every visible effect arrives on the streams.
message OpenWorkspaceSuccess {}

// Arms derived from the daemon's refusal sites (landing 4, 2026-08-29).
// Validation failures (unset field, UNSPECIFIED enum, blank string) are Connect InvalidArgument, never an arm.
message OpenWorkspaceError {
  oneof cause {
    // The workspace id is not in the daemon's registry.
    OpenWorkspaceUnknownWorkspace unknown_workspace = 1;
    // The echoed dir disagrees with the registry's dir for this id.
    OpenWorkspaceWorkspaceRefMismatch workspace_ref_mismatch = 2;
    // This daemon released the workspace to a successor; dial `address`.
    OpenWorkspaceTransferringAway transferring_away = 3;
    // A joining daemon has not finished adopting this workspace yet.
    OpenWorkspaceNotYetAdopted not_yet_adopted = 4;
    // The workspace's session has been deleted and cannot be reopened.
    OpenWorkspaceSessionDeleted session_deleted = 5;
    // The vendor transcript to resume from is nowhere on disk.
    OpenWorkspaceTranscriptMissing transcript_missing = 6;
    // Spawning the session's shim failed.
    OpenWorkspaceSpawnFailed spawn_failed = 7;
    // The shim came up but the VENDOR failed to start the session
    // (shim.v1 StartSessionFailure.vendor_start_failed relayed by name):
    // the SDK threw before its first message. Distinct from spawn_failed
    // (our process) and from transcript_missing (our record). `detail` is
    // the shim's account, for a human and for logs; never switched on.
    // (Landing 9, 2026-09-03, user-approved.)
    OpenWorkspaceVendorStartFailed vendor_start_failed = 8;
    // The session's shim came up but its own kernel-lock holder failed
    // (shim.v1 StartSessionFailure.lock_holder_unavailable relayed by name),
    // so it refused to start a session it could not prove it alone owns.
    // NOBODY ELSE OWNS THE CONVERSATION: this is a broken lock helper, and
    // `failure` says how it broke, not an ownership conflict.
    OpenWorkspaceLockHolderUnavailable lock_holder_unavailable = 9;
    // The workspace's directory is gone AND its branch no longer exists in
    // the repository, so there is nothing to restore its worktree from. A
    // directory that is gone while its branch survives is NOT refused: the
    // open checks the branch out at the recorded directory again
    // (WorkspaceOpenStage.restoring_worktree) and proceeds. A user picking a
    // row that cannot be restored is an ordinary answer, not a fault.
    OpenWorkspaceWorktreeUnrestorable worktree_unrestorable = 10;
  }
}
message OpenWorkspaceWorktreeUnrestorable {
  // The recorded directory, which is gone.
  string dir = 1;
  // The recorded branch, which no longer exists. EMPTY when the registry
  // recorded none for the workspace.
  string branch = 2;
  // The daemon's sentence saying both, for a human and for logs; never
  // switched on.
  string detail = 3;
}
message OpenWorkspaceLockHolderUnavailable {
  // Tags 1 and 2 (`binary`, `os_error`) are RETIRED: they could say only
  // that the holder would not spawn. `failure` says how it failed.
  reserved 1, 2;
  reserved "binary", "os_error";
  // Which holder failed, and how: the shim's account, relayed whole. Always
  // set.
  conversation.v1.LockHolderFailure failure = 3;
}
message OpenWorkspaceVendorStartFailed {
  string detail = 1;
}
message OpenWorkspaceUnknownWorkspace {}
message OpenWorkspaceWorkspaceRefMismatch {
  // The dir the registry holds for this id.
  string registry_dir = 1;
}
message OpenWorkspaceTransferringAway {
  // The successor's `127.0.0.1:<port>`, so a lagging client dials it.
  string address = 1;
}
message OpenWorkspaceNotYetAdopted {}
message OpenWorkspaceSessionDeleted {}
message OpenWorkspaceTranscriptMissing {
  // The vendor session whose transcript is missing.
  string vendor_session_id = 1;
  // Every path the daemon looked in.
  repeated string searched_paths = 2;
}
message OpenWorkspaceSpawnFailed {
  // The spawn's own account of the failure.
  string detail = 1;
}
