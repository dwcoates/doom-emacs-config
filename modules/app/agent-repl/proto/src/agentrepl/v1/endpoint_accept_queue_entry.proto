// endpoint_accept_queue_entry.proto — the AcceptQueueEntry endpoint's request
// and response.
//
// ONE ENDPOINT PER FILE: AcceptQueueEntryRequest and AcceptQueueEntryResponse
// and nothing else, so the whole of what one method takes and returns is
// readable in one place. The `endpoint_` prefix is the grouping, not a directory
// — see DESIGN-protobuf-surfaces.md for why a directory is not available here,
// and for why a request type belongs to agentrepl.v1 rather than frontend.v1.

syntax = "proto3";

package agentrepl.v1;

import "agentrepl/v1/frame.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// Confirm a HOLD entry. View state only: the entry is still delivered by the
// ordinary turn-end drain, on the same schedule it already had.
message AcceptQueueEntryRequest {
  // Correlation. See agentrepl.v1.AgentRepl.
  string request_id = 1;
  // The workspace whose queue holds the entry. See agentrepl.v1.AgentRepl.
  string workspace = 2;
  string entry_id = 3;
}

// AcceptQueueEntry's answer: accepted, or the classified account of the refusal.
//
// IT WRAPS CommandAck RATHER THAN BEING CommandAck. Returning the shared ack
// directly gave 33 methods one response type, so no method could gain an answer
// of its own without offering that answer to every other method as well. An
// accept changes view state only, and that state is pushed.
message AcceptQueueEntryResponse {
  // Whether the daemon accepted this call, and when it did not, the classified
  // failure a frontend renders as a card. See CommandAck.
  CommandAck ack = 1;
}
