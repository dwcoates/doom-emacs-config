// endpoint_accept_queue_entry.proto — the AcceptQueueEntry endpoint's request,
// success and error.
//
// ONE ENDPOINT PER FILE: AcceptQueueEntryRequest, AcceptQueueEntryResponse and
// the two answers it wraps, and nothing else, so the whole of what one method
// takes and returns is readable in one place. The `endpoint_` prefix is the
// grouping, not a directory — see DESIGN-protobuf-surfaces.md for why a
// directory is not available here, and for why a request type belongs to
// agentrepl.v1 rather than frontend.v1.

syntax = "proto3";

package agentrepl.v1;

import "agentrepl/v1/shared.proto";
import "frontend/v1/failure.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// Confirm a HOLD entry. View state only: the entry is still delivered by the
// ordinary turn-end drain, on the same schedule it already had.
message AcceptQueueEntryRequest {
  // Correlation. See agentrepl.v1.AgentRepl.
  string request_id = 1;
  // The workspace whose queue holds the entry. See agentrepl.v1.AgentRepl.
  string workspace = 2;
  // Which held entry is being confirmed. The queue is per-workspace, so an
  // entry id alone does not address one.
  string entry_id = 3;
}

// AcceptQueueEntry's answer: exactly one of a success and an error.
//
// TWO ARMS, NOT AN `ok` BIT PLUS AN OPTIONAL FAILURE. The shared CommandAck
// this replaces could represent "not ok with no failure", "ok with a failure",
// and "ok" carrying fields meaningless to 32 other methods. None of the three
// is representable here, and an error caused by this request travels in this
// response and nowhere else.
message AcceptQueueEntryResponse {
  // Echoed from the request that produced this answer. It is NOT made redundant
  // by the call/response pairing: a command's EFFECT arrives later on the
  // Subscribe stream, in a frame that carries this same id, so the client still
  // needs it to match an effect to the request that caused it.
  string request_id = 1;
  oneof response {
    AcceptQueueEntrySuccess success = 2;
    AcceptQueueEntryError error = 3;
  }
}

// The entry's hold is confirmed.
//
// NO ARMS, AND NO FIELDS. An accept changes view state only, and that state is
// pushed as the workspace's QueueView; being set is the whole of what this
// answer has to say.
message AcceptQueueEntrySuccess {}

// Why the accept was refused.
message AcceptQueueEntryError {
  oneof error {
    // This daemon has no prompt queue wired, so there is no hold to confirm.
    RefusalDependencyUnwired queue_unwired = 1;
    // No entry with this id is on the workspace's queue.
    RefusalQueueEntryUnknown entry_unknown = 2;
    // The queue refused for a reason the daemon's classifier could not name.
    frontend.v1.FailureInternalUnclassified unclassified = 3;
  }
  // The feed card this refusal was filed under, when it produced one, so the
  // client can offer to reveal it instead of restating the account inline.
  // Empty when the refusal produced no card.
  frontend.v1.FailureCardRef failure_card = 4;
}
