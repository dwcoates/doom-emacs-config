// endpoint_create_workspace.proto — CreateWorkspace: a new workspace in a
// repository. SIDEBAR section. THE DAEMON DOES THE CREATING — it derives or
// adopts the name (slug → branch → worktree dir), creates the branch and
// worktree, records the merge layout facts and every creation fact below in
// WSM, and registers the workspace; no host materialization round-trip
// exists. Callers learn the identity from the response; everything else
// (roster row, status) arrives on the roster stream.
//
// TWO CREATION FORMS, one request: the form arm IS the kind of create. A
// STANDARD create is the ordinary workspace; a ONE-SHOT is a
// fire-and-forget workspace whose whole sequence the daemon owns — naming,
// worktree, and prompt decoration. THERE IS NO FINISH CHOICE: what happens
// on completion is the REPOSITORY'S, stated once in its own completion
// directive, which the daemon appends to the commission and the agent
// carries out itself.

syntax = "proto3";

package agentrepl.v1;

import "agentrepl/v1/workspace_priority.proto";
import "conversation/v1/user.proto";
import "workspace/v1/workspace.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

message CreateWorkspaceRequest {
  // The repository to create in.
  workspace.v1.RepositoryRef repository = 1;

  // THE ARM IS THE CREATION FORM.
  oneof form {
    CreateWorkspaceStandard standard = 2;
    CreateWorkspaceOneShot one_shot = 3;
  }

  // The parent workspace, when this create is spawned FROM one. UNSET = a
  // TOP-LEVEL workspace: its merge target is the repo's MAIN worktree and
  // default branch. PRESENT = a child: its merge target is the PARENT's
  // worktree and branch, and the roster nests it under the parent. The
  // choice is recorded into the merge layout facts at creation.
  optional CreateWorkspaceParent parent = 4;

  // The session model at creation. UNSET = the daemon's default; presence,
  // never an empty-string sentinel.
  optional string model = 5;

  // The workspace's priority. UNSET = unprioritized. The roster resolver
  // orders by it; changeable later via SetWorkspacePriority.
  optional WorkspacePriority priority = 6;

  // Explicit consent to a session whose permission mode disables the
  // permission gate. A creation that would produce an ungated session is
  // REFUSED unless this is present — presence IS the consent.
  optional CreateWorkspaceUngatedConsent allow_ungated = 7;

  // A CLIENT-MINTED OPERATION ID that correlates this create to the staged
  // progress the daemon pushes for it. PRESENCE IS OPT-IN TO OPTION B: a
  // create that carries one is ACKED IMMEDIATELY (CreateWorkspaceAccepted)
  // and its slow work — naming, worktree, bring-up — runs in the background,
  // DETACHED FROM THIS REQUEST'S CONTEXT so a client deadline or cancellation
  // can never kill git mid-`worktree add`; every stage and the terminal
  // outcome then ride WatchDaemon's `mutation_progress` push, keyed on this
  // id (workspace_mutation_progress.proto). UNSET = the legacy synchronous
  // form: the rpc blocks until the work finishes and answers success/error
  // itself, with no progress pushed. The pre-detach refusals (validation, an
  // unknown repository) are answered synchronously on `error` in BOTH forms;
  // only the outcomes that can arrive after the ack — naming, worktree, spawn,
  // and success — ride progress.
  optional string op_id = 8;
}

// The ordinary workspace create.
message CreateWorkspaceStandard {
  // The initial prompt the new workspace's session starts with. UNSET = an
  // empty workspace; presence, never an empty UserSaid. Also the naming
  // input: the daemon derives the slug from it when no name is supplied.
  optional conversation.v1.UserSaid initial_prompt = 1;
  // The ref to branch from. UNSET = the repo's default branch resolution;
  // presence, not an empty-string sentinel.
  optional string base_ref = 2;
  // A user-supplied workspace name. UNSET = the daemon mints the name
  // (slug from the initial prompt when present).
  optional string name = 3;
  // Configured merge actions, recorded in WSM at creation and read back by
  // EVERY merge of this workspace on every ingress.
  optional CreateWorkspaceMergeActions merge_actions = 4;
}

// A one-shot: repo-pinned, off the repo's default branch, daemon-named —
// the caller supplies only the prompt (and the shared facts outside the
// form arm); the daemon owns decoration.
//
// THE CALLER CHOOSES NOTHING ABOUT COMPLETION (owner ruling, 2026-09-12). A
// repository states, in ONE plain-English file of its own policy directory,
// what is to be done when the work is done; the daemon concatenates that
// file to the commission and the AGENT carries it out. The daemon performs
// no finish action programmatically, so there is nothing here to select.
message CreateWorkspaceOneShot {
  // Tags 2-3 / `self_merge` / `open_pr` are RETIRED (owner ruling,
  // 2026-09-12): the finish oneof named a daemon-performed finish action —
  // a self-merge or a pull request — and there is no finish choice at all
  // any more. Completion is the repository's own directive, appended to the
  // commission and carried out by the agent.
  reserved 2, 3;
  reserved "self_merge", "open_pr";

  // The one-shot's commission. A one-shot IS its prompt — always set.
  conversation.v1.UserSaid prompt = 1;
}

// The spawning parent and, optionally, a conversation fork from it.
message CreateWorkspaceParent {
  // The parent workspace. The child's merge target is this workspace's
  // worktree and branch.
  workspace.v1.WorkspaceRef workspace = 1;
  // Fork the parent's conversation into the new workspace's session
  // (resume the parent's transcript in the new worktree). UNSET = the new
  // workspace starts a fresh conversation. Confined here by construction:
  // a fork without a parent is unrepresentable.
  optional CreateWorkspaceFork fork = 2;
}

// Presence is the fact: fork the parent's conversation.
message CreateWorkspaceFork {
}

// Presence is the fact: the caller consents to an ungated session.
message CreateWorkspaceUngatedConsent {
}

// The configured merge actions. Both run under the merge lease for EVERY
// merge of this workspace: before_ws_merge BEFORE the landing (its failure
// fails the run); postprocessing_prompt AFTER every commit lands (can
// never fail the run; its error rides the terminal status).
message CreateWorkspaceMergeActions {
  // The pre-merge prompt. UNSET = no configured pre-merge action.
  optional conversation.v1.UserSaid before_ws_merge = 1;
  // The post-merge prompt. UNSET = no configured post-merge action.
  optional conversation.v1.UserSaid postprocessing_prompt = 2;
}

// THE ARM IS THE OUTCOME.
message CreateWorkspaceResponse {
  oneof result {
    CreateWorkspaceSuccess success = 1;
    CreateWorkspaceError error = 2;
    // THE OPTION-B ACK. Answered — instead of `success`/`error` — precisely
    // when the request carried an `op_id`: the create was accepted and its
    // work is now running in the background, so this rpc returns at once and
    // the real outcome rides WatchDaemon's `mutation_progress`, keyed on the
    // same id. It carries nothing but the echoed id: the workspace has no
    // identity yet (naming has not run), so there is nothing else to hand back.
    CreateWorkspaceAccepted accepted = 3;
  }
}

// The option-B acknowledgement: the create was accepted and detached to the
// background. The minted workspace identity arrives later on the progress
// channel's terminal `succeeded` event, never here.
message CreateWorkspaceAccepted {
  // The op_id the request supplied, echoed back so the client can assert the
  // ack correlates to the create it issued.
  string op_id = 1;
}

// The created workspace's identity — the dir the daemon minted. Everything
// else arrives on the roster stream.
message CreateWorkspaceSuccess {
  workspace.v1.WorkspaceRef workspace = 1;
}

// Arms derived from the daemon's refusal sites (landing 4, 2026-08-29).
// Validation failures (unset field, UNSPECIFIED enum, blank string) are Connect InvalidArgument, never an arm.
message CreateWorkspaceError {
  // Tags 3-4 retired with the finish oneof (see the oneof comment).
  reserved 3, 4;
  reserved "finish_required", "finish_not_one_shot";
  oneof cause {
    // An ungated permission mode was asked for without the explicit consent.
    CreateWorkspaceUngatedWithoutConsent ungated_without_consent = 1;
    // No slug could be derived for the workspace's branch and dir.
    CreateWorkspaceNoSlug no_slug = 2;
    // Tags 3-4 / `finish_required` / `finish_not_one_shot` are RETIRED
    // (owner ruling, 2026-09-12): both refused a badly-placed finish
    // action, and a one-shot no longer carries one — completion is the
    // repository's own directive, so neither fault is representable.
    // A fork was asked for from a parent that has no conversation to fork.
    CreateWorkspaceForkParentHasNoConversation fork_parent_has_no_conversation = 5;
    // The named brief file is absent.
    CreateWorkspaceBriefMissing brief_missing = 6;
    // The repository the form names is not one the daemon knows.
    CreateWorkspaceUnknownRepository unknown_repository = 7;
    // The parent workspace is not in the daemon's registry.
    CreateWorkspaceUnknownParent unknown_parent = 8;
    // The base ref does not resolve in the repository.
    CreateWorkspaceBaseRefUnresolved base_ref_unresolved = 9;
    // Creating the worktree failed.
    CreateWorkspaceWorktreeCreationFailed worktree_creation_failed = 10;
    // Spawning the created workspace's shim failed.
    CreateWorkspaceSpawnFailed spawn_failed = 11;
    // A one-shot was asked for in a repository that states no one-shot
    // policy of its own.
    CreateWorkspaceOneShotPolicyMissing one_shot_policy_missing = 12;
    // The daemon could not mint a name for a create that supplied none.
    CreateWorkspaceNamingFailed naming_failed = 13;
    // The repository, or the worktree the create would register, lies inside
    // a temporary directory.
    CreateWorkspaceInsideTemporaryDirectory inside_temporary_directory = 14;
  }
}
message CreateWorkspaceUngatedWithoutConsent {}
message CreateWorkspaceNoSlug {}
message CreateWorkspaceForkParentHasNoConversation {}
message CreateWorkspaceBriefMissing {
  // The brief's name, as asked for.
  string name = 1;
}
message CreateWorkspaceUnknownRepository {}
// The directory lies inside a temporary directory (owner ruling,
// 2026-10-06): agent-repl does not register temporary folders. A temporary
// folder is scratch space the OS or a test run purges, so a roster row for
// it names a directory about to vanish.
message CreateWorkspaceInsideTemporaryDirectory {
  // The refused directory, canonical (symlinks resolved, on-disk case).
  string dir = 1;
  // The canonical temporary root `dir` lies inside: the process's own
  // temporary directory, `/tmp`, `/var/tmp` or `/var/folders`.
  string temporary_root = 2;
}
message CreateWorkspaceUnknownParent {}
message CreateWorkspaceBaseRefUnresolved {
  // The ref that did not resolve.
  string ref = 1;
}
message CreateWorkspaceWorktreeCreationFailed {
  // Git's own account of the failure.
  string detail = 1;
}

// The created workspace's bring-up could not start a shim. The SAME daemon
// refusal OpenWorkspaceError.spawn_failed carries, and deliberately the same
// shape: a create and an open raise it from one site, so the two rpcs may not
// spell it differently.
message CreateWorkspaceSpawnFailed {
  // The spawn's own account of the failure.
  string detail = 1;
}

// A ONE-SHOT RUNS THE REPOSITORY'S OWN POLICY, and this repository states
// none. A repository declares its one-shot and merge policy in
// `.agent-repl/prompts/` at its main checkout root; the daemon's own prompt
// corpus is the policy of exactly one repository — the one the daemon's
// checkout lives in — and is NEVER a fallback for any other. So a one-shot
// asked for in a repository missing any required policy brief is refused
// before anything is minted, rather than run under a policy its author
// never wrote.
message CreateWorkspaceOneShotPolicyMissing {
  // The repository's main checkout root, as the daemon resolved it.
  string repository_root = 1;
  // The policy directory that was read, i.e.
  // `<repository_root>/.agent-repl/prompts`.
  string policy_dir = 2;
  // The required policy files that directory does not hold, by file name.
  // Every one-shot requires the same set: the autonomous preamble and the
  // completion directive.
  repeated string missing_files = 3;
}

// EVERY DYNAMICALLY CREATED WORKSPACE IS NAMED BY THE MODEL. A create that
// supplies no name gets one from a headless call the daemon makes inside
// Create, constrained to at most three lowercase hyphenated words. There is
// no word-truncation fallback — a name nobody chose is not a name — so a
// naming call that cannot answer REFUSES the create, and the user retries or
// supplies a name.
message CreateWorkspaceNamingFailed {
  // The model the naming call asked.
  string model = 1;
  // What went wrong, read off the failure: `guard_refused`, `no_binary`,
  // `timeout`, `exit_status`, `unreadable_envelope` or `invalid_answer`.
  string cause = 2;
  // How many calls were made before giving up.
  uint32 attempts = 3;
  // The last answer the model gave, when there was one. Empty when the call
  // never answered.
  string answer = 4;
}
