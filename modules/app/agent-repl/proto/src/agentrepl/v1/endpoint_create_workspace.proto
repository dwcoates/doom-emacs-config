// endpoint_create_workspace.proto — the CreateWorkspace endpoint's request,
// success and error.
//
// ONE ENDPOINT PER FILE: CreateWorkspaceRequest, CreateWorkspaceResponse and
// the two answers it wraps, and nothing else, so the whole of what one method
// takes and returns is readable in one place. The `endpoint_` prefix is the
// grouping, not a directory — see DESIGN-protobuf-surfaces.md for why a
// directory is not available here, and for why a request type belongs to
// agentrepl.v1 rather than frontend.v1.

syntax = "proto3";

package agentrepl.v1;

import "agentrepl/v1/shared.proto";
import "frontend/v1/failure.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// Request one agent-repl workspace.  This is the sole creation ingress for
// both host UI requests (SPC TAB n/N) and skill-produced JSON dispatches.  The
// daemon owns name resolution, worktree creation, session startup, and initial
// prompt delivery; a request never asks for a promptless/no-shim workspace.
message CreateWorkspaceRequest {
  // Correlation. See agentrepl.v1.AgentRepl. THERE IS NO `workspace` FIELD:
  // this command creates one, and `source_workspace` below names the workspace
  // it was requested from, which is a different question.
  string request_id = 1;
  // What to call it. The daemon resolves the final name and may not grant this
  // one verbatim.
  string requested_name = 2;
  // The repository the worktree is cut from.
  string git_root = 3;
  // The commit the worktree starts at.
  string base_commit = 4;
  // The workspace the request was made FROM, for the daemon's own lineage
  // records. Not the workspace being created — that does not exist yet.
  string source_workspace = 5;
  // The directory the request was made from.
  string source_dir = 6;
  // The first prompt to run once the host has materialized the workspace.
  // Optional in the proto3 sense: an absent prompt and an empty one are
  // different requests, and only the second one runs a turn.
  optional string initial_prompt = 7;
  // Scheduling priority, as the creation manager understands it.
  string priority = 8;
  // The model the created session starts on, empty for the shim's default.
  string model = 9;
  // The workspace whose conversation this one forks from, empty for none.
  string fork_from = 10;
  // The specific session within that workspace to fork, empty for its current.
  string fork_session_id = 11;
  // A prompt to run after the workspace's work is done.
  string postprocessing_prompt = 12;
  // A command to run before this workspace's merge.
  string before_ws_merge = 13;
  // Explicit session account/safety posture. The daemon must not infer these
  // from its ambient process when a host asks it to create a workspace.
  string config_dir = 14;
  // The permission posture the created session runs under.
  string permission_mode = 15;
  // Consent to an ungated posture, on CreateSessionRequest.allow_ungated's
  // terms and for its reasons, including why it stays a bool.
  bool allow_ungated = 16;
}

// CreateWorkspace's answer: exactly one of a success and an error.
//
// TWO ARMS, NOT AN `ok` BIT PLUS AN OPTIONAL FAILURE — see
// AcceptQueueEntryResponse for the whole of that argument.
message CreateWorkspaceResponse {
  // Echoed from the request that produced this answer. See
  // AcceptQueueEntryResponse.request_id.
  string request_id = 1;
  oneof response {
    CreateWorkspaceSuccess success = 2;
    CreateWorkspaceError error = 3;
  }
}

// The creation job was accepted.
//
// NO ARMS, AND NO WORKSPACE. The workspace itself arrives later as a
// WorkspaceAvailable frame; this answer is a receipt that the job was accepted
// and nothing more.
//
// NOTHING IN THIS DAEMON PRODUCES IT TODAY, and that is stated here rather than
// left to be discovered: creation has exactly ONE ingestion point, a
// workspace_commands_<uuid>.json file in the daemon's inbox, so every call of
// this method currently takes the error arm's over_the_wire refusal. The
// success arm remains because the method describes the creation ingress this
// service means to offer, and deleting it would delete the description.
message CreateWorkspaceSuccess {}

// Why the creation was refused.
//
// ONE ARM, AND IT IS UNCONDITIONAL. A second wire path into creation would let
// a caller create a workspace the durable inbox never recorded, so the call is
// refused here rather than routed. Stated as a typed arm rather than as an
// error string because "this ingress is closed, write the command file" is
// advice a client can act on and prose is not.
message CreateWorkspaceError {
  oneof error {
    // Workspace creation is not accepted over the wire.
    RefusalCreateWorkspaceOverWire over_the_wire = 1;
    // The creation was refused for a reason the daemon's classifier could not
    // name.
    frontend.v1.FailureInternalUnclassified unclassified = 2;
  }
  // The feed card this refusal was filed under, when it produced one. See
  // AcceptQueueEntryError.failure_card.
  frontend.v1.FailureCardRef failure_card = 3;
}
