// endpoint_create_workspace.proto — the CreateWorkspace endpoint's request and
// response.
//
// ONE ENDPOINT PER FILE: CreateWorkspaceRequest and CreateWorkspaceResponse and
// nothing else, so the whole of what one method takes and returns is readable in
// one place. The `endpoint_` prefix is the grouping, not a directory — see
// DESIGN-protobuf-surfaces.md for why a directory is not available here, and for
// why a request type belongs to agentrepl.v1 rather than frontend.v1.

syntax = "proto3";

package agentrepl.v1;

import "agentrepl/v1/frame.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// Request one agent-repl workspace.  This is the sole creation ingress for
// both host UI requests (SPC TAB n/N) and skill-produced JSON dispatches.  The
// daemon owns name resolution, worktree creation, session startup, and initial
// prompt delivery; a request never asks for a promptless/no-shim workspace.
message CreateWorkspaceRequest {
  // Correlation. See AgentRepl in frame.proto. THERE IS NO `workspace` FIELD:
  // this command creates one, and `source_workspace` below names the workspace
  // it was requested from, which is a different question.
  string request_id = 1;
  string requested_name = 2;
  string git_root = 3;
  string base_commit = 4;
  string source_workspace = 5;
  string source_dir = 6;
  optional string initial_prompt = 7;
  string priority = 8;
  string model = 9;
  string fork_from = 10;
  string fork_session_id = 11;
  string postprocessing_prompt = 12;
  string before_ws_merge = 13;
  // Explicit session account/safety posture. The daemon must not infer these
  // from its ambient process when a host asks it to create a workspace.
  string config_dir = 14;
  string permission_mode = 15;
  bool allow_ungated = 16;
}

// CreateWorkspace's answer: accepted, or the classified account of the refusal.
//
// IT WRAPS CommandAck RATHER THAN BEING CommandAck. Returning the shared ack
// directly gave 33 methods one response type, so no method could gain an answer
// of its own without offering that answer to every other method as well. The
// workspace itself arrives later as a WorkspaceAvailable frame, so this answer
// is a receipt that the job was accepted and nothing more.
message CreateWorkspaceResponse {
  // Whether the daemon accepted this call, and when it did not, the classified
  // failure a frontend renders as a card. See CommandAck.
  CommandAck ack = 1;
}
