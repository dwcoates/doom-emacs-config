// endpoint_update_held_prompt.proto — UpdateHeldPrompt: the held card's actions on
// a held PROMPT. HELD SECTION. Doing nothing is the normal path —
// a held prompt delivers itself when its hold clears; these are the two ways
// to not wait.
//
// The prompt is identified by its TurnId — the TYPED ECHO TOKEN loop: the
// daemon minted it at submission (SubmitPromptSuccess.turn), served it inside
// the held section's HeldPrompt item, and the client hands it back unchanged.

syntax = "proto3";

package agentrepl.v1;

import "workspace/v1/workspace.proto";
import "conversation/v1/turn.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

message UpdateHeldPromptRequest {
  workspace.v1.WorkspaceRef workspace = 1;
  // WHICH held prompt — the daemon-minted turn it is held under, echoed from
  // the held item.
  conversation.v1.TurnId turn = 2;
  // THE ARM IS THE ACTION.
  oneof action {
    // Deliver NOW ("Send now") — override the hold and send the prompt to the
    // shim at once, as a prompt typed with nothing to hold it would be: while
    // a turn runs, the prompt joins it (taken in after its current tool call,
    // or run as the next turn), and nothing is interrupted. A running turn
    // that cannot be joined (one the agent started on its own, or one an ask
    // blocks) is INTERRUPTED instead, and its real end delivers the prompt, as
    // a held session act, which joins nothing, always is.
    //
    // A RELEASE THAT CANNOT GO YET IS ACCEPTED AND WAITS (success): the prompt
    // is marked sent now (frontend.v1.HeldPrompt.sent_now), its card says what
    // it waits for, and it goes the moment that clears, ahead of every other
    // held prompt but an interjection under way. Only the causes
    // UpdateHeldPromptReleaseRefused names refuse.
    UpdateHeldPromptRelease release = 3;
    // Discard it, never delivered (the composer takes the text back).
    UpdateHeldPromptDrop drop = 4;
  }
  // Tag 5 and the name `accept` are RETIRED: confirming a hold changed
  // nothing about delivery, so a held prompt answers only release and drop.
  reserved 5;
  reserved "accept";
}
message UpdateHeldPromptRelease {}
message UpdateHeldPromptDrop {}

// THE ARM IS THE OUTCOME.
message UpdateHeldPromptResponse {
  oneof result {
    UpdateHeldPromptSuccess success = 1;
    UpdateHeldPromptError error = 2;
  }
}

// Done; the held section's new state arrives on the root feed's watch.
message UpdateHeldPromptSuccess {}

// Arms derived from the daemon's refusal sites (landing 4, 2026-08-29).
// Validation failures (unset field, UNSPECIFIED enum, blank string) are Connect InvalidArgument, never an arm.
message UpdateHeldPromptError {
  oneof cause {
    // The workspace id is not in the daemon's registry.
    UpdateHeldPromptUnknownWorkspace unknown_workspace = 1;
    // The echoed dir disagrees with the registry's dir for this id.
    UpdateHeldPromptWorkspaceRefMismatch workspace_ref_mismatch = 2;
    // This daemon released the workspace to a successor; dial `address`.
    UpdateHeldPromptTransferringAway transferring_away = 3;
    // A joining daemon has not finished adopting this workspace yet.
    UpdateHeldPromptNotYetAdopted not_yet_adopted = 4;
    // No hold by that id.
    UpdateHeldPromptNoSuchHold no_such_hold = 5;
    // The hold was already delivered.
    UpdateHeldPromptAlreadyDelivered already_delivered = 6;
    // A release that would lose the user's work or answer a question only
    // the user can, refused with its cause. Every other blocker accepts the
    // release and waits (see `release`).
    UpdateHeldPromptReleaseRefused release_refused = 8;
    // BEING DELIVERED: the prompt's delivery call to the agent is in flight
    // right now, so it is neither held nor delivered yet. Refused rather than
    // raced. Once the call settles the prompt is either delivered, or (if the
    // call failed) back in the held section and open to this request again.
    UpdateHeldPromptBeingDelivered being_delivered = 9;
  }
  // Tag 7 and the name `accept_not_applicable` are RETIRED with the accept
  // action they refused.
  reserved 7;
  reserved "accept_not_applicable";
}
message UpdateHeldPromptUnknownWorkspace {}
message UpdateHeldPromptWorkspaceRefMismatch {
  // The dir the registry holds for this id.
  string registry_dir = 1;
}
message UpdateHeldPromptTransferringAway {
  // The successor's `127.0.0.1:<port>`, so a lagging client dials it.
  string address = 1;
}
message UpdateHeldPromptNotYetAdopted {
  // The `127.0.0.1:<port>` of the daemon that serves this workspace until the
  // joining daemon adopts it: the handover's incumbent. A client views and
  // acts on the workspace there in the meantime, and the incumbent's later
  // `transferred` push re-homes it. UNSET when no live daemon serves the
  // workspace (a takeover after the incumbent died), in which case the client
  // waits for the adoption.
  optional string address = 1;
}
message UpdateHeldPromptNoSuchHold {}
message UpdateHeldPromptAlreadyDelivered {}
// THE ARM IS THE CAUSE. ALWAYS SET: a refusal with no cause is a malformed
// frame, rejected rather than drawn as a generic refusal.
message UpdateHeldPromptReleaseRefused {
  oneof cause {
    // This prompt is open in the editor's input (EditHeldPrompt): sending it
    // would discard the edit under way. Committing or cancelling the edit
    // lets it be sent.
    UpdateHeldPromptReleaseRefusedBeingEdited being_edited = 1;
    // A prompt queued AHEAD of this one is open in the editor's input: an
    // edit keeps its prompt and every prompt after it in order, so this one
    // cannot overtake it. Ending the edit lets it be sent.
    UpdateHeldPromptReleaseRefusedBehindEdit behind_edit = 2;
    // The session is parked at its cold gate: sending would re-read the cold
    // conversation, the very spend the gate asks the user about. Answering
    // the gate decides it.
    UpdateHeldPromptReleaseRefusedColdGate cold_gate = 3;
    // The session refused the prompt into the running turn (the shim
    // answered the join with an error, or its turn could not be recorded).
    // The prompt stays held and goes when the running turn ends.
    UpdateHeldPromptReleaseRefusedSessionRefused session_refused = 4;
  }
}
message UpdateHeldPromptReleaseRefusedBeingEdited {}
message UpdateHeldPromptReleaseRefusedBehindEdit {}
message UpdateHeldPromptReleaseRefusedColdGate {}
message UpdateHeldPromptReleaseRefusedSessionRefused {}

// The prompt's delivery call is in flight. See the `being_delivered` arm.
message UpdateHeldPromptBeingDelivered {}
