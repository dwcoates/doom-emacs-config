// service.proto — THE agentrepl.v1 SERVICE: every verb a client can call, and
// every stream a component watches.
//
// DELIBERATELY EMPTY. The previous 34-method command surface and its 34
// endpoint_*.proto files were deleted outright to start from a clean slate:
// what stood here was so far from the figma→idl model being designed that it
// confused more than it informed. Every RPC is re-added one at a time, with its
// own endpoint_<snake_case_method>.proto, as it is agreed.

syntax = "proto3";

package agentrepl.v1;

import "agentrepl/v1/endpoint_submit_prompt.proto";
import "agentrepl/v1/endpoint_retry_vendor_error.proto";
import "agentrepl/v1/endpoint_select_feed_row.proto";
import "agentrepl/v1/endpoint_fold_merge_bubble.proto";
import "agentrepl/v1/endpoint_plan_rollback.proto";
import "agentrepl/v1/endpoint_list_rollback_prompts.proto";
import "agentrepl/v1/endpoint_roll_back.proto";
import "agentrepl/v1/endpoint_adjust_feed_text_scale.proto";
import "agentrepl/v1/endpoint_open_feed_image.proto";
import "agentrepl/v1/endpoint_close_feed_image.proto";
import "agentrepl/v1/endpoint_open_feed.proto";
import "agentrepl/v1/endpoint_watch_feed.proto";
import "agentrepl/v1/endpoint_get_feed_page.proto";
import "agentrepl/v1/endpoint_interrupt.proto";
import "agentrepl/v1/endpoint_inspect_chess_board_square.proto";
import "agentrepl/v1/endpoint_answer_permission.proto";
import "agentrepl/v1/endpoint_answer_question.proto";
import "agentrepl/v1/endpoint_update_question_draft.proto";
import "agentrepl/v1/endpoint_answer_cold_gate.proto";
import "agentrepl/v1/endpoint_watch_workspace_roster.proto";
import "agentrepl/v1/endpoint_create_workspace.proto";
import "agentrepl/v1/endpoint_register_repository.proto";
import "agentrepl/v1/endpoint_bind_workspace_session.proto";
import "agentrepl/v1/endpoint_list_workspace_transcripts.proto";
import "agentrepl/v1/endpoint_load_feed_through.proto";
import "agentrepl/v1/endpoint_open_workspace.proto";
import "agentrepl/v1/endpoint_close_workspace.proto";
import "agentrepl/v1/endpoint_kill_workspace.proto";
import "agentrepl/v1/endpoint_forget_workspace.proto";
import "agentrepl/v1/endpoint_nuke_workspace.proto";
import "agentrepl/v1/endpoint_finish_workspace.proto";
import "agentrepl/v1/endpoint_restart_workspace.proto";
import "agentrepl/v1/endpoint_watch_topbar.proto";
import "agentrepl/v1/endpoint_open_external.proto";
import "agentrepl/v1/endpoint_open_in_editor.proto";
import "agentrepl/v1/endpoint_send_login_input.proto";
import "agentrepl/v1/endpoint_request_command_support.proto";
import "agentrepl/v1/endpoint_create_task.proto";
import "agentrepl/v1/endpoint_update_task.proto";
import "agentrepl/v1/endpoint_assign_workspace_task.proto";
import "agentrepl/v1/endpoint_open_login.proto";
import "agentrepl/v1/endpoint_watch_login_terminal.proto";
import "agentrepl/v1/endpoint_close_login.proto";
import "agentrepl/v1/endpoint_set_model.proto";
import "agentrepl/v1/endpoint_set_effort.proto";
import "agentrepl/v1/endpoint_set_permission_mode.proto";
import "agentrepl/v1/endpoint_fold_repository.proto";
import "agentrepl/v1/endpoint_update_sidebar_view.proto";
import "agentrepl/v1/endpoint_arrange_sidebar.proto";
import "agentrepl/v1/endpoint_get_sidebar_arrangement.proto";
import "agentrepl/v1/endpoint_set_workspace_hidden.proto";
import "agentrepl/v1/endpoint_send_hidden_keepalives.proto";
import "agentrepl/v1/endpoint_set_workspace_parent.proto";
import "agentrepl/v1/endpoint_set_workspace_priority.proto";
import "agentrepl/v1/endpoint_move_workspace.proto";
import "agentrepl/v1/endpoint_swap_workspaces.proto";
import "agentrepl/v1/endpoint_watch_footer.proto";
import "agentrepl/v1/endpoint_update_held_prompt.proto";
import "agentrepl/v1/endpoint_edit_held_prompt.proto";
import "agentrepl/v1/endpoint_fold_held_prompt.proto";
import "agentrepl/v1/endpoint_update_classifier_prompt.proto";
import "agentrepl/v1/endpoint_answer_merge_queue_offer.proto";
import "agentrepl/v1/endpoint_deploy.proto";
import "agentrepl/v1/endpoint_dismiss_news_digest.proto";
import "agentrepl/v1/endpoint_update_shutdown_schedule.proto";
import "agentrepl/v1/endpoint_update_merge_queue.proto";
import "agentrepl/v1/endpoint_daemon_health.proto";
import "agentrepl/v1/endpoint_session_health.proto";
import "agentrepl/v1/endpoint_client_log.proto";
import "agentrepl/v1/endpoint_report_latencies.proto";
import "agentrepl/v1/endpoint_update_persistent_wifi_mode.proto";
import "agentrepl/v1/endpoint_refresh_news_digest.proto";
import "agentrepl/v1/endpoint_register_workspace.proto";
import "agentrepl/v1/endpoint_select_account.proto";
import "agentrepl/v1/endpoint_select_workspace.proto";
import "agentrepl/v1/endpoint_mark_workspace_viewed.proto";
import "agentrepl/v1/endpoint_report_page_unloading.proto";
import "agentrepl/v1/endpoint_report_editor_focus.proto";
import "agentrepl/v1/endpoint_claim_live_notification.proto";
import "agentrepl/v1/endpoint_watch_host_workspace.proto";
import "agentrepl/v1/endpoint_watch_daemon.proto";
import "agentrepl/v1/endpoint_adopt_host_workspace.proto";
import "agentrepl/v1/endpoint_list_slash_commands.proto";
import "agentrepl/v1/endpoint_watch_web_workspace.proto";
import "agentrepl/v1/endpoint_adopt_web_workspace.proto";
import "agentrepl/v1/endpoint_watch_page.proto";
import "agentrepl/v1/endpoint_open_tabs.proto";
import "agentrepl/v1/endpoint_report_page_drawn.proto";
import "agentrepl/v1/endpoint_get_workspace_status.proto";
import "agentrepl/v1/endpoint_get_merge_queue_status.proto";
import "agentrepl/v1/endpoint_subscribe_workspace.proto";
import "agentrepl/v1/endpoint_unsubscribe_workspace.proto";
import "agentrepl/v1/endpoint_subscribe_merge_queue.proto";
import "agentrepl/v1/endpoint_unsubscribe_merge_queue.proto";
import "agentrepl/v1/endpoint_update_deploy_hold.proto";
import "agentrepl/v1/endpoint_roll_out_landing.proto";
import "agentrepl/v1/endpoint_evaluate_in_editor.proto";
import "agentrepl/v1/endpoint_answer_editor_evaluation.proto";
import "agentrepl/v1/endpoint_compact_workspace.proto";
import "agentrepl/v1/endpoint_set_workspace_correspondence.proto";
import "agentrepl/v1/endpoint_set_workspace_principal_link.proto";
import "agentrepl/v1/endpoint_set_workspace_one_shot.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

service AgentRepl {
  // ---- FEED ----

  // The composer's submission, whole; the daemon recognizes programmatically
  // handled commands transparently. See endpoint_submit_prompt.proto.
  rpc SubmitPrompt(SubmitPromptRequest) returns (SubmitPromptResponse);

  // Move, clear or end the feed's selection (a final response to reply to,
  // or a prompt to roll back to): the daemon computes the selected row from
  // its ordered rows, pushes it to the webapp and Emacs, and acks it here.
  // See endpoint_select_feed_row.proto.
  rpc SelectFeedRow(SelectFeedRowRequest) returns (SelectFeedRowResponse);

  // The reader opened or closed a merge bubble: the daemon records the fold
  // on the bubble's durable head row, so it survives pushes, reloads and
  // restarts. See endpoint_fold_merge_bubble.proto.
  rpc FoldMergeBubble(FoldMergeBubbleRequest) returns (FoldMergeBubbleResponse);

  // Nudge the feed text zoom one small step up or down. Daemon-global,
  // persisted, pushed to every open feed's watch as a FeedTextScale frame. See
  // endpoint_adjust_feed_text_scale.proto.
  rpc AdjustFeedTextScale(AdjustFeedTextScaleRequest) returns (AdjustFeedTextScaleResponse);

  // Open one image large over the workspace's feed, from a click on it in the
  // Emacs input window or the webapp. Daemon-held per workspace, pushed on the
  // root feed's watch as a FeedImageOverlay frame. See
  // endpoint_open_feed_image.proto.
  rpc OpenFeedImage(OpenFeedImageRequest) returns (OpenFeedImageResponse);

  // Close the image open over the workspace's feed. See
  // endpoint_close_feed_image.proto.
  rpc CloseFeedImage(CloseFeedImageRequest) returns (CloseFeedImageResponse);

  // The refusal card's "engineer support for it" offer: spawn a support
  // workspace with a daemon-composed brief. See
  // endpoint_request_command_support.proto.
  rpc RequestCommandSupport(RequestCommandSupportRequest) returns (RequestCommandSupportResponse);

  // The feed's live half: every row upsert for one workspace, top-level and
  // nested alike. See endpoint_watch_feed.proto.
  // Opens ONE feed (root, or a subagent bubble's sub-feed): answers with the
  // newest page and mints the token WatchFeed echoes.
  rpc OpenFeed(OpenFeedRequest) returns (OpenFeedResponse);
  rpc WatchFeed(WatchFeedRequest) returns (stream WatchFeedResponse);

  // The feed's history half: a page of rows for one container, "first" or
  // "next" — the daemon holds the walk. See endpoint_get_feed_page.proto.
  rpc GetFeedPage(GetFeedPageRequest) returns (GetFeedPageResponse);
  // Brings one root-feed row into the reader's loaded pages, streaming every
  // page between. See endpoint_load_feed_through.proto.
  rpc LoadFeedThrough(LoadFeedThroughRequest) returns (stream LoadFeedThroughResponse);

  // "Stop that": the running turn, or a detached bubble's work — the arm is
  // the target. See endpoint_interrupt.proto.
  rpc Interrupt(InterruptRequest) returns (InterruptResponse);

  // Retry the turn the vendor failed now, rather than at the end of the
  // footer's countdown (RET in an empty composer). See
  // endpoint_retry_vendor_error.proto.
  rpc RetryVendorError(RetryVendorErrorRequest) returns (RetryVendorErrorResponse);

  // A reader clicked a piece on a feed chess board: the daemon asks the
  // board's CEE backend what the engine says about the square and hands the
  // answer back whole. See endpoint_inspect_chess_board_square.proto.
  rpc InspectChessBoardSquare(InspectChessBoardSquareRequest) returns (InspectChessBoardSquareResponse);

  // ---- Rollback: return the conversation to just before one of its prompts ----

  // Say what a rollback would do, for the user to confirm; changes nothing.
  // See endpoint_plan_rollback.proto.
  rpc PlanRollback(PlanRollbackRequest) returns (PlanRollbackResponse);
  // Perform a confirmed plan. See endpoint_roll_back.proto.
  rpc RollBack(RollBackRequest) returns (RollBackResponse);
  // The prompts a rollback can reach, newest first, for a frontend to offer
  // as a choice; changes nothing. See endpoint_list_rollback_prompts.proto.
  rpc ListRollbackPrompts(ListRollbackPromptsRequest) returns (ListRollbackPromptsResponse) {
    // A READ: it changes nothing (`agent-repld -dry-run` lets it through).
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // The permission card's verdicts and the question card's answers. See
  // endpoint_answer_permission.proto.
  rpc AnswerPermission(AnswerPermissionRequest) returns (AnswerPermissionResponse);
  // The question card's submission — answers echo the served values.
  rpc AnswerQuestion(AnswerQuestionRequest) returns (AnswerQuestionResponse);
  // One click on a standing question card: show a question, pick an option,
  // or confirm a multi-select. The daemon owns the draft and delivers the
  // batch itself once every question is answered. See
  // endpoint_update_question_draft.proto.
  rpc UpdateQuestionDraft(UpdateQuestionDraftRequest) returns (UpdateQuestionDraftResponse);
  // The cold-context gate's buttons — pay, clear, or compact{model, scope}.
  rpc AnswerColdGate(AnswerColdGateRequest) returns (AnswerColdGateResponse);

  // ---- SIDEBAR ----

  // The one global stream: the roster, whole, for every webview alike. See
  // endpoint_watch_workspace_roster.proto.
  rpc WatchWorkspaceRoster(WatchWorkspaceRosterRequest) returns (stream WatchWorkspaceRosterResponse) {
    // A READ: it changes nothing (`agent-repld -dry-run` lets it through).
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // A new workspace in a repository; the daemon names and creates everything.
  // See endpoint_create_workspace.proto.
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (CreateWorkspaceResponse);

  // A repository on its own, with no workspace: resolved from ANY path inside
  // it and idempotent by the resolved dir. See
  // endpoint_register_repository.proto.
  rpc RegisterRepository(RegisterRepositoryRequest) returns (RegisterRepositoryResponse);

  // Open a registered-but-closed workspace.
  rpc OpenWorkspace(OpenWorkspaceRequest) returns (OpenWorkspaceResponse);

  // Every vendor conversation filed under the workspace's directory, with
  // what each would cost to resume. A pull: the set changes only when a
  // conversation is started or cleared.
  rpc ListWorkspaceTranscripts(ListWorkspaceTranscriptsRequest) returns (ListWorkspaceTranscriptsResponse) {
    // A READ: it changes nothing (`agent-repld -dry-run` lets it through).
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Point the workspace at one of those conversations. A session swap, so a
  // cold one comes up parked at its cold gate.
  rpc BindWorkspaceSession(BindWorkspaceSessionRequest) returns (BindWorkspaceSessionResponse);

  // Tear down a workspace's editor state without merging — the only teardown.
  rpc CloseWorkspace(CloseWorkspaceRequest) returns (CloseWorkspaceResponse);
  // The big red button: forced session death, never blocks, data survives.
  rpc KillWorkspace(KillWorkspaceRequest) returns (KillWorkspaceResponse);
  // Data destruction: kill if live, then delete worktree and branch.
  rpc NukeWorkspace(NukeWorkspaceRequest) returns (NukeWorkspaceResponse);
  // Remove a CLOSED workspace's registry record; every file survives. The
  // undo for a registration. See endpoint_forget_workspace.proto.
  rpc ForgetWorkspace(ForgetWorkspaceRequest) returns (ForgetWorkspaceResponse);

  // This workspace's work is finished: run its repository's deploy on its own
  // branch; its life from there is the feed's bubble. See
  // endpoint_finish_workspace.proto.
  rpc FinishWorkspace(FinishWorkspaceRequest) returns (FinishWorkspaceResponse);
  // Compact a workspace's conversation through its prompt queue. See
  // endpoint_compact_workspace.proto.
  rpc CompactWorkspace(CompactWorkspaceRequest) returns (CompactWorkspaceResponse);
  // Mark a workspace a one-shot after its creation, or unmark it. See
  // endpoint_set_workspace_one_shot.proto.
  rpc SetWorkspaceOneShot(SetWorkspaceOneShotRequest) returns (SetWorkspaceOneShotResponse);
  // Mark a workspace as awaiting correspondence from another, or clear the
  // mark. See endpoint_set_workspace_correspondence.proto.
  rpc SetWorkspaceCorrespondence(SetWorkspaceCorrespondenceRequest) returns (SetWorkspaceCorrespondenceResponse);
  // Name the link that best stands for a workspace's task, which the topbar's
  // summary opens, or clear it. See endpoint_set_workspace_principal_link.proto.
  rpc SetWorkspacePrincipalLink(SetWorkspacePrincipalLinkRequest) returns (SetWorkspacePrincipalLinkResponse);



  // Bounce the workspace's shim (rebuild if stale); graceful unless forced.
  // See endpoint_restart_workspace.proto.
  rpc RestartWorkspace(RestartWorkspaceRequest) returns (RestartWorkspaceResponse);

  // Set or clear a workspace's priority; setting one moves the workspace to
  // second-to-last within that priority. See
  // endpoint_set_workspace_priority.proto.
  rpc SetWorkspacePriority(SetWorkspacePriorityRequest) returns (SetWorkspacePriorityResponse);
  // Move a workspace into the hidden section or back out; a hidden workspace
  // is off the Emacs tab bar. See endpoint_set_workspace_hidden.proto.
  rpc SetWorkspaceHidden(SetWorkspaceHiddenRequest) returns (SetWorkspaceHiddenResponse);
  // Send one keep-alive to every hidden workspace's session, so each cache's
  // lapse moves later. See endpoint_send_hidden_keepalives.proto.
  rpc SendHiddenKeepalives(SendHiddenKeepalivesRequest) returns (SendHiddenKeepalivesResponse);
  // Retarget a workspace's merge: make it a child of another workspace of the
  // same repository, or top-level. Its session is told in the same operation.
  // See endpoint_set_workspace_parent.proto.
  rpc SetWorkspaceParent(SetWorkspaceParentRequest) returns (SetWorkspaceParentResponse);
  // Exchange two workspaces' places in the registry order. See
  // endpoint_swap_workspaces.proto.
  rpc SwapWorkspaces(SwapWorkspacesRequest) returns (SwapWorkspacesResponse);
  // Move one workspace onto another's tab, the tabs between shifting over. See
  // endpoint_move_workspace.proto.
  rpc MoveWorkspace(MoveWorkspaceRequest) returns (MoveWorkspaceResponse);
  rpc FoldRepository(FoldRepositoryRequest) returns (FoldRepositoryResponse);
  // Change one piece of the sidebar's view state (a fold, the grouping),
  // pushed to every page on the roster stream. See
  // endpoint_update_sidebar_view.proto.
  rpc UpdateSidebarView(UpdateSidebarViewRequest) returns (UpdateSidebarViewResponse);
  // Change how the repository grouping is ARRANGED: the repositories' order,
  // a repository's subsections, and which subsection a workspace sits in and
  // where. The tab bar follows the arrangement. See
  // endpoint_arrange_sidebar.proto.
  rpc ArrangeSidebar(ArrangeSidebarRequest) returns (ArrangeSidebarResponse);
  // Read the repository grouping's arrangement, for an agent organizing it.
  // See endpoint_get_sidebar_arrangement.proto.
  rpc GetSidebarArrangement(GetSidebarArrangementRequest) returns (GetSidebarArrangementResponse);

  // A new user task; the roster's task view renders it. See
  // endpoint_create_task.proto.
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);
  // Change one task (retitle, done, reopen). See endpoint_update_task.proto.
  rpc UpdateTask(UpdateTaskRequest) returns (UpdateTaskResponse);
  // Assign a workspace to a task, or unassign it. See
  // endpoint_assign_workspace_task.proto.
  rpc AssignWorkspaceTask(AssignWorkspaceTaskRequest) returns (AssignWorkspaceTaskResponse);

  // ---- TOPBAR ----

  // The topbar's stream: the view, whole (the token-breakdown menu inside).
  rpc WatchTopbar(WatchTopbarRequest) returns (stream WatchTopbarResponse);

  // The selector's pick: the typed echo token handed back. See
  // endpoint_set_model.proto.
  rpc SetModel(SetModelRequest) returns (SetModelResponse);

  // The effort selector's pick, SetModel's sibling. See
  // endpoint_set_effort.proto.
  rpc SetEffort(SetEffortRequest) returns (SetEffortResponse);

  // The permission-mode switch, SetModel's sibling. See
  // endpoint_set_permission_mode.proto.
  rpc SetPermissionMode(SetPermissionModeRequest) returns (SetPermissionModeResponse);

  // The account cell's pick: make this workspace's session spend as one of
  // the roots TopbarAccount.options served. See
  // endpoint_select_account.proto.
  rpc SelectAccount(SelectAccountRequest) returns (SelectAccountResponse);

  // ---- FOOTER ----

  // The footer's stream: the view, whole.
  rpc WatchFooter(WatchFooterRequest) returns (stream WatchFooterResponse);

  // ---- HELD SECTION ----
  //
  // The section itself rides the root feed's own connection: OpenFeed's
  // answer and WatchFeed's held-section frames. These are its actions.

  // Act on a held prompt: deliver now, or discard. See
  // endpoint_update_held_prompt.proto.
  rpc UpdateHeldPrompt(UpdateHeldPromptRequest) returns (UpdateHeldPromptResponse);

  // Edit a held prompt: begin (claim it and hand its content to the editor),
  // commit (replace and reclassify), or cancel. See
  // endpoint_edit_held_prompt.proto.
  rpc EditHeldPrompt(EditHeldPromptRequest) returns (EditHeldPromptResponse);

  // Fold a held prompt into the held prompt directly ahead of it: its content
  // is appended to that entry and it leaves the queue, in one transaction. See
  // endpoint_fold_held_prompt.proto.
  rpc FoldHeldPrompt(FoldHeldPromptRequest) returns (FoldHeldPromptResponse);

  // A classified held card's "update classifier" control: a headless model
  // rewrites the routing classifier's brief to carry the user's change, and
  // the daemon commits that one file. See
  // endpoint_update_classifier_prompt.proto.
  rpc UpdateClassifierPrompt(UpdateClassifierPromptRequest) returns (UpdateClassifierPromptResponse);

  // Answer the merge-queue question an interrupt raised in the merge bubble.
  // See endpoint_answer_merge_queue_offer.proto.
  rpc AnswerMergeQueueOffer(AnswerMergeQueueOfferRequest) returns (AnswerMergeQueueOfferResponse);

  // ---- DAEMON ADMIN ----

  // The deploy tooling's drain-and-exit control. See
  // endpoint_update_shutdown_schedule.proto.
  rpc UpdateShutdownSchedule(UpdateShutdownScheduleRequest) returns (UpdateShutdownScheduleResponse);

  // Build the checkout and put what is out of date into service — the daemon
  // owns deploys, and an unforced one never ends a turn. See
  // endpoint_deploy.proto.
  rpc Deploy(DeployRequest) returns (DeployResponse);

  // Operator control of the merge queue. See
  // endpoint_update_merge_queue.proto.
  rpc UpdateMergeQueue(UpdateMergeQueueRequest) returns (UpdateMergeQueueResponse);
  // Hold or release one repository's deploy stage; releasing runs a skipped
  // script deploy hook once. See endpoint_update_deploy_hold.proto.
  rpc UpdateDeployHold(UpdateDeployHoldRequest) returns (UpdateDeployHoldResponse);
  // agent-repl's deploy hook asks for the rollout of what a deploy landed. See
  // endpoint_roll_out_landing.proto.
  rpc RollOutLanding(RollOutLandingRequest) returns (RollOutLandingResponse);

  // Is the daemon itself healthy? Unhealthy is an ANSWER. See
  // endpoint_daemon_health.proto.
  rpc DaemonHealth(DaemonHealthRequest) returns (DaemonHealthResponse) {
    // A READ: it changes nothing (`agent-repld -dry-run` lets it through).
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Is this workspace's session healthy? Unhealthy is an ANSWER. See
  // endpoint_session_health.proto.
  rpc SessionHealth(SessionHealthRequest) returns (SessionHealthResponse) {
    // A READ: it changes nothing (`agent-repld -dry-run` lets it through).
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // A console-less client's diagnostic record, into the durable log. See
  // endpoint_client_log.proto.
  rpc ClientLog(ClientLogRequest) returns (ClientLogResponse);

  // A client's finished interaction latencies, into the always-on metrics.
  // See endpoint_report_latencies.proto.
  rpc ReportLatencies(ReportLatenciesRequest) returns (ReportLatenciesResponse);

  // ---- HOST MACHINE ----
  // Facts and controls about the machine the daemon runs on, never about a
  // workspace.

  // Turn persistent wifi mode (lid-closed operation) on, off, or over. See
  // endpoint_update_persistent_wifi_mode.proto.
  rpc UpdatePersistentWifiMode(UpdatePersistentWifiModeRequest) returns (UpdatePersistentWifiModeResponse);

  // ---- HOST ----

  // Emacs announces a workspace exists; idempotent by dir. See
  // endpoint_register_workspace.proto.
  rpc RegisterWorkspace(RegisterWorkspaceRequest) returns (RegisterWorkspaceResponse);

  // The user switched to this workspace in the editor; idempotent. See
  // endpoint_select_workspace.proto.
  rpc SelectWorkspace(SelectWorkspaceRequest) returns (SelectWorkspaceResponse);

  // The user has now SEEN this workspace: its row goes PARTIAL until its
  // status changes; idempotent. See endpoint_mark_workspace_viewed.proto.
  rpc MarkWorkspaceViewed(MarkWorkspaceViewedRequest) returns (MarkWorkspaceViewedResponse);

  // Emacs is about to unload this workspace's page on purpose; the daemon
  // awaits its web hop rather than drawing it broken. Idempotent. See
  // endpoint_report_page_unloading.proto.
  rpc ReportPageUnloading(ReportPageUnloadingRequest) returns (ReportPageUnloadingResponse);

  // Emacs gained or lost desktop focus; the daemon decides every desktop
  // banner on it. Idempotent. See endpoint_report_editor_focus.proto.
  rpc ReportEditorFocus(ReportEditorFocusRequest) returns (ReportEditorFocusResponse);

  // Emacs gained desktop focus: answer the workspace of the newest desktop
  // banner still live, which Emacs then selects, and forget the rest. See
  // endpoint_claim_live_notification.proto.
  rpc ClaimLiveNotification(ClaimLiveNotificationRequest) returns (ClaimLiveNotificationResponse);

  // The host-facing view of one workspace, per-workspace subscription. See
  // endpoint_watch_host_workspace.proto.
  rpc WatchHostWorkspace(WatchHostWorkspaceRequest) returns (stream WatchHostWorkspaceResponse);

  // The daemon-level host stream — daemon-scoped facts only (the graceful
  // rollout's shutdown announcement). See endpoint_watch_daemon.proto.
  rpc WatchDaemon(WatchDaemonRequest) returns (stream WatchDaemonResponse);

  // Open the workspaces the editor names: each is brought up (when visible)
  // and answered `opened` once it is served and its page has drawn, with every
  // step on the way as a frame. The editor shows a tab only on its `opened`.
  // See endpoint_open_tabs.proto.
  rpc OpenTabs(OpenTabsRequest) returns (stream OpenTabsResponse);

  // Emacs's half of the handover rendezvous, called on the NEW daemon. See
  // endpoint_adopt_host_workspace.proto.
  rpc AdoptHostWorkspace(AdoptHostWorkspaceRequest) returns (AdoptHostWorkspaceResponse);

  // Every slash command the workspace's agent runtime answers, for the
  // composer's completion. See endpoint_list_slash_commands.proto.
  rpc ListSlashCommands(ListSlashCommandsRequest) returns (ListSlashCommandsResponse) {
    // A READ: it changes nothing (`agent-repld -dry-run` lets it through).
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ---- WEB LINK ----
  // The webview's connection surface: neither host-natured nor a drawn
  // component — the per-workspace daemon link the graceful rollout rides.

  // The webview's standing daemon-link stream for one workspace. See
  // endpoint_watch_web_workspace.proto.
  rpc WatchWebWorkspace(WatchWebWorkspaceRequest) returns (stream WatchWebWorkspaceResponse);

  // Begin (or join) the account login flow — the daemon-owned pty running
  // the vendor's login TUI. See endpoint_open_login.proto.
  rpc OpenLogin(OpenLoginRequest) returns (OpenLoginResponse);
  // The login pty's output stream: raw bytes out, scrollback replayed on
  // attach; the input direction is SendLoginInput (a WKWebView cannot speak
  // a bidirectional Connect stream). See endpoint_watch_login_terminal.proto.
  rpc WatchLoginTerminal(WatchLoginTerminalRequest) returns (stream LoginTerminalOutput);
  // Keystrokes or a resize for the login pty. See
  // endpoint_send_login_input.proto.
  rpc SendLoginInput(SendLoginInputRequest) returns (SendLoginInputResponse);
  // End the login session; closing an absent one is success. See
  // endpoint_close_login.proto.
  rpc CloseLogin(CloseLoginRequest) returns (CloseLoginResponse);
  // Open a clicked link in the browser profile the session's account signs
  // in as. See
  // endpoint_open_external.proto.
  rpc OpenExternal(OpenExternalRequest) returns (OpenExternalResponse);
  // A host-raised click: open a path (at a line) in the editor — relayed to
  // the workspace's host stream. See endpoint_open_in_editor.proto.
  rpc OpenInEditor(OpenInEditorRequest) returns (OpenInEditorResponse);

  // The webview's half of the handover rendezvous, called on the NEW
  // daemon. See endpoint_adopt_web_workspace.proto.
  rpc AdoptWebWorkspace(AdoptWebWorkspaceRequest) returns (AdoptWebWorkspaceResponse);

  // ---- THE PAGE'S ONE STREAM ----
  //
  // A browser page multiplexes EVERY standing subscription onto WatchPage,
  // because HTTP/1.1 caps it at about six connections per host and a
  // server-streaming call pins one for its whole life. See
  // endpoint_watch_page.proto for what that cap actually cost.

  // The page's one standing stream. Its first frame is the attachment latch;
  // every frame after it is one subscription's push.
  rpc WatchPage(WatchPageRequest) returns (stream WatchPageResponse);
  // Start one subscription on an attached page. The acceptance IS the answer,
  // and a refused open is a Connect error exactly as a refused Watch* is.
  rpc SubscribePage(SubscribePageRequest) returns (SubscribePageResponse);
  // End one subscription, leaving the page's others alone.
  rpc UnsubscribePage(UnsubscribePageRequest) returns (UnsubscribePageResponse);

  // A workspace's page drew its conversation (again on every re-attach while
  // drawn); an OpenTabs waiting on it may answer `opened`. See
  // endpoint_report_page_drawn.proto.
  rpc ReportPageDrawn(ReportPageDrawnRequest) returns (ReportPageDrawnResponse);

  // ---- News digest: the daily Claude news overlay ----
  // Takes the standing digest down in every webview. See
  // endpoint_dismiss_news_digest.proto.
  rpc DismissNewsDigest(DismissNewsDigestRequest) returns (DismissNewsDigestResponse);
  // Makes a digest now instead of at the daily cadence. See
  // endpoint_refresh_news_digest.proto.
  rpc RefreshNewsDigest(RefreshNewsDigestRequest) returns (RefreshNewsDigestResponse);

  // ---- AGENT API: what an agent reads and follows ----
  // One workspace's status, now. See endpoint_get_workspace_status.proto.
  rpc GetWorkspaceStatus(GetWorkspaceStatusRequest) returns (GetWorkspaceStatusResponse) {
    // A READ: it changes nothing (`agent-repld -dry-run` lets it through).
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Merge queues' status, now. See endpoint_get_merge_queue_status.proto.
  rpc GetMergeQueueStatus(GetMergeQueueStatusRequest) returns (GetMergeQueueStatusResponse) {
    // A READ: it changes nothing (`agent-repld -dry-run` lets it through).
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Tell one workspace's agent when another workspace changes, answering with
  // its status now. See endpoint_subscribe_workspace.proto.
  rpc SubscribeWorkspace(SubscribeWorkspaceRequest) returns (SubscribeWorkspaceResponse);
  // End a workspace subscription. See endpoint_unsubscribe_workspace.proto.
  rpc UnsubscribeWorkspace(UnsubscribeWorkspaceRequest) returns (UnsubscribeWorkspaceResponse);
  // Tell one workspace's agent about a merge queue's changes, answering with
  // the queue now. See endpoint_subscribe_merge_queue.proto.
  rpc SubscribeMergeQueue(SubscribeMergeQueueRequest) returns (SubscribeMergeQueueResponse);
  // End a merge-queue subscription. See
  // endpoint_unsubscribe_merge_queue.proto.
  rpc UnsubscribeMergeQueue(UnsubscribeMergeQueueRequest) returns (UnsubscribeMergeQueueResponse);

  // ---- EDITOR: elisp evaluated in the running editor ----
  // Evaluate elisp in the running editor and answer with the result. See
  // endpoint_evaluate_in_editor.proto.
  rpc EvaluateInEditor(EvaluateInEditorRequest) returns (EvaluateInEditorResponse);
  // The editor's answer to a pushed evaluation. See
  // endpoint_answer_editor_evaluation.proto.
  rpc AnswerEditorEvaluation(AnswerEditorEvaluationRequest) returns (AnswerEditorEvaluationResponse);
}
