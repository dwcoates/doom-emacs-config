// endpoint_open_in_editor.proto — OpenInEditor: a HOST-RAISED click. WEB LINK
// section. The webview's shared link component calls this for the
// affordances that open something in the editor — the plan bubble's edit
// button, a findings row's location, a worktree divider's path, a merge's
// test log, a landed merge's commit, a shell code block's run control — and the
// daemon RELAYS the click as the workspace's WatchHostWorkspace push arm
// `open_in_editor`, which Emacs answers with its ONE shared editor-popup
// subroutine (a file at a line, or dired for a directory). No daemon→Emacs
// command loop exists: the push is a fact ("the user clicked this"), Emacs
// reacts, and nothing acks. The daemon validates the workspace and relays
// the path VERBATIM; it never opens anything itself.

syntax = "proto3";

package agentrepl.v1;

import "frontend/v1/feed.proto";
import "workspace/v1/workspace.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

message OpenInEditorRequest {
  workspace.v1.WorkspaceRef workspace = 1;
  // Tags 2 and 3 (`path`, `line`) moved into the `workspace_file` target.
  reserved 2, 3;
  reserved "path", "line";
  // WHAT is opened. THE ARM IS THE KIND OF TARGET, because each is
  // validated differently: a workspace file must stay inside the worktree,
  // while a merge's test log lives in the daemon's own state and is named
  // only by the token the feed served.
  oneof target {
    // A file or directory inside the workspace's worktree.
    OpenInEditorWorkspaceFile workspace_file = 4;
    // A merge's test log, echoed back exactly as the merge bubble served it.
    frontend.v1.FeedMergeTestLogToken merge_test_log = 5;
    // A link the reader clicked inside a prompt or response bubble whose href
    // is not a web URL: a path or a bare file name. The DAEMON resolves it
    // (see OpenInEditorFeedLink) and relays the resolved path exactly as a
    // `workspace_file` click.
    OpenInEditorFeedLink feed_link = 6;
    // A landed merge's commit, clicked on the merge bubble's head: the
    // branch's log opens with the commit selected. Relayed verbatim as the
    // host push arm `open_commit_log`.
    OpenInEditorCommitLog commit_log = 7;
    // A shell code block's run control, clicked: Emacs opens its terminal
    // popup (the one `SPC o t` toggles), runs the command in it, and closes
    // the popup once the command exits. Relayed verbatim as the host push
    // arm `run_in_terminal`.
    OpenInEditorTerminalCommand terminal_command = 8;
  }
}

// A shell command to run in the editor's terminal popup.
message OpenInEditorTerminalCommand {
  // The code block's text, verbatim: one command a terminal runs whole. A
  // blank one is Connect InvalidArgument.
  string command = 1;
}

// A branch's log, opened with one commit selected. Every field is echoed
// from the merge head that drew it (frontend.v1.FeedMergeSuccess) and
// required: a blank one is Connect InvalidArgument.
message OpenInEditorCommitLog {
  // The checkout on the daemon's host whose log is opened.
  string repository_dir = 1;
  // The branch whose log is opened.
  string branch = 2;
  // The commit point lands on.
  string commit = 3;
}
// A file or directory inside the workspace's worktree.
message OpenInEditorWorkspaceFile {
  // The path on the daemon's host, exactly as the feed row carried it
  // (FeedPlanEditTarget.path, FeedFindingsLocation.path, FeedWorktreePath).
  string path = 1;
  // The 1-indexed line to land on. UNSET = the file's top (or a directory).
  optional uint32 line = 2;
}

// THE ARM IS THE OUTCOME.
message OpenInEditorResponse {
  oneof result {
    OpenInEditorSuccess success = 1;
    OpenInEditorError error = 2;
  }
}

// Relayed to the workspace's host stream. Empty: nothing else is owed.
message OpenInEditorSuccess {}

// Arms derived from the daemon's refusal sites (landing 4, 2026-08-29).
// Validation failures (unset field, UNSPECIFIED enum, blank string) are Connect InvalidArgument, never an arm.
message OpenInEditorError {
  oneof cause {
    // The workspace id is not in the daemon's registry.
    OpenInEditorUnknownWorkspace unknown_workspace = 1;
    // The echoed dir disagrees with the registry's dir for this id.
    OpenInEditorWorkspaceRefMismatch workspace_ref_mismatch = 2;
    // This daemon released the workspace to a successor; dial `address`.
    OpenInEditorTransferringAway transferring_away = 3;
    // A joining daemon has not finished adopting this workspace yet.
    OpenInEditorNotYetAdopted not_yet_adopted = 4;
    // A `workspace_file` path resolves outside the workspace's worktree.
    // Never answered for a `feed_link`, which may open any file.
    OpenInEditorPathEscapesWorkspace path_escapes_workspace = 5;
    // The merge test log token names no log this daemon opens for the
    // workspace; its `reason` says which check refused it.
    OpenInEditorUnknownMergeTestLog unknown_merge_test_log = 6;
    // A feed link resolved to no existing file. The daemon has already
    // published the transient "unknown file" footer line and sent the
    // workspace its non-interrupting question about the link.
    OpenInEditorLinkUnresolved link_unresolved = 7;
  }
}
message OpenInEditorUnknownWorkspace {}
message OpenInEditorWorkspaceRefMismatch {
  // The dir the registry holds for this id.
  string registry_dir = 1;
}
message OpenInEditorTransferringAway {
  // The successor's `127.0.0.1:<port>`, so a lagging client dials it.
  string address = 1;
}
message OpenInEditorNotYetAdopted {
  // The `127.0.0.1:<port>` of the daemon that serves this workspace until the
  // joining daemon adopts it: the handover's incumbent. A client views and
  // acts on the workspace there in the meantime, and the incumbent's later
  // `transferred` push re-homes it. UNSET when no live daemon serves the
  // workspace (a takeover after the incumbent died), in which case the client
  // waits for the adoption.
  optional string address = 1;
}
message OpenInEditorPathEscapesWorkspace {}
// Why a merge test log token was refused. Exactly one is set.
message OpenInEditorUnknownMergeTestLog {
  oneof reason {
    // The token is not one the daemon mints (no lease, or no round number).
    OpenInEditorUnknownMergeTestLogMalformed malformed = 1;
    // The token names a merge whose bubble is not drawn in the asking
    // workspace's feed: its own merges, and the async merges it requested,
    // are the bubbles it draws.
    OpenInEditorUnknownMergeTestLogNotDrawnHere not_drawn_here = 2;
    // The merge is one this feed draws, but its log is gone: the log
    // retention pass removed it.
    OpenInEditorUnknownMergeTestLogAgedOut aged_out = 3;
  }
}
// The token is not one the daemon mints.
message OpenInEditorUnknownMergeTestLogMalformed {}
// The token names a merge this workspace's feed draws no bubble for.
message OpenInEditorUnknownMergeTestLogNotDrawnHere {}
// The log retention pass removed the log.
message OpenInEditorUnknownMergeTestLogAgedOut {}

// A non-web link clicked in a prompt or response bubble.
//
// RESOLUTION, in order, first existing file wins:
//   1. A home-relative path (`~/rest`): beneath the daemon's home directory.
//      `~user/rest` (another user's home) is not expanded and resolves to
//      nothing.
//   2. An absolute path: as given.
//   3. A path with a directory part: relative to the workspace's worktree root.
//   4. A BARE file name: <worktree root>/modules/app/agent-repl/<name>, then
//      <git project root of the worktree>/<name>.
// A link may resolve anywhere on the host, inside the worktree or outside it:
// unlike a `workspace_file`, it is never refused as `path_escapes_workspace`.
// A link that resolves to nothing is `link_unresolved`.
message OpenInEditorFeedLink {
  // The link's href exactly as the bubble rendered it, optionally carrying a
  // `:<line>` suffix the bubble drew.
  string href = 1;
  // The prompt or response row the link was clicked in, echoed as served: the
  // row the daemon's follow-up question quotes when the link resolves to
  // nothing.
  frontend.v1.FeedId source_row = 2;
  // What the daemon does when the link resolves to no file. Always set; a
  // request with neither arm is malformed. Either way the answer is
  // `link_unresolved`.
  oneof on_unresolved {
    // The link was unambiguously meant as a file (an explicit link, or a bare
    // name whose extension is no web domain ending): publish the transient
    // "unknown file" footer line and send the workspace its follow-up
    // question.
    OpenInEditorFeedLinkReport report = 3;
    // The link is AMBIGUOUS: a bare name whose extension is also a web domain
    // ending (`notes.org` / `wikipedia.org`, `.md`, `.sh`, `.py`, `.rs`). The
    // file is tried first; when nothing resolves, the daemon stays silent (no
    // footer line, no follow-up question) and the client opens the name as a
    // web URL instead.
    OpenInEditorFeedLinkWebFallback web_fallback = 4;
  }
}

// Report an unresolved link to the user and the agent.
message OpenInEditorFeedLinkReport {}

// Resolve silently; the client falls back to the web.
message OpenInEditorFeedLinkWebFallback {}

// The feed link resolved to no file.
message OpenInEditorLinkUnresolved {
  // The href as clicked.
  string href = 1;
}
