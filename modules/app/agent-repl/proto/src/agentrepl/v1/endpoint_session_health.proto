// endpoint_session_health.proto — the SessionHealth endpoint's request, success
// and error.
//
// ONE ENDPOINT PER FILE: SessionHealthRequest, SessionHealthResponse and the
// two answers it wraps, and nothing else, so the whole of what one method takes
// and returns is readable in one place. The `endpoint_` prefix is the grouping,
// not a directory — see DESIGN-protobuf-surfaces.md for why a directory is not
// available here, and for why a request type belongs to agentrepl.v1 rather
// than frontend.v1.

syntax = "proto3";

package agentrepl.v1;

import "agentrepl/v1/shared.proto";
import "frontend/v1/failure.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// Ask the daemon to prove the entire session route for one restored workspace:
// daemon registry -> current session controller -> handshaked shim -> shim dependencies.
// `workspace` is authoritative and must be the session's absolute CWD;
// `session_id` makes a stale response impossible to use after a rebind.
//
// HOST SURFACE, like its view.
message SessionHealthRequest {
  // Correlation. The SessionHealthView pushed in answer echoes this id.
  string request_id = 1;
  // The workspace whose route is being proved. See agentrepl.v1.AgentRepl.
  string workspace = 2;
  // WHICH SUBSCRIBE STREAM the SessionHealthView should be pushed down. See
  // agentrepl.v1.SubscribeRequest.client_id.
  string client_id = 3;
  // The session the verdict must be about, so a response cannot be used after
  // a rebind moved the workspace onto a different one.
  string session_id = 4;
}

// SessionHealth's answer: exactly one of a success and an error.
//
// TWO ARMS, NOT AN `ok` BIT PLUS AN OPTIONAL FAILURE — see
// AcceptQueueEntryResponse for the whole of that argument.
message SessionHealthResponse {
  // Echoed from the request that produced this answer. See
  // AcceptQueueEntryResponse.request_id.
  string request_id = 1;
  oneof response {
    SessionHealthSuccess success = 2;
    SessionHealthError error = 3;
  }
}

// The probe ran.
//
// NO ARMS, AND NO VERDICT. As with DaemonHealth the verdict arrives as a pushed
// SessionHealthView; this answer carries acceptance only.
message SessionHealthSuccess {}

// Why the probe could not be run.
//
// EXACTLY ONE DERIVED ARM BESIDES THE FUNNEL, and the shortness of this list is
// itself the contract. A non-absolute workspace key, a missing session_id, an
// unwired router, a transport failure, a mismatched session and an unhealthy
// shim are ALL encoded as healthy=false ON THE VIEW rather than as refusals
// here, so that Emacs has ONE honest result type to wait on during restore
// instead of two channels to reconcile. The only thing that can refuse the call
// itself is the absence of the correlation the view would be pushed under.
message SessionHealthError {
  oneof error {
    // The request carries no request_id, so no pushed view could be attributed
    // to it.
    RefusalRequiredFieldMissing required_field_missing = 1;
    // The probe failed for a reason the daemon's classifier could not name.
    frontend.v1.FailureInternalUnclassified unclassified = 2;
  }
  // The feed card this refusal was filed under, when it produced one. See
  // AcceptQueueEntryError.failure_card.
  frontend.v1.FailureCardRef failure_card = 3;
}
