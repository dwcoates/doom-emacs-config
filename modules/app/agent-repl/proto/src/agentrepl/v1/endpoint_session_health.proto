// endpoint_session_health.proto — SessionHealth: is this workspace's session
// healthy? DAEMON ADMIN section. The per-workspace counterpart of
// DaemonHealth; same verdict shape, ITS OWN fault type — a session's fault
// classes are not the daemon's, so SessionFault is deliberately not
// DaemonFault even while both await their derived arms.

syntax = "proto3";

package agentrepl.v1;

import "workspace/v1/workspace.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

message SessionHealthRequest {
  workspace.v1.WorkspaceRef workspace = 1;
}

// THE ARM IS THE OUTCOME. error = the question could not be ANSWERED
// (unknown workspace); UNHEALTHY IS AN ANSWER, never an error.
message SessionHealthResponse {
  oneof result {
    SessionHealthSuccess success = 1;
    SessionHealthError error = 2;
  }
}

// THE ARM IS THE VERDICT.
message SessionHealthSuccess {
  oneof health {
    SessionHealthy healthy = 1;
    SessionUnhealthy unhealthy = 2;
  }
}
message SessionHealthy {}

// Unhealthy: the standing faults, each typed.
message SessionUnhealthy {
  repeated SessionFault faults = 1;
}

// One standing fault — DaemonFault's discipline, the session controller's
// vocabulary. Kinds derived from the controller's real fault sites
// (landing 4, 2026-08-29).
message SessionFault {
  // The dynamic account, verbatim — supplements the kind, never replaces it.
  string detail = 1;
  oneof kind {
    // Starting the session's shim failed.
    SessionFaultShimStartFailed shim_start_failed = 2;
    // The shim exited while the session was live.
    SessionFaultShimDied shim_died = 3;
    // The daemon-shim link was severed.
    SessionFaultLinkSevered link_severed = 4;
    // Resuming the vendor session failed.
    SessionFaultResumeFailed resume_failed = 5;
    // A bounce's replacement shim died before it came up.
    SessionFaultBounceDied bounce_died = 6;
    // A bounce ended in a state the controller cannot name.
    SessionFaultBounceUnknown bounce_unknown = 7;
    // The turn classifier failed.
    SessionFaultClassifierFailed classifier_failed = 8;
    // A shim-side SessionFault, relayed.
    SessionFaultShimReported shim_reported = 9;
    // A recorded conversation whose transcript was gone at bring-up.
    SessionFaultConversationAbandoned conversation_abandoned = 10;
    // The liveness probe's own answer: there is no session here at all.
    SessionFaultSessionAbsent session_absent = 11;
    // The shim refused a watch open for a handle nothing announced.
    SessionFaultWatchOpenRefused watch_open_refused = 12;
    // The daemon's own state client would not answer the fault read.
    SessionFaultDaemonStateUnreadable daemon_state_unreadable = 13;
    // A handover whose adoption window ran out with this workspace unclaimed.
    SessionFaultAdoptionWindowExpired adoption_window_expired = 14;
    // A concluded turn whose answering response the feed could not stand
    // behind, or an open response that went silent.
    SessionFaultFinalAnswerUnresolved final_answer_unresolved = 15;
    // The vendor did not start and the daemon is retrying it on its backoff.
    SessionFaultVendorStartRetrying vendor_start_retrying = 16;
    // The vendor refused the start for a reason retrying cannot fix.
    SessionFaultVendorStartRejected vendor_start_rejected = 17;
    // The vendor kept failing to start for the whole retry window.
    SessionFaultVendorStartFailed vendor_start_failed = 18;
  }
}
message SessionFaultShimStartFailed {
  // The shim's exit code.
  int32 exit_code = 1;
  // The tail of the shim's stderr.
  string stderr_tail = 2;
}
message SessionFaultShimDied {
  // The shim's exit code.
  int32 exit_code = 1;
}
message SessionFaultLinkSevered {}
message SessionFaultResumeFailed {
  // Why the resume failed.
  string cause = 1;
}
message SessionFaultBounceDied {}
message SessionFaultBounceUnknown {}
message SessionFaultClassifierFailed {
  // The classifier's own account of the failure.
  string detail = 1;
}
message SessionFaultShimReported {
  // Which shim component reported it.
  string component = 1;
  // The shim's own kind name.
  string kind = 2;
}

// A recorded conversation whose transcript was gone at bring-up: the session
// came up FRESH and the old vendor session id was left behind. NOT a failure
// to serve — the workspace has a live session — it is the record of what was
// abandoned, which is why it is its own arm and not a resume failure.
message SessionFaultConversationAbandoned {
  // The vendor session id the bring-up abandoned.
  string vendor_session_id = 1;
}

// The LIVENESS PROBE'S OWN observation: this workspace has no live session at
// all. Nothing RAISED it — no shim reported it and no controller opened it, so
// it is never a recorded fault — it is what the probe answers when there is
// nothing there to answer for itself. Empty: the arm is the whole fact.
message SessionFaultSessionAbsent {}

// A shim watch OPEN the shim REFUSED for a handle nothing announced: the
// daemon and the shim disagree about what exists. NOT a severed link — the
// shim answered the open, so the hop is serving and a redial would change
// nothing, which is why it is its own arm beside link_severed.
message SessionFaultWatchOpenRefused {
  // The watch operation whose open was refused.
  string operation = 1;
  // The handle the refused open named.
  string handle = 2;
}

// The health reporter's own fault: the daemon's state client would not answer,
// so the workspace's recorded faults could not be read at all. It says THE
// ANSWER IS INCOMPLETE, not that the session is broken — every other arm here
// is a condition of the session, and this one is a condition of the reporting.
message SessionFaultDaemonStateUnreadable {
  // The state client's own account of the refusal.
  string cause = 1;
}

// A handover whose adoption window ran out with this workspace unclaimed: the
// successor never took it. DaemonFault spells the DAEMON-scoped arm; this is
// the WORKSPACE's own, because the rollout controller records the expiry
// against the workspace it was handing over and the daemon-health filter
// (workspace-bound faults are SessionHealth's answer) passes it here.
message SessionFaultAdoptionWindowExpired {
  // How long the window was, as the controller rendered it ("30s").
  string adoption_window = 1;
}

// THE TURN CONCLUDED AND NO GREEN ANSWER STANDS. A turn's terminal names the
// response that answered it, and the feed draws that row with the green
// final-answer border; this arm is every way that can fail to happen. It is
// NOT a failure to serve — the session is healthy and the prose is on screen —
// it is the record that the workspace cannot point at an answer, which is why
// it stands as the footer's activity line alone and never escalates the
// status.
//
// `why` IS THE SUBSTATUS, and it is carried here rather than in the footer's
// substatus cell on purpose: the footer's substatus is only legal under a
// status the fault CLAIMS, and the two statuses a fault may claim
// (`disconnected`, `blocked`) both say the session cannot be used — which is
// false of every case below, and `disconnected` would close the composer on a
// session that is serving perfectly.
message SessionFaultFinalAnswerUnresolved {
  // The turn whose answer could not be stood behind.
  string turn = 1;
  // The activity id the terminal named as the answer, or the response unit
  // that went silent. EMPTY when the terminal named no answer at all, which
  // is itself one of the `why` values below.
  string unit = 2;
  // WHICH of the three ways it failed, as the daemon's own word:
  //
  //   `no_answer_named`       — the terminal concluded naming no answer while
  //                             this turn had drawn response prose.
  //   `answer_row_unresolved` — the terminal named an answer the feed resolves
  //                             to no drawn, non-thinking response row.
  //   `stalled`               — an open response fold has had no frame and no
  //                             terminal for the stall window.
  //
  // A closed vocabulary, spelled as a string rather than an enum because it is
  // the fault record's own evidence value and the client renders it verbatim
  // beside the kind.
  string why = 3;
}

// Arms derived from the daemon's refusal sites (landing 4, 2026-08-29).
// Validation failures (unset field, UNSPECIFIED enum, blank string) are Connect InvalidArgument, never an arm.
message SessionHealthError {
  oneof cause {
    // The workspace id is not in the daemon's registry.
    SessionHealthUnknownWorkspace unknown_workspace = 1;
    // The echoed dir disagrees with the registry's dir for this id.
    SessionHealthWorkspaceRefMismatch workspace_ref_mismatch = 2;
    // This daemon released the workspace to a successor; dial `address`.
    SessionHealthTransferringAway transferring_away = 3;
    // A joining daemon has not finished adopting this workspace yet.
    SessionHealthNotYetAdopted not_yet_adopted = 4;
  }
}
message SessionHealthUnknownWorkspace {}
message SessionHealthWorkspaceRefMismatch {
  // The dir the registry holds for this id.
  string registry_dir = 1;
}
message SessionHealthTransferringAway {
  // The successor's `127.0.0.1:<port>`, so a lagging client dials it.
  string address = 1;
}
message SessionHealthNotYetAdopted {}

// The session's vendor failed to start for a reason the shim labeled
// RETRYABLE, and the daemon is asking the same shim again on a capped
// multiplicative backoff (x1.5 from 200ms, capped at 5s). The fault is
// replaced on every failed attempt, so it always names the latest attempt; it
// closes when a start succeeds, and gives way to `vendor_start_failed` when
// the retry window runs out or `vendor_start_rejected` when an attempt is
// refused outright.
message SessionFaultVendorStartRetrying {
  // How many attempts have failed so far in this run of failures, counting
  // from 1.
  uint32 failed_attempts = 1;
  // WHY the latest attempt failed, in the shim's own words. Drawn verbatim.
  string cause = 2;
  // When the first failure of this contiguous run happened, in epoch
  // milliseconds. The retry window is measured from here: a successful start
  // ends the run, and the next failure after it begins a new one.
  int64 failing_since_ms = 3;
}

// The session's vendor refused the start for a reason the shim labeled a
// REJECTION (a credential rejection, a missing model, a refused resume, a
// blocking hook): asking again would fail the same way, so nothing retries.
// It stands until a start succeeds, which only a change by the user and a
// restart of the workspace can bring about.
message SessionFaultVendorStartRejected {
  // WHY the vendor refused, in the shim's own words. Drawn verbatim.
  string cause = 1;
}

// The session's vendor failed to start on every attempt for the whole retry
// window (ten minutes of wall time from the first failure of the run), so the
// daemon stopped retrying. Prompts sent meanwhile stay held. It stands until a
// start succeeds; restarting the workspace begins a fresh run.
message SessionFaultVendorStartFailed {
  // How many attempts failed before the window ran out.
  uint32 failed_attempts = 1;
  // WHY the last attempt failed, in the shim's own words. Drawn verbatim.
  string last_cause = 2;
  // When the first failure of the run happened, in epoch milliseconds.
  int64 failing_since_ms = 3;
}
