// endpoint_client_log.proto — the ClientLog endpoint's request and response.
//
// ONE ENDPOINT PER FILE: ClientLogRequest and ClientLogResponse and nothing
// else, so the whole of what one method takes and returns is readable in one
// place. The `endpoint_` prefix is the grouping, not a directory — see
// DESIGN-protobuf-surfaces.md for why a directory is not available here, and for
// why a request type belongs to agentrepl.v1 rather than frontend.v1.

syntax = "proto3";

package agentrepl.v1;

import "agentrepl/v1/frame.proto";
import "agentrepl/v1/shared.proto";
import "google/protobuf/struct.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// A frontend-side diagnostic line, mirrored into the daemon's
// own on-disk log.
//
// WHY THIS EXISTS: the webapp runs inside an Emacs xwidget whose JS console
// nobody can see and nothing persists, so a delivery-path failure there (a
// seq-gap loop, a lost replay request, a stalled rAF) left no evidence
// anywhere at all. A pre-cutover HTTP route carried these; it was deleted with
// the rest of the legacy plane, and this arm restores the capability on the
// protobuf channel instead of reviving a second transport.
//
// The daemon WRITES these, it does not act on them: a client log is evidence,
// never a control signal, and is tagged in the log so a line originating in a
// frontend is never mistaken for one the daemon produced itself.
message ClientLogRequest {
  // Correlation. See AgentRepl in frame.proto.
  string request_id = 1;
  // WHICH WORKSPACE the reporting frontend was showing. A diagnostic line whose
  // workspace nobody recorded is evidence about an unnamed session, which is
  // most of the way to no evidence at all. See AgentRepl in frame.proto.
  string workspace = 2;
  ClientLogLevel level = 3;
  string message = 4;
  // Optional structured payload (ids, counters, timings) accompanying the
  // message. Schemaless on purpose: it is diagnostic evidence whose shape is
  // the reporting call site's business, and pinning a schema here would make
  // adding a diagnostic a proto change.
  google.protobuf.Struct context = 5;
}

// ClientLog's answer: accepted, or the classified account of the refusal.
//
// IT WRAPS CommandAck RATHER THAN BEING CommandAck. Returning the shared ack
// directly gave 33 methods one response type, so no method could gain an answer
// of its own without offering that answer to every other method as well. A log
// line the daemon wrote has no verdict to return beyond whether it was accepted
// at all.
message ClientLogResponse {
  // Whether the daemon accepted this call, and when it did not, the classified
  // failure a frontend renders as a card. See CommandAck.
  CommandAck ack = 1;
}
