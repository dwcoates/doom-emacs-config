// endpoint_client_log.proto — the ClientLog endpoint's request, success and
// error.
//
// ONE ENDPOINT PER FILE: ClientLogRequest, ClientLogResponse and the two
// answers it wraps, and nothing else, so the whole of what one method takes and
// returns is readable in one place. The `endpoint_` prefix is the grouping, not
// a directory — see DESIGN-protobuf-surfaces.md for why a directory is not
// available here, and for why a request type belongs to agentrepl.v1 rather
// than frontend.v1.

syntax = "proto3";

package agentrepl.v1;

import "agentrepl/v1/shared.proto";
import "frontend/v1/failure.proto";
import "google/protobuf/struct.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// A frontend-side diagnostic line, mirrored into the daemon's
// own on-disk log.
//
// WHY THIS EXISTS: the webapp runs inside an Emacs xwidget whose JS console
// nobody can see and nothing persists, so a delivery-path failure there (a
// seq-gap loop, a lost replay request, a stalled rAF) left no evidence
// anywhere at all. A pre-cutover HTTP route carried these; it was deleted with
// the rest of the legacy plane, and this arm restores the capability on the
// protobuf channel instead of reviving a second transport.
//
// The daemon WRITES these, it does not act on them: a client log is evidence,
// never a control signal, and is tagged in the log so a line originating in a
// frontend is never mistaken for one the daemon produced itself.
message ClientLogRequest {
  // Correlation. See agentrepl.v1.AgentRepl.
  string request_id = 1;
  // WHICH WORKSPACE the reporting frontend was showing. A diagnostic line whose
  // workspace nobody recorded is evidence about an unnamed session, which is
  // most of the way to no evidence at all. See agentrepl.v1.AgentRepl.
  string workspace = 2;
  // How loud. A closed vocabulary so a frontend cannot invent a level the
  // daemon has no policy for.
  ClientLogLevel level = 3;
  // The line itself.
  string message = 4;
  // Optional structured payload (ids, counters, timings) accompanying the
  // message. Schemaless on purpose: it is diagnostic evidence whose shape is
  // the reporting call site's business, and pinning a schema here would make
  // adding a diagnostic a proto change.
  google.protobuf.Struct context = 5;
}

// ClientLog's answer: exactly one of a success and an error.
//
// TWO ARMS, NOT AN `ok` BIT PLUS AN OPTIONAL FAILURE — see
// AcceptQueueEntryResponse for the whole of that argument.
message ClientLogResponse {
  // Echoed from the request that produced this answer. See
  // AcceptQueueEntryResponse.request_id.
  string request_id = 1;
  oneof response {
    ClientLogSuccess success = 2;
    ClientLogError error = 3;
  }
}

// The line is in the workspace's log.
//
// NO ARMS, AND NO FIELDS. A log line the daemon wrote has no verdict to return
// beyond whether it was accepted at all: the daemon WRITES these and does not
// act on them, so there is nothing downstream for an answer to report.
message ClientLogSuccess {}

// Why the line was not recorded.
//
// A REFUSED LOG LINE IS STILL A REFUSAL. It would be easy to ack these and move
// on — nothing depends on a diagnostic — but a client whose evidence is being
// silently dropped is a client debugging with a log that lies by omission,
// which is the exact condition this method exists to end.
message ClientLogError {
  oneof error {
    // Client-log persistence is not wired.
    RefusalDependencyUnwired client_logs_unwired = 1;
    // The record arrived against a workspace state that had already moved on.
    FailureClientLogIdentityStale identity_stale = 2;
    // The browser record failed validation before daemon attribution could
    // overwrite the facts the browser cannot authoritatively know.
    RefusalClientLogRecordInvalid record_invalid = 3;
    // A required field of the record was empty.
    RefusalRequiredFieldMissing required_field_missing = 4;
    // The line could not be written.
    RefusalClientLogUnpersisted unpersisted = 5;
    // The write failed for a reason the daemon's classifier could not name.
    frontend.v1.FailureInternalUnclassified unclassified = 6;
  }
  // The feed card this refusal was filed under, when it produced one. See
  // AcceptQueueEntryError.failure_card.
  frontend.v1.FailureCardRef failure_card = 7;
}
