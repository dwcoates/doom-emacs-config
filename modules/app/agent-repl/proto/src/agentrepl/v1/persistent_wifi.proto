// persistent_wifi.proto — THE HOST MACHINE'S PERSISTENT-WIFI STANDING, shared
// by the two endpoints that carry it: WatchDaemon's `persistent_wifi` push
// (what Emacs is told whenever it changes) and UpdatePersistentWifiMode's
// success (what the change left standing).
//
// PERSISTENT WIFI MODE is the laptop's lid-closed operation: system sleep is
// disabled outright, so closing the lid neither sleeps the machine nor drops
// its network, its sessions or a phone hotspot it is joined to. Turning the
// mode on also joins the configured phone hotspot; turning it off leaves it.
// While the mode is on, a closed lid puts the machine in the LID-CLOSED QUIET
// STATE (quiet): the display sleeps, the configured applications are frozen,
// and agent-repl stops drawing views nobody can see, so the battery goes to
// agent work. Opening the lid or turning the mode off ends it. The daemon owns
// both the reading and the change (it is the one process that outlives every
// client).
//
// It is a fact about the MACHINE, never about a workspace, so it rides the
// daemon-level stream and no per-workspace one.

syntax = "proto3";

package agentrepl.v1;

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// The machine's persistent-wifi standing as the daemon last read it: whether
// it is on a Wi-Fi network, and whether closing the lid would keep it awake.
//
// TWO INDEPENDENT FACTS, two oneofs: the mode can be on with no network (the
// lid is safe to close, there is just nothing to keep), and a network can be
// joined with the mode off. Neither one is derived from the other.
//
// EACH ONEOF LEFT UNASSIGNED IS "THE DAEMON COULD NOT READ IT": the read of
// that fact failed (the tool was missing, or answered something the daemon
// could not parse), and the daemon has logged why. A reader draws the fact as
// unknown rather than guessing either arm.
//
// The daemon re-reads both facts on a short fixed cadence and immediately
// after every UpdatePersistentWifiMode, and publishes only on a change, so a
// change made outside agent-repl (a network dropping, `pmset` run by hand) is
// reflected within one cadence.
message PersistentWifiState {
  // Whether the machine's Wi-Fi interface is joined to a network right now.
  oneof wifi {
    PersistentWifiJoined joined = 1;
    PersistentWifiNotJoined not_joined = 2;
  }
  // Whether persistent wifi mode is in force — whether closing the lid keeps
  // the machine awake and its network up.
  oneof mode {
    PersistentWifiModeOn on = 3;
    PersistentWifiModeOff off = 4;
  }
  // The built-in display's lid, as the operating system last reported it. The
  // daemon HEARS the lid (an IOKit clamshell notification) rather than polling
  // it, reading its state once when it subscribes and taking every change
  // after. UNASSIGNED only between the daemon's first read and that
  // subscription, an instant at boot: a reader draws it as not yet heard.
  oneof lid {
    PersistentWifiLidOpen lid_open = 5;
    PersistentWifiLidClosed lid_closed = 6;
    PersistentWifiNoLid no_lid = 7;
    PersistentWifiLidUnwatched lid_unwatched = 8;
  }
  // Field 9 is retired and never reused.
  reserved 9;
  reserved "lid_dim";
  // The lid-closed quiet state in force: the lid is closed (heard) and the
  // mode is on. UNSET while either is not so, and while the lid is not heard
  // (unheard or unwatched), so a lid nobody hears never freezes anything.
  // Readers that draw views (Emacs, the webapp pages) stop their animation,
  // redraw and polling work while it is set, and draw current state at once
  // when it clears; the daemon stops resolving the views those readers show
  // for the same span. Session work is never part of it.
  optional PersistentWifiQuiet quiet = 10;
}

// The Wi-Fi interface has an active link to a network.
message PersistentWifiJoined {
  // The network's name, verbatim. UNSET when the operating system withholds
  // it: macOS redacts network names from processes without a location-services
  // grant, so on such a host the daemon knows a network is joined but not
  // which one.
  optional string network_name = 1;
}

// The Wi-Fi interface has no active link: the radio is off, or on and joined
// to nothing.
message PersistentWifiNotJoined {}

// System sleep is disabled: the lid can be closed without sleeping the
// machine or losing its network.
message PersistentWifiModeOn {}

// System sleep is enabled: closing the lid sleeps the machine and drops its
// network.
message PersistentWifiModeOff {}

// The lid is open.
message PersistentWifiLidOpen {}

// The lid is closed.
message PersistentWifiLidClosed {}

// The machine reports no lid (a desktop Mac): the display never follows a lid.
message PersistentWifiNoLid {}

// The daemon is NOT hearing the lid: its subscription to the operating
// system's lid notifications could not be made, or ended while the daemon
// ran. There is no polling fallback, so while this arm stands the display
// does not follow the lid; the daemon has logged the cause at ERROR.
message PersistentWifiLidUnwatched {
  // Why the lid is not heard, verbatim from the failed subscription.
  string detail = 1;
}

// The lid-closed quiet state, as the daemon holds it.
message PersistentWifiQuiet {
  // Every configured application the quiet state froze (SIGSTOP), in the
  // configured order: each keeps its memory and windows, uses no CPU, and is
  // thawed (SIGCONT) when the state ends. An application that was not running
  // when the lid closed is absent: one launched while the lid is closed is
  // never chased. Empty when nothing configured was running.
  repeated PersistentWifiFrozenApp frozen_apps = 1;
  // Whether the built-in display was put to sleep for the closed lid.
  oneof display {
    PersistentWifiQuietDisplayAsleep display_asleep = 2;
    PersistentWifiQuietDisplayAwake display_awake = 3;
  }
}

// One frozen application.
message PersistentWifiFrozenApp {
  // The application's name as configured (its bundle's name, such as
  // "Google Chrome").
  string name = 1;
  // How many of its processes (the application and its helpers) are frozen.
  uint32 processes = 2;
}

// The display was put to sleep when the quiet state began. It wakes at the
// brightness it had when the lid opens.
message PersistentWifiQuietDisplayAsleep {}

// The display could not be put to sleep; the daemon logged why at ERROR and
// tries again on the next lid or mode change.
message PersistentWifiQuietDisplayAwake {
  // Why the sleep failed, verbatim from the tool.
  string detail = 1;
}
