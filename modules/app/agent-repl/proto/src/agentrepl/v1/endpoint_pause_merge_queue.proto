// endpoint_pause_merge_queue.proto — the PauseMergeQueue endpoint's request,
// success and error.
//
// ONE ENDPOINT PER FILE: PauseMergeQueueRequest, PauseMergeQueueResponse and
// the two answers it wraps, and nothing else, so the whole of what one method
// takes and returns is readable in one place. The `endpoint_` prefix is the
// grouping, not a directory — see DESIGN-protobuf-surfaces.md for why a
// directory is not available here, and for why a request type belongs to
// agentrepl.v1 rather than frontend.v1.

syntax = "proto3";

package agentrepl.v1;

import "frontend/v1/failure.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// Pause the merge queue: the run in flight finishes, nothing new dequeues.
// Durable across bounces. Idempotent. DAEMON-GLOBAL — which is why the request
// names no workspace at all, rather than naming one the receiver ignores.
message PauseMergeQueueRequest {
  // Correlation. See agentrepl.v1.AgentRepl.
  string request_id = 1;
}

// PauseMergeQueue's answer: exactly one of a success and an error.
//
// TWO ARMS, NOT AN `ok` BIT PLUS AN OPTIONAL FAILURE — see
// AcceptQueueEntryResponse for the whole of that argument.
message PauseMergeQueueResponse {
  // Echoed from the request that produced this answer. See
  // AcceptQueueEntryResponse.request_id.
  string request_id = 1;
  oneof response {
    PauseMergeQueueSuccess success = 2;
    PauseMergeQueueError error = 3;
  }
}

// The pause bit is set.
//
// NO ARMS. The pause is idempotent, so "it was already paused" is not a second
// outcome an answer could usefully distinguish — the state after the call is
// the same either way, and it is pushed on MergeQueueRoster.paused.
message PauseMergeQueueSuccess {}

// Why the pause was refused.
//
// ONLY THE FUNNEL, AND THAT IS AN HONEST GAP RATHER THAN A COMPLETE SET. This
// daemon has no PauseMergeQueue handler at all, so there is no refusal path to
// derive arms from: an idempotent, daemon-global bit flip has no stated
// condition that declines it. Arms are added here when the handler that can
// refuse exists — not guessed at now, because a guessed arm is a contract
// promise nothing keeps.
message PauseMergeQueueError {
  oneof error {
    // The pause failed for a reason the daemon's classifier could not name.
    frontend.v1.FailureInternalUnclassified unclassified = 1;
  }
  // The feed card this refusal was filed under, when it produced one. See
  // AcceptQueueEntryError.failure_card.
  frontend.v1.FailureCardRef failure_card = 2;
}
