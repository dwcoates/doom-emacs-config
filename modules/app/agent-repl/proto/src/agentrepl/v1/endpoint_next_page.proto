// endpoint_next_page.proto — the NextPage endpoint's request, success and
// error.
//
// ONE ENDPOINT PER FILE: NextPageRequest, NextPageResponse and the two answers
// it wraps, and nothing else, so the whole of what one method takes and returns
// is readable in one place. The `endpoint_` prefix is the grouping, not a
// directory — see DESIGN-protobuf-surfaces.md for why a directory is not
// available here, and for why a request type belongs to agentrepl.v1 rather
// than frontend.v1.

syntax = "proto3";

package agentrepl.v1;

import "agentrepl/v1/shared.proto";
import "frontend/v1/failure.proto";
import "frontend/v1/feed.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// Ask for the page IMMEDIATELY OLDER than the last one served to this reader.
//
// IT CARRIES NO POSITION, and that absence is the design. From a reader with no
// established position it is REFUSED rather than answered with the tail:
// defaulting would turn a client bug into a silent tail read, and "I have no
// position" already has its own verb.
message NextPageRequest {
  // Correlation. See FirstPageRequest.request_id.
  string request_id = 1;
  // WHICH READER, and therefore whose position is being walked back and which
  // stream the page arrives on. See FirstPageRequest.client_id.
  string client_id = 2;
  // Which conversation's position is being walked back.
  string workspace = 3;
  // WHICH CONTAINER to walk back through. It names the scope, never a position
  // within it — the daemon still owns where this reader is inside that scope,
  // so the no-position rule above is untouched.
  //
  // Unset is NOT a default and is REFUSED, exactly as on FirstPageRequest: a
  // load-more that forgot which container it belongs to must not silently walk
  // back through the feed instead.
  frontend.v1.PageScope scope = 4;
}

// NextPage's answer: exactly one of a success and an error.
//
// TWO ARMS, NOT AN `ok` BIT PLUS AN OPTIONAL FAILURE — see
// AcceptQueueEntryResponse for the whole of that argument.
message NextPageResponse {
  // Echoed from the request that produced this answer. See
  // AcceptQueueEntryResponse.request_id.
  string request_id = 1;
  oneof response {
    NextPageSuccess success = 2;
    NextPageError error = 3;
  }
}

// The older page is served and this reader's position has moved back to it.
//
// NO ARMS, AND NO PAGE. It arrives on the stream, as FirstPage's does. There is
// also no end-of-history arm: whether the page just served was the last one is
// a property of the PAGE, stated on the ConversationHistoryPage itself, not of
// the call that asked for it.
message NextPageSuccess {}

// Why no page was served.
message NextPageError {
  oneof error {
    // The call carries no reader identity.
    RefusalReaderIdentityMissing reader_identity_missing = 1;
    // The request does not state its scope.
    RefusalRequiredFieldMissing required_field_missing = 2;
    // This reader has no established position in this scope. THE ARM THIS
    // METHOD EXISTS TO HAVE: it is what makes "answer with the tail" an
    // unreachable behavior rather than a discouraged one.
    RefusalReaderHasNoPosition reader_has_no_position = 3;
    // No resyncer is wired, so the conversation history page cannot be served
    // at all.
    RefusalDependencyUnwired resyncer_unwired = 4;
    // The workspace's live connection changed under this view.
    FailureReconnectSuperseded reconnect_superseded = 5;
    // The page could not be read.
    RefusalReplayFailed page_failed = 6;
    // The daemon produced neither a page nor a failure.
    RefusalPageAbsent page_absent = 7;
    // The read failed for a reason the daemon's classifier could not name.
    frontend.v1.FailureInternalUnclassified unclassified = 8;
  }
  // The feed card this refusal was filed under, when it produced one. See
  // AcceptQueueEntryError.failure_card.
  frontend.v1.FailureCardRef failure_card = 9;
}
