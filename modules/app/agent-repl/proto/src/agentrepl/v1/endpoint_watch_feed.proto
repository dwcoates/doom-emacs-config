// endpoint_watch_feed.proto — WatchFeed: one feed's live tail. FEED section.
// ONE connection per OPEN feed — the root feed while the workspace view is
// up, plus one per expanded subagent bubble — so THE CONNECTION IS THE
// PLACEMENT: every row on a stream belongs to the feed its token named, and
// no frame carries a feed address. History is OpenFeed's page and
// GetFeedPage's walk; this stream is what changes NOW.
//
// THE STREAM IS STANDING: it spans turns (a turn's end arrives as the
// FeedTurnEnded ROW, never as this stream concluding), and it ends only when
// the client cancels it (collapsing a bubble, closing the view). A stream
// ending any other way is a TRANSPORT FAILURE — re-entered by re-opening the
// feed — which is exactly what keeps a dropped pipe distinguishable from
// every real ending. Views only ride streams — there is no keepalive frame,
// and a refused open closes the stream at the transport.

syntax = "proto3";

package agentrepl.v1;

import "frontend/v1/feed.proto";
import "frontend/v1/feed_held.proto";
import "frontend/v1/feed_image_overlay.proto";
import "agentrepl/v1/feed_token.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// Opens the tail of the ONE feed the token names.
message WatchFeedRequest {
  // The token OpenFeed minted, echoed verbatim. Workspace-scoped by mint, so
  // the request carries no WorkspaceRef of its own.
  FeedWatchToken watch = 1;
}

// One feed row upsert, delivered live: a new row, or a whole replacement of
// one already shown (a growing response's re-push, a settled tool card, a
// task bubble another act touched). The client upserts by FeedRow.id.
//
// A frame carries EXACTLY ONE of a row upsert (`row`), a response-selection
// push (`selection`), a feed-text-scale push (`feed_text_scale`), a
// held-section change (`held`), or an image-overlay push (`image_overlay`),
// never more than one. The selection push is the daemon's per-workspace
// reply-to-a-past-response state (reply-to-a-past-response mode), pushed on
// the ROOT feed's watch so the webapp recolors the selected final-response
// bubble, center-scrolls it, and suppresses tail-follow while a selection is
// active. The feed-text-scale push is the daemon-global zoom (frontend.v1.FeedTextScale),
// pushed on EVERY open feed's watch — root and expanded subagent sub-feeds
// alike, since all of them draw feed text — so the webapp re-scales it. Row
// upserts still travel with their own feedids (FeedRow.id), so a selection
// frame naming feedids of ROWS keeps the stream's "the connection is the
// placement" invariant intact — it names rows within this feed, not a second
// feed.
message WatchFeedResponse {
  // The upserted row, whole. Set on a row-upsert frame; unset otherwise.
  frontend.v1.FeedRow row = 1;
  // The response-selection state, whole. Set on a selection frame; unset
  // otherwise. Pushed on the root feed's watch only.
  optional frontend.v1.FeedSelection selection = 2;
  // The feed text scale (zoom), whole. Set on a feed-text-scale frame; unset
  // otherwise. Pushed on every open feed's watch, root and sub-feed alike.
  optional frontend.v1.FeedTextScale feed_text_scale = 3;
  // The root feed's held section changed. Set on a held-section frame; unset
  // otherwise. Carried on the ROOT feed's watch only, in publication order
  // with its rows, so a tail opened at OpenFeed's pin misses no change of the
  // section either.
  optional WatchFeedHeldChange held = 4;
  // The workspace's image overlay, whole. Set on an image-overlay frame;
  // unset otherwise. Carried on the ROOT feed's watch only, and the current
  // overlay is sent the moment a root watch is accepted, so a page that opens
  // late draws what is open.
  optional frontend.v1.FeedImageOverlay image_overlay = 5;
}

// One change of the root feed's held section: the section as it now stands,
// and every row that moved between the section and the rows in the same change.
//
// ONE FRAME, SO AN ITEM IS NEVER DRAWN TWICE OR NOT AT ALL. An item that
// settles leaves the section and becomes a row in this one frame; a client
// applies `rows` and `held` together, before it draws, and never draws a state
// in which the item is in both places or in neither.
message WatchFeedHeldChange {
  // The held section, whole. Replaces the section the client holds.
  frontend.v1.FeedHeld held = 1;
  // The row publications made in the same change, in order: the row an item
  // settled as (keyed at the moment it settled, the bottom of the feed, and
  // carrying the item's own FeedId), or the removal of a row whose item
  // returned to the section (a prompt's acceptance withdrawn when its
  // delivery found no session). These rows ride ONLY here, never also as
  // `row` frames. Empty when the change only reshaped the section.
  repeated frontend.v1.FeedRow rows = 2;
  // THE FOLDS THIS CHANGE MADE: every held prompt that left the section in
  // this change because it was folded into the entry ahead of it, whether the
  // user folded it (FoldHeldPrompt) or the classifier coalesced it. Empty
  // when no prompt was folded.
  //
  // A CHANGE, NOT A STATE, so it rides only here and never on OpenFeed's
  // section: a reader that opens after the fold sees the merged entry and
  // nothing to animate. A client flashes the entry folded into once, and,
  // when it was drawing the folded prompt's card, shows that card for a
  // moment with a "folding above" badge before taking it down. A folded
  // prompt a client never drew is not drawn now.
  repeated WatchFeedHeldFold folds = 3;
}

// One held prompt folded into the held entry directly ahead of it.
message WatchFeedHeldFold {
  // The folded prompt's held item id (FeedHeldItem.id), absent from `held`
  // in the same change. REQUIRED.
  frontend.v1.FeedId folded = 1;
  // The held item id of the entry it was folded into, which now carries both
  // prompts' content. REQUIRED. Not always drawn: an entry of an origin the
  // section draws no card for takes a fold all the same.
  frontend.v1.FeedId into = 2;
}
