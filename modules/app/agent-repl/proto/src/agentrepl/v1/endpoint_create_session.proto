// endpoint_create_session.proto — the CreateSession endpoint's request, success
// and error.
//
// ONE ENDPOINT PER FILE: CreateSessionRequest, CreateSessionResponse and the
// two answers it wraps, and nothing else, so the whole of what one method takes
// and returns is readable in one place. The `endpoint_` prefix is the grouping,
// not a directory — see DESIGN-protobuf-surfaces.md for why a directory is not
// available here, and for why a request type belongs to agentrepl.v1 rather
// than frontend.v1.

syntax = "proto3";

package agentrepl.v1;

import "agentrepl/v1/shared.proto";
import "frontend/v1/failure.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// Bring a session up for a workspace. HOST SURFACE: a rendering frontend has
// no session vocabulary and never calls this.
message CreateSessionRequest {
  // Correlation. See agentrepl.v1.AgentRepl.
  string request_id = 1;
  // THE WORKSPACE, spelled `cwd` because that is what a session is created
  // against. It is NOT accompanied by a second `workspace` field: the daemon's
  // workspace key IS the session's absolute cwd, and two spellings of one path
  // is two things a caller can disagree with itself about.
  string cwd = 2;
  // The permission posture the session runs under.
  string permission_mode = 3;
  // The CLAUDE_CONFIG_DIR the caller believes applies. The DAEMON decides the
  // account and may disagree with this — see RefusalAccountUnresolvable for
  // what it is resolving against and why a frame's answer cannot be trusted.
  string config_dir = 4;
  // Run the session against the offline scripted SDK (test harness sessions).
  // A PROPERTY OF THE SESSION, NOT A MODE OF THE REQUEST — see
  // OpenWorkspaceRequest.fake.
  bool fake = 5;
  // The caller's DELIBERATE consent to create a session with NO permission
  // gate. Required whenever permission_mode names a mode that shadows the
  // shim's canUseTool callback in the fail-OPEN direction
  // (bypassPermissions): under such a mode the SDK auto-approves every tool
  // before canUseTool is consulted, so the daemon's whole permission
  // round-trip never engages and no permission card can ever appear.
  //
  // The daemon REFUSES such a create without this flag. The mode is otherwise
  // one string away from every ordinary create, and "reachable by a typo" is
  // not an acceptable property for the switch that turns the gate off. It is
  // a create-time consent only: a session already registered in that mode
  // still rehydrates after a daemon restart, since refusing there would
  // silently change a live session's posture.
  //
  // IT STAYS A BOOL, and the mode-flag rule was applied to it before it was
  // left alone. A consent flag is exactly the kind of bool that can lie — but
  // the act it attests to is the caller's own, not a prior round-trip with this
  // daemon, so there is no second request it could falsely claim to be a resend
  // of. What makes it safe is that it is REQUIRED and refused when absent,
  // which an arm would not improve on.
  bool allow_ungated = 6;

  // The model this session should START on, empty to accept the shim's own
  // default.  A caller that has a remembered selection would otherwise have to
  // create and then immediately SetModel, which races: the session is live and
  // driveable in between, so its first turn can run on the wrong model.
  //
  // This does NOT make the caller authoritative.  The daemon applies it through
  // the same SetModel path a later change takes, once the shim is wired, and
  // still publishes only the shim-confirmed selection.  A rejected model fails
  // the create rather than silently leaving the session on another one.
  string model = 7;

  // Which conversation to land on. See ResumeMode: this is intent, and the
  // daemon does the resolving.
  //
  // IT STAYS AN ENUM AND IS NOT CONVERTED TO ARMS. The mode-flag rule targets a
  // bool that a caller can set without having done the thing it asserts;
  // ResumeMode is already an explicit closed choice whose whole existing
  // argument is that "say nothing" and "start fresh" must be different wire
  // values, and whose retired tag 2 must remain REFUSABLE rather than
  // unrepresentable — an out-of-date client that asked to abandon a
  // conversation is told its request no longer exists, which a oneof could not
  // do because the field would simply vanish on decode.
  ResumeMode resume_mode = 8;

  // The conversation to land on, and ONLY meaningful under
  // RESUME_MODE_EXPLICIT. The daemon rejects a create that sets this under any
  // other mode rather than quietly ignoring it, because a caller that filled
  // this in believes it is steering and must be told it is not.
  string explicit_claude_session_id = 9;
}

// CreateSession's answer: exactly one of a success and an error.
//
// TWO ARMS, NOT AN `ok` BIT PLUS AN OPTIONAL FAILURE — see
// AcceptQueueEntryResponse for the whole of that argument.
message CreateSessionResponse {
  // Echoed from the request that produced this answer. See
  // AcceptQueueEntryResponse.request_id.
  string request_id = 1;
  oneof response {
    CreateSessionSuccess success = 2;
    CreateSessionError error = 3;
  }
}

// The create completed. WHICH OF THE TWO COMPLETED CREATES it was is the arm.
//
// THE DISTINCTION IS NOT COSMETIC. An established create has a wired, healthy
// shim behind it and is immediately driveable; a hibernated one has NO SHIM AT
// ALL and stands behind the revival gate, so a caller that prompts it
// straight away is nacked. Reporting both as a bare success is how a create
// came to claim a healthy shim for a session that had none.
message CreateSessionSuccess {
  oneof outcome {
    // The shim is wired and healthy.
    CreateSessionEstablished established = 1;
    // No shim was spawned and the revival gate stands. The record keeps its
    // persisted model; a requested model is applied by the revival, not by this
    // create.
    CreateSessionHibernated hibernated = 2;
  }

  // FOR OBSERVABILITY ONLY: the vendor conversation uuid the created session
  // actually landed on, so a client can attribute its logs from its very first
  // line instead of waiting for the first pushed SessionView.
  //
  // A CLIENT MUST NOT PERSIST THIS OR FEED IT BACK. It is an observation of
  // daemon state at one instant, not a durable fact: the uuid ROTATES (a
  // /clear or a compact starts a new vendor conversation and resets the
  // cursors with it), so a stored copy is wrong from the next rotation
  // onward. The steady-state source is the pushed SessionView, which tracks
  // rotations; this field only covers the gap before the first push.
  //
  // Feeding it back is what this whole change removed — see ResumeMode. The
  // rule is not enforceable from here, so it is also enforced where it
  // matters: the Emacs frontend has no persistence path that can reach a
  // vendor uuid, and a test asserts its state file never contains one.
  string observed_claude_session_id = 3;
}

// The session is up and its shim is wired and healthy — proved by the daemon's
// own establishment probe, not inferred from the create returning.
message CreateSessionEstablished {}

// The session was registered and met the revival gate at bring-up, so nothing
// was spawned for it. Being set asserts that a prompt sent now will be nacked
// until the user makes a revival decision.
message CreateSessionHibernated {}

// Why the create was refused.
//
// THE FIRST SIX ARMS ARE THE RESUME LADDER, in the order it walks. Every one of
// them exists to keep one rule: a workspace's conversation is not replaceable
// by a caller, and a fresh conversation may exist only for a workspace the
// daemon can PROVE never had one. Silently starting fresh on top of an intact
// transcript is the data loss this whole ladder was built after.
message CreateSessionError {
  oneof error {
    // The create names a conversation under a mode that may not name one.
    RefusalExplicitConversationUnderWrongMode explicit_under_wrong_mode = 1;
    // RESUME_MODE_FRESH is retired: a caller may no longer ask for a
    // workspace's conversation to be replaced. Named and refused rather than
    // read as CONTINUE, and rather than reported as an unknown mode — the
    // client is out of date, not broken.
    FailureResumeModeRetired resume_mode_retired = 2;
    // RESUME_MODE_EXPLICIT with no conversation named.
    RefusalRequiredFieldMissing required_field_missing = 3;
    // No conversation resolver is wired. Refused rather than starting fresh:
    // the data loss must not be reachable by forgetting to inject a dependency.
    RefusalDependencyUnwired conversation_resolver_unwired = 4;
    // The resolver named no resumable conversation AND the daemon's own durable
    // record does not prove this workspace never had one.
    FailureConversationUnresumable conversation_unresumable = 5;
    // The create carries a resume mode this daemon's enum does not contain.
    RefusalResumeModeUnknown resume_mode_unknown = 6;
    // The account for this workspace could not be resolved.
    RefusalAccountUnresolvable account_unresolvable = 7;
    // The session health router is not wired, so the daemon cannot prove the
    // shim is established.
    RefusalDependencyUnwired health_router_unwired = 8;
    // Bring-up did not finish connecting in time.
    FailureSessionNotEstablished session_not_established = 9;
    // The establishment probe answered for a different request.
    RefusalEstablishmentProbeMisattributed probe_misattributed = 10;
    // The session could not be started at all.
    frontend.v1.FailureSessionStartFailed session_start_failed = 11;
    // The vendor conversation could not be resumed without breaking
    // continuity. SHARED EVIDENCE with the drawn arm of the same shape; here
    // its `attempt` is the create arm.
    frontend.v1.FailureSessionResumeFailed session_resume_failed = 12;
    // The session came up but the model the create asked for could not be
    // applied, so the create is failed rather than left on another model.
    RefusalModelNotApplied model_not_applied = 13;
    // The create failed for a reason the daemon's classifier could not name.
    frontend.v1.FailureInternalUnclassified unclassified = 14;
  }
  // The feed card this refusal was filed under, when it produced one. See
  // AcceptQueueEntryError.failure_card.
  frontend.v1.FailureCardRef failure_card = 15;
}
