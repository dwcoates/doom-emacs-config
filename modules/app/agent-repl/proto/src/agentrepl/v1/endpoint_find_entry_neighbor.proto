// endpoint_find_entry_neighbor.proto — FindEntryNeighbor: the label an entry
// line opened beside another should answer. FEED section.
//
// Emacs calls it when the person opens a line from an entry line in command
// mode (`o` below, `O` above), and fills the new line with the label the
// daemon names, so the next entry answers the next node of the same tree. It
// calls it too when the person presses `C-o` or `C-i` on an entry line, and
// relabels that entry with the label the daemon names, its words kept: `C-o`
// moves the entry one node on in reading order (`3.2 - ` becomes `3.2.1 - `,
// or `3.3 - ` when 3.2 has no child), and `C-i` moves it back, to the node's
// previous sibling (`3.2 - ` becomes `3.1 - `), else up to its parent
// (`3.1 - ` becomes `3 - `), the way `O` opens a line.
//
// THE TREE IS THE RESPONSE THE ENTRY TARGETS, by the rule the composer's
// entries are bound by (endpoint_report_composer_entries.proto): the selected
// response bubble when one is selected, else the newest response on the root
// feed whose tree holds the label. The neighbor is found in that tree:
//   - `next`: the node's next sibling; else its parent's next sibling, and so
//     on up its ancestors;
//   - `previous`: the node's previous sibling; else its parent; the first
//     root has none;
//   - `following`: the node read after it: its first child; else what `next`
//     names.
// The answer is for the label the request names, so it holds for the line the
// key was pressed on whatever the composer has reported since.

syntax = "proto3";

package agentrepl.v1;

import "workspace/v1/workspace.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

message FindEntryNeighborRequest {
  // The workspace whose composer asks — the daemon-minted ref, echoed
  // verbatim like every per-workspace request.
  workspace.v1.WorkspaceRef workspace = 1;
  // The label of the entry line the key was pressed on, as written. REQUIRED
  // and never empty — empty is Connect InvalidArgument.
  string label = 2;
  // Which neighbor of the node is asked for. REQUIRED — unset is Connect
  // InvalidArgument.
  EntryNeighborDirection direction = 3;
}

// Which neighbor of the node is asked for. THE ARM IS THE DIRECTION.
message EntryNeighborDirection {
  oneof way {
    // The node a line opened below the entry line answers (`o`).
    EntryNeighborNext next = 1;
    // The node a line opened above the entry line answers (`O`), and the
    // node the entry answers instead once it steps back (`C-i`).
    EntryNeighborPrevious previous = 2;
    // The node the entry answers instead once it steps on (`C-o`).
    EntryNeighborFollowing following = 4;
  }
  // `first_child` (3) was `C-o`'s way until `C-o` went on past a childless
  // node; `following` replaced it. `parent` (5) was `C-i`'s way until `C-i`
  // stepped back to the previous sibling first; `previous` replaced it.
  reserved 3, 5;
  reserved "first_child", "parent";
}

message EntryNeighborNext {}

message EntryNeighborPrevious {}

message EntryNeighborFollowing {}

// THE ARM IS THE OUTCOME.
message FindEntryNeighborResponse {
  oneof result {
    FindEntryNeighborSuccess success = 1;
    FindEntryNeighborError error = 2;
  }
}

// What the new line answers. THE ARM IS THE ANSWER: no neighbor is an answer,
// never a failure.
message FindEntryNeighborSuccess {
  oneof neighbor {
    // The label the new line answers.
    FindEntryNeighborFound found = 1;
    // The label targets no response, or its node has no neighbor that way:
    // the line opens empty, or the entry keeps its label.
    FindEntryNeighborNone none = 2;
  }
}

message FindEntryNeighborFound {
  // The neighbor's label, as the response's tree carries it. Never empty.
  string label = 1;
}

message FindEntryNeighborNone {}

message FindEntryNeighborError {
  oneof cause {
    // The workspace id is not in the daemon's registry.
    FindEntryNeighborUnknownWorkspace unknown_workspace = 1;
    // The echoed dir disagrees with the registry's dir for this id.
    FindEntryNeighborWorkspaceRefMismatch workspace_ref_mismatch = 2;
    // This daemon released the workspace to a successor; dial `address`.
    FindEntryNeighborTransferringAway transferring_away = 3;
    // A joining daemon has not finished adopting this workspace yet.
    FindEntryNeighborNotYetAdopted not_yet_adopted = 4;
  }
}

// The workspace id is not in the daemon's registry.
message FindEntryNeighborUnknownWorkspace {}
// The echoed dir disagrees with the registry's dir for this id.
message FindEntryNeighborWorkspaceRefMismatch {
  // The dir the registry holds for this id.
  string registry_dir = 1;
}
// This daemon released the workspace to a successor.
message FindEntryNeighborTransferringAway {
  // The successor's `127.0.0.1:<port>`, so a lagging client dials it.
  string address = 1;
}
// A joining daemon has not finished adopting this workspace yet.
message FindEntryNeighborNotYetAdopted {}
