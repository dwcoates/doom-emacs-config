// endpoint_delete_session.proto — the DeleteSession endpoint's request, success
// and error.
//
// ONE ENDPOINT PER FILE: DeleteSessionRequest, DeleteSessionResponse and the
// two answers it wraps, and nothing else, so the whole of what one method takes
// and returns is readable in one place. The `endpoint_` prefix is the grouping,
// not a directory — see DESIGN-protobuf-surfaces.md for why a directory is not
// available here, and for why a request type belongs to agentrepl.v1 rather
// than frontend.v1.

syntax = "proto3";

package agentrepl.v1;

import "agentrepl/v1/shared.proto";
import "frontend/v1/failure.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// Session teardown over UDS (replaces DELETE /sessions/{id}).
message DeleteSessionRequest {
  // Correlation. See agentrepl.v1.AgentRepl. Session teardown is addressed by
  // identity, not by workspace: the session may already have outlived the
  // workspace binding a key would resolve through.
  string request_id = 1;
  // The session to tear down.
  string session_id = 2;
}

// DeleteSession's answer: exactly one of a success and an error.
//
// TWO ARMS, NOT AN `ok` BIT PLUS AN OPTIONAL FAILURE — see
// AcceptQueueEntryResponse for the whole of that argument.
message DeleteSessionResponse {
  // Echoed from the request that produced this answer. See
  // AcceptQueueEntryResponse.request_id.
  string request_id = 1;
  oneof response {
    DeleteSessionSuccess success = 2;
    DeleteSessionError error = 3;
  }
}

// The session is marked terminal and its shim is stopped.
//
// NO ARMS, AND NO FIELDS. The session's disappearance from the catalog is
// observed on the stream.
message DeleteSessionSuccess {}

// Why the teardown was refused.
//
// THIS ARM SET IS THE THINNEST ON THE SERVICE, and deliberately so rather than
// by omission: the handler does no validation of its own and returns whatever
// the session registry gives it, so there is exactly one derived condition
// (the teardown itself failing) plus the classifier's funnel. Inventing a
// richer set here would be describing refusals no code performs.
message DeleteSessionError {
  oneof error {
    // Tearing the session down failed — including the case of a session id the
    // registry does not know, which the registry reports as a teardown failure
    // rather than as a distinct condition.
    RefusalSessionTeardownFailed teardown_failed = 1;
    // The teardown failed for a reason the daemon's classifier could not name.
    frontend.v1.FailureInternalUnclassified unclassified = 2;
  }
  // The feed card this refusal was filed under, when it produced one. See
  // AcceptQueueEntryError.failure_card.
  frontend.v1.FailureCardRef failure_card = 3;
}
