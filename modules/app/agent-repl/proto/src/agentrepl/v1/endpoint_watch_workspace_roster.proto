// endpoint_watch_workspace_roster.proto — WatchWorkspaceRoster: the sidebar's
// stream. SIDEBAR section. THE ONE GLOBAL STREAM: no workspace — every
// webview watches the same roster, and the daemon's stream order is the only
// order. The response wraps frontend.v1.WorkspaceRoster itself, whole.

syntax = "proto3";

package agentrepl.v1;

import "agentrepl/v1/daemon_stream_ending.proto";
import "frontend/v1/sidebar.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// Opens the stream. Empty on purpose: the roster is global.
message WatchWorkspaceRosterRequest {}

// The current roster, delivered live.
message WatchWorkspaceRosterResponse {
  // What this frame carries: the roster, or the planned end of the stream.
  oneof push {
    // The whole roster, re-pushed on every change.
    frontend.v1.WorkspaceRoster roster = 1;
    // The daemon is standing down in a planned exit and this is the stream's
    // last frame; the client reattaches to the live daemon without treating
    // the end as a fault. See the message.
    DaemonStreamEnding ending = 2;
  }
}
