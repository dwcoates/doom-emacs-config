// endpoint_open_tabs.proto — OpenTabs. HOST section.
//
// THE EDITOR ASKS, THE DAEMON OPENS, THE EDITOR SHOWS. Emacs never shows a
// workspace's tab until the daemon says everything the workspace needs is
// loaded: its conversation is read from the store and its web page has drawn
// it. AN OPEN NEVER WAITS ON A SHIM, AND STARTS NONE (owner ruling,
// 2026-10-28): a prompt brings the shim up, held "after loading" until it
// is, so opening, switching and prompting never wait on one. Emacs asks for
// the workspaces it wants open with this call, loads each visible
// workspace's page at the same moment (the page reports itself drawn with
// ReportPageDrawn), and shows each tab when its `opened` frame arrives, at its
// place in the registry's tab order, never waiting on any other workspace.
//
// The same call serves every open: the editor's startup (every registered
// open workspace at once), and any later one (a workspace created, reopened,
// unhidden, or whose repository section was expanded).
//
// ONLY VISIBLE WORKSPACES ARE OPENED. A workspace the user hid, or whose
// repository section is collapsed, is answered `opened` at once with its
// `hidden` arm; it is opened when it is shown again, which the editor asks for
// with another OpenTabs.
//
// Every step of every workspace's open is a typed frame on this stream, so the
// editor reports progress as one minibuffer line per step. A bring-up some
// other cause has under way (a boot's, a prompt's) is relayed as steps too,
// and never waited for.
syntax = "proto3";

package agentrepl.v1;

import "frontend/v1/sidebar.proto";
import "workspace/v1/workspace.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// The workspaces the editor wants open.
message OpenTabsRequest {
  // Each workspace once, in any order: the daemon answers each as it is
  // ready, and the editor places tabs by the registry's order, never by this
  // list's. An empty list is a malformed request (Connect InvalidArgument).
  repeated OpenTabsWorkspace workspaces = 1;
}

// One workspace the editor wants open.
message OpenTabsWorkspace {
  // The workspace, echoed from its roster row.
  workspace.v1.WorkspaceRef workspace = 1;
  // WHETHER THE EDITOR DRAWS A WEB PAGE FOR IT, which decides what `ready`
  // waits for. THE ARM IS THE ANSWER; unset is a malformed request (Connect
  // InvalidArgument).
  oneof page {
    // The editor is loading the workspace's web page now: it opens once its
    // conversation is read AND the page reports itself drawn (ReportPageDrawn).
    OpenTabsPageLoading loading = 2;
    // The editor draws no web page for it (its frontend is not the web page,
    // or the editor has no webview): it opens once its conversation is read.
    OpenTabsPageNone none = 3;
  }
}

// The editor is loading the workspace's web page. DELIBERATELY EMPTY.
message OpenTabsPageLoading {}

// The editor draws no web page for the workspace. DELIBERATELY EMPTY.
message OpenTabsPageNone {}

// One frame of an open. The stream ends after `finished`.
message OpenTabsResponse {
  // THE ARM IS THE FRAME; exactly one is set.
  oneof frame {
    // One workspace moved one step along its open.
    OpenTabsStep step = 1;
    // One workspace is open: the editor shows its tab now.
    OpenTabsOpened opened = 2;
    // Every workspace of the request has had its `opened`; the last frame.
    OpenTabsFinished finished = 3;
  }
}

// ---- Steps: one workspace's progress, one minibuffer line each ----

// One workspace's step, in the order it happened.
message OpenTabsStep {
  // The workspace.
  workspace.v1.WorkspaceRef workspace = 1;
  // When the step happened, epoch milliseconds.
  int64 at_ms = 2;
  // THE ARM IS THE STEP; exactly one is set.
  oneof step {
    // Its shim is being started or adopted ("starting session…").
    OpenTabsStepStartingSession starting_session = 3;
    // It was asleep and is being woken ("waking from sleep…").
    OpenTabsStepWaking waking = 4;
    // Its conversation is being resumed ("resuming the conversation…").
    OpenTabsStepResuming resuming = 5;
    // A vendor start attempt failed and is retried ("Claude did not start,
    // retrying (attempt N)…").
    OpenTabsStepVendorRetrying vendor_retrying = 6;
    // The vendor refused to start ("Claude refused to start: <cause>.").
    OpenTabsStepVendorRejected vendor_rejected = 7;
    // The vendor kept failing for the whole retry window ("Claude failed to
    // start after 10 minutes.").
    OpenTabsStepVendorFailed vendor_failed = 8;
    // Resuming waits on the user's answer to the cold gate ("needs your
    // answer to resume (large context).").
    OpenTabsStepColdGate cold_gate = 9;
    // The network is unreachable, so the vendor cannot start yet ("offline,
    // waiting for the network…").
    OpenTabsStepOffline offline = 10;
    // A bring-up under way reached agent-repl's services serving the session
    // ("session up, waiting for its page…"); progress only, which the open
    // never waits for.
    OpenTabsStepServed served = 11;
    // Its web page has attached to the daemon and is loading its
    // conversation ("page connected, drawing the conversation…").
    OpenTabsStepPageConnected page_connected = 12;
    // Its web page has drawn its conversation ("page drawn.").
    OpenTabsStepPageDrawn page_drawn = 13;
    // Its conversation's newest page was read whole: the page and every
    // turn prompt its rows belong to ("conversation read.").
    OpenTabsStepConversationRead conversation_read = 14;
    // A turn the daemon's own stand-down cut (a restart, a bounce) is being
    // resumed ("resuming the turn the restart cut…"); progress only, which
    // the open never waits for.
    OpenTabsStepResumingCutTurn resuming_cut_turn = 15;
  }
}

// The shim is being started or adopted.
message OpenTabsStepStartingSession {}

// The workspace is being woken from sleep.
message OpenTabsStepWaking {}

// The conversation is being resumed.
message OpenTabsStepResuming {}

// A vendor start attempt failed and is retried.
message OpenTabsStepVendorRetrying {
  // The failed attempt's number, counting from 1.
  uint32 attempt = 1;
}

// The vendor refused to start.
message OpenTabsStepVendorRejected {
  // Why, in the shim's words. Printed verbatim.
  string cause = 1;
}

// The vendor failed for the whole retry window.
message OpenTabsStepVendorFailed {}

// The cold gate awaits the user's answer.
message OpenTabsStepColdGate {}

// The network is unreachable.
message OpenTabsStepOffline {}

// The session is served by agent-repl's services.
message OpenTabsStepServed {}

// The workspace's web page attached to the daemon.
message OpenTabsStepPageConnected {}

// The workspace's web page drew its conversation.
message OpenTabsStepPageDrawn {}

// The conversation's newest page was read whole.
message OpenTabsStepConversationRead {}

// A turn the daemon's own stand-down cut is being resumed.
message OpenTabsStepResumingCutTurn {}

// ---- Opened: the go-ahead to show one tab ----

// One workspace is open.
//
// Sent ONCE per workspace of the request, as soon as that workspace is open,
// in whatever order they open: one workspace's slow read never holds back
// another's tab. A workspace's tab is placed by the registry's tab order, so
// the order these arrive in decides only when a tab appears, never where.
message OpenTabsOpened {
  // The workspace.
  workspace.v1.WorkspaceRef workspace = 1;
  // When it opened, epoch milliseconds.
  int64 at_ms = 2;
  // THE ARM IS HOW IT OPENED; exactly one is set.
  oneof outcome {
    // EVERYTHING THE WORKSPACE NEEDS IS DONE (owner rulings, 2026-10-12 and
    // 2026-10-28): its conversation's newest page read whole from the store
    // (`conversation_read`) and its page drawn when one was loading. Its shim
    // is not waited for. Show the tab ("<name>: ready.").
    OpenTabsOpenedReady ready = 3;
    // It could not be opened (its conversation could not be read); show the
    // tab, which draws the fault ("<name>: could not be opened: <reason>.").
    OpenTabsOpenedFailed failed = 4;
    // Hidden, or in a collapsed repository section, and not the workspace
    // the user is looking at: nothing was read, and it stays off the tab
    // bar until it is shown again.
    OpenTabsOpenedHidden hidden = 5;
    // The daemon refused to open it; the editor shows no tab and records why.
    OpenTabsOpenedRefused refused = 6;
  }
}

// Everything the workspace needs is done.
message OpenTabsOpenedReady {
  // How the roster lists the workspace. The set arm IS the listing.
  oneof listing {
    // THE WORKSPACE'S ROSTER ROW AS OF THIS ANSWER: its status, name and
    // markers, so the tab is drawn true from the frame that opens it rather
    // than from the next roster push. The roster stream carries every later
    // change.
    frontend.v1.RosterRow row = 1;
    // A zettel chat thread, listed in the roster's thread section and never
    // on the tab bar, so no row is drawn for it.
    OpenTabsOpenedThread thread = 3;
  }
  // The revision of the roster `row` was taken from (WorkspaceRoster.revision):
  // a consumer that already holds that revision or a later one already holds
  // this row or a newer one, and keeps what it has.
  uint64 roster_revision = 2;
}

// The workspace could not be opened.
message OpenTabsOpenedFailed {
  // Why, in the daemon's words. Printed verbatim.
  string reason = 1;
  // How the roster lists the workspace, as OpenTabsOpenedReady.listing.
  oneof listing {
    // The workspace's roster row as of this answer, drawing the failure; as
    // OpenTabsOpenedReady.row.
    frontend.v1.RosterRow row = 2;
    // A zettel chat thread, as OpenTabsOpenedReady.thread.
    OpenTabsOpenedThread thread = 4;
  }
  // As OpenTabsOpenedReady.roster_revision.
  uint64 roster_revision = 3;
}

// The workspace is a zettel chat thread, which no tab row draws. DELIBERATELY
// EMPTY: the arm is the fact.
message OpenTabsOpenedThread {}

// Not visible, so nothing was read. DELIBERATELY EMPTY.
message OpenTabsOpenedHidden {}

// The daemon refused to open the workspace.
message OpenTabsOpenedRefused {
  // THE ARM IS THE CAUSE; exactly one is set.
  oneof cause {
    // The workspace id is not in the daemon's registry.
    OpenTabsRefusedUnknownWorkspace unknown_workspace = 1;
    // The echoed dir disagrees with the registry's dir for this id.
    OpenTabsRefusedWorkspaceRefMismatch workspace_ref_mismatch = 2;
    // This daemon released the workspace to a successor; dial `address`.
    OpenTabsRefusedTransferringAway transferring_away = 3;
    // A joining daemon has not finished adopting this workspace yet.
    OpenTabsRefusedNotYetAdopted not_yet_adopted = 4;
  }
}

// The workspace id is not in the daemon's registry. DELIBERATELY EMPTY.
message OpenTabsRefusedUnknownWorkspace {}

// The echoed dir disagrees with the registry's dir for this id.
message OpenTabsRefusedWorkspaceRefMismatch {
  // The dir the registry holds for this id.
  string registry_dir = 1;
}

// This daemon released the workspace to a successor.
message OpenTabsRefusedTransferringAway {
  // The successor's `127.0.0.1:<port>`, so a lagging client dials it.
  string address = 1;
}

// A joining daemon has not finished adopting this workspace yet.
// DELIBERATELY EMPTY.
message OpenTabsRefusedNotYetAdopted {}

// ---- Finished: the summary line ----

// Every workspace of the request has had its `opened`.
message OpenTabsFinished {
  // How many opened `ready`.
  uint32 ready = 1;
  // How many workspaces the request named.
  uint32 total = 2;
  // The workspaces that opened `failed`, in the request's order ("4 of 5
  // workspaces ready; ship-gns failed to start.").
  repeated OpenTabsFailedWorkspace failed = 3;
}

// A workspace that opened with a service-level failure.
message OpenTabsFailedWorkspace {
  // The workspace.
  workspace.v1.WorkspaceRef workspace = 1;
  // Its display name, printed verbatim.
  string name = 2;
}
