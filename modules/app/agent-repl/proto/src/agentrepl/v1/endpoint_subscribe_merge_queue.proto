// endpoint_subscribe_merge_queue.proto — SubscribeMergeQueue: tell one
// workspace's agent when a merge queue DEPLETES, is PAUSED, or is RESUMED, so
// it can wait on the queue as a whole (land after the queue drains, hold work
// while it is paused) without polling it. AGENT API section.
//
// TO FOLLOW ONE WORKSPACE'S MERGE, USE SubscribeWorkspace. A subscriber
// waiting for a specific workspace to land, deploy or be evicted names that
// workspace (WORKSPACE_NOTICE_EVENT_LANDED, DEPLOYED, EVICTED, or the
// LIFECYCLE bundle). This subscription is for the queue as a whole and is not
// told what any one merge does.
//
// DELIVERY: each notice is submitted to the subscriber's session as a
// deferred prompt of origin
// conversation.v1.PromptOrigin.PROMPT_ORIGIN_MERGE_QUEUE_NOTICE, the same
// path an async merge's handback takes: it waits behind a running turn, wakes
// an idle agent, and the feed draws no row for it.
//
// WHAT IS TOLD: a queue DEPLETING (a merge left it and none is left in line,
// so nothing runs), a queue being PAUSED, and a queue being RESUMED. NOTHING
// ELSE IS TOLD: not a merge put in line, not a merge leaving while others
// wait, not a merge starting or moving to a new step, not a reorder, not a
// deploy, and not a merge a restart cut short being put back in line. A
// notice wakes the subscriber and costs it a full read of its context, and
// none of those is a change a subscriber of the queue as a whole waits on.
// A subscriber that heard the queue paused hears it resumed, so it never waits
// on a queue that is already running.
//
// A NOTICE NAMES ITS QUEUE and is one short line: the repository, the change,
// and how the queue stands after it in a few words (how many merges are in
// line, the running merge and its step, whether it is paused). It never lists
// the queue: `merge-queue status` reads it. A notice still waiting behind the
// subscriber's turn when the next change comes is superseded by one that names
// every change it named, then the new one, still on one line.
//
// SCOPE: a workspace holds AT MOST ONE subscription per scope -- one
// repository's queue, or every repository's -- and subscribing again in a
// scope it holds stands in for that subscription. A scoped and an unscoped
// subscription may stand together; a change both admit is delivered once, as
// one notice.
//
// LIFETIME: a subscription ends when its workspace unsubscribes in its scope,
// when the workspace closes, however it closes (closed, killed, nuked, or
// closed by its own landing), and when a queue in its scope DEPLETES -- a
// merge leaves it and no merge is left in line, so nothing runs. Re-opening
// the workspace does not restore it. A depletion ends every subscription in
// that queue's scope, the repository's and the every-repository one alike, so
// its notice is the subscription's LAST and says the subscription has ended.
// Following the queue's next work takes a new subscription; one taken after
// the last notice stands, even one taken before the daemon finished
// delivering it.
// It is DURABLE across a daemon restart and a handover: a landing's own deploy
// restarts the daemon, so a subscription that a restart dropped would end at
// the very change it exists to report. A change made while no daemon serves
// is never reported; the next notice's few words on the queue carry its
// effect.
//
// NOTHING SLIPS BETWEEN READING AND FOLLOWING. The answer carries the queues
// in scope as they stand when the subscription is taken (MergeQueueStatus),
// and every change after that answer that a subscription is told is noticed.

syntax = "proto3";

package agentrepl.v1;

import "agentrepl/v1/merge_queue_status.proto";
import "workspace/v1/workspace.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

message SubscribeMergeQueueRequest {
  // The workspace whose agent receives the notices: the caller's own
  // workspace when an agent subscribes itself.
  workspace.v1.WorkspaceRef subscriber = 1;
  // WHICH repository's queue. UNSET = every repository's queue, including a
  // repository whose queue is empty or does not exist yet.
  optional workspace.v1.RepositoryRef repository = 2;
  // Retired: a subscription once chose how much of a queue's change it was
  // told (every change, advances, deploys or depletes). Every subscription is
  // now told the same three changes (WHAT IS TOLD): depleted, paused, resumed.
  reserved 3;
  reserved "detail";
}
// THE ARM IS THE OUTCOME.
message SubscribeMergeQueueResponse {
  oneof result {
    SubscribeMergeQueueSuccess success = 1;
    SubscribeMergeQueueError error = 2;
  }
}
// Subscribed, with the queues in scope as they stand now.
message SubscribeMergeQueueSuccess {
  // Whether the subscription is new or stands in for one already held in
  // scope.
  SubscribeMergeQueueSuccessTaken taken = 1;
  // The queues in scope when the subscription was taken, one per repository.
  repeated MergeQueueStatus queues = 2;
}
// New or replacing.
message SubscribeMergeQueueSuccessTaken {
  // THE ARM IS WHICH.
  oneof taken {
    // The subscriber held no subscription in this scope.
    SubscribeMergeQueueSuccessTakenSubscribed subscribed = 1;
    // The subscriber already held a subscription in this scope; it stands,
    // taken anew.
    SubscribeMergeQueueSuccessTakenResubscribed resubscribed = 2;
  }
}
// A new subscription. No fields.
message SubscribeMergeQueueSuccessTakenSubscribed {}
// A replaced subscription. No fields.
message SubscribeMergeQueueSuccessTakenResubscribed {}
message SubscribeMergeQueueError {
  oneof cause {
    // The subscriber is not in the daemon's registry.
    SubscribeMergeQueueUnknownSubscriber unknown_subscriber = 1;
    // `repository` names a RepositoryRef the daemon's registry does not hold.
    SubscribeMergeQueueUnknownRepository unknown_repository = 2;
    // The subscriber is closed: it runs no agent to tell, and a close is what
    // ends a subscription, so one taken while closed would never end.
    SubscribeMergeQueueSubscriberClosed subscriber_closed = 3;
  }
}
message SubscribeMergeQueueUnknownSubscriber {}
message SubscribeMergeQueueUnknownRepository {}
message SubscribeMergeQueueSubscriberClosed {}
