// endpoint_schedule_shutdown.proto — the ScheduleShutdown endpoint's request,
// success and error.
//
// ONE ENDPOINT PER FILE: ScheduleShutdownRequest, ScheduleShutdownResponse and
// the two answers it wraps, and nothing else, so the whole of what one method
// takes and returns is readable in one place. The `endpoint_` prefix is the
// grouping, not a directory — see DESIGN-protobuf-surfaces.md for why a
// directory is not available here, and for why a request type belongs to
// agentrepl.v1 rather than frontend.v1.

syntax = "proto3";

package agentrepl.v1;

import "agentrepl/v1/shared.proto";
import "frontend/v1/failure.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// Schedule a graceful shutdown instead of demanding one now. Takes the
// drain lease immediately (broadcast via ShutdownScheduleView), blocks new
// turns daemon-side at the prompt queue, and executes ShutdownRequest semantics
// the moment every hold clears. Scheduling while a schedule already exists
// is a loud nack, never a silent replace: the caller must cancel first, so
// two deploy flows cannot silently merge their intents.
message ScheduleShutdownRequest {
  // Correlation. See agentrepl.v1.AgentRepl. Daemon-global: no workspace.
  string request_id = 1;
  // Same semantics as ShutdownRequest.stop_shims, fixed at schedule time
  // because the decision is a property of WHAT was rebuilt, not of when the
  // drain finishes. It stays a bool for ShutdownRequest.stop_shims' reason.
  bool stop_shims = 2;
  // Why (for the broadcast view and the durable log). Display only.
  string cause = 3;
}

// ScheduleShutdown's answer: exactly one of a success and an error.
//
// SYNCHRONOUS, unlike Shutdown: this answer carries whether the lease was
// actually TAKEN, and a caller told success while a rival schedule already
// stood would sit waiting for a bounce belonging to someone else's intent.
message ScheduleShutdownResponse {
  // Echoed from the request that produced this answer. See
  // AcceptQueueEntryResponse.request_id.
  string request_id = 1;
  oneof response {
    ScheduleShutdownSuccess success = 2;
    ScheduleShutdownError error = 3;
  }
}

// The drain lease is held and new turns are blocked.
//
// NO ARMS, AND NO SCHEDULE ID. The minted schedule_id reaches EVERY client on
// the broadcast ShutdownScheduleView, which is the one place it is stated — a
// second copy here would be a schedule identity only the scheduler had, and
// every other client's cancel would be reasoning about a different fact.
message ScheduleShutdownSuccess {}

// Why the schedule was refused.
message ScheduleShutdownError {
  oneof error {
    // This daemon does not support scheduled shutdown.
    RefusalDependencyUnwired schedules_unwired = 1;
    // A shutdown is already scheduled. Refused rather than silently replaced.
    RefusalShutdownAlreadyScheduled already_scheduled = 2;
    // The schedule failed for a reason the daemon's classifier could not name.
    frontend.v1.FailureInternalUnclassified unclassified = 3;
  }
  // The feed card this refusal was filed under, when it produced one. See
  // AcceptQueueEntryError.failure_card.
  frontend.v1.FailureCardRef failure_card = 4;
}
