// log_site_key.proto — LogSiteKey, the identity of one log call in source,
// shared by every message an agent names a site in: a site that fired
// (LogSite), and a site a production child owns (UpdateProductionMediation).
// A forwarded record keeps its key as a string (ClientLogRecord.site), for
// the wire compatibility its comment states.

syntax = "proto3";

package agentrepl.v1;

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// One log call in source: the first 12 hex of the sha256 of its runtime, the
// function the call is written in, and its template (logging-contract.md
// "Log sites"). Every record one call writes carries the same key, whatever
// values it renders, and a reworded template is a new site. A client never
// derives a key from anything but its own call sites; a key it names back to
// the daemon is one the daemon served (LogSite.site) or one its own record
// carried.
message LogSiteKey {
  // 12 lowercase hex characters. Any other value is malformed (Connect
  // InvalidArgument) wherever a key is read.
  string hex = 1;
}
