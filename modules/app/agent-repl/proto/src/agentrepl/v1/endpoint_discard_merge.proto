// endpoint_discard_merge.proto — DiscardMerge: end a merge request that
// stands off its queue without landing it. AGENT API section.
//
// It is the ONE way a request ends short of a landing: leaving the queue never
// ends it (RequeueMerge). Discarding a workspace's merge drops only the
// request: the workspace, its worktree and its branch stay as they were.

syntax = "proto3";

package agentrepl.v1;

import "agentrepl/v1/workspace_topology.proto";
import "workspace/v1/workspace.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

message DiscardMergeRequest {
  // The workspace whose merge off its queue is discarded, landing its own
  // branch. The command line resolves the name `merge-queue status` lists the merge under to this ref.
  workspace.v1.WorkspaceRef workspace = 1;
  // WHO ASKED. REQUIRED: the user (the sidebar) or a workspace's agent
  // (`agent-repld merge-queue discard`).
  WorkspaceRequester requester = 2;
}

// THE ARM IS THE OUTCOME.
message DiscardMergeResponse {
  oneof result {
    DiscardMergeSuccess success = 1;
    DiscardMergeError error = 2;
  }
}
// The request is gone, and only the request: the workspace, its worktree and
// its branch stay as they were. No fields: the arm is the fact.
message DiscardMergeSuccess {
  // Tags 1 (`own_branch`) and 2 (`async_merge`) are RETIRED with the async
  // merge: every merge is a workspace's own, so there is no kind to tell.
  reserved 1, 2;
  reserved "own_branch", "async_merge";
}
// Why nothing was discarded. Nothing was changed.
message DiscardMergeError {
  oneof cause {
    // The workspace id is not in the daemon's registry.
    DiscardMergeUnknownWorkspace unknown_workspace = 1;
    // The echoed dir disagrees with the registry's dir for this id.
    DiscardMergeWorkspaceRefMismatch workspace_ref_mismatch = 2;
    // No request of this workspace's merge stands off its queue.
    DiscardMergeUnknownMerge unknown_merge = 3;
    // The workspace's merge stands in line: take it off with
    // `merge-queue dequeue` first, which leaves it off its queue.
    DiscardMergeStillQueued still_queued = 4;
  }
}
message DiscardMergeUnknownWorkspace {}
message DiscardMergeWorkspaceRefMismatch {
  // The dir the registry holds for this id.
  string registry_dir = 1;
}
// No request off its queue. No fields: the arm is the fact.
message DiscardMergeUnknownMerge {}
// In line. No fields: `merge-queue status` says where.
message DiscardMergeStillQueued {}
