// endpoint_close_workspace.proto — the CloseWorkspace endpoint's request,
// success and error.
//
// ONE ENDPOINT PER FILE: CloseWorkspaceRequest, CloseWorkspaceResponse and the
// two answers it wraps, and nothing else, so the whole of what one method takes
// and returns is readable in one place. The `endpoint_` prefix is the grouping,
// not a directory — see DESIGN-protobuf-surfaces.md for why a directory is not
// available here, and for why a request type belongs to agentrepl.v1 rather
// than frontend.v1.

syntax = "proto3";

package agentrepl.v1;

import "agentrepl/v1/shared.proto";
import "frontend/v1/failure.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// Retire the workspace. It carried NO fields at all under the old envelope,
// which was the clearest case of the envelope being a command's whole meaning;
// now it states that meaning itself.
message CloseWorkspaceRequest {
  // Correlation. See agentrepl.v1.AgentRepl.
  string request_id = 1;
  // The workspace being closed. See agentrepl.v1.AgentRepl.
  string workspace = 2;
}

// CloseWorkspace's answer: exactly one of a success and an error.
//
// TWO ARMS, NOT AN `ok` BIT PLUS AN OPTIONAL FAILURE — see
// AcceptQueueEntryResponse for the whole of that argument.
message CloseWorkspaceResponse {
  // Echoed from the request that produced this answer. See
  // AcceptQueueEntryResponse.request_id.
  string request_id = 1;
  oneof response {
    CloseWorkspaceSuccess success = 2;
    CloseWorkspaceError error = 3;
  }
}

// The workspace is retired.
//
// NO ARMS, AND NO FIELDS. A close's visible effect is the workspace leaving the
// roster, which every subscriber learns from the stream.
//
// A CLOSE IS NOT REFUSED FOR HAVING WORK IN FLIGHT, and that is stated here
// because its absence from the error arms is a decision rather than an
// oversight: close is an EXPLICIT USER ACTION, a person pressed the key knowing
// what their workspace was doing, and a daemon that refused them would be
// overruling the human on their own workspace. What was running is recorded in
// the daemon's log at `warn`, so a user who loses a background task to a close
// can find out what was discarded and when.
message CloseWorkspaceSuccess {}

// Why the close was refused.
message CloseWorkspaceError {
  oneof error {
    // The workspace's parked merge could not be abandoned. Closing anyway would
    // leave the merge lease standing over a workspace nobody can prompt or
    // resolve, so the close is refused instead.
    RefusalMergeAbandonFailed merge_abandon_failed = 1;
    // The workspace lifecycle refused the close.
    RefusalWorkspaceCloseFailed close_failed = 2;
    // The close failed for a reason the daemon's classifier could not name.
    frontend.v1.FailureInternalUnclassified unclassified = 3;
  }
  // The feed card this refusal was filed under, when it produced one. See
  // AcceptQueueEntryError.failure_card.
  frontend.v1.FailureCardRef failure_card = 4;
}
