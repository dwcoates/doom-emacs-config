// endpoint_close_workspace.proto — CloseWorkspace: the USER's close. SIDEBAR
// section. Closing is a VIEW act: the workspace leaves the tab-bar and its
// buffers close, but the daemon↔shim session STAYS UP; the workspace is
// merely unviewed. Its keep-alives get ONE LAST ROUND (owner request
// 2026-10-17): the daemon sends the one beat already owed, then the cache is
// left to lapse exactly as a hidden
// workspace's is, and the session is stood down when it does, so reopening
// the workspace after that meets the cold gate. Reopening it before keeps the
// cache warm again. The host
// command is a thin wrapper: send, await the ack, then tear the tab down —
// every piece of real machinery is the daemon's.
//
// A close REQUIRES QUIET: no turn in flight, no live async work, and NO
// HELD PROMPTS — a held prompt is undelivered user intent, and a close may
// never silently discard it; the user releases or drops it in the held section
// first. A busy workspace refuses, and the refusal MANIFESTS IN THE FOOTER (status
// `closing`, sub-status `close blocked`, the daemon's composed reasons as
// the activity line) — pushed on the footer stream beside this response, so
// this response never restates the reasons. The user waits or interrupts
// the work the normal way, then closes again.
//
// A WORKSPACE CLOSING ITSELF never races the turn that asks. Its agent asks
// from inside a running turn, so that turn is not counted as a blocker:
// when every OTHER condition is quiet, the close is accepted as
// `closes_when_turn_ends` and the daemon performs it at the edge where that
// turn ends, never sooner. If something else blocks by then (a held prompt
// arrived, work went live), the close is abandoned and the footer shows the
// close-blocked state, exactly as a refused close does. Killing is not
// subject to any of this: a kill never waits.

syntax = "proto3";

package agentrepl.v1;

import "agentrepl/v1/family.proto";
import "agentrepl/v1/workspace_topology.proto";
import "workspace/v1/workspace.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

message CloseWorkspaceRequest {
  // The workspace to close.
  workspace.v1.WorkspaceRef workspace = 1;
  // Who asked. A requesting workspace that IS `workspace` is a self-close,
  // carried out when its current turn ends. REQUIRED.
  WorkspaceRequester requester = 2;
}

// THE ARM IS THE OUTCOME. Fast by design: the quiet check is an in-memory
// answer, so the ack never waits on the shim.
message CloseWorkspaceResponse {
  oneof result {
    // Quiet — closed; the host proceeds with its view teardown, and the
    // roster's new state arrives on its stream.
    CloseWorkspaceSuccess success = 1;
    CloseWorkspaceError error = 2;
  }
}
message CloseWorkspaceSuccess {
  // THE ARM IS WHEN THE CLOSE HAPPENS.
  oneof outcome {
    // Closed now.
    CloseWorkspaceSuccessClosed closed = 1;
    // A self-close, accepted: the workspace closes when the turn that asked
    // ends. The caller's turn goes on; nothing more is answered.
    CloseWorkspaceSuccessClosesWhenTurnEnds closes_when_turn_ends = 2;
  }
}
// Closed now. No fields.
message CloseWorkspaceSuccessClosed {}
// Closing when the asking turn ends. No fields.
message CloseWorkspaceSuccessClosesWhenTurnEnds {}

// THE ARM IS THE REFUSAL.
// Validation failures (unset field, UNSPECIFIED enum, blank string) are Connect InvalidArgument, never an arm.
message CloseWorkspaceError {
  oneof cause {
    // Work is in flight; the footer's close-blocked state carries the
    // reasons.
    CloseWorkspaceBlocked blocked = 1;
    // The workspace id is not in the daemon's registry.
    CloseWorkspaceUnknownWorkspace unknown_workspace = 2;
    // The echoed dir disagrees with the registry's dir for this id.
    CloseWorkspaceWorkspaceRefMismatch workspace_ref_mismatch = 3;
    // This daemon released the workspace to a successor; dial `address`.
    CloseWorkspaceTransferringAway transferring_away = 4;
    // A joining daemon has not finished adopting this workspace yet.
    CloseWorkspaceNotYetAdopted not_yet_adopted = 5;
    // The workspace has open children (hidden ones included), and closing it
    // would leave them without their parent in the Open section.
    WorkspaceHasOpenChildren has_open_children = 6;
  }
}
// WHY the close is blocked — the same evidence the footer's close-blocked
// state draws, so a caller with no footer (a test, a log line, the host's
// own message) can still say why. (Landing 7, 2026-09-02.)
message CloseWorkspaceBlocked {
  // The main thread has a turn in flight. Always FALSE for a self-close,
  // whose own asking turn is never a blocker.
  bool turn_in_flight = 1;
  // Detached items live now (subagents, runs, tasks).
  uint32 live_work = 2;
  // Held prompts in the held section — undelivered user intent.
  uint32 held_prompts = 3;
  // The workspace is queued for, or inside, a merge.
  bool merge_queued = 4;
  // The daemon's composed sentence over the fields above — the footer's
  // activity line, verbatim.
  string summary = 5;
}
message CloseWorkspaceUnknownWorkspace {}
message CloseWorkspaceWorkspaceRefMismatch {
  // The dir the registry holds for this id.
  string registry_dir = 1;
}
message CloseWorkspaceTransferringAway {
  // The successor's `127.0.0.1:<port>`, so a lagging client dials it.
  string address = 1;
}
message CloseWorkspaceNotYetAdopted {}
