// endpoint_roll_back.proto — RollBack: perform a confirmed rollback plan.
// ROLLBACK section.
//
// The daemon performs the whole rollback as one operation, under its prompt
// queue's ownership of the turn sequence so no prompt is delivered part way:
// drop the held prompts the plan named, have the shim interrupt the running
// turn, (restoring files) stop the dropped turns' detached work and restore
// the files, and resume the vendor conversation just before the prompt; then
// remove the dropped turns from the feed, durably, so neither a reload nor a
// restart draws them again. On success Emacs saves the composer's contents to
// its history and fills it with the prompt that was rolled back.
syntax = "proto3";
package agentrepl.v1;
import "workspace/v1/workspace.proto";
import "conversation/v1/user.proto";
import "agentrepl/v1/rollback.proto";
option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

message RollBackRequest {
  // The workspace whose conversation to roll back.
  workspace.v1.WorkspaceRef workspace = 1;
  // The plan the user confirmed, exactly as PlanRollback served it.
  RollbackToken token = 2;
}

// THE ARM IS THE OUTCOME.
message RollBackResponse {
  oneof result {
    RollBackSuccess success = 1;
    RollBackError error = 2;
  }
}

// The conversation now ends just before the prompt.
message RollBackSuccess {
  // The prompt rolled back, as the user said it: its text and attachments,
  // for the composer to hold again. A quote the prompt replied with
  // (conversation.v1.UserQuoteBlock) is left out: a resend replies to
  // whatever is selected when it is sent.
  conversation.v1.UserSaid prompt = 1;
  // How many files were restored. Present exactly when the plan restored
  // files.
  optional RollBackFilesRestored files_restored = 2;
}
// The files a restore changed back.
message RollBackFilesRestored {
  // How many files.
  uint32 files = 1;
}
