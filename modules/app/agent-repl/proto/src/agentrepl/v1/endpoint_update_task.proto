// endpoint_update_task.proto — UpdateTask: change one task. SIDEBAR
// section. THE ARM IS THE CHANGE; the new state rides the roster stream.

syntax = "proto3";

package agentrepl.v1;

import "agentrepl/v1/task.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

message UpdateTaskRequest {
  TaskRef task = 1;
  // THE ARM IS THE CHANGE.
  oneof change {
    UpdateTaskSetTitle set_title = 2;
    UpdateTaskSetDone set_done = 3;
    UpdateTaskSetOpen set_open = 4;
  }
}

// Retitle the task.
message UpdateTaskSetTitle {
  // The new title, non-blank.
  string title = 1;
}

// Mark the task done.
message UpdateTaskSetDone {
}

// Reopen a done task.
message UpdateTaskSetOpen {
}

// THE ARM IS THE OUTCOME.
message UpdateTaskResponse {
  oneof result {
    UpdateTaskSuccess success = 1;
    UpdateTaskError error = 2;
  }
}

// Done; the roster push carries the new state.
message UpdateTaskSuccess {
}

// Arms derived from the daemon's refusal sites (landing 4, 2026-08-29).
// Validation failures (unset field, UNSPECIFIED enum, blank string) are Connect InvalidArgument, never an arm.
message UpdateTaskError {
  oneof cause {
    // The new title is blank once trimmed.
    UpdateTaskBlankTitle blank_title = 1;
    // The change asked for is what the task already holds.
    UpdateTaskNoChange no_change = 2;
    // No task by that id.
    UpdateTaskUnknownTask unknown_task = 3;
  }
}
message UpdateTaskBlankTitle {}
message UpdateTaskNoChange {}
message UpdateTaskUnknownTask {}
