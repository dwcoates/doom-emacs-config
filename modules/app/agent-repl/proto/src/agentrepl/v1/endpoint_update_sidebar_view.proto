// endpoint_update_sidebar_view.proto — UpdateSidebarView: change one piece of
// the sidebar's VIEW state. SIDEBAR section.
//
// THE SIDEBAR LOOKS THE SAME IN EVERY WORKSPACE'S PAGE (owner rulings,
// 2026-10-06). Every workspace has its own webview page, and view state a page
// kept for itself — which sections are folded — never reached the others. So it is the DAEMON'S: one verb changes it, and
// the roster push every page already watches carries it, each piece on the
// box it styles:
//
//   - a section's fold: RosterRepoSection.fold, RosterMergedSection.fold,
//     RosterHiddenSection.fold, RosterOpenSection.fold.
//
// It is DURABLE: it survives a daemon restart.
//
// NOT VIEW STATE, and so not here: anything that acts on one workspace (its
// verbs), and a dropdown open mid-gesture — a row's menu, a row's detail
// popover — or a form, all transient to the page that opened them (owner
// ruling, 2026-10-06).
//
// The client applies the change to its own page AT ONCE and sends this; the
// roster push that follows reconciles every page, the sender's included.

syntax = "proto3";

package agentrepl.v1;

import "agentrepl/v1/subsection.proto";
import "workspace/v1/workspace.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

message UpdateSidebarViewRequest {
  // `show_grouping` (2) is RETIRED and reserved: the rail draws one grouping,
  // by repository (owner ruling, 2026-10-15).
  reserved 2;
  reserved "show_grouping";
  // THE ARM IS THE CHANGE. Unset is a malformed request (Connect
  // InvalidArgument).
  oneof change {
    // Fold or unfold one section.
    SidebarViewFoldSection fold_section = 1;
  }
}

// Fold or unfold one section.
//
// `viewed` (field 8) is RETIRED and reserved: the fold of the retired viewed
// band (frontend.v1.WorkspaceRoster) (2026-10-12).
//
// `task` (2) and `maturity` (6) are RETIRED and reserved: the task and stage
// groupings whose sections they folded are gone (owner ruling, 2026-10-15).
message SidebarViewFoldSection {
  reserved 2, 6, 8;
  reserved "viewed", "task", "maturity";
  // WHICH SECTION. THE ARM IS THE SECTION; unset is malformed.
  oneof section {
    // A repository's section, echoed from RosterRepoKey. Its fold has a
    // second reader: the Emacs tab bar hides a collapsed repository's
    // workspaces. COLLAPSING STANDS THEIR SESSIONS DOWN, as hiding one
    // workspace does (endpoint_set_workspace_hidden.proto): at once when no
    // turn runs, once the running turn ends otherwise. EXPANDING starts
    // nothing by itself: the editor asks for the workspaces with OpenTabs.
    workspace.v1.RepositoryRef repository = 1;
    // The recently-merged band; the roster carries exactly one.
    SidebarViewRecentlyMerged recently_merged = 3;
    // The hidden-workspaces section; the roster carries exactly one. Its
    // fold hides rows in the sidebar only: a hidden workspace is off the
    // Emacs tab bar whether the section is folded or not.
    SidebarViewHidden hidden = 7;
    // The open-workspaces section; the roster carries exactly one. Its fold
    // hides rows in the sidebar only: the Emacs tab bar draws an open
    // workspace whether the section is folded or not.
    SidebarViewOpen open = 9;
    // One subsection of a repository's section, echoed from
    // frontend.v1.RosterSubsectionKey. Its fold has the repository fold's two
    // readers and the same effect on its workspaces: the Emacs tab bar hides
    // them, and COLLAPSING STANDS THEIR SESSIONS DOWN as a repository's
    // collapse does. EXPANDING starts nothing by itself.
    SubsectionRef subsection = 10;
  }
  // THE ARM IS THE FOLD ASKED FOR. Unset is malformed.
  oneof fold {
    SidebarViewExpand expand = 4;
    SidebarViewCollapse collapse = 5;
  }
}

// The recently-merged band. DELIBERATELY EMPTY: the arm is the section.
message SidebarViewRecentlyMerged {}

// The hidden-workspaces section. DELIBERATELY EMPTY: the arm is the section.
message SidebarViewHidden {}

// The open-workspaces section. DELIBERATELY EMPTY: the arm is the section.
message SidebarViewOpen {}

// Show the section's rows.
message SidebarViewExpand {}

// Hide the section's rows.
message SidebarViewCollapse {}

// THE ARM IS THE OUTCOME.
message UpdateSidebarViewResponse {
  oneof result {
    UpdateSidebarViewSuccess success = 1;
    UpdateSidebarViewError error = 2;
  }
}

// Recorded; the roster push carries the change to every page.
message UpdateSidebarViewSuccess {}

// Validation failures (an unset field or arm, a blank id) are Connect
// InvalidArgument, never an arm. A change to what the view already holds is
// NOT refused: two pages may race to the same state, and both have what they
// asked for.
//
// `unknown_task` (2) is RETIRED and reserved with the task sections it
// refused folds of (owner ruling, 2026-10-15).
message UpdateSidebarViewError {
  reserved 2;
  reserved "unknown_task";
  oneof cause {
    // No registered repository matches the ref.
    UpdateSidebarViewUnknownRepository unknown_repository = 1;
    // No subsection matches the ref: it was deleted, or never existed.
    UpdateSidebarViewUnknownSubsection unknown_subsection = 3;
    // A collapse of a repository or subsection that holds the current
    // workspace.
    UpdateSidebarViewHoldsCurrent holds_current = 4;
  }
}

// No subsection matches the ref. DELIBERATELY EMPTY: the arm is the cause,
// and the request names the subsection.
message UpdateSidebarViewUnknownSubsection {}

// No registered repository matches the ref. DELIBERATELY EMPTY: the arm is
// the cause.
message UpdateSidebarViewUnknownRepository {}

// A collapse asked of the repository or subsection the current workspace sits
// in. Collapsing it would stand down the session the user is looking at and
// hide its tab, so nothing is recorded and the fold stands expanded. The
// check and the selection are serialized in the daemon, so a switch racing
// the ask is either wholly before it or wholly after it. The roster already
// says so (frontend.v1.RosterRepoSectionExpanded.collapse and
// frontend.v1.RosterSubsectionExpanded.collapse), so a page reaches this arm
// only when its roster is a push behind a switch. DELIBERATELY EMPTY: the arm
// is the cause, and the request names the section.
message UpdateSidebarViewHoldsCurrent {}
