// endpoint_update_sidebar_view.proto — UpdateSidebarView: change one piece of
// the sidebar's VIEW state. SIDEBAR section.
//
// THE SIDEBAR LOOKS THE SAME IN EVERY WORKSPACE'S PAGE (owner rulings,
// 2026-10-06). Every workspace has its own webview page, and view state a page
// kept for itself — which sections are folded — never reached the others. So it is the DAEMON'S: one verb changes it, and
// the roster push every page already watches carries it, each piece on the
// box it styles:
//
//   - a section's fold: RosterRepoSection.fold, RosterMergedSection.fold,
//     RosterBacklogSection.fold, RosterOpenSection.fold.
//   - a band section's height: RosterMergeQueueSection.height,
//     RosterMergedSection.height, RosterBacklogSection.height.
//
// It is DURABLE: it survives a daemon restart.
//
// NOT VIEW STATE, and so not here: anything that acts on one workspace (its
// verbs), and a dropdown open mid-gesture — a row's menu, a row's detail
// popover — or a form, all transient to the page that opened them (owner
// ruling, 2026-10-06).
//
// The client applies the change to its own page AT ONCE and sends this; the
// roster push that follows reconciles every page, the sender's included.

syntax = "proto3";

package agentrepl.v1;

import "agentrepl/v1/subsection.proto";
import "workspace/v1/workspace.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

message UpdateSidebarViewRequest {
  // `show_grouping` (2) is RETIRED and reserved: the rail draws one grouping,
  // by repository (owner ruling, 2026-10-15).
  reserved 2;
  reserved "show_grouping";
  // `show_open` (3) is RETIRED and reserved: it switched the open section's
  // repository sections between their workspaces and their merge queues,
  // which are drawn in the Merge Queue section instead, each in its
  // repository's group (frontend.v1.RosterMergeQueueRepoGroup).
  reserved 3;
  reserved "show_open";
  // THE ARM IS THE CHANGE. Unset is a malformed request (Connect
  // InvalidArgument).
  oneof change {
    // Fold or unfold one section.
    SidebarViewFoldSection fold_section = 1;
    // Size one or more of the band sections below the Open section, as a
    // drag of the rule between two sections asks.
    SidebarViewSizeSections size_sections = 4;
  }
}

// ---- Section heights: the lines a band section's viewport shows ----

// SIZE THE BAND SECTIONS. A drag of the rule between two sections changes
// the height of the sections on either side of it at once, so one request
// carries every section it sizes and the daemon records them in one write:
// no page ever draws one side of a drag without the other.
//
// The Open section is never sized: it takes whatever room the bands below it
// leave, so a sized band keeps its lines however the rail's height changes.
message SidebarViewSizeSections {
  // One entry per section sized, each section at most once. Empty, or a
  // section named twice, is a malformed request (Connect InvalidArgument).
  repeated SidebarViewSectionSize sizes = 1;
}

// One band section's height.
message SidebarViewSectionSize {
  // WHICH SECTION. THE ARM IS THE SECTION; unset is malformed. The arm
  // messages are the ones SidebarViewFoldSection names its sections with.
  oneof section {
    // The Merge Queue section (frontend.v1.RosterMergeQueueSection).
    SidebarViewMergeQueue merge_queue = 1;
    // The Recently Merged section (frontend.v1.RosterMergedSection).
    SidebarViewRecentlyMerged recently_merged = 2;
    // The Backlog section (frontend.v1.RosterBacklogSection).
    SidebarViewBacklog backlog = 3;
  }
  // WHAT HEIGHT. THE ARM IS THE HEIGHT; unset is malformed.
  oneof height {
    // Fit the section as the page decides, by its share of the rail
    // (webapp src/sidebar/band-fit.ts): the height of a section nobody has
    // sized, and what a double click on a rule restores.
    SidebarViewSectionFitted fitted = 4;
    // Show exactly this many of the section's lines.
    SidebarViewSectionLines lines = 5;
  }
}

// The page fits the section by its share of the rail. DELIBERATELY EMPTY:
// the arm is the fact.
message SidebarViewSectionFitted {}

// A section sized by hand, in LINES rather than pixels: a line is a row, a
// folded header or a queue's card (band-fit.ts), so every page shows the same
// rows whatever its height in pixels, and no line is cut through.
message SidebarViewSectionLines {
  // How many of the section's first lines its viewport shows. 0 shows its
  // header alone. A section holding fewer lines shows every one it holds, and
  // a rail too short for every sized section shrinks them, lowest first.
  uint32 lines = 1;
}

// Fold or unfold one section.
//
// `viewed` (field 8) is RETIRED and reserved: the fold of the retired viewed
// band (frontend.v1.WorkspaceRoster) (2026-10-12).
//
// `task` (2) and `maturity` (6) are RETIRED and reserved: the task and stage
// groupings whose sections they folded are gone (owner ruling, 2026-10-15).
message SidebarViewFoldSection {
  reserved 2, 6, 8;
  reserved "viewed", "task", "maturity";
  // WHICH SECTION. THE ARM IS THE SECTION; unset is malformed.
  oneof section {
    // A repository's section, echoed from RosterRepoKey. Its fold has a
    // second reader: the Emacs tab bar hides a collapsed repository's
    // workspaces. COLLAPSING UNLOADS THEIR PAGES AT ONCE AND STANDS THEIR
    // SESSIONS DOWN FIVE MINUTES LATER (owner request, 2026-10-30): the
    // editor drops each page the moment the fold arrives, keeping its slot,
    // and the daemon stands each session down five minutes after the latest
    // collapse that folded it, once the running turn ends if one runs then.
    // A workspace the collapse spares (a one-shot, a merge pending) keeps
    // its session. EXPANDING starts nothing by itself: the editor asks for
    // the workspaces with OpenTabs, and an expand within the five minutes
    // finds their sessions still up.
    workspace.v1.RepositoryRef repository = 1;
    // The Recently Merged section (frontend.v1.RosterMergedSection); the
    // roster carries exactly one.
    SidebarViewRecentlyMerged recently_merged = 3;
    // The Merge Queue section (frontend.v1.RosterMergeQueueSection); the
    // roster carries exactly one.
    SidebarViewMergeQueue merge_queue = 11;
    // The backlog; the roster carries exactly one. Its
    // fold hides rows in the sidebar only: a backlogged workspace is off the
    // Emacs tab bar whether the section is folded or not.
    SidebarViewBacklog backlog = 7;
    // The open-workspaces section; the roster carries exactly one. Its fold
    // hides rows in the sidebar only: the Emacs tab bar draws an open
    // workspace whether the section is folded or not.
    SidebarViewOpen open = 9;
    // One subsection of a repository's section, echoed from
    // frontend.v1.RosterSubsectionKey. Its fold has the repository fold's two
    // readers and the same effect on its workspaces: the Emacs tab bar hides
    // them, and COLLAPSING UNLOADS THEIR PAGES AT ONCE AND STANDS THEIR
    // SESSIONS DOWN FIVE MINUTES LATER as a repository's collapse does.
    // EXPANDING starts nothing by itself.
    SubsectionRef subsection = 10;
    // One open workspace's CHILDREN, echoed from the workspace's own row. Its
    // fold has a subsection fold's effects on the workspace's open
    // descendants: the sidebar hides their rows, the Emacs tab bar folds
    // their tabs, and COLLAPSING UNLOADS THEIR PAGES AT ONCE AND STANDS THEIR
    // SESSIONS DOWN FIVE MINUTES LATER, sparing the ones a fold spares.
    // EXPANDING starts nothing by itself. Selecting a descendant, or a
    // descendant starting work, expands it.
    workspace.v1.WorkspaceRef workspace = 12;
  }
  // THE ARM IS THE FOLD ASKED FOR. Unset is malformed.
  oneof fold {
    SidebarViewExpand expand = 4;
    SidebarViewCollapse collapse = 5;
  }
}

// The recently-merged band. DELIBERATELY EMPTY: the arm is the section.
message SidebarViewRecentlyMerged {}

// The Merge Queue section. DELIBERATELY EMPTY: the arm is the section.
message SidebarViewMergeQueue {}

// The backlog. DELIBERATELY EMPTY: the arm is the section.
message SidebarViewBacklog {}

// The open-workspaces section. DELIBERATELY EMPTY: the arm is the section.
message SidebarViewOpen {}

// Show the section's rows.
message SidebarViewExpand {}

// Hide the section's rows.
message SidebarViewCollapse {}

// THE ARM IS THE OUTCOME.
message UpdateSidebarViewResponse {
  oneof result {
    UpdateSidebarViewSuccess success = 1;
    UpdateSidebarViewError error = 2;
  }
}

// Recorded; the roster push carries the change to every page.
message UpdateSidebarViewSuccess {}

// Validation failures (an unset field or arm, a blank id) are Connect
// InvalidArgument, never an arm. A change to what the view already holds is
// NOT refused: two pages may race to the same state, and both have what they
// asked for.
//
// `unknown_task` (2) is RETIRED and reserved with the task sections it
// refused folds of (owner ruling, 2026-10-15).
message UpdateSidebarViewError {
  reserved 2;
  reserved "unknown_task";
  oneof cause {
    // No registered repository matches the ref.
    UpdateSidebarViewUnknownRepository unknown_repository = 1;
    // No subsection matches the ref: it was deleted, or never existed.
    UpdateSidebarViewUnknownSubsection unknown_subsection = 3;
    // A collapse of a repository or subsection that holds the current
    // workspace.
    UpdateSidebarViewHoldsCurrent holds_current = 4;
    // No workspace matches the ref: it was forgotten, or never existed.
    UpdateSidebarViewUnknownWorkspace unknown_workspace = 5;
  }
}

// No subsection matches the ref. DELIBERATELY EMPTY: the arm is the cause,
// and the request names the subsection.
message UpdateSidebarViewUnknownSubsection {}

// No registered repository matches the ref. DELIBERATELY EMPTY: the arm is
// the cause.
message UpdateSidebarViewUnknownRepository {}

// No workspace matches the ref. DELIBERATELY EMPTY: the arm is the cause, and
// the request names the workspace.
message UpdateSidebarViewUnknownWorkspace {}

// A collapse asked of the repository, subsection or workspace's children the
// current workspace sits in, when no other open workspace is drawn outside it
// to land the user on. A collapse with somewhere to land is NOT refused: the
// daemon selects the workspace the user was on before, among the open
// sections, as the fold is recorded. Without one, collapsing would stand down
// the session the user is looking at and hide its tab, so nothing is recorded
// and the fold stands expanded. The check, the landing and the fold are
// serialized in the daemon, so a switch racing the ask is either wholly before
// it or wholly after it. The roster already says so
// (frontend.v1.RosterRepoSectionExpanded.collapse and
// frontend.v1.RosterSubsectionExpanded.collapse), so a page reaches this arm
// only when its roster is a push behind a switch. DELIBERATELY EMPTY: the arm
// is the cause, and the request names the section.
message UpdateSidebarViewHoldsCurrent {}
