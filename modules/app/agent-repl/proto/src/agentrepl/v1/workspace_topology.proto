// workspace_topology.proto — WHERE A NEW WORKSPACE'S WORK COMES FROM AND
// GOES: the branch it is cut from, the branch it lands in, and the
// conversation it starts with. Shared by every rpc that makes a workspace
// (CreateWorkspace, in each of its forms).
//
// THREE CHOICES, EACH ALWAYS MADE. A create names its branch source and merge
// target (one topology arm names both) and its context origin; none of them has
// a default, so every create is a specific, intentional one.
//
// THE OWNERSHIP RULE, which the topology arms make structural: a branch cut
// from the primary branch lands only on the primary branch, and a branch a
// workspace owns lands only into that workspace. A workspace is therefore never
// cut from one owner's branch and landed in another's; no arm can express it.
// The one way work on a branch no workspace owns reaches anything is the async
// merge (CreateWorkspaceAsyncMerge), whose source and target are its own.

syntax = "proto3";

package agentrepl.v1;

import "workspace/v1/workspace.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// ---- Requester: on whose behalf a workspace rpc is asked ----

// Who asked. Workspace rpcs act differently for an agent asking from inside a
// workspace than for the user: notices and reports go back to the requesting
// workspace, and some acts are reserved to a branch's owner. REQUIRED: a
// request that sets no arm is refused as invalid.
message WorkspaceRequester {
  // THE ARM IS THE ASKER.
  oneof asker {
    // The user, through the editor or the webapp. No workspace is told the
    // outcome and no ownership rule binds the request to one.
    WorkspaceRequesterUser user = 1;
    // A workspace's agent, through `agent-repld`'s command line, which fills
    // this from the workspace whose worktree holds its working directory. A
    // working directory inside no registered workspace has no requester, and
    // the command line refuses before any rpc is sent.
    WorkspaceRequesterWorkspace workspace = 2;
  }
}
// The user asked. No fields: the user is not addressed by any identity.
message WorkspaceRequesterUser {}
// A workspace's agent asked.
message WorkspaceRequesterWorkspace {
  // The requesting workspace, as the roster served it.
  workspace.v1.WorkspaceRef workspace = 1;
}

// ---- Context origin: the conversation a new workspace starts with ----

// The conversation a new workspace's session starts with. REQUIRED: there is
// no default context; a request that sets no arm is refused as invalid.
message WorkspaceContextOrigin {
  // THE ARM IS THE ORIGIN.
  oneof origin {
    // A new, empty conversation: chosen when the existing context would not
    // help (a truly tangential problem) or must not bias the work (a review).
    WorkspaceContextOriginFresh fresh = 1;
    // A fork of a workspace's conversation, cut at that workspace's last
    // concluded turn: a turn still running when the fork is made is left out.
    // The forked workspace may be the requester itself or any other open or
    // closed workspace of the same repository that holds a conversation; one
    // that holds none is refused (`fork_source_has_no_conversation`).
    WorkspaceContextOriginFork fork = 2;
  }
}
// A fresh conversation. No fields.
message WorkspaceContextOriginFresh {}
// The workspace whose conversation is forked.
message WorkspaceContextOriginFork {
  // The workspace to fork, as the roster served it.
  workspace.v1.WorkspaceRef workspace = 1;
}

// ---- Topology: the branch a workspace is cut from and the one it lands in ----

// Where a standard or one-shot workspace is cut from, and where it lands. The
// ARM names both, because the ownership rule ties each source to exactly one
// target. REQUIRED: a request that sets no arm is refused as invalid.
message WorkspaceTopology {
  // THE ARM IS THE SHAPE.
  oneof shape {
    // Cut from the primary branch's tip, landing on the primary branch in the
    // repository's main worktree. The common shape.
    WorkspaceTopologyPrimary primary = 1;
    // Cut from a workspace's branch tip, landing into that workspace's branch
    // in its worktree, and nested under it in the roster.
    WorkspaceTopologyChild child = 2;
  }
}
// From the primary branch, onto the primary branch. No fields: the
// repository names its primary branch.
message WorkspaceTopologyPrimary {}
// A child of another workspace: from its branch, into its branch.
//
// WHO LANDS A CHILD depends on whose context it starts with. A child whose
// context is forked FROM ITS OWNER carries the owner's whole context and lands
// itself like any workspace. A child that starts fresh, or forked from any
// other workspace, does not know why its owner's work is shaped as it is, so
// its OWNER arbitrates and lands it: such a request must carry `owner_notice`,
// is refused as a one-shot, and is refused merging itself
// (MergeWorkspaceError.owner_lands); the owner lands it with MergeWorkspace.
// A child whose context is forked from its owner must not carry a notice.
message WorkspaceTopologyChild {
  // The owning workspace. Must be registered in the create's repository; a
  // CLOSED owner is reopened before anything else is done, so the work it is
  // to arbitrate has a session to arbitrate it.
  workspace.v1.WorkspaceRef owner = 1;
  // What the owner is told, in the requester's own words, when its context
  // is not the one forked: what the child will do on the owner's branch and
  // why. The daemon delivers it to the owner's session with its own addendum
  // stating that landing the child's work into the owner is the owner's
  // responsibility, and how to do it. Set exactly when the context origin is
  // not a fork of `owner`; otherwise refused (`owner_notice_unexpected`, or
  // `owner_notice_required` when absent).
  optional WorkspaceTopologyChildOwnerNotice owner_notice = 2;
}
// The requester's notice to a child's owner.
message WorkspaceTopologyChildOwnerNotice {
  // Plain text, as the requesting agent or user wrote it. REQUIRED: blank is
  // refused as invalid.
  string text = 1;
}

// ---- Queue placement: where a merge joins its queue ----

// Where a merge joins its repository's queue once it is put in line.
// REQUIRED wherever a merge is asked for: no placement is implied.
message MergeQueuePlacement {
  // THE ARM IS THE PLACE.
  oneof place {
    // Behind every merge already waiting.
    MergeQueuePlacementBack back = 1;
    // Ahead of every ordinary merge waiting and behind any earlier front
    // merge, never ahead of the merge already running: for a fix that must
    // land before the work already waiting.
    MergeQueuePlacementFront front = 2;
  }
}
// The back of the queue. No fields.
message MergeQueuePlacementBack {}
// The front of the queue. No fields.
message MergeQueuePlacementFront {}
