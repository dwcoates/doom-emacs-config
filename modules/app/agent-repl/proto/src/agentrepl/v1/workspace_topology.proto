// workspace_topology.proto — HOW A NEW WORKSPACE STANDS TO OTHER WORK: its
// relationship to its creator's work, the branch it is cut from and lands in,
// and the conversation it starts with. Shared by every rpc that makes a
// workspace (CreateWorkspace, in each of its forms) or moves one
// (SetWorkspaceParent).
//
// THREE INDEPENDENT CHOICES. A create names its relationship (child or peer),
// its context origin, and, where the relationship's default is not wanted, its
// landing target. They answer different questions: whom the workspace
// coordinates with, where its work goes, and what it already knows.
//
// THE OWNERSHIP RULE, which the landing-target arms make structural: a branch
// cut from the primary branch lands only on the primary branch, and a branch
// cut from a workspace's branch lands only into that workspace. The one way
// work on a branch no workspace owns reaches anything is the async merge
// (CreateWorkspaceAsyncMerge), whose source and target are its own.

syntax = "proto3";

package agentrepl.v1;

import "workspace/v1/workspace.proto";

option go_package = "agentrepl/proto/agentrepl/v1;agentreplv1";

// ---- Requester: on whose behalf a workspace rpc is asked ----

// Who asked. Workspace rpcs act differently for an agent asking from inside a
// workspace than for the user: notices and reports go back to the requesting
// workspace, and some acts are reserved to a branch's owner. REQUIRED: a
// request that sets no arm is refused as invalid.
message WorkspaceRequester {
  // THE ARM IS THE ASKER.
  oneof asker {
    // The user, through the editor or the webapp. No workspace is told the
    // outcome and no ownership rule binds the request to one.
    WorkspaceRequesterUser user = 1;
    // A workspace's agent, through `agent-repld`'s command line, which fills
    // this from the workspace whose worktree holds its working directory. A
    // working directory inside no registered workspace has no requester, and
    // the command line refuses before any rpc is sent.
    WorkspaceRequesterWorkspace workspace = 2;
  }
}
// The user asked. No fields: the user is not addressed by any identity.
message WorkspaceRequesterUser {}
// A workspace's agent asked.
message WorkspaceRequesterWorkspace {
  // The requesting workspace, as the roster served it.
  workspace.v1.WorkspaceRef workspace = 1;
}

// ---- Context origin: the conversation a new workspace starts with ----

// The conversation a new workspace's session starts with. REQUIRED: there is
// no default context; a request that sets no arm is refused as invalid.
message WorkspaceContextOrigin {
  // THE ARM IS THE ORIGIN.
  oneof origin {
    // A new, empty conversation: chosen when the existing context would not
    // help (a truly tangential problem) or must not bias the work (a review).
    WorkspaceContextOriginFresh fresh = 1;
    // A fork of a workspace's conversation, cut at that workspace's last
    // concluded turn: a turn still running when the fork is made is left out.
    // The forked workspace may be the requester itself or any other open or
    // closed workspace of the same repository that holds a conversation; one
    // that holds none is refused (`fork_source_has_no_conversation`).
    WorkspaceContextOriginFork fork = 2;
  }
}
// A fresh conversation. No fields.
message WorkspaceContextOriginFresh {}
// The workspace whose conversation is forked.
message WorkspaceContextOriginFork {
  // The workspace to fork, as the roster served it.
  workspace.v1.WorkspaceRef workspace = 1;
}

// ---- Relationship: how a new workspace stands to the work it was made for ----

// How a new workspace stands to its creator's work. REQUIRED: a request that
// sets no arm is refused as invalid. INDEPENDENT of where the workspace lands
// (WorkspaceLandingTarget) and of the conversation it starts with
// (WorkspaceContextOrigin): the three are chosen separately.
message WorkspaceRelationship {
  // THE ARM IS THE RELATIONSHIP. A child and a peer are mutually exclusive:
  // a workspace either works on part of a parent's work, coordinated by that
  // parent, or stands on its own.
  oneof kind {
    // A CHILD works on part of its parent's work and keeps coordinating with
    // it. The roster nests it under its parent (under a repository divider
    // when the parent is of another repository); the parent follows its
    // turns, its questions, its landing and its close without subscribing
    // (SubscribeWorkspace's events arrive as though the parent had asked for
    // them); the parent reviews it and closes it; and the parent cannot be
    // closed, hidden, finished or merged away while the child is open
    // (WorkspaceHasOpenChildren). Its landing target defaults to its parent's
    // branch.
    WorkspaceRelationshipChild child = 1;
    // A PEER is tangential to its creator's work and self-sufficient: made,
    // then left to finish on its own. It sits at the top level of its
    // repository's section, nobody follows it unless someone subscribes, and
    // it is the natural one-shot. It has no owner and lands itself. Who asked
    // for it is still recorded (WorkspaceStatus.created_by), for diagnosis. Its
    // landing target defaults to its repository's primary branch.
    WorkspaceRelationshipPeer peer = 2;
  }
}
// A child of a parent workspace.
message WorkspaceRelationshipChild {
  // The parent, as the roster served it. A registered workspace of ANY
  // repository; a CLOSED parent is reopened before anything else is done, so
  // the child has a session to coordinate with, and a hidden or closing one
  // refuses the create (WorkspaceParentNotOpen).
  workspace.v1.WorkspaceRef parent = 1;
}
// A peer: no parent. DELIBERATELY EMPTY: the arm is the relationship.
message WorkspaceRelationshipPeer {}

// ---- Landing target: the branch a workspace is cut from and lands in ----

// Where a workspace's work is cut from and where it lands. ONE arm names both,
// because the ownership rule ties each source to exactly one target: a branch
// cut from the primary branch lands only on the primary branch, and a branch
// cut from a workspace's branch lands only into that workspace. A workspace is
// therefore never cut from one branch and landed in another; no arm can
// express it.
//
// WHERE IT IS OPTIONAL, UNSET IS THE RELATIONSHIP'S DEFAULT: a child lands into
// its parent when the parent is of the same repository, and on its own
// repository's primary branch when the parent is of another (no branch
// crosses repositories); a peer lands on the primary branch.
message WorkspaceLandingTarget {
  // THE ARM IS THE TARGET.
  oneof target {
    // The repository's primary branch, in its main worktree. A child chooses
    // it explicitly for a piece of work its parent waits on rather than
    // absorbs; the parent then picks the work up from the primary branch.
    WorkspaceLandingTargetPrimary primary = 1;
    // A workspace's unlanded branch, in that workspace's worktree. Usually the
    // parent; it may be any OTHER open workspace of the same repository (a fix
    // sent into another workspace's branch), and a workspace of another
    // repository is refused (`landing_target_other_repository`).
    WorkspaceLandingTargetWorkspace workspace = 2;
  }
}
// From the primary branch, onto the primary branch. The repository names its
// primary branch.
message WorkspaceLandingTargetPrimary {
  // SET: cut from the primary branch's tip on the remote `origin`, fetched as
  // the create runs, rather than from the local primary branch's tip. The
  // workspace still lands onto the local primary branch. A fetch that fails
  // refuses the create (CreateWorkspaceError.origin_fetch_failed). UNSET: the
  // local primary branch's tip.
  optional WorkspaceLandingTargetPrimaryFromOrigin from_origin = 1;
}
// The create is cut from origin's primary branch. DELIBERATELY EMPTY: presence
// is the fact.
message WorkspaceLandingTargetPrimaryFromOrigin {}
// From a workspace's branch, into that workspace's branch.
message WorkspaceLandingTargetWorkspace {
  // The workspace landed into, as the roster served it. Must be registered in
  // the create's repository and open.
  workspace.v1.WorkspaceRef workspace = 1;
}

// ---- Owner notice: what a workspace that lands another's work is told ----

// The requester's notice to a new workspace's OWNER when the owner, not the
// workspace itself, lands its work.
//
// WHO OWNS A WORKSPACE: a child's parent. A peer has no owner and always lands
// itself, wherever it lands. WHO LANDS A CHILD depends on whose context it
// starts with: a child whose context
// is forked FROM ITS OWNER carries the owner's whole context and lands
// itself; one that starts fresh, or forked from any other workspace, does not
// know why its owner's work is shaped as it is, so its OWNER arbitrates and
// lands it. Such a create must carry the notice, is refused as a one-shot, and
// the workspace is refused merging itself (MergeWorkspaceError.owner_lands);
// the owner lands it with FinishWorkspace. A create whose context is forked
// from its owner, or a peer, must not carry one
// (`owner_notice_unexpected`; `owner_notice_required` when one is owed and
// absent).
message WorkspaceOwnerNotice {
  // Plain text, as the requesting agent or user wrote it: what the new
  // workspace will do for the owner and why. The daemon delivers it to the
  // owner's session with its own addendum stating that landing the new
  // workspace's work is the owner's responsibility, and how to do it.
  // REQUIRED: blank is refused as invalid.
  string text = 1;
}

// ---- Queue placement: where a merge joins its queue ----

// Where a merge joins its repository's queue once it is put in line.
// REQUIRED wherever a merge is asked for: no placement is implied.
message MergeQueuePlacement {
  // THE ARM IS THE PLACE.
  oneof place {
    // Behind every merge already waiting.
    MergeQueuePlacementBack back = 1;
    // Ahead of every ordinary merge waiting and behind any earlier front
    // merge, never ahead of the merge already running: for a fix that must
    // land before the work already waiting.
    MergeQueuePlacementFront front = 2;
    // Directly behind a named merge in the queue, waiting or running: the
    // merge takes that neighbor's front mark, so front merges stay ahead of
    // ordinary ones. The named merge must stand in the queue when this one
    // is asked for (placement_behind_not_in_line otherwise); one that has
    // left by the time this one is put in line left its place at the head
    // of the waiting line, which is where this one goes.
    MergeQueuePlacementBehind behind = 3;
  }
}
// The back of the queue. No fields.
message MergeQueuePlacementBack {}
// The front of the queue. No fields.
message MergeQueuePlacementFront {}
// Directly behind a named merge.
message MergeQueuePlacementBehind {
  // REQUIRED. The merge's name as the queue lists it (merge-queue status).
  string merge = 1;
}
// A merge asked to go behind a merge that does not stand in its queue.
// Nothing was recorded.
message MergeQueuePlacementBehindNotInLine {
  // The name asked for.
  string behind = 1;
}
