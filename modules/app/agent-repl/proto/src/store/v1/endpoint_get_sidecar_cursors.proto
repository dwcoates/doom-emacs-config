// endpoint_get_sidecar_cursors.proto — GetSidecarCursors: the sidecar's
// startup recovery of its persisted file cursors.

syntax = "proto3";

package store.v1;

import "store/v1/store.proto";

option go_package = "agentrepl/proto/store/v1;storev1";

// Startup recovery: the sidecar asks the store for its persisted cursors.
message GetSidecarCursorsRequest {
  // UNSET asks for every cursor; set asks for one file's.
  optional string file_id = 1;
}

// The cursors, or why they could not be served.
message GetSidecarCursorsResponse {
  oneof result {
    GetSidecarCursorsSuccess success = 1;
    GetSidecarCursorsFailure failure = 2;
  }
}

// Every requested cursor, from durable state. Empty is a legitimate answer:
// a fresh store has no cursors and the sidecar starts every file from zero.
message GetSidecarCursorsSuccess {
  repeated CursorState cursors = 1;
}

// The cursors could not be read. THE ARM IS WHY.
message GetSidecarCursorsFailure {
  // The store's account, for a human and for logs; never switched on.
  string detail = 1;
  oneof kind {
    // file_id present but empty.
    GetSidecarCursorsInvalidRequest invalid_request = 2;
    GetSidecarCursorsStorageFailure storage_failure = 3;
  }
}
// The request was malformed or violated the validation invariant.
message GetSidecarCursorsInvalidRequest {
  // Which field (with the offending entry's index where one applies), as
  // the store names it — for the producer's logs, never switched on.
  string field = 1;
}
// The database failed; `detail` carries the driver's text.
message GetSidecarCursorsStorageFailure {}
