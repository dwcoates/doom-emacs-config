// endpoint_write_batch.proto — WriteBatch: one producer's write of one batch,
// with the cursor advance that must commit in the same transaction.

syntax = "proto3";

package store.v1;

import "store/v1/store.proto";

option go_package = "agentrepl/proto/store/v1;storev1";

// One producer's write. The rpc is the envelope: no separate carrier message
// exists, so the write's shape has exactly one spelling.
message WriteBatchRequest {
  // Which producer is writing, for attribution in the store's own logs.
  // "claude-shim:<session>" or "shim-claude-sidecar".
  string producer = 1;
  // The records, and the reader position that becomes durable with them.
  EntryBatch batch = 2;
  // THE SHAPE CATALOG OF EVERYTHING THIS BATCH DID NOT STORE. A producer that
  // classified a line as residue and then did not persist it contributes the
  // line's SHAPE here instead, so the vendor's API stays discoverable from the
  // store alone after the bytes stop being kept (owner ruling 2026-09-13,
  // docs/REALTEST-JUDGEMENT-CALLS.md "the unmodelled-line shape catalog").
  //
  // IT RIDES THE SAME TRANSACTION as the records and the cursor advance. A
  // shape observed while reading bytes whose cursor advance commits here must
  // become durable with that advance, or the re-read that would have observed
  // it again never happens and the shape is lost for good.
  //
  // The producer DEDUPES WITHIN THE BATCH by shape_hash and keeps the first
  // example it saw, so one batch carries at most one observation per hash; the
  // store folds each into the catalog (count += 1, last_seen = max, the first
  // example kept from the first insert).
  repeated ShapeObservation shapes = 3;
  // WHICH QUEUE THIS WRITE TAKES INTO THE STORE'S ONE WRITER. REQUIRED: a
  // request with this unset, or with its arm unset, is refused as an invalid
  // request (field "write_class") and never defaulted, because a guessed class
  // is how a bulk copy ends up ahead of a live turn.
  //
  // THE CALLER STATES IT; THE STORE NEVER INFERS IT FROM CONTENT. The shim
  // writes INTERACTIVE for everything it observes live; the sidecar writes BULK
  // for everything it copies from disk.
  WriteClass write_class = 4;
}

// The owner's rule (2026-09-23): an interactive write never queues behind a
// bulk one. The store serializes every SQLite write through ONE writer, and
// this is how the writer knows which queue a write belongs in.
//
// INTERACTIVE is always taken before any queued BULK write. Bulk still makes
// progress: once a bulk write is waiting, the writer takes it after a fixed
// number of consecutive interactive writes, or at once when no interactive
// write is waiting, so the longest an interactive write can wait on bulk is one
// bounded bulk transaction.
message WriteClass {
  oneof write_class {
    WriteClassInteractive interactive = 1;
    WriteClassBulk bulk = 2;
  }
}

// Live content a person is waiting to see: turn content, prompts, terminals,
// session updates. Written as ONE transaction exactly as the request carries
// it, so a failure commits nothing.
message WriteClassInteractive {}

// Background copying: transcript and spool ingestion, backfills, recoveries.
//
// THE STORE SPLITS A BULK BATCH. It commits the entries in bounded
// transactions (bounded in rows, frame bytes and time; the store's bound is
// authoritative whatever size the producer sends) and yields the writer between
// them. The cursor advance and the shape observations ride the LAST
// transaction. So a bulk failure may leave LEADING entries committed, but never
// the cursor advance or the shapes: the producer re-reads from the unadvanced
// cursor and the write ledger absorbs the entries that already landed.
message WriteClassBulk {}

// One distinct key structure a producer observed on a line it did not store.
//
// THE SHAPE IS THE PAYLOAD, NOT THE VALUES. key_structure is a canonical
// rendering of the JSON's key names and scalar TYPES with every value dropped,
// so the catalog says what the vendor's API looks like without becoming a
// second copy of the conversation. first_example is the one exception and is
// deliberate: one verbatim line per distinct shape is what makes the shape
// readable by a human, and it is written once, on the first insert.
message ShapeObservation {
  // SHA-256, lowercase hex, over key_structure. The catalog's primary key.
  string shape_hash = 1;
  // The residue kind this shape was observed under — the producer's own kind
  // string ("attachment/hook_success", "unparsed", ...). Descriptive, and the
  // ListResidueShapes filter; never switched on.
  string kind = 2;
  // The canonical rendering the hash was taken over, kept verbatim so a reader
  // sees the structure without re-deriving it.
  string key_structure = 3;
  // The RAW LINE BYTES of the first line seen with this shape, verbatim and
  // uninterpreted. Ignored on every observation after the row exists.
  bytes first_example = 4;
  // When the producer observed it, unix millis. Sets first_seen_ms on the
  // insert and raises last_seen_ms on every later observation.
  int64 seen_ms = 5;
}

// Durable, or nothing.
message WriteBatchResponse {
  oneof result {
    WriteBatchSuccess success = 1;
    WriteBatchFailure failure = 2;
  }
}

// The batch is DURABLE — records and cursor advance committed (as one
// transaction for an interactive write; as bounded transactions with the
// cursor advance in the last for a bulk one, see WriteClassBulk). A replayed batch whose write_ids all landed before is this
// same arm: absorption is success, and the producer can retire the batch
// from its retry buffer either way.
message WriteBatchSuccess {
  // Entries the store left UNCHANGED because their upsert_key already names a
  // row under a DIFFERENT book. RE-INGESTING ALREADY-STORED CONTENT IS
  // IDEMPOTENT: a corrected converter re-reading the corpus writes the same
  // cross-plane activity key under its now-right book, which disagrees with the
  // legacy row an earlier ingest wrote — so the stored row is KEPT and this
  // entry is skipped per entry, while the batch's genuinely-new entries still
  // commit in the same transaction. A skip is NEVER a batch-fatal refusal, and
  // it is reported here rather than swallowed so the producer can fold it into
  // its own startup catch-up summary; a skip in steady state is unexpected and
  // the producer warns. Empty on the ordinary path.
  repeated WriteBatchSkippedEntry skipped = 1;
}

// One entry the store skipped as a legacy book-conflict (WriteBatchSuccess.
// skipped). It carries what the producer needs to attribute the skip without
// re-deriving it: the identity that already existed and the two books.
message WriteBatchSkippedEntry {
  // The upsert_key whose stored row was kept, unchanged.
  string upsert_key = 1;
  // The book the stored row KEEPS. "(none)" for a never-served row.
  string from_book = 2;
  // The book this skipped entry would have moved the row to.
  string to_book = 3;
}

// Nothing was committed: the transaction failed whole, so the producer
// holds the batch in its BOUNDED IN-MEMORY retry buffer and replays it. (A
// BULK batch's leading transactions may have committed entries, never its
// cursor advance or shapes; the re-read replays them and the ledger absorbs
// what landed. See WriteClassBulk.)
// There is deliberately NO durable producer-side spill: exhausted retries
// are a LOUD failure (dropped frames logged with what was lost), because a
// persistent inability to reach the store indicates a lifetime-sequencing
// defect to fix, not a condition to paper over with fallback persistence.
// (The sidecar needs no buffer at all — its sources are durable files it
// re-reads from the cursor.) THE ARM IS WHY.
message WriteBatchFailure {
  // The store's account, for a human and for logs; never switched on.
  string detail = 1;
  oneof kind {
    // The batch violated validation (unset arm, empty id, negative offset,
    // …); nothing was committed and a retry of the same bytes cannot help.
    WriteBatchInvalidRequest invalid_request = 2;
    // The transaction failed in the database; a retry may succeed.
    WriteBatchStorageFailure storage_failure = 3;
  }
}
// The request was malformed or violated the validation invariant.
message WriteBatchInvalidRequest {
  // Which field (with the offending entry's index where one applies), as
  // the store names it — for the producer's logs, never switched on.
  string field = 1;
}
// The database failed; `detail` carries the driver's text.
message WriteBatchStorageFailure {}
