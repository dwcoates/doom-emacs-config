// endpoint_write_batch.proto — WriteBatch: one producer's write of one batch,
// with the cursor advance that must commit in the same transaction.

syntax = "proto3";

package store.v1;

import "store/v1/store.proto";

option go_package = "agentrepl/proto/store/v1;storev1";

// One producer's write. The rpc is the envelope: no separate carrier message
// exists, so the write's shape has exactly one spelling.
message WriteBatchRequest {
  // Which producer is writing, for attribution in the store's own logs.
  // "claude-shim:<session>" or "shim-claude-sidecar".
  string producer = 1;
  // The records, and the reader position that becomes durable with them.
  EntryBatch batch = 2;
}

// Durable, or nothing.
message WriteBatchResponse {
  oneof result {
    WriteBatchSuccess success = 1;
    WriteBatchFailure failure = 2;
  }
}

// The batch is DURABLE — records and cursor advance committed as one
// transaction. A replayed batch whose write_ids all landed before is this
// same arm: absorption is success, and the producer can retire the batch
// from its retry buffer either way.
message WriteBatchSuccess {
  // Entries the store left UNCHANGED because their upsert_key already names a
  // row under a DIFFERENT book. RE-INGESTING ALREADY-STORED CONTENT IS
  // IDEMPOTENT: a corrected converter re-reading the corpus writes the same
  // cross-plane activity key under its now-right book, which disagrees with the
  // legacy row an earlier ingest wrote — so the stored row is KEPT and this
  // entry is skipped per entry, while the batch's genuinely-new entries still
  // commit in the same transaction. A skip is NEVER a batch-fatal refusal, and
  // it is reported here rather than swallowed so the producer can fold it into
  // its own startup catch-up summary; a skip in steady state is unexpected and
  // the producer warns. Empty on the ordinary path.
  repeated WriteBatchSkippedEntry skipped = 1;
}

// One entry the store skipped as a legacy book-conflict (WriteBatchSuccess.
// skipped). It carries what the producer needs to attribute the skip without
// re-deriving it: the identity that already existed and the two books.
message WriteBatchSkippedEntry {
  // The upsert_key whose stored row was kept, unchanged.
  string upsert_key = 1;
  // The book the stored row KEEPS. "(none)" for a never-served row.
  string from_book = 2;
  // The book this skipped entry would have moved the row to.
  string to_book = 3;
}

// Nothing was committed: the transaction failed whole, so the producer
// holds the batch in its BOUNDED IN-MEMORY retry buffer and replays it.
// There is deliberately NO durable producer-side spill: exhausted retries
// are a LOUD failure (dropped frames logged with what was lost), because a
// persistent inability to reach the store indicates a lifetime-sequencing
// defect to fix, not a condition to paper over with fallback persistence.
// (The sidecar needs no buffer at all — its sources are durable files it
// re-reads from the cursor.) THE ARM IS WHY.
message WriteBatchFailure {
  // The store's account, for a human and for logs; never switched on.
  string detail = 1;
  oneof kind {
    // The batch violated validation (unset arm, empty id, negative offset,
    // …); nothing was committed and a retry of the same bytes cannot help.
    WriteBatchInvalidRequest invalid_request = 2;
    // The transaction failed in the database; a retry may succeed.
    WriteBatchStorageFailure storage_failure = 3;
  }
}
// The request was malformed or violated the validation invariant.
message WriteBatchInvalidRequest {
  // Which field (with the offending entry's index where one applies), as
  // the store names it — for the producer's logs, never switched on.
  string field = 1;
}
// The database failed; `detail` carries the driver's text.
message WriteBatchStorageFailure {}
