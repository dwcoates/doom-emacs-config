// endpoint_get_live_work.proto — GetLiveWork: ONE SESSION'S OPEN OBLIGATIONS —
// every started thing the record holds no terminal for, within the lineage of
// the caller's main agent.
//
// THE STORE IS SHARED. One store serves every workspace and every session on
// the host, so "every open obligation in the record" is every OTHER session's
// work too. The answer is therefore PER SESSION: the caller names its main
// agent and the store answers only what descends from it. A shim that resolved
// the whole record against its own vendor would write closing terminals into
// other sessions' books for work its vendor never held — which is exactly
// what happened on 2026-09-23, when opening one workspace reaped five running
// subagents of another. An unscoped request is REFUSED, never answered.
//
// NOT a claim about the world: "live" here means "a start was written and no
// terminal ever was", which is timeless and cannot go stale. The SHIM calls
// this once at session start and resolves every item — re-adopting what the
// revived vendor process actually has (reporting it as live work), and
// WRITING the closing terminal itself for what did not survive, so the set
// shrinks to empty either way and the invariant "every started thing
// eventually gets a terminal row" holds across any gap in observation. The
// sidecar never calls this: it is a copier with no view of liveness, and its
// recovery is GetSidecarCursors.

syntax = "proto3";

package store.v1;

import "conversation/v1/agent_activity.proto";
import "conversation/v1/detached_work.proto";

option go_package = "agentrepl/proto/store/v1;storev1";

// Ask for one session's open obligations.
message GetLiveWorkRequest {
  // REQUIRED. The caller's MAIN agent id — the root of its session's lineage.
  // The store answers the agents spawned transitively from it (through
  // `spawned_by_agent`, and through `spawned_by_workflow` where a workflow is
  // the link), and the detached work owned by any agent in that set. UNSET or
  // empty is refused with `invalid_request`; there is no unscoped answer.
  conversation.v1.AgentId session = 1;
}

// The set, or why it could not be read.
message GetLiveWorkResponse {
  oneof result {
    GetLiveWorkSuccess success = 1;
    GetLiveWorkFailure failure = 2;
  }
}

// The session's open obligations, from the three tables' non-terminal rows
// within the requested lineage — never another session's. Empty lists are the
// ordinary answer for an idle session. Each item is named by its id, and a
// detached run also by the agent that owns it; the caller follows up per item
// (GetWorkflow, OpenAgentSession, the owner's book), which the reconciliation
// does anyway.
message GetLiveWorkSuccess {
  // Agents with no terminal frame: detached subagents, workflow agents.
  repeated conversation.v1.AgentId live_agents = 1;
  // Workflow runs with no terminal.
  repeated conversation.v1.DetachedWorkId live_workflows = 2;
  // Field 3 stays unused: no detached run is answered as a bare id, without
  // the owner whose book describes it.
  reserved 3;
  reserved "live_detached";
  // Non-agent detached runs (a shell) with no terminal, each with its owner,
  // oldest announcement first.
  repeated GetLiveWorkDetached live_detached_runs = 4;
}

// One live non-agent detached run, named together with the agent that owns it.
//
// THE OWNER IS PART OF THE ITEM, NOT A LOOKUP. The answer spans the whole
// lineage — the main agent and every subagent at any depth — and a run's
// start, the only record of what it IS, lies in its OWNER's book. A caller
// handed the id alone reads the main agent's book, finds no start for a run a
// subagent announced, and reports a description the record never lost. So a
// run is never answered without its owner: both fields are set on every item,
// and an item missing either is malformed.
message GetLiveWorkDetached {
  // REQUIRED. The run's handle: the key its own stream is opened under and the
  // unit its start was recorded as in the owner's book.
  conversation.v1.DetachedWorkId work = 1;
  // REQUIRED. The agent in the requested lineage that announced the run — the
  // main agent or a subagent at any depth (the detached row's declared owner).
  // The run is described from this agent's book, and a terminal the caller
  // writes for it is written there.
  conversation.v1.AgentId owner = 2;
}

// The set could not be read. THE ARM IS WHY.
message GetLiveWorkFailure {
  // The store's account, for a human and for logs; never switched on.
  string detail = 1;
  oneof kind {
    GetLiveWorkStorageFailure storage_failure = 2;
    // `session` unset or empty: the store refuses to answer unscoped.
    GetLiveWorkInvalidRequest invalid_request = 3;
  }
}
// The request was malformed or violated the validation invariant.
message GetLiveWorkInvalidRequest {
  // Which field, as the store names it — for the caller's logs, never
  // switched on.
  string field = 1;
}
// The database failed; `detail` carries the driver's text.
message GetLiveWorkStorageFailure {}
