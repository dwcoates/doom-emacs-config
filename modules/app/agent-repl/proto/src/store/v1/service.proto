// service.proto — the store's Connect service: every rpc signature, organized
// in commented sections, one endpoint_<rpc>.proto per rpc; store.proto holds
// the shared datatypes (the record, the write batch, the cursor, the page
// vocabulary).
//
// CALLERS ARE THE SHIM AND THE SIDECAR, never the daemon: the daemon's read
// path is shim.v1 (ReadHistory and the Watch streams), and the isolation
// discipline in store.proto's header applies to this service whole.

syntax = "proto3";

package store.v1;


import "store/v1/endpoint_get_live_work.proto";
import "store/v1/endpoint_get_sidecar_cursors.proto";
import "store/v1/endpoint_get_workflow.proto";
import "store/v1/endpoint_list_residue_shapes.proto";
import "store/v1/endpoint_open_agent_session.proto";
import "store/v1/endpoint_read_agent_page.proto";
import "store/v1/endpoint_watch_agent_session.proto";
import "store/v1/endpoint_watch_bash_run.proto";
import "store/v1/endpoint_write_batch.proto";

option go_package = "agentrepl/proto/store/v1;storev1";

service ShimStore {
  // ---- Reads: what the shim recovers and serves from durable state ----

  // Open one agent's reading session: the first page plus the watch token.
  rpc OpenAgentSession(OpenAgentSessionRequest) returns (OpenAgentSessionResponse);

  // The pure tail of an opened reading session.
  rpc WatchAgentSession(WatchAgentSessionRequest) returns (stream WatchAgentSessionResponse);

  // An OLDER page of one book, walking down from a served pointer. The first
  // page is OpenAgentSession's answer; this verb only continues.
  rpc ReadAgentPage(ReadAgentPageRequest) returns (ReadAgentPageResponse);

  // One detached shell run's lifecycle rows, replayed then followed, ending
  // after the terminal. Serves the shim's own WatchBash for runs whose bytes
  // the sidecar wrote.
  rpc WatchBashRun(WatchBashRunRequest) returns (stream WatchBashRunResponse);

  // One workflow run's stored state: description, derived agent level,
  // terminal if ended. Serves the shim's own GetWorkflow endpoint.
  rpc GetWorkflow(GetWorkflowRequest) returns (GetWorkflowResponse);

  // The catalog of key structures observed on lines no producer stored: one
  // row per distinct recursive key structure, so the vendor's API stays
  // discoverable after the bytes stop being kept.
  rpc ListResidueShapes(ListResidueShapesRequest) returns (ListResidueShapesResponse);

  // ---- Recovery: what a restarted producer reads back ----

  // The sidecar's persisted file cursors, for resuming every tailed file
  // exactly where the last committed batch left it.
  rpc GetSidecarCursors(GetSidecarCursorsRequest) returns (GetSidecarCursorsResponse);

  // ONE SESSION'S open obligations: everything started and never concluded,
  // per the record, within the lineage of the caller's main agent. The store
  // is shared by every session on the host, so the answer is scoped and an
  // unscoped request is refused. The shim resolves each at session start —
  // re-adopt or close.
  rpc GetLiveWork(GetLiveWorkRequest) returns (GetLiveWorkResponse);

  // ---- Writes: how a producer hands records to the store ----

  // One batch, durable or nothing, cursor advance in the same transaction.
  rpc WriteBatch(WriteBatchRequest) returns (WriteBatchResponse);
}
