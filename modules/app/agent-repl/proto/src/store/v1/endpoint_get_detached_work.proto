// endpoint_get_detached_work.proto — GetDetachedWork: WHAT KIND of detached
// work one unit left as, and WHETHER the record already holds it as ENDED.
//
// WHY THE SHIM ASKS. A task-stream message names its task but, for every
// subtype except `task_started`, never its kind: a `task_notification` states
// neither `task_type` nor anything else that tells a shell from an agent. The
// shim learns a task's kind only from the start it observed, and forgets it
// once the task settles; a shim that restarted since, or a keep-alive rewind
// that replaced the vendor query (whose replacement re-reports an old
// backgrounded shell as `stopped`), meets a notification it cannot type.
// Refused untyped, every such re-report recorded an ERROR (2026-10-02 onward,
// workspace ship-gns: task `bujbjom65`, eleven re-reports of one shell that had
// ended days before). Typed by the long-standing default instead, a shell's
// re-report would be settled as an AGENT run.
//
// WHY THE STORE CAN ANSWER. The run's `detached_work` row is written from the
// announcement and from the run's own frames, keeps the kind they stated, and
// ends when the run's terminal lands. It is located by its ORIGIN UNIT: the
// spawning call's activity id, which is the `tool_use_id` every task message
// of the run carries (GetRunSettlements reads the same column).
//
// UNSCOPED ON PURPOSE, like GetRunSettlements. The key is the vendor's own call
// id, compared for equality, and no two sessions share one. A lineage scope
// over the row's owner would refuse exactly the runs this lookup exists for:
// a backgrounded subagent's own shells, whose owner no producer observed and
// whose row records none.

syntax = "proto3";

package store.v1;

import "conversation/v1/agent_activity.proto";

option go_package = "agentrepl/proto/store/v1;storev1";

// Ask what the record holds of the detached work one unit left as.
message GetDetachedWorkRequest {
  // REQUIRED. The unit the work detached from: the spawning call's activity
  // id, the row's origin unit. UNSET or empty is refused with
  // `invalid_request`.
  conversation.v1.AgentActivityId unit = 1;
}

// The work, the statement that none is on record, or why neither could be
// said. THE ARM IS THE ANSWER.
message GetDetachedWorkResponse {
  oneof result {
    GetDetachedWorkSuccess success = 1;
    GetDetachedWorkNotFound not_found = 2;
    GetDetachedWorkFailure failure = 3;
  }
}

// The record holds exactly one row for the unit.
message GetDetachedWorkSuccess {
  // The kind the record holds. Always set.
  GetDetachedWorkKind kind = 1;
  // Whether the work is still running, per the record. Always set.
  oneof state {
    // No terminal has landed on the row.
    GetDetachedWorkLive live = 2;
    // The row's terminal has landed: anything a producer re-reports about
    // the work now restates a conclusion already recorded.
    GetDetachedWorkEnded ended = 3;
  }
}

// The kind of work the record holds, exactly as the record classified it. The
// store never derives one kind from another.
message GetDetachedWorkKind {
  oneof kind {
    GetDetachedWorkKindSubagent subagent = 1;
    GetDetachedWorkKindBash bash = 2;
    GetDetachedWorkKindWorkflow workflow = 3;
    GetDetachedWorkKindMonitor monitor = 4;
    // The record holds the work, but every write it took stated no kind the
    // store classifies: an announcement on the `detached` origin, which
    // continues a unit rather than describing the work. AN ANSWER, never a
    // kind to guess: the caller treats it as no kind at all.
    GetDetachedWorkKindUnstated unstated = 5;
  }
}
// A spawned agent's run.
message GetDetachedWorkKindSubagent {}
// A shell command's run.
message GetDetachedWorkKindBash {}
// A workflow's run.
message GetDetachedWorkKindWorkflow {}
// A monitor's run.
message GetDetachedWorkKindMonitor {}
// The record holds the work with no classified kind.
message GetDetachedWorkKindUnstated {}

// The work is still running, per the record.
message GetDetachedWorkLive {}

// The work has ended, per the record.
message GetDetachedWorkEnded {
  // When the record says it ended (the row's ended_at). Always set.
  int64 ended_at_ms = 1;
}

// No row of the record is located by this unit. An ANSWER, not a failure: the
// record was read and holds no detached work that left this unit — the unit
// never detached, or no producer has written it yet.
message GetDetachedWorkNotFound {}

// The work could not be read. THE ARM IS WHY.
message GetDetachedWorkFailure {
  // The store's account, for a human and for logs; never switched on.
  string detail = 1;
  oneof kind {
    // `unit` unset or empty.
    GetDetachedWorkInvalidRequest invalid_request = 2;
    // The database failed, or the record breaks the table's invariant (two
    // rows located by one origin unit, or a kind the store never writes);
    // `detail` says which.
    GetDetachedWorkStorageFailure storage_failure = 3;
  }
}
// The request was malformed.
message GetDetachedWorkInvalidRequest {
  // Which field, as the store names it — for the caller's logs, never
  // switched on.
  string field = 1;
}
// The database failed, or the record broke its invariant.
message GetDetachedWorkStorageFailure {}
