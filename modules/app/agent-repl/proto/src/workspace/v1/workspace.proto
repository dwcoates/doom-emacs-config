// workspace.proto — THE WORKSPACE IDENTITY VOCABULARY: the leaf package for
// facts specific to a workspace that more than one surface shares. Imported
// by frontend.v1 (join keys on drawn elements) and agentrepl.v1 (request
// addressing) alike; imports nothing.
//
// IDENTITIES ARE DAEMON-MINTED ECHO TOKENS. A path has many spellings
// ("$HOME/x", "~/x", "~/x/"), so a client-supplied path is never an
// identity: the daemon mints the id (RegisterWorkspace returns it,
// CreateWorkspace returns it, every view embeds it), and clients hand it
// back unchanged.

syntax = "proto3";

package workspace.v1;

option go_package = "agentrepl/proto/workspace/v1;workspacev1";

// A workspace, as the daemon identifies it.
message WorkspaceRef {
  // The sole supported workspace identifier — daemon-minted, opaque,
  // compared byte-wise, never parsed or derived from a path by a client.
  string id = 1;
  // The workspace's normalized worktree directory, for display and for
  // opening files. NOT an identifier — paths have many spellings; `id` is
  // the identity.
  string dir = 2;
}

// A repository, as the daemon identifies it — the same minting logic as
// WorkspaceRef, for the same reason. Clients get one from the roster's repo
// sections and hand it back (CreateWorkspace).
message RepositoryRef {
  // The sole supported repository identifier — daemon-minted, opaque.
  string id = 1;
  // The repository's normalized main-worktree directory. NOT an identifier.
  string dir = 2;
}

// How far along a workspace's work is: the stage the sidebar's maturity
// grouping files it under. The daemon resolves it and clients echo it back
// (UpdateSidebarView folds a stage's section); a client never derives one.
//
// THE STAGES, in the order work moves through them:
//
//   - backlog: registered, and no turn has ever run in it;
//   - in_progress: a turn has run, and no merge is in hand;
//   - merging: a merge is queued, running, or failed and back with the user.
//
// DONE IS NOT A STAGE HERE. A settled merge is the roster's recently-merged
// band (frontend.v1.WorkspaceRoster.recently_merged), which every grouping
// draws under its sections, so the maturity grouping's last stage is that
// band rather than a section of its own.
message MaturityStage {
  // THE ARM IS THE STAGE. Unset is malformed.
  oneof stage {
    MaturityStageBacklog backlog = 1;
    MaturityStageInProgress in_progress = 2;
    MaturityStageMerging merging = 3;
  }
}

// No turn has ever run in the workspace. DELIBERATELY EMPTY: the arm is the
// fact.
message MaturityStageBacklog {}

// A turn has run and no merge is in hand. DELIBERATELY EMPTY: the arm is the
// fact.
message MaturityStageInProgress {}

// A merge is queued, running, or failed. DELIBERATELY EMPTY: the arm is the
// fact.
message MaturityStageMerging {}
