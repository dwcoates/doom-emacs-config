// service.proto — the test service's Connect service: every rpc signature,
// one endpoint_<rpc>.proto per rpc; run.proto holds the shared datatypes.
//
// THE DAEMON IS THE ONLY CALLER. The test service, kept running by the
// platform's service manager like the store and the sidecar, owns every test
// gate's process, so a daemon deploy never cuts a gate: a resumed merge
// watches the run its gate started, by its id.

syntax = "proto3";

package testservice.v1;

import "testservice/v1/endpoint_start_run.proto";
import "testservice/v1/endpoint_stop_run.proto";
import "testservice/v1/endpoint_watch_run.proto";

option go_package = "agentrepl/proto/testservice/v1;testservicev1";

service Tests {
  // Start one run of a command in a directory; answers the run's id.
  rpc StartRun(StartRunRequest) returns (StartRunResponse);

  // Every line the run wrote from a line on, then the run's end. A run
  // that already ended is replayed whole and ended.
  rpc WatchRun(WatchRunRequest) returns (stream WatchRunResponse);

  // End a run that is no longer wanted, killing its whole process group.
  rpc StopRun(StopRunRequest) returns (StopRunResponse);
}
