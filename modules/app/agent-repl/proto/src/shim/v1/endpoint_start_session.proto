// endpoint_start_session.proto — StartSession: bind the shim to one vendor
// session and bring it to the point where a prompt can be ACCEPTED.
//
// RESOLVES WHEN A PROMPT CAN BE ACCEPTED — which is the shim's own readiness,
// not a vendor signal: the agent binary emits nothing on resume and its
// `init` arrives only with the first turn. Opening costs no model call.
//
// COLD CONTEXT IS REFUSED, NEVER SILENTLY PAID. A resume whose prompt cache
// has lapsed would re-read the whole context at full price on the first
// prompt. The shim detects that from the transcript alone and answers with
// the `cold` failure; the daemon then reopens with an explicit remediation.

syntax = "proto3";

package shim.v1;

import "conversation/v1/api.proto";
import "conversation/v1/permission.proto";
import "conversation/v1/session.proto";
import "conversation/v1/turn.proto";

option go_package = "agentrepl/proto/shim/v1;shimv1";

// What the daemon wants driven, and how. UNARY: the daemon persists the
// identity the answer carries and ATTACHES with WatchSession; spawning and
// attaching are decoupled because the session outlives the daemon.
message StartSessionRequest {
  // How the session comes to exist. The set arm is the source, and each
  // carries only what that source needs.
  oneof source {
    // A new vendor session, empty context.
    StartSessionFresh fresh = 1;
    // An existing vendor session. Refused with `cold` when its cache has
    // lapsed and no remediation is named.
    StartSessionResume resume = 2;
  }
}

// A new vendor session. Carries what nothing can recover: the model and the
// mode to begin with.
message StartSessionFresh {
  // The model to start on — an echo of a served option. UNSET = the SDK's
  // own default; SessionStarted.effective_model states what took effect.
  // (Optional since landing 7, 2026-09-02.)
  optional conversation.v1.AgentModel model = 1;
  // The permission mode to start in. Session state, changed later by
  // SetSessionPermissionMode; never per prompt.
  conversation.v1.AgentPermissionMode permission_mode = 2;
}

// Resume an existing vendor session. Carries NO model and NO mode: the SDK
// records both in the transcript per response and per prompt but does not
// restore them, so the shim reads the last of each back and passes them —
// the answer reports what was recovered.
message StartSessionResume {
  // The vendor's own identity for it, as a previous StartSession reported.
  string vendor_session_id = 1;
  // What to do about a cold context. UNSET means "refuse if cold" — the
  // daemon's first attempt, which learns the cost before paying it. Set only
  // on the retry that follows a `cold` failure; a warm context ignores it.
  optional conversation.v1.SessionColdRemediation cold_remediation = 2;
  // Set when this resume REBINDS the workspace to a different conversation —
  // the user chose it (BindWorkspaceSession), rather than the workspace
  // continuing the one it was already on.
  //
  // WHY THE SHIM HAS TO BE TOLD. The shim keeps a persisted main AgentId per
  // workspace — the BOOK every frame of the conversation is filed under and
  // the one the daemon reads history from — and a plain resume deliberately
  // keeps it whatever it already was, because a rotated resume handle must
  // not make everything recorded before the rotation unreachable. A bind is
  // the one resume where that rule is wrong: the workspace is now on a
  // DIFFERENT conversation, and leaving the old book in place replays the old
  // conversation's history over the new one and hides the chosen
  // conversation's own pages entirely.
  //
  // So this arm says: adopt the resumed conversation's identity as the
  // workspace's book. The shim resolves the resumed id to its ORIGINAL (a
  // forked or rotated id answers from its link file) and persists that, so a
  // bind to a rotated conversation lands on the book its records were filed
  // under rather than minting a second name for it.
  optional StartSessionRebind rebind = 3;
  // EVERY TURN OF THIS WORKSPACE THAT WAS ROLLED BACK (RollBackSession), as
  // the daemon recorded them. The vendor never rewrites its transcript: after
  // a rollback, the file still ends on the dropped branch until the next
  // prompt appends past the cut, so a plain resume of the newest record would
  // bring the dropped turns back into the agent's context. The shim resumes at
  // the newest record unless that record's chain holds the prompt of a turn
  // named here; then it resumes at the entry just before the earliest such
  // prompt. A branch the next prompt started holds none of them, so nothing
  // here ever needs clearing. Empty for a workspace never rolled back.
  repeated conversation.v1.TurnId rolled_back_turns = 4;
}

// This resume is a rebind: the workspace's book becomes the resumed
// conversation's own. Presence is the fact.
message StartSessionRebind {}

// THE ARM IS THE OUTCOME.
message StartSessionResponse {
  oneof result {
    StartSessionSuccess success = 1;
    StartSessionFailure failure = 2;
  }
}

// The session can accept a prompt.
//
// PRODUCER OBLIGATION: before this is returned the shim has ALREADY begun its
// cache keep-alive cadence, so a warm context stays warm while the user is
// still typing, and a context opened under `pay` takes its cold read here —
// in the background, once — rather than on the user's first prompt. The
// cadence has STARTED; the read need not have finished. The keep-alive is the
// shim's own mechanism and never appears on this wire.
message StartSessionSuccess {
  // The opened session, whole — the same facts every surface reads.
  conversation.v1.SessionStarted session = 1;
}

// The session could not be opened as asked. THE ARM IS WHY.
message StartSessionFailure {
  oneof cause {
    // The context is cold and no remediation was named: here is what
    // resuming would cost, so a remediation can be chosen.
    conversation.v1.SessionCold cold = 1;
    // The agent binary (or the SDK query) failed to start; `detail` carries
    // the cause, and the arm says whether asking again can help.
    StartSessionVendorStartFailed vendor_start_failed = 3;
    // A resume named a session id with no transcript on disk — refused
    // BEFORE any process spawns (a vanished file yields no death evidence).
    // NOT RETRYABLE: the transcript will not reappear by asking again.
    StartSessionUnknownSession unknown_session = 4;
    // A second StartSession on a shim that already holds a session. Neither
    // retryable nor a rejection: the caller dialed a live shim, which is a
    // defect in the caller, and it attaches rather than starts.
    StartSessionAlreadyStarted already_started = 5;
    // Another shim holds this conversation's kernel lock: the holder exited
    // with the code reserved for "already held". Nothing else answers this.
    // NOT RETRYABLE: the other shim's ownership is a real conflict.
    StartSessionConversationOwned conversation_owned = 6;
    // THIS shim's own kernel-lock holder (`shim-lock`) FAILED — it could not
    // be spawned, exited or was killed before holding the lock, answered the
    // wrong line, or never answered — so NOBODY is known to own the
    // conversation. Distinct from conversation_owned, which is a real
    // ownership conflict: this one is a defect in this shim's deployment, and
    // naming it as an ownership conflict sends the reader hunting for a second
    // process that does not exist. RETRYABLE: a holder that failed to spawn or
    // answer may succeed on the next StartSession on the same shim.
    StartSessionLockHolderUnavailable lock_holder_unavailable = 7;
  }
  // The shim's account, for a human and for logs; never switched on.
  string detail = 2;
}
// The vendor (the agent binary or its SDK query) did not come up inside a shim
// that is itself healthy.
//
// THE SHIM LABELS WHETHER ASKING AGAIN CAN HELP, because only the shim sees
// what the vendor said and did before it failed: a child that went silent or
// died, or an API answer of overloaded / server error / network failure, is
// transient; a credential rejection, a missing model, a refused resume or a
// blocking hook will fail identically every time. The daemon owns the retry
// loop and its schedule and never re-derives this label from `detail`.
//
// A retryable failure leaves the shim able to take another StartSession for
// the same session on the SAME process: the caller retries without
// relaunching it.
message StartSessionVendorStartFailed {
  // Whether a later StartSession can succeed. Always set; a frame with
  // neither arm is malformed and the caller treats it as a rejection.
  oneof retry {
    // Transient: the same request may succeed if asked again.
    StartSessionVendorStartRetryable retryable = 1;
    // Deterministic: the same request will fail the same way.
    StartSessionVendorStartRejected rejected = 2;
  }
}
// The vendor start failed for a reason that can pass: it stayed silent past
// its liveness bound, its process or stream ended before it was ready, or the
// API answered with a transient error (overloaded, a server error, a network
// failure). The caller retries on its own backoff.
message StartSessionVendorStartRetryable {}
// The vendor refused the start for a reason that will not pass on its own: a
// credential rejection, a missing model, a refused resume, or a hook that
// blocked the opening. The caller does not retry; the user must change
// something and restart.
message StartSessionVendorStartRejected {}
message StartSessionUnknownSession {}
message StartSessionAlreadyStarted {}
message StartSessionConversationOwned {}
message StartSessionLockHolderUnavailable {
  // Tags 1 and 2 (`binary`, `os_error`) are RETIRED: they could say only
  // that the holder would not spawn. `failure` says how it failed.
  reserved 1, 2;
  reserved "binary", "os_error";
  // Which holder failed, and how. Always set.
  conversation.v1.LockHolderFailure failure = 3;
}
