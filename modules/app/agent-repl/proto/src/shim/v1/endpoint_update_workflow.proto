// endpoint_update_workflow.proto — UpdateWorkflow: the one input vocabulary
// every live agent takes, addressed to a workflow run.

syntax = "proto3";

package shim.v1;

import "conversation/v1/agent.proto";
import "conversation/v1/detached_work.proto";

option go_package = "agentrepl/proto/shim/v1;shimv1";

// Input to a workflow run.
message UpdateWorkflowRequest {
  // WHICH run. Not a live run: refused.
  conversation.v1.DetachedWorkId work = 1;
  // What is being said. A stop ends the run; an answer reaches whichever of
  // the run's agents posed the ask (the ask id says which). How a prompt lands
  // on a run is the shim's decision for this kind.
  conversation.v1.AgentInput input = 2;
}

// THE ARM IS THE OUTCOME OF THE CALL — never of the work.
message UpdateWorkflowResponse {
  oneof result {
    UpdateWorkflowSuccess success = 1;
    UpdateWorkflowFailure failure = 2;
  }
}

// Delivered; what it changed arrives on the run's stream.
message UpdateWorkflowSuccess {}

// Not delivered: no such run, no such ask, an input this kind cannot take. `kind` arms are DERIVED at the wave from the shim's real refusal
// sites.
message UpdateWorkflowFailure {
  // The shim's account, for a human and for logs; never switched on.
  string detail = 1;
}
