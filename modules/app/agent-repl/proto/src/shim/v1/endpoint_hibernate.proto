// endpoint_hibernate.proto — Hibernate: the daemon's pre-hibernation
// directive. SESSION section. The daemon calls this BEFORE standing an idle
// shim down to free what it holds. The shim never compacts for it: the
// transcript is left exactly as it stands, and a session revived later pays
// for its own context through the cold gate. The directive exists for its two
// refusals — no session to stand down, or a turn still in flight — and acks
// otherwise, after which the daemon stands the shim down.

syntax = "proto3";

package shim.v1;

option go_package = "agentrepl/proto/shim/v1;shimv1";

// The directive carries nothing: the shim answers from its own session state.
message HibernateRequest {
}

// THE ARM IS THE OUTCOME.
message HibernateResponse {
  // Whether the shim may be stood down now, or why not.
  oneof result {
    HibernateSuccess success = 1;
    HibernateError error = 2;
  }
  reserved 3;
  reserved "compacting";
}

// Nothing is in flight; the daemon may stand the shim down. The transcript is
// untouched.
message HibernateSuccess {
}

// Not hibernated. THE ARM IS WHY.
message HibernateError {
  // The one condition that keeps the shim from being stood down now.
  oneof kind {
    // A turn is in flight; hibernation waits for freeness.
    HibernateTurnInFlight turn_in_flight = 1;
    // No session is open on this shim.
    HibernateNoSession no_session = 3;
  }
  reserved 2;
  reserved "compaction_failed";
}
// A turn is in flight; standing the shim down would kill it. The daemon
// defers and asks again on its next sweep pass.
message HibernateTurnInFlight {}
// No session is open on this shim, so there is nothing to stand down.
message HibernateNoSession {}
