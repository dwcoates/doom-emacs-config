// endpoint_close_session.proto — CloseSession: orderly teardown. Stops the
// keep-alive cadence, ends the vendor query, lets every open stream conclude
// with a terminal frame, and exits. REFUSES while anything is live unless
// forced: the daemon is the one decider of what dies.

syntax = "proto3";

package shim.v1;

import "conversation/v1/session.proto";

option go_package = "agentrepl/proto/shim/v1;shimv1";

// Whether live work may be killed to close.
message CloseSessionRequest {
  // When true, live work is killed to close: the turn is interrupted and
  // every detached item stopped, each stream concluding with its
  // `interrupted` arm first. When false, live work is a refusal.
  bool force = 1;
}

// THE ARM IS THE OUTCOME.
message CloseSessionResponse {
  oneof result {
    CloseSessionSuccess success = 1;
    CloseSessionFailure failure = 2;
  }
}

// Closed; the shim exits after answering.
message CloseSessionSuccess {
  // How it closed, and what died if it was forced.
  conversation.v1.SessionClosed closed = 1;
}

// Not closed. THE ARM IS WHY.
message CloseSessionFailure {
  oneof cause {
    // Work is live and force was not asked: here is what is live.
    conversation.v1.SessionLive live = 1;
    // Further arms DERIVED at the wave (the query refusing to end).
  }
  // The shim's account, for a human and for logs; never switched on.
  string detail = 2;
}
