// endpoint_read_transcripts.proto — ReadTranscripts: every vendor
// conversation that exists for THIS shim's working directory, with the facts
// a person needs to choose between them.
//
// WHY IT LIVES ON THE SHIM. The shim owns the transcript, and this is a fact
// ABOUT the transcripts: where the vendor files them, how they are named, and
// what their lines mean are the vendor adapter's knowledge, exactly as
// GatherTitleDigest's is. The daemon asks the one process that can read them.
//
// IT READS, AND IT SPENDS NOTHING. No query is started and no model is
// called, the same discipline the cold gate's own read follows: every figure
// below comes from the transcript's own lines.
//
// IT ANSWERS THE DIRECTORY, NOT THE SESSION. This shim is bound to one
// conversation, and the point of the verb is to find the OTHERS — so the
// answer includes the bound one, flagged, rather than omitting it.
//
// NO PAINT ATTESTATION: this answers what the transcripts state, never that
// anything was drawn from them.

syntax = "proto3";

package shim.v1;

import "conversation/v1/api.proto";

option go_package = "agentrepl/proto/shim/v1;shimv1";

// Ask for the conversations filed under this shim's working directory. The
// shim resolves the directory from its own identity, so the request names
// nothing.
message ReadTranscriptsRequest {}

// THE ARM IS THE OUTCOME.
message ReadTranscriptsResponse {
  oneof result {
    ReadTranscriptsSuccess success = 1;
    ReadTranscriptsFailure failure = 2;
  }
}

// The conversations found, newest activity first. An EMPTY list is a success:
// a directory with no transcripts is an answer, not a failure.
message ReadTranscriptsSuccess {
  repeated Transcript transcripts = 1;
}

// One conversation, as its transcript states it.
//
// EVERY FIELD IS READ FROM THE FILE, and the fields a given transcript does
// not state are left unset rather than defaulted — a zero that cannot be told
// from an absence is how a chooser ends up ranking an unreadable conversation
// as the smallest one.
message Transcript {
  // The vendor's own identity for the conversation, which is what
  // StartSessionResume names.
  string vendor_session_id = 1;
  // When the conversation's last request happened, in epoch milliseconds —
  // the same instant the cold gate judges cache lapse from. UNSET when the
  // transcript states no request.
  optional int64 last_request_at_ms = 2;
  // What the last request carried: cache reads + cache writes + fresh input.
  // The cost of resuming this conversation, and the figure the cold gate
  // weighs against its floor. UNSET when the transcript states no usage.
  optional int64 context_tokens = 3;
  // The model that answered the last request, when the transcript states one.
  optional conversation.v1.AgentModel last_model = 4;
  // The conversation's OPENING WORDS — the beginning of its first user
  // prompt, truncated by the shim — so a person choosing between transcripts
  // reads a conversation rather than an id. UNSET when the transcript holds
  // no user prompt.
  optional string opening = 5;
  // How many user prompts the transcript holds, which is how a person tells a
  // long conversation from an abandoned one at a glance.
  uint32 prompts = 6;
  // Set when this is the conversation THIS shim is bound to. Presence is the
  // fact, exactly as the roster's markers state theirs.
  optional TranscriptBound bound = 7;
  // Set when the transcript's most recent context boundary is a CLEAR, so a
  // chooser can see that the conversation resumes with an empty context
  // rather than the size `context_tokens` reports.
  optional TranscriptCleared cleared = 8;
  // Set when the file was APPENDED TO moments ago, which means some process
  // is driving this conversation right now. It is a file fact and nothing
  // more — the shim knows no process table — but it is the only evidence
  // there is that resuming would put two writers on one transcript, and the
  // daemon refuses a bind on it.
  optional TranscriptActive active = 9;
}

// The transcript is being written to right now.
message TranscriptActive {
  // When the file was last appended to, in epoch milliseconds.
  int64 at_ms = 1;
  // The idle span the shim required before it would call a transcript quiet,
  // so the daemon's refusal can state the rule it applied rather than a bare
  // verdict.
  int64 quiet_after_ms = 2;
}

// This shim's own conversation.
message TranscriptBound {}

// The last boundary in the transcript is a context clear.
message TranscriptCleared {
  // When the clear happened, in epoch milliseconds.
  int64 at_ms = 1;
}

// Arms derived from the shim's refusal sites. A transcript that cannot be
// READ is not among them: an unreadable file is left out of the list with a
// record in the shim's log, because one corrupt transcript must not deny a
// person the choice between the rest.
message ReadTranscriptsFailure {
  oneof cause {
    // The vendor's project directory for this working directory does not
    // exist. Distinct from an empty list: nothing has ever run here.
    ReadTranscriptsNoProjectDir no_project_dir = 1;
    // The directory exists and could not be listed.
    ReadTranscriptsUnreadable unreadable = 2;
  }
}

message ReadTranscriptsNoProjectDir {
  // The path the shim looked in.
  string searched_path = 1;
}

message ReadTranscriptsUnreadable {
  // The path the shim looked in.
  string searched_path = 1;
  // The read's own account of the failure.
  string detail = 2;
}
