// endpoint_read_history.proto — ReadHistory: an OLDER page of one agent's
// durable history, walking down from a served pointer. There is no
// first-page arm: the first page is WatchAgent's opening frame, and this
// verb only continues — scroll-back, and walking a catch-up gap down to the
// caller's own mark.

syntax = "proto3";

package shim.v1;

import "conversation/v1/agent_activity.proto";
import "conversation/v1/history.proto";

option go_package = "agentrepl/proto/shim/v1;shimv1";

// Which agent's history, and where in it.
message ReadHistoryRequest {
  // WHOSE history. UNSET = the session's prompt thread, resolved by the
  // shim; an unknown agent is a refusal.
  optional conversation.v1.AgentId target = 1;
  // This page's budget.
  uint32 page_size = 2;
  // The page begins strictly OLDER than the entry this pointer names — a
  // pointer served by a page's `more` arm or by a watched entry, echoed
  // verbatim.
  conversation.v1.HistoryPointer after = 3;
}

// THE ARM IS THE OUTCOME.
message ReadHistoryResponse {
  oneof result {
    ReadHistorySuccess success = 1;
    ReadHistoryFailure failure = 2;
  }
}

// The page. An EMPTY page with `floor` is a legitimate answer for an agent
// with no history yet.
message ReadHistorySuccess {
  conversation.v1.HistoryPage page = 1;
}

// Not served. `kind` arms are DERIVED at the wave from the shim's real
// refusal sites: an unknown agent, a continuation the store no longer
// honors, the store unavailable.
message ReadHistoryFailure {
  // The shim's account, for a human and for logs; never switched on.
  string detail = 1;
}
