// endpoint_get_session_context_usage.proto — GetSessionContextUsage:
// SESSION section. The daemon PULLS the session's current context usage at
// its own cadence (and at every turn end) — the GetSessionDiagnostics
// pattern. The shim answers with the vendor's get_context_usage control
// response mapped into the conversation fact; it never estimates and never
// derives from usage frames.

syntax = "proto3";

package shim.v1;

import "conversation/v1/session.proto";

option go_package = "agentrepl/proto/shim/v1;shimv1";

message GetSessionContextUsageRequest {}

message GetSessionContextUsageResponse {
  oneof result {
    GetSessionContextUsageSuccess success = 1;
    GetSessionContextUsageFailure failure = 2;
  }
}

message GetSessionContextUsageSuccess {
  conversation.v1.SessionContextUsage usage = 1;
}

// The vendor could not answer (no session up, control error). `kind` arms
// are DERIVED at the wave from the shim's real failure sites.
message GetSessionContextUsageFailure {
  // The shim's account, for logs; never switched on.
  string detail = 1;
}
