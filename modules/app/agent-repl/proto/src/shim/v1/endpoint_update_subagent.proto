// endpoint_update_subagent.proto — UpdateSubagent: the one input vocabulary
// every live agent takes, addressed to a subagent.

syntax = "proto3";

package shim.v1;

import "conversation/v1/agent.proto";
import "conversation/v1/agent_activity.proto";

option go_package = "agentrepl/proto/shim/v1;shimv1";

// Input to a subagent.
message UpdateSubagentRequest {
  // WHICH subagent — by AGENT, not by run: a prompt may be addressed to an
  // agent whose run has finished, and then there is no live handle to name.
  // A stop or an answer addressed to an agent with no live run is a refusal.
  conversation.v1.AgentId agent = 1;
  // What is being said. The shim decides how each arm lands for this kind.
  conversation.v1.AgentInput input = 2;
}

// THE ARM IS THE OUTCOME OF THE CALL — never of the work.
message UpdateSubagentResponse {
  oneof result {
    UpdateSubagentSuccess success = 1;
    UpdateSubagentFailure failure = 2;
  }
}

// Delivered; what it changed arrives on the run's stream.
message UpdateSubagentSuccess {}

// Not delivered: unknown agent, a stop or answer with no live run, no such ask. `kind` arms are DERIVED at the wave from the shim's real refusal
// sites.
message UpdateSubagentFailure {
  // The shim's account, for a human and for logs; never switched on.
  string detail = 1;
}
