// endpoint_get_session_diagnostics.proto — GetSessionDiagnostics: the
// daemon asks the shim how it is. A pull, at the daemon's cadence: the shim
// never volunteers this on the standing stream, which carries upstream
// happenings only.

syntax = "proto3";

package shim.v1;

import "conversation/v1/session.proto";

option go_package = "agentrepl/proto/shim/v1;shimv1";

// Nothing to say: the session is the connection's.
message GetSessionDiagnosticsRequest {}

// THE ARM IS THE OUTCOME OF THE CALL. Unhealthy is inside success.
message GetSessionDiagnosticsResponse {
  oneof result {
    GetSessionDiagnosticsSuccess success = 1;
    GetSessionDiagnosticsFailure failure = 2;
  }
}

// The shim answered.
message GetSessionDiagnosticsSuccess {
  conversation.v1.SessionDiagnostics diagnostics = 1;
}

// The shim could not answer. Arms DERIVED at the wave; a shim that cannot
// report on itself is mostly a shim that is gone, which the transport says.
message GetSessionDiagnosticsFailure {
  // The shim's account, for a human and for logs; never switched on.
  string detail = 1;
}
