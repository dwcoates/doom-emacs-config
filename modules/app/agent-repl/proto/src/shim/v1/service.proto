// service.proto — shim.v1: every rpc signature, sectioned by suite. Each
// rpc's request and response live in endpoint_<rpc>.proto; shared vocabulary
// lives in its own file only when more than one endpoint needs it.
//
// NO PAINT ATTESTATION: a response never claims anything was rendered.

syntax = "proto3";

package shim.v1;

import "shim/v1/endpoint_detach_foreground.proto";
import "shim/v1/endpoint_gather_title_digest.proto";
import "shim/v1/endpoint_hibernate.proto";
import "shim/v1/endpoint_kill_session.proto";
import "shim/v1/endpoint_kill_turn.proto";
import "shim/v1/endpoint_roll_back_session.proto";
import "shim/v1/endpoint_read_history.proto";
import "shim/v1/endpoint_read_transcripts.proto";
import "shim/v1/endpoint_set_session_model.proto";
import "shim/v1/endpoint_set_session_effort.proto";
import "shim/v1/endpoint_set_session_permission_mode.proto";
import "shim/v1/endpoint_start_session.proto";
import "shim/v1/endpoint_start_turn.proto";
import "shim/v1/endpoint_stop_bash.proto";
import "shim/v1/endpoint_watch_agent.proto";
import "shim/v1/endpoint_update_agent.proto";
import "shim/v1/endpoint_get_workflow.proto";
import "shim/v1/endpoint_stop_workflow.proto";
import "shim/v1/endpoint_watch_bash.proto";
import "shim/v1/endpoint_watch_session.proto";
import "shim/v1/endpoint_watch_workflow.proto";

option go_package = "agentrepl/proto/shim/v1;shimv1";

// The shim: the vendor adapter the daemon drives, one per session. Sessions
// and turns OUTLIVE the daemon, so for each the three acts are decoupled:
// SPAWN it (unary, returns an identity the daemon persists), ATTACH to it (a
// Watch stream that creates nothing and ends nothing — a consumer closing it
// leaves the work running; a daemon shutting down closes its Watches
// gracefully and the shim tolerates an abrupt close the same way), and END it
// (a Kill, which refuses while work is live unless forced).
service Shim {
  // ---- Session: spawn, attach, condition, inspect, end ----

  // SPAWN: bind to a vendor session and bring it to the point where a prompt
  // can be accepted. A cold context is REFUSED with its cost until a
  // remediation is named; the shim begins its keep-alive cadence before
  // answering.
  rpc StartSession(StartSessionRequest) returns (StartSessionResponse);
  // ATTACH: the standing stream of session-level facts as they manifest
  // upstream. The facts fixed at start are StartSession's. The shim's own
  // health and the session's context usage RIDE THIS STREAM as pushed arms
  // (SessionUpdate.diagnostics, SessionUpdate.context_usage) — no pull
  // verbs exist for them.
  rpc WatchSession(WatchSessionRequest) returns (stream WatchSessionResponse);
  // Change the model from the next turn on. Resolves after the current turn
  // ends; refused IMMEDIATELY with the cold cost when the context exceeds the
  // request's threshold and no remediation is named.
  rpc SetSessionModel(SetSessionModelRequest) returns (SetSessionModelResponse);
  // Change the reasoning effort from the next turn on. Resolves after the
  // current turn ends; never cold-gated.
  rpc SetSessionEffort(SetSessionEffortRequest) returns (SetSessionEffortResponse);
  // Change the session's permission mode for every gate from now on.
  rpc SetSessionPermissionMode(SetSessionPermissionModeRequest) returns (SetSessionPermissionModeResponse);

  // The pre-hibernation directive: the shim compacts, then acks; the daemon
  // stands the shim down only after the ack. See endpoint_hibernate.proto.
  rpc Hibernate(HibernateRequest) returns (HibernateResponse);

  // END: the session and EVERYTHING live in it — the turn if one is open and
  // every live task, whichever turn spawned it. Refuses while anything is
  // live unless forced; names what it killed.
  rpc KillSession(KillSessionRequest) returns (KillSessionResponse);

  // ---- Agent: start a turn on any agent, watch any agent, speak to it ----

  // SPAWN the session's turn — the main agent's verb only. Unary: returns
  // once the prompt is accepted, WITH the first page; `prompt.agent` is the
  // WatchAgent address. An existing agent is prompted with UpdateAgent.
  rpc StartTurn(StartTurnRequest) returns (StartTurnResponse);

  // ONE stream for any agent: opens with a page (full, or the gap above the
  // caller's own mark), then tails. Ends nothing; close it freely.
  rpc WatchAgent(WatchAgentRequest) returns (stream WatchAgentResponse);

  // Speak to an existing agent: stop it, answer its open ask, or prompt it
  // (a subagent, a workflow agent — never the session's own turn).
  rpc UpdateAgent(UpdateAgentRequest) returns (UpdateAgentResponse);

  // END the turn. Unforced, the synchronous turn only: detached work runs on.
  // Forced, the agent and everything THIS turn spawned, transitively.
  rpc KillTurn(KillTurnRequest) returns (KillTurnResponse);

  // REWIND the main agent's vendor conversation to just before one of its
  // prompts: interrupt the open turn, optionally stop the dropped turns'
  // detached work and restore the files, then resume the vendor session at
  // the last entry before the prompt. See endpoint_roll_back_session.proto.
  rpc RollBackSession(RollBackSessionRequest) returns (RollBackSessionResponse);

  // ---- Detached work: one stream per live item, and the writes each kind accepts ----

  // Follow a backgrounded shell command: the bash unit itself.
  rpc WatchBash(WatchBashRequest) returns (stream WatchBashResponse);
  // Kill a backgrounded shell command — the only input a process takes.
  rpc StopBash(StopBashRequest) returns (StopBashResponse);

  // The unary open of a run: its description, and either the watch token or
  // how it ended.
  rpc GetWorkflow(GetWorkflowRequest) returns (GetWorkflowResponse);

  // The tail of one gotten run: subagent levels, then the terminal frame.
  rpc WatchWorkflow(WatchWorkflowRequest) returns (stream WatchWorkflowResponse);

  // End a run. Its agents are addressed individually; the run's only
  // addressable act is stopping it.
  rpc StopWorkflow(StopWorkflowRequest) returns (StopWorkflowResponse);

  // Move in-flight turn work onto its own stream (Ctrl-B). The turn then
  // announces it as detached, and the consumer opens the matching Watch.
  rpc DetachForeground(DetachForegroundRequest) returns (DetachForegroundResponse);

  // ---- History: bounded reads of one agent's durable past ----

  // One page of one agent's history, newest first, from the newest or from
  // a page already received. Serves cold open, scroll-back, and the daemon's
  // own catch-up after a restart alike.
  rpc ReadHistory(ReadHistoryRequest) returns (ReadHistoryResponse);

  // Every conversation filed under this shim's working directory, read off
  // the transcripts themselves. Spends nothing; see
  // endpoint_read_transcripts.proto.
  rpc ReadTranscripts(ReadTranscriptsRequest) returns (ReadTranscriptsResponse);

  // ---- Title digest: the material for a synthesized workspace title ----

  // The prompts (and, after a /compact, the compaction summary) the daemon
  // summarizes into a workspace title of its own when the vendor has written
  // no ai-title. Reads the transcript the shim owns; produces nothing and ends
  // nothing.
  rpc GatherTitleDigest(GatherTitleDigestRequest) returns (GatherTitleDigestResponse);
}
