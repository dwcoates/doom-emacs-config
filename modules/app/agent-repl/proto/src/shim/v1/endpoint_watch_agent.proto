// endpoint_watch_agent.proto — WatchAgent: ONE stream for any agent — the
// prompt thread, a detached subagent, a workflow's agent. Opens with a page,
// then tails. The consolidation the parity principle asks for: the daemon
// learns an agent id (from StartTurn's answer, a spawn announcement, a
// workflow level) and calls this; nothing else differs per kind.

syntax = "proto3";

package shim.v1;

import "conversation/v1/agent_activity.proto";
import "conversation/v1/history.proto";

option go_package = "agentrepl/proto/shim/v1;shimv1";

// Follow one agent.
message WatchAgentRequest {
  // WHOM. UNSET = the session's prompt thread, resolved by the shim.
  optional conversation.v1.AgentId target = 1;
  // Tag 2 (`page_size`) is RETIRED: a page is the store's page — ONE size for
  // the whole stack (50 entries), owned by the store and stated nowhere else.
  reserved 2;
  reserved "page_size";
  // What the opening page carries. UNSET = repaint: the newest page in
  // descending conversation place.
  oneof opening {
    // The newest entry the caller already holds: catch-up. The opening page
    // carries only entries FIRST WRITTEN AFTER this one — catch-up is about
    // what was written since, never about place, so a late-written entry
    // placed earlier in the conversation is delivered rather than skipped. The
    // shim tracks nothing about what it previously served — the caller states
    // its own high-water mark. A fresh agent simply yields an empty page.
    conversation.v1.HistoryPointer known_through = 3;
    // No history: the opening page carries no entries and the stream carries
    // only what is written from now on. The daemon opens every watch this way
    // when it holds nothing of the agent's history, and loads history only
    // when a reader asks for it (ReadHistory). An entry read that way and also
    // received on this stream is absorbed by its identity.
    WatchAgentTailOnly tail_only = 4;
  }
}

// A STANDING stream: the opening page, then one frame per entry as written —
// upserts included, each with its pointer so the caller always holds a
// current mark. It does not conclude when the agent does: the terminal fact
// rides the entries, and the caller closes the stream when it stops caring.
message WatchAgentResponse {
  oneof frame {
    // The first frame of every watch: the opening page (bounded by
    // known_through when given; `more` walks older via ReadHistory).
    conversation.v1.HistoryPage page = 1;
    // Every later frame: one entry as written.
    conversation.v1.HistoryEntryAt entry = 2;
    // An entry the store RETIRED: a re-derivation of the record behind it
    // found the record no longer converts to it, so it is no longer part of
    // this agent's history and no page serves it again. It carries the entry
    // as last served, at its own pointer, so the caller removes whatever it
    // drew for it. The pointer stays a valid known_through.
    conversation.v1.HistoryEntryAt retired = 3;
  }
}

// Open the stream with no history. DELIBERATELY EMPTY: the arm's presence is
// the whole instruction.
message WatchAgentTailOnly {}
