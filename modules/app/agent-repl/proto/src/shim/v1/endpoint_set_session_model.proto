// endpoint_set_session_model.proto — SetSessionModel: change the model for every response
// from the NEXT turn on.
//
// RESOLVES AFTER THE CURRENT TURN ENDS, never mid-turn: the switch takes
// effect between turns, so a turn is answered by one model throughout, and
// this call returns only once that boundary has passed. With no turn open it
// resolves at once.
//
// A MODEL SWITCH IS A COLD CACHE. The prompt cache is per model, so the next
// request re-reads the whole context whatever the TTL. The same discipline as
// StartSession applies: the request names the size above which that cost is
// NOT to be paid unasked; a larger context is refused IMMEDIATELY — before
// any waiting — with the cost, and the daemon retries naming a remediation.

syntax = "proto3";

package shim.v1;

import "conversation/v1/api.proto";
import "conversation/v1/session.proto";

option go_package = "agentrepl/proto/shim/v1;shimv1";

// Which model, and what a cold switch may cost.
message SetSessionModelRequest {
  // The model — an echo of a served option. One not in the catalog is a
  // refusal.
  conversation.v1.AgentModel model = 1;
  // The context size, in tokens, above which the switch is refused with
  // `cold` rather than paid. The daemon's policy, stated per call.
  uint64 cold_threshold_tokens = 2;
  // What to do when the context exceeds the threshold. UNSET means "refuse"
  // — the daemon's first attempt, which learns the cost before paying it.
  // Set on the retry that follows a `cold` failure; a context under the
  // threshold ignores it.
  optional conversation.v1.SessionColdRemediation cold_remediation = 3;
}

// THE ARM IS THE OUTCOME.
message SetSessionModelResponse {
  oneof result {
    SetSessionModelSuccess success = 1;
    SetSessionModelFailure failure = 2;
  }
}

// Switched, and the turn boundary has passed. Carries the model now in effect
// — the same fact SessionUpdate.model_changed states on the standing stream.
message SetSessionModelSuccess {
  conversation.v1.SessionModelChanged model_changed = 1;
}

// Not switched. THE ARM IS WHY.
message SetSessionModelFailure {
  oneof cause {
    // The context exceeds the threshold and no remediation was named: here
    // is what the switch would cost, so a remediation can be chosen.
    conversation.v1.SessionCold cold = 1;
    // Further arms DERIVED at the wave from the shim's real sites (a model not
    // in the catalog, no session, the vendor refusing the switch).
  }
  // The shim's account, for a human and for logs; never switched on.
  string detail = 2;
}
