// endpoint_send_keepalive.proto — SendKeepalive: send ONE keep-alive now.
// SESSION section.
//
// THE DAEMON DRIVES EVERY KEEP-ALIVE (owner ruling, 2026-10-26). A shim runs
// no keep-alive cadence of its own: the daemon times each beat from the cache
// clock its workspace's turns keep, and asks for it here -- and the user can
// ask for one for a hidden workspace on demand (owner request, 2026-10-14).
// The shim submits its ordinary keep-alive turn at once.
//
// THE NEW LAPSE FOLLOWS ON THE SESSION STREAM, never in this answer. The
// keep-alive's own API response re-anchors the cache like any request does,
// and the shim restates the projected lapse on every anchor change
// (conversation.v1.SessionCacheLapse), so the daemon counts down to the later
// lapse with no second path for it. `sent` therefore means the turn was
// SUBMITTED; its answer, and the lapse it moves, arrive afterwards.

syntax = "proto3";

package shim.v1;

option go_package = "agentrepl/proto/shim/v1;shimv1";

// DELIBERATELY EMPTY: the call is the request. The keep-alive targets the one
// session this shim serves.
message SendKeepaliveRequest {}

// THE ARM IS THE OUTCOME.
message SendKeepaliveResponse {
  oneof result {
    SendKeepaliveSuccess success = 1;
    SendKeepaliveError error = 2;
  }
}

// The session answered. Whether a keep-alive actually went out is the
// shim's judgment of the session as it stands, and both answers are
// legitimate: a skipped keep-alive is never a failure of the request.
message SendKeepaliveSuccess {
  // THE ARM IS WHAT HAPPENED: a keep-alive was submitted, or the shim judged
  // that none may go out now.
  oneof outcome {
    SendKeepaliveSent sent = 1;
    SendKeepaliveSkipped skipped = 2;
  }
}

// The keep-alive turn was submitted. Its answer re-anchors the cache, and the
// shim restates the projected lapse on the session stream when it does. DELIBERATELY EMPTY: the arm is the outcome.
message SendKeepaliveSent {}

// No keep-alive went out. THE ARM IS WHY: the shim stays the judge of whether
// a keep-alive may go out, whoever asked for it.
message SendKeepaliveSkipped {
  oneof reason {
    SendKeepaliveSkippedMainAgentBusy main_agent_busy = 1;
    SendKeepaliveSkippedDetachedWorkLive detached_work_live = 2;
    SendKeepaliveSkippedCacheLapsed cache_lapsed = 3;
  }
}

// The main agent's slot is taken: a turn is in flight (a keep-alive's
// included), a vendor-started turn is running, a StartTurn is being
// processed, or a rollback is replacing the query. A keep-alive submitted now
// would be a second submitter. The cache needs none: whatever holds the slot
// is itself reading the cache, and its requests re-anchor it.
message SendKeepaliveSkippedMainAgentBusy {
  // What holds the slot, composed by the shim for the records ("a turn is in
  // flight", "a rollback is in progress").
  string detail = 1;
}

// Detached work (a background shell or agent) is live in the session. A
// keep-alive owes the yield obligation's rewind, and the rewind replaces the
// vendor's query, which kills every piece of detached work the old query ran.
message SendKeepaliveSkippedDetachedWorkLive {
  // How many detached-work items are live.
  uint32 live_items = 1;
}

// The cache has already lapsed. A keep-alive now would buy the full-price
// cold read the cold gate exists to make the user decide on, so the cold
// gate owns the next request.
message SendKeepaliveSkippedCacheLapsed {
  // When the cache lapsed, in epoch milliseconds.
  int64 lapsed_at_ms = 1;
}

// No keep-alive went out, and not by the shim's judgment. THE ARM IS WHY.
message SendKeepaliveError {
  oneof kind {
    // No session is open on this shim, so there is no cache to keep.
    SendKeepaliveNoSession no_session = 1;
    // The keep-alive was judged sendable and its submission failed.
    SendKeepaliveSubmitFailed submit_failed = 2;
  }
}

// No session is open on this shim, or its vendor query has ended, so nothing
// can carry a keep-alive. DELIBERATELY EMPTY: the arm is the reason.
message SendKeepaliveNoSession {}

// The keep-alive's submission to the vendor failed. The shim also raises its
// standing keep-alive fault (conversation.v1.SessionFault.keepalive_failed) on
// the session stream, exactly as a failed scheduled beat does.
message SendKeepaliveSubmitFailed {
  // The submission's own failure, verbatim.
  string detail = 1;
}
