// endpoint_kill_turn.proto — KillTurn: END the turn — the main agent AND
// everything this turn spawned, transitively — and nothing else. Refuses
// while any spawned work is live unless forced. Distinct from
// UpdateAgent.stop, which interrupts one agent alone and leaves what it
// spawned running.

syntax = "proto3";

package shim.v1;

import "conversation/v1/turn.proto";

option go_package = "agentrepl/proto/shim/v1;shimv1";

// Which turn, and whether its spawned work may die with it.
message KillTurnRequest {
  // WHICH turn. Not the open one: refused.
  conversation.v1.TurnId turn = 1;
  // When true, the main agent is interrupted and everything this turn
  // spawned — transitively — is stopped, each stream concluding with its
  // `interrupted` arm first. When false, live spawned work is a refusal;
  // with nothing spawned live, the main agent is simply interrupted.
  bool force = 2;
}

// THE ARM IS THE OUTCOME.
message KillTurnResponse {
  oneof result {
    KillTurnSuccess success = 1;
    KillTurnFailure failure = 2;
  }
}

// Ended. The turn's stream concludes with `interrupted`.
message KillTurnSuccess {
  // How it ended, and what died if it was forced.
  conversation.v1.TurnKilled killed = 1;
}

// Not ended. THE ARM IS WHY.
message KillTurnFailure {
  oneof cause {
    // Work this turn spawned is live and force was not asked: here it is.
    conversation.v1.TurnLive live = 1;
    // The named turn is not the open one.
    KillTurnNotTheOpenTurn not_the_open_turn = 3;
    // No turn is open.
    KillTurnNoTurnOpen no_turn_open = 4;
    // No session is open on this shim.
    KillTurnNoSession no_session = 5;
  }
  // The shim's account, for a human and for logs; never switched on.
  string detail = 2;
}
message KillTurnNotTheOpenTurn {}
message KillTurnNoTurnOpen {}
message KillTurnNoSession {}
