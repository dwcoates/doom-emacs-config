// endpoint_start_turn.proto — StartTurn: SPAWN the session's turn. THE MAIN
// AGENT'S VERB ONLY — an existing agent is prompted with UpdateAgent. Unary:
// returns once the prompt is ACCEPTED, with the first page, never waiting
// for the turn; the response's `prompt.agent` is the WatchAgent address.

syntax = "proto3";

package shim.v1;

import "conversation/v1/history.proto";
import "conversation/v1/turn.proto";
import "conversation/v1/user.proto";
import "conversation/v1/prompt_origin.proto";

option go_package = "agentrepl/proto/shim/v1;shimv1";

// The prompt the daemon is handing over NOW. Nothing here is a queue entry:
// by the time this is sent the daemon has already decided no turn is in
// flight, and the shim submits it to the agent binary immediately — or, when
// the shim's own cache keep-alive is running, the moment that keep-alive ends.
// The call simply takes that much longer; nothing about the wait is stated.
message StartTurnRequest {
  // The turn's identity, MINTED BY THE DAEMON and adopted by the shim: every
  // durable record the turn produces is stamped with it, and the open turn is
  // addressed by it. The shim never mints one of its own.
  //
  // THE PROMPT'S VENDOR MESSAGE UUID IS DERIVED FROM IT: a turn id that is a
  // uuid is used as is, any other is mapped to a name-based (version 5) uuid.
  // Anyone holding the turn id can therefore find the prompt's record in the
  // vendor transcript (RollBackSession), with no mapping stored.
  //
  // A TURN ID IS STARTED ONCE. A StartTurn repeating a turn id this shim
  // already accepted starts nothing and delivers nothing again: it is answered
  // with `success` -- the prompt under this turn id, the session's agent and
  // the ORIGINAL start's origin, and the opening page this request asks for --
  // so a daemon re-driving a submission whose acceptance it lost proceeds as
  // if its first call had answered. A
  // repeat is an invariant violation the shim records at ERROR; it is never
  // `turn_already_open`, which is only ever about a DIFFERENT turn. A repeat
  // arriving while the original is still being started waits for it and is
  // answered as above if the original was accepted, and started as a first
  // StartTurn if it was refused.
  conversation.v1.TurnId turn = 1;
  // The prompt, in the one canonical form that travels client → daemon →
  // tray → here → record.
  conversation.v1.UserSaid said = 2;
  // WHO CAUSED this prompt — a human send site, a daemon-driven merge step.
  // Closed attribution copied onto the turn's durable record so a stored turn
  // can be traced to the exact situation that caused it.
  conversation.v1.PromptOrigin origin = 3;
  // Tag 4 (`page_size`) is RETIRED: a page is the store's page — ONE size for
  // the whole stack (50 entries), owned by the store and stated nowhere else.
  reserved 4;
  reserved "page_size";
  // What the opening page carries. UNSET = repaint: the newest page rides the
  // response.
  oneof opening {
    // The newest entry the caller already holds: catch-up, only entries newer
    // than this.
    conversation.v1.HistoryPointer known_through = 5;
    // No history: the opening page carries no entries. For a caller that
    // holds nothing of this agent's history and loads it only on a reader's
    // request.
    StartTurnTailOnly tail_only = 8;
  }
  // JOIN THE RUNNING TURN rather than wait for it to end: the daemon's
  // `after_tool_call` verdict (2026-09-30). When a turn of the daemon's is
  // open, the prompt is pushed into the vendor's input at once, with no
  // interrupt, and its fate is the vendor's to decide:
  //   - FOLDED: the vendor takes it into the running turn at that turn's next
  //     tool boundary. Its prompt row is written at that point with
  //     `AgentPrompt.folded_into` naming the running turn, and it opens no
  //     turn of its own: its answer is the running turn's.
  //   - NOT FOLDED: the running turn ended with no tool boundary left, so the
  //     vendor runs the prompt as its next turn. Its prompt row is written the
  //     moment the running turn closes, as this turn's first row, and the turn
  //     runs under this request's id and origin like any other.
  // The success answers the moment the prompt is pushed; its page is read
  // then, before either fate. With no turn of the daemon's open, the flag
  // changes nothing: the prompt starts its turn as any StartTurn does.
  //
  // ONE PROMPT MAY WAIT TO JOIN A TURN AT A TIME. A second, while one waits,
  // is refused `turn_already_open`; the daemon holds it instead.
  bool join_running_turn = 6;
  // WORDS FOR THE AGENT ALONE, pushed to the vendor after what was said and
  // never recorded: the prompt row carries `said` exactly, and the feed draws
  // nothing of this. The daemon sets it on a prompt that interrupted the
  // running turn, saying why the work was cut, so the agent reads the cut as
  // this prompt changing its work rather than as a rejection of it. UNSET for
  // every other prompt.
  optional string vendor_note = 7;
}

// THE ARM IS THE OUTCOME OF THE CALL — whether the prompt was ACCEPTED.
// Nothing about the turn itself returns here: the turn is WatchAgent's.
message StartTurnResponse {
  oneof result {
    StartTurnSuccess success = 1;
    StartTurnFailure failure = 2;
  }
}

// The prompt was accepted and the turn is open. The turn's frames are
// WatchAgent's; what returns here is the prompt as delivered and the OPENING
// PAGE the request's `opening` asked for.
message StartTurnSuccess {
  // The prompt as delivered: the daemon's id adopted, the recipient resolved,
  // the text as accepted. `prompt.agent` is the address for WatchAgent. The same message history replays.
  conversation.v1.AgentPrompt prompt = 1;
  // The opening page: the newest store page when `opening` was UNSET, only
  // the entries newer than `known_through` when that was set, and no entries
  // under `tail_only`. Always
  // set on success; an empty page is a page with no entries, never an
  // absent one.
  conversation.v1.HistoryPage page = 2;
}

// Not accepted. THE ARM IS WHY.
message StartTurnFailure {
  // The shim's account, for a human and for logs; never switched on.
  string detail = 1;
  oneof kind {
    // A turn of the DAEMON'S is already open, or another StartTurn is still
    // being started, under a DIFFERENT turn id (a repeat of the same id is
    // answered `success`; see StartTurnRequest.turn). Always the DAEMON's
    // fault, since it is the only queue. A turn the shim adopted
    // (PromptOrigin.VENDOR_STARTED) NEVER produces this arm (ruled
    // 2026-09-28): the shim stamps every send with a client uuid and matches
    // each vendor reply to its send by the vendor's echo of it, so a turn the
    // vendor started on its own runs BESIDE the StartTurn, whose prompt is
    // delivered rather than refused; and a StartTurn landing while the shim's
    // own network-resume turn runs waits inside the shim for it to end. The
    // shim's own cache keep-alive never produces it either -- a StartTurn that
    // arrives while a keep-alive runs waits inside the shim for the keep-alive
    // to end and then opens its turn, so no keep-alive is ever visible on this
    // wire. A `join_running_turn` start while another prompt still waits to
    // join the running turn is refused under this arm too.
    StartTurnTurnAlreadyOpen turn_already_open = 2;
    // No session is open on this shim.
    StartTurnNoSession no_session = 3;
    // The agent binary refused the prompt, or never became free to take it
    // within the shim's bound; `detail` carries the account.
    StartTurnVendorRefused vendor_refused = 4;
    // The vendor query is dead; nothing can accept a prompt until the
    // session is restarted.
    StartTurnQueryDead query_dead = 5;
  }
}
message StartTurnTurnAlreadyOpen {
  // Tag 1 and the name `keepalive` are RETIRED and must not be revived: the
  // keep-alive collision they marked no longer reaches the daemon (see the
  // `turn_already_open` arm).
  reserved 1;
  reserved "keepalive";
}
message StartTurnNoSession {}
message StartTurnVendorRefused {}
message StartTurnQueryDead {}

// Open the turn's page with no history. DELIBERATELY EMPTY: the arm's
// presence is the whole instruction.
message StartTurnTailOnly {}
