// endpoint_start_turn.proto — StartTurn: SPAWN the turn. Unary: returns once
// the prompt is ACCEPTED, never waits for the turn. The daemon persists the
// TurnId it minted and ATTACHES with WatchTurn; spawning and attaching are
// decoupled because the turn outlives the daemon.

syntax = "proto3";

package shim.v1;

import "conversation/v1/turn.proto";
import "conversation/v1/user.proto";
import "shim/v1/prompt_origin.proto";

option go_package = "agentrepl/proto/shim/v1;shimv1";

// The prompt the daemon is handing over NOW. Nothing here is a queue entry:
// by the time this is sent the daemon has already decided no turn is in
// flight, and the shim submits it to the agent binary immediately.
message StartTurnRequest {
  // The turn's identity, MINTED BY THE DAEMON and adopted by the shim: every
  // durable record the turn produces is stamped with it, and UpdateTurn
  // addresses the open turn by it. The shim never mints one of its own.
  conversation.v1.TurnId turn = 1;
  // The prompt, in the one canonical form that travels client → daemon →
  // tray → here → record.
  conversation.v1.UserSaid said = 2;
  // WHO CAUSED this prompt — a human send site, a daemon-driven merge step.
  // Closed attribution copied onto the turn's durable record so a stored turn
  // can be traced to the exact situation that caused it.
  PromptOrigin origin = 3;
}

// THE ARM IS THE OUTCOME OF THE CALL — whether the prompt was ACCEPTED.
// Nothing about the turn itself returns here: the turn is WatchTurn's.
message StartTurnResponse {
  oneof result {
    StartTurnSuccess success = 1;
    StartTurnFailure failure = 2;
  }
}

// The prompt was accepted and the turn is open. Empty: the id was the
// daemon's, and everything the turn produces is WatchTurn's.
message StartTurnSuccess {}

// Not accepted. `kind` arms are DERIVED at the wave from the shim's real
// refusal sites: a turn already open (the daemon fault), no session, the
// agent binary refusing the prompt.
message StartTurnFailure {
  // The shim's account, for a human and for logs; never switched on.
  string detail = 1;
}
