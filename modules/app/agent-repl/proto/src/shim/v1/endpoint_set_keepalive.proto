// endpoint_set_keepalive.proto — SetKeepalive: hold the session's keep-alive
// cadence, or let it run again. SESSION section.
//
// A HIDDEN WORKSPACE'S CACHE IS LEFT TO LAPSE, NOT STOOD DOWN AT ONCE
// (owner request, 2026-10-13). When the user hides a workspace the daemon
// HOLDS its keep-alives: the shim sends no further keep-alive, so the prompt
// cache lapses on its own clock, and the user still has until that moment to
// show the workspace again with its cache warm. While held, the shim states
// the projected lapse on the session stream (conversation.v1.SessionCacheLapse)
// so the daemon can count it down and stand the session down when it comes.
// Showing the workspace again RUNS the cadence, which schedules from the
// conversation's last request exactly as a session start does.
//
// A session can also be BORN held: StartSessionRequest.hold_keepalive, so a
// hidden workspace's session started by anything (a rollout's restart, a
// prompt) never sends a keep-alive between its start and a later hold.
//
// A CLOSED WORKSPACE GETS ONE MORE ROUND, THEN THE COLD GATE (owner request,
// 2026-10-17). Closing a workspace leaves its session up, but it no longer
// keeps the cache warm forever: the daemon asks for the LAST ROUND, so the
// cadence sends the one beat it already had scheduled and then holds exactly
// as a hidden workspace's does, stating the projected lapse. The daemon
// stands the session down when that lapse comes, so reopening the workspace
// afterwards meets the cold gate like any other lapsed conversation.

syntax = "proto3";

package shim.v1;

option go_package = "agentrepl/proto/shim/v1;shimv1";

message SetKeepaliveRequest {
  // THE ARM IS THE CADENCE ASKED FOR. Unset is a malformed request (Connect
  // InvalidArgument). Asking for the cadence the session already has is not
  // refused, and restates the standing lapse when it is a hold.
  oneof cadence {
    SetKeepaliveHold hold = 1;
    SetKeepaliveRun run = 2;
    SetKeepaliveLastRound last_round = 3;
  }
}

// Send no keep-alive from now on; state the projected lapse instead.
// DELIBERATELY EMPTY: the arm is the request.
message SetKeepaliveHold {}

// Keep the cache warm again, scheduling from the last request. DELIBERATELY
// EMPTY: the arm is the request.
message SetKeepaliveRun {}

// Send the ONE beat the cadence has scheduled from the last request, then hold
// as SetKeepaliveHold does, stating the projected lapse. A cache no beat can
// keep warm any more (lapsed, or bought at a tier no longer than the
// interval) is held at once. A round already spent is never granted again:
// asking for it once more leaves the cadence held, so only a run restarts the
// keep-alives. DELIBERATELY EMPTY: the arm is the request.
message SetKeepaliveLastRound {}

// THE ARM IS THE OUTCOME.
message SetKeepaliveResponse {
  oneof result {
    SetKeepaliveSuccess success = 1;
    SetKeepaliveError error = 2;
  }
}

// The cadence is as asked. A hold's projected lapse follows on the session
// stream.
message SetKeepaliveSuccess {}

// Not applied. THE ARM IS WHY.
message SetKeepaliveError {
  oneof kind {
    // No session is open on this shim, so there is no cadence to set.
    SetKeepaliveNoSession no_session = 1;
  }
}

// No session is open on this shim.
message SetKeepaliveNoSession {}
